<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Fraunces:opsz,wght@9..144,300&display=swap">
  <style>
    :root{
      --td-paper:#FBF9F4; --td-text:#111A2B; --td-text2:#58606E;
      --td-dusk:#6E67AF;
      --settle:cubic-bezier(0.16,1,0.3,1);
      --ui:'Inter','Source Han Sans SC','PingFang SC',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--ui);-webkit-font-smoothing:antialiased}
    a{color:var(--td-text);text-decoration:underline}
    a:hover{color:var(--td-text)}
    .screen{width:390px;height:844px;background:var(--td-paper);
      display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden}
    .lockup{display:flex;flex-direction:column;align-items:center;gap:20px}
    .wave{width:176px;height:57px;overflow:visible}
    .wave path{
      stroke-dasharray:820;stroke-dashoffset:820;
      animation:draw 1.5s var(--settle) forwards;
    }
    .wave circle{
      opacity:0;
      animation:appear .4s var(--settle) forwards 1.3s,
                breathe 2.4s ease-in-out infinite 1.7s;
    }
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes appear{to{opacity:1}}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
    .word{display:flex;flex-direction:column;align-items:center;gap:6px;
      opacity:0;transform:translateY(6px);
      animation:rise .6s var(--settle) forwards 1.5s}
    @keyframes rise{to{opacity:1;transform:translateY(0)}}
    .wordmark{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:22px;
      letter-spacing:.2em;line-height:1;color:var(--td-text)}
    .qualifier{font-size:12px;font-weight:400;letter-spacing:.12em;
      text-transform:uppercase;color:var(--td-text2)}
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important}
      .wave path{stroke-dashoffset:0}
      .wave circle{opacity:1}
      .word{opacity:1;transform:none}
    }
  </style>
</helmet>

<div class="screen">
  <div class="lockup">
    <svg class="wave" viewBox="0 0 340 110" fill="none" aria-hidden="true">
      <path d="M20 55 C30 15, 40 95, 50 55 C59 22, 68 88, 77 55 C85 30, 93 80, 101 55 C109 38, 117 72, 125 55 C133 44, 141 66, 149 55 C160 50, 171 60, 182 55 C215 55, 260 55, 305 55" stroke="#111A2B" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="305" cy="55" r="5" fill="#6E67AF"/>
    </svg>
    <div class="word">
      <span class="wordmark">tacet</span>
      <span class="qualifier">store</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
