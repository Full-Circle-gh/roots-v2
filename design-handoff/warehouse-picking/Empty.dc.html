<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    :root{
      --paper:#FBF9F4; --ink:#111A2B; --graphite:#58606E; --dusk:#6E67AF; --sage:#A3B49F;
      --surface:#FFFFFF; --raised:#F6F3EC; --line:#E4E0D5; --dusk-ink:#524C8F;
    }
    body{margin:0;font-family:'Inter','Noto Sans SC','PingFang SC',system-ui,sans-serif;
         font-size:15px;line-height:1.6;color:var(--ink);-webkit-font-smoothing:antialiased;}
    *{box-sizing:border-box;}
    a{color:var(--dusk-ink);} a:hover{color:var(--dusk);}
    .num{font-variant-numeric:tabular-nums;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column">

  <div style="height:44px;flex:none"></div>

  <div style="padding:8px 16px 12px;flex:none">
    <div style="font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.25">Pick list</div>
  </div>

  <!-- No mark, and nothing put in its place. A compliment, not an apology, and
       not a decorated one: the two lines and the card below carry the state. -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px 80px;text-align:center">
    <div style="font-size:20px;font-weight:600;letter-spacing:-0.02em;line-height:1.35">Nothing to pick</div>
    <div style="font-size:15px;color:var(--graphite);margin-top:6px;line-height:1.5">Every store has what it asked for.</div>
  </div>

  <!-- The one thing a picker actually wants to know when the list is empty:
       whether the run already went. Stated, not hidden behind a tab. -->
  <div style="flex:none;padding:16px 16px 28px">
    <div style="background:var(--raised);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58606E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 7h11v8H3z"/><path d="M14 10h4l3 3v2h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      <div style="min-width:0">
        <div style="font-size:15px;font-weight:600;line-height:1.35">Last run dispatched 09:12</div>
        <div class="num" style="font-size:13px;color:var(--graphite)">260 units · Tianhe, Yuexiu</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
