<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    :root{
      --paper:#FBF9F4; --ink:#111A2B; --graphite:#58606E; --sage:#A3B49F;
      --surface:#FFFFFF; --raised:#F6F3EC; --line:#E4E0D5; --dusk-ink:#524C8F;
    }
    body{margin:0;font-family:'Inter','Noto Sans SC','PingFang SC',system-ui,sans-serif;
         font-size:15px;line-height:1.6;color:var(--ink);-webkit-font-smoothing:antialiased;}
    *{box-sizing:border-box;}
    a{color:var(--dusk-ink);} a:hover{color:var(--dusk-ink);}
    .num{font-variant-numeric:tabular-nums;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column">

  <div style="height:44px;flex:none"></div>

  <div style="padding:8px 16px 12px;flex:none">
    <div style="font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.25">Receiving</div>
  </div>

  <!-- No mark, no illustration, nothing standing in for one. A compliment,
       not an apology, and not a decorated one. -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px 80px;text-align:center">
    <div style="font-size:20px;font-weight:600;letter-spacing:-0.02em;line-height:1.35">Nothing to receive</div>
    <div style="font-size:15px;color:var(--graphite);margin-top:6px;line-height:1.5">Nothing is on its way right now.</div>
  </div>

  <!-- The one thing she actually wants when the screen is empty: whether the
       last box was dealt with, and whether anything was left hanging on it. -->
  <div style="flex:none;padding:16px 16px 28px">
    <div style="background:var(--raised);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58606E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 7h18v12H3z"/><path d="M3 11h18"/></svg>
      <div style="min-width:0">
        <div style="font-size:15px;font-weight:600;line-height:1.35">Last received 14:52 today</div>
        <div class="num" style="font-size:13px;color:var(--graphite)">116 of 126 asked · 3 lines differed</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
