<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    :root{
      --paper:#FBF9F4; --ink:#111A2B; --graphite:#58606E; --sage:#A3B49F;
      --surface:#FFFFFF; --raised:#F6F3EC; --line:#E4E0D5; --dusk-ink:#524C8F;
    }
    body{margin:0;font-family:'Inter','Noto Sans SC','PingFang SC',system-ui,sans-serif;
         font-size:15px;line-height:1.6;color:var(--ink);-webkit-font-smoothing:antialiased;}
    *{box-sizing:border-box;}
    a{color:var(--dusk-ink);} a:hover{color:var(--dusk-ink);}
    .num{font-variant-numeric:tabular-nums;}
    .row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--raised);
         box-shadow:inset 4px 0 0 var(--sage);}
    .qty{width:62px;flex:none;text-align:right;font-size:34px;font-weight:700;line-height:1.05;
         letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
    .nm{font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-0.01em;color:var(--graphite);}
    .cap{font-size:13px;color:var(--graphite);font-variant-numeric:tabular-nums;margin-top:1px;}
    .hr{height:1px;background:var(--line);}
  </style>
</helmet>

<div style="width:390px;height:844px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column">

  <div style="height:44px;flex:none"></div>

  <div style="padding:8px 16px 14px;flex:none">
    <div style="font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.25">Received</div>
    <div class="num" style="font-size:13px;color:var(--graphite);margin-top:2px">RS-260902-004 · 14:52 today</div>
  </div>

  <div style="padding:0 16px 12px;flex:none">
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span class="num" style="font-size:38px;font-weight:700;line-height:1;letter-spacing:-0.02em;color:var(--graphite)">116</span>
        <span style="font-size:15px;color:var(--graphite)">units added to this shop</span>
      </div>
      <div class="num" style="font-size:13px;color:var(--graphite);margin-top:6px">14 lines · 118 were sent</div>
    </div>
  </div>

  <!-- The two lines that differed, still holding Ink after everything else has
       gone quiet. She is not asked to explain them, resolve them, or agree to
       anything — they are recorded, and the sentence says who can see them. -->
  <div style="padding:0 16px 8px;flex:none">
    <div style="font-size:13px;font-weight:500;letter-spacing:0.04em;color:var(--graphite)">What differed</div>
  </div>

  <div style="flex:none">
    <div class="hr"></div>
    <div class="row">
      <div class="qty">12</div>
      <div style="flex:1;min-width:0">
        <div class="nm">Chilli oil 250ml</div>
        <div class="cap"><span style="color:var(--ink);font-weight:600">2 short</span> · 14 sent</div>
      </div>
    </div>
    <div class="hr"></div>
    <div class="row">
      <div class="qty">32</div>
      <div style="flex:1;min-width:0">
        <div class="nm">Sesame paste 400g</div>
        <div class="cap"><span style="color:var(--ink);font-weight:600">2 over</span> · 30 sent</div>
      </div>
    </div>
    <div class="hr"></div>
  </div>

  <div style="padding:14px 16px 0;flex:none">
    <div style="font-size:13px;color:var(--graphite);line-height:1.45">
      Both are recorded against this delivery and the warehouse can see them. Nothing else is needed from you.
    </div>
  </div>

  <div style="flex:1"></div>

  <div style="flex:none;padding:16px 16px 24px">
    <div style="height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500">
      Back to stock
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
