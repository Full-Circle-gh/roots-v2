<div class="screen">
  <div class="behind">
    <h1>Customers</h1>
  </div>
  <div class="scrim"></div>

  <div class="sheet">
    <div class="head">
      <div class="grabber"></div>
      <div class="headrow">
        <span class="avatar">D</span>
        <span class="name">Dani</span>
        <span class="pill">Seed</span>
        <span class="spacer"></span>
        <button class="iconbtn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="phone">13121915665</div>
      <div class="acts">
        <button class="btn2">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>
          <span>Points</span>
        </button>
        <button class="btn2">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
          <span>Wallet</span>
        </button>
        <button class="btn2">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 8h10"/><path d="M7 12h6"/></svg>
          <span>Message</span>
        </button>
        <button class="btn2">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
          <span>Edit</span>
        </button>
      </div>
    </div>

    <div class="body">

      <div class="sect" style="margin-top:0">
        <div class="eyebrow" style="margin-bottom:8px">Referrals</div>
        <div class="list">
          <div class="lrow">
            <span class="l">Their code</span>
            <span style="display:flex;align-items:center;gap:14px">
              <span class="r">AB12CD</span>
              <button class="rowact">Reissue</button>
            </span>
          </div>
          <div class="sep"></div>
          <div class="lrow">
            <span class="l">Referring</span>
            <span style="display:flex;align-items:center;gap:14px">
              <span class="r">Active</span>
              <button class="rowact brick">Stop</button>
            </span>
          </div>
          <div class="sep"></div>
          <div class="lrow">
            <span class="l">Ongoing share</span>
            <span style="display:flex;align-items:center;gap:14px">
              <span class="r">Not earning</span>
              <button class="rowact">Allow</button>
            </span>
          </div>
          <div class="sep"></div>
          <div class="lrow">
            <span class="l">Chosen</span>
            <span class="r">1 Jul</span>
          </div>
        </div>
      </div>

      <div class="sect">
        <div class="eyebrow" style="margin-bottom:8px">Account</div>
        <div class="list">
          <div class="lrow"><span class="l">Last order</span><span class="r">2:59 AM</span></div>
          <div class="sep"></div>
          <div class="lrow"><span class="l">Last signed in</span><span class="r">2:33 AM</span></div>
          <div class="sep"></div>
          <div class="lrow">
            <span class="l">Signed in on</span>
            <span style="display:flex;align-items:center;gap:14px">
              <span class="r">2 devices</span>
              <button class="rowact">Sign out</button>
            </span>
          </div>
        </div>
      </div>

      <div class="sect">
        <div class="eyebrow" style="margin-bottom:8px">Last 12 months</div>
        <div class="chart">
          <span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span>
          <span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span>
          <span><i></i></span><span><i></i></span><span><i></i></span>
          <span><i class="on" style="height:100%"></i></span>
        </div>
        <div class="axis"><span>10/25</span><span>9/26</span></div>
        <div class="caption">Busiest: 2026-09 · 2 orders</div>
      </div>

      <div class="diag">No app errors in 7 days</div>

      <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border-default)">
        <button class="danger">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>
          Block this customer
        </button>
      </div>

    </div>
  </div>
</div>
