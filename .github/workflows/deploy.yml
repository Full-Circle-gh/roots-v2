name: Deploy to production

# Auto-deploy to the live roots-v2 server on every push to main, mirroring the
# local post-commit hook (scripts/deploy-changed.sh -> deploy-apply.sh): ship the
# changed deployable files into the server's __stage__/ and run the existing safe
# installer (syntax-gate -> backup -> pm2 restart -> health probe with
# auto-rollback). This lets a push to main from anywhere — including mobile —
# reach the live site without a developer machine in the loop.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     the server IP/host (e.g. 47.239.89.63)
#   DEPLOY_SSH_KEY  a passphrase-less private key authorized as root on the host
#
# A "[skip deploy]" / "[no deploy]" token in the head commit message bypasses,
# matching deploy-changed.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Ship ALL deployable files, not just the changed ones"
        type: boolean
        default: false

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancelling it mid-restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for accurate diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Honour skip-deploy token
        id: gate
        run: |
          # Read the SUBJECT line only (not the body) so prose that merely
          # mentions the token — like this workflow's own docs — never trips it.
          MSG="$(git log -1 --pretty=%s)"
          case "$MSG" in
            *"[skip deploy]"*|*"[no deploy]"*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skip token in commit message — not deploying." ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure SSH
        if: steps.gate.outputs.skip == 'false'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User root
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Compute deployable files
        if: steps.gate.outputs.skip == 'false'
        id: files
        run: |
          set -euo pipefail
          # Same allowlist the local deploy uses — only paths the Node app serves.
          deployable() {
            case "$1" in
              public/*|routes/*|lib/*|middleware/*|scripts/*) return 0 ;;
              server.js|database.js|schema.sql) return 0 ;;
              package.json|package-lock.json) return 0 ;;
              *) return 1 ;;
            esac
          }
          # Reduce a raw file list to the deployable, still-present subset.
          # Used twice: once for what we ship, once for what the OLD base would
          # have shipped, so the two can be compared in the log.
          filter() {   # $1 = raw list in, $2 = filtered list out
            : > "$2"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              deployable "$f" || continue
              [ -f "$f" ] || continue   # skip deletions — the installer only adds files
              echo "$f" >> "$2"
            done < "$1"
          }

          : > /tmp/changed.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_sync }}" = "true" ]; then
            MODE=full
            BASE_SRC="every tracked file (full_sync)"
            git ls-files > /tmp/changed.txt
          else
            MODE=changed

            # STAGE 2 of the diff-base fix: READ the record Stage 1 writes.
            #
            # The base is what production ACTUALLY HOLDS, not what main held
            # before this push. Those differ the moment a deploy fails: the old
            # base excluded everything the failed run carried, so those files
            # were skipped permanently while later deploys reported SUCCESS. A
            # replay of the first 904 runs found 197 such episodes across 141
            # files, the longest 43 days.
            #
            # Every rung of the ladder below errs toward shipping MORE. A base
            # that is too old over-ships, which is slow but correct. A base that
            # is too new skips files silently, which is the bug. So the record
            # is never trusted enough to NARROW the set beyond what it can prove.
            BASE=""
            BASE_SRC=""
            REC="$(ssh prod "cat /root/roots-v2/.deploy-state/last-success-sha 2>/dev/null" 2>/dev/null | tr -d '[:space:]' || true)"

            if [ -z "$REC" ]; then
              echo "::warning::No deploy record on the server — falling back to the previous-push base, which is the pre-fix behaviour. Expected only on the first deploy after Stage 1, or if the box was rebuilt."
            elif ! printf '%s' "$REC" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::warning::Deploy record is not a 40-hex sha (got '$REC') — treating it as absent and falling back to the previous-push base."
            elif ! git cat-file -e "${REC}^{commit}" 2>/dev/null; then
              echo "::warning::Deploy record $REC is not a commit in this repository — treating it as absent and falling back to the previous-push base."
            elif git merge-base --is-ancestor "$REC" "${{ github.sha }}" 2>/dev/null; then
              BASE="$REC"
              BASE_SRC="server deploy record ($REC)"
            else
              # The record names a real commit that is not behind HEAD — history
              # was rewritten, or the box holds a commit from another line. Their
              # merge-base is the newest commit BOTH are known to contain, so
              # diffing from it can only ship a superset of what is needed.
              MB="$(git merge-base "$REC" "${{ github.sha }}" 2>/dev/null || true)"
              if [ -n "$MB" ]; then
                BASE="$MB"
                BASE_SRC="merge-base $MB of HEAD and the deploy record $REC (histories diverged)"
                echo "::warning::Deploy record $REC is not an ancestor of ${{ github.sha }} — using merge-base $MB, which ships a superset."
              else
                echo "::warning::No merge-base between the deploy record $REC and ${{ github.sha }} — falling back to the previous-push base."
              fi
            fi

            # Unchanged fallback ladder, now the SECOND rung rather than the first.
            if [ -z "$BASE" ]; then
              BASE="${{ github.event.before }}"
              BASE_SRC="previous push (github.event.before)"
              # First push / unknown base / force-push: fall back to HEAD~1, then to
              # a full file list so we never silently ship nothing on a real change.
              if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
                BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
                BASE_SRC="HEAD~1"
              fi
            fi

            if [ -n "$BASE" ]; then
              git diff --name-only "$BASE" "${{ github.sha }}" > /tmp/changed.txt
            else
              BASE_SRC="every tracked file (no usable base)"
              git ls-files > /tmp/changed.txt
            fi
          fi

          filter /tmp/changed.txt /tmp/files.txt
          COUNT=$(wc -l < /tmp/files.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE — base: $BASE_SRC"
          echo "$COUNT deployable file(s):"
          cat /tmp/files.txt || true

          # Transitional visibility. Print what the OLD previous-push base would
          # have shipped, so the difference this fix makes is legible in the log
          # rather than inferred. Anything listed here is a file the pipeline
          # would have skipped — silently, while reporting SUCCESS. Once the
          # record has been trusted for a while this block can go.
          OLD="${{ github.event.before }}"
          if [ "$MODE" = "changed" ] && [ -n "$OLD" ] && git cat-file -e "${OLD}^{commit}" 2>/dev/null; then
            git diff --name-only "$OLD" "${{ github.sha }}" > /tmp/old-changed.txt
            filter /tmp/old-changed.txt /tmp/old-files.txt
            RESCUED="$(comm -23 <(sort -u /tmp/files.txt) <(sort -u /tmp/old-files.txt) || true)"
            if [ -n "$RESCUED" ]; then
              echo "Files the previous-push base would have SKIPPED, and this base ships:"
              printf '%s\n' "$RESCUED" | sed 's/^/  + /'
            else
              echo "(same set the previous-push base would have shipped)"
            fi
          fi

      - name: Set up Node for lint
        if: steps.gate.outputs.skip == 'false' && steps.files.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Lint changed .js — bug-catcher gate (blocks deploy on a real bug)
        if: steps.gate.outputs.skip == 'false' && steps.files.outputs.count != '0'
        run: |
          set -euo pipefail
          JS=$(grep -E '\.js$' /tmp/files.txt || true)
          if [ -z "$JS" ]; then echo "No .js in this change — nothing to lint."; exit 0; fi
          # --ignore-scripts skips the native better-sqlite3 / sharp / bcrypt
          # builds eslint doesn't need, so this stays fast. eslint.config.js is a
          # bug-catcher: only near-certain defects are errors (undefined refs,
          # dead code, dup keys) and abort here, before anything reaches the
          # server; style / unused-var smells are warnings and don't block.
          echo "Installing lint tooling…"
          npm ci --ignore-scripts --no-audit --no-fund
          echo "Linting:"; printf '%s\n' "$JS"
          printf '%s\n' "$JS" | xargs node_modules/.bin/eslint

      - name: Does this change touch fulfilment logic?
        id: ftcheck
        if: steps.gate.outputs.skip == 'false' && steps.files.outputs.count != '0'
        run: |
          set -euo pipefail
          # Mirrors the lint gate's read of /tmp/files.txt. These are the files
          # scripts/verify-fulfilment-types.js has assertions about; a change to
          # any of them must re-prove the delivery/pickup/counter table before it
          # ships. Gated rather than always-on so a native install doesn't sit in
          # the path of every unrelated deploy.
          #
          # 04-orders.js is here because the test EXTRACTS its predicates from the
          # shipped source and evaluates them. A gate that doesn't cover a file its
          # assertions read is not covering the test.
          if grep -qE '^(lib/fulfilment\.js|lib/feie\.js|routes/retail\.js|scripts/verify-fulfilment-types\.js|public/retail-admin/04-orders\.js)$' /tmp/files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Fulfilment logic touched — the test gate will run."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No fulfilment-logic files in this change — gate skipped."
          fi

      - name: Set up Node 20 for the fulfilment test
        if: steps.ftcheck.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fulfilment types — delivery / pickup / counter must differ exactly as documented
        if: steps.ftcheck.outputs.run == 'true'
        run: |
          set -euo pipefail
          # Node 20, NOT the 24 the lint step above uses. better-sqlite3 9.6.0
          # publishes a linux-x64 prebuild for ABI 115 (Node 20) but none for ABI
          # 137 (Node 24), so 24 compiles from source: measured at 77s against
          # 1.6s for the prebuild, on 4 cores. Node 20 is also what production
          # runs, so the test runs on the ABI the code actually ships to.
          #
          # The lint step above may already have run `npm ci --ignore-scripts`,
          # which leaves an UNBUILT better-sqlite3 in the workspace. That copy has
          # to be REMOVED, not worked around: NODE_PATH is a fallback, not an
          # override, so Node walks up from the script's own directory, finds the
          # unbuilt package and never consults NODE_PATH. An earlier version of
          # this step installed to /tmp and pointed NODE_PATH at it, and failed
          # with missing bindings for exactly that reason.
          #
          # Removing it first also stops `npm install` treating the requirement as
          # already satisfied and skipping the prebuild fetch.
          rm -rf node_modules/better-sqlite3
          npm install better-sqlite3@9.6.0 --no-save --no-audit --no-fund
          # Preflight: prove the binding loads before blaming the assertions. A
          # missing binding is an install problem and should say so.
          node -e "const D=require('better-sqlite3'); new D(':memory:').exec('create table t(a)'); console.log('better-sqlite3 binding OK on', process.version);"
          node scripts/verify-fulfilment-types.js

      - name: Verify connectivity (nothing to ship)
        if: steps.gate.outputs.skip == 'false' && steps.files.outputs.count == '0'
        run: |
          ssh prod "echo connected to \$(hostname); pm2 describe roots-v2 >/dev/null 2>&1 && echo 'roots-v2 online' || echo 'WARN: roots-v2 not found in pm2'"
          echo "No deployable files in this change — nothing to ship."

      - name: Ship changed files + run safe installer
        if: steps.gate.outputs.skip == 'false' && steps.files.outputs.count != '0'
        run: |
          set -euo pipefail
          APP=/root/roots-v2
          STAGE="$APP/__stage__"
          ssh prod "rm -rf '$STAGE' && mkdir -p '$STAGE'"
          # Recreate the directory tree for any nested files. Grep the files
          # that HAVE a slash first, THEN strip to their dir — doing it the
          # other way (sed then grep '/') drops single-level dirs like
          # public/ and routes/, so scp of nested files fails on a fresh stage.
          DIRS=$(grep '/' /tmp/files.txt | sed 's@/[^/]*$@@' | sort -u || true)
          for d in $DIRS; do ssh prod "mkdir -p '$STAGE/$d'"; done
          # Upload each file to its matching relative path under __stage__.
          while IFS= read -r f; do
            scp -q "$f" "prod:$STAGE/$f"
          done < /tmp/files.txt
          # Hand off to the server's installer: syntax-check, backup, install,
          # pm2 restart, health probe, auto-rollback. RESULT= line is the verdict.
          ssh prod "cp '$APP/scripts/deploy-apply.sh' /tmp/roots-v2-apply.sh && bash /tmp/roots-v2-apply.sh" | tee /tmp/apply.log || true
          if grep -q 'RESULT=ROLLED_BACK' /tmp/apply.log; then
            echo "::error::Deploy auto-rolled-back — the app did not come up healthy. Live site is unchanged. See installer output above."
            exit 1
          fi
          if ! grep -q 'RESULT=SUCCESS' /tmp/apply.log; then
            echo "::error::Installer did not report SUCCESS — see output above."
            exit 1
          fi
          echo "Deployed successfully."

      # ──────────────────────────────────────────────────────────────────────
      # STAGE 1 of the diff-base fix: WRITE the record. Nothing reads it yet.
      #
      # The step above computes what to ship as a diff against the PREVIOUS PUSH
      # (github.event.before), not against what production actually holds. So a
      # run that fails before its ship step never ships its files, and the next
      # push diffs against that failed commit and skips them too — permanently,
      # while every later deploy reports SUCCESS. A replay of this repo's first
      # 904 deploy runs found 197 such stranding episodes across 141 files; the
      # longest ran 43 days, and they were cleared only by an unrelated
      # full_sync on 2026-08-04.
      #
      # Fixing that needs a record of the last commit production genuinely has.
      # It lives ON THE BOX, beside the artifact it describes, because a record
      # kept in the repository or in Actions cache would describe what CI
      # INTENDED — and CI's intent is exactly what has been wrong all along.
      #
      # THIS STEP IS THE ONLY WRITER, and it runs only after the installer
      # printed RESULT=SUCCESS. That single property is what makes the record
      # trustworthy: there is no path where the recorded sha advances without
      # the files having been installed. A failed run never reaches here, so the
      # record still names the last commit that actually landed.
      #
      # Deliberately NOT written when there was nothing deployable to ship: if a
      # push changed no deployable file, the older record is still an accurate
      # description of the box, and adding a second writer would add a second
      # way for the record to move without files moving.
      #
      # A failure to write is a warning, never an error. A record that lags
      # reality makes the next deploy ship MORE than it needs to; only a record
      # that runs AHEAD of reality could skip files, and nothing here can
      # produce one.
      - name: Record the commit production now holds
        if: steps.gate.outputs.skip == 'false' && steps.files.outputs.count != '0'
        run: |
          set -euo pipefail
          STATE=/root/roots-v2/.deploy-state
          SHA='${{ github.sha }}'
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ssh prod "mkdir -p '$STATE' \
                && printf '%s\n' '$SHA' > '$STATE/last-success-sha' \
                && printf '%s %s run=%s files=%s\n' '$STAMP' '$SHA' '${{ github.run_id }}' '${{ steps.files.outputs.count }}' >> '$STATE/history.log'"; then
            echo "Recorded last-success-sha = $SHA"
          else
            echo "::warning::Could not record last-success-sha on the server. Nothing reads it yet, so this run is unaffected; once the read lands, a missing or stale record makes the next deploy ship a WIDER set, never a narrower one."
          fi
