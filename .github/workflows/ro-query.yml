name: Read-only prod query

# Runs ONE committed, reviewable read-only diagnostic against the live server
# and prints its output to the Actions log. It ships nothing, restarts nothing,
# and touches no pm2 process — it copies the named script into /tmp on the box,
# runs it with node, and deletes it.
#
# It exists because verification work needs to read the live SQLite database
# from an environment that has no direct SSH to the host, and the deploy key is
# a repository secret rather than something a developer machine has to hold.
# The script it runs opens SQLite with `readonly: true` and PROVES that on the
# connection by attempting a write and aborting if the write is accepted.
#
# Manual dispatch only. Same DEPLOY_HOST / DEPLOY_SSH_KEY secrets as deploy.yml.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Path (repo-relative) of the read-only diagnostic to run"
        required: true
        default: scripts/diagnose_money_unit_split.js

concurrency:
  group: ro-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refuse anything outside the diagnostic set
        run: |
          set -euo pipefail
          S='${{ inputs.script }}'
          case "$S" in
            scripts/diagnose_*.js) ;;
            *) echo "::error::Only scripts/diagnose_*.js may be run here (got '$S')."; exit 1 ;;
          esac
          [ -f "$S" ] || { echo "::error::$S is not in this checkout."; exit 1; }
          echo "Will run $S"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User root
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Run it
        run: |
          set -euo pipefail
          S='${{ inputs.script }}'
          STAGE="/tmp/ro-query-$GITHUB_RUN_ID"
          REMOTE="$STAGE/$(basename "$S")"

          # The diagnostic runs against the LIVE database but against THIS
          # CHECKOUT's lib/, not the deployed one. That ordering is deliberate: a
          # comparison that can only run after the code ships cannot gate the
          # ship. So lib/ is staged in a scratch directory beside the script, and
          # the app's node_modules is symlinked in rather than copied.
          #
          # data/ is NOT staged — the diagnostics open the live database by
          # absolute path and prove read-only on the connection themselves. The
          # stub database.js exists only so that a `require('../database')` in a
          # staged module resolves to a real path; every diagnostic replaces it in
          # the module cache and none of them execute it.
          ssh prod "rm -rf '$STAGE' && mkdir -p '$STAGE'"
          scp -q "$S" "prod:$REMOTE"
          # lib/, routes/ and middleware/ are the runtime source tree a diagnostic
          # may need to load. ~3.6MB, and it is deleted again below.
          for d in lib routes middleware; do
            [ -d "$d" ] && scp -qr "$d" "prod:$STAGE/$d"
          done
          ssh prod "ln -s /root/roots-v2/node_modules '$STAGE/node_modules' && \
                    printf 'module.exports = {};\n' > '$STAGE/database.js'"

          set +e
          ssh prod "ROOTS_HOME='$STAGE' ROOTS_DB=/root/roots-v2/data/roots.db node '$REMOTE'"; RC=$?
          set -e
          ssh prod "rm -rf '$STAGE'"
          echo "exit=$RC"
          exit $RC
