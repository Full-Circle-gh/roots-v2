<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2E7DF">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Storefront</title>
<style>
  /* ── Brand fonts (served from /assets/fonts, shared with the mini-app) ── */
  @font-face { font-family:'Bear Serif'; src:url('/assets/fonts/LilitaOne.ttf') format('truetype'); unicode-range:U+0024,U+0025,U+0030-0039,U+00A5; font-display:swap; }
  @font-face { font-family:'Bear Serif'; src:url('/assets/fonts/BearSerif.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'Toni Grotesk'; src:url('/assets/fonts/ToniGroteskPro.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'League Gothic'; src:url('/assets/fonts/LeagueGothic.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW5.ttf') format('truetype'); font-weight:500; font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW7.ttf') format('truetype'); font-weight:700; font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW9.ttf') format('truetype'); font-weight:900; font-display:swap; }
  @font-face { font-family:'Aleo'; src:url('/assets/fonts/Aleo-Regular.otf') format('opentype'); font-display:swap; }

  :root{
    --oat:#F2E7DF; --ink:#1a1a17; --forest:#365329; --olive:#6A6E2D; --lime:#CCD900;
    --berry:#E96174; --carrot:#FF6B0C; --papaya:#FFAF60; --corn:#F2CA6C;
    --sky:#B2CFED; --pea:#7BBD3B; --lotus:#EEB8E4; --pink:#F4B8CB; --citrus:#E7E74C;
    --accent:#365329;            /* overridden from tenant config at runtime */
    --paper:#fff; --line:rgba(0,0,0,.08); --muted:#7c7c72;
    --bf-bear:'Bear Serif','DF Yuan','New York',Georgia,serif;
    --bf-toni:'Toni Grotesk','DF Yuan',-apple-system,BlinkMacSystemFont,sans-serif;
    --bf-gothic:'League Gothic','DF Yuan','Bebas Neue',Impact,sans-serif;
    --bf-yuan:'DF Yuan','PingFang SC','Hiragino Sans GB',sans-serif;
    /* Font vars the ported block engines (blocks.css / product-blocks.css) use —
       MUST match the mini-app's --f-* names exactly, incl. Aleo for body copy. */
    --f-bear:'Bear Serif','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-toni:'Toni Grotesk','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,sans-serif;
    --f-gothic:'League Gothic','DF Yuan','PingFang SC','Hiragino Sans GB','Bebas Neue',sans-serif;
    --f-aleo:'Aleo','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-yuan:'DF Yuan','PingFang SC','Hiragino Sans GB',sans-serif;
    --wrap:1180px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--bf-toni);
    background:var(--oat); color:var(--ink);
    min-height:100dvh; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    display:flex; flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;cursor:pointer;}

  /* Boot splash */
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--oat);z-index:90;transition:opacity .35s;}
  #boot.gone{opacity:0;pointer-events:none;}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── Header ── */
  header.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);}
  .bar-in{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;gap:18px;padding:13px 20px;}
  .wordmark{font-family:var(--bf-bear);font-size:24px;letter-spacing:.3px;color:var(--accent);white-space:nowrap;}
  nav.links{display:flex;gap:18px;font-size:15px;}
  nav.links a{padding:4px 0;border-bottom:2px solid transparent;color:#4a4a44;}
  nav.links a.on,nav.links a:hover{color:var(--ink);border-color:var(--accent);}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;max-width:420px;}
  .search:focus-within{border-color:var(--accent);}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:transparent;color:var(--ink);}
  .search svg{width:17px;height:17px;color:var(--muted);flex:none;}
  .bar .spacer{flex:1;}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);}
  .iconbtn svg{width:19px;height:19px;}
  .lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;}
  .lang button{border:0;background:transparent;padding:8px 13px;font-size:13px;color:var(--muted);}
  .lang button.active{background:var(--accent);color:#fff;}

  main{flex:1;width:100%;}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px;}
  .sec{padding:34px 0;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:12px;}
  .kicker{font-family:var(--bf-gothic);letter-spacing:1.5px;text-transform:uppercase;font-size:14px;color:var(--accent);}
  .ttl{font-family:var(--bf-bear);font-size:clamp(22px,3.4vw,30px);line-height:1.1;}
  .more{font-size:14px;color:var(--accent);font-weight:600;white-space:nowrap;}

  /* ── Hero ── */
  .hero{background:var(--accent);color:#fff;border-radius:22px;padding:clamp(30px,6vw,64px);margin-top:26px;position:relative;overflow:hidden;}
  .hero h1{font-family:var(--bf-bear);font-size:clamp(32px,6vw,58px);line-height:1.02;margin-bottom:14px;}
  .hero p{font-size:clamp(15px,2.4vw,19px);max-width:46ch;opacity:.92;}
  .hero .cta{display:inline-block;margin-top:22px;background:#fff;color:var(--accent);font-weight:700;padding:13px 26px;border-radius:999px;font-size:15px;}

  /* ── Product grid + cards ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.09);}
  .card .ph{position:relative;aspect-ratio:1/1;background:#f3efe9;}
  .card .ph img{width:100%;height:100%;object-fit:cover;}
  .card .ph .none{position:absolute;inset:0;display:grid;place-items:center;color:#c7c0b5;font-size:13px;}
  .card .body{padding:13px 14px 16px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .card .nm{font-size:15px;line-height:1.25;font-weight:600;}
  .card .nm .cn{display:block;font-family:var(--bf-yuan);font-size:13px;color:var(--muted);font-weight:500;margin-top:2px;}
  .card .tag{font-size:12.5px;color:var(--muted);line-height:1.35;}
  .card .prices{margin-top:auto;display:flex;align-items:baseline;gap:8px;padding-top:6px;}
  .card .now{font-family:var(--bf-bear);font-size:19px;color:var(--ink);}
  .card .was{font-size:13px;color:var(--muted);text-decoration:line-through;}
  .badge{position:absolute;top:10px;left:10px;background:var(--berry);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .pill-sold{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;}
  /* Out-of-stock tags. Strict = hard SOLD OUT (greyed card); backorder = orderable pre-order. */
  .oos-tag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;text-transform:uppercase;}
  .oos-tag.sold{background:rgba(0,0,0,.72);color:#fff;}
  .oos-tag.soon{background:var(--accent,#6d9c2a);color:#fff;}
  .card.is-oos .ph img{filter:grayscale(.55);opacity:.78;}
  .pd-oos-tag{font-size:12px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;text-transform:uppercase;}
  .pd-oos-tag.sold{background:rgba(0,0,0,.72);color:#fff;}
  .pd-oos-tag.soon{background:var(--accent,#6d9c2a);color:#fff;}
  .pd-oos-note{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--accent,#6d9c2a);}
  .opt-cue{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;align-self:flex-start;}

  /* ── Category chips ── */
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:14px;color:#4a4a44;white-space:nowrap;}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chip .n{opacity:.6;font-size:12px;margin-left:5px;}

  /* category tiles (home) */
  .cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .cattile{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--olive);color:#fff;display:flex;align-items:flex-end;padding:14px;}
  .cattile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78;}
  .cattile .lbl{position:relative;font-family:var(--bf-bear);font-size:18px;text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .cattile .lbl .n{display:block;font-family:var(--bf-toni);font-size:12px;opacity:.85;font-weight:500;}

  /* ── Toolbar (shop) ── */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar .count{font-size:14px;color:var(--muted);}
  select.sort{font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;color:var(--ink);}

  /* ── Product detail ── */
  .pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;padding:30px 0 50px;}
  .pd-gallery .main{aspect-ratio:1/1;background:#f3efe9;border-radius:20px;overflow:hidden;}
  .pd-gallery .main img{width:100%;height:100%;object-fit:cover;}
  .pd-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .pd-thumbs button{width:64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:#f3efe9;padding:0;}
  .pd-thumbs button.on{border-color:var(--accent);}
  .pd-thumbs img{width:100%;height:100%;object-fit:cover;}
  .pd h1{font-family:var(--bf-bear);font-size:clamp(26px,4vw,38px);line-height:1.06;}
  .pd .cn{font-family:var(--bf-yuan);font-size:18px;color:var(--muted);margin-top:4px;}
  .pd .tagline{font-size:16px;color:#54544c;margin-top:12px;line-height:1.5;}
  .pd .price-row{display:flex;align-items:baseline;gap:12px;margin:20px 0;}
  .pd .price-now{font-family:var(--bf-bear);font-size:34px;color:var(--ink);}
  .pd .price-was{font-size:17px;color:var(--muted);text-decoration:line-through;}
  .pd .flash-tag{background:var(--berry);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .pd .rating{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:18px;}
  .stars{color:var(--corn);letter-spacing:1px;}
  .stars .off{color:#dcd6cc;}
  .buybar{display:flex;gap:12px;margin:22px 0;}
  .btn-primary{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 30px;font-size:16px;font-weight:700;flex:1;}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:15px 20px;font-size:16px;}
  .pd-note{font-size:13px;color:var(--muted);margin-top:-8px;}
  .pd-section{border-top:1px solid var(--line);padding:22px 0;}
  .pd-section h3{font-family:var(--bf-bear);font-size:18px;margin-bottom:12px;}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .opt .q{font-weight:600;font-size:14px;margin-bottom:8px;}
  .opt .choices{display:flex;gap:8px;flex-wrap:wrap;}
  .opt .choice{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:#4a4a44;}
  .opt .choice .delta{color:var(--accent);font-weight:600;margin-left:5px;}
  .desc{font-size:15px;line-height:1.65;color:#3a3a34;}
  .desc img{border-radius:12px;margin:12px 0;}
  .desc h1,.desc h2,.desc h3{font-family:var(--bf-bear);margin:16px 0 8px;}
  .desc p{margin:10px 0;}
  .variants{display:flex;gap:10px;flex-wrap:wrap;}
  .variants a{border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;font-size:14px;background:#fff;}
  .variants a.on{border-color:var(--accent);color:var(--accent);font-weight:600;}
  .review{border-top:1px solid var(--line);padding:14px 0;}
  .review:first-child{border-top:0;}
  .review .head{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .review .who{font-weight:600;font-size:14px;}
  .review .when{font-size:12px;color:var(--muted);}
  .review .body{font-size:14px;color:#4a4a44;line-height:1.5;}

  .pd-body{max-width:760px;margin:6px auto 0;}
  .shop-product-blocks{margin-top:8px;}
  .crumb{font-size:13px;color:var(--muted);padding-top:18px;}
  .crumb a:hover{color:var(--accent);}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px;}
  .skel{background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px;aspect-ratio:.78;}
  @keyframes sk{to{background-position:-200% 0;}}

  footer{margin-top:auto;border-top:1px solid var(--line);background:#fff;}
  .foot-in{max-width:var(--wrap);margin:0 auto;padding:26px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;}
  .foot-in .fm{font-family:var(--bf-bear);color:var(--accent);font-size:18px;}

  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,24,.96);color:#f2f2ec;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:820px){
    .pd{grid-template-columns:1fr;gap:24px;}
  }
  @media(max-width:520px){
    .bar-in{flex-wrap:wrap;gap:10px 14px;}
    nav.links{order:1;gap:14px;}
    .search{order:3;max-width:none;flex-basis:100%;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  }
</style>
<link rel="stylesheet" href="/assets/shop/blocks.css">
<link rel="stylesheet" href="/assets/shop/product-blocks.css">
<script src="/assets/shop/blocks.js"></script>
<script src="/assets/shop/product-blocks.js"></script>
</head>
<body>
  <div id="boot"><div class="spin"></div></div>

  <header class="bar" hidden>
    <div class="bar-in">
      <nav class="links">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/shop" data-nav="shop">Shop</a>
      </nav>
      <form class="search" id="searchForm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" placeholder="Search products" autocomplete="off">
      </form>
      <span class="spacer"></span>
      <div class="lang" id="langToggle">
        <button data-lang="en">EN</button><button data-lang="cn">中</button>
      </div>
      <button class="acctbtn" id="acctBtn">Sign in</button>
      <button class="iconbtn" id="cartBtn" title="Cart" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge" id="cartBadge" hidden>0</span>
      </button>
    </div>
  </header>

  <main id="view" hidden></main>

  <footer hidden id="footer">
    <div class="foot-in">
      <span class="fm" id="footBrand">Store</span>
      <span id="footMeta"></span>
    </div>
  </footer>

  <!-- ── Account: header button menu + phone-OTP login modal (Phase 2) ── -->
  <style>
    .acctbtn{font:inherit;font-weight:700;font-size:13px;letter-spacing:.02em;background:transparent;
      color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;}
    .acctbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
    #acctMenu{position:absolute;top:54px;right:16px;z-index:80;background:#fff;border:1.5px solid var(--ink);
      border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.18);min-width:200px;overflow:hidden;}
    #acctMenu[hidden]{display:none;}
    #acctMenu .am-head{padding:14px 16px;border-bottom:1px solid var(--line);}
    #acctMenu .am-name{font-family:var(--bf-bear);font-size:16px;}
    #acctMenu .am-sub{font-size:12px;color:var(--muted);margin-top:2px;}
    #acctMenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
    #acctMenu button:hover{background:var(--oat);}
    #acctMenu .am-out{color:var(--berry);border-top:1px solid var(--line);}
    .lm-overlay{position:fixed;inset:0;z-index:100;background:rgba(26,26,23,.55);display:flex;align-items:center;justify-content:center;padding:20px;}
    .lm-overlay[hidden]{display:none;}
    .lm-card{position:relative;background:var(--oat);border:2.5px solid var(--ink);border-radius:22px;
      width:100%;max-width:380px;padding:34px 30px 30px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
    .lm-x{position:absolute;top:14px;right:16px;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--ink);}
    .lm-title{font-family:var(--bf-bear);font-size:26px;line-height:1.05;}
    .lm-sub{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.4;}
    .lm-step{margin-top:20px;display:flex;flex-direction:column;gap:12px;}
    .lm-step[hidden]{display:none;}
    .lm-step input{font:inherit;font-size:18px;letter-spacing:.06em;padding:14px 16px;border:1.5px solid var(--ink);
      border-radius:12px;background:#fff;color:var(--ink);width:100%;}
    .lm-step input:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .lm-btn{font:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;
      background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px;cursor:pointer;}
    .lm-btn:disabled{opacity:.5;cursor:default;}
    .lm-link{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;align-self:flex-start;padding:2px 0;}
    .lm-link:disabled{color:var(--muted);cursor:default;}
    .lm-err{margin-top:12px;font-size:13px;color:var(--berry);min-height:16px;}
  </style>

  <div id="acctMenu" hidden></div>

  <div id="loginModal" class="lm-overlay" hidden>
    <div class="lm-card">
      <button class="lm-x" id="lmClose" aria-label="Close">×</button>
      <div class="lm-title" id="lmTitle">Sign in</div>
      <div class="lm-sub" id="lmSub">Enter your phone to get a verification code.</div>
      <div class="lm-step" id="lmPhoneStep">
        <input id="otpPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Phone number" maxlength="11">
        <button class="lm-btn" id="otpSendBtn">Send code</button>
      </div>
      <div class="lm-step" id="lmCodeStep" hidden>
        <input id="otpCode" type="tel" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" maxlength="6">
        <button class="lm-btn" id="otpVerifyBtn">Verify &amp; sign in</button>
        <button class="lm-link" id="otpResend">Resend code</button>
      </div>
      <div class="lm-err" id="lmErr"></div>
    </div>
  </div>

  <!-- ── Cart drawer (Phase 3a — client-side cart) ── -->
  <style>
    #cartBtn{position:relative;}

<script>
/* ════════════════════════════════════════════════════════════════════════
   Web storefront — Phase 1a (the shoppable core).

   Tenant is resolved SERVER-SIDE from the request Host (this page sends no
   x-wx-appid), so every /api/retail/* call returns THIS tenant's catalogue.
   Pages: home, shop (grid + search + category + sort), product detail.
   Cart / checkout / accounts arrive in later phases — the "order" CTAs are
   honest stubs for now. The operator's exact CMS home blocks (Phase 1b) will
   render via a shared block engine; today the home shows a clean auto-layout.
   ════════════════════════════════════════════════════════════════════════ */
const state = { lang:'en', config:{}, brand:'Store', cats:[], productCache:new Map(), token:'', customer:null };

/* ── tiny helpers ── */
const $ = (s,r=document)=>r.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return esc(s);}
function pick(en,cn){const a=(en||'').trim(),b=(cn||'').trim();return state.lang==='cn'?(b||a):(a||b);}
function altLang(en,cn){return state.lang==='cn'?(en||'').trim():(cn||'').trim();}  /* the OTHER language line */
function money(n){return '¥'+(Number(n)||0).toFixed(2);}
function thumb(p){return p&&(p.image_url||p.image_data)||'';}
function isFlash(p){return p&&p.flash&&p.flash.state==='active';}
function nowPrice(p){return isFlash(p)?(Number(p.flash.price)||0):(Number(p.price)||0);}
function wasPrice(p){return isFlash(p)&&Number(p.price)>Number(p.flash.price)?Number(p.price):0;}
function catLabel(c){return pick(c.name,c.name_cn);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),2400);}

function authHeaders(h){h=h||{};if(state.token)h['Authorization']='Bearer '+state.token;return h;}
async function api(path){
  const r=await fetch(path,{headers:authHeaders({'Accept':'application/json'})});
  if(r.status===401) clearAuth();   // token expired/invalid → drop it silently
  if(!r.ok) throw new Error(path+' → '+r.status);
  const j=await r.json();
  return j&&('data'in j)?j.data:j;
}
// POST JSON; throws an Error whose .code is the server's error string.
async function postJson(path,body){
  const r=await fetch(path,{method:'POST',headers:authHeaders({'Accept':'application/json','Content-Type':'application/json'}),body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||('http_'+r.status));e.code=j.error;e.status=r.status;throw e;}
  return j&&('data'in j)?j.data:j;
}

/* ════════════ ACCOUNT (phone-OTP login) ════════════ */
function setAuth(token,customer){state.token=token||'';state.customer=customer||null;
  try{token?localStorage.setItem('shop_token',token):localStorage.removeItem('shop_token');}catch{}
  renderAcct();}
function clearAuth(){setAuth('',null);}
async function loadCustomer(){if(!state.token)return;
  try{state.customer=await api('/api/retail/customer');}catch(e){/* 401 already cleared */}
  renderAcct();}
function renderAcct(){
  const b=$('#acctBtn');if(!b)return;
  if(state.token&&state.customer){
    const c=state.customer;
    const nm=(c.nickname||'').trim()||(c.phone?('···'+String(c.phone).slice(-4)):(state.lang==='cn'?'我的账户':'Account'));
    b.textContent=nm;b.classList.add('on');
  }else{b.textContent=state.lang==='cn'?'登录':'Sign in';b.classList.remove('on');}
}
function acctMenuToggle(force){
  const m=$('#acctMenu');const show=force!=null?force:m.hidden;
  if(!show){m.hidden=true;return;}
  const c=state.customer||{};
  const nm=(c.nickname||'').trim()||(state.lang==='cn'?'我的账户':'My account');
  const pts=Number(c.points_balance)||0;
  m.innerHTML=
    '<div class="am-head"><div class="am-name">'+esc(nm)+'</div>'+
    '<div class="am-sub">'+(c.phone?esc(String(c.phone)):'')+(pts>0?(' · '+pts+(state.lang==='cn'?' 积分':' pts')):'')+'</div></div>'+
    '<button data-am="orders">'+(state.lang==='cn'?'我的订单':'My orders')+'</button>'+
    '<button class="am-out" data-am="out">'+(state.lang==='cn'?'退出登录':'Sign out')+'</button>';
  m.hidden=false;
}
/* login modal */
let _otpTimer=null;
function lmErr(msg){$('#lmErr').textContent=msg||'';}
function openLogin(){lmErr('');$('#lmPhoneStep').hidden=false;$('#lmCodeStep').hidden=true;
  $('#otpCode').value='';$('#loginModal').hidden=false;setTimeout(()=>$('#otpPhone').focus(),50);}
function closeLogin(){$('#loginModal').hidden=true;clearInterval(_otpTimer);}
function otpCooldown(secs){
  const btn=$('#otpResend');let n=secs||60;clearInterval(_otpTimer);
  const tick=()=>{if(n<=0){clearInterval(_otpTimer);btn.disabled=false;btn.textContent=state.lang==='cn'?'重新发送':'Resend code';return;}
    btn.disabled=true;btn.textContent=(state.lang==='cn'?'重新发送 ':'Resend in ')+n+'s';n--;};
  tick();_otpTimer=setInterval(tick,1000);
}
async function otpSend(){
  const phone=($('#otpPhone').value||'').replace(/\D/g,'');
  if(!/^1\d{10}$/.test(phone)){lmErr(state.lang==='cn'?'请输入11位手机号':'Enter an 11-digit phone number');return;}
  lmErr('');const btn=$('#otpSendBtn');btn.disabled=true;
  try{
    const d=await postJson('/api/retail/auth/otp/request',{phone});
    $('#lmPhoneStep').hidden=true;$('#lmCodeStep').hidden=false;
    $('#lmSub').textContent=(state.lang==='cn'?'验证码已发送至 ':'Code sent to ')+phone;
    setTimeout(()=>$('#otpCode').focus(),50);
    otpCooldown(d&&d.cooldown||60);
    if(d&&d.dev&&d.code){$('#otpCode').value=d.code;toast('DEV code '+d.code);}  // dev-echo only
  }catch(e){
    if(e.code==='too_soon'){$('#lmPhoneStep').hidden=true;$('#lmCodeStep').hidden=false;otpCooldown(60);}
    else if(e.code==='sms_unavailable')lmErr(state.lang==='cn'?'短信服务尚未配置，请稍后再试':'SMS isn’t set up yet — please try later');
    else if(e.code==='daily_cap')lmErr(state.lang==='cn'?'今日请求过多':'Too many requests today');
    else lmErr(state.lang==='cn'?'发送失败':'Could not send code');
  }finally{btn.disabled=false;}
}
async function otpVerify(){
  const phone=($('#otpPhone').value||'').replace(/\D/g,'');
  const code=($('#otpCode').value||'').replace(/\D/g,'');
  if(!/^\d{6}$/.test(code)){lmErr(state.lang==='cn'?'请输入6位验证码':'Enter the 6-digit code');return;}
  lmErr('');const btn=$('#otpVerifyBtn');btn.disabled=true;
  try{
    const d=await postJson('/api/retail/auth/otp/verify',{phone,code});
    setAuth(d.token,d.customer);closeLogin();
    toast(state.lang==='cn'?'登录成功 🌱':'Signed in 🌱');
    route();
  }catch(e){
    if(e.code==='bad_code')lmErr(state.lang==='cn'?'验证码错误':'Incorrect code');
    else if(e.code==='code_expired')lmErr(state.lang==='cn'?'验证码已过期，请重新发送':'Code expired — resend');
    else if(e.code==='too_many_attempts')lmErr(state.lang==='cn'?'尝试过多，请重新发送':'Too many tries — resend');
    else lmErr(state.lang==='cn'?'登录失败':'Sign-in failed');
  }finally{btn.disabled=false;}
}

/* ── theming ── */
const ACCENTS={
  'forest-kale':'#365329','forest':'#365329','olive-moss':'#6A6E2D','olive':'#6A6E2D',
  'lime-leaf':'#6A8E2D','lime':'#6A8E2D','berry-punch':'#E96174','berry':'#E96174',
  'carrot-blaze':'#FF6B0C','carrot':'#FF6B0C','papaya-glow':'#E08A3C','golden-corn':'#C99A2E',
  'skyberry':'#5B86C4','sky':'#5B86C4','lotus':'#C879B6','pink-guava':'#D4669A',
  'pea-sprout':'#5DA02E','pea':'#5DA02E','citrus-zest':'#9AAE22',
};
function applyTheme(cfg){
  const hex=ACCENTS[cfg&&cfg.theme&&cfg.theme.accent]||'#365329';
  document.documentElement.style.setProperty('--accent',hex);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',hex);
}
function brandName(cfg){
  const w=cfg&&cfg.brand&&cfg.brand.me_footer&&cfg.brand.me_footer.wordmark_text;
  return (w&&String(w).trim())||document.title||'Store';
}

/* ════════════ CART (client-side, Phase 3a) ════════════ */
function cartGet(){try{return JSON.parse(localStorage.getItem('shop_cart')||'[]')||[];}catch{return[];}}
function cartSave(c){try{localStorage.setItem('shop_cart',JSON.stringify(c));}catch{}cartBadge();}
function cartCount(){return cartGet().reduce((n,l)=>n+(l.qty||0),0);}
function cartSubtotal(){return cartGet().reduce((s,l)=>s+(Number(l.price)||0)*(l.qty||0),0);}
function cartBadge(){const b=$('#cartBadge');if(!b)return;const n=cartCount();b.textContent=n>99?'99+':n;b.hidden=n<=0;}
function lineKey(pid,choices){return pid+':'+(choices||[]).slice().sort((a,b)=>a-b).join(',');}
function cartAdd(line){const c=cartGet();const k=lineKey(line.product_id,line.choices);
  const ex=c.find(l=>l.key===k);if(ex)ex.qty+=line.qty;else c.push({...line,key:k});cartSave(c);}
function cartSetQty(key,qty){let c=cartGet();const l=c.find(x=>x.key===key);if(!l)return;
  l.qty=qty;if(l.qty<=0)c=c.filter(x=>x.key!==key);cartSave(c);renderCartItems();}
function cartRemove(key){cartSave(cartGet().filter(x=>x.key!==key));renderCartItems();}

function openCart(){renderCartItems();$('#cartDrawer').hidden=false;}
function closeCart(){$('#cartDrawer').hidden=true;}
function renderCartItems(){
  const c=cartGet();const box=$('#cdItems');const foot=$('#cdFoot');
  $('#cdTitle').textContent=state.lang==='cn'?'购物车':'Cart';
  $('#cdSubLabel').textContent=state.lang==='cn'?'小计':'Subtotal';
  $('#cdNote').textContent=state.lang==='cn'?'运费与总计将在结算时计算。':'Shipping & total are calculated at checkout.';
  $('#cdCheckout').textContent=state.lang==='cn'?'去结算':'Checkout';
  if(!c.length){box.innerHTML='<div class="cd-empty">'+(state.lang==='cn'?'购物车是空的 🌱':'Your cart is empty 🌱')+'</div>';foot.hidden=true;return;}
  box.innerHTML=c.map(l=>`<div class="cd-row" data-k="${escAttr(l.key)}">
    <div class="ph">${l.image?`<img src="${escAttr(l.image)}" alt="">`:''}</div>
    <div class="meta">
      <div class="nm">${esc(l.name||'')}</div>
      ${l.optLabel?`<div class="opt">${esc(l.optLabel)}</div>`:''}
      <div class="pr">${money(l.price)}</div>
      <div class="cd-qty"><button data-act="dec">−</button><span>${l.qty}</span><button data-act="inc">+</button></div>
      <button class="rm" data-act="rm">${state.lang==='cn'?'移除':'Remove'}</button>
    </div></div>`).join('');
  $('#cdSub').textContent=money(cartSubtotal());
  foot.hidden=false;
}

/* ════════════ CHECKOUT (Phase 3b) ════════════ */
// Delivery-only MVP: pick/add address → /checkout/quote (fees + slots) → place
// via /orders (handles the out-of-stock fallback). Server re-prices & re-checks
// stock authoritatively. Payment is Phase 3c (order is created pending_payment).
var co = { addrId:null, addrs:[], slotId:null, slotKind:'', mode:'standard', note:'', voucher:'', payment:'alipay', usePoints:false, quote:null, placing:false, idem:null, fallback:null, showAddForm:false, pollTimer:null, offersDone:false, _offers:null, _offerSig:'', _offerSkew:0, _offerTimer:null };
function coItems(){return cartGet().map(l=>({product_id:l.product_id,qty:l.qty,choices:l.choices||[]}));}
function coMsg(m){const e=$('#coMsg');if(e)e.textContent=m||'';}
function coErrMsg(code){const map={
  address_required:state.lang==='cn'?'请选择地址':'Choose an address',
  delivery_slot_required:state.lang==='cn'?'请选择配送时间':'Choose a delivery time',
  insufficient_points:state.lang==='cn'?'积分不足':'Not enough points',
  voucher_exhausted:state.lang==='cn'?'优惠码已失效':'Voucher no longer valid',
  flash_stock_exceeded:state.lang==='cn'?'秒杀库存不足':'Flash stock exceeded',
  local_only_outside_gz:state.lang==='cn'?'部分商品仅限本地':'Some items are local-only',
  no_zone_match:state.lang==='cn'?'该地址暂不支持配送':'We don’t deliver to this address yet'};
  return (state.lang==='cn'?'下单失败：':'Order failed: ')+(map[code]||code||'error');}

async function renderCheckout(){
  const v=$('#view');
  if(!state.token){ v.innerHTML='<div class="wrap"><div class="co"><div class="empty">'+(state.lang==='cn'?'请先登录后结算':'Please sign in to check out')+'</div></div></div>'; openLogin(); return; }

/* ════════════ LAST-CHANCE OFFERS (pre-pay upsell) ════════════ */
// Prefetch add-on offers for the current cart (cached by cart signature) so the
// pre-pay popup opens instantly; an empty list keeps the popup suppressed. The
// server returns complements to the cart + anything on an active flash sale.
function coOfferSig(){return coItems().map(i=>i.product_id+'x'+i.qty).sort().join(',');}
async function coLoadOffers(){
  const items=coItems(); if(!items.length){co._offers=[];co._offerSig='';return;}
  const sig=coOfferSig();
  if(sig===co._offerSig&&Array.isArray(co._offers))return;   // cart unchanged
  co._offerSig=sig;
  try{
    const r=await fetch('/api/retail/checkout/offers',{method:'POST',headers:authHeaders({'Content-Type':'application/json','Accept':'application/json'}),body:JSON.stringify({items})});
    const j=await r.json().catch(()=>({}));
    const list=Array.isArray(j&&j.data)?j.data:[];
    co._offerSkew=(Number(j&&j.meta&&j.meta.server_time_ms)||Date.now())-Date.now();
    const inCart=new Set(items.map(i=>Number(i.product_id)));
    co._offers=list.filter(o=>!inCart.has(Number(o.id)));
  }catch(e){/* offers are optional — never block checkout */}
}
function coFmtCountdown(ms){
  const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  if(h>0)return state.lang==='cn'?`${h}小时${m}分`:`${h}h ${String(m).padStart(2,'0')}m`;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}
function coOfferRows(){
  const now=Date.now()+(co._offerSkew||0); const rows=[];
  for(const o of (co._offers||[])){
    const onFlash=!!o.is_on_flash;
    const eff=Number(o.effective_price)||Number(o.price)||0;
    const was=onFlash?(Number(o.price)||0):(Number(o.compare_at_price)>eff?Number(o.compare_at_price):0);
    const pct=was>eff&&was>0?Math.round((was-eff)/was*100):0;
    let cd='';
    if(onFlash&&o.flash&&o.flash.ends_at){const ms=new Date(o.flash.ends_at).getTime()-now;if(ms<=0)continue;cd=coFmtCountdown(ms);}
    rows.push({id:o.id,name:pick(o.name_en,o.name_cn),image:o.image_data||o.image_url||'',
      price:money(eff),was:was>eff?money(was):'',off:pct>0?(state.lang==='cn'?('省'+pct+'%'):('-'+pct+'%')):'',
      tag:o.is_complement?(state.lang==='cn'?'搭配推荐':'GOES WELL WITH'):(state.lang==='cn'?'限时秒杀':'FLASH DEAL'),
      flash:onFlash,countdown:cd,cta:o.has_options?(state.lang==='cn'?'选规格':'Pick'):(state.lang==='cn'?'加入':'Add')});
  }
  return rows;
}

  const box=$('#coOfBody'); if(!box)return;
  const go=$('#coOfGo'); if(go)go.textContent=(state.lang==='cn'?'去支付 ':'Continue to pay ')+money(Number((co.quote&&co.quote.total)||0));

  if(!rows.length){box.innerHTML='<div class="coof-empty">'+(state.lang==='cn'?'都加好啦 🎉':'All set 🎉')+'</div>';return;}
  box.innerHTML=rows.map(r=>`<div class="coof-card">

function coCloseOffers(){const ov=$('#coOffers');if(ov)ov.hidden=true;if(co._offerTimer){clearInterval(co._offerTimer);co._offerTimer=null;}}
async function coOfferAdd(id){

  if(o.has_options){co.offersDone=true;coCloseOffers();location.hash='#/product/'+id;return;}  // needs a choice — go to PDP
  cartAdd({product_id:o.id,qty:1,choices:[],name:pick(o.name_en,o.name_cn),price:Number(o.effective_price)||Number(o.price)||0,image:o.image_data||o.image_url||'',optLabel:''});

function coOffersContinue(){co.offersDone=true;coCloseOffers();coPlace();}

async function coPlace(){
  if(co.placing)return;
  if(!co.addrId){coMsg(state.lang==='cn'?'请选择配送地址':'Choose a delivery address');return;}
  if(!co.slotId){coMsg(state.lang==='cn'?'请选择配送时间':'Choose a delivery time');return;}
  // Last-chance upsell: the first time the customer is ready to pay, surface any
  // prefetched add-on offers once. Continuing or dismissing sets offersDone and
  // re-enters coPlace, falling straight through to the order POST below.
  if(!co.offersDone&&Array.isArray(co._offers)&&co._offers.length){ coShowOffers(); return; }
  co.placing=true; $('#coPlace').disabled=true; coMsg('');
  const body={items:coItems(),address_id:co.addrId,delivery_mode:co.mode,delivery_slot_id:co.slotId,delivery_slot_kind:co.slotKind||'',payment_method:co.payment,points_to_use:co.usePoints?99999999:0,voucher_code:co.voucher||null,customer_note:co.note||null,idempotency_key:co.idem};
  if(co.fallback)body.fallback_choice=co.fallback;
  let r,j;
  try{ r=await fetch('/api/retail/orders',{method:'POST',headers:authHeaders({'Content-Type':'application/json','Accept':'application/json'}),body:JSON.stringify(body)}); j=await r.json().catch(()=>({})); }
  catch(e){ coMsg(state.lang==='cn'?'网络错误':'Network error'); co.placing=false; $('#coPlace').disabled=false; return; }
  if(r.ok&&j.success){ coStartPayment(j.data); return; }
  co.placing=false; $('#coPlace').disabled=false;
  if(r.status===409&&j.error==='needs_fallback_confirmation'){ coFallback(); return; }
  coMsg(coErrMsg(j.error));
}

function coUploadProof(order,file){

/* ════════════ ROUTER ════════════ */
function parseHash(){
  const raw=location.hash.replace(/^#/,'')||'/';
  const [path,qs]=raw.split('?');
  const params=new URLSearchParams(qs||'');
  const seg=path.split('/').filter(Boolean);   // ['shop'] | ['product','12']
  return {seg,params};
}
async function route(){
  const {seg,params}=parseHash();
  if(window.ShopBlocks) ShopBlocks.stopTimers();   // clear any home countdowns before leaving
  clearInterval(co.pollTimer);                      // stop any payment-status polling
  // highlight nav
  document.querySelectorAll('nav.links a').forEach(a=>{
    const n=a.dataset.nav;
    a.classList.toggle('on',(n==='home'&&seg.length===0)||(n==='shop'&&seg[0]==='shop'));
  });
  window.scrollTo({top:0,behavior:'instant'});
  try{
    if(seg[0]==='product'&&seg[1]) return renderProduct(seg[1]);
    if(seg[0]==='shop')           return renderShop(params);
    if(seg[0]==='checkout')        return renderCheckout();
    if(seg[0]==='orders')          return renderOrders();
    if(seg[0]==='order'&&seg[1])   return renderOrderDetail(seg[1]);
    return renderHome();
  }catch(e){
    $('#view').innerHTML=`<div class="wrap"><div class="empty">Something went wrong loading this page.<br>${esc(e.message)}</div></div>`;
  }
}

/* ════════════ HOME ════════════ */
// Renders the operator's REAL CMS home layout using the shared block engine
// (public/shop/blocks.js — a web port of the mini-app's block-renderer). Same
// content as the mini-app, responsive for phone + desktop. Falls back to a
// clean auto-layout when nothing is published.
async function renderHome(){
  const layout = state.config && state.config.home && state.config.home.layout;
  if(!(Array.isArray(layout) && layout.length) || !window.ShopBlocks) return renderHomeAuto();
  // Block engine needs products as context for by-id lookups (manual grids,
  // featured items, bundles). Fetch a base pull PLUS every product id the layout
  // references explicitly — manual product_ids/featured product_id/bundle product
  // — since hand-picked items often sort past the base pull. Bundles need their
  // components too (bundle_components=1). Referenced copies win (carry components).
  if(!state.homeProducts){
    let base=[]; try{ base=(await api('/api/retail/products?limit=100'))||[]; }catch(e){}
    const ids=new Set();
    for(const b of layout){
      (b.product_ids||[]).forEach(id=>id&&ids.add(id));
      if(b.product_id) ids.add(b.product_id);
      if(b.bundle_product_id) ids.add(b.bundle_product_id);
    }
    const refIds=[...ids];
    if(refIds.length){
      try{
        const ref=(await api('/api/retail/products?ids='+refIds.join(',')+'&bundle_components=1&limit=200'))||[];
        const map=new Map(base.map(p=>[p.id,p]));
        for(const p of ref) map.set(p.id,p);
        base=[...map.values()];
      }catch(e){}
    }
    state.homeProducts=base;
  }
  if(!state.flash){ try{ state.flash = await api('/api/retail/flash-sales'); }catch(e){ state.flash=[]; } }
  ShopBlocks.stopTimers();
  ShopBlocks.setContext({ lang:state.lang, products:state.homeProducts||[], categories:state.cats, flashSales:state.flash||[], config:state.config });
  const view=$('#view');
  view.innerHTML='<div class="shop-blocks">'+ShopBlocks.render(layout)+'</div>';
  ShopBlocks.startTimers(view);
}

  try{
    const prods=await api('/api/retail/products?slim=1&sort=newest&limit=12');
    $('#newGrid').innerHTML=(prods&&prods.length)?prods.map(cardHtml).join(''):`<div class="empty">${state.lang==='cn'?'暂无商品':'No products yet.'}</div>`;
  }catch(e){ $('#newGrid').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}

/* ════════════ SHOP ════════════ */
async function renderShop(params){
  const view=$('#view');
  const cat=params.get('cat')||'';
  const q=params.get('q')||'';
  const sort=params.get('sort')||'featured';
  $('#searchInput').value=q;

  const chips=[`<a class="chip ${!cat?'on':''}" href="#/shop${q?`?q=${encodeURIComponent(q)}`:''}">${state.lang==='cn'?'全部':'All'}</a>`]
    .concat(state.cats.map(c=>{
      const on=cat===c.name;
      const qp=new URLSearchParams();qp.set('cat',c.name);if(q)qp.set('q',q);if(sort!=='featured')qp.set('sort',sort);
      return `<a class="chip ${on?'on':''}" href="#/shop?${qp.toString()}">${esc(catLabel(c))}${c.count?`<span class="n">${c.count}</span>`:''}</a>`;
    })).join('');

  const heading = q ? `${state.lang==='cn'?'搜索':'Search'} · "${esc(q)}"`
                    : cat ? esc(catLabelByName(cat))
                    : (state.lang==='cn'?'全部商品':'All products');

  view.innerHTML=`<div class="wrap sec">
    <div class="crumb"><a href="#/">${state.lang==='cn'?'首页':'Home'}</a> / ${state.lang==='cn'?'商品':'Shop'}</div>
    <div class="sec-head"><div class="ttl">${heading}</div></div>
    <div class="chips">${chips}</div>
    <div class="toolbar">
      <span class="count" id="shopCount"></span>
      <select class="sort" id="sortSel">
        <option value="featured">${state.lang==='cn'?'推荐排序':'Featured'}</option>
        <option value="newest">${state.lang==='cn'?'最新':'Newest'}</option>
        <option value="price_asc">${state.lang==='cn'?'价格 ↑':'Price: low to high'}</option>
        <option value="price_desc">${state.lang==='cn'?'价格 ↓':'Price: high to low'}</option>
      </select>
    </div>
    <div class="grid" id="shopGrid">${skeletons(10)}</div>
  </div>`;
  $('#sortSel').value=sort;
  $('#sortSel').onchange=e=>{
    const qp=new URLSearchParams();if(cat)qp.set('cat',cat);if(q)qp.set('q',q);
    const v=e.target.value;if(v!=='featured')qp.set('sort',v);
    location.hash='#/shop'+(qp.toString()?`?${qp.toString()}`:'');
  };

  const qp=new URLSearchParams();qp.set('slim','1');qp.set('limit','120');
  if(cat)qp.set('category',cat);if(q)qp.set('q',q);if(sort!=='featured')qp.set('sort',sort);
  try{
    const r=await fetch('/api/retail/products?'+qp.toString()).then(x=>x.json());
    const prods=r&&r.data||[];
    const total=(r&&r.meta&&r.meta.total)||prods.length;
    $('#shopCount').textContent=total+(state.lang==='cn'?' 件商品':` ${total===1?'product':'products'}`);
    $('#shopGrid').innerHTML=prods.length?prods.map(cardHtml).join('')
      :`<div class="empty">${state.lang==='cn'?'没有找到商品':'No products found.'}</div>`;
  }catch(e){ $('#shopGrid').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}
function catLabelByName(name){const c=state.cats.find(x=>x.name===name);return c?catLabel(c):name;}

/* ════════════ PRODUCT CARD ════════════ */
// Effective out-of-stock policy — mirror of effectiveOosPolicy() on the server.
// true  → sold-out item stays orderable for out-of-city shoppers (pre-order);
// false → strict, sold out everywhere. Blank policy falls back to is_batch_made.
function oosBackorder(p){
  const pol=(p&&p.oos_policy)||'';
  if(pol==='backorder_gz')return true;
  if(pol==='strict')return false;
  return !!(p&&p.is_batch_made);
}
// Browse-time stock verdict. The web storefront doesn't know the shopper's zone
// yet, so a backorder product is shown orderable (the server enforces the GZ
// same-day gate at checkout) while a strict sold-out item is a hard SOLD OUT.
// Untracked stock (null) counts as in stock.
function stockState(p){
  const vs=Array.isArray(p.variants)?p.variants:null;
  const out = (vs&&vs.length>1)
    ? vs.every(v=>v.stock!=null&&Number(v.stock)<=0)
    : (p.stock!=null&&Number(p.stock)<=0);
  if(!out) return {oos:false,soldOut:false,badge:''};
  if(oosBackorder(p)) return {oos:true,soldOut:false,
    badge:p.is_batch_made?(state.lang==='cn'?'下批现做':'NEXT BATCH'):(state.lang==='cn'?'现订现发':'SHIPS SOON')};
  return {oos:true,soldOut:true,badge:state.lang==='cn'?'售罄':'SOLD OUT'};
}
function cardHtml(p){
  const src=thumb(p),now=nowPrice(p),was=wasPrice(p);
  const ss=stockState(p);
  const off=was>0?Math.round((1-now/was)*100):0;
  const sold=Number(p.sold_count||p.units_sold||0);
  const other=altLang(p.name_en,p.name_cn);
  const tag=pick(p.tagline_en,p.tagline_cn);
  return `<a class="card${ss.soldOut?' is-oos':''}" href="#/product/${p.id}">
    <div class="ph">
      ${src?`<img src="${escAttr(src)}" alt="" loading="lazy">`:'<span class="none">no image</span>'}
      ${off>0?`<span class="badge">-${off}%</span>`:''}
      ${ss.oos?`<span class="oos-tag${ss.soldOut?' sold':' soon'}">${ss.badge}</span>`:''}
      ${sold>0?`<span class="pill-sold">${state.lang==='cn'?'已售 '+sold:sold+' sold'}</span>`:''}
    </div>
    <div class="body">
      <div class="nm">${esc(pick(p.name_en,p.name_cn))}${other?`<span class="cn">${esc(other)}</span>`:''}</div>
      ${tag?`<div class="tag">${esc(tag.slice(0,60))}</div>`:''}
      ${p.has_options?`<span class="opt-cue">${state.lang==='cn'?'多规格':'Options'}</span>`:''}
      <div class="prices"><span class="now">${money(now)}</span>${was>0?`<span class="was">${money(was)}</span>`:''}</div>
    </div>
  </a>`;
}
function skeletons(n){return Array.from({length:n}).map(()=>'<div class="skel"></div>').join('');}

/* ════════════ PRODUCT DETAIL ════════════ */
async function renderProduct(id){
  const view=$('#view');
  view.innerHTML=`<div class="wrap"><div class="crumb">${state.lang==='cn'?'加载中…':'Loading…'}</div></div>`;
  let p;
  try{ p=await api('/api/retail/products/'+encodeURIComponent(id)); }
  catch(e){ view.innerHTML=`<div class="wrap"><div class="empty">${state.lang==='cn'?'商品不存在或已下架。':'This product is unavailable.'}<br><a class="more" href="#/shop">← ${state.lang==='cn'?'返回商品':'Back to shop'}</a></div></div>`; return; }

  const now=nowPrice(p),was=wasPrice(p);
  const ss=stockState(p);
  const gallery=[thumb(p),...(Array.isArray(p.images)?p.images:[])].filter(Boolean)
    .filter((v,i,a)=>a.indexOf(v)===i).slice(0,8);
  const other=altLang(p.name_en,p.name_cn);
  const tag=pick(p.tagline_en,p.tagline_cn);
  const desc=pick(p.description_en,p.description_cn);
  const avg=Number(p.review_avg)||0, rc=Number(p.review_count)||0;

  // Description body: render the mini-app PRODUCT design-blocks when the product
  // uses them (identical to the mini-app); else fall back to plain rich text.
  let blocks=p.description_blocks;
  if(typeof blocks==='string'){ try{ blocks=JSON.parse(blocks); }catch{ blocks=null; } }
  const useBlocks = p.use_block_design && Array.isArray(blocks) && blocks.length && window.ShopProductBlocks;
  const descBody = useBlocks
    ? `<div class="shop-product-blocks">${ShopProductBlocks.render(blocks,{lang:state.lang})}</div>`
    : (desc?`<div class="pd-section"><h3>${state.lang==='cn'?'商品详情':'Description'}</h3><div class="desc">${desc}</div></div>`:'');

  const popts=Array.isArray(p.options)?p.options:[];
  const optsHtml=popts.length?`<div class="pd-opts" id="pdOpts">${popts.map(o=>{
    const multi=o.type==='multi';
    return `<div class="pd-opt" data-multi="${multi?1:0}" data-req="${o.is_required?1:0}">
      <div class="q">${esc(pick(o.question_en,o.question_cn))}${o.is_required?' <span class="req">*</span>':''}</div>
      <div class="choices">${(o.choices||[]).map(c=>`<button type="button" class="pd-choice" data-cid="${c.id}" data-delta="${Number(c.price_delta)||0}" data-label="${escAttr(pick(c.label_en,c.label_cn))}">${esc(pick(c.label_en,c.label_cn))}${Number(c.price_delta)?`<span class="delta">+${money(c.price_delta)}</span>`:''}</button>`).join('')}</div>
    </div>`;
  }).join('')}</div>`:'';

  const variants=Array.isArray(p.variants)?p.variants:[];
  const varsHtml=variants.length>1?`<div class="pd-section"><h3>${state.lang==='cn'?'规格':'Choose'}</h3><div class="variants">${
    variants.map(v=>`<a class="${v.id==p.id?'on':''}" href="#/product/${v.id}">${esc(pick(v.variant_label||v.name_en,v.variant_label_cn||v.name_cn))}</a>`).join('')
  }</div></div>`:'';

  const recent=Array.isArray(p.reviews_recent)?p.reviews_recent:[];
  const revHtml=rc>0?`<div class="pd-section"><h3>${state.lang==='cn'?'评价':'Reviews'} (${rc})</h3>
    ${recent.map(r=>{
      const rt=Math.max(0,Math.min(5,Math.round(Number(r.rating)||0)));
      const body=r.comment||r.body||r.text||r.content||'';
      const who=r.author_name||r.nickname||r.name||(state.lang==='cn'?'匿名':'Anonymous');
      return `<div class="review"><div class="head"><span class="stars">${'★'.repeat(rt)}<span class="off">${'★'.repeat(5-rt)}</span></span>
        <span class="who">${esc(who)}</span></div>${body?`<div class="body">${esc(body)}</div>`:''}</div>`;
    }).join('')}</div>`:'';

  view.innerHTML=`<div class="wrap">
    <div class="crumb"><a href="#/">${state.lang==='cn'?'首页':'Home'}</a> / <a href="#/shop">${state.lang==='cn'?'商品':'Shop'}</a> / ${esc(pick(p.name_en,p.name_cn))}</div>
    <div class="pd">
      <div class="pd-gallery">
        <div class="main">${gallery[0]?`<img id="pdMain" src="${escAttr(gallery[0])}" alt="">`:'<span class="card"></span>'}</div>
        ${gallery.length>1?`<div class="pd-thumbs" id="pdThumbs">${gallery.map((g,i)=>`<button class="${i===0?'on':''}" data-src="${escAttr(g)}"><img src="${escAttr(g)}" alt=""></button>`).join('')}</div>`:''}
      </div>
      <div class="pd-info">
        <h1>${esc(pick(p.name_en,p.name_cn))}</h1>
        ${other?`<div class="cn">${esc(other)}</div>`:''}
        ${tag?`<div class="tagline">${esc(tag)}</div>`:''}
        <div class="price-row">
          <span class="price-now">${money(now)}</span>
          ${was>0?`<span class="price-was">${money(was)}</span><span class="flash-tag">${state.lang==='cn'?'限时':'Flash'}</span>`:''}
          ${ss.oos?`<span class="pd-oos-tag${ss.soldOut?' sold':' soon'}">${ss.badge}</span>`:''}
        </div>
        ${ss.oos&&!ss.soldOut?`<div class="pd-oos-note">${state.lang==='cn'?'当前缺货，外地可预订，下批/补货后发出。':'Out of stock now — orderable outside Guangzhou; ships on the next batch / restock.'}</div>`:''}
        ${rc>0?`<div class="rating"><span class="stars">${'★'.repeat(Math.round(avg))}<span class="off">${'★'.repeat(5-Math.round(avg))}</span></span>${avg.toFixed(1)} · ${rc} ${state.lang==='cn'?'条评价':'reviews'}</div>`:''}
        ${varsHtml}
        ${optsHtml}
        <div class="pd-buy">
          ${ss.soldOut
            ? `<button class="btn-primary" id="addBtn" disabled>${state.lang==='cn'?'已售罄':'Sold out'}</button>`
            : `<div class="pd-qty"><button type="button" data-q="dec">−</button><span id="pdQty">1</span><button type="button" data-q="inc">+</button></div>
          <button class="btn-primary" id="addBtn">Add to cart</button>`}
        </div>
      </div>
    </div>
    <div class="pd-body">${descBody}${revHtml}</div>
  </div>`;

  document.title=pick(p.name_en,p.name_cn)+' · '+state.brand;
  const thumbs=$('#pdThumbs');
  if(thumbs) thumbs.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    $('#pdMain').src=b.dataset.src;thumbs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
  // purchase block: selectable options + qty + add-to-cart (works logged-out;
  // sign-in is required later at checkout). Server re-prices authoritatively.
  (function wirePurchase(){
    // Strict sold-out: the button is rendered disabled; skip wiring so refresh()
    // doesn't overwrite its "Sold out" label. (Backorder OOS stays orderable.)
    if(ss.soldOut) return;
    const base=nowPrice(p); let qty=1;
    const optsEl=$('#pdOpts');
    const chips=()=>optsEl?[...optsEl.querySelectorAll('.pd-choice.on')]:[];
    const unit=()=>chips().reduce((s,c)=>s+(Number(c.dataset.delta)||0),base);
    function refresh(){$('#addBtn').textContent=(state.lang==='cn'?'加入购物车 · ':'Add to cart · ')+money(unit()*qty);}
    if(optsEl){
      optsEl.addEventListener('click',e=>{const ch=e.target.closest('.pd-choice');if(!ch)return;
        const g=ch.closest('.pd-opt');
        if(g.dataset.multi==='1')ch.classList.toggle('on');
        else g.querySelectorAll('.pd-choice').forEach(x=>x.classList.toggle('on',x===ch));
        refresh();});
      // radios start with their first choice picked (mini-app parity)
      optsEl.querySelectorAll('.pd-opt[data-multi="0"]').forEach(g=>{const f=g.querySelector('.pd-choice');if(f)f.classList.add('on');});
    }
    $('.pd-qty').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.q==='inc')qty++;else if(b.dataset.q==='dec'&&qty>1)qty--;
      $('#pdQty').textContent=qty;refresh();});
    $('#addBtn').addEventListener('click',()=>{
      let missing=null;
      if(optsEl)optsEl.querySelectorAll('.pd-opt[data-req="1"]').forEach(g=>{if(!g.querySelector('.pd-choice.on'))missing=g;});
      if(missing){toast(state.lang==='cn'?'请选择必选项':'Please choose the required option');missing.scrollIntoView({block:'center',behavior:'smooth'});return;}
      const sel=chips();
      cartAdd({product_id:p.id,qty,choices:sel.map(c=>Number(c.dataset.cid)),
        name:pick(p.name_en,p.name_cn),price:unit(),image:thumb(p),
        optLabel:sel.map(c=>c.dataset.label).filter(Boolean).join(' · ')});
      toast(state.lang==='cn'?'已加入购物车 🌱':'Added to cart 🌱');
      openCart();
    });
    refresh();
  })();
}

/* ════════════ CHROME / INIT ════════════ */
function applyLangToUI(){
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));
  $('#searchInput').placeholder=state.lang==='cn'?'搜索商品':'Search products';
  document.querySelector('nav.links [data-nav=home]').textContent=state.lang==='cn'?'首页':'Home';
  document.querySelector('nav.links [data-nav=shop]').textContent=state.lang==='cn'?'商品':'Shop';
  $('#footBrand').textContent=state.brand;
}

// Route a block-engine CTA target (data-cta-target) through our own router.
// Shopping targets navigate; account/cart targets are honest "coming soon".
function ctaRoute(t){
  t=String(t||'');
  if(!t) return;
  if(t.indexOf('product:')===0){ location.hash='#/product/'+t.slice(8); return; }
  if(t.indexOf('category:')===0){
    const key=t.slice(9); const c=state.cats.find(x=>String(x.id)===key||x.name===key);
    location.hash='#/shop'+(c?`?cat=${encodeURIComponent(c.name)}`:''); return;
  }
  if(t==='shop'){ location.hash='#/shop'; return; }
  if(t==='login'||t==='account'||t==='me'){ if(state.token&&state.customer) acctMenuToggle(true); else openLogin(); return; }
  if(t.indexOf('copy:')===0){ const code=t.slice(5);
    try{ navigator.clipboard.writeText(code); }catch{}
    toast((state.lang==='cn'?'已复制 ':'Copied ')+code); return; }
  // cart / wallet / coupons / voting / wecom / notifications / order:* → later phases
  toast(state.lang==='cn'?'此功能即将上线 🌱':'That feature is coming soon 🌱');
}

(async function boot(){
  // config first (theme + brand), then categories — both tenant-scoped by Host.
  try{ state.config=await api('/api/retail/config')||{}; }catch(e){ state.config={}; }
  try{ state.lang=localStorage.getItem('shop_lang')||'en'; }catch{}
  try{ state.token=localStorage.getItem('shop_token')||''; }catch{}
  if(!['en','cn'].includes(state.lang)) state.lang='en';
  applyTheme(state.config);
  state.brand=brandName(state.config);
  document.title=state.brand;
  try{ state.cats=(await api('/api/retail/category-tree?counts=1'))||[]; }catch(e){ state.cats=[]; }
  state.cats=state.cats.filter(c=>!c.count||c.count>0);

  $('#footMeta').textContent=location.hostname;
  applyLangToUI();
  document.querySelector('header.bar').hidden=false;
  $('#view').hidden=false;
  $('#footer').hidden=false;

  // search submit → shop
  $('#searchForm').addEventListener('submit',e=>{e.preventDefault();
    const q=$('#searchInput').value.trim();location.hash='#/shop'+(q?`?q=${encodeURIComponent(q)}`:'');});
  // lang toggle
  $('#langToggle').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    state.lang=b.dataset.lang;try{localStorage.setItem('shop_lang',state.lang);}catch{}
    applyLangToUI();route();});
  // ── cart drawer ──
  cartBadge();
  $('#cartBtn').addEventListener('click',openCart);
  $('#cdClose').addEventListener('click',closeCart);
  $('#cartDrawer').addEventListener('click',(e)=>{if(e.target.id==='cartDrawer')closeCart();});
  $('#cdItems').addEventListener('click',(e)=>{const b=e.target.closest('button');if(!b)return;
    const row=e.target.closest('.cd-row');if(!row)return;const k=row.dataset.k;const l=cartGet().find(x=>x.key===k);if(!l)return;
    const a=b.dataset.act;
    if(a==='inc')cartSetQty(k,l.qty+1);
    else if(a==='dec')cartSetQty(k,l.qty-1);
    else if(a==='rm')cartRemove(k);});
  $('#cdCheckout').addEventListener('click',()=>{
    if(!cartCount())return;
    if(!state.token){closeCart();return openLogin();}
    closeCart();location.hash='#/checkout';
  });

  // ── account: header button → login modal (logged-out) or menu (logged-in) ──
  renderAcct();
  $('#acctBtn').addEventListener('click',(e)=>{e.stopPropagation();
    if(state.token&&state.customer) acctMenuToggle(); else openLogin();});
  $('#acctMenu').addEventListener('click',(e)=>{const b=e.target.closest('button');if(!b)return;
    const a=b.dataset.am;acctMenuToggle(false);
    if(a==='out'){clearAuth();toast(state.lang==='cn'?'已退出':'Signed out');if(parseHash().seg[0]!=='shop')location.hash='#/';else route();}
    else if(a==='orders')location.hash='#/orders';});
  document.addEventListener('click',()=>acctMenuToggle(false));  // click-away closes the menu
  // login modal wiring
  $('#lmClose').addEventListener('click',closeLogin);
  $('#loginModal').addEventListener('click',(e)=>{if(e.target.id==='loginModal')closeLogin();});
  $('#otpSendBtn').addEventListener('click',otpSend);
  $('#otpResend').addEventListener('click',otpSend);
  $('#otpVerifyBtn').addEventListener('click',otpVerify);
  $('#otpPhone').addEventListener('keydown',(e)=>{if(e.key==='Enter')otpSend();});
  $('#otpCode').addEventListener('keydown',(e)=>{if(e.key==='Enter')otpVerify();});
  if(state.token) loadCustomer();   // resolve the saved session (or silently drop it)

  // Block-engine CTAs: every clickable in a rendered block carries
  // data-cta-target. Delegate clicks here and route them.
  $('#view').addEventListener('click',e=>{
    const el=e.target.closest('[data-cta-target]');
    if(!el) return;
    e.preventDefault();
    ctaRoute(el.getAttribute('data-cta-target'));
  });
  // When the block engine pulls lazy data (top-selling grids, flash sales) or a
  // countdown hits zero, re-render the home if that's where we are.
  if(window.ShopBlocks) ShopBlocks.onRerender(()=>{ if(parseHash().seg.length===0) renderHome(); });

  window.addEventListener('hashchange',route);
  await route();
  $('#boot').classList.add('gone');
})();
</script>
