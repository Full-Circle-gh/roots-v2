// Renders the operator's REAL CMS home layout using the shared block engine
// (public/shop/blocks.js — a web port of the mini-app's block-renderer). Same
// content as the mini-app, responsive for phone + desktop. Falls back to a
// clean auto-layout when nothing is published.
async function renderHome(){
  const layout = state.config && state.config.home && state.config.home.layout;
  if(!(Array.isArray(layout) && layout.length) || !window.ShopBlocks) return renderHomeAuto();
  // Block engine needs products as context for by-id lookups (manual grids,
  // featured items, bundles). Fetch a base pull PLUS every product id the layout
  // references explicitly — manual product_ids/featured product_id/bundle product
  // — since hand-picked items often sort past the base pull. Bundles need their
  // components too (bundle_components=1). Referenced copies win (carry components).
  if(!state.homeProducts){
    let base=[]; try{ base=(await api('/api/retail/products?limit=100'))||[]; }catch(e){}
    const ids=new Set();
    for(const b of layout){
      (b.product_ids||[]).forEach(id=>id&&ids.add(id));
      if(b.product_id) ids.add(b.product_id);
      if(b.bundle_product_id) ids.add(b.bundle_product_id);
    }
    const refIds=[...ids];
    if(refIds.length){
      try{
        const ref=(await api('/api/retail/products?ids='+refIds.join(',')+'&bundle_components=1&limit=200'))||[];
        const map=new Map(base.map(p=>[p.id,p]));
        for(const p of ref) map.set(p.id,p);
        base=[...map.values()];
      }catch(e){}
    }
    state.homeProducts=base;
  }
  if(!state.flash){ try{ state.flash = await api('/api/retail/flash-sales'); }catch(e){ state.flash=[]; } }
  ShopBlocks.stopTimers();
  ShopBlocks.setContext({ lang:state.lang, products:state.homeProducts||[], categories:state.cats, flashSales:state.flash||[], config:state.config });
  const view=$('#view');
  view.innerHTML='<div class="shop-blocks">'+ShopBlocks.render(layout)+'</div>';
  ShopBlocks.startTimers(view);
}

/* ════════════ SHOP — MOBILE LIST LAYOUT (mini-app parity) ════════════ */
/* A faithful web port of miniapp/pages/shop (list view): CATEGORIES header,
   search, 4-way view-switcher, dietary chips, a left category rail that drills
   into subcategories, and a scroll-synced grouped product list. Quick-add +
   button and the variant size-picker mirror the mini-app. */
const SL = {
  prods:[], sections:[], visible:[], members:{},
  layout:'list', diet:'', q:'',
  drill:'', drillLabel:'', subTabs:[], activeCat:'', activeSub:'',
  suppress:0, offsets:[], vpRep:null, _searchT:null, _scrollT:null,
};
const SL_DIET=[
  {key:'gluten',en:'GLUTEN FREE',cn:'无麸质'},
  {key:'nuts',  en:'NUT FREE',   cn:'无坚果'},
  {key:'soy',   en:'SOY FREE',   cn:'无大豆'},
  {key:'5spice',en:'5-SPICE FREE',cn:'无五香'},
];
const SL_VIEWS=[
  {key:'list',        icon:'☰'},
  {key:'list-compact',icon:'≡'},
  {key:'grid-2col',   icon:'⊞'},
  {key:'grid-3col',   icon:'⊟'},
];
const SL_LIST=['list','list-compact'];
function slMoney(v){return '¥'+(Number.isInteger(v)?v:v.toFixed(2));}
function slEff(p){const r=Number(p.price??p.sell_price)||0;const e=Number(p.effective_price)>0?Number(p.effective_price):r;return e;}
// Card image. The slim list puts the streamed-image URL in image_data (not
// image_url) and only substitutes the literal 'data:' sentinel when the row's
// image_data was inline base64 (stripped to save bytes). So: prefer image_url,
// else use image_data unless it's that bare sentinel. Plain '/...' and full
// http(s)/data: URLs all render as-is (same origin).
function slImg(p){const u=p.image_url||'';if(u)return u;const d=p.image_data||'';return (!d||d==='data:')?'':d;}
function slPickBadge(tags){const t=String(tags||'').toLowerCase();
  if(/\bnew\b/.test(t))return 'NEW';if(/\bpop|popular\b/.test(t))return 'POP';
  if(/\bsale\b/.test(t))return 'SALE';if(/\bhot\b/.test(t))return 'HOT';return '';}

// Collapse variant siblings (same variant_group_id) into one card — mirror of
// the mini-app _collapseVariants. The representative is the group owner.
function slCollapse(raw){
  const groups=new Map();
  for(const p of raw){if(!p.variant_group_id)continue;
    if(!groups.has(p.variant_group_id))groups.set(p.variant_group_id,[]);
    groups.get(p.variant_group_id).push(p);}
  const emitted=new Set(),out=[];
  for(const p of raw){
    const gid=p.variant_group_id;const members=gid?groups.get(gid):null;
    if(!members||members.length<2){out.push(p);continue;}
    if(emitted.has(gid))continue;emitted.add(gid);
    const sorted=members.slice().sort((a,b)=>
      ((a.variant_sort??0)-(b.variant_sort??0))||
      String(a.variant_label||'').localeCompare(String(b.variant_label||''))||
      (a.id-b.id));
    const rep=sorted.find(m=>m.id===gid)||sorted[0];
    out.push({...rep,_members:sorted});
  }
  return out;
}

// Product → display row. Browse-time stock verdict mirrors the existing web
// stockState()/oosBackorder(): strict sold-out is a hard SOLD OUT; a backorder
// (or batch-meal) item stays orderable as SHIPS SOON / NEXT BATCH.
function slToRows(products){
  const L=state.lang;
  return products.map(p=>{
    const members=p._members||null;
    const regular=Number(p.price??p.sell_price)||0;
    const eff=slEff(p);
    const isFlash=!members&&!!p.is_on_flash&&eff<regular;
    let price,priceWas='',pricePrefix='',outOfStock=false,nextBatch=false,soldUnits=0,subline='';
    if(members){
      const prices=members.map(slEff).filter(v=>v>0);
      const minP=prices.length?Math.min(...prices):0;
      const allSame=prices.length>0&&prices.every(v=>v===minP);
      price=minP>0?slMoney(minP):'—';
      pricePrefix=(minP>0&&!allSame)?(L==='cn'?'起':'from'):'';
      const allOut=members.every(m=>m.stock!=null&&Number(m.stock)<=0);
      const anyBack=members.some(m=>oosBackorder(m));
      nextBatch=allOut&&anyBack;outOfStock=allOut&&!anyBack;
      soldUnits=members.reduce((s,m)=>s+(Number(m.units_sold)||0),0);
    }else{
      const sn=p.stock==null?null:Number(p.stock);
      const out=sn!=null&&sn<=0;
      nextBatch=out&&oosBackorder(p);outOfStock=out&&!oosBackorder(p);
      soldUnits=Number(p.units_sold||p.sold_count||0);
      price=eff>0?slMoney(eff):'—';
      const cmp=Number(p.compare_at_price)||0;
      const wasN=isFlash?regular:(cmp>eff&&eff>0?cmp:0);
      priceWas=wasN>0?slMoney(wasN):'';
      subline=(p.size||'').toString().trim();
    }
    const batchTxt=p.is_batch_made?(L==='cn'?'下批现做':'NEXT BATCH'):(L==='cn'?'现订现发':'SHIPS SOON');
    return {id:p.id,name:pick(p.name_en,p.name_cn),subline,badge:slPickBadge(p.tags),
      soldCaption:soldUnits>0?(L==='cn'?'已售 '+soldUnits:soldUnits+' SOLD'):'',
      outOfStock,nextBatch,batchTxt,oosLabel:state.lang==='cn'?'售罄':'SOLD OUT',
      image:slImg(p),price,priceWas,pricePrefix,isFlash,
      hasVariants:!!members,variantHint:members?(L==='cn'?members.length+' 规格':members.length+' sizes'):''};
  });
}

// Build top-category sections (rail entries + scroll anchors), each holding
// subcategory groups — mirror of the mini-app _buildSections.
function slBuildSections(display,tree){
  const L=state.lang,pad=n=>(n<10?'0'+n:String(n));
  const byTop=new Map(),orphans=[];
  for(const p of display){
    const top=p.top_category;
    if(!top){orphans.push(p);continue;}
    if(!byTop.has(top))byTop.set(top,new Map());
    const subMap=byTop.get(top);
    const key=p.subcategory||'__nosub__';
    if(!subMap.has(key))subMap.set(key,[]);
    subMap.get(key).push(p);
  }
  const sections=[];
  (tree||[]).forEach((top,ti)=>{
    const subMap=byTop.get(top.name);
    if(!subMap)return;
    const groups=[];let gi=0;
    for(const sub of (top.subs||[])){
      const items=subMap.get(sub.name);
      if(!items||!items.length)continue;
      groups.push({id:`top${ti}-g${gi++}`,label:((L==='cn'?sub.name_cn:sub.name)||sub.name).toUpperCase(),
        items:slToRows(items),countStr:pad(items.length)});
      subMap.delete(sub.name);
    }
    for(const [key,items] of subMap){
      if(!items.length)continue;
      groups.push({id:`top${ti}-g${gi++}`,
        label:key==='__nosub__'?(L==='cn'?'更多':'MORE'):key.toUpperCase(),
        items:slToRows(items),countStr:pad(items.length)});
    }
    if(!groups.length)return;
    sections.push({id:`top${ti}`,name:top.name,
      label:((L==='cn'?top.name_cn:top.name)||top.name).toUpperCase(),
      drillable:groups.length>=2,groups});
  });
  if(orphans.length){
    sections.push({id:'other',name:'__other__',label:L==='cn'?'其他':'OTHER',drillable:false,
      groups:[{id:'other-g0',label:'',items:slToRows(orphans),countStr:pad(orphans.length)}]});
  }
  return sections;
}

async function renderShopList(params){
  const view=$('#view');
  SL.q=params.get('q')||'';
  SL.diet='';SL.drill='';SL.drillLabel='';SL.subTabs=[];SL.activeCat='';SL.activeSub='';
  SL._pendingCat=params.get('cat')||'';
  // restore saved view preference
  try{const sv=localStorage.getItem('shop_layout_pref');if(sv&&SL_VIEWS.some(v=>v.key===sv))SL.layout=sv;}catch{}
  view.innerHTML=`<div class="shoplist" id="slRoot">
    <div class="sl-hd"><div class="t">${state.lang==='cn'?'分类':'CATEGORIES'}</div></div>
    <div class="sl-search">
      <span class="ic">🔍</span>
      <input id="slSearch" type="search" value="${escAttr(SL.q)}" placeholder="${state.lang==='cn'?'搜索…':'Search the pantry…'}" autocomplete="off">
      <span class="clr" id="slClear" ${SL.q?'':'hidden'}>×</span>
    </div>
    <div class="sl-vs" id="slVs">${SL_VIEWS.map(v=>`<button data-k="${v.key}" class="${SL.layout===v.key?'on':''}">${v.icon}</button>`).join('')}</div>
    <div class="sl-diet" id="slDiet">${SL_DIET.map(d=>`<span class="c" data-k="${d.key}">${state.lang==='cn'?d.cn:d.en}</span>`).join('')}</div>
    <div class="sl-body">
      <div class="sl-side" id="slSide"></div>
      <div class="sl-main" id="slMain"><div class="sl-skel"></div><div class="sl-skel"></div><div class="sl-skel"></div></div>
    </div>
  </div>`;
  slFit();
  // wire controls
  const si=$('#slSearch');
  si.addEventListener('input',e=>{
    SL.q=e.target.value;$('#slClear').hidden=!SL.q;
    clearTimeout(SL._searchT);SL._searchT=setTimeout(slRefresh,300);
  });
  $('#slClear').onclick=()=>{SL.q='';si.value='';$('#slClear').hidden=true;slRefresh();};
  $('#slVs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k;if(!k||k===SL.layout)return;SL.layout=k;
    try{localStorage.setItem('shop_layout_pref',k);}catch{}
    $('#slVs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k));
    slRenderMain();};
  $('#slDiet').onclick=e=>{const c=e.target.closest('.c');if(!c)return;
    const k=c.dataset.k;SL.diet=(SL.diet===k?'':k);
    $('#slDiet').querySelectorAll('.c').forEach(x=>x.classList.toggle('on',x.dataset.k===SL.diet&&SL.diet));
    slRefresh();};
  $('#slMain').addEventListener('scroll',()=>{
    clearTimeout(SL._scrollT);SL._scrollT=setTimeout(slOnScroll,40);
  },{passive:true});
  if(!SL._resizeBound){SL._resizeBound=true;window.addEventListener('resize',slFit);}
  await slRefresh();
}

// Re-size the list body to fill the viewport between the slim top bar and the
// bottom tab bar so the rail + list scroll internally (mini-app feel).
function slFit(){
  const root=$('#slRoot');if(!root)return;
  const mtop=document.getElementById('mtop');
  const topH=(mtop&&!mtop.hidden)?mtop.offsetHeight:0;
  const tb=document.getElementById('tabbar');
  const tab=(tb&&!tb.hidden)?tb.offsetHeight:56;   // fill exactly to the tab bar top
  root.style.height=(window.innerHeight-topH-tab)+'px';
}

async function slRefresh(){
  const main=$('#slMain');if(main&&!SL.prods.length)main.innerHTML='<div class="sl-skel"></div><div class="sl-skel"></div><div class="sl-skel"></div>';
  try{
    const qp=new URLSearchParams();qp.set('slim','1');qp.set('limit','500');
    if(SL.q)qp.set('q',SL.q);
    const r=await fetch('/api/retail/products?'+qp.toString()).then(x=>x.json());
    let raw=(r&&r.data)||[];
    if(SL.diet){
      raw=raw.filter(p=>{const tags=(p.free_of||'').split(',').map(s=>s.trim());return tags.includes(SL.diet);});
    }
    SL.prods=raw;
    const display=slCollapse(raw);
    SL.members={};for(const p of display)if(p._members)SL.members[p.id]=p._members;
    SL.sections=slBuildSections(display,state.cats);
    // preserve an active drill across refresh; drop if it emptied out
    if(SL.drill){
      const sec=SL.sections.find(s=>s.name===SL.drill);
      if(sec){SL.visible=[sec];SL.subTabs=sec.groups.map(g=>({id:g.id,label:g.label}));SL.drillLabel=sec.label;}
      else{SL.drill='';SL.drillLabel='';SL.subTabs=[];SL.visible=SL.sections;}
    }else SL.visible=SL.sections;
    slRenderSide();slRenderMain();
    // honour a pending category deep-link (from a home category tile)
    if(SL._pendingCat){
      const sec=SL.sections.find(s=>s.name===SL._pendingCat);
      SL._pendingCat='';
      if(sec){if(sec.drillable)slDrillInto(sec.name);else slScrollToSection(sec.id);}
    }
  }catch(e){
    const main=$('#slMain');if(main)main.innerHTML=`<div class="sl-empty"><div class="et">${state.lang==='cn'?'加载失败':'Could not load'}</div><div class="es">${esc(e.message)}</div></div>`;
  }
}

function slRenderSide(){
  const side=$('#slSide');if(!side)return;
  const seeAll=state.lang==='cn'?'全部':'ALL';
  let html;
  if(!SL.drill){
    html=`<div class="sl-tab ${!SL.activeCat?'on':''}" data-name=""><span class="lb">${seeAll}</span></div>`+
      SL.sections.map(s=>`<div class="sl-tab ${s.drillable?'has-chev':''} ${SL.activeCat===s.name?'on':''}" data-name="${escAttr(s.name)}"><span class="lb">${esc(s.label)}</span>${s.drillable?'<span class="chev">›</span>':''}</div>`).join('');
  }else{
    html=`<div class="sl-back" id="slBack"><span class="cv">‹</span><span class="tx">${state.lang==='cn'?'全部分类':'ALL CATEGORIES'}</span></div>`+
      `<div class="sl-parent">${esc(SL.drillLabel)}</div>`+
      `<div class="sl-tab ${!SL.activeSub?'on':''}" data-sub=""><span class="lb">${seeAll}</span></div>`+
      SL.subTabs.map(g=>`<div class="sl-tab ${SL.activeSub===g.id?'on':''}" data-sub="${g.id}"><span class="lb">${esc(g.label)}</span></div>`).join('');
  }
  side.innerHTML=html;
  side.onclick=e=>{
    const back=e.target.closest('#slBack');if(back){slDrillBack();return;}
    const tab=e.target.closest('.sl-tab');if(!tab)return;
    if(tab.dataset.sub!==undefined){slSetSub(tab.dataset.sub);return;}
    const name=tab.dataset.name||'';
    const sec=name?SL.sections.find(s=>s.name===name):null;
    if(sec&&sec.drillable){slDrillInto(name);return;}
    slSetActive(name);
    if(!name){$('#slMain').scrollTo({top:0,behavior:'smooth'});}
    else if(sec){slScrollToSection(sec.id);}
  };
}

// One product row (list / list-compact).
function slRowHtml(it,compact){
  const flags=[];
  if(it.isFlash)flags.push(`<span class="sl-flash">${state.lang==='cn'?'秒杀':'FLASH'}</span>`);
  if(it.badge)flags.push(`<span class="sl-bd">${it.badge}</span>`);
  const oos=it.outOfStock?`<span class="sl-oos">${it.oosLabel}</span>`
    :it.nextBatch?`<span class="sl-oos batch">${it.batchTxt}</span>`:'';
  return `<div class="sl-row ${compact?'compact':''}" data-id="${it.id}">
    ${compact?'':`<div class="sl-img">${it.image?`<img src="${escAttr(it.image)}" alt="" loading="lazy">`:''}</div>`}
    <div class="sl-rb">
      <div class="sl-nm">${esc(it.name)}</div>
      ${it.subline?`<div class="sl-sub">${esc(it.subline)}</div>`:''}
      ${it.hasVariants?`<span class="sl-vh">${esc(it.variantHint)}</span>`:''}
      ${it.soldCaption?`<div class="sl-sold">${esc(it.soldCaption)}</div>`:''}
      ${flags.join('')}
      ${oos}
    </div>
    <div class="sl-rr">
      <div class="sl-ps">
        ${it.priceWas?`<span class="sl-was">${it.priceWas}</span>`:''}
        ${it.pricePrefix?`<span class="sl-pre">${it.pricePrefix}</span>`:''}
        <span class="sl-pr ${it.isFlash?'flash':''}">${it.price}</span>
      </div>
      ${(!it.outOfStock&&!it.nextBatch)?`<div class="sl-plus" data-add="${it.id}"></div>`:''}
    </div>
  </div>`;
}

// One product card (grid-2col / grid-3col).

      ${veil}
    </div>
    <div class="cn">${esc(it.name)}</div>
    ${it.hasVariants?`<span class="sl-vh">${esc(it.variantHint)}</span>`:''}
    <div class="sl-cfoot">
      <div class="sl-ps">
        ${it.priceWas?`<span class="sl-was">${it.priceWas}</span>`:''}
        ${it.pricePrefix?`<span class="sl-pre">${it.pricePrefix}</span>`:''}
        <span class="sl-pr ${it.isFlash?'flash':''}">${it.price}</span>

      ${(!it.outOfStock&&!it.nextBatch)?`<div class="sl-plus" data-add="${it.id}"></div>`:''}

function slRenderMain(){
  const main=$('#slMain');if(!main)return;
  if(!SL.sections.length){
    main.innerHTML=`<div class="sl-empty"><div class="et">${state.lang==='cn'?'暂无商品':'No products yet.'}</div><div class="es">${state.lang==='cn'?'请稍后再来':'Check back soon.'}</div></div>`;
    return;
  }
  const isList=SL_LIST.includes(SL.layout);
  const compact=SL.layout==='list-compact';
  const gcls=SL.layout==='grid-3col'?'g3':'g2';
  const html=SL.visible.map(sec=>`<div class="sl-sec" id="slsec-${sec.id}">`+
    sec.groups.map(g=>{
      const head=g.label?`<div class="sl-gh"><span class="k">${esc(g.label)}</span><span class="n">${g.countStr}</span></div>`:'';
      const body=isList
        ? g.items.map(it=>slRowHtml(it,compact)).join('')
        : `<div class="sl-grid ${gcls}">${g.items.map(slCardHtml).join('')}</div>`;
      return `<div class="sl-grp" data-gid="${g.id}">${head}${body}</div>`;
    }).join('')+`</div>`).join('');
  main.innerHTML=html;
  main.scrollTop=0;
  main.onclick=e=>{
    const plus=e.target.closest('[data-add]');
    if(plus){e.stopPropagation();slAdd(Number(plus.dataset.add));return;}
    const node=e.target.closest('[data-id]');
    if(node)location.hash='#/product/'+node.dataset.id;
  };
  // measure section offsets for scroll-sync
  setTimeout(slMeasure,60);
}

function slMeasure(){
  const main=$('#slMain');if(!main)return;
  SL.offsets=SL.visible.map(sec=>{
    const el=document.getElementById('slsec-'+sec.id);
    return {id:sec.id,name:sec.name,top:el?el.offsetTop:0};
  });
}

function slOnScroll(){
  if(SL.suppress&&Date.now()<SL.suppress)return;
  const main=$('#slMain');if(!main||!SL.offsets.length)return;
  const cutoff=main.scrollTop+Math.max(60,main.clientHeight*0.28);
  if(SL.drill){slSyncSub(cutoff);return;}  // highlight active subcategory
  if(main.scrollTop<=2){if(SL.activeCat!=='')slSetActive('',true);return;}
  if(cutoff<SL.offsets[0].top){if(SL.activeCat!=='')slSetActive('',true);return;}
  let name=SL.offsets[0].name;
  for(const s of SL.offsets){if(s.top<=cutoff)name=s.name;else break;}
  if(name!==SL.activeCat)slSetActive(name,true);
}

function slSetActive(name,fromScroll){
  SL.activeCat=name;
  const side=$('#slSide');if(!side)return;
  side.querySelectorAll('.sl-tab').forEach(t=>t.classList.toggle('on',(t.dataset.name||'')===name));
  if(fromScroll){
    const on=side.querySelector('.sl-tab.on');
    if(on)on.scrollIntoView({block:'nearest'});
  }
}

function slScrollToSection(id){
  const main=$('#slMain');const el=document.getElementById('slsec-'+id);
  if(!main||!el)return;
  SL.suppress=Date.now()+500;
  main.scrollTo({top:el.offsetTop,behavior:'smooth'});
  const sec=SL.sections.find(s=>s.id===id);
  if(sec)slSetActive(sec.name,true);
}

// ── Drill in / out ──────────────────────────────────────────────────
function slDrillInto(name){
  const sec=SL.sections.find(s=>s.name===name);if(!sec)return;
  SL.drill=name;SL.drillLabel=sec.label;SL.subTabs=sec.groups.map(g=>({id:g.id,label:g.label}));
  SL.activeCat=name;SL.activeSub='';SL.visible=[sec];
  SL.suppress=Date.now()+600;
  slRenderSide();slRenderMain();
}
function slDrillBack(){
  const prev=SL.drill;
  SL.drill='';SL.drillLabel='';SL.subTabs=[];SL.activeSub='';SL.visible=SL.sections;
  SL.suppress=Date.now()+600;
  slRenderSide();slRenderMain();
  setTimeout(()=>{const sec=SL.sections.find(s=>s.name===prev);if(sec){slMeasure();slScrollToSection(sec.id);}},120);
}
// Sub-rail: scroll the right pane to a subcategory group heading.
function slSetSub(gid){
  SL.activeSub=gid||'';
  const side=$('#slSide');if(side)side.querySelectorAll('.sl-tab').forEach(t=>t.classList.toggle('on',(t.dataset.sub||'')===(gid||'')));
  const main=$('#slMain');if(!main)return;
  SL.suppress=Date.now()+500;
  if(!gid){main.scrollTo({top:0,behavior:'smooth'});return;}
  const el=main.querySelector(`[data-gid="${gid}"]`);
  if(el)main.scrollTo({top:el.offsetTop,behavior:'smooth'});
}
function slSyncSub(cutoff){
  const main=$('#slMain');if(!main)return;
  if(main.scrollTop<=2){if(SL.activeSub!==''){SL.activeSub='';slMarkSub('');}return;}
  let active='';
  for(const g of SL.subTabs){
    const el=main.querySelector(`[data-gid="${g.id}"]`);
    if(el&&el.offsetTop<=cutoff)active=g.id;else if(el)break;
  }
  if(active!==SL.activeSub){SL.activeSub=active;slMarkSub(active);}
}
function slMarkSub(gid){
  const side=$('#slSide');if(!side)return;
  side.querySelectorAll('.sl-tab').forEach(t=>t.classList.toggle('on',(t.dataset.sub||'')===(gid||'')));
  const on=side.querySelector('.sl-tab.on');if(on)on.scrollIntoView({block:'nearest'});
}

// ── Quick-add + variant size-picker ─────────────────────────────────
function slAdd(id){
  const members=SL.members&&SL.members[id];
  if(members&&members.length>1){slOpenVp(id,members);return;}
  const raw=(SL.prods||[]).find(p=>Number(p.id)===Number(id));
  if(!raw)return;
  if(raw.has_options){location.hash='#/product/'+id;return;}  // needs a choice → PDP
  slAddRaw(raw);
}
function slAddRaw(raw){
  const price=slEff(raw);
  cartAdd({product_id:raw.id,qty:1,choices:[],
    name:pick(raw.name_en,raw.name_cn),
    price,image:slImg(raw),size:raw.size||'',optLabel:''});
  toast(state.lang==='cn'?'已加入 🌱':'Added 🌱');
}
function slOpenVp(repId,members){
  const L=state.lang;SL.vpRep=repId;
  const opts=members.map(m=>{
    const regular=Number(m.price??m.sell_price)||0,eff=slEff(m);
    const isFlash=!!m.is_on_flash&&eff<regular;
    const cmp=Number(m.compare_at_price)||0;
    const wasN=isFlash?regular:(cmp>eff&&eff>0?cmp:0);
    const stock=m.stock==null?null:Number(m.stock);
    const soldOut=stock!=null&&stock<=0;
    const label=pick(m.variant_label,m.variant_label_cn)||pick(m.name_en,m.name_cn)||('#'+m.id);
    return {id:m.id,label,weight:(m.size||'').toString().trim(),
      price:eff>0?slMoney(eff):'',priceWas:wasN>0?slMoney(wasN):'',isFlash,soldOut,
      low:(!soldOut&&stock!=null&&stock<=5)?(L==='cn'?`仅剩 ${stock}`:`Only ${stock} left`):''};
  });
  const rep=(SL.prods||[]).find(p=>Number(p.id)===Number(repId));
  const mask=document.createElement('div');mask.className='sl-vpmask';mask.id='slVpMask';
  mask.innerHTML=`<div class="sl-vp">
    <div class="sl-vp-h"><div>
      <div class="sl-vp-t">${L==='cn'?'选择规格':'Choose a size'}</div>
      ${rep?`<div class="sl-vp-n">${esc(pick(rep.name_en,rep.name_cn))}</div>`:''}
    </div><div class="sl-vp-x" id="slVpX">×</div></div>
    ${opts.map(o=>`<div class="sl-vp-o ${o.soldOut?'sold':''}" data-id="${o.id}">
      <div><span class="sl-vp-lb">${esc(o.label)}</span>${o.weight?`<span class="sl-vp-wt">${esc(o.weight)}</span>`:''}${o.low?`<span class="sl-vp-low">${esc(o.low)}</span>`:''}${o.soldOut?`<span class="sl-vp-wt">${L==='cn'?'售罄':'Sold out'}</span>`:''}</div>
      <div class="sl-vp-ps">${o.priceWas?`<span class="sl-vp-was">${o.priceWas}</span>`:''}<span class="sl-vp-pr">${o.price}</span></div>
    </div>`).join('')}
  </div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click',e=>{
    if(e.target===mask||e.target.id==='slVpX'){mask.remove();return;}
    const o=e.target.closest('.sl-vp-o');if(!o||o.classList.contains('sold'))return;
    const m=(SL.members[repId]||[]).find(x=>Number(x.id)===Number(o.dataset.id));
    if(m){mask.remove();slAddRaw(m);}
  });
}

/* ════════════ PRODUCT CARD ════════════ */
// Effective out-of-stock policy — mirror of effectiveOosPolicy() on the server.
// true  → sold-out item stays orderable for out-of-city shoppers (pre-order);
// false → strict, sold out everywhere. Blank policy falls back to is_batch_made.
function oosBackorder(p){
  const pol=(p&&p.oos_policy)||'';
  if(pol==='backorder_gz')return true;
  if(pol==='strict')return false;
  return !!(p&&p.is_batch_made);
}
// Browse-time stock verdict. The web storefront doesn't know the shopper's zone
// yet, so a backorder product is shown orderable (the server enforces the GZ
// same-day gate at checkout) while a strict sold-out item is a hard SOLD OUT.
// Untracked stock (null) counts as in stock.
function stockState(p){
  const vs=Array.isArray(p.variants)?p.variants:null;
  const out = (vs&&vs.length>1)
    ? vs.every(v=>v.stock!=null&&Number(v.stock)<=0)
    : (p.stock!=null&&Number(p.stock)<=0);
  if(!out) return {oos:false,soldOut:false,badge:''};
  if(oosBackorder(p)) return {oos:true,soldOut:false,
    badge:p.is_batch_made?(state.lang==='cn'?'下批现做':'NEXT BATCH'):(state.lang==='cn'?'现订现发':'SHIPS SOON')};
  return {oos:true,soldOut:true,badge:state.lang==='cn'?'售罄':'SOLD OUT'};
}
function cardHtml(p){
  const src=thumb(p),now=nowPrice(p),was=wasPrice(p);
  const ss=stockState(p);
  const off=was>0?Math.round((1-now/was)*100):0;
  const sold=Number(p.sold_count||p.units_sold||0);
  const other=altLang(p.name_en,p.name_cn);
  const tag=pick(p.tagline_en,p.tagline_cn);
  return `<a class="card${ss.soldOut?' is-oos':''}" href="#/product/${p.id}">
    <div class="ph">
      ${src?`<img src="${escAttr(src)}" alt="" loading="lazy">`:'<span class="none">no image</span>'}
      ${off>0?`<span class="badge">-${off}%</span>`:''}
      ${ss.oos?`<span class="oos-tag${ss.soldOut?' sold':' soon'}">${ss.badge}</span>`:''}
      ${sold>0?`<span class="pill-sold">${state.lang==='cn'?'已售 '+sold:sold+' sold'}</span>`:''}
    </div>
    <div class="body">
      <div class="nm">${esc(pick(p.name_en,p.name_cn))}${other?`<span class="cn">${esc(other)}</span>`:''}</div>
      ${tag?`<div class="tag">${esc(tag.slice(0,60))}</div>`:''}
      ${p.has_options?`<span class="opt-cue">${state.lang==='cn'?'多规格':'Options'}</span>`:''}
      <div class="prices"><span class="now">${money(now)}</span>${was>0?`<span class="was">${money(was)}</span>`:''}</div>
    </div>
  </a>`;
}
function skeletons(n){return Array.from({length:n}).map(()=>'<div class="skel"></div>').join('');}

/* ════════════ PRODUCT DETAIL ════════════ */
async function renderProduct(id){
  const view=$('#view');
  view.innerHTML=`<div class="wrap"><div class="crumb">${state.lang==='cn'?'加载中…':'Loading…'}</div></div>`;
  let p;
  try{ p=await api('/api/retail/products/'+encodeURIComponent(id)); }
  catch(e){ view.innerHTML=`<div class="wrap"><div class="empty">${state.lang==='cn'?'商品不存在或已下架。':'This product is unavailable.'}<br><a class="more" href="#/shop">← ${state.lang==='cn'?'返回商品':'Back to shop'}</a></div></div>`; return; }

  const now=nowPrice(p),was=wasPrice(p);
  const ss=stockState(p);
  const gallery=[thumb(p),...(Array.isArray(p.images)?p.images:[])].filter(Boolean)
    .filter((v,i,a)=>a.indexOf(v)===i).slice(0,8);
  const other=altLang(p.name_en,p.name_cn);
  const tag=pick(p.tagline_en,p.tagline_cn);
  const desc=pick(p.description_en,p.description_cn);
  const avg=Number(p.review_avg)||0, rc=Number(p.review_count)||0;

  // Description body: render the mini-app PRODUCT design-blocks when the product
  // uses them (identical to the mini-app); else fall back to plain rich text.
  let blocks=p.description_blocks;
  if(typeof blocks==='string'){ try{ blocks=JSON.parse(blocks); }catch{ blocks=null; } }
  const useBlocks = p.use_block_design && Array.isArray(blocks) && blocks.length && window.ShopProductBlocks;
  const descBody = useBlocks
    ? `<div class="shop-product-blocks">${ShopProductBlocks.render(blocks,{lang:state.lang})}</div>`
    : (desc?`<div class="pd-section"><h3>${state.lang==='cn'?'商品详情':'Description'}</h3><div class="desc">${desc}</div></div>`:'');

  const popts=Array.isArray(p.options)?p.options:[];
  const optsHtml=popts.length?`<div class="pd-opts" id="pdOpts">${popts.map(o=>{
    const multi=o.type==='multi';
    return `<div class="pd-opt" data-multi="${multi?1:0}" data-req="${o.is_required?1:0}">
      <div class="q">${esc(pick(o.question_en,o.question_cn))}${o.is_required?' <span class="req">*</span>':''}</div>
      <div class="choices">${(o.choices||[]).map(c=>`<button type="button" class="pd-choice" data-cid="${c.id}" data-delta="${Number(c.price_delta)||0}" data-label="${escAttr(pick(c.label_en,c.label_cn))}">${esc(pick(c.label_en,c.label_cn))}${Number(c.price_delta)?`<span class="delta">+${money(c.price_delta)}</span>`:''}</button>`).join('')}</div>
    </div>`;
  }).join('')}</div>`:'';

  const variants=Array.isArray(p.variants)?p.variants:[];
  const varsHtml=variants.length>1?`<div class="pd-section"><h3>${state.lang==='cn'?'规格':'Choose'}</h3><div class="variants">${
    variants.map(v=>`<a class="${v.id==p.id?'on':''}" href="#/product/${v.id}">${esc(pick(v.variant_label||v.name_en,v.variant_label_cn||v.name_cn))}</a>`).join('')
  }</div></div>`:'';

  const recent=Array.isArray(p.reviews_recent)?p.reviews_recent:[];
  const revHtml=rc>0?`<div class="pd-section"><h3>${state.lang==='cn'?'评价':'Reviews'} (${rc})</h3>
    ${recent.map(r=>{
      const rt=Math.max(0,Math.min(5,Math.round(Number(r.rating)||0)));
      const body=r.comment||r.body||r.text||r.content||'';
      const who=r.author_name||r.nickname||r.name||(state.lang==='cn'?'匿名':'Anonymous');
      return `<div class="review"><div class="head"><span class="stars">${'★'.repeat(rt)}<span class="off">${'★'.repeat(5-rt)}</span></span>
        <span class="who">${esc(who)}</span></div>${body?`<div class="body">${esc(body)}</div>`:''}</div>`;
    }).join('')}</div>`:'';

  view.innerHTML=`<div class="wrap">
    <div class="crumb"><a href="#/">${state.lang==='cn'?'首页':'Home'}</a> / <a href="#/shop">${state.lang==='cn'?'商品':'Shop'}</a> / ${esc(pick(p.name_en,p.name_cn))}</div>
    <div class="pd">
      <div class="pd-gallery">
        <div class="main">${gallery[0]?`<img id="pdMain" src="${escAttr(gallery[0])}" alt="">`:'<span class="card"></span>'}</div>
        ${gallery.length>1?`<div class="pd-thumbs" id="pdThumbs">${gallery.map((g,i)=>`<button class="${i===0?'on':''}" data-src="${escAttr(g)}"><img src="${escAttr(g)}" alt=""></button>`).join('')}</div>`:''}
      </div>
      <div class="pd-info">
        <h1>${esc(pick(p.name_en,p.name_cn))}</h1>
        ${other?`<div class="cn">${esc(other)}</div>`:''}
        ${tag?`<div class="tagline">${esc(tag)}</div>`:''}
        <div class="price-row">
          <span class="price-now">${money(now)}</span>
          ${was>0?`<span class="price-was">${money(was)}</span><span class="flash-tag">${state.lang==='cn'?'限时':'Flash'}</span>`:''}
          ${ss.oos?`<span class="pd-oos-tag${ss.soldOut?' sold':' soon'}">${ss.badge}</span>`:''}
        </div>
        ${ss.oos&&!ss.soldOut?`<div class="pd-oos-note">${state.lang==='cn'?'当前缺货，外地可预订，下批/补货后发出。':'Out of stock now — orderable outside Guangzhou; ships on the next batch / restock.'}</div>`:''}
        ${rc>0?`<div class="rating"><span class="stars">${'★'.repeat(Math.round(avg))}<span class="off">${'★'.repeat(5-Math.round(avg))}</span></span>${avg.toFixed(1)} · ${rc} ${state.lang==='cn'?'条评价':'reviews'}</div>`:''}
        ${varsHtml}
        ${optsHtml}
        <div class="pd-buy">
          ${ss.soldOut
            ? `<button class="btn-primary" id="addBtn" disabled>${state.lang==='cn'?'已售罄':'Sold out'}</button>`
            : `<div class="pd-qty"><button type="button" data-q="dec">−</button><span id="pdQty">1</span><button type="button" data-q="inc">+</button></div>
          <button class="btn-primary" id="addBtn">Add to cart</button>`}
        </div>
      </div>
    </div>
    <div class="pd-body">${descBody}${revHtml}</div>
  </div>`;

  document.title=pick(p.name_en,p.name_cn)+' · '+state.brand;
  const thumbs=$('#pdThumbs');
  if(thumbs) thumbs.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    $('#pdMain').src=b.dataset.src;thumbs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
  // purchase block: selectable options + qty + add-to-cart (works logged-out;
  // sign-in is required later at checkout). Server re-prices authoritatively.
  (function wirePurchase(){
    // Strict sold-out: the button is rendered disabled; skip wiring so refresh()
    // doesn't overwrite its "Sold out" label. (Backorder OOS stays orderable.)
    if(ss.soldOut) return;
    const base=nowPrice(p); let qty=1;
    const optsEl=$('#pdOpts');
    const chips=()=>optsEl?[...optsEl.querySelectorAll('.pd-choice.on')]:[];
    const unit=()=>chips().reduce((s,c)=>s+(Number(c.dataset.delta)||0),base);
    function refresh(){$('#addBtn').textContent=(state.lang==='cn'?'加入购物车 · ':'Add to cart · ')+money(unit()*qty);}
    if(optsEl){
      optsEl.addEventListener('click',e=>{const ch=e.target.closest('.pd-choice');if(!ch)return;
        const g=ch.closest('.pd-opt');
        if(g.dataset.multi==='1')ch.classList.toggle('on');
        else g.querySelectorAll('.pd-choice').forEach(x=>x.classList.toggle('on',x===ch));
        refresh();});
      // radios start with their first choice picked (mini-app parity)
      optsEl.querySelectorAll('.pd-opt[data-multi="0"]').forEach(g=>{const f=g.querySelector('.pd-choice');if(f)f.classList.add('on');});
    }
    $('.pd-qty').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.q==='inc')qty++;else if(b.dataset.q==='dec'&&qty>1)qty--;
      $('#pdQty').textContent=qty;refresh();});
    $('#addBtn').addEventListener('click',()=>{
      let missing=null;
      if(optsEl)optsEl.querySelectorAll('.pd-opt[data-req="1"]').forEach(g=>{if(!g.querySelector('.pd-choice.on'))missing=g;});
      if(missing){toast(state.lang==='cn'?'请选择必选项':'Please choose the required option');missing.scrollIntoView({block:'center',behavior:'smooth'});return;}
      const sel=chips();
      cartAdd({product_id:p.id,qty,choices:sel.map(c=>Number(c.dataset.cid)),
        name:pick(p.name_en,p.name_cn),price:unit(),image:thumb(p),
        optLabel:sel.map(c=>c.dataset.label).filter(Boolean).join(' · ')});
      toast(state.lang==='cn'?'已加入购物车 🌱':'Added to cart 🌱');
      openCart();
    });
    refresh();
  })();
}

/* ════════════ CHROME / INIT ════════════ */
function applyLangToUI(){
  document.querySelectorAll('#langToggle button, #mtLang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));
  $('#searchInput').placeholder=state.lang==='cn'?'搜索商品':'Search products';
  document.querySelector('nav.links [data-nav=home]').textContent=state.lang==='cn'?'首页':'Home';
  document.querySelector('nav.links [data-nav=shop]').textContent=state.lang==='cn'?'商品':'Shop';
  $('#footBrand').textContent=state.brand;
  // bottom tab labels
  const TB={home:['Home','首页'],shop:['Shop','商城'],cart:['Cart','购物车'],me:['Me','我的']};
  document.querySelectorAll('.tabitem').forEach(a=>{const x=TB[a.dataset.tab];const lb=a.querySelector('.ti-lb');
    if(x&&lb)lb.textContent=x[state.lang==='cn'?1:0];});
}

// Route a block-engine CTA target (data-cta-target) through our own router.
// Shopping targets navigate; account/cart targets are honest "coming soon".
function ctaRoute(t){
  t=String(t||'');
  if(!t) return;
  if(t.indexOf('product:')===0){ location.hash='#/product/'+t.slice(8); return; }
  if(t.indexOf('category:')===0){
    const key=t.slice(9); const c=state.cats.find(x=>String(x.id)===key||x.name===key);
    location.hash='#/shop'+(c?`?cat=${encodeURIComponent(c.name)}`:''); return;
  }
  if(t==='shop'){ location.hash='#/shop'; return; }
  if(t==='login'||t==='account'||t==='me'){ if(state.token&&state.customer) acctMenuToggle(true); else openLogin(); return; }
  if(t.indexOf('copy:')===0){ const code=t.slice(5);
    try{ navigator.clipboard.writeText(code); }catch{}
    toast((state.lang==='cn'?'已复制 ':'Copied ')+code); return; }
  // cart / wallet / coupons / voting / wecom / notifications / order:* → later phases
  toast(state.lang==='cn'?'此功能即将上线 🌱':'That feature is coming soon 🌱');
}

(async function boot(){
  // config first (theme + brand), then categories — both tenant-scoped by Host.
  try{ state.config=await api('/api/retail/config')||{}; }catch(e){ state.config={}; }
  try{ state.lang=localStorage.getItem('shop_lang')||'en'; }catch{}
  try{ state.token=localStorage.getItem('shop_token')||''; }catch{}
  // Capture a referral code from a shared ?ref= link and stash it for after
  // sign-in (applyPendingRef). Strip it from the URL so it isn't re-applied.
  try{ const ref=new URLSearchParams(location.search).get('ref');
    if(ref){ localStorage.setItem('pending_ref',ref);
      const u=new URL(location.href); u.searchParams.delete('ref'); history.replaceState(null,'',u.pathname+u.search+u.hash); } }catch{}
  if(!['en','cn'].includes(state.lang)) state.lang='en';
  applyTheme(state.config);
  state.brand=brandName(state.config);
  document.title=state.brand;
  try{ state.cats=(await api('/api/retail/category-tree?counts=1'))||[]; }catch(e){ state.cats=[]; }
  state.cats=state.cats.filter(c=>!c.count||c.count>0);

  $('#footMeta').textContent=location.hostname;
  applyLangToUI();
  document.querySelector('header.bar').hidden=false;
  $('#view').hidden=false;
  $('#footer').hidden=false;
  $('#tabbar').hidden=false;
  // mobile slim top bar (wordmark + lang) — desktop hides it via CSS
  $('#mtop').hidden=false;
  $('#mtWm').textContent=state.brand;
  $('#mtWm').style.cursor='pointer';
  $('#mtWm').addEventListener('click',()=>{location.hash='#/';});
  $('#mtLang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    state.lang=b.dataset.lang;try{localStorage.setItem('shop_lang',state.lang);}catch{}applyLangToUI();route();});

  // search submit → shop
  $('#searchForm').addEventListener('submit',e=>{e.preventDefault();
    const q=$('#searchInput').value.trim();location.hash='#/shop'+(q?`?q=${encodeURIComponent(q)}`:'');});
  // lang toggle
  $('#langToggle').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    state.lang=b.dataset.lang;try{localStorage.setItem('shop_lang',state.lang);}catch{}
    applyLangToUI();route();});
  // ── cart drawer ──
  cartBadge();
  $('#cartBtn').addEventListener('click',openCart);
  $('#cdClose').addEventListener('click',closeCart);
  $('#cartDrawer').addEventListener('click',(e)=>{if(e.target.id==='cartDrawer')closeCart();});
  $('#cdItems').addEventListener('click',(e)=>{const b=e.target.closest('button');if(!b)return;
    const row=e.target.closest('.cd-row');if(!row)return;const k=row.dataset.k;const l=cartGet().find(x=>x.key===k);if(!l)return;
    const a=b.dataset.act;
    if(a==='inc')cartSetQty(k,l.qty+1);
    else if(a==='dec')cartSetQty(k,l.qty-1);
    else if(a==='rm')cartRemove(k);});
  $('#cdCheckout').addEventListener('click',()=>{
    if(!cartCount())return;
    if(!state.token){closeCart();return openLogin();}
    closeCart();location.hash='#/checkout';
  });

  // ── account: header button → login modal (logged-out) or menu (logged-in) ──
  renderAcct();
  $('#acctBtn').addEventListener('click',(e)=>{e.stopPropagation();
    if(state.token&&state.customer) acctMenuToggle(); else openLogin();});
  $('#acctMenu').addEventListener('click',(e)=>{const b=e.target.closest('button');if(!b)return;
    const a=b.dataset.am;acctMenuToggle(false);
    if(a==='out'){clearAuth();toast(state.lang==='cn'?'已退出':'Signed out');if(parseHash().seg[0]!=='shop')location.hash='#/';else route();}
    else if(a==='orders')location.hash='#/orders';});
  document.addEventListener('click',()=>acctMenuToggle(false));  // click-away closes the menu
  // login modal wiring
  $('#lmClose').addEventListener('click',closeLogin);
  $('#loginModal').addEventListener('click',(e)=>{if(e.target.id==='loginModal')closeLogin();});
  $('#otpSendBtn').addEventListener('click',otpSend);
  $('#otpResend').addEventListener('click',otpSend);
  $('#otpVerifyBtn').addEventListener('click',otpVerify);
  $('#otpPhone').addEventListener('keydown',(e)=>{if(e.key==='Enter')otpSend();});
  $('#otpCode').addEventListener('keydown',(e)=>{if(e.key==='Enter')otpVerify();});
  if(state.token) loadCustomer().then(applyPendingRef);   // resolve the saved session (or silently drop it) + apply any ?ref=

  // Block-engine CTAs: every clickable in a rendered block carries
  // data-cta-target. Delegate clicks here and route them.
  $('#view').addEventListener('click',e=>{
    const el=e.target.closest('[data-cta-target]');
    if(!el) return;
    e.preventDefault();
    ctaRoute(el.getAttribute('data-cta-target'));
  });
  // Global navigation delegation for [data-go] (Me page + all sub-pages).
  $('#view').addEventListener('click',e=>{
    const g=e.target.closest('[data-go]'); if(!g) return;
    if((g.classList.contains('me-bucket')||g.classList.contains('me-stat'))&&!state.token){ openLogin(); return; }
    location.hash=g.dataset.go;
  });
  // When the block engine pulls lazy data (top-selling grids, flash sales) or a
  // countdown hits zero, re-render the home if that's where we are.
  if(window.ShopBlocks) ShopBlocks.onRerender(()=>{ if(parseHash().seg.length===0) renderHome(); });

  window.addEventListener('hashchange',route);
  await route();
  $('#boot').classList.add('gone');
})();
</script>
