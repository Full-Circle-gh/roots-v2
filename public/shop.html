<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2E7DF">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Storefront</title>
<style>
  /* ── Brand fonts (served from /assets/fonts, shared with the mini-app) ── */
  @font-face { font-family:'Bear Serif'; src:url('/assets/fonts/LilitaOne.ttf') format('truetype'); unicode-range:U+0024,U+0025,U+0030-0039,U+00A5; font-display:swap; }
  @font-face { font-family:'Bear Serif'; src:url('/assets/fonts/BearSerif.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'Toni Grotesk'; src:url('/assets/fonts/ToniGroteskPro.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'League Gothic'; src:url('/assets/fonts/LeagueGothic.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW5.ttf') format('truetype'); font-weight:500; font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW7.ttf') format('truetype'); font-weight:700; font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW9.ttf') format('truetype'); font-weight:900; font-display:swap; }
  @font-face { font-family:'Aleo'; src:url('/assets/fonts/Aleo-Regular.otf') format('opentype'); font-display:swap; }

  :root{
    --oat:#F2E7DF; --ink:#1a1a17; --forest:#365329; --olive:#6A6E2D; --lime:#CCD900;
    --berry:#E96174; --carrot:#FF6B0C; --papaya:#FFAF60; --corn:#F2CA6C;
    --sky:#B2CFED; --pea:#7BBD3B; --lotus:#EEB8E4; --pink:#F4B8CB; --citrus:#E7E74C;
    --accent:#365329;            /* overridden from tenant config at runtime */
    --paper:#fff; --line:rgba(0,0,0,.08); --muted:#7c7c72;
    --bf-bear:'Bear Serif','DF Yuan','New York',Georgia,serif;
    --bf-toni:'Toni Grotesk','DF Yuan',-apple-system,BlinkMacSystemFont,sans-serif;
    --bf-gothic:'League Gothic','DF Yuan','Bebas Neue',Impact,sans-serif;
    --bf-yuan:'DF Yuan','PingFang SC','Hiragino Sans GB',sans-serif;
    /* Font vars the ported block engines (blocks.css / product-blocks.css) use —
       MUST match the mini-app's --f-* names exactly, incl. Aleo for body copy. */
    --f-bear:'Bear Serif','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-toni:'Toni Grotesk','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,sans-serif;
    --f-gothic:'League Gothic','DF Yuan','PingFang SC','Hiragino Sans GB','Bebas Neue',sans-serif;
    --f-aleo:'Aleo','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-yuan:'DF Yuan','PingFang SC','Hiragino Sans GB',sans-serif;
    --wrap:1180px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--f-aleo);
    background:var(--oat); color:var(--ink);
    min-height:100dvh; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    display:flex; flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;cursor:pointer;}

  /* Boot splash */
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--oat);z-index:90;transition:opacity .35s;}
  #boot.gone{opacity:0;pointer-events:none;}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── Header ── */
  header.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);}
  .bar-in{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;gap:18px;padding:13px 20px;}
  .wordmark{font-family:var(--bf-bear);font-size:24px;letter-spacing:.3px;color:var(--accent);white-space:nowrap;}
  nav.links{display:flex;gap:18px;font-size:15px;}
  nav.links a{padding:4px 0;border-bottom:2px solid transparent;color:#4a4a44;}
  nav.links a.on,nav.links a:hover{color:var(--ink);border-color:var(--accent);}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:#FFFCF7;border:2px solid var(--ink);border-radius:0;padding:9px 16px;max-width:420px;}
  .search:focus-within{border-color:var(--ink);}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:transparent;color:var(--ink);}
  .search svg{width:17px;height:17px;color:var(--muted);flex:none;}
  .bar .spacer{flex:1;}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:0;border:2px solid var(--ink);background:#FFFCF7;color:var(--ink);}
  .iconbtn svg{width:19px;height:19px;}
  .lang{display:inline-flex;border:2px solid var(--ink);border-radius:0;overflow:hidden;background:#FFFCF7;}
  .lang button{border:0;background:transparent;padding:8px 13px;font-size:13px;font-family:var(--bf-toni);font-weight:600;letter-spacing:.04em;color:var(--olive);}
  .lang button.active{background:var(--lime);color:var(--ink);}

  main{flex:1;width:100%;}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px;}
  .sec{padding:34px 0;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:12px;}
  .kicker{font-family:var(--bf-gothic);letter-spacing:.18em;text-transform:uppercase;font-size:14px;color:var(--olive);}
  .ttl{font-family:var(--bf-bear);font-size:clamp(22px,3.4vw,30px);line-height:1.1;}
  .more{font-size:14px;color:var(--accent);font-weight:600;white-space:nowrap;}

  /* ── Hero ── */
  .hero{background:var(--accent);color:#fff;border-radius:0;padding:clamp(30px,6vw,64px);margin-top:26px;position:relative;overflow:hidden;}
  .hero h1{font-family:var(--bf-bear);font-size:clamp(32px,6vw,58px);line-height:1.02;margin-bottom:14px;}
  .hero p{font-size:clamp(15px,2.4vw,19px);max-width:46ch;opacity:.92;}
  .hero .cta{display:inline-block;margin-top:22px;background:var(--lime);color:var(--ink);font-family:var(--bf-toni);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:13px 26px;border-radius:999px;font-size:15px;}

  /* ── Product grid + cards ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
  /* Flat editorial cards — match the mini-app: no border / no rounding / no
     hover-lift, full-bleed image on an oat ground, square ink/lime badges. */
  .card{background:transparent;border:0;border-radius:0;overflow:visible;display:flex;flex-direction:column;}
  .card .ph{position:relative;aspect-ratio:4/5;background:var(--oat);overflow:hidden;}
  .card .ph img{width:100%;height:100%;object-fit:cover;}
  .card .ph .none{position:absolute;inset:0;display:grid;place-items:center;color:#c7c0b5;font-size:13px;}
  .card .body{padding:12px 2px 4px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card .nm{font-family:var(--f-aleo);font-size:16px;line-height:1.2;font-weight:500;}
  .card .nm .cn{display:block;font-family:var(--bf-yuan);font-size:13px;color:var(--olive);font-weight:500;margin-top:2px;}
  .card .tag{font-size:12.5px;color:var(--olive);line-height:1.35;}
  .card .prices{margin-top:auto;display:flex;align-items:baseline;gap:8px;padding-top:6px;}
  .card .now{font-family:var(--f-aleo);font-size:16px;color:var(--olive);}
  .card .was{font-size:13px;color:rgba(0,0,0,.4);text-decoration:line-through;}
  .badge{position:absolute;top:12px;left:12px;background:var(--ink);color:var(--lime);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:0;}
  .pill-sold{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;font-size:12px;letter-spacing:.12em;text-align:center;padding:6px 0;border-radius:0;}
  /* Out-of-stock tags. Strict = hard SOLD OUT (greyed card); backorder = orderable pre-order. */
  .oos-tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:0;text-transform:uppercase;}
  .oos-tag.sold{background:var(--ink);color:#fff;}
  .oos-tag.soon{background:var(--forest);color:#fff;}
  .card.is-oos .ph img{filter:grayscale(.55);opacity:.78;}
  .pd-oos-tag{font-size:12px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;text-transform:uppercase;}
  .pd-oos-tag.sold{background:rgba(0,0,0,.72);color:#fff;}
  .pd-oos-tag.soon{background:var(--accent,#6d9c2a);color:#fff;}
  .pd-oos-note{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--accent,#6d9c2a);}
  .opt-cue{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;align-self:flex-start;}

  /* ── Category chips ── */
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .chip{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 18px;font-family:var(--bf-toni);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);white-space:nowrap;}
  .chip.on{background:var(--ink);color:var(--oat);border-color:var(--ink);}
  .chip .n{opacity:.6;font-size:12px;margin-left:5px;}

  /* category tiles (home) */
  .cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .cattile{position:relative;aspect-ratio:4/3;border-radius:0;overflow:hidden;background:var(--olive);color:#fff;display:flex;align-items:flex-end;padding:14px;}
  .cattile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78;}
  .cattile .lbl{position:relative;font-family:var(--bf-bear);font-size:18px;text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .cattile .lbl .n{display:block;font-family:var(--bf-toni);font-size:12px;opacity:.85;font-weight:500;}

  /* ── Toolbar (shop) ── */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar .count{font-size:14px;color:var(--muted);}
  select.sort{font:inherit;font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:9px 14px;background:#FFFCF7;color:var(--ink);}

  /* ── Product detail ── */
  .pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;padding:30px 0 50px;}
  .pd-gallery .main{aspect-ratio:4/5;background:var(--oat);border-radius:0;overflow:hidden;}
  .pd-gallery .main img{width:100%;height:100%;object-fit:cover;}
  .pd-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .pd-thumbs button{width:64px;height:64px;border-radius:0;overflow:hidden;border:2px solid transparent;background:var(--oat);padding:0;}
  .pd-thumbs button.on{border-color:var(--ink);}
  .pd-thumbs img{width:100%;height:100%;object-fit:cover;}
  .pd h1{font-family:var(--bf-bear);font-size:clamp(26px,4vw,38px);line-height:1.06;}
  .pd .cn{font-family:var(--bf-yuan);font-size:18px;color:var(--muted);margin-top:4px;}
  .pd .tagline{font-size:16px;color:#54544c;margin-top:12px;line-height:1.5;}
  .pd .price-row{display:flex;align-items:baseline;gap:12px;margin:20px 0;}
  .pd .price-now{font-family:var(--bf-bear);font-size:34px;color:var(--ink);}
  .pd .price-was{font-size:17px;color:var(--muted);text-decoration:line-through;}
  .pd .flash-tag{background:var(--berry);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .pd .rating{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:18px;}
  .stars{color:var(--corn);letter-spacing:1px;}
  .stars .off{color:#dcd6cc;}
  .buybar{display:flex;gap:12px;margin:22px 0;}
  .btn-primary{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 30px;font-family:var(--bf-toni);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1;}
  .btn-ghost{background:#FFFCF7;border:2px solid var(--ink);border-radius:999px;padding:15px 20px;font-size:16px;}
  .pd-note{font-size:13px;color:var(--muted);margin-top:-8px;}
  .pd-section{border-top:1px solid var(--line);padding:22px 0;}
  .pd-section h3{font-family:var(--bf-bear);font-size:18px;margin-bottom:12px;}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .opt .q{font-weight:600;font-size:14px;margin-bottom:8px;}
  .opt .choices{display:flex;gap:8px;flex-wrap:wrap;}
  .opt .choice{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:#4a4a44;}
  .opt .choice .delta{color:var(--accent);font-weight:600;margin-left:5px;}
  .desc{font-size:15px;line-height:1.65;color:#3a3a34;}
  .desc img{border-radius:12px;margin:12px 0;}
  .desc h1,.desc h2,.desc h3{font-family:var(--bf-bear);margin:16px 0 8px;}
  .desc p{margin:10px 0;}
  .variants{display:flex;gap:10px;flex-wrap:wrap;}
  .variants a{border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;font-size:14px;background:#fff;}
  .variants a.on{border-color:var(--accent);color:var(--accent);font-weight:600;}
  .review{border-top:1px solid var(--line);padding:14px 0;}
  .review:first-child{border-top:0;}
  .review .head{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .review .who{font-weight:600;font-size:14px;}
  .review .when{font-size:12px;color:var(--muted);}
  .review .body{font-size:14px;color:#4a4a44;line-height:1.5;}

  .pd-body{max-width:760px;margin:6px auto 0;}
  .shop-product-blocks{margin-top:8px;}
  .crumb{font-size:13px;color:var(--muted);padding-top:18px;}
  .crumb a:hover{color:var(--accent);}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px;}
  .skel{background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px;aspect-ratio:.78;}
  @keyframes sk{to{background-position:-200% 0;}}

  footer{margin-top:auto;border-top:1px solid var(--line);background:#fff;}
  .foot-in{max-width:var(--wrap);margin:0 auto;padding:26px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;}
  .foot-in .fm{font-family:var(--bf-bear);color:var(--accent);font-size:18px;}

  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,24,.96);color:#f2f2ec;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:820px){
    .pd{grid-template-columns:1fr;gap:24px;}
  }
  @media(max-width:520px){
    .bar-in{flex-wrap:wrap;gap:10px 14px;}
    nav.links{order:1;gap:14px;}
    .search{order:3;max-width:none;flex-basis:100%;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  }
</style>
<link rel="stylesheet" href="/assets/shop/blocks.css">
<link rel="stylesheet" href="/assets/shop/product-blocks.css">
<script src="/assets/shop/blocks.js"></script>
<script src="/assets/shop/product-blocks.js"></script>
</head>
<body>
  <div id="boot"><div class="spin"></div></div>

  <div class="mtop" id="mtop" hidden>
    <span class="mt-wm" id="mtWm">Store</span>
    <span class="mt-lang" id="mtLang"><button data-lang="en">EN</button><button data-lang="cn">中</button></span>
  </div>

  <header class="bar" hidden>
    <div class="bar-in">
      <nav class="links">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/shop" data-nav="shop">Shop</a>
      </nav>
      <form class="search" id="searchForm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" placeholder="Search products" autocomplete="off">
      </form>
      <span class="spacer"></span>
      <div class="lang" id="langToggle">
        <button data-lang="en">EN</button><button data-lang="cn">中</button>
      </div>
      <button class="acctbtn" id="acctBtn">Sign in</button>
      <button class="iconbtn" id="cartBtn" title="Cart" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge" id="cartBadge" hidden>0</span>
      </button>
    </div>
  </header>

  <main id="view" hidden></main>

  <footer hidden id="footer">
    <div class="foot-in">
      <span class="fm" id="footBrand">Store</span>
      <span id="footMeta"></span>
    </div>
  </footer>

  <!-- ── Bottom tab bar (mobile only) — mirrors the mini-app custom-tab-bar:
       Home · Shop · Cart · Me. Inline SVGs reuse the mini-app's outline icon
       paths (custom-tab-bar/icons.js). Hidden ≥768px where the top nav lives. -->
  <style>
    .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:var(--oat);
      border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);}
    .tabbar:not([hidden]){display:flex;}
    .tabitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      padding:9px 0 7px;color:#7a6f64;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .12s;}
    .tabitem:active{transform:scale(.94);}
    .tabitem .ti-ic{position:relative;width:25px;height:25px;}
    .tabitem .ti-ic svg{width:25px;height:25px;display:block;}
    .tabitem .ti-lb{font-family:var(--bf-toni);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;}
    .tabitem.on{color:var(--accent);}
    .tabitem.on .ti-lb{font-weight:700;}
    .ti-badge{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
      background:var(--berry);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--oat);}
    .ti-badge[hidden]{display:none;}
    @media(min-width:768px){.tabbar{display:none!important;}}
    @media(max-width:767px){body{padding-bottom:calc(56px + env(safe-area-inset-bottom));}}

    /* ── Me page (#/me) — port of the mini-app me page. Namespaced .me-* so it
         never collides with the storefront's existing .hero/.kicker/.title. ── */
    .me-hero{background:var(--lime);padding:38px 22px 60px;position:relative;overflow:hidden;min-height:210px;}
    .me-hero-ip{position:absolute;right:6px;bottom:-4px;width:150px;height:auto;pointer-events:none;mix-blend-mode:multiply;}
    .me-hero-in{position:relative;z-index:1;max-width:64%;}
    .me-kicker{font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--forest);}
    .me-title{font-family:var(--bf-bear);font-size:40px;line-height:1.04;margin-top:8px;color:var(--ink);}
    .me-meta{margin-top:10px;font-size:13px;color:var(--forest);}
    .me-cta{display:inline-block;margin-top:12px;font-family:var(--bf-toni);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:underline;cursor:pointer;}
    .me-stats{display:flex;background:var(--ink);color:#fff;margin:-26px 22px 0;position:relative;z-index:2;}
    .me-stat{flex:1;text-align:left;padding:14px 14px;border-left:1px solid rgba(255,255,255,.18);background:none;border-top:0;border-right:0;border-bottom:0;cursor:default;font:inherit;}
    .me-stat:first-child{border-left:0;}
    .me-stat.tap{cursor:pointer;}
    .me-stat .v{font-family:var(--bf-bear);font-size:22px;color:var(--lime);line-height:1.1;}
    .me-stat .l{display:block;font-family:var(--bf-toni);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:3px;}
    .me-section{padding:26px 22px 0;}
    .me-sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;}
    .me-sec-title{font-family:var(--bf-bear);font-size:23px;color:var(--ink);}
    .me-viewall{font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);text-decoration:underline;}
    .me-buckets{display:flex;justify-content:space-between;gap:2px;}
    .me-bucket{flex:1;text-align:center;padding:2px 0;cursor:pointer;background:none;border:0;font:inherit;}
    .me-bk-ic{width:44px;height:44px;margin:0 auto 8px;position:relative;}
    .me-bk-ic svg{width:44px;height:44px;display:block;}
    .me-bk-badge{position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--berry);color:#fff;font-size:10px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--oat);}
    .me-bk-lb{font-family:var(--bf-toni);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}
    .me-rows{margin-top:26px;}
    .me-row{display:flex;align-items:center;gap:12px;width:100%;padding:15px 22px;border-top:1px solid rgba(0,0,0,.1);border-left:0;border-right:0;border-bottom:0;background:none;cursor:pointer;text-align:left;font:inherit;}
    .me-row:last-child{border-bottom:1px solid rgba(0,0,0,.1);}
    .me-row .rbody{flex:1;min-width:0;}
    .me-row .rt{display:block;font-family:var(--bf-bear);font-size:16px;color:var(--ink);}
    .me-row .rmeta{display:block;font-size:12px;color:var(--olive);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .me-row .ra{font-family:var(--bf-bear);font-size:19px;color:var(--olive);}
    .me-row.fg .rt,.me-row.fg .ra{color:var(--forest);}
    .me-row.danger .rt,.me-row.danger .ra{color:var(--berry);}
    .me-rbadge{display:inline-block;min-width:18px;height:18px;padding:0 5px;margin-left:8px;border-radius:999px;background:var(--berry);color:#fff;font-family:var(--bf-toni);font-size:10px;font-weight:700;line-height:18px;text-align:center;vertical-align:middle;}
    .me-lang{padding:30px 22px 0;}
    .me-lang .ll{font-family:var(--bf-toni);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);}
    .me-lang-row{display:flex;gap:8px;margin-top:10px;}
    .me-lang-opt{flex:1;padding:13px;border:2px solid var(--ink);text-align:center;font-family:var(--bf-toni);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--ink);}
    .me-lang-opt.on{background:var(--ink);color:var(--oat);}
    .me-legal{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:34px;padding:8px 22px;}
    .me-legal-a{font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);text-decoration:underline;cursor:pointer;}
    .me-legal-sep{color:var(--olive);opacity:.5;}
    .me-footer{margin-top:18px;padding:20px 22px 36px;text-align:center;opacity:.55;}
    .me-fm{font-family:var(--bf-bear);font-size:26px;color:var(--olive);letter-spacing:1px;}
    .me-fm-img{max-width:170px;max-height:60px;margin:0 auto 4px;display:block;object-fit:contain;}
    .me-fsub{font-size:11px;margin-top:6px;color:var(--olive);}

    /* ── Cart page (#/cart) — full-page cart so the Cart tab has a destination ── */
    .cp{max-width:560px;margin:0 auto;padding:18px 22px 24px;}
    .cp-h{font-family:var(--bf-bear);font-size:30px;margin-bottom:14px;}
    .cp-foot{position:sticky;bottom:calc(56px + env(safe-area-inset-bottom));background:var(--oat);border-top:2px solid var(--ink);padding:14px 0 2px;margin-top:6px;}
    .cp-sub{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
    .cp-sub .l{font-size:13px;color:var(--olive);} .cp-sub .v{font-family:var(--bf-gothic);font-size:24px;}
    .cp-checkout{width:100%;font-family:var(--bf-toni);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:16px;cursor:pointer;}
    .cp-empty{text-align:center;color:var(--olive);padding:70px 22px;}

    /* ── Mobile chrome: hide the desktop top nav, show a slim title bar (the
         mini-app has no top nav — search lives inside the Shop page). ── */
    .mtop{display:none;}
    @media(max-width:767px){
      header.bar{display:none!important;}
      .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;
        background:var(--oat);border-bottom:1.5px solid var(--ink);padding:11px 18px;}
      .mtop .mt-wm{flex:1;font-family:var(--bf-bear);font-size:21px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .mtop .mt-lang{display:inline-flex;border:2px solid var(--ink);overflow:hidden;}
      .mtop .mt-lang button{border:0;background:transparent;padding:6px 12px;font-family:var(--bf-toni);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--olive);cursor:pointer;}
      .mtop .mt-lang button.active{background:var(--lime);color:var(--ink);}
    }
    /* in-page Shop search (mobile uses this; desktop keeps the header search) */
    .shop-search{display:flex;align-items:center;gap:10px;background:#FFFCF7;border:2px solid var(--ink);padding:11px 16px;margin:14px 0 4px;}
    .shop-search svg{width:18px;height:18px;color:var(--olive);flex:none;}
    .shop-search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);}
    @media(min-width:768px){.shop-search{display:none;}}

    /* ── Shared sub-page shell (.sp-*) for Me's linked pages ── */
    .sp{max-width:600px;margin:0 auto;padding:0 0 36px;}
    .sp-head{padding:22px 22px 4px;}
    .sp-kicker{font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--olive);}
    .sp-title{font-family:var(--bf-bear);font-size:34px;line-height:1.02;color:var(--ink);margin-top:4px;}
    .sp-sub{font-size:13px;color:var(--olive);margin-top:8px;line-height:1.45;}
    .sp-back{display:inline-flex;align-items:center;gap:6px;margin:14px 22px 2px;font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);cursor:pointer;}
    .sp-empty{text-align:center;color:var(--olive);padding:64px 22px;line-height:1.6;}
    .sp-tabs{display:flex;gap:8px;padding:14px 22px 6px;}
    .sp-tab{flex:1;padding:10px;border:2px solid var(--ink);text-align:center;font-family:var(--bf-toni);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;background:transparent;color:var(--olive);cursor:pointer;}
    .sp-tab.on{background:var(--ink);color:var(--oat);}
    .sp-card{margin:14px 22px 0;border:2px solid var(--ink);background:#fff;padding:16px 18px;}
    .sp-card.lime{background:var(--lime);border-color:var(--ink);}
    .sp-card.ink{background:var(--ink);color:#fff;}
    .sp-list{margin-top:8px;}
    .sp-li{display:flex;gap:12px;align-items:flex-start;padding:14px 22px;border-top:1px solid rgba(0,0,0,.1);}
    .sp-li .sp-main{flex:1;min-width:0;}
    .sp-li .sp-t{font-family:var(--bf-bear);font-size:15px;color:var(--ink);line-height:1.25;}
    .sp-li .sp-d{font-size:12.5px;color:var(--olive);margin-top:3px;line-height:1.4;}
    .sp-li .sp-amt{font-family:var(--bf-gothic);font-size:18px;letter-spacing:.02em;white-space:nowrap;}
    .sp-pos{color:var(--pea);} .sp-neg{color:var(--berry);}
    .sp-row-in{display:flex;gap:8px;padding:12px 22px 2px;}
    .sp-input{flex:1;font:inherit;font-size:15px;padding:12px 14px;border:2px solid var(--ink);background:#fff;color:var(--ink);}
    .sp-input::placeholder{color:#a59c8f;}
    textarea.sp-input{resize:vertical;min-height:120px;font-family:var(--f-aleo);}
    .sp-btn{font-family:var(--bf-toni);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;}
    .sp-btn:disabled{opacity:.5;cursor:default;}
    .sp-btn.ink{background:var(--ink);} .sp-btn.block{width:100%;}
    .sp-btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:0;}
    .sp-foot{padding:18px 22px;}
    .sp-chip{display:inline-block;padding:3px 10px;border-radius:0;font-family:var(--bf-toni);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--lime);}
    .sp-msg{font-size:13px;color:var(--berry);padding:8px 22px 0;min-height:16px;}
    /* coupon sticker */
    .cpn{display:flex;align-items:stretch;margin:14px 22px 0;border:2px solid var(--ink);background:var(--corn);}
    .cpn.used{opacity:.5;}
    .cpn .cpn-l{flex:1;padding:14px 16px;}
    .cpn .cpn-big{font-family:var(--bf-bear);font-size:26px;line-height:1;color:var(--ink);}
    .cpn .cpn-sub{font-size:12px;color:var(--ink);opacity:.8;margin-top:6px;}
    .cpn .cpn-r{width:96px;border-left:2px dashed rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-family:var(--bf-toni);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}
    /* favorites grid (reuse .grid/.card) */
    .fav-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 22px 0;}
    /* membership ladder */
    .tier-now{margin:14px 22px 0;padding:20px;border:2px solid var(--ink);text-align:center;}
    .tier-now .tn-name{font-family:var(--bf-bear);font-size:30px;color:var(--ink);}
    .tier-bar{height:12px;background:rgba(0,0,0,.1);margin:14px 0 6px;overflow:hidden;}
    .tier-bar > i{display:block;height:100%;background:var(--accent);}
    .tier-step{display:flex;gap:12px;align-items:flex-start;padding:14px 22px;border-top:1px solid rgba(0,0,0,.1);}
    .tier-dot{width:14px;height:14px;border-radius:999px;border:2px solid var(--ink);margin-top:4px;flex:none;}
    .tier-step.on .tier-dot{background:var(--lime);}
    .tier-step .ts-name{font-family:var(--bf-bear);font-size:16px;color:var(--ink);}
    .tier-step .ts-perk{font-size:12.5px;color:var(--olive);margin-top:3px;line-height:1.45;}
    /* notifications */
    .ntf-dot{width:8px;height:8px;border-radius:999px;background:var(--berry);margin-top:6px;flex:none;}
    /* about */
    .about-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(0,0,0,.12);margin:18px 22px 0;border:2px solid var(--ink);}
    .about-stat{background:var(--oat);padding:16px;}
    .about-stat .as-v{font-family:var(--bf-bear);font-size:26px;color:var(--ink);}
    .about-stat .as-l{font-family:var(--bf-toni);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-top:2px;}
    .about-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px 22px 0;}
    .about-col h4{font-family:var(--bf-toni);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
    .about-col li{list-style:none;font-size:13px;line-height:1.7;color:var(--ink);}
    /* poll */
    .poll-opt{display:flex;align-items:center;gap:10px;padding:13px 16px;border:2px solid var(--ink);margin-top:10px;cursor:pointer;position:relative;overflow:hidden;background:#fff;}
    .poll-opt .po-bar{position:absolute;inset:0;background:var(--lime);opacity:.35;z-index:0;}
    .poll-opt .po-txt,.poll-opt .po-pct{position:relative;z-index:1;}
    .poll-opt .po-txt{flex:1;font-family:var(--bf-bear);font-size:15px;}
    .poll-opt.on{border-color:var(--accent);}

    /* ════════ Shop — mobile LIST layout (faithful port of the mini-app shop
         list view: CATEGORIES header · search · view-switcher · dietary chips ·
         left category rail + grouped product list). Rendered only <768px;
         desktop keeps its own PC-native grid. Sizes ≈ mini-app rpx × 0.5. ════ */
    .shoplist{display:flex;flex-direction:column;overflow:hidden;}
    .sl-hd{padding:18px 22px 8px;text-align:center;}
    .sl-hd .t{font-family:var(--bf-bear);font-size:21px;letter-spacing:.04em;color:var(--ink);}
    .sl-search{display:flex;align-items:center;gap:8px;margin:6px 22px 10px;padding:9px 12px;background:#FFFCF7;border:1.5px solid var(--ink);}
    .sl-search .ic{font-size:15px;opacity:.55;flex:none;}
    .sl-search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);}
    .sl-search .clr{width:22px;text-align:center;color:var(--olive);font-size:18px;cursor:pointer;flex:none;}
    .sl-vs{display:flex;justify-content:flex-end;gap:5px;padding:0 22px 6px;}
    .sl-vs button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:1.5px solid rgba(0,0,0,.2);color:var(--olive);font-size:15px;line-height:1;border-radius:0;}
    .sl-vs button.on{background:var(--ink);border-color:var(--ink);color:var(--lime);}
    .sl-diet{display:flex;gap:6px;overflow-x:auto;padding:2px 22px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .sl-diet::-webkit-scrollbar{display:none;}
    .sl-diet .c{flex:none;padding:5px 13px;background:rgba(0,0,0,.04);color:var(--olive);border:1.5px solid transparent;border-radius:999px;font-family:var(--bf-toni);font-weight:700;font-size:11px;letter-spacing:.08em;white-space:nowrap;cursor:pointer;}
    .sl-diet .c.on{background:var(--lime);color:var(--ink);border-color:var(--ink);}
    .sl-body{flex:1;display:flex;min-height:0;border-top:1.5px solid rgba(0,0,0,.1);}
    .sl-side{width:92px;flex:none;background:var(--oat);border-right:1.5px solid var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .sl-side::-webkit-scrollbar{display:none;}
    .sl-tab{display:flex;align-items:center;justify-content:center;gap:2px;padding:16px 5px;text-align:center;border-bottom:1.5px solid rgba(0,0,0,.08);cursor:pointer;}
    .sl-tab .lb{font-family:var(--bf-bear);font-size:13px;line-height:1.15;color:var(--ink);}
    .sl-tab.on{background:var(--lime);}
    .sl-tab .chev{flex:none;width:10px;text-align:center;color:var(--olive);font-size:13px;line-height:1;}
    .sl-tab.has-chev::before{content:'';flex:none;width:10px;}
    .sl-tab.on .chev{color:var(--ink);}
    .sl-back{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 6px;background:var(--olive);cursor:pointer;}
    .sl-back .cv{color:var(--oat);font-size:18px;line-height:1;}
    .sl-back .tx{color:var(--oat);font-size:10px;letter-spacing:.04em;font-family:var(--bf-bear);}
    .sl-parent{padding:9px 6px 7px;text-align:center;font-size:10px;letter-spacing:.14em;color:var(--olive);border-bottom:1.5px solid rgba(0,0,0,.12);font-family:var(--bf-toni);text-transform:uppercase;}
    /* Rail fold — the left menu hinges open like an accordion (each row drops
       from its top edge, staggered) when the rail content changes (drill in/out
       or first load), mirroring the mini-app .rail-pane railFold. Highlight
       toggles don't re-mount rows, so they never replay it. */
    .sl-side{perspective:600px;}
    @keyframes slRailFold{from{opacity:0;transform:rotateX(-62deg);}to{opacity:1;transform:rotateX(0);}}
    .sl-side>.sl-tab,.sl-side>.sl-back,.sl-side>.sl-parent{transform-origin:top center;animation:slRailFold .3s cubic-bezier(.34,.8,.4,1) both;}
    .sl-side>*:nth-child(1){animation-delay:0s;}
    .sl-side>*:nth-child(2){animation-delay:.035s;}
    .sl-side>*:nth-child(3){animation-delay:.07s;}
    .sl-side>*:nth-child(4){animation-delay:.105s;}
    .sl-side>*:nth-child(5){animation-delay:.14s;}
    .sl-side>*:nth-child(6){animation-delay:.175s;}
    .sl-side>*:nth-child(7){animation-delay:.21s;}
    .sl-side>*:nth-child(8){animation-delay:.245s;}
    .sl-side>*:nth-child(9){animation-delay:.28s;}
    .sl-side>*:nth-child(10){animation-delay:.315s;}
    .sl-side>*:nth-child(11){animation-delay:.35s;}
    .sl-side>*:nth-child(12){animation-delay:.385s;}
    .sl-side>*:nth-child(13){animation-delay:.42s;}
    .sl-side>*:nth-child(14){animation-delay:.455s;}
    .sl-side>*:nth-child(n+15){animation-delay:.49s;}
    /* Right pane fades as it swaps contents on drill — matches the rail fold. */
    @keyframes slPaneFade{from{opacity:0;}to{opacity:1;}}
    .sl-main>.sl-sec{animation:slPaneFade .34s cubic-bezier(.22,.61,.36,1) both;}
    .sl-main{flex:1;min-width:0;background:#FFFCF7;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;}
    .sl-sec+.sl-sec{border-top:6px solid var(--oat);}
    .sl-gh{padding:14px 16px 7px;display:flex;align-items:baseline;justify-content:space-between;}
    .sl-gh .k{font-family:var(--bf-toni);font-size:11px;letter-spacing:.2em;color:var(--olive);text-transform:uppercase;}
    .sl-gh .n{font-family:var(--bf-gothic);font-size:19px;color:var(--olive);letter-spacing:.04em;}
    .sl-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1.5px solid rgba(0,0,0,.08);cursor:pointer;}
    .sl-row.compact{padding:16px;gap:0;}
    .sl-img{width:88px;height:106px;flex:none;background:var(--oat);overflow:hidden;position:relative;}
    .sl-img img{width:100%;height:100%;object-fit:cover;display:block;}
    .sl-rb{flex:1;min-width:0;}
    .sl-nm{font-family:var(--bf-bear);font-size:15px;line-height:1.35;color:var(--ink);}
    .sl-row.compact .sl-nm{font-size:17px;}
    .sl-sub{font-family:var(--bf-yuan);font-size:11px;color:var(--olive);margin-top:4px;line-height:1.35;}
    .sl-sold{margin-top:3px;font-weight:700;font-size:9px;letter-spacing:.12em;color:var(--olive);font-family:var(--bf-toni);}
    .sl-bd{display:inline-block;margin-top:7px;background:var(--ink);color:var(--lime);padding:3px 7px;font-size:11px;letter-spacing:.08em;font-family:var(--bf-gothic);line-height:1;}
    .sl-flash{display:inline-block;margin-top:7px;background:var(--berry);color:#fff;font-weight:700;padding:3px 7px;font-size:11px;letter-spacing:.08em;font-family:var(--bf-toni);line-height:1;}
    .sl-flash+.sl-bd{margin-left:5px;}
    .sl-vh{display:inline-block;margin-top:9px;padding:2px 9px;background:var(--lime);color:var(--ink);border-radius:999px;font-size:9px;font-weight:700;font-family:var(--bf-toni);letter-spacing:.04em;line-height:1.3;}
    .sl-vh+.sl-bd,.sl-vh+.sl-flash{margin-left:5px;}
    .sl-oos{display:inline-block;margin-top:5px;margin-left:4px;background:rgba(0,0,0,.1);color:var(--olive);padding:1px 7px;font-size:10px;letter-spacing:.1em;font-family:var(--bf-toni);line-height:1.4;}
    .sl-oos.batch{background:rgba(54,83,41,.12);color:var(--forest);}
    .sl-rr{text-align:right;min-width:44px;display:flex;flex-direction:column;align-items:flex-end;flex:none;}
    .sl-ps{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;}
    .sl-pre{font-size:9px;color:var(--olive);font-family:var(--bf-toni);line-height:1;}
    .sl-was{font-size:11px;color:rgba(0,0,0,.4);text-decoration:line-through;line-height:1;}
    .sl-pr{font-family:var(--bf-bear);font-size:16px;color:var(--ink);letter-spacing:.04em;line-height:1;}
    .sl-pr.flash{color:var(--berry);font-weight:700;}
    .sl-plus{position:relative;width:26px;height:26px;background:var(--ink);color:var(--lime);margin-top:8px;font-size:0;flex:none;}
    .sl-plus::before,.sl-plus::after{content:"";position:absolute;top:50%;left:50%;background:currentColor;transform:translate(-50%,-50%);}
    .sl-plus::before{width:13px;height:2.5px;}
    .sl-plus::after{width:2.5px;height:13px;}
    /* grid + compact-grid modes inside the right pane */
    .sl-grid{display:grid;gap:16px;padding:12px 16px;}
    .sl-grid.g2{grid-template-columns:1fr 1fr;}
    .sl-grid.g3{grid-template-columns:1fr 1fr 1fr;gap:9px;padding:12px;}
    .sl-card{display:flex;flex-direction:column;cursor:pointer;}
    .sl-ci{width:100%;aspect-ratio:4/5;background:var(--oat);overflow:hidden;position:relative;}
    .sl-ci img{width:100%;height:100%;object-fit:cover;display:block;}

<script>
/* ════════════════════════════════════════════════════════════════════════
   Web storefront — Phase 1a (the shoppable core).

   Tenant is resolved SERVER-SIDE from the request Host (this page sends no
   x-wx-appid), so every /api/retail/* call returns THIS tenant's catalogue.
   Pages: home, shop (grid + search + category + sort), product detail.
   Cart / checkout / accounts arrive in later phases — the "order" CTAs are
   honest stubs for now. The operator's exact CMS home blocks (Phase 1b) will
   render via a shared block engine; today the home shows a clean auto-layout.
   ════════════════════════════════════════════════════════════════════════ */
const state = { lang:'en', config:{}, brand:'Store', cats:[], productCache:new Map(), token:'', customer:null };

/* ── tiny helpers ── */
const $ = (s,r=document)=>r.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return esc(s);}
function pick(en,cn){const a=(en||'').trim(),b=(cn||'').trim();return state.lang==='cn'?(b||a):(a||b);}
function altLang(en,cn){return state.lang==='cn'?(en||'').trim():(cn||'').trim();}  /* the OTHER language line */
function money(n){return '¥'+(Number(n)||0).toFixed(2);}
function thumb(p){return p&&(p.image_url||p.image_data)||'';}
function isFlash(p){return p&&p.flash&&p.flash.state==='active';}
function nowPrice(p){return isFlash(p)?(Number(p.flash.price)||0):(Number(p.price)||0);}
function wasPrice(p){return isFlash(p)&&Number(p.price)>Number(p.flash.price)?Number(p.price):0;}
function catLabel(c){return pick(c.name,c.name_cn);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),2400);}

function authHeaders(h){h=h||{};if(state.token)h['Authorization']='Bearer '+state.token;return h;}
async function api(path){
  const r=await fetch(path,{headers:authHeaders({'Accept':'application/json'})});
  if(r.status===401) clearAuth();   // token expired/invalid → drop it silently
  if(!r.ok) throw new Error(path+' → '+r.status);
  const j=await r.json();
  return j&&('data'in j)?j.data:j;
}
// POST JSON; throws an Error whose .code is the server's error string.
async function postJson(path,body){
  const r=await fetch(path,{method:'POST',headers:authHeaders({'Accept':'application/json','Content-Type':'application/json'}),body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||('http_'+r.status));e.code=j.error;e.status=r.status;throw e;}
  return j&&('data'in j)?j.data:j;
}

/* ════════════ ACCOUNT (phone-OTP login) ════════════ */
function setAuth(token,customer){state.token=token||'';state.customer=customer||null;
  try{token?localStorage.setItem('shop_token',token):localStorage.removeItem('shop_token');}catch{}
  renderAcct();}
function clearAuth(){setAuth('',null);}
async function loadCustomer(){if(!state.token)return;
  try{state.customer=await api('/api/retail/customer');}catch(e){/* 401 already cleared */}
  renderAcct();}
// Apply a referral code captured from a ?ref= share link, once the visitor is
// signed in. Silent + one-shot (clears the stash regardless; already-referred
// etc. are expected no-ops). Web-native equivalent of the mini-app's invite.
async function applyPendingRef(){

/* login modal */
let _otpTimer=null;
function lmErr(msg){$('#lmErr').textContent=msg||'';}
function openLogin(){lmErr('');$('#lmPhoneStep').hidden=false;$('#lmCodeStep').hidden=true;
  $('#otpCode').value='';$('#loginModal').hidden=false;setTimeout(()=>$('#otpPhone').focus(),50);}
function closeLogin(){$('#loginModal').hidden=true;clearInterval(_otpTimer);}
function otpCooldown(secs){
  const btn=$('#otpResend');let n=secs||60;clearInterval(_otpTimer);
  const tick=()=>{if(n<=0){clearInterval(_otpTimer);btn.disabled=false;btn.textContent=state.lang==='cn'?'重新发送':'Resend code';return;}
    btn.disabled=true;btn.textContent=(state.lang==='cn'?'重新发送 ':'Resend in ')+n+'s';n--;};
  tick();_otpTimer=setInterval(tick,1000);
}
async function otpSend(){
  const phone=($('#otpPhone').value||'').replace(/\D/g,'');
  if(!/^1\d{10}$/.test(phone)){lmErr(state.lang==='cn'?'请输入11位手机号':'Enter an 11-digit phone number');return;}
  lmErr('');const btn=$('#otpSendBtn');btn.disabled=true;
  try{
    const d=await postJson('/api/retail/auth/otp/request',{phone});
    $('#lmPhoneStep').hidden=true;$('#lmCodeStep').hidden=false;
    $('#lmSub').textContent=(state.lang==='cn'?'验证码已发送至 ':'Code sent to ')+phone;
    setTimeout(()=>$('#otpCode').focus(),50);
    otpCooldown(d&&d.cooldown||60);
    if(d&&d.dev&&d.code){$('#otpCode').value=d.code;toast('DEV code '+d.code);}  // dev-echo only
  }catch(e){
    if(e.code==='too_soon'){$('#lmPhoneStep').hidden=true;$('#lmCodeStep').hidden=false;otpCooldown(60);}
    else if(e.code==='sms_unavailable')lmErr(state.lang==='cn'?'短信服务尚未配置，请稍后再试':'SMS isn’t set up yet — please try later');
    else if(e.code==='daily_cap')lmErr(state.lang==='cn'?'今日请求过多':'Too many requests today');
    else lmErr(state.lang==='cn'?'发送失败':'Could not send code');
  }finally{btn.disabled=false;}
}
async function otpVerify(){
  const phone=($('#otpPhone').value||'').replace(/\D/g,'');
  const code=($('#otpCode').value||'').replace(/\D/g,'');
  if(!/^\d{6}$/.test(code)){lmErr(state.lang==='cn'?'请输入6位验证码':'Enter the 6-digit code');return;}
  lmErr('');const btn=$('#otpVerifyBtn');btn.disabled=true;
  try{
    const d=await postJson('/api/retail/auth/otp/verify',{phone,code});
    setAuth(d.token,d.customer);closeLogin();
    toast(state.lang==='cn'?'登录成功 🌱':'Signed in 🌱');
    applyPendingRef();
    route();
  }catch(e){
    if(e.code==='bad_code')lmErr(state.lang==='cn'?'验证码错误':'Incorrect code');
    else if(e.code==='code_expired')lmErr(state.lang==='cn'?'验证码已过期，请重新发送':'Code expired — resend');
    else if(e.code==='too_many_attempts')lmErr(state.lang==='cn'?'尝试过多，请重新发送':'Too many tries — resend');
    else lmErr(state.lang==='cn'?'登录失败':'Sign-in failed');
  }finally{btn.disabled=false;}
}

function cartGet(){try{return JSON.parse(localStorage.getItem('shop_cart')||'[]')||[];}catch{return[];}}
function cartSave(c){try{localStorage.setItem('shop_cart',JSON.stringify(c));}catch{}cartBadge();}
function cartCount(){return cartGet().reduce((n,l)=>n+(l.qty||0),0);}
function cartSubtotal(){return cartGet().reduce((s,l)=>s+(Number(l.price)||0)*(l.qty||0),0);}
function cartBadge(){const n=cartCount();const lbl=n>99?'99+':String(n);
  const b=$('#cartBadge');if(b){b.textContent=lbl;b.hidden=n<=0;}
  const t=$('#tabCartBadge');if(t){t.textContent=lbl;t.hidden=n<=0;}}
function lineKey(pid,choices){return pid+':'+(choices||[]).slice().sort((a,b)=>a-b).join(',');}
function cartAdd(line){const c=cartGet();const k=lineKey(line.product_id,line.choices);
  const ex=c.find(l=>l.key===k);if(ex)ex.qty+=line.qty;else c.push({...line,key:k});cartSave(c);}
function cartSetQty(key,qty){let c=cartGet();const l=c.find(x=>x.key===key);if(!l)return;
  l.qty=qty;if(l.qty<=0)c=c.filter(x=>x.key!==key);cartSave(c);renderCartItems();}
function cartRemove(key){cartSave(cartGet().filter(x=>x.key!==key));renderCartItems();}

function openCart(){renderCartItems();$('#cartDrawer').hidden=false;}
function closeCart(){$('#cartDrawer').hidden=true;}
function renderCartItems(){
  const c=cartGet();const box=$('#cdItems');const foot=$('#cdFoot');
  $('#cdTitle').textContent=state.lang==='cn'?'购物车':'Cart';
  $('#cdSubLabel').textContent=state.lang==='cn'?'小计':'Subtotal';
  $('#cdNote').textContent=state.lang==='cn'?'运费与总计将在结算时计算。':'Shipping & total are calculated at checkout.';
  $('#cdCheckout').textContent=state.lang==='cn'?'去结算':'Checkout';
  if(!c.length){box.innerHTML='<div class="cd-empty">'+(state.lang==='cn'?'购物车是空的 🌱':'Your cart is empty 🌱')+'</div>';foot.hidden=true;return;}
  box.innerHTML=c.map(l=>`<div class="cd-row" data-k="${escAttr(l.key)}">
    <div class="ph">${l.image?`<img src="${escAttr(l.image)}" alt="">`:''}</div>
    <div class="meta">
      <div class="nm">${esc(l.name||'')}</div>
      ${l.optLabel?`<div class="opt">${esc(l.optLabel)}</div>`:''}
      <div class="pr">${money(l.price)}</div>
      <div class="cd-qty"><button data-act="dec">−</button><span>${l.qty}</span><button data-act="inc">+</button></div>
      <button class="rm" data-act="rm">${state.lang==='cn'?'移除':'Remove'}</button>
    </div></div>`).join('');
  $('#cdSub').textContent=money(cartSubtotal());
  foot.hidden=false;
}

/* ════════ Address region cascade + map pin (mirrors the mini-app) ════════
   The web form can't free-type a city — the server derives the 省 from a
   *Chinese* city name, so English text never resolves a region and the save
   400s. Instead we pick from the served-zone list (canonical Chinese) and/or
   drop a pin on a map (reverse-geocoded server-side). Both write
   province/city/district onto co.af, exactly what /addresses expects. */
var coZones={list:null,distCache:{},maps:undefined,_sdkP:null};
async function coLoadZones(){
  if(coZones.list)return coZones.list;
  try{ coZones.list=await api('/api/retail/delivery-zones')||[]; }catch(e){ coZones.list=[]; }
  return coZones.list;
}
// City rows only — GZ districts are reached via the city 广州市 + its districts,
// the same shape as the mini-app's EN cascade. Each carries canonical Chinese.
function coCityRows(){
  const cn=state.lang==='cn';
  return (coZones.list||[]).filter(z=>z.zone_type==='city').map(z=>{
    const name_cn=z.match_city||z.name_cn||z.name_en||'';
    const name_en=z.name_en||z.name_cn||'';
    return {label:cn?name_cn:name_en,name_cn,name_en,province_cn:z.province_cn||'',province_en:z.province_en||''};
  }).sort((a,b)=>String(a.label).localeCompare(String(b.label)));
}
async function coLoadDistricts(cityCn){
  if(!cityCn)return [];
  if(coZones.distCache[cityCn])return coZones.distCache[cityCn];
  let list=[];
  try{ list=await api('/api/retail/districts?city='+encodeURIComponent(cityCn))||[]; }catch(e){ list=[]; }
  coZones.distCache[cityCn]=list; return list;
}
// Strip a leading "省市区" prefix off a reverse-geocoded street (so the street
// field holds only the building/road, not a doubled region).
function coStripRegion(addr,province,city,district){
  let s=String(addr||'').trim();
  [province,city,district].filter(Boolean).sort((a,b)=>b.length-a.length).forEach(v=>{
    const re=new RegExp('^\\s*'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*');
    let go=true; while(go){ go=false; if(re.test(s)){ s=s.replace(re,''); go=true; } }
  });
  return s.trim();
}
function coApplyArea(province,city,district,label,street){
  co.af.province=province||''; co.af.city=city||''; co.af.district=district||'';
  co.af.areaLabel=label||[city,district].filter(Boolean).join(' · ');
  const t=$('#afArea'); if(t){ t.textContent=co.af.areaLabel; t.classList.remove('ph'); }
  if(street!=null){ const a=$('#afAddr'); if(a)a.value=street; }
}

// ── City → district cascade (reuses the login-modal shell) ──
async function openAreaPicker(){
  const cn=state.lang==='cn';
  coInjectAddrStyle();
  await coLoadZones();
  const cities=coCityRows();
  let ov=document.createElement('div'); ov.className='lm-overlay'; ov.id='apOverlay';
  ov.innerHTML=`<div class="lm-card"><button class="lm-x" id="apX">×</button>
    <div class="lm-title">${cn?'配送区域':'Delivery area'}</div>
    <input class="ap-search" id="apSearch" placeholder="${cn?'搜索城市…':'Search a city…'}">
    <div id="apBackWrap"></div>
    <div class="ap-list" id="apList"></div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ try{document.body.removeChild(ov);}catch(e){} };
  $('#apX').addEventListener('click',close);
  ov.addEventListener('click',e=>{ if(e.target===ov)close(); });

  const listEl=$('#apList'), backWrap=$('#apBackWrap'), searchEl=$('#apSearch');
  let mode='city', curCity=null;

  function renderCities(q){
    backWrap.innerHTML=''; searchEl.placeholder=cn?'搜索城市…':'Search a city…';
    const f=(q||'').trim().toLowerCase();
    const rows=cities.filter(c=>!f||c.label.toLowerCase().includes(f)||(c.name_cn||'').includes(q||'')||(c.name_en||'').toLowerCase().includes(f));
    listEl.innerHTML=rows.length?rows.map((c,i)=>`<div class="ap-item" data-i="${i}">${esc(c.label)}</div>`).join('')
      :`<div class="ap-empty">${cn?'未找到城市':'No matching city'}</div>`;
    listEl.querySelectorAll('.ap-item').forEach(el=>el.addEventListener('click',()=>pickCity(rows[Number(el.dataset.i)])));
  }
  async function pickCity(c){
    if(!c)return;
    curCity=c; searchEl.value=''; listEl.innerHTML=`<div class="ap-empty">${cn?'加载中…':'Loading…'}</div>`;
    const dists=await coLoadDistricts(c.name_cn);
    if(!dists.length){   // city-wide delivery, no districts → done
      coApplyArea(c.province_cn,c.name_cn,'',c.label); close(); return;
    }
    mode='district'; searchEl.placeholder=cn?'搜索区/县…':'Search a district…';
    backWrap.innerHTML=`<button class="ap-back" id="apBack">‹ ${esc(c.label)} — ${cn?'返回城市':'change city'}</button>`;
    $('#apBack').addEventListener('click',()=>{ mode='city'; renderCities(''); });
    renderDistricts(c,dists,'');
  }
  function renderDistricts(c,dists,q){
    const f=(q||'').trim().toLowerCase();
    const cityWide={label:cn?'全城':'City-wide',name_cn:'',name_en:'City-wide'};
    const all=[cityWide].concat(dists.map(d=>({label:cn?d.name_cn:d.name_en,name_cn:d.name_cn,name_en:d.name_en})));
    const rows=all.filter(d=>!f||d.label.toLowerCase().includes(f)||(d.name_cn||'').includes(q||''));
    listEl.innerHTML=rows.map((d,i)=>`<div class="ap-item" data-i="${i}">${esc(d.label)}</div>`).join('');
    listEl.querySelectorAll('.ap-item').forEach(el=>el.addEventListener('click',()=>{
      const d=rows[Number(el.dataset.i)];
      const label=d.name_cn?[c.label,d.label].join(' · '):c.label;
      coApplyArea(c.province_cn,c.name_cn,d.name_cn,label); close();
    }));
  }
  searchEl.addEventListener('input',()=>{
    if(mode==='city')renderCities(searchEl.value);
    else coLoadDistricts(curCity.name_cn).then(d=>renderDistricts(curCity,d,searchEl.value));
  });
  renderCities('');
  setTimeout(()=>searchEl.focus(),60);
}

// ── Map pin ──
async function coSetupMapButton(){
  const btn=$('#afMap'); if(!btn)return;
  if(coZones.maps===undefined){ try{ coZones.maps=await api('/api/retail/maps-config'); }catch(e){ coZones.maps=null; } }
  const cfg=coZones.maps;
  const b=$('#afMap'); if(!b)return;            // form may have re-rendered
  if(!cfg||!cfg.provider)return;                 // no JS key → leave the button hidden
  b.hidden=false;
  b.addEventListener('click',openMapPicker);
}
function coLoadMapSdk(cfg){
  if(coZones._sdkP)return coZones._sdkP;
  coZones._sdkP=new Promise((resolve,reject)=>{
    const cb='__shopMapReady';
    window[cb]=function(){ resolve(cfg.provider); };
    let src;
    if(cfg.provider==='amap'){
      if(cfg.security)window._AMapSecurityConfig={securityJsCode:cfg.security};
      src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(cfg.key)+'&callback='+cb;
    }else{
      src='https://map.qq.com/api/gljs?v=1.exp&key='+encodeURIComponent(cfg.key)+'&callback='+cb;
    }
    const s=document.createElement('script'); s.src=src; s.async=true;
    s.onerror=()=>reject(new Error('sdk_load_failed'));
    document.head.appendChild(s);
  });

function coMapAdapter(provider,el,center){
  if(provider==='amap'){
    const map=new AMap.Map(el,{zoom:16,center:[center.lng,center.lat],resizeEnable:true});
    let dot=null;
    return {
      onMove:cb=>map.on('moveend',()=>{const c=map.getCenter();cb({lat:c.getLat(),lng:c.getLng()});}),
      setCenter:(lat,lng)=>map.setCenter([lng,lat]),
      setUserDot:(lat,lng)=>{
        if(!dot){ dot=new AMap.Marker({content:'<div class="mp-userdot"></div>',anchor:'center',offset:new AMap.Pixel(0,0),zIndex:50}); dot.setMap(map); }
        dot.setPosition([lng,lat]);
      },
      destroy:()=>{try{map.destroy();}catch(e){}},
    };
  }
  const map=new TMap.Map(el,{zoom:16,center:new TMap.LatLng(center.lat,center.lng)});
  let dot=null;
  return {
    onMove:cb=>map.on('center_changed',()=>{const c=map.getCenter();cb({lat:c.getLat(),lng:c.getLng()});}),
    setCenter:(lat,lng)=>map.setCenter(new TMap.LatLng(lat,lng)),
    setUserDot:(lat,lng)=>{
      const pos=new TMap.LatLng(lat,lng);
      if(!dot){ dot=new TMap.MultiMarker({map,styles:{u:new TMap.MarkerStyle({width:16,height:16,anchor:{x:8,y:8},src:'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><circle cx="8" cy="8" r="6" fill="#1aad19" stroke="#fff" stroke-width="2"/></svg>')})},geometries:[{id:'u',styleId:'u',position:pos}]}); }
      else dot.updateGeometries([{id:'u',styleId:'u',position:pos}]);
    },
    destroy:()=>{try{map.destroy();}catch(e){}},
  };
}

  let sel=null, suppressUntil=0, moveTimer=null;

  }
  async function reverseCenter(lat,lng){

      if(r&&r.success===false){ setSel(null); return; }
      const street=coStripRegion(r.address,r.province,r.city,r.district);
      if(!r.city&&!r.province){ setSel(null); return; }
      setSel({province:r.province||'',city:r.city||'',district:r.district||'',street,

    if(!Array.isArray(list)||!list.length){ resultsEl.innerHTML=`<div class="mp-res">${cn?'未找到结果':'No results'}</div>`; return; }

      setSel({province:p.province||'',city:p.city||'',district:p.district||'',street,
        label:[p.city,p.district].filter(Boolean).join(' · ')});
      suppressUntil=Date.now()+1200;           // recenter shouldn't overwrite the POI pick

  });

  // Recenter on the visitor. Amap's Geolocation plugin returns GCJ-02 coords
  // (matching the map), so prefer it; otherwise fall back to a coarse server
  // IP lookup. Selection stays on the centre pin — the customer drags the rest.
  const locateBtn=$('#mpLocate');
  function amapGeolocate(){
    return new Promise(resolve=>{
      if(cfg.provider!=='amap'||!window.AMap){ resolve(null); return; }
      try{
        AMap.plugin('AMap.Geolocation',()=>{
          const geo=new AMap.Geolocation({enableHighAccuracy:true,timeout:8000,GeoLocationFirst:true,convert:true});
          geo.getCurrentPosition((status,result)=>{
            const p=result&&result.position;
            if(status==='complete'&&p&&isFinite(p.lat)&&isFinite(p.lng))resolve({lat:p.lat,lng:p.lng});
            else resolve(null);

    });
  }
  async function locate(silent){

    if(!silent){ addrEl.textContent=cn?'定位中…':'Locating…'; useBtn.disabled=true; }

    if(locateBtn)locateBtn.disabled=false;
    if(!pt){ if(!silent)addrEl.textContent=cn?'无法定位，请拖动地图':'Couldn’t locate — drag the map'; return; }
    resultsEl.hidden=true;
    suppressUntil=Date.now()+1200;        // the recenter's move events shouldn't double-reverse
    if(adapter){ adapter.setCenter(pt.lat,pt.lng); try{adapter.setUserDot(pt.lat,pt.lng);}catch(e){} }
    reverseCenter(pt.lat,pt.lng);

  // Load the SDK + build the map (seed on Guangzhou; customer searches/drags).
  try{
    await coLoadMapSdk(cfg);
    adapter=coMapAdapter(cfg.provider,$('#mpMap'),{lat:23.1291,lng:113.2644});
    adapter.onMove(({lat,lng})=>{
      if(Date.now()<suppressUntil)return;
      clearTimeout(moveTimer); moveTimer=setTimeout(()=>reverseCenter(lat,lng),350);
    });

    if(co.af.city){ searchEl.value=co.af.city; runSearch(); }
    else locate(true);                    // no chosen city yet → auto-jump to the visitor
  }catch(e){

/* ════════════ LAST-CHANCE OFFERS (pre-pay upsell) ════════════ */
// Prefetch add-on offers for the current cart (cached by cart signature) so the
// pre-pay popup opens instantly; an empty list keeps the popup suppressed. The
// server returns complements to the cart + anything on an active flash sale.
function coOfferSig(){return coItems().map(i=>i.product_id+'x'+i.qty).sort().join(',');}
async function coLoadOffers(){
  const items=coItems(); if(!items.length){co._offers=[];co._offerSig='';return;}
  const sig=coOfferSig();
  if(sig===co._offerSig&&Array.isArray(co._offers))return;   // cart unchanged
  co._offerSig=sig;
  try{
    const r=await fetch('/api/retail/checkout/offers',{method:'POST',headers:authHeaders({'Content-Type':'application/json','Accept':'application/json'}),body:JSON.stringify({items})});
    const j=await r.json().catch(()=>({}));
    const list=Array.isArray(j&&j.data)?j.data:[];
    co._offerSkew=(Number(j&&j.meta&&j.meta.server_time_ms)||Date.now())-Date.now();
    const inCart=new Set(items.map(i=>Number(i.product_id)));
    co._offers=list.filter(o=>!inCart.has(Number(o.id)));
  }catch(e){/* offers are optional — never block checkout */}
}
function coFmtCountdown(ms){
  const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  if(h>0)return state.lang==='cn'?`${h}小时${m}分`:`${h}h ${String(m).padStart(2,'0')}m`;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}
function coOfferRows(){
  const now=Date.now()+(co._offerSkew||0); const rows=[];
  for(const o of (co._offers||[])){
    const onFlash=!!o.is_on_flash;
    const eff=Number(o.effective_price)||Number(o.price)||0;
    const was=onFlash?(Number(o.price)||0):(Number(o.compare_at_price)>eff?Number(o.compare_at_price):0);
    const pct=was>eff&&was>0?Math.round((was-eff)/was*100):0;
    let cd='';
    if(onFlash&&o.flash&&o.flash.ends_at){const ms=new Date(o.flash.ends_at).getTime()-now;if(ms<=0)continue;cd=coFmtCountdown(ms);}
    rows.push({id:o.id,name:pick(o.name_en,o.name_cn),image:o.image_data||o.image_url||'',
      price:money(eff),was:was>eff?money(was):'',off:pct>0?(state.lang==='cn'?('省'+pct+'%'):('-'+pct+'%')):'',
      tag:o.is_complement?(state.lang==='cn'?'搭配推荐':'GOES WELL WITH'):(state.lang==='cn'?'限时秒杀':'FLASH DEAL'),
      flash:onFlash,countdown:cd,cta:o.has_options?(state.lang==='cn'?'选规格':'Pick'):(state.lang==='cn'?'加入':'Add')});
  }
  return rows;
}
function coRenderOfferList(){
  const box=$('#coOfBody'); if(!box)return;
  const go=$('#coOfGo'); if(go)go.textContent=(state.lang==='cn'?'去支付 ':'Continue to pay ')+money(Number((co.quote&&co.quote.total)||0));
  const rows=coOfferRows();
  if(!rows.length){box.innerHTML='<div class="coof-empty">'+(state.lang==='cn'?'都加好啦 🎉':'All set 🎉')+'</div>';return;}
  box.innerHTML=rows.map(r=>`<div class="coof-card">
    ${r.image?`<img class="coof-img" src="${escAttr(r.image)}" alt="">`:'<div class="coof-img coof-ph">🥗</div>'}
    <div class="coof-main">
      <div class="coof-tag ${r.flash?'coof-tag--flash':''}">${esc(r.tag)}</div>
      <div class="coof-name">${esc(r.name)}</div>
      ${r.countdown?`<div class="coof-count">⏳ ${esc(r.countdown)}</div>`:''}
      <div class="coof-prow"><span class="coof-price">${r.price}</span>${r.was?`<span class="coof-was">${r.was}</span>`:''}${r.off?`<span class="coof-off">${esc(r.off)}</span>`:''}</div>
    </div>
    <button class="coof-add" data-id="${r.id}">${esc(r.cta)}</button>
  </div>`).join('');
  box.querySelectorAll('.coof-add').forEach(b=>b.addEventListener('click',()=>coOfferAdd(Number(b.dataset.id))));
}

function coShowOffers(){
  // Defensive: never stack the upsell over an open "Ships soon" pre-order popup.
  const pop=$('#copoPop'); if(pop&&!pop.hidden){co.offersDone=true;return coPlace();}
  const rows=coOfferRows();
  if(!rows.length){co.offersDone=true;return coPlace();}   // all expired since prefetch
  coInjectOfferStyle();
  let ov=$('#coOffers');
  if(!ov){ov=document.createElement('div');ov.id='coOffers';ov.className='coof-overlay';document.body.appendChild(ov);}
  ov.innerHTML=`<div class="coof-wrap">
    <div class="coof-hero">🛒</div>
    <div class="coof-kicker">${state.lang==='cn'?'结账前 · 别错过':'BEFORE YOU PAY'}</div>

    <div id="coOfBody" class="coof-list"></div>
    <button id="coOfGo" class="coof-go"></button>
  </div>`;
  ov.hidden=false;
  ov.onclick=e=>{if(e.target===ov)coOffersContinue();};
  $('#coOfGo').addEventListener('click',coOffersContinue);
  coRenderOfferList();
  if(co._offerTimer)clearInterval(co._offerTimer);
  co._offerTimer=setInterval(()=>{const o=$('#coOffers');if(!o||o.hidden){clearInterval(co._offerTimer);co._offerTimer=null;return;}coRenderOfferList();},1000);
}
function coCloseOffers(){const ov=$('#coOffers');if(ov)ov.hidden=true;if(co._offerTimer){clearInterval(co._offerTimer);co._offerTimer=null;}}
async function coOfferAdd(id){
  const o=(co._offers||[]).find(x=>Number(x.id)===id); if(!o)return;
  if(o.has_options){co.offersDone=true;coCloseOffers();location.hash='#/product/'+id;return;}  // needs a choice — go to PDP
  cartAdd({product_id:o.id,qty:1,choices:[],name:pick(o.name_en,o.name_cn),price:Number(o.effective_price)||Number(o.price)||0,image:o.image_data||o.image_url||'',optLabel:''});

function coOffersContinue(){co.offersDone=true;coCloseOffers();coPlace();}

async function coPlace(){
  if(co.placing)return;
  if(!co.addrId){coMsg(state.lang==='cn'?'请选择配送地址':'Choose a delivery address');return;}
  if(!co.slotId){coMsg(state.lang==='cn'?'请选择配送时间':'Choose a delivery time');return;}
  // Last-chance upsell: the first time the customer is ready to pay, surface any
  // prefetched add-on offers once. Continuing or dismissing sets offersDone and
  // re-enters coPlace, falling straight through to the order POST below.
  if(!co.offersDone&&Array.isArray(co._offers)&&co._offers.length){ coShowOffers(); return; }
  co.placing=true; $('#coPlace').disabled=true; coMsg('');
  const body={items:coItems(),address_id:co.addrId,delivery_mode:co.mode,delivery_slot_id:co.slotId,delivery_slot_kind:co.slotKind||'',payment_method:co.payment,points_to_use:co.usePoints?99999999:0,voucher_code:co.voucher||null,customer_note:co.note||null,
    needs_cutlery:co.needsCutlery?1:0,needs_invoice:co.needsInvoice?1:0,
    invoice_type:co.needsInvoice?co.invoiceType:null,invoice_title:co.needsInvoice?(co.invoiceTitle||null):null,invoice_tax_id:(co.needsInvoice&&co.invoiceType==='company')?(co.invoiceTaxId||null):null,invoice_email:co.needsInvoice?(co.invoiceEmail||null):null,
    idempotency_key:co.idem};
  if(co.fallback)body.fallback_choice=co.fallback;
  let r,j;
  try{ r=await fetch('/api/retail/orders',{method:'POST',headers:authHeaders({'Content-Type':'application/json','Accept':'application/json'}),body:JSON.stringify(body)}); j=await r.json().catch(()=>({})); }
  catch(e){ coMsg(state.lang==='cn'?'网络错误':'Network error'); co.placing=false; $('#coPlace').disabled=false; return; }
  if(r.ok&&j.success){ coStartPayment(j.data); return; }
  co.placing=false; $('#coPlace').disabled=false;
  if(r.status===409&&j.error==='needs_fallback_confirmation'){ coFallback(); return; }
  coMsg(coErrMsg(j.error));
}
function coFallback(){

async function coStartPayment(order){

function coUploadProof(order,file){
  const msg=$('#payMsg'); if(!file||!msg)return; msg.style.color='var(--muted)';

function rsReasonText(reason,cn){
  switch(reason){
    case 'fresh_cutoff':
    case 'fresh_preparing': return cn?'鲜食已在为您备制，如需改期请联系我们。':'Your fresh items are already being prepared — please message us to change the time.';
    case 'departed':        return cn?'订单已发出，无法修改时间。':'Your order has already left — the time can’t be changed.';
    case 'refund':          return cn?'退款处理中，暂时无法修改。':'A refund is in progress, so the time can’t be changed right now.';
    default:                return cn?'该订单暂时无法修改时间。':'This order’s time can’t be changed.';
  }
}
function rsErrText(j,cn){
  const e=(j&&j.error)||''; const reason=j&&j.reason;
  if(e==='price_change')     return cn?'该时段会改变费用，暂不支持自助修改，请联系我们。':'That time would change the price — please message us to switch to it.';
  if(e==='fresh_no_sameday') return cn?'鲜食无法改到当天，请选择其他日期。':'Fresh items can’t move to a same-day slot — please pick a later date.';
  if(e==='not_reschedulable')return rsReasonText(reason,cn);
  if(/^slot_/.test(e))       return cn?'请选择有效的时间。':'Please pick a valid time.';
  if(/pickup_time/.test(e))  return cn?'请选择营业时间内的取货时间。':'Please pick a time within opening hours.';
  return cn?'修改失败，请重试。':'Could not change the time. Please try again.';
}
// Reschedule modal: load the order's slot options, let the customer pick a new
// delivery/pickup time, POST it. Price-neutral (Phase 1) — a surcharge-changing
// pick is refused by the server and surfaced as "message us".
async function openReschedule(o){
  const cn=state.lang==='cn';
  const isPickup=o.fulfillment_type==='pickup';
  const ov=document.createElement('div'); ov.className='lm-overlay'; ov.id='rsModal';
  ov.innerHTML=`<div class="lm-card"><button class="lm-x" id="rsX">×</button>
    <div class="lm-title">${isPickup?(cn?'修改取货时间':'Change pickup time'):(cn?'修改配送时间':'Change delivery time')}</div>
    <div class="lm-sub" id="rsSub">${cn?'加载中…':'Loading…'}</div>
    <div class="lm-step" id="rsBody" hidden></div>
    <div class="lm-err" id="rsErr"></div>
    <button class="lm-btn" id="rsSave" hidden disabled>${cn?'确认修改':'Confirm change'}</button>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  $('#rsX').addEventListener('click',close);
  ov.addEventListener('click',e=>{if(e.target===ov)close();});

  let opt; try{ opt=await api('/api/retail/orders/'+encodeURIComponent(o.id)+'/reschedule-options'); }catch(e){ opt=null; }
  if(!opt){ $('#rsSub').textContent=cn?'无法加载，请稍后再试。':'Could not load options.'; return; }
  if(!opt.eligibility||!opt.eligibility.allowed){ $('#rsSub').textContent=rsReasonText(opt.eligibility&&opt.eligibility.reason,cn); return; }

  const sel={slotId:null,slotKind:null,label:null,pickup:null};
  $('#rsSub').textContent=(cn?'当前：':'Current: ')+(o.delivery_slot_label||'—');
  const body=$('#rsBody'); body.hidden=false;
  const save=$('#rsSave'); save.hidden=false;

  if(isPickup){
    const win=opt.pickup_window||{open:'10:00',close:'20:00'};
    body.innerHTML=`<label style="font-size:13px;color:var(--muted)">${cn?('取货时间（营业 '+win.open+'–'+win.close+'）'):('Pickup time (open '+win.open+'–'+win.close+')')}</label>
      <input type="datetime-local" id="rsDt">`;
    const dt=$('#rsDt');
    dt.addEventListener('change',()=>{ sel.pickup=dt.value; save.disabled=!dt.value; });
  } else {
    const sc=opt.scheduling||{}; const slots=Array.isArray(sc.slots)?sc.slots:[]; const sch=sc.schedule;
    let html='';
    if(slots.length){
      html+='<div class="rs-slots">'+slots.map(s=>`<label class="rs-slot"><input type="radio" name="rsslot" value="${escAttr(s.slot_id)}" data-kind="${escAttr(s.slot_kind||(s.is_same_day?'today':'schedule'))}"><span>${esc(cn?(s.label_cn||s.label_en):(s.label_en||s.label_cn))}${Number(s.surcharge)>0?` (+${money(s.surcharge)})`:''}</span></label>`).join('')+'</div>';
    }
    if(sch){
      html+=`<label style="font-size:13px;color:var(--muted);margin-top:10px;display:block">${cn?'或选择日期':'Or pick a date'}</label><input type="date" id="rsDate" min="${escAttr(sch.min_date)}" max="${escAttr(sch.max_date)}">`;
    }
    if(!slots.length&&!sch){ html='<div style="font-size:13px;color:var(--muted)">'+(cn?'暂无可选时间。':'No times available.')+'</div>'; }
    body.innerHTML=html;
    body.querySelectorAll('input[name=rsslot]').forEach(r=>r.addEventListener('change',()=>{ const s=slots.find(x=>x.slot_id===r.value); sel.slotId=r.value; sel.slotKind=r.dataset.kind||''; sel.label=s?(cn?(s.label_cn||s.label_en):(s.label_en||s.label_cn)):''; const dd=$('#rsDate'); if(dd)dd.value=''; save.disabled=false; }));
    const dd=$('#rsDate'); if(dd)dd.addEventListener('change',()=>{ if(!dd.value)return; sel.slotId=dd.value; sel.slotKind='schedule'; sel.label=(cn?'配送 ':'Deliver ')+dd.value; body.querySelectorAll('input[name=rsslot]').forEach(r=>r.checked=false); save.disabled=false; });
  }

  save.addEventListener('click',async()=>{
    $('#rsErr').textContent=''; save.disabled=true;
    let payload;
    if(isPickup){ if(!sel.pickup){save.disabled=false;return;} payload={pickup_time:sel.pickup}; }
    else { if(!sel.slotId){save.disabled=false;return;} payload={delivery_slot_id:sel.slotId}; if(sel.slotKind)payload.delivery_slot_kind=sel.slotKind; if(sel.label)payload.delivery_slot_label=sel.label; }
    let r;
    try{ r=await fetch('/api/retail/orders/'+encodeURIComponent(o.id)+'/reschedule',{method:'POST',headers:authHeaders({'Accept':'application/json','Content-Type':'application/json'}),body:JSON.stringify(payload)}); }
    catch(e){ $('#rsErr').textContent=cn?'网络错误。':'Network error.'; save.disabled=false; return; }
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.success){ $('#rsErr').textContent=rsErrText(j,cn); save.disabled=false; return; }
    close(); renderOrderDetail(o.id);
  });
}

// Full-page cart so the Cart tab has a real destination (the drawer still
// works from the header cart icon). Shares the .cd-row markup + cart store.
function cartSetQtyPage(key,qty){let c=cartGet();const l=c.find(x=>x.key===key);if(!l)return;
  l.qty=qty;if(l.qty<=0)c=c.filter(x=>x.key!==key);cartSave(c);renderCartPage();}
function cartRemovePage(key){cartSave(cartGet().filter(x=>x.key!==key));renderCartPage();}
function renderCartPage(){
  const v=$('#view'); const cn=state.lang==='cn';
  document.title=(cn?'购物车':'Cart')+' · '+state.brand;
  const c=cartGet();
  if(!c.length){ v.innerHTML=`<div class="cp"><div class="cp-h">${cn?'购物车':'Cart'}</div><div class="cp-empty">${cn?'购物车是空的 🌱':'Your cart is empty 🌱'}<br><br><a class="me-viewall" href="#/shop">${cn?'去购物 →':'Browse products →'}</a></div></div>`; return; }
  const rows=c.map(l=>`<div class="cd-row" data-k="${escAttr(l.key)}" style="border-color:rgba(0,0,0,.1)">
    <div class="ph">${l.image?`<img src="${escAttr(l.image)}" alt="">`:''}</div>
    <div class="meta">
      <div class="nm">${esc(l.name||'')}</div>
      ${l.optLabel?`<div class="opt">${esc(l.optLabel)}</div>`:''}
      <div class="pr">${money(l.price)}</div>
      <div class="cd-qty"><button data-act="dec">−</button><span>${l.qty}</span><button data-act="inc">+</button></div>
      <button class="rm" data-act="rm">${cn?'移除':'Remove'}</button>
    </div></div>`).join('');
  v.innerHTML=`<div class="cp">
    <div class="cp-h">${cn?'购物车':'Cart'}</div>
    <div id="cpItems">${rows}</div>
    <div class="cp-foot">
      <div class="cp-sub"><span class="l">${cn?'小计':'Subtotal'}</span><span class="v">${money(cartSubtotal())}</span></div>
      <button class="cp-checkout" id="cpCheckout">${cn?'去结算':'Checkout'}</button>
    </div></div>`;
  $('#cpItems').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    const row=e.target.closest('.cd-row');if(!row)return;const k=row.dataset.k;const l=cartGet().find(x=>x.key===k);if(!l)return;
    const a=b.dataset.act;
    if(a==='inc')cartSetQtyPage(k,l.qty+1);
    else if(a==='dec')cartSetQtyPage(k,l.qty-1);
    else if(a==='rm')cartRemovePage(k);});
  $('#cpCheckout').addEventListener('click',()=>{
    if(!cartCount())return;
    if(!state.token)return openLogin();
    location.hash='#/checkout';
  });
}

// Highlight the active bottom tab for the current route.
function setActiveTab(seg){
  const s0=seg[0]||'';
  let key='home';
  if(s0==='shop'||s0==='product')key='shop';
  else if(s0==='cart'||s0==='checkout')key='cart';

// Web ports of the mini-app account pages — same /api/retail/* endpoints, same
// bilingual copy, namespaced .sp-* shell. WeChat-only bits (JSAPI pay, share,
// chooseAddress) are simplified/noted; everything else is feature-parity.
async function apiSend(method,path,body){
  const r=await fetch(path,{method,headers:authHeaders({'Accept':'application/json','Content-Type':'application/json'}),body:body!=null?JSON.stringify(body):undefined});
  if(r.status===401) clearAuth();
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||('http_'+r.status));e.code=j.error;e.status=r.status;throw e;}
  return j&&('data'in j)?j.data:j;
}
function spHead(kicker,title,sub){return `<div class="sp-head">${kicker?`<div class="sp-kicker">${esc(kicker)}</div>`:''}<div class="sp-title">${title}</div>${sub?`<div class="sp-sub">${esc(sub)}</div>`:''}</div>`;}
function spBack(){const cn=state.lang==='cn';return `<button class="sp-back" data-go="#/me">← ${cn?'我的':'Me'}</button>`;}
function spGuard(v){ if(state.token)return false;
  const cn=state.lang==='cn';
  v.innerHTML=`<div class="sp">${spBack()}${spHead('',cn?'请先登录':'Please sign in','')}<div class="sp-empty">${cn?'登录后查看此页面':'Sign in to view this page'}</div></div>`;
  openLogin(); return true;
}
function relTime(s){ if(!s)return ''; const cn=state.lang==='cn'; const t=new Date(String(s).replace(' ','T')); const d=(Date.now()-t.getTime())/1000;
  if(isNaN(d))return String(s).slice(0,10);
  if(d<60)return cn?'刚刚':'just now';
  if(d<3600)return Math.floor(d/60)+(cn?' 分钟前':'m ago');
  if(d<86400)return Math.floor(d/3600)+(cn?' 小时前':'h ago');
  if(d<604800)return Math.floor(d/86400)+(cn?' 天前':'d ago');
  return String(s).slice(0,10); }
function pointsSource(s,cn){return ({order_earn:cn?'订单获得':'Earned from order',topup_bonus:cn?'充值赠送':'Top-up bonus',order_redeem:cn?'订单抵扣':'Redeemed on order',expiry:cn?'已过期':'Expired',refund_reverse:cn?'退款回退':'Refund reversal',poll_vote:cn?'投票奖励':'Poll reward',admin_adjust:cn?'调整':'Adjustment'})[s]||s||(cn?'积分':'Points');}

function parseHash(){
  const raw=location.hash.replace(/^#/,'')||'/';
  const [path,qs]=raw.split('?');
  const params=new URLSearchParams(qs||'');
  const seg=path.split('/').filter(Boolean);   // ['shop'] | ['product','12']
  return {seg,params};
}
async function route(){
  const {seg,params}=parseHash();
  if(window.ShopBlocks) ShopBlocks.stopTimers();   // clear any home countdowns before leaving
  clearInterval(co.pollTimer);                      // stop any payment-status polling
  // highlight nav
  document.querySelectorAll('nav.links a').forEach(a=>{
    const n=a.dataset.nav;
    a.classList.toggle('on',(n==='home'&&seg.length===0)||(n==='shop'&&seg[0]==='shop'));
  });
  setActiveTab(seg);
  window.scrollTo({top:0,behavior:'instant'});
  try{
    if(seg[0]==='product'&&seg[1]) return renderProduct(seg[1]);

    if(seg[0]==='wallet')          return renderWallet();

    if(seg[0]==='invoices')        return renderInvoices();

    if(seg[0]==='membership')      return renderMembership();
    if(seg[0]==='affiliate')       return renderAffiliate();

    if(seg[0]==='about')           return renderAbout();
