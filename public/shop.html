<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2E7DF">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Storefront</title>
<style>
  /* ── Brand fonts (served from /assets/fonts, shared with the mini-app) ── */
  @font-face { font-family:'Bear Serif'; src:url('/assets/fonts/LilitaOne.ttf') format('truetype'); unicode-range:U+0024,U+0025,U+0030-0039,U+00A5; font-display:swap; }
  @font-face { font-family:'Bear Serif'; src:url('/assets/fonts/BearSerif.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'Toni Grotesk'; src:url('/assets/fonts/ToniGroteskPro.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'League Gothic'; src:url('/assets/fonts/LeagueGothic.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW5.ttf') format('truetype'); font-weight:500; font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW7.ttf') format('truetype'); font-weight:700; font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW9.ttf') format('truetype'); font-weight:900; font-display:swap; }
  @font-face { font-family:'Aleo'; src:url('/assets/fonts/Aleo-Regular.otf') format('opentype'); font-display:swap; }

  :root{
    --oat:#F2E7DF; --ink:#1a1a17; --forest:#365329; --olive:#6A6E2D; --lime:#CCD900;
    --berry:#E96174; --carrot:#FF6B0C; --papaya:#FFAF60; --corn:#F2CA6C;
    --sky:#B2CFED; --pea:#7BBD3B; --lotus:#EEB8E4; --pink:#F4B8CB; --citrus:#E7E74C;
    --lemon:#F4F087; --cucumber:#A8D185; --avocado:#73BF83; --almond:#C37F4E;
    --accent:#365329;            /* overridden from tenant config at runtime */
    --paper:#fff; --line:rgba(0,0,0,.08); --muted:#7c7c72;
    --bf-bear:'Bear Serif','DF Yuan','New York',Georgia,serif;
    --bf-toni:'Toni Grotesk','DF Yuan',-apple-system,BlinkMacSystemFont,sans-serif;
    --bf-gothic:'League Gothic','DF Yuan','Bebas Neue',Impact,sans-serif;
    --bf-yuan:'DF Yuan','PingFang SC','Hiragino Sans GB',sans-serif;
    /* Font vars the ported block engines (blocks.css / product-blocks.css) use —
       MUST match the mini-app's --f-* names exactly, incl. Aleo for body copy. */
    --f-bear:'Bear Serif','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-toni:'Toni Grotesk','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,sans-serif;
    --f-gothic:'League Gothic','DF Yuan','PingFang SC','Hiragino Sans GB','Bebas Neue',sans-serif;
    --f-aleo:'Aleo','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-yuan:'DF Yuan','PingFang SC','Hiragino Sans GB',sans-serif;
    --wrap:1180px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--f-aleo);
    background:var(--oat); color:var(--ink);
    min-height:100dvh; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    display:flex; flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;cursor:pointer;}

  /* Boot splash */
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--oat);z-index:90;transition:opacity .35s;}
  #boot.gone{opacity:0;pointer-events:none;}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── Header ── */
  header.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);}
  .bar-in{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;gap:18px;padding:13px 20px;}
  .wordmark{font-family:var(--bf-bear);font-size:24px;letter-spacing:.3px;color:var(--accent);white-space:nowrap;}
  nav.links{display:flex;gap:18px;font-size:15px;}
  nav.links a{padding:4px 0;border-bottom:2px solid transparent;color:#4a4a44;}
  nav.links a.on,nav.links a:hover{color:var(--ink);border-color:var(--accent);}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:#FFFCF7;border:2px solid var(--ink);border-radius:0;padding:9px 16px;max-width:420px;}
  .search:focus-within{border-color:var(--ink);}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:transparent;color:var(--ink);}
  .search svg{width:17px;height:17px;color:var(--muted);flex:none;}
  .bar .spacer{flex:1;}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:0;border:2px solid var(--ink);background:#FFFCF7;color:var(--ink);}
  .iconbtn svg{width:19px;height:19px;}
  .lang{display:inline-flex;border:2px solid var(--ink);border-radius:0;overflow:hidden;background:#FFFCF7;}
  .lang button{border:0;background:transparent;padding:8px 13px;font-size:13px;font-family:var(--bf-toni);font-weight:600;letter-spacing:.04em;color:var(--olive);}
  .lang button.active{background:var(--lime);color:var(--ink);}

  main{flex:1;width:100%;}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px;}
  .sec{padding:34px 0;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:12px;}
  .kicker{font-family:var(--bf-gothic);letter-spacing:.18em;text-transform:uppercase;font-size:14px;color:var(--olive);}
  .ttl{font-family:var(--bf-bear);font-size:clamp(22px,3.4vw,30px);line-height:1.1;}
  .more{font-size:14px;color:var(--accent);font-weight:600;white-space:nowrap;}

  /* ── Hero ── */
  .hero{background:var(--accent);color:#fff;border-radius:0;padding:clamp(30px,6vw,64px);margin-top:26px;position:relative;overflow:hidden;}
  .hero h1{font-family:var(--bf-bear);font-size:clamp(32px,6vw,58px);line-height:1.02;margin-bottom:14px;}
  .hero p{font-size:clamp(15px,2.4vw,19px);max-width:46ch;opacity:.92;}
  .hero .cta{display:inline-block;margin-top:22px;background:var(--lime);color:var(--ink);font-family:var(--bf-toni);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:13px 26px;border-radius:999px;font-size:15px;}

  /* ── Product grid + cards ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
  /* Flat editorial cards — match the mini-app: no border / no rounding / no
     hover-lift, full-bleed image on an oat ground, square ink/lime badges. */
  .card{background:transparent;border:0;border-radius:0;overflow:visible;display:flex;flex-direction:column;}
  .card .ph{position:relative;aspect-ratio:4/5;background:var(--oat);overflow:hidden;}
  .card .ph img{width:100%;height:100%;object-fit:cover;}
  .card .ph .none{position:absolute;inset:0;display:grid;place-items:center;color:#c7c0b5;font-size:13px;}
  .card .body{padding:12px 2px 4px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card .nm{font-family:var(--f-aleo);font-size:16px;line-height:1.2;font-weight:500;}
  .card .nm .cn{display:block;font-family:var(--bf-yuan);font-size:13px;color:var(--olive);font-weight:500;margin-top:2px;}
  .card .tag{font-size:12.5px;color:var(--olive);line-height:1.35;}
  .card .prices{margin-top:auto;display:flex;align-items:baseline;gap:8px;padding-top:6px;}
  .card .now{font-family:var(--f-aleo);font-size:16px;color:var(--olive);}
  .card .was{font-size:13px;color:rgba(0,0,0,.4);text-decoration:line-through;}
  .badge{position:absolute;top:12px;left:12px;background:var(--ink);color:var(--lime);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:0;}
  .pill-sold{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;font-size:12px;letter-spacing:.12em;text-align:center;padding:6px 0;border-radius:0;}
  /* Out-of-stock tags. Strict = hard SOLD OUT (greyed card); backorder = orderable pre-order. */
  .oos-tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:0;text-transform:uppercase;}
  .oos-tag.sold{background:var(--ink);color:#fff;}
  .oos-tag.soon{background:var(--forest);color:#fff;}
  .card.is-oos .ph img{filter:grayscale(.55);opacity:.78;}
  .pd-oos-tag{font-size:12px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;text-transform:uppercase;}
  .pd-oos-tag.sold{background:rgba(0,0,0,.72);color:#fff;}
  .pd-oos-tag.soon{background:var(--accent,#6d9c2a);color:#fff;}
  .pd-oos-note{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--accent,#6d9c2a);}
  .opt-cue{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;align-self:flex-start;}

  /* ── Category chips ── */
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .chip{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 18px;font-family:var(--bf-toni);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);white-space:nowrap;}
  .chip.on{background:var(--ink);color:var(--oat);border-color:var(--ink);}
  .chip .n{opacity:.6;font-size:12px;margin-left:5px;}

  /* category tiles (home) */
  .cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .cattile{position:relative;aspect-ratio:4/3;border-radius:0;overflow:hidden;background:var(--olive);color:#fff;display:flex;align-items:flex-end;padding:14px;}
  .cattile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78;}
  .cattile .lbl{position:relative;font-family:var(--bf-bear);font-size:18px;text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .cattile .lbl .n{display:block;font-family:var(--bf-toni);font-size:12px;opacity:.85;font-weight:500;}

  /* ── Toolbar (shop) ── */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar .count{font-size:14px;color:var(--muted);}
  select.sort{font:inherit;font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:9px 14px;background:#FFFCF7;color:var(--ink);}

  /* ── Product detail ── */
  .pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;padding:30px 0 50px;}
  .pd-gallery .main{aspect-ratio:4/5;background:var(--oat);border-radius:0;overflow:hidden;}
  .pd-gallery .main img{width:100%;height:100%;object-fit:cover;}
  .pd-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .pd-thumbs button{width:64px;height:64px;border-radius:0;overflow:hidden;border:2px solid transparent;background:var(--oat);padding:0;}
  .pd-thumbs button.on{border-color:var(--ink);}
  .pd-thumbs img{width:100%;height:100%;object-fit:cover;}
  .pd h1{font-family:var(--bf-bear);font-size:clamp(26px,4vw,38px);line-height:1.06;}
  .pd .cn{font-family:var(--bf-yuan);font-size:18px;color:var(--muted);margin-top:4px;}
  .pd .tagline{font-size:16px;color:#54544c;margin-top:12px;line-height:1.5;}
  .pd .price-row{display:flex;align-items:baseline;gap:12px;margin:20px 0;}
  .pd .price-now{font-family:var(--bf-bear);font-size:34px;color:var(--ink);}
  .pd .price-was{font-size:17px;color:var(--muted);text-decoration:line-through;}
  .pd .flash-tag{background:var(--berry);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .pd .rating{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:18px;}
  .stars{color:var(--corn);letter-spacing:1px;}
  .stars .off{color:#dcd6cc;}
  .buybar{display:flex;gap:12px;margin:22px 0;}
  .btn-primary{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 30px;font-family:var(--bf-toni);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1;}
  .btn-ghost{background:#FFFCF7;border:2px solid var(--ink);border-radius:999px;padding:15px 20px;font-size:16px;}
  .pd-note{font-size:13px;color:var(--muted);margin-top:-8px;}
  .pd-section{border-top:1px solid var(--line);padding:22px 0;}
  .pd-section h3{font-family:var(--bf-bear);font-size:18px;margin-bottom:12px;}
  .opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .opt .q{font-weight:600;font-size:14px;margin-bottom:8px;}
  .opt .choices{display:flex;gap:8px;flex-wrap:wrap;}
  .opt .choice{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:#4a4a44;}
  .opt .choice .delta{color:var(--accent);font-weight:600;margin-left:5px;}
  .desc{font-size:15px;line-height:1.65;color:#3a3a34;}
  .desc img{border-radius:12px;margin:12px 0;}
  .desc h1,.desc h2,.desc h3{font-family:var(--bf-bear);margin:16px 0 8px;}
  .desc p{margin:10px 0;}
  .variants{display:flex;gap:10px;flex-wrap:wrap;}
  .variants a{border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;font-size:14px;background:#fff;}
  .variants a.on{border-color:var(--accent);color:var(--accent);font-weight:600;}
  .review{border-top:1px solid var(--line);padding:14px 0;}
  .review:first-child{border-top:0;}
  .review .head{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .review .who{font-weight:600;font-size:14px;}
  .review .when{font-size:12px;color:var(--muted);}
  .review .body{font-size:14px;color:#4a4a44;line-height:1.5;}
  .review-reply{margin-top:8px;padding:8px 10px;border-left:2px solid var(--accent,#5a7d4f);background:rgba(0,0,0,.035);border-radius:0 6px 6px 0;font-size:13px;color:#4a4a44;line-height:1.5;}
  .review-reply .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-bottom:2px;}

  .pd-body{max-width:760px;margin:6px auto 0;}
  .shop-product-blocks{margin-top:8px;}
  .crumb{font-size:13px;color:var(--muted);padding-top:18px;}
  .crumb a:hover{color:var(--accent);}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px;}
  .skel{background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px;aspect-ratio:.78;}
  @keyframes sk{to{background-position:-200% 0;}}

  footer{margin-top:auto;border-top:1px solid var(--line);background:#fff;}
  .foot-in{max-width:var(--wrap);margin:0 auto;padding:26px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;}
  .foot-in .fm{font-family:var(--bf-bear);color:var(--accent);font-size:18px;}

  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,24,.96);color:#f2f2ec;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ─── Floating customer-service bubble (web parity with mini-app cs-button) ─── */
  .cs-fab{position:fixed;right:18px;bottom:96px;z-index:58;width:52px;height:52px;padding:0;border:0;
    border-radius:50%;background:var(--forest);color:#fff;cursor:pointer;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 6px 22px rgba(0,0,0,.24);transition:transform .14s ease;-webkit-tap-highlight-color:transparent;}
  .cs-fab{touch-action:none;cursor:grab;}
  .cs-fab:active{cursor:grabbing;}
  .cs-fab:hover{transform:translateY(-2px);}
  .cs-fab[hidden]{display:none;}
  .cs-fab.pill{width:auto;height:46px;border-radius:999px;padding:0 18px;gap:9px;}
  .cs-fab .cs-dots{display:flex;gap:4px;}
  .cs-fab .cs-dots i{width:6px;height:6px;border-radius:50%;background:#fff;display:block;}
  .cs-fab .cs-glyph{font-size:22px;line-height:1;font-weight:700;}
  .cs-fab .cs-lab{font-family:var(--bf-toni);font-weight:700;font-size:13px;letter-spacing:.04em;white-space:nowrap;color:#fff;}
  .cs-qr-bg{position:fixed;inset:0;z-index:140;background:rgba(20,20,24,.72);display:flex;align-items:center;justify-content:center;padding:20px;}
  .cs-qr-card{width:300px;max-width:90vw;background:#fff;border-radius:18px;padding:26px 22px 16px;text-align:center;}
  .cs-qr-title{font-family:var(--bf-bear);font-size:18px;color:#1a1a17;}
  .cs-qr-hours{font-size:13px;color:#9b9285;margin-top:6px;}
  .cs-qr-img{width:220px;height:220px;max-width:72vw;max-height:72vw;object-fit:contain;display:block;margin:18px auto 10px;background:#f7f3ee;border-radius:10px;}
  .cs-qr-hint{font-size:12px;color:#9b9285;}
  /* Referral popup extras (renderAffiliate) — the customer-service QR shows no
     code under its image, this one does. */
  .cs-qr-code{font-family:var(--bf-bear);font-size:22px;line-height:1;color:#1a1a17;background:var(--lime);border:2px solid var(--ink);padding:10px 12px;margin:0 0 10px;word-break:break-all;}
  .cs-qr-wait{display:flex;align-items:center;justify-content:center;text-align:center;width:220px;height:220px;max-width:72vw;max-height:72vw;margin:18px auto 10px;padding:0 16px;background:#f7f3ee;border-radius:10px;font-size:12px;line-height:1.45;color:#9b9285;box-sizing:border-box;}
  .cs-qr-close{margin-top:16px;padding:13px 0;font-family:var(--bf-toni);font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--forest);border-top:1px solid rgba(0,0,0,.08);cursor:pointer;}

  @media(max-width:820px){
    .pd{grid-template-columns:1fr;gap:24px;}
  }
  /* Mobile product page = mini-app parity: full-bleed description blocks (so the
     spec strip / big-stat read edge-to-edge at the mini-app's exact rpx scale)
     + a fixed sticky buy bar (square ink button w/ lime label + price, square
     qty stepper) instead of the inline pill. */
  @media(max-width:767px){
    .pd-body{max-width:none;margin-left:-20px;margin-right:-20px;}
    /* The -20px bleed lets ShopProductBlocks run edge-to-edge, but text sections
       (reviews + plain description) must keep their gutter back off the screen edge. */
    .pd-body>.pd-section{padding-left:20px;padding-right:20px;}
    .pd-wrap{padding-bottom:104px;}
    /* Title at the mini-app's poster scale (88rpx ≈ 12vw); the desktop clamp
       bottoms out at 26px on a phone, far smaller than the mini-app. */
    .pd-wrap .pd-info h1{font-size:min(48px,12vw);line-height:.92;letter-spacing:-.015em;}
    .pd-wrap .pd-info .cn{font-size:19px;}
    .pd-wrap .pd-info .tagline{font-size:17px;}
    /* Buy-bar selectors scoped under .pd-wrap so they beat the later base
       .pd-buy/.pd-qty rules in the second <style> block (which keeps the
       desktop rounded pill). Square stepper = mini-app parity. */
    .pd-wrap .pd-buy{position:fixed;left:0;right:0;bottom:0;z-index:65;margin:0;gap:12px;align-items:center;
      background:var(--oat);border-top:3px solid var(--ink);
      padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));}
    .pd-wrap .pd-qty{border:2px solid var(--ink);border-radius:0;flex:0 0 auto;overflow:visible;}
    .pd-wrap .pd-qty button{width:44px;height:52px;font-size:22px;}
    .pd-wrap .pd-qty span{min-width:46px;height:52px;display:flex;align-items:center;justify-content:center;
      border-left:2px solid var(--ink);border-right:2px solid var(--ink);font-size:17px;}
    .pd-wrap #addBtn{flex:1;background:var(--ink);color:var(--lime);border-radius:0;height:52px;padding:0 22px;
      display:flex;justify-content:space-between;align-items:center;letter-spacing:.1em;}
    .pd-wrap #addBtn .add-label{font-family:var(--bf-toni);font-size:15px;font-weight:700;}
    .pd-wrap #addBtn .add-price{font-family:var(--bf-bear);font-size:19px;letter-spacing:0;}
    .pd-wrap #addBtn:disabled{background:rgba(0,0,0,.3);color:rgba(255,255,255,.7);justify-content:center;opacity:1;}
  }
  @media(max-width:520px){
    .bar-in{flex-wrap:wrap;gap:10px 14px;}
    nav.links{order:1;gap:14px;}
    .search{order:3;max-width:none;flex-basis:100%;}

    .me-row .rmeta{display:block;font-size:12px;color:var(--olive);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    /* ── Cart page (#/cart) — full-page cart that mirrors the mini-app Cart tab
         (miniapp/pages/cart/cart.wxss): basket header, free-shipping progress
         bar, hairline product rows, and a fixed Total + CHECK OUT bar pinned
         above the bottom tab bar. rpx values are halved to px (750rpx ≈ 375px). */
    .cp{max-width:560px;margin:0 auto;padding:0 0 calc(150px + env(safe-area-inset-bottom));}
    .cp-head{padding:40px 22px 12px;}
    .cp-kicker{font-family:var(--bf-toni);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--olive);}
    .cp-title-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;}
    .cp-title{font-family:var(--bf-bear);font-size:40px;font-weight:500;line-height:1;color:var(--ink);}
    .cp-count{font-family:var(--bf-gothic);font-size:28px;color:var(--olive);}
    /* free-shipping progress card */
    .cp-prog{margin:0 22px;background:#FFFCF7;border:2px solid var(--ink);padding:12px 14px;}
    .cp-prog-text{font-family:var(--f-aleo);font-size:13px;line-height:1.4;color:var(--ink);}

    .cp-bar{margin-top:9px;height:8px;background:rgba(0,0,0,.08);}
    .cp-fill{height:100%;background:var(--lime);transition:width .3s ease;}
    /* "N ITEMS / CLEAR ALL" row above the basket */
    .cp-itemsbar{display:flex;align-items:baseline;justify-content:space-between;padding:18px 22px 4px;}
    .cp-itemcount{font-family:var(--bf-toni);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);}
    .cp-clear{font-family:var(--bf-toni);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
    /* product rows — full-bleed hairline separators like the mini app */
    .cp-row{display:flex;align-items:flex-start;gap:14px;padding:14px 22px;border-top:1.5px dashed rgba(0,0,0,.25);}
    .cp-row:first-of-type{border-top:2px solid var(--ink);margin-top:8px;}
    .cp-row .ph{position:relative;width:64px;height:76px;flex:0 0 auto;background:var(--oat);border:1.5px solid var(--ink);overflow:visible;}
    .cp-row .ph img{width:100%;height:100%;object-fit:cover;display:block;}
    /* remove badge — circular ink button on the top-left corner of the thumb */
    .cp-rm{position:absolute;top:-10px;left:-10px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--oat);border:0;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2;}

    .cp-row .nm{font-family:var(--bf-bear);font-size:17px;line-height:1.05;}
    .cp-row .opt{border:0;border-radius:0;padding:0;margin-bottom:0;font-size:11px;color:var(--ink);margin-top:3px;line-height:1.2;}
    .cp-row .sz{font-size:11px;color:var(--olive);margin-top:3px;}
    .cp-qty{display:flex;align-items:center;gap:10px;margin-top:8px;}
    .cp-qty button.q{width:26px;height:26px;border:1.5px solid var(--ink);background:none;font-family:var(--bf-bear);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0;}
    .cp-qty .n{min-width:28px;text-align:center;font-family:var(--bf-gothic);font-size:15px;}
    .cp-row .lt{font-family:var(--bf-bear);font-size:22px;white-space:nowrap;margin-top:2px;}
    /* fixed Total + CHECK OUT bar — sits above the mobile tab bar */
    .cp-foot{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:40;max-width:560px;margin:0 auto;background:var(--oat);border-top:2px solid var(--ink);padding:14px 22px 16px;}
    .cp-sub{display:flex;justify-content:space-between;align-items:baseline;}
    .cp-sub .l{font-family:var(--bf-bear);font-size:15px;color:var(--ink);} .cp-sub .v{font-family:var(--bf-bear);font-size:30px;}
    .cp-checkout{margin-top:12px;width:100%;font-family:var(--bf-toni);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:17px;background:var(--ink);color:var(--lime);border:0;border-radius:0;padding:15px;cursor:pointer;}
    .cp-empty{text-align:center;padding:90px 22px;}
    .cp-empty-t{font-family:var(--bf-bear);font-size:30px;color:var(--ink);}
    .cp-empty-btn{display:inline-block;margin-top:26px;font-family:var(--bf-toni);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px;background:var(--ink);color:var(--oat);border-radius:999px;padding:15px 36px;text-decoration:none;}
    /* No tab bar on desktop — drop the bar flush to the bottom there. */
    @media(min-width:768px){.cp-foot{bottom:0;}}
    /* ── Cart, PC-native (≥1024): items column left, sticky order-summary card
         right — the phone's fixed bottom bar becomes a proper summary rail. ── */
    @media(min-width:1024px){
      .cp{max-width:1120px;padding:0 32px 70px;display:grid;
        grid-template-columns:minmax(0,1fr) 380px;column-gap:52px;
        align-items:start;grid-auto-rows:min-content;}
      .cp-head,.cp-prog,.cp-itemsbar,#cpItems{grid-column:1;}
      .cp-head{padding-left:0;padding-right:0;}
      .cp-title{font-size:48px;}
      .cp-prog{margin-left:0;margin-right:0;}
      .cp-itemsbar{padding-left:0;padding-right:0;}
      .cp-row{padding-left:0;padding-right:0;}
      .cp-row .ph{width:84px;height:96px;}
      .cp-row .nm{font-size:19px;}
      .cp-foot{grid-column:2;grid-row:2/span 3;position:sticky;top:96px;
        left:auto;right:auto;bottom:auto;max-width:none;margin:0;z-index:1;
        border:2px solid var(--ink);padding:24px 26px;}
      .cp-empty{grid-column:1/-1;}

    /* ── Mobile chrome: hide the desktop top nav, show a slim title bar (the

    .sp-tab.on{background:var(--ink);color:var(--oat);}
    .sp-card{margin:14px 22px 0;border:2px solid var(--ink);background:#fff;padding:16px 18px;}

    .ad-city{font-size:12.5px;color:var(--olive);margin-top:2px;}
    .ad-eta{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;font-family:var(--bf-toni);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(204,217,0,.2);color:#3a4400;}
    .ad-actions{display:flex;gap:20px;margin-top:14px;padding-top:12px;border-top:1.5px dashed rgba(0,0,0,.18);}
    .ad-link{font-family:var(--bf-toni);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--olive);text-decoration:underline;cursor:pointer;}
    .ad-link.danger{color:var(--berry);}
    /* Address add/edit form — mirrors the mini-app's placeholder-only fields,
       single delivery-area trigger, default toggle and ink/lime Save button. */
    .af-form{padding:0 22px;}
    .af-sub{font-family:var(--bf-bear);font-size:22px;color:var(--ink);line-height:1.1;margin:2px 0 16px;}
    .af2-input{width:100%;box-sizing:border-box;font-family:var(--f-aleo);font-size:15px;padding:13px 14px;border:2px solid var(--ink);background:#FFFCF7;color:var(--ink);border-radius:0;margin-bottom:10px;}
    .af2-input::placeholder{color:rgba(26,26,23,.42);}
    .af2-area{position:relative;width:100%;box-sizing:border-box;text-align:left;font-family:var(--f-aleo);font-size:15px;padding:13px 38px 13px 14px;border:2px solid var(--ink);background:#FFFCF7;color:var(--ink);border-radius:0;margin-bottom:10px;cursor:pointer;}
    .af2-area.ph{color:rgba(26,26,23,.42);}
    .af2-area::after{content:'\203A';position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:22px;line-height:1;color:rgba(26,26,23,.5);}
    .af2-map{display:block;width:100%;box-sizing:border-box;text-align:center;font-family:var(--bf-toni);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:12px;border:2px solid var(--ink);background:#FFFCF7;color:var(--ink);cursor:pointer;margin-bottom:14px;border-radius:0;}
    .af2-map[hidden]{display:none;}
    .af2-default{display:flex;align-items:center;gap:12px;margin-top:16px;font-family:var(--f-aleo);font-size:15px;color:var(--ink);cursor:pointer;user-select:none;}
    .af2-switch{position:relative;display:inline-block;width:48px;height:26px;flex:none;}
    .af2-switch input{position:absolute;opacity:0;width:0;height:0;}
    .af2-slider{position:absolute;inset:0;background:#d8d2c6;border:2px solid var(--ink);border-radius:999px;transition:background .15s;}
    .af2-slider::before{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;}
    .af2-switch input:checked + .af2-slider{background:var(--ink);}
    .af2-switch input:checked + .af2-slider::before{transform:translateX(22px);background:var(--lime);}
    .sp-btn.af2-save{background:var(--ink);color:var(--lime);border-radius:0;}
    /* coupon sticker */
    /* Ticket design — mirrors the mini-app coupon (lime stub + perforation notches + body). */
    .cpn{position:relative;display:flex;align-items:stretch;margin:14px 22px 0;border:2px solid var(--ink);background:#FFFCF7;min-height:104px;}
    .cpn.used{opacity:.6;border-style:dashed;border-color:rgba(0,0,0,.3);}
    .cpn .cpn-stub{flex:0 0 96px;background:var(--lime);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 6px;border-right:2px solid var(--ink);}
    .cpn.used .cpn-stub{background:rgba(0,0,0,.04);color:rgba(0,0,0,.5);border-right-style:dashed;border-right-color:rgba(0,0,0,.3);}
    .cpn .cpn-big{font-family:var(--bf-bear);font-size:28px;line-height:.9;letter-spacing:-.02em;}
    .cpn .cpn-stubsub{font-family:var(--bf-toni);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;opacity:.8;}
    .cpn .notch{position:absolute;left:90px;width:12px;height:12px;border-radius:50%;background:var(--oat);border:2px solid var(--ink);}
    .cpn .notch-t{top:-7px;}
    .cpn .notch-b{bottom:-7px;}
    .cpn.used .notch{border-style:dashed;border-color:rgba(0,0,0,.3);}
    .cpn .cpn-body{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;}
    .cpn .cpn-name{font-family:var(--bf-bear);font-size:16px;line-height:1.15;color:var(--ink);}
    .cpn .cpn-meta{font-size:12px;color:var(--olive);margin-top:4px;}
    .cpn .cpn-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:12px;}
    .cpn .cpn-exp{font-size:11px;letter-spacing:.04em;color:var(--olive);}
    .cpn .cpn-use{flex:none;background:var(--ink);color:var(--lime);border:0;padding:8px 16px;font-family:var(--bf-toni);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
    .cpn .cpn-state{font-family:var(--bf-toni);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);}
    /* Coupons page chrome — mirrors the mini-app (title + active pill + 3 tabs + dashed empty card). */
    .cpn-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:0 22px;}
    .cpn-kick{font-family:var(--bf-gothic);letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--olive);}
    .cpn-title{font-family:var(--bf-bear);font-size:40px;line-height:1.05;color:var(--ink);margin-top:6px;}
    .cpn-pill{flex:none;background:var(--ink);text-align:center;padding:12px 18px;min-width:66px;}
    .cpn-pill-v{font-family:var(--bf-bear);font-size:34px;line-height:.85;color:var(--lime);}
    .cpn-pill-l{font-family:var(--bf-gothic);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:.7;margin-top:6px;}
    .cpn-redeem{display:flex;align-items:stretch;margin:18px 22px 0;background:#FFFCF7;border:2px solid var(--ink);}
    .cpn-redeem input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);padding:14px 16px;}
    .cpn-redeem button{flex:none;background:var(--ink);color:var(--lime);border:0;font-family:var(--bf-gothic);font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:0 22px;cursor:pointer;}
    .cpn-tabs{display:flex;border:2px solid var(--ink);margin:18px 22px 0;}
    .cpn-tab{flex:1;padding:12px 0;text-align:center;font-family:var(--bf-gothic);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:transparent;border:0;cursor:pointer;}
    .cpn-tab+.cpn-tab{border-left:2px solid var(--ink);}
    .cpn-tab.on{background:var(--ink);color:var(--lime);}
    .cpn-tab .c{opacity:.7;}
    .cpn-tab.on .c{color:var(--lime);}
    .cpn-empty{text-align:center;margin:18px 22px 0;padding:48px 24px;background:#FFFCF7;border:2px dashed rgba(0,0,0,.2);}
    .cpn-empty-t{font-family:var(--bf-bear);font-size:28px;color:var(--olive);}
    .cpn-empty-s{font-size:14px;color:var(--olive);opacity:.75;margin-top:10px;line-height:1.5;max-width:320px;margin-left:auto;margin-right:auto;}
    /* favorites grid (reuse .grid/.card) */
    .fav-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 22px 0;}
    /* PDP favorite (heart) toggle — mirrors the mini-app pink-circle heart */
    .pd-gallery .main{position:relative;}
    .pd-fav{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:999px;
      border:none;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;
      display:flex;align-items:center;justify-content:center;padding:0;transition:transform .12s var(--ease-out,ease);}
    .pd-fav:active{transform:scale(.9);}
    .pd-fav svg{width:24px;height:24px;fill:none;stroke:var(--berry);stroke-width:2;}
    .pd-fav.on{background:var(--berry);}
    .pd-fav.on svg{fill:#fff;stroke:#fff;}
    /* membership ladder */
    .tier-now{margin:14px 22px 0;padding:20px;border:2px solid var(--ink);text-align:center;}
    .tier-now .tn-name{font-family:var(--bf-bear);font-size:30px;color:var(--ink);}
    .tier-bar{height:12px;background:rgba(0,0,0,.1);margin:14px 0 6px;overflow:hidden;}
    .tier-bar > i{display:block;height:100%;background:var(--accent);}
    .tier-step{display:flex;gap:12px;align-items:flex-start;padding:14px 22px;border-top:1px solid rgba(0,0,0,.1);}
    .tier-dot{width:14px;height:14px;border-radius:999px;border:2px solid var(--ink);margin-top:4px;flex:none;}
    .tier-step.on .tier-dot{background:var(--lime);}
    .tier-step .ts-name{font-family:var(--bf-bear);font-size:16px;color:var(--ink);}
    .tier-step .ts-perk{font-size:12.5px;color:var(--olive);margin-top:3px;line-height:1.45;}
    /* notifications — card layout mirrors the mini-app (category badge + ink card,
       tea-green left rail for unread). */
    .ntf-list{display:flex;flex-direction:column;gap:8px;padding:0 22px;margin-top:8px;}
    .ntf-card{display:block;width:100%;text-align:left;background:#FFFCF7;border:2px solid var(--ink);padding:13px 14px;cursor:pointer;font:inherit;color:var(--ink);}
    .ntf-card.unread{box-shadow:inset 6px 0 0 #6B8E6F;}
    .ntf-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .ntf-cat{font-family:var(--bf-toni);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border:2px solid var(--ink);color:var(--ink);white-space:nowrap;}
    .ntf-cat.cat-order{background:var(--lime);}
    .ntf-cat.cat-refund{background:#E8E0CF;}
    .ntf-cat.cat-invoice{background:#FFFCF7;}
    .ntf-cat.cat-broadcast{background:#C43A6A;color:#fff;border-color:#C43A6A;}
    .ntf-time{font-family:var(--bf-toni);font-size:11px;color:var(--olive);white-space:nowrap;}
    .ntf-title{font-family:var(--bf-bear);font-size:17px;color:var(--ink);margin-top:8px;line-height:1.2;}
    .ntf-body{font-size:13px;color:var(--olive);margin-top:4px;line-height:1.5;}
    /* feedback / message thread */
    .fbt-thread{padding:8px 22px 120px;display:flex;flex-direction:column;gap:12px;}
    .fbt-msg{max-width:82%;border:2px solid var(--ink);padding:10px 12px;background:#FFFCF7;}
    .fbt-msg.mine{align-self:flex-end;background:var(--lime);}
    .fbt-msg.store{align-self:flex-start;}
    .fbt-meta{font-family:var(--bf-toni);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);margin-bottom:5px;}
    .fbt-body{font-size:15px;line-height:1.5;color:var(--ink);font-family:var(--f-aleo);white-space:pre-wrap;word-break:break-word;}
    .fbt-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);padding:10px 14px;display:flex;gap:10px;align-items:flex-end;max-width:520px;margin:0 auto;z-index:20;}
    .fbt-bar .sp-input{min-height:44px;max-height:120px;}
    .fbt-bar .sp-btn{flex:0 0 auto;align-self:stretch;}
    /* feedback ("Found a bug?") — mirrors mini-app pages/feedback */
    .fb-wrap{padding:0 0 110px;}
    .fb-head{padding:24px 22px 0;}
    .fb-kicker{font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--olive);}
    .fb-title{font-family:var(--bf-bear);font-size:34px;font-weight:500;line-height:.96;margin-top:6px;color:var(--ink);}
    .fb-intro{margin:12px 22px 0;font-size:14px;line-height:1.45;color:var(--olive);}
    .fb-sec{margin:24px 22px 0;}
    .fb-sec-head{display:flex;justify-content:space-between;align-items:baseline;}
    .fb-label{font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--olive);}
    .fb-count{font-family:var(--bf-toni);font-size:11px;letter-spacing:.06em;color:var(--olive);}
    .fb-input{width:100%;box-sizing:border-box;background:#FFFCF7;border:2px solid var(--ink);padding:12px 14px;margin-top:10px;font-family:var(--f-aleo);font-size:15px;line-height:1.4;color:var(--ink);min-height:120px;resize:vertical;}
    .fb-input::placeholder{color:#a59c8f;}
    .fb-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
    .fb-tile{width:56px;height:56px;border:2px solid var(--ink);overflow:hidden;position:relative;flex:none;}
    .fb-tile img{width:100%;height:100%;object-fit:cover;}
    .fb-tile .fb-x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;border:0;font-size:12px;line-height:18px;text-align:center;cursor:pointer;padding:0;}
    .fb-add{width:56px;height:56px;border:2px dashed var(--ink);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--olive);cursor:pointer;flex:none;}
    .fb-add-plus{font-family:var(--f-aleo);font-size:20px;line-height:1;}
    .fb-add-lbl{font-family:var(--bf-toni);font-size:8px;letter-spacing:.1em;text-transform:uppercase;}
    .fb-bar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--oat);border-top:2px solid var(--ink);padding:14px 22px calc(14px + env(safe-area-inset-bottom));z-index:20;}
    .fb-send{width:100%;background:var(--ink);color:var(--lime);border:0;padding:15px 0;font-family:var(--bf-toni);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
    .fb-send:disabled{opacity:.45;cursor:default;}
    /* membership — the shop's own club, named from its brand rather than the
       first tenant's (audit D-04). Mirrors mini-app pages/membership. */
    .mb-hero{background:var(--forest);color:var(--oat);padding:38px 22px 30px;}
    .mb-kicker{font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--lime);}
    .mb-title{font-family:var(--bf-bear);font-size:46px;font-weight:500;line-height:1.08;margin-top:8px;}
    .mb-sub{margin-top:12px;font-size:14px;line-height:1.5;opacity:.85;max-width:300px;}
    .mb-markers{display:flex;justify-content:space-around;padding:18px 22px;}
    .mb-mk{display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.35;}
    .mb-mk.reached{opacity:.7;} .mb-mk.current{opacity:1;}
    .mb-mk-name{font-family:var(--bf-bear);font-size:17px;color:var(--ink);padding-bottom:4px;border-bottom:3px solid transparent;}
    .mb-mk.current .mb-mk-name{border-bottom-color:var(--ink);}
    .mb-mk-dot{font-family:var(--bf-toni);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-top:6px;background:var(--lime);padding:2px 7px;border-radius:999px;}
    .mb-card{margin:0 22px;background:var(--ink);color:#fff;padding:18px;}
    .mb-pc-label{font-family:var(--bf-toni);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);}
    .mb-pc-amt{font-family:var(--bf-bear);font-size:30px;font-weight:500;margin:5px 0 12px;line-height:1;}
    .mb-pc-bar{height:8px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;}
    .mb-pc-fill{height:100%;background:var(--lime);border-radius:999px;}
    .mb-pc-meta{font-size:12.5px;opacity:.75;margin-top:10px;}
    .mb-table{padding:26px 22px 0;}
    .mb-trc{background:#FFFCF7;border:2px solid rgba(0,0,0,.12);padding:14px 16px;margin-bottom:12px;position:relative;}
    .mb-trc.current{border-color:var(--ink);}
    .mb-trc.current::before{content:'★';position:absolute;top:-9px;right:14px;background:var(--lime);color:var(--ink);width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
    .mb-trc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;padding-bottom:8px;border-bottom:1px dashed rgba(0,0,0,.14);}
    .mb-trc-name{font-family:var(--bf-bear);font-size:19px;font-weight:500;color:var(--ink);}
    .mb-trc-req{font-family:var(--bf-toni);font-size:11px;letter-spacing:.08em;color:var(--olive);}
    .mb-trc-perks{display:flex;flex-direction:column;gap:4px;}
    .mb-trc-perk{font-size:13px;color:var(--ink);line-height:1.4;}
    /* membership → leaderboard entry link */
    .mb-lb{margin:18px 22px 0;background:var(--lime);color:var(--ink);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border:0;width:calc(100% - 44px);cursor:pointer;font:inherit;text-align:left;}
    .mb-lb-label{font-family:var(--bf-toni);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;}
    .mb-lb-arrow{font-size:18px;}
    /* leaderboard — mirrors mini-app pages/leaderboard */
    .lb-hero{background:var(--forest);color:var(--oat);padding:38px 22px 30px;}
    .lb-kicker{font-family:var(--bf-toni);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--lime);}
    .lb-title{font-family:var(--bf-bear);font-size:46px;font-weight:500;line-height:1.04;margin-top:8px;}
    .lb-sub{margin-top:12px;font-size:14px;line-height:1.5;opacity:.85;max-width:320px;}
    .lb-meta{margin-top:16px;font-family:var(--bf-toni);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;}
    .lb-empty{padding:64px 22px;text-align:center;color:var(--olive);font-size:14px;line-height:1.5;}
    .lb-podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:30px 22px 8px;}
    .lb-spot{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;}
    .lb-crown{font-size:20px;color:var(--lime);margin-bottom:2px;}
    .lb-rank{font-family:var(--bf-bear);font-size:28px;line-height:1;color:var(--ink);}
    .lb-spot.p1 .lb-rank{color:var(--lime);-webkit-text-stroke:1px var(--ink);}
    .lb-name{font-family:var(--bf-bear);font-size:14px;line-height:1.15;margin:5px 0 3px;color:var(--ink);width:100%;word-break:break-all;}
    .lb-val{font-family:var(--bf-toni);font-size:10px;letter-spacing:.08em;color:var(--olive);margin-bottom:7px;}
    .lb-bar{width:100%;background:var(--ink);border-radius:5px 5px 0 0;}
    .lb-bar.b1{height:96px;background:var(--lime);} .lb-bar.b2{height:68px;background:rgba(26,26,23,.78);} .lb-bar.b3{height:48px;background:rgba(26,26,23,.55);}
    .lb-list{margin:20px 22px 0;background:#FFFCF7;border:2px solid rgba(0,0,0,.12);}
    .lb-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px dashed rgba(0,0,0,.12);}
    .lb-row:last-child{border-bottom:none;}
    .lb-row.me{background:rgba(204,217,0,.18);border-left:5px solid var(--lime);padding-left:11px;}
    .lb-row-rank{font-family:var(--bf-bear);font-size:17px;color:var(--olive);}
    .lb-row-name{font-family:var(--bf-bear);font-size:16px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .lb-row-val{font-family:var(--bf-toni);font-size:14px;letter-spacing:.06em;color:var(--ink);font-weight:500;}
    .lb-mine{margin:20px 22px 0;background:var(--ink);color:#fff;padding:18px;}
    .lb-mine.intop{border-left:5px solid var(--lime);padding-left:13px;}
    .lb-mine .lb-kicker{color:var(--lime);}
    .lb-mine-main{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px;}
    .lb-mine-num{font-family:var(--bf-bear);font-size:38px;line-height:1;}
    .lb-mine-val{font-family:var(--bf-toni);font-size:14px;letter-spacing:.08em;opacity:.85;}
    .lb-mine-sub{font-size:13px;opacity:.75;margin-top:6px;line-height:1.45;}
    .lb-mine.notyet{background:#FFFCF7;color:var(--ink);border:2px solid rgba(0,0,0,.12);}
    .lb-mine.notyet .lb-kicker{color:var(--olive);}
    .lb-rewards{margin:20px 22px 0;background:#FFFCF7;border:2px solid rgba(0,0,0,.12);padding:14px 16px;}
    .lb-rewards .lb-kicker{color:var(--olive);}
    .lb-rw-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(0,0,0,.12);}
    .lb-rw-row:last-child{border-bottom:none;}
    .lb-rw-tag{background:var(--lime);color:var(--ink);padding:3px 9px;font-family:var(--bf-toni);font-size:10px;letter-spacing:.1em;white-space:nowrap;}
    .lb-rw-text{flex:1;font-size:13px;line-height:1.5;color:var(--ink);}
    /* about */
    .about-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(0,0,0,.12);margin:18px 22px 0;border:2px solid var(--ink);}

    /* ════════ Shop — mobile LIST layout (faithful port of the mini-app shop
         list view: CATEGORIES header · search · view-switcher · dietary chips ·
         left category rail + grouped product list). Rendered only <768px;
         desktop keeps its own PC-native grid. Sizes ≈ mini-app rpx × 0.5. ════ */
    .shoplist{display:flex;flex-direction:column;overflow:hidden;}
    .sl-hd{padding:18px 22px 8px;text-align:center;}
    .sl-hd .t{font-family:var(--bf-bear);font-size:21px;letter-spacing:.04em;color:var(--ink);}
    .sl-search{display:flex;align-items:center;gap:8px;margin:6px 22px 10px;padding:9px 12px;background:#FFFCF7;border:1.5px solid var(--ink);}
    .sl-search .ic{font-size:15px;opacity:.55;flex:none;}
    .sl-search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);}
    .sl-search .clr{width:22px;text-align:center;color:var(--olive);font-size:18px;cursor:pointer;flex:none;}
    .sl-vs{display:flex;justify-content:flex-end;gap:5px;padding:0 22px 6px;}
    .sl-vs button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:1.5px solid rgba(0,0,0,.2);color:var(--olive);font-size:15px;line-height:1;border-radius:0;}
    .sl-vs button.on{background:var(--ink);border-color:var(--ink);color:var(--lime);}
    .sl-diet{display:flex;gap:6px;overflow-x:auto;padding:2px 22px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .sl-diet::-webkit-scrollbar{display:none;}
    .sl-diet .c{flex:none;padding:5px 13px;background:rgba(0,0,0,.04);color:var(--olive);border:1.5px solid transparent;border-radius:999px;font-family:var(--bf-toni);font-weight:700;font-size:11px;letter-spacing:.08em;white-space:nowrap;cursor:pointer;}
    .sl-diet .c.on{background:var(--lime);color:var(--ink);border-color:var(--ink);}
    .sl-body{flex:1;display:flex;min-height:0;border-top:1.5px solid rgba(0,0,0,.1);}
    .sl-side{width:92px;flex:none;background:var(--oat);border-right:1.5px solid var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .sl-side::-webkit-scrollbar{display:none;}
    .sl-tab{display:flex;align-items:center;justify-content:center;gap:2px;padding:16px 5px;text-align:center;border-bottom:1.5px solid rgba(0,0,0,.08);cursor:pointer;}
    .sl-tab .lb{font-family:var(--bf-bear);font-size:13px;line-height:1.15;color:var(--ink);}
    .sl-tab.on{background:var(--lime);}
    .sl-tab .chev{flex:none;width:10px;text-align:center;color:var(--olive);font-size:13px;line-height:1;}
    .sl-tab.has-chev::before{content:'';flex:none;width:10px;}
    .sl-tab.on .chev{color:var(--ink);}
    .sl-back{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 6px;background:var(--olive);cursor:pointer;}
    .sl-back .cv{color:var(--oat);font-size:18px;line-height:1;}
    .sl-back .tx{color:var(--oat);font-size:10px;letter-spacing:.04em;font-family:var(--bf-bear);}
    .sl-parent{padding:9px 6px 7px;text-align:center;font-size:10px;letter-spacing:.14em;color:var(--olive);border-bottom:1.5px solid rgba(0,0,0,.12);font-family:var(--bf-toni);text-transform:uppercase;}
    /* Rail fold — the left menu hinges open like an accordion (each row drops
       from its top edge, staggered) when the rail content changes (drill in/out
       or first load), mirroring the mini-app .rail-pane railFold. Highlight
       toggles don't re-mount rows, so they never replay it. */
    .sl-side{perspective:600px;}
    @keyframes slRailFold{from{opacity:0;transform:rotateX(-62deg);}to{opacity:1;transform:rotateX(0);}}
    .sl-side>.sl-tab,.sl-side>.sl-back,.sl-side>.sl-parent{transform-origin:top center;animation:slRailFold .3s cubic-bezier(.34,.8,.4,1) both;}
    .sl-side>*:nth-child(1){animation-delay:0s;}
    .sl-side>*:nth-child(2){animation-delay:.035s;}

// After an OAuth round-trip the callback redirects to /?oauth=<one-time code>.
// Exchange it for the real bearer token (kept out of the URL), then clean up.
async function consumeOauthRedirect(){
  let p; try{ p=new URLSearchParams(location.search); }catch{ return; }
  const err=p.get('oauth_error'); const handoff=p.get('oauth');
  if(!err&&!handoff) return;
  const back=p.get('r')||'';
  try{ const u=new URL(location.href); ['oauth','oauth_error','r'].forEach(k=>u.searchParams.delete(k));
    history.replaceState(null,'',u.pathname+u.search+(back||u.hash)); }catch{}
  if(err){ toast(cn()?'登录失败，请重试':'Sign-in failed — please try again'); return; }
  try{
    const d=await postJson('/api/retail/auth/oauth/claim',{code:handoff});
    setAuth(d.token,d.customer);
    toast(cn()?'登录成功 🌱':'Signed in 🌱');
    applyPendingRef();
  }catch(e){ toast(cn()?'登录失败，请重试':'Sign-in failed — please try again'); }
}

/* ── theming ── */
const ACCENTS={
  'forest-kale':'#365329','forest':'#365329','olive-moss':'#6A6E2D','olive':'#6A6E2D',
  'lime-leaf':'#6A8E2D','lime':'#6A8E2D','berry-punch':'#E96174','berry':'#E96174',
  'carrot-blaze':'#FF6B0C','carrot':'#FF6B0C','papaya-glow':'#E08A3C','golden-corn':'#C99A2E',
  'skyberry':'#5B86C4','sky':'#5B86C4','lotus':'#C879B6','pink-guava':'#D4669A',
  'pea-sprout':'#5DA02E','pea':'#5DA02E','citrus-zest':'#9AAE22',
};
// Inject @font-face rules for self-hosted "upload" brand fonts so a custom
// display/body family configured in the backoffice actually loads on web — the
// same theme.fonts.*.url the mini-app reads. Library fonts already have their
// @font-face in the head; these only cover source:'upload' with an https url.
// Idempotent: one <style id="brandFonts"> rebuilt each call, deduped by family.
function loadBrandFonts(fonts){
  const fmt=(u)=>{ const m=String(u).toLowerCase().match(/\.(woff2|woff|otf|ttf)(?:[?#]|$)/);
    return m?({woff2:'woff2',woff:'woff',otf:'opentype',ttf:'truetype'}[m[1]]):''; };
  const seen=new Set(); const rules=[];
  [fonts.display,fonts.body].forEach((f)=>{
    if(!f||!f.url||!f.family) return;
    if(!/^https:\/\//i.test(f.url)) return;          // server already filters, double-check
    const fam=String(f.family).replace(/'/g,'');
    if(seen.has(fam)) return; seen.add(fam);
    const f2=fmt(f.url); const fc=f2?` format('${f2}')`:'';
    rules.push(`@font-face{font-family:'${fam}';src:url('${f.url}')${fc};font-display:swap;}`);
  });
  let el=document.getElementById('brandFonts');
  if(!rules.length){ if(el) el.textContent=''; return; }
  if(!el){ el=document.createElement('style'); el.id='brandFonts'; document.head.appendChild(el); }
  el.textContent=rules.join('\n');
}
function applyTheme(cfg){
  const t=(cfg&&cfg.theme)||{};
  const p=t.palette||{};
  const root=document.documentElement;
  const setVar=(k,v)=>{ if(v) root.style.setProperty(k,v); };
  // Apply the FULL backoffice-published brand palette so the web store stays in
  // lockstep with the mini-app (both read /api/retail/config). Mirror of the
  // mini-app's buildThemeVars (miniapp/utils/theme.js): one setting → both
  // platforms. surface→--oat (incl. the bottom nav bar), ink→--ink,
  // primary→--forest, accent→--lime, muted→--olive.
  setVar('--oat',    p.surface);
  setVar('--ink',    p.ink);
  setVar('--forest', p.primary);
  setVar('--lime',   p.accent);
  setVar('--olive',  p.muted);
  // Brand fonts — same CJK fallback tail the mini-app uses. Self-hosted upload
  // fonts get an injected @font-face (see loadBrandFonts) so the family resolves;
  // library fonts already have @font-face in the head. Either way this falls back
  // to the hardcoded stack when the family can't load, so it degrades gracefully.
  loadBrandFonts(t.fonts||{});
  const CJK="'DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,sans-serif";
  const fam=(f)=> (f&&f.family) ? `'${String(f.family).replace(/'/g,'')}', ${CJK}` : '';
  setVar('--f-bear', fam(t.fonts&&t.fonts.display));
  setVar('--f-aleo', fam(t.fonts&&t.fonts.body));
  // Active-tab / link accent. Prefer the published palette primary (parity with
  // the mini-app's selected tab colour); fall back to the legacy named token.
  const hex = p.primary || ACCENTS[t.accent] || '#365329';
  root.style.setProperty('--accent',hex);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',hex);
}
// Make the mobile browser address bar (theme-color) follow the top of whatever
// page is showing — green hero on home, lime hero on Me, oat elsewhere, etc.
// Fully generic: we sample the actual rendered colour just under the browser
// chrome rather than hardcoding per route, so it fits any tenant/layout.
function _rgbToHex(c){
  const m=String(c||'').match(/\d+(\.\d+)?/g); if(!m||m.length<3) return null;
  return '#'+m.slice(0,3).map(n=>Math.round(+n).toString(16).padStart(2,'0')).join('');
}
function _effectiveBg(el){
  for(let n=el; n && n!==document.documentElement; n=n.parentElement){
    const c=getComputedStyle(n).backgroundColor;
    if(c && c!=='transparent' && !/^rgba?\(0,\s*0,\s*0,\s*0\)$/.test(c.replace(/\s/g,'')) ) return c;
  }
  return getComputedStyle(document.body).backgroundColor;
}
// Many heroes are full-bleed <img>/<video> whose colour lives in the pixels, not
// a CSS background — read the actual pixel under the sample point for those.
function _mediaPixelHex(el,cx,cy){
  try{
    const tag=el.tagName, r=el.getBoundingClientRect();
    let nw,nh,src=el;
    if(tag==='IMG'){ if(!el.complete||!el.naturalWidth) return null; nw=el.naturalWidth; nh=el.naturalHeight; }
    else if(tag==='VIDEO'){ if(!el.videoWidth) return null; nw=el.videoWidth; nh=el.videoHeight; }
    else if(tag==='CANVAS'){ nw=el.width; nh=el.height; }
    else return null;
    if(!nw||!nh) return null;
    // Map the client point into natural-pixel space. object-fit:cover scales to
    // fill (centre-crop); contain letterboxes. Approximate by the dominant axis.
    const fit=getComputedStyle(el).objectFit||'fill';
    const rx=Math.min(1,Math.max(0,(cx-r.left)/r.width));
    const ry=Math.min(1,Math.max(0,(cy-r.top)/r.height));
    let nx, ny;
    if(fit==='cover'||fit==='contain'){
      const s = fit==='cover' ? Math.max(r.width/nw, r.height/nh) : Math.min(r.width/nw, r.height/nh);
      const dw=nw*s, dh=nh*s, ox=(r.width-dw)/2, oy=(r.height-dh)/2;
      nx=Math.round(((cx-r.left)-ox)/s); ny=Math.round(((cy-r.top)-oy)/s);
    } else { nx=Math.round(rx*nw); ny=Math.round(ry*nh); }
    nx=Math.min(nw-1,Math.max(0,nx)); ny=Math.min(nh-1,Math.max(0,ny));
    const cv=document.createElement('canvas'); cv.width=1; cv.height=1;
    const g=cv.getContext('2d'); g.drawImage(src,nx,ny,1,1,0,0,1,1);
    const d=g.getImageData(0,0,1,1).data;
    if(d[3]===0) return null;
    return '#'+[d[0],d[1],d[2]].map(n=>n.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }   // cross-origin taint etc. → fall back to CSS bg
}
function syncThemeColor(){
  const m=document.querySelector('meta[name=theme-color]'); if(!m) return;
  const x=Math.round(window.innerWidth/2);
  let el=null, y0=0;
  // Sample a few points down from the very top; skip floating/fixed chrome that
  // overlays the content (lang pill, top bar, tab bar) so we read the page itself.
  for(const y of [3,8,16,28]){
    const hit=document.elementFromPoint(x,y);
    if(hit && !(hit.closest && hit.closest('#mLangFloat,#mtop,header,nav.links,.tabbar,#tabbar'))){ el=hit; y0=y; break; }
  }
  if(!el) return;
  // Image/video/canvas heroes carry colour in pixels; CSS bg otherwise.
  let hex = _mediaPixelHex(el,x,y0) || _rgbToHex(_effectiveBg(el));
  if(hex) m.setAttribute('content',hex);
}

  .cx-place:disabled{opacity:.5;color:rgba(204,217,0,.6);cursor:default;}
  @media(min-width:560px){.cx-sticky{max-width:520px;margin:0 auto;}}
  /* ── Checkout, PC-native (≥1024): the form (address / when / pay / add-ons /

  @media(min-width:1024px){

}

// Detect the shopper's environment so we can pick the right WeChat/Alipay web
// product. WeChat: in-app → JSAPI; mobile browser → H5 (opens the WeChat app);
// desktop → Native (scan a QR). Alipay: mobile → wap (opens the Alipay app);
// desktop → page (Alipay login). The server maps each channel to its API.
function payEnv(){
  const ua=navigator.userAgent||'';
  return { inWechat:/MicroMessenger/i.test(ua), mobile:/Mobile|Android|iPhone|iPad|iPod/i.test(ua) };
}
function wxChannel(){ const e=payEnv(); return e.inWechat?'jsapi':(e.mobile?'h5':'native'); }
function aliChannel(){ const e=payEnv(); return e.mobile?'wap':'page'; }
// Payment rows — match the mini-app's swatch layout. Both WeChat Pay and Alipay
// are selectable on the web now (WeChat via H5/Native, Alipay via wap/page); a
// short pill hints how each will behave on the current device.
function coRenderPay(){
  const box=$('#coPay'); if(!box)return; const cn=state.lang==='cn';
  // Which rails the server says are live (real merchant configured). An
  // unconfigured rail shows greyed "Coming soon" rather than a dead option.
  const pay=(state.config&&state.config.payments)||{};
  const wxOk=!!pay.wechat, aliOk=!!pay.alipay;
  // Keep the selection on an available rail (prefer Alipay — the established web
  // path — then WeChat).
  if(co.payment!=='wechat'&&co.payment!=='alipay') co.payment = aliOk?'alipay':(wxOk?'wechat':'alipay');
  if(co.payment==='wechat'&&!wxOk) co.payment = aliOk?'alipay':'wechat';
  if(co.payment==='alipay'&&!aliOk&&wxOk) co.payment='wechat';
  const env=payEnv();
  const soon=cn?'即将开放':'Coming soon';
  const wxHint = wxOk ? (env.inWechat?'':(env.mobile?(cn?'跳转微信':'Opens WeChat'):(cn?'扫码支付':'Scan QR'))) : soon;
  const aliHint = aliOk ? (env.mobile?(cn?'跳转支付宝':'Opens Alipay'):(cn?'扫码支付':'Scan QR')) : soon;
  const row=(id,on,dis,color,label,hint)=>
    `<div class="cx-pay${dis?' dis':''}" id="${id}"><span class="cx-dot ${on&&!dis?'on':''}"></span><span class="cx-swatch" style="background:${color}"></span><span class="cx-pay-label">${label}</span>${hint?`<span class="cx-pill">${hint}</span>`:''}</div>`;
  box.innerHTML=
    row('coPayWechat',co.payment==='wechat',!wxOk,'#1AAD19',cn?'微信支付':'WeChat Pay',wxHint)+
    row('coPayAlipay',co.payment==='alipay',!aliOk,'#1677FF',cn?'支付宝':'Alipay',aliHint);
  if(wxOk)$('#coPayWechat').onclick=()=>{ co.payment='wechat'; coRenderPay(); };
  if(aliOk)$('#coPayAlipay').onclick=()=>{ co.payment='alipay'; coRenderPay(); };
}

/* ════════ Address region cascade + map pin (mirrors the mini-app) ════════
   The web form can't free-type a city — the server derives the 省 from a
   *Chinese* city name, so English text never resolves a region and the save
   400s. Instead we pick from the served-zone list (canonical Chinese) and/or
   drop a pin on a map (reverse-geocoded server-side). Both write
   province/city/district onto co.af, exactly what /addresses expects. */
var coZones={list:null,distCache:{},maps:undefined,_sdkP:null};
async function coLoadZones(){
  if(coZones.list)return coZones.list;
  try{ coZones.list=await api('/api/retail/delivery-zones')||[]; }catch(e){ coZones.list=[]; }
  return coZones.list;
}
// City rows only — GZ districts are reached via the city 广州市 + its districts,
// the same shape as the mini-app's EN cascade. Each carries canonical Chinese.
function coCityRows(){
  const cn=state.lang==='cn';
  return (coZones.list||[]).filter(z=>z.zone_type==='city').map(z=>{
    const name_cn=z.match_city||z.name_cn||z.name_en||'';
    const name_en=z.name_en||z.name_cn||'';
    return {label:cn?name_cn:name_en,name_cn,name_en,province_cn:z.province_cn||'',province_en:z.province_en||''};
  }).sort((a,b)=>String(a.label).localeCompare(String(b.label)));
}
async function coLoadDistricts(cityCn){
  if(!cityCn)return [];
  if(coZones.distCache[cityCn])return coZones.distCache[cityCn];
  let list=[];
  try{ list=await api('/api/retail/districts?city='+encodeURIComponent(cityCn))||[]; }catch(e){ list=[]; }
  coZones.distCache[cityCn]=list; return list;
}
// Strip a leading "省市区" prefix off a reverse-geocoded street (so the street
// field holds only the building/road, not a doubled region).
function coStripRegion(addr,province,city,district){
  let s=String(addr||'').trim();
  [province,city,district].filter(Boolean).sort((a,b)=>b.length-a.length).forEach(v=>{
    const re=new RegExp('^\\s*'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*');
    let go=true; while(go){ go=false; if(re.test(s)){ s=s.replace(re,''); go=true; } }
  });
  return s.trim();
}
// lat/lng are only passed by the MAP picker — it knows the exact spot the
// customer pointed at. Keeping them is what stops every later step (store
// routing, the courier waybill) from re-deriving a pin from the text, which is
// how an order ends up at a same-named estate or a district centre kilometres
// away. The city/district picker calls this without coordinates, which clears
// any stale pin — correct, since only an area was chosen.
function coApplyArea(province,city,district,label,street,lat,lng){
  co.af.province=province||''; co.af.city=city||''; co.af.district=district||'';
  co.af.areaLabel=label||[city,district].filter(Boolean).join(' · ');
  co.af.lat=(lat!=null&&isFinite(lat))?Number(lat):null;
  co.af.lng=(lng!=null&&isFinite(lng))?Number(lng):null;
  // Only a MAP pick is a first-hand observation of where the customer lives.
  // The server refuses to record anything else as a customer pin, so it has to
  // be told, here, at the moment of the tap — a round-tripped coordinate on a
  // later edit carries no such claim.
  co.af.pinFresh=(co.af.lat!=null&&co.af.lng!=null);
  const t=$('#afArea'); if(t){ t.textContent=co.af.areaLabel; t.classList.remove('ph'); }
  if(street!=null){ const a=$('#afAddr'); if(a)a.value=street; }
}
// Retyping the STREET invalidates a pin picked earlier — it now points at a
// place the text no longer describes. The floor/unit box is deliberately NOT
// wired up: the building is unchanged, and "pick on the map, then type the room
// number" is the normal order of doing this.
function coBindStreetClearsPin(){
  const a=$('#afAddr');
  if(a)a.addEventListener('input',()=>{ co.af.lat=null; co.af.lng=null; co.af.pinFresh=false; });
}

async function openAreaPicker(){
  const cn=state.lang==='cn';
  coInjectAddrStyle();
  await coLoadZones();
  const cities=coCityRows();
  let ov=document.createElement('div'); ov.className='lm-overlay'; ov.id='apOverlay';
  ov.innerHTML=`<div class="lm-card"><button class="lm-x" id="apX">×</button>
    <div class="lm-title">${cn?'配送区域':'Delivery area'}</div>
    <input class="ap-search" id="apSearch" placeholder="${cn?'搜索城市…':'Search a city…'}">
    <div id="apBackWrap"></div>
    <div class="ap-list" id="apList"></div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ try{document.body.removeChild(ov);}catch(e){} };
  $('#apX').addEventListener('click',close);
  ov.addEventListener('click',e=>{ if(e.target===ov)close(); });

  const listEl=$('#apList'), backWrap=$('#apBackWrap'), searchEl=$('#apSearch');
  let mode='city', curCity=null;

  function renderCities(q){
    backWrap.innerHTML=''; searchEl.placeholder=cn?'搜索城市…':'Search a city…';
    const f=(q||'').trim().toLowerCase();
    const rows=cities.filter(c=>!f||c.label.toLowerCase().includes(f)||(c.name_cn||'').includes(q||'')||(c.name_en||'').toLowerCase().includes(f));
    listEl.innerHTML=rows.length?rows.map((c,i)=>`<div class="ap-item" data-i="${i}">${esc(c.label)}</div>`).join('')
      :`<div class="ap-empty">${cn?'未找到城市':'No matching city'}</div>`;
    listEl.querySelectorAll('.ap-item').forEach(el=>el.addEventListener('click',()=>pickCity(rows[Number(el.dataset.i)])));
  }
  async function pickCity(c){
    if(!c)return;
    curCity=c; searchEl.value=''; listEl.innerHTML=`<div class="ap-empty">${cn?'加载中…':'Loading…'}</div>`;
    const dists=await coLoadDistricts(c.name_cn);
    if(!dists.length){   // city-wide delivery, no districts → done
      coApplyArea(c.province_cn,c.name_cn,'',c.label); close(); return;
    }
    mode='district'; searchEl.placeholder=cn?'搜索区/县…':'Search a district…';
    backWrap.innerHTML=`<button class="ap-back" id="apBack"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><polyline points="15 18 9 12 15 6"></polyline></svg>${esc(c.label)} — ${cn?'返回城市':'change city'}</button>`;
    $('#apBack').addEventListener('click',()=>{ mode='city'; renderCities(''); });
    renderDistricts(c,dists,'');
  }
  function renderDistricts(c,dists,q){
    const f=(q||'').trim().toLowerCase();
    const cityWide={label:cn?'全城':'City-wide',name_cn:'',name_en:'City-wide'};
    const all=[cityWide].concat(dists.map(d=>({label:cn?d.name_cn:d.name_en,name_cn:d.name_cn,name_en:d.name_en})));
    const rows=all.filter(d=>!f||d.label.toLowerCase().includes(f)||(d.name_cn||'').includes(q||''));
    listEl.innerHTML=rows.map((d,i)=>`<div class="ap-item" data-i="${i}">${esc(d.label)}</div>`).join('');
    listEl.querySelectorAll('.ap-item').forEach(el=>el.addEventListener('click',()=>{
      const d=rows[Number(el.dataset.i)];
      const label=d.name_cn?[c.label,d.label].join(' · '):c.label;
      coApplyArea(c.province_cn,c.name_cn,d.name_cn,label); close();
    }));
  }
  searchEl.addEventListener('input',()=>{
    if(mode==='city')renderCities(searchEl.value);
    else coLoadDistricts(curCity.name_cn).then(d=>renderDistricts(curCity,d,searchEl.value));
  });
  renderCities('');
  setTimeout(()=>searchEl.focus(),60);
}

function coLoadMapSdk(cfg){
  if(coZones._sdkP)return coZones._sdkP;
  coZones._sdkP=new Promise((resolve,reject)=>{
    const cb='__shopMapReady';
    window[cb]=function(){ resolve(cfg.provider); };
    let src;
    if(cfg.provider==='amap'){
      if(cfg.security)window._AMapSecurityConfig={securityJsCode:cfg.security};
      src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(cfg.key)+'&callback='+cb;
    }else{
      src='https://map.qq.com/api/gljs?v=1.exp&key='+encodeURIComponent(cfg.key)+'&callback='+cb;
    }
    const s=document.createElement('script'); s.src=src; s.async=true;
    s.onerror=()=>reject(new Error('sdk_load_failed'));
    document.head.appendChild(s);
  });
  return coZones._sdkP;
}
function coMapAdapter(provider,el,center){
  if(provider==='amap'){
    const map=new AMap.Map(el,{zoom:16,center:[center.lng,center.lat],resizeEnable:true});
    let dot=null;
    return {
      onMove:cb=>map.on('moveend',()=>{const c=map.getCenter();cb({lat:c.getLat(),lng:c.getLng()});}),
      setCenter:(lat,lng)=>map.setCenter([lng,lat]),
      setUserDot:(lat,lng)=>{
        if(!dot){ dot=new AMap.Marker({content:'<div class="mp-userdot"></div>',anchor:'center',offset:new AMap.Pixel(0,0),zIndex:50}); dot.setMap(map); }
        dot.setPosition([lng,lat]);
      },
      destroy:()=>{try{map.destroy();}catch(e){}},
    };
  }
  const map=new TMap.Map(el,{zoom:16,center:new TMap.LatLng(center.lat,center.lng)});
  let dot=null;
  return {
    onMove:cb=>map.on('center_changed',()=>{const c=map.getCenter();cb({lat:c.getLat(),lng:c.getLng()});}),
    setCenter:(lat,lng)=>map.setCenter(new TMap.LatLng(lat,lng)),
    setUserDot:(lat,lng)=>{
      const pos=new TMap.LatLng(lat,lng);
      if(!dot){ dot=new TMap.MultiMarker({map,styles:{u:new TMap.MarkerStyle({width:16,height:16,anchor:{x:8,y:8},src:'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><circle cx="8" cy="8" r="6" fill="#1aad19" stroke="#fff" stroke-width="2"/></svg>')})},geometries:[{id:'u',styleId:'u',position:pos}]}); }
      else dot.updateGeometries([{id:'u',styleId:'u',position:pos}]);
    },
    destroy:()=>{try{map.destroy();}catch(e){}},
  };
}
async function openMapPicker(){
  const cfg=coZones.maps; if(!cfg||!cfg.provider)return;
  const cn=state.lang==='cn';
  coInjectAddrStyle();
  let ov=document.createElement('div'); ov.className='mp-overlay'; ov.id='mpOverlay';
  ov.innerHTML=`<div class="mp-card">
    <div class="mp-head"><div class="mp-title">${cn?'地图选点':'Choose on map'}</div><button class="mp-x" id="mpX">×</button></div>
    <div class="mp-searchrow"><input id="mpSearch" class="mp-search" placeholder="${cn?'搜索地点 / 小区 / 道路':'Search a place / road'}"><button id="mpSearchBtn" class="mp-sbtn">${cn?'搜索':'Search'}</button></div>
    <div id="mpResults" class="mp-results" hidden></div>

  </div>`;
  document.body.appendChild(ov);

  ov.addEventListener('click',e=>{ if(e.target===ov)close(); });

  const addrEl=$('#mpAddr'), useBtn=$('#mpUse'), resultsEl=$('#mpResults'), searchEl=$('#mpSearch');
  // suppressUntil: ignore move-driven reverse-geocodes for a short window after
  // a programmatic recenter (picking a search result) — the SDK fires several

  let sel=null, suppressUntil=0, moveTimer=null;
  function setSel(s){
    sel=s; useBtn.disabled=!s;
    addrEl.textContent=s?[s.city,s.district].filter(Boolean).join(' · ')+(s.street?(' · '+s.street):''):(cn?'此处无法识别地址':'No address here');
  }
  async function reverseCenter(lat,lng){
    addrEl.textContent=cn?'定位中…':'Locating…'; useBtn.disabled=true;
    try{
      const r=await postJson('/api/retail/reverse-geocode',{lat,lng});
      if(r&&r.success===false){ setSel(null); return; }
      const street=coStripRegion(r.address,r.province,r.city,r.district);
      if(!r.city&&!r.province){ setSel(null); return; }
      // Keep the map centre itself — that's the spot the customer is pointing
      // at, and it's more exact than anything the text can be re-resolved to.

    resultsEl.innerHTML=list.slice(0,15).map((p,i)=>`<div class="mp-res" data-i="${i}"><div class="n">${esc(p.name||'')}</div><div class="a">${esc(p.address||'')}</div></div>`).join('');
    resultsEl.querySelectorAll('.mp-res[data-i]').forEach(el=>el.addEventListener('click',()=>{

      setSel({province:p.province||'',city:p.city||'',district:p.district||'',street,
        lat:p.lat,lng:p.lng,label:[p.city,p.district].filter(Boolean).join(' · ')});
      suppressUntil=Date.now()+1200;           // recenter shouldn't overwrite the POI pick

    }));
  }
  $('#mpSearchBtn').addEventListener('click',runSearch);
  searchEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();runSearch();} });
  useBtn.addEventListener('click',()=>{
    if(!sel)return;

    close();
  });

  // Recenter on the visitor. Amap's Geolocation plugin returns GCJ-02 coords
  // (matching the map), so prefer it; otherwise fall back to a coarse server
  // IP lookup. Selection stays on the centre pin — the customer drags the rest.
  const locateBtn=$('#mpLocate');
  function amapGeolocate(){
    return new Promise(resolve=>{
      if(cfg.provider!=='amap'||!window.AMap){ resolve(null); return; }
      try{
        AMap.plugin('AMap.Geolocation',()=>{
          const geo=new AMap.Geolocation({enableHighAccuracy:true,timeout:8000,GeoLocationFirst:true,convert:true});
          geo.getCurrentPosition((status,result)=>{
            const p=result&&result.position;
            if(status==='complete'&&p&&isFinite(p.lat)&&isFinite(p.lng))resolve({lat:p.lat,lng:p.lng});
            else resolve(null);
          });
        });
      }catch(e){ resolve(null); }
    });
  }
  async function locate(silent){
    if(locateBtn)locateBtn.disabled=true;

    if(locateBtn)locateBtn.disabled=false;
    if(!pt){ if(!silent)addrEl.textContent=cn?'无法定位，请拖动地图':'Couldn’t locate — drag the map'; return; }
    resultsEl.hidden=true;
    suppressUntil=Date.now()+1200;        // the recenter's move events shouldn't double-reverse

  }

  // Load the SDK + build the map (seed on Guangzhou; customer searches/drags).
  try{
    await coLoadMapSdk(cfg);
    adapter=coMapAdapter(cfg.provider,$('#mpMap'),{lat:23.1291,lng:113.2644});
    adapter.onMove(({lat,lng})=>{
      if(Date.now()<suppressUntil)return;

    });

    else locate(true);                    // no chosen city yet → auto-jump to the visitor
  }catch(e){
    addrEl.textContent=cn?'地图加载失败':'Map failed to load';
  }
}

/* ════════ Rider-phone notice (mirrors the mini-app) ════════

   `same_city_rider` comes from the quote, decided by the same server predicate

   The number test is the mini-app's rule in miniapp/utils/phone.js and the
   server's in lib/phone-cn.js — three copies of one regex, because three
   bundles, kept deliberately trivial so they stay in step. */
const CO_MAINLAND_MOBILE=/^1\d{10}$/;
// A leading '+' means international unless it unwraps to a mainland mobile:
// '+1 415 555 2671' is eleven digits beginning 1 once the '+' is dropped, so
// without this the customer sees no notice for a phone no rider can ring.
// Same rule as lib/phone-cn.js and miniapp/utils/phone.js — keep the three in step.
function coIsMainlandMobile(raw){
  const t=String(raw==null?'':raw).trim();
  const plus=t.charAt(0)==='+';
  const digits=t.replace(/\D/g,'');
  if(!digits)return false;
  const un = digits.length===13&&digits.indexOf('86')===0   ? digits.slice(2)
           : digits.length===14&&digits.indexOf('086')===0  ? digits.slice(3)
           : digits.length===15&&digits.indexOf('0086')===0 ? digits.slice(4)
           : null;
  if(un!=null&&CO_MAINLAND_MOBILE.test(un))return true;
  return !plus&&CO_MAINLAND_MOBILE.test(digits);
}

/* The server never stamps a `slot_kind` onto slot objects — it only echoes one
   back on reschedule — so `s.slot_kind` is always undefined here and the order
   POST used to send delivery_slot_kind=''. In a day-only ship-district (Panyu)
   the server reads that as "not same-day", pins the order to the out-of-city
   warehouse and couriers it next day, WHILE resolveDeliverySlot still charges
   the same-day surcharge: paid for today, delivered tomorrow. Derive the kind
   the way the reschedule picker below already does.
   Scoped to day-only slots on purpose. Time-slot zones (Yuexiu/Tianhe) carry no
   surcharge and are never pinned, and their '' kind feeds the admin ship-by
   column — so they keep sending exactly what they sent before. */
function coSlotKind(s){
  if(!s)return'';
  if(s.slot_kind)return s.slot_kind;
  if(s.slot_id==='right_away')return'right_away';
  if(s.is_day_only)return s.is_same_day?'today':'express';
  return'';
}
function renderCoSlots(d){
  const box=$('#coSlots'); if(!box)return; const cn=state.lang==='cn'; const sc=d.scheduling||{}; let slots=Array.isArray(sc.slots)?sc.slots:[];
  /* Day-only zones return ONLY the surcharged Today chip in `slots`; the free
     earliest-day option lives in the sibling `express_slot`, which this page
     never read. That left a Panyu customer with a single pre-selected option
     they could not decline — the surcharge was effectively compulsory. Offer
     both, free one first so it is what they land on. */
  if(sc.mode==='day_only'&&sc.express_slot){
    const today=sc.today_day_chip||slots.find(s=>s.is_same_day)||null;
    slots=today?[sc.express_slot,today]:[sc.express_slot];
  }
  /* No option at all. This used to force-select 'right_away' and print a
     reassuring "As soon as possible" — an option the customer could not decline
     and the server then refused with right_away_unavailable (right_away needs
     the kitchen open, zero lead and no surcharge, which is exactly the state
     that produced no slots). Say plainly that there is no date, and let the
     summary keep the place button disabled rather than send them into a
     rejection. */
  co.noDates=!slots.length;
  if(!slots.length){
    co.slotId='';co.slotKind='';
    box.innerHTML=`<div class="cx-opt cx-opt--none"><div class="cx-opt-body"><div class="cx-opt-label">${cn?'暂无可选配送日期':'No delivery dates available'}</div><div class="cx-opt-sub">${cn?'此地址目前没有可安排的配送日期。请稍后再试或联系我们。':'We can’t schedule a delivery to this address right now. Please try again later or contact us.'}</div></div></div>`;
    return;
  }
  if(!co.slotId||!slots.find(s=>s.slot_id===co.slotId)){ co.slotId=slots[0].slot_id; co.slotKind=coSlotKind(slots[0]); }
  box.innerHTML=slots.map(s=>{
    const on=s.slot_id===co.slotId, sur=Number(s.surcharge)>0?` (+${money(s.surcharge)})`:'';
    const label=esc(cn?(s.label_cn||s.label_en):(s.label_en||s.label_cn));
    return `<div class="cx-opt ${on?'on':''}" data-id="${escAttr(s.slot_id)}"><div class="cx-opt-body"><div class="cx-opt-label">${label}${sur}</div>${s.sub_label?`<div class="cx-opt-sub">${esc(s.sub_label)}</div>`:''}</div><span class="cx-check"><span class="cx-check-dot"></span></span></div>`;
  }).join('');
  box.querySelectorAll('.cx-opt[data-id]').forEach(el=>el.addEventListener('click',()=>{const s=slots.find(x=>x.slot_id===el.dataset.id);co.slotId=el.dataset.id;co.slotKind=coSlotKind(s);coQuote();}));
}
function renderCoSummary(d){
  const box=$('#coSummary'); if(!box)return; const cn=state.lang==='cn';
  const sub=Number(d.subtotal)||0, ship=Number(d.delivery_fee)||0, pack=Number(d.packing_fee)||0, tot=Number(d.total)||0;
  const earn=Number(d.points_earn_preview||d.points_earned_preview||d.points_earn||0)||0;
  box.innerHTML=
    `<div class="cx-bd"><span class="cx-bd-l">${cn?'小计':'Subtotal'}</span><span class="cx-bd-v">${money(sub)}</span></div>`+
    `<div class="cx-bd"><span class="cx-bd-l">${cn?'配送费':'Delivery'}</span><span class="cx-bd-v">${d.free_shipping?(cn?'免运费':'Free'):money(ship)}</span></div>`+
    (pack>0?`<div class="cx-bd"><span class="cx-bd-l">${cn?'包装费':'Packing fee'}</span><span class="cx-bd-v">${money(pack)}</span></div>`:'')+
    /* Tax (audit I-03). Straight off the quote — this page takes its total from
       the server rather than recomputing one, so there is nothing here to keep
       in step. It says which kind it is: an inclusive tax is already inside the
       figures above it, and a bare line would make the column stop adding up.
       Absent entirely on a shop that charges no tax. */
    (d.tax?`<div class="cx-bd"><span class="cx-bd-l">${esc((cn?d.tax.label.cn:d.tax.label.en)||(cn?'税费':'Tax'))}${d.tax.mode==='inclusive'?(cn?' · 已含':' · included'):''}</span><span class="cx-bd-v">${money(Number(d.tax.amount)||0)}</span></div>`:'')+
