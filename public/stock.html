  // Every section's back control returns here when the launcher exists, and
  // leaves the app where it was when it does not.
  //
  // UNLESS THEY CAME THROUGH A NAMED DOOR. Someone who tapped "Kitchen queue"
  // in /m never passed through this launcher on the way in, and dropping them
  // onto it on the way out would hand them a menu whose tiles are the rows they
  // just came from — "Add stock" included, which has its own row there. Back
  // means /m for them, because /m is where they were.
  function homeBack() {
    if (_deep && state.home) { window.location.href = state.home; return; }
    if (!homeAvailable()) { homeGoCount(); return; }
    state.view = 'home'; homeRender();
  }

  /* Where the app opens. Decided ONCE, so the launcher cannot flash up and
     vanish — or worse, appear a second after someone has already started
     counting.

     IT WAITS FOR ALL THREE PROBES, and landing on the first answer is what hid
     the kitchen queue. A 403 is a rejection with no query behind it, so the
     kitchen operator's refusal on the two transfer lists came back before the
     one list they ARE allowed — and the latch below had already decided they
     had one job. Whoever answers first is not the answer; the OR of all three
     is, so the decision waits for all three to be in.

     _armed is the safety net: a probe that never answers at all (a dropped
     connection, not a refusal) must not strand someone on a blank decision, so
     boot arms the landing on a timer regardless. Late is survivable here in a
     way that never is not. */
  var _landed = false, _probes = 0, _armed = false;
  // Set when a ?go= link was honoured, so the launcher is never entered on the
  // way back out of a screen it was never entered from.
  var _deep = false;
  // The boot screen, kept up while a named open decides where it lands, and
  // what the counting list tried to paint behind it. See THE FIRST SCREEN IS
  // THE ONLY SCREEN in mountShell.
  var _hold = false, _heldPaint = '';
  var PROBE_COUNT = 3;                      // rcLoad, pkLoad, kqLoad
  function probeAnswered() { _probes++; homeLand(); }
  /* ?go= — the deep links, and they exist because every one of these jobs is
     also a ROW IN A DIFFERENT APP. A kitchen operator whose role puts them in
     /m reaches this app from More → Operations, where "Kitchen queue" and
     "Add stock" are already two named doors; landing them on a launcher that
     offers the same two tiles makes each of those rows a signpost rather than a
     door, and makes the tile a second copy of a row they just used.

       ?go=queue    the kitchen's queue
       ?go=add      the counting list, which is where the app opens anyway
       ?go=pick     the run waiting to be pulled
       ?go=receive  the delivery waiting to be counted in

     THE LAST TWO ARE FOR THE NOTIFICATIONS, and they are the same argument one
     step on. A push that says "RS-260904-002 ready to receive" and opens a menu
     has told somebody about a job and then asked them to go and find it; the
     row in /m earns a launcher because a person browsing tools is choosing, and
     a person answering an alert is not.

     Honoured only if the screen actually answered: a link cannot grant access,
     and a deep link that lands on a refusal is worse than no link. */
  function homeWanted() {
    try {
      var m = /(?:^|[?&])go=(queue|add|pick|receive|ready)(?:&|$)/.exec(location.search || '');
      return m ? m[1] : '';
    } catch (e) { return ''; }
  }

  /* A ?go= that names a screen OTHER than the counting list — the opens that
     must not paint a list on the way. ?go=add is not one of them: it names the
     screen this app already opens on, so there is nothing to hold and nothing
     to replace. */
  function homeDeep() { var w = homeWanted(); return w === 'add' ? '' : w; }

  /* WHAT A NAMED DOOR IS ACTUALLY WAITING FOR, and it is one answer, not three.
     Landing waited for every probe before honouring any ?go=, because whether
     the LAUNCHER exists is the OR of all three — but a door that names its
     screen never asks that question. ?go=queue opens if the queue answered, and
     the two transfer refusals beside it cannot change that. Held on a boot
     screen until a 403 comes back, a kitchen operator was waiting on the answer
     to a question nobody had asked.

     DATA, NOT ONLY PERMISSION. rcEnter reads rc.list to decide whether a single
     delivery opens straight into its count, and pkRender carries a Loading
     state because pk.list arrives a fetch later than rc.on does — pkLoad reads
     every run in full before it has a list. A door that opens on the wrong
     screen and corrects itself is the blink again, one screen further in. A
     refusal sets the same list to [] alongside on:false, so both are asked. */
  function wantReady(want) {
    if (want === 'queue') return kq.on === true && kq.list != null;
    if (want === 'receive') return rc.on === true && rc.list != null;
    if (want === 'pick') return rc.on === true && pk.list != null;
    /* The ready list has a permission and a list from two different loaders:
       rcLoad says whether this session is a transfer operator at all, and
       krLoad brings what the kitchen has finished. Both, for the same reason
       Receive asks for both — the screen reads kr.list on its first paint, and
       landing on the permission alone is a list that appears a fetch later. */
    if (want === 'ready') return rc.on === true && kr.list != null;
    return false;
  }

  /* Letting the held boot screen go. The counting list is the one destination
     that has to be painted from here — every other screen paints itself, and
     the chrome each wants is its own business (kqRender, pkRender and rcRender
     hide the head and the band; homeRender keeps the head and drops the band).
     What comes back is whatever the hold swallowed: the skeleton while the
     shelf is still on its way, the list itself once it is in. */
  function holdEnd(toList) {
    if (!_hold) return;
    _hold = false;
    if (!toList) return;
    $('#pageHead').hidden = false;
    $('#band').hidden = false;
    measureHead();
    if (_heldPaint === 'list') render(); else renderSkeleton();
  }

  function homeLand() {
    if (_landed || state.view === 'off' || state.view === 'nostore') return;
    var want = homeWanted();
    if (!wantReady(want) && _probes < PROBE_COUNT && !_armed) return;
    _landed = true;
    /* ?go=add is answered BEFORE the launcher is considered, and needs no probe
       at all: the counting list is what this app already opens on, so honouring
       it is a matter of not putting a menu in front of it. The tile for it stays
       on the launcher regardless — for the installed PWA, whose start_url is a
       bare /stock, that tile is the only way to the shelf. */
    if (want === 'add') { _deep = true; holdEnd(true); return; }
    if (!homeAvailable()) { holdEnd(true); return; }   // one job — stay on the list
    if (want === 'queue' && kq.on === true) { _deep = true; holdEnd(false); kqEnter(); return; }
    // Both transfer screens sit behind the one probe — rcLoad and pkLoad set the
    // same rc.on — so a refusal on that realm drops both links, together.
    if (want === 'pick' && rc.on === true) { _deep = true; holdEnd(false); pkEnter(); return; }
    if (want === 'receive' && rc.on === true) { _deep = true; holdEnd(false); rcEnter(); return; }
    // Behind the same probe as the two above: the ready list is the far end of
    // "Ask the kitchen", and a session refused the transfer realm was never
    // able to ask.
    if (want === 'ready' && rc.on === true) { _deep = true; holdEnd(false); krEnter(); return; }
    state.view = 'home';
    holdEnd(false);
    homeRender();
  }
  function armLanding() { _armed = true; homeLand(); }


  /* ══ ASK THE KITCHEN ═══════════════════════════════════════════════════════
     Tianhe asking the kitchen to MAKE something. §39: this moves no stock and
     is not supposed to — it asks for production, and stock changes when the
     kitchen makes it, not when someone asks. So there is no dispatch, no
     receipt and no location pair; the request lands in the kitchen's inbox
     (public/kitchen.html) and closes when they mark it prepared.

     WHY IT NEEDED BUILDING AT ALL. The direction has always existed and the
     kitchen's inbox has always worked, but the only screen that could RAISE one
     was public/restock.html, deleted 2026-08-04. Nothing has created a kitchen
     request since 16 May. This is that door, reopened.

     THE PURPOSE IS MANDATORY, and the server has always enforced it — a request
     without `order` or `shelf` is refused by name. It is asked for first, before
     any product, because it is the thing the kitchen reads first: making
     something for a customer order due today is different work from refilling a
     shelf, and the old page asked for it in a modal after the fact. */

  var ak = {
    purpose: null,      // 'order' | 'shelf' — no default; §39's no-prefill rule
    qty: {},            // product id -> how many are being asked for
    products: null,     // the catalogue, once fetched
    fromShelf: false,   // true when we fell back to the shelf list
    q: '',
    busy: false, err: '', sent: null,
  };

  var AK_MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  var AK_PLUS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  /* THE CATALOGUE TACET OWNS. /api/retail-admin/products is the sellable list,
     reachable by exactly the operator who can raise one of these requests, and
     it lists everything rather than only what happens to have a stock row at
     this store. The shelf already in memory stands in if it cannot be read.

     NO product_id IS SENT, and that is deliberate rather than a shortcut.
     `restock_items.product_id` is read as a KITCHEN `products.id`, and the two
     catalogues are separate AUTOINCREMENT counters over one integer space (see
     _checkTransferIds) — so a store id written into that field points at a
     different thing on the kitchen's side, and nothing would ever tell anybody.
     A kitchen request needs the NAME: it moves no stock, and nothing in this
     direction resolves a product by id. So the honest thing is to send the name
     and leave the id empty rather than fill it from the wrong catalogue.

     THIS USED TO ASK /api/products, the kitchen's own list, which was right
     while the screens lived on the kitchen host. Since the restock routes moved
     to Tacet that endpoint 403s for every operator who can reach this screen,
     so the "right" source had become one that always failed — leaving the
     fallback as the only path and an apology on screen for the normal case. */
  function akLoad() {
    if (ak.products) return Promise.resolve();
    return rcFetch('/api/retail-admin/products').then(function (j) {
      var rows = Array.isArray(j.data) ? j.data : (j.data && j.data.products) || [];
      ak.products = rows.map(function (p) {
        return { id: p.id, name_en: p.name_en, name_cn: p.name_cn, sku: p.sku };
      });
      ak.fromShelf = false;
      akRender();
    }).catch(function () {
      ak.products = (state.items || []).map(function (p) {
        return { id: p.id, name_en: p.name_en, name_cn: p.name_cn, sku: p.sku };
      });
      ak.fromShelf = true;
      akRender();
    });
  }

  function akEnter() {
    state.view = 'kitchen';
    ak.purpose = null; ak.qty = {}; ak.q = ''; ak.err = ''; ak.sent = null; ak.busy = false;
    akRender();
    akLoad();
  }
  function akExit() { ak.sent = null; homeBack(); }

  function akName(p) {
    var n = lang === 'cn' ? (p.name_cn || p.name_en) : (p.name_en || p.name_cn);
    return n || ('#' + p.id);
  }
  function akLines() {
    var all = ak.products || [];
    var q = ak.q.trim().toLowerCase();
    if (!q) return all;
    return all.filter(function (p) {
      return (p.name_en || '').toLowerCase().indexOf(q) >= 0
          || (p.name_cn || '').indexOf(ak.q.trim()) >= 0
          || (p.sku || '').toLowerCase().indexOf(q) >= 0;
    });
  }
  function akChosen() {
    return (ak.products || []).filter(function (p) { return (ak.qty[p.id] || 0) > 0; });
  }
  function akBump(id, d) {
    var n = (ak.qty[id] || 0) + d;
    ak.qty[id] = n > 0 ? n : 0;
    akRender();
  }

  function akSend() {
    if (ak.busy) return;
    var chosen = akChosen();
    if (!ak.purpose || !chosen.length) return;
    ak.busy = true; ak.err = ''; akRender();
    rcFetch('/api/restock', { method: 'POST', body: {
      // to_role and purpose are what make this a kitchen request; without both
      // the server refuses, and since #254 an absent to_role means the warehouse.
      to_role: 'kitchen',
      purpose: ak.purpose,
      status: 'sent',
      items: chosen.map(function (p) {
        return {
          product_id: null,
          product_name: p.name_en || p.name_cn || ('#' + p.id),
          product_cn: p.name_cn || null,
          sku: p.sku || null,
          qty_requested: ak.qty[p.id],
          unit: 'pcs',
        };
      }),
    } }).then(function (j) {
      ak.busy = false;
      ak.sent = { rs: j.rs_number || ('#' + j.id), lines: chosen.length,
                  units: chosen.reduce(function (a, p) { return a + ak.qty[p.id]; }, 0) };
      akRender();
    }).catch(function (e) {
      ak.busy = false;
      // The numbers stay on screen. Losing a list somebody just built is the one
      // failure that makes people stop using a screen.
      ak.err = e.message === 'norealm'
        ? t('This account cannot raise kitchen requests.', '此账号无法向厨房下单。')
        : (e.message || t('That did not send. Nothing has changed — try again.', '未发送,数据未变 — 请重试。'));
      akRender();
    });
  }

  function akHtml() {
    if (ak.sent) {
      return '<div class="rc-wrap">' +
        rcHeadHtml(t('Sent to the kitchen', '已发送至厨房'),
                   ak.sent.rs + ' · ' + clock(new Date()), false) +
        '<div style="padding:0 16px"><div class="rc-card">' +
          '<div style="font-size:15px;font-weight:600;line-height:1.35">' +
            t(ak.sent.lines + ' item' + (ak.sent.lines > 1 ? 's' : '') + ' · ' + ak.sent.units + ' units',
              '共 ' + ak.sent.lines + ' 项 · ' + ak.sent.units + ' 件') + '</div>' +
          '<div class="rc-sub" style="margin-top:6px">' +
            t('The kitchen sees it now. Nothing moves until they make it.',
              '厨房已收到。制作完成后库存才会变动。') + '</div></div></div>' +
        '<div class="rc-body"></div>' +
        '<div class="rc-foot" style="background:transparent;border:none">' +
          '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
          '<button class="rc-big" data-akback>' + t('Done', '完成') + '</button></div></div></div>';
    }
    var chosen = akChosen();
    var units = chosen.reduce(function (a, p) { return a + ak.qty[p.id]; }, 0);
    var ready = !!ak.purpose && chosen.length > 0;
    var rows = ak.products === null
      ? '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' + t('Loading…', '加载中…') + '</div></div>'
      : akLines().map(function (p) {
          var n = ak.qty[p.id] || 0;
          return '<div class="rc-hr"></div><div class="rc-row">' +
            '<span class="rc-mid"><span class="rc-nm">' + esc(akName(p)) + '</span>' +
            '<span class="rc-cap">' + esc(p.sku || ('#' + p.id)) + '</span></span>' +
            '<span class="ak-step">' +
              '<button data-akdec="' + p.id + '"' + (n <= 0 ? ' disabled' : '') + '>' + AK_MINUS + '</button>' +
              '<span class="n num">' + n + '</span>' +
              '<button data-akinc="' + p.id + '">' + AK_PLUS + '</button>' +
            '</span></div>';
        }).join('') + '<div class="rc-hr"></div>';
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-akback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Ask the kitchen', '向厨房下单') + '</div>' +
        '<div class="rc-sub">' + t('They make it — nothing moves until it is made.',
                                   '由厨房制作 — 制作完成后库存才会变动。') + '</div>' +
      '</div>' +
      (ak.err ? '<div class="rc-err">' + esc(ak.err) + '</div>' : '') +
      (ak.fromShelf ? '<div class="rc-flat rc-note" style="margin:0 16px 12px">' +
        t('Showing what this shelf holds — the full catalogue could not be read.',
          '显示本店在架商品 — 未能读取完整商品目录。') + '</div>' : '') +
      // Asked FIRST, because it is what the kitchen reads first. No default:
      // a purpose picked for him is a reason he did not give.
      '<div class="rc-lbl">' + t('What is it for?', '用途') + '</div>' +
      '<div class="ak-purpose">' +
        '<button class="ak-opt' + (ak.purpose === 'order' ? ' on' : '') + '" data-akpurpose="order">' +
          '<b>' + t('For an order', '用于发货') + '</b><i>' + t('A customer is waiting on it', '有客户订单等待') + '</i></button>' +
        '<button class="ak-opt' + (ak.purpose === 'shelf' ? ' on' : '') + '" data-akpurpose="shelf">' +
          '<b>' + t('For the shelf', '货架补货') + '</b><i>' + t('Restocking what we hold', '补充本店库存') + '</i></button>' +
      '</div>' +
      '<div class="ak-search"><input id="akQ" inputmode="search" enterkeyhint="search" ' +
        'placeholder="' + t('Search products', '搜索商品') + '" value="' + esc(ak.q) + '"></div>' +
      '<div class="rc-body">' + rows + '</div>' +
      '<div class="rc-foot"><div class="rc-footrow">' +
        '<div class="rc-tally"><b>' + chosen.length + ' <span>' + t('items', '项') + '</span></b>' +
        '<i>' + t(units + ' units', units + ' 件') + '</i></div>' +
        '<button class="rc-cta' + (ready && !ak.busy ? ' on' : '') + '"' +
          (ready && !ak.busy ? ' data-aksend' : ' disabled') + '>' +
          (ak.busy ? t('Sending…', '发送中…') : t('Send', '发送')) + '</button>' +
      '</div></div></div>';
  }

  function akRender() {
    if (state.view !== 'kitchen') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = akHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-akback]', function (b) { b.onclick = akExit; });
    each('[data-akpurpose]', function (b) {
      b.onclick = function () { ak.purpose = b.getAttribute('data-akpurpose'); akRender(); };
    });
    each('[data-akinc]', function (b) { b.onclick = function () { akBump(parseInt(b.getAttribute('data-akinc'), 10), 1); }; });
    each('[data-akdec]', function (b) { b.onclick = function () { akBump(parseInt(b.getAttribute('data-akdec'), 10), -1); }; });
    each('[data-aksend]', function (b) { b.onclick = akSend; });
    var q = $('#akQ');
    if (q) {
      q.oninput = function () { ak.q = q.value; akRender(); var f = $('#akQ'); if (f) { f.focus(); } };
    }
  }


  /* ══ READY FROM THE KITCHEN ════════════════════════════════════════════════
     The far end of "Ask the kitchen", and it did not exist.

     WHAT WAS MISSING. A kitchen request closes at 'prepared' — nothing travels,
     so there is no dispatch, no van and no delivery to count in. The request
     simply stops moving, and the only thing that ever announced it was a push:
     one moment, on one phone, that is regularly in a pocket, on silent, or
     swiped off a lock screen by someone reaching for the torch. After that the
     warehouse's only way to learn its hummus was made was to remember to go and
     look, and there was nowhere to look — this app could raise the request and
     could not show it back.

     THERE IS NOTHING TO COLLECT, and this screen shipped once pretending there
     was. It opened with a "Collected" button that archived the request, on the
     reasoning that archiving is what "we have it" means elsewhere on this
     route. That reasoning is right for a TRANSFER and wrong here: at Roots the
     kitchen puts what it makes straight onto the shelf and records the stock
     itself, so nothing is physically waiting for anybody and the tile telling
     the warehouse its hummus was "waiting for you" was sending somebody to
     fetch what was already in front of them. Ash: "the only thing needed is
     that the warehouse knows the kitchen handled his request."

     SO OPENING IT IS THE ACKNOWLEDGEMENT. No button, and no confirmation of
     anything — the screen posts kitchen-ready/seen for the rows it just drew,
     and that is the whole ceremony. What is kept from the first attempt is the
     half that was right: the stamp is SERVER-SIDE, so one person looking clears
     the dot for the whole warehouse instead of each handset holding its own
     opinion and chasing the next person about a request the team already knows.

     THE LIST IS NOT THE DOT. It shows what the kitchen has finished, seen or
     not, because it is a record — "what did they make today" has to still
     answer the day after somebody glanced at it. Only the COUNT is unseen-only.

     IT STILL MOVES NO STOCK, and still says so — but as a statement of where
     the stock already went, not as a warning about what this button does. */

  var kr = {
    list: null,     // prepared, unarchived requests addressed to the kitchen
    order: null,    // the open one, with lines
    seen: false,    // this visit has already stamped what it drew
    busy: false, err: '',
  };

  /* THE COUNT IS UNSEEN-ONLY AND THE LIST IS NOT. The tile answers "is there
     anything I have not been told about", which is the same question the dot in
     /m asks and must be the same number; the screen behind it answers "what has
     the kitchen made", which stays true after somebody has looked. */
  function krUnseen() {
    return (kr.list || []).filter(function (o) { return !o.seen_at; });
  }
  function krCount() { return krUnseen().length; }

  /* THE SAME LIST ROUTE THE QUEUE READS, from the other side. `tab=history` is
     defined for this direction as "prepared" (routes/restock.js: for
     warehouse→kitchen, prepared IS the closure), and the endpoint drops
     archived rows from every tab by default — so what comes back is exactly
     "made, and nobody has said they have it". The status filter is belt and
     braces for a row that reached 'delivered' under an older client. */
  /* homeLand() rather than probeAnswered(), and the difference is the whole
     reason krLoad is not a probe. _probes decides whether the LAUNCHER may be
     shown, and this loader answers nothing about that — counting it would let
     the launcher land one answer early. What it does decide is ?go=ready, whose
     wantReady() reads kr.list, so the landing is re-asked when the list arrives
     and a held boot screen is released by data instead of by the arming timer. */
  function krLoad() {
    return rcFetch('/api/restock?to_role=kitchen&tab=history').then(function (j) {
      kr.list = (Array.isArray(j.data) ? j.data : []).filter(function (o) {
        return o.status === 'prepared';
      });
      homeLand();
      krMarkSeen();
      if (state.view === 'home') homeRender();
      else if (state.view === 'kitchenready') krRender();
    }).catch(function (e) {
      // A refusal is not an error here: this loader runs at boot for every
      // session, and the ones it does not answer for simply never see the tile.
      // The list is still SET, so ?go=ready is decided rather than left waiting
      // — homeLand drops the link on rc.on, which is the honest refusal.
      if (e.message === 'norealm') { kr.list = []; homeLand(); return; }
      kr.err = e.message; if (state.view === 'kitchenready') krRender();
    });
  }

  function krEnter() {
    state.view = 'kitchenready'; kr.order = null; kr.err = ''; kr.seen = false;
    krRender(); krLoad();
  }
  function krExit() { kr.order = null; kr.err = ''; homeBack(); }

  /* READING IT IS THE ACKNOWLEDGEMENT, and this is the whole of it. Only from
     the list — krLoad also runs at boot for the tile's count, and a screen
     nobody opened has told nobody anything.

     THE IDS IT ACTUALLY DREW, never "everything unseen": the kitchen can mark
     something made between this list rendering and the post landing, and
     clearing a request nobody has laid eyes on is the one failure that would
     make the dot worth ignoring.

     A FAILURE IS SILENT AND HARMLESS. Nothing the operator did has gone wrong —
     they are reading the screen either way — and the worst case is a dot that
     is still lit next time, which is the safe direction to fail in. */
  function krMarkSeen() {
    if (kr.seen || state.view !== 'kitchenready') return;
    var ids = krUnseen().map(function (o) { return o.id; });
    if (!ids.length) return;
    kr.seen = true;
    rcFetch('/api/restock/kitchen-ready/seen', { method: 'POST', body: { ids: ids } })
      .then(function () {
        // Locally too, so the tile behind this screen is right on the way out
        // without a second round trip.
        (kr.list || []).forEach(function (o) {
          if (ids.indexOf(o.id) >= 0) o.seen_at = new Date().toISOString();
        });
      })
      .catch(function () { kr.seen = false; });
  }

  function krOpen(id) {
    kr.busy = true; kr.err = ''; kr.order = null;
    state.view = 'kitchenready'; krRender();
    rcFetch('/api/restock/' + id).then(function (j) {
      kr.order = j.data; kr.busy = false; krRender();
    }).catch(function (e) {
      kr.busy = false; kr.err = e.message === 'norealm' ? '' : e.message; krRender();
    });
  }

  function krMade(o) {
    var d = rcStamp(o.prepared_at);
    return d ? clock(d) : '';
  }

  function krListHtml() {
    var rows = kr.list || [];
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-krback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Ready from the kitchen', '厨房已完成') + '</div>' +
        '<div class="rc-sub">' + (rows.length
          ? t(rows.length + ' made · already on the shelf', rows.length + ' 项已完成 · 已上架')
          : t('What the kitchen has finished', '厨房已完成的申请')) + '</div>' +
      '</div>' +
      (kr.err ? '<div class="rc-err">' + esc(kr.err) + '</div>' : '') +
      '<div class="rc-body">' + (
        kr.list === null
          ? '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' + t('Loading…', '加载中…') + '</div></div>'
        : !rows.length
          ? '<div class="rc-empty"><div style="font-size:20px;font-weight:600;letter-spacing:-.02em">' +
            t('Nothing finished yet', '暂无已完成') + '</div>' +
            '<div style="font-size:15px;color:var(--text2);margin-top:6px">' +
            t('What the kitchen makes for you shows up here.', '厨房为你制作完成的申请会显示在这里。') + '</div></div>'
        : rows.map(function (o) {
            var p = kqPurpose(o), when = krMade(o);
            return '<div class="rc-hr"></div>' +
              '<button class="rc-row" data-kropen2="' + o.id + '">' +
              '<span class="rc-qty num">' + (o.item_count || 0) + '</span>' +
              '<span class="rc-mid"><span class="rc-nm">' + esc(o.rs_number || ('#' + o.id)) + '</span>' +
              '<span class="rc-cap">' + t((o.item_count || 0) + ' items', (o.item_count || 0) + ' 项') +
              (p ? ' · ' + esc(p) : '') + (when ? ' · ' + t('made ' + when, when + ' 完成') : '') +
              '</span></span>' +
              '<span class="sh-chev">' + RC_CHEV_R + '</span></button>';
          }).join('') + '<div class="rc-hr"></div>'
      ) + '</div></div>';
  }

  function krDetailHtml() {
    var o = kr.order;
    var items = (o.items || []).filter(function (it) { return rcNum(it.qty_requested) > 0; });
    var p = kqPurpose(o), when = krMade(o);
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-krlist>' + RC_CHEV + t('Ready', '已完成') + '</button>' +
        '<div class="rc-h1">' + esc(o.rs_number || ('#' + o.id)) + '</div>' +
        '<div class="rc-sub">' + t(items.length + ' items', items.length + ' 项') +
          (p ? ' · ' + esc(p) : '') + (when ? ' · ' + t('made ' + when, when + ' 完成') : '') + '</div>' +
      '</div>' +
      (kr.err ? '<div class="rc-err">' + esc(kr.err) + '</div>' : '') +
      '<div class="rc-body">' + items.map(function (it) {
        return '<div class="rc-hr"></div><div class="rc-row">' +
          '<span class="rc-qty num">' + rcNum(it.qty_requested) + '</span>' +
          '<span class="rc-mid"><span class="rc-nm">' + esc(kqItemName(it)) + '</span>' +
          '<span class="rc-cap">' + esc(it.sku || '') + '</span></span></div>';
      }).join('') + '<div class="rc-hr"></div></div>' +
      /* WHERE THE STOCK ALREADY WENT, which is not the same sentence as the one
         this screen used to carry. That one warned what a button would not do;
         this one says the job is finished — the kitchen shelved it and recorded
         it, and there is no step left for the person reading. */
      '<div style="padding:12px 16px 0"><div class="rc-flat rc-note">' +
        t('The kitchen has put this on the shelf and recorded the stock. Nothing to do here.',
          '厨房已将其上架并登记库存,此处无需操作。') + '</div></div>' +
      '<div class="rc-foot" style="background:transparent;border:none">' +
        '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
        '<button class="rc-big" data-krlist>' + t('Done', '完成') + '</button>' +
        '</div></div></div>';
  }

  function krRender() {
    if (state.view !== 'kitchenready') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = kr.order ? krDetailHtml() : krListHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-krback]', function (b) { b.onclick = krExit; });
    each('[data-krlist]', function (b) { b.onclick = function () { kr.order = null; krRender(); }; });
    each('[data-kropen2]', function (b) {
      b.onclick = function () { krOpen(parseInt(b.getAttribute('data-kropen2'), 10)); };
    });
  }

  /* ══ THE KITCHEN QUEUE ═════════════════════════════════════════════════════
     What was asked for, seen by the people who make it — in Tacet, on the same
     launcher as every other stock job.

     It used to live in public/kitchen.html on the kitchen host: a separate app,
     a separate login, and a separate permission system, so a request raised in
     Tacet landed somewhere Tacet could not show. Ash: the kitchen app is dead
     and nothing more goes into it. This is its inbox, rebuilt here.

     WHAT THE KITCHEN CAN DO, AND WHAT IT CANNOT. It marks a request received
     (we have seen it) and then prepared (it is made), which is the whole
     lifecycle for this direction — there is no `delivered` for a kitchen
     request, because nothing travels. It may correct a line's quantity, because
     the person making it is the one who knows how many actually came out.

     NO STOCK MOVES WHEN IT IS MARKED PREPARED, and that is §39 rather than an
     omission: the request asked the kitchen to MAKE something, and stock changes
     when a production batch is logged against it. That wiring is its own brief.
     The screen says so rather than letting anyone infer that ticking this fills
     a shelf. */

  var kq = {
    // The queue's OWN probe. Kept apart from rc.on for the reason written there:
    // these are two jobs and two answers, and a session may hold either, both or
    // neither. rc.on = false must never decide this one.
    on: null,
    list: null,     // requests addressed to the kitchen
    tab: 'active',  // active | history
    order: null,    // the open one, with lines
    busy: false, err: '',
  };

  function kqEnter() {
    state.view = 'kitchenq'; kq.order = null; kq.err = '';
    kqRender(); kqLoad();
  }
  function kqExit() { kq.order = null; kq.err = ''; homeBack(); }

  function kqLoad() {
    if (kq.on === false) return Promise.resolve();
    return rcFetch('/api/restock?to_role=kitchen&tab=' + kq.tab).then(function (j) {
      kq.on = true;
      kq.list = Array.isArray(j.data) ? j.data : [];
      probeAnswered();
      if (state.view === 'home') homeRender();
      else if (state.view === 'kitchenq') kqRender();
    }).catch(function (e) {
      if (e.message === 'norealm') { kq.on = false; kq.list = []; probeAnswered(); return; }
      kq.err = e.message; if (state.view === 'kitchenq') kqRender();
    });
  }

  function kqOpen(id) {
    kq.busy = true; kq.err = ''; kqRender();
    rcFetch('/api/restock/' + id).then(function (j) {
      kq.order = j.data; kq.busy = false; kqRender();
    }).catch(function (e) {
      kq.busy = false; kq.err = e.message === 'norealm' ? '' : e.message; kqRender();
    });
  }

  // received → we have seen it. prepared → it is made, and that closes it.
  //
  // CLOSING IT IS NOT PUTTING IT ON THE SHELF, and 'prepared' is where those two
  // part company: the server moves no stock for a kitchen request by design, so
  // the shelf is still short at the moment this request stops existing. So the
  // lines are carried straight to the screen that adds them (see WHAT YOU MADE).
  // The order is read BEFORE the reload clears it — it is the only copy of what
  // was asked for, and kqLoad drops it.
  function kqAdvance(to) {
    if (kq.busy || !kq.order) return;
    kq.busy = true; kq.err = ''; kqRender();
    rcFetch('/api/restock/' + kq.order.id + '/status', { method: 'PUT', body: { status: to } })
      .then(function () {
        kq.busy = false; kq.order.status = to;
        if (to === 'prepared') {
          var made = kq.order;
          kq.order = null; kqLoad();
          // Falls through to the queue when there is nothing to hand over — an
          // operator who recounts rather than adds, or lines this shelf has no
          // product for. hdStart says which by returning false.
          if (hdStart(made)) return;
        }
        kqRender();
      })
      .catch(function (e) {
        kq.busy = false;
        kq.err = e.message === 'norealm'
          ? t('This account cannot work the kitchen queue.', '此账号无法处理厨房队列。')
          : (e.message || t('That did not go through. Nothing has changed — try again.', '没有成功。数据没有变化 — 请重试。'));
        kqRender();
      });
  }

  function kqPurpose(o) {
    return o.purpose === 'order' ? t('For an order', '用于发货')
         : o.purpose === 'shelf' ? t('For the shelf', '货架补货') : '';
  }
  function kqItemName(it) {
    var n = lang === 'cn' ? (it.product_cn || it.product_name) : (it.product_name || it.product_cn);
    return n || ('#' + it.id);
  }

  function kqListHtml() {
    var rows = kq.list || [];
    var seg = function (k, label) {
      return '<button class="pk-chip' + (kq.tab === k ? ' on' : '') + '" data-kqtab="' + k + '">' + label + '</button>';
    };
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-kqback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Production', '生产') + '</div>' +
        '<div class="rc-sub">' + t('What has been asked for', '待制作的申请') + '</div>' +
      '</div>' +
      (kq.err ? '<div class="rc-err">' + esc(kq.err) + '</div>' : '') +
      '<div class="pk-chips">' + seg('active', t('To make', '待制作')) + seg('history', t('Done', '已完成')) + '</div>' +
      '<div class="rc-body">' + (
        kq.list === null
          ? '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' + t('Loading…', '加载中…') + '</div></div>'
        : !rows.length
          ? '<div class="rc-empty"><div style="font-size:20px;font-weight:600;letter-spacing:-.02em">' +
            (kq.tab === 'active' ? t('Nothing to make', '暂无待制作') : t('Nothing yet', '暂无记录')) + '</div>' +
            '<div style="font-size:15px;color:var(--text2);margin-top:6px">' +
            (kq.tab === 'active' ? t('Nobody has asked for anything.', '目前没有制作申请。') : '') + '</div></div>'
        : rows.map(function (o) {
            var p = kqPurpose(o);
            return '<div class="rc-hr"></div>' +
              '<button class="rc-row" data-kqopen="' + o.id + '">' +
              '<span class="rc-qty num">' + (o.item_count || 0) + '</span>' +
              '<span class="rc-mid"><span class="rc-nm">' + esc(o.rs_number || ('#' + o.id)) + '</span>' +
              '<span class="rc-cap">' + t((o.item_count || 0) + ' items', (o.item_count || 0) + ' 项') +
              (p ? ' · ' + esc(p) : '') + ' · ' + esc(o.status) + '</span></span>' +
              '<span class="sh-chev">' + RC_CHEV_R + '</span></button>';
          }).join('') + '<div class="rc-hr"></div>'
      ) + '</div></div>';
  }

  function kqDetailHtml() {
    var o = kq.order;
    var items = (o.items || []).filter(function (it) { return rcNum(it.qty_requested) > 0; });
    var p = kqPurpose(o);
    var next = o.status === 'sent' ? 'received' : o.status === 'received' ? 'prepared' : null;
    var label = next === 'received' ? t('Start making', '开始制作')
              : next === 'prepared' ? t('Mark as made', '标记已完成') : '';
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-kqlist>' + RC_CHEV + t('Production', '生产') + '</button>' +
        '<div class="rc-h1">' + esc(o.rs_number || ('#' + o.id)) + '</div>' +
        '<div class="rc-sub">' + t(items.length + ' items', items.length + ' 项') + (p ? ' · ' + esc(p) : '') + '</div>' +
      '</div>' +
      (kq.err ? '<div class="rc-err">' + esc(kq.err) + '</div>' : '') +
      '<div class="rc-body">' + items.map(function (it) {
        return '<div class="rc-hr"></div><div class="rc-row">' +
          '<span class="rc-qty num">' + rcNum(it.qty_requested) + '</span>' +
          '<span class="rc-mid"><span class="rc-nm">' + esc(kqItemName(it)) + '</span>' +
          '<span class="rc-cap">' + esc(it.sku || '') + '</span></span></div>';
      }).join('') + '<div class="rc-hr"></div></div>' +
      // Said out loud, because a tick that closes a request looks like a tick
      // that fills a shelf, and it is not one.
      //
      // IT USED TO NAME THE WRONG MECHANISM. "Stock changes when the batch is
      // logged" pointed at POST /api/production, which writes production_batches
      // and nothing else — no inventory path exists from it (routes/production.js
      // says so in its own header). So the one sentence explaining where the
      // stock went named a step that has never moved any. It now names the step
      // that does, which is the screen the next tap opens.
      '<div style="padding:12px 16px 0"><div class="rc-flat rc-note">' +
        (next === 'prepared'
          ? t('Marking this made closes the request. Next you record what you made and what went on the shelf — that is what changes the stock.',
              '标记完成即关闭该申请。随后登记制作数量与实际入库数量 — 库存在那一步才会变动。')
          : t('Marking this made closes the request. Stock changes when you record what you made, not here.',
              '标记完成即关闭该申请。库存在登记制作数量时才会变动,不在此处。')) + '</div></div>' +
      '<div class="rc-foot" style="background:transparent;border:none">' +
        '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
        (next
          ? '<button class="rc-big"' + (kq.busy ? ' disabled' : ' data-kqnext="' + next + '"') + '>' +
              (kq.busy ? t('Saving…', '保存中…') : label) + '</button>'
          : '<button class="rc-big" data-kqlist>' + t('Done', '完成') + '</button>') +
        '</div></div></div>';
  }

  function kqRender() {
    if (state.view !== 'kitchenq') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = kq.order ? kqDetailHtml() : kqListHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-kqback]', function (b) { b.onclick = kqExit; });
    each('[data-kqlist]', function (b) { b.onclick = function () { kq.order = null; kqRender(); }; });
    each('[data-kqtab]', function (b) {
      b.onclick = function () { kq.tab = b.getAttribute('data-kqtab'); kq.list = null; kqRender(); kqLoad(); };
    });
    each('[data-kqopen]', function (b) {
      b.onclick = function () { kqOpen(parseInt(b.getAttribute('data-kqopen'), 10)); };
    });
    each('[data-kqnext]', function (b) {
      b.onclick = function () { kqAdvance(b.getAttribute('data-kqnext')); };
    });
  }

  /* ══ WHAT YOU MADE ═════════════════════════════════════════════════════════
     The step between closing a request and the shelf being right, and until now
     it was a step nobody was asked to take.

     THE GAP. Marking a kitchen request made moves no stock and is not supposed
     to (routes/restock.js _transferContext returns `kitchen_direction` and
     _applyDispatch does nothing). Stock goes up when the kitchen ADDS what it
     made, on the Add stock screen, one product at a time, from memory. So the
     queue closed a request that named three products and three quantities, and
     then asked the operator to find those same three products again in a list of
     two hundred. Nothing checked that they did. Nothing said what would happen
     if they did not. The note on the queue screen said stock changes "when the
     batch is logged" — a mechanism that does not exist: POST /api/production
     writes production_batches and touches no shelf at all.

     WHAT THIS IS. The request's own lines, carried straight onto a screen that
     adds them, with the quantities already filled in. One tap for the normal
     case; the steppers are there for the case where four were asked for and
     three got made. It is the SAME write Add stock has always done — one delta
     per product, reason `kitchen_add` — so the ledger, the channel re-sync and
     the server's add-only refusal are all unchanged.

     THE PREFILL IS A PROPOSAL, NOT A DEFAULT, and that is the whole reason it
     asks. §39's no-prefill rule is about not putting words in someone's mouth —
     a purpose picked for them is a reason they did not give. A quantity here is
     not that: it is what was ASKED for, quoted back, and the operator says
     whether it is also what was made. Nothing is written until they say so,
     which is why the prefill deliberately does NOT arm flushAdd's commit timer.

     NO ID TO TRUST, SO IT MATCHES ON SKU. A kitchen request carries no
     product_id — akSend sends null on purpose, because restock_items.product_id
     is read as a KITCHEN products.id and this app only knows store ids (see the
     note on akLoad). Both screens draw from store_products, so the SKU is the
     honest join: it is the operator's own code for the thing, and the same code
     is printed on both lists. A line that cannot be matched is SHOWN, greyed,
     saying so — never silently dropped, because a dropped line is a product
     that quietly never reaches the shelf.

     WHAT IT DOES NOT DO. It does not re-offer itself later. A request closed
     yesterday has no reliable way to know whether somebody already added it —
     the ledger holds the answer but a kitchen operator is refused every endpoint
     that could read it (routes/retail-inventory.js strips quantities from their
     product list) — and a prompt that reappears on a second phone would add the
     same batch twice. Adding stock twice is worse than adding it late, so Skip
     says plainly that nothing has been added and where to go. */

  var hd = {
    rs: null,       // the request these lines came from — also the ledger note
    rsId: null,     // and its id, so the production row can name it
    lines: null,    // resolved rows: what was asked, what is going on the shelf
    busy: false,
    err: '',
    done: null,     // { added, units, short } once every line is on
    reasons: null,  // the gap vocabulary, read from the server (never a second copy)
    openReason: -1, // which row's reason picker is showing, -1 for none
  };

  /* ONE NUMBER PER ROW, AND THE SECOND ONE IS INFERRED.
     The operator adjusts what goes on the SHELF — the thing in front of them,
     that they can count. What was MADE is then max(asked, shelved), which is
     right in all three shapes without asking a second question:
       asked 20, shelved 18 → made 20, 2 short, and it wants a reason
       asked 20, shelved 20 → made 20, nothing short, no question
       asked 20, shelved 22 → made 22, nothing short (an extra tray, not a loss)
     A screen with two steppers per line would be more expressive and would be
     wrong more often, on a phone, with cold hands. */
  function hdMade(l) { return Math.max(l.asked, l.want); }
  function hdShort(l) { return hdMade(l) - l.want; }

  // The ask screens' stepper glyphs. Written out rather than borrowed from
  // AK_MINUS/AK_PLUS: those are `var`s in a section BELOW this one, so at the
  // moment this line runs they are hoisted and still undefined.
  var HD_MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  var HD_PLUS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  function hdKey(s) { return String(s == null ? '' : s).trim().toLowerCase(); }
  function hdName(l) {
    var n = lang === 'cn' ? (l.name_cn || l.name_en) : (l.name_en || l.name_cn);
    return n || l.sku || '—';
  }

  /* Match every line on the request against the shelf this app is holding.
     SKU first, because it is the code both catalogues print; the name only as a
     fallback, and only on an exact match — a fuzzy name match that puts units on
     the wrong product is exactly the failure _checkTransferIds exists to stop on
     the transfer side. First match wins: a duplicate SKU is a catalogue problem,
     and picking one of them arbitrarily is no worse than the alternative of
     refusing a line the operator can see in front of them. */
  function hdResolve(order) {
    var bySku = {}, byName = {};
    (state.items || []).forEach(function (it) {
      var k = hdKey(it.sku);
      if (k && bySku[k] === undefined) bySku[k] = it;
      [it.name_en, it.name_cn].forEach(function (n) {
        var kn = hdKey(n);
        if (kn && byName[kn] === undefined) byName[kn] = it;
      });
    });
    var out = [];
    (order.items || []).forEach(function (li) {
      var qty = rcNum(li.qty_requested);
      if (qty <= 0) return;
      var hit = bySku[hdKey(li.sku)] || byName[hdKey(li.product_name)] || byName[hdKey(li.product_cn)] || null;
      out.push({
        id: hit ? hit.id : null,
        name_en: (hit && hit.name_en) || li.product_name || '',
        name_cn: (hit && hit.name_cn) || li.product_cn || '',
        sku: li.sku || (hit && hit.sku) || '',
        asked: qty,        // what the request said, kept so the row can say so
        want: qty,         // what is actually going on the shelf
        reason: '',        // why it is short, when it is — the server refuses a bare gap
        st: '', msg: '',   // '' | 'saving' | 'ok' | 'err'
      });
    });
    return out;
  }

  /* Returns false when there is nothing worth showing, and the caller falls back
     to the queue exactly as before. Three reasons it declines, all of them the
     honest answer rather than an empty screen: this operator recounts rather
     than adds, the request has no lines, or not one line could be matched to
     this shelf. */
  function hdStart(order) {
    if (state.mode !== 'add' || state.storeId == null) return false;
    var lines = hdResolve(order);
    if (!lines.length) return false;
    if (!lines.some(function (l) { return l.id != null; })) return false;
    return hdOpen(lines, order.rs_number || ('#' + order.id), order.id);
  }

  /* THE SAME SCREEN, WHETHER OR NOT ANYBODY ASKED. A batch made because it is
     Tuesday needs recording exactly as much as one somebody requested, and it
     can come up short in exactly the same ways — so it gets the same rows, the
     same one question, and the same write. `rs` null is the only difference,
     and it changes what the head says and where Back goes, nothing else. */
  function hdOpen(lines, rs, rsId) {
    hd.rs = rs || null;
    hd.rsId = rsId || null;
    hd.lines = lines; hd.busy = false; hd.err = ''; hd.done = null; hd.openReason = -1;
    state.view = 'handoff';
    hdRender();
    hdLoadReasons();
    return true;
  }

  /* THE GAP VOCABULARY COMES FROM THE SERVER, and it is the waste module's own
     list plus `made_fewer`. Not typed again here: routes/retail-waste's header
     records how a reason list kept in a browser is exactly how the old kitchen
     screen ended up with codes that existed nowhere else. If the fetch fails the
     picker still offers the two that cover almost every morning, because a
     screen that cannot name a reason cannot record a short batch at all — and
     the server would then refuse the whole thing. */
  function hdLoadReasons() {
    if (hd.reasons) return;
    api(API + '/production/reasons').then(function (rows) {
      hd.reasons = (rows || []).map(function (r) { return { code: r.code, en: r.en, cn: r.cn }; });
      if (state.view === 'handoff') hdRender();
    }).catch(function () {
      hd.reasons = [
        { code: 'damaged',    en: 'Damaged',    cn: '损坏' },
        { code: 'made_fewer', en: 'Made fewer', cn: '实际制作较少' },
      ];
      if (state.view === 'handoff') hdRender();
    });
  }

  function hdReasonLabel(code) {
    var r = (hd.reasons || []).filter(function (x) { return x.code === code; })[0];
    if (!r) return code;
    return lang === 'cn' ? (r.cn || r.en) : (r.en || r.cn);
  }

  // Back to wherever this was entered from: the queue for a request, the
  // launcher for a batch nobody asked for. A screen that always returns to the
  // queue would strand somebody who never came through it.
  function hdExit() {
    var hadRequest = hd.rsId != null;
    hd.rs = null; hd.rsId = null; hd.lines = null; hd.err = ''; hd.done = null;
    if (hadRequest) kqEnter(); else homeBack();
  }

  /* ══ LOG A BATCH ═══════════════════════════════════════════════════════════
     Production nobody asked for — Tuesday is hummus day. It is the majority of
     what a kitchen makes and it had no door at all: every path into the
     production record went through a request, so a batch made on the kitchen's
     own initiative could only reach the shelf as a bare stock add, with its
     yield and any breakage unrecorded.

     THE PICKER ONLY CHOOSES WHAT WAS MADE. The quantities set here are the
     MADE figures; how many of them reached the shelf is the next screen's
     question, which is the same screen a request uses. Two ways in, one way of
     recording, so a short batch is handled identically whether or not anybody
     ordered it. */
  var lb = { qty: {}, q: '' };

  function lbEnter() {
    state.view = 'logbatch';
    lb.qty = {}; lb.q = '';
    lbRender();
  }
  function lbExit() { homeBack(); }

  function lbBump(id, d) {
    var n = (lb.qty[id] || 0) + d;
    lb.qty[id] = n > 0 ? n : 0;
    lbRender();
  }

  function lbChosen() {
    return (state.items || []).filter(function (p) { return (lb.qty[p.id] || 0) > 0; });
  }

  function lbLines() {
    var q = lb.q.trim().toLowerCase();
    var all = state.items || [];
    if (!q) return all;
    return all.filter(function (p) {
      return (p.name_en || '').toLowerCase().indexOf(q) >= 0
          || (p.name_cn || '').indexOf(lb.q.trim()) >= 0
          || (p.sku || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  // Hand the chosen quantities to the record screen as what was MADE. asked is
  // set to the same figure so the short-batch arithmetic there reads the same
  // as it does for a request: drop the shelf number and it asks why.
  function lbContinue() {
    var chosen = lbChosen();
    if (!chosen.length) return;
    hdOpen(chosen.map(function (p) {
      return {
        id: p.id, name_en: p.name_en, name_cn: p.name_cn, sku: p.sku,
        asked: lb.qty[p.id], want: lb.qty[p.id], reason: '', st: '', msg: '',
      };
    }), null, null);
  }

  function lbHtml() {
    var chosen = lbChosen();
    var units = chosen.reduce(function (a, p) { return a + lb.qty[p.id]; }, 0);
    var ready = chosen.length > 0;
    var rows = lbLines().map(function (p) {
      var n = lb.qty[p.id] || 0;
      return '<div class="rc-hr"></div><div class="rc-row">' +
        '<span class="rc-mid"><span class="rc-nm">' + esc(pname(p)) + '</span>' +
        '<span class="rc-cap">' + esc(p.sku || ('#' + p.id)) + '</span></span>' +
        '<span class="ak-step">' +
          '<button data-lbdec="' + p.id + '"' + (n <= 0 ? ' disabled' : '') + '>' + HD_MINUS + '</button>' +
          '<span class="n num">' + n + '</span>' +
          '<button data-lbinc="' + p.id + '">' + HD_PLUS + '</button>' +
        '</span></div>';
    }).join('');
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-lbback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Log a batch', '登记批次') + '</div>' +
        '<div class="rc-sub">' + t('What you made, with nobody asking', '主动制作,无对应申请') + '</div>' +
      '</div>' +
      '<div class="ak-search"><input id="lbQ" inputmode="search" enterkeyhint="search" ' +
        'placeholder="' + t('Search products', '搜索商品') + '" value="' + esc(lb.q) + '"></div>' +
      '<div class="rc-body">' + (rows || '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' +
        t('Nothing on this store’s list matches.', '本店商品目录中没有匹配项。') + '</div></div>') +
        (rows ? '<div class="rc-hr"></div>' : '') +
        '<div style="padding:12px 16px 0"><div class="rc-flat rc-note">' +
          t('Set how many you MADE. The next screen asks how many reached the shelf.',
            '请填写制作数量。下一步会询问实际入库数量。') +
        '</div></div>' +
      '</div>' +
      '<div class="rc-foot"><div class="rc-footrow">' +
        '<div class="rc-tally"><b>' + units + ' <span>' + t('units', '件') + '</span></b>' +
        '<i>' + t(chosen.length + ' products', chosen.length + ' 种商品') + '</i></div>' +
        '<button class="rc-cta' + (ready ? ' on' : '') + '"' + (ready ? ' data-lbnext' : ' disabled') + '>' +
          t('Next', '下一步') + '</button>' +
      '</div></div></div>';
  }

  function lbRender() {
    if (state.view !== 'logbatch') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = lbHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-lbback]', function (b) { b.onclick = lbExit; });
    each('[data-lbinc]', function (b) { b.onclick = function () { lbBump(parseInt(b.getAttribute('data-lbinc'), 10), 1); }; });
    each('[data-lbdec]', function (b) { b.onclick = function () { lbBump(parseInt(b.getAttribute('data-lbdec'), 10), -1); }; });
    each('[data-lbnext]', function (b) { b.onclick = lbContinue; });
    var q = $('#lbQ');
    if (q) {
      q.oninput = function () { lb.q = q.value; lbRender(); var el = $('#lbQ'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
    }
  }

  function hdBump(i, d) {
    var l = (hd.lines || [])[i];
    if (!l || hd.busy || l.st === 'ok' || l.id == null) return;
    l.want = Math.max(0, l.want + d);
    if (l.st === 'err') { l.st = ''; l.msg = ''; }
    // Back to full means there is nothing to explain, so the answer goes with
    // the question — leaving a stale "damaged" on a line that is no longer short
    // would file a loss that did not happen.
    if (hdShort(l) === 0) { l.reason = ''; if (hd.openReason === i) hd.openReason = -1; }
    else if (!l.reason) hd.openReason = i;   // it just went short: ask, don't wait to be found
    hdRender();
  }

  function hdPickReason(i, code) {
    var l = (hd.lines || [])[i];
    if (!l || hd.busy) return;
    l.reason = code;
    hd.openReason = -1;
    hdRender();
  }

  // Every short line must say why before anything is written. The server
  // refuses a bare gap too (gap_reason_required) — this is so the operator is
  // told on the screen rather than by a failed write.
  function hdUnexplained() {
    return (hd.lines || []).filter(function (l) {
      return l.id != null && l.st !== 'ok' && hdShort(l) > 0 && !l.reason;
    });
  }

  /* A line is still to do when it was matched and has not landed. NOTE `want`
     is NOT required to be > 0 any more: a tray that was made and entirely lost
     is `made 6, shelved 0`, which moves no stock and is exactly the morning
     most worth recording. The old handoff dropped those rows because all it
     could do was add to a shelf. */
  function hdPending() {
    return (hd.lines || []).filter(function (l) {
      return l.id != null && l.st !== 'ok' && (l.want > 0 || hdShort(l) > 0);
    });
  }

  /* One delta per line, all in flight together, each reporting its own fate in
     its own row. A line that succeeded is marked 'ok' and is never in `todo`
     again, so pressing Add after a partial failure retries ONLY what failed —
     the guard that keeps a shaky connection from adding a batch twice. */
  function hdCommit() {
    if (hd.busy) return;
    var todo = hdPending();
    if (!todo.length) return;
    hd.busy = true; hd.err = '';
    todo.forEach(function (l) { l.st = 'saving'; l.msg = ''; });
    hdRender();

    var left = todo.length, failed = 0, added = 0, units = 0, short = 0;
    todo.forEach(function (l) {
      /* ONE CALL PER LINE, and it is the PRODUCTION endpoint rather than the
         stock one. That endpoint writes the batch and moves the shelf inside a
         single transaction, so a line cannot end up half-recorded — which two
         calls from here could not promise however carefully they were ordered.
         It is also what keeps `made` alive: the stock route only ever knew the
         number that arrived. */
      api(API + '/production', {
        method: 'POST',
        body: {
          store_id: state.storeId,
          product_id: l.id,
          qty_made: hdMade(l),
          qty_shelved: l.want,
          gap_reason: hdShort(l) > 0 ? l.reason : null,
          // Names the request, so a batch can be traced back to what asked for
          // it rather than matched by eye on a timestamp.
          request_id: hd.rsId || null,
        },
      }).then(function () {
        l.st = 'ok'; added++; units += l.want; short += hdShort(l);
        var it = itemById(l.id);
        if (it) it.physical_qty += l.want;
      }).catch(function (e) {
        if (e.message === 'auth') { l.st = ''; return; }   // the app is leaving for the sign-in
        l.st = 'err'; failed++;
        l.msg = e.message === 'norealm' ? '' : (e.message || '');
      }).then(function () {
        if (--left > 0) { hdRender(); return; }
        hd.busy = false;
        if (failed) {
          hd.err = t('Some lines were not recorded. Nothing was counted twice — press Record again for the ones still marked.',
                     '部分商品未登记。已登记的不会重复计入 — 请对仍标记错误的商品再按一次「登记」。');
        } else {
          hd.done = { added: added, units: units, short: short };
          // The shelf this app counts has just changed underneath it.
          kqLoad();
        }
        hdRender();
      });
    });
  }

  function hdRowHtml(l, i) {
    var dead = l.id == null;
    var shortBy = dead ? 0 : hdShort(l);
    var badge = l.st === 'ok'   ? t('Recorded', '已登记')
              : l.st === 'saving' ? t('Recording…', '登记中…')
              : l.st === 'err'  ? t('Not recorded', '未登记')
              : dead            ? t('Not on this store’s list', '本店商品目录中没有')
              : (shortBy > 0
                  ? t('Made ' + hdMade(l) + ' · ' + shortBy + ' short', '制作 ' + hdMade(l) + ' 件 · 少 ' + shortBy + ' 件')
                  : (l.want > l.asked ? t(l.asked + ' asked for', '申请 ' + l.asked + ' 件') : ''));
    var stepper = dead || l.st === 'ok'
      ? '<span class="rc-qty num" style="font-size:22px;color:var(--text2)">' + (l.st === 'ok' ? '+' + l.want : '—') + '</span>'
      : '<span class="ak-step">' +
          '<button data-hddec="' + i + '"' + (l.want <= 0 || hd.busy ? ' disabled' : '') + '>' + HD_MINUS + '</button>' +
          '<span class="n num">+' + l.want + '</span>' +
          '<button data-hdinc="' + i + '"' + (hd.busy ? ' disabled' : '') + '>' + HD_PLUS + '</button>' +
        '</span>';

    /* THE ONE QUESTION THIS SCREEN ASKS, and it only ever appears on a line that
       is actually short. On a normal morning nobody sees it at all. Answered
       inline rather than in a sheet: a modal over a three-line list, on a phone,
       to answer one word, is a screen between the operator and the thing they
       are already looking at. */
    var ask = '';
    if (!dead && l.st !== 'ok' && shortBy > 0) {
      if (l.reason && hd.openReason !== i) {
        ask = '<div class="hd-why"><button class="hd-chip on" data-hdwhy="' + i + '">' +
              esc(hdReasonLabel(l.reason)) + '</button>' +
              '<span class="hd-note">' + t('tap to change', '点击可修改') + '</span></div>';
      } else {
        var opts = (hd.reasons || []).map(function (r) {
          return '<button class="hd-chip' + (l.reason === r.code ? ' on' : '') + '" ' +
                 'data-hdreason="' + i + '" data-hdcode="' + esc(r.code) + '">' +
                 esc(lang === 'cn' ? (r.cn || r.en) : (r.en || r.cn)) + '</button>';
        }).join('');
        ask = '<div class="hd-why"><span class="hd-note">' +
              t(shortBy + ' short — why?', '少 ' + shortBy + ' 件 — 原因?') + '</span>' +
              (opts || '<span class="hd-note">' + t('Loading…', '加载中…') + '</span>') + '</div>';
      }
    }

    return '<div class="rc-hr"></div>' +
      '<div class="rc-row"' + (dead ? ' style="opacity:.55"' : '') + '>' +
        '<span class="rc-mid"><span class="rc-nm">' + esc(hdName(l)) + '</span>' +
        '<span class="rc-cap">' + esc(l.sku || '') + (badge ? (l.sku ? ' · ' : '') + esc(badge) : '') + '</span></span>' +
        stepper +
      '</div>' + ask;
  }

  function hdHtml() {
    if (hd.done) {
      return '<div class="rc-wrap">' +
        '<div class="rc-head">' +
          '<div class="rc-h1">' + t('Recorded', '已登记') + '</div>' +
          '<div class="rc-sub">' + (hd.rs ? esc(hd.rs)
            : t('Made without a request', '无申请的制作')) + '</div>' +
        '</div>' +
        '<div class="rc-body"><div style="padding:0 16px">' +
          '<div class="rc-flat"><div style="font-size:17px;font-weight:600;letter-spacing:-.01em">' +
            t(hd.done.units + ' units on the shelf', '已入库 ' + hd.done.units + ' 件') + '</div>' +
            '<div class="rc-note" style="margin-top:4px">' +
            // A batch nobody asked for closes no request, and saying it did
            // would describe a thing that never happened.
            (hd.rs
              ? t('Across ' + hd.done.added + ' products. The request is closed.',
                  '共 ' + hd.done.added + ' 种商品。该申请已关闭。')
              : t('Across ' + hd.done.added + ' products.',
                  '共 ' + hd.done.added + ' 种商品。')) + '</div>' +
            // Said back, because it is the number the old flow could not hold.
            // Seeing "2 did not make it" recorded is what makes it worth asking.
            (hd.done.short ? '<div class="rc-note" style="margin-top:6px">' +
              t(hd.done.short + ' made but did not reach the shelf — recorded against this batch.',
                '另有 ' + hd.done.short + ' 件已制作但未入库 — 已记录在本批次。') + '</div>' : '') +
          '</div>' +
        '</div></div>' +
        '<div class="rc-foot" style="background:transparent;border:none">' +
          '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
          '<button class="rc-big" data-hdback>' +
            (hd.rs ? t('Back to the queue', '返回制作队列') : t('Done', '完成')) + '</button>' +
          '</div></div></div>';
    }

    var lines = hd.lines || [];
    var pending = hdPending();
    var units = pending.reduce(function (a, l) { return a + l.want; }, 0);
    var shortTotal = pending.reduce(function (a, l) { return a + hdShort(l); }, 0);
    var unexplained = hdUnexplained().length;
    // NOT READY WHILE A SHORT LINE HAS NO REASON. The server refuses it too
    // (gap_reason_required); saying so here means the operator is told by the
    // screen rather than by a write that failed.
    var ready = pending.length > 0 && !unexplained && !hd.busy;
    var lost = lines.filter(function (l) { return l.id == null; }).length;

    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<div class="rc-h1">' + t('What you made', '登记制作') + '</div>' +
        '<div class="rc-sub">' + esc(hd.rs || '') + ' · ' +
          t('Marked made — the shelf has not changed yet', '已标记完成 — 库存尚未变动') + '</div>' +
      '</div>' +
      (hd.err ? '<div class="rc-err">' + esc(hd.err) + '</div>' : '') +
      '<div class="rc-body">' + lines.map(hdRowHtml).join('') + '<div class="rc-hr"></div>' +
        (lost ? '<div style="padding:12px 16px 0"><div class="rc-flat rc-note">' +
          t(lost === 1 ? 'One line is not on this store’s product list, so it cannot be added here. Tell whoever looks after the catalogue.'
                       : lost + ' lines are not on this store’s product list, so they cannot be added here. Tell whoever looks after the catalogue.',
            lost + ' 项不在本店商品目录中,无法在此入库。请联系管理商品目录的同事。') +
          '</div></div>' : '') +
        '<div style="padding:12px 16px 0"><div class="rc-flat rc-note">' +
          t('Set what actually went on the shelf. If it is less than was made, say why — that is how the difference gets recorded instead of disappearing.',
            '请填写实际入库数量。少于制作数量时请选择原因 — 差额才会被记录,而不是凭空消失。') +
        '</div></div>' +
      '</div>' +
      '<div class="rc-foot"><div class="rc-footrow">' +
        '<div class="rc-tally"><b>' + units + ' <span>' + t('units', '件') + '</span></b>' +
        '<i>' + (shortTotal
            ? t(shortTotal + ' short · ' + asHere(), '少 ' + shortTotal + ' 件 · ' + asHere())
            : t('onto ' + asHere(), '入库至 ' + asHere())) + '</i></div>' +
        '<button class="rc-cta' + (ready ? ' on' : '') + '"' + (ready ? ' data-hdadd' : ' disabled') + '>' +
          (hd.busy ? t('Recording…', '登记中…') : t('Record', '登记')) + '</button>' +
      '</div>' +
      (unexplained ? '<div style="padding:0 16px 10px"><div class="rc-note">' +
        t(unexplained === 1 ? 'One line is short and has no reason yet.'
                            : unexplained + ' lines are short and have no reason yet.',
          '有 ' + unexplained + ' 项数量不足且尚未选择原因。') + '</div></div>' : '') +
      '<div style="padding:0 16px calc(var(--sa-bot) + 16px)">' +
        '<button class="btn btn-secondary" style="width:100%" data-hdskip>' +
          t('Skip — record nothing', '跳过 — 不登记') + '</button>' +
        '<div class="rc-note" style="margin-top:8px;text-align:center">' +
          t('Skipping records no batch and leaves the shelf as it is.',
            '跳过则不登记批次,库存保持不变。') +
        '</div>' +
      '</div></div></div>';
  }

  function hdRender() {
    if (state.view !== 'handoff') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = hdHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-hdinc]', function (b) { b.onclick = function () { hdBump(parseInt(b.getAttribute('data-hdinc'), 10), 1); }; });
    each('[data-hddec]', function (b) { b.onclick = function () { hdBump(parseInt(b.getAttribute('data-hddec'), 10), -1); }; });
    each('[data-hdreason]', function (b) {
      b.onclick = function () {
        hdPickReason(parseInt(b.getAttribute('data-hdreason'), 10), b.getAttribute('data-hdcode'));
      };
    });
    each('[data-hdwhy]', function (b) {
      b.onclick = function () { hd.openReason = parseInt(b.getAttribute('data-hdwhy'), 10); hdRender(); };
    });
    each('[data-hdadd]', function (b) { b.onclick = hdCommit; });
    each('[data-hdskip]', function (b) { b.onclick = hdExit; });
    each('[data-hdback]', function (b) { b.onclick = hdExit; });
  }

  /* ══ ASK FOR STOCK ═════════════════════════════════════════════════════════
     One location asking another to send it something. ONE SCREEN FOR BOTH
     DIRECTIONS, because since #259 the direction is just which two ids go in
     which field: at Yuexiu you pick Tianhe and it is Yuexiu asking Tianhe; at
     Tianhe you pick Yuexiu and it is the request the old model could not even
     express. Nothing about the screen knows which is which, and that is the
     point — a "warehouse" is a row, not a special case.

     IT ALSO REPLACES A DOOR THAT WAS QUIETLY SHUT. app.html's in-SPA Restock
     screen was the only thing that could raise a store request, and it is
     kitchen-realm, so #261's move to Tacet closed it: POST /api/restock became
     tacetOnly and that button has 403'd ever since. Nothing could raise a
     store-to-store request at all. This is that door, in the app the work now
     lives in.

     WHO RECEIVES IS THE SHELF ON SCREEN, not a choice. You are asking for stock
     for the store you are standing in and looking at; making it a second picker
     would invite ordering someone else's stock into someone else's building. */

  var as = {
    from: null,      // the location being asked to supply
    qty: {},
    q: '',
    busy: false, err: '', sent: null,
  };

  function asEnter() {
    state.view = 'askstock';
    as.from = null; as.qty = {}; as.q = ''; as.err = ''; as.sent = null; as.busy = false;
    asRender();
    akLoad().then(asRender);        // the catalogue both request screens use
  }
  function asExit() { as.sent = null; homeBack(); }

  function asSuppliers() {
    return (state.stores || []).filter(function (s) { return s.id !== state.storeId; });
  }
  function asHere() {
    var s = (state.stores || []).filter(function (x) { return x.id === state.storeId; })[0];
    return s ? storeLabel(s) : '';
  }
  function asChosen() {
    return (ak.products || []).filter(function (p) { return (as.qty[p.id] || 0) > 0; });
  }
  function asBump(id, d) {
    var n = (as.qty[id] || 0) + d;
    as.qty[id] = n > 0 ? n : 0;
    asRender();
  }
  function asLines() {
    var all = ak.products || [];
    var q = as.q.trim().toLowerCase();
    if (!q) return all;
    return all.filter(function (p) {
      return (p.name_en || '').toLowerCase().indexOf(q) >= 0
          || (p.name_cn || '').indexOf(as.q.trim()) >= 0
          || (p.sku || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  function asSend() {
    if (as.busy) return;
    var chosen = asChosen();
    if (!as.from || !chosen.length) return;
    as.busy = true; as.err = ''; asRender();
    rcFetch('/api/restock', { method: 'POST', body: {
      // BOTH ENDS NAMED OUTRIGHT. The server still derives from_role/to_role for
      // its notification routing, but the locations are the order's own — which
      // is what makes a request TO a shop as ordinary as one to the warehouse.
      from_store_id: as.from,
      to_store_id: state.storeId,
      status: 'sent',
      items: chosen.map(function (p) {
        return {
          // No product_id, for the reason the kitchen screen gives: the store
          // and kitchen catalogues are separate counters over one integer space
          // and this field is read as a kitchen id. The name is what a picker
          // reads off the row.
          product_id: null,
          product_name: p.name_en || p.name_cn || ('#' + p.id),
          product_cn: p.name_cn || null,
          sku: p.sku || null,
          qty_requested: as.qty[p.id],
          unit: 'pcs',
        };
      }),
    } }).then(function (j) {
      as.busy = false;
      var supplier = (state.stores || []).filter(function (s) { return s.id === as.from; })[0];
      as.sent = { rs: j.rs_number || ('#' + j.id), lines: chosen.length,
                  units: chosen.reduce(function (a, p) { return a + as.qty[p.id]; }, 0),
                  who: supplier ? storeLabel(supplier) : '' };
      asRender();
    }).catch(function (e) {
      as.busy = false;
      as.err = e.message === 'norealm'
        ? t('This account cannot ask for stock.', '此账号无法发起补货申请。')
        : (e.message || t('That did not send. Nothing has changed — try again.', '未发送,数据未变 — 请重试。'));
      asRender();
    });
  }

  function asHtml() {
    if (as.sent) {
      return '<div class="rc-wrap">' +
        rcHeadHtml(t('Sent to ' + as.sent.who, '已发送至 ' + as.sent.who),
                   as.sent.rs + ' · ' + clock(new Date()), false) +
        '<div style="padding:0 16px"><div class="rc-card">' +
          '<div style="font-size:15px;font-weight:600;line-height:1.35">' +
            t(as.sent.lines + ' item' + (as.sent.lines > 1 ? 's' : '') + ' · ' + as.sent.units + ' units',
              '共 ' + as.sent.lines + ' 项 · ' + as.sent.units + ' 件') + '</div>' +
          '<div class="rc-sub" style="margin-top:6px">' +
            t('It is on their pick list now. Stock moves when they dispatch it.',
              '已进入对方拣货单。对方发货时库存才会变动。') + '</div></div></div>' +
        '<div class="rc-body"></div>' +
        '<div class="rc-foot" style="background:transparent;border:none">' +
          '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
          '<button class="rc-big" data-asback>' + t('Done', '完成') + '</button></div></div></div>';
    }
    var chosen = asChosen();
    var units = chosen.reduce(function (a, p) { return a + as.qty[p.id]; }, 0);
    var suppliers = asSuppliers();
    var ready = !!as.from && chosen.length > 0;
    var rows = ak.products === null
      ? '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' + t('Loading…', '加载中…') + '</div></div>'
      : asLines().map(function (p) {
          var n = as.qty[p.id] || 0;
          return '<div class="rc-hr"></div><div class="rc-row">' +
            '<span class="rc-mid"><span class="rc-nm">' + esc(akName(p)) + '</span>' +
            '<span class="rc-cap">' + esc(p.sku || ('#' + p.id)) + '</span></span>' +
            '<span class="ak-step">' +
              '<button data-asdec="' + p.id + '"' + (n <= 0 ? ' disabled' : '') + '>' + AK_MINUS + '</button>' +
              '<span class="n num">' + n + '</span>' +
              '<button data-asinc="' + p.id + '">' + AK_PLUS + '</button>' +
            '</span></div>';
        }).join('') + '<div class="rc-hr"></div>';
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-asback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Ask for stock', '申请补货') + '</div>' +
        '<div class="rc-sub">' + t('For ' + asHere(), '收货门店:' + asHere()) + '</div>' +
      '</div>' +
      (as.err ? '<div class="rc-err">' + esc(as.err) + '</div>' : '') +
      // Asked first, and with no default. Which location supplies decides whose
      // shelf empties, and picking one for him is picking whose stock to take.
      '<div class="rc-lbl">' + t('Who should send it?', '由哪个地点发货?') + '</div>' +
      (suppliers.length
        ? '<div class="ak-purpose">' + suppliers.map(function (s) {
            return '<button class="ak-opt' + (as.from === s.id ? ' on' : '') + '" data-asfrom="' + s.id + '">' +
              '<b>' + esc(storeLabel(s)) + '</b></button>';
          }).join('') + '</div>'
        : '<div class="rc-flat rc-note" style="margin:0 16px 12px">' +
            t('There is nowhere else to ask — this is the only location.', '没有其他地点可申请 — 当前仅此一个门店。') +
          '</div>') +
      '<div class="ak-search"><input id="asQ" inputmode="search" enterkeyhint="search" ' +
        'placeholder="' + t('Search products', '搜索商品') + '" value="' + esc(as.q) + '"></div>' +
      '<div class="rc-body">' + rows + '</div>' +
      '<div class="rc-foot"><div class="rc-footrow">' +
        '<div class="rc-tally"><b>' + chosen.length + ' <span>' + t('items', '项') + '</span></b>' +
        '<i>' + t(units + ' units', units + ' 件') + '</i></div>' +
        '<button class="rc-cta' + (ready && !as.busy ? ' on' : '') + '"' +
          (ready && !as.busy ? ' data-assend' : ' disabled') + '>' +
          (as.busy ? t('Sending…', '发送中…') : t('Send', '发送')) + '</button>' +
      '</div></div></div>';
  }

  function asRender() {
    if (state.view !== 'askstock') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = asHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-asback]', function (b) { b.onclick = asExit; });
    each('[data-asfrom]', function (b) {
      b.onclick = function () { as.from = parseInt(b.getAttribute('data-asfrom'), 10); asRender(); };
    });
    each('[data-asinc]', function (b) { b.onclick = function () { asBump(parseInt(b.getAttribute('data-asinc'), 10), 1); }; });
    each('[data-asdec]', function (b) { b.onclick = function () { asBump(parseInt(b.getAttribute('data-asdec'), 10), -1); }; });
    each('[data-assend]', function (b) { b.onclick = asSend; });
    var q = $('#asQ');
    if (q) q.oninput = function () { as.q = q.value; asRender(); var f = $('#asQ'); if (f) f.focus(); };
  }

  boot();
})();
</script>
</body>
