     kitchen operator's refusal on the two transfer lists came back before the
     one list they ARE allowed — and the latch below had already decided they
     had one job. Whoever answers first is not the answer; the OR of all three
     is, so the decision waits for all three to be in.

     _armed is the safety net: a probe that never answers at all (a dropped
     connection, not a refusal) must not strand someone on a blank decision, so
     boot arms the landing on a timer regardless. Late is survivable here in a
     way that never is not. */
  var _landed = false, _probes = 0, _armed = false;
  var PROBE_COUNT = 3;                      // rcLoad, pkLoad, kqLoad
  function probeAnswered() { _probes++; homeLand(); }
  function homeLand() {
    if (_landed || state.view === 'off' || state.view === 'nostore') return;
    if (_probes < PROBE_COUNT && !_armed) return;
    _landed = true;
    if (!homeAvailable()) return;          // one job — stay on the list
    state.view = 'home';
    homeRender();
  }
  function armLanding() { _armed = true; homeLand(); }


  /* ══ ASK THE KITCHEN ═══════════════════════════════════════════════════════
     Tianhe asking the kitchen to MAKE something. §39: this moves no stock and
     is not supposed to — it asks for production, and stock changes when the
     kitchen makes it, not when someone asks. So there is no dispatch, no
     receipt and no location pair; the request lands in the kitchen's inbox
     (public/kitchen.html) and closes when they mark it prepared.

     WHY IT NEEDED BUILDING AT ALL. The direction has always existed and the
     kitchen's inbox has always worked, but the only screen that could RAISE one
     was public/restock.html, deleted 2026-08-04. Nothing has created a kitchen
     request since 16 May. This is that door, reopened.

     THE PURPOSE IS MANDATORY, and the server has always enforced it — a request
     without `order` or `shelf` is refused by name. It is asked for first, before
     any product, because it is the thing the kitchen reads first: making
     something for a customer order due today is different work from refilling a
     shelf, and the old page asked for it in a modal after the fact. */

  var ak = {
    purpose: null,      // 'order' | 'shelf' — no default; §39's no-prefill rule
    qty: {},            // product id -> how many are being asked for
    products: null,     // the catalogue, once fetched
    fromShelf: false,   // true when we fell back to the shelf list
    q: '',
    busy: false, err: '', sent: null,
  };

  var AK_MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  var AK_PLUS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  /* THE CATALOGUE TACET OWNS. /api/retail-admin/products is the sellable list,
     reachable by exactly the operator who can raise one of these requests, and
     it lists everything rather than only what happens to have a stock row at
     this store. The shelf already in memory stands in if it cannot be read.

     NO product_id IS SENT, and that is deliberate rather than a shortcut.
     `restock_items.product_id` is read as a KITCHEN `products.id`, and the two
     catalogues are separate AUTOINCREMENT counters over one integer space (see
     _checkTransferIds) — so a store id written into that field points at a
     different thing on the kitchen's side, and nothing would ever tell anybody.
     A kitchen request needs the NAME: it moves no stock, and nothing in this
     direction resolves a product by id. So the honest thing is to send the name
     and leave the id empty rather than fill it from the wrong catalogue.

     THIS USED TO ASK /api/products, the kitchen's own list, which was right
     while the screens lived on the kitchen host. Since the restock routes moved
     to Tacet that endpoint 403s for every operator who can reach this screen,
     so the "right" source had become one that always failed — leaving the
     fallback as the only path and an apology on screen for the normal case. */
  function akLoad() {
    if (ak.products) return Promise.resolve();
    return rcFetch('/api/retail-admin/products').then(function (j) {
      var rows = Array.isArray(j.data) ? j.data : (j.data && j.data.products) || [];
      ak.products = rows.map(function (p) {
        return { id: p.id, name_en: p.name_en, name_cn: p.name_cn, sku: p.sku };
      });
      ak.fromShelf = false;
      akRender();
    }).catch(function () {
      ak.products = (state.items || []).map(function (p) {
        return { id: p.id, name_en: p.name_en, name_cn: p.name_cn, sku: p.sku };
      });
      ak.fromShelf = true;
      akRender();
    });
  }

  function akEnter() {
    state.view = 'kitchen';
    ak.purpose = null; ak.qty = {}; ak.q = ''; ak.err = ''; ak.sent = null; ak.busy = false;
    akRender();
    akLoad();
  }
  function akExit() { ak.sent = null; homeBack(); }

  function akName(p) {
    var n = lang === 'cn' ? (p.name_cn || p.name_en) : (p.name_en || p.name_cn);
    return n || ('#' + p.id);
  }
  function akLines() {
    var all = ak.products || [];
    var q = ak.q.trim().toLowerCase();
    if (!q) return all;
    return all.filter(function (p) {
      return (p.name_en || '').toLowerCase().indexOf(q) >= 0
          || (p.name_cn || '').indexOf(ak.q.trim()) >= 0
          || (p.sku || '').toLowerCase().indexOf(q) >= 0;
    });
  }
  function akChosen() {
    return (ak.products || []).filter(function (p) { return (ak.qty[p.id] || 0) > 0; });
  }
  function akBump(id, d) {
    var n = (ak.qty[id] || 0) + d;
    ak.qty[id] = n > 0 ? n : 0;
    akRender();
  }

  function akSend() {
    if (ak.busy) return;
    var chosen = akChosen();
    if (!ak.purpose || !chosen.length) return;
    ak.busy = true; ak.err = ''; akRender();
    rcFetch('/api/restock', { method: 'POST', body: {
      // to_role and purpose are what make this a kitchen request; without both
      // the server refuses, and since #254 an absent to_role means the warehouse.
      to_role: 'kitchen',
      purpose: ak.purpose,
      status: 'sent',
      items: chosen.map(function (p) {
        return {
          product_id: null,
          product_name: p.name_en || p.name_cn || ('#' + p.id),
          product_cn: p.name_cn || null,
          sku: p.sku || null,
          qty_requested: ak.qty[p.id],
          unit: 'pcs',
        };
      }),
    } }).then(function (j) {
      ak.busy = false;
      ak.sent = { rs: j.rs_number || ('#' + j.id), lines: chosen.length,
                  units: chosen.reduce(function (a, p) { return a + ak.qty[p.id]; }, 0) };
      akRender();
    }).catch(function (e) {
      ak.busy = false;
      // The numbers stay on screen. Losing a list somebody just built is the one
      // failure that makes people stop using a screen.
      ak.err = e.message === 'norealm'
        ? t('This account cannot raise kitchen requests.', '此账号无法向厨房下单。')
        : (e.message || t('That did not send. Nothing has changed — try again.', '未发送,数据未变 — 请重试。'));
      akRender();
    });
  }

  function akHtml() {
    if (ak.sent) {
      return '<div class="rc-wrap">' +
        rcHeadHtml(t('Sent to the kitchen', '已发送至厨房'),
                   ak.sent.rs + ' · ' + clock(new Date()), false) +
        '<div style="padding:0 16px"><div class="rc-card">' +
          '<div style="font-size:15px;font-weight:600;line-height:1.35">' +
            t(ak.sent.lines + ' item' + (ak.sent.lines > 1 ? 's' : '') + ' · ' + ak.sent.units + ' units',
              '共 ' + ak.sent.lines + ' 项 · ' + ak.sent.units + ' 件') + '</div>' +
          '<div class="rc-sub" style="margin-top:6px">' +
            t('The kitchen sees it now. Nothing moves until they make it.',
              '厨房已收到。制作完成后库存才会变动。') + '</div></div></div>' +
        '<div class="rc-body"></div>' +
        '<div class="rc-foot" style="background:transparent;border:none">' +
          '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
          '<button class="rc-big" data-akback>' + t('Done', '完成') + '</button></div></div></div>';
    }
    var chosen = akChosen();
    var units = chosen.reduce(function (a, p) { return a + ak.qty[p.id]; }, 0);
    var ready = !!ak.purpose && chosen.length > 0;
    var rows = ak.products === null
      ? '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' + t('Loading…', '加载中…') + '</div></div>'
      : akLines().map(function (p) {
          var n = ak.qty[p.id] || 0;
          return '<div class="rc-hr"></div><div class="rc-row">' +
            '<span class="rc-mid"><span class="rc-nm">' + esc(akName(p)) + '</span>' +
            '<span class="rc-cap">' + esc(p.sku || ('#' + p.id)) + '</span></span>' +
            '<span class="ak-step">' +
              '<button data-akdec="' + p.id + '"' + (n <= 0 ? ' disabled' : '') + '>' + AK_MINUS + '</button>' +
              '<span class="n num">' + n + '</span>' +
              '<button data-akinc="' + p.id + '">' + AK_PLUS + '</button>' +
            '</span></div>';
        }).join('') + '<div class="rc-hr"></div>';
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-akback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Ask the kitchen', '向厨房下单') + '</div>' +
        '<div class="rc-sub">' + t('They make it — nothing moves until it is made.',
                                   '由厨房制作 — 制作完成后库存才会变动。') + '</div>' +
      '</div>' +
      (ak.err ? '<div class="rc-err">' + esc(ak.err) + '</div>' : '') +
      (ak.fromShelf ? '<div class="rc-flat rc-note" style="margin:0 16px 12px">' +
        t('Showing what this shelf holds — the full catalogue could not be read.',
          '显示本店在架商品 — 未能读取完整商品目录。') + '</div>' : '') +
      // Asked FIRST, because it is what the kitchen reads first. No default:
      // a purpose picked for him is a reason he did not give.
      '<div class="rc-lbl">' + t('What is it for?', '用途') + '</div>' +
      '<div class="ak-purpose">' +
        '<button class="ak-opt' + (ak.purpose === 'order' ? ' on' : '') + '" data-akpurpose="order">' +
          '<b>' + t('For an order', '用于发货') + '</b><i>' + t('A customer is waiting on it', '有客户订单等待') + '</i></button>' +
        '<button class="ak-opt' + (ak.purpose === 'shelf' ? ' on' : '') + '" data-akpurpose="shelf">' +
          '<b>' + t('For the shelf', '货架补货') + '</b><i>' + t('Restocking what we hold', '补充本店库存') + '</i></button>' +
      '</div>' +
      '<div class="ak-search"><input id="akQ" inputmode="search" enterkeyhint="search" ' +
        'placeholder="' + t('Search products', '搜索商品') + '" value="' + esc(ak.q) + '"></div>' +
      '<div class="rc-body">' + rows + '</div>' +
      '<div class="rc-foot"><div class="rc-footrow">' +
        '<div class="rc-tally"><b>' + chosen.length + ' <span>' + t('items', '项') + '</span></b>' +
        '<i>' + t(units + ' units', units + ' 件') + '</i></div>' +
        '<button class="rc-cta' + (ready && !ak.busy ? ' on' : '') + '"' +
          (ready && !ak.busy ? ' data-aksend' : ' disabled') + '>' +
          (ak.busy ? t('Sending…', '发送中…') : t('Send', '发送')) + '</button>' +
      '</div></div></div>';
  }

  function akRender() {
    if (state.view !== 'kitchen') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = akHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-akback]', function (b) { b.onclick = akExit; });
    each('[data-akpurpose]', function (b) {
      b.onclick = function () { ak.purpose = b.getAttribute('data-akpurpose'); akRender(); };
    });
    each('[data-akinc]', function (b) { b.onclick = function () { akBump(parseInt(b.getAttribute('data-akinc'), 10), 1); }; });
    each('[data-akdec]', function (b) { b.onclick = function () { akBump(parseInt(b.getAttribute('data-akdec'), 10), -1); }; });
    each('[data-aksend]', function (b) { b.onclick = akSend; });
    var q = $('#akQ');
    if (q) {
      q.oninput = function () { ak.q = q.value; akRender(); var f = $('#akQ'); if (f) { f.focus(); } };
    }
  }


  /* ══ THE KITCHEN QUEUE ═════════════════════════════════════════════════════
     What was asked for, seen by the people who make it — in Tacet, on the same
     launcher as every other stock job.

     It used to live in public/kitchen.html on the kitchen host: a separate app,
     a separate login, and a separate permission system, so a request raised in
     Tacet landed somewhere Tacet could not show. Ash: the kitchen app is dead
     and nothing more goes into it. This is its inbox, rebuilt here.

     WHAT THE KITCHEN CAN DO, AND WHAT IT CANNOT. It marks a request received
     (we have seen it) and then prepared (it is made), which is the whole
     lifecycle for this direction — there is no `delivered` for a kitchen
     request, because nothing travels. It may correct a line's quantity, because
     the person making it is the one who knows how many actually came out.

     NO STOCK MOVES WHEN IT IS MARKED PREPARED, and that is §39 rather than an
     omission: the request asked the kitchen to MAKE something, and stock changes
     when a production batch is logged against it. That wiring is its own brief.
     The screen says so rather than letting anyone infer that ticking this fills
     a shelf. */

  var kq = {
    // The queue's OWN probe. Kept apart from rc.on for the reason written there:
    // these are two jobs and two answers, and a session may hold either, both or
    // neither. rc.on = false must never decide this one.
    on: null,
    list: null,     // requests addressed to the kitchen
    tab: 'active',  // active | history
    order: null,    // the open one, with lines
    busy: false, err: '',
  };

  function kqEnter() {
    state.view = 'kitchenq'; kq.order = null; kq.err = '';
    kqRender(); kqLoad();
  }
  function kqExit() { kq.order = null; kq.err = ''; homeBack(); }

  function kqLoad() {
    if (kq.on === false) return Promise.resolve();
    return rcFetch('/api/restock?to_role=kitchen&tab=' + kq.tab).then(function (j) {
      kq.on = true;
      kq.list = Array.isArray(j.data) ? j.data : [];
      probeAnswered();
      if (state.view === 'home') homeRender();
      else if (state.view === 'kitchenq') kqRender();
    }).catch(function (e) {
      if (e.message === 'norealm') { kq.on = false; kq.list = []; probeAnswered(); return; }
      kq.err = e.message; if (state.view === 'kitchenq') kqRender();
    });
  }

  function kqOpen(id) {
    kq.busy = true; kq.err = ''; kqRender();
    rcFetch('/api/restock/' + id).then(function (j) {
      kq.order = j.data; kq.busy = false; kqRender();
    }).catch(function (e) {
      kq.busy = false; kq.err = e.message === 'norealm' ? '' : e.message; kqRender();
    });
  }

  // received → we have seen it. prepared → it is made, and that closes it.
  function kqAdvance(to) {
    if (kq.busy || !kq.order) return;
    kq.busy = true; kq.err = ''; kqRender();
    rcFetch('/api/restock/' + kq.order.id + '/status', { method: 'PUT', body: { status: to } })
      .then(function () {
        kq.busy = false; kq.order.status = to;
        if (to === 'prepared') { kq.order = null; kqLoad(); }
        kqRender();
      })
      .catch(function (e) {
        kq.busy = false;
        kq.err = e.message === 'norealm'
          ? t('This account cannot work the kitchen queue.', '此账号无法处理厨房队列。')
          : (e.message || t('That did not go through. Nothing has changed — try again.', '没有成功。数据没有变化 — 请重试。'));
        kqRender();
      });
  }

  function kqPurpose(o) {
    return o.purpose === 'order' ? t('For an order', '用于发货')
         : o.purpose === 'shelf' ? t('For the shelf', '货架补货') : '';
  }
  function kqItemName(it) {
    var n = lang === 'cn' ? (it.product_cn || it.product_name) : (it.product_name || it.product_cn);
    return n || ('#' + it.id);
  }

  function kqListHtml() {
    var rows = kq.list || [];
    var seg = function (k, label) {
      return '<button class="pk-chip' + (kq.tab === k ? ' on' : '') + '" data-kqtab="' + k + '">' + label + '</button>';
    };
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-kqback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Kitchen queue', '厨房制作队列') + '</div>' +
        '<div class="rc-sub">' + t('What has been asked for', '待制作的申请') + '</div>' +
      '</div>' +
      (kq.err ? '<div class="rc-err">' + esc(kq.err) + '</div>' : '') +
      '<div class="pk-chips">' + seg('active', t('To make', '待制作')) + seg('history', t('Done', '已完成')) + '</div>' +
      '<div class="rc-body">' + (
        kq.list === null
          ? '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' + t('Loading…', '加载中…') + '</div></div>'
        : !rows.length
          ? '<div class="rc-empty"><div style="font-size:20px;font-weight:600;letter-spacing:-.02em">' +
            (kq.tab === 'active' ? t('Nothing to make', '暂无待制作') : t('Nothing yet', '暂无记录')) + '</div>' +
            '<div style="font-size:15px;color:var(--text2);margin-top:6px">' +
            (kq.tab === 'active' ? t('Nobody has asked for anything.', '目前没有制作申请。') : '') + '</div></div>'
        : rows.map(function (o) {
            var p = kqPurpose(o);
            return '<div class="rc-hr"></div>' +
              '<button class="rc-row" data-kqopen="' + o.id + '">' +
              '<span class="rc-qty num">' + (o.item_count || 0) + '</span>' +
              '<span class="rc-mid"><span class="rc-nm">' + esc(o.rs_number || ('#' + o.id)) + '</span>' +
              '<span class="rc-cap">' + t((o.item_count || 0) + ' items', (o.item_count || 0) + ' 项') +
              (p ? ' · ' + esc(p) : '') + ' · ' + esc(o.status) + '</span></span>' +
              '<span class="sh-chev">' + RC_CHEV_R + '</span></button>';
          }).join('') + '<div class="rc-hr"></div>'
      ) + '</div></div>';
  }

  function kqDetailHtml() {
    var o = kq.order;
    var items = (o.items || []).filter(function (it) { return rcNum(it.qty_requested) > 0; });
    var p = kqPurpose(o);
    var next = o.status === 'sent' ? 'received' : o.status === 'received' ? 'prepared' : null;
    var label = next === 'received' ? t('Start making', '开始制作')
              : next === 'prepared' ? t('Mark as made', '标记已完成') : '';
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-kqlist>' + RC_CHEV + t('Kitchen queue', '厨房制作队列') + '</button>' +
        '<div class="rc-h1">' + esc(o.rs_number || ('#' + o.id)) + '</div>' +
        '<div class="rc-sub">' + t(items.length + ' items', items.length + ' 项') + (p ? ' · ' + esc(p) : '') + '</div>' +
      '</div>' +
      (kq.err ? '<div class="rc-err">' + esc(kq.err) + '</div>' : '') +
      '<div class="rc-body">' + items.map(function (it) {
        return '<div class="rc-hr"></div><div class="rc-row">' +
          '<span class="rc-qty num">' + rcNum(it.qty_requested) + '</span>' +
          '<span class="rc-mid"><span class="rc-nm">' + esc(kqItemName(it)) + '</span>' +
          '<span class="rc-cap">' + esc(it.sku || '') + '</span></span></div>';
      }).join('') + '<div class="rc-hr"></div></div>' +
      // Said out loud, because a tick that closes a request looks like a tick
      // that fills a shelf, and it is not one.
      '<div style="padding:12px 16px 0"><div class="rc-flat rc-note">' +
        t('Marking this made closes the request. Stock changes when the batch is logged, not here.',
          '标记完成即关闭该申请。库存在登记生产批次时才会变动。') + '</div></div>' +
      '<div class="rc-foot" style="background:transparent;border:none">' +
        '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
        (next
          ? '<button class="rc-big"' + (kq.busy ? ' disabled' : ' data-kqnext="' + next + '"') + '>' +
              (kq.busy ? t('Saving…', '保存中…') : label) + '</button>'
          : '<button class="rc-big" data-kqlist>' + t('Done', '完成') + '</button>') +
        '</div></div></div>';
  }

  function kqRender() {
    if (state.view !== 'kitchenq') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = kq.order ? kqDetailHtml() : kqListHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-kqback]', function (b) { b.onclick = kqExit; });
    each('[data-kqlist]', function (b) { b.onclick = function () { kq.order = null; kqRender(); }; });
    each('[data-kqtab]', function (b) {
      b.onclick = function () { kq.tab = b.getAttribute('data-kqtab'); kq.list = null; kqRender(); kqLoad(); };
    });
    each('[data-kqopen]', function (b) {
      b.onclick = function () { kqOpen(parseInt(b.getAttribute('data-kqopen'), 10)); };
    });
    each('[data-kqnext]', function (b) {
      b.onclick = function () { kqAdvance(b.getAttribute('data-kqnext')); };
    });
  }

  /* ══ ASK FOR STOCK ═════════════════════════════════════════════════════════
     One location asking another to send it something. ONE SCREEN FOR BOTH
     DIRECTIONS, because since #259 the direction is just which two ids go in
     which field: at Yuexiu you pick Tianhe and it is Yuexiu asking Tianhe; at
     Tianhe you pick Yuexiu and it is the request the old model could not even
     express. Nothing about the screen knows which is which, and that is the
     point — a "warehouse" is a row, not a special case.

     IT ALSO REPLACES A DOOR THAT WAS QUIETLY SHUT. app.html's in-SPA Restock
     screen was the only thing that could raise a store request, and it is
     kitchen-realm, so #261's move to Tacet closed it: POST /api/restock became
     tacetOnly and that button has 403'd ever since. Nothing could raise a
     store-to-store request at all. This is that door, in the app the work now
     lives in.

     WHO RECEIVES IS THE SHELF ON SCREEN, not a choice. You are asking for stock
     for the store you are standing in and looking at; making it a second picker
     would invite ordering someone else's stock into someone else's building. */

  var as = {
    from: null,      // the location being asked to supply
    qty: {},
    q: '',
    busy: false, err: '', sent: null,
  };

  function asEnter() {
    state.view = 'askstock';
    as.from = null; as.qty = {}; as.q = ''; as.err = ''; as.sent = null; as.busy = false;
    asRender();
    akLoad().then(asRender);        // the catalogue both request screens use
  }
  function asExit() { as.sent = null; homeBack(); }

  function asSuppliers() {
    return (state.stores || []).filter(function (s) { return s.id !== state.storeId; });
  }
  function asHere() {
    var s = (state.stores || []).filter(function (x) { return x.id === state.storeId; })[0];
    return s ? storeLabel(s) : '';
  }
  function asChosen() {
    return (ak.products || []).filter(function (p) { return (as.qty[p.id] || 0) > 0; });
  }
  function asBump(id, d) {
    var n = (as.qty[id] || 0) + d;
    as.qty[id] = n > 0 ? n : 0;
    asRender();
  }
  function asLines() {
    var all = ak.products || [];
    var q = as.q.trim().toLowerCase();
    if (!q) return all;
    return all.filter(function (p) {
      return (p.name_en || '').toLowerCase().indexOf(q) >= 0
          || (p.name_cn || '').indexOf(as.q.trim()) >= 0
          || (p.sku || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  function asSend() {
    if (as.busy) return;
    var chosen = asChosen();
    if (!as.from || !chosen.length) return;
    as.busy = true; as.err = ''; asRender();
    rcFetch('/api/restock', { method: 'POST', body: {
      // BOTH ENDS NAMED OUTRIGHT. The server still derives from_role/to_role for
      // its notification routing, but the locations are the order's own — which
      // is what makes a request TO a shop as ordinary as one to the warehouse.
      from_store_id: as.from,
      to_store_id: state.storeId,
      status: 'sent',
      items: chosen.map(function (p) {
        return {
          // No product_id, for the reason the kitchen screen gives: the store
          // and kitchen catalogues are separate counters over one integer space
          // and this field is read as a kitchen id. The name is what a picker
          // reads off the row.
          product_id: null,
          product_name: p.name_en || p.name_cn || ('#' + p.id),
          product_cn: p.name_cn || null,
          sku: p.sku || null,
          qty_requested: as.qty[p.id],
          unit: 'pcs',
        };
      }),
    } }).then(function (j) {
      as.busy = false;
      var supplier = (state.stores || []).filter(function (s) { return s.id === as.from; })[0];
      as.sent = { rs: j.rs_number || ('#' + j.id), lines: chosen.length,
                  units: chosen.reduce(function (a, p) { return a + as.qty[p.id]; }, 0),
                  who: supplier ? storeLabel(supplier) : '' };
      asRender();
    }).catch(function (e) {
      as.busy = false;
      as.err = e.message === 'norealm'
        ? t('This account cannot ask for stock.', '此账号无法发起补货申请。')
        : (e.message || t('That did not send. Nothing has changed — try again.', '未发送,数据未变 — 请重试。'));
      asRender();
    });
  }

  function asHtml() {
    if (as.sent) {
      return '<div class="rc-wrap">' +
        rcHeadHtml(t('Sent to ' + as.sent.who, '已发送至 ' + as.sent.who),
                   as.sent.rs + ' · ' + clock(new Date()), false) +
        '<div style="padding:0 16px"><div class="rc-card">' +
          '<div style="font-size:15px;font-weight:600;line-height:1.35">' +
            t(as.sent.lines + ' item' + (as.sent.lines > 1 ? 's' : '') + ' · ' + as.sent.units + ' units',
              '共 ' + as.sent.lines + ' 项 · ' + as.sent.units + ' 件') + '</div>' +
          '<div class="rc-sub" style="margin-top:6px">' +
            t('It is on their pick list now. Stock moves when they dispatch it.',
              '已进入对方拣货单。对方发货时库存才会变动。') + '</div></div></div>' +
        '<div class="rc-body"></div>' +
        '<div class="rc-foot" style="background:transparent;border:none">' +
          '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
          '<button class="rc-big" data-asback>' + t('Done', '完成') + '</button></div></div></div>';
    }
    var chosen = asChosen();
    var units = chosen.reduce(function (a, p) { return a + as.qty[p.id]; }, 0);
    var suppliers = asSuppliers();
    var ready = !!as.from && chosen.length > 0;
    var rows = ak.products === null
      ? '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' + t('Loading…', '加载中…') + '</div></div>'
      : asLines().map(function (p) {
          var n = as.qty[p.id] || 0;
          return '<div class="rc-hr"></div><div class="rc-row">' +
            '<span class="rc-mid"><span class="rc-nm">' + esc(akName(p)) + '</span>' +
            '<span class="rc-cap">' + esc(p.sku || ('#' + p.id)) + '</span></span>' +
            '<span class="ak-step">' +
              '<button data-asdec="' + p.id + '"' + (n <= 0 ? ' disabled' : '') + '>' + AK_MINUS + '</button>' +
              '<span class="n num">' + n + '</span>' +
              '<button data-asinc="' + p.id + '">' + AK_PLUS + '</button>' +
            '</span></div>';
        }).join('') + '<div class="rc-hr"></div>';
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-asback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Ask for stock', '申请补货') + '</div>' +
        '<div class="rc-sub">' + t('For ' + asHere(), '收货门店:' + asHere()) + '</div>' +
      '</div>' +
      (as.err ? '<div class="rc-err">' + esc(as.err) + '</div>' : '') +
      // Asked first, and with no default. Which location supplies decides whose
      // shelf empties, and picking one for him is picking whose stock to take.
      '<div class="rc-lbl">' + t('Who should send it?', '由哪个地点发货?') + '</div>' +
      (suppliers.length
        ? '<div class="ak-purpose">' + suppliers.map(function (s) {
            return '<button class="ak-opt' + (as.from === s.id ? ' on' : '') + '" data-asfrom="' + s.id + '">' +
              '<b>' + esc(storeLabel(s)) + '</b></button>';
          }).join('') + '</div>'
        : '<div class="rc-flat rc-note" style="margin:0 16px 12px">' +
            t('There is nowhere else to ask — this is the only location.', '没有其他地点可申请 — 当前仅此一个门店。') +
          '</div>') +
      '<div class="ak-search"><input id="asQ" inputmode="search" enterkeyhint="search" ' +
        'placeholder="' + t('Search products', '搜索商品') + '" value="' + esc(as.q) + '"></div>' +
      '<div class="rc-body">' + rows + '</div>' +
      '<div class="rc-foot"><div class="rc-footrow">' +
        '<div class="rc-tally"><b>' + chosen.length + ' <span>' + t('items', '项') + '</span></b>' +
        '<i>' + t(units + ' units', units + ' 件') + '</i></div>' +
        '<button class="rc-cta' + (ready && !as.busy ? ' on' : '') + '"' +
          (ready && !as.busy ? ' data-assend' : ' disabled') + '>' +
          (as.busy ? t('Sending…', '发送中…') : t('Send', '发送')) + '</button>' +
      '</div></div></div>';
  }

  function asRender() {
    if (state.view !== 'askstock') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    $('#main').className = '';
    $('#main').innerHTML = asHtml();
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-asback]', function (b) { b.onclick = asExit; });
    each('[data-asfrom]', function (b) {
      b.onclick = function () { as.from = parseInt(b.getAttribute('data-asfrom'), 10); asRender(); };
    });
    each('[data-asinc]', function (b) { b.onclick = function () { asBump(parseInt(b.getAttribute('data-asinc'), 10), 1); }; });
    each('[data-asdec]', function (b) { b.onclick = function () { asBump(parseInt(b.getAttribute('data-asdec'), 10), -1); }; });
    each('[data-assend]', function (b) { b.onclick = asSend; });
    var q = $('#asQ');
    if (q) q.oninput = function () { as.q = q.value; asRender(); var f = $('#asQ'); if (f) f.focus(); };
  }

  boot();
})();
</script>
</body>
</html>
