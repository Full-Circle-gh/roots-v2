  /* ══ RECEIVING — the store's half of a two-step transfer ═══════════════════
     Decisions §39. Stock leaves the warehouse at dispatch, sits IN TRANSIT
     belonging to neither location, and arrives here on receipt. The rules this
     screen exists to keep:

       • WHAT THE SHOP COUNTS IS WHAT THE SHOP HOLDS. Her count sets stock. The
         dispatched figure is never preferred to it and survives only as the
         caption on the row.
       • NOTHING IS PRE-FILLED. The keypad opens EMPTY, never seeded with what
         the warehouse said it sent — a figure already in the box is a figure
         nobody counted. "All N arrived" is one deliberate tap that says the
         same thing, and says it because she chose it.
       • SHORT AND OVER ARE RECORDED, NEVER BLOCKED. No reason field, no
         confirmation step, no accusation, and no difference in how the two are
         treated. A gap is a gap whichever way it runs.
       • TWO YARDSTICKS, NAMED. A line can differ from what the van carried or
         from what the store asked for. Confirm compares against the van (all it
         can do before she confirms); Received compares against the order, which
         brings in the lines the warehouse cut before loading. Each heading says
         which, so a number that appears to change is two questions with two
         answers.

     EVERY WRITE GOES THROUGH routes/restock.js AS IT ALREADY STANDS —
     GET /api/restock, GET /api/restock/:id, PUT /api/restock/:id/receive. There
     is no second settlement path here: _applyReceipt on the server moves the
     stock, writes both ledger halves and stamps goods_state. This screen only
     ever sends counts and renders what comes back.  */

  var rc = {
    /* null = not probed yet, false = this session cannot do TRANSFER work.
       It is not "cannot reach /api/restock" any more, and the difference is the
       whole of #264: a kitchen operator is refused the transfer lists and
       ANSWERED on the kitchen queue, so one flag for both jobs read their
       refusal as a refusal of everything and took the launcher away with it. */
    on: null,
    list: null,      // inbound transfers for the selected store
    order: null,     // the open one, with items
    step: 'list',    // list | transit | count | confirm | done
    held: null,      // {item_id, qty} — see rcSaveCount
    entry: null,     // keypad digits as typed, '' until she presses one
    itemId: null,
    busy: false,
    err: '',
  };

  /* /api/restock is gated by requireAuth — the kitchen `users` realm. /stock is
     served to BOTH realms, and a Mini App Backend operator's session carries
     backendUserId instead, so these endpoints answer 401 for them. That is not
     an error and must not reach api(), whose 401 branch bounces to /stock-login
     and would throw a backend operator out of Quick Stock for opening a screen
     they simply do not have. A refusal here disables receiving and says nothing. */
  function rcFetch(path, opts) {
    opts = opts || {};
    var o = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
    return fetch(path, o).then(function (r) {
      // A REFUSAL IS REPORTED, NOT ATTRIBUTED. Which job was refused is known
      // to the caller and not to this function, and it used to switch off the
      // whole feature from here — so the kitchen's 403 on a transfer list took
      // the kitchen's own queue down with it. Each loader now records its own.
      if (r.status === 401 || r.status === 403) throw new Error('norealm');
      return r.json().then(function (j) {
        if (!j.success) { var e = new Error(j.error || 'error'); e.body = j; throw e; }
        return j;
      });
    });
  }

  function rcNum(v) { var n = Number(v); return Number.isFinite(n) ? n : 0; }
  /* SQLite writes CURRENT_TIMESTAMP as a ZONELESS 'YYYY-MM-DD HH:MM:SS' in UTC,
     and every engine reads a zoneless string as LOCAL — which in Guangzhou puts
     a dispatch eight hours before it happened. Pin the zone explicitly. */
  function rcStamp(v) {
    if (!v) return null;
    var d = new Date(String(v).replace(' ', 'T') + (/[Zz+]|\d-\d\d:\d\d$/.test(String(v)) ? '' : 'Z'));
    return isNaN(d.getTime()) ? null : d;
  }
  function rcSent(it) { return rcNum(it.qty_sent != null ? it.qty_sent : it.qty_requested); }
  function rcGot(it) { return it.qty_received == null ? null : rcNum(it.qty_received); }
  function rcName(it) {
    var n = lang === 'cn' ? (it.product_cn || it.product_name) : (it.product_name || it.product_cn);
    return n || ('#' + it.id);
  }
  /* A count held back locally still counts as counted on screen — the operator
     typed it, so the row and the tally must show it. Only the server has not
     been told yet, and rcConfirm is what tells it. */
  function rcHeldFor(it) { return rc.held && rc.held.item_id === it.id ? rc.held.qty : null; }
  function rcCount(it) { var h = rcHeldFor(it); return h != null ? h : rcGot(it); }
  function rcItems() {
    var xs = rc.order && rc.order.items;
    return (Array.isArray(xs) ? xs : []).filter(function (it) { return rcSent(it) > 0; });
  }
  function rcCounted() { return rcItems().filter(function (it) { return rcCount(it) != null; }); }
  function rcArrived(o) { return !!o.delivered_at; }

  /* WHAT IS COMING TO THE SHELF SHE IS LOOKING AT, read off the order.
     Since #259 an order records `to_store_id`, so this is an id comparison
     rather than a guess. It used to match the store's NAME against the free
     text stamped on the order and let an order naming nobody belong to
     everybody — which was the best available answer while the destination was
     inferred at dispatch, and is a worse one now that the row carries it.
     The name match survives ONLY for rows written before that column existed. */
  function rcForStore(o) {
    if (o.to_store_id) return o.to_store_id === state.storeId;
    var s = state.stores.filter(function (x) { return x.id === state.storeId; })[0];
    if (!s) return false;
    if (!o.store_name && !o.store_cn) return true;
    var want = [s.name_en, s.name_cn, s.code].filter(Boolean).map(function (v) { return String(v).trim().toLowerCase(); });
    var got = [o.store_name, o.store_cn].filter(Boolean).map(function (v) { return String(v).trim().toLowerCase(); });
    return got.some(function (g) { return want.indexOf(g) >= 0; });
  }


  /* THE PROBE AND THE LIST, and they are not the same question.
     This used to ask for `to_role=store`, which reads like "deliveries to a
     shop" and is not: `to_role` records who was ASKED, and a shop asking the
     warehouse writes 'warehouse'. Nothing has ever written 'store' — no client
     posts it and no route sets it — so the filter matched no row ever created
     and the Receive list was permanently empty, whatever was actually on a van.
     What is coming here is `to_store_id`, and rcForStore is what reads it.
     The param is dropped, not corrected: an absent `to_role` still fails the
     kitchen session's `!== 'kitchen'` test, so the 403 that keeps the launcher
     off the kitchen host answers exactly as it did. */
  function rcLoad() {
    if (rc.on === false) return Promise.resolve();
    return rcFetch('/api/restock?tab=active').then(function (j) {
      rc.on = true;
      rc.list = (Array.isArray(j.data) ? j.data : []).filter(function (o) {
        return (o.to_role || 'warehouse') !== 'kitchen'
          && o.goods_state === 'in_transit' && rcForStore(o);
      });
      probeAnswered();
      if (state.view === 'home') homeRender();
      else if (state.view === 'list') render();
      else rcRender();
    }).catch(function (e) {
      if (e.message === 'norealm') { rc.on = false; rc.list = []; probeAnswered(); return; }
      rc.err = e.message; if (state.view === 'receiving') rcRender();
    });
  }

  /* The Receive tile's destination. One inbound delivery is the Roots case and
     opens straight into the count — a chooser with one row in it is a tap that
     asks a question with one answer. Several offer the choice; none says so. */
  function rcEnter() {
    var list = rc.list || [];
    if (list.length === 1) return rcOpen(list[0].id);
    state.view = 'receiving'; rc.order = null; rc.step = 'list'; rc.err = ''; rc.held = null;
    rcRender();
  }

  function rcOpen(id) {
    rc.busy = true; rc.err = ''; rc.held = null;
    state.view = 'receiving'; rcRender();
    rcFetch('/api/restock/' + id).then(function (j) {
      rc.order = j.data; rc.busy = false;
      rc.step = rcArrived(rc.order) ? 'count' : 'transit';
      rcRender();
    }).catch(function (e) {
      rc.busy = false;
      rc.err = e.message === 'norealm' ? '' : e.message;
      rcRender();
    });
  }

  function rcExit() {
    rc.order = null; rc.step = 'list'; rc.held = null; rc.err = '';
    rcLoad();
    homeBack();
  }

  /* ── Saving a count ───────────────────────────────────────────────────────
     Counts are written line by line, so a count survives the phone going in a
     pocket — the resumable count the Resume screen is built on.

     EXCEPT THE ONE THAT COMPLETES THE SET, WHICH IS HELD IN MEMORY. The server
     settles inside PUT /:id/receive the moment every line carries a figure, and
     it is right to: a complete count is a complete count. But the flow has a
     Confirm step — "these units join this store's stock when you confirm" — and
     a save that settled on the fourteenth line would move the stock before she
     ever saw it, leaving Confirm reviewing something already done.

     So the last outstanding line is held back and sent by Confirm. The cost is
     stated rather than hidden: if the phone dies between counting that final
     line and confirming, that ONE count is lost and gets retyped. Every other
     line is already on the server. Recounting an earlier line from Confirm is an
     ordinary save — the set is still incomplete server-side, so it cannot settle
     early.  */
  function rcSaveCount(itemId, qty) {
    var items = rcItems();
    var outstanding = items.filter(function (it) {
      return it.id !== itemId && rcCount(it) == null;
    }).length;
    var completes = outstanding === 0;
    if (completes) {
      rc.held = { item_id: itemId, qty: qty };
      rc.step = 'confirm';
      rcRender();
      return Promise.resolve();
    }
    // A held line that is no longer the last one goes to the server with this
    // save, so nothing is held except while the set is genuinely complete.
    var counts = [{ item_id: itemId, qty_received: qty }];
    if (rc.held && rc.held.item_id !== itemId) {
      counts.push({ item_id: rc.held.item_id, qty_received: rc.held.qty });
    }
    rc.busy = true; rc.err = ''; rcRender();
    return rcFetch('/api/restock/' + rc.order.id + '/receive', { method: 'PUT', body: { counts: counts } })
      .then(function () {
        counts.forEach(function (c) {
          var it = (rc.order.items || []).filter(function (x) { return x.id === c.item_id; })[0];
          if (it) it.qty_received = c.qty_received;
        });
        rc.held = null; rc.busy = false; rcRender();
      })
      .catch(function (e) {
        rc.busy = false;
        // The number she typed is never thrown away by a failed write. Losing a
        // delivery's counts at the door is the one failure nobody forgives.
        rc.held = { item_id: itemId, qty: qty };
        rc.err = e.message === 'norealm'
          ? t('This account cannot receive transfers.', '此账号无法确认调拨收货。')
          : t('That count did not save. It is still on screen — try again.', '数量未保存,仍显示在屏幕上 — 请重试。');
        rcRender();
      });
  }

  function rcConfirm() {
    if (rc.busy) return;
    var counts = rcItems().map(function (it) {
      return { item_id: it.id, qty_received: rcCount(it) };
    }).filter(function (c) { return c.qty_received != null; });
    rc.busy = true; rc.err = ''; rcRender();
    rcFetch('/api/restock/' + rc.order.id + '/receive', { method: 'PUT', body: { counts: counts } })
      .then(function (j) {
        rc.busy = false;
        if (!j.settled) {
          rc.err = t('Some lines are still uncounted.', '仍有未点数的项目。');
          rc.step = 'count'; rcRender(); return;
        }
        counts.forEach(function (c) {
          var it = (rc.order.items || []).filter(function (x) { return x.id === c.item_id; })[0];
          if (it) it.qty_received = c.qty_received;
        });
        rc.held = null; rc.step = 'done'; rcRender();
        // The shelf this app counts has just changed underneath it.
        if (state.storeId != null) loadStock(true);
        rcLoad();
      })
      .catch(function (e) {
        rc.busy = false;
        rc.err = e.message === 'norealm'
          ? t('This account cannot receive transfers.', '此账号无法确认调拨收货。')
          : (e.body && e.body.error) || t('That did not go through. Nothing has changed — try again.', '没有成功。数据没有变化 — 请重试。');
        rcRender();
      });
  }

  /* ── The keypad ───────────────────────────────────────────────────────────
     Opens EMPTY. rc.entry is '' until she presses a digit, and an empty entry
     cannot be saved — there is no figure to save, and the sent quantity is not
     one she gave. */
  function rcOpenPad(itemId) {
    var it = rcItems().filter(function (x) { return x.id === itemId; })[0];
    if (!it) return;
    rc.itemId = itemId; rc.entry = '';
    var sent = rcSent(it);
    $('#rcName').textContent = rcName(it);
    $('#rcSub').textContent = (it.sku ? it.sku + ' · ' : '') + t(sent + ' sent', '发出 ' + sent);
    $('#rcLabel').textContent = t('How many arrived?', '到货多少?');
    $('#rcAll').textContent = t('All ' + sent + ' arrived', '全部 ' + sent + ' 件到货');
    $('#rcClear').textContent = t('Clear', '清除');
    rcPaintPad();
    state.sheet = 'receive';
    $('#rcBack').classList.add('show'); $('#rcSheet').classList.add('show');
  }
  function rcClosePad() {
    state.sheet = null;
    $('#rcBack').classList.remove('show'); $('#rcSheet').classList.remove('show');
  }
  function rcPaintPad() {
    var it = rcItems().filter(function (x) { return x.id === rc.itemId; })[0];
    if (!it) return;
    var sent = rcSent(it);
    var has = rc.entry !== '';
    var n = has ? parseInt(rc.entry, 10) : null;
    $('#rcVal').textContent = has ? String(n) : '—';
    $('#rcVal').style.color = has ? '' : 'var(--text2)';
    var d = has ? n - sent : 0;
    $('#rcGap').textContent = !has || d === 0 ? ''
      : (d < 0 ? t((-d) + ' short', '短少 ' + (-d)) : t(d + ' over', '多收 ' + d));
    $('#rcNote').textContent = has
      ? t('Recorded as it is. Nothing else needed.', '如实记录,无需其他说明。')
      : t('Count what is in the box.', '请点数箱内实际数量。');
    var save = $('#rcSave');
    save.disabled = !has;
    save.style.opacity = has ? '' : '.5';
    save.textContent = has ? t('Save ' + n + ' and continue', '保存 ' + n + ' 并继续')
                           : t('Save and continue', '保存并继续');
  }
  function rcPad(k) {
    if (k === 'clear') rc.entry = '';
    else if (k === 'back') rc.entry = rc.entry.slice(0, -1);
    else if (rc.entry.length < 6) rc.entry = (rc.entry === '0' ? '' : rc.entry) + k;
    rcPaintPad();
  }
  function rcAll() {
    var it = rcItems().filter(function (x) { return x.id === rc.itemId; })[0];
    if (!it) return;
    rc.entry = String(rcSent(it));
    rcPaintPad();
  }
  function rcPadSave() {
    if (rc.entry === '') return;
    var id = rc.itemId, q = parseInt(rc.entry, 10);
    rcClosePad();
    rcSaveCount(id, q);
  }

  /* ── Rendering ────────────────────────────────────────────────────────────
     One line, four states (design-handoff/store-receiving/RowStates.dc.html).
     When sent and found agree the row goes quiet and both controls leave with
     the work; when they differ, the count and the gap are the only things left
     holding Ink. */
  var RC_TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var RC_CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
  var RC_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';

  function rcGapText(got, sent) {
    var d = got - sent;
    if (d === 0) return t('as sent', '与发货一致');
    var g = d < 0 ? t((-d) + ' short', '短少 ' + (-d)) : t(d + ' over', '多收 ' + d);
    return '<span class="rc-gap">' + g + '</span> · ' + t(sent + ' sent', '发出 ' + sent);
  }

  function rcRowHtml(it, isNext) {
    var sent = rcSent(it), got = rcCount(it);
    if (got == null) {
      // The number is what the warehouse SENT — a fact for reference, not a
      // count. One tap on the tick says it all arrived; Count opens the keypad.
      return '<button class="rc-row' + (isNext ? ' next' : '') + '" data-count="' + it.id + '">' +
        '<span class="rc-qty num">' + sent + '</span>' +
        '<span class="rc-mid"><span class="rc-nm">' + esc(rcName(it)) + '</span>' +
        '<span class="rc-cap">' + esc(it.sku || ('#' + it.id)) + '</span></span>' +
        '<span class="rc-count">' + t('Count', '点数') + '</span>' +
        '<span class="rc-tick todo" data-assent="' + it.id + '">' + RC_TICK + '</span>' +
        '</button>';
    }
    var same = got === sent;
    return '<button class="rc-row done" data-count="' + it.id + '">' +
      '<span class="rc-qty num' + (same ? ' rc-muted' : '') + '">' + got + '</span>' +
      '<span class="rc-mid"><span class="rc-nm rc-muted">' + esc(rcName(it)) + '</span>' +
      '<span class="rc-cap">' + rcGapText(got, sent) + '</span></span>' +
      '<span class="rc-tick">' + RC_TICK + '</span>' +
      '</button>';
  }

  function rcHeadHtml(title, sub, back) {
    return '<div class="rc-head">' +
      (back ? '<button class="rc-back" data-rcback>' + RC_CHEV + t('Receiving', '收货') + '</button>' : '') +
      '<div class="rc-h1">' + esc(title) + '</div>' +
      (sub ? '<div class="rc-sub">' + esc(sub) + '</div>' : '') + '</div>';
  }

  function rcErrHtml() { return rc.err ? '<div class="rc-err">' + esc(rc.err) + '</div>' : ''; }

  function rcTransitHtml() {
    var o = rc.order, items = rcItems();
    var units = items.reduce(function (a, it) { return a + rcSent(it); }, 0);
    var left = o.dispatched_at ? clock(rcStamp(o.dispatched_at)) : '';
    return '<div class="rc-wrap">' +
      rcHeadHtml(t('On the way', '在途'), (o.rs_number || ('#' + o.id)) + ' · ' + t('from the warehouse', '来自仓库'), true) +
      rcErrHtml() +
      '<div class="rc-transit">' +
        '<div style="display:flex;align-items:center;gap:8px"><span class="rc-dot"></span>' +
        '<span style="font-size:13px;color:var(--dusk-ink);font-weight:500">' + t('In transit', '在途中') + '</span></div>' +
        '<div style="display:flex;align-items:baseline;gap:10px;margin-top:8px">' +
          '<span class="num" style="font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em">' + units + '</span>' +
          '<span style="font-size:15px;color:var(--text2)">' +
            t('units · ' + items.length + ' lines', '件 · 共 ' + items.length + ' 项') + '</span>' +
        '</div>' +
        (left ? '<div class="rc-sub" style="margin-top:8px">' + t('Left the warehouse ' + left, '离开仓库 ' + left) + '</div>' : '') +
      '</div>' +
      '<div class="rc-lbl">' + t('What is coming', '在途商品') + '</div>' +
      '<div class="rc-body">' + items.map(function (it) {
        return '<div class="rc-hr"></div><div class="rc-row"><span class="rc-qty num">' + rcSent(it) + '</span>' +
          '<span class="rc-mid"><span class="rc-nm">' + esc(rcName(it)) + '</span></span></div>';
      }).join('') + '<div class="rc-hr"></div></div>' +
      // THIS SCREEN DESCRIBES A STATE; IT DOES NOT LOCK ONE.
      //
      // It first read `delivered_at` as a gate — no way through until the
      // driver's leg was stamped — which is how the artboard reads on its own:
      // "counting opens when the van arrives", and no control. But the only
      // thing that stamps `delivered_at` is app.html, no artboard in either
      // canvas draws a step that does, and the server never asked for it:
      // _applyReceipt gates on `goods_state === 'in_transit'` and nothing else.
      // So the gate was stricter than the rule it was enforcing, and its failure
      // mode was a shop standing over a box it could see, unable to count it
      // until someone opened a desktop.
      //
      // The screen stays, because opening a delivery before it lands is a real
      // thing to do and the in-transit card is the one state only Tacet holds.
      // What goes is the dead end. The note still says where the van is — that
      // is true and worth knowing — and the control below it works, because a
      // box in the room outranks a timestamp nobody stamped.
      //
      // Still no warning about what is short. A count of the gaps to expect,
      // delivered before the count, is the anchor this whole flow avoids.
      '<div class="rc-foot"><div class="rc-footrow">' +
        '<div class="rc-note rc-tally">' +
          t('The van is still on the road.', '货车仍在途中。') + ' ' +
          t('If the box is here, count it.', '若货已到店,可直接点数。') +
        '</div>' +
        '<button class="rc-cta on" data-rccount>' + t('Start counting', '开始点数') + '</button>' +
      '</div></div></div>';
  }

  function rcCountHtml() {
    var o = rc.order, items = rcItems(), done = rcCounted();
    var next = items.filter(function (it) { return rcCount(it) == null; })[0];
    var pct = items.length ? Math.round(done.length / items.length * 100) : 0;
    var all = done.length === items.length && items.length > 0;
    // Back after a break. The progress is hers and nothing was done for her
    // while she was away, so this is Cream and not Dusk.
    var resume = (done.length && !all)
      ? '<div class="rc-flat" style="margin:0 16px 10px">' +
          '<div style="font-size:15px;font-weight:600;line-height:1.35">' + t('Picking up where you left off', '继续上次的点数') + '</div>' +
          '<div class="rc-sub">' + t(done.length + ' of ' + items.length + ' lines counted · nothing was lost',
                                     '已点 ' + done.length + '/' + items.length + ' 项 · 数据未丢失') + '</div></div>'
      : '';
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-rcback>' + RC_CHEV + t('Back', '返回') + '</button>' +
        '<div class="rc-h1">' + t('Receiving', '收货') + '</div>' +
        '<div class="rc-meta"><span class="l">' + t('From the warehouse · ' + items.length + ' lines',
                                                    '来自仓库 · 共 ' + items.length + ' 项') + '</span>' +
        '<span class="r">' + esc(o.rs_number || ('#' + o.id)) + '</span></div>' +
      '</div>' +
      rcErrHtml() + resume +
      '<div class="rc-body">' + items.map(function (it) {
        return '<div class="rc-hr"></div>' + rcRowHtml(it, next && it.id === next.id && done.length > 0);
      }).join('') + '<div class="rc-hr"></div></div>' +
      // The count IS the explanation for the inactive button. There is no
      // "accept everything": if the counting can be skipped it will be, and
      // every uncounted short becomes phantom stock on her shelf.
      '<div class="rc-foot"><div class="rc-prog"><i style="width:' + pct + '%"></i></div>' +
        '<div class="rc-footrow"><div class="rc-tally">' +
          '<b>' + done.length + ' <span>' + t('of', '/') + '</span> ' + items.length + '</b>' +
          '<i>' + t('lines counted', '项已点') + '</i></div>' +
        '<button class="rc-cta' + (all ? ' on' : '') + '"' + (all ? ' data-rcreview' : ' disabled') + '>' +
          t('Confirm receipt', '确认收货') + '</button></div></div></div>';
  }

  function rcConfirmHtml() {
    var o = rc.order, items = rcItems();
    var counted = items.reduce(function (a, it) { return a + (rcCount(it) || 0); }, 0);
    var sent = items.reduce(function (a, it) { return a + rcSent(it); }, 0);
    // Against the VAN — all this screen can compare before she confirms.
    var diff = items.filter(function (it) { return rcCount(it) !== rcSent(it); });
    return '<div class="rc-wrap">' +
      '<div class="rc-head">' +
        '<button class="rc-back" data-rccount>' + RC_CHEV + t('Receiving', '收货') + '</button>' +
        '<div class="rc-h1">' + t('Confirm receipt', '确认收货') + '</div>' +
        '<div class="rc-sub">' + esc(o.rs_number || ('#' + o.id)) + ' · ' +
          t('all ' + items.length + ' lines counted', '全部 ' + items.length + ' 项已点') + '</div>' +
      '</div>' + rcErrHtml() +
      '<div class="rc-body" style="padding:0 16px;display:flex;flex-direction:column;gap:8px">' +
        '<div class="rc-card"><div style="display:flex;align-items:baseline;gap:10px">' +
          '<span class="num" style="font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em">' + counted + '</span>' +
          '<span style="font-size:15px;color:var(--text2)">' + t('units counted', '件已点数') + '</span></div>' +
          '<div class="rc-sub" style="margin-top:6px">' + t(sent + ' were sent · ' + items.length + ' lines',
                                                            '发出 ' + sent + ' 件 · 共 ' + items.length + ' 项') + '</div></div>' +
        (diff.length
          ? '<div class="rc-plain"><div style="font-size:15px;font-weight:600;line-height:1.35">' +
              t('Against what the van carried, ' + diff.length + ' line' + (diff.length > 1 ? 's' : '') + ' differ',
                '与发货对比,' + diff.length + ' 项不一致') + '</div>' +
              diff.map(function (it) {
                return '<div class="rc-sub">' + esc(rcName(it)) + ' · ' +
                  t(rcCount(it) + ' counted, ' + rcSent(it) + ' sent',
                    '实收 ' + rcCount(it) + ',发出 ' + rcSent(it)) + '</div>';
              }).join('') +
              '<div class="rc-note" style="margin-top:8px">' +
                t('Recorded as counted. The warehouse sees the same numbers you do.',
                  '按实收记录。仓库看到的数字与您相同。') + '</div></div>'
          : '') +
        '<div style="flex:1"></div>' +
        '<div class="rc-flat rc-note">' +
          t('These ' + counted + ' units join this store’s stock when you confirm. You can still recount a line before then.',
            '确认后这 ' + counted + ' 件将计入本店库存。在此之前仍可重新点数。') + '</div>' +
      '</div>' +
      '<div class="rc-foot" style="background:transparent;border:none"><div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
        '<button class="rc-big"' + (rc.busy ? ' disabled' : ' data-rcconfirm') + '>' +
          (rc.busy ? t('Confirming…', '确认中…')
                   : t('Confirm receipt · ' + counted + ' units', '确认收货 · ' + counted + ' 件')) +
        '</button></div></div></div>';
  }

  function rcDoneHtml() {
    var o = rc.order, items = rcItems();
    var counted = items.reduce(function (a, it) { return a + (rcCount(it) || 0); }, 0);
    var sent = items.reduce(function (a, it) { return a + rcSent(it); }, 0);
    var asked = items.reduce(function (a, it) { return a + rcNum(it.qty_requested); }, 0);
    /* TWO GAPS, NOT ONE, AND ONLY HERE. Gap A is the warehouse — she asked for
       18 and 14 were found and allocated. Gap B is the road — 14 left and 10
       arrived. The receiving list showed gap B alone, which left her short of
       her order with nothing on screen saying so: the number that decides
       whether she reorders today. So the heading is not "what differed" — a
       line the warehouse cut before loading can arrive exactly as sent and
       still be short of the order. */
    var diff = items.filter(function (it) {
      return rcCount(it) !== rcSent(it) || rcSent(it) !== rcNum(it.qty_requested);
    });
    return '<div class="rc-wrap">' +
      rcHeadHtml(t('Received', '已收货'),
                 (o.rs_number || ('#' + o.id)) + ' · ' + clock(new Date()), false) +
      '<div style="padding:0 16px 12px"><div class="rc-card">' +
        '<div style="display:flex;align-items:baseline;gap:10px">' +
          '<span class="num rc-muted" style="font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em">' + counted + '</span>' +
          '<span style="font-size:15px;color:var(--text2)">' + t('units added to this store', '件已入本店库存') + '</span></div>' +
        '<div class="rc-sub" style="margin-top:6px">' +
          t(items.length + ' lines · ' + asked + ' asked · ' + sent + ' sent',
            '共 ' + items.length + ' 项 · 申请 ' + asked + ' · 发出 ' + sent) + '</div></div></div>' +
      (diff.length ? '<div class="rc-lbl">' + t('Against what you asked for', '与申请对比') + '</div>' +
        '<div>' + diff.map(function (it) {
          return '<div class="rc-hr"></div><div class="rc-row">' +
            '<span class="rc-qty num">' + rcCount(it) + '</span>' +
            '<span class="rc-mid"><span class="rc-nm">' + esc(rcName(it)) + '</span>' +
            '<span class="rc-cap">' +
              t('asked ' + rcNum(it.qty_requested) + ' · sent ' + rcSent(it) + ' · ',
                '申请 ' + rcNum(it.qty_requested) + ' · 发出 ' + rcSent(it) + ' · ') +
              '<span class="rc-gap">' + t('counted ' + rcCount(it), '实收 ' + rcCount(it)) + '</span>' +
            '</span></span></div>';
        }).join('') + '<div class="rc-hr"></div></div>' +
        '<div style="padding:14px 16px 0"><div class="rc-note">' +
          t('All of these are recorded against this delivery and the warehouse can see them. Nothing else is needed from you.',
            '以上均已记录在本次配送中,仓库可以看到。您无需其他操作。') + '</div></div>'
        : '') +
      '<div class="rc-body"></div>' +
      '<div class="rc-foot" style="background:transparent;border:none">' +
        '<div style="padding:16px 16px calc(var(--sa-bot) + 24px)">' +
        '<button class="rc-big" data-rcback>' + t('Done', '完成') + '</button></div></div></div>';
  }

  function rcChooseHtml() {
    return '<div class="rc-wrap">' +
      '<div class="rc-head"><button class="rc-back" data-rcback>' + RC_CHEV + t('Back', '返回') + '</button>' +
      '<div class="rc-h1">' + t('Receiving', '收货') + '</div>' +
      '<div class="rc-sub">' + t(rc.list.length + ' deliveries are on their way', '共 ' + rc.list.length + ' 批在途配送') + '</div></div>' +
      '<div style="padding:12px 16px 0">' + rcEntryHtml() + '</div>' +
      '<div class="rc-body"></div></div>';
  }

  function rcEmptyHtml() {
    return '<div class="rc-wrap">' + rcHeadHtml(t('Receiving', '收货'), '', false) +
      '<div class="rc-empty">' +
        '<div style="font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.35">' +
          t('Nothing to receive', '暂无待收货') + '</div>' +
        '<div style="font-size:15px;color:var(--text2);margin-top:6px;line-height:1.5">' +
          t('Nothing is on its way right now.', '目前没有在途的配送。') + '</div></div>' +
      '<div style="padding:16px 16px calc(var(--sa-bot) + 28px)">' +
        '<button class="rc-big" data-rcback>' + t('Back', '返回') + '</button></div></div>';
  }

  function rcRender() {
    if (state.view !== 'receiving') return;
    $('#pageHead').hidden = true; $('#band').hidden = true;
    measureHead();
    var html;
    if (rc.busy && !rc.order) html = '<div class="rc-wrap">' + rcHeadHtml(t('Receiving', '收货'), '', false) +
      '<div class="rc-empty"><div style="font-size:15px;color:var(--text2)">' + t('Loading…', '加载中…') + '</div></div></div>';
    else if (!rc.order) html = (rc.list && rc.list.length > 1) ? rcChooseHtml() : rcEmptyHtml();
    else if (rc.step === 'transit') html = rcTransitHtml();
    else if (rc.step === 'confirm') html = rcConfirmHtml();
    else if (rc.step === 'done') html = rcDoneHtml();
    else html = rcCountHtml();
    $('#main').className = '';
    $('#main').innerHTML = html;
    rcWire();
  }

  function rcWire() {
    var m = $('#main');
    Array.prototype.forEach.call(m.querySelectorAll('[data-rcback]'), function (b) { b.onclick = rcExit; });
    Array.prototype.forEach.call(m.querySelectorAll('[data-rccount]'), function (b) {
      b.onclick = function () { rc.step = 'count'; rcRender(); };
    });
    Array.prototype.forEach.call(m.querySelectorAll('[data-rcreview]'), function (b) {
      b.onclick = function () { rc.step = 'confirm'; rcRender(); };
    });
    Array.prototype.forEach.call(m.querySelectorAll('[data-rcconfirm]'), function (b) { b.onclick = rcConfirm; });
    Array.prototype.forEach.call(m.querySelectorAll('[data-count]'), function (b) {
      b.onclick = function (e) {
        var tick = e.target.closest('[data-assent]');
        var id = parseInt(b.getAttribute('data-count'), 10);
        if (tick) {
          // "Exactly what was sent", chosen in one tap. A deliberate act, which
          // is the only thing that separates it from a pre-fill.
          var it = rcItems().filter(function (x) { return x.id === id; })[0];
          if (it) rcSaveCount(id, rcSent(it));
          return;
        }
        rcOpenPad(id);
      };
    });
  }

  /* The way in, on top of the counting list. A transfer she can see through the
     door is not something Tacet did for her, so an arrival is Cream; one still
     on the road is the flow's one Dusk spend and keeps it here too. */
  function rcEntryHtml() {
    if (!rc.list || !rc.list.length) return '';
    return rc.list.map(function (o) {
      var arrived = rcArrived(o);
      return '<button class="rc-entry" data-rcopen="' + o.id + '">' +
        '<span class="t"><b>' + (arrived ? t('A delivery is waiting to be counted', '有一批配送待点数')
                                         : t('A delivery is on the way', '有一批配送在途')) + '</b>' +
        '<i>' + esc(o.rs_number || ('#' + o.id)) + ' · ' +
          t((o.item_count || 0) + ' lines from the warehouse', '来自仓库 · 共 ' + (o.item_count || 0) + ' 项') + '</i></span>' +
        '<span style="flex:none;color:var(--text2);transform:rotate(180deg);display:flex">' + RC_CHEV + '</span></button>';
    }).join('');
  }
  function rcWireEntry() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-rcopen]'), function (b) {
      b.onclick = function () { rcOpen(parseInt(b.getAttribute('data-rcopen'), 10)); };
    });
  }

  function rcMount() {
    $('#rcBack').onclick = rcClosePad;
    $('#rcGrid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-k]'); if (!b) return;
      rcPad(b.getAttribute('data-k'));
    });
    $('#rcAll').onclick = rcAll;
    $('#rcSave').onclick = rcPadSave;
  }


  /* ══ PICKING — the warehouse's half of the two-step transfer ═══════════════
     Decisions §39, drawn in design-handoff/warehouse-picking/. The rules:

       • THE PICKER ALLOCATES EVERY SHORTFALL. Tacet pre-fills nothing. When a
         line comes up short, every store's field opens BLANK — not zero, which
         is an amount he chose, and not a proportional split, which was rejected
         because some products a store can do without for a day and only the man
         in the freezer knows which. Filling stores in list order was rejected
         too: the same store loses every time.
       • SHORT IS RECORDED, NEVER BLOCKED. No reason field. The remainder
         counting down to zero is the whole explanation for the inactive save,
         and there is no error message anywhere in the flow.
       • A DISPATCH IS NEVER BLOCKED BY THE RECORD. If the shelf says 20 and he
         finds and sends 50, the send goes through and the warehouse goes to −30
         (§39 Ruling 1). Nothing here checks stock before dispatching, and
         nothing refuses on it — the server owns that, and this screen must not
         reintroduce a gate the ruling deleted.
       • THE LIST IS COMBINED, ONE ROW PER PRODUCT. Several stores' requests are
         merged into a single walk of the freezer — the flow's one Dusk spend,
         because merging them is Tacet acting and everything else here is his.

     WIRED TO #242's ENDPOINTS ONLY: GET /api/restock for the run,
     PUT /api/restock/:id/item/:item_id for a picked line, and
     PUT /api/restock/:id/status {status:'prepared'} for the dispatch, which is
     what fires _applyDispatch. Retrying a failed dispatch is #244's job and is
     deliberately not built here: the failure is SHOWN, and nothing offers to
     re-run it.  */

  var pk = {
    list: null,      // the orders in this run, with their items
    store: 'all',    // filter chip
    step: 'list',    // list | dispatch | sent
    busy: false,
    err: '',
    sheet: null,     // { key, found, entry, focus, alloc }
    result: null,    // what the dispatch came back with
  };

  function pkOrders() { return Array.isArray(pk.list) ? pk.list : []; }
  function pkStoreOf(o) {
    return (lang === 'cn' ? (o.store_cn || o.store_name) : (o.store_name || o.store_cn))
      || o.rs_number || ('#' + o.id);
  }
  function pkItemName(it) {
    var n = lang === 'cn' ? (it.product_cn || it.product_name) : (it.product_name || it.product_cn);
    return n || ('#' + it.id);
  }
  /* One row per PRODUCT, across every request in the run. Keyed on product_id
     where there is one and on the name where there is not, so two requests for
     the same thing become one walk to one freezer rather than two. */
  function pkLines() {
    var by = {}, order = [];
    pkOrders().forEach(function (o) {
      (o.items || []).forEach(function (it) {
        if (!(rcNum(it.qty_requested) > 0)) return;
        var key = it.product_id != null ? 'p' + it.product_id : 'n' + (it.product_name || it.id);
        if (!by[key]) { by[key] = { key: key, name: pkItemName(it), sku: it.sku, parts: [] }; order.push(key); }
        by[key].parts.push({ orderId: o.id, itemId: it.id, store: pkStoreOf(o),
                             asked: rcNum(it.qty_requested),
                             sent: it.qty_sent == null ? null : rcNum(it.qty_sent),
                             checked: !!it.is_checked });
      });
    });
    return order.map(function (k) {
      var L = by[k];
      L.asked = L.parts.reduce(function (a, p) { return a + p.asked; }, 0);
      L.done = L.parts.every(function (p) { return p.checked; });
      L.sent = L.done ? L.parts.reduce(function (a, p) { return a + (p.sent == null ? p.asked : p.sent); }, 0) : null;
      return L;
    });
  }
  function pkStores() {
    var seen = [], out = [];
    pkOrders().forEach(function (o) {
      var n = pkStoreOf(o);
      if (seen.indexOf(n) < 0) { seen.push(n); out.push({ name: n, id: o.id }); }
    });
    return out;
  }
  function pkVisible() {
    var all = pkLines();
    if (pk.store === 'all') return all;
    return all.filter(function (L) {
      return L.parts.some(function (p) { return p.store === pk.store; });
    });
  }
  function pkPicked() { return pkLines().filter(function (L) { return L.done; }); }

  function pkLoad() {
    if (rc.on === false) return Promise.resolve();
    return rcFetch('/api/restock?tab=active').then(function (j) {
      rc.on = true;
      // A run is what has been asked for and not yet dispatched. goods_state
      // 'none' is the pre-dispatch state; anything else has already left.
      // WHAT THIS LOCATION HAS BEEN ASKED TO SUPPLY. `from_store_id` is the
      // supplier, so a Tianhe→Yuexiu request appears in YUEXIU's pick list —
      // they are the ones who have to walk to a freezer. Filtering on the roles
      // instead would have put it in Tianhe's, asking the requester to pick
      // their own order. Rows written before #259 have no pair and fall back to
      // the old role test, which is all they ever had.
      var want = (Array.isArray(j.data) ? j.data : []).filter(function (o) {
        var mine = o.from_store_id
          ? o.from_store_id === state.storeId
          : ((o.from_role || 'store') === 'store' && (o.to_role || 'warehouse') === 'warehouse');
        return mine
          && ['sent', 'received'].indexOf(o.status) >= 0
          && (!o.goods_state || o.goods_state === 'none');
      });
      return Promise.all(want.map(function (o) {
        return rcFetch('/api/restock/' + o.id).then(function (d) { return d.data; });
      })).then(function (full) {
        pk.list = full;
        probeAnswered();
        if (state.view === 'home') homeRender();
        else if (state.view === 'picking') pkRender();
        else render();
      });
    }).catch(function (e) {
      if (e.message === 'norealm') { rc.on = false; pk.list = []; probeAnswered(); return; }
      pk.err = e.message; if (state.view === 'picking') pkRender();
    });
  }

  function pkEnter() { state.view = 'picking'; pk.step = 'list'; pk.err = ''; pkRender(); }
  function pkExit() {
    pk.step = 'list'; pk.err = '';
    pkLoad();
    homeBack();
  }

  /* Writing a picked line. One PUT per contributing request, because a combined
     row is several stores' lines standing next to each other — the merge is a
     view, never a row of its own. qty_sent is what actually leaves; is_checked
     is what marks the walk done. */
  function pkWriteLine(L, per) {
    pk.busy = true; pk.err = ''; pkRender();
    return Promise.all(L.parts.map(function (p) {
      var q = per ? per[p.itemId] : p.asked;
      return rcFetch('/api/restock/' + p.orderId + '/item/' + p.itemId,
        { method: 'PUT', body: { qty_sent: q, is_checked: 1 } })
        .then(function () {
          var o = pkOrders().filter(function (x) { return x.id === p.orderId; })[0];
          var it = o && (o.items || []).filter(function (x) { return x.id === p.itemId; })[0];
          if (it) { it.qty_sent = q; it.is_checked = 1; }
        });
    })).then(function () { pk.busy = false; pkRender(); })
      .catch(function (e) {
        pk.busy = false;
        pk.err = e.message === 'norealm'
          ? t('This account cannot pick transfers.', '此账号无法拣货。')
          : t('That line did not save. Nothing has changed — try again.', '该项未保存,数据未变 — 请重试。');
        pkRender();
      });
  }

  /* ── The short-pick sheet ─────────────────────────────────────────────────
     Two fields deep: how many he FOUND, then how those go across the stores.
     Both open blank. The remainder gates the save and nothing else does. */
  function pkOpenShort(key) {
    var L = pkVisible().filter(function (x) { return x.key === key; })[0];
    if (!L) return;
    pk.sheet = { key: key, found: '', entry: '', focus: 'found', alloc: {} };
    L.parts.forEach(function (p) { pk.sheet.alloc[p.itemId] = ''; });
    $('#pkName').textContent = L.name;
    $('#pkSub').textContent = (L.sku ? L.sku + ' · ' : '') + t('asked for ' + L.asked, '申请 ' + L.asked);
    $('#pkClear').textContent = t('Clear', '清除');
    pkPaintSheet();
    state.sheet = 'pick';
    $('#pkBack').classList.add('show'); $('#pkSheet').classList.add('show');
  }
  function pkCloseSheet() {
    state.sheet = null; pk.sheet = null;
    $('#pkBack').classList.remove('show'); $('#pkSheet').classList.remove('show');
  }
  function pkAssigned() {
    var s = pk.sheet, n = 0;
    for (var k in s.alloc) if (s.alloc[k] !== '') n += parseInt(s.alloc[k], 10);
    return n;
  }
  function pkPaintSheet() {
    var s = pk.sheet;
    var L = pkVisible().filter(function (x) { return x.key === s.key; })[0]
         || pkLines().filter(function (x) { return x.key === s.key; })[0];
    if (!L) return;
    var hasFound = s.found !== '';
    var found = hasFound ? parseInt(s.found, 10) : null;
    var short = hasFound ? L.asked - found : null;
    $('#pkFound').innerHTML =
      '<span class="num" style="font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.02em' +
        (hasFound ? '' : ';color:var(--text2)') + '">' + (hasFound ? found : '—') + '</span>' +
      '<span style="font-size:13px;color:var(--text2)">' + t('found', '找到') + '</span>' +
      (hasFound && short > 0 ? '<span style="font-size:15px;font-weight:600">' +
        t(short + ' short', '短少 ' + short) + '</span>' : '') +
      (hasFound && short < 0 ? '<span style="font-size:15px;font-weight:600">' +
        t((-short) + ' over', '多出 ' + (-short)) + '</span>' : '');
    $('#pkAssignLbl').textContent = hasFound
      ? t('Assign the ' + found + ' across the stores', '将这 ' + found + ' 件分配到门店')
      : t('How many did you find?', '实际找到多少?');
    $('#pkRows').innerHTML = !hasFound ? '' : L.parts.map(function (p) {
      var v = s.alloc[p.itemId];
      return '<div class="pk-alloc">' +
        '<div class="pk-who">' + esc(p.store) + '</div>' +
        '<div class="pk-ask">' + t('asked ' + p.asked, '申请 ' + p.asked) + '</div>' +
        '<button class="pk-field' + (s.focus === p.itemId ? ' on' : '') + '" data-pkf="' + p.itemId + '">' +
          (v === '' ? '' : parseInt(v, 10)) + '</button></div>';
    }).join('');
    var rem = hasFound ? found - pkAssigned() : null;
    $('#pkRem').innerHTML = !hasFound ? ''
      : rem === 0 ? '<span style="font-size:15px;color:var(--text2)">' +
          t('All ' + found + ' assigned', '已全部分配 ' + found + ' 件') + '</span>'
      : rem > 0 ? '<b class="num">' + rem + '</b><span>' + t('still to assign', '待分配') + '</span>'
      : '<b class="num">−' + (-rem) + '</b><span>' +
          t('over — take ' + (-rem) + ' back', '超出 — 请调减 ' + (-rem)) + '</span>';
    var ok = hasFound && rem === 0;
    var save = $('#pkSave');
    save.disabled = !ok;
    save.style.opacity = ok ? '' : '.5';
    save.textContent = t('Save and continue', '保存并继续');
  }
  function pkKey(k) {
    var s = pk.sheet; if (!s) return;
    var slot = s.focus === 'found' ? 'found' : null;
    var cur = slot ? s.found : s.alloc[s.focus];
    if (k === 'clear') cur = '';
    else if (k === 'back') cur = String(cur).slice(0, -1);
    else if (String(cur).length < 5) cur = (cur === '0' ? '' : cur) + k;
    if (slot) {
      s.found = cur;
      // The allocation cannot open before there is something to allocate, and
      // it opens BLANK — every field, every time.
      if (cur !== '') {
        var L = pkLines().filter(function (x) { return x.key === s.key; })[0];
        if (L && s.focus === 'found') { L.parts.forEach(function (p) { s.alloc[p.itemId] = ''; }); }
      }
    } else s.alloc[s.focus] = cur;
    pkPaintSheet();
  }
  function pkFocus(itemId) { pk.sheet.focus = itemId; pkPaintSheet(); }
  function pkSheetNext() {
    // Entering the found figure hands the keypad to the first store field. He
    // still types every one of them; nothing is filled for him.
    var s = pk.sheet;
    if (s.focus !== 'found') return;
    var L = pkLines().filter(function (x) { return x.key === s.key; })[0];
    if (L && L.parts.length) s.focus = L.parts[0].itemId;
    pkPaintSheet();
  }
  function pkSaveShort() {
    var s = pk.sheet; if (!s || $('#pkSave').disabled) return;
    var L = pkLines().filter(function (x) { return x.key === s.key; })[0];
    var per = {};
    for (var k in s.alloc) per[k] = parseInt(s.alloc[k], 10);
    pkCloseSheet();
    if (L) pkWriteLine(L, per);
  }

  /* ── Dispatch ─────────────────────────────────────────────────────────────
     One status write per request. Nothing here inspects stock first: §39 Ruling
     1 says a dispatch is never blocked by the record, so a screen that checked
     would be reintroducing the gate the ruling deleted.

     A failure is SHOWN and nothing more. Retrying it is #244's work; offering a
     retry here would be building that feature by the back door. */
  function pkDispatch() {
    if (pk.busy) return;
    pk.busy = true; pk.err = ''; pk.result = null; pkRender();
    var orders = pkOrders();
    var failed = [];
    Promise.all(orders.map(function (o) {
      return rcFetch('/api/restock/' + o.id + '/status', { method: 'PUT', body: { status: 'prepared' } })
        .then(function (j) {
          if (j.stock_transfer && j.stock_transfer.ok === false) {
            failed.push({ rs: o.rs_number || ('#' + o.id), error: j.stock_transfer.error });
          }
        })
        .catch(function (e) { failed.push({ rs: o.rs_number || ('#' + o.id), error: e.message }); });
    })).then(function () {
      pk.busy = false; pk.result = { failed: failed }; pk.step = 'sent'; pkRender();
      if (state.storeId != null) loadStock(true);
      pkLoad();
    });
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function pkRowHtml(L) {
    var split = L.parts.map(function (p) {
      return esc(p.store) + ' ' + (L.done ? (p.sent == null ? p.asked : p.sent) : p.asked);
    }).join(' · ');
    if (!L.done) {
      return '<div class="rc-row">' +
        '<span class="rc-qty num">' + L.asked + '</span>' +
        '<span class="rc-mid"><span class="rc-nm">' + esc(L.name) + '</span>' +
        '<span class="rc-cap">' + split + '</span></span>' +
        '<button class="pk-short" data-pkshort="' + L.key + '">' + t('Short', '短缺') + '</button>' +
        '<button class="rc-tick todo" data-pkfull="' + L.key + '">' + RC_TICK + '</button>' +
        '</div>';
    }
    var short = L.asked - L.sent;
    return '<div class="rc-row done">' +
      '<span class="rc-qty num' + (short === 0 ? ' rc-muted' : '') + '">' + L.sent + '</span>' +
      '<span class="rc-mid"><span class="rc-nm rc-muted">' + esc(L.name) + '</span>' +
      '<span class="rc-cap">' + (short > 0 ? '<span class="rc-gap">' + t(short + ' short', '短少 ' + short) + '</span> · ' : '') +
        split + '</span></span>' +
      '<span class="rc-tick">' + RC_TICK + '</span>' +
      '</div>';
  }

  function pkListHtml() {
    var lines = pkLines(), shown = pkVisible(), picked = pkPicked();
    var pct = lines.length ? Math.round(picked.length / lines.length * 100) : 0;
    var all = lines.length > 0 && picked.length === lines.length;
    var stores = pkStores();
    var rs = pkOrders().length === 1 ? (pkOrders()[0].rs_number || '') : '';
    var resume = (picked.length && !all)
      ? '<div class="rc-flat" style="margin:0 16px 10px">' +
          '<div style="font-size:15px;font-weight:600;line-height:1.35">' + t('Picking up where you left off', '继续上次的拣货') + '</div>' +
          '<div class="rc-sub">' + t(picked.length + ' of ' + lines.length + ' lines picked · nothing was lost',
                                     '已拣 ' + picked.length + '/' + lines.length + ' 项 · 数据未丢失') + '</div></div>'
      : '';
    // THE ONE DUSK ELEMENT. Merging several stores' requests into a single walk

  function pkWire() {
    var m = $('#main'), each = function (sel, fn) {
      Array.prototype.forEach.call(m.querySelectorAll(sel), fn);
    };
    each('[data-pkback]', function (b) { b.onclick = pkExit; });
    each('[data-pklist]', function (b) { b.onclick = function () { pk.step = 'list'; pkRender(); }; });
    each('[data-pkreview]', function (b) { b.onclick = function () { pk.step = 'dispatch'; pkRender(); }; });
    each('[data-pkstore]', function (b) {
      b.onclick = function () { pk.store = b.getAttribute('data-pkstore'); pkRender(); };
    });
    each('[data-pkfull]', function (b) {
      b.onclick = function () {
        var L = pkLines().filter(function (x) { return x.key === b.getAttribute('data-pkfull'); })[0];
        if (L) pkWriteLine(L, null);
      };
    });
    each('[data-pkshort]', function (b) {
      b.onclick = function () { pkOpenShort(b.getAttribute('data-pkshort')); };
    });

  /* The hold. 900ms, and it resets the instant the thumb leaves: a partial hold
     must never dispatch, or the gesture is a tap with extra steps. */
  var PK_HOLD_MS = 900;
  function pkWireHold(el) {
    var fill = el.querySelector('.fill'), t0 = 0, raf = 0, fired = false;
    function tick() {
      var pct = Math.min(1, (Date.now() - t0) / PK_HOLD_MS);
      fill.style.width = (pct * 100) + '%';
      if (pct >= 1) { if (!fired) { fired = true; stop(); pkDispatch(); } return; }
      raf = setTimeout(tick, 40);
    }
    function start(e) { if (e && e.cancelable) e.preventDefault(); if (fired) return; t0 = Date.now(); tick(); }
    function stop() { clearTimeout(raf); if (!fired) fill.style.width = '0'; }
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('pointerleave', stop);
    // Keyboard and headless: a click is a hold that already completed.
    el.addEventListener('click', function () { if (!fired) { fired = true; stop(); pkDispatch(); } });
  }

  /* Where the app opens. Decided ONCE, so the launcher cannot flash up and
