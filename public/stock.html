<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" id="meta-theme-color" content="#FBF9F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Quick stock · 库存</title>
<link rel="manifest" href="/stock-manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/stock-icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="application-name" content="Quick stock">
<meta name="apple-mobile-web-app-title" content="Quick stock">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('roots_theme');
      var theme = saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#FBF9F4' : '#111A2B');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<!-- Inter + Source Han Sans (Noto Sans SC) are Tacet's two product faces. Loaded
     NON-BLOCKING (media=print, flipped on load): this PWA runs on kitchen phones
     behind a firewall that can null-route Google's font hosts, and a blocking
     stylesheet there costs the staffer a blank screen until the socket times
     out. The fallback stack is PingFang SC / system-ui, so the page is legible
     from the first paint and settles into Inter if the request lands. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* ===========================================================================
   Quick stock — the Tacet phone tool for counting shelves.
   Tokens, type, spacing, motion and states follow docs/tacet-design-system.md
   v1.3 and docs/tacet-desktop-patterns.md v4.6; values are lifted verbatim from
   public/m.html (the shipped phone build) so the two surfaces cannot drift.
   Archetype: A1 Worklist on a 390px screen — chips with live counts, cards
   instead of rows, one control per record.
   Dusk budget: ZERO, and that is the finished answer. Every write on this page
   is the operator counting their own shelf, never tacet acting (§1.8 rule 5,
   rule 6). Focus rings are the one Dusk element, and they are exempt.
   =========================================================================== */
:root{
  --paper:#FBF9F4; --ink:#111A2B; --graphite:#58606E;
  --dusk:#6E67AF; --sage:#A3B49F; --amber:#C9954A; --brick:#B4533E;
  --dusk-tint:#EEEDF6; --sage-tint:#EDF1EC; --amber-tint:#F7EEDE; --brick-tint:#F6E7E3;

  --bg:var(--paper); --surface:#FFFFFF; --raised:#F6F3EC; --line:#E4E0D5;
  --text:var(--ink); --text2:var(--graphite);
  --amber-ink:#8A6425; --brick-ink:#B4533E; --sage-ink:#5F7357; --dusk-ink:#524C8F;
  --scrim:rgba(17,26,43,.38);
  /* One soft ambient shadow, on overlays only. Never on a resting card. */
  --shadow-overlay:0 1px 2px rgba(17,26,43,.05),0 4px 16px rgba(17,26,43,.04);
  --settle:cubic-bezier(0.16,1,0.3,1);
  --sa-top:env(safe-area-inset-top,0px); --sa-bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
/* Dark mode is a token swap: Paper and Ink trade places, every other colour
   holds its ROLE. The functional inks take a lighter value on an Ink surface —
   #8A6425 amber text on #182236 is under 3:1, and this page is read at arm's
   length in a kitchen. The role does not move; only the value does. */
:root[data-theme="dark"]{
  --bg:var(--ink); --surface:#182236; --raised:#1E2A40; --line:#263149;
  --text:var(--paper); --text2:#9AA2B0;
  --amber-ink:#D9A55E; --brick-ink:#DE8B77; --sage-ink:#A3B49F; --dusk-ink:#A9A2E0;
  --amber-tint:rgba(201,149,74,.16); --brick-tint:rgba(180,83,62,.20);
  --sage-tint:rgba(163,180,159,.16); --dusk-tint:rgba(110,103,175,.24);
  --scrim:rgba(8,12,20,.55);
  --shadow-overlay:0 1px 2px rgba(0,0,0,.28),0 4px 16px rgba(0,0,0,.24);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* [hidden] loses to any display in a rule or a style attribute, and this page
   hides three regions that are flex when shown. Stated once, here. */
[hidden]{display:none!important;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;}
/* The rubber-band area past the top and bottom of the scroll shows the root's
   paper, not the browser's white. */
html{background:var(--bg);}
body{
  font-family:'Inter','Noto Sans SC','Source Han Sans SC','PingFang SC',-apple-system,system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; font-weight:400; line-height:1.6;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
}
/* CJK runs need the air (§1.11). */
html[lang="zh"] body{line-height:1.7;}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit;font-size:15px;}
input{font-family:inherit;-webkit-user-select:text;user-select:text;}
.num{font-variant-numeric:tabular-nums;}

/* Motion — everything settles. Nothing bounces, pops or springs. */
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes settleLine{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{display:flex;flex-direction:column;min-height:100%;}

/* ── The mark · in the account sheet, not in a bar of its own ───────────────
   A 56px topbar to carry a mark the operator already taps on their home screen
   is rent, and on a 844px phone it is a fifth of the shelf. The identity lives
   on the app icon and one tap inside the account sheet. Mark alone, never the
   wordmark: Fraunces is the marketing voice and never appears in product UI
   (§1.3), and below 24px the system asks for the mark on its own (§8). */
.mark{display:block;width:58px;height:20px;flex:none;color:var(--text2);}
/* §8a — the stroke is set optically at small size, not scaled from the viewBox.
   non-scaling-stroke holds it at 1.6px however the mark is sized; the spec's
   3.5 units would resolve to 0.64px here and the mark would simply vanish. */
.mark path{vector-effect:non-scaling-stroke;stroke-width:1.6;}
/* Avatar — rounded square, never a circle (§1.14). */
.avatar{
  width:32px;height:32px;border-radius:8px;flex:none;
  /* --dusk-ink, not --dusk: the initial is 15px type, and #6E67AF on the dark
     theme's dusk tint is 2.5:1. The other three hues already had an ink for
     exactly this; Dusk was the one that did not. */
  background:var(--dusk-tint);color:var(--dusk-ink);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;
}
.avatar:active{background:var(--raised);}

/* ── Page header · title · status line · one Dusk CTA (§1.7).
   Quick stock has no create action and nothing waiting that the chips do not
   already count, so the CTA slot and the status line both stay EMPTY. That is
   the finished header, not a gap (Customers is the reference case). The account
   control sits in the CTA's place — it is the shell's, not the page's, and on a
   phone with no topbar there is nowhere else for it to live.
   The negative bottom margin absorbs the safe-area inset the pinned band below
   carries for itself: without it, a notched phone shows the inset TWICE at rest
   (once here, once as the band's own top padding) and the head floats. ── */
/* §1.7, and the same shape every pushed screen on the phone uses: the back link
   states where you came from on its own line, then the title, then the status.
   The back link was a third item in the title ROW at first, which put "Kitchen"
   and "Add stock" side by side — a header this app shares with no other screen
   in the product, on the one screen an operator reaches from another app. */
.page-head{display:flex;flex-direction:column;
  padding:calc(var(--sa-top) + 20px) 16px 12px;margin-bottom:calc(-1 * var(--sa-top));}
/* 6px off the top when the back link is there to carry it, so the head does not
   grow by a whole row. Mirrors the phone's own pageHead. */
.page-head.has-back{padding-top:calc(var(--sa-top) + 14px);}
.page-head .headrow{display:flex;align-items:flex-start;gap:16px;}
.page-head .headmain{flex:1;min-width:0;}
.page-head h1{margin:0;font-size:24px;font-weight:500;letter-spacing:-.01em;line-height:1.25;}

/* The store is the head's second line, not a control row of its own — it names
   which shelf you are counting, which is state, not an action. Hidden entirely
   when the staffer has one store (§1.9, data precondition: self-hide). */
.toolbar{padding:0;}
.btn{
  min-height:44px;padding:0 16px;border-radius:8px;font-size:15px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s var(--settle);
}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--line);}
.btn-secondary:active{background:var(--raised);}
.btn-ink{background:var(--text);color:var(--bg);}
.btn-ink:active{opacity:.86;}
.btn-danger{background:transparent;color:var(--brick-ink);border:1px solid var(--brick-ink);}
.btn-danger:active{background:var(--brick-tint);}
.btn[disabled]{opacity:.55;cursor:default;}
/* A text line, but still a 44px target: the padding makes the box, the negative
   margins keep the head tight around it. Vertical only — a control pulled past
   its own horizontal padding lands on the browser's edge gesture. */
.btn-store{justify-content:flex-start;border:0;background:none;color:var(--text2);
  font-size:15px;font-weight:400;gap:6px;min-height:44px;padding:10px 0;margin:-8px 0 -10px;}
.btn-store .ico{display:none;}
.btn-store .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-store .chev{margin-left:0;width:18px;height:18px;color:var(--text2);}
.btn-store:active{background:none;color:var(--text);}

/* ── Search + chips band · pinned. Fixed height, fully opaque (§1.13a rule 2):
   a band that grows or lets tinted rows show through stops being a pin.
   It carries the safe-area inset ITSELF, because a sticky element pins to the
   viewport and ignores any padding on the page — measured, not assumed: with
   the inset on <html> the band still lands at y=0, i.e. under the status bar.
   The head's negative bottom margin cancels the inset while the head is there,
   so the gap is 12px in every case and nothing moves when the band takes over.
   The rule at the bottom closes the whole head, so the search never sits naked
   against the top of the screen with cards sliding under it. ── */
.band{position:sticky;top:0;z-index:15;background:var(--bg);
  padding:calc(var(--sa-top) + 12px) 16px 12px;border-bottom:1px solid var(--line);}
/* The account button rides in the pinned row, so it is still reachable once the
   head has scrolled away. Its space is RESERVED at rest rather than claimed on
   the fold — a search field that changes width as you scroll is the opposite of
   everything settling. */
.bandrow{display:flex;align-items:center;gap:8px;}
.bandrow .searchwrap{flex:1;min-width:0;}
.bandrow .avatar{visibility:hidden;opacity:0;transition:opacity .2s var(--settle);}
body.compact .bandrow .avatar{visibility:visible;opacity:1;}
.searchwrap{position:relative;}
.searchwrap .s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text2);pointer-events:none;}
#q{
  width:100%;height:44px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:15px;padding:0 44px 0 42px;
}
#q::placeholder{color:var(--text2);}
/* Focus is the page's one Dusk element and is exempt from the budget (§1.8
   rule 3). Border turns Dusk — no glow ring. */
#q:focus{outline:none;border-color:var(--dusk);}
.q-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:none;place-items:center;color:var(--text2);}
.q-clear.show{display:grid;}
.filters{display:flex;gap:8px;margin-top:12px;}
.chip{
  flex:1;height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--text2);font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s var(--settle),color .2s var(--settle);
}
.chip .c{font-variant-numeric:tabular-nums;}
/* Ink fill = the operator's current selection. Never Dusk (§1.8, stated once). */
.chip.active{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:500;}
.chip.active .c{opacity:.7;}

main{flex:1;padding:0 16px calc(var(--sa-bot) + 32px);display:flex;flex-direction:column;gap:8px;}

/* ── Product card · one record, one control ── */
.row{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;
  display:flex;flex-direction:column;gap:8px;
}
/* Cards enter with the settle, ONCE — on a fresh list, never on a keystroke.
   Re-running it per character makes the list flash while the operator types,
   which is the opposite of everything settling. */
main.enter > .row{animation:rise .35s var(--settle) both;}
.r-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.r-name{
  font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-.01em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.r-sku{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;}
/* Status pills — only where a colour encodes a state (§1.10). A well-stocked
   product wears NO pill: the number already says it, and 190 Sage pills would
   be decoration. Same reasoning the phone build applies on the catalogue. */
.pill{
  display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;
  font-size:13px;font-weight:400;white-space:nowrap;flex:none;
}
.p-amber{background:var(--amber-tint);color:var(--amber-ink);}
.p-brick{background:var(--brick-tint);color:var(--brick-ink);}
.p-mute{background:var(--raised);color:var(--text2);}

/* ── Stepper · minus · count · plus. The glyphs are Ink, not red and green:
   a colour that does not encode a state is decoration (§1.10). The COUNT
   carries the state — Brick at zero. ── */
.stepper{display:flex;align-items:center;gap:12px;margin-top:8px;}
.stepper .minus,.stepper .plus{
  width:56px;height:56px;flex:none;border-radius:8px;
  background:var(--raised);border:1px solid var(--line);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  transition:background .2s var(--settle);
}
.stepper .minus:active,.stepper .plus:active{background:var(--line);}
.stepper .minus[disabled],.stepper .plus[disabled]{opacity:.55;}
.stepper .minus svg,.stepper .plus svg{width:24px;height:24px;}
.stepper .qty{
  flex:1;height:56px;background:transparent;border:none;color:var(--text);
  font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  transition:color .2s var(--settle);
}
.row.out .stepper .qty{color:var(--brick-ink);}
/* In flight — the write says so where the operator is looking. */
.row.saving .stepper .qty{color:var(--text2);}
.r-flight{font-size:13px;color:var(--text2);}
/* Error — inline, next to the control that failed, and it STAYS until the
   operator acts on it (§1.12). A failed write never leaves in a toast. */
.r-err{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--brick-tint);color:var(--brick-ink);
  border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;
}
.r-err .retry{
  margin-left:auto;min-height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--brick-ink);color:var(--brick-ink);font-size:13px;font-weight:500;
}

/* ── Loading · skeleton at --raised, settling. No spinners (§1.12). ── */
.skel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;animation:fade .35s var(--settle) both;}
.skel span{display:block;background:var(--raised);border-radius:8px;}
.skel .s1{height:18px;width:62%;}
.skel .s2{height:13px;width:28%;margin-top:10px;}
.skel .s3{height:56px;margin-top:16px;}

/* ── Page-level load · the settling waveform. One of its three licensed
   places (app launch, website hero, page-level loading) — never a refresh. ── */
.boot{flex:1;display:flex;align-items:center;justify-content:center;padding:64px 24px;}
.boot svg{width:140px;height:45px;color:var(--text2);}
.boot path{vector-effect:non-scaling-stroke;stroke-width:1.6;stroke-dasharray:520;animation:settleLine 1.1s var(--settle) forwards;}
.boot circle{animation:breathe 2.4s ease-in-out infinite;}

/* ── Empty · no results · error, and the full-screen states ── */
.note{
  display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
  padding:48px 24px;color:var(--text2);animation:fade .35s var(--settle) both;
}
.note p{margin:0;max-width:280px;}
.note .flat{width:120px;height:2px;color:var(--line);}
.banner{
  display:flex;flex-direction:column;gap:8px;background:var(--brick-tint);color:var(--brick-ink);
  border-radius:14px;padding:16px;font-size:15px;line-height:1.5;
}
.banner b{font-weight:500;}
.banner .btn{align-self:flex-start;margin-top:8px;}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:16px;color:var(--text2);}
.screen .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--raised);color:var(--text2);}
.screen .ic svg{width:24px;height:24px;}
.screen h2{margin:0;font-size:18px;font-weight:500;color:var(--text);}
.screen p{margin:0;max-width:300px;}

/* ── Toast · confirmations only. Failures never travel this way. ── */
#toast{
  position:fixed;left:50%;bottom:calc(var(--sa-bot) + 24px);transform:translateX(-50%) translateY(8px);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:13px;max-width:88vw;text-align:center;box-shadow:var(--shadow-overlay);
  opacity:0;pointer-events:none;transition:opacity .2s var(--settle),transform .2s var(--settle);z-index:60;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Sheets · a bounded decision, finished or abandoned (§1.13).
   A sheet spends no Dusk: its primary is Ink, because the operator is the one
   acting (§1.8 rule 5). ── */
.sheet-back{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s var(--settle);}
.sheet-back.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:14px 14px 0 0;box-shadow:var(--shadow-overlay);
  padding:8px 0 calc(var(--sa-bot) + 16px);
  transform:translateY(100%);transition:transform .35s var(--settle);
  max-height:80vh;overflow:auto;
}
.sheet.show{transform:translateY(0);}
.grabber{width:38px;height:5px;border-radius:999px;background:var(--line);margin:6px auto 8px;}
/* Sentence case, 13px Inter 500 — the uppercase eyebrow is banned (§1.6). */
.sheet-h{font-size:13px;font-weight:500;color:var(--text2);padding:12px 16px 4px;}
.sheet-mark{padding:8px 16px 0;}
.sheet-item{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;text-align:left;}
.sheet-item:active{background:var(--raised);}
.sheet-item .code{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;}
.sheet-item .tick{margin-left:auto;color:var(--text);display:flex;}
.sheet-item .tick svg{width:20px;height:20px;}
.srow{display:flex;align-items:center;gap:16px;min-height:56px;padding:12px 16px;}
.srow + .srow{border-top:1px solid var(--line);}
.srow .lbl{flex:1;min-width:0;}
/* The way back, above the title. Sized and coloured as the secondary line it
   is: the page's own name stays the biggest thing in the head. */
.backlink{display:flex;align-items:center;gap:6px;margin:0 0 4px -4px;padding:8px 4px;
  background:none;border:0;font:inherit;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;}
.backlink:active{color:var(--text);}
.backlink svg{width:16px;height:16px;flex:none;}
.seg{display:flex;gap:4px;padding:3px;background:var(--raised);border-radius:8px;flex:none;}
.seg button{min-height:34px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--text2);}
.seg button.on{background:var(--surface);color:var(--text);font-weight:500;}
.sheet-foot{padding:16px;display:flex;flex-direction:column;gap:8px;}
.sheet-foot .btn{width:100%;}
.sheet-cap{font-size:13px;color:var(--text2);padding:0 16px 8px;font-variant-numeric:tabular-nums;}

/* ── Keypad · set a count exactly. One bounded decision, one commit. ── */
.kp{padding:0 16px;}
.kp-head{padding:4px 0 0;}
.kp-name{font-size:18px;font-weight:500;line-height:1.3;}
.kp-sub{font-size:13px;color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums;}
.kp-display{margin:16px 0 8px;}
.kp-label{font-size:13px;color:var(--text2);}
.kp-val{font-size:30px;font-weight:500;line-height:1.3;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.kp-val.zero{color:var(--brick-ink);}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kp-key{
  height:56px;border-radius:8px;background:var(--raised);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);
  font-variant-numeric:tabular-nums;transition:background .2s var(--settle);
}
.kp-key:active{background:var(--line);}
.kp-key.word{font-size:15px;}
.kp-key svg{width:22px;height:22px;}
.kp-save{width:100%;height:48px;border-radius:8px;background:var(--text);color:var(--bg);font-size:15px;font-weight:500;margin-top:16px;}
.kp-save:active{opacity:.86;}

/* ── Receiving ──────────────────────────────────────────────────────────────
   The store's half of a two-step transfer (decisions §39). Drawn in
   design-handoff/store-receiving/ against these exact tokens, which is why the
   artboards carry over unchanged: --paper/--ink/--graphite/--dusk/--sage are
   the same names on both sides. Prefixed .rc- throughout — .row and .qty
   already belong to the counting list above and mean something else there. */
.rc-wrap{display:flex;flex-direction:column;min-height:calc(100vh - var(--sa-top));}
.rc-head{padding:8px 16px 12px;flex:none;}
.rc-h1{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25;}
.rc-sub{font-size:13px;color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums;}
.rc-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;}
.rc-meta .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rc-meta .r{flex:none;}
.rc-back{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:15px;padding:0 0 10px;}
.rc-back svg{width:20px;height:20px;}
/* THE SINGLE DUSK SPEND IN THE WHOLE FLOW. Stock that has left one building and
   not reached another is on no shelf anywhere — the one state only Tacet holds,
   and the one thing here the shop could not work out for itself. Every other
   action in receiving is hers, so every other screen is Ink. */
.rc-transit{margin:0 16px 12px;background:var(--dusk-tint);border-radius:14px;padding:16px;flex:none;}
.rc-dot{width:7px;height:7px;border-radius:999px;background:var(--dusk);flex:none;display:inline-block;}
.rc-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
.rc-plain{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.rc-flat{background:var(--raised);border-radius:14px;padding:14px 16px;}
.rc-lbl{font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--text2);padding:10px 16px 8px;flex:none;}
.rc-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);width:100%;text-align:left;}
.rc-row.done{background:var(--raised);box-shadow:inset 4px 0 0 var(--sage);}
.rc-row.next{border-top:1px solid var(--text);border-bottom:1px solid var(--text);}
.rc-qty{width:62px;flex:none;text-align:right;font-size:34px;font-weight:700;line-height:1.05;
        letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text);}
.rc-mid{flex:1;min-width:0;}
.rc-nm{font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.01em;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc-cap{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
/* The gap is the only thing on a settled row that keeps full Ink. */
.rc-gap{color:var(--text);font-weight:600;}
.rc-muted{color:var(--text2);}
.rc-count{height:56px;padding:0 12px;flex:none;border-radius:12px;background:var(--surface);
          border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
          font-size:13px;font-weight:500;color:var(--text2);}
.rc-tick{width:52px;height:56px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.rc-tick.todo{background:var(--raised);border:1px solid var(--line);}
.rc-tick svg{width:28px;height:28px;}
.rc-hr{height:1px;background:var(--line);}
.rc-body{flex:1;}
/* Sticky rather than fixed: the bar has to stay with the list when the keyboard
   sheet is up, and a fixed footer would sit over the row under her finger. */
.rc-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);flex:none;}
.rc-prog{height:3px;background:var(--line);}
.rc-prog i{background:var(--sage);display:block;height:100%;}
.rc-footrow{display:flex;align-items:center;gap:12px;padding:10px 16px calc(var(--sa-bot) + 18px);}
.rc-tally{flex:1;min-width:0;}
.rc-tally b{font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.rc-tally b span{font-weight:400;font-size:15px;color:var(--text2);}
.rc-tally i{display:block;font-style:normal;font-size:13px;color:var(--text2);margin-top:-2px;}
.rc-cta{height:52px;padding:0 20px;border-radius:12px;flex:none;display:flex;align-items:center;
        justify-content:center;font-size:15px;font-weight:500;background:var(--raised);
        border:1px solid var(--line);color:var(--text2);}
.rc-cta.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.rc-cta.on:active{opacity:.86;}
/* One deliberate tap, not the picker's press-and-hold. Dispatch sends goods out
   of the building and the van leaves; here the box is open in front of her, so
   a mistap costs a recount rather than a consignment — and she is not wearing
   gloves. The weight belongs on the count she has already done fourteen times. */
.rc-big{height:56px;width:100%;border-radius:12px;background:var(--text);color:var(--bg);
        font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;}
.rc-big:active{opacity:.86;}
.rc-big[disabled]{background:var(--raised);border:1px solid var(--line);color:var(--text2);}
.rc-note{font-size:13px;color:var(--text2);line-height:1.45;}
.rc-err{margin:0 16px 12px;background:var(--brick-tint);border-radius:14px;padding:12px 16px;
        font-size:14px;color:var(--brick-ink);flex:none;}
.rc-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
          padding:0 40px 80px;text-align:center;}

/* ── Picking ────────────────────────────────────────────────────────────────
   The warehouse's half, drawn in design-handoff/warehouse-picking/. It shares
   the receiving ledger above — .rc-row, .rc-qty, .rc-cap, .rc-foot and the rest
   are the same rows in the same rhythm, which is the point: one warehouse, one
   list, two ends of the same movement. Only what picking has and receiving does
   not gets a class here. */
.pk-chips{display:flex;gap:8px;padding:0 16px 12px;flex:none;}
.pk-chip{flex:1;height:44px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
         color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;
         min-width:0;overflow:hidden;}
.pk-chip.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:500;}
.pk-chip .n{font-variant-numeric:tabular-nums;}
.pk-chip.on .n{opacity:.7;}
/* A labelled control, not a gesture — a new hire finds it by looking. */
.pk-short{height:56px;padding:0 12px;flex:none;border-radius:12px;background:var(--surface);
          border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
          font-size:13px;font-weight:500;color:var(--text2);}
.pk-alloc{display:flex;align-items:center;gap:10px;}
.pk-who{flex:1;min-width:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pk-ask{flex:none;font-size:13px;color:var(--text2);background:var(--raised);border-radius:999px;
        padding:4px 10px;font-variant-numeric:tabular-nums;}
/* Blank, never zero. Zero is an amount he chose; blank is an amount he has not. */
.pk-field{width:76px;height:48px;flex:none;border-radius:8px;background:var(--surface);
          border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
          font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;}
.pk-field.on{border-color:var(--text);}
.pk-rem{display:flex;align-items:baseline;gap:6px;margin-top:10px;}
.pk-rem b{font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.pk-rem span{font-size:15px;color:var(--text2);}
/* The weighty bit. A press-and-hold, not a tap: a cold thumb brushing the screen
   cannot move stock, and a hold works in gloves where a slider does not. */
.pk-hold{position:relative;width:100%;height:72px;border-radius:14px;overflow:hidden;
         border:1px solid var(--text);background:var(--surface);}
.pk-hold .lbl,.pk-hold .fill .lbl{position:absolute;inset:0;display:flex;align-items:center;
         justify-content:center;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;}
.pk-hold .lbl{color:var(--text);}
.pk-hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--text);overflow:hidden;
               transition:width .08s linear;}
.pk-hold .fill .lbl{color:var(--bg);width:100%;}
.pk-hold[disabled]{border-color:var(--line);background:var(--raised);}
.pk-hold[disabled] .lbl{color:var(--text2);}



/* ── Ask the kitchen ────────────────────────────────────────────────────────
   Tianhe asking the kitchen to MAKE something. No artboard was drawn for this
   one — the picking and receiving canvases cover the van, not the pot — so it
   borrows their ledger wholesale rather than inventing a third look. */
.ak-purpose{display:flex;gap:8px;padding:0 16px 12px;flex:none;}
.ak-opt{flex:1;min-height:64px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
        padding:10px 12px;text-align:left;color:var(--text2);}
.ak-opt.on{background:var(--text);border-color:var(--text);color:var(--bg);}
.ak-opt b{display:block;font-size:15px;font-weight:600;line-height:1.3;}
.ak-opt i{display:block;font-style:normal;font-size:13px;margin-top:2px;opacity:.75;line-height:1.35;}
.ak-step{display:flex;align-items:center;gap:2px;flex:none;}
.ak-step button{width:44px;height:44px;border-radius:12px;background:var(--raised);border:1px solid var(--line);
                display:flex;align-items:center;justify-content:center;color:var(--text);}
.ak-step button:disabled{opacity:.4;}
.ak-step button svg{width:18px;height:18px;}
.ak-step .n{width:48px;text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;}
.ak-search{padding:0 16px 10px;flex:none;}
.ak-search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
                 color:var(--text);padding:0 14px;font-size:15px;}

/* ── Stock home ─────────────────────────────────────────────────────────────
   The door. Counting, picking and receiving are three different jobs that
   happen to share one app, and until this existed the last two were reachable
   only by a card that appeared when work was due — so on a quiet day the
   features were invisible, nobody learned they existed, and nobody thought to
   look on the morning it mattered.
   The shape is the launcher the deleted /restock shell carried (a8064237, gone
   2026-08-04): greeting, then a tile per tool with a live count. The palette is
   not — that one was the retired lime brand. */
.sh-wrap{display:flex;flex-direction:column;min-height:calc(100vh - var(--sa-top));padding:8px 16px calc(var(--sa-bot) + 20px);}
.sh-greet{margin:4px 2px 18px;}
.sh-greet .g1{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sh-greet .g2{font-size:13px;color:var(--text2);margin-top:4px;font-variant-numeric:tabular-nums;}
.sh-grid{display:flex;flex-direction:column;gap:10px;}
.sh-tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
         background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
.sh-tile:active{background:var(--raised);}
.sh-ico{width:44px;height:44px;flex:none;border-radius:12px;background:var(--raised);
        display:flex;align-items:center;justify-content:center;color:var(--text2);}
.sh-ico svg{width:24px;height:24px;}
.sh-text{flex:1;min-width:0;}
.sh-name{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em;}
.sh-desc{font-size:13px;color:var(--text2);line-height:1.4;margin-top:2px;}
/* The count is the only thing on a tile that can hold full Ink, and it holds it
   only when there is work. "Nothing due" stays Graphite — a quiet tile is a
   finished one, and a zero dressed up as a badge is noise. */
.sh-n{font-size:13px;font-weight:600;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums;}
.sh-chev{flex:none;color:var(--text2);display:flex;}
.sh-chev svg{width:20px;height:20px;}

/* The entry into all of this, on the counting list. Cream, not Dusk: an arrival
   she can see through the door is not something Tacet did for her. */
/* Cream in BOTH states, and the in-transit one too. The flow's whole Dusk
   budget is the one card on the transit screen; spending it again out here
   would make the rarest colour on the phone the most common thing on it. The
   two states are told apart by what the line says, which is what she reads. */
.rc-entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
          background:var(--raised);border-radius:14px;padding:14px 16px;margin:0 0 12px;}
.rc-entry .t{flex:1;min-width:0;}
.rc-entry .t b{display:block;font-size:15px;font-weight:600;line-height:1.35;}
.rc-entry .t i{display:block;font-style:normal;font-size:13px;color:var(--text2);
               font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div id="app">
  <!-- One head: the page's name, the shelf you are counting, and the way out.
       The status line and the Dusk CTA slot stay empty (§1.7) — the chips carry
       every real number, and nothing is created on this page. -->
  <div class="page-head" id="pageHead" hidden>
    <!-- THE WAY BACK, and it belongs in the head rather than in the account
         sheet, where the first attempt put it. An operator who arrived here
         from their tool list is looking for the control every pushed screen on
         a phone has, in the place every one of them has it; a row three taps
         deep behind an avatar is not a way back, it is a fact about the app
         filed under settings. Hidden unless the server says there is a home to
         return to — see `home` in /quick-stock/context. -->
    <button class="backlink" id="backHome" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      <span id="backHomeLbl"></span>
    </button>
    <div class="headrow">
      <div class="headmain">
        <h1 id="hTitle"></h1>
        <div class="toolbar" id="toolbar" hidden>
          <button class="btn btn-store" id="storeBtn">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>
            <span class="nm" id="storeName">—</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <button class="avatar" id="acctBtn" hidden aria-label="Account"><span id="acctInitial">·</span></button>
    </div>
  </div>

  <div class="band" id="band" hidden>
    <div class="bandrow">
    <div class="searchwrap">
      <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search">
      <button class="q-clear" id="qClear" aria-label="Clear"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
      <button class="avatar" id="acctPinned" aria-label="Account" tabindex="-1"><span id="acctInitial2">·</span></button>
    </div>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all"><span class="lbl"></span> <span class="c" id="cAll">0</span></button>
      <button class="chip" data-filter="low"><span class="lbl"></span> <span class="c" id="cLow">0</span></button>
      <button class="chip" data-filter="out"><span class="lbl"></span> <span class="c" id="cOut">0</span></button>
    </div>
  </div>

  <main id="main">
    <div class="boot" id="bootScreen">
      <svg viewBox="0 0 340 110" fill="none" aria-hidden="true">
        <path d="M20 55 C30 15, 40 95, 50 55 C59 22, 68 88, 77 55 C85 30, 93 80, 101 55
                 C109 38, 117 72, 125 55 C133 44, 141 66, 149 55 C160 50, 171 60, 182 55
                 C215 55, 260 55, 305 55"
              stroke="currentColor" stroke-linecap="round"/>
        <circle cx="305" cy="55" r="5" fill="#6E67AF"/>
      </svg>
    </div>
  </main>
</div>

<div id="toast"></div>

<div class="sheet-back" id="storeBack"></div>
<div class="sheet" id="storeSheet">
  <div class="grabber"></div>
  <div class="sheet-h" id="storeSheetH"></div>
  <div id="sheetList"></div>
</div>

<!-- Account. The mark, who is signed in, the two preferences, and the way out.
     Language and appearance live here rather than in the chrome: three icon
     buttons for settings a staffer touches twice a year is rent, and rent is
     what this product stops paying. -->
<div class="sheet-back" id="acctBack"></div>
<div class="sheet" id="acctSheet">
  <div class="grabber"></div>
  <div class="sheet-mark"><svg class="mark" viewBox="0 0 340 110" fill="none" role="img" aria-label="tacet">
      <path d="M20 55 C30 15, 40 95, 50 55 C59 22, 68 88, 77 55 C85 30, 93 80, 101 55
               C109 38, 117 72, 125 55 C133 44, 141 66, 149 55 C160 50, 171 60, 182 55
               C215 55, 260 55, 305 55"
            stroke="currentColor" stroke-linecap="round"/>
      <circle cx="305" cy="55" r="5" fill="#6E67AF"/>
    </svg></div>
  <div class="sheet-h" id="acctWho"></div>
  <div class="srow">
    <span class="lbl" id="acctLangLbl"></span>
    <div class="seg" id="langSeg">
      <button data-lang="en">EN</button>
      <button data-lang="cn">中文</button>
    </div>
  </div>
  <div class="srow">
    <span class="lbl" id="acctThemeLbl"></span>
    <div class="seg" id="themeSeg">
      <button data-theme="light" id="thLight"></button>
      <button data-theme="dark" id="thDark"></button>
    </div>
  </div>
  <div class="sheet-cap" id="acctSync"></div>
  <div class="sheet-foot">
    <button class="btn btn-danger" id="signOutBtn"></button>
    <div id="signOutStep2" hidden style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-danger" id="signOutYes"></button>
      <button class="btn btn-secondary" id="signOutNo"></button>
    </div>
  </div>
</div>

<div class="sheet-back" id="kpBack"></div>
<div class="sheet" id="kpSheet">
  <div class="grabber"></div>
  <div class="kp">
    <div class="kp-head">
      <div class="kp-name" id="kpName"></div>
      <div class="kp-sub" id="kpSub"></div>
    </div>
    <div class="kp-display">
      <div class="kp-label" id="kpLabel"></div>
      <div class="kp-val num" id="kpVal">0</div>
    </div>
    <div class="kp-grid" id="kpGrid">
      <button class="kp-key" data-k="1">1</button>
      <button class="kp-key" data-k="2">2</button>
      <button class="kp-key" data-k="3">3</button>
      <button class="kp-key" data-k="4">4</button>
      <button class="kp-key" data-k="5">5</button>
      <button class="kp-key" data-k="6">6</button>
      <button class="kp-key" data-k="7">7</button>
      <button class="kp-key" data-k="8">8</button>
      <button class="kp-key" data-k="9">9</button>
      <button class="kp-key word" id="kpSoldKey" data-k="sold"></button>
      <button class="kp-key" data-k="0">0</button>
      <button class="kp-key" data-k="back" aria-label="Backspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>
    </div>
    <!-- Ink, not Dusk. A modal-weight sheet spends no Dusk: the operator is
         committing to their own count, and Dusk means tacet acted (§1.8 r5). -->
    <button class="kp-save" id="kpSave"></button>
  </div>
</div>
<!-- The short-pick sheet. Its own keypad again, for the same reason receiving
     has one: the fields here are an allocation across stores with a remainder
     that gates the save, which is a different machine from a single count. -->
<div class="sheet-back" id="pkBack"></div>
<div class="sheet" id="pkSheet">
  <div class="grabber"></div>
  <div class="kp">
    <div class="kp-head">
      <div class="kp-name" id="pkName"></div>
      <div class="kp-sub" id="pkSub"></div>
    </div>
    <div id="pkFound" style="display:flex;align-items:baseline;gap:10px;margin:10px 0 12px"></div>
    <div class="rc-hr"></div>
    <div class="rc-note" id="pkAssignLbl" style="margin:12px 0 8px"></div>
    <div id="pkRows" style="display:flex;flex-direction:column;gap:8px"></div>
    <!-- The remainder IS the explanation for the inactive button. It counts
         down, it never scolds, and there is no error message anywhere. -->
    <div class="pk-rem" id="pkRem"></div>
    <div class="kp-grid" id="pkGrid" style="margin-top:12px">
      <button class="kp-key" data-k="1">1</button>
      <button class="kp-key" data-k="2">2</button>
      <button class="kp-key" data-k="3">3</button>
      <button class="kp-key" data-k="4">4</button>
      <button class="kp-key" data-k="5">5</button>
      <button class="kp-key" data-k="6">6</button>
      <button class="kp-key" data-k="7">7</button>
      <button class="kp-key" data-k="8">8</button>
      <button class="kp-key" data-k="9">9</button>
      <button class="kp-key word" id="pkClear" data-k="clear"></button>
      <button class="kp-key" data-k="0">0</button>
      <button class="kp-key" data-k="back" aria-label="Backspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>
    </div>
    <button class="kp-save" id="pkSave"></button>
  </div>
</div>

<!-- Receiving's keypad. Its own sheet rather than a mode on the counting one:
     that keypad's Sold-out key, its label and its save verb are all quick-stock
     semantics, and receiving needs a "what the warehouse sent" reset key plus a
     live short/over readout beside the figure. Two sheets, no shared branches. -->
<div class="sheet-back" id="rcBack"></div>
<div class="sheet" id="rcSheet">
  <div class="grabber"></div>
  <div class="kp">
    <div class="kp-head">
      <div class="kp-name" id="rcName"></div>
      <div class="kp-sub" id="rcSub"></div>
    </div>
    <div class="kp-display">
      <!-- Neutral. Not "is this right?", not "confirm the quantity" — she is
           reporting what is in the box, not defending it. -->
      <div class="kp-label" id="rcLabel"></div>
      <div style="display:flex;align-items:baseline;gap:10px">
        <div class="kp-val num" id="rcVal">0</div>
        <div id="rcGap" style="font-size:15px;font-weight:600"></div>
      </div>
      <!-- Stated, not asked about. No reason field, no "why?", nothing that
           turns a count into a confession. -->
      <div class="rc-note" id="rcNote" style="margin-top:4px"></div>
    </div>
    <button class="kp-key word" id="rcAll" style="width:100%;margin-bottom:12px"></button>
    <div class="kp-grid" id="rcGrid">
      <button class="kp-key" data-k="1">1</button>
      <button class="kp-key" data-k="2">2</button>
      <button class="kp-key" data-k="3">3</button>
      <button class="kp-key" data-k="4">4</button>
      <button class="kp-key" data-k="5">5</button>
      <button class="kp-key" data-k="6">6</button>
      <button class="kp-key" data-k="7">7</button>
      <button class="kp-key" data-k="8">8</button>
      <button class="kp-key" data-k="9">9</button>
      <button class="kp-key word" id="rcClear" data-k="clear"></button>
      <button class="kp-key" data-k="0">0</button>
      <button class="kp-key" data-k="back" aria-label="Backspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>
    </div>
    <button class="kp-save" id="rcSave"></button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var API = '/api/retail-admin';

  // Language — shared with the rest of the admin suite on this host
  // (localStorage 'roots-admin-lang' = 'en' | 'cn'; default 'en'). Quick stock
  // renders ONE language, UI and product names together (§1.11) — never a
  // glued 'Orders · 订单'. The only pair on screen is the toggle itself.
  var LANG_KEY = 'roots-admin-lang';
  var lang = 'en';
  try { var s0 = localStorage.getItem(LANG_KEY); if (s0 === 'en' || s0 === 'cn') lang = s0; } catch (e) {}
  function t(en, cn) { return lang === 'cn' ? cn : en; }
  function pname(it) {
    var n = lang === 'cn' ? (it.name_cn || it.name_en) : (it.name_en || it.name_cn);
    return n || ('#' + it.id);
  }

  var state = {
    enabled: true, fullAccess: false, userName: '',
    home: null,           // server says where back goes, or that there is no back
    homeLabel: null,      // and what that screen is called, so Back can say it
    mode: 'recount',      // 'recount' (warehouse: set the count) | 'add' (kitchen: log what you made)
    stores: [], storeId: null,
    items: [],
    filter: 'all', q: '',
    pending: {},
    addQty: {},           // add mode: pending "to add" amount per product (never the shelf total)
    rowErr: {},           // per-product write failures — they live in the row, not in a toast
    loadErr: '',
    lastSync: null,
    sheet: null,          // 'store' | 'account' | 'keypad' — the poller stands down while one is open
    view: 'list',         // list | off | nostore | error
    errMsg: '',
  };
  var kp = { id: null, entry: null };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  // Toasts confirm; they never report a failure. A failed write renders in the
  // row the operator is looking at and stays there until they act on it (§1.12).
  var _tt;
  function toast(msg) {
    var el = $('#toast'); el.textContent = msg; el.className = 'show';
    clearTimeout(_tt); _tt = setTimeout(function () { el.className = ''; }, 2200);
  }

  function api(path, opts) {
    opts = opts || {};
    var o = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
    return fetch(path, o).then(function (r) {
      if (r.status === 401 || r.status === 403) {
        if (r.status === 401) { location.href = '/stock-login'; throw new Error('auth'); }
        return r.json().then(function (j) { throw new Error(j.error || 'forbidden'); });
      }
      return r.json().then(function (j) { if (!j.success) throw new Error(j.error || 'error'); return j.data; });
    });
  }

  function storeLabel(s) { return (lang === 'cn' ? (s.name_cn || s.name_en) : (s.name_en || s.name_cn)) || s.code || ('#' + s.id); }
  function lowFloor(it) { return it.restock_target != null && it.restock_target > 0 ? it.restock_target : 5; }
  function statusOf(it) { if (it.physical_qty <= 0) return 'out'; if (it.physical_qty <= lowFloor(it)) return 'low'; return 'ok'; }

  // Status colour encodes state and nothing else (§1.10). A well-stocked
  // product wears no pill at all: the count already says it, and 190 Sage pills
  // on one screen would be decoration, not information.
  function pillHtml(st) {
    if (st === 'out') return '<span class="pill p-brick">' + t('Sold out', '售罄') + '</span>';
    if (st === 'low') return '<span class="pill p-amber">' + t('Running low', '库存偏低') + '</span>';
    return '';
  }

  // 24-hour, built by hand. Never toLocaleTimeString — the operator's OS locale
  // decides that, so the same screen reads differently on two phones (§1.18).
  function clock(d) {
    if (!d) return '';
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  // Sort by SKU, not name. SKUs look like "<area>-<slot>" (e.g. 1-1, 1-10, 2-20,
  // 3-344) — compare both halves NUMERICALLY so 1-1 < 1-10 < 1-20 < 2-1 < 3-344,
  // not the string order that puts 1-10 before 1-2. Numeric SKUs sort first,
  // then any non-numeric SKUs (natural order), then items with no SKU.
  function skuParts(s) { var m = /^(\d+)-(\d+)/.exec(s || ''); return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null; }
  function skuCompare(a, b) {
    var sa = a.sku || '', sb = b.sku || '';
    if (!sa && !sb) return (a.name_en || a.name_cn || '').localeCompare(b.name_en || b.name_cn || '');
    if (!sa) return 1;
    if (!sb) return -1;
    var ka = skuParts(sa), kb = skuParts(sb);
    if (ka && kb) return (ka[0] - kb[0]) || (ka[1] - kb[1]) || sa.localeCompare(sb, undefined, { numeric: true });
    if (ka && !kb) return -1;
    if (!ka && kb) return 1;
    return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
  }

  function boot() {
    api(API + '/quick-stock/context').then(function (d) {
      state.enabled = d.enabled;
      state.mode = d.mode === 'add' ? 'add' : 'recount';
      state.fullAccess = d.user.full_access;
      state.home = typeof d.home === 'string' ? d.home : null;
      state.homeLabel = (d.home_label && (d.home_label.en || d.home_label.cn)) ? d.home_label : null;
      state.userName = d.user.name || '';
      state.stores = d.stores || [];
      mountAccount();
      if (!state.enabled) return showScreen('off');
      if (!state.stores.length) return showScreen('nostore');
      var last = parseInt(localStorage.getItem('qs_store') || '', 10);
      var pick = state.stores.filter(function (s) { return s.id === last; })[0] || state.stores[0];
      mountShell();
      selectStore(pick.id);
    }).catch(function (e) {
      if (e.message === 'auth') return;
      state.errMsg = e.message; mountAccount(); showScreen('error');
    });
  }

  // Fill every static label from the current language. Re-run on language flip.
  function applyLang() {
    var add = state.mode === 'add';
    document.documentElement.setAttribute('lang', lang === 'cn' ? 'zh' : 'en');
    $('#hTitle').textContent = add ? t('Add stock', '加库存') : t('Quick stock', '快速库存');
    $('#q').placeholder = t('Search products', '搜索商品');
    $('#storeSheetH').textContent = t('Choose store', '选择门店');
    $('#acctWho').textContent = state.userName
      ? t('Signed in as ' + state.userName, '已登录:' + state.userName)
      : t('Account', '账号');
    // Names its destination when the server told us what that is; otherwise the
    // honest generic, never a guess at the screen's name.
    var hl = state.homeLabel;
    $('#backHomeLbl').textContent = hl ? t(hl.en || hl.cn, hl.cn || hl.en) : t('Back', '返回');
    $('#acctLangLbl').textContent = t('Language', '语言');
    $('#acctThemeLbl').textContent = t('Appearance', '外观');
    $('#thLight').textContent = t('Light', '浅色');
    $('#thDark').textContent = t('Dark', '深色');
    $('#signOutBtn').textContent = t('Sign out', '退出登录');
    $('#signOutYes').textContent = t('Sign out', '退出登录');
    $('#signOutNo').textContent = t('Cancel', '取消');
    $('#kpLabel').textContent = add ? t('How many did you make?', '制作了多少?') : t('Set count', '设置数量');
    $('#kpSoldKey').textContent = add ? t('Clear', '清除') : t('Sold out', '售罄');
    $('#kpSave').textContent = add ? t('Add to stock', '加入库存') : t('Save', '保存');
    setChip('all', t('All', '全部'));
    setChip('low', t('Low', '偏低'));
    setChip('out', t('Out', '售罄'));
    paintSync();
    measureHead();
    if (state.storeId != null) {
      var s = state.stores.filter(function (x) { return x.id === state.storeId; })[0];
      $('#storeName').textContent = s ? storeLabel(s) : '—';
    }
  }
  function setChip(key, label) {
    var el = document.querySelector('.chip[data-filter="' + key + '"] .lbl');
    if (el) el.textContent = label;
  }
  function paintSync() {
    $('#acctSync').textContent = state.lastSync
      ? t('Updated ' + clock(state.lastSync), '更新于 ' + clock(state.lastSync)) : '';
  }

  function mountAccount() {
    var b = $('#acctBtn'), pinned = $('#acctPinned');
    b.hidden = false;
    var initial = (state.userName || '·').trim().charAt(0).toUpperCase() || '·';
    $('#acctInitial').textContent = initial;
    $('#acctInitial2').textContent = initial;
    b.onclick = openAccount;
    pinned.onclick = openAccount;
    $('#acctBack').onclick = closeAccount;
    // A location assignment rather than an <a> so the control is a button like
    // every other one in this head.
    var back = $('#backHome');
    back.hidden = !state.home;
    $('#pageHead').classList.toggle('has-back', !!state.home);
    back.onclick = function () { if (state.home) window.location.href = state.home; };
    $('#langSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-lang]'); if (!btn) return;
      setLang(btn.getAttribute('data-lang'));
    });
    $('#themeSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-theme]'); if (!btn) return;
      setTheme(btn.getAttribute('data-theme'));
    });
    $('#signOutBtn').onclick = function () { $('#signOutBtn').hidden = true; $('#signOutStep2').hidden = false; };
    $('#signOutNo').onclick = function () { $('#signOutStep2').hidden = true; $('#signOutBtn').hidden = false; };
    $('#signOutYes').onclick = logout;
    applyLang();
  }

  function mountShell() {
    state.view = 'list';
    $('#pageHead').hidden = false;
    $('#band').hidden = false;
    // Add mode hides the All/Low/Out chips — those count current stock, which
    // kitchen staff are deliberately never shown.
    $('#filters').style.display = state.mode === 'add' ? 'none' : '';
    // One store is not a choice. The picker self-hides rather than rendering a
    // dead control (§1.9, data precondition).
    var multi = state.stores.length > 1;
    $('#toolbar').hidden = !multi;
    if (multi) $('#storeBtn').onclick = openStoreSheet;
    applyLang();
    $('#q').addEventListener('input', function (e) {
      state.q = e.target.value.trim().toLowerCase();
      $('#qClear').classList.toggle('show', !!state.q);
      render();
    });
    $('#qClear').onclick = function () { clearSearch(); };
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
      c.onclick = function () { setFilter(c.getAttribute('data-filter')); };
    });
    $('#storeBack').onclick = closeStoreSheet;
    $('#kpGrid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-k]'); if (!b) return;
      var k = b.getAttribute('data-k');
      if (k === 'sold') kpSoldOut(); else if (k === 'back') kpBackspace(); else kpPress(k);
    });
    $('#kpSave').onclick = kpSave;
    $('#kpBack').onclick = closeKeypad;
    rcMount();
    pkMount();
    watchHead();
    startPolling();
  }

  // The head folds. Once it has scrolled out of the way the pinned band is the
  // whole chrome, so the account button appears in it — the operator is never
  // more than one tap from signing out, whatever the list is doing.
  // NOTHING is hidden or resized to achieve this: the head scrolls away on its
  // own and the button's space was reserved all along, so the page height never
  // changes and the list cannot jump under a counting finger.
  var headBottom = 0;
  function measureHead() {
    var head = $('#pageHead');
    headBottom = head.hidden ? 0 : head.offsetTop + head.offsetHeight;
  }
  function watchHead() {
    var pinned = $('#acctPinned'), on = null;
    function apply() {
      var want = headBottom > 0 && window.scrollY >= headBottom - 1;
      if (want === on) return;
      on = want;
      document.body.classList.toggle('compact', want);
      pinned.setAttribute('tabindex', want ? '0' : '-1');
    }
    // Two cheap things, deliberately: a CACHED threshold, because
    // offsetTop/offsetHeight force layout and doing that per scroll event on a
    // 250-row list is how a phone starts stuttering; and the work applied
    // STRAIGHT from the listener rather than inside requestAnimationFrame,
    // because a rAF that never runs leaves the fold stuck — headless Chrome
    // under a virtual clock produces no frames, and this suite went red half
    // the time until the rAF came out. There is no layout read left to defer.
    measureHead(); apply();
    addEventListener('scroll', apply, { passive: true });
    addEventListener('resize', function () { measureHead(); apply(); });
  }

  function setFilter(key) {
    state.filter = key;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (x) {
      x.classList.toggle('active', x.getAttribute('data-filter') === key);
    });
    render();
  }
  function clearSearch() {
    $('#q').value = ''; state.q = ''; $('#qClear').classList.remove('show'); render();
  }

  // Sign out. /stock serves both realms (kitchen users + backend operators), so
  // clear both — whichever isn't active is a harmless no-op — then hand off to
  // /stock-login, which picks the right login page by host.
  function logout() {
    var btn = $('#signOutYes');
    btn.setAttribute('disabled', '');                 // it writes, so it disables while it writes
    var opts = { method: 'POST', credentials: 'same-origin' };
    var done = function () { location.href = '/stock-login'; };
    dropDevicePush()
      .then(function () { return fetch('/api/auth/logout', opts).catch(function () {}); })
      .then(function () { return fetch('/api/backend/logout', opts).catch(function () {}); })
      .then(done, done);
  }

  // A Web Push subscription belongs to the browser + service worker, not to
  // the session, so clearing the session alone leaves new-order alerts landing
  // on a signed-out device. Drop it first, while the session that authorises
  // the unsubscribe still exists — both realms, same as the logouts above;
  // whichever isn't active 401s harmlessly. Then drop the local subscription
  // so the "Push to this device" toggle doesn't read back as on.
  function dropDevicePush() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistration().then(function (reg) {
      return (reg && reg.pushManager) ? reg.pushManager.getSubscription() : null;
    }).then(function (sub) {
      if (!sub) return null;
      var body = JSON.stringify({ endpoint: sub.endpoint });
      var post = function (url) {
        return fetch(url, {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: body
        }).catch(function () {});
      };
      return post('/api/push/unsubscribe')
        .then(function () { return post('/api/backend/push/unsubscribe'); })
        .then(function () { return sub.unsubscribe().catch(function () {}); });
    }).catch(function () {});
  }

  function setLang(next) {
    if (next !== 'en' && next !== 'cn') return;
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
    paintSeg();
    if (state.view === 'list') render();
    else showScreen(state.view);   // re-render an off/no-store/error screen in the new language
  }
  function setTheme(next) {
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('roots_theme', next); } catch (e) {}
    var m = $('#meta-theme-color'); if (m) m.setAttribute('content', next === 'light' ? '#FBF9F4' : '#111A2B');
    paintSeg();
  }
  function paintSeg() {
    var th = document.documentElement.getAttribute('data-theme');
    Array.prototype.forEach.call(document.querySelectorAll('#langSeg button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#themeSeg button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-theme') === th);
    });
  }

  function selectStore(id) {
    // Which transfers are inbound, and which run is waiting, both depend on
    // which shelf is on screen.
    setTimeout(function () { rcLoad(); pkLoad(); kqLoad(); }, 0);
    // See homeLand: a probe that never answers must not hold the app on a
    // decision it has not made.
    setTimeout(armLanding, 3500);
    state.storeId = id;
    localStorage.setItem('qs_store', String(id));
    var s = state.stores.filter(function (x) { return x.id === id; })[0];
    $('#storeName').textContent = s ? storeLabel(s) : '—';
    closeStoreSheet();
    state.items = []; state.rowErr = {};
    loadStock(false);
  }

  // ── Loading, and keeping the list current ──────────────────────────────
  // A Worklist updates itself: there is no refresh button and no live
  // indicator (A1). The list re-reads on a slow backstop and whenever the
  // phone comes back to the foreground, repaints in place, and stands down
  // while the operator is mid-count, searching, or has a sheet open (§1.12,
  // silent refresh).
  var POLL_MS = 60000;
  var pollTimer = null;

  function loadStock(silent) {
    if (!silent && !state.items.length) renderSkeleton();
    api(API + '/stores/' + state.storeId + '/stock').then(function (rows) {
      var mapped = rows.map(function (r) {
        return {
          id: r.product_id, name_en: r.name_en, name_cn: r.name_cn, sku: r.sku,
          physical_qty: r.physical_qty | 0,
          restock_target: r.restock_target != null ? r.restock_target : null
        };
      });
      mapped.sort(skuCompare);
      state.lastSync = new Date(); paintSync();
      state.loadErr = '';
      if (silent) return mergeQuiet(mapped);
      state.items = mapped; state.pending = {}; state.addQty = {}; state.rowErr = {};
      enterOnce = true;
      render();
    }).catch(function (e) {
      if (e.message === 'auth') return;
      state.loadErr = e.message || 'error';
      render();
    });
  }

  // A poll never overwrites a count the operator is still working on, and it
  // never re-renders the list when it doesn't have to — a full repaint under a
  // scrolled finger is the "everything jumps" failure the settle rules exist
  // to prevent.
  function mergeQuiet(rows) {
    var byId = {}, same = rows.length === state.items.length;
    state.items.forEach(function (it) { byId[it.id] = it; });
    rows.forEach(function (r, i) {
      var cur = byId[r.id];
      if (cur && (state.pending[r.id] || state.rowErr[r.id])) r.physical_qty = cur.physical_qty;
      if (same && (!state.items[i] || state.items[i].id !== r.id)) same = false;
    });
    state.items = rows;
    if (same) { paintCounts(); rows.forEach(function (r) { paintRow(r.id); }); }
    else render();
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollTick, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) pollTick(); });
    window.addEventListener('online', pollTick);
  }
  function canPoll() {
    if (document.hidden || state.view !== 'list' || state.storeId == null) return false;
    if (state.sheet) return false;
    if (document.activeElement === $('#q')) return false;
    var k;
    for (k in state.pending) if (Object.prototype.hasOwnProperty.call(state.pending, k)) return false;
    for (k in state.addQty) if (state.addQty[k] > 0) return false;
    for (k in state.rowErr) if (state.rowErr[k]) return false;
    return true;
  }
  function pollTick() { if (canPoll()) loadStock(true); }

  function counts() {
    var c = { all: state.items.length, low: 0, out: 0 };
    state.items.forEach(function (it) { var st = statusOf(it); if (st === 'out') c.out++; else if (st === 'low') c.low++; });
    return c;
  }
  function paintCounts() {
    var c = counts();
    $('#cAll').textContent = c.all; $('#cLow').textContent = c.low; $('#cOut').textContent = c.out;
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function filtered() {
    return state.items.filter(function (it) {
      if (state.filter === 'out' && statusOf(it) !== 'out') return false;
      if (state.filter === 'low' && statusOf(it) === 'ok') return false;
      if (state.q) {
        var hay = ((it.name_en || '') + ' ' + (it.name_cn || '') + ' ' + (it.sku || '')).toLowerCase();
        if (hay.indexOf(state.q) === -1) return false;
      }
      return true;
    });
  }

  var enterOnce = false;      // set by a real load; spent by the next render
  function render() {
    paintCounts();
    var main = $('#main'), html = '';
    if (state.loadErr) html += bannerHtml();
    if (!state.loadErr || state.items.length) {
      var list = filtered();
      html += list.length ? list.map(rowHtml).join('')
            : (state.items.length ? noResultHtml() : emptyHtml());
    }
    main.className = enterOnce ? 'enter' : '';
    enterOnce = false;
    // The way into Receiving rides above the shelf rather than beside it: a van
    // at the door outranks a recount, and it leaves the moment nothing is due.
    var ways = rcEntryHtml() + pkEntryHtml();
    main.innerHTML = (ways ? '<div style="padding:12px 16px 0">' + ways + '</div>' : '') + html;
    wireMain();
    rcWireEntry();
    pkWireEntry();
  }

  function itemById(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }

  function wireMain() {
    var main = $('#main');
    var reload = main.querySelector('[data-reload]');
    if (reload) reload.onclick = function () { state.loadErr = ''; render(); loadStock(false); };
    var clr = main.querySelector('[data-clear]');
    if (clr) clr.onclick = clearSearch;
    var all = main.querySelector('[data-all]');
    if (all) all.onclick = function () { setFilter('all'); };
    Array.prototype.forEach.call(main.querySelectorAll('.row'), function (row) {
      wireRow(parseInt(row.id.slice(4), 10));

  function wireRow(id) {
    var row = $('#row-' + id); if (!row) return;
    var dec = $('[data-dec="' + id + '"]', row), inc = $('[data-inc="' + id + '"]', row),
        open = $('[data-open="' + id + '"]', row), retry = $('[data-retry="' + id + '"]', row);
    if (state.mode === 'add') {
      if (dec) dec.onclick = function () { bumpAdd(id, -1); };
      if (inc) inc.onclick = function () { bumpAdd(id, +1); };
    } else {
      if (dec) dec.onclick = function () { bump(id, -1); };
      if (inc) inc.onclick = function () { bump(id, +1); };
    }
    if (open) open.onclick = function () { openKeypad(id); };
    if (retry) retry.onclick = function () { retryRow(id); };
  }

  // Repaint one card in place: the count, the pill, the disabled minus, the
  // in-flight line and any standing error. In place, because replacing the node
  // under a tapping finger is how a list starts jumping.
  function paintRow(id) {
    var it = itemById(id), row = $('#row-' + id); if (!it || !row) return;
    var add = state.mode === 'add';
    var q = row.querySelector('.qty');
    if (q) q.textContent = add ? ('+' + (state.addQty[id] || 0)) : it.physical_qty;
    var st = statusOf(it);
    row.classList.toggle('out', !add && st === 'out');
    row.classList.toggle('saving', !!state.pending[id]);
    var head = row.querySelector('.r-head'), pill = row.querySelector('.pill');
    var want = add ? '' : pillHtml(st);
    if ((pill ? pill.outerHTML : '') !== want) {
      if (pill) pill.parentNode.removeChild(pill);
      if (want) head.insertAdjacentHTML('beforeend', want);
    }
    var minus = row.querySelector('.minus');
    if (minus) {
      var off = add ? (state.addQty[id] || 0) <= 0 : it.physical_qty <= 0;
      if (off) minus.setAttribute('disabled', ''); else minus.removeAttribute('disabled');
    }
    var fl = row.querySelector('[data-flight]');
    if (fl) fl.textContent = state.pending[id]
      ? (add ? t('Adding', '添加中') : t('Saving', '保存中')) : '';
    var err = row.querySelector('[data-err]');
    if (err) err.parentNode.removeChild(err);
    if (state.rowErr[id]) { row.insertAdjacentHTML('beforeend', errHtml(id)); wireRow(id); }
  }
  function paintAddRow(id) { paintRow(id); }

  function retryRow(id) {
    var e = state.rowErr[id]; if (!e) return;
    state.rowErr[id] = null; delete state.rowErr[id];
    if (state.mode === 'add') { paintRow(id); flushAdd(id); return; }
    setQty(id, e.qty, true);
  }

  // ── Writes ─────────────────────────────────────────────────────────────
  // Every write says so while it runs and reports its own failure in place.
  // The steppers stay live through it: the count is an ABSOLUTE set, so a
  // second tap replaces the first rather than double-submitting it, and
  // freezing the buttons mid-count would cost more than it protects.
  function bump(id, delta) {
    var it = itemById(id); if (!it) return;
    setQty(id, Math.max(0, it.physical_qty + delta), false);
  }

  function setQty(id, qty, immediate) {
    var it = itemById(id); if (!it) return;
    var p = state.pending[id];
    if (!p) p = state.pending[id] = { baseline: it.__base != null ? it.__base : it.physical_qty };
    it.__base = p.baseline;
    it.physical_qty = qty;
    p.qty = qty;
    if (state.rowErr[id]) delete state.rowErr[id];
    paintRow(id); paintCounts();
    clearTimeout(p.timer);
    if (immediate) flush(id);
    else p.timer = setTimeout(function () { flush(id); }, 550);
  }

  function flush(id) {
    var p = state.pending[id]; if (!p) return;
    var qty = p.qty, was = p.baseline;
    api(API + '/stores/' + state.storeId + '/stock/' + id, { method: 'PATCH', body: { physical_qty: qty, reason: 'adjust', note: 'quick-stock' } })
      .then(function () {
        delete state.pending[id];
        var it = itemById(id); if (it) it.__base = qty;
        paintRow(id); paintCounts();
      })
      .catch(function (e) {
        if (e.message === 'auth') return;
        // The shelf goes back to what the server holds — showing an unsaved
        // number as if it were stock is the dishonesty §1.17 forbids — and the
        // row says what happened and offers the count back.
        var it = itemById(id); if (it) { it.physical_qty = was; it.__base = was; }
        delete state.pending[id];
        state.rowErr[id] = { qty: qty, was: was, msg: e.message };
        paintRow(id); paintCounts();
      });
  }

  // ── Add mode: the stepper builds a "to add" amount, then commits it as one
  // delta after a short pause and resets to +0 (same muscle memory as recount,
  // but additive and never showing the shelf total). ──
  function bumpAdd(id, delta) {
    state.addQty[id] = Math.max(0, (state.addQty[id] || 0) + delta);
    if (state.rowErr[id]) delete state.rowErr[id];
    var p = state.pending[id] || (state.pending[id] = {});
    paintRow(id);
    clearTimeout(p.timer);
    p.timer = setTimeout(function () { flushAdd(id); }, 700);
  }

  function flushAdd(id) {
    var p = state.pending[id];
    if (p) clearTimeout(p.timer);
    var n = state.addQty[id] || 0;
    if (n <= 0) { delete state.pending[id]; paintRow(id); return; }
    var it = itemById(id);
    state.addQty[id] = 0;
    state.pending[id] = { add: n };
    paintRow(id);
    api(API + '/stores/' + state.storeId + '/stock/' + id, { method: 'PATCH', body: { delta: n, reason: 'kitchen_add', note: 'add-stock' } })
      .then(function () {
        if (it) it.physical_qty += n;
        delete state.pending[id];
        paintRow(id);
        toast(t('Added ' + n, '已加 ' + n + ' 件') + (it ? ' · ' + pname(it) : ''));
      })
      .catch(function (e) {
        if (e.message === 'auth') return;
        state.addQty[id] = (state.addQty[id] || 0) + n;   // hand the amount back so they can retry
        delete state.pending[id];
        state.rowErr[id] = { add: n, msg: e.message };
        paintRow(id);
      });
  }

  // ── Keypad · one bounded decision, one commit ──────────────────────────
  function openKeypad(id) {
    var it = itemById(id); if (!it) return;

  // Add mode shows the pending "to add" amount (not the shelf total) — typically
  // 0 — so the current count is never revealed.
  function kpCurrent() { if (state.mode === 'add') return state.addQty[kp.id] || 0; var it = itemById(kp.id); return it ? it.physical_qty : 0; }
  function renderKpVal() {
    var v = kp.entry !== null ? kp.entry : String(kpCurrent());

  // In add mode the bottom-left key is "Clear" (reset entry); in recount mode
  // it's "Sold out" (set the count to zero).
  function kpSoldOut() { kp.entry = ''; renderKpVal(); }
  function kpSave() {
    var id = kp.id, it = itemById(id);
    if (!it) { closeKeypad(); return; }
    if (state.mode === 'add') {
      var n = kp.entry !== null ? (parseInt(kp.entry, 10) || 0) : (state.addQty[id] || 0);
      state.addQty[id] = Math.max(0, n);
      closeKeypad();
      paintRow(id);
      if (state.addQty[id] > 0) flushAdd(id);   // typed entry commits immediately
      return;
    }
    var v = kp.entry !== null ? (parseInt(kp.entry, 10) || 0) : it.physical_qty;
    closeKeypad();
    if (v !== it.physical_qty) setQty(id, v, true);
  }
