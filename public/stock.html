    <div id="pkRows" style="display:flex;flex-direction:column;gap:8px"></div>
    <!-- The remainder IS the explanation for the inactive button. It counts
         down, it never scolds, and there is no error message anywhere. -->
    <div class="pk-rem" id="pkRem"></div>
    <div class="kp-grid" id="pkGrid" style="margin-top:12px">
      <button class="kp-key" data-k="1">1</button>
      <button class="kp-key" data-k="2">2</button>
      <button class="kp-key" data-k="3">3</button>
      <button class="kp-key" data-k="4">4</button>
      <button class="kp-key" data-k="5">5</button>
      <button class="kp-key" data-k="6">6</button>
      <button class="kp-key" data-k="7">7</button>
      <button class="kp-key" data-k="8">8</button>
      <button class="kp-key" data-k="9">9</button>
      <button class="kp-key word" id="pkClear" data-k="clear"></button>
      <button class="kp-key" data-k="0">0</button>
      <button class="kp-key" data-k="back" aria-label="Backspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>
    </div>
    <button class="kp-save" id="pkSave"></button>
  </div>
</div>

<!-- Receiving's keypad. Its own sheet rather than a mode on the counting one:
     that keypad's Sold-out key, its label and its save verb are all quick-stock
     semantics, and receiving needs a "what the warehouse sent" reset key plus a
     live short/over readout beside the figure. Two sheets, no shared branches. -->
<div class="sheet-back" id="rcBack"></div>
<div class="sheet" id="rcSheet">
  <div class="grabber"></div>
  <div class="kp">
    <div class="kp-head">
      <div class="kp-name" id="rcName"></div>
      <div class="kp-sub" id="rcSub"></div>
    </div>
    <div class="kp-display">
      <!-- Neutral. Not "is this right?", not "confirm the quantity" — she is
           reporting what is in the box, not defending it. -->
      <div class="kp-label" id="rcLabel"></div>
      <div style="display:flex;align-items:baseline;gap:10px">
        <div class="kp-val num" id="rcVal">0</div>
        <div id="rcGap" style="font-size:15px;font-weight:600"></div>
      </div>
      <!-- Stated, not asked about. No reason field, no "why?", nothing that
           turns a count into a confession. -->
      <div class="rc-note" id="rcNote" style="margin-top:4px"></div>
    </div>
    <button class="kp-key word" id="rcAll" style="width:100%;margin-bottom:12px"></button>
    <div class="kp-grid" id="rcGrid">
      <button class="kp-key" data-k="1">1</button>
      <button class="kp-key" data-k="2">2</button>
      <button class="kp-key" data-k="3">3</button>
      <button class="kp-key" data-k="4">4</button>
      <button class="kp-key" data-k="5">5</button>
      <button class="kp-key" data-k="6">6</button>
      <button class="kp-key" data-k="7">7</button>
      <button class="kp-key" data-k="8">8</button>
      <button class="kp-key" data-k="9">9</button>
      <button class="kp-key word" id="rcClear" data-k="clear"></button>
      <button class="kp-key" data-k="0">0</button>
      <button class="kp-key" data-k="back" aria-label="Backspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>
    </div>
    <button class="kp-save" id="rcSave"></button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var API = '/api/retail-admin';

  // Language — shared with the rest of the admin suite on this host
  // (localStorage 'roots-admin-lang' = 'en' | 'cn'; default 'en'). Quick stock
  // renders ONE language, UI and product names together (§1.11) — never a
  // glued 'Orders · 订单'. The only pair on screen is the toggle itself.
  var LANG_KEY = 'roots-admin-lang';
  var lang = 'en';
  try { var s0 = localStorage.getItem(LANG_KEY); if (s0 === 'en' || s0 === 'cn') lang = s0; } catch (e) {}
  function t(en, cn) { return lang === 'cn' ? cn : en; }
  function pname(it) {
    var n = lang === 'cn' ? (it.name_cn || it.name_en) : (it.name_en || it.name_cn);
    return n || ('#' + it.id);
  }

  var state = {
    enabled: true, fullAccess: false, userName: '',
    home: null,           // server says where back goes, or that there is no back
    homeLabel: null,      // and what that screen is called, so Back can say it
    mode: 'recount',      // 'recount' (warehouse: set the count) | 'add' (kitchen: log what you made)
    stores: [], storeId: null,
    items: [],
    filter: 'all', q: '',
    pending: {},
    addQty: {},           // add mode: pending "to add" amount per product (never the shelf total)
    rowErr: {},           // per-product write failures — they live in the row, not in a toast
    loadErr: '',
    lastSync: null,
    sheet: null,          // 'store' | 'account' | 'keypad' — the poller stands down while one is open
    view: 'list',         // list | off | nostore | error
    errMsg: '',
    // 'on' | 'off' | 'blocked' | 'needs-install' | 'unsupported' — the one word
    // three disagreeing sources reduce to. See NOTIFICATIONS below.
    push: 'unsupported', pushBusy: false,
  };
  var kp = { id: null, entry: null };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  // Toasts confirm; they never report a failure. A failed write renders in the
  // row the operator is looking at and stays there until they act on it (§1.12).
  var _tt;
  function toast(msg) {
    var el = $('#toast'); el.textContent = msg; el.className = 'show';
    clearTimeout(_tt); _tt = setTimeout(function () { el.className = ''; }, 2200);
  }

  function api(path, opts) {
    opts = opts || {};
    var o = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
    return fetch(path, o).then(function (r) {
      if (r.status === 401 || r.status === 403) {
        if (r.status === 401) { location.href = '/stock-login'; throw new Error('auth'); }
        return r.json().then(function (j) { throw new Error(j.error || 'forbidden'); });
      }
      return r.json().then(function (j) { if (!j.success) throw new Error(j.error || 'error'); return j.data; });
    });
  }

  function storeLabel(s) { return (lang === 'cn' ? (s.name_cn || s.name_en) : (s.name_en || s.name_cn)) || s.code || ('#' + s.id); }
  function lowFloor(it) { return it.restock_target != null && it.restock_target > 0 ? it.restock_target : 5; }
  function statusOf(it) { if (it.physical_qty <= 0) return 'out'; if (it.physical_qty <= lowFloor(it)) return 'low'; return 'ok'; }

  // Status colour encodes state and nothing else (§1.10). A well-stocked
  // product wears no pill at all: the count already says it, and 190 Sage pills
  // on one screen would be decoration, not information.
  function pillHtml(st) {
    if (st === 'out') return '<span class="pill p-brick">' + t('Sold out', '售罄') + '</span>';
    if (st === 'low') return '<span class="pill p-amber">' + t('Running low', '库存偏低') + '</span>';
    return '';
  }

  // 24-hour, built by hand. Never toLocaleTimeString — the operator's OS locale
  // decides that, so the same screen reads differently on two phones (§1.18).
  function clock(d) {
    if (!d) return '';
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  // Sort by SKU, not name. SKUs look like "<area>-<slot>" (e.g. 1-1, 1-10, 2-20,
  // 3-344) — compare both halves NUMERICALLY so 1-1 < 1-10 < 1-20 < 2-1 < 3-344,
  // not the string order that puts 1-10 before 1-2. Numeric SKUs sort first,
  // then any non-numeric SKUs (natural order), then items with no SKU.
  function skuParts(s) { var m = /^(\d+)-(\d+)/.exec(s || ''); return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null; }
  function skuCompare(a, b) {
    var sa = a.sku || '', sb = b.sku || '';
    if (!sa && !sb) return (a.name_en || a.name_cn || '').localeCompare(b.name_en || b.name_cn || '');
    if (!sa) return 1;
    if (!sb) return -1;
    var ka = skuParts(sa), kb = skuParts(sb);
    if (ka && kb) return (ka[0] - kb[0]) || (ka[1] - kb[1]) || sa.localeCompare(sb, undefined, { numeric: true });
    if (ka && !kb) return -1;
    if (!ka && kb) return 1;
    return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
  }

  function boot() {
    api(API + '/quick-stock/context').then(function (d) {
      state.enabled = d.enabled;
      state.mode = d.mode === 'add' ? 'add' : 'recount';
      state.fullAccess = d.user.full_access;
      state.home = typeof d.home === 'string' ? d.home : null;
      state.homeLabel = (d.home_label && (d.home_label.en || d.home_label.cn)) ? d.home_label : null;
      state.userName = d.user.name || '';
      // The operator's own language wins over this tablet's (audit M-01/M-02).
      // null means they have never chosen, and then the tablet's value stands.
      if (d.user.language === 'en' || d.user.language === 'cn') {
        if (d.user.language !== lang) setLang(d.user.language, true);
      }
      state.stores = d.stores || [];
      mountAccount();
      if (!state.enabled) return showScreen('off');
      if (!state.stores.length) return showScreen('nostore');
      var last = parseInt(localStorage.getItem('qs_store') || '', 10);
      var pick = state.stores.filter(function (s) { return s.id === last; })[0] || state.stores[0];
      mountShell();
      selectStore(pick.id);
    }).catch(function (e) {
      if (e.message === 'auth') return;
      state.errMsg = e.message; mountAccount(); showScreen('error');
    });
  }

  /* THE HEAD'S NAME FOLLOWS THE SCREEN, not the app. The counting list is the
     mode the operator is in — Quick stock, or Add stock for the kitchen — and
     that is what it has always said.

     THE LAUNCHER IS NOT THAT SCREEN. It offers Pick, Receive, Ask the kitchen
     and Ask for stock, it deliberately carries no counting tile at all (see THE
     STOCK HOME), and it is reached from More → Operations → Transfers. Titling
     it "Quick stock" named it after the one job it does not do, and after a door
     nobody opened to get here: a row named Transfers opened a screen called
     Quick stock. It takes the name of the door instead.

     A launcher with no transfer tiles is a kitchen account's — refused all of
     them at the route, holding only the queue — so it says what it holds. */
  function headTitle() {
    if (state.view === 'home') {
      return rc.on === true ? t('Transfers', '调拨') : t('Production', '生产');
    }
    if (state.view === 'logbatch') return t('Log a batch', '登记批次');
    return state.mode === 'add' ? t('Add stock', '加库存') : t('Quick stock', '快速库存');
  }

  // Fill every static label from the current language. Re-run on language flip.
  function applyLang() {
    var add = state.mode === 'add';
    document.documentElement.setAttribute('lang', lang === 'cn' ? 'zh' : 'en');
    $('#hTitle').textContent = headTitle();
    $('#q').placeholder = t('Search products', '搜索商品');
    $('#storeSheetH').textContent = t('Choose store', '选择门店');
    $('#acctWho').textContent = state.userName
      ? t('Signed in as ' + state.userName, '已登录:' + state.userName)
      : t('Account', '账号');
    // Names its destination when the server told us what that is; otherwise the
    // honest generic, never a guess at the screen's name.
    var hl = state.homeLabel;
    $('#backHomeLbl').textContent = hl ? t(hl.en || hl.cn, hl.cn || hl.en) : t('Back', '返回');
    $('#acctLangLbl').textContent = t('Language', '语言');
    $('#acctThemeLbl').textContent = t('Appearance', '外观');
    $('#acctPushLbl').textContent = t('Notifications', '通知');
    $('#pushOn').textContent = t('On', '开');
    $('#pushOff').textContent = t('Off', '关');
    paintPush();
    $('#thLight').textContent = t('Light', '浅色');
    $('#thDark').textContent = t('Dark', '深色');
    $('#signOutBtn').textContent = t('Sign out', '退出登录');
    $('#signOutYes').textContent = t('Sign out', '退出登录');
    $('#signOutNo').textContent = t('Cancel', '取消');
    $('#kpLabel').textContent = add ? t('How many did you make?', '制作了多少?') : t('Set count', '设置数量');
    $('#kpSoldKey').textContent = add ? t('Clear', '清除') : t('Sold out', '售罄');
    $('#kpSave').textContent = add ? t('Add to stock', '加入库存') : t('Save', '保存');
    setChip('all', t('All', '全部'));
    setChip('low', t('Low', '偏低'));
    setChip('out', t('Out', '售罄'));
    paintSync();
    measureHead();
    if (state.storeId != null) {
      var s = state.stores.filter(function (x) { return x.id === state.storeId; })[0];
      $('#storeName').textContent = s ? storeLabel(s) : '—';
    }
  }
  function setChip(key, label) {
    var el = document.querySelector('.chip[data-filter="' + key + '"] .lbl');
    if (el) el.textContent = label;
  }
  function paintSync() {
    $('#acctSync').textContent = state.lastSync
      ? t('Updated ' + clock(state.lastSync), '更新于 ' + clock(state.lastSync)) : '';
  }

  function mountAccount() {
    var b = $('#acctBtn'), pinned = $('#acctPinned');
    b.hidden = false;
    var initial = (state.userName || '·').trim().charAt(0).toUpperCase() || '·';
    $('#acctInitial').textContent = initial;
    $('#acctInitial2').textContent = initial;
    b.onclick = openAccount;
    pinned.onclick = openAccount;
    $('#acctBack').onclick = closeAccount;
    // A location assignment rather than an <a> so the control is a button like
    // every other one in this head.
    var back = $('#backHome');
    back.hidden = !state.home;
    $('#pageHead').classList.toggle('has-back', !!state.home);
    back.onclick = function () { if (state.home) window.location.href = state.home; };
    $('#langSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-lang]'); if (!btn) return;
      setLang(btn.getAttribute('data-lang'));
    });
    $('#themeSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-theme]'); if (!btn) return;
      setTheme(btn.getAttribute('data-theme'));
    });
    $('#pushSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-push]'); if (!btn) return;
      pushToggle(btn.getAttribute('data-push') === 'on');
    });
    // Read, never asked: this settles the switch's position from what the
    // browser and the server already know, and raises no permission sheet.
    pushRefresh();
    $('#signOutBtn').onclick = function () { $('#signOutBtn').hidden = true; $('#signOutStep2').hidden = false; };
    $('#signOutNo').onclick = function () { $('#signOutStep2').hidden = true; $('#signOutBtn').hidden = false; };
    $('#signOutYes').onclick = logout;
    applyLang();
  }

  function mountShell() {
    state.view = 'list';
    /* THE FIRST SCREEN IS THE ONLY SCREEN. Boot used to reveal the counting
       list — head, search band, chips, skeleton, then rows — and homeLand()
       replaced it a moment later with whatever the open was actually for. So
       everybody who arrived through a named door watched a list they had not
       asked for paint itself and vanish. Ash, on the Kitchen queue row: "it
       doesn't go smooth to the tool page, it blink and then land on the page."
       Nothing was broken by it and nothing was slower for it; it just made
       every deep link look like a mistake being corrected.

       So an open that NAMES its screen holds the boot logo until the landing is
       decided. The hold is appearance only — the context is already in, the
       shelf request is already out, and the screen it lands on is drawn from
       data that arrived while the logo was still up.

       A BARE OPEN IS NOT HELD, deliberately. Nothing in that URL says where it
       lands, so holding it would mean holding the counting list behind a probe
       that belongs to the launcher — a tax on the people who open this app to
       count, which is the one thing the launcher is not allowed to cost them.
       Their list still paints first and the launcher still lands over it. */
    _hold = !!homeDeep();
    if (!_hold) { $('#pageHead').hidden = false; $('#band').hidden = false; }
    // Add mode hides the All/Low/Out chips — those count current stock, which
    // kitchen staff are deliberately never shown.
    $('#filters').style.display = state.mode === 'add' ? 'none' : '';
    // One store is not a choice. The picker self-hides rather than rendering a
    // dead control (§1.9, data precondition).
    var multi = state.stores.length > 1;
    $('#toolbar').hidden = !multi;
    if (multi) $('#storeBtn').onclick = openStoreSheet;
    applyLang();
    $('#q').addEventListener('input', function (e) {
      state.q = e.target.value.trim().toLowerCase();
      $('#qClear').classList.toggle('show', !!state.q);
      render();
    });
    $('#qClear').onclick = function () { clearSearch(); };
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
      c.onclick = function () { setFilter(c.getAttribute('data-filter')); };
    });
    $('#storeBack').onclick = closeStoreSheet;
    $('#kpGrid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-k]'); if (!b) return;
      var k = b.getAttribute('data-k');
      if (k === 'sold') kpSoldOut(); else if (k === 'back') kpBackspace(); else kpPress(k);
    });
    $('#kpSave').onclick = kpSave;
    $('#kpBack').onclick = closeKeypad;
    rcMount();
    pkMount();
    watchHead();
    startPolling();
  }

  // The head folds. Once it has scrolled out of the way the pinned band is the
  // whole chrome, so the account button appears in it — the operator is never
  // more than one tap from signing out, whatever the list is doing.
  // NOTHING is hidden or resized to achieve this: the head scrolls away on its
  // own and the button's space was reserved all along, so the page height never
  // changes and the list cannot jump under a counting finger.
  var headBottom = 0;
  function measureHead() {
    var head = $('#pageHead');
    headBottom = head.hidden ? 0 : head.offsetTop + head.offsetHeight;
  }
  function watchHead() {
    var pinned = $('#acctPinned'), on = null;
    function apply() {
      var want = headBottom > 0 && window.scrollY >= headBottom - 1;
      if (want === on) return;
      on = want;
      document.body.classList.toggle('compact', want);
      pinned.setAttribute('tabindex', want ? '0' : '-1');
    }
    // Two cheap things, deliberately: a CACHED threshold, because
    // offsetTop/offsetHeight force layout and doing that per scroll event on a
    // 250-row list is how a phone starts stuttering; and the work applied
    // STRAIGHT from the listener rather than inside requestAnimationFrame,
    // because a rAF that never runs leaves the fold stuck — headless Chrome
    // under a virtual clock produces no frames, and this suite went red half
    // the time until the rAF came out. There is no layout read left to defer.
    measureHead(); apply();
    addEventListener('scroll', apply, { passive: true });
    addEventListener('resize', function () { measureHead(); apply(); });
  }

  function setFilter(key) {
    state.filter = key;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (x) {
      x.classList.toggle('active', x.getAttribute('data-filter') === key);
    });
    render();
  }
  function clearSearch() {
    $('#q').value = ''; state.q = ''; $('#qClear').classList.remove('show'); render();
  }

  // Sign out. /stock serves both realms (kitchen users + backend operators), so
  // clear both — whichever isn't active is a harmless no-op — then hand off to
  // /stock-login, which picks the right login page by host.
  function logout() {
    var btn = $('#signOutYes');
    btn.setAttribute('disabled', '');                 // it writes, so it disables while it writes
    var opts = { method: 'POST', credentials: 'same-origin' };
    var done = function () { location.href = '/stock-login'; };
    dropDevicePush()
      .then(function () { return fetch('/api/auth/logout', opts).catch(function () {}); })
      .then(function () { return fetch('/api/backend/logout', opts).catch(function () {}); })
      .then(done, done);
  }

  // A Web Push subscription belongs to the browser + service worker, not to
  // the session, so clearing the session alone leaves new-order alerts landing
  // on a signed-out device. Drop it first, while the session that authorises
  // the unsubscribe still exists — both realms, same as the logouts above;
  // whichever isn't active 401s harmlessly. Then drop the local subscription
  // so the "Push to this device" toggle doesn't read back as on.
  function dropDevicePush() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistration().then(function (reg) {
      return (reg && reg.pushManager) ? reg.pushManager.getSubscription() : null;
    }).then(function (sub) {
      if (!sub) return null;
      var body = JSON.stringify({ endpoint: sub.endpoint });
      var post = function (url) {
        return fetch(url, {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: body
        }).catch(function () {});
      };
      return post('/api/push/unsubscribe')
        .then(function () { return post('/api/backend/push/unsubscribe'); })
        .then(function () { return sub.unsubscribe().catch(function () {}); });
    }).catch(function () {});
  }

  // `fromAccount` is true only when this is ADOPTING the operator's stored
  // language, so that path does not echo the account's own value back.
  function setLang(next, fromAccount) {
    if (next !== 'en' && next !== 'cn') return;
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    // ── And on the PERSON (audit M-01 / M-02) ────────────────────────────
    // This screen is the one most often run on a SHARED tablet, which is the
    // exact case the finding names. Fire-and-forget, after the language is
    // already applied and remembered here: a failure means it does not follow
    // them to the next device, and must never interrupt a toggle.
    if (!fromAccount) {
      try {
        fetch('/api/backend/language', {
          method: 'PUT', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: lang }),
        }).catch(function () {});
      } catch (e) {}
    }
    applyLang();
    paintSeg();
    if (state.view === 'list') render();
    else showScreen(state.view);   // re-render an off/no-store/error screen in the new language
  }
  function setTheme(next) {
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('roots_theme', next); } catch (e) {}
    var m = $('#meta-theme-color'); if (m) m.setAttribute('content', next === 'light' ? '#FBF9F4' : '#111A2B');
    paintSeg();
  }
  /* ══ NOTIFICATIONS ═════════════════════════════════════════════════════════
     A pick waiting, a delivery on its way, a request the kitchen has to make —
     the server addresses all three to the operators who hold the capability
     (routes/restock.js PUSH_AUDIENCE). It can only reach a device that ENROLLED,
     and enrolment lived in one place: Tacet Mobile, Profile → Notifications.
     The kitchen role and the shelf clerk are stock-app-only — server.js refuses
     them /m outright — so the two roles this app exists for were the two that
     could never switch alerts on. They were not muted; they were unreachable.

     TWO REALMS, ONE SWITCH. /stock is served to Tacet operators (tenant_users,
     /api/backend/push/*) and to the kitchen realm (users, /api/push/*), and a
     subscription is keyed to whichever login enrolled it. The realm is not
     guessed from the screen: the backend pref endpoint 401s a session that is
     not one, and that answer chooses the endpoint set for everything after.

     NOTHING HAPPENS UNPROMPTED. No permission sheet on boot — browsers punish
     that, and an operator who never asked for alerts should not meet one. The
     switch is the ask. */
  var PUSH_OK = ('serviceWorker' in navigator) && ('PushManager' in window)
             && ('Notification' in window) && window.isSecureContext;
  // iOS gives Web Push to INSTALLED apps only — no PushManager in Safari until
  // the app is on the home screen (16.4+). Worth its own words: the operator is
  // three taps from being able to, not permanently locked out.
  var PUSH_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '')
              || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
  var PUSH_STANDALONE = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
                     || window.navigator.standalone === true;
  var PUSH_API = null;              // resolved once: the realm's endpoint set
  var BACKEND_PUSH = { vapid: '/api/backend/push/vapid', sub: '/api/backend/push/subscribe',
                       unsub: '/api/backend/push/unsubscribe', pref: '/api/backend/push/pref' };
  var KITCHEN_PUSH = { vapid: '/api/push/vapid-key', sub: '/api/push/subscribe',
                       unsub: '/api/push/unsubscribe', pref: '/api/push/pref' };

  // Its own fetch, for the reason the context one has its own: this runs at boot
  // and a background call must never throw a signed-in phone at a login page.
  function pushFetch(path, body) {
    var o = { credentials: 'same-origin' };
    if (body !== undefined) {
      o.method = 'POST'; o.headers = { 'Content-Type': 'application/json' }; o.body = JSON.stringify(body);
    }
    return fetch(path, o).then(function (r) {
      if (!r.ok) return null;
      return r.json().catch(function () { return {}; });
    }).catch(function () { return null; });
  }
  function pushReg() {
    if (!PUSH_OK) return Promise.resolve(null);
    return navigator.serviceWorker.getRegistration()
      .then(function (r) {
        return r ? navigator.serviceWorker.ready
                 : navigator.serviceWorker.register('/sw.js', { scope: '/' })
                     .then(function () { return navigator.serviceWorker.ready; });
      }).catch(function () { return null; });
  }
  function pushSub() {
    return pushReg().then(function (r) {
      return (r && r.pushManager) ? r.pushManager.getSubscription() : null;
    }).catch(function () { return null; });
  }
  function b64ToU8(b64) {
    var pad = new Array((4 - b64.length % 4) % 4 + 1).join('=');
    var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var arr = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  // The realm probe. A 200 from the operator pref endpoint means this session is
  // a Tacet operator; a 401 means it is the kitchen login, which has its own set.
  function pushRealm() {
    if (PUSH_API) return Promise.resolve(PUSH_API);
    return fetch(BACKEND_PUSH.pref, { credentials: 'same-origin' })
      .then(function (r) { PUSH_API = r.ok ? BACKEND_PUSH : KITCHEN_PUSH; return PUSH_API; })
      .catch(function () { PUSH_API = KITCHEN_PUSH; return PUSH_API; });
  }
  /* Three sources that can disagree, reduced to one word — and the STORED intent
     wins. A live subscription reads back as "on" for an operator who switched it
     off on another page, because one service worker at scope '/' serves every
     login on this device. */
  function pushRefresh() {
    if (!PUSH_OK) { state.push = PUSH_IOS && !PUSH_STANDALONE ? 'needs-install' : 'unsupported'; paintPush(); return Promise.resolve(); }
    if (Notification.permission === 'denied') { state.push = 'blocked'; paintPush(); return Promise.resolve(); }
    return pushRealm().then(function (api) {
      return Promise.all([pushSub(), pushFetch(api.pref)]);
    }).then(function (res) {
      var sub = res[0], pref = res[1];
      var wanted = !pref || pref.enabled !== false;
      state.push = (wanted && sub && Notification.permission === 'granted') ? 'on' : 'off';
      // Permission granted, alerts wanted, no live subscription: endpoints
      // rotate and browsers drop them. Re-enrol silently — asking again for an
      // answer already given is asking twice.
      if (state.push === 'off' && wanted && Notification.permission === 'granted' && !sub) {
        return pushEnrol(true).then(function () { state.push = 'on'; paintPush(); },
                                    function () { paintPush(); });
      }
      paintPush();
    }).catch(function () {});
  }
  // `silent` is that re-enrolment: it must never raise a permission sheet.
  function pushEnrol(silent) {
    return pushRealm().then(function (api) {
      return pushFetch(api.vapid).then(function (v) {
        if (!v || !v.enabled || !v.publicKey) return Promise.reject(new Error('disabled'));
        return (Notification.permission === 'granted'
                  ? Promise.resolve('granted')
                  : (silent ? Promise.reject(new Error('denied')) : Notification.requestPermission()))
          .then(function (perm) {
            if (perm !== 'granted') return Promise.reject(new Error('denied'));
            return pushReg().then(function (reg) {
              if (!reg || !reg.pushManager) return Promise.reject(new Error('nosw'));
              return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(v.publicKey) });
            });
          })
          .then(function (sub) {
            var j = sub.toJSON();
            return pushFetch(api.sub, { endpoint: j.endpoint, keys: j.keys }).then(function (r) {
              if (!r) return Promise.reject(new Error('save'));
              // An explicit yes lifts the stored mute, including the one taken
              // out alongside it on this same device.
              return pushFetch(api.pref, { enabled: true, endpoint: j.endpoint });
            });
          });
      });
    });
  }
  function pushDrop() {
    // The intent is recorded FIRST and independently of the browser: if the
    // subscription has gone missing the switch must still mean off.
    return pushRealm().then(function (api) {
      return pushSub().then(function (sub) {
        var ep = sub ? sub.endpoint : null;
        return pushFetch(api.pref, { enabled: false, endpoint: ep }).then(function () {
          if (!sub) return null;
          return sub.unsubscribe().catch(function () {})
            .then(function () { return pushFetch(api.unsub, { endpoint: ep }); });
        });
      });
    });
  }
  function pushToggle(next) {
    if (state.pushBusy) return;
    if (next === (state.push === 'on')) return;
    state.pushBusy = true; paintPush();
    var work = next ? pushEnrol(false) : pushDrop();
    work.then(function () { state.push = next ? 'on' : 'off'; },
              function () { if (PUSH_OK && Notification.permission === 'denied') state.push = 'blocked'; })
        .then(function () { state.pushBusy = false; pushRefresh(); });
  }
  function paintPush() {
    var row = $('#pushRow'); if (!row) return;
    row.hidden = false;
    var usable = state.push === 'on' || state.push === 'off';
    $('#pushSeg').hidden = !usable;
    var note = $('#pushNote');
    note.hidden = usable;
    note.textContent = state.push === 'needs-install' ? t('Add to home screen', '请先添加到主屏幕')
                     : state.push === 'blocked'       ? t('Blocked in the browser', '浏览器已禁止')
                     : t('Unavailable', '不可用');
    Array.prototype.forEach.call(document.querySelectorAll('#pushSeg button'), function (b) {
      b.classList.toggle('on', (b.getAttribute('data-push') === 'on') === (state.push === 'on'));
      if (state.pushBusy) b.setAttribute('disabled', ''); else b.removeAttribute('disabled');
    });
  }

  function paintSeg() {
    var th = document.documentElement.getAttribute('data-theme');
    Array.prototype.forEach.call(document.querySelectorAll('#langSeg button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#themeSeg button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-theme') === th);
    });
    paintPush();
  }

  function selectStore(id) {
    // Which transfers are inbound, and which run is waiting, both depend on
    // which shelf is on screen.
    /* krLoad is NOT one of the landing probes, deliberately. PROBE_COUNT gates
       which screen this app opens on, and the ready list decides nothing about
       that — it is behind rc.on like Pick and Receive. Counting it would hold
       the landing on an answer it does not need, and a slow one would leave
       somebody staring at nothing. It repaints the launcher when it arrives. */
    setTimeout(function () { rcLoad(); pkLoad(); kqLoad(); krLoad(); }, 0);
    // See homeLand: a probe that never answers must not hold the app on a
    // decision it has not made.
    setTimeout(armLanding, 3500);
    state.storeId = id;
    localStorage.setItem('qs_store', String(id));
    var s = state.stores.filter(function (x) { return x.id === id; })[0];
    $('#storeName').textContent = s ? storeLabel(s) : '—';
    closeStoreSheet();
    state.items = []; state.rowErr = {};
    loadStock(false);
  }

  // ── Loading, and keeping the list current ──────────────────────────────
  // A Worklist updates itself: there is no refresh button and no live
  // indicator (A1). The list re-reads on a slow backstop and whenever the
  // phone comes back to the foreground, repaints in place, and stands down
  // while the operator is mid-count, searching, or has a sheet open (§1.12,
  // silent refresh).
  var POLL_MS = 60000;
  var pollTimer = null;

  function loadStock(silent) {
    if (!silent && !state.items.length) renderSkeleton();
    api(API + '/stores/' + state.storeId + '/stock').then(function (rows) {
      var mapped = rows.map(function (r) {
        return {
          id: r.product_id, name_en: r.name_en, name_cn: r.name_cn, sku: r.sku,
          physical_qty: r.physical_qty | 0,
          restock_target: r.restock_target != null ? r.restock_target : null
        };
      });
      mapped.sort(skuCompare);
      state.lastSync = new Date(); paintSync();
      state.loadErr = '';
      if (silent) return mergeQuiet(mapped);
      state.items = mapped; state.pending = {}; state.addQty = {}; state.rowErr = {};
      enterOnce = true;
      render();
    }).catch(function (e) {
      if (e.message === 'auth') return;
      state.loadErr = e.message || 'error';
      render();
    });
  }

  // A poll never overwrites a count the operator is still working on, and it
  // never re-renders the list when it doesn't have to — a full repaint under a
  // scrolled finger is the "everything jumps" failure the settle rules exist
  // to prevent.
  function mergeQuiet(rows) {
    var byId = {}, same = rows.length === state.items.length;
    state.items.forEach(function (it) { byId[it.id] = it; });
    rows.forEach(function (r, i) {
      var cur = byId[r.id];
      if (cur && (state.pending[r.id] || state.rowErr[r.id])) r.physical_qty = cur.physical_qty;
      if (same && (!state.items[i] || state.items[i].id !== r.id)) same = false;
    });
    state.items = rows;
    if (same) { paintCounts(); rows.forEach(function (r) { paintRow(r.id); }); }
    else render();
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollTick, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) pollTick(); });
    window.addEventListener('online', pollTick);
  }
  function canPoll() {
    if (document.hidden || state.view !== 'list' || state.storeId == null) return false;
    if (state.sheet) return false;
    if (document.activeElement === $('#q')) return false;
    var k;
    for (k in state.pending) if (Object.prototype.hasOwnProperty.call(state.pending, k)) return false;
    for (k in state.addQty) if (state.addQty[k] > 0) return false;
    for (k in state.rowErr) if (state.rowErr[k]) return false;
    return true;
  }
  function pollTick() { if (canPoll()) loadStock(true); }

  function counts() {
    var c = { all: state.items.length, low: 0, out: 0 };
    state.items.forEach(function (it) { var st = statusOf(it); if (st === 'out') c.out++; else if (st === 'low') c.low++; });
    return c;
  }
  function paintCounts() {
    var c = counts();
    $('#cAll').textContent = c.all; $('#cLow').textContent = c.low; $('#cOut').textContent = c.out;
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function filtered() {
    return state.items.filter(function (it) {
      if (state.filter === 'out' && statusOf(it) !== 'out') return false;
      if (state.filter === 'low' && statusOf(it) === 'ok') return false;
      if (state.q) {
        var hay = ((it.name_en || '') + ' ' + (it.name_cn || '') + ' ' + (it.sku || '')).toLowerCase();
        if (hay.indexOf(state.q) === -1) return false;
      }
      return true;
    });
  }

  var enterOnce = false;      // set by a real load; spent by the next render
  function render() {
    // Held: a ?go= open is still on the boot screen and this list is not what
    // it was opened for (see THE FIRST SCREEN IS THE ONLY SCREEN). What was
    // swallowed is remembered, not lost — holdEnd repaints it if the landing
    // comes back here after all.
    if (_hold) { _heldPaint = 'list'; return; }
    paintCounts();
    var main = $('#main'), html = '';
    if (state.loadErr) html += bannerHtml();
    if (!state.loadErr || state.items.length) {
      var list = filtered();
      html += list.length ? list.map(rowHtml).join('')
            : (state.items.length ? noResultHtml() : emptyHtml());
    }
    main.className = enterOnce ? 'enter' : '';
    enterOnce = false;
    // The way into Receiving rides above the shelf rather than beside it: a van
    // at the door outranks a recount, and it leaves the moment nothing is due.
    var ways = rcEntryHtml() + pkEntryHtml();
    main.innerHTML = (ways ? '<div style="padding:12px 16px 0">' + ways + '</div>' : '') + html;
    wireMain();
    rcWireEntry();
    pkWireEntry();
  }

  function renderSkeleton() {
    if (_hold) { _heldPaint = 'skel'; return; }
    var one = '<div class="skel"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>';
    $('#main').innerHTML = new Array(7).join(one);
  }

  // Empty names what will arrive and pays a small compliment; no-results names
  // what is filtering and offers to clear it. They are different states with
  // different sentences, and a page that filters ships both (§1.12).
  function emptyHtml() {
    return '<div class="note">' +
      '<p>' + t('Nothing to count here yet.', '这里还没有需要盘点的商品。') + '</p>' +
      '<p>' + t('Products added in the back office settle in here.', '在后台添加的商品会出现在这里。') + '</p>' +
      '<svg class="flat" viewBox="0 0 120 2" aria-hidden="true"><path d="M0 1h120" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
      '</div>';
  }
  function noResultHtml() {
    var line, action;
    if (state.q) {
      line = t('No products match “' + esc(state.q) + '”.', '没有匹配“' + esc(state.q) + '”的商品。');
      action = '<button class="btn btn-secondary" data-clear>' + t('Clear search', '清除搜索') + '</button>';
    } else {
      line = state.filter === 'out'
        ? t('No products are sold out.', '没有售罄的商品。')
        : t('No products are running low.', '没有库存偏低的商品。');
      action = '<button class="btn btn-secondary" data-all>' + t('Show all', '显示全部') + '</button>';
    }
    return '<div class="note"><p>' + line + '</p>' + action + '</div>';
  }
  function bannerHtml() {
    return '<div class="banner">' +
      '<b>' + t('The shelf didn’t load.', '库存没有加载出来。') + '</b>' +
      '<span>' + t('Check the connection, then try again.', '请检查网络后重试。') + '</span>' +
      '<button class="btn btn-danger" data-reload>' + t('Try again', '重试') + '</button>' +
      '</div>';
  }

  var ICO_MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  var ICO_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  function stepperHtml(it, value, minusOff) {
    return '<div class="stepper">' +
      '<button class="minus" data-dec="' + it.id + '"' + (minusOff ? ' disabled' : '') + ' aria-label="' + t('Minus', '减') + '">' + ICO_MINUS + '</button>' +
      '<button class="qty num" data-open="' + it.id + '">' + value + '</button>' +
      '<button class="plus" data-inc="' + it.id + '" aria-label="' + t('Plus', '加') + '">' + ICO_PLUS + '</button>' +
      '</div>';
  }
  function flightHtml(id) {
    var p = state.pending[id];
    if (!p) return '<div class="r-flight" data-flight></div>';
    return '<div class="r-flight" data-flight>' +
      (state.mode === 'add' ? t('Adding', '添加中') : t('Saving', '保存中')) + '</div>';
  }
  function errHtml(id) {
    var e = state.rowErr[id];
    if (!e) return '';
    var msg = state.mode === 'add'
      ? t('Didn’t add. Nothing changed.', '未添加,库存未变。')
      : t('Didn’t save. The shelf still shows ' + e.was + '.', '未保存,库存仍为 ' + e.was + '。');
    return '<div class="r-err" data-err>' + msg +
      '<button class="retry" data-retry="' + id + '">' + t('Retry', '重试') + '</button></div>';
  }

  function rowHtml(it) {
    var busy = !!state.pending[it.id];
    // Add mode: the same card and the same stepper, but the number is how many
    // you are adding (starts +0). The shelf total is never rendered.
    if (state.mode === 'add') {
      var n0 = state.addQty[it.id] || 0;
      return '<div class="row' + (busy ? ' saving' : '') + '" id="row-' + it.id + '">' +
        '<div class="r-head"><div class="r-name">' + esc(pname(it)) + '</div></div>' +
        '<div class="r-sku num">' + (it.sku ? esc(it.sku) : '#' + it.id) + '</div>' +
        stepperHtml(it, '+' + n0, n0 <= 0) +
        flightHtml(it.id) + errHtml(it.id) +
        '</div>';
    }
    var st = statusOf(it);
    return '<div class="row' + (st === 'out' ? ' out' : '') + (busy ? ' saving' : '') + '" id="row-' + it.id + '">' +
      '<div class="r-head">' +
        '<div class="r-name">' + esc(pname(it)) + '</div>' + pillHtml(st) +
      '</div>' +
      '<div class="r-sku num">' + (it.sku ? esc(it.sku) : '#' + it.id) + '</div>' +
      stepperHtml(it, it.physical_qty, it.physical_qty <= 0) +
      flightHtml(it.id) + errHtml(it.id) +
      '</div>';
  }

  function itemById(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }

  function wireMain() {
    var main = $('#main');
    var reload = main.querySelector('[data-reload]');
    if (reload) reload.onclick = function () { state.loadErr = ''; render(); loadStock(false); };
    var clr = main.querySelector('[data-clear]');
    if (clr) clr.onclick = clearSearch;
    var all = main.querySelector('[data-all]');
    if (all) all.onclick = function () { setFilter('all'); };
    Array.prototype.forEach.call(main.querySelectorAll('.row'), function (row) {
      wireRow(parseInt(row.id.slice(4), 10));
    });
  }

  function wireRow(id) {
    var row = $('#row-' + id); if (!row) return;
    var dec = $('[data-dec="' + id + '"]', row), inc = $('[data-inc="' + id + '"]', row),
        open = $('[data-open="' + id + '"]', row), retry = $('[data-retry="' + id + '"]', row);
    if (state.mode === 'add') {
      if (dec) dec.onclick = function () { bumpAdd(id, -1); };
      if (inc) inc.onclick = function () { bumpAdd(id, +1); };
    } else {
      if (dec) dec.onclick = function () { bump(id, -1); };
      if (inc) inc.onclick = function () { bump(id, +1); };
    }
    if (open) open.onclick = function () { openKeypad(id); };
    if (retry) retry.onclick = function () { retryRow(id); };
  }

  // Repaint one card in place: the count, the pill, the disabled minus, the
  // in-flight line and any standing error. In place, because replacing the node
  // under a tapping finger is how a list starts jumping.
  function paintRow(id) {
    var it = itemById(id), row = $('#row-' + id); if (!it || !row) return;
    var add = state.mode === 'add';
    var q = row.querySelector('.qty');
    if (q) q.textContent = add ? ('+' + (state.addQty[id] || 0)) : it.physical_qty;
    var st = statusOf(it);
    row.classList.toggle('out', !add && st === 'out');
    row.classList.toggle('saving', !!state.pending[id]);
    var head = row.querySelector('.r-head'), pill = row.querySelector('.pill');
    var want = add ? '' : pillHtml(st);
    if ((pill ? pill.outerHTML : '') !== want) {
      if (pill) pill.parentNode.removeChild(pill);
      if (want) head.insertAdjacentHTML('beforeend', want);
    }
    var minus = row.querySelector('.minus');
    if (minus) {
      var off = add ? (state.addQty[id] || 0) <= 0 : it.physical_qty <= 0;
      if (off) minus.setAttribute('disabled', ''); else minus.removeAttribute('disabled');
    }
    var fl = row.querySelector('[data-flight]');
    if (fl) fl.textContent = state.pending[id]
      ? (add ? t('Adding', '添加中') : t('Saving', '保存中')) : '';
    var err = row.querySelector('[data-err]');
    if (err) err.parentNode.removeChild(err);
    if (state.rowErr[id]) { row.insertAdjacentHTML('beforeend', errHtml(id)); wireRow(id); }
  }
  function paintAddRow(id) { paintRow(id); }

  function retryRow(id) {
    var e = state.rowErr[id]; if (!e) return;
    state.rowErr[id] = null; delete state.rowErr[id];
    if (state.mode === 'add') { paintRow(id); flushAdd(id); return; }
    setQty(id, e.qty, true);
  }

  // ── Writes ─────────────────────────────────────────────────────────────
  // Every write says so while it runs and reports its own failure in place.
  // The steppers stay live through it: the count is an ABSOLUTE set, so a
  // second tap replaces the first rather than double-submitting it, and
  // freezing the buttons mid-count would cost more than it protects.
  function bump(id, delta) {
    var it = itemById(id); if (!it) return;
    setQty(id, Math.max(0, it.physical_qty + delta), false);
  }

  function setQty(id, qty, immediate) {
    var it = itemById(id); if (!it) return;
    var p = state.pending[id];
    if (!p) p = state.pending[id] = { baseline: it.__base != null ? it.__base : it.physical_qty };
    it.__base = p.baseline;
    it.physical_qty = qty;
    p.qty = qty;
    if (state.rowErr[id]) delete state.rowErr[id];
    paintRow(id); paintCounts();
    clearTimeout(p.timer);
    if (immediate) flush(id);
    else p.timer = setTimeout(function () { flush(id); }, 550);
  }

  function flush(id) {
    var p = state.pending[id]; if (!p) return;
    var qty = p.qty, was = p.baseline;
    api(API + '/stores/' + state.storeId + '/stock/' + id, { method: 'PATCH', body: { physical_qty: qty, reason: 'adjust', note: 'quick-stock' } })
      .then(function () {
        delete state.pending[id];
        var it = itemById(id); if (it) it.__base = qty;
        paintRow(id); paintCounts();
      })
      .catch(function (e) {
        if (e.message === 'auth') return;
        // The shelf goes back to what the server holds — showing an unsaved
        // number as if it were stock is the dishonesty §1.17 forbids — and the
        // row says what happened and offers the count back.
        var it = itemById(id); if (it) { it.physical_qty = was; it.__base = was; }
        delete state.pending[id];
        state.rowErr[id] = { qty: qty, was: was, msg: e.message };
        paintRow(id); paintCounts();
      });
  }

  // ── Add mode: the stepper builds a "to add" amount, then commits it as one
  // delta after a short pause and resets to +0 (same muscle memory as recount,
  // but additive and never showing the shelf total). ──
  function bumpAdd(id, delta) {
    state.addQty[id] = Math.max(0, (state.addQty[id] || 0) + delta);
    if (state.rowErr[id]) delete state.rowErr[id];
    var p = state.pending[id] || (state.pending[id] = {});
    paintRow(id);
    clearTimeout(p.timer);
    p.timer = setTimeout(function () { flushAdd(id); }, 700);
  }

  function flushAdd(id) {
    var p = state.pending[id];
    if (p) clearTimeout(p.timer);
    var n = state.addQty[id] || 0;
    if (n <= 0) { delete state.pending[id]; paintRow(id); return; }
    var it = itemById(id);
    state.addQty[id] = 0;
    state.pending[id] = { add: n };
    paintRow(id);
    api(API + '/stores/' + state.storeId + '/stock/' + id, { method: 'PATCH', body: { delta: n, reason: 'kitchen_add', note: 'add-stock' } })
      .then(function () {
        if (it) it.physical_qty += n;
        delete state.pending[id];
        paintRow(id);
        toast(t('Added ' + n, '已加 ' + n + ' 件') + (it ? ' · ' + pname(it) : ''));
      })
      .catch(function (e) {
        if (e.message === 'auth') return;
        state.addQty[id] = (state.addQty[id] || 0) + n;   // hand the amount back so they can retry
        delete state.pending[id];
        state.rowErr[id] = { add: n, msg: e.message };
        paintRow(id);
      });
  }

  // ── Keypad · one bounded decision, one commit ──────────────────────────
  function openKeypad(id) {
    var it = itemById(id); if (!it) return;
    kp.id = id; kp.entry = null;
    $('#kpName').textContent = pname(it);
    $('#kpSub').textContent = it.sku || ('#' + it.id);
    renderKpVal();
    state.sheet = 'keypad';
    $('#kpBack').classList.add('show'); $('#kpSheet').classList.add('show');
  }
  function closeKeypad() {
    $('#kpBack').classList.remove('show'); $('#kpSheet').classList.remove('show');
    kp.id = null; state.sheet = null;
  }
  // Add mode shows the pending "to add" amount (not the shelf total) — typically
  // 0 — so the current count is never revealed.
  function kpCurrent() { if (state.mode === 'add') return state.addQty[kp.id] || 0; var it = itemById(kp.id); return it ? it.physical_qty : 0; }
  function renderKpVal() {
    var v = kp.entry !== null ? kp.entry : String(kpCurrent());
    if (v === '') v = '0';
    var el = $('#kpVal'); el.textContent = v;
    el.classList.toggle('zero', parseInt(v, 10) === 0);
  }
  function kpPress(d) {
    if (kp.entry === null) kp.entry = '';
    if (kp.entry === '0') kp.entry = '';
    if (kp.entry.length < 4) kp.entry += d;
    renderKpVal();
  }
  function kpBackspace() {
    if (kp.entry === null) kp.entry = String(kpCurrent());
    kp.entry = kp.entry.slice(0, -1);
    renderKpVal();
  }
  // In add mode the bottom-left key is "Clear" (reset entry); in recount mode
  // it's "Sold out" (set the count to zero).
  function kpSoldOut() { kp.entry = ''; renderKpVal(); }
  function kpSave() {
    var id = kp.id, it = itemById(id);
    if (!it) { closeKeypad(); return; }
    if (state.mode === 'add') {
      var n = kp.entry !== null ? (parseInt(kp.entry, 10) || 0) : (state.addQty[id] || 0);
      state.addQty[id] = Math.max(0, n);
      closeKeypad();
      paintRow(id);
      if (state.addQty[id] > 0) flushAdd(id);   // typed entry commits immediately
      return;
    }
    var v = kp.entry !== null ? (parseInt(kp.entry, 10) || 0) : it.physical_qty;
    closeKeypad();
    if (v !== it.physical_qty) setQty(id, v, true);
  }

  // ── Store sheet ────────────────────────────────────────────────────────
  var ICO_TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  function openStoreSheet() {
    var html = state.stores.map(function (s) {
      var on = s.id === state.storeId;
      return '<button class="sheet-item" data-store="' + s.id + '">' + esc(storeLabel(s)) +
        (s.code ? ' <span class="code">' + esc(s.code) + '</span>' : '') +
        // Ink tick = the operator's current selection. Never Dusk (§1.8).
        (on ? '<span class="tick">' + ICO_TICK + '</span>' : '') +
        '</button>';
    }).join('');
    $('#sheetList').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-store]'), function (el) {
      el.onclick = function () { selectStore(parseInt(el.getAttribute('data-store'), 10)); };
    });
    state.sheet = 'store';
    $('#storeBack').classList.add('show'); $('#storeSheet').classList.add('show');
  }
  function closeStoreSheet() {
    $('#storeBack').classList.remove('show'); $('#storeSheet').classList.remove('show');
    if (state.sheet === 'store') state.sheet = null;
  }

  // ── Account sheet ──────────────────────────────────────────────────────
  function openAccount() {
    $('#signOutStep2').hidden = true; $('#signOutBtn').hidden = false;
    $('#signOutYes').removeAttribute('disabled');
    paintSeg(); paintSync();
    state.sheet = 'account';
    $('#acctBack').classList.add('show'); $('#acctSheet').classList.add('show');
  }
  function closeAccount() {
    $('#acctBack').classList.remove('show'); $('#acctSheet').classList.remove('show');
    if (state.sheet === 'account') state.sheet = null;
  }

  // ── Full-screen states (off / no store / error) ────────────────────────
  // The shell stays: a staffer who lands on "no store assigned" must still be
  // able to sign out, which the old build made impossible by hiding the whole
  // header behind these screens.
  function showScreen(which) {
    state.view = which;
    $('#pageHead').hidden = true; $('#toolbar').hidden = true; $('#band').hidden = true;
    var icon, title, body, btn = '';
    if (which === 'off') {
      icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
      title = state.mode === 'add' ? t('Add stock is off', '加库存功能已关闭') : t('Quick stock is off', '库存功能已关闭');
      body = t('This add-on is turned off for your store. An admin can switch it on in the back office under Settings.',
               '此附加功能已关闭。管理员可在网店后台“设置”中开启。');
    } else if (which === 'nostore') {
      icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/></svg>';
      title = t('No store assigned', '未分配门店');
      body = t('Your account isn’t linked to a store yet. Ask an admin to assign you one, then reopen Quick stock.',
               '您的账号尚未关联门店。请联系管理员分配后重新打开。');
    } else {
      icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
      title = t('That didn’t load', '没有加载出来');
      body = esc(state.errMsg || t('Check the connection, then try again.', '请检查网络后重试。'));
      btn = '<button class="btn btn-secondary" id="screenRetry">' + t('Try again', '重试') + '</button>';
    }
    $('#main').innerHTML = '<div class="screen"><div class="ic">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p>' + btn + '</div>';
    var r = $('#screenRetry'); if (r) r.onclick = function () { location.reload(); };
  }


  /* ══ RECEIVING — the store's half of a two-step transfer ═══════════════════
     Decisions §39. Stock leaves the warehouse at dispatch, sits IN TRANSIT
     belonging to neither location, and arrives here on receipt. The rules this
     screen exists to keep:

       • WHAT THE SHOP COUNTS IS WHAT THE SHOP HOLDS. Her count sets stock. The
         dispatched figure is never preferred to it and survives only as the
         caption on the row.
       • NOTHING IS PRE-FILLED. The keypad opens EMPTY, never seeded with what
         the warehouse said it sent — a figure already in the box is a figure
         nobody counted. "All N arrived" is one deliberate tap that says the
         same thing, and says it because she chose it.
       • SHORT AND OVER ARE RECORDED, NEVER BLOCKED. No reason field, no
         confirmation step, no accusation, and no difference in how the two are
         treated. A gap is a gap whichever way it runs.
       • TWO YARDSTICKS, NAMED. A line can differ from what the van carried or
         from what the store asked for. Confirm compares against the van (all it
         can do before she confirms); Received compares against the order, which
         brings in the lines the warehouse cut before loading. Each heading says
         which, so a number that appears to change is two questions with two
         answers.

     EVERY WRITE GOES THROUGH routes/restock.js AS IT ALREADY STANDS —
     GET /api/restock, GET /api/restock/:id, PUT /api/restock/:id/receive. There
     is no second settlement path here: _applyReceipt on the server moves the
     stock, writes both ledger halves and stamps goods_state. This screen only
     ever sends counts and renders what comes back.  */

  var rc = {
    /* null = not probed yet, false = this session cannot do TRANSFER work.
       It is not "cannot reach /api/restock" any more, and the difference is the
       whole of #264: a kitchen operator is refused the transfer lists and
       ANSWERED on the kitchen queue, so one flag for both jobs read their
       refusal as a refusal of everything and took the launcher away with it. */
    on: null,
    list: null,      // inbound transfers for the selected store
    order: null,     // the open one, with items
    step: 'list',    // list | transit | count | confirm | done
    held: null,      // {item_id, qty} — see rcSaveCount
    entry: null,     // keypad digits as typed, '' until she presses one
    itemId: null,
    busy: false,
    err: '',
  };

  /* /api/restock is gated by requireAuth — the kitchen `users` realm. /stock is
     served to BOTH realms, and a Mini App Backend operator's session carries
     backendUserId instead, so these endpoints answer 401 for them. That is not
     an error and must not reach api(), whose 401 branch bounces to /stock-login
     and would throw a backend operator out of Quick Stock for opening a screen
     they simply do not have. A refusal here disables receiving and says nothing. */
  function rcFetch(path, opts) {
    opts = opts || {};
    var o = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
    return fetch(path, o).then(function (r) {
      // A REFUSAL IS REPORTED, NOT ATTRIBUTED. Which job was refused is known
      // to the caller and not to this function, and it used to switch off the
      // whole feature from here — so the kitchen's 403 on a transfer list took
      // the kitchen's own queue down with it. Each loader now records its own.
      if (r.status === 401 || r.status === 403) throw new Error('norealm');
      return r.json().then(function (j) {
        if (!j.success) { var e = new Error(j.error || 'error'); e.body = j; throw e; }
        return j;
      });
    });
  }

  function rcNum(v) { var n = Number(v); return Number.isFinite(n) ? n : 0; }
  /* SQLite writes CURRENT_TIMESTAMP as a ZONELESS 'YYYY-MM-DD HH:MM:SS' in UTC,
     and every engine reads a zoneless string as LOCAL — which in Guangzhou puts
     a dispatch eight hours before it happened. Pin the zone explicitly. */
  function rcStamp(v) {
    if (!v) return null;
    var d = new Date(String(v).replace(' ', 'T') + (/[Zz+]|\d-\d\d:\d\d$/.test(String(v)) ? '' : 'Z'));
    return isNaN(d.getTime()) ? null : d;
  }
  function rcSent(it) { return rcNum(it.qty_sent != null ? it.qty_sent : it.qty_requested); }
  function rcGot(it) { return it.qty_received == null ? null : rcNum(it.qty_received); }
  function rcName(it) {
    var n = lang === 'cn' ? (it.product_cn || it.product_name) : (it.product_name || it.product_cn);
    return n || ('#' + it.id);
  }
  /* A count held back locally still counts as counted on screen — the operator
     typed it, so the row and the tally must show it. Only the server has not
     been told yet, and rcConfirm is what tells it. */
  function rcHeldFor(it) { return rc.held && rc.held.item_id === it.id ? rc.held.qty : null; }
  function rcCount(it) { var h = rcHeldFor(it); return h != null ? h : rcGot(it); }
  function rcItems() {
    var xs = rc.order && rc.order.items;
    return (Array.isArray(xs) ? xs : []).filter(function (it) { return rcSent(it) > 0; });
  }
  function rcCounted() { return rcItems().filter(function (it) { return rcCount(it) != null; }); }
  function rcArrived(o) { return !!o.delivered_at; }

  /* WHAT IS COMING TO THE SHELF SHE IS LOOKING AT, read off the order.
     Since #259 an order records `to_store_id`, so this is an id comparison
     rather than a guess. It used to match the store's NAME against the free
     text stamped on the order and let an order naming nobody belong to
     everybody — which was the best available answer while the destination was
     inferred at dispatch, and is a worse one now that the row carries it.
     The name match survives ONLY for rows written before that column existed. */
  function rcForStore(o) {
    if (o.to_store_id) return o.to_store_id === state.storeId;
    var s = state.stores.filter(function (x) { return x.id === state.storeId; })[0];
    if (!s) return false;
    if (!o.store_name && !o.store_cn) return true;
    var want = [s.name_en, s.name_cn, s.code].filter(Boolean).map(function (v) { return String(v).trim().toLowerCase(); });
    var got = [o.store_name, o.store_cn].filter(Boolean).map(function (v) { return String(v).trim().toLowerCase(); });
    return got.some(function (g) { return want.indexOf(g) >= 0; });
  }


  /* THE PROBE AND THE LIST, and they are not the same question.
     This used to ask for `to_role=store`, which reads like "deliveries to a
     shop" and is not: `to_role` records who was ASKED, and a shop asking the
     warehouse writes 'warehouse'. Nothing has ever written 'store' — no client
     posts it and no route sets it — so the filter matched no row ever created
     and the Receive list was permanently empty, whatever was actually on a van.
     What is coming here is `to_store_id`, and rcForStore is what reads it.
     The param is dropped, not corrected: an absent `to_role` still fails the
     kitchen session's `!== 'kitchen'` test, so the 403 that keeps the launcher
     off the kitchen host answers exactly as it did. */
  function rcLoad() {
    if (rc.on === false) return Promise.resolve();
    return rcFetch('/api/restock?tab=active').then(function (j) {
      rc.on = true;
      rc.list = (Array.isArray(j.data) ? j.data : []).filter(function (o) {
        return (o.to_role || 'warehouse') !== 'kitchen'
          && o.goods_state === 'in_transit' && rcForStore(o);
      });
      probeAnswered();
      if (state.view === 'home') homeRender();
      else if (state.view === 'list') render();
      else rcRender();
    }).catch(function (e) {
      if (e.message === 'norealm') { rc.on = false; rc.list = []; probeAnswered(); return; }
      rc.err = e.message; if (state.view === 'receiving') rcRender();
    });
  }

  /* The Receive tile's destination. One inbound delivery is the Roots case and
     opens straight into the count — a chooser with one row in it is a tap that
     asks a question with one answer. Several offer the choice; none says so. */
  function rcEnter() {
    var list = rc.list || [];
    if (list.length === 1) return rcOpen(list[0].id);
    state.view = 'receiving'; rc.order = null; rc.step = 'list'; rc.err = ''; rc.held = null;
    rcRender();
  }

  function rcOpen(id) {
    rc.busy = true; rc.err = ''; rc.held = null;
    state.view = 'receiving'; rcRender();
    rcFetch('/api/restock/' + id).then(function (j) {
      rc.order = j.data; rc.busy = false;
      rc.step = rcArrived(rc.order) ? 'count' : 'transit';
      rcRender();
    }).catch(function (e) {
      rc.busy = false;
      rc.err = e.message === 'norealm' ? '' : e.message;
      rcRender();
    });
  }

  function rcExit() {
    rc.order = null; rc.step = 'list'; rc.held = null; rc.err = '';
    rcLoad();
    homeBack();
  }

  /* ── Saving a count ───────────────────────────────────────────────────────
     Counts are written line by line, so a count survives the phone going in a
     pocket — the resumable count the Resume screen is built on.

     EXCEPT THE ONE THAT COMPLETES THE SET, WHICH IS HELD IN MEMORY. The server
     settles inside PUT /:id/receive the moment every line carries a figure, and
     it is right to: a complete count is a complete count. But the flow has a
     Confirm step — "these units join this store's stock when you confirm" — and
     a save that settled on the fourteenth line would move the stock before she
     ever saw it, leaving Confirm reviewing something already done.

     So the last outstanding line is held back and sent by Confirm. The cost is
     stated rather than hidden: if the phone dies between counting that final
     line and confirming, that ONE count is lost and gets retyped. Every other
     line is already on the server. Recounting an earlier line from Confirm is an
     ordinary save — the set is still incomplete server-side, so it cannot settle
     early.  */
  function rcSaveCount(itemId, qty) {
    var items = rcItems();
    var outstanding = items.filter(function (it) {
      return it.id !== itemId && rcCount(it) == null;
    }).length;
    var completes = outstanding === 0;
    if (completes) {
      rc.held = { item_id: itemId, qty: qty };
      rc.step = 'confirm';
      rcRender();
      return Promise.resolve();
    }
    // A held line that is no longer the last one goes to the server with this
    // save, so nothing is held except while the set is genuinely complete.
    var counts = [{ item_id: itemId, qty_received: qty }];
    if (rc.held && rc.held.item_id !== itemId) {
      counts.push({ item_id: rc.held.item_id, qty_received: rc.held.qty });
    }
    rc.busy = true; rc.err = ''; rcRender();
    return rcFetch('/api/restock/' + rc.order.id + '/receive', { method: 'PUT', body: { counts: counts } })
      .then(function () {
        counts.forEach(function (c) {
          var it = (rc.order.items || []).filter(function (x) { return x.id === c.item_id; })[0];
          if (it) it.qty_received = c.qty_received;
        });
        rc.held = null; rc.busy = false; rcRender();
      })
      .catch(function (e) {
        rc.busy = false;
        // The number she typed is never thrown away by a failed write. Losing a
        // delivery's counts at the door is the one failure nobody forgives.
        rc.held = { item_id: itemId, qty: qty };
        rc.err = e.message === 'norealm'
          ? t('This account cannot receive transfers.', '此账号无法确认调拨收货。')
          : t('That count did not save. It is still on screen — try again.', '数量未保存,仍显示在屏幕上 — 请重试。');
        rcRender();
      });
  }

  function rcConfirm() {
    if (rc.busy) return;
    var counts = rcItems().map(function (it) {
      return { item_id: it.id, qty_received: rcCount(it) };
    }).filter(function (c) { return c.qty_received != null; });
    rc.busy = true; rc.err = ''; rcRender();
    rcFetch('/api/restock/' + rc.order.id + '/receive', { method: 'PUT', body: { counts: counts } })
      .then(function (j) {
        rc.busy = false;
        if (!j.settled) {
          rc.err = t('Some lines are still uncounted.', '仍有未点数的项目。');
          rc.step = 'count'; rcRender(); return;
        }
        counts.forEach(function (c) {
          var it = (rc.order.items || []).filter(function (x) { return x.id === c.item_id; })[0];
          if (it) it.qty_received = c.qty_received;
        });
        rc.held = null; rc.step = 'done'; rcRender();
        // The shelf this app counts has just changed underneath it.
        if (state.storeId != null) loadStock(true);
        rcLoad();
      })
      .catch(function (e) {
        rc.busy = false;
        rc.err = e.message === 'norealm'
          ? t('This account cannot receive transfers.', '此账号无法确认调拨收货。')
          : (e.body && e.body.error) || t('That did not go through. Nothing has changed — try again.', '没有成功。数据没有变化 — 请重试。');
        rcRender();
      });
  }

  /* ── The keypad ───────────────────────────────────────────────────────────
     Opens EMPTY. rc.entry is '' until she presses a digit, and an empty entry
     cannot be saved — there is no figure to save, and the sent quantity is not
     one she gave. */
  function rcOpenPad(itemId) {
    var it = rcItems().filter(function (x) { return x.id === itemId; })[0];
    if (!it) return;
    rc.itemId = itemId; rc.entry = '';
    var sent = rcSent(it);
    $('#rcName').textContent = rcName(it);
    $('#rcSub').textContent = (it.sku ? it.sku + ' · ' : '') + t(sent + ' sent', '发出 ' + sent);
    $('#rcLabel').textContent = t('How many arrived?', '到货多少?');
    $('#rcAll').textContent = t('All ' + sent + ' arrived', '全部 ' + sent + ' 件到货');
    $('#rcClear').textContent = t('Clear', '清除');
    rcPaintPad();
    state.sheet = 'receive';
    $('#rcBack').classList.add('show'); $('#rcSheet').classList.add('show');
  }
  function rcClosePad() {
    state.sheet = null;
    $('#rcBack').classList.remove('show'); $('#rcSheet').classList.remove('show');
  }
  function rcPaintPad() {
    var it = rcItems().filter(function (x) { return x.id === rc.itemId; })[0];
    if (!it) return;
    var sent = rcSent(it);
    var has = rc.entry !== '';
    var n = has ? parseInt(rc.entry, 10) : null;
    $('#rcVal').textContent = has ? String(n) : '—';
    $('#rcVal').style.color = has ? '' : 'var(--text2)';
    var d = has ? n - sent : 0;
    $('#rcGap').textContent = !has || d === 0 ? ''
      : (d < 0 ? t((-d) + ' short', '短少 ' + (-d)) : t(d + ' over', '多收 ' + d));
    $('#rcNote').textContent = has
      ? t('Recorded as it is. Nothing else needed.', '如实记录,无需其他说明。')
      : t('Count what is in the box.', '请点数箱内实际数量。');
    var save = $('#rcSave');
    save.disabled = !has;
    save.style.opacity = has ? '' : '.5';
    save.textContent = has ? t('Save ' + n + ' and continue', '保存 ' + n + ' 并继续')
                           : t('Save and continue', '保存并继续');
  }
  function rcPad(k) {
    if (k === 'clear') rc.entry = '';
    else if (k === 'back') rc.entry = rc.entry.slice(0, -1);
