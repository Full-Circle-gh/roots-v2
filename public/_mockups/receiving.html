<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="mThemeColor" content="#FBF9F4">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>Receiving — mockup</title>

<!-- ═══════════════════════════════════════════════════════════════════════
     THROWAWAY MOCKUP. Not wired to anything.
     No API calls, no imports from the app, no routes. All data below is fake.
     Tokens and component styles are copied from public/m.html so this reads as
     Tacet Mobile rather than a wireframe.

     Two deliberate departures from m.html:
       • Dusk (#6E67AF) is not used anywhere — it is the AI colour. --accent
         resolves to ink, which is the same choice m.html's toggle() makes.
       • No WaveMark / "runs on tacet" mark.

     The receive screen is Layout A, chosen. B and C are gone.
     Below it, the two candidate homes for the receiving LIST, side by side.
     ═══════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{
  --paper:#FBF9F4; --ink:#111A2B; --graphite:#58606E; --sage:#A3B49F;
  --amber:#C9954A; --brick:#B4533E;
  --sage-tint:#EDF1EC; --amber-tint:#F7EEDE; --brick-tint:#F6E7E3;
  --sage-ink:#5F7357; --amber-ink:#8A6425; --brick-ink:#B4533E;
  --raised:#F6F3EC; --border:#E4E0D5; --unseen:#F4F5F0;

  --bg:var(--paper); --surface-card:#FFFFFF; --surface-raised:var(--raised); --surface-dark:var(--ink);
  --text-primary:var(--ink); --text-secondary:var(--graphite); --text-caption:var(--graphite);
  --border-default:var(--border); --border-strong:var(--graphite);
  /* Ink, not Dusk — see the note in the head. */
  --border-focus:var(--ink);
  --accent:var(--ink); --accent-hover:#1D2942; --accent-press:#0A1120;
  --success:var(--sage); --warning:var(--amber); --danger:var(--brick);
  --radius-card:14px;
  --ease-settle:cubic-bezier(0.16,1,0.3,1);
  --font-ui:'Inter','Noto Sans SC','Source Han Sans SC',-apple-system,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:var(--ink); --surface-card:#182236; --surface-raised:#1E2A40; --surface-dark:#0B121F;
  --text-primary:var(--paper); --text-secondary:#9AA2B0; --text-caption:#9AA2B0;
  --border-default:#263149; --border-strong:#3A455D; --border-focus:var(--paper);
  --unseen:#182329;
  --amber-tint:rgba(201,149,74,.16); --brick-tint:rgba(180,83,62,.20); --sage-tint:rgba(163,180,159,.16);
  --amber-ink:#D9A55E; --brick-ink:#DE8B77; --sage-ink:#A3B49F;
  --accent:var(--paper); --accent-hover:#EFEBE2; --accent-press:#DFDACE;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#E9E5DC;font-family:var(--font-ui);color:var(--text-primary);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
:root[data-theme="dark"] body{background:#0B121F}
button,input{font-family:inherit}
button,.row,.chip,.pill,.eyebrow,h1,h2{-webkit-user-select:none;user-select:none}
button,a,.row,.chip,.stepbtn{touch-action:manipulation}

/* ── m.html components, verbatim where possible ───────────────────────── */
.card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px}
.list{background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px;overflow:hidden}
.sep{height:1px;background:var(--border-default)}
.eyebrow{font-size:13px;font-weight:500;color:var(--text-secondary)}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;padding:12px 16px;background:transparent;
  border:none;cursor:pointer;text-align:left;color:var(--text-primary);font-family:inherit}
.rowico{width:36px;height:36px;border-radius:8px;background:var(--surface-raised);display:flex;align-items:center;
  justify-content:center;color:var(--text-secondary);flex:none}
.num{font-variant-numeric:tabular-nums}
.btn2{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border-default);background:transparent;
  color:var(--text-primary);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn2:disabled{opacity:.45;cursor:default}
.cta{width:100%;min-height:48px;padding:12px 16px;border:none;border-radius:8px;background:var(--accent);
  color:var(--bg);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s var(--ease-settle)}
.cta:hover{background:var(--accent-hover)}.cta:active{background:var(--accent-press)}
.cta:disabled{opacity:.4;cursor:default}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:400;padding:4px 10px;border-radius:999px;
  white-space:nowrap;flex:none}
.stepbtn{width:52px;height:52px;border-radius:10px;background:var(--surface-raised);border:1px solid var(--border-default);
  display:flex;align-items:center;justify-content:center;color:var(--text-primary);cursor:pointer;flex:none}
.stepbtn:active{background:var(--border-default)}
.stepbtn:disabled{opacity:.35;cursor:default}
.stepbtn.sm{width:44px;height:44px;border-radius:8px}
.chip{display:flex;align-items:center;gap:8px;flex:none;height:44px;padding:0 16px;border-radius:999px;font-size:13px;
  cursor:pointer;font-family:inherit;white-space:nowrap;border:1px solid var(--border-default);
  background:var(--surface-card);color:var(--text-secondary)}
.chip.on{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}
.chip .c{font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
.i svg,svg.i{display:block;flex:none}
input{padding:12px 14px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-card);
  color:var(--text-primary);font-size:15px;width:100%}
input:focus{outline:none;border-color:var(--border-focus)}
.hscroll{scrollbar-width:none;-ms-overflow-style:none;overflow-x:auto}
.hscroll::-webkit-scrollbar{display:none}
@keyframes tRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:tRise .3s var(--ease-settle) both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}

/* The quantity field. Tabular, large, same height as its steppers so the
   three read as one control. */
.qty{width:72px;height:52px;padding:0;text-align:center;font-size:22px;font-weight:500;
  font-variant-numeric:tabular-nums;border-radius:10px;background:var(--surface-card);
  border:1px solid var(--border-default);color:var(--text-primary)}
.qty.sm{width:60px;height:44px;font-size:17px}
.qty.edit{border-color:var(--amber);background:var(--amber-tint);color:var(--amber-ink)}

/* ── Damage control ───────────────────────────────────────────────────────
   Sits at the right end of the quantity row. At zero it is an outline the eye
   skips; carrying a count it fills brick AND SHOWS THE NUMBER, so a recorded
   damage is legible while scrolling and never hides behind a tap. */
.dmgbtn{min-width:52px;height:52px;padding:0 11px;border-radius:10px;background:transparent;
  border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;gap:5px;
  color:var(--text-secondary);cursor:pointer;flex:none}
.dmgbtn.on{background:var(--brick-tint);border-color:var(--brick);color:var(--brick-ink)}
.dmgbtn .n{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* Supplier-header secondary action — small, quiet, never the size of a CTA. */
.minibtn{height:44px;padding:0 11px;border-radius:999px;border:1px solid var(--border-default);
  background:transparent;color:var(--text-secondary);font-size:12.5px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.minibtn.on{border-color:var(--text-primary);color:var(--text-primary)}

/* ── Mockup chrome (NOT part of the app) ──────────────────────────────── */
.chrome{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border-default);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px}
.chrome-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chrome-title{flex:1;min-width:0;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrome-btn{height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--border-default);
  background:var(--surface-card);color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;flex:none}
.seg{display:flex;gap:3px;background:var(--surface-raised);border-radius:11px;padding:3px}
.segb{flex:1;padding:7px 4px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;background:transparent;
  color:var(--text-secondary);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.segb.on{background:var(--surface-card);color:var(--text-primary);box-shadow:0 1px 3px rgba(17,26,43,.08)}
:root[data-theme="dark"] .segb.on{box-shadow:0 1px 3px rgba(0,0,0,.35)}
.segb b{font-size:14px;font-weight:500;line-height:1.25}
.segb span{font-size:11px;font-weight:400;line-height:1.2;opacity:.9;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:100%}

.stage{padding:16px 0 0}
.caption{padding:0 16px 12px;max-width:520px;margin:0 auto}
.caption h2{margin:0 0 4px;font-size:15px;font-weight:500;letter-spacing:-.01em}
.caption p{margin:0;font-size:13px;line-height:1.5;color:var(--text-secondary)}
/* The cost line. Deliberately set apart — it is the thing being weighed. */
.cost{margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--amber-tint);
  font-size:12.5px;line-height:1.5;color:var(--amber-ink)}
.cost b{font-weight:600}

/* The device. Below 520px it simply fills the screen, exactly like m.html;
   above it, the drawn handset so this can be judged on a laptop too. */
.frame{background:var(--bg);border-top:1px solid var(--border-default);
  border-bottom:1px solid var(--border-default);overflow:hidden}
@media (min-width:520px){
  .frame{width:402px;margin:0 auto;border-radius:34px;border:none;
    box-shadow:0 24px 70px rgba(17,26,43,.28),0 0 0 11px #1c1c1e,0 0 0 12px #2c2c2e}
  .chrome,.caption{max-width:520px;margin-left:auto;margin-right:auto}
  .stage{padding-bottom:8px}
}
.divider{height:16px}
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-top">
    <span class="chrome-title" id="chromeTitle">Receiving · mockup</span>
    <button class="chrome-btn" onclick="APP.cmd('lang')" id="langBtn">EN</button>
    <button class="chrome-btn" onclick="APP.cmd('theme')" id="themeBtn">☾</button>
    <button class="chrome-btn" onclick="APP.cmd('reset')" id="resetBtn">Untouched</button>
  </div>
  <span class="eyebrow" style="display:block;margin-bottom:6px;font-size:11.5px" id="navLabel">
    Second screen below — where the receiving list lives</span>
  <div class="seg" id="segRoot"></div>
</div>

<div class="stage">
  <div class="caption" id="capReceive"></div>
  <div class="frame" id="frameReceive"></div>
  <div class="divider"></div>
  <div class="caption" id="capNav"></div>
  <div class="frame" id="frameNav"></div>
</div>

<script>
"use strict";

/* ══ Icons ════════════════════════════════════════════════════════════════
   Lucide geometry, inlined rather than fetched from a CDN so the file is
   genuinely standalone and works on a phone with no network. */
const ICONS = {
  'chevron-down':'<path d="m6 9 6 6 6-6"/>',
  'chevron-up':'<path d="m18 15-6-6-6 6"/>',
  'chevron-right':'<path d="m9 18 6-6-6-6"/>',
  'chevron-left':'<path d="m15 18-6-6 6-6"/>',
  'check':'<path d="M20 6 9 17l-5-5"/>',
  'minus':'<path d="M5 12h14"/>',
  'plus':'<path d="M5 12h14"/><path d="M12 5v14"/>',
  'search':'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  'package':'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  /* The damage mark: a carton with a cross through it. Distinct from the
     amber triangle, which means "short", so the two never read as one thing. */
  'package-x':'<path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0"/><path d="m7.5 4.27 9 5.15"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/><path d="m17 13 5 5"/><path d="m22 13-5 5"/>',
  'triangle-alert':'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  'map-pin':'<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  'user':'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  'circle-check':'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  'pencil':'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  'shopping-cart':'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  'truck':'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  'clock':'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  'message-square-text':'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 8h10"/><path d="M7 12h6"/>',
  'store':'<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M2 7h20"/>',
  'trending-up':'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  'receipt':'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
};
function ic(name, size, stroke){
  size = size || 20; stroke = stroke || 1.75;
  return '<svg class="i" xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" '
    + 'fill="none" stroke="currentColor" stroke-width="'+stroke+'" stroke-linecap="round" stroke-linejoin="round">'
    + (ICONS[name]||'') + '</svg>';
}
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ══ Language ═════════════════════════════════════════════════════════════ */
let LANG = 'en';
function T(en, zh){ return LANG === 'en' ? en : (zh || en); }

/* ══ Pills — m.html's PILL map ════════════════════════════════════════════ */
const PILL = {
  clear:['rgba(88,96,110,0.10)','var(--text-secondary)'],
  success:['var(--sage-tint)','var(--sage-ink)'],
  warning:['var(--amber-tint)','var(--amber-ink)'],
  danger:['var(--brick-tint)','var(--brick-ink)'],
  muted:['rgba(88,96,110,0.06)','var(--text-secondary)'],
};
function pill(tone, label){
  const p = PILL[tone] || PILL.clear;
  return '<span class="pill" style="background:'+p[0]+';color:'+p[1]+'">'+label+'</span>';
}

/* ══ FAKE DATA ════════════════════════════════════════════════════════════
   RPO-0003 · Tianhe · 5 lines · 3 suppliers. Nothing here is real. */
const LOCATIONS = [
  { id:1, en:'Tianhe',          zh:'天河'     },
  { id:2, en:'Pearl River',     zh:'珠江新城' },
  { id:3, en:'Central Kitchen', zh:'中央厨房' },
];
const SUPPLIERS = [
  { id:'gf',  en:'Green Farm',     zh:'绿田农场' },
  { id:'wdg', en:'Wong Dry Goods', zh:'黄记杂货' },
  { id:'so',  en:'Sun Oils',       zh:'阳光油品' },
];
const LINES = [
  { id:'l1', sup:'gf',  en:'Mint',        zh:'薄荷',   sku:'HRB-MNT', ordered:5,  unit:'kg' },
  { id:'l2', sup:'gf',  en:'Coriander',   zh:'香菜',   sku:'HRB-COR', ordered:3,  unit:'kg' },
  { id:'l3', sup:'wdg', en:'Red lentils', zh:'红扁豆', sku:'DRY-RLN', ordered:25, unit:'kg' },
  { id:'l4', sup:'wdg', en:'Chickpeas',   zh:'鹰嘴豆', sku:'DRY-CKP', ordered:20, unit:'kg' },
  { id:'l5', sup:'so',  en:'Coconut oil', zh:'椰子油', sku:'OIL-CCO', ordered:12, unit:'L'  },
];
/* Fixed list. No free text — the point of a reason CODE.
   DAMAGE IS NOT ON THIS LIST. A reason explains why the received count came in
   BELOW what was ordered; damage is a count of what arrived broken, which can
   happen on a line that is not short at all (Chickpeas, below). Having the word
   in both places made the two facts look like one. */
const REASONS = [
  { id:'short',    en:'Short delivery', zh:'少送'   },
  { id:'wrong',    en:'Wrong item',     zh:'错货'   },
  { id:'not_sent', en:'Not sent',       zh:'未发货' },
];

/* The scenario: Green Farm and Wong Dry Goods arrived, Sun Oils did not;
   Mint is 1 short; 2 Chickpeas came in damaged. */
function seedLines(){
  return {
    l1:{ recv:4,  dmg:0, reason:'short'    },
    l2:{ recv:3,  dmg:0, reason:null       },
    l3:{ recv:25, dmg:0, reason:null       },
    l4:{ recv:20, dmg:2, reason:null       },
    l5:{ recv:0,  dmg:0, reason:'not_sent' },
  };
}
/* Every line prefilled with the full ordered quantity — what staff actually
   meet before touching anything. Reachable from the chrome. */
function pristineLines(){
  const o = {};
  LINES.forEach(l => { o[l.id] = { recv:l.ordered, dmg:0, reason:null }; });
  return o;
}

/* ── Purchase orders ──────────────────────────────────────────────────────
   OPEN_POS are still waiting on a delivery. DONE_POS have been received —
   they are the orders the six sessions below were taken against, and they
   matter because the real Purchasing screen's "All" segment shows every PO
   regardless of status. Without them, Option 1's cost has to be asserted in
   a caption; with them it can simply be read off the screen. */
const OPEN_POS = [
  { id:'p3', kind:'po', po:'RPO-0003', sort:'2026-08-31', status:'Ordered',
    who:'3 suppliers', whoZh:'3 家供应商', loc:'Tianhe', locZh:'天河', lines:5,
    arrives:'31 Aug', arrivesZh:'8月31日' },
  { id:'p8', kind:'po', po:'RPO-0008', sort:'2026-08-30', status:'Requested',
    who:'Hoi Kee Produce', whoZh:'海记果蔬', loc:'Pearl River', locZh:'珠江新城', lines:4,
    arrives:'2 Sep', arrivesZh:'9月2日' },
];
const DONE_POS = [
  { id:'p7', kind:'po', po:'RPO-0007', sort:'2026-08-30', status:'Delivered',
    who:'Green Farm', whoZh:'绿田农场', loc:'Tianhe', locZh:'天河', lines:2,
    arrives:'30 Aug', arrivesZh:'8月30日' },
  { id:'p2', kind:'po', po:'RPO-0002', sort:'2026-08-29', status:'Delivered',
    who:'Wong Dry Goods', whoZh:'黄记杂货', loc:'Tianhe', locZh:'天河', lines:3,
    arrives:'29 Aug', arrivesZh:'8月29日' },
  { id:'p6', kind:'po', po:'RPO-0006', sort:'2026-08-27', status:'Delivered',
    who:'Sun Oils', whoZh:'阳光油品', loc:'Pearl River', locZh:'珠江新城', lines:1,
    arrives:'27 Aug', arrivesZh:'8月27日' },
  { id:'p5', kind:'po', po:'RPO-0005', sort:'2026-08-25', status:'Delivered',
    who:'Green Farm', whoZh:'绿田农场', loc:'Tianhe', locZh:'天河', lines:3,

const lineById = id => LINES.find(l => l.id === id);
const locById  = id => LOCATIONS.find(l => l.id === id);
const supName  = s => T(s.en, s.zh);
const locName  = l => T(l.en, l.zh);
const lineName = l => T(l.en, l.zh);
const linesOf  = sid => LINES.filter(l => l.sup === sid);
const st       = id => state.lines[id];
/* Shortfall is CALCULATED. Nobody is ever asked to work it out. */
const short    = l => Math.max(0, l.ordered - st(l.id).recv);
const over     = l => Math.max(0, st(l.id).recv - l.ordered);
const reasonOf = id => REASONS.find(r => r.id === id);

function supState(sid){
  const ls = linesOf(sid);
  if (ls.every(l => st(l.id).recv === 0)) return 'none';
  if (ls.some(l => short(l) > 0 || st(l.id).dmg > 0 || over(l) > 0)) return 'issue';
  return 'ok';
}
function supPill(sid){
  const s = supState(sid);
  if (s === 'none')  return pill('muted',   T('Not arrived','未到货'));
  if (s === 'issue') return pill('warning', T('Issues','有异常'));
  return pill('success', T('Complete','已齐'));
}
/* Lines bucketed by outcome. Kept as LISTS, not counts, so the summary can
   name what is wrong — "Mint, 1 kg short" is worth more at the door than
   "1 short", and adding kg to L would be nonsense anyway. */
function tally(){
  const complete=[], shortL=[], dmgL=[], overL=[], notSent=[];
  LINES.forEach(l => {
    const s = st(l.id);
    if (s.recv === 0)      notSent.push(l);
    else if (short(l) > 0) shortL.push(l);
    else if (over(l) > 0)  overL.push(l);
    else                   complete.push(l);
    if (s.dmg > 0) dmgL.push(l);          // damage is independent of shortfall
  });
  return { complete, shortL, dmgL, overL, notSent };
}
function missingReasons(){
  return LINES.filter(l => short(l) > 0 && !st(l.id).reason);
}

/* ── One line editor ──────────────────────────────────────────────────────
   Prefilled with the ordered quantity. Big steppers so it works one-handed
   with a box in the other. Units are display-only, straight off the PO. */
function lineEditor(l){
  const s = st(l.id);
  const sh = short(l), ov = over(l);
  /* The received box is tinted only when the RECEIVED count differs from what
     was ordered. Damage is a separate fact with its own control and its own
     colour — tinting this box for it said the count had been changed when it
     had not. */
  const edited = s.recv !== l.ordered;
  const dmgOpen = state.dmgOpen === l.id;

  /* [−][n][+] as one tight group, the unit beside it, and the damage mark at
     the far right of the same row — one row, one hand, nothing hidden. */
  const qtyRow = '<div style="display:flex;align-items:center;gap:8px">'
    + '<button class="stepbtn" onclick="APP.cmd(\'recv\',\''+l.id+'|-1\')" aria-label="minus" '
    +   (s.recv<=0?'disabled':'')+'>'+ic('minus',22,2)+'</button>'
    + '<input class="qty '+(edited?'edit':'')+'" inputmode="numeric" pattern="[0-9]*" value="'+s.recv+'" '
    +   'aria-label="'+T('Received','已收')+'" '
    +   'onchange="APP.cmd(\'recvSet\',\''+l.id+'|\'+this.value)" onfocus="this.select()">'
    + '<button class="stepbtn" onclick="APP.cmd(\'recv\',\''+l.id+'|1\')" aria-label="plus">'+ic('plus',22,2)+'</button>'
    + '<span style="font-size:14px;color:var(--text-secondary)">'+esc(l.unit)+'</span>'
    + '<button class="dmgbtn '+(s.dmg>0?'on':'')+(dmgOpen?' rise':'')+'" style="margin-left:auto'
    +   (dmgOpen && s.dmg===0 ? ';border-color:var(--text-primary);color:var(--text-primary)':'')+'" '
    +   'onclick="APP.cmd(\'dmgOpen\',\''+l.id+'\')" '
    +   'aria-label="'+T('Damaged','破损')+'">'+ic('package-x',20)
    +   (s.dmg>0 ? '<span class="n">'+s.dmg+'</span>' : '')+'</button>'
    + '</div>';

  /* The damage counter. One tap from the mark, writes on every press, no OK to
     dismiss — the count is already on the mark, so closing loses nothing. */
  const dmgPanel = dmgOpen
    ? '<div class="rise" style="margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--surface-raised)">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
      +   '<span style="color:var(--text-secondary);display:flex">'+ic('package-x',16)+'</span>'
      +   '<span style="flex:1;font-size:13.5px;font-weight:500">'+T('How many damaged?','破损几件？')+'</span>'
      +   '<button class="btn2" style="min-height:32px;padding:0 10px;font-size:12.5px;'
      +     'color:var(--text-secondary)" onclick="APP.cmd(\'dmgOpen\',\''+l.id+'\')">'+T('Done','完成')+'</button>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:10px">'
      +   '<button class="stepbtn sm" onclick="APP.cmd(\'dmg\',\''+l.id+'|-1\')" '+(s.dmg<=0?'disabled':'')+'>'
      +     ic('minus',18,2)+'</button>'
      +   '<input class="qty sm" inputmode="numeric" pattern="[0-9]*" value="'+s.dmg+'" '
      +     'style="'+(s.dmg>0?'border-color:var(--brick);background:var(--brick-tint);color:var(--brick-ink)':'')+'" '
      +     'onchange="APP.cmd(\'dmgSet\',\''+l.id+'|\'+this.value)" onfocus="this.select()">'
      +   '<button class="stepbtn sm" onclick="APP.cmd(\'dmg\',\''+l.id+'|1\')" '+(s.dmg>=s.recv?'disabled':'')+'>'
      +     ic('plus',18,2)+'</button>'
      +   '<span class="num" style="margin-left:auto;font-size:12.5px;color:var(--text-secondary);text-align:right">'
      +     (LANG==='en' ? 'of '+s.recv+' '+l.unit+'<br>received' : '共收 '+s.recv+' '+l.unit)+'</span>'
      + '</div></div>'
    : '';

  /* The shortfall is stated, never asked for. */
  let note = '';
  if (sh > 0) {
    /* A line at zero is a no-show, not a shortfall — "12 L short of 12" is a
       sum nobody needs to read back. */
    const txt = s.recv === 0
      ? T('Nothing arrived — what happened?','未到货 — 原因？')
      : (LANG==='en' ? sh+' '+l.unit+' short of '+l.ordered+' — what happened?'
                     : '短少 '+sh+' '+l.unit+'（订购 '+l.ordered+'）— 原因？');
    note = '<div style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--amber-ink)">'
      + ic('triangle-alert',16) + '<span class="num" style="font-size:13.5px">'+txt+'</span></div>';
  } else if (ov > 0) {
    note = '<div style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--text-secondary)">'
      + ic('triangle-alert',16) + '<span class="num" style="font-size:13.5px">'
      + (LANG==='en' ? ov+' '+l.unit+' over ordered' : '多收 '+ov+' '+l.unit)+'</span></div>';
  }

  /* Reason codes: three, in a 2-up grid so every one is on screen. A
     horizontal scroller fits about two and a half at 380px, which put the last
     reason behind a sideways swipe nested inside a vertical list. */
  const reasons = sh > 0
    ? '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">'
      + REASONS.map(r => '<button class="chip '+(s.reason===r.id?'on':'')+'" '
          + 'style="justify-content:center;padding:0 10px" '
          + 'onclick="APP.cmd(\'reason\',\''+l.id+'|'+r.id+'\')">'+esc(T(r.en,r.zh))+'</button>').join('')
      + '</div>'
    : '';

  return '<div class="card" style="padding:14px">'
    + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px">'
    +   '<span style="display:flex;flex-direction:column;min-width:0">'
    +     '<span style="font-size:15.5px;font-weight:500">'+esc(lineName(l))+'</span>'
    +     '<span class="num" style="font-size:12px;color:var(--text-secondary);margin-top:2px">'+esc(l.sku)+'</span>'
    +   '</span>'
    +   '<span class="num" style="flex:none;font-size:12.5px;color:var(--text-secondary);padding-top:2px">'
    +     T('ordered','订购')+' '+l.ordered+' '+esc(l.unit)+'</span>'
    + '</div>'
    + qtyRow + dmgPanel + note + reasons
    + '</div>';
}

/* ── Supplier group header ────────────────────────────────────────────────

  const ls = linesOf(s.id);

function sessionMatches(s){
  const q = state.rcvQuery.trim().toLowerCase();
  if (q) {
    const hay = [s.sup, s.supZh, s.loc, s.locZh, s.by, s.byZh, s.po, s.date].join(' ').toLowerCase();
    if (hay.indexOf(q) === -1) return false;

  const f = state.rcvFilter;
  if (f === 'all') return true;
  if (f === 'issues') return s.flags.length > 0;
  return s.flags.indexOf(f) !== -1;

/* ══ Commands ═════════════════════════════════════════════════════════════ */
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const whole = v => { const n = parseInt(String(v).replace(/[^0-9]/g,''), 10); return Number.isFinite(n) ? n : 0; };

const APP = {
  cmd(name, arg){
    const parts = typeof arg === 'string' ? arg.split('|') : [];
    switch(name){

      case 'lang': LANG = LANG === 'en' ? 'zh' : 'en'; break;
      case 'theme': {
        const d = document.documentElement;
        const next = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        d.setAttribute('data-theme', next);
        document.getElementById('mThemeColor').setAttribute('content', next === 'light' ? '#FBF9F4' : '#111A2B');
        break;
      }
      /* Flips between the scenario and the pristine prefilled state, so the
         "before anyone has touched it" screen can be seen too. */
      case 'reset':
        state.pristine = !state.pristine;
        state.lines = state.pristine ? pristineLines() : seedLines();
        state.done = false; state.locOpen = false; state.dmgOpen = null;
        break;

      case 'locToggle': state.locOpen = !state.locOpen; break;
      case 'loc':       state.loc = Number(arg); state.locOpen = false; break;

      case 'recv': {
        const s = st(parts[0]), l = lineById(parts[0]);
        s.recv = clamp(s.recv + Number(parts[1]), 0, 999);
        s.dmg = Math.min(s.dmg, s.recv);            // can't damage what did not arrive
        if (s.recv >= l.ordered) s.reason = null;   // no shortfall, no reason needed
        break;
      }
      case 'recvSet': {
        const s = st(parts[0]), l = lineById(parts[0]);
        s.recv = clamp(whole(parts[1]), 0, 999);
        s.dmg = Math.min(s.dmg, s.recv);
        if (s.recv >= l.ordered) s.reason = null;
        break;
      }
      /* One counter open at a time — two half-filled steppers down a long list
         is a way to lose track of which line you are counting. */
      case 'dmgOpen': state.dmgOpen = state.dmgOpen === arg ? null : arg; break;
      case 'dmg':     { const s = st(parts[0]); s.dmg = clamp(s.dmg + Number(parts[1]), 0, s.recv); break; }
      case 'dmgSet':  { const s = st(parts[0]); s.dmg = clamp(whole(parts[1]), 0, s.recv); break; }

      case 'reason': { const s = st(parts[0]); s.reason = s.reason === parts[1] ? null : parts[1]; break; }

      case 'grp': state.groups[arg] = !state.groups[arg]; break;
      /* One tap for the supplier who simply did not turn up, and one to undo it. */
      case 'supNone':
        linesOf(arg).forEach(l => { const s = st(l.id); s.recv = 0; s.dmg = 0; s.reason = 'not_sent'; });
        state.dmgOpen = null;
        break;
      case 'supAll':
        linesOf(arg).forEach(l => { const s = st(l.id); s.recv = l.ordered; s.dmg = 0; s.reason = null; });
        break;

      case 'record': state.done = true; break;
      case 'again':  state.done = false; state.lines = seedLines(); state.pristine = false; state.dmgOpen = null; break;

      case 'nav':      state.nav = arg; break;
      case 'p1seg':    state.p1seg = arg; break;
      case 'o2seg':    state.o2seg = arg; break;
      case 'o2screen': state.o2screen = arg; break;

      case 'rcvFilter': state.rcvFilter = arg; break;
      case 'rcvQuery':  state.rcvQuery = arg; break;
      case 'rcvOpen':   state.rcvOpen = state.rcvOpen === arg ? null : arg; break;
    }
    render();
    /* The search field is rebuilt on every render, so put the caret back. */
    if (name === 'rcvQuery') {
      const el = document.querySelector('#frameNav input');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  }
};
window.APP = APP;

/* Follow the phone, with a manual override in the chrome. */
try {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('mThemeColor').setAttribute('content', dark ? '#111A2B' : '#FBF9F4');
} catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }

render();
</script>
</body>
</html>
