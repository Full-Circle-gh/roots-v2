<script>
const RESOLUTIONS = [
  { w: 390, h: 844, platform: 'ios',     name: 'iPhone 14 / 15' },
  { w: 375, h: 667, platform: 'ios',     name: 'iPhone SE / 8' },
  { w: 430, h: 932, platform: 'ios',     name: 'iPhone Pro Max' },
  { w: 360, h: 640, platform: 'android', name: 'Android small (S8)' },
  { w: 360, h: 800, platform: 'android', name: 'Android common (S20)' },
  { w: 412, h: 915, platform: 'android', name: 'Pixel 7' },
];

const state = { config: null, products: [], categories: [], flashSales: [], lang: 'en' };
// Initial lang from query — lets the /cms iframe sync its EN/中 toggle by
// re-loading /storefront?lang=cn. The visible lang-toggle still wins on tap.
try {
  const qLang = new URL(location.href).searchParams.get('lang');
  if (qLang === 'cn' || qLang === 'en') state.lang = qLang;
} catch {}
// `?preview=1` — the Live Preview drawer in /retail-admin and /cms loads
// this page inside an iframe wrapped in its own phone frame. Without this
// hook the storefront's own simulated chrome (topbar, notch, fake status
// bar) would double up. The body class is consumed by .preview-mode CSS.
try {
  const p = new URL(location.href).searchParams.get('preview');
  if (p === '1') document.documentElement.classList.add('preview-mode'),
                 document.addEventListener('DOMContentLoaded', () => document.body.classList.add('preview-mode'));
} catch {}

function $(s) { return document.querySelector(s); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// Rich descriptions are TinyMCE HTML (e.g. "<!-- x-tinymce/html --><p><strong>…").
// When we fall back to one as a short tagline, flatten it to readable plain text
// first so raw tags/comments never leak into the list snippet.
function stripRichText(s) {
  return String(s == null ? '' : s)
    .replace(/<!--[\s\S]*?-->/g, ' ')   // drop HTML comments incl. x-tinymce marker
    .replace(/<[^>]+>/g, ' ')           // drop tags
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#39;/gi, "'")
    .replace(/\s+/g, ' ')
    .trim();
}

// Customers see one language at a time, picked by their WeChat preference.
// This preview lets the team flip between EN / 中 with a toggle.
function pickLang(en, cn) {
  const a = (en || '').trim(), b = (cn || '').trim();
  if (state.lang === 'cn') return b || a;
  return a || b;
}
function biLabel(en, cn) { return escapeHtml(pickLang(en, cn)); }

// Mirror of cms.html — pick the right inner markup for the announcement
// animation. Marquee / scroll need a clipped duplicated track; per-letter
// animations need staggered spans; static / flicker stay plain.
function renderAnnounceInner(text, anim, linked) {
  const safe = escapeHtml(text);
  const chev = linked ? '<span class="announce-chev">›</span>' : '';
  if (anim === 'marquee_rtl' || anim === 'marquee_ltr') {
    return `<div class="anim-clip"><div class="anim-track"><span>${safe}</span><span aria-hidden="true">${safe}</span></div></div>${chev}`;
  }
  if (anim === 'scroll_up' || anim === 'scroll_down') {
    return `<div class="anim-vclip"><div class="anim-vtrack"><span>${safe}</span><span aria-hidden="true">${safe}</span></div></div>${chev}`;
  }
  if (anim === 'typewriter' || anim === 'fade_in_letters' || anim === 'wave') {
    const chars = Array.from(text).map((ch, i) =>
      `<span class="ch" style="--i:${i}">${ch === ' ' ? '&nbsp;' : escapeHtml(ch)}</span>`
    ).join('');
    return `<span class="letters">${chars}</span>${chev}`;
  }
  return `<span>${safe}</span>${chev}`;
}

// Category names in the kitchen DB are mixed strings ("Bakery 烘焙"). Split
// on the first CJK char and pick the side that matches state.lang.
function categoryNameForLang(name) {
  const s = String(name || '');
  const m = s.match(/[一-鿿]/);
  if (!m) return s;
  const en = s.slice(0, m.index).trim();
  const cn = s.slice(m.index).trim();
  return state.lang === 'cn' ? (cn || en) : (en || cn);
}
function getBi(b, key) {
  return { en: b[key + '_en'] ?? b[key] ?? '', cn: b[key + '_cn'] ?? '' };
}
function getCtas(b) {
  if (Array.isArray(b.ctas)) {
    return b.ctas.map(c => ({
      label_en: c.label_en ?? c.label ?? '',
      label_cn: c.label_cn ?? '',
      target:   c.target   ?? '',
      style:    c.style    ?? 'primary',
    }));
  }
  if (b.cta_label) return [{ label_en: b.cta_label, label_cn: '', target: b.cta_target || '', style: 'primary' }];
  return [];
}
function thumbUrl(p) { return p?.image_url || p?.image_data || ''; }
function priceOf(p) {
  const retail = Number(p?.price) || 0;  // public endpoint exposes retail as `price`
  return retail > 0 ? retail : 0;
}

const TAB_LABELS = {
  en: { home: 'Home', shop: 'Shop', cart: 'Cart', me: 'Me' },
  cn: { home: '首页', shop: '商品', cart: '购物车', me: '我的' },
};
function applyTabLabels() {
  document.querySelectorAll('[data-tab-label]').forEach(el => {
    el.textContent = TAB_LABELS[state.lang][el.dataset.tabLabel] || el.textContent;
  });
}

// ═══════════════ LANG TOGGLE ═══════════════
(function buildLangToggle() {
  try { state.lang = localStorage.getItem('storefront_lang') || 'en'; } catch {}
  if (!['en', 'cn'].includes(state.lang)) state.lang = 'en';
  document.querySelectorAll('#lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === state.lang);
    b.addEventListener('click', () => {
      state.lang = b.dataset.lang;
      document.querySelectorAll('#lang-toggle button').forEach(x =>
        x.classList.toggle('active', x === b));
      try { localStorage.setItem('storefront_lang', state.lang); } catch {}
      applyTabLabels();
      // Re-render with current data — no refetch needed
      if (state.config) render(state.config.home?.layout || []);
    });
  });
  applyTabLabels();
})();

// ═══════════════ RESOLUTION PICKER ═══════════════
(function buildResolutionPicker() {
  const sel = $('#device-select');
  sel.innerHTML = RESOLUTIONS.map((r, i) => `<option value="${i}">${r.name} · ${r.w}×${r.h}</option>`).join('');
  let saved = 0;
  try { saved = parseInt(localStorage.getItem('storefront_res') || '0', 10) || 0; } catch {}
  if (saved < 0 || saved >= RESOLUTIONS.length) saved = 0;
  sel.value = String(saved);
  applyResolution(saved);
  sel.addEventListener('change', e => {
    const idx = parseInt(e.target.value, 10) || 0;
    applyResolution(idx);
    try { localStorage.setItem('storefront_res', String(idx)); } catch {}
  });
})();
function applyResolution(idx) {
  const r = RESOLUTIONS[idx] || RESOLUTIONS[0];
  const phone = $('.phone');
  if (window.matchMedia('(max-width: 500px)').matches) return;  // mobile: full screen
  phone.style.width = r.w + 'px';
  phone.style.minHeight = r.h + 'px';
  phone.dataset.platform = r.platform;
}

// ═══════════════ FETCH + RENDER ═══════════════
// ?page=home (default) | promotions | categories | membership | about | onboarding
function currentPage() {
  const p = new URL(location.href).searchParams.get('page') || 'home';
  return ['home', 'promotions', 'categories', 'membership', 'about', 'onboarding'].includes(p) ? p : 'home';
}

// ?draft=1 swaps the public /api/retail/config call for the admin-only
// preview-config endpoint, which overlays draft layouts on top of the live
// snapshot. Used by /cms's "Live mirror" iframe so the office can see what
// the customer will see once they publish.
const DRAFT_MODE = new URL(location.href).searchParams.get('draft') === '1';
const CFG_URL = DRAFT_MODE
  ? '/api/retail-admin/storefront/preview-config'
  : '/api/retail/config';

async function reload() {
  try {
    const [cfg, prods, cats, flash] = await Promise.all([
      fetch(CFG_URL, { credentials: 'same-origin', cache: 'no-store' }).then(r => r.json()),
      fetch('/api/retail/products?limit=100').then(r => r.json()),
      fetch('/api/retail/categories').then(r => r.json()),
      fetch('/api/retail/flash-sales').then(r => r.json()).catch(() => ({ data: [] })),
    ]);
    if (!cfg?.success) {
      // Draft fetch needs admin auth — if the staff session lapsed, fall
      // back to the live config so the preview is still useful.
      if (DRAFT_MODE) {
        const live = await fetch('/api/retail/config', { cache: 'no-store' }).then(r => r.json());
        if (live?.success) { cfg.success = true; cfg.data = live.data; }
      }
      if (!cfg?.success) throw new Error('config_failed');
    }
    state.config = cfg.data;
    state.products = prods?.data || [];
    state.categories = cats?.data || [];
    state.flashSales = flash?.data || [];
    $('#version').textContent = (state.config.version || '—') + (DRAFT_MODE ? ' · DRAFT' : '');
    const page = currentPage();
    render(state.config[page]?.layout || []);
  } catch (e) {
    $('#phone-content').innerHTML = `<div class="empty-state">Could not load storefront: ${escapeHtml(e.message)}</div>`;
  }
}
reload();

// Parent (/cms iframe) can postMessage 'cms:reload' to ask us to re-fetch
// after a draft save. We also accept 'cms:setPage' to switch pages without
// a full iframe reload.
window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.type === 'cms:reload') reload();
  if (e.data.type === 'cms:setPage' && typeof e.data.page === 'string') {
    const u = new URL(location.href);
    u.searchParams.set('page', e.data.page);
    history.replaceState({}, '', u);
    reload();
  }
});

// ─── Click routing for the preview ─────────────────────────────────────
// The mini app routes CTA events to real pages. The /storefront preview
// only simulates the visual — we mirror the routes for the CMS-driven
// pages (home, promotions, categories, membership, onboarding) by
// flipping the ?page= query and re-rendering. Other targets (shop, cart,
// product:X, category:X, etc.) toast a "would navigate to..." stub since
// those pages don't exist on the web preview.
const PAGE_TARGETS = new Set(['home', 'promotions', 'categories', 'membership', 'about', 'onboarding']);
const TAB_TARGETS = new Set(['shop', 'cart', 'me', 'coupons', 'wallet']);

function previewToast(msg) {
  let t = document.getElementById('preview-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'preview-toast';
    t.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);padding:10px 18px;background:rgba(20,20,24,.96);color:#ecebe5;font:500 12px -apple-system,sans-serif;border-radius:8px;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:1000;opacity:0;transition:opacity .2s ease;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(() => { t.style.opacity = '1'; });
  clearTimeout(previewToast._h);
  previewToast._h = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

function routeCtaTarget(target) {
  if (!target) return;
  if (PAGE_TARGETS.has(target)) {
    const url = new URL(location.href);
    url.searchParams.set('page', target);
    history.pushState({}, '', url.toString());
    const page = currentPage();
    render(state.config?.[page]?.layout || []);
    window.scrollTo({ top: 0, behavior: 'instant' });
    return;
  }
  if (TAB_TARGETS.has(target)) {
    previewToast(`Would open the ${target} tab in the mini app`);
    return;
  }
  if (target.startsWith('product:')) {
    previewToast(`Would open product #${target.split(':')[1]} in the mini app`);
    return;
  }
  if (target.startsWith('category:')) {
    previewToast(`Would filter the Shop tab to category #${target.split(':')[1]} in the mini app`);
    return;
  }
  previewToast(`Unknown target: ${target}`);
}

// Browser back/forward — re-render the page the URL now points at.
window.addEventListener('popstate', () => {
  const page = currentPage();
  render(state.config?.[page]?.layout || []);
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-cta-target]');
  if (!el) return;
  e.preventDefault();
  routeCtaTarget(el.dataset.ctaTarget);
});

// Leaderboard fetch + cache — feeds the `leaderboard` block. 10-min TTL
// to match the server-side cache; reveal_mode varies per block but the
// server applies it post-cache, so we key on all four params here.
state.leaderboardCache = state.leaderboardCache || new Map();
state._lbInFlight = state._lbInFlight || new Set();
function loadLeaderboard(metric, period, top_n, reveal_mode) {
  const key = `${metric}|${period}|${top_n}|${reveal_mode}`;
  const cached = state.leaderboardCache.get(key);
  if (cached && (Date.now() - cached.t) < 10 * 60 * 1000) return cached;
  if (state._lbInFlight.has(key)) return cached || { loaded: false, entries: [] };
  state._lbInFlight.add(key);
  const qs = `metric=${encodeURIComponent(metric)}&period=${encodeURIComponent(period)}&top_n=${top_n}&reveal_mode=${encodeURIComponent(reveal_mode)}`;
  fetch(`/api/retail/storefront/leaderboard?${qs}`)
    .then(r => r.json())
    .then(j => {
      state.leaderboardCache.set(key, { t: Date.now(), loaded: true, entries: j?.data?.entries || [] });
      state._lbInFlight.delete(key);
      if (state.config) render(state.config[currentPage()]?.layout || []);
    })
    .catch(() => {
      state.leaderboardCache.set(key, { t: Date.now(), loaded: true, entries: [] });
      state._lbInFlight.delete(key);
      // Re-render like the success path — otherwise the block stays stuck on
      // its pulsing skeleton (rendered with loaded:false) until some unrelated
      // event forces a render.
      if (state.config) render(state.config[currentPage()]?.layout || []);
    });
  return cached || { loaded: false, entries: [] };
}

// Top-selling fetch + cache — same pattern as CMS: lazy fetch with a
// 60s TTL, re-render the current page when fresh data arrives.
state.topProductsCache = state.topProductsCache || new Map();
state._topInFlight = state._topInFlight || new Set();
function loadTopProducts(channel, window, limit) {
  const key = `${channel}|${window}|${limit}`;
  const cached = state.topProductsCache.get(key);
  if (cached && (Date.now() - cached.t) < 60 * 1000) return cached.products;
  if (state._topInFlight.has(key)) return cached?.products || [];
  state._topInFlight.add(key);
  fetch(`/api/retail/products/top?channel=${encodeURIComponent(channel)}&window=${encodeURIComponent(window)}&limit=${limit}`)
    .then(r => r.json())
    .then(j => {
      state.topProductsCache.set(key, { t: Date.now(), products: j?.data || [] });
      state._topInFlight.delete(key);
      if (state.config) render(state.config[currentPage()]?.layout || []);
    })
    .catch(() => {
      // Cache an empty result on failure (negative caching) so a failing
      // endpoint isn't re-fetched on every re-render. The 60s TTL above lets
      // it retry later. Without this, each render re-fires the request.
      state.topProductsCache.set(key, { t: Date.now(), products: [] });
      state._topInFlight.delete(key);
    });
  return cached?.products || [];
}

function render(blocks) {
  const mount = $('#phone-content');
  if (!blocks.length) {
    mount.innerHTML = `<div class="empty-state">Nothing published yet. Open the <a href="/cms" style="color:var(--ink)">CMS</a> and publish a layout.</div>`;
    return;
  }
  mount.innerHTML = blocks.map(renderBlock).join('');
}

function renderBlock(b) {
  switch (b.type) {
    case 'announcement_bar': {
      const colorMap = { 'lime-leaf': 'var(--lime)', 'forest-kale': 'var(--forest)', 'berry-punch': 'var(--berry)', 'carrot-blaze': 'var(--carrot)', 'papaya-glow': 'var(--papaya)', 'oat-milk': 'var(--oat)', 'ink': 'var(--ink)' };
      const bg = colorMap[b.bg_color] || b.bg_color || 'var(--lime)';
      const fg = colorMap[b.fg_color] || b.fg_color || 'var(--ink)';
      const text = pickLang(b.text_en, b.text_cn);
      const linked = !!b.link_target;
      const anim = b.animation || 'static';
      const speed = b.speed || 'normal';
      const inner = renderAnnounceInner(text, anim, linked);
      const targetAttr = linked ? ` data-cta-target="${escapeAttr(b.link_target)}"` : '';
      return `<div class="b-announce anim-${anim} speed-${speed}${linked ? ' linked' : ''}"${targetAttr} style="background: ${bg}; color: ${fg}">${inner}</div>`;
    }
    case 'hero_banner': {
      const view = b.view || 'full';
      const ctas = getCtas(b);
      if (view === 'split') {
        const hl = getBi(b, 'headline');
        const sub = getBi(b, 'subtitle');
        const panelBg = brandColorVar(b.panel_bg_color) || 'var(--oat)';
        const panelFg = brandColorVar(b.panel_fg_color) || 'var(--ink)';
        const imgHtml = b.video_url
          ? `<video src="${escapeAttr(b.video_url)}"${b.image_url ? ` poster="${escapeAttr(b.image_url)}"` : ''} autoplay muted loop playsinline></video>`
          : b.image_url
          ? `<img src="${escapeAttr(b.image_url)}" alt="">`
          : `<div class="placeholder">No image set</div>`;
        return `<div class="b-hero b-hero-split">
          <div class="split-img">${imgHtml}</div>
          <div class="split-panel" style="background:${panelBg};color:${panelFg}">
            ${hl.en || hl.cn ? `<div class="headline">${biLabel(hl.en, hl.cn)}</div>` : ''}
            ${sub.en || sub.cn ? `<div class="subtitle">${biLabel(sub.en, sub.cn)}</div>` : ''}
            ${ctas.length ? `<div class="cta-stack">${ctas.map(c =>
              `<div class="cta-btn ${escapeAttr(c.style || 'primary')}"${c.target ? ` data-cta-target="${escapeAttr(c.target)}"` : ''}>${biLabel(c.label_en, c.label_cn)}</div>`
            ).join('')}</div>` : ''}
          </div>
        </div>`;
      }
      let style = '';
      if (b.image_aspect && b.image_url) {
        style = `aspect-ratio: ${b.image_aspect}; height: auto`;
      } else {
        style = `height: ${(b.height_px || 280)}px`;
      }
      let inner = '';
      if (b.video_url) inner += `<video src="${escapeAttr(b.video_url)}"${b.image_url ? ` poster="${escapeAttr(b.image_url)}"` : ''} autoplay muted loop playsinline></video>`;
      else if (b.image_url) inner += `<img src="${escapeAttr(b.image_url)}" alt="">`;
      else inner += `<div class="placeholder">No image set</div>`;
      if ((b.video_url || b.image_url) && ctas.length) {
        inner += `<div class="cta-stack">${ctas.map(c =>
          `<div class="cta-btn ${escapeAttr(c.style || 'primary')}"${c.target ? ` data-cta-target="${escapeAttr(c.target)}"` : ''}>${biLabel(c.label_en, c.label_cn)}</div>`
        ).join('')}</div>`;
      }
      return `<div class="b-hero b-hero-full" style="${style}">${inner}</div>`;
    }
    case 'category_tabs': {
      const view = b.view || 'tiles';
      const cats = (b.category_ids || []).map(id => state.categories.find(c => c.id === id)).filter(Boolean);
      const ck = getBi(b, 'kicker'); const ct = getBi(b, 'title');
      const seeAll = state.lang === 'cn' ? '查看全部' : 'SEE ALL';
      const catWord = state.lang === 'cn' ? '分类' : 'CATEGORY';
      const head = `<div class="head"><div><div class="kicker">${biLabel(ck.en, ck.cn)}</div><div class="ttl">${biLabel(ct.en, ct.cn)}</div></div><div class="more">${seeAll}</div></div>`;
      if (!cats.length) return `<div class="b-cattabs b-cattabs-${view}">${head}</div>`;

      if (view === 'icons') {
        const cols = Math.max(3, Math.min(5, b.columns || 4));
        const icons = cats.map((c, i) => {
          const name = categoryNameForLang(c.name);
          const letter = (name.trim()[0] || '').toUpperCase();
          return `<div class="icon-tile">
            <div class="icon-circle c${i % 6}">${escapeHtml(letter)}</div>
            <div class="icon-name">${escapeHtml(name)}</div>
          </div>`;
        }).join('');
        return `<div class="b-cattabs b-cattabs-icons">${head}<div class="icons-grid cols-${cols}">${icons}</div></div>`;
      }

      // Scroll view — single horizontal row of circles, drag/swipe left-right.
      // Mirrors the CMS canvas renderer at public/cms.html (category_tabs case).
      if (view === 'scroll') {
        const scrolls = cats.map((c, i) => {
          const name = categoryNameForLang(c.name);
          const letter = (name.trim()[0] || '').toUpperCase();
          return `<div class="cattabs-scroll-tile">
            <div class="icon-circle c${i % 6}">${escapeHtml(letter)}</div>
            <div class="icon-name">${escapeHtml(name)}</div>
          </div>`;
        }).join('');
        return `<div class="b-cattabs b-cattabs-scroll">${head}<div class="cattabs-scroll-rail">${scrolls}</div></div>`;
      }

      const tiles = cats.map((c, i) => `
        <div class="tile c${i % 6}">
          <div class="num">0${i + 1} · ${catWord}</div>
          <div class="name">${escapeHtml(categoryNameForLang(c.name))}</div>
        </div>`).join('');
      return `<div class="b-cattabs b-cattabs-tiles">${head}<div class="grid">${tiles}</div></div>`;
    }
    case 'featured_item': {
      const p = state.products.find(x => x.id === b.product_id);
      if (!p) return `<div class="b-featured"><div class="empty-state">Featured product unavailable.</div></div>`;
      const src = thumbUrl(p);
      const k = getBi(b, 'kicker');
      const price = priceOf(p);
      return `<div class="b-featured">
        <div class="card">
          <div class="img">${src ? `<img src="${escapeAttr(src)}">` : ''}</div>
          <div>
            <div class="kicker">${biLabel(k.en, k.cn)}</div>
            <div class="name">${biLabel(p.name_en, p.name_cn)}</div>
            <div class="price">${price > 0 ? `¥${price.toFixed(2)}` : '—'}</div>
          </div>
        </div>
      </div>`;
    }
    case 'product_grid': {
      const view = b.view || 'grid';
      let products = [];
      if (b.source_type === 'manual') {
        products = (b.product_ids || []).map(id => state.products.find(p => p.id === id)).filter(Boolean);
      } else if (b.source_type === 'top_selling') {
        products = loadTopProducts(b.top_channel || 'combined', b.top_window || '7d', b.limit || 6);
      } else if (b.source_type === 'new_arrivals') {
        products = state.products.slice().sort((a, c) =>
          String(c.created_at || '').localeCompare(String(a.created_at || '')));
      } else {
        const cat = state.categories.find(c => c.id === b.category_id);
        products = state.products.filter(p => !b.category_id || p.category === cat?.name);
      }
      products = products.slice(0, b.limit || 6);
      const cols = b.columns || 2;
      const gk = getBi(b, 'kicker'); const gt = getBi(b, 'title');
      const seeAll = state.lang === 'cn' ? '查看全部' : 'SEE ALL';
      const head = `<div class="head">
        <div>
          <div class="kicker">${biLabel(gk.en, gk.cn)}</div>
          <div class="ttl">${biLabel(gt.en, gt.cn)}</div>
        </div>
        <div class="more">${seeAll}</div>
      </div>`;
      if (!products.length) {
        return `<div class="b-grid b-grid-${view}">${head}<div class="empty-state" style="padding: 28px 0">No products available yet.</div></div>`;
      }
      const isTopSelling = b.source_type === 'top_selling';
      function rankBadge(idx) {
        if (!isTopSelling) return '';
        const rank = idx + 1;
        const cls = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-n';
        const label = rank === 1 ? '🏆 NO. 01' : `NO. ${rank < 10 ? '0' + rank : rank}`;
        return `<div class="rank-badge ${cls}">${label}</div>`;
      }
      function soldCaption(p) {
        if (!isTopSelling) return '';
        const units = Number(p.units_sold) || 0;
        if (units <= 0) return '';
        const txt = state.lang === 'cn' ? `已售 ${units}` : `${units} SOLD`;
        return `<div class="sold-caption">${escapeHtml(txt)}</div>`;
      }
      const cards = products.map((p, idx) => {
        const src = thumbUrl(p); const price = priceOf(p);
        const rankCardCls = isTopSelling ? ` has-rank rank-card-${idx + 1}` : '';
        return `<div class="card${rankCardCls}">
          <div class="img">${src ? `<img src="${escapeAttr(src)}">` : ''}${rankBadge(idx)}</div>
          <div class="name">${biLabel(p.name_en, p.name_cn)}</div>
          <div class="price">${price > 0 ? `¥${price.toFixed(2)}` : '—'}</div>
          ${soldCaption(p)}
        </div>`;
      }).join('');
      if (view === 'scroll') {
        return `<div class="b-grid b-grid-scroll">${head}<div class="scroll-rail">${cards}</div></div>`;
      }
      if (view === 'list') {
        const listRows = products.map((p, idx) => {
          const src = thumbUrl(p); const price = priceOf(p);
          const tagline = pickLang(p.tagline_en, p.tagline_cn) || stripRichText(pickLang(p.description_en, p.description_cn)) || '';
          const rankCardCls = isTopSelling ? ` has-rank rank-card-${idx + 1}` : '';
          return `<div class="list-row${rankCardCls}">
            <div class="img">${src ? `<img src="${escapeAttr(src)}">` : ''}${rankBadge(idx)}</div>
            <div class="meta">
              <div class="name">${biLabel(p.name_en, p.name_cn)}</div>
              ${tagline ? `<div class="tagline">${escapeHtml(tagline.slice(0, 80))}${tagline.length > 80 ? '…' : ''}</div>` : ''}
              <div class="price">${price > 0 ? `¥${price.toFixed(2)}` : '—'}</div>
              ${soldCaption(p)}
            </div>
          </div>`;
        }).join('');
        return `<div class="b-grid b-grid-list">${head}<div class="list-rows">${listRows}</div></div>`;
      }
      return `<div class="b-grid b-grid-grid">${head}<div class="grid c${cols}">${cards}</div></div>`;
    }
    case 'spacer': {
      return `<div class="b-spacer" style="height: ${b.height_px || 24}px"></div>`;
    }
    case 'flash_sale_strip': {
      const view = b.view || 'strip';
      const bg = brandColorVar(b.bg_color) || 'var(--berry)';
      const fg = brandColorVar(b.fg_color) || 'var(--oat)';
      const active = (state.flashSales || []).filter(p => p.flash?.state === 'active');
      const limit = view === 'banner' ? 0 : Math.max(1, Math.min(8, b.product_limit || 3));
      const products = limit > 0 ? active.slice(0, limit) : [];
      // Card layout: 'grid' wraps cards two-per-row (no sideways swipe).
      const fsGridCls = (b.card_layout === 'grid' && view !== 'banner') ? ' is-grid' : '';
      const k = getBi(b, 'kicker');
      const t = getBi(b, 'title');
      const haveSomething = products.length > 0 || (view === 'banner' && active.length > 0);
      if (!haveSomething) {
        if (b.hide_when_empty) return '';
        const empty = pickLang(b.empty_text_en, b.empty_text_cn);
        return `<div class="b-flash b-flash-${view}" style="background:${bg};color:${fg}">
          <div class="fs-empty-head">
            <div class="kicker">${biLabel(k.en, k.cn)}</div>
            <div class="ttl">${biLabel(t.en, t.cn)}</div>
          </div>
          <div class="empty-flash">${escapeHtml(empty || '')}</div>
        </div>`;
      }
      const clockSource = products.length ? products : active;
      const soonestEnd = clockSource
        .map(p => new Date(p.flash.ends_at).getTime())
        .filter(Number.isFinite)
        .sort((a, b) => a - b)[0];
      const ms = soonestEnd ? Math.max(0, soonestEnd - Date.now()) : 0;
      const split = splitCountdown(ms);
      const cellsLabels = state.lang === 'cn' ? ['天','时','分','秒'] : ['DAYS','HRS','MIN','SEC'];
      const heroCells = [split.d, split.h, split.m, split.s].map((v, i) => `
        <div class="hero-cell">
          <div class="hero-num">${String(v).padStart(2, '0')}</div>
          <div class="hero-lbl">${cellsLabels[i]}</div>
        </div>`).join('<div class="hero-sep">:</div>');
      const stripCells = [split.d, split.h, split.m, split.s]
        .map(v => `<span class="ct-num">${String(v).padStart(2, '0')}</span>`)
        .join('<span class="ct-sep">:</span>');
      const endsLbl = state.lang === 'cn' ? '距结束' : 'ENDS IN';
      const ctaLabel = pickLang(b.cta_label_en, b.cta_label_cn);
      const cards = products.map(p => {
        const fp = Number(p.flash.price) || 0;
        const rp = Number(p.price) || 0;
        const off = rp > 0 ? Math.round(((rp - fp) / rp) * 100) : 0;
        const img = p.image_url || p.image_data || '';
        const name = pickLang(p.name_en, p.name_cn);
        const sold = p.flash.stock_sold || 0;
        const cap = p.flash.stock_limit;
        const pct = (cap != null && cap > 0) ? Math.min(100, Math.round((sold / cap) * 100)) : null;
        const meterLabel = state.lang === 'cn'
          ? (cap != null ? `已抢 ${sold} / ${cap}` : `已抢 ${sold}`)
          : (cap != null ? `${sold} of ${cap} sold` : `${sold} sold`);
        return `<div class="fs-card">
          <div class="img">${img ? `<img src="${escapeAttr(img)}" alt="">` : ''}${off > 0 ? `<span class="badge">-${off}%</span>` : ''}</div>
          <div class="meta">
            <div class="name">${escapeHtml(name)}</div>
            <div class="prices">
              <span class="now">¥${fp.toFixed(2)}</span>
              ${rp > fp ? `<span class="was">¥${rp.toFixed(2)}</span>` : ''}
            </div>
            ${pct != null ? `<div class="meter"><span style="width:${pct}%"></span></div>` : ''}
            <div class="meter-lbl">${escapeHtml(meterLabel)}</div>
          </div>
        </div>`;
      }).join('');

      // ── Design directions: classic / editorial / urgency ──────────────
      // Coral band + cream zigzag + live countdown + SHOP NOW + carousel.
      // Mirrors cms.html; every colour rides on a --fs-* var.
      if (view === 'classic' || view === 'editorial' || view === 'urgency') {
        const fsVar = (token, fallback) => brandColorVar(token) || fallback || '';
        const EN = ({ refined: { head: .9, border: 1.5, radius: 12 },
                      balanced: { head: 1, border: 1.5, radius: 16 },
                      bold: { head: 1.14, border: 2, radius: 18 } })[b.energy] || { head: 1, border: 1.5, radius: 16 };
        const styleParts = [`background:${bg}`, `color:${fg}`,
          `--fs-head:${EN.head}`, `--fs-border:${EN.border}px`, `--fs-radius:${EN.radius}px`];
        const setVar = (prop, token) => { const v = brandColorVar(token); if (v) styleParts.push(`${prop}:${v}`); };
        setVar('--fs-ink', b.ink_color);
        setVar('--fs-panel', b.panel_color);
        setVar('--fs-tile', b.tile_color);
        setVar('--fs-accent', b.accent_color);
        setVar('--fs-fill', b.fill_color);
        setVar('--fs-price', b.price_color);
        const styleStr = styleParts.join(';');
        const cornerClass = b.corner_radius ? ' corner-' + b.corner_radius : ' corner-subtle';
        const pulse = b.urgency === 'frantic' ? ' fs-pulse' : '';
        const pulseDot = b.urgency === 'frantic' ? ' fs-pulse-dot' : '';

        // cream zigzag teeth hanging into the band (fill tracks --fs-panel)
        const teeth = 30, ZW = 120, zh = 6, zw = ZW / teeth;
        let zd = 'M0 0 ';
        for (let i = 0; i < teeth; i++) zd += `L${(i * zw + zw / 2).toFixed(2)} ${zh} L${((i + 1) * zw).toFixed(2)} 0 `;
        zd += 'Z';
        const zig = `<svg class="fsd-zig" viewBox="0 0 ${ZW} ${zh}" preserveAspectRatio="none" width="100%" height="${zh}"><path d="${zd}" fill="var(--fs-panel)"></path></svg>`;
        const cap = `<div class="fsd-cap"></div>${zig}`;

        const vals = [split.d, split.h, split.m, split.s].map(v => String(v).padStart(2, '0'));
        const endsAttr = soonestEnd ? ` data-ends-at="${escapeAttr(new Date(soonestEnd).toISOString())}"` : '';
        const kHtml = (k.en && k.cn)
          ? `${escapeHtml(k.en)} <span class="cn">· ${escapeHtml(k.cn)}</span>`
          : escapeHtml(k.en || k.cn || '');
        const headline = escapeHtml(pickLang(b.title_en, b.title_cn) || '');
        const shop = ctaLabel ? `${escapeHtml(ctaLabel)} →` : '';
        const ctaAttr = b.cta_target ? ` data-cta-target="${escapeAttr(b.cta_target)}"` : '';

        const designCards = (badge) => products.map(p => {
          const fp = Number(p.flash.price) || 0;
          const rp = Number(p.price) || 0;
          const off = rp > 0 ? Math.round(((rp - fp) / rp) * 100) : 0;
          const img = p.image_url || p.image_data || '';
          const nm = pickLang(p.name_en, p.name_cn) || '';
          const sub = state.lang === 'cn' ? (p.name_en || '') : (p.name_cn || '');
          const sold = p.flash.stock_sold || 0;
          const capN = p.flash.stock_limit;
          const pct = (capN != null && capN > 0) ? Math.min(100, Math.round((sold / capN) * 100)) : null;
          const soldLbl = state.lang === 'cn'
            ? (capN != null ? `已抢 ${sold} / ${capN}` : `已抢 ${sold}`)
            : (capN != null ? `${sold} OF ${capN} SOLD` : `${sold} SOLD`);
          const badgeHtml = off > 0 ? `<div class="fsd-badge-${badge}">−${off}%</div>` : '';
          return `<div class="fsd-card" data-product-id="${escapeAttr(p.id)}">
            <div class="fsd-img">${img ? `<img src="${escapeAttr(img)}" alt="">` : ''}${badgeHtml}</div>
            <div class="fsd-meta">
              <div class="fsd-name">${escapeHtml(nm)}</div>
              ${sub ? `<div class="fsd-cn">${escapeHtml(sub)}</div>` : ''}
              <div class="fsd-prices">
                <span class="fsd-now">¥${fp.toFixed(2)}</span>
                ${rp > fp ? `<span class="fsd-was">¥${rp.toFixed(2)}</span>` : ''}
              </div>
              ${pct != null ? `<div class="fsd-meter"><span style="width:${pct}%"></span></div>` : ''}
              <div class="fsd-sold">${escapeHtml(soldLbl)}</div>
            </div>
          </div>`;
        }).join('');

        if (view === 'classic') {
          const tiles = vals.map((v, i) => `
            <div class="fsd-tile"><div class="fsd-tile-num js-fsd-num">${v}</div><div class="fsd-tile-lbl">${cellsLabels[i]}</div></div>${i < 3 ? '<span class="fsd-colon">:</span>' : ''}`).join('');
          return `<div class="b-flash b-flash-classic${cornerClass}" data-block-id="${escapeAttr(b.id)}" style="${styleStr}">${cap}
            <div class="fsd-body">
              <div class="fsd-head">
                <div class="fsd-kicker">${kHtml}</div>
                ${headline ? `<div class="fsd-title">${headline}</div>` : ''}
              </div>
              <div class="fsd-ends">
                <div class="fsd-ends-lbl">${endsLbl}</div>
                <div class="fsd-clock${pulse}"${endsAttr}>${tiles}</div>
              </div>
              ${shop ? `<div class="fsd-cta-wrap"><div class="fsd-cta"${ctaAttr}>${shop}</div></div>` : ''}
              <div class="fsd-cards${fsGridCls}">${designCards('corner')}</div>
            </div>
          </div>`;
        }

        if (view === 'editorial') {
          const off = products.reduce((mx, p) => {
            const rp = Number(p.price) || 0, fp = Number(p.flash.price) || 0;
            return rp > 0 ? Math.max(mx, Math.round(((rp - fp) / rp) * 100)) : mx;
          }, 0);
          const offLine = state.lang === 'cn'
            ? `最高省 ${off}%<br><span class="cn">限时秒杀</span>`
            : `Up to ${off}% off<br><span class="cn">最高 ${off}%</span>`;
          const seg = vals.map((v, i) => `
            <div class="fsd-seg"><div class="fsd-seg-num js-fsd-num">${v}</div><div class="fsd-seg-lbl">${cellsLabels[i]}</div></div>${i < 3 ? '<div class="fsd-seg-div"></div>' : ''}`).join('');
          return `<div class="b-flash b-flash-editorial${cornerClass}" data-block-id="${escapeAttr(b.id)}" style="${styleStr}">${cap}
            <div class="fsd-body">
              <div class="fsd-head">
                <div class="fsd-kicker">${kHtml}</div>
                ${headline ? `<div class="fsd-title">${headline}</div>` : ''}
                <div class="fsd-ticker${pulse}"${endsAttr}>${seg}</div>
                <div class="fsd-cta-row">
                  ${shop ? `<div class="fsd-cta"${ctaAttr}>${shop}</div>` : ''}
                  <div class="fsd-off">${offLine}</div>
                </div>
              </div>
              <div class="fsd-cards${fsGridCls}">${designCards('ribbon')}</div>
            </div>
          </div>`;
        }

        // view === 'urgency'
        const tiles = vals.map((v, i) => `
          <div class="fsd-tile"><div class="fsd-tile-num js-fsd-num">${v}</div><div class="fsd-tile-lbl">${cellsLabels[i]}</div></div>`).join('');
        const liveLbl = state.lang === 'cn' ? '限时秒杀 · 进行中' : 'FLASH SALE · LIVE';
        const subLine = state.lang === 'cn' ? '' : (t.cn ? `<div class="fsd-sub">${escapeHtml(t.cn)}</div>` : '');
        return `<div class="b-flash b-flash-urgency${cornerClass}" data-block-id="${escapeAttr(b.id)}" style="${styleStr}">${cap}
          <div class="fsd-body">
            <div class="fsd-head">
              <div class="fsd-live"><span class="fsd-live-dot${pulseDot}"></span><span class="fsd-live-lbl">${liveLbl}</span></div>
              ${headline ? `<div class="fsd-title">${headline}</div>` : ''}
              ${subLine}
            </div>
            <div class="fsd-clock${pulse}"${endsAttr}>${tiles}</div>
            ${shop ? `<div class="fsd-cta-wrap"><div class="fsd-cta"${ctaAttr}>${shop}</div></div>` : ''}
            <div class="fsd-cards${fsGridCls}">${designCards('stamp')}</div>
          </div>
        </div>`;
      }

      if (view === 'hero' || view === 'banner') {
        return `<div class="b-flash b-flash-${view}" data-block-id="${escapeAttr(b.id)}" style="background:${bg};color:${fg}">
          <div class="hero-kicker">${biLabel(k.en, k.cn)}</div>
          <div class="hero-title">${biLabel(t.en, t.cn)}</div>
          <div class="hero-ends">${endsLbl}</div>
          <div class="hero-clock" data-ends-at="${escapeAttr(new Date(soonestEnd).toISOString())}">${heroCells}</div>
          ${ctaLabel ? `<div class="hero-cta"${b.cta_target ? ` data-cta-target="${escapeAttr(b.cta_target)}"` : ''}>${escapeHtml(ctaLabel)}</div>` : ''}
          ${view === 'hero' && cards ? `<div class="fs-cards hero-cards${fsGridCls}">${cards}</div>` : ''}
        </div>`;
      }
      // strip view (default)
      return `<div class="b-flash b-flash-strip" data-block-id="${escapeAttr(b.id)}" style="background:${bg};color:${fg}">
        <div class="head">
          <div>
            <div class="kicker">${biLabel(k.en, k.cn)}</div>
            <div class="ttl">${biLabel(t.en, t.cn)}</div>
          </div>
          <div class="clock" data-ends-at="${escapeAttr(new Date(soonestEnd).toISOString())}">
            <div class="ct-label">${endsLbl}</div>
            <div class="ct-cells">${stripCells}</div>
          </div>
        </div>
        <div class="fs-cards${fsGridCls}">${cards}</div>
      </div>`;
    }
    case 'coupon_block': {
      const bg = brandColorVar(b.bg_color) || 'var(--pink)';
      const fg = brandColorVar(b.fg_color) || 'var(--ink)';
      const k = getBi(b, 'kicker');
      const t = getBi(b, 'title');
      const sub = pickLang(b.subtitle_en, b.subtitle_cn);
      const disc = pickLang(b.discount_label_en, b.discount_label_cn);
      const cta = pickLang(b.cta_label_en, b.cta_label_cn);
      return `<div class="b-coupon" style="background:${bg};color:${fg}">
        ${disc ? `<div class="cp-disc"><div class="cp-big">${escapeHtml(disc)}</div></div>` : ''}
        <div class="cp-body">
          <div class="cp-kicker">${biLabel(k.en, k.cn)}</div>
          <div class="cp-ttl">${biLabel(t.en, t.cn)}</div>
          ${sub ? `<div class="cp-sub">${escapeHtml(sub)}</div>` : ''}
          ${b.code ? `<div class="cp-code">CODE · ${escapeHtml(b.code)}</div>` : ''}
        </div>
        ${cta ? `<div class="cp-cta"${b.cta_target ? ` data-cta-target="${escapeAttr(b.cta_target)}"` : ''}>${escapeHtml(cta)}</div>` : ''}
      </div>`;
    }
    case 'points_widget': {
      const bg = brandColorVar(b.bg_color) || 'var(--forest)';
      const fg = brandColorVar(b.fg_color) || 'var(--lime)';
      const k = getBi(b, 'kicker');
      const t = getBi(b, 'title');
      const sub = pickLang(b.subtitle_en, b.subtitle_cn);
      const cta = pickLang(b.cta_label_en, b.cta_label_cn);
      return `<div class="b-points" style="background:${bg};color:${fg}">
        <div class="pt-star">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 3 14.5 9 21 9.5 16.5 13.5 18 20 12 16.5 6 20 7.5 13.5 3 9.5 9.5 9 12 3"/></svg>
        </div>
        <div class="pt-body">
          <div class="pt-kicker">${biLabel(k.en, k.cn)}</div>
          <div class="pt-ttl">${biLabel(t.en, t.cn)}</div>
          ${sub ? `<div class="pt-sub">${escapeHtml(sub)}</div>` : ''}
        </div>
        ${cta ? `<div class="pt-cta"${b.cta_target ? ` data-cta-target="${escapeAttr(b.cta_target)}"` : ''}>${escapeHtml(cta)}</div>` : ''}
      </div>`;
    }
    case 'review_card': {
      const view = b.view || 'card';
      const bg = brandColorVar(b.bg_color) || 'var(--oat)';
      const fg = brandColorVar(b.fg_color) || 'var(--ink)';
      const k = getBi(b, 'kicker');
      // Migrate legacy single-review fields into an array when needed.
      let reviews = Array.isArray(b.reviews) && b.reviews.length ? b.reviews : null;
      if (!reviews && (b.quote_en || b.quote_cn || b.author_name)) {
        reviews = [{
          rating: b.rating || 5,
          quote_en: b.quote_en || '', quote_cn: b.quote_cn || '',
          author_name: b.author_name || '',
          author_subline_en: b.author_subline_en || '', author_subline_cn: b.author_subline_cn || '',
          avatar_url: b.avatar_url || '',
        }];
      }
      reviews = reviews || [];
      const starColor = b.star_color ? brandColorVar(b.star_color) : '';
      const starRow = (r, size) => {
        const rating = Math.max(1, Math.min(5, parseInt(r.rating, 10) || 5));
        return `<div class="stars"${size ? ` style="font-size:${size}px"` : ''}>` +
          [1,2,3,4,5].map(i => `<span class="${i <= rating ? 'on' : 'off'}"${i <= rating && starColor ? ` style="color:${starColor}"` : ''}>★</span>`).join('') + '</div>';
      };
      const mono = (r, wrap) => {
        const initial = (r.author_name || '').trim()[0] || '?';
        if (r.avatar_url) return `<div class="rv-mono" style="overflow:hidden;padding:0"><img src="${escapeAttr(r.avatar_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></div>`;
        return wrap
          ? `<div class="rv-mono"><span>${escapeHtml(initial.toUpperCase())}</span></div>`
          : `<div class="rv-mono">${escapeHtml(initial.toUpperCase())}</div>`;
      };
      const personText = (r) => {
        const sub = pickLang(r.author_subline_en, r.author_subline_cn);
        return `<div><div class="name">${escapeHtml(r.author_name || '')}</div>${sub ? `<div class="role">${escapeHtml(sub)}</div>` : ''}</div>`;
      };
      // Inline --rv-* overrides for the inset-card layouts (set only when picked).
      const rvVars = [
        ['--rv-card', b.card_color], ['--rv-border', b.border_color],
        ['--rv-accent', b.accent_color], ['--rv-circle', b.circle_color],
      ].map(([p, t]) => { const v = brandColorVar(t); return v ? `${p}:${v}` : ''; }).filter(Boolean);
      if (view === 'spotlight' && brandColorVar(b.fg_color)) rvVars.push(`--rv-cardfg:${brandColorVar(b.fg_color)}`);
      const styleAttr = `background:${bg};color:${fg};${rvVars.join(';')}`;
      if ((view === 'editorial' || view === 'riso' || view === 'spotlight') && reviews.length) {
        if (view === 'editorial') {
          const r = reviews[0];
          return `<div class="b-review b-review-editorial" style="${styleAttr}"><div class="rv-card">
            ${k.en || k.cn ? `<div class="ed-kicker"><span class="tick"></span><span class="klabel">${biLabel(k.en, k.cn)}</span><span class="tick"></span></div>` : ''}
            <div style="margin-top:${k.en || k.cn ? 14 : 0}px">${starRow(r)}</div>
            <div class="quote">${escapeHtml(pickLang(r.quote_en, r.quote_cn) || '')}</div>
            <div class="rv-divider"></div>
            <div class="rv-person">${mono(r)}${personText(r)}</div>
          </div></div>`;
        }
        if (view === 'riso') {
          const r = reviews[0];
          return `<div class="b-review b-review-riso" style="${styleAttr}"><div class="rv-card">
            <div class="riso-badge">★★★★★</div>
            <div class="riso-stamp">VERIFIED<small>真实评价</small></div>
            ${k.en || k.cn ? `<div class="riso-kicker">${biLabel(k.en, k.cn)}</div>` : ''}
            <div class="quote">${escapeHtml(pickLang(r.quote_en, r.quote_cn) || '')}</div>
            <div class="rv-person">${mono(r, true)}${personText(r)}</div>
          </div></div>`;
        }
        // spotlight — static at the first review (storefront is a read-only preview)
        const r = reviews[0];
        const thumbs = reviews.map((rv, i) => {
          const ini = (rv.author_name || '').trim()[0] || '?';
          return `<div class="spot-thumb${i === 0 ? ' on' : ''}">${escapeHtml(ini.toUpperCase())}</div>`;
        }).join('');
        return `<div class="b-review b-review-spotlight" style="${styleAttr}">
          <div class="spot-head">
            <div>${k.en || k.cn ? `<div class="spot-kicker">${biLabel(k.en, k.cn)}</div>` : ''}<div class="spot-title">${escapeHtml(pickLang('Loved by locals.', '街坊都爱'))}</div></div>
            <div class="spot-nav"><div class="spot-arrow prev">‹</div><div class="spot-arrow next">›</div></div>
          </div>
          <div class="spot-stage">
            <div class="spot-peek"></div>
            <div class="rv-card">
              <div class="spot-top">${starRow(r, 15)}<span class="spot-count">01 / ${String(reviews.length).padStart(2, '0')}</span></div>
              <div class="quote">${escapeHtml(pickLang(r.quote_en, r.quote_cn) || '')}</div>
              <div class="rv-person">${mono(r)}${personText(r)}</div>
            </div>
          </div>
          <div class="spot-rail">${thumbs}</div>
        </div>`;
      }
      const renderOne = (r) => {
        const rating = Math.max(1, Math.min(5, parseInt(r.rating, 10) || 5));
        const stars = [1,2,3,4,5].map(i => `<span class="${i <= rating ? 'on' : 'off'}">★</span>`).join('');
        const q = pickLang(r.quote_en, r.quote_cn);
        const subline = pickLang(r.author_subline_en, r.author_subline_cn);
        const initial = (r.author_name || '').trim()[0] || '?';
        const avatar = r.avatar_url
          ? `<div class="avatar"><img src="${escapeAttr(r.avatar_url)}" alt=""></div>`
          : `<div class="avatar fallback">${escapeHtml(initial.toUpperCase())}</div>`;
        return `<div class="rv-item">
          <div class="stars">${stars}</div>
          <div class="quote">${escapeHtml(q || '')}</div>
          <div class="byline">
            ${avatar}
            <div class="byline-text">
              ${r.author_name ? `<div class="name">${escapeHtml(r.author_name)}</div>` : ''}
              ${subline ? `<div class="sub">${escapeHtml(subline)}</div>` : ''}
            </div>
          </div>
        </div>`;
      };
      if (!reviews.length) {
        return `<div class="b-review b-review-${view}" style="background:${bg};color:${fg}">${k.en || k.cn ? `<div class="kicker">${biLabel(k.en, k.cn)}</div>` : ''}</div>`;
      }
      if (view === 'carousel') {
        const items = reviews.map(renderOne).join('');
        const dots = reviews.map((_, i) => `<span class="dot${i === 0 ? ' on' : ''}"></span>`).join('');
        return `<div class="b-review b-review-carousel" style="background:${bg};color:${fg}">
          ${k.en || k.cn ? `<div class="kicker">${biLabel(k.en, k.cn)}</div>` : ''}
          <div class="rv-rail">${items}</div>
          <div class="rv-dots">${dots}</div>
        </div>`;
      }
      return `<div class="b-review b-review-card" style="background:${bg};color:${fg}">
        ${k.en || k.cn ? `<div class="kicker">${biLabel(k.en, k.cn)}</div>` : ''}
        ${renderOne(reviews[0])}
      </div>`;
    }
    case 'store_info': {
      const bg = brandColorVar(b.bg_color) || 'var(--oat)';
      const fg = brandColorVar(b.fg_color) || 'var(--ink)';
      const k = getBi(b, 'kicker');
      const pin   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
      const clock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
      const phoneIc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1.05.37 2.07.7 3.06a2 2 0 0 1-.45 2.11L8.09 10.09a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.11-.45c.99.34 2.01.58 3.06.7A2 2 0 0 1 22 16.92z"/></svg>';
      // Normalize to a stores list — new schema uses b.stores[]; legacy single-store
      // blocks had top-level title/address/hours/phone fields.
      let stores = Array.isArray(b.stores) && b.stores.length ? b.stores : null;
      if (!stores && (b.title_en || b.title_cn || b.address_en || b.address_cn || b.phone)) {
        stores = [{
          name_en: b.title_en, name_cn: b.title_cn,
          address_en: b.address_en, address_cn: b.address_cn,
          hours_en: b.hours_en, hours_cn: b.hours_cn,
          phone: b.phone,
          open_hour: b.open_hour, close_hour: b.close_hour,
          eta_minutes: b.eta_minutes,
          cta_label_en: b.cta_label_en, cta_label_cn: b.cta_label_cn,
          cta_target: b.cta_target,
        }];
      }
      stores = stores || [];
      const hr = new Date().getHours() + (new Date().getMinutes() / 60);
      const cards = stores.map(s => {
        const name  = pickLang(s.name_en,    s.name_cn)    || '';
        const addr  = pickLang(s.address_en, s.address_cn);
        const hours = pickLang(s.hours_en,   s.hours_cn);
        const cta   = pickLang(s.cta_label_en, s.cta_label_cn);
        const openH  = Number(s.open_hour);
        const closeH = Number(s.close_hour);
        const hasHours = Number.isFinite(openH) && Number.isFinite(closeH);
        const isOpen = hasHours
          ? (closeH > openH ? (hr >= openH && hr < closeH) : (hr >= openH || hr < closeH))
          : null;
        const statusLbl = isOpen === null ? ''
          : isOpen ? (state.lang === 'cn' ? '营业中' : 'Open now')
                   : (state.lang === 'cn' ? '已打烊' : 'Closed');
        const eta = Number(s.eta_minutes) || 0;
        const etaLbl = (eta > 0 && isOpen === true)
          ? (state.lang === 'cn' ? `约 ${eta} 分钟送达` : `~${eta} min delivery`)
          : '';
        const dot = isOpen === null ? ''
          : `<span class="st-dot" style="background:${isOpen ? 'var(--pea, #7BBD3B)' : 'var(--berry, #E96174)'}"></span>`;
        return `<div class="st-card">
          ${name ? `<div class="ttl">${escapeHtml(name)}</div>` : ''}
          ${isOpen !== null ? `<div class="st-status">${dot}<span class="st-status-lbl">${escapeHtml(statusLbl)}</span>${hours ? `<span class="st-hours"> · ${escapeHtml(hours)}</span>` : ''}</div>`
                            : (hours ? `<div class="row">${clock}<div class="val">${escapeHtml(hours)}</div></div>` : '')}
          ${etaLbl ? `<div class="st-eta">${escapeHtml(etaLbl)}</div>` : ''}
          ${addr  ? `<div class="row">${pin}<div class="val">${escapeHtml(addr)}</div></div>`     : ''}
          ${s.phone ? `<div class="row">${phoneIc}<div class="val">${escapeHtml(s.phone)}</div></div>` : ''}
          ${cta ? `<div class="cta"${s.cta_target ? ` data-cta-target="${escapeAttr(s.cta_target)}"` : ''}>${escapeHtml(cta)}</div>` : ''}
        </div>`;
      }).join('');
      return `<div class="b-store b-store-multi" style="background:${bg};color:${fg}">
        ${k.en || k.cn ? `<div class="kicker">${biLabel(k.en, k.cn)}</div>` : ''}
        <div class="st-cards">${cards}</div>
      </div>`;
    }
    case 'leaderboard': {
      const bg = brandColorVar(b.bg_color) || 'var(--oat)';
      const fg = brandColorVar(b.fg_color) || 'var(--ink)';
      const accent = brandColorVar(b.accent_color) || 'var(--forest)';
      const metric = b.metric || 'lifetime_spend';
      const period = b.period || 'month';
      const topN = Math.max(3, Math.min(10, parseInt(b.top_n, 10) || 5));
      const reveal = b.reveal_mode || 'first_char';
      const showValue = b.show_value !== false;
      const hideUnder = Math.max(0, parseInt(b.hide_when_under, 10) || 0);

      const data = loadLeaderboard(metric, period, topN, reveal);
      // Only hide once we KNOW the data — otherwise blocks flicker on/off.
      if (data.loaded && data.entries.length < hideUnder) return '';

      const k = getBi(b, 'kicker');
      const t = getBi(b, 'title');
      const sub = pickLang(b.subhead_en, b.subhead_cn);
      const footer = pickLang(b.footer_en, b.footer_cn);

      const periodLabel =
        period === 'week'  ? (state.lang === 'cn' ? '本周'   : 'This week') :
        period === 'month' ? (state.lang === 'cn' ? '本月'   : 'This month') :
        period === 'year'  ? (state.lang === 'cn' ? '今年'   : 'This year') :
                             (state.lang === 'cn' ? '累计' : 'All time');

      const MEDALS = ['🥇', '🥈', '🥉'];
      const fmtValue = (v) => {
        if (metric === 'lifetime_spend') return '¥' + Math.round(Number(v) || 0).toLocaleString();
        if (metric === 'points_balance') return (Number(v) || 0) + (state.lang === 'cn' ? ' 分' : ' pts');
        return (Number(v) || 0) + (state.lang === 'cn' ? ' 单' : ' orders');
      };

      let listHtml;
      if (!data.loaded) {
        // Skeleton — N empty rows so the block holds its height while
        // the fetch is in flight. Avoids the home page jumping when the
        // leaderboard finally lands.
        listHtml = Array.from({ length: topN }).map((_, i) => `
          <div class="lb-row lb-skeleton">
            <span class="lb-rank">${i + 1}</span>
            <span class="lb-name">&nbsp;</span>
          </div>`).join('');
      } else {
        listHtml = data.entries.slice(0, topN).map((e, i) => {
          const rankCell = i < 3
            ? `<span class="lb-medal">${MEDALS[i]}</span>`
            : `<span class="lb-rank">${i + 1}</span>`;
          const valueCell = showValue
            ? `<span class="lb-value" style="color:${accent}">${escapeHtml(fmtValue(e.value))}</span>`
            : '';
          return `<div class="lb-row">
            ${rankCell}
            <span class="lb-name">${escapeHtml(e.name || '')}</span>
            ${valueCell}
          </div>`;
        }).join('');
      }

      return `<div class="b-leaderboard" data-block-id="${escapeAttr(b.id)}" style="background:${bg};color:${fg}">
        <div class="lb-head">
          <div>
            ${(k.en || k.cn) ? `<div class="lb-kicker">${biLabel(k.en, k.cn)}</div>` : ''}
            <div class="lb-ttl">${biLabel(t.en, t.cn) || (state.lang === 'cn' ? '本月铁粉' : 'Top customers')}</div>
            ${sub ? `<div class="lb-sub">${escapeHtml(sub)}</div>` : ''}
          </div>
          <div class="lb-period">${escapeHtml(periodLabel)}</div>
        </div>
        <div class="lb-list">${listHtml}</div>
        ${footer ? `<div class="lb-footer">${escapeHtml(footer)}</div>` : ''}
      </div>`;
    }
    case 'countdown_timer': {
      const bg = brandColorVar(b.bg_color) || 'var(--ink)';
      const fg = brandColorVar(b.fg_color) || 'var(--lime)';
      const k = getBi(b, 'kicker');
      const t = getBi(b, 'title');
      const ms = b.ends_at ? (new Date(b.ends_at).getTime() - Date.now()) : 0;
      const cta = pickLang(b.cta_label_en, b.cta_label_cn);
      if (ms <= 0) {
        const ended = pickLang(b.ended_text_en, b.ended_text_cn) || (state.lang === 'cn' ? '本场已结束' : "That's a wrap");
        return `<div class="b-countdown" data-block-id="${escapeAttr(b.id)}" data-ends-at="${escapeAttr(b.ends_at || '')}" style="background:${bg};color:${fg}">
          <div class="kicker">${biLabel(k.en, k.cn)}</div>
          <div class="ttl">${biLabel(t.en, t.cn)}</div>
          <div class="ended">${escapeHtml(ended)}</div>
        </div>`;
      }
      const p = splitCountdown(ms);
      const labels = state.lang === 'cn' ? ['天','时','分','秒'] : ['DAYS','HRS','MIN','SEC'];
      const cells = [p.d, p.h, p.m, p.s].map((v, i) => `
        <div class="cell">
          <div class="num">${String(v).padStart(2, '0')}</div>
          <div class="lbl">${labels[i]}</div>
        </div>`).join('<div class="sep">:</div>');
      return `<div class="b-countdown" data-block-id="${escapeAttr(b.id)}" data-ends-at="${escapeAttr(b.ends_at || '')}" style="background:${bg};color:${fg}">
        <div class="kicker">${biLabel(k.en, k.cn)}</div>
        <div class="ttl">${biLabel(t.en, t.cn)}</div>
        <div class="clock">${cells}</div>
        ${cta ? `<div class="cta"${b.cta_target ? ` data-cta-target="${escapeAttr(b.cta_target)}"` : ''}>${escapeHtml(cta)}</div>` : ''}
      </div>`;
    }
  }
  return '';
}

function splitCountdown(ms) {
  let s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600);  s -= h * 3600;
  const m = Math.floor(s / 60);    s -= m * 60;
  return { d, h, m, s };
}

// Tick countdown / flash-strip digits in place. Full rerender when one
// crosses zero so the ended-state markup / dropped-out products take over.
// Also re-fetch flash_sales every 30s so newly-active sales appear without
// manual reload — covers the case where the staff schedules a sale and
// wants to see it light up on the preview screen they have open.
setInterval(() => {
  let crossedZero = false;
  document.querySelectorAll('.b-countdown[data-ends-at]').forEach(root => {
    const ends = root.dataset.endsAt;
    if (!ends) return;
    const ms = new Date(ends).getTime() - Date.now();
    const clock = root.querySelector('.clock');
    if (ms <= 0) { if (clock) crossedZero = true; return; }
    if (!clock) { crossedZero = true; return; }
    const cells = clock.querySelectorAll('.cell .num');
    if (cells.length !== 4) return;
    const p = splitCountdown(ms);
    const vals = [p.d, p.h, p.m, p.s];
    cells.forEach((el, i) => {
      const next = String(vals[i]).padStart(2, '0');
      if (el.textContent !== next) el.textContent = next;
    });
  });
  document.querySelectorAll('.b-flash .clock[data-ends-at]').forEach(clock => {
    const ends = clock.dataset.endsAt;
    if (!ends) return;
    const ms = new Date(ends).getTime() - Date.now();
    if (ms <= 0) { crossedZero = true; return; }
    const nums = clock.querySelectorAll('.ct-num');
    if (nums.length !== 4) return;
    const p = splitCountdown(ms);
    const vals = [p.d, p.h, p.m, p.s];
    nums.forEach((el, i) => {
      const next = String(vals[i]).padStart(2, '0');
      if (el.textContent !== next) el.textContent = next;
    });
  });
  document.querySelectorAll('.b-flash .hero-clock[data-ends-at]').forEach(clock => {
    const ends = clock.dataset.endsAt;
    if (!ends) return;
    const ms = new Date(ends).getTime() - Date.now();
    if (ms <= 0) { crossedZero = true; return; }
    const nums = clock.querySelectorAll('.hero-num');
    if (nums.length !== 4) return;
    const p = splitCountdown(ms);
    const vals = [p.d, p.h, p.m, p.s];
    nums.forEach((el, i) => {
      const next = String(vals[i]).padStart(2, '0');
      if (el.textContent !== next) el.textContent = next;
    });
  });
  // Design directions (classic/editorial/urgency): .fsd-clock or .fsd-ticker
  // with .js-fsd-num cells.
  document.querySelectorAll('.b-flash .fsd-clock[data-ends-at], .b-flash .fsd-ticker[data-ends-at]').forEach(clock => {
    const ends = clock.dataset.endsAt;
    if (!ends) return;
    const ms = new Date(ends).getTime() - Date.now();
    if (ms <= 0) { crossedZero = true; return; }
    const nums = clock.querySelectorAll('.js-fsd-num');
    if (nums.length !== 4) return;
    const p = splitCountdown(ms);
    const vals = [p.d, p.h, p.m, p.s];
    nums.forEach((el, i) => {
      const next = String(vals[i]).padStart(2, '0');
      if (el.textContent !== next) el.textContent = next;
    });
  });
  if (crossedZero && state.config) {
    const page = currentPage();
    render(state.config[page]?.layout || []);
  }
}, 1000);

setInterval(async () => {
  try {
    const r = await fetch('/api/retail/flash-sales').then(r => r.json());
    const next = r?.data || [];
    if (JSON.stringify(next) !== JSON.stringify(state.flashSales)) {
      state.flashSales = next;
      if (state.config) render(state.config[currentPage()]?.layout || []);
    }
  } catch {}
}, 30 * 1000);

function brandColorVar(name) {
  const map = {
    'lime-leaf': 'var(--lime)', 'forest-kale': 'var(--forest)', 'olive-moss': 'var(--olive)',
    'golden-corn': 'var(--corn)', 'oat-milk': 'var(--oat)',
    'ink': 'var(--ink)', 'pink-guava': 'var(--pink)', 'berry-punch': 'var(--berry)',
    'carrot-blaze': 'var(--carrot)', 'papaya-glow': 'var(--papaya)', 'skyberry': 'var(--sky)',
    'lotus': 'var(--lotus)', 'citrus-zest': 'var(--citrus)', 'pea-sprout': 'var(--pea)',
  };
  return map[name];
}
</script>
