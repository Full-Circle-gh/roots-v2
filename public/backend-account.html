<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Full Circle · Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#12161A" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+SC:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#12161A; --pane:#1A1F24; --paper:#E8E5DC; --muted:#AEABA2; --faint:#7d7a72;
    --line:rgba(232,229,220,.10); --line-2:rgba(232,229,220,.16);
    --tea:#6B8E6F; --brass:#B08D4A; --brass-hi:#C29B54; --danger:#e8556a;
    --f-sans:'IBM Plex Sans','IBM Plex Sans SC',system-ui,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink); color: var(--paper); font-family: var(--f-sans);
    display: flex; align-items: flex-start; justify-content: center; padding: 48px 24px;
    background-image: radial-gradient(120% 70% at 50% 0%, rgba(107,142,111,.06) 0%, transparent 55%);
  }
  .wrap { width: 100%; max-width: 420px; }
  .back { display: inline-block; color: var(--faint); text-decoration: none; font-size: 12.5px; margin-bottom: 18px; }
  .back:hover { color: var(--muted); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand .mark { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; }
  .brand .word { font-size: 13px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
  .sub { font-family: var(--f-mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); margin: 2px 0 22px; }
  .card { background: var(--pane); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .card .hint { font-size: 12px; color: var(--faint); line-height: 1.5; margin: 0 0 16px; }
  .ident { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  .ident dt { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); align-self: center; }
  .ident dd { margin: 0; color: var(--paper); }
  label { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input[type=password] {
    width: 100%; background: var(--ink); border: 1px solid var(--line-2); border-radius: 8px;
    color: var(--paper); font-family: var(--f-sans); font-size: 14px; padding: 11px 13px; outline: none;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:focus { border-color: var(--tea); box-shadow: 0 0 0 3px rgba(107,142,111,.25); }
  .msg { display: none; font-size: 12.5px; line-height: 1.4; padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; }
  .msg.show { display: block; }
  .msg.err { background: rgba(232,85,106,.12); border: 1px solid rgba(232,85,106,.35); color: #f0a3ae; }
  .msg.ok  { background: rgba(107,142,111,.14); border: 1px solid rgba(107,142,111,.4); color: #a7c6ab; }
  button { font-family: var(--f-sans); cursor: pointer; }
  .btn-primary { width: 100%; background: var(--brass); color: var(--ink); border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; padding: 12px; transition: background .12s ease, transform .06s ease; }
  .btn-primary:hover { background: var(--brass-hi); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-ghost { width: 100%; background: transparent; color: var(--muted); border: 1px solid var(--line-2); border-radius: 8px; font-size: 13.5px; font-weight: 500; padding: 11px; transition: background .12s ease, color .12s ease; }
  .btn-ghost:hover { background: rgba(232,85,106,.08); color: #f0a3ae; border-color: rgba(232,85,106,.35); }
  .warn { background: rgba(176,141,74,.12); border: 1px solid rgba(176,141,74,.3); color: #d8b676; font-size: 12px; line-height: 1.5; padding: 10px 12px; border-radius: 8px; margin: 0 0 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/retail-admin">← Back to backend · 返回后台</a>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10.8" fill="none" stroke="#B08D4A" stroke-width="0.6" stroke-dasharray="32 2 32 2" transform="rotate(48 12 12)"/>
          <circle cx="12" cy="12" r="9" fill="none" stroke="#6B8E6F" stroke-width="0.6" stroke-dasharray="26.3 2 26.3 2" transform="rotate(40 12 12)"/>
          <path d="M17.5 8.5C16 6.5 13.7 5.4 11.4 5.7 8.1 6.2 5.5 9 5.5 12.4c0 3.3 2.7 6 6 6 2.6 0 4.9-1.7 5.7-4.1" fill="none" stroke="#E8E5DC" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="word">Full Circle</span>
    </div>
    <div class="sub">Account · 账户</div>

    <div class="card">
      <h2>Operator · 操作员</h2>
      <dl class="ident" id="ident"><dd class="hint" style="grid-column:1/-1">Loading… · 加载中…</dd></dl>
    </div>

    <form class="card" id="pwForm">
      <h2>Change password · 修改密码</h2>
      <p class="hint">Minimum 10 characters. · 至少 10 位。</p>
      <div class="warn" id="defaultWarn" style="display:none">You're still on the default password — please change it now. · 您仍在使用默认密码,请立即修改。</div>
      <div class="msg" id="msg"></div>
      <div class="field">
        <label for="cur">Current password · 当前密码</label>
        <input type="password" id="cur" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="nw">New password · 新密码</label>
        <input type="password" id="nw" autocomplete="new-password" minlength="10" required>
      </div>
      <div class="field">
        <label for="nw2">Confirm new password · 确认新密码</label>
        <input type="password" id="nw2" autocomplete="new-password" minlength="10" required>
      </div>
      <button type="submit" class="btn-primary" id="pwBtn">Update password · 更新密码</button>
    </form>

    <div class="card">
      <h2>Session · 会话</h2>
      <p class="hint">Sign out of the Mini App Backend on this device. · 在此设备上登出后台。</p>
      <button type="button" class="btn-ghost" id="logoutBtn">Sign out · 退出登录</button>
    </div>
  </div>

<script>
(function () {
  const $ = s => document.querySelector(s);

  // Gate: must be a backend operator. Render identity, flag default password.
  fetch('/api/backend/me', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(j => {
      if (!j || !j.user) { location.replace('/backend/login'); return; }
      const u = j.user;
      const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      $('#ident').innerHTML =
        '<dt>Name</dt><dd>' + esc(u.displayName || u.username) + '</dd>' +
        '<dt>Username</dt><dd>' + esc(u.username) + '</dd>' +
        '<dt>Role</dt><dd>' + esc(u.role) + '</dd>' +
        '<dt>Company</dt><dd>' + esc((u.tenant && (u.tenant.brand || u.tenant.name)) || '—') + '</dd>';
    })
    .catch(() => location.replace('/backend/login'));

  function showMsg(text, kind) {
    const m = $('#msg'); m.textContent = text; m.className = 'msg show ' + kind;
  }

  $('#pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cur = $('#cur').value, nw = $('#nw').value, nw2 = $('#nw2').value;
    if (nw.length < 10) { showMsg('New password must be at least 10 characters · 新密码至少需要 10 位', 'err'); return; }
    if (nw !== nw2) { showMsg('New passwords do not match · 两次输入的新密码不一致', 'err'); return; }
    const btn = $('#pwBtn'); btn.disabled = true; btn.textContent = 'Updating… · 更新中…';
    try {
      const r = await fetch('/api/backend/password', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ current_password: cur, new_password: nw }),
      });
      const j = await r.json();
      if (j && j.success) {
        showMsg('Password updated. · 密码已更新。', 'ok');
        $('#pwForm').reset();
      } else {
        showMsg((j && j.error) || 'Update failed · 更新失败', 'err');
      }
    } catch (e) { showMsg('Network error — please try again · 网络错误,请重试', 'err'); }
    btn.disabled = false; btn.textContent = 'Update password · 更新密码';
  });

  $('#logoutBtn').addEventListener('click', async () => {
    try { await fetch('/api/backend/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
    location.href = '/backend/login';
  });
})();
</script>
</body>
</html>
