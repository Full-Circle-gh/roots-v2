// ─── Submit ────────────────────────────────────────────────────────
// Modal stack for warehouse-side sending. Asks WHERE (kitchen or
// store), then for kitchen also asks WHY (for-order vs for-shelf).
// Store flow currently has no picker — there's only one retail store
// (Yuexiu), so we auto-route. The server falls back to broadcasting
// to all `restock` perm holders when store_name is null. Resolves to:
//   { to_role:'kitchen', purpose:'order'|'shelf' }
//   { to_role:'store',   store_name:null, store_cn:null }
//   null  (cancelled)
async function _askWarehouseDestination() {
  const dest = await _modalChoose({
    title: 'Where to send? · 发往哪里',
    sub:   'Pick the destination · 选择目的地',
    options: [
      { v:'kitchen', emoji:'🏭', en:'To Kitchen', cn:'发给厨房', hint:'Ask the kitchen to prepare items · 请厨房备货', color:'rgba(204,217,0,.16)', border:'rgba(204,217,0,.45)' },
      { v:'store',   emoji:'🏬', en:'To Store',   cn:'发往门店', hint:'Push stock from warehouse to the store · 仓库送货到门店',  color:'rgba(37,99,235,.10)',  border:'rgba(37,99,235,.4)'   },
    ],
  });
  if (!dest) return null;
  if (dest === 'kitchen') {
    const purpose = await _modalChoose({
      title: 'Why this request? · 请求原因',
      sub:   "Tell the kitchen what they're prepping for · 告诉厨房备货目的",
      options: [
        { v:'order', emoji:'📦', en:'For an outgoing order', cn:'用于发货', hint:'Need it to ship a customer order · 需要发给客户', color:'rgba(204,217,0,.16)', border:'rgba(204,217,0,.45)' },
        { v:'shelf', emoji:'🛒', en:'For shelf restock',     cn:'货架补货', hint:'Refill warehouse shelves · 补充仓库货架',         color:'rgba(37,99,235,.10)',  border:'rgba(37,99,235,.4)'   },
      ],
    });
    if (!purpose) return null;
    return { to_role:'kitchen', purpose };
  }
  // Single-store world today — no picker. When a second retail store
  // joins, reintroduce a chooser here (server uses store_name as the
  // routing key against markets table for per-store notifications).
  return { to_role:'store', store_name: null, store_cn: null };
}

// Generic 2-or-more choice modal used for destination + purpose pickers.
function _modalChoose({ title, sub, options }) {
  return new Promise((resolve) => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px';
    ov.innerHTML = `
      <div style="background:var(--card);border-radius:14px;padding:22px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4)">
        <div style="font-size:18px;font-weight:800;margin-bottom:6px;color:var(--text)">${esc(title)}</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:16px">${esc(sub)}</div>
        ${options.map(o => `
          <button data-v="${esc(o.v)}" style="display:block;width:100%;padding:14px;background:${o.color};border:1.5px solid ${o.border};color:var(--text);border-radius:10px;font-weight:700;cursor:pointer;margin-bottom:10px;font-family:inherit;text-align:left;font-size:14px">
            ${o.emoji} ${esc(o.en)} · ${esc(o.cn)}
            <div style="font-size:11px;font-weight:600;opacity:.75;margin-top:3px">${esc(o.hint)}</div>
          </button>`).join('')}
        <button data-cancel style="display:block;width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;font-family:inherit;cursor:pointer;font-size:13px">Cancel · 取消</button>
      </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-v]');
      if (btn) { ov.remove(); resolve(btn.dataset.v); return; }
      if (e.target.closest('[data-cancel]') || e.target === ov) {
        ov.remove(); resolve(null);
      }
    });
  });
}

async function submitRequest(status) {
  const validItems = _cart.filter(c => parseFloat(c.qty) > 0);
  if (!validItems.length) return;
  const btn = status === 'sent' ? document.getElementById('sendBtn') : document.getElementById('draftBtn');
  if (!btn) return;
  // Warehouse users sending a request → ask WHERE first (kitchen vs
  // store), then either WHY (kitchen) or WHICH STORE (store). For the
  // server, kitchen requests carry `purpose`; store deliveries carry
  // `store_name` / `store_cn`. Cancelling the picker bails with no
  // side-effects.
  let dest = null;
  if (status === 'sent') {
    // Origin is role-based, not perm-based. A store user with the
    // warehouse_inbox perm (so they can view the Fulfill tab) still
    // sends their own restock requests to the warehouse — no chooser.
    // Only `warehouse` and `admin` originate from the warehouse side.
    const role = _user?.role || '';
    const isWarehouseOrigin = (role === 'warehouse' || role === 'admin');
    if (isWarehouseOrigin) {
      dest = await _askWarehouseDestination();
      if (!dest) return;
    }
  }
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Saving… · 保存中…';
  try {
    const items = validItems.map(c => ({
      product_id: c.product.id,
      product_name: c.product.name_en || '',
      product_cn:   c.product.name_cn || null,
      sku:          c.product.sku || null,
      qty_requested: c.qty,
      unit:         c.product.weight || null,
      notes:        c.notes || null,
    }));
    let rsNumber;
    if (_draftId) {
      // Editing a draft → replace items via PUT, then bump status if 'sent'.
      const r1 = await fetch('/api/restock/' + _draftId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items, notes: _orderNotes || null }),
      });
      const d1 = await r1.json();
      if (!d1?.success) throw new Error(d1.error || 'failed');
      if (status === 'sent') {
        const r2 = await fetch('/api/restock/' + _draftId + '/status', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'sent' }),
        });
        const d2 = await r2.json();
        if (!d2?.success) throw new Error(d2.error || 'failed');
      }
      rsNumber = _draftRsNumber || ('#' + _draftId);
    } else {
      const r = await fetch('/api/restock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items, notes: _orderNotes || null, status,
          // Warehouse-side destination — null/undefined for store users
          // who fall through to the default store→warehouse direction.
          to_role:    dest?.to_role    || undefined,
          purpose:    dest?.purpose    || undefined,
          store_name: dest?.store_name || undefined,
          store_cn:   dest?.store_cn   || undefined,
        }),
      });
      const d = await r.json();
      if (!d?.success) throw new Error(d.error || 'failed');
      rsNumber = d.rs_number;
    }
    toast(`✓ ${rsNumber} ${status === 'sent' ? 'sent · 已提交' : 'saved · 已保存'}`, 'success');
    beep('done');
    _cart = []; _orderNotes = '';
    _draftId = null; _draftRsNumber = null;
    render();
    refreshDraftBadge();
  } catch (e) {
    toast('Save failed · 保存失败: ' + (e.message || ''), 'error');
    beep('error');
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function loadDraft(id) {
  if (_cart.length && !confirm('You have unsaved items in the cart. Loading a draft will replace them.\n购物车中有未保存的物品。加载草稿将会替换。')) return;
  try {
    const r = await fetch('/api/restock/' + id);
    const d = await r.json();
    if (!d?.success) throw new Error(d?.error || 'failed');
    const order = d.data;
    // Re-hydrate cart by matching items back to the full product catalog
    // when possible (so unit / weight / icons all light up). Falls back
    // to a stub product object if the item references something we can't
    // find (deleted product, etc.).
    _cart = (order.items || []).map(it => {
      const full = _products.find(p => p.id === it.product_id);
      return {
        product: full || {
          id: it.product_id,
          name_en: it.product_name || '',
          name_cn: it.product_cn || '',
          sku: it.sku || '',
          weight: it.unit || '',
        },
        qty: it.qty_requested,
        notes: it.notes || '',
      };
    }).filter(c => c.product);
    _orderNotes = order.notes || '';
    _draftId = order.id;
    _draftRsNumber = order.rs_number;
    closeAllOv();
    render();
    toast(`✓ Loaded ${order.rs_number} · 已载入`, 'success');
  } catch (e) {
    toast('Load failed · 加载失败: ' + (e.message || ''), 'error');
  }
}

async function deleteDraft(id, label) {
  if (!confirm(`Delete draft ${label}? This cannot be undone.\n删除草稿 ${label}? 此操作无法撤销。`)) return;
  try {
    const r = await fetch('/api/restock/' + id, { method: 'DELETE' });
    const d = await r.json();
    if (!d?.success) throw new Error(d?.error || 'failed');
    // If the deleted draft is the one currently being edited, clear it.
    if (_draftId === id) {
      _cart = []; _orderNotes = '';
      _draftId = null; _draftRsNumber = null;
      render();
    }
    toast(`✓ ${label} deleted · 已删除`, 'success');
    refreshDraftBadge();
    openDrafts();  // refresh the list
  } catch (e) {
    toast('Delete failed · 删除失败: ' + (e.message || ''), 'error');
  }
}

function discardDraftEditing() {
  if (!confirm('Stop editing this draft? Your changes will not be saved.\n停止编辑此草稿?未保存的修改将丢失。')) return;
  _cart = []; _orderNotes = '';
  _draftId = null; _draftRsNumber = null;
  render();
}

function _ovKeyboardSync() {
  const vv = window.visualViewport;
  const ov = document.querySelector('.ov.visible');
  if (!ov || !vv) return;
  if (window.innerWidth >= 600) { ov.style.height = ''; return; }

}
function _ovKeyboardWatch(on) {
  const vv = window.visualViewport;
  if (!vv) return;
  if (on) {

    _ovKeyboardSync();

    vv.removeEventListener('resize', _ovKeyboardSync);
    vv.removeEventListener('scroll', _ovKeyboardSync);
  }
}

// ─── Helpers ───────────────────────────────────────────────────────
let _audioCtx = null;
// Browsers require a user gesture to unlock the AudioContext. Pre-arm
// it on the first click/touch so subsequent timer-driven beeps actually
// play. (Without this the context stays suspended forever.)
(function armAudioOnFirstGesture() {
  const arm = () => {
    try {
      if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (_audioCtx.state === 'suspended') _audioCtx.resume().catch(() => {});
    } catch {}
    document.removeEventListener('click', arm, true);
    document.removeEventListener('touchstart', arm, true);
    document.removeEventListener('keydown', arm, true);
  };
  document.addEventListener('click', arm, true);
  document.addEventListener('touchstart', arm, true);
  document.addEventListener('keydown', arm, true);
})();
function beep(kind) {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (kind === 'msg') {
      // Message-style "incoming notification" — three ascending tones
      // (E6 → G6 → C7) on a triangle wave with a sharp attack, played
      // twice with a short gap. Loud enough to actually catch attention.
      const NOTES = [1319, 1568, 2093], STEP = 0.09, SUSTAIN = 0.22, GAP = 0.42, PEAK = 0.32;
      const playPass = (start) => {
        NOTES.forEach((freq, i) => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const t = start + i * STEP;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(PEAK, t + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + SUSTAIN);
          osc.connect(gain).connect(ctx.destination);
          osc.start(t); osc.stop(t + SUSTAIN + 0.02);
        });
      };
      const t0 = ctx.currentTime;
      playPass(t0);
      playPass(t0 + GAP);
      return;
    }
    if (kind === 'error') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 220;
      g.gain.setValueAtTime(0.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    } else if (kind === 'done') {
      [880, 1320].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        const t = ctx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        o.start(t); o.stop(t + 0.16);
      });
    } else {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 1100;
      g.gain.setValueAtTime(0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      o.start(); o.stop(ctx.currentTime + 0.1);
    }
  } catch {}
}

function toast(msg, type) {

// ─── Persistent notification banner ─────────────────────────────────
// Same pattern as the yellow ribbon in app.html — sticky at the top of
// the viewport, tracks unseen counts per kind across the two-sided
// workflows (store ↔ warehouse), survives page reloads via localStorage,
// only goes away when the user acts on it. Replaces the fading toasts
// the manager kept missing.
const NOTI_KINDS = {
  // Store side: warehouse just marked the order ready for pickup.
  prepared:  { icon:'📦', label_en:'ready to receive', label_cn:'待收货',
               action: () => { setAppMode('restock'); refreshPendingDeliveries(); } },
  // Warehouse side: store sent a brand new request.
  new_sent:  { icon:'🔔', label_en:'new restock requests', label_cn:'新请求',
               action: () => { setAppMode('inbox'); _inboxTab = 'active'; render(); } },
  // Warehouse side: store confirmed delivery (handoff completed).
  delivered: { icon:'✓',  label_en:'delivered',           label_cn:'已送达',
               action: () => { setAppMode('inbox'); _inboxTab = 'history'; render(); } },
};
const _notiKey         = () => 'rs_noti_unseen_'    + (_user?.id || 'anon');
const _notiDetailKey   = () => 'rs_noti_detail_'    + (_user?.id || 'anon');
const _notiDismissKey  = () => 'rs_noti_dismissed_' + (_user?.id || 'anon');
let _notiUnseen = { prepared: 0, new_sent: 0, delivered: 0 };
// Latest payload per kind — used by the banner to describe WHAT the
// notification is about (RS number, store, item count) rather than
// just "1 new". Survives reload alongside the unseen counts.
let _notiDetail = { prepared: null, new_sent: null, delivered: null };
// Banner-dismissed state. Distinct from cleared/unseen: dismissing the
// yellow ribbon (tap ✕) HIDES the banner but leaves the icon badge as
// a reminder. Cleared = user actually entered the relevant mode and
// dealt with it; that zeros both the unseen count AND dismissal flag.
// A NEW arrival for a kind resets that kind's dismissal so the ribbon
// reappears (otherwise the user would never see it again after one ✕).
let _notiDismissed = { prepared: false, new_sent: false, delivered: false };
// In-memory dedupe — both SSE and the 8s poller can detect the same
// event. Key is `${kind}:${id}`; seeded by whichever path fires first.
const _notiSeenKeys = new Set();
function _loadNoti() {
  try {
    const raw = localStorage.getItem(_notiKey());
    if (raw) Object.assign(_notiUnseen, JSON.parse(raw));
    const rawDetail = localStorage.getItem(_notiDetailKey());
    if (rawDetail) Object.assign(_notiDetail, JSON.parse(rawDetail));
    const rawDismiss = localStorage.getItem(_notiDismissKey());
    if (rawDismiss) Object.assign(_notiDismissed, JSON.parse(rawDismiss));
  } catch {}
  _renderNotiBanner();
  _paintHeaderModeDots();
}
function _saveNoti() {
  try {
    localStorage.setItem(_notiKey(), JSON.stringify(_notiUnseen));
    localStorage.setItem(_notiDetailKey(), JSON.stringify(_notiDetail));
    localStorage.setItem(_notiDismissKey(), JSON.stringify(_notiDismissed));
  } catch {}
}
// payload can be a full event object ({ id, rs_number, store_name,
// store_cn, item_count, ... }) or a bare number (legacy count fallback
// when we don't have details handy). Returns true if the event was
// actually counted (not a dedupe drop).
function _addNoti(kind, payload) {
  if (!NOTI_KINDS[kind]) return false;
  // Dedupe by id when we have one — same order won't double-count if
  // SSE and the poller both detect it. Numbers/no-id fall through.
  const id = (payload && typeof payload === 'object') ? payload.id : null;
  if (id != null) {
    const k = kind + ':' + id;
    if (_notiSeenKeys.has(k)) return false;
    _notiSeenKeys.add(k);
  }
  if (payload && typeof payload === 'object') {
    _notiUnseen[kind] = (_notiUnseen[kind] || 0) + 1;
    _notiDetail[kind] = {
      id: payload.id || null,
      rs_number: payload.rs_number || null,
      store_name: payload.store_name || null,
      store_cn: payload.store_cn || null,
      item_count: payload.item_count || 0,
      ts: payload.ts || Date.now(),
    };
  } else {
    _notiUnseen[kind] = (_notiUnseen[kind] || 0) + (payload || 1);
  }
  // A fresh arrival re-opens the banner even if the user had dismissed
  // the previous wave — otherwise they'd silently miss the new one.
  _notiDismissed[kind] = false;
  _saveNoti();
  _renderNotiBanner();
  // Live-update the header mode-switcher dots so the user sees the
  // other flow's count badge the moment a new event arrives.
  _paintHeaderModeDots();
  beep('msg');
  return true;
}
// Hide the yellow ribbon without zeroing the counts. The icon badges
// stay lit as a reminder; the ribbon re-appears on the NEXT new event.
function _dismissNotiBanner() {
  Object.keys(_notiDismissed).forEach(k => { if (_notiUnseen[k] > 0) _notiDismissed[k] = true; });
  _saveNoti();
  _renderNotiBanner();
  // Badges intentionally NOT cleared — that's the whole point.
}
// User actually entered the relevant mode (or tapped the banner body
// to open it). Zeroes the count AND the dismissal flag for that kind.
function _clearNoti(kind) {
  if (kind) { _notiUnseen[kind] = 0; _notiDetail[kind] = null; _notiDismissed[kind] = false; }
  else { Object.keys(_notiUnseen).forEach(k => { _notiUnseen[k] = 0; _notiDetail[k] = null; _notiDismissed[k] = false; }); }
  _saveNoti();
  _renderNotiBanner();
  _paintHeaderModeDots();
}
function _renderNotiBanner() {
  let bar = document.getElementById('notiBar');
  // Show only kinds that have unseen items AND haven't been dismissed
  // for this wave. The icon-badge stays lit either way — only the
  // big yellow ribbon respects dismissal.
  const items = Object.entries(_notiUnseen).filter(([k, n]) => n > 0 && !_notiDismissed[k]);
  if (items.length === 0) {
    if (bar) bar.remove();
    document.body.classList.remove('has-noti-bar');
    return;
  }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'notiBar';
    bar.style.cssText = `
      position:fixed; top:0; left:0; right:0; z-index:10000;
      background:linear-gradient(135deg,#ccd900,#e7e54a);
      color:#1a2314; font-weight:800; font-size:13px;
      padding:11px 14px; cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.18);
      display:flex; align-items:center; gap:8px;
      animation:notiBarIn .35s ease-out;
      font-family:inherit;
      padding-top:calc(11px + env(safe-area-inset-top, 0px));
    `;
    if (!document.getElementById('notiBarStyle')) {
      const st = document.createElement('style');
      st.id = 'notiBarStyle';
      st.textContent = `
        @keyframes notiBarIn { from { transform:translateY(-100%); } to { transform:none; } }
        body.has-noti-bar { padding-top:48px !important; }
      `;
      document.head.appendChild(st);
    }
    document.body.appendChild(bar);
    document.body.classList.add('has-noti-bar');
  }
  // Headline: take the most recent kind (first in items[] — they're
  // ordered by Object.entries which matches insertion order on modern
  // JS engines) and describe its latest detail. Other kinds get folded
  // into a secondary "+ N more · 还有 N 项" line.
  const [primaryKind, primaryCount] = items[0];
  const m       = NOTI_KINDS[primaryKind] || {};
  const detail  = _notiDetail[primaryKind];
  const rs      = detail?.rs_number ? detail.rs_number : '';
  const store   = detail ? (detail.store_cn || detail.store_name || '') : '';
  const itemN   = detail?.item_count || 0;
  // Sentence per kind — gives the user the WHAT not just the count.
  let lead;
  if (primaryKind === 'new_sent') {
    lead = `${m.icon} New request · 新订单`
         + (rs    ? ` · ${esc(rs)}`           : '')
         + (store ? ` · ${esc(store)}`        : '')
         + (itemN ? ` · ${itemN} item${itemN===1?'':'s'} 件` : '');
  } else if (primaryKind === 'prepared') {
    lead = `${m.icon} Ready to receive · 待收货`
         + (rs    ? ` · ${esc(rs)}`           : '')
         + (itemN ? ` · ${itemN} item${itemN===1?'':'s'} 件` : '');
  } else if (primaryKind === 'delivered') {
    lead = `${m.icon} Delivery confirmed · 已送达`
         + (rs    ? ` · ${esc(rs)}`           : '')
         + (store ? ` · ${esc(store)}`        : '');
  } else {
    lead = `${m.icon || '🔔'} ${primaryCount} ${m.label_cn || primaryKind}`;
  }
  // Secondary line — extra kinds OR additional unseen of the same kind.
  const extras = [];
  if (primaryCount > 1) extras.push(`+${primaryCount-1} more · 还有 ${primaryCount-1}`);
  items.slice(1).forEach(([k, n]) => {
    const km = NOTI_KINDS[k] || {};
    extras.push(`${km.icon || '🔔'} ${n} ${km.label_cn || k}`);
  });
  const tail = extras.length
    ? `<div style="font-weight:700;font-size:11px;opacity:.7;margin-top:2px">${extras.join(' · ')}</div>`
    : `<div style="font-weight:600;font-size:11px;opacity:.7;margin-top:2px">点击打开 · Tap to open</div>`;
  bar.innerHTML = `
    <span style="flex:1;line-height:1.3">${lead}${tail}</span>
    <button id="notiClose" style="background:rgba(0,0,0,.14);border:none;color:#1a2314;border-radius:7px;width:28px;height:28px;font-weight:800;cursor:pointer;font-size:15px;line-height:1;font-family:inherit;flex-shrink:0">✕</button>
  `;
  bar.onclick = (e) => {
    // ✕ button HIDES the banner but leaves the icon badge as a
    // reminder that there's still something to deal with. Tapping
    // the banner body OPENS the relevant mode (which is "I'm handling
    // it") and clears both banner + badge.
    if (e.target.id === 'notiClose') { _dismissNotiBanner(); return; }
    const [primary] = items[0];                 // open the first kind first
    const m = NOTI_KINDS[primary] || {};
    _clearNoti(primary);
    if (m.action) try { m.action(); } catch {}
  };
}
// Auto-clear context: when the user enters the relevant mode/tab on
// their own (without clicking the banner), wipe the matching unseen
// count so the banner doesn't keep nagging about something they
// already see on screen.
function _autoClearOnContext() {
  if (_appMode === 'restock' && _notiUnseen.prepared > 0)            _clearNoti('prepared');
  if (_appMode === 'inbox'   && _inboxTab === 'active'   && _notiUnseen.new_sent > 0)  _clearNoti('new_sent');
  if (_appMode === 'inbox'   && _inboxTab === 'history'  && _notiUnseen.delivered > 0) _clearNoti('delivered');
}
// ─── Server-Sent Events (instant push) ──────────────────────────────
// Sub-second restock notifications. The 30s poller stays as fallback
// for the brief reconnect window after a network blip.
let _eventStream = null;
function _connectEventStream() {
  if (!_user) return;
  try {
    if (_eventStream) { try { _eventStream.close(); } catch {} }
    _eventStream = new EventSource('/api/events');
    _eventStream.addEventListener('restock', (e) => {
      try {
        const evt = JSON.parse(e.data);
        if (!evt) return;
        // The server's 'prepared' event has two distinct meanings
        // depending on direction:
        //   store→warehouse  → the warehouse just prepared the store's
        //                      request → store user gets a "ready to
        //                      receive" reminder on the 🔄 button.
        //   warehouse→store  → the store just confirmed receipt of a
        //                      push → warehouse user gets a "delivery
        //                      confirmed" notification on the 📥 button.
        //   warehouse→kitchen→ kitchen finished prepping → warehouse
        //                      user gets a completion notification on
        //                      the 📥 button (same as delivered).
        // So when the source side of the event is the warehouse, the
        // receiver is a warehouse-inbox user and we bucket the event
        // into 'delivered' (the inbox-side completion kind) rather
        // than 'prepared' (the store-side restock kind).
        let kind = null;
        if (evt.kind === 'sent')           kind = 'new_sent';
        else if (evt.kind === 'prepared')  kind = (evt.from_role === 'warehouse') ? 'delivered' : 'prepared';
        else if (evt.kind === 'delivered') kind = 'delivered';
        if (!kind) return;
        _addNoti(kind, evt);
        // Seed the poller's known-id sets so the next /api/restock poll
        // diff doesn't re-detect this same event and double-fire.
        if (kind === 'new_sent')   _knownActiveIds.add(evt.id);
        if (kind === 'delivered')  _lastDeliveredIds.add(evt.id);
      } catch {}
    });
    _eventStream.onerror = () => { /* EventSource reconnects automatically */ };
  } catch {}
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
