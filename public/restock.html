<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" id="meta-theme-color" content="#16161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Stock · 库存</title>
<link rel="manifest" href="/restock-manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/restock-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/restock-icon-512.png">
<link rel="apple-touch-icon" href="/restock-icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/restock-icon-512.png">
<meta name="application-name" content="Stock">
<meta name="apple-mobile-web-app-title" content="Stock">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('roots_theme');
      var theme = saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#ece6d8' : '#16161a');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
@font-face { font-family: 'Toni Grotesk'; src: url('/assets/fonts/ToniGroteskPro.otf') format('opentype'); font-display: swap; }

/* Retail-admin token system + legacy aliases. See app.html for full docs. */
:root {
  --bg-app:     #16161a;
  --bg-pane:    #1f1f24;
  --bg-elev-1:  #25252b;
  --bg-elev-2:  #2e2e35;
  --bg-input:   #1a1a1f;
  --bg-overlay: rgba(10, 10, 12, .72);
  --line-soft-tok: rgba(255, 255, 255, .055);
  --line-tok:      rgba(255, 255, 255, .09);
  --line-strong:   rgba(255, 255, 255, .15);
  --ring:          rgba(204, 217, 0, .35);
  --text-1: #ecebe5;
  --text-2: #aeaba2;
  --text-3: #7d7a72;
  --text-4: #56544f;
  --accent:      #ccd900;
  --accent-hi:   #dde858;
  --accent-ink:  #16161a;
  --success-color: #80c462;
  --sh-1: 0 1px 2px rgba(0, 0, 0, .25);
  --sh-2: 0 4px 16px rgba(0, 0, 0, .25);
  --sh-3: 0 24px 60px rgba(0, 0, 0, .5);
  --f-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', "PingFang SC", system-ui, sans-serif;
  /* Legacy aliases — restock had a richer token set, mapped carefully */
  --dk:          var(--bg-elev-2);
  --dk2:         var(--bg-elev-1);
  --lime:        var(--accent);
  --lime-2:      #b3bf00;
  --lime-text:   var(--accent);
  --green:       var(--success-color);
  --oat:         var(--bg-pane);
  --bg:          var(--bg-app);
  --card:        var(--bg-pane);
  --border:      var(--line-tok);
  --border-soft: var(--line-soft-tok);
  --muted:       var(--text-3);
  --muted-2:     var(--text-4);
  --danger:      #e8556a;
  --danger-2:    #c4435a;
  --danger-soft-bg: rgba(232, 85, 106, .14);
  --danger-soft-border: rgba(232, 85, 106, .35);
  --success:     var(--success-color);
  --warn:        #e9a35a;
  --shadow-sm: var(--sh-1);
  --shadow-md: var(--sh-2);
  --shadow-lg: var(--sh-3);
  --sa-top: env(safe-area-inset-top, 0px);
  --sa-bot: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg-app:     #ece6d8;
  --bg-pane:    #fbf8ee;
  --bg-elev-1:  #f4efdf;
  --bg-elev-2:  #e9e3d0;
  --bg-input:   #fefcf3;
  --bg-overlay: rgba(20, 20, 22, .42);
  --line-soft-tok: rgba(30, 25, 5, .075);
  --line-tok:      rgba(30, 25, 5, .16);
  --line-strong:   rgba(30, 25, 5, .26);
  --ring:          rgba(140, 152, 0, .38);
  --text-1: #1a1a17;
  --text-2: #43413a;
  --text-3: #6a675c;
  --text-4: #9a978c;
  --accent-hi:  #b8c200;
  --lime-text:  #6e7a00;
  --sh-1: 0 1px 3px rgba(40, 30, 5, .09);
  --sh-2: 0 6px 18px rgba(40, 30, 5, .10);
  --sh-3: 0 24px 60px rgba(40, 30, 5, .22);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--dk); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none; -webkit-user-select: none;
  font-feature-settings: "ss01", "cv11"; /* slightly nicer numerals where supported */
}
button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
input, textarea, select { font-family: inherit; -webkit-user-select: text; user-select: text; }
input:focus, textarea:focus { outline: none; }

/* ── Shell — three rows: header, scrollable cart, sticky footer ── */
.shell {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100dvh;
  height: 100vh;
  padding-top: var(--sa-top);
}
@supports (height: 100dvh) { .shell { height: 100dvh; } }

/* ── Header — confident dark band with subtle lime tinted shadow.
   Two rows visually: (1) brand + icons, (2) live cart status. ── */
.head {
  background: linear-gradient(180deg, var(--dk2) 0%, var(--dk) 100%);
  color: #fff;
  padding: 14px 16px 12px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative;
  box-shadow: 0 4px 18px rgba(26,35,20,.18);
}
/* faint lime accent line at the bottom edge — anchors the band */
.head::after {
  content: '';
  position: absolute; bottom: 0; left: 16px; right: 16px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(204,217,0,.6) 30%, rgba(204,217,0,.6) 70%, transparent);
  border-radius: 999px;
}
.head .row1 {
  display: flex; align-items: center; gap: 12px;
}
.head .brand {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
}
.head .brand-text { min-width: 0; }
.head .brand-text .h1 {
  font-weight: 900; font-size: 17px;
  letter-spacing: -.005em; line-height: 1;
  display: flex; align-items: center; gap: 6px;
}
.head .brand-text .h1 .cn-tag {
  font-size: 11px; font-weight: 700;
  color: var(--lime); opacity: .7;
}
.head .brand-text .sub {
  font-size: 11px; color: rgba(255,255,255,.5);
  margin-top: 3px; font-weight: 600;
  letter-spacing: .02em;
}
.head .icons { display: flex; gap: 6px; }
.head .icons button {
  width: 44px; height: 44px;
  border-radius: 12px;
  font-size: 20px;
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.06);
  transition: background .15s, transform .1s;
}
.head .icons button:hover { background: rgba(255,255,255,.12); }
.head .icons button:active { background: rgba(204,217,0,.2); transform: scale(.94); }
/* Status row — live cart info, nudges the user toward the goal. */
.head .status-row {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 2px 0;
}
.head .status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.06);
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 12px;
  color: rgba(255,255,255,.85);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.head .status-pill .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 8px rgba(204,217,0,.6);
}
.head .status-pill.ghost { color: rgba(255,255,255,.4); }
.head .status-pill.ghost .dot { background: rgba(255,255,255,.25); box-shadow: none; }
.head .user-pill {
  margin-left: auto;
  font-size: 11px; color: rgba(255,255,255,.5);
  font-weight: 600;
}

/* ── Body — scrollable cart container ── */
.body {
  background: var(--bg);
  overflow-y: auto;
  padding: 14px 14px 110px;
  min-height: 0;
}
.body.tappable { cursor: pointer; }
.body.tappable > .line { cursor: default; }

/* ── Empty state — invites action, not just a placeholder ── */
/* Header mode-switcher buttons — small, persistent, always-visible.
   Two icons (Restock + Fulfill) sit in the header icons row. The
   active mode's button is tinted with its brand color (lime / blue)
   so you see at a glance what mode you're in. A red dot in the
   top-right corner of the OTHER button flags unseen activity in
   that flow — so while working in Restock you immediately see "📥
   has 2 new" without leaving the screen.

   The .mode-btn class extends the existing 44x44 .head .icons button
   layout; the inline `position:relative` on each <button> in the
   markup lets the dot anchor cleanly. */
.head .icons button.mode-btn { transition: background .15s ease, box-shadow .15s ease; }
.head .icons button.mode-btn.active.mode-restock {
  background: var(--lime);
  color: var(--dk);
  box-shadow: 0 1px 6px rgba(204,217,0,.45);
}
.head .icons button.mode-btn.active.mode-inbox {
  background: #3b82f6;
  color: #fff;
  box-shadow: 0 1px 6px rgba(37,99,235,.45);
}
/* Count badge on the mode icons — replaces the old bare dot. Shows
   the actual number of unseen items so you can tell "1 pending" from
   "5 pending" at a glance. White outline lifts it off whichever
   background the active mode uses (lime/blue/dark). */
.head .icons button.mode-btn .mode-dot {
  position: absolute;
  top: -3px; right: -3px;
  min-width: 18px; height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: linear-gradient(180deg, #e05252, #c43d3d);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 18px;
  text-align: center;
  letter-spacing: -.01em;
  box-shadow: 0 0 0 2px var(--dk), 0 2px 6px rgba(196,61,61,.45);
  animation: modeDotPop .32s cubic-bezier(.2,.7,.4,1);
  pointer-events: none;
}
@keyframes modeDotPop {
  0%   { transform: scale(0); opacity: 0; }
  60%  { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.empty {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; pointer-events: none; padding: 18px 0 6px;
}
.empty .icon-wrap {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(204,217,0,.18), transparent 70%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.empty .icon-wrap::before {
  content: '';
  position: absolute; inset: 10px;
  border-radius: 50%;
  border: 1px dashed var(--border);
}
.empty .icon { font-size: 38px; opacity: .35; line-height: 1; filter: grayscale(.2); }
.empty .lead {
  font-size: 17px; font-weight: 800; color: var(--dk);
  text-align: center; line-height: 1.3;
}
.empty .lead .cn { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.empty .hint {
  font-size: 13px; color: var(--lime-text); font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 22px;
  background: var(--card);
  border: 1.5px dashed rgba(204,217,0,.45);
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
  pointer-events: auto;
}
.empty .hint:hover { background: rgba(204,217,0,.04); border-color: rgba(204,217,0,.7); }

/* ── Notes-for-warehouse bar — full-width, outlined, integrates with cards ── */
.notes-bar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 12px;
  display: flex;
  gap: 10px;
  align-items: center;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .15s, border-color .15s;
}
.notes-bar:focus-within { border-color: rgba(204,217,0,.45); box-shadow: var(--shadow-md); }
.notes-bar .icon-pill {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: rgba(204,217,0,.12);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.notes-bar input {
  flex: 1;
  border: none;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  background: transparent;
  color: var(--dk);
  padding: 4px 0;
}
.notes-bar input::placeholder { color: var(--muted); }

/* ── Cart line — multi-layer shadow, lime accent stripe on the left,
   refined two-row internal layout (header row + controls row). ── */
.line {
  background: var(--card);
  border-radius: 16px;
  padding: 14px 14px 14px 18px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  position: relative;
  animation: lineIn .28s cubic-bezier(.2,.7,.4,1);
  overflow: hidden;
}

/* "+ Add Item" CTA — sits below the last cart line. The cart auto-scrolls
   to bring it into view after every add so it stays one tap away without
   overlapping the items above. */
.add-item-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%;
  background: linear-gradient(180deg, rgba(204,217,0,.05), rgba(204,217,0,.12));
  border: 2px dashed rgba(204,217,0,.55);
  color: var(--lime-text);
  font-weight: 800; font-size: 14px; letter-spacing: .03em;
  padding: 16px 18px;
  margin-top: 12px;
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: background .18s, border-color .18s, transform .12s, box-shadow .18s;
}
.add-item-btn:hover {
  background: linear-gradient(180deg, rgba(204,217,0,.10), rgba(204,217,0,.18));
  border-color: var(--lime);
  box-shadow: 0 6px 20px rgba(204,217,0,.18);
}
.add-item-btn:active { transform: scale(.985); }
.add-item-btn .plus {
  font-size: 22px; line-height: 1; color: var(--lime);
  text-shadow: 0 1px 4px rgba(204,217,0,.4);
}
.line::before {
  /* Lime left-edge stripe — subtle "in cart" affordance */
  content: '';
  position: absolute; top: 12px; bottom: 12px; left: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--lime), var(--lime-2));
  border-radius: 0 3px 3px 0;
  opacity: .9;
}
@keyframes lineIn {
  from { transform: translateY(-6px); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
.line.popped { animation: pop .22s ease-out; }
@keyframes pop {
  0%   { transform: scale(1); box-shadow: var(--shadow-sm); }
  40%  { transform: scale(1.015); box-shadow: 0 8px 22px rgba(204,217,0,.18), 0 0 0 1px rgba(204,217,0,.4); }
  100% { transform: scale(1); box-shadow: var(--shadow-sm); }
}
.line .top {
  display: flex; align-items: flex-start; gap: 10px;
  position: relative;
}
.line .top .info { flex: 1; min-width: 0; padding-right: 36px; }
.line .name {
  font-weight: 800;
  font-size: 15.5px;
  line-height: 1.3;
  word-break: break-word;
  color: var(--dk);
  letter-spacing: -.005em;
}
.line .name .cn {
  color: var(--muted); font-weight: 500; font-size: 13px;
  margin-left: 2px;
}
.line .meta {
  font-size: 11px; color: var(--muted);
  margin-top: 5px;
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.line .meta .chip {
  display: inline-flex; align-items: center;
  background: var(--bg);
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 11px;
  color: var(--muted);
}
.line .meta .chip.sku { font-family: ui-monospace, monospace; color: var(--lime-text); background: rgba(204,217,0,.08); }
.line .remove {
  position: absolute; top: -4px; right: -4px;
  width: 36px; height: 36px;
  font-size: 16px;
  color: var(--muted);
  border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: color .12s, background .12s;
}
.line .remove:hover { color: var(--danger); background: var(--danger-soft-bg); }
.line .remove:active { background: rgba(185,74,74,.16); transform: scale(.92); }
/* Inbox row right-stack — status pill on top, tiny × archive button
   tucked beneath it. Vertical group sits in the existing flex slot at
   the top of the row, so it never collides with the pill or pushes
   into the row content. */
.line-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
.inbox-archive-btn {
  width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--muted-2);
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  line-height: 1;
  padding: 0;
  cursor: pointer;
  border-radius: 6px;
  transition: background .15s, color .15s, transform .12s;
  opacity: .55;
}
.inbox-archive-btn:hover { background: var(--danger-soft-bg); color: var(--danger); opacity: 1; }
.inbox-archive-btn:active { transform: scale(.9); }
.line .ctrl {
  display: flex; align-items: center; gap: 10px;
  margin-top: 14px;
}
.line .ctrl-label {
  font-size: 10px; font-weight: 800;
  color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
  margin-right: 2px;
}

/* Qty dropdown — premium-feel select with inline arrow */
.qty-select {
  height: 46px;
  padding: 0 36px 0 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: inherit;
  font-size: 17px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--dk);
  background: #fff;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236d7a2a' d='M6 8L0 0h12z'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
  transition: border-color .15s, box-shadow .15s;
}
.qty-select:hover { border-color: rgba(204,217,0,.5); }
.qty-select:focus { border-color: var(--lime); box-shadow: 0 0 0 3px rgba(204,217,0,.18); outline: none; }
.qty-input-manual {
  height: 46px;
  width: 86px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  text-align: center;
  font-size: 17px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  padding: 0 8px;
  font-family: inherit;
  background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.qty-input-manual:hover { border-color: rgba(204,217,0,.5); }
.qty-input-manual:focus { border-color: var(--lime); box-shadow: 0 0 0 3px rgba(204,217,0,.18); outline: none; }
/* Legacy class kept for safety — no longer rendered */
.qty-btn { display: none; }
.qty-input { display: none; }

.note-input {
  width: 100%;
  margin-top: 12px;
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13.5px;
  background: var(--bg);
  font-family: inherit;
  color: var(--dk);
  transition: background .15s, border-color .15s;
}
.note-input::placeholder { color: var(--muted-2); }
.note-input:focus { outline: none; border-color: rgba(204,217,0,.5); background: #fff; }

/* ── Add-more affordance below the last cart line ── */
.add-more-pill {
  margin: 14px auto 6px;
  display: flex; justify-content: center;
}
.add-more-pill > div {
  font-size: 13px;
  color: var(--lime-text);
  font-weight: 800;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 22px;
  background: var(--card);
  border: 1.5px dashed rgba(204,217,0,.4);
  border-radius: 999px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: background .15s, border-color .15s, transform .12s;
}
.add-more-pill > div:hover { background: rgba(204,217,0,.04); border-color: rgba(204,217,0,.7); }
.add-more-pill > div:active { transform: scale(.97); }

/* ── Footer — sticky, two-button row, distinct visual weight ── */
.foot {
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 14px 14px calc(14px + var(--sa-bot));
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center; gap: 14px;
  box-shadow: 0 -10px 28px rgba(0,0,0,.06);
  position: relative;
}
.foot::before {
  /* Hairline gradient at the top — feels less "stuck on" */
  content: '';
  position: absolute; top: 0; left: 14px; right: 14px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}
.foot .info {
  display: flex; flex-direction: column; line-height: 1.1;
  padding: 4px 4px 4px 4px;
}
.foot .info .lbl {
  font-size: 10px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 4px;
}
.foot .info .val {
  font-size: 26px; font-weight: 900; color: var(--dk);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.foot .info .val .cn-suffix { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.foot .actions { display: flex; gap: 8px; }
.submit-btn {
  background: linear-gradient(180deg, var(--dk2) 0%, var(--dk) 100%);
  color: var(--lime);
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 14px; font-weight: 800;
  letter-spacing: .04em; text-transform: uppercase;
  transition: transform .12s, box-shadow .15s, opacity .15s;
  flex: 1;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(26,35,20,.18);
}
.submit-btn:disabled {
  opacity: .35;
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--border);
  box-shadow: none;
}
.submit-btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,35,20,.24); }
.submit-btn:not(:disabled):active { transform: scale(.97); }
.submit-btn.draft {
  background: var(--card);
  color: var(--dk);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
  flex: 0 0 auto;
}
.submit-btn.draft:hover:not(:disabled) { border-color: var(--muted); background: var(--bg); transform: translateY(-1px); }
.submit-btn.danger {
  background: linear-gradient(180deg, var(--danger) 0%, var(--danger-2) 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(185,74,74,.22);
}
.submit-btn.danger:not(:disabled):hover { box-shadow: 0 6px 20px rgba(185,74,74,.30); transform: translateY(-1px); }
/* Compact icon-only "soft danger" — used for draft-delete and similar
   row-level destructive actions that shouldn't compete with primary CTAs. */
.icon-btn-danger {
  background: var(--danger-soft-bg);
  border: 1.5px solid var(--danger-soft-border);
  color: var(--danger);
  border-radius: 12px;
  width: 44px; height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 17px;
  transition: background .15s, border-color .15s, transform .12s;
}
.icon-btn-danger:hover { background: #f6e0e0; border-color: var(--danger); }
.icon-btn-danger:active { transform: scale(.94); }

/* ── Floating Action Button — always-visible "+ Add" so users can add
   another product no matter how many lines are already in the cart.
   Without this, a full screen of lines hides the empty-area tap target
   and the user is forced to scroll. ── */
.add-fab {
  position: fixed;
  right: 16px;
  bottom: calc(96px + var(--sa-bot));
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--lime) 0%, var(--lime-2) 100%);
  color: var(--dk);
  font-size: 30px;
  font-weight: 900;
  box-shadow:
    0 8px 22px rgba(204,217,0,.45),
    0 2px 8px rgba(26,35,20,.18),
    inset 0 1px 0 rgba(255,255,255,.4);
  z-index: 60;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .15s cubic-bezier(.2,.7,.4,1), box-shadow .2s;
  border: 2px solid rgba(255,255,255,.5);
}
.add-fab:active { transform: scale(.9); box-shadow: 0 4px 12px rgba(204,217,0,.35); }
.add-fab:hover { transform: translateY(-2px); }
/* Subtle pulse to attract attention when cart is empty (encourages first add).
   Stops once items are present (.has-items class added by JS). */
.add-fab:not(.has-items) { animation: fabPulse 2.4s ease-in-out infinite; }
@keyframes fabPulse {
  0%, 100% { box-shadow: 0 8px 22px rgba(204,217,0,.45), 0 2px 8px rgba(26,35,20,.18), 0 0 0 0 rgba(204,217,0,.6); }
  60%      { box-shadow: 0 8px 22px rgba(204,217,0,.45), 0 2px 8px rgba(26,35,20,.18), 0 0 0 14px rgba(204,217,0,0); }
}
@media (min-width: 600px) {
  .add-fab { bottom: calc(108px + var(--sa-bot)); right: 24px; }
}

/* Overlay */
.ov-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 100; display: none;
  animation: fade .15s ease;
}
.ov-backdrop.visible { display: block; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.ov {
  position: fixed; inset: 0;
  background: var(--card);
  z-index: 101; display: none;
  flex-direction: column;
  padding-bottom: var(--sa-bot);
  animation: slideUp .22s cubic-bezier(.2,.7,.4,1);
}
.ov.visible { display: flex; }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: none } }
@media (min-width: 600px) {
  .ov {
    inset: auto;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, 92vw);
    max-height: 80vh;
    border-radius: 18px;
  }
  .ov.visible { animation: fadeUp .22s cubic-bezier(.2,.7,.4,1); }
  @keyframes fadeUp {
    from { transform: translate(-50%, calc(-50% + 12px)); opacity: 0 }
    to   { transform: translate(-50%, -50%); opacity: 1 }
  }
}

  background: var(--lime); color: var(--dk);

  background: var(--bg);
  border: 1px solid var(--border);

/* Toast */
.toast-wrap {
  position: fixed; bottom: calc(120px + var(--sa-bot));
  left: 50%; transform: translateX(-50%);
  z-index: 200; pointer-events: none;
  display: flex; flex-direction: column; gap: 8px;
  width: calc(100% - 32px); max-width: 420px;
}
.toast {
  background: var(--dk); color: #fff;
  padding: 14px 16px; border-radius: 14px;
  font-size: 14px; font-weight: 700;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  pointer-events: auto;
  animation: toastIn .25s ease;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
@keyframes toastIn { from { transform: translateY(20px); opacity: 0 } to { transform: none; opacity: 1 } }

.scan-pulse {
  position: fixed; top: var(--sa-top); left: 0; right: 0; height: 3px;
  background: var(--lime); transform: scaleX(0);
  transform-origin: left; z-index: 70; pointer-events: none;
}
.scan-pulse.fire { animation: pulse .45s ease-out; }
@keyframes pulse {
  0%   { transform: scaleX(0); opacity: 1 }
  40%  { transform: scaleX(1); opacity: 1 }
  100% { transform: scaleX(1); opacity: 0 }
}

<script>
'use strict';
// ─── State ─────────────────────────────────────────────────────────
let _user = null;
let _products = [];
let _cart = [];               // [{ product, qty, notes }] — restock cart
let _orderNotes = '';
// Waste cart shares the same picker but holds its own line shape:
// { product, qty, reason, notes }. Each line submits as a separate
// POST /api/waste call (the API takes one product per request).
let _wasteCart = [];          // [{ product, qty, reason, notes }]
const WASTE_REASONS = [
  { id:'expired',  label:'Expired · 过期' },
  { id:'spoiled',  label:'Spoiled · 变质' },
  { id:'damaged',  label:'Damaged · 损坏' },
  { id:'dropped',  label:'Dropped · 掉落' },
  { id:'overprep', label:'Over-prep · 备得过多' },
  { id:'other',    label:'Other · 其他' },
];
// App mode — 'restock' | 'waste' | 'inbox'. NOT persisted across opens
// for restock/waste; warehouse users default to 'inbox' since that's
// their daily flow.
//   restock → vendor creates a request                       (perm: restock)
//   waste   → log spoiled / damaged stock                    (perm: waste)
//   inbox   → warehouse fulfilment view of incoming requests (perm: warehouse, role:warehouse, or admin)
let _appMode = 'restock';
// When editing a previously-saved draft these hold its identity. Submit
// then uses PUT /api/restock/:id (replacing items + optionally bumping
// status to 'sent') instead of creating a new order.
let _draftId = null;
let _draftRsNumber = null;
let _scanBuf = '', _scanBufTimer = null;
let _voiceLang = 'en-US', _voiceRec = null, _voiceTranscript = '', _voiceGeo = null;
// Stashed `beforeinstallprompt` event so we can fire the OS install
// dialog from our own button (More menu → Install App). The browser
// fires this when the PWA install criteria are met but we want to
// defer the prompt to a moment of our choosing. `null` after the user
// either accepts or dismisses, or if the browser never fires it (e.g.
// iOS Safari, Xiaomi Mi Browser).
let _installPromptEvent = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _installPromptEvent = e;
});
window.addEventListener('appinstalled', () => {
  _installPromptEvent = null;
  // Explicit, actionable success — many Android launchers (esp. MIUI)
  // drop PWA icons into the App Drawer, not the home screen, so users
  // hear "installed" and then can't find the icon. A loud, persistent
  // alert tells them exactly where to look.
  setTimeout(() => {
    alert('✓ App installed!\n应用已安装\n\nWhere to find it:\n• Swipe up on your home screen to open the App Drawer · 主屏幕上滑打开应用抽屉\n• Look for "Stock 库存"\n• Long-press the icon to drag it to your home screen · 长按图标可拖动到主屏幕');
  }, 200);
});

// ─── Init ──────────────────────────────────────────────────────────
(async function init() {
  const r = await fetch('/api/auth/me').then(r => r.json()).catch(() => ({}));
  _user = r?.user;
  if (!_user) { location.href = '/login?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
  // Remember this is where the user was last working — login.html
  // reads `last_app` to send them back here next time without a
  // dashboard detour.
  try { localStorage.setItem('last_app', '/restock'); } catch {}
  const perms = _user.permissions || {};
  // Allow anyone with EITHER perm — `restock` (store-side: creates
  // requests) or `warehouse_inbox` (warehouse-side: fulfils them).
  // Admin always passes. Without either perm the user gets a 403 page.
  if (_user.role !== 'admin' && !perms.restock && !perms.warehouse_inbox) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center"><h1>403</h1><p>No restock access · 无补货权限</p><p><a href="/">← Back · 返回</a></p></div>';
    return;
  }
  // user pill was inside the old simple `.title` div — the redesigned
  // brand block puts the user identity in the More menu instead.
  const userPillEl = document.getElementById('userPill');
  if (userPillEl) userPillEl.textContent = _user.displayName || _user.username || '';

  // Search header button removed — picking products happens via the
  // big "+ Add Item" button in the body, which is more discoverable.
  const _searchBtnEl = document.getElementById('searchBtn');
  if (_searchBtnEl) _searchBtnEl.addEventListener('click', openSearch);
  document.getElementById('voiceBtn').addEventListener('click', openVoice);
  document.getElementById('headerDraftsBtn').addEventListener('click', openDrafts);
  document.getElementById('moreBtn').addEventListener('click', openMore);
  document.getElementById('modeHomeBtn')?.addEventListener('click', () => setAppMode('home'));
  document.getElementById('modeRestockBtn')?.addEventListener('click', () => setAppMode('restock'));
  document.getElementById('modeInboxBtn')?.addEventListener('click', () => setAppMode('inbox'));
  const _fabEl = document.getElementById('addFab');
  if (_fabEl) _fabEl.addEventListener('click', openSearch);
  document.getElementById('ovBackdrop').addEventListener('click', closeAllOv);
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeAllOv));
  document.getElementById('searchInput').addEventListener('input', onSearchInput);
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { const top = document.querySelector('#searchList .search-row'); if (top) top.click(); }
  });
  document.getElementById('voiceLangEN').addEventListener('click', () => setVoiceLang('en-US'));
  document.getElementById('voiceLangCN').addEventListener('click', () => setVoiceLang('zh-CN'));
  document.getElementById('voiceMicBtn').addEventListener('click', toggleVoice);

  // Document-level keystroke capture for barcode gun input.
  document.addEventListener('keydown', (e) => {

      el.addEventListener('click', () => {
        const i = +el.dataset.i, a = el.dataset.act;
        if (a === 'rm') removeLine(i);
      });
    });
    // Qty dropdown: pick 0-5 directly, or "other" reveals a manual input.
    body.querySelectorAll('[data-qty-sel]').forEach(sel => {
      sel.addEventListener('change', () => {
        const i = +sel.dataset.qtySel;
        const v = sel.value;
        const otherInp = body.querySelector(`[data-qty-other="${i}"]`);
        if (v === 'other') {
          if (otherInp) {
            otherInp.style.display = 'inline-block';
            // Default the manual input to 6 so it's > 5 (else it'd flip
            // back to "5" on next render). User can change after.
            if (!otherInp.value || +otherInp.value < 6) otherInp.value = '6';
            _cart[i].qty = parseFloat(otherInp.value) || 6;
            otherInp.focus();
            otherInp.select();
          }
        } else {
          if (otherInp) { otherInp.style.display = 'none'; otherInp.value = ''; }
          _cart[i].qty = parseFloat(v) || 0;
          if (_cart[i].qty === 0) {
            // "—" selected → drop the line entirely.
            removeLine(i);
            return;
          }
        }
        updateFooter();
      });
    });
    body.querySelectorAll('[data-qty-other]').forEach(inp => {
      inp.addEventListener('input', () => {
        const i = +inp.dataset.qtyOther;
        let v = parseFloat(inp.value) || 0;
        if (v < 6) v = 6;     // anything < 6 belongs in the dropdown
        if (v > 999) v = 999;
        _cart[i].qty = v;
        updateFooter();
      });
    });
    body.querySelectorAll('[data-note]').forEach(inp => {
      inp.addEventListener('input', () => {
        const i = +inp.dataset.note;
        _cart[i].notes = inp.value;
      });
    });
  }
  updateFooter();
}

// ─── Cart ops ──────────────────────────────────────────────────────
function addToCart(product) {
  // Route picks to the active mode's cart. Same picker, two carts.
  if (_appMode === 'waste') return addToWasteCart(product);
  const existing = _cart.find(c => c.product.id === product.id);
  if (existing) {
    existing.qty = (parseFloat(existing.qty) || 0) + 1;
  } else {
    _cart.push({ product, qty: 1, notes: '' });
  }
  render();
  pulseScan(); beep('ok');
  // Scroll the Add Item button into view so the next product is always
  // one tap away — and pop-animate the new line on the way.
  const idx = _cart.findIndex(c => c.product.id === product.id);
  setTimeout(() => {
    const el = document.querySelector(`[data-line="${idx}"]`);
    if (el) {
      el.classList.add('popped');
      setTimeout(() => el.classList.remove('popped'), 200);
    }
    const addBtn = document.getElementById('addMoreHint') || document.getElementById('rkEmptyAdd');
    if (addBtn) addBtn.scrollIntoView({ behavior: 'smooth', block: 'end' });
    else if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 30);
}
function changeQty(i, delta) {
  if (!_cart[i]) return;
  _cart[i].qty = Math.max(0, +(((parseFloat(_cart[i].qty) || 0) + delta).toFixed(0)));
  if (_cart[i].qty === 0) removeLine(i);
  else render();
}
function removeLine(i) { _cart.splice(i, 1); render(); }

// ─── Waste mode ────────────────────────────────────────────────────
function addToWasteCart(product) {
  // Same product can legitimately appear twice with different reasons
  // (e.g. 2 expired + 1 dropped). For convenience, bump qty if the same
  // product+reason combo already exists; otherwise add a new line.
  const existing = _wasteCart.find(c => c.product.id === product.id && c.reason === 'expired');
  if (existing) {
    existing.qty = (parseFloat(existing.qty) || 0) + 1;
  } else {
    _wasteCart.push({ product, qty: 1, reason: 'expired', notes: '' });
  }
  _renderWaste();
  pulseScan(); beep('ok');
  const idx = _wasteCart.length - 1;
  setTimeout(() => {
    const el = document.querySelector(`[data-line="${idx}"]`);
    if (el) {
      el.classList.add('popped');
      setTimeout(() => el.classList.remove('popped'), 200);
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, 30);
}
function _wasteRemove(i) { _wasteCart.splice(i, 1); _renderWaste(); }

// ─── Inbox mode (warehouse) ────────────────────────────────────────
// Mobile-first warehouse fulfilment queue. Mirrors the desktop /restock
// module's warehouse role: tabs for Active vs History, full status
// pipeline (sent → received → prepared → delivered), per-item check-off
// + qty_sent override, plus warehouse-side notes. Permission-gated by
// the `warehouse_inbox` flag (admin-granted, default off).
let _inboxOrders = [];
let _inboxBusy = false;
let _inboxTab = 'active'; // 'active' | 'history'
// Separate from _inboxOrders so the header "X pending" pill always
// reflects the active-tab count, regardless of which tab is on screen.
let _inboxActiveCount = 0;
let _inboxActiveInProgress = 0;

// Pending-deliveries state for the store side. Holds restock orders
// the current user created that are now status='prepared' — i.e.
// waiting at the warehouse to be received. Refreshed on app open and
// whenever the user enters Restock mode. Admins see all prepared
// orders so they can confirm any of them.
let _pendingDeliveries = [];
// Pending-fulfill state for the warehouse side. Holds store→warehouse
// orders the warehouse hasn't started yet (status='sent'). Same banner
// treatment as the store-side "Ready to receive" so warehouse users
// get a heads-up about incoming requests even when in Restock mode.
let _pendingFulfill = [];
// Awaiting-confirmation state for the warehouse side. Holds warehouse→
// store orders at status='prepared' — the warehouse has packed them
// and is waiting for the store to confirm receipt. Banner reminds the
// warehouse what's still open on the store's end.
let _awaitingConfirm = [];
async function refreshPendingDeliveries(opts) {
  if (!_user) return;
  const silent = opts && opts.silent;
  const prevIds = silent ? new Set(_pendingDeliveries.map(o => o.id)) : null;
  const prevFulfillIds = silent ? new Set(_pendingFulfill.map(o => o.id)) : null;
  try {
    // Only store→warehouse orders need a "Mark Delivered" confirmation
    // from the receiver. Warehouse→kitchen orders are CLOSED at status
    // 'prepared' (kitchen done = done) — the warehouse just gets a
    // notification, no confirmation needed. So we filter out anything
    // that isn't headed to a warehouse here.
    const r = await fetch('/api/restock?status=prepared&to_role=warehouse');
    const d = await r.json();
    const all = (d?.data || []);
    _pendingDeliveries = (_user.role === 'admin')
      ? all
      : all.filter(o => o.created_by === _user.id);
  } catch { _pendingDeliveries = []; }
  // Warehouse-side incoming queue: sent store→warehouse orders waiting
  // to be prepared. Only fetched for users who actually fulfill them.
  const hasInbox = _user.role === 'admin' || !!(_user.permissions||{}).warehouse_inbox;
  if (hasInbox) {
    try {
      const r = await fetch('/api/restock?status=sent&to_role=warehouse');
      const d = await r.json();
      _pendingFulfill = (d?.data || []);
    } catch { _pendingFulfill = []; }
    // Warehouse→store orders the user prepared and is waiting for the
    // store to confirm receipt. Surfaces what's still open on the other
    // end so the warehouse can follow up if it lingers.
    try {
      const r = await fetch('/api/restock?status=prepared&to_role=store');
      const d = await r.json();
      const all = (d?.data || []);
      _awaitingConfirm = (_user.role === 'admin')
        ? all
        : all.filter(o => o.created_by === _user.id);
    } catch { _awaitingConfirm = []; }
  } else {
    _pendingFulfill = [];
    _awaitingConfirm = [];
  }
  // Notify the store user when a new prepared order shows up — beep +
  // toast so they know warehouse is ready before they're staring at
  // the screen. Skipped on the first (non-silent) load.
  if (silent) {
    const newOnes = _pendingDeliveries.filter(o => !prevIds.has(o.id));
    if (newOnes.length > 0) {
      // Persistent yellow ribbon at the top of the viewport — same UX as
      // the kitchen-PO banner in app.html. Survives reload, only goes
      // away when the user opens the order or dismisses with ×.
      // Each order passes its own payload so the banner can name it
      // ("RS-2026-0042 · 5 items" instead of just "1 ready").
      newOnes.forEach(o => _addNoti('prepared', {
        id: o.id, rs_number: o.rs_number,
        store_name: o.store_name, store_cn: o.store_cn,
        item_count: o.item_count || 0,
      }));
      if (_appMode === 'restock') render();
    }
  }
}

// Store-side polling — checks for newly-prepared orders every 8s
// while the user is in restock mode and the tab is visible. SSE is
// the fast path; this is the fallback for when EventSource is dropped
// (mobile flaky network, tab put to sleep then woken, etc.). Cheap
// (one GET filtered by status). Battery-friendly pause-on-hidden.
let _storePollTimer = null;
function _startStorePolling() {
  _stopStorePolling();
  _storePollTimer = setInterval(() => {
    if (_appMode !== 'restock' || document.hidden) return;
    refreshPendingDeliveries({ silent: true });
  }, 8000);
}
function _stopStorePolling() {
  if (_storePollTimer) { clearInterval(_storePollTimer); _storePollTimer = null; }
}
if (!window._storeVisWired) {
  window._storeVisWired = true;
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && _appMode === 'restock') refreshPendingDeliveries({ silent: true });
  });
}
async function _markDelivered(orderId, label) {
  if (!confirm(`Mark ${label} as delivered? · 确认 ${label} 已送达?`)) return;
  try {
    const r = await fetch('/api/restock/' + orderId + '/status', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status: 'delivered' }),
    });
    const d = await r.json();
    if (!d?.success) throw new Error(d?.error || 'failed');
    toast(`✓ ${label} delivered · 已送达`, 'success');
    beep('done');
    // User just acted on a "ready to receive" notification — clear the
    // prepared-kind badge so they're not nagged by their own action.
    if (_notiUnseen?.prepared > 0) _clearNoti('prepared');
    closeAllOv();
    await refreshPendingDeliveries();
    if (_appMode === 'restock') render();
  } catch (e) {
    toast('Failed: ' + (e.message || ''), 'error');
  }
}

// Auto-refresh — poll every 30s while the inbox is visible so new
// requests from store users appear without a manual ↻ tap. The interval
// is cleared whenever the user switches mode or backgrounds the tab,
// and re-armed when they come back. Cheap (one GET, no items unless
// new orders arrived).
let _inboxPollTimer = null;

// otherwise every order in the inbox would be flagged "new" the first
// time the poller runs (especially for warehouse users who land in
// restock/waste mode and have never opened the inbox UI in this tab).

async function _silentRefreshInbox() {
  // Refreshes the order list (and notification baselines) regardless of
  // which mode/tab the user is currently viewing — warehouse users need
  // notifications even when they're in restock or waste mode.
  try {

      fetch('/api/restock?tab=history').then(r => r.json()),

    const history = (hRes?.data || []);
    // Track the active count separately so the header status pill
    // ("X pending · 待处理") always reflects truly-pending work, not
    // whichever tab the user happens to be looking at. Without this,
    // viewing the History tab would mislabel completed orders as pending.
    _inboxActiveCount      = active.length;

    const cH = document.getElementById('inboxCountHistory');

    if (cH) cH.textContent = '· ' + history.length;

      _paintInboxList();
      _paintStatusRow();

    // has the inbox UI open. First poll surfaces ANY pending sent

    // so the icon badge reflects real work-on-deck the moment they
    // open the app — not just things that arrive while they watch.

    const currentDeliveredIds = new Set(history.filter(o => o.status === 'delivered').map(o => o.id));
    const hasInboxPerm = _user?.role === 'admin' || !!(_user?.permissions||{}).warehouse_inbox;
    if (hasInboxPerm) {

      const newOnes = active
        .filter(o => o.status === 'sent' && o.created_by !== myId)
        .filter(o => !_inboxPollerSeeded || !_knownActiveIds.has(o.id));
      // One _addNoti call per order so the banner describes the latest
      // event ("RS-2026-0042 from Yuexiu · 5 items") instead of just

          .filter(o => currentDeliveredIds.has(o.id) && !_lastDeliveredIds.has(o.id) && o.created_by !== myId);

          id: o.id, rs_number: o.rs_number,
          store_name: o.store_name, store_cn: o.store_cn,
          item_count: o.item_count || 0,

function _agoBilingual(iso) {
  if (!iso) return '';
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1)   return 'just now · 刚刚';
  if (mins < 60)  return mins + 'm ago · 分钟前';
  if (mins < 1440) { const h = Math.floor(mins/60); return h + 'h ago · ' + h + '小时前'; }
  const d = Math.floor(mins/1440); return d + 'd ago · ' + d + '天前';
}
// Render an ISO/SQLite timestamp in the user's local timezone as
// `YYYY-MM-DD HH:MM`. SQLite stores DATETIME without TZ → treat as UTC.
function _fmtDateTime(iso) {
  if (!iso) return '';
  const s = String(iso).replace(' ', 'T');
  const withZ = /T.*[+\-Z]/.test(s) ? s : s + 'Z';
  const d = new Date(withZ);
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
       + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

      <button class="submit-btn draft" style="width:100%;margin-top:10px" onclick="closeAllOv()">Close · 关闭</button>`;
  }
}
function _renderInboxDetail(order) {
  const overlay = document.getElementById('moreOv');
  const titleEl = overlay.querySelector('.ov-title');
  const body = document.getElementById('moreBody');
  // Title stays generic — the RS number was already shown on the card the
  // user tapped to get here, and is rendered as a chip inside the body.
  if (titleEl) titleEl.textContent = '📦 Order · 订单';
  const items = order.items || [];
  const done = items.filter(i => i.is_checked).length;
  const allDone = items.length > 0 && done === items.length;
  const status = (order.status || '').toLowerCase();
  // Warehouse→kitchen orders are read-only from the warehouse side
  // (kitchen does the prep). Flow ends at 'prepared' — no delivered step
  // and no warehouse confirmation.
  const isKitchenBound = order.to_role === 'kitchen';
  const editable = !isKitchenBound && (status === 'sent' || status === 'received');
  const actionBase = 'flex:2 1 0;min-width:0;font-size:14px;padding:14px 10px;line-height:1.2;white-space:normal';
  let primaryAction = '';
  if (isKitchenBound) {
    // Read-only for warehouse — the kitchen drives this order. No button.
  } else if (status === 'sent' || status === 'received') {
    primaryAction = `<button class="submit-btn" style="${actionBase};background:${allDone?'var(--lime)':'var(--border)'};color:${allDone?'var(--dk)':'var(--muted)'};border:none" ${allDone?'':'disabled'} onclick="_inboxTransition(${order.id}, 'prepared')">✓ Mark Prepared<br><span style="font-weight:700;opacity:.85">已备货</span></button>`;
  } else if (status === 'prepared') {
    // Store→warehouse only: preparer self-confirms delivery to close the loop.
    primaryAction = `<button class="submit-btn" style="${actionBase};background:var(--lime);color:var(--dk);border:none" onclick="_inboxTransition(${order.id}, 'delivered')">✓ Mark Delivered<br><span style="font-weight:700;opacity:.85">已送达</span></button>`;
  }
  // Pipeline stages differ by direction. Kitchen-bound: 3 steps ending
  // at Prepared. Store→warehouse: 3 steps ending at Delivered.
  const pipelineStages = isKitchenBound
    ? [
        { id:'sent',     label:'Sent 已发' },
        { id:'received', label:'Preparing 备货中' },
        { id:'prepared', label:'Prepared 已备好' },
      ]
    : [
        { id:'sent',      label:'Sent 已发' },
        { id:'prepared',  label:'Prepared 已备' },
        { id:'delivered', label:'Delivered 已送' },
      ];
  const stageOrder = pipelineStages.map(s => s.id);
  // Kitchen-bound: 'received' is its own stage. Store→warehouse: 'received'
  // is a transient intermediate that maps to the 'sent' segment visually.
  const effectiveStage = (!isKitchenBound && status === 'received') ? 'sent' : status;
  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:4px 4px 12px;flex-wrap:wrap">
      <span style="font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;font-weight:700;background:rgba(0,0,0,.05);color:var(--dk);padding:3px 9px;border-radius:6px">${esc(order.rs_number || ('#'+order.id))}</span>
      <div style="font-size:12px;color:var(--muted);font-weight:600">${esc(order.store_name || order.store_cn || 'Store · 门店')}</div>
      <span style="font-size:10px;color:var(--muted)">·</span>
      <span style="font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums">Sent · 已发 ${_agoBilingual(order.sent_at || order.created_at)}${_fmtDateTime(order.sent_at || order.created_at) ? ' · 🕒 ' + _fmtDateTime(order.sent_at || order.created_at) : ''}</span>
      <span style="margin-left:auto">${_statusPill(order.status)}</span>
    </div>

    <!-- Pipeline progress visual: 3-segment bar. Stages depend on direction:
         kitchen-bound = sent → received(preparing) → prepared
         store→warehouse = sent → prepared → delivered -->
    <div style="display:flex;gap:3px;margin-bottom:12px">
      ${pipelineStages.map((seg, i) => {
        const reached = stageOrder.indexOf(effectiveStage) >= i;
        return `<div style="flex:1;text-align:center">
          <div style="height:4px;background:${reached?'var(--lime)':'rgba(0,0,0,.08)'};border-radius:99px"></div>
          <div style="font-size:9px;color:${reached?'var(--lime-text)':'var(--muted)'};font-weight:${reached?'800':'600'};margin-top:4px">${seg.label}</div>
        </div>`;
      }).join('')}
    </div>

    ${order.notes ? `<div style="background:rgba(204,217,0,.08);border:1px solid rgba(204,217,0,.3);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--text);line-height:1.5"><strong>📝 Store · 门店:</strong> ${esc(order.notes)}</div>` : ''}

    <div id="inboxItems" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
      ${items.map((it) => {
        const qtyDiff = it.qty_sent != null && +it.qty_sent !== +it.qty_requested;
        return `<div data-iitem-id="${it.id}" style="padding:10px 12px;background:${it.is_checked?'rgba(109,179,63,.08)':'var(--card)'};border:1.5px solid ${it.is_checked?'rgba(109,179,63,.4)':'var(--border)'};border-radius:10px;transition:all .15s">
          <div style="display:flex;align-items:flex-start;gap:10px">
            <input type="checkbox" ${editable ? '' : 'disabled'} ${it.is_checked?'checked':''} onchange="_inboxToggleItem(${order.id}, ${it.id}, this.checked)" style="width:20px;height:20px;accent-color:var(--lime);flex-shrink:0;margin-top:2px;${editable?'':'opacity:.5'}">
            <div style="flex:1;min-width:0;${it.is_checked?'opacity:.55':''}">
              <div style="font-weight:700;font-size:14px;line-height:1.35">${esc(it.product_cn || it.product_name || '?')}${it.product_cn && it.product_name ? ' <span style="color:var(--muted);font-weight:500;font-size:12px">· ' + esc(it.product_name) + '</span>' : ''}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px">${it.sku ? esc(it.sku) + ' · ' : ''}${it.notes ? esc(it.notes) : ''}</div>
            </div>
            <div style="font-weight:800;font-size:15px;color:var(--dk);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;flex-shrink:0">${it.qty_requested}${it.unit?' '+esc(it.unit):''}<div style="font-size:10px;color:var(--muted);font-weight:600">requested · 请求</div></div>
          </div>
          ${editable ? (() => {
            // Effective sent qty: warehouse's explicit pick, or the
            // requested qty as the default. >5 spills over to a manual
            // input, same UX as the restock cart line. The ≠ badge is
            // always rendered (with data-iqty-diff="<itemId>") and toggled
            // instantly by the change handlers — no re-render needed.
            const effective = it.qty_sent != null ? +it.qty_sent : +it.qty_requested;
            const isOther = effective > 5;
            return `
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.06)">
            <span style="font-size:11px;color:var(--muted);font-weight:600;flex-shrink:0">Sent qty · 实发:</span>
            <select class="qty-select" data-iqty-req="${it.qty_requested}" style="height:38px;font-size:14px" onchange="_inboxOnQtySelChange(${order.id}, ${it.id}, this)">
              <option value="0"     ${effective===0?'selected':''}>—</option>
              <option value="1"     ${effective===1?'selected':''}>1</option>
              <option value="2"     ${effective===2?'selected':''}>2</option>
              <option value="3"     ${effective===3?'selected':''}>3</option>
              <option value="4"     ${effective===4?'selected':''}>4</option>
              <option value="5"     ${effective===5?'selected':''}>5</option>
              <option value="other" ${isOther?'selected':''}>Other 其他…</option>
            </select>
            <input class="qty-input-manual" data-iqty-other="${it.id}" data-iqty-req="${it.qty_requested}" type="number" min="6" step="1" inputmode="numeric"
                   value="${isOther?effective:''}" placeholder="qty"
                   oninput="_inboxOnQtyManualInput(${order.id}, ${it.id}, this.value)"
                   style="display:${isOther?'inline-block':'none'};height:38px;width:72px;font-size:14px">
            <span data-iqty-diff="${it.id}" style="font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(224,123,80,.15);color:#a04a25;flex-shrink:0;display:${qtyDiff?'inline-block':'none'}">≠</span>
          </div>`;
          })() : (it.qty_sent != null && +it.qty_sent !== +it.qty_requested ? `
          <div style="margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.06);font-size:11px;color:var(--muted)">Sent · 实发: <strong style="color:var(--dk)">${it.qty_sent}${it.unit?' '+esc(it.unit):''}</strong></div>` : '')}
        </div>`;
      }).join('')}
    </div>

    ${editable ? `
      <div style="margin-bottom:12px">
        <div style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Warehouse notes · 仓库备注</div>
        <textarea id="whNotesInput" oninput="_inboxSetWhNotes(${order.id}, this.value)" placeholder="Optional notes back to the store · 可选备注" rows="2" style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;background:#fff;resize:vertical">${esc(order.wh_notes || '')}</textarea>
      </div>` : (order.wh_notes ? `
      <div style="background:rgba(37,99,235,.06);border:1px solid rgba(37,99,235,.25);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--text);line-height:1.5"><strong>🏭 Warehouse · 仓库:</strong> ${esc(order.wh_notes)}</div>` : '')}

    <div style="display:flex;gap:8px;align-items:stretch">
      <button class="submit-btn draft" style="flex:1 1 0;min-width:0;font-size:13px;padding:14px 8px" onclick="closeAllOv()">Close · 关闭</button>
      ${primaryAction}

}

let _whNotesTimer = null;
function _inboxSetWhNotes(orderId, val) {
  // Debounce — 500ms after typing stops we PUT the order's wh_notes.
  if (_whNotesTimer) clearTimeout(_whNotesTimer);
  _whNotesTimer = setTimeout(async () => {
    try {
      await fetch('/api/restock/' + orderId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wh_notes: val }),
      });
    } catch {}
  }, 500);
}

let _qtySentTimer = null;
function _inboxSetQtySent(orderId, itemId, val) {
  if (_qtySentTimer) clearTimeout(_qtySentTimer);
  _qtySentTimer = setTimeout(async () => {
    try {
      await fetch('/api/restock/' + orderId + '/item/' + itemId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qty_sent: val === '' ? null : parseFloat(val) }),
      });
    } catch {}
  }, 400);
}

// Sent-qty dropdown handler — picks 0–5 commit immediately; "Other"
// reveals a small manual input next to the select for any value > 5.
// The ≠ badge is shown/hidden inline as the value changes so the user
// gets instant feedback (no waiting for a re-render or server round-trip).
function _inboxOnQtySelChange(orderId, itemId, sel) {
  const v = sel.value;
  const requested = parseFloat(sel.dataset.iqtyReq) || 0;
  const manualEl = sel.parentElement.querySelector(`[data-iqty-other="${itemId}"]`);
  let effective;
  if (v === 'other') {
    if (manualEl) {
      manualEl.style.display = 'inline-block';
      if (!manualEl.value || +manualEl.value < 6) manualEl.value = '6';
      manualEl.focus();
      effective = parseFloat(manualEl.value) || 0;
    } else {
      effective = 0;
    }
    _inboxSetQtySent(orderId, itemId, effective);
  } else {
    if (manualEl) manualEl.style.display = 'none';
    effective = parseFloat(v) || 0;
    _inboxSetQtySent(orderId, itemId, effective);
  }
  _toggleQtyDiffBadge(itemId, effective, requested);
}
function _inboxOnQtyManualInput(orderId, itemId, val) {
  _inboxSetQtySent(orderId, itemId, val);
  // Look up the requested qty from the manual input's own data attribute
  // and flip the ≠ badge instantly.
  const inp = document.querySelector(`[data-iqty-other="${itemId}"]`);
  if (inp) {
    const requested = parseFloat(inp.dataset.iqtyReq) || 0;
    _toggleQtyDiffBadge(itemId, parseFloat(val) || 0, requested);
  }
}
function _toggleQtyDiffBadge(itemId, sent, requested) {
  const badge = document.querySelector(`[data-iqty-diff="${itemId}"]`);
  if (!badge) return;
  badge.style.display = (+sent === +requested) ? 'none' : 'inline-block';
}

async function _inboxTransition(orderId, toStatus) {
  if (_inboxBusy) return;
  const labelMap = {
    // 'received' kept for legacy compatibility — UI no longer triggers
    // it but a server-side flow could.
    received:  ['Start preparing this order? · 开始备货?',         '▶ Started · 已开始'],
    prepared:  ['Mark this order as prepared? · 标记为已备货?',     '✓ Prepared · 已备货'],
    delivered: ['Send this order on its way to the store? · 标记为在途?', '🚚 On the way · 在途中'],
  };
  const [confirmMsg, successMsg] = labelMap[toStatus] || ['Update status?', '✓ Updated'];
  if (!confirm(confirmMsg)) return;
  _inboxBusy = true;
  try {
    const r = await fetch('/api/restock/' + orderId + '/status', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: toStatus }),
    });
    const d = await r.json();
    if (!d?.success) throw new Error(d?.error || 'failed');
    toast(successMsg, 'success');
    beep('done');
    closeAllOv();
    _renderInbox();
    // Refresh the banner stack so the just-prepared order appears in the
    // "Awaiting store" banner immediately (and the just-delivered one
    // drops out of "Ready to receive"). Silent so we don't re-toast.
    refreshPendingDeliveries({ silent: true }).then(() => {
      if (_appMode === 'restock') render();
    });
  } catch (e) {
    toast('Failed: ' + (e.message || ''), 'error');
  } finally { _inboxBusy = false; }
}
async function _inboxToggleItem(orderId, itemId, checked) {
  try {
    await fetch('/api/restock/' + orderId + '/item/' + itemId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ is_checked: checked ? 1 : 0 }),
    });
    // Re-fetch order detail so the modal + progress bar stay in sync.
    const r = await fetch('/api/restock/' + orderId);
    const d = await r.json();
    if (d?.success) _renderInboxDetail(d.data);
  } catch (e) {
    toast('Save failed · 保存失败', 'error');
  }
}

function _renderWaste() {
  const body = document.getElementById('body');
  body.classList.add('tappable');
  if (!_wasteCart.length) {
    body.innerHTML = `
      <div class="empty">
        <div class="icon">🗑</div>
        <div class="hint">Empty · 暂无</div>
      </div>
      <button id="wasteEmptyAdd" class="add-item-btn">
        <span class="plus">＋</span>
        <span>Add Item · 添加商品</span>
      </button>`;
    const emptyAdd = document.getElementById('wasteEmptyAdd');
    if (emptyAdd) emptyAdd.addEventListener('click', (e) => { e.stopPropagation(); openSearch(); });
    _renderWasteFooter();
    return;
  }
  body.innerHTML = _wasteCart.map((l, i) => _renderWasteLine(l, i)).join('') + `
    <button id="wasteAddMore" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--bg);border:2px dashed var(--lime);color:var(--lime);font-weight:800;font-size:15px;padding:18px;margin-top:12px;cursor:pointer;border-radius:14px">
      <span style="font-size:22px;line-height:1">＋</span>
      <span>Add Item · 添加商品</span>
    </button>`;
  const addMore = document.getElementById('wasteAddMore');
  if (addMore) addMore.addEventListener('click', (e) => { e.stopPropagation(); openSearch(); });
  // Wire remove
  body.querySelectorAll('[data-wact="rm"]').forEach(el => {
    el.addEventListener('click', () => _wasteRemove(+el.dataset.i));
  });
  // Wire qty dropdown — same pattern as restock: 0–5 directly, "other"
  // reveals a manual input next to it.
  body.querySelectorAll('[data-wqty-sel]').forEach(sel => {
    sel.addEventListener('change', () => {
      const i = +sel.dataset.wqtySel;
      const v = sel.value;
      const otherInp = body.querySelector(`[data-wqty-other="${i}"]`);
      if (v === 'other') {
        if (otherInp) {
          otherInp.style.display = 'inline-block';
          if (!otherInp.value || +otherInp.value < 6) otherInp.value = '6';
          _wasteCart[i].qty = parseFloat(otherInp.value) || 6;
          otherInp.focus();
        }
      } else {
        if (otherInp) otherInp.style.display = 'none';
        _wasteCart[i].qty = parseFloat(v) || 0;
      }
      _renderWasteFooter();
    });
  });
  body.querySelectorAll('[data-wqty-other]').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = +inp.dataset.wqtyOther;
      _wasteCart[i].qty = parseFloat(inp.value) || 0;
      _renderWasteFooter();
    });
  });
  // Reason
  body.querySelectorAll('[data-wreason]').forEach(sel => {
    sel.addEventListener('change', () => {
      const i = +sel.dataset.wreason;
      _wasteCart[i].reason = sel.value;
    });
  });
  // Notes
  body.querySelectorAll('[data-wnote]').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = +inp.dataset.wnote;
      _wasteCart[i].notes = inp.value;
    });
  });
  _renderWasteFooter();
}
function _renderWasteFooter() {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const total = _wasteCart.reduce((s, l) => s + ((parseFloat(l.qty)||0) * (parseFloat(l.product?.sell_price)||0)), 0);
  const count = _wasteCart.filter(l => parseFloat(l.qty) > 0).length;
  foot.innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;padding:0 4px">
      <div style="flex:1">
        <div style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase">Est. retail loss · 估计零售损失</div>
        <div style="font-size:20px;font-weight:900;color:var(--danger);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px">¥${total.toFixed(2)}</div>
      </div>
      <button id="wasteSubmitBtn" class="submit-btn danger" ${count===0?'disabled':''} onclick="submitWaste()">🗑 Log Waste · 记录损耗 (${count})</button>
    </div>`;
}
async function submitWaste() {
  const valid = _wasteCart.filter(l => parseFloat(l.qty) > 0 && l.product?.id);
  if (!valid.length) return;
  const btn = document.getElementById('wasteSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving… · 保存中…'; }
  const today = new Date().toISOString().slice(0,10);
  const failed = [];
  // POST one entry per cart line — the API takes a single product per call.
  for (const l of valid) {
    try {
      const r = await fetch('/api/waste', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          date: today, product_id: l.product.id, qty: parseFloat(l.qty),
          reason: l.reason || 'expired', notes: l.notes || null,
          unit: l.product.unit || 'pcs',
          staff_name: _user?.displayName || _user?.username || null,
        }),
      });
      const d = await r.json();
      if (!d?.success) failed.push({ name: l.product.name_en || l.product.name_cn, err: d?.error || 'failed' });
    } catch (e) {
      failed.push({ name: l.product.name_en || l.product.name_cn, err: e.message || 'network' });
    }
  }
  if (failed.length) {
    toast(`✕ ${failed.length} failed · 失败: ${failed[0].name}`, 'error');
    beep('error');
    _renderWasteFooter();
    return;
  }
  toast(`✓ ${valid.length} waste entries logged · 已记录 ${valid.length} 条损耗`, 'success');
  beep('done');
  _wasteCart = [];
  _renderWaste();
}

// ─── Barcode ───────────────────────────────────────────────────────
async function lookupAndAddByBarcode(code) {
  try {
    const r = await fetch('/api/products/by-barcode/' + encodeURIComponent(code));
    if (r.status === 404) {
      // Fallback: try matching as SKU.
      const p = _products.find(x => (x.sku || '').toLowerCase() === code.toLowerCase());
      if (p) { addToCart(p); return; }
      toast('Not found · 未识别: ' + code, 'error'); beep('error');
      return;
    }
    if (!r.ok) { toast('Lookup failed · 查询失败', 'error'); return; }
    const d = await r.json();
    if (d?.data) addToCart(d.data);
  } catch { toast('Network error · 网络错误', 'error'); }
}

// ─── Search overlay ────────────────────────────────────────────────
function openSearch() {
  document.getElementById('ovBackdrop').classList.add('visible');
  document.getElementById('searchOv').classList.add('visible');
  _ovKeyboardWatch(true);
  setTimeout(() => {
    const inp = document.getElementById('searchInput');
    inp.value = ''; inp.focus();
    onSearchInput();
  }, 50);
  // Refresh the catalog in the background — restock is a long-lived PWA
  // and admins may add new products (e.g. salad dressings) from another
  // tab. Without this, _products stays frozen at the moment the page
  // first mounted, and freshly-added items don't show up in search.
  _refreshProductsBg();
}

async function _refreshProductsBg() {
  try {
    const r = await fetch('/api/products', { cache: 'no-store' });
    const d = await r.json();
    if (d?.success && Array.isArray(d.data)) {
      _products = d.data.filter(p => p.status === 'Active');
      // If the search overlay is open and the user has already typed,
      // re-run with the new catalog so they immediately see new rows.
      if (document.getElementById('searchOv')?.classList.contains('visible')) {
        onSearchInput();
      }
    }
  } catch {}
}
let _searchTimer = null;
function onSearchInput() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (_searchTimer) clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => doSearch(q), 100);
}
function doSearch(q) {
  const list = document.getElementById('searchList');
  let rows;
  if (!q) {
    // Empty query → show alphabetical product list (capped).
    rows = _products.slice().sort((a, b) =>
      (a.name_cn || a.name_en || '').localeCompare(b.name_cn || b.name_en || ''))
      .slice(0, 50);
  } else {
    rows = _products.filter(p =>
      (p.name_en || '').toLowerCase().includes(q) ||
      (p.name_cn || '').includes(q) ||

function openVoice() {

function setVoiceLang(lang) {
  _voiceLang = lang;
  const en = document.getElementById('voiceLangEN');
  const cn = document.getElementById('voiceLangCN');
  if (lang === 'en-US') {
    en.style.background = 'var(--dk)'; en.style.color = 'var(--lime)';
    cn.style.background = 'transparent'; cn.style.color = 'var(--muted)';
  } else {
    cn.style.background = 'var(--dk)'; cn.style.color = 'var(--lime)';
    en.style.background = 'transparent'; en.style.color = 'var(--muted)';
  }
}
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const status = document.getElementById('voiceStatus');
  // Pre-flight 1: API present at all? Older Safari has none.
  if (!SR) {
    status.style.color = 'var(--danger)';
    status.innerHTML = '⚠ Voice not supported in this browser · 浏览器不支持语音<br><span style="opacity:.7">Use Chrome on Android/desktop · 请使用 Chrome</span>';
    return;
  }
  // Pre-flight 2: secure context. Browsers block SpeechRecognition on
  // plain http:// for non-localhost origins. Without HTTPS this fails
  // silently or with a vague "not-allowed" — show a clear message.
  if (!window.isSecureContext) {
    status.style.color = 'var(--danger)';
    status.innerHTML = '⚠ Voice needs HTTPS · 浏览器要求 HTTPS<br><span style="opacity:.7">Currently on plain http:// — voice/mic disabled by Chrome</span>';
    return;
  }
  if (_voiceRec) { _voiceRec.stop(); _voiceRec = null; return; }
  let rec;
  try { rec = new SR(); }
  catch (e) {
    status.style.color = 'var(--danger)';
    status.textContent = '⚠ Could not start voice: ' + (e.message || e);
    return;
  }
  rec.lang = _voiceLang;
  rec.continuous = true; rec.interimResults = true;
  let finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t + ' ';
      else interim += t;
    }
    _voiceTranscript = (finalText + interim).trim();
    document.getElementById('voiceTranscript').textContent = _voiceTranscript || '—';
    document.getElementById('voiceApplyBtn').disabled = !_voiceTranscript;
  };
  rec.onerror = (e) => {
    let msg = e.error || 'recognition error';
    if (msg === 'not-allowed' || msg === 'service-not-allowed')
      msg = 'Microphone permission denied · 麦克风权限被拒绝 — allow in Chrome settings';
    else if (msg === 'no-speech')
      msg = 'No speech detected · 未检测到语音';
    else if (msg === 'audio-capture')
      msg = 'No microphone found · 未找到麦克风';
    else if (msg === 'network')
      msg = 'Network error — speech recognition needs internet · 需要联网';
    status.style.color = 'var(--danger)';
    status.textContent = '⚠ ' + msg;
    document.getElementById('voiceMicBtn').classList.remove('listening');
    document.getElementById('voiceMicBtn').textContent = '🎤';
    _voiceRec = null;
  };
  rec.onend = () => {
    document.getElementById('voiceMicBtn').classList.remove('listening');
    document.getElementById('voiceMicBtn').textContent = '🎤';
    _voiceRec = null;
  };
  try {
    rec.start();
  } catch (e) {
    status.style.color = 'var(--danger)';
    status.textContent = '⚠ Could not start: ' + (e.message || e);
    return;
  }
  _voiceRec = rec;
  document.getElementById('voiceMicBtn').classList.add('listening');
  document.getElementById('voiceMicBtn').textContent = '⏸';
  status.style.color = 'var(--muted)';
  status.textContent = _voiceLang === 'en-US' ? 'Listening… tap to stop' : '聆听中…点击停止';
}
function parseTranscript(t) {
  if (!t) return [];
  const cnNum = { '一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
  const chunks = t.split(/,|，|;|；|、|\band\b|\s和\s|\s+和\s+|  +/i).map(s => s.trim()).filter(Boolean);
  const out = [];
  for (const chunk of chunks) {
    let qty = 1, body = chunk;
    let m = chunk.match(/^(.*?)[\s]+(\d{1,3})$/);
    if (m) { body = m[1].trim(); qty = parseInt(m[2], 10); }
    else {
      m = chunk.match(/^(.*?)([一二两三四五六七八九十]+)$/);
      if (m) {
        body = m[1].trim();
        const seq = m[2];
        if (seq === '十') qty = 10;
        else if (seq.startsWith('十')) qty = 10 + (cnNum[seq.slice(1)] || 0);
        else if (seq.endsWith('十'))   qty = (cnNum[seq.slice(0,1)] || 1) * 10;
        else if (seq.includes('十'))   qty = (cnNum[seq.split('十')[0]] || 1) * 10 + (cnNum[seq.split('十')[1]] || 0);
        else                           qty = cnNum[seq] || 1;
      }
    }
    if (qty < 1) qty = 1; if (qty > 99) qty = 99;
    if (body) out.push({ raw: chunk, body, qty });
  }
  return out;
}
function matchProduct(body) {
  const t = body.trim().toLowerCase();
  if (!t) return null;
  const tPlain = t.replace(/[-\s_]/g, '');
  for (const p of _products) {
    const sku = (p.sku || '').toLowerCase();
    if (!sku) continue;
    if (sku === t || sku.replace(/[-\s_]/g, '') === tPlain) return p;
  }
  for (const p of _products) {
    if ((p.name_en || '').toLowerCase() === t) return p;
    if ((p.name_cn || '').toLowerCase() === t) return p;
  }
  let best = null, bestLen = 0;
  for (const p of _products) {
    const en = (p.name_en || '').toLowerCase();
    const cn = (p.name_cn || '').toLowerCase();
    if (en.includes(t) && en.length > bestLen)      { best = p; bestLen = en.length; }
    else if (cn.includes(t) && cn.length > bestLen) { best = p; bestLen = cn.length; }
  }
  return best;
}
function parseAndApplyVoice() {
  const parsed = parseTranscript(_voiceTranscript);
  const matched = [], review = [];
  for (const item of parsed) {
    const p = matchProduct(item.body);
    if (p) matched.push({ ...item, product: p });
    else   review.push(item);
  }
  for (const m of matched) {
    const existing = _cart.find(c => c.product.id === m.product.id);
    if (existing) existing.qty = (parseFloat(existing.qty) || 0) + m.qty;
    else _cart.push({ product: m.product, qty: m.qty, notes: '' });
  }
  document.getElementById('voicePreview').innerHTML = `
    ${matched.length ? `

        ${matched.map(m => `<div style="font-size:13px;line-height:1.6">

    ${review.length ? `

        <div style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--danger);margin-bottom:6px">⚠ Needs review · 需要确认 (${review.length})</div>
