<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>tacet · Brand · 品牌</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#FBF9F4" />
<link rel="icon" href="/tacet-favicon.svg" />

<script>
  (function(){ try {
    var t = localStorage.getItem('retail-admin-theme');
    document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'light');
    var l = localStorage.getItem('roots-admin-lang');
    document.documentElement.setAttribute('data-lang', (l === 'cn') ? 'cn' : 'en');
  } catch (e) { document.documentElement.setAttribute('data-theme','light'); } })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#111A2B; --paper:#FBF9F4; --graphite:#58606E;
    --dusk:#6E67AF; --dusk-hi:#5F58A0; --sage:#A3B49F; --amber:#C9954A; --brick:#B4533E;
    --cream:#F6F3EC; --border:#E4E0D5;
    --surface:#FFFFFF; --raised:var(--cream);
    --text:var(--ink); --text-2:var(--graphite); --text-4:#B0AEA6; --line:var(--border);
    --dusk-tint:#EEEDF6; --sage-tint:#EDF1EC; --amber-tint:#F7EEDE; --amber-ink:#8A6425; --sage-ink:#4A6249;
    --font:"Inter","Noto Sans SC",-apple-system,Arial,sans-serif;
    --display:"Fraunces",Georgia,serif;
    --ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 1px 2px rgba(17,26,43,.04),0 4px 16px rgba(17,26,43,.04);
  }
  [data-theme="dark"]{
    --surface:#18233A; --raised:#1E2A44; --border:#2A3550;
    --text:#FBF9F4; --text-2:#9AA3B2; --text-4:#5B6478; --line:#2A3550;
    --paper:#111A2B; --cream:#1E2A44;
    --dusk-tint:#262A4A; --sage-tint:#1E2C26; --amber-tint:#33290F; --amber-ink:#D0A867; --sage-ink:#9DB39A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--text); font-family:var(--font); font-size:15px;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; align-items:center; min-height:100%;
    padding:30px 20px 64px; transition:background .25s var(--ease), color .25s var(--ease); }
  html[data-lang=en] .cn, html[data-lang=en] .sep{display:none;}
  html[data-lang=cn] .en, html[data-lang=cn] .sep{display:none;}

  .shell{width:100%; max-width:460px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 24px;}
  .back{font-size:13px; color:var(--text-2); text-decoration:none; display:inline-flex; align-items:center; gap:7px; transition:color .15s;}
  .back:hover{color:var(--text);} .back svg{stroke:currentColor; fill:none;}
  .topbar-r{display:flex; align-items:center; gap:6px;}
  .icobtn{cursor:pointer; border:none; background:transparent; color:var(--text-2); padding:6px; border-radius:8px; line-height:0; transition:color .15s, background .15s;}
  .icobtn:hover{color:var(--text); background:var(--raised);} .icobtn svg{stroke:currentColor; fill:none;}
  .langtoggle{cursor:pointer; border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:500; color:var(--text-2); padding:6px 8px; border-radius:8px; transition:color .15s, background .15s;}
  .langtoggle:hover{color:var(--text); background:var(--raised);}

  .head{margin:0 2px 20px;}
  .head .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dusk); font-weight:500; margin-bottom:9px;}
  .head h1{font-family:var(--display); font-weight:300; font-size:28px; line-height:1.15; margin:0 0 8px;}
  .head p{color:var(--text-2); font-size:13.5px; line-height:1.6; margin:0;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px 24px 26px; box-shadow:var(--shadow); animation:settle .5s var(--ease) both;}
  @keyframes settle{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  .avatarrow{display:flex; align-items:center; gap:16px; margin:2px 0 4px;}
  #brandLogoPrev{height:44px; max-width:180px; object-fit:contain; display:none;}
  .avatar-actions{display:flex; flex-wrap:wrap; gap:9px;}
  .btn-sec{flex:none; cursor:pointer; white-space:nowrap; position:relative; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:0 16px; height:40px; display:inline-flex; align-items:center; justify-content:center; gap:7px; font-family:inherit; font-size:13.5px; font-weight:500; --spin-track:var(--line); --spin-head:var(--text-2); transition:border-color .15s, color .15s, background .15s;}
  .btn-sec:hover{border-color:var(--text-2);} .btn-sec:disabled{cursor:default; opacity:.55;}

  .flabel{display:block; font-size:13px; font-weight:500; color:var(--text); margin:18px 0 8px;}
  .nameedit{display:flex; gap:9px; align-items:stretch;}
  .nameedit input{flex:1; min-width:0; background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:11px 13px; font-size:15px; font-family:inherit; transition:border-color .16s;}
  .nameedit input:hover{border-color:var(--text-2);} .nameedit input:focus{outline:none; border-color:var(--dusk);}

  .rohint{display:flex; align-items:flex-start; gap:7px; margin:16px 2px 0; font-size:11.5px; color:var(--text-2); line-height:1.5;}
  .rohint svg{flex:none; stroke:var(--text-4); fill:none; margin-top:1px;}

  .msg{display:none; align-items:center; gap:8px; font-size:12.5px; line-height:1.4; border-radius:8px; padding:10px 12px; margin-top:12px;}
  .msg.show{display:flex;}
  .msg.ok{color:var(--sage-ink); background:var(--sage-tint); border:1px solid var(--sage);}
  .msg.err{color:var(--brick); background:var(--brick-tint); border:1px solid var(--brick);}
  .msg::before{content:""; width:6px; height:6px; border-radius:50%; flex:none; background:currentColor; opacity:.7;}

  .loading{color:transparent !important; pointer-events:none;}
  .loading::after{content:""; position:absolute; top:50%; left:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border:2px solid var(--spin-track); border-top-color:var(--spin-head); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a class="back" href="/retail-admin"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M8.5 3 4.5 7l4 4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="en">Backend</span><span class="cn">后台</span></a>
      <div class="topbar-r">
        <button type="button" id="themeToggle" class="icobtn" aria-label="Theme">
          <svg width="17" height="17" viewBox="0 0 20 20" id="themeIcon"><circle cx="10" cy="10" r="4.2" stroke-width="1.4"/><path d="M10 1.5v2.2M10 16.3v2.2M18.5 10h-2.2M3.7 10H1.5M16 4l-1.6 1.6M5.6 14.4 4 16M16 16l-1.6-1.6M5.6 5.6 4 4" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="langToggle" class="langtoggle">中文</button>
      </div>
    </div>

    <header class="head">
      <div class="eyebrow"><span class="en">Set up</span><span class="cn">设置</span></div>
      <h1><span class="en">Brand</span><span class="cn">品牌</span></h1>
      <p><span class="en">Your logo and name lead the admin, sign-in page and customer emails. Everything else keeps the tacet look.</span><span class="cn">您的徽标与名称将展示在后台、登录页与顾客邮件上。其余部分保持 tacet 外观。</span></p>
    </header>

    <section class="card">
      <div class="avatarrow">
        <img id="brandLogoPrev" alt="" />
        <div class="avatar-actions">
          <button type="button" id="brandPick" class="btn-sec"><span class="en">Upload logo</span><span class="cn">上传徽标</span></button>
          <button type="button" id="brandClear" class="btn-sec" hidden><span class="en">Remove</span><span class="cn">移除</span></button>
          <input type="file" id="brandFile" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />
        </div>
      </div>
      <div class="msg" id="brandMsg" role="status"><span></span></div>

      <form id="brandNameForm" novalidate>
        <label class="flabel" for="brandNameInput"><span class="en">Brand name</span><span class="cn">品牌名称</span></label>
        <div class="nameedit">
          <input id="brandNameInput" type="text" spellcheck="false" maxlength="60" placeholder="Your brand" />
          <button type="submit" id="brandNameBtn" class="btn-sec"><span class="en">Save</span><span class="cn">保存</span></button>
        </div>
        <div class="msg" id="brandNameMsg" role="status"><span></span></div>
      </form>
    </section>
  </main>

<script>
  /* Brand (co-brand identity) controller — moved here from the profile page so
     the personal profile stays personal. GET/PUT /api/backend/brand (owner/admin
     only; the API enforces the role). */
  (function () {
    var LANG_KEY = 'roots-admin-lang', THEME_KEY = 'retail-admin-theme';
    var lang = document.documentElement.getAttribute('data-lang') === 'cn' ? 'cn' : 'en';
    function L(en, cn){ return lang === 'cn' ? cn : en; }
    var $ = function(id){ return document.getElementById(id); };
    function setMsg(el, kind, text){ el.classList.remove('ok','err','show'); el.querySelector('span').textContent = text || ''; if (kind) el.classList.add(kind,'show'); }

    function renderPrev(url){
      if (url) { $('brandLogoPrev').src = url; $('brandLogoPrev').style.display = 'block'; $('brandClear').hidden = false; }
      else { $('brandLogoPrev').removeAttribute('src'); $('brandLogoPrev').style.display = 'none'; $('brandClear').hidden = true; }
    }
    fetch('/api/backend/brand', { credentials:'same-origin' })
      .then(function(r){ if (r.status === 401) { location.replace('/backend/login'); return null; } return r.json(); })
      .then(function(j){ if (!j || !j.brand) return; if (document.activeElement !== $('brandNameInput')) $('brandNameInput').value = j.brand.name || ''; renderPrev(j.brand.brandLogoUrl || null); })
      .catch(function(){});

    function saveBrand(payload, okMsg){
      $('brandPick').disabled = true; $('brandPick').classList.add('loading'); setMsg($('brandMsg'), null, '');
      return fetch('/api/backend/brand', { method:'PUT', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify(payload) })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok:r.ok, data:d }; }); })
        .then(function(res){
          $('brandPick').disabled = false; $('brandPick').classList.remove('loading');
          if (res.ok && res.data && res.data.success) { renderPrev((res.data.brand && res.data.brand.brandLogoUrl) || null); setMsg($('brandMsg'), 'ok', okMsg); return true; }
          setMsg($('brandMsg'), 'err', (res.data && res.data.error) || L('Couldn’t save — please try again','保存失败，请重试')); return false;
        })
        .catch(function(){ $('brandPick').disabled = false; $('brandPick').classList.remove('loading'); setMsg($('brandMsg'), 'err', L('Network error — please try again','网络错误，请重试')); return false; });
    }
    $('brandPick').addEventListener('click', function(){ $('brandFile').click(); });
    $('brandClear').addEventListener('click', function(){ saveBrand({ logo:null }, L('Logo removed','徽标已移除')); });
    $('brandFile').addEventListener('change', function(){
      var file = $('brandFile').files && $('brandFile').files[0]; $('brandFile').value = '';
      if (!file) return;
      if (!/^image\//.test(file.type)) { setMsg($('brandMsg'), 'err', L('Please choose an image file','请选择图片文件')); return; }
      if (/svg/.test(file.type)) {
        var rs = new FileReader();
        rs.onload = function(){ saveBrand({ logo:rs.result }, L('Logo updated','徽标已更新')); };
        rs.onerror = function(){ setMsg($('brandMsg'), 'err', L('Couldn’t read that file','无法读取该文件')); };
        rs.readAsDataURL(file); return;
      }
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var MAX = 512, scale = Math.min(1, MAX / Math.max(img.width, img.height));
          var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          var canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          saveBrand({ logo:canvas.toDataURL('image/png') }, L('Logo updated','徽标已更新'));
        };
        img.onerror = function(){ setMsg($('brandMsg'), 'err', L('Couldn’t read that image','无法读取该图片')); };
        img.src = reader.result;
      };
      reader.onerror = function(){ setMsg($('brandMsg'), 'err', L('Couldn’t read that file','无法读取该文件')); };
      reader.readAsDataURL(file);
    });
    $('brandNameForm').addEventListener('submit', function(e){
      e.preventDefault(); $('brandNameBtn').disabled = true; $('brandNameBtn').classList.add('loading');
      saveBrand({ name:$('brandNameInput').value.trim() }, L('Saved','已保存')).then(function(){ $('brandNameBtn').disabled = false; $('brandNameBtn').classList.remove('loading'); });
    });

    /* theme + language */
    function applyTheme(){
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#111A2B' : '#FBF9F4');
      var ico = $('themeIcon');
      if (ico) ico.innerHTML = t === 'dark'
        ? '<path d="M16 11.5A6.5 6.5 0 1 1 8.5 4a5 5 0 0 0 7.5 7.5Z" stroke-width="1.4" stroke-linejoin="round"/>'
        : '<circle cx="10" cy="10" r="4.2" stroke-width="1.4"/><path d="M10 1.5v2.2M10 16.3v2.2M18.5 10h-2.2M3.7 10H1.5M16 4l-1.6 1.6M5.6 14.4 4 16M16 16l-1.6-1.6M5.6 5.6 4 4" stroke-width="1.4" stroke-linecap="round"/>';
    }
    $('themeToggle').addEventListener('click', function(){
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
      applyTheme();
    });
    function applyLang(){
      document.documentElement.setAttribute('data-lang', lang);
      var tg = $('langToggle'); if (tg) tg.textContent = lang === 'cn' ? 'EN' : '中文';
      $('brandNameInput').placeholder = L('Your brand','您的品牌');
    }
    $('langToggle').addEventListener('click', function(){
      lang = lang === 'cn' ? 'en' : 'cn';
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
    });
    applyTheme(); applyLang();
  })();
</script>
</body>
</html>
