<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">

<!-- ANDROID / CHROME reads the manifest: name, icons, standalone display and
     the landscape lock all come from there. -->
<link rel="manifest" href="/till-manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS / SAFARI ignores nearly all of that and reads these. Safari is also
     the ONLY iOS browser that can install a PWA — Chrome on iOS cannot — so
     Add to Home Screen from Safari is the whole install path on an iPad.
     apple-mobile-web-app-capable is what makes it open standalone rather than
     as a Safari tab. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Counter">
<!-- "default", not "black-translucent": the till runs LIGHT. Translucent puts
     white status text over the page, which on #FBF9F4 paper is an invisible
     clock and battery. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Without an apple-touch-icon iOS puts a SCREENSHOT of the page on the home
     screen. 180x180 is the largest size iOS asks for; iPadOS wants 152 (iPad)
     and 167 (iPad Pro) and downsamples this one for both, which is why a single
     180 is sufficient and why it must not be smaller than 180. Note iOS does
     not accept SVG here — the manifest's raster icons are shared deliberately. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<meta name="theme-color" content="#FBF9F4">
<title>Counter</title>
<!-- ── Web fonts, loaded so a blocked host costs nothing (audit D-09) ───────
     This service's only live merchant trades in mainland China, where this font
     host is unreachable. As blocking <link rel="stylesheet"> tags these cost
     every page load a connection timeout before first paint, on the one network
     that matters most.
     media="print" + onload makes the request non-blocking: the page paints
     immediately in the fallback stack (which every --f-* variable already
     names), and the web faces swap in if and when they arrive. `display=swap`
     was already set, so text was never going to be invisible — only late.
     The <noscript> copy keeps the fonts for a scripting-disabled browser, where
     the onload trick cannot run.
     The preconnect hints are gone with them: a warmed connection to a host that
     does not answer is a wasted one.
     THE REAL FIX is to serve these faces from the application, as the brand
     display fonts in /assets/fonts already are. That needs the files, which is
     a deliberate step and not this change. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
/* ==========================================================================
   COUNTER TILL — the cashier-facing screen on a shop tablet.

   Device: a shop tablet in landscape, touch only — no mouse and no keyboard
   beyond the on-screen one. Every target here is >= 44px; the working ones are
   52-76px.

   BOTH PLATFORMS, because Tacet does not get to dictate a customer's hardware.
   The two install paths are separate and neither substitutes for the other:
   Android Chrome installs from /till-manifest.webmanifest, iOS Safari reads the
   apple-* meta tags in the head and ignores most of the manifest. The two
   aspect ratios differ too — iPad is 4:3 (1024x768 CSS landscape), most Android
   tablets are 16:10 (1280x800) — so the layout is tested at both rather than at
   one. See the breakpoint note on .t-body.

   WHAT THIS IS NOT. It is not the removed /pos shell (deleted 2026-08-04,
   388c7e57) and it is not a second order path. It writes counter sales through
   the ordinary manual-order endpoint, POST /api/retail-admin/orders, with
   fulfillment_type 'counter' — the same path whose stock decrement and
   store_id rule landed in d0e21fe0. There is one path and this uses it.

   PAYMENT IS MANUAL, DELIBERATELY. Production has no Alipay credentials, so a
   one-QR settle cannot work — and the two wallets' payment codes are mutually
   unreadable anyway, so one QR could never have served both. The cashier reads
   the total aloud, keys it into a separate terminal, records WHICH wallet took
   it, and confirms. Legibility of that number is the whole job of the settle
   screen. See SETTLE_MODES: a scan mode slots in beside the manual one without
   touching anything else, and manual stays permanently as the fallback.

   COLOUR is the live --td-* block, copied verbatim from retail-admin.css
   (:8205-8254) — dark first, exactly as live, with light as the opt-in
   override. The till runs light: a counter is a bright room.

   TYPE is Inter, 400/500 only. No monospace exists in Tacet; money and
   quantities are Inter with tabular-nums.

   LANGUAGE: one at a time, never glued. cuT(en, cn) picks one, and every CN
   half is COPIED from a locked source — the live admin's own pairs or
   docs/tacet-delivery-vocabulary.md. Nothing here is composed. See STRINGS.
   ========================================================================== */

:root {
  /* verbatim, retail-admin.css :8205-8237 — dark, the cascade default */
  --td-surface:#18233A; --td-raised:#1E2A44; --td-border:#2A3550;
  --td-header:#364058;  --td-unseen:#182329;
  --td-text:#FBF9F4;    --td-text2:#9AA3B2;
  --td-dusk:#6E67AF;    --td-dusk-hi:#7E77BF; --td-dusk-tint:#262A4A;
  --td-sage:#A3B49F;    --td-sage-tint:#1E2C26; --td-sage-ink:#A3B49F;
  --td-amber:#C9954A;   --td-amber-tint:#33290F; --td-amber-ink:#C9954A;
  --td-brick:#B4533E;   --td-brick-tint:#351B14; --td-brick-ink:#D07A66;
  --td-paper:#111A2B;

  --f-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --r-control:8px; --r-card:14px; --r-pill:999px;
  --ease-settle:cubic-bezier(0.16,1,0.3,1);
}
:root[data-theme="light"] {
  /* verbatim, retail-admin.css :8238-8254 */
  --td-surface:#FFFFFF; --td-raised:#F6F3EC; --td-border:#E4E0D5;
  --td-header:#DAD5C6;  --td-unseen:#F4F5F0;
  --td-text:#111A2B;    --td-text2:#58606E;
  --td-dusk-tint:#EEEDF6;
  --td-sage-tint:#EDF1EC; --td-sage-ink:#4A6249;
  --td-amber-tint:#F7EEDE; --td-amber-ink:#8A6425;
  --td-brick-tint:#F6E7E3; --td-brick-ink:#B4533E;
  --td-paper:#FBF9F4;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--f-sans);font-size:15px;line-height:1.5;
  background:var(--td-paper);color:var(--td-text);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--td-dusk);outline-offset:2px}

/* ---- shell ---- */
.till{height:100%;display:flex;flex-direction:column;position:relative}
.t-head{
  height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--td-surface);border-bottom:1px solid var(--td-border);
}
/* THE WAY BACK. This screen is a separate page, not one of the phone's pushed
   ones, so nothing here draws the control every pushed screen has — and in an
   installed app there is no browser chrome to press Back in either. An operator
   who took the Counter till shortcut out of Tacet had no route home at all.
   A chevron at the head of the row, where every pushed screen on the phone puts
   it, and the title reads as that screen's title beside it. Icon only: this row
   already carries the store picker and the language, and the word is on the
   control's label for anyone who cannot see the arrow. Hidden unless the server
   says there is a home to return to — see `home` in /api/backend/me. */
.t-back{
  /* 44 square, the same floor the store button and the language button keep:
     the row's own padding is pulled back so the arrow still sits at the edge
     the title would have started from. */
  width:44px;height:44px;flex:none;margin-left:-12px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:0;background:transparent;color:var(--td-text2);
}
.t-back:active{color:var(--td-text)}
.t-back svg{width:22px;height:22px}
.t-brand{font-size:15px;font-weight:500;letter-spacing:-.01em}
.t-dot{width:4px;height:4px;border-radius:50%;background:var(--td-border);flex:none}
/* The store is a CONTROL, not a caption. It was a <span>, and the saved-store
   key it restored from was never written by anything — so the till always fell
   through to the first store and a second location was unreachable. */
.t-store{
  min-height:44px;padding:0 10px;border:1px solid transparent;background:transparent;
  border-radius:var(--r-control);font-size:13px;color:var(--td-text2);
  display:inline-flex;align-items:center;gap:6px;
}
.t-store.switchable{border-color:var(--td-border)}
.t-store .chev{width:14px;height:14px;flex:none}

/* Store picker — a centred pop-up. Not a drawer: this is a short list and a
   decision, and it sits over the till rather than beside it. */
.sscrim{
  position:absolute;inset:0;z-index:20;background:rgba(17,26,43,.38);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.ssheet{
  width:100%;max-width:360px;max-height:100%;overflow-y:auto;
  background:var(--td-surface);border:1px solid var(--td-border);
  border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:8px;
}
.ssheet .hd{font-size:13px;color:var(--td-text2);margin-bottom:2px}
.srow{
  min-height:56px;padding:0 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font-size:16px;text-align:left;display:flex;align-items:center;gap:10px;
}
.srow.on{border-color:var(--td-text);background:var(--td-raised)}
.srow .tick{width:18px;height:18px;flex:none;opacity:0}
.srow.on .tick{opacity:1}
.t-sp{flex:1}
.hbtn{
  min-width:44px;height:44px;padding:0 12px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text2);
  font-size:13px;font-weight:500;
}
.t-body{flex:1;display:flex;min-height:0}

/* ---- left: entry ---- */
.t-entry{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px;gap:12px}
/* Search is ABOVE the grid: tapping it raises the on-screen keyboard, which
   covers the lower half of the screen. A field below the grid would be hidden
   by the very keyboard it summons. */
.srch{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--td-surface);border:1px solid var(--td-border);
  border-radius:var(--r-control);
}
.srch svg{width:18px;height:18px;flex:none;color:var(--td-text2)}
.srch input{
  /* Fills the bar's full 52px. Without the height the input is its own ~25px
     content box inside a 52px row, so the actual tap target is half the
     control the cashier can see — and the half that misses just focuses
     nothing. */
  flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:15px;
  color:var(--td-text);-webkit-user-select:text;user-select:text;
}
.srch input:focus{outline:none}
.srch input::placeholder{color:var(--td-text2)}
.srch .clr{
  width:44px;height:44px;flex:none;border:0;background:transparent;
  color:var(--td-text2);border-radius:var(--r-control);font-size:20px;
}
.cats{display:flex;gap:8px;flex:none;overflow-x:auto;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{
  height:44px;padding:0 16px;flex:none;display:inline-flex;align-items:center;
  border-radius:var(--r-pill);border:1px solid var(--td-border);
  background:var(--td-surface);color:var(--td-text2);font-size:14px;font-weight:500;
  white-space:nowrap;
}
.cat.on{background:var(--td-text);border-color:var(--td-text);color:var(--td-paper)}
.grid{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:100px;gap:12px;align-content:start;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
/* THE COLUMN COUNT IS THE ONLY THING HERE THAT HAS TO ADAPT.
   The rail is `flex:none` at 380px, so it never gives ground — at every
   viewport the entry side absorbs the whole difference (entry = vw - 380 - 32),
   which makes viewport width a direct proxy for column width and a plain media
   query the right tool.
   Measured, four fixed columns give: 204px cells at 1280 (16:10 Android
   tablet), 140px at 1024 (4:3 iPad landscape), and 76px on a portrait iPad at
   768 — where .tile's overflow:hidden clips the product name with no visible
   sign that it did. Portrait is reachable on iOS no matter what the manifest
   says, because iOS ignores the orientation lock that Android honours, so the
   narrow case is a real device state rather than a hypothetical one.
   Both breakpoints keep cells >= ~110px, which is the width at which a name
   and a price still read. */
@media (max-width:900px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (max-width:700px){ .grid{grid-template-columns:repeat(2,1fr)} }
.tile{
  border-radius:var(--r-card);border:1px solid var(--td-border);
  background:var(--td-surface);padding:12px;display:flex;flex-direction:column;
  justify-content:space-between;text-align:left;overflow:hidden;
}
.tile:active{background:var(--td-raised)}
.tile .nm{
  font-size:14px;font-weight:500;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tile .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* On a tile the code sits left of the price and yields first: a long name
   already clamps to two lines, and the price must never be the thing that
   gets squeezed out. */
.tile .sku{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tile .pr{flex:none}
.tile .pr{font-size:15px;font-variant-numeric:tabular-nums}
.tile .lo{
  font-size:12px;font-weight:500;border-radius:var(--r-pill);padding:2px 8px;
  font-variant-numeric:tabular-nums;color:var(--td-amber-ink);background:var(--td-amber-tint);
  /* A pill that wraps is not a pill. "Out of stock" broke across two lines and
     came out as "Ou"/"stc"; it holds its shape and lets the row shrink around
     it instead. */
  white-space:nowrap;flex:none;
}
/* Out of stock keeps its slot. Muscle memory is the point of a tile grid, so a
   sold-out line stays where the thumb expects it — struck through and not
   tappable — rather than vanishing and reshuffling every tile after it. */
.tile.out{background:var(--td-raised);border-style:dashed}
.tile.out .nm{color:var(--td-text2)}
.tile.out .lo{color:var(--td-brick-ink);background:var(--td-brick-tint)}
.gempty{
  grid-column:1/-1;padding:32px;text-align:center;color:var(--td-text2);font-size:14px;
}

/* ---- the two faces of the entry side --------------------------------------
   A shop taking QR orders has two jobs at one counter: ring up the walk-in in
   front of you, and settle the order somebody placed on their phone two minutes
   ago. They need the same space — the grid and the list are both the full pane
   — so they take turns rather than splitting it.

   THE SWITCH IS ABSENT, NOT DISABLED, WHEN NOTHING IS WAITING. A shop with no
   QR orders (or no shop record at all) sees the till exactly as it shipped: no
   control, no empty list, no word for "nothing here" to translate. That also
   makes the count the ONLY thing the switch ever says, so a badge on screen
   always means there is something behind it.

   The rail was considered and rejected: under 700px it is a bottom sheet behind
   a tap, and a list the counter works from cannot live one gesture away. */
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
/* An author `display` beats the UA's [hidden], so without this the pane that is
   supposed to be down renders on top of the one that is up. */
.pane[hidden]{display:none}
.seg{display:flex;gap:8px;flex:none}
.seg[hidden]{display:none}
.sbtn{
  height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;
  border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);color:var(--td-text2);font-size:14px;font-weight:500;
  white-space:nowrap;
}
.sbtn.on{background:var(--td-dusk);border-color:var(--td-dusk);color:#fff}
.sbtn .b{
  min-width:22px;height:22px;padding:0 7px;border-radius:999px;
  background:var(--td-dusk);color:#fff;font-size:12px;font-weight:500;
  font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;justify-content:center;
}
.sbtn.on .b{background:rgba(255,255,255,.26)}

/* ---- one waiting order ----
   The number is the whole of the retrieval: the customer says it or holds it
   up, and the cashier's eye has to find it in a list without reading. So it
   gets the same treatment the customer's own screen gives it — the biggest
   thing on the row, in its own block, ahead of everything else. */
.plist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:8px;align-content:start}
.wrow{
  flex:none;display:flex;align-items:center;gap:14px;padding:10px 14px;min-height:64px;
  border-radius:var(--r-card);border:1px solid var(--td-border);
  background:var(--td-surface);text-align:left;width:100%;
}
.wrow:active{background:var(--td-raised)}
.wrow .n{
  min-width:52px;height:44px;padding:0 10px;flex:none;border-radius:var(--r-control);
  background:var(--td-dusk-tint);color:var(--td-dusk);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;
}
.wrow .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wrow .who b{
  font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* The meta line carries the time, and the DATE too on any row not from the same
   trading day as the newest — §49 requires the short code be read with its shop
   and its date, and two days' unpaid orders in one list is exactly where two
   14s could otherwise sit together. */
.wrow .who i{font-style:normal;font-size:12px;color:var(--td-text2);font-variant-numeric:tabular-nums}
.wrow .amt{flex:none;font-size:16px;font-variant-numeric:tabular-nums}

/* ---- right: the order ---- */
.t-order{
  width:380px;flex:none;background:var(--td-surface);
  border-left:1px solid var(--td-border);display:flex;flex-direction:column;min-height:0;
}
.cust{
  flex:none;min-height:56px;display:flex;align-items:center;gap:10px;
  padding:6px 16px;border-bottom:1px solid var(--td-border);
}
.cust .who{flex:1;min-width:0;font-size:14px;color:var(--td-text2)}
.cust.on .who{color:var(--td-text)}
.cust .sub{font-size:12px;color:var(--td-text2);font-variant-numeric:tabular-nums}
.cbtn{
  min-height:44px;padding:0 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none;
}
.lines{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ln{
  width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--td-border);padding:12px 16px;min-height:64px;
  display:flex;gap:12px;align-items:baseline;
}
.ln .nm{flex:1;min-width:0;font-size:15px}
.ln .sb{
  font-size:13px;color:var(--td-text2);font-variant-numeric:tabular-nums;margin-top:2px;
  display:flex;align-items:baseline;gap:8px;
}
/* The product code, quieter than the name and steadier than it: tabular figures
   so a column of codes lines up under each other. NOT monospace — Tacet has
   none, and Inter's tabular figures already give the alignment that would have
   been the reason to reach for one. */
.sku{
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
  color:var(--td-text2);white-space:nowrap;
}
.ln .sb .sku{
  background:var(--td-raised);border-radius:var(--r-pill);padding:1px 7px;
}
.ln .tt{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .q{
  font-size:13px;font-weight:500;color:var(--td-text2);background:var(--td-raised);
  border-radius:var(--r-pill);padding:1px 8px;margin-right:6px;font-variant-numeric:tabular-nums;
}
.ln.sel{background:var(--td-raised);border-left:3px solid var(--td-text);padding-left:13px}
/* Controls open INSIDE the line. A modal would cover the order the cashier is
   reading aloud from and charge a dismiss tap for every quantity fix. */
.lctl{
  display:flex;align-items:center;gap:10px;padding:12px 16px 12px 13px;
  background:var(--td-raised);border-bottom:1px solid var(--td-border);
  /* The ink edge marks the SELECTED line, so it belongs to the selected state
     and not to the strip. On a phone every line carries a strip and nothing is
     selected — a bar on all of them would claim a selection that is not there.
     Transparent rather than absent so the rows stay aligned either way. */
  border-left:3px solid transparent;
}
.lctl.sel{border-left-color:var(--td-text)}

/* ONE CONTROL, NOT THREE. Each of -, the count and + used to carry its own
   border with 10px of air between them, so a single quantity read as three
   floating chips and the number it changes appeared to belong to neither
   button. They share a border now, divided by hairlines: the group is the
   control, the hairlines are the seams, and the 52px targets are unchanged. */
.qgrp{
  display:inline-flex;align-items:stretch;flex:none;overflow:hidden;
  border:1px solid var(--td-border);border-radius:var(--r-control);
  background:var(--td-surface);
}
.step{
  width:52px;height:52px;flex:none;border:0;border-radius:0;
  background:transparent;color:var(--td-text);
  font-size:22px;display:grid;place-items:center;
}
.step[disabled]{color:var(--td-text2);background:var(--td-raised)}
.stepn{
  min-width:56px;height:52px;display:grid;place-items:center;
  font-size:18px;font-variant-numeric:tabular-nums;
  border-left:1px solid var(--td-border);border-right:1px solid var(--td-border);
}
.lsp{flex:1}
/* QUIET, NOT ABSENT. A brick-outlined box made the destructive control the
   loudest thing in the row — louder than the price — and it read as a form
   button dropped into a list. It keeps its ink, its 52px target and its
   distance from the +/- pair (that gap is mis-tap protection, not spacing),
   and gives up the border it never needed: stepping the quantity to zero
   already removes a line, so this is a shortcut rather than the only way out. */
.rm{
  height:52px;padding:0 12px;border-radius:var(--r-control);
  border:0;background:transparent;color:var(--td-brick-ink);
  font-size:14px;font-weight:500;
}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:32px;text-align:center;
}
.empty p{margin:0;font-size:14px;color:var(--td-text2);max-width:28ch}
.foot{flex:none;border-top:1px solid var(--td-border);padding:16px;background:var(--td-surface)}
.sums{font-size:13px;color:var(--td-text2)}
.sums div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 14px}
.tot .lb{font-size:15px}
/* The number the cashier reads aloud. Nothing else on the screen is this size. */
.tot .amt{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
/* INK, not Dusk. Dusk means "tacet did this for you"; taking money at a counter
   is the cashier acting (patterns S1.8 rule 5, corrected axis). The till spends
   no Dusk budget at all — Dusk appears here only as a focus ring. */
.pay{
  width:100%;height:76px;border-radius:var(--r-control);
  border:1px solid var(--td-text);background:var(--td-text);color:var(--td-paper);
  font-size:19px;font-weight:500;display:flex;align-items:center;justify-content:center;
  gap:12px;font-variant-numeric:tabular-nums;
}
.pay[disabled]{background:var(--td-raised);border-color:var(--td-border);color:var(--td-text2)}
/* Cancelling the customer's order. NOT a second .pay: the two outcomes are not
   equals, and a destructive control the size and weight of the one beside it is
   a mis-tap waiting to happen at a busy counter. Quiet until armed, and then
   Brick — the token this admin already uses for the destructive end of things. */
.cxo{
  width:100%;height:44px;margin-top:8px;border:1px solid transparent;
  background:transparent;color:var(--td-text2);border-radius:var(--r-control);
  font-size:14px;font-weight:500;
}
.cxo[hidden]{display:none}
.cxo:active{background:var(--td-raised)}
.cxo.arm{
  background:var(--td-brick-tint);border-color:var(--td-brick);color:var(--td-brick-ink);
}

/* ---- customer picker: the store picker's sheet, with a search in it ---- */
.cust-sheet{max-width:460px;gap:10px}
.csearch{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-radius:var(--r-control);background:var(--td-paper);border:1px solid var(--td-border);
}
.csearch svg{width:18px;height:18px;flex:none;color:var(--td-text2)}
.csearch input{
  flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:15px;
  color:var(--td-text);-webkit-user-select:text;user-select:text;
}
.csearch input:focus{outline:none}
.crows{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px}
.crow{
  min-height:60px;padding:8px 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font:inherit;display:flex;align-items:center;gap:12px;text-align:left;
}
.cwho{flex:1;min-width:0;font-size:15px;display:flex;flex-direction:column;gap:2px}
.cbal{
  flex:none;font-size:13px;text-align:right;
  display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;
}
.cmeta{font-size:13px;color:var(--td-text2);font-variant-numeric:tabular-nums}
.cempty{padding:18px 4px;text-align:center;color:var(--td-text2);font-size:14px}
.ccancel{
  min-height:52px;border-radius:var(--r-control);border:1px solid var(--td-border);
  background:transparent;color:var(--td-text2);font:inherit;font-size:15px;font-weight:500;
}

/* ---- settle: a takeover, not a sheet ----
   The cashier turns the tablet round or leans over it; nothing of the till
   should stay readable behind. A page is a takeover, not an overlay. */
.settle{position:absolute;inset:0;background:var(--td-paper);display:flex;flex-direction:column;padding:20px 28px 24px}
.stop{display:flex;align-items:center;gap:12px;flex:none}
.back{
  height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;
  border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);font-size:14px;font-weight:500;
}
/* THE ESCAPE MUST SURVIVE A SHORT SCREEN.
   .stop (which holds Back) and .sfoot (which holds Confirm) are both
   flex:none, so they always get their space — but without overflow here the
   middle simply grew past its box and drew ON TOP of them. Measured at
   1024x480 with all five wallets open: the picker ran y=26 to y=394, covering
   the Back button at y=20-64 and the Confirm at y=356. Back was still "on
   screen" and still untappable, which is the worst version of the bug.
   That matters more on iOS than the height alone suggests: a standalone PWA
   has no swipe-back gesture, so this button is the ONLY way out of the
   takeover. It cannot be allowed to sit underneath something.
   "safe" centring keeps the centred look but degrades to flex-start once the
   content is taller than the box, rather than centring it and pushing the top
   out of reach of the scroll. */
.smain{
  flex:1;display:flex;align-items:safe center;justify-content:center;
  gap:56px;min-height:0;overflow-y:auto;
}
.samt{text-align:right;flex:none}
.samt .lb{font-size:15px;color:var(--td-text2);margin-bottom:6px}
/* Legibility is the whole job here: the cashier reads this and keys it into a
   separate terminal by hand. */
.samt .amt{font-size:64px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.samt .sb{font-size:14px;color:var(--td-text2);margin-top:10px;font-variant-numeric:tabular-nums}
.spick{flex:none;width:340px}
.spick .lb{font-size:13px;color:var(--td-text2);margin-bottom:8px}
.wal{
  width:100%;min-height:60px;padding:0 16px;margin-bottom:8px;
  border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);display:flex;align-items:center;gap:12px;
  font-size:16px;text-align:left;
}
.wal .rad{
  width:22px;height:22px;flex:none;border-radius:50%;
  border:1.5px solid var(--td-border);display:grid;place-items:center;
}
.wal.on{border-color:var(--td-text);background:var(--td-raised)}
.wal.on .rad{border-color:var(--td-text)}
.wal.on .rad::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--td-text)}
.more{
  width:100%;min-height:44px;border:0;background:transparent;color:var(--td-text2);
  font-size:13px;font-weight:500;text-align:left;padding:4px 0;
}
.sfoot{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.sconf{
  width:340px;height:72px;border-radius:var(--r-control);
  border:1px solid var(--td-text);background:var(--td-text);color:var(--td-paper);
  font-size:18px;font-weight:500;
}
.sconf[disabled]{background:var(--td-raised);border-color:var(--td-border);color:var(--td-text2)}
.shint{font-size:13px;color:var(--td-text2);min-height:20px;text-align:center}
.serr{
  font-size:14px;color:var(--td-brick-ink);background:var(--td-brick-tint);
  border-radius:var(--r-control);padding:10px 14px;max-width:520px;text-align:center;
}

/* ---- done ---- */
.done{display:flex;flex-direction:column;align-items:center;gap:16px}
.mark{
  width:104px;height:104px;border-radius:50%;background:var(--td-sage-tint);
  display:grid;place-items:center;color:var(--td-sage-ink);
}
.mark svg{width:50px;height:50px}
.done h2{margin:0;font-size:24px;font-weight:500}
.done .meta{font-size:14px;color:var(--td-text2);font-variant-numeric:tabular-nums;text-align:center}
.drow{display:flex;gap:12px;align-items:center}
.dprim{
  min-height:60px;padding:0 28px;border-radius:var(--r-control);
  border:1px solid var(--td-text);background:var(--td-text);color:var(--td-paper);
  font-size:16px;font-weight:500;
}
/* Reprint is secondary by construction: printing already happened, automatically
   and fire-and-forget, the moment the sale settled. This is the second copy. */
.dsec{
  min-height:60px;padding:0 20px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font-size:15px;font-weight:500;
}
.dsec[disabled]{color:var(--td-text2)}

/* ---- boot / signed out ---- */
.boot{
  position:absolute;inset:0;background:var(--td-paper);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center;
}
.boot p{margin:0;color:var(--td-text2);font-size:15px;max-width:44ch}
.boot a{color:var(--td-text);text-underline-offset:3px}
/* The phone-only furniture, inert on a tablet. Declared HERE, above the
   override block, because equal-specificity rules are decided by source order
   — written below it, these would win and the phone layout would silently do
   nothing. That is exactly what happened on the first pass: .t-bar{display:none}
   sat after the media query and the bar never appeared.
   The stepper strip keeps its old tablet behaviour exactly: hidden unless its
   line is the selected one. */
.sheet-grab{display:none}
.sheet-scrim{display:none}
.t-bar{display:none}
.cust .sheet-ttl{display:none}
.tile .incart{display:none}
.lctl{display:none}
.ln.sel + .lctl{display:flex}

/* ══ OVERRIDES LAST ══════════════════════════════════════════════════════
   This block must stay at the END of the sheet. It targets .t-order, .lines,
   .smain, .samt, .spick and .sconf, all of which are declared further up at
   the SAME specificity — written any earlier, their base rules win and the
   media query silently does nothing. It was written earlier the first time,
   and the rail kept computing to width:380px inside a 375px phone. */
/* ── PHONE ────────────────────────────────────────────────────────────────
   THE ORDER STOPS BEING A COLUMN AND BECOMES A BAR.

   A phone has one column of room and two things competing for it. The
   products are touched dozens of times a sale; the order is checked two or
   three. The first attempt split the screen between them, which served the
   rare job at the cost of the constant one and left the order list a
   two-line strip the eye reads as a footer — present, but not readable.

   So: the grid gets the screen. The bar keeps the only part of the order
   that must always be true, the total, and opens the rest at full height —
   ~465px of list rather than ~150. The rail element itself becomes that
   sheet, so there is one order list in the DOM, not two.

   Specified in reference/counter-till-mobile-mockup.html. */
@media (max-width:700px){
  .t-body{flex-direction:column}
  .t-entry{flex:1 1 auto;min-height:0}

  /* The rail, restyled into a bottom sheet. */
  .t-order{
    position:absolute;left:0;right:0;bottom:0;top:auto;
    width:100%;height:86%;max-height:none;flex:0 0 auto;z-index:12;
    border-left:0;border-top:1px solid var(--td-border);
    border-radius:18px 18px 0 0;
    box-shadow:0 -2px 6px rgba(17,26,43,.06), 0 -12px 32px rgba(17,26,43,.10);
    transform:translateY(101%);
    transition:transform .28s var(--ease-settle);
  }
  .till.sheet-open .t-order{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){ .t-order{transition:none} }
  .lines{flex:1 1 auto}
  .sheet-grab{
    display:block;flex:none;width:36px;height:4px;margin:8px auto 0;
    border-radius:2px;background:var(--td-border);
  }
  .sheet-scrim{
    display:block;position:absolute;inset:0;z-index:11;
    background:rgba(17,26,43,.34);
  }

  /* .cust IS the sheet header here: count on the left, customer on the right.
     It was a full-width row of its own on the products screen, which is the
     single most expensive place it could have been for a control a walk-in
     never touches. */
  .cust{min-height:56px;padding:10px 14px 12px;gap:10px}
  .cust .sheet-ttl{display:inline-flex;align-items:center;gap:8px;order:-1}
  .cust .sheet-ttl .ct{
    min-width:26px;height:26px;padding:0 8px;border-radius:999px;
    background:var(--td-raised);color:var(--td-text2);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .cust .who{flex:1;min-width:0;text-align:right}

  /* Every line carries its stepper: the sheet was opened on purpose and has
     the room, so a correction is one tap instead of select-then-tap. */
  .lctl{display:flex}
  /* …and because every strip is already open, SELECTION marks nothing here.
     Tapping a row still sets it (the row is the same control it is on a
     tablet), so the ink edge is suppressed rather than left to appear on one
     arbitrary line and imply a state the screen does not otherwise have. */
  .lctl.sel{border-left-color:transparent}

  /* The bar. Two rows: the order folded, and the thing the thumb is going for. */
  .t-bar{
    display:block;flex:none;z-index:10;
    background:var(--td-surface);border-top:1px solid var(--td-border);
    padding:8px 14px 14px;
  }
  .bar-sum{
    height:44px;width:100%;display:flex;align-items:center;gap:8px;
    background:transparent;border:0;padding:0;color:var(--td-text);font:inherit;
  }
  .bar-sum[hidden]{display:none}
  .bar-sum .chev{width:18px;height:18px;flex:none;color:var(--td-text2)}
  .bar-sum .ct{
    min-width:26px;height:26px;padding:0 8px;border-radius:999px;
    background:var(--td-raised);color:var(--td-text2);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .bar-sum .sp{flex:1}
  .bar-sum .amt{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
  #bar-pay{width:100%;height:60px}

  /* The basket count, on the tile. Solid ink, not the amber tint the low-stock
     pill uses — one is what is in the basket, the other is what is on the
     shelf, and reading one as the other would be a miscount at the counter. */
  .tile{position:relative}
  .tile .incart{
    display:inline-flex;align-items:center;justify-content:center;
    position:absolute;top:8px;right:8px;
    min-width:24px;height:24px;padding:0 7px;border-radius:999px;
    background:var(--td-text);color:var(--td-paper);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
  }

  /* The head must not wrap: the store control is the only way to change shop. */
  .t-brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Above the sheet, always — the takeover's whole point is that nothing of
     the till stays readable behind it. */
  .settle{z-index:30}
  #storepick,#custpick,#leavepick{z-index:40}

  /* The settle takeover is amount-beside-wallets at 56px apart, which does not
     fit a phone either. Stack it, and let the two fixed 340px blocks be as wide
     as the screen allows. */
  .smain{flex-direction:column;gap:20px}
  .samt{text-align:center}
  .samt .amt{font-size:52px}
  .spick,.sconf{width:100%;max-width:340px}
}

[hidden]{display:none !important}
</style>
</head>
<body>
<div class="till" id="app" hidden>
  <div class="t-head">
    <button class="t-back" id="hd-back" type="button" data-back hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <span class="t-brand" id="hd-title"></span>
    <span class="t-dot"></span>
    <button class="t-store" id="hd-store" type="button" data-store></button>
    <span class="t-sp"></span>
    <button class="hbtn" id="hd-lang" type="button"></button>
  </div>
  <div class="t-body">
    <div class="t-entry">
      <!-- The two faces of the entry side. The switch is EMPTY, and the pane
           below it is the menu, whenever nothing is waiting to be paid — a
           shop with no QR orders sees exactly the till that shipped. -->
      <div class="seg" id="seg" hidden></div>
      <div class="pane" id="pane-menu">
        <div class="srch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
          <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="clr" id="q-clr" type="button" hidden aria-label="clear">&times;</button>
        </div>
        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="pane" id="pane-pend" hidden></div>
    </div>
    <div class="t-order">
      <div class="sheet-grab"></div>
      <div class="cust" id="cust"></div>
      <div class="lines" id="lines"></div>
      <div class="foot">
        <div class="sums" id="sums"></div>
        <div class="tot"><span class="lb" id="tot-lb"></span><span class="amt" id="tot-amt">&yen;0.00</span></div>
        <button class="pay" id="pay" type="button" disabled></button>
        <button class="cxo" id="cancel-order" type="button" data-cancel-order="1" hidden></button>
      </div>
    </div>
  </div>
  <div class="sheet-scrim" id="sheet-scrim" data-sheet="close"></div>
  <div class="t-bar" id="tbar">
    <button class="bar-sum" type="button" data-sheet="open">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      <span class="ct" id="bar-ct"></span>
      <span class="sp"></span>
      <span class="amt" id="bar-amt"></span>
    </button>
    <button class="pay" id="bar-pay" type="button"></button>
  </div>
  <div class="settle" id="settle" hidden></div>
  <div class="sscrim" id="storepick" hidden></div>
  <div class="sscrim" id="custpick" hidden></div>
  <div class="sscrim" id="leavepick" hidden></div>
</div>
<div class="boot" id="boot"><p id="boot-msg"></p></div>

<script>
(function () {
  'use strict';

  /* ====================================================================
     LANGUAGE — one on screen, never glued.

     cuT(en, cn) picks one, exactly as the admin does. LANG_KEY is the same
     'roots-admin-lang' the rest of the suite uses, so the language an
     operator picks anywhere follows them onto the till.

     EVERY CN HALF BELOW IS COPIED FROM A LOCKED SOURCE. Nothing is composed.
     The sources are the live admin's own cuT pairs and the locked tables in
     docs/tacet-delivery-vocabulary.md; each is named in STRINGS so the next
     person can check one rather than trust all of them.
     ==================================================================== */
  var LANG_KEY = 'roots-admin-lang';
  var _lang = 'en';
  try { var s = localStorage.getItem(LANG_KEY); if (s === 'en' || s === 'cn') _lang = s; } catch (e) {}
  function cuT(en, cn) { return _lang === 'cn' ? cn : en; }
  function setLang(l) {
    _lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    document.documentElement.lang = l === 'cn' ? 'zh-CN' : 'en';
    render();
  }

  /* Locked source for every string on this screen.
     admin  = an existing cuT()/glued pair in the live admin (file named)
     vocab  = docs/tacet-delivery-vocabulary.md, the locked table
     Adding a row means finding a locked source first — never writing Chinese. */
  var STRINGS = {
    // header + chrome
    counterSale:  ['Counter sale', '前台销售'],        // admin: retail-admin.html:2785
    // Quoted whole from the record screens' own leave guard, which asks the
    // same question about the same kind of loss — a draft that exists only on
    // screen, and answers it with the same word. The body half is not taken
    // with it: theirs names a material.
    leaveSale:    ['Leave without saving?', '未保存就离开?'], // admin: 18-materials.js:417
    leave:        ['Leave', '离开'],                   // admin: 18-materials.js:419
    // entry
    // The two faces of the entry side. `counterSale` above already names the
    // walk-in half — it is this screen's own title and the word the sale is
    // recorded under — so the switch reuses it rather than minting a second
    // word for the same thing.
    //
    // `pending` is the status label the admin already prints for exactly this
    // state, quoted whole from the pending_payment row of the dashboard's own
    // status map. These ARE pending_payment orders, so the word is not an
    // approximation of one — it is the same label the same rows carry
    // everywhere else in the product.
    pending:      ['Pending', '待付款'],               // admin: 03-dashboard.js:3419
    searchAdd:    ['Search a product to add…', '搜索商品以添加…'], // admin: 04-orders/products picker
    all:          ['All', '全部'],                     // admin: i18n EN_ONLY_MAP
    outOfStock:   ['Out of stock', '缺货'],            // admin: products grid
    noItems:      ['No items', '无商品'],              // admin
    // order rail
    guest:        ['Guest', '访客'],                   // admin: 04-orders.js customer state
    customer:     ['Customer', '顾客'],                // admin
    points:       ['Points', '积分'],                  // admin
    wallet:       ['Wallet', '钱包'],                  // admin
    remove:       ['Remove', '删除'],                  // admin: 04-orders.js line controls
    noLines:      ['No lines yet. Search above to add the first product.',
                   '还没有商品行。在上方搜索,添加第一个商品。'], // admin: 04-orders.js
    subtotal:     ['subtotal', '小计'],                // admin
    total:        ['Total', '合计'],                   // admin: 04-orders.js summary
    // The default name for the tax line, used when the shop has not typed its
    // own (audit I-03). A shop in Dublin writes VAT and one in Toronto writes
    // GST/HST, so the merchant's own text wins — this is only the fallback, and
    // it is declared here because every Chinese string on this page is.
    taxLabel:     ['Tax', '税费'],                     // admin: 04-orders.js order subline
    // Cancelling a QR order the customer no longer wants. Both halves are the
    // mini app's own, from its order screen where a customer cancels exactly
    // this — miniapp/pages/order/order.js:99 (en) and :275 (cn). The customer
    // cancelling in the app and the cashier cancelling for them at the counter
    // are doing the same thing to the same order, so it is the same words.
    cancelOrder:  ['Cancel order', '取消订单'],        // miniapp: order.js:99,275
    // settle
    amount:       ['Amount', '金额'],                  // admin: refund payout dialog
    payMethod:    ['Pay method', '付款方式'],          // admin: retail-admin.html:2829
    markPaid:     ['Mark paid', '标记已付款'],         // admin: 04-orders.js NEXT_STATUS:2677
    back:         ['Back', '返回'],                    // admin
    closed:       ['Closed', '已关闭'],                // admin: 01-core.js:647 (sales grid cell)
