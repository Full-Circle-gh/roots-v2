<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">

<!-- ANDROID / CHROME reads the manifest: name, icons, standalone display and
     the landscape lock all come from there. -->
<link rel="manifest" href="/till-manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS / SAFARI ignores nearly all of that and reads these. Safari is also
     the ONLY iOS browser that can install a PWA — Chrome on iOS cannot — so
     Add to Home Screen from Safari is the whole install path on an iPad.
     apple-mobile-web-app-capable is what makes it open standalone rather than
     as a Safari tab. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Counter">
<!-- "default", not "black-translucent": the till runs LIGHT. Translucent puts
     white status text over the page, which on #FBF9F4 paper is an invisible
     clock and battery. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Without an apple-touch-icon iOS puts a SCREENSHOT of the page on the home
     screen. 180x180 is the largest size iOS asks for; iPadOS wants 152 (iPad)
     and 167 (iPad Pro) and downsamples this one for both, which is why a single
     180 is sufficient and why it must not be smaller than 180. Note iOS does
     not accept SVG here — the manifest's raster icons are shared deliberately. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<meta name="theme-color" content="#FBF9F4">
<title>Counter</title>
<!-- ── Web fonts, loaded so a blocked host costs nothing (audit D-09) ───────
     This service's only live merchant trades in mainland China, where this font
     host is unreachable. As blocking <link rel="stylesheet"> tags these cost
     every page load a connection timeout before first paint, on the one network
     that matters most.
     media="print" + onload makes the request non-blocking: the page paints
     immediately in the fallback stack (which every --f-* variable already
     names), and the web faces swap in if and when they arrive. `display=swap`
     was already set, so text was never going to be invisible — only late.
     The <noscript> copy keeps the fonts for a scripting-disabled browser, where
     the onload trick cannot run.
     The preconnect hints are gone with them: a warmed connection to a host that
     does not answer is a wasted one.
     THE REAL FIX is to serve these faces from the application, as the brand
     display fonts in /assets/fonts already are. That needs the files, which is
     a deliberate step and not this change. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
/* ==========================================================================
   COUNTER TILL — the cashier-facing screen on a shop tablet.

   Device: a shop tablet in landscape, touch only — no mouse and no keyboard
   beyond the on-screen one. Every target here is >= 44px; the working ones are
   52-76px.

   BOTH PLATFORMS, because Tacet does not get to dictate a customer's hardware.
   The two install paths are separate and neither substitutes for the other:
   Android Chrome installs from /till-manifest.webmanifest, iOS Safari reads the
   apple-* meta tags in the head and ignores most of the manifest. The two
   aspect ratios differ too — iPad is 4:3 (1024x768 CSS landscape), most Android
   tablets are 16:10 (1280x800) — so the layout is tested at both rather than at
   one. See the breakpoint note on .t-body.

   WHAT THIS IS NOT. It is not the removed /pos shell (deleted 2026-08-04,
   388c7e57) and it is not a second order path. It writes counter sales through
   the ordinary manual-order endpoint, POST /api/retail-admin/orders, with
   fulfillment_type 'counter' — the same path whose stock decrement and
   store_id rule landed in d0e21fe0. There is one path and this uses it.

   PAYMENT IS MANUAL, DELIBERATELY. Production has no Alipay credentials, so a
   one-QR settle cannot work — and the two wallets' payment codes are mutually
   unreadable anyway, so one QR could never have served both. The cashier reads
   the total aloud, keys it into a separate terminal, records WHICH wallet took
   it, and confirms. Legibility of that number is the whole job of the settle
   screen. See SETTLE_MODES: a scan mode slots in beside the manual one without
   touching anything else, and manual stays permanently as the fallback.

   COLOUR is the live --td-* block, copied verbatim from retail-admin.css
   (:8205-8254) — dark first, exactly as live, with light as the opt-in
   override. The till runs light: a counter is a bright room.

   TYPE is Inter, 400/500 only. No monospace exists in Tacet; money and
   quantities are Inter with tabular-nums.

   LANGUAGE: one at a time, never glued. cuT(en, cn) picks one, and every CN
   half is COPIED from a locked source — the live admin's own pairs or
   docs/tacet-delivery-vocabulary.md. Nothing here is composed. See STRINGS.
   ========================================================================== */

:root {
  /* verbatim, retail-admin.css :8205-8237 — dark, the cascade default */
  --td-surface:#18233A; --td-raised:#1E2A44; --td-border:#2A3550;
  --td-header:#364058;  --td-unseen:#182329;
  --td-text:#FBF9F4;    --td-text2:#9AA3B2;
  --td-dusk:#6E67AF;    --td-dusk-hi:#7E77BF; --td-dusk-tint:#262A4A;
  --td-sage:#A3B49F;    --td-sage-tint:#1E2C26; --td-sage-ink:#A3B49F;
  --td-amber:#C9954A;   --td-amber-tint:#33290F; --td-amber-ink:#C9954A;
  --td-brick:#B4533E;   --td-brick-tint:#351B14; --td-brick-ink:#D07A66;
  --td-paper:#111A2B;

  --f-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --r-control:8px; --r-card:14px; --r-pill:999px;
  --ease-settle:cubic-bezier(0.16,1,0.3,1);
}
:root[data-theme="light"] {
  /* verbatim, retail-admin.css :8238-8254 */
  --td-surface:#FFFFFF; --td-raised:#F6F3EC; --td-border:#E4E0D5;
  --td-header:#DAD5C6;  --td-unseen:#F4F5F0;
  --td-text:#111A2B;    --td-text2:#58606E;
  --td-dusk-tint:#EEEDF6;
  --td-sage-tint:#EDF1EC; --td-sage-ink:#4A6249;
  --td-amber-tint:#F7EEDE; --td-amber-ink:#8A6425;
  --td-brick-tint:#F6E7E3; --td-brick-ink:#B4533E;
  --td-paper:#FBF9F4;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--f-sans);font-size:15px;line-height:1.5;
  background:var(--td-paper);color:var(--td-text);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--td-dusk);outline-offset:2px}

/* ---- shell ---- */
.till{height:100%;display:flex;flex-direction:column;position:relative}
.t-head{
  height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--td-surface);border-bottom:1px solid var(--td-border);
}
/* THE WAY BACK. This screen is a separate page, not one of the phone's pushed
   ones, so nothing here draws the control every pushed screen has — and in an
   installed app there is no browser chrome to press Back in either. An operator
   who took the Counter till shortcut out of Tacet had no route home at all.
   A chevron at the head of the row, where every pushed screen on the phone puts
   it, and the title reads as that screen's title beside it. Icon only: this row
   already carries the store picker and the language, and the word is on the
   control's label for anyone who cannot see the arrow. Hidden unless the server
   says there is a home to return to — see `home` in /api/backend/me. */
.t-back{
  /* 44 square, the same floor the store button and the language button keep:
     the row's own padding is pulled back so the arrow still sits at the edge
     the title would have started from. */
  width:44px;height:44px;flex:none;margin-left:-12px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:0;background:transparent;color:var(--td-text2);
}
.t-back:active{color:var(--td-text)}
.t-back svg{width:22px;height:22px}
.t-brand{font-size:15px;font-weight:500;letter-spacing:-.01em}
.t-dot{width:4px;height:4px;border-radius:50%;background:var(--td-border);flex:none}
/* The store is a CONTROL, not a caption. It was a <span>, and the saved-store
   key it restored from was never written by anything — so the till always fell
   through to the first store and a second location was unreachable. */
.t-store{
  min-height:44px;padding:0 10px;border:1px solid transparent;background:transparent;
  border-radius:var(--r-control);font-size:13px;color:var(--td-text2);
  display:inline-flex;align-items:center;gap:6px;
}
.t-store.switchable{border-color:var(--td-border)}
.t-store .chev{width:14px;height:14px;flex:none}

/* Store picker — a centred pop-up. Not a drawer: this is a short list and a
   decision, and it sits over the till rather than beside it. */
.sscrim{
  position:absolute;inset:0;z-index:20;background:rgba(17,26,43,.38);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.ssheet{
  width:100%;max-width:360px;max-height:100%;overflow-y:auto;
  background:var(--td-surface);border:1px solid var(--td-border);
  border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:8px;
}
.ssheet .hd{font-size:13px;color:var(--td-text2);margin-bottom:2px}
.srow{
  min-height:56px;padding:0 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font-size:16px;text-align:left;display:flex;align-items:center;gap:10px;
}
.srow.on{border-color:var(--td-text);background:var(--td-raised)}
.srow .tick{width:18px;height:18px;flex:none;opacity:0}
.srow.on .tick{opacity:1}
.t-sp{flex:1}
.hbtn{
  min-width:44px;height:44px;padding:0 12px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text2);
  font-size:13px;font-weight:500;
}
.t-body{flex:1;display:flex;min-height:0}

/* ---- left: entry ---- */
.t-entry{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px;gap:12px}
/* Search is ABOVE the grid: tapping it raises the on-screen keyboard, which
   covers the lower half of the screen. A field below the grid would be hidden
   by the very keyboard it summons. */
.srch{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--td-surface);border:1px solid var(--td-border);
  border-radius:var(--r-control);
}
.srch svg{width:18px;height:18px;flex:none;color:var(--td-text2)}
.srch input{
  /* Fills the bar's full 52px. Without the height the input is its own ~25px
     content box inside a 52px row, so the actual tap target is half the
     control the cashier can see — and the half that misses just focuses
     nothing. */
  flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:15px;
  color:var(--td-text);-webkit-user-select:text;user-select:text;
}
.srch input:focus{outline:none}
.srch input::placeholder{color:var(--td-text2)}
.srch .clr{
  width:44px;height:44px;flex:none;border:0;background:transparent;
  color:var(--td-text2);border-radius:var(--r-control);font-size:20px;
}
.cats{display:flex;gap:8px;flex:none;overflow-x:auto;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{
  height:44px;padding:0 16px;flex:none;display:inline-flex;align-items:center;
  border-radius:var(--r-pill);border:1px solid var(--td-border);
  background:var(--td-surface);color:var(--td-text2);font-size:14px;font-weight:500;
  white-space:nowrap;
}
.cat.on{background:var(--td-text);border-color:var(--td-text);color:var(--td-paper)}
.grid{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:100px;gap:12px;align-content:start;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
/* THE COLUMN COUNT IS THE ONLY THING HERE THAT HAS TO ADAPT.
   The rail is `flex:none` at 380px, so it never gives ground — at every
   viewport the entry side absorbs the whole difference (entry = vw - 380 - 32),
   which makes viewport width a direct proxy for column width and a plain media
   query the right tool.
   Measured, four fixed columns give: 204px cells at 1280 (16:10 Android
   tablet), 140px at 1024 (4:3 iPad landscape), and 76px on a portrait iPad at
   768 — where .tile's overflow:hidden clips the product name with no visible
   sign that it did. Portrait is reachable on iOS no matter what the manifest
   says, because iOS ignores the orientation lock that Android honours, so the
   narrow case is a real device state rather than a hypothetical one.
   Both breakpoints keep cells >= ~110px, which is the width at which a name
   and a price still read. */
@media (max-width:900px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (max-width:700px){ .grid{grid-template-columns:repeat(2,1fr)} }
.tile{
  border-radius:var(--r-card);border:1px solid var(--td-border);
  background:var(--td-surface);padding:12px;display:flex;flex-direction:column;
  justify-content:space-between;text-align:left;overflow:hidden;
}
.tile:active{background:var(--td-raised)}
.tile .nm{
  font-size:14px;font-weight:500;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tile .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* On a tile the code sits left of the price and yields first: a long name
   already clamps to two lines, and the price must never be the thing that
   gets squeezed out. */
.tile .sku{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tile .pr{flex:none}
.tile .pr{font-size:15px;font-variant-numeric:tabular-nums}
.tile .lo{
  font-size:12px;font-weight:500;border-radius:var(--r-pill);padding:2px 8px;
  font-variant-numeric:tabular-nums;color:var(--td-amber-ink);background:var(--td-amber-tint);
  /* A pill that wraps is not a pill. "Out of stock" broke across two lines and
     came out as "Ou"/"stc"; it holds its shape and lets the row shrink around
     it instead. */
  white-space:nowrap;flex:none;
}
/* Out of stock keeps its slot. Muscle memory is the point of a tile grid, so a
   sold-out line stays where the thumb expects it — struck through and not
   tappable — rather than vanishing and reshuffling every tile after it. */
.tile.out{background:var(--td-raised);border-style:dashed}
.tile.out .nm{color:var(--td-text2)}
.tile.out .lo{color:var(--td-brick-ink);background:var(--td-brick-tint)}
.gempty{
  grid-column:1/-1;padding:32px;text-align:center;color:var(--td-text2);font-size:14px;
}

/* ---- right: the order ---- */
.t-order{
  width:380px;flex:none;background:var(--td-surface);
  border-left:1px solid var(--td-border);display:flex;flex-direction:column;min-height:0;
}
.cust{
  flex:none;min-height:56px;display:flex;align-items:center;gap:10px;
  padding:6px 16px;border-bottom:1px solid var(--td-border);
}
.cust .who{flex:1;min-width:0;font-size:14px;color:var(--td-text2)}
.cust.on .who{color:var(--td-text)}
.cust .sub{font-size:12px;color:var(--td-text2);font-variant-numeric:tabular-nums}
.cbtn{
  min-height:44px;padding:0 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none;
}
.lines{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ln{
  width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--td-border);padding:12px 16px;min-height:64px;
  display:flex;gap:12px;align-items:baseline;
}
.ln .nm{flex:1;min-width:0;font-size:15px}
.ln .sb{
  font-size:13px;color:var(--td-text2);font-variant-numeric:tabular-nums;margin-top:2px;
  display:flex;align-items:baseline;gap:8px;
}
/* The product code, quieter than the name and steadier than it: tabular figures
   so a column of codes lines up under each other. NOT monospace — Tacet has
   none, and Inter's tabular figures already give the alignment that would have
   been the reason to reach for one. */
.sku{
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
  color:var(--td-text2);white-space:nowrap;
}
.ln .sb .sku{
  background:var(--td-raised);border-radius:var(--r-pill);padding:1px 7px;
}
.ln .tt{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .q{
  font-size:13px;font-weight:500;color:var(--td-text2);background:var(--td-raised);
  border-radius:var(--r-pill);padding:1px 8px;margin-right:6px;font-variant-numeric:tabular-nums;
}
.ln.sel{background:var(--td-raised);border-left:3px solid var(--td-text);padding-left:13px}
/* Controls open INSIDE the line. A modal would cover the order the cashier is
   reading aloud from and charge a dismiss tap for every quantity fix. */
.lctl{
  display:flex;align-items:center;gap:10px;padding:12px 16px 12px 13px;
  background:var(--td-raised);border-bottom:1px solid var(--td-border);
  /* The ink edge marks the SELECTED line, so it belongs to the selected state
     and not to the strip. On a phone every line carries a strip and nothing is
     selected — a bar on all of them would claim a selection that is not there.
     Transparent rather than absent so the rows stay aligned either way. */
  border-left:3px solid transparent;
}
.lctl.sel{border-left-color:var(--td-text)}

/* ONE CONTROL, NOT THREE. Each of -, the count and + used to carry its own
   border with 10px of air between them, so a single quantity read as three
   floating chips and the number it changes appeared to belong to neither
   button. They share a border now, divided by hairlines: the group is the
   control, the hairlines are the seams, and the 52px targets are unchanged. */
.qgrp{
  display:inline-flex;align-items:stretch;flex:none;overflow:hidden;
  border:1px solid var(--td-border);border-radius:var(--r-control);
  background:var(--td-surface);
}
.step{
  width:52px;height:52px;flex:none;border:0;border-radius:0;
  background:transparent;color:var(--td-text);
  font-size:22px;display:grid;place-items:center;
}
.step[disabled]{color:var(--td-text2);background:var(--td-raised)}
.stepn{
  min-width:56px;height:52px;display:grid;place-items:center;
  font-size:18px;font-variant-numeric:tabular-nums;
  border-left:1px solid var(--td-border);border-right:1px solid var(--td-border);
}
.lsp{flex:1}
/* QUIET, NOT ABSENT. A brick-outlined box made the destructive control the
   loudest thing in the row — louder than the price — and it read as a form
   button dropped into a list. It keeps its ink, its 52px target and its
   distance from the +/- pair (that gap is mis-tap protection, not spacing),
   and gives up the border it never needed: stepping the quantity to zero
   already removes a line, so this is a shortcut rather than the only way out. */
.rm{
  height:52px;padding:0 12px;border-radius:var(--r-control);
  border:0;background:transparent;color:var(--td-brick-ink);
  font-size:14px;font-weight:500;
}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:32px;text-align:center;
}
.empty p{margin:0;font-size:14px;color:var(--td-text2);max-width:28ch}
.foot{flex:none;border-top:1px solid var(--td-border);padding:16px;background:var(--td-surface)}
.sums{font-size:13px;color:var(--td-text2)}
.sums div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 14px}
.tot .lb{font-size:15px}
/* The number the cashier reads aloud. Nothing else on the screen is this size. */
.tot .amt{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
/* INK, not Dusk. Dusk means "tacet did this for you"; taking money at a counter
   is the cashier acting (patterns S1.8 rule 5, corrected axis). The till spends
   no Dusk budget at all — Dusk appears here only as a focus ring. */
.pay{
  width:100%;height:76px;border-radius:var(--r-control);
  border:1px solid var(--td-text);background:var(--td-text);color:var(--td-paper);
  font-size:19px;font-weight:500;display:flex;align-items:center;justify-content:center;
  gap:12px;font-variant-numeric:tabular-nums;
}
.pay[disabled]{background:var(--td-raised);border-color:var(--td-border);color:var(--td-text2)}

/* ---- customer picker: the store picker's sheet, with a search in it ---- */
.cust-sheet{max-width:460px;gap:10px}
.csearch{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-radius:var(--r-control);background:var(--td-paper);border:1px solid var(--td-border);
}
.csearch svg{width:18px;height:18px;flex:none;color:var(--td-text2)}
.csearch input{
  flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:15px;
  color:var(--td-text);-webkit-user-select:text;user-select:text;
}
.csearch input:focus{outline:none}
.crows{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px}
.crow{
  min-height:60px;padding:8px 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font:inherit;display:flex;align-items:center;gap:12px;text-align:left;
}
.cwho{flex:1;min-width:0;font-size:15px;display:flex;flex-direction:column;gap:2px}
.cbal{
  flex:none;font-size:13px;text-align:right;
  display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;
}
.cmeta{font-size:13px;color:var(--td-text2);font-variant-numeric:tabular-nums}
.cempty{padding:18px 4px;text-align:center;color:var(--td-text2);font-size:14px}
.ccancel{
  min-height:52px;border-radius:var(--r-control);border:1px solid var(--td-border);
  background:transparent;color:var(--td-text2);font:inherit;font-size:15px;font-weight:500;
}

/* ---- settle: a takeover, not a sheet ----
   The cashier turns the tablet round or leans over it; nothing of the till
   should stay readable behind. A page is a takeover, not an overlay. */
.settle{position:absolute;inset:0;background:var(--td-paper);display:flex;flex-direction:column;padding:20px 28px 24px}
.stop{display:flex;align-items:center;gap:12px;flex:none}
.back{
  height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;
  border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);font-size:14px;font-weight:500;
}
/* THE ESCAPE MUST SURVIVE A SHORT SCREEN.
   .stop (which holds Back) and .sfoot (which holds Confirm) are both
   flex:none, so they always get their space — but without overflow here the
   middle simply grew past its box and drew ON TOP of them. Measured at
   1024x480 with all five wallets open: the picker ran y=26 to y=394, covering
   the Back button at y=20-64 and the Confirm at y=356. Back was still "on
   screen" and still untappable, which is the worst version of the bug.
   That matters more on iOS than the height alone suggests: a standalone PWA
   has no swipe-back gesture, so this button is the ONLY way out of the
   takeover. It cannot be allowed to sit underneath something.
   "safe" centring keeps the centred look but degrades to flex-start once the
   content is taller than the box, rather than centring it and pushing the top
   out of reach of the scroll. */
.smain{
  flex:1;display:flex;align-items:safe center;justify-content:center;
  gap:56px;min-height:0;overflow-y:auto;
}
.samt{text-align:right;flex:none}
.samt .lb{font-size:15px;color:var(--td-text2);margin-bottom:6px}
/* Legibility is the whole job here: the cashier reads this and keys it into a
   separate terminal by hand. */
.samt .amt{font-size:64px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.samt .sb{font-size:14px;color:var(--td-text2);margin-top:10px;font-variant-numeric:tabular-nums}
.spick{flex:none;width:340px}
.spick .lb{font-size:13px;color:var(--td-text2);margin-bottom:8px}
.wal{
  width:100%;min-height:60px;padding:0 16px;margin-bottom:8px;
  border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);display:flex;align-items:center;gap:12px;
  font-size:16px;text-align:left;
}
.wal .rad{
  width:22px;height:22px;flex:none;border-radius:50%;
  border:1.5px solid var(--td-border);display:grid;place-items:center;
}
.wal.on{border-color:var(--td-text);background:var(--td-raised)}
.wal.on .rad{border-color:var(--td-text)}
.wal.on .rad::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--td-text)}
.more{
  width:100%;min-height:44px;border:0;background:transparent;color:var(--td-text2);
  font-size:13px;font-weight:500;text-align:left;padding:4px 0;
}
.sfoot{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.sconf{
  width:340px;height:72px;border-radius:var(--r-control);
  border:1px solid var(--td-text);background:var(--td-text);color:var(--td-paper);
  font-size:18px;font-weight:500;
}
.sconf[disabled]{background:var(--td-raised);border-color:var(--td-border);color:var(--td-text2)}
.shint{font-size:13px;color:var(--td-text2);min-height:20px;text-align:center}
.serr{
  font-size:14px;color:var(--td-brick-ink);background:var(--td-brick-tint);
  border-radius:var(--r-control);padding:10px 14px;max-width:520px;text-align:center;
}

/* ---- done ---- */
.done{display:flex;flex-direction:column;align-items:center;gap:16px}
.mark{
  width:104px;height:104px;border-radius:50%;background:var(--td-sage-tint);
  display:grid;place-items:center;color:var(--td-sage-ink);
}
.mark svg{width:50px;height:50px}
.done h2{margin:0;font-size:24px;font-weight:500}
.done .meta{font-size:14px;color:var(--td-text2);font-variant-numeric:tabular-nums;text-align:center}
.drow{display:flex;gap:12px;align-items:center}
.dprim{
  min-height:60px;padding:0 28px;border-radius:var(--r-control);
  border:1px solid var(--td-text);background:var(--td-text);color:var(--td-paper);
  font-size:16px;font-weight:500;
}
/* Reprint is secondary by construction: printing already happened, automatically
   and fire-and-forget, the moment the sale settled. This is the second copy. */
.dsec{
  min-height:60px;padding:0 20px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font-size:15px;font-weight:500;
}
.dsec[disabled]{color:var(--td-text2)}

/* ---- boot / signed out ---- */
.boot{
  position:absolute;inset:0;background:var(--td-paper);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center;
}
.boot p{margin:0;color:var(--td-text2);font-size:15px;max-width:44ch}
.boot a{color:var(--td-text);text-underline-offset:3px}
/* The phone-only furniture, inert on a tablet. Declared HERE, above the
   override block, because equal-specificity rules are decided by source order
   — written below it, these would win and the phone layout would silently do
   nothing. That is exactly what happened on the first pass: .t-bar{display:none}
   sat after the media query and the bar never appeared.
   The stepper strip keeps its old tablet behaviour exactly: hidden unless its
   line is the selected one. */
.sheet-grab{display:none}
.sheet-scrim{display:none}
.t-bar{display:none}
.cust .sheet-ttl{display:none}
.tile .incart{display:none}
.lctl{display:none}
.ln.sel + .lctl{display:flex}

/* ══ OVERRIDES LAST ══════════════════════════════════════════════════════
   This block must stay at the END of the sheet. It targets .t-order, .lines,
   .smain, .samt, .spick and .sconf, all of which are declared further up at
   the SAME specificity — written any earlier, their base rules win and the
   media query silently does nothing. It was written earlier the first time,
   and the rail kept computing to width:380px inside a 375px phone. */
/* ── PHONE ────────────────────────────────────────────────────────────────
   THE ORDER STOPS BEING A COLUMN AND BECOMES A BAR.

   A phone has one column of room and two things competing for it. The
   products are touched dozens of times a sale; the order is checked two or
   three. The first attempt split the screen between them, which served the
   rare job at the cost of the constant one and left the order list a
   two-line strip the eye reads as a footer — present, but not readable.

   So: the grid gets the screen. The bar keeps the only part of the order
   that must always be true, the total, and opens the rest at full height —
   ~465px of list rather than ~150. The rail element itself becomes that
   sheet, so there is one order list in the DOM, not two.

   Specified in reference/counter-till-mobile-mockup.html. */
@media (max-width:700px){
  .t-body{flex-direction:column}
  .t-entry{flex:1 1 auto;min-height:0}

  /* The rail, restyled into a bottom sheet. */
  .t-order{
    position:absolute;left:0;right:0;bottom:0;top:auto;
    width:100%;height:86%;max-height:none;flex:0 0 auto;z-index:12;
    border-left:0;border-top:1px solid var(--td-border);
    border-radius:18px 18px 0 0;
    box-shadow:0 -2px 6px rgba(17,26,43,.06), 0 -12px 32px rgba(17,26,43,.10);
    transform:translateY(101%);
    transition:transform .28s var(--ease-settle);
  }
  .till.sheet-open .t-order{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){ .t-order{transition:none} }
  .lines{flex:1 1 auto}
  .sheet-grab{
    display:block;flex:none;width:36px;height:4px;margin:8px auto 0;
    border-radius:2px;background:var(--td-border);
  }
  .sheet-scrim{
    display:block;position:absolute;inset:0;z-index:11;
    background:rgba(17,26,43,.34);
  }

  /* .cust IS the sheet header here: count on the left, customer on the right.
     It was a full-width row of its own on the products screen, which is the
     single most expensive place it could have been for a control a walk-in
     never touches. */
  .cust{min-height:56px;padding:10px 14px 12px;gap:10px}
  .cust .sheet-ttl{display:inline-flex;align-items:center;gap:8px;order:-1}
  .cust .sheet-ttl .ct{
    min-width:26px;height:26px;padding:0 8px;border-radius:999px;
    background:var(--td-raised);color:var(--td-text2);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .cust .who{flex:1;min-width:0;text-align:right}

  /* Every line carries its stepper: the sheet was opened on purpose and has
     the room, so a correction is one tap instead of select-then-tap. */
  .lctl{display:flex}
  /* …and because every strip is already open, SELECTION marks nothing here.
     Tapping a row still sets it (the row is the same control it is on a
     tablet), so the ink edge is suppressed rather than left to appear on one
     arbitrary line and imply a state the screen does not otherwise have. */
  .lctl.sel{border-left-color:transparent}

  /* The bar. Two rows: the order folded, and the thing the thumb is going for. */
  .t-bar{
    display:block;flex:none;z-index:10;
    background:var(--td-surface);border-top:1px solid var(--td-border);
    padding:8px 14px 14px;
  }
  .bar-sum{
    height:44px;width:100%;display:flex;align-items:center;gap:8px;
    background:transparent;border:0;padding:0;color:var(--td-text);font:inherit;
  }
  .bar-sum[hidden]{display:none}
  .bar-sum .chev{width:18px;height:18px;flex:none;color:var(--td-text2)}
  .bar-sum .ct{
    min-width:26px;height:26px;padding:0 8px;border-radius:999px;
    background:var(--td-raised);color:var(--td-text2);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .bar-sum .sp{flex:1}
  .bar-sum .amt{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
  #bar-pay{width:100%;height:60px}

  /* The basket count, on the tile. Solid ink, not the amber tint the low-stock
     pill uses — one is what is in the basket, the other is what is on the
     shelf, and reading one as the other would be a miscount at the counter. */
  .tile{position:relative}
  .tile .incart{
    display:inline-flex;align-items:center;justify-content:center;
    position:absolute;top:8px;right:8px;
    min-width:24px;height:24px;padding:0 7px;border-radius:999px;
    background:var(--td-text);color:var(--td-paper);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
  }

  /* The head must not wrap: the store control is the only way to change shop. */
  .t-brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Above the sheet, always — the takeover's whole point is that nothing of
     the till stays readable behind it. */
  .settle{z-index:30}
  #storepick,#custpick,#leavepick{z-index:40}

  /* The settle takeover is amount-beside-wallets at 56px apart, which does not
     fit a phone either. Stack it, and let the two fixed 340px blocks be as wide
     as the screen allows. */
  .smain{flex-direction:column;gap:20px}
  .samt{text-align:center}
  .samt .amt{font-size:52px}
  .spick,.sconf{width:100%;max-width:340px}
}

[hidden]{display:none !important}
</style>
</head>
<body>
<div class="till" id="app" hidden>
  <div class="t-head">
    <button class="t-back" id="hd-back" type="button" data-back hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <span class="t-brand" id="hd-title"></span>
    <span class="t-dot"></span>
    <button class="t-store" id="hd-store" type="button" data-store></button>
    <span class="t-sp"></span>
    <button class="hbtn" id="hd-lang" type="button"></button>
  </div>
  <div class="t-body">
    <div class="t-entry">
      <div class="srch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
        <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="clr" id="q-clr" type="button" hidden aria-label="clear">&times;</button>
      </div>
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="t-order">
      <div class="sheet-grab"></div>
      <div class="cust" id="cust"></div>
      <div class="lines" id="lines"></div>
      <div class="foot">
        <div class="sums" id="sums"></div>
        <div class="tot"><span class="lb" id="tot-lb"></span><span class="amt" id="tot-amt">&yen;0.00</span></div>
        <button class="pay" id="pay" type="button" disabled></button>
      </div>
    </div>
  </div>
  <div class="sheet-scrim" id="sheet-scrim" data-sheet="close"></div>
  <div class="t-bar" id="tbar">
    <button class="bar-sum" type="button" data-sheet="open">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      <span class="ct" id="bar-ct"></span>
      <span class="sp"></span>
      <span class="amt" id="bar-amt"></span>
    </button>
    <button class="pay" id="bar-pay" type="button"></button>
  </div>
  <div class="settle" id="settle" hidden></div>
  <div class="sscrim" id="storepick" hidden></div>
  <div class="sscrim" id="custpick" hidden></div>
  <div class="sscrim" id="leavepick" hidden></div>
</div>
<div class="boot" id="boot"><p id="boot-msg"></p></div>

<script>
(function () {
  'use strict';

  /* ====================================================================
     LANGUAGE — one on screen, never glued.

     cuT(en, cn) picks one, exactly as the admin does. LANG_KEY is the same
     'roots-admin-lang' the rest of the suite uses, so the language an
     operator picks anywhere follows them onto the till.

     EVERY CN HALF BELOW IS COPIED FROM A LOCKED SOURCE. Nothing is composed.
     The sources are the live admin's own cuT pairs and the locked tables in
     docs/tacet-delivery-vocabulary.md; each is named in STRINGS so the next
     person can check one rather than trust all of them.
     ==================================================================== */
  var LANG_KEY = 'roots-admin-lang';
  var _lang = 'en';
  try { var s = localStorage.getItem(LANG_KEY); if (s === 'en' || s === 'cn') _lang = s; } catch (e) {}
  function cuT(en, cn) { return _lang === 'cn' ? cn : en; }
  function setLang(l) {
    _lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    document.documentElement.lang = l === 'cn' ? 'zh-CN' : 'en';
    render();
  }

  /* Locked source for every string on this screen.
     admin  = an existing cuT()/glued pair in the live admin (file named)
     vocab  = docs/tacet-delivery-vocabulary.md, the locked table
     Adding a row means finding a locked source first — never writing Chinese. */
  var STRINGS = {
    // header + chrome
    counterSale:  ['Counter sale', '前台销售'],        // admin: retail-admin.html:2785
    // Quoted whole from the record screens' own leave guard, which asks the
    // same question about the same kind of loss — a draft that exists only on
    // screen, and answers it with the same word. The body half is not taken
    // with it: theirs names a material.
    leaveSale:    ['Leave without saving?', '未保存就离开?'], // admin: 18-materials.js:417
    leave:        ['Leave', '离开'],                   // admin: 18-materials.js:419
    // entry
    searchAdd:    ['Search a product to add…', '搜索商品以添加…'], // admin: 04-orders/products picker
    all:          ['All', '全部'],                     // admin: i18n EN_ONLY_MAP
    outOfStock:   ['Out of stock', '缺货'],            // admin: products grid
    noItems:      ['No items', '无商品'],              // admin
    // order rail
    guest:        ['Guest', '访客'],                   // admin: 04-orders.js customer state
    customer:     ['Customer', '顾客'],                // admin
    points:       ['Points', '积分'],                  // admin
    wallet:       ['Wallet', '钱包'],                  // admin
    remove:       ['Remove', '删除'],                  // admin: 04-orders.js line controls
    noLines:      ['No lines yet. Search above to add the first product.',
                   '还没有商品行。在上方搜索,添加第一个商品。'], // admin: 04-orders.js
    subtotal:     ['subtotal', '小计'],                // admin
    total:        ['Total', '合计'],                   // admin: 04-orders.js summary
    // settle
    amount:       ['Amount', '金额'],                  // admin: refund payout dialog
    payMethod:    ['Pay method', '付款方式'],          // admin: retail-admin.html:2829
    markPaid:     ['Mark paid', '标记已付款'],         // admin: 04-orders.js NEXT_STATUS:2677
    back:         ['Back', '返回'],                    // admin
    closed:       ['Closed', '已关闭'],                // admin: 01-core.js:647 (sales grid cell)
    store:        ['Store', '门店'],                   // admin: 04-orders.js:3575
    custSearch:   ['Search name or phone, or leave as guest',
                   '搜索姓名或电话,或留空作为访客'],       // admin: retail-admin.html:2762
    noMatches:    ['No matches', '无匹配'],            // admin: 09-products.js:2994
    cancel:       ['Cancel', '取消'],                  // admin
    other:        ['Other', '其他'],                   // admin: PAY_METHOD_CHOICES
    // done
    completed:    ['Completed', '已完成'],             // vocab: delivered + counter
    paid:         ['Paid', '已付款'],                  // vocab: paid, all
    printReceipt: ['Print receipt', '打印小票'],       // admin: 04-orders.js
    newOrder:     ['New order', '新建订单'],           // admin: retail-admin.html:2218
    // failure — the generic locked sentence, reused rather than re-minted
    didNotSave:   ['That did not save. Nothing was created.', '未能保存,未创建任何内容。'], // admin: 04-orders.js
    // Permission. BOTH halves are lifted from ONE existing string in this
    // repository — routes/pos.js:29, `'forbidden — POS permission required ·
    // 无收银权限'` — so this row is quoted, not composed. The only edit is
    // dropping the leading "forbidden — ", which is an API word: the cashier is
    // reading a screen, not a status code. Nothing else is touched, and the
    // Chinese half is byte-for-byte the one already shipped.
    noPermission: ['POS permission required', '无收银权限']
  };
  function T(k) { var p = STRINGS[k]; return cuT(p[0], p[1]); }

  /* Tender options, values AND labels copied whole from PAY_METHOD_CHOICES in
     public/retail-admin/04-orders.js:5302-5308. The values are exactly
     OFFLINE_PAY_METHODS server-side, so what the till writes is what the
     admin's own Mark-paid control has always written.

     WeChat and Alipay lead because they are what a counter actually takes; the
     other three are real tenders that must stay reachable, folded behind one
     tap so they do not compete with the two. */
  var WALLETS = [
    { v: 'wechat_offline', en: 'WeChat (off-app)',  cn: '微信(线下)',  lead: true },
    { v: 'alipay_offline', en: 'Alipay (off-app)',  cn: '支付宝(线下)', lead: true },
    { v: 'cash',           en: 'Cash',              cn: '现金' },
    { v: 'bank_transfer',  en: 'Bank transfer',     cn: '银行转账' },
    { v: 'other',          en: 'Other',             cn: '其他' }
  ];

  /* ====================================================================
     SETTLE MODES — the extension seam.

     Today there is one: 'manual', where the cashier keys the amount into a
     separate terminal and records the wallet. A scan mode slots in beside it
     as a second entry with its own render() and its own settle payload; the
     picker, the confirm and the paid state below are already written against
     the mode rather than against manual. Manual stays permanently, because a
     terminal that is offline or a wallet that will not scan is a normal
     Tuesday and the till must still be able to take the money.
     ==================================================================== */
  var SETTLE_MODES = {
    manual: {
      id: 'manual',
      // What this mode contributes to POST /orders. The chosen wallet IS the
      // payment_method; nothing else differs from any other counter sale.
      payload: function (st) { return { payment_method: st.wallet }; },
      // Ready to confirm? The wallet is REQUIRED — without it the sale records
      // as generic 'offline' and cannot be reconciled against the terminal's
      // daily statement, which is the one thing this screen exists to prevent.
      ready: function (st) { return !!st.wallet; }
    }
  };

  /* ==================================================================== */
  var S = {
    stores: [], storeId: null, storeName: '', pickOpen: false,
    posOpen: null,             // storeCode -> bool, or null when unknown
    custOpen: false, custQ: '', custRows: null,   // null = nothing searched yet
    sheetOpen: false,          // phone only: is the order sheet up?
    products: [], stock: {}, cats: [], cat: '', q: '',
    lines: [], sel: null,
    customer: null, custBusy: false,
    view: 'till',              // till | settle | done
    home: null, homeLabel: null,  // where Back goes, and what it says — /api/backend/me
    leaveOpen: false,          // is the "leave without saving?" question up?
    mode: 'manual',
    wallet: null, moreOpen: false, busy: false, err: '',
    done: null, printState: 'idle'
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { var d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; }
  function yuan(n) {
    var v = Number(n) || 0;
    var p = Math.abs(v).toFixed(2).split('.');
    return (v < 0 ? '-¥' : '¥') + p[0].replace(/\B(?=(\d{3})+$)/g, ',') + '.' + p[1];
  }
  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: 'same-origin' }, opts || {}))
      .then(function (r) {
        if (r.status === 401 || r.status === 403) { var e = new Error('unauthorised'); e.auth = true; throw e; }
        return r.json().catch(function () { return { success: false }; });
      });
  }
  function pname(p) { return cuT(p.name_en || p.name_cn || '', p.name_cn || p.name_en || ''); }

  // ---- money. One place, so the rail and the settle screen cannot disagree.
  function subtotal() {
    return Math.round(S.lines.reduce(function (a, l) { return a + l.qty * l.price; }, 0) * 100) / 100;
  }

  // ---- stock. Per STORE, not the catalogue's cross-store sum: a till may only
  // sell what is on ITS shelf, and effective_stock adds up every store's.
  function stockOf(id) { var v = S.stock[id]; return v == null ? null : v; }
  function inCart(id) { var l = findLine(id); return l ? l.qty : 0; }
  function findLine(id) { for (var i = 0; i < S.lines.length; i++) if (S.lines[i].id === id) return S.lines[i]; return null; }

  /* ---- boot ------------------------------------------------------------ */
  function boot(msg) { $('boot').hidden = false; $('app').hidden = true; $('boot-msg').innerHTML = msg; }

  function start() {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.lang = _lang === 'cn' ? 'zh-CN' : 'en';
    $('boot-msg').textContent = '·';
    // THE SECOND READ, because a till may only open where the counter is OPEN.
    // POS is a sales channel on the Sales page exactly like Meituan, and the
    // location master closes every channel at a store at once — so a shop that
    // has been marked shut must not have a till that still rings up sales and
    // still takes stock off that shelf. The server refuses those sales anyway
    // (retail.js posClosedForStore), so without this the cashier would meet a
    // rejection at Mark paid, with a basket already built. Filtering the picker
    // is the same rule stated a step earlier, where it costs nothing.
    //
    // FAILS OPEN, matching the server helper: if channel-status cannot be read
    // the till behaves exactly as it did before this existed. A status endpoint
    // having a bad minute must not shut a shop's counter.
    //
    // THE THIRD READ is this operator's capabilities, because the
    // till became a rail row and a More row in the same commit as this check —
    // and a nav entry that is merely hidden is not a permission. Anyone who
    // knows the URL (an installed tablet whose operator was moved to another
    // role, a bookmark, a shared device) still arrives here.
    //
    // THE PAIR, not one cap: `till:use` opens this screen, and `orders:edit` is
    // what lib/cap-routes.js requires of the POST this screen's Confirm makes.
    // Holding only the first is a till that builds a basket and then refuses to
    // take the money once the tenant turns rbac_enforce on, which is the worst
    // moment to find out.
    //
    // FAILS OPEN, matching channel-status beside it and the whole cap layer:
    // caps is null on a resolution hiccup or a stale session, and null means
    // allowed. This is a view gate over an already-authenticated operator, not
    // the security boundary — that is cap-routes.js on the write itself.
    // NOT A REDIRECT. Nothing in this file redirects on 401/403 and this must
    // not be the exception: a till that redirects itself mid-shift is the loop
    // this product has already been bitten by (see the route comment in
    // server.js). It stops at the boot screen and says why.
    Promise.all([
      api('/api/retail-admin/stores'),
      api('/api/retail-admin/channel-status').catch(function () { return null; }),
      api('/api/backend/me').catch(function () { return null; })
    ])
      .then(function (r) {
        var j = r[0], cs = r[1], me = r[2];
        var caps = me && me.user && Array.isArray(me.user.caps) ? me.user.caps : null;
        // The way back, from the same read as the permission above. Null on any
        // hiccup, which simply means no control is drawn — the till itself is
        // unaffected either way.
        if (me && me.user && typeof me.user.home === 'string') {
          S.home = me.user.home;
          var hl = me.user.homeLabel;
          S.homeLabel = (hl && (hl.en || hl.cn)) ? hl : null;
        }
        if (caps && (caps.indexOf('till:use') === -1 || caps.indexOf('orders:edit') === -1)) {
          boot('<p>' + esc(T('noPermission')) + '</p>');
          return;
        }
        var list = (j.data || []).filter(function (s) { return s.is_active !== 0; });
        var posOpen = null;
        if (cs && cs.channels) {
          var row = cs.channels.filter(function (c) { return c.channel === 'pos'; })[0];
          if (row && row.cells) {
            posOpen = {};
            row.cells.forEach(function (c) { posOpen[c.storeCode] = !!c.open; });
          }
        }
        S.posOpen = posOpen;
        // EVERY active store is kept, closed counters included. Filtering them
        // out was the first shape of this and it read as a broken control: a
        // store that vanishes and a button that does nothing look identical
        // from behind a counter. They are listed and labelled instead, and
        // only the OPENING pick is restricted to a counter that is open.
        var openList = posOpen
          ? list.filter(function (st) { return posOpen[st.code] !== false; })
          : list;
        // Every counter closed is a real state, not an error: say so with the
        // grid's own words rather than a sentence composed for this screen.
        if (posOpen && !openList.length) { boot(esc(T('closed'))); return; }
        if (!list.length) {
          // Honest and specific: the till cannot open without a location,
          // because a counter sale is refused without one server-side.
          boot(esc(T('didNotSave')));
          return;
        }
        S.stores = list;
        var saved = null;
        try { saved = localStorage.getItem('tacet-till-store'); } catch (e) {}
        var pick = openList.filter(function (s) { return String(s.id) === String(saved); })[0] || openList[0];
        setStore(pick);
        return loadCatalogue();
      })
      .then(function () {
        if (!S.storeId) return;
        $('boot').hidden = true; $('app').hidden = false;
        wire();
        render();
      })
      .catch(function (e) {
        if (e && e.auth) {
          boot('<p>' + esc(cuT('Sign in on the backend, then reload this page.',
                               '请先在后台登录,然后刷新此页面。')) + '</p>');
        } else {
          boot('<p>' + esc(T('didNotSave')) + '</p>');
        }
      });
  }

  // Two reads, joined on product_id: the catalogue for names and the price the
  // ORDER path will charge (sell_price — resolveManualOrderLines reads that
  // column, so a till showing anything else would quote a price the order does
  // not use), and the store's own shelf for quantities.
  function loadCatalogue() {
    return Promise.all([
      api('/api/retail-admin/products?published=1'),
      api('/api/retail-admin/stores/' + S.storeId + '/stock?published=1')
    ]).then(function (r) {
      var prods = (r[0] && r[0].data) || [];
      var stk = (r[1] && r[1].data) || [];
      S.stock = {};
      stk.forEach(function (row) {
        // available_wechat already nets off the safety buffer and live holds —
        // the same number the shop shows a customer. Fall back to the raw
        // shelf count only when the decorated field is absent.
        var n = row.available_wechat != null ? row.available_wechat : row.physical_qty;
        S.stock[row.product_id] = Number(n) || 0;
      });
      S.products = prods.filter(function (p) {
        return !p.is_restock_only && Number(p.sell_price) > 0;
      });
      var seen = {}; var cats = [];
      S.products.forEach(function (p) {
        var c = p.top_category || '';
        if (c && !seen[c]) { seen[c] = 1; cats.push(c); }
      });
      S.cats = cats;
    });
  }

  // One place that sets the current store, so the header, the catalogue read
  // and the saved preference cannot drift apart. The write to localStorage is
  // the half that was missing: boot READ 'tacet-till-store' to restore a choice
  // that nothing had ever saved, so `pick` always fell through to list[0] and a
  // second location could not be reached at all.
  function setStore(st) {
    S.storeId = st.id;
    S.storeName = cuT(st.name_en || st.code || ('#' + st.id),
                      st.name_cn || st.name_en || st.code || ('#' + st.id));
    try { localStorage.setItem('tacet-till-store', String(st.id)); } catch (e) {}
  }

  // Switching shelf means switching stock, so the catalogue is re-read rather
  // than reused. Guarded by the caller: a basket built against one store's shelf
  // is not carried to another.
  // Unknown (no channel-status read) counts as open, matching the server's
  // own fail-open rule in retail.js posClosedForStore.
  function storeOpen(st) { return !S.posOpen || S.posOpen[st.code] !== false; }

  function switchStore(id) {
    var st = S.stores.filter(function (x) { return String(x.id) === String(id); })[0];
    S.pickOpen = false;
    // A closed counter is selectable-looking but not selectable: the server
    // refuses those sales, so offering one would only move the refusal later.
    if (st && !storeOpen(st)) return render();
    if (!st || String(st.id) === String(S.storeId)) return render();
    setStore(st);
    S.stock = {}; S.products = []; S.cats = []; S.cat = ''; S.q = '';
    render();
    loadCatalogue().then(render).catch(function () { render(); });
  }

  function renderPicker() {
    var el = $('storepick');
    el.hidden = !S.pickOpen;
    if (!S.pickOpen) { el.innerHTML = ''; return; }
    var h = '<div class="ssheet"><div class="hd">' + esc(T('store')) + '</div>';
    S.stores.forEach(function (st) {
      var on = String(st.id) === String(S.storeId);
      var open = storeOpen(st);
      var nm = cuT(st.name_en || st.code || ('#' + st.id), st.name_cn || st.name_en || st.code || ('#' + st.id));
      h += '<button class="srow' + (on ? ' on' : '') + (open ? '' : ' shut') + '" type="button"'
        + (open ? ' data-pick="' + esc(String(st.id)) + '"' : ' disabled') + '>'
        + '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>'
        + '<span>' + esc(nm) + '</span>'
        + (open ? '' : '<span class="sp"></span><span class="shutlb">' + esc(T('closed')) + '</span>')
        + '</button>';
    });
    h += '</div>';
    el.innerHTML = h;
  }

  /* The leave question — the store picker's own pop-up, with two answers
     instead of a list. A decision belongs in the page: a system dialog cannot
     be styled, quieted or translated, and this one has to be readable in
     Chinese behind a counter. */
  function renderLeave() {
    var el = $('leavepick');
    el.hidden = !S.leaveOpen;
    if (!S.leaveOpen) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="ssheet"><div class="hd">' + esc(T('leaveSale')) + '</div>'
      + '<button class="srow" type="button" data-leave="go"><span>' + esc(T('leave')) + '</span></button>'
      + '<button class="srow" type="button" data-leave="stay"><span>' + esc(T('cancel')) + '</span></button>'
      + '</div>';
  }

  /* ---- render ---------------------------------------------------------- */
  function render() {
    if (!S.storeId) return;
    $('hd-title').textContent = T('counterSale');
    // The label names the destination — the operator's own home screen, titled
    // with their role's name, exactly as the phone titles it. 'Back' alone when
    // the role has no name to give.
    var bk = $('hd-back');
    bk.hidden = !S.home;
    bk.setAttribute('aria-label', S.homeLabel
      ? cuT(S.homeLabel.en || S.homeLabel.cn, S.homeLabel.cn || S.homeLabel.en)
      : T('back'));
    // A basket is built against ONE store's shelf, so the store cannot change
    // underneath it — the control goes quiet until the sale is cleared or rung
    // up, rather than silently revaluing lines against different stock.
    var sb = $('hd-store');
    var canSwitch = S.stores.length > 1 && !S.lines.length;
    sb.textContent = S.storeName;
    sb.disabled = !canSwitch;
    sb.classList.toggle('switchable', canSwitch);
    if (canSwitch) {
      sb.insertAdjacentHTML('beforeend',
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');
    }
    renderPicker();
    renderCustPicker();
    renderLeave();
    $('hd-lang').textContent = _lang === 'cn' ? 'EN' : '中文';
    var qi = $('q');
    qi.placeholder = T('searchAdd');
    $('q-clr').hidden = !S.q;
    renderCats(); renderGrid(); renderCust(); renderLines(); renderFoot();
    // The sheet belongs to the till view only. Leaving it open behind the
    // settle takeover would put a scrim and a second pay button under a screen
    // whose whole point is that nothing of the till stays readable.
    if (S.view !== 'till') S.sheetOpen = false;
    document.getElementById('app').classList.toggle('sheet-open', S.sheetOpen);
    $('sheet-scrim').hidden = !S.sheetOpen;
    $('settle').hidden = (S.view === 'till');
    if (S.view !== 'till') renderSettle();
  }

  function renderCats() {
    var h = '<button class="cat' + (S.cat ? '' : ' on') + '" type="button" data-cat="">' + esc(T('all')) + '</button>';
    S.cats.forEach(function (c) {
      h += '<button class="cat' + (S.cat === c ? ' on' : '') + '" type="button" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    });
    $('cats').innerHTML = h;
  }

  function visibleProducts() {
    var q = S.q.trim().toLowerCase();
    return S.products.filter(function (p) {
      if (S.cat && (p.top_category || '') !== S.cat) return false;
      if (!q) return true;
      return (p.name_en || '').toLowerCase().indexOf(q) >= 0
          || (p.name_cn || '').indexOf(S.q.trim()) >= 0
          || (p.sku || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderGrid() {
    var list = visibleProducts();
    if (!list.length) { $('grid').innerHTML = '<div class="gempty">' + esc(T('noItems')) + '</div>'; return; }
    var h = '';
    list.forEach(function (p) {
      var st = stockOf(p.id);
      var left = st == null ? null : st - inCart(p.id);
      var out = left != null && left <= 0;
      var inc = inCart(p.id);
      h += '<button class="tile' + (out ? ' out' : '') + '" type="button" data-add="' + p.id + '"' + (out ? ' disabled' : '') + '>'
         + (inc > 0 ? '<span class="incart">' + inc + '</span>' : '')
         + '<span class="nm">' + esc(pname(p)) + '</span>'
         + '<span class="ft">'
         + (out
              // Sold out: the reason replaces the price it would have crowded.
              ? '<span class="lo">' + esc(T('outOfStock')) + '</span>'
              // In stock: code, price, and a single digit when the shelf is low.
              : (p.sku ? '<span class="sku">' + esc(p.sku) + '</span>' : '')
                + '<span class="pr">' + yuan(p.sell_price) + '</span>'
                + (left != null && left <= 5 ? '<span class="lo">' + left + '</span>' : ''))
         + '</span></button>';
    });
    $('grid').innerHTML = h;
  }

  // Walk-ins are anonymous. Attaching a customer is optional and never blocks
  // the sale; when one is attached the row shows the two things that change
  // what the cashier can offer — points and wallet.
  function renderCust() {
    var el = $('cust');
    // On a phone .cust IS the order sheet's header, so it carries the sheet's
    // title and count. On a tablet the rail has no header and CSS hides both.
    // NO TITLE WORD. The only locked pair for this noun is the PLURAL one the
    // admin uses for its order lists; the singular has no locked Chinese half,
    // so it is not written. The grab handle and a sheet full of line items
    // already say what this is.
    //
    // The pair is not quoted here on purpose: the gate forbids Chinese anywhere
    // in this file outside STRINGS, comments included, and it is right to — a
    // character that never renders is still one nobody checked against a
    // source. This comment tripped that rule on its first push.
    var head = '<span class="sheet-ttl">'
      + (S.lines.length ? '<span class="ct">' + itemCount() + '</span>' : '') + '</span>';
    if (S.customer) {
      el.className = 'cust on';
      el.innerHTML = head + '<span class="who">' + esc(S.customer.nickname || ('#' + S.customer.id))
        + '<div class="sub">' + esc(T('points')) + ' ' + (Number(S.customer.points) || 0)
        + ' · ' + esc(T('wallet')) + ' ' + yuan(S.customer.balance) + '</div></span>'
        + '<button class="cbtn" type="button" data-cust="clear">' + esc(T('remove')) + '</button>';
    } else {
      el.className = 'cust';
      el.innerHTML = head + '<span class="who">' + esc(T('guest')) + '</span>'
        + '<button class="cbtn" type="button" data-cust="pick">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
        + esc(T('customer')) + '</button>';
    }
  }

  function renderLines() {
    if (!S.lines.length) {
      $('lines').innerHTML = '<div class="empty"><p>' + esc(T('noLines')) + '</p></div>';
      return;
    }
    var h = '';
    S.lines.forEach(function (l, i) {
      var sel = S.sel === i;
      h += '<button class="ln' + (sel ? ' sel' : '') + '" type="button" data-line="' + i + '">'
         + '<span class="nm">' + (l.qty > 1 ? '<span class="q">×' + l.qty + '</span>' : '') + esc(l.name)
         + '<div class="sb">' + (l.sku ? '<span class="sku">' + esc(l.sku) + '</span>' : '')
         + '<span>' + yuan(l.price) + '</span></div></span>'
         + '<span class="tt">' + yuan(l.qty * l.price) + '</span></button>';
      // ALWAYS EMITTED, never conditional. On a tablet CSS shows this only for
      // the selected line, which is exactly the old behaviour; on a phone the
      // sheet is opened on purpose and has the room, so every line carries its
      // own stepper and a correction is one tap instead of three.
      //
      // It is a SIBLING of .ln rather than a child because .ln is a <button>,
      // and a button cannot contain buttons. That is why the phone layout puts
      // the stepper under its line instead of inline as the mockup drew it.
      {
        var st = stockOf(l.id);
        var capped = st != null && l.qty >= st;
        h += '<div class="lctl' + (sel ? ' sel' : '') + '" data-for="' + i + '">'
           + '<span class="qgrp">'
           + '<button class="step" type="button" data-q="-1" data-i="' + i + '">&minus;</button>'
           + '<span class="stepn">' + l.qty + '</span>'
           + '<button class="step" type="button" data-q="1" data-i="' + i + '"' + (capped ? ' disabled' : '') + '>+</button>'
           + '</span>'
           + '<span class="lsp"></span>'
           + '<button class="rm" type="button" data-q="x" data-i="' + i + '">' + esc(T('remove')) + '</button>'
           + '</div>';
      }
    });
    $('lines').innerHTML = h;
  }

  function renderFoot() {
    var sub = subtotal();
    // NO summary row. On a counter sale the subtotal IS the total — nothing
    // ships, nothing is boxed, nothing is discounted — so a subtotal line would
    // print the same figure twice, one line apart. That is noise, not a
    // reconciliation. The row returns the moment something can make the two
    // differ.
    $('sums').innerHTML = '';
    $('tot-lb').textContent = T('total');
    $('tot-amt').textContent = yuan(sub);
    var b = $('pay');
    b.disabled = !S.lines.length;
    b.textContent = S.lines.length ? T('markPaid') + '  ' + yuan(sub) : T('markPaid');

    // THE BAR IS THE ORDER, FOLDED. On a phone the sheet is closed by default,
    // so this is the only always-true statement of what the customer owes.
    // A BARE NUMBER for the count, deliberately: "4 items" would be an English
    // string with no locked Chinese half, and a pill beside a total needs no
    // unit to be read. The product tiles already count the same way.
    var any = S.lines.length > 0;
    $('bar-ct').textContent = any ? String(itemCount()) : '';
    $('bar-amt').textContent = yuan(sub);
    var bb = $('bar-pay');
    bb.disabled = !any;
    bb.textContent = any ? T('markPaid') + '  ' + yuan(sub) : T('markPaid');
    // With nothing rung up there is no order to open, so the summary row goes
    // rather than sitting there inert.
    document.querySelector('.bar-sum').hidden = !any;
  }

  // Units, not lines: three lines at quantity two are six items, and six is
  // what a cashier counts against the goods on the counter.
  function itemCount() {
    return S.lines.reduce(function (n, l) { return n + (Number(l.qty) || 0); }, 0);
  }

  /* ---- settle ---------------------------------------------------------- */
  function renderSettle() {
    var el = $('settle');
    if (S.view === 'done') { el.innerHTML = doneHtml(); return; }
    var sub = subtotal();
    var lead = WALLETS.filter(function (w) { return w.lead; });
    var rest = WALLETS.filter(function (w) { return !w.lead; });
    var walletBtn = function (w) {
      return '<button class="wal' + (S.wallet === w.v ? ' on' : '') + '" type="button" data-wal="' + w.v + '">'
           + '<span class="rad"></span><span>' + esc(cuT(w.en, w.cn)) + '</span></button>';
    };
    el.innerHTML =
      '<div class="stop"><button class="back" type="button" data-go="till">'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'
      + esc(T('back')) + '</button></div>'
      + '<div class="smain">'
      +   '<div class="samt"><div class="lb">' + esc(T('amount')) + '</div>'
      +     '<div class="amt">' + yuan(sub) + '</div>'
      +     '<div class="sb">' + esc(T('counterSale')) + '</div></div>'
      +   '<div class="spick"><div class="lb">' + esc(T('payMethod')) + '</div>'
      +     lead.map(walletBtn).join('')
      +     (S.moreOpen ? rest.map(walletBtn).join('')
                        : '<button class="more" type="button" data-more="1">' + esc(T('other')) + ' ›</button>')
      +   '</div>'
      + '</div>'
      + '<div class="sfoot">'
      +   (S.err ? '<div class="serr">' + esc(S.err) + '</div>' : '')
      +   '<button class="sconf" type="button" data-confirm="1"' + (canConfirm() ? '' : ' disabled') + '>'
      +     esc(S.busy ? T('markPaid') + '…' : T('markPaid')) + '</button>'
      +   '<div class="shint">' + esc(canConfirm() || S.busy ? '' : T('payMethod')) + '</div>'
      + '</div>';
  }

  function canConfirm() {
    var m = SETTLE_MODES[S.mode];
    return !S.busy && S.lines.length > 0 && m && m.ready(S);
  }

  function doneHtml() {
    var d = S.done || {};
    var w = WALLETS.filter(function (x) { return x.v === d.wallet; })[0];
    var printLabel = S.printState === 'sent' ? T('printReceipt') + ' ✓'
                   : S.printState === 'busy' ? T('printReceipt') + '…'
                   : T('printReceipt');
    return '<div class="stop"></div>'
      + '<div class="smain"><div class="done">'
      +   '<span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 7"/></svg></span>'
      +   '<h2>' + esc(T('completed')) + ' ' + yuan(d.total) + '</h2>'
      +   '<div class="meta">' + esc(w ? cuT(w.en, w.cn) : '') + ' · ' + esc(d.order_no || '') + '</div>'
      +   '<div class="drow">'
      +     '<button class="dsec" type="button" data-print="1"' + (S.printState === 'busy' ? ' disabled' : '') + '>' + esc(printLabel) + '</button>'
      +     '<button class="dprim" type="button" data-go="reset">' + esc(T('newOrder')) + '</button>'
      +   '</div>'
      + '</div></div><div class="sfoot"></div>';
  }

  /* ---- actions --------------------------------------------------------- */
  function addLine(id) {
    var p = S.products.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var st = stockOf(id);
    var l = findLine(id);
    var have = l ? l.qty : 0;
    if (st != null && have >= st) return;          // never sell past the shelf
    if (l) l.qty += 1;
    else S.lines.push({ id: id, name: pname(p), sku: p.sku || '', price: Number(p.sell_price) || 0, qty: 1 });
    render();
  }
  function bumpQty(d, idx) {
    var i = (idx == null || idx === '') ? S.sel : Number(idx);
    var l = S.lines[i]; if (!l) return;
    var drop = function () {
      S.lines.splice(i, 1);
      // The selection is an INDEX, so every line after the removed one shifts.
      // Clearing it is the only safe answer: keeping it would leave the tablet
      // strip attached to whichever line slid into that slot.
      S.sel = null; render();
    };
    if (d === 'x') return drop();
    var st = stockOf(l.id);
    var next = l.qty + Number(d);
    if (next <= 0) return drop();
    if (st != null && next > st) return;
    l.qty = next; render();
  }

  // Confirm. ONE request: the order is created already paid, with the chosen
  // wallet, through POST /api/retail-admin/orders. That is the path whose
  // markOrderPaid → isTerminalOnPaid branch flips a counter sale to its
  // terminal state, decrements the shelf and fires the automatic receipt. The
  // order does not exist until this moment, so a customer who walks away
  // leaves nothing behind to reconcile.
  function confirm() {
    if (!canConfirm()) return;
    S.busy = true; S.err = ''; render();
    var mode = SETTLE_MODES[S.mode];
    var body = Object.assign({
      fulfillment_type: 'counter',
      store_id: S.storeId,
      channel: 'manual',
      status: 'paid',
      customer_id: S.customer ? S.customer.id : null,
      // The server requires a recipient name on every manual order. A walk-in
      // has none, so the sale records the word the admin already uses for
      // exactly this state. It is stored data, not a rendered label — and the
      // receipt suppresses the hand-over block on a counter sale anyway.
      recipient_name: S.customer ? (S.customer.nickname || 'Guest') : 'Guest',
      items: S.lines.map(function (l) { return { product_id: l.id, qty: l.qty }; })
    }, mode.payload(S));

    api('/api/retail-admin/orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (j) {
      S.busy = false;
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      S.done = { id: j.data.id, order_no: j.data.order_no, total: j.data.total, wallet: S.wallet };
      S.view = 'done'; S.printState = 'idle';
      // The shelf moved server-side; mirror it locally so the next sale's
      // tiles are honest without a full reload.
      S.lines.forEach(function (l) {
        if (S.stock[l.id] != null) S.stock[l.id] = Math.max(0, S.stock[l.id] - l.qty);
      });
      render();
    }).catch(function (e) {
      S.busy = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  function reset() {
    S.lines = []; S.sel = null; S.customer = null;
    S.wallet = null; S.moreOpen = false; S.err = ''; S.done = null;
    S.view = 'till'; S.printState = 'idle';
    S.q = ''; $('q').value = '';
    render();
  }

  // Reprint. Printing already happened automatically when the sale settled, so
  // this is the second copy and is styled as such. Fire-and-forget: the button
  // reports that it sent, never that the paper came out, because the printer
  // is a network device and the till cannot know.
  function reprint() {
    if (!S.done || S.printState === 'busy') return;
    S.printState = 'busy'; render();
    api('/api/retail-admin/orders/' + S.done.id + '/print', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ store_id: S.storeId })
    }).then(function () { S.printState = 'sent'; render(); })
      .catch(function () { S.printState = 'idle'; render(); });
  }

  // Attaching a customer. Uses the browser prompt deliberately: a full search
  // panel is its own screen and this is an optional, uncommon step at a till.
  // It stays one tap from the rail and never blocks the sale.
  // ATTACHING A CUSTOMER IS A TACET SCREEN, not a browser prompt.
  //
  // It used to be window.prompt(): a chrome-coloured box saying
  // "store.rootskitchenchina.com says", which cannot be styled, cannot show
  // what it found, and took the FIRST match of pageSize=1 — so two customers
  // with the same given name were a coin toss the cashier never saw.
  //
  // Now it searches and shows what it found, with enough on each row to tell
  // two people apart. SEARCH-ONLY by decision: a customer who does not exist
  // yet is created in the backend, not at the till.
  function pickCustomer() {
    S.custOpen = true; S.custQ = ''; S.custRows = null;
    render();
  }

  function closeCustPicker() {
    S.custOpen = false; S.custRows = null;
    var el = $('custpick'); if (el) el.removeAttribute('data-built');
    render();
  }

  // Debounced so a four-letter name is one query rather than four. The token
  // guards against an earlier, slower reply landing after a later one and
  // overwriting it with results for a term the cashier has already changed.
  var _custTimer = null, _custToken = 0;
  function custSearch(term) {
    S.custQ = term;
    if (_custTimer) clearTimeout(_custTimer);
    var mine = ++_custToken;
    if (!term.trim()) { S.custRows = null; renderCustResults(); return; }
    _custTimer = setTimeout(function () {
      api('/api/retail-admin/customers?pageSize=12&q=' + encodeURIComponent(term.trim()))
        .then(function (j) {
          if (mine !== _custToken) return;      // a newer search already answered
          S.custRows = j.data || [];
          renderCustResults();
        })
        .catch(function () {
          if (mine !== _custToken) return;
          S.custRows = [];
          renderCustResults();
        });
    }, 220);
  }

  function attachCustomer(id) {
    var c = (S.custRows || []).filter(function (x) { return String(x.id) === String(id); })[0];
    if (!c) return;
    S.customer = c; S.custOpen = false; S.custRows = null;
    var el = $('custpick'); if (el) el.removeAttribute('data-built');
    render();
  }

  // THE SHELL IS BUILT ONCE, on open. Re-rendering it on every keystroke would
  // replace the <input> the cashier is typing into and drop the caret — the
  // classic way a search box becomes unusable. Only the result list redraws.
  function renderCustPicker() {
    var el = $('custpick');
    el.hidden = !S.custOpen;
    if (!S.custOpen) { el.innerHTML = ''; return; }
    if (el.getAttribute('data-built') === '1') { renderCustResults(); return; }
    el.innerHTML =
      '<div class="ssheet cust-sheet">'
      + '<div class="hd">' + esc(T('customer')) + '</div>'
      + '<div class="csearch">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>'
      + '<input id="cust-q" type="search" autocomplete="off" autocorrect="off" spellcheck="false">'
      + '</div>'
      + '<div class="crows" id="cust-rows"></div>'
      + '<button class="ccancel" type="button" data-cust="close">' + esc(T('cancel')) + '</button>'
      + '</div>';
    el.setAttribute('data-built', '1');
    var input = $('cust-q');
    input.placeholder = T('custSearch');
    input.addEventListener('input', function () { custSearch(this.value); });
    try { input.focus(); } catch (e) {}
    renderCustResults();
  }

  function renderCustResults() {
    var box = document.getElementById('cust-rows');
    if (!box) return;
    // Nothing typed yet is not the same as nothing found, and must not say so.
    if (S.custRows === null) { box.innerHTML = ''; return; }
    if (!S.custRows.length) { box.innerHTML = '<div class="cempty">' + esc(T('noMatches')) + '</div>'; return; }
    var h = '';
    S.custRows.forEach(function (c) {
      // Name and phone are what tell two people apart; points and wallet are
      // what the cashier is asked for at the counter. Both, on every row.
      var who = c.nickname || ('#' + c.id);
      h += '<button class="crow" type="button" data-cust="use" data-id="' + esc(String(c.id)) + '">'
        + '<span class="cwho">' + esc(who)
        + '<span class="cmeta">' + esc(c.phone || '') + '</span></span>'
        + '<span class="cbal">' + esc(T('points')) + ' ' + (Number(c.points) || 0)
        + '<span class="cmeta">' + esc(T('wallet')) + ' ' + yuan(c.balance) + '</span></span>'
        + '</button>';
    });
    box.innerHTML = h;
  }

  /* ---- wiring. Delegated: the grid and the rail re-render constantly. ---- */
  function wire() {
    document.addEventListener('click', function (ev) {
      // The scrim closes the picker: tapping away from a short list is the
      // expected way out, and it is the only dismissal this pop-up needs.
      if (S.pickOpen && ev.target.id === 'storepick') { S.pickOpen = false; return render(); }
      if (S.custOpen && ev.target.id === 'custpick') return closeCustPicker();
      // Tapping away from the leave question is staying, the same dismissal the
      // store picker takes — and the safe answer is the one a stray tap gives.
      if (S.leaveOpen && ev.target.id === 'leavepick') { S.leaveOpen = false; return render(); }
      var t = ev.target.closest('[data-add],[data-cat],[data-line],[data-q],[data-cust],[data-wal],[data-more],[data-confirm],[data-go],[data-print],[data-store],[data-pick],[data-sheet],[data-back],[data-leave]');
      if (!t) return;
      // THE WAY BACK. An empty till leaves on the tap; a basket with lines in it
      // is a sale in progress that nothing has saved yet, so it asks first — in
      // the page, the way every other decision on this screen is made.
      if (t.hasAttribute('data-back')) {
        if (!S.home) return;
        if (S.lines.length) { S.leaveOpen = true; return render(); }
        window.location.href = S.home; return;
      }
      if (t.hasAttribute('data-leave')) {
        if (t.getAttribute('data-leave') === 'go') { window.location.href = S.home; return; }
        S.leaveOpen = false; return render();
      }
      if (t.hasAttribute('data-store')) { S.pickOpen = !S.pickOpen; return render(); }
      if (t.hasAttribute('data-sheet'))  {
        S.sheetOpen = t.getAttribute('data-sheet') === 'open';
        return render();
      }
      if (t.hasAttribute('data-pick'))  return switchStore(t.getAttribute('data-pick'));
      if (t.hasAttribute('data-add'))   return addLine(Number(t.getAttribute('data-add')));
      if (t.hasAttribute('data-cat'))   { S.cat = t.getAttribute('data-cat'); return render(); }
      if (t.hasAttribute('data-line'))  { var i = Number(t.getAttribute('data-line')); S.sel = (S.sel === i ? null : i); return render(); }
      if (t.hasAttribute('data-q'))     return bumpQty(t.getAttribute('data-q'), t.getAttribute('data-i'));
      if (t.hasAttribute('data-cust'))  {
        var act = t.getAttribute('data-cust');
        if (act === 'clear') { S.customer = null; return render(); }
        if (act === 'close') return closeCustPicker();
        // 'use' attaches a searched row; 'pick' OPENS the picker and is the
        // + Customer button's own long-standing value — do not merge the two.
        if (act === 'use')   return attachCustomer(t.getAttribute('data-id'));
        return pickCustomer();
      }
      if (t.hasAttribute('data-wal'))   { S.wallet = t.getAttribute('data-wal'); S.err = ''; return render(); }
      if (t.hasAttribute('data-more'))  { S.moreOpen = true; return render(); }
      if (t.hasAttribute('data-confirm')) return confirm();
      if (t.hasAttribute('data-print')) return reprint();
      if (t.hasAttribute('data-go'))    {
        var g = t.getAttribute('data-go');
        if (g === 'reset') return reset();
        S.view = 'till'; S.err = ''; return render();
      }
    });
    $('pay').addEventListener('click', function () {
      if (!S.lines.length) return;
      S.view = 'settle'; S.err = ''; S.sel = null; render();
    });
    $('hd-lang').addEventListener('click', function () { setLang(_lang === 'cn' ? 'en' : 'cn'); });
    $('q').addEventListener('input', function (e) { S.q = e.target.value || ''; $('q-clr').hidden = !S.q; renderGrid(); });
    $('q-clr').addEventListener('click', function () { S.q = ''; $('q').value = ''; $('q-clr').hidden = true; renderGrid(); });
  }

  start();
})();
</script>
</body>
</html>
