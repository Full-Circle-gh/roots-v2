     settle takeover cannot help anyone and can only renumber the badge behind a
     screen whose whole point is that nothing of the till stays readable. But
     the read still runs (§440): the cashier is busiest exactly while they are
     taking money, and an order arriving then must still knock. The tab being
     hidden stops it: a till left asleep on a counter overnight should not
     spend the night polling. */
  /* THE SHELF HAS TO ARRIVE BY ITSELF TOO. The catalogue used to be read once,
     at open and on a store switch, so a count changed anywhere else — a recount
     on a phone, a sale on the other till, a QR order — never reached these
     tiles. Reported from Yuexiu: Carrot-Ginger Juice still "Out of stock" after
     it was restocked, until the cashier left the till and came back.

     Same shape as the order list: the server rings (`shop-stock` below) and the
     till re-reads; a slower poll is the floor under a dropped socket. A MINUTE,
     not fifteen seconds — the full catalogue is a heavier read than the pending
     list, and the ring covers the common case at once.

     One read in flight at a time: a burst of rings must not stack requests.
     The basket is untouched — lines carry their own name and price, and the
     shelf gate in addAnswered reads S.stock fresh on every tap. */
  var CAT_FLOOR_MS = 60000;
  function refreshCatalogue() {
    if (!S.storeId || S.catBusy) return;
    S.catBusy = true;
    loadCatalogue().then(function (landed) {
      S.catBusy = false;
      // Quiet while a takeover is up, as the order list is; the next render on
      // the way back draws the fresh shelf. Nothing to draw if the reply was
      // for a shop this till has since left.
      if (landed !== false && S.view === 'till') render();
    }, function () { S.catBusy = false; });
  }

  function startPendPoll() {
    loadPend();
    if (S.pendTimer) clearInterval(S.pendTimer);
    S.pendTimer = setInterval(function () {
      if (document.hidden) return;
      loadPend(S.view !== 'till');
      if (!S.catAt || Date.now() - S.catAt >= CAT_FLOOR_MS) refreshCatalogue();
    }, 15000);
    openPendStream();
  }

  /* THE DOORBELL. Fifteen seconds is a floor, not an answer: a customer can
     walk from a table to the counter faster than that, and arrive before their
     own order does. The server pushes the moment an order lands and the till
     re-reads immediately.

     THE POLL ABOVE STAYS, deliberately. A dropped socket behind a hotel's
     proxy is silent, and a counter that has quietly stopped seeing orders is a
     worse failure than one running fifteen seconds behind. EventSource
     reconnects itself (~3s), and if it never comes back the poll is still the
     floor under the whole thing.

     THE EVENT CARRIES NOTHING. It says a store had something happen; the till
     answers by re-reading its list through the ordinary authenticated
     endpoint. Nothing about an order travels on this socket, so nothing about
     one can leak from it.

     SCOPED TO THIS TILL'S SHOP by query param, and again server-side by tenant.
     Reopened on a store switch for the same reason the list is re-read there. */
  function openPendStream() {
    if (!window.EventSource || !S.storeId) return;
    try { if (S.pendES) S.pendES.close(); } catch (e) {}
    S.pendES = null;
    try {
      var es = new EventSource('/api/retail-admin/shop-events?store_id=' + encodeURIComponent(S.storeId));
      es.addEventListener('shop-order', function () {
        // Quiet while a takeover is up: repainting the list under the settle
        // screen cannot help anyone, and the poll catches up on the way back.
        // The knock still rings (§440).
        loadPend(S.view !== 'till');
      });
      // A shelf count or a made-here switch changed somewhere — re-read it.
      es.addEventListener('shop-stock', function () { refreshCatalogue(); });
      // No onerror handler that closes: EventSource retries by itself, and
      // closing here would turn one bad minute into a socket that never
      // returns for the rest of the shift.
      S.pendES = es;
    } catch (e) { /* no live channel; the poll still runs */ }
  }

  function switchStore(id) {
    var st = S.stores.filter(function (x) { return String(x.id) === String(id); })[0];
    S.pickOpen = false;
    // A closed counter is selectable-looking but not selectable: the server
    // refuses those sales, so offering one would only move the refusal later.
    if (st && !storeOpen(st)) return render();
    if (!st || String(st.id) === String(S.storeId)) return render();
    setStore(st);
    S.stock = {}; S.products = []; S.cats = []; S.catCn = {}; S.cat = ''; S.q = '';
    S.shopId = null; S.soMode = false; S.soBusy = {};   // §287 — another shop's menu
    // Another shop's queue, and its numbers restart at 1 just the same.
    S.pend = null; S.pane = 'menu'; S.paneTouched = false; S.recall = null;
    S.pendSeen = null;   // §440 — the new shop's backlog is not an arrival
    render();
    loadPend();
    openPendStream();
    loadCatalogue().then(render).catch(function () { render(); });
  }

  function renderPicker() {
    var el = $('storepick');
    el.hidden = !S.pickOpen;
    if (!S.pickOpen) { el.innerHTML = ''; return; }
    var h = '<div class="ssheet"><div class="hd">' + esc(T('store')) + '</div>';
    S.stores.forEach(function (st) {
      var on = String(st.id) === String(S.storeId);
      var open = storeOpen(st);
      var nm = cuT(st.name_en || st.code || ('#' + st.id), st.name_cn || st.name_en || st.code || ('#' + st.id));
      h += '<button class="srow' + (on ? ' on' : '') + (open ? '' : ' shut') + '" type="button"'
        + (open ? ' data-pick="' + esc(String(st.id)) + '"' : ' disabled') + '>'
        + '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>'
        + '<span>' + esc(nm) + '</span>'
        + (open ? '' : '<span class="sp"></span><span class="shutlb">' + esc(T('closed')) + '</span>')
        + '</button>';
    });
    h += '</div>';
    el.innerHTML = h;
  }

  /* The leave question — the store picker's own pop-up, with two answers
     instead of a list. A decision belongs in the page: a system dialog cannot
     be styled, quieted or translated, and this one has to be readable in
     Chinese behind a counter. */
  /* WHERE BACK GOES WHEN THE DOOR WAS NOT IN /m.
     lib/app-home.js answers one question — where does a Tacet Mobile operator
     go when they leave this till — and its answer is '/m?to=more', because for
     every door it knew about, More → Operations is where they were. The
     desktop backend is not one of those doors. The rail's "Counter till", the
     POS tile, the Sales channel card and the command bar all open this page
     from a screen that is not /m, so Back handed a person at a PC the phone
     app: Ash, on the second report of this, "same problem when clicking back
     from the till".

     A NEW TAB IS STILL NOT AN EXCUSE. Those four all open this page with
     target=_blank, and the tab having its own history does not make '/m' a
     truthful answer — a Back that is drawn has to go somewhere the operator
     recognises, and window.close() on a tab this page did not open itself is
     the kind of control that silently does nothing.

     So the door says which door it is, and this reads it. Provenance from the
     caller and not a guess at the client: a viewport is not where somebody
     came from, and the same desktop backend is what a counter tablet shows.

     IT REDIRECTS AN EXISTING DOOR, IT DOES NOT MINT ONE. A null home is
     lib/app-home.js refusing a way out to a stock-app-locked role — server.js
     bounces those out of /m — and a ?from= in a hand-typed URL must not talk
     this page into offering an exit that would land on a redirect. The
     allow-list is the same reason: an unknown ?from= leaves the server's
     answer standing rather than trusting the query string with a URL.

     PUBLIC/STOCK.HTML CARRIES THIS FUNCTION VERBATIM, and that is a copy on
     purpose — both pages are single documents that load no external script, so
     the way back cannot become a second request. scripts/test_app_home.js
     slices it out of BOTH and fails if the text differs by a byte, so a door
     added to one and not the other cannot ship. */
  function homeFromDoor(home) {
    var DOORS = {
      dashboard: { home: '/?tab=dashboard', label: { en: 'Dashboard', cn: '主控台' } },
    };
    if (!home) return null;
    var m;
    try { m = /(?:^|[?&])from=([a-z]+)(?:&|$)/.exec(location.search || ''); }
    catch (e) { return null; }
    return (m && DOORS[m[1]]) || null;
  }

  function renderLeave() {
    var el = $('leavepick');
    el.hidden = !S.leaveOpen;
    if (!S.leaveOpen) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="ssheet"><div class="hd">' + esc(T('leaveSale')) + '</div>'
      + '<button class="srow" type="button" data-leave="go"><span>' + esc(T('leave')) + '</span></button>'
      + '<button class="srow" type="button" data-leave="stay"><span>' + esc(T('cancel')) + '</span></button>'
      + '</div>';
  }

  /* ---- render ---------------------------------------------------------- */
  function render() {
    if (!S.storeId) return;
    heldSync();   // §457 — before anything is drawn from it
    discSync();   // §474 — a typed amount the bill has shrunk under is dropped
    $('hd-title').textContent = T('counterSale');
    // The label names the destination — the operator's own home screen, titled
    // with their role's name, exactly as the phone titles it. 'Back' alone when
    // the role has no name to give.
    var bk = $('hd-back');
    bk.hidden = !S.home;
    bk.setAttribute('aria-label', S.homeLabel
      ? cuT(S.homeLabel.en || S.homeLabel.cn, S.homeLabel.cn || S.homeLabel.en)
      : T('back'));
    // A basket is built against ONE store's shelf, so the store cannot change
    // underneath it — the control goes quiet until the sale is cleared or rung
    // up, rather than silently revaluing lines against different stock.
    var sb = $('hd-store');
    var canSwitch = S.stores.length > 1 && !S.lines.length;
    sb.textContent = S.storeName;
    sb.disabled = !canSwitch;
    sb.classList.toggle('switchable', canSwitch);
    if (canSwitch) {
      sb.insertAdjacentHTML('beforeend',
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');
    }
    renderPicker();
    renderCustPicker();
    renderOpts();
    renderLeave();
    renderHoldAsk();
    renderDiscAsk();
    $('hd-lang').textContent = _lang === 'cn' ? 'EN' : '中文';
    renderInstall();
    renderSound();
    syncAwake();
    var qi = $('q');
    qi.placeholder = T('searchAdd');
    $('q-clr').hidden = !S.q;
    normalisePane();
    renderSeg(); renderPend(); renderHeld();
    // One pane at a time, both full height. `hidden` rather than a class so the
    // pane that is down is out of the tab order too — a cashier tabbing through
    // the till must not land in a product grid nobody can see.
    $('pane-menu').hidden = S.pane !== 'menu';
    $('pane-pend').hidden = S.pane !== 'pend';
    $('pane-held').hidden = S.pane !== 'held';
    renderCats(); renderGrid(); renderCust(); renderLines(); renderFoot();
    // The sheet belongs to the till view only. Leaving it open behind the
    // settle takeover would put a scrim and a second pay button under a screen
    // whose whole point is that nothing of the till stays readable.
    if (S.view !== 'till') S.sheetOpen = false;
    // §183 — and neither does the question sheet. A settle takeover that left
    // it standing would put a second Add button under the screen whose whole
    // point is that nothing of the till stays readable behind it.
    if (S.view !== 'till') S.opts = null;
    document.getElementById('app').classList.toggle('sheet-open', S.sheetOpen);
    $('sheet-scrim').hidden = !S.sheetOpen;
    $('settle').hidden = (S.view === 'till');
    if (S.view !== 'till') renderSettle();
  }

  function renderCats() {
    var h = '<button class="cat' + (S.cat ? '' : ' on') + '" type="button" data-cat="">' + esc(T('all')) + '</button>';
    S.cats.forEach(function (c) {
      h += '<button class="cat' + (S.cat === c ? ' on' : '') + '" type="button" data-cat="' + esc(c) + '">' + esc(cuT(c, S.catCn[c] || c)) + '</button>';
    });
    $('cats').innerHTML = h;
    // §287 — only where there is something it could switch: a made-here item
    // on this shop's menu. A shop that sells only shelf stock never sees it.
    var so = $('so-btn');
    if (so) {
      so.hidden = !S.shopId || !S.products.some(canSoldOut);
      so.classList.toggle('on', S.soMode);
      so.textContent = T(S.soMode ? 'done' : 'soldOut');
    }
  }

  // §287 — the rows a cashier may mark sold out: made-here, on this menu.
  // Stocked rows are counted on the shelf and are not a switch.
  function canSoldOut(p) {
    return !!(p && p.on_menu && p.fulfilment_mode === 'made_here' && p.listing_id);
  }

  function visibleProducts() {
    var q = S.q.trim().toLowerCase();
    return S.products.filter(function (p) {
      if (S.soMode && !canSoldOut(p)) return false;
      if (S.cat && (p.top_category || '') !== S.cat) return false;
      if (!q) return true;
      return (p.name_en || '').toLowerCase().indexOf(q) >= 0
          || (p.name_cn || '').indexOf(S.q.trim()) >= 0
          || (p.sku || '').toLowerCase().indexOf(q) >= 0
          // §183 — the size is searchable, so "large" and "500" reach the tile
          // they name. Without it a cashier who types the size gets every
          // sibling or none, which is the search half of the same bug.
          || (p.variant_label || '').toLowerCase().indexOf(q) >= 0
          || (p.variant_label_cn || '').indexOf(S.q.trim()) >= 0;
    });
  }

  // §289 — the photo strip for a tile, or '' when there is none to show.
  // alt is empty on purpose: the name is printed right under it, and a screen
  // reader would otherwise say it twice.
  function photo(p) {
    if (!p.image || S.imgBad[p.id]) return '';
    return '<span class="ph"><img src="' + esc(p.image) + '" alt="" loading="lazy" decoding="async" data-img="' + p.id + '"></span>';
  }

  // §499 — S.best's ids as products, in rank order. The server has already
  // cut the list to this till's glass; the lookup guards a catalogue re-read
  // landing between the two.
  function bestProducts() {
    var byId = {};
    S.products.forEach(function (p) { byId[p.id] = p; });
    return S.best.map(function (id) { return byId[id]; }).filter(Boolean);
  }

  // §499 — a best-seller tile: the grid's selling tile without the photo or
  // the code, so six fit one row and the grid below still shows.
  function bestTile(p) {
    var st = stockOf(p.id);
    var left = st == null ? null : st - inCart(p.id);
    var out = left != null && left <= 0;
    var inc = inCart(p.id);
    return '<button class="tile bs' + (out ? ' out' : '') + '" type="button" data-add="' + p.id + '"' + (out ? ' disabled' : '') + '>'
         + (inc > 0 ? '<span class="incart">' + inc + '</span>' : '')
         + (!out && asks(p) ? '<span class="ask"></span>' : '')
         + '<span class="hd"><span class="nm">' + esc(pname(p)) + '</span>'
         + (vlabel(p) ? '<i class="vl">' + esc(vlabel(p)) + '</i>' : '') + '</span>'
         + '<span class="ft">'
         + (out
              ? '<span class="lo">' + esc(T(p.switched_off ? 'soldOut' : 'outOfStock')) + '</span>'
              : '<span class="pr">' + money(p.price) + '</span>'
                + (left != null && left <= 5 ? '<span class="lo">' + left + '</span>' : ''))
         + '</span></button>';
  }

  function renderGrid() {
    var list = visibleProducts();
    // Taller rows whenever this till has any photo, decided on the whole
    // catalogue rather than on what the search left: rows that changed height
    // while the cashier typed would move every tile under their thumb.
    $('grid').classList.toggle('pics', S.products.some(function (p) { return p.image && !S.imgBad[p.id]; }));
    $('grid').classList.toggle('so', !!S.soMode);
    $('grid').classList.remove('has-best');   // §499 — set again below when the row draws
    if (!list.length) { $('grid').innerHTML = '<div class="gempty">' + esc(T('noItems')) + '</div>'; return; }
    var h = '';
    if (S.soMode) {
      /* §287 — MARKING SOLD OUT. Every tile here is a switch: tap to mark it
         sold out, tap again to bring it back. The word on the tile is the
         state, in the same place the price normally sits, so the cashier can
         read the whole list at a glance before tapping Done. */
      list.forEach(function (p) {
        var off = p.switched_off;
        var busy = !!S.soBusy[p.id];
        var ph = photo(p);
        h += '<button class="tile' + (off ? ' out' : '') + (busy ? ' so-busy' : '') + (ph ? ' has-ph' : '') + '" type="button" data-so="' + p.id + '"' + (busy ? ' disabled' : '') + '>'
           + ph
           + '<span class="hd"><span class="nm">' + esc(pname(p)) + '</span>'
           + (vlabel(p) ? '<i class="vl">' + esc(vlabel(p)) + '</i>' : '') + '</span>'
           + '<span class="ft">'
           + (off ? '<span class="lo">' + esc(T('soldOut')) + '</span>'
                  : (p.sku ? '<span class="sku">' + esc(p.sku) + '</span>' : '')
                    + '<span class="pr">' + money(p.price) + '</span>')
           + '</span></button>';
      });
      /* §492 — AND EACH ITEM'S ANSWERS, so "out of crackers" is one tap and
         not the whole Hummus Platter. The chip's word is its state, as on a
         tile. Off at this shop only: the QR menu and this till grey it, and
         nothing else does. */
      list.forEach(function (p) {
        var ch = soChoices(p);
        if (!ch.length) return;
        h += '<div class="so-opts"><div class="so-oh">' + esc(pname(p))
           + (vlabel(p) ? '<i class="vl">' + esc(vlabel(p)) + '</i>' : '') + '</div><div class="so-oc">';
        ch.forEach(function (c) {
          var busy = !!S.soBusy[p.id + ':' + c.id];
          h += '<button class="so-c' + (c.off ? ' out' : '') + (busy ? ' so-busy' : '') + '" type="button"'
             + ' data-so-c="' + c.id + '" data-so-p="' + p.id + '"' + (busy ? ' disabled' : '') + '>'
             + '<span class="ol">' + esc(cuT(c.en, c.cn)) + '</span>'
             + (c.off ? '<span class="lo">' + esc(T('soldOut')) + '</span>' : '')
             + '</button>';
        });
        h += '</div></div>';
      });
      $('grid').innerHTML = h;
      return;
    }
    /* §499 — THE BEST SELLERS, above everything, on All with no search only:
       a category or a search is the cashier asking for something else. One
       full-width cell in the grid's first row, so it scrolls with the tiles,
       and the same data-add tap as every tile under it. A sold-out best
       seller keeps its place, greyed, for the same reason .tile.out does. */
    var best = (S.cat || S.q.trim()) ? [] : bestProducts();
    $('grid').classList.toggle('has-best', best.length > 0);
    if (best.length) {
      h += '<div class="best"><div class="best-hd"><span class="best-t">' + esc(T('bestSellers')) + '</span>'
         + '<span class="best-w">' + esc(T('last30')) + '</span></div><div class="best-row">';
      best.forEach(function (p) { h += bestTile(p); });
      h += '</div><div class="best-hd"><span class="best-t">' + esc(T('allItems')) + '</span></div></div>';
    }
    list.forEach(function (p) {
      var st = stockOf(p.id);
      var left = st == null ? null : st - inCart(p.id);
      var out = left != null && left <= 0;
      var inc = inCart(p.id);
      var ph = photo(p);
      h += '<button class="tile' + (out ? ' out' : '') + (ph ? ' has-ph' : '') + '" type="button" data-add="' + p.id + '"' + (out ? ' disabled' : '') + '>'
         + ph
         + (inc > 0 ? '<span class="incart">' + inc + '</span>' : '')
         // §183 — this one asks something before it can be made.
         + (!out && asks(p) ? '<span class="ask"></span>' : '')
         + '<span class="hd"><span class="nm">' + esc(pname(p)) + '</span>'
         // §183 — THE SIZE, ON ITS OWN LINE. Not appended to the name: a tile
         // clips at two lines and a long product name would eat the one word
         // that tells two tiles apart. §290 — and outside .nm, so the name's
         // clamp cannot cut it. Its own row is the row that survives.
         + (vlabel(p) ? '<i class="vl">' + esc(vlabel(p)) + '</i>' : '') + '</span>'
         + '<span class="ft">'
         + (out
              // Sold out: the reason replaces the price it would have crowded.
              // §287 — a made-here item switched off says Sold out, the word
              // the QR menu shows the customer for the same state.
              ? '<span class="lo">' + esc(T(p.switched_off ? 'soldOut' : 'outOfStock')) + '</span>'
              // In stock: code, price, and a single digit when the shelf is low.
              : (p.sku ? '<span class="sku">' + esc(p.sku) + '</span>' : '')
                + '<span class="pr">' + money(p.price) + '</span>'
                + (left != null && left <= 5 ? '<span class="lo">' + left + '</span>' : ''))
         + '</span></button>';
    });
    $('grid').innerHTML = h;
  }

  /* ---- QR orders waiting to be paid ------------------------------------
     THE NUMBER IS THE WHOLE RETRIEVAL MECHANISM. lib/shop-order-code.js hands
     each QR order a plain number that restarts every trading day, for exactly
     this: the customer holds up "12" and the cashier finds 12. No scan, no
     typing, no second device on the counter. */

  // Three narrowings, each load-bearing. `status` keeps the list to what is
  // actually owed; `store_id` keeps one shop's numbers out of another's, since
  // two shops both call 14 on the same afternoon; `shop_entry_method` keeps a
  // till sale that was abandoned mid-settle out of a list the cashier is meant
  // to be able to trust — without it the counter is shown its own half-finished
  // basket as though a customer were standing behind it.
  function pendUrl() {
    return '/api/retail-admin/orders?status=pending_payment&channel=shop'
         + '&shop_entry_method=qr&store_id=' + encodeURIComponent(S.storeId) + '&limit=50';
  }

  // A FAILED READ CHANGES NOTHING ON SCREEN, deliberately. This runs on a
  // fifteen-second timer, so a read that blanked the counter's list on a blip
  // would be a worse failure than the blip — the last good answer stays up and
  // the next tick tries again.
  //
  // AND IT REPORTS NOTHING, which is the part worth defending. The failure that
  // matters here is an expired session, and it does not stay quiet: the cashier
  // taps an order, confirms, and confirmRecall says "sign in on the backend" on
  // the screen where they were about to take money. Saying it here as well would
  // put an error in a pane behind a switch that may not even be drawn, and would
  // need a sentence for "the list could not be read" that no locked pair covers.
  //
  // `quiet` (§440) reads for the knock only and leaves the list on screen
  // alone — used while the settle takeover is up.
  function loadPend(quiet) {
    if (!S.storeId) return;
    // A read that lands after a store switch is the OLD shop's list. Dropped:
    // painting it would show the wrong queue, and seeding the knock with it
    // would make the new shop's whole backlog ring as though it had just come in.
    var sid = S.storeId;
    api(pendUrl()).then(function (j) {
      if (!j || !j.success) return;
      if (String(sid) !== String(S.storeId)) return;
      // shop_order_code is null on anything that did not arrive by QR. The
      // server filter already excludes those; this is the belt to its braces,
      // because a row with no number cannot be found by the one thing the
      // customer knows.
      var rows = (j.data || []).filter(function (o) { return o.shop_order_code != null; });
      noteArrivals(rows);
      if (quiet) return;
      S.pend = rows;
      autoPane();
      render();
    }).catch(function () { /* keep the last good list; the next tick retries */ });
  }

  /* §440 — AN ARRIVAL IS AN ID THIS TILL HAS NOT SEEN BEFORE. The first read
     only remembers: a till switched on in the morning onto three orders from
     before it opened has nothing arriving, and must not ring for them. After
     that, any new id knocks once — one knock for a read that brought three,
     because three knocks in a row reads as an alarm.

     The set only grows. An order that leaves the list (paid, cancelled) and
     comes back into the window — the list is capped at 50 — is not new. */
  function noteArrivals(rows) {
    var first = !S.pendSeen;
    if (first) S.pendSeen = {};
    var fresh = false;
    rows.forEach(function (o) {
      if (!S.pendSeen[o.id]) { S.pendSeen[o.id] = 1; fresh = true; }
    });
    if (fresh && !first) playKnock();
  }

  // "Default to Pending when something is waiting, Menu when nothing is."
  // A DEFAULT, which is why it stops at the first sign of work in progress:
  // once the cashier has chosen a pane it is theirs until the sale ends, and a
  // basket with lines in it is never taken off the screen. Orders arriving
  // announce themselves with the badge instead — a count they can ignore beats
  // a pane that moves under their hands.
  function autoPane() {
    if (S.paneTouched || S.view !== 'till' || S.lines.length) return;
    S.pane = (S.pend && S.pend.length) ? 'pend' : 'menu';
  }

  // An empty list has no pane to be on. Runs before the panes are drawn so the
  // switch and the body can never disagree about which face is up.
  function normalisePane() {
    if (S.pane === 'pend' && !(S.pend && S.pend.length)) S.pane = 'menu';
    if (S.pane === 'held' && !heldShown().length) S.pane = 'menu';   // §457
  }

  function renderSeg() {
    var n = (S.pend && S.pend.length) || 0;
    var hn = heldShown().length;   // §457
    var el = $('seg');
    el.hidden = !n && !hn;
    if (!n && !hn) { el.innerHTML = ''; return; }
    el.innerHTML =
      '<button class="sbtn' + (S.pane === 'menu' ? ' on' : '') + '" type="button" data-pane="menu">'
    +   esc(T('counterSale')) + '</button>'
    + (n ? '<button class="sbtn' + (S.pane === 'pend' ? ' on' : '') + '" type="button" data-pane="pend">'
    +   esc(T('pending')) + '<span class="b">' + n + '</span></button>' : '')
    + (hn ? '<button class="sbtn' + (S.pane === 'held' ? ' on' : '') + '" type="button" data-pane="held">'
    +   esc(T('held')) + '<span class="b">' + hn + '</span></button>' : '');
  }

  function renderPend() {
    var el = $('pane-pend');
    if (!S.pend || !S.pend.length) { el.innerHTML = ''; return; }
    // Newest first, as the list arrives. The newest row's trading day is this
    // list's "today"; any row from another day carries its date, because §49
    // requires the short code be read with its shop and its date and this is
    // the one place two 14s could otherwise sit next to each other. The shop
    // half of that pair is the store this till is locked to.
    //
    // NO CLOCK TIME. placed_at is stored UTC and the shop is not, so a time
    // rendered from it here would be wrong by the offset — and a wrong time at
    // a counter is worse than none. shop_order_date is the LOCATION's own
    // trading day (lib/business-date.js) and is the only date safe to print.
    var top = S.pend[0].shop_order_date || '';
    var h = '<div class="plist">';
    S.pend.forEach(function (o) {
      var d = o.shop_order_date || '';
      var meta = (d && d !== top) ? d : '';
      h += '<button class="wrow" type="button" data-recall="' + o.id + '">'
         + '<span class="n">' + esc(String(o.shop_order_code)) + '</span>'
         + '<span class="who"><b>' + esc(o.recipient_name || '') + '</b>'
         + (meta ? '<i>' + esc(meta) + '</i>' : '') + '</span>'
         + '<span class="amt">' + money(o.total) + '</span>'
         + '</button>';
    });
    el.innerHTML = h + '</div>';
  }

  // Opening one. IT LANDS IN THE RAIL, NOT ON THE SETTLE SCREEN, and that is
  // the point: the cashier is about to take money for a basket somebody else
  // filled in, on a phone, out of sight. Going straight to a total would ask
  // them to confirm a number with nothing behind it — and when the customer
  // says "that's not what I ordered" there would be nothing on screen to check
  // it against. So a recalled order arrives exactly where a basket they built
  // themselves would, and Mark paid is the same button in the same place.
  //
  // IT REPLACES THE BASKET rather than joining it: this screen settles one
  // thing, and a till that could ring up a walk-in and a QR order under a
  // single tender would record one payment against two orders and reconcile
  // against neither.
  //
  // The list row carries no items — the orders LIST is order-level — so the
  // lines come from the detail endpoint. Read-only once here (see renderLines):
  // the customer's order is not the counter's to edit, and the settle path only
  // marks it paid, so a line changed here would be a change nothing saves.
  function recall(id) {
    var o = null, i;
    for (i = 0; i < (S.pend || []).length; i++) if (S.pend[i].id === id) o = S.pend[i];
    if (!o) return;
    // §457 — the till's own bill is held, not dropped. It used to be wiped
    // here without a word.
    if (!holdNow()) return render();
    S.lines = []; S.sel = null; S.customer = null;
    S.recall = {
      id: o.id, order_no: o.order_no, code: o.shop_order_code,
      name: o.recipient_name || '', total: Number(o.total) || 0, loading: true
    };
    S.cxArm = false;
    S.wallet = null; S.useP = false; S.useB = false; S.cashIn = ''; S.err = ''; S.disc = null;
    // The sheet is where the rail lives on a phone, and it is closed by
    // default. Opening it is what makes "check the order" a thing that has
    // happened rather than a thing the cashier could have done.
    S.sheetOpen = true;
    render();
    api('/api/retail-admin/orders/' + o.id).then(function (j) {
      if (!S.recall || S.recall.id !== o.id) return;   // they moved on
      if (!j || !j.success || !j.data) { S.recall.loading = false; return render(); }
      S.lines = (j.data.items || []).map(function (it) {
        return {
          id: it.product_id,
          name: cuT(it.name_en || it.name_cn || '', it.name_cn || it.name_en || ''),
          sku: it.sku || '',
          price: Number(it.unit_price) || 0,
          qty: Number(it.qty) || 0,
          // WHAT THE CUSTOMER CHOSE. A QR order can carry per-line answers —
          // sugar level, an extra shot — and the cashier settling number 12
          // was reading "Latte ×1" with no sign of them, which is the one thing
          // on the screen they might have needed to check against the cup. The
          // admin detail endpoint has always parsed options_json into
          // `it.options`; this mapper simply dropped it.
          opts: Array.isArray(it.options) ? it.options : []
        };
      });
      // §426 — the voucher on the order, if any, and whether it came from a
      // number the customer typed: that is the one the cashier has to check.
      S.recall.voucherOff = Number(j.data.voucher_amount) || 0;
      S.recall.voucherTitle = cuT(j.data.voucher_title_en || j.data.voucher_title_cn || '',
                                  j.data.voucher_title_cn || j.data.voucher_title_en || '') || T('voucher');
      S.recall.typedPhone = Number(j.data.voucher_typed_phone) === 1;
      // §428 — already linked (a typed phone found someone): name them, and do
      // not offer to attach a second customer over the first.
      if (j.data.customer_id) {
        S.recall.customer = custRow({ id: j.data.customer_id, nickname: j.data.nickname || null });
        loadCounterVouchers(S.recall.customer);
      }
      S.recall.total = Number(j.data.total) || S.recall.total;
      S.recall.loading = false;
      render();
    }).catch(function () {
      if (S.recall && S.recall.id === o.id) { S.recall.loading = false; render(); }
    });
  }

  // Backing out. The cashier opened the wrong number, or the customer changed
  // their mind — either way nothing has been charged, so this leaves no trace
  // and lands them back on the list they came from.
  function cancelRecall() {
    S.cxArm = false;
    S.recall = null; S.lines = []; S.sel = null;
    S.wallet = null; S.useP = false; S.useB = false; S.cashIn = ''; S.err = ''; S.disc = null;
    S.view = 'till'; S.pane = 'pend'; S.paneTouched = true;
    render();
  }

  /* ---- §457 held bills ------------------------------------------------
     A CUSTOMER EATING NOW AND PAYING LATER, and the next one already at the
     counter. Hold sets the bill aside ON THIS TABLET and clears the rail; the
     Held face lists what is set aside; a tap brings one back to be added to
     and paid.

     ON THE TABLET, NOT THE SERVER, and that is the decision (§457). An unpaid
     counter order on the server is cancelled by the counter clock after two
     hours, cannot have a line added, spends the customer's credit when it is
     made, and is kept off Pending on purpose. A held bill here is not an order
     at all: nothing is reserved, spent or counted until Mark paid, exactly as
     before, and §93's "every sale it writes is already paid" stays true.

     ONE LIST PER BUSINESS AND SHOP, not per operator as §453's drafts are: a
     held bill belongs to the counter, and the cashier taking over the shift has
     to find the table's bill. No business id, no Hold.

     A HELD BILL ENDS ONLY BY BEING PAID OR EMPTIED. Nothing deletes one by
     age; one from an earlier day carries its date in amber instead, so a
     forgotten bill stays in sight. While one is back on screen every change to
     it is written back (heldSync), so a tablet that dies mid-bill loses
     nothing. */
  var HELD_PREFIX = 'tacet-till-held';
  function heldKey() {
    if (S.tid == null || S.storeId == null) return null;
    return HELD_PREFIX + ':' + S.tid + ':' + S.storeId;
  }
  // Storage that throws, or holds something this code did not write, reads as
  // nothing held rather than breaking the paint.
  function heldRead() {
    var k = heldKey();
    if (!k) return [];
    try {
      var v = JSON.parse(localStorage.getItem(k) || '[]');
      if (!Array.isArray(v)) return [];
      return v.filter(function (b) {
        return b && typeof b.id === 'string' && /^h[a-z0-9]+$/.test(b.id)
          && Array.isArray(b.lines) && b.lines.length > 0;
      });
    } catch (e) { return []; }
  }
  // False when the write did not land — the caller must then keep the bill on
  // screen, because a bill cleared after a failed write is a bill lost.
  function heldWrite(list) {
    var k = heldKey();
    if (!k) return false;
    try {
      if (list.length) localStorage.setItem(k, JSON.stringify(list));
      else localStorage.removeItem(k);
    } catch (e) { return false; }
    S.held = list;
    return true;
  }
  function heldLoad() {
    S.held = heldRead(); S.heldLast = '';
    // §461 — every bill this shop has held tells the server what it holds. A
    // bill held before §461, or whose last send failed, is put right here; one
    // already in step moves nothing.
    S.held.forEach(function (b) { heldStockPush(b.id, b.lines); });
  }
  function heldFind(id) { return S.held.filter(function (b) { return b.id === id; })[0] || null; }
  // What the list shows: everything held except the bill already on screen.
  function heldShown() { return S.held.filter(function (b) { return b.id !== S.heldId; }); }
  function canHold() {
    return S.tid != null && S.view === 'till' && !S.recall && S.lines.length > 0;
  }
  /* What a held bill keeps. The lines whole — the answers and the menu flag
     are what Mark paid posts — and the customer by id with what the rail
     shows. Not the wallet or the credit toggles: those are chosen at payment,
     and §93 keeps both off until tapped. */
  function heldSnap(id, note, at) {
    var prev = heldFind(id);
    return {
      id: id, at: at, note: note || '',
      lines: S.lines.map(function (l) {
        return { key: l.key, id: l.id, name: l.name, sku: l.sku || '',
                 base: l.base, price: l.price, qty: l.qty, menu: !!l.menu,
                 choices: (l.choices || []).slice(), opts: (l.opts || []).slice() };
      }),
      customer: S.customer ? { id: S.customer.id, nickname: S.customer.nickname || null,
                               points: S.customer.points, balance: S.customer.balance } : null,
      // §461 — what the server says this bill has taken off the shelf. Kept on
      // the bill, not beside it, so a reload still knows (see stockOf).
      taken: (prev && prev.taken) || null
    };
  }
  // Newest first, as Pending lists; a bill already in the list keeps its place.
  function heldPut(bill) {
    var list = heldRead(), at = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === bill.id) at = i;
    if (at > -1) list[at] = bill; else list.unshift(bill);
    return heldWrite(list);
  }
  function heldDrop(id) {
    return heldWrite(heldRead().filter(function (b) { return b.id !== id; }));
  }

  /* Set the bill on screen aside and clear the rail. `note` undefined keeps
     the note a held bill already had. True when there is nothing left on
     screen to lose; false when the write failed and the bill is still up. */
  function holdNow(note) {
    if (S.recall || !S.lines.length) return true;
    var prev = S.heldId ? heldFind(S.heldId) : null;
    var id = S.heldId || ('h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
    var bill = heldSnap(id, note !== undefined ? note : (prev ? prev.note : ''),
                        prev ? prev.at : Date.now());
    if (!heldPut(bill)) { S.err = T('didNotSave'); return false; }
    heldStockPush(id, bill.lines);
    S.lines = []; S.sel = null; S.customer = null; S.heldId = null; S.heldLast = '';
    S.wallet = null; S.useP = false; S.useB = false; S.cashIn = ''; S.err = ''; S.disc = null;
    return true;
  }

  function openHoldAsk() {
    if (!canHold() || S.busy) return;
    S.holdOpen = true; render();
  }
  function closeHoldAsk() { S.holdOpen = false; render(); }
  function commitHold() {
    if (!S.holdOpen) return;
    var inp = $('hold-note');
    var note = inp ? String(inp.value || '').trim().slice(0, 40) : undefined;
    S.holdOpen = false;
    holdNow(note);
    render();
  }

  /* Bring a held bill back. ANYTHING ALREADY ON SCREEN IS HELD FIRST: the
     till's own bill goes into the list (no note), and a recalled QR order is
     simply put back — it is still on Pending, untouched. Lines are re-priced
     from today's shelf, base plus the answers' deltas, because the server
     prices shelf lines from the catalogue at Mark paid anyway and the button
     must say what will be charged. A product this shop no longer lists keeps
     its saved line; the server decides. */
  function openHeld(id) {
    var bill = heldRead().filter(function (b) { return b.id === id; })[0];
    if (!bill) { heldLoad(); return render(); }
    if (S.recall) { S.recall = null; S.lines = []; S.sel = null; S.cxArm = false; }
    if (S.lines.length && !holdNow()) return render();
    S.lines = bill.lines.map(function (l) {
      var line = { key: l.key || lineKey(l.id, l.choices), id: l.id, name: l.name, sku: l.sku || '',
                   base: Number(l.base) || 0, price: Number(l.price) || 0,
                   qty: Number(l.qty) || 1, menu: !!l.menu,
                   choices: (l.choices || []).slice(), opts: (l.opts || []).slice() };
      var p = S.products.filter(function (x) { return x.id === l.id; })[0];
      if (p) {
        line.name = fullName(p); line.sku = p.sku || line.sku; line.menu = !!p.on_menu;
        line.base = Number(p.price) || 0;
        line.price = Math.round(line.base * 100 + optsDelta(line.opts) * 100) / 100;
      }
      return line;
    });
    S.heldId = bill.id; S.heldLast = '';
    S.sel = null;
    S.customer = bill.customer ? custRow({ id: bill.customer.id, nickname: bill.customer.nickname,
                                           points: bill.customer.points, balance: bill.customer.balance }) : null;
    S.wallet = null; S.useP = false; S.useB = false; S.cashIn = ''; S.err = ''; S.disc = null;
    // Back to the menu, so the coffee they just ordered is one tap away; and
    // on a phone the sheet opens, as it does for a recall.
    S.pane = 'menu'; S.paneTouched = true; S.sheetOpen = true;
    render();
    if (S.customer) loadCounterVouchers(S.customer);
  }

  /* Every change to a held bill on screen is written back, and a bill emptied
     line by line is over. Runs at the top of every paint; writes only when the
     bill changed. Quiet once paid: the success path has already removed it. */
  function heldSync() {
    if (!S.heldId || S.done || S.recall) return;
    if (!S.lines.length) {
      heldStockPush(S.heldId, []);     // §461 — an emptied bill gives its stock back
      heldDrop(S.heldId); S.heldId = null; S.heldLast = ''; return;
    }
    var prev = heldFind(S.heldId);
    var bill = heldSnap(S.heldId, prev ? prev.note : '', prev ? prev.at : Date.now());
    var snap = JSON.stringify(bill);
    if (snap === S.heldLast) return;
    if (heldPut(bill)) { S.heldLast = snap; heldStockPush(S.heldId, bill.lines); }
  }

  /* §461 — A HELD BILL TAKES ITS SHELF LINES WHILE IT IS HELD. Ash, 2026-10-12:
     "customer at the till might eat and pay later. that's why till orders
     should immediately deduct from stock." Every time what a held bill holds
     changes — held, added to, a line taken off, emptied — the whole bill goes
     to the server, which moves the shelf by the difference and answers with
     what the bill now holds. Mark paid sends the bill's id, and the server
     gives the units back the instant before the sale takes them.

     QUIET ON FAILURE, and that is safe rather than lazy: a bill whose stock did
     not reach the server is still held here, and Mark paid settles the count
     exactly as it did before §461. The next change, or the next time this
     shop's bills are loaded, sends it again.

     ONE REQUEST PER BILL AT A TIME. A change made while one is out waits and
     goes after it, so two answers cannot arrive in the wrong order; a bill
     paid in that time sends nothing more. */
  var HELD_PAID = '\u0000paid';
  function heldStockKey(lines) {
    return JSON.stringify((lines || []).map(function (l) {
      return [l.id, l.qty, (l.choices || []).slice().sort(function (a, b) { return a - b; })];
    }));
  }
  function heldStockPush(id, lines) {
    if (!id || S.storeId == null || S.heldSent[id] === HELD_PAID) return;
    var key = heldStockKey(lines);
    if (S.heldBusy[id]) { S.heldBusy[id].next = lines; return; }
    if (S.heldSent[id] === key) return;
    var storeId = S.storeId;
    S.heldBusy[id] = { next: null, after: null };
    api('/api/retail-admin/orders/till-held/' + encodeURIComponent(id), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ store_id: storeId, lines: (lines || []).map(function (l) {
        var it = { product_id: l.id, qty: l.qty };
        if (l.choices && l.choices.length) it.choices = l.choices;
        return it;
      }) })
    }).then(function (j) {
      if (j && j.success && j.data && S.heldSent[id] !== HELD_PAID) {
        S.heldSent[id] = key;
        heldTook(id, j.data.taken || {}, storeId);
      }
    }).catch(function () { /* see above: Mark paid settles it */ }).then(function () {
      var busy = S.heldBusy[id] || {};
      delete S.heldBusy[id];
      if (busy.next) heldStockPush(id, busy.next);
      if (busy.after) busy.after();
    });
  }
  /* What the server says a bill now holds. The grid's figures move by the
     difference so the next sale's tiles are honest before the catalogue is
     read again. If that read has already landed, this takes the units off a
     second time until the next one: the tile reads LOW for a moment, never
     high, which is the direction that cannot sell a bottle twice. */
  function heldTook(id, taken, storeId) {
    var b = heldFind(id);
    var was = (S.heldTaken && S.heldTaken[id]) || (b && b.taken) || {};
    if (storeId === S.storeId) {
      var seen = {};
      Object.keys(was).concat(Object.keys(taken)).forEach(function (k) {
        if (seen[k]) return; seen[k] = true;
        var d = (Number(taken[k]) || 0) - (Number(was[k]) || 0);
        if (d && S.stock[k] != null) S.stock[k] = Math.max(0, S.stock[k] - d);
      });
    }
    S.heldTaken = S.heldTaken || {};
    S.heldTaken[id] = taken;
    if (b) { b.taken = taken; heldPut(b); }
    render();
  }

  function twoDigit(n) { return (n < 10 ? '0' : '') + n; }
  // The tablet's own day and clock: a held bill never leaves this device, so
  // its time is this device's — unlike a QR order's placed_at (see renderPend).
  function heldDay(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + twoDigit(d.getMonth() + 1) + '-' + twoDigit(d.getDate());
  }
  function heldTime(ms) {
    var d = new Date(ms);
    return twoDigit(d.getHours()) + ':' + twoDigit(d.getMinutes());
  }

  /* The list. The row says what the cashier looks for: when it was held, the
     note they wrote ("window table"), or the customer, or what is on it. The
     amount is the bill before any voucher — the voucher is worked out again
     when it is opened. No new word anywhere on the row. */
  function renderHeld() {
    var el = $('pane-held');
    var list = heldShown();
    if (!list.length) { el.innerHTML = ''; return; }
    var today = heldDay(Date.now());
    var h = '<div class="plist">';
    list.forEach(function (b) {
      var names = b.lines.map(function (l) {
        return (Number(l.qty) > 1 ? l.name + ' ×' + l.qty : l.name);
      }).join(', ');
      var title = b.note || (b.customer && b.customer.nickname) || names;
      var day = heldDay(b.at);
      var old = day !== today;
      var meta = [];
      if (old) meta.push(day);
      if (title !== names) meta.push(names);
      var sub = 0;
      b.lines.forEach(function (l) { sub += (Number(l.qty) || 0) * (Number(l.price) || 0); });
      h += '<button class="wrow" type="button" data-held="' + esc(b.id) + '">'
         + '<span class="n">' + esc(heldTime(b.at)) + '</span>'
         + '<span class="who"><b>' + esc(title) + '</b>'
         + (meta.length ? '<i' + (old ? ' class="old"' : '') + '>' + esc(meta.join(' · ')) + '</i>' : '')
         + '</span>'
         + '<span class="amt">' + money(dueNow(Math.round(sub * 100) / 100)) + '</span>'
         + '</button>';
    });
    el.innerHTML = h + '</div>';
  }

  /* The note sheet. BUILT ONCE PER OPENING, never on a repaint: the order poll
     repaints every fifteen seconds, and a rebuild would throw away a half-typed
     note and drop the keyboard — the bug §428's new-customer fields had. The
     note goes in through the property, never the markup. */
  function renderHoldAsk() {
    var el = $('holdpick');
    el.hidden = !S.holdOpen;
    if (!S.holdOpen) { el.innerHTML = ''; el.removeAttribute('data-built'); return; }
    if (el.getAttribute('data-built') === _lang) return;
    var typed = $('hold-note');
    var prev = S.heldId ? heldFind(S.heldId) : null;
    var keep = typed ? typed.value : (prev ? prev.note : '');
    el.innerHTML = '<div class="ssheet"><div class="hd">' + esc(T('hold')) + '</div>'
      + '<div class="cnew"><input id="hold-note" type="text" maxlength="40" autocomplete="off"'
      + ' placeholder="' + esc(T('noteOpt')) + '"></div>'
      + '<button class="srow" type="button" data-hold="go"><span>' + esc(T('hold')) + '</span></button>'
      + '<button class="srow" type="button" data-hold="close"><span>' + esc(T('cancel')) + '</span></button>'
      + '</div>';
    $('hold-note').value = keep || '';
    el.setAttribute('data-built', _lang);
  }

  // What the settle screen owes. A recalled order states the SERVER's total —
  // it was priced and taxed when the customer placed it — and a basket derives
  // its own. Re-deriving a QR order's total here from lines this till never saw
  // is how the counter ends up asking for a different number than the one on
  // the customer's screen.
  function settleDue() {
    if (S.recall) return S.recall.total;
    var sub = subtotal(), cv = counterVoucher(sub);
    return dueNow(Math.round((sub - (cv ? cv.off : 0) - discOff(sub)) * 100) / 100);
  }

  /* ── §474 · a manager's hand discount ──────────────────────────────────
     Up to 20% off what is left after the voucher, before tax, with a reason.
     THE ARITHMETIC MIRRORS lib/till-discount.js and is NOT the authority: the
     server works the figure out again from what is posted and charges its own.
     A percentage follows the bill as lines change; a typed amount that the bill
     has shrunk under (more than 20% of what is left) is dropped and said. */
  var DISC_MAX_PCT = 20;
  var DISC_PCTS = [5, 10, 15, 20];
  var DISC_REASONS = [['damaged', 'damaged'], ['friends_family', 'friendsFamily'],
                      ['complaint', 'complaint'], ['other', 'other']];
  function discReasonLabel(r) {
    for (var i = 0; i < DISC_REASONS.length; i++) if (DISC_REASONS[i][0] === r) return T(DISC_REASONS[i][1]);
    return String(r || '');
  }
  function discBase(sub) {
    var cv = counterVoucher(sub);
    return Math.max(0, Math.round((sub - (cv ? cv.off : 0)) * 100) / 100);
  }
  function discCeil(base) { return Math.round((base * DISC_MAX_PCT / 100) * 100) / 100; }
  function discOff(sub) {
    var d = S.disc;
    if (!d || S.recall) return 0;
    var base = discBase(sub);
    if (!(base > 0)) return 0;
    var off = d.percent != null ? Math.round((base * d.percent / 100) * 100) / 100 : d.amount;
    if (d.amount != null && d.amount > discCeil(base)) return 0;
    return off > 0 ? off : 0;
  }
  function discSync() {
    if (!S.disc) return;
    if (S.recall || !S.lines.length) { S.disc = null; return; }
    if (!(discOff(subtotal()) > 0)) { S.disc = null; S.err = T('discMax'); }
  }
  // §475 — may a discount be given on this till at all: by this operator, or
  // by a manager approving with their PIN.
  function discAllowed() { return !!(S.canDisc || (S.approvers && S.approvers.length)); }
  function openDiscAsk() {
    if (!discAllowed() || S.recall || !S.lines.length || S.busy) return;
    var d = S.disc;
    S.discDraft = { percent: d ? d.percent : null, reason: d ? d.reason : '',
                    approver: d && d.approver_id ? d.approver_id : null };
    S.discOpen = true; render();
  }
  function closeDiscAsk() { S.discOpen = false; S.discDraft = null; render(); }
  // BUILT ONCE PER OPENING, like the hold note: a repaint must not throw away a
  // half-typed amount or drop the keyboard. Picks are toggled in place.
  function renderDiscAsk() {
    var el = $('discpick');
    el.hidden = !S.discOpen;
    if (!S.discOpen) { el.innerHTML = ''; el.removeAttribute('data-built'); return; }
    if (el.getAttribute('data-built') === _lang) return;
    var d = S.disc, dr = S.discDraft || {};
    var amt = $('disc-amt'), nt = $('disc-note');
    var keepAmt = amt ? amt.value : (d && d.amount != null ? String(d.amount) : '');
    var keepNote = nt ? nt.value : (d && d.note ? d.note : '');
    var h = '<div class="ssheet"><div class="hd">' + esc(T('discount')) + '</div><div class="dpcts">';
    DISC_PCTS.forEach(function (p) {
      h += '<button class="srow' + (dr.percent === p ? ' on' : '') + '" type="button" data-disc-pct="' + p + '">' + p + '%</button>';
    });
    h += '</div><div class="cnew"><input id="disc-amt" type="text" inputmode="decimal" maxlength="9" autocomplete="off"'
       + ' placeholder="' + esc(T('amount')) + '"></div>'
       + '<div class="hd">' + esc(T('reason')) + '</div>';
    DISC_REASONS.forEach(function (r) {
      h += '<button class="srow' + (dr.reason === r[0] ? ' on' : '') + '" type="button" data-disc-why="' + r[0] + '">'
         + '<span>' + esc(T(r[1])) + '</span></button>';
    });
    h += '<div class="cnew"><input id="disc-note" type="text" maxlength="120" autocomplete="off"'
       + ' placeholder="' + esc(T('note')) + '"></div>';
    // §475 — signed in as someone who cannot give one: a manager approves it.
    // The PIN is never put back into a rebuilt sheet from S: only what is still
    // typed in the box survives a language switch.
    var pinBox = $('disc-pin'), keepPin = pinBox ? pinBox.value : '';
    if (!S.canDisc) {
      h += '<div class="hd">' + esc(T('manager')) + '</div>';
      S.approvers.forEach(function (a) {
        h += '<button class="srow' + (String(dr.approver) === String(a.id) ? ' on' : '') + '" type="button"'
           + ' data-disc-mgr="' + esc(String(a.id)) + '"><span>' + esc(a.name) + '</span></button>';
      });
      h += '<div class="cnew"><input id="disc-pin" type="password" inputmode="numeric" pattern="[0-9]*"'
         + ' maxlength="6" autocomplete="off" placeholder="' + esc(T('pin')) + '"></div>';
    }
    h += '<div class="derr" id="disc-err"></div>'
       + '<button class="srow" type="button" data-disc="go"><span>' + esc(T('apply')) + '</span></button>'
       + (d ? '<button class="srow" type="button" data-disc="off"><span>' + esc(T('removeDiscount')) + '</span></button>' : '')
       + '<button class="srow" type="button" data-disc="close"><span>' + esc(T('cancel')) + '</span></button>'
       + '</div>';
    el.innerHTML = h;
    $('disc-amt').value = keepAmt || '';
    $('disc-note').value = keepNote || '';
    if ($('disc-pin')) $('disc-pin').value = keepPin || '';
    el.setAttribute('data-built', _lang);
  }
  // A percentage and a typed amount are one choice: picking either clears the other.
  function pickDiscPct(p) {
    if (!S.discDraft) return;
    S.discDraft.percent = S.discDraft.percent === p ? null : p;
    var amt = $('disc-amt'); if (amt && S.discDraft.percent != null) amt.value = '';
    var bs = $('discpick').querySelectorAll('[data-disc-pct]');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', Number(bs[i].getAttribute('data-disc-pct')) === S.discDraft.percent);
  }
  function pickDiscWhy(r) {
    if (!S.discDraft) return;
    S.discDraft.reason = r;
    var bs = $('discpick').querySelectorAll('[data-disc-why]');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-disc-why') === r);
  }
  function pickDiscMgr(id) {
    if (!S.discDraft) return;
    S.discDraft.approver = id;
    var bs = $('discpick').querySelectorAll('[data-disc-mgr]');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-disc-mgr') === String(id));
    var p = $('disc-pin'); if (p) p.focus();
  }
  function discTyped() {
    if (!S.discDraft) return;
    var amt = $('disc-amt');
    if (amt && String(amt.value || '').trim()) {
      S.discDraft.percent = null;
      var bs = $('discpick').querySelectorAll('[data-disc-pct]');
      for (var i = 0; i < bs.length; i++) bs[i].classList.remove('on');
    }
  }
  function commitDisc() {
    if (!S.discOpen) return;
    var dr = S.discDraft || {};
    var err = $('disc-err');
    var say = function (k) { if (err) err.textContent = T(k); };
    var raw = String(($('disc-amt') || {}).value || '').trim().replace(/[\u00a5\uffe5,\s]/g, '');
    var note = String(($('disc-note') || {}).value || '').trim().slice(0, 120);
    var next = { percent: null, amount: null, reason: dr.reason || '', note: note };
    if (dr.percent != null) next.percent = dr.percent;
    else if (raw) next.amount = Math.round((Number(raw) || 0) * 100) / 100;
    if (next.percent == null && !(next.amount > 0)) { var a = $('disc-amt'); if (a) a.focus(); return; }
    if (!next.reason || (next.reason === 'other' && !note)) return say('giveReason');
    if (next.amount != null && next.amount > discCeil(discBase(subtotal()))) return say('discMax');
    if (S.canDisc) {
      S.disc = next; S.discOpen = false; S.discDraft = null; S.err = '';
      return render();
    }
    // §475 — a manager's PIN, checked now so a wrong one is heard here rather
    // than at Mark paid. The sale sends it again and the server checks again.
    var pinEl = $('disc-pin');
    var pin = pinEl ? String(pinEl.value || '').trim() : '';
    if (!dr.approver || !/^[0-9]{4,6}$/.test(pin)) return say('pickManager');
    if (S.discBusy) return;
    S.discBusy = true;
    fetch('/api/retail-admin/till-pin/check', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approver_id: dr.approver, pin: pin })
    }).then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (j) {
        S.discBusy = false;
        if (!S.discOpen) return;
        if (!j || !j.success) {
          if (pinEl) pinEl.value = '';
          return say(j && j.error === 'till_pin_locked' ? 'pinLocked' : 'wrongPin');
        }
        next.approver_id = dr.approver; next.pin = pin; next.by = j.data && j.data.name;
        S.disc = next; S.discOpen = false; S.discDraft = null; S.err = '';
        render();
      })
      .catch(function () { S.discBusy = false; say('wrongPin'); });
  }
  function removeDisc() { S.disc = null; S.discOpen = false; S.discDraft = null; render(); }

  /* ── §426 · the attached customer's voucher at THIS counter ────────────
     A located voucher the customer holds comes off a till sale with no tap —
     attaching them is the act. The terms arrive with the customer (see
     attachCustomer) and are matched to the store they were read for, so a till
     switched to another shop never carries the last shop's discount.

     THE ARITHMETIC MIRRORS computeVoucherDiscount and is NOT the authority: the
     server picks the best voucher again when the sale is posted and charges its
     own figure. Best one wins, a minimum spend binds, an amount off never
     exceeds the goods. Off the goods before tax, as the server does it. */
  function counterVoucher(sub) {
    var c = S.customer;
    if (S.recall || !c || !c.cv || String(c.cvStore) !== String(S.storeId)) return null;
    var best = null;
    c.cv.forEach(function (v) {
      if (!(sub >= (Number(v.min_subtotal) || 0))) return;
      var off = v.type === 'percent'
        ? Number((sub * Math.max(0, Math.min(100, Number(v.value) || 0)) / 100).toFixed(2))
        : Math.min(Math.max(0, Number(v.value) || 0), sub);
      if (off > 0 && (!best || off > best.off)) {
        best = { off: off,
                 title: cuT(v.title_en || v.title_cn || '', v.title_cn || v.title_en || '') || T('voucher') };
      }
    });
    return best;
  }

  /* ── Store credit on this sale (§93) ────────────────────────────────────
     What the attached customer's points and wallet COULD take off this bill,
     and what the cashier has actually turned on.

     THE ARITHMETIC MIRRORS THE SERVER'S, for the counter case only, and that is
     why it is allowed to be this short: a counter sale has no shipping and no
     packing, so `pointsRedeemableBase` collapses to the whole tax-inclusive
     bill and both ceilings the server applies become the same number. Nothing
     here is the authority — manualOrderCredit clamps what is really spent, and
     a disagreement of one fen shows up as a fen of cash, not as a wrong sale.

     POINTS FIRST, THEN BALANCE, because points expire and a wallet does not:
     spending the perishable tender first is the answer that costs the customer
     least. Same order the server applies them in, so the figure on this screen
     and the figure it charges cannot come apart.

     NOT OFFERED ON A RECALLED ORDER, and the reason is the settle path rather
     than the screen: a recall PATCHes the existing row's status and nothing
     else, so credit chosen here would be shown, charged as though it applied,
     and never deducted. The customer already picked their tender on their own
     phone. A control that silently does nothing is worse than no control. */
  function creditOffer() {
    var out = { pMax: 0, pAmt: 0, bAmt: 0, applied: 0 };
    if (S.recall || !S.customer) return out;
    var gross = settleDue();
    if (!(gross > 0)) return out;
    var rate = (S.pts && S.pts.rate > 0) ? S.pts.rate : 1;
    var havePts = Math.max(0, Math.floor(Number(S.customer.points) || 0));
    var haveBal = Math.max(0, Number(S.customer.balance) || 0);
    // Points beyond what this bill can absorb would simply be burned, so the
    // offer is capped there — the same clamp the server applies, not a
    // presentation choice.
    out.pMax = Math.min(havePts, Math.ceil(gross * rate));
    out.havePts = havePts;
    out.haveBal = haveBal;
    var pAmt = S.useP ? Math.min(Math.floor((out.pMax / rate) * 100) / 100, gross) : 0;
    out.pAmt = pAmt;
    out.bAmt = S.useB ? Math.round(Math.min(haveBal, gross - pAmt) * 100) / 100 : 0;
    out.applied = Math.round((out.pAmt + out.bAmt) * 100) / 100;
    /* What each tender WOULD take if it were switched on now — the figure the
       row shows while it is still off, so the cashier can answer "how much do
       my points cover?" without tapping and then having to undo it.
       `bWould` is measured against the points state as it stands, because
       turning points on genuinely leaves the wallet less to do. */
    out.pWould = Math.min(Math.floor((out.pMax / rate) * 100) / 100, gross);
    out.bWould = Math.round(Math.min(haveBal, gross - pAmt) * 100) / 100;
    return out;
  }
  // What a wallet still has to take once the credit is off. This is the figure
  // the settle screen states and the one the card machine is handed.
  function cashDue() {
    return Math.max(0, Math.round((settleDue() - creditOffer().applied) * 100) / 100);
  }
  function creditApplied() { return creditOffer().applied; }
  /* §450 — the international card's 4%, on what the CARD takes: the residual
     after credit, never the gross. The same arithmetic as lib/card-surcharge.js
     (whole fen, rounded) — a preview only; the server computes the figure it
     charges and the done screen reads that one back. */
  var CARD_FEE_PCT = 4;
  function cardFee() {
    if (S.wallet !== 'intl_card') return 0;
    var fen = Math.round(cashDue() * 100);
    return fen > 0 ? Math.round(fen * CARD_FEE_PCT / 100) / 100 : 0;
  }
  // What the terminal is keyed with: the residual plus the card's 4%.
  function chargeDue() { return Math.round((cashDue() + cardFee()) * 100) / 100; }
  /* The tender to record when CREDIT settled the whole bill and no wallet took
     anything. Points lead because they apply first and are the larger half of
     any sale they cover; 'balance' is named only when the wallet did it alone.
     Both are values the server already accepts on this route (ALLOWED_PAY) and
     — as of §93 — actually deducts, so the word on the row is now true. */
  function creditTender() {
    var cr = creditOffer();
    return cr.pAmt > 0 ? 'points' : 'balance';
  }
  /* The credit half of the create payload. `points_to_use` is the WHOLE offer,
     not a figure this screen worked out for itself: manualOrderCredit clamps it
     against the shop's redeem rate and the bill actually due, and letting the
     server do that is what stops the till from having to re-implement two
     settings it does not own. `use_balance` is a flag for the same reason — how
     much the wallet may take is the server's rule (never shipping, never past
     what points left behind), not this screen's. */
  function creditBody() {
    var cr = creditOffer();
    var out = {};
    if (S.useP && cr.pMax > 0) out.points_to_use = cr.pMax;
    if (S.useB && cr.bWould > 0) out.use_balance = true;
    return out;
  }

  // Walk-ins are anonymous. Attaching a customer is optional and never blocks
  // the sale; when one is attached the row shows the two things that change
  // what the cashier can offer — points and wallet.
  function renderCust() {
    var el = $('cust');
    // On a phone .cust IS the order sheet's header, so it carries the sheet's
    // title and count. On a tablet the rail has no header and CSS hides both.
    // NO TITLE WORD. The only locked pair for this noun is the PLURAL one the
    // admin uses for its order lists; the singular has no locked Chinese half,
    // so it is not written. The grab handle and a sheet full of line items
    // already say what this is.
    //
    // The pair is not quoted here on purpose: the gate forbids Chinese anywhere
    // in this file outside STRINGS, comments included, and it is right to — a
    // character that never renders is still one nobody checked against a
    // source. This comment tripped that rule on its first push.
    var head = '<span class="sheet-ttl">'
      + (S.lines.length ? '<span class="ct">' + itemCount() + '</span>' : '') + '</span>';
    // A RECALLED ORDER OWNS THIS ROW. It names the number the customer is
    // holding up and the name they gave, so the check the cashier is making —
    // "is this the right order?" — has both halves on screen above the lines
    // they are checking. The customer control is not offered: this order
    // already belongs to somebody, the settle path does not write customer_id,
    // and a + Customer button here would be a control that silently does
    // nothing. Cancel is the way out, and costs nothing because nothing has
    // been charged yet.
    //
    // §428 — AND NOW IT IS OFFERED. A customer can be attached to a recalled
    // order (POST /orders/:id/counter-customer writes it), so the cashier who
    // has checked a Ramada badge can put the discount on the order the
    // employee already placed, instead of cancelling it and ringing it again.
    if (S.recall) {
      var rc = S.recall.customer;
      el.className = 'cust on';
      el.innerHTML = head
        + '<span class="who">' + esc(String(S.recall.code))
        + (S.recall.name ? ' · ' + esc(S.recall.name) : '')
        + '<div class="sub">' + esc(rc ? (rc.nickname || ('#' + rc.id)) : (S.recall.order_no || '')) + heldLabels(rc) + '</div></span>'
        + giveButtons(rc)
        + (!rc && !S.recall.loading
            ? '<button class="cbtn" type="button" data-cust="pick">' + esc(T('customer')) + '</button>' : '')
        // BACK, NOT CANCEL. This control closes the order without touching it,
        // and it said "Cancel" until 2026-09-08 — beside a real Cancel-the-order
        // action that is the same word for opposite outcomes, and the dangerous
        // one is the one a cashier would reach for by habit.
        + '<button class="cbtn" type="button" data-recall-cancel="1">' + esc(T('back')) + '</button>';
      return;
    }
    if (S.customer) {
      el.className = 'cust on';
      el.innerHTML = head + '<span class="who">' + esc(S.customer.nickname || ('#' + S.customer.id))
        + '<div class="sub">' + esc(T('points')) + ' ' + (Number(S.customer.points) || 0)
        + ' · ' + esc(T('wallet')) + ' ' + money(S.customer.balance) + heldLabels(S.customer) + '</div></span>'
        + giveButtons(S.customer)
        + '<button class="cbtn" type="button" data-cust="clear">' + esc(T('remove')) + '</button>';
    } else {
      el.className = 'cust';
      el.innerHTML = head + '<span class="who">' + esc(T('guest')) + '</span>'
        + '<button class="cbtn" type="button" data-cust="pick">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
        + esc(T('customer')) + '</button>';
    }
  }

  /* WHAT THEY ALREADY HOLD HERE, as a tick and the voucher's own title
     ("✓ Ramada Staff"), so the cashier sees it the moment the customer is
     attached — before a single product is on the bill, which is when the
     discount line itself first appears. Reported from the counter, 2026-10-05:
     after a give the button goes (they hold it now), and with an empty bill
     nothing on screen said so. Only what still applies HERE is listed — the
     same `cv` list the discount is worked out from — so a voucher used up or
     expired shows nothing, which is the truth at this counter. No new word: a
     tick and the merchant's own title. */
  function heldLabels(c) {
    if (!c || !c.cv || !c.cv.length || String(c.cvStore) !== String(S.storeId)) return '';
    return c.cv.map(function (v) {
      var title = cuT(v.title_en || v.title_cn || '', v.title_cn || v.title_en || '') || T('voucher');
      return ' · <b class="held">\u2713 ' + esc(title) + '</b>';
    }).join('');
  }

  /* §428 — THIS LOCATION'S VOUCHERS THE CUSTOMER COULD BE GIVEN, one button
     each, named by the voucher's own title ("Give Ramada Staff"). Only what the
     server listed as givable at THIS store is drawn, and the server checks the
     same list again on the give — the till cannot offer an online coupon. */
  function giveButtons(c) {
    if (!c || !c.give || !c.give.length || String(c.cvStore) !== String(S.storeId)) return '';
    return c.give.map(function (v) {
      var title = cuT(v.title_en || v.title_cn || '', v.title_cn || v.title_en || '') || T('voucher');
      return '<button class="cbtn" type="button" data-give="' + esc(String(v.id)) + '"'
        + (S.busy ? ' disabled' : '') + '>' + esc(T('give') + ' ' + title) + '</button>';
    }).join('');
  }

  // What this customer holds here (`cv`) and could be given here (`give`), read
  // for the store the till is on. Both stay with the customer object, so they
  // leave with the customer.
  function loadCounterVouchers(c) {
    var storeId = S.storeId;
    return api('/api/retail-admin/customers/' + encodeURIComponent(c.id) + '/counter-vouchers?store_id='
        + encodeURIComponent(storeId)).then(function (j) {
      if (!j || !j.success) return;
      c.cv = j.data || []; c.give = j.givable || []; c.cvStore = storeId;
      render();
    }).catch(function () { /* full price on screen; the server still decides */ });
  }

  // The chosen answers on a recalled QR line, one per row, under the product
  // they qualify. `Question: Answer` — a bare "Yes" under a latte tells the
  // cashier nothing, and the kitchen ticket beside them prints it the same way
  // (lib/feie.js). The admin endpoint backfills the question for older rows, so
  // an entry with no question left is drawn as its answer alone rather than as
  // a stray colon. §183 — a TILL sale now reaches this too: until it, a counter
  // line carried no options and this ran only for a recalled QR order.
  function optsHtml(opts) {
    if (!opts || !opts.length) return '';
    var h = '';
    var seen = {};
    for (var i = 0; i < opts.length; i++) {
      var o = opts[i] || {};
      // A REPEATED PICK (two Medjool Boats) is the same entry written again; it
      // reads as one row with a count, the way the line's own quantity does —
      // counted where it first appears, wherever its repeats sit (a recalled
      // phone order may carry A, B, A).
      var n = 1;
      if (o.choice_id != null) {
        var key = o.choice_id + '|' + (o.label || '');
        if (seen[key]) continue;
        seen[key] = 1;
        for (var k = i + 1; k < opts.length; k++)
          if (opts[k] && opts[k].choice_id === o.choice_id && (opts[k].label || '') === (o.label || '')) n++;
      }
      var a = cuT(o.label || o.label_en || '', o.label_cn || o.label || o.label_en || '');
      if (!a) continue;
      if (n > 1) a += ' \u00d7' + n;
      var q = cuT(o.question_en || '', o.question_cn || o.question_en || '');
      h += '<div class="lno">' + esc(q ? q + ': ' + a : a) + '</div>';
    }
    return h;
  }

  function renderLines() {
    if (!S.lines.length) {
      $('lines').innerHTML = '<div class="empty"><p>' + esc(T('noLines')) + '</p></div>';
      return;
    }
    var h = '';
    S.lines.forEach(function (l, i) {
      // A RECALLED ORDER IS READ-ONLY. The customer filled this basket on their
      // own phone; the counter's job here is to check it and take the money, not
      // to rewrite it. And it could not rewrite it if it tried — the settle path
      // for a recall PATCHes the status and nothing else, so an edit made here
      // would change the screen, charge the original total, and print the
      // original ticket. Better that the controls are not there at all.
      var ro = !!S.recall;
      var sel = !ro && S.sel === i;
      h += '<button class="ln' + (sel ? ' sel' : '') + '" type="button"'
         + (ro ? ' disabled' : ' data-line="' + i + '"') + '>'
         + '<span class="nm">' + (l.qty > 1 ? '<span class="q">×' + l.qty + '</span>' : '') + esc(l.name)
         + optsHtml(l.opts)
         + '<div class="sb">' + (l.sku ? '<span class="sku">' + esc(l.sku) + '</span>' : '')
         + '<span>' + money(l.price) + '</span></div></span>'
         + '<span class="tt">' + money(l.qty * l.price) + '</span></button>';
      if (ro) return;
      // ALWAYS EMITTED, never conditional. On a tablet CSS shows this only for
      // the selected line, which is exactly the old behaviour; on a phone the
      // sheet is opened on purpose and has the room, so every line carries its
      // own stepper and a correction is one tap instead of three.
      //
      // It is a SIBLING of .ln rather than a child because .ln is a <button>,
      // and a button cannot contain buttons. That is why the phone layout puts
      // the stepper under its line instead of inline as the mockup drew it.
      {
        var st = stockOf(l.id);
        // §183 — the SHELF, across every line carrying this product. One latte
        // hot and one latte iced are two lines and one shelf, and a cap that
        // measured this line alone would let the pair walk past it.
        var capped = st != null && inCart(l.id) >= st;
        h += '<div class="lctl' + (sel ? ' sel' : '') + '" data-for="' + i + '">'
           + '<span class="qgrp">'
           + '<button class="step" type="button" data-q="-1" data-i="' + i + '">&minus;</button>'
           + '<span class="stepn">' + l.qty + '</span>'
           + '<button class="step" type="button" data-q="1" data-i="' + i + '"' + (capped ? ' disabled' : '') + '>+</button>'
           + '</span>'
           + '<span class="lsp"></span>'
           + '<button class="rm" type="button" data-q="x" data-i="' + i + '">' + esc(T('remove')) + '</button>'
           + '</div>';
      }
    });
    $('lines').innerHTML = h;
  }

  function renderFoot() {
    var sub = subtotal();
    // A recalled order states the SERVER's total, not one re-derived from the
    // lines just fetched. They should agree, and if they ever do not, the
    // number the customer was shown on their own phone is the one the counter
    // must ask for — settleDue() is that number, and it is the one the settle
    // screen and this button both read so they cannot disagree.
    var due = settleDue();
    // NO summary row. On a counter sale the subtotal IS the total — nothing
    // ships, nothing is boxed, nothing is discounted — so a subtotal line would
    // print the same figure twice, one line apart. That is noise, not a
    // reconciliation. The row returns the moment something can make the two
    // differ — and TAX is that moment (audit I-03): a shop that adds tax at the
    // till has a subtotal and a total that are two numbers, and the cashier has
    // to be able to read both to the customer. An inclusive shop shows the tax
    // as what it is, a share of the one figure, and still prints no subtotal.
    // Suppressed for a recalled order: its tax was computed and stored when the
    // customer placed it, and re-deriving a split here from the lines would put
    // a second arithmetic on screen that nothing guarantees matches the first.
    //
    // §426 — A VOUCHER IS THE OTHER THING THAT MAKES THEM DIFFER. With one on,
    // the subtotal, the voucher by its own title and the tax on what is left
    // are each a line; with none, this draws exactly what it drew before.
    var row = function (a, b) { return '<div><span>' + esc(a) + '</span><span>' + b + '</span></div>'; };
    var cv = counterVoucher(sub);
    var off = cv ? cv.off : 0;
    var dOff = discOff(sub);   // §474
    var net = Math.round((sub - off - dOff) * 100) / 100;
    var sums = '';
    if (S.recall) {
      // The recalled order's voucher, as the server stored it. A discount found
      // from a typed number carries the check and the control that answers it.
      if (!S.recall.loading && S.recall.voucherOff > 0) {
        sums += row(S.recall.voucherTitle, '−' + money(S.recall.voucherOff));
        if (S.recall.typedPhone) {
          sums += '<div class="vck"><span>' + esc(T('typedPhone')) + '</span>'
                + '<button class="cbtn" type="button" data-rm-voucher="1"' + (S.busy ? ' disabled' : '') + '>'
                + esc(T('removeDiscount')) + '</button></div>';
        }
      }
    } else if (S.lines.length && (S.tax || off > 0 || dOff > 0)) {
      if (off > 0 || dOff > 0 || (S.tax && S.tax.mode === 'exclusive')) sums += row(T('subtotal'), money(sub));
      if (off > 0) sums += row(cv.title, '−' + money(off));
      // §474 — after the voucher, which it is worked on. Named by its reason.
      if (dOff > 0) {
        sums += row(T('discount') + (S.disc.percent != null ? ' ' + S.disc.percent + '%' : '')
                    + ' · ' + discReasonLabel(S.disc.reason), '−' + money(dOff));
      }
      if (S.tax) sums += row(S.tax.label, money(taxOn(net)));
    }
    $('sums').innerHTML = sums;
    $('tot-lb').textContent = T('total');
    $('tot-amt').textContent = money(due);
    // A recall is payable as soon as its lines are on screen — never while they
    // are still in flight, which is the one moment the cashier could confirm a
    // total without having seen what is behind it.
    var ready = S.recall ? !S.recall.loading : S.lines.length > 0;
    var b = $('pay');
    b.disabled = !ready;
    b.textContent = ready ? T('markPaid') + '  ' + money(due) : T('markPaid');
    // §474 — Discount, under Hold, for an operator who may give one.
    var dbt = $('disc');
    if (dbt) {
      dbt.hidden = !(discAllowed() && !S.recall && S.lines.length);
      dbt.textContent = dOff > 0 ? T('discount') + '  −' + money(dOff) : T('discount');
      dbt.disabled = !!S.busy;
    }
    // §457 — Hold, under Mark paid, for the till's own bill only.
    var hb = $('hold');
    if (hb) {
      hb.hidden = !canHold();
      hb.textContent = T('hold');
      hb.disabled = !!S.busy;
    }

    /* CANCELLING A RECALLED ORDER — Ash, 2026-09-08: "if a customer eventually
       doesn't want the order there should be an option to cancel it from his
       side or from the till."

       It sits UNDER Mark paid rather than beside it, and it is a quiet control
       rather than a matching button: the two outcomes are not equals, and a
       destructive action the width of the one next to it is a mis-tap waiting
       to happen at a busy counter. Two taps, and the second one says what it
       will do.

       Only for a recalled order. A basket the till is still building is
       cleared, not cancelled — there is nothing on the server yet to cancel. */
    var cx = $('cancel-order');
    var cq = $('cancel-ask');
    var showCx = !!S.recall && !S.recall.loading;
    if (cx) {
      cx.hidden = !showCx;
      /* THE QUESTION IS A SENTENCE AND THE BUTTON IS ITS ANSWER. It used to be
