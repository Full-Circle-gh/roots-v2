         a question mark appended to the control's own label, which stated the
         question and offered nothing that read as answering it: a cashier who
         armed it saw "Cancel order?" and, in the report that brought this in,
         "nothing else". The question now stands above in words, and the control
         under it says what it does — the shape the customer's own cancel takes
         on the QR order page for the same act.

         STILL TWO TAPS. The first arms, the second commits, and a tap anywhere
         else disarms (see wire()) — an armed destructive control left standing
         while the cashier works elsewhere is one mis-tap from throwing away an
         order somebody is waiting on. */
      cx.textContent = S.busy && S.cxArm ? T('cancelOrder') + '…' : T('cancelOrder');
      cx.className = 'cxo' + (S.cxArm ? ' arm' : '');
      // In flight, it is not a second tap's to press. The label already says so;
      // this is what makes the label true.
      cx.disabled = !!S.busy;
    }
    if (cq) {
      cq.hidden = !(showCx && S.cxArm);
      cq.textContent = T('cancelAsk');
    }
    /* WHAT WENT WRONG, WHERE IT WENT WRONG. S.err has always been written by
       three paths and rendered by one: the settle screen. Both of the paths that
       write it there ARE on that screen, so their failures spoke — and
       cancelOrder(), which runs here on the till, set an error into a state
       nothing on this view drew. A refused cancel and an expired session both
       came back as the button quietly disarming itself and not one word said.
       That is the second half of the report. */
    var te = $('till-err');
    if (te) {
      te.hidden = !(S.view === 'till' && S.err);
      te.textContent = S.err || '';
    }

    // THE BAR IS THE ORDER, FOLDED. On a phone the sheet is closed by default,
    // so this is the only always-true statement of what the customer owes.
    // A BARE NUMBER for the count, deliberately: "4 items" would be an English
    // string with no locked Chinese half, and a pill beside a total needs no
    // unit to be read. The product tiles already count the same way.
    var any = ready;
    $('bar-ct').textContent = S.lines.length ? String(itemCount()) : '';
    // WHAT THE CUSTOMER OWES, tax included — the same figure as the button in
    // the sheet above. The bar is the only always-true statement of the amount
    // on a phone, so it must not be the pre-tax one.
    $('bar-amt').textContent = money(due);
    var bb = $('bar-pay');
    bb.disabled = !any;
    bb.textContent = any ? T('markPaid') + '  ' + money(due) : T('markPaid');
    // With nothing rung up there is no order to open, so the summary row goes
    // rather than sitting there inert.
    document.querySelector('.bar-sum').hidden = !any;
  }

  // Units, not lines: three lines at quantity two are six items, and six is
  // what a cashier counts against the goods on the counter.
  function itemCount() {
    return S.lines.reduce(function (n, l) { return n + (Number(l.qty) || 0); }, 0);
  }

  /* ---- settle ---------------------------------------------------------- */
  function renderSettle() {
    var el = $('settle');
    if (S.view === 'done') { el.innerHTML = doneHtml(); return; }
    var sub = subtotal();
    // The settle screen states ONE number and it must be the one the card
    // machine will take (audit I-03) — the tax-inclusive amount, with the tax
    // named under it so the cashier can answer "what's the extra?" without
    // going back.
    //
    // WITH CREDIT APPLIED THAT NUMBER IS THE RESIDUAL, not the gross (§93): it
    // is what gets keyed into the terminal, and quoting the pre-credit total
    // here is how a customer pays twice for the part their points covered. The
    // gross moves to the subline beside the sale, so both are on screen.
    var due = cashDue();
    var cr = creditOffer();
    // The subline is the cashier's check that they opened the right row. For a
    // recalled QR order it repeats the number the customer is holding up and the
    // name they gave — the only two things the customer can themselves verify.
    // A basket names the sale instead and shows the tax split; a recalled
    // order's tax was settled when it was placed and is not re-derived here.
    var subline = S.recall
      ? esc(String(S.recall.code) + (S.recall.name ? ' · ' + S.recall.name : ''))
      : esc(T('counterSale')) + (S.tax ? ' · ' + esc(S.tax.label) + ' ' + money(taxOn(sub)) : '');
    // T('total') is this file's own locked pair for the gross, so naming it here
    // costs no new string. (Its Chinese half is not quoted in this comment: the
    // house rule for this file is no Chinese outside STRINGS, comments
    // included, and a character that never renders is still one nobody checked
    // against a source.)
    if (cr.applied > 0) subline += ' · ' + esc(T('total')) + ' ' + money(settleDue());
    // §450 — the big number moves by the card's 4% the moment it is picked, and
    // the subline names the part that moved it, so "why is it more?" is
    // answered on the screen the customer is looking at.
    var fee = cardFee();
    if (fee > 0) subline += ' · ' + esc(T('cardFee')) + ' ' + money(fee);
    // §500 — every tender on screen, and the cash box under Cash once picked.
    var walletBtn = function (w) {
      return '<button class="wal' + (S.wallet === w.v ? ' on' : '') + (w.sep ? ' sep' : '') + '" type="button" data-wal="' + w.v + '">'
           + '<span class="rad"></span><span>' + esc(cuT(w.en, w.cn)) + '</span></button>'
           + (w.v === 'cash' && S.wallet === 'cash' ? cashBox() : '');
    };
    el.innerHTML =
      '<div class="stop"><button class="back" type="button" data-go="till">'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'
      + esc(T('back')) + '</button></div>'
      + '<div class="smain">'
      +   '<div class="samt"><div class="lb">' + esc(T('amount')) + '</div>'
      +     '<div class="amt">' + money(chargeDue()) + '</div>'
      // The subline is the cashier's check that they opened the right row: for
      // a recalled QR order it repeats the number the customer is holding up
      // and the name they gave, which are the only two things the customer can
      // themselves verify. A basket names the sale instead, and shows the tax
      // split — a recalled order's tax was settled when it was placed and is
      // not re-derived here.
      +     '<div class="sb">' + subline + '</div></div>'
      +   '<div class="spick">'
      /* Store credit, above the wallets and only when there is any to spend
         (§93). A row for a tender the customer does not have is a control that
         can only disappoint, so a customer with no points sees no points row
         and a walk-in sees neither. */
      +     (cr.pMax > 0
              ? '<button class="wal cred' + (S.useP ? ' on' : '') + '" type="button" data-cred="p">'
                + '<span class="box"></span>'
                + '<span class="cl">' + esc(T('points')) + '<em>' + cr.havePts + '</em></span>'
                + '<span class="cv">-' + money(S.useP ? cr.pAmt : cr.pWould) + '</span></button>'
              : '')
      +     (cr.haveBal > 0 && cr.bWould > 0
              ? '<button class="wal cred' + (S.useB ? ' on' : '') + '" type="button" data-cred="b">'
                + '<span class="box"></span>'
                + '<span class="cl">' + esc(T('wallet')) + '<em>' + money(cr.haveBal) + '</em></span>'
                + '<span class="cv">-' + money(S.useB ? cr.bAmt : cr.bWould) + '</span></button>'
              : '')
      /* THE WALLET PICKER GOES AWAY WHEN THERE IS NOTHING LEFT TO TAKE. Credit
         covering the bill in full means no terminal is touched and no wallet
         took the money, so asking which one did would be asking the cashier to
         invent an answer — and 'cash' on a sale where no cash moved is exactly
         the unreconcilable row the wallet requirement exists to prevent. The
         order still names its tender: confirm() sends 'points' or 'balance',
         which is what actually settled it. */
      +     (due > 0 ? '<div class="lb">' + esc(T('payMethod')) + '</div>' : '')
      +     (due > 0 ? WALLETS.map(walletBtn).join('') : '')
      +   '</div>'
      + '</div>'
      + '<div class="sfoot">'
      +   (S.err ? '<div class="serr">' + esc(S.err) + '</div>' : '')
      +   '<button class="sconf" type="button" data-confirm="1"' + (canConfirm() ? '' : ' disabled') + '>'
      +     esc(S.busy ? T('markPaid') + '…' : T('markPaid')) + '</button>'
      +   '<div class="shint" id="shint">' + esc(settleHint()) + '</div>'
      + '</div>';
  }

  /* §500 — CASH IN, CHANGE OUT. On screen only: the order records the sale
     and the tender, exactly as before, and nothing here is sent. What the
     customer handed over is a fact about the drawer for the next ten seconds,
     not about the books. Typing is optional — exact cash is the common case
     and Mark paid works without it — but a figure that does not cover the bill
     holds Mark paid until it is corrected, so a short payment is never booked
     as a full one. */
  function cashGiven() {
    var n = parseFloat(String(S.cashIn || '').replace(/[^0-9.]/g, ''));
    return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null;
  }
  function cashShort() {
    var g = S.wallet === 'cash' ? cashGiven() : null;
    if (g == null) return 0;
    var d = chargeDue();
    return g < d ? Math.round((d - g) * 100) / 100 : 0;
  }
  // The exact amount, then the next round figures a customer is likely to
  // hand over: ¥73 gives 80, 100 and 200; ¥164 gives 170, 200 and 300.
  function cashQuick(due) {
    var up = function (step) { return Math.ceil(due / step) * step; };
    var out = [];
    [up(10), up(50), up(100), up(100) + 100].forEach(function (v) {
      if (v > due && out.indexOf(v) < 0 && out.length < 3) out.push(v);
    });
    return [due].concat(out);
  }
  function cashLine() {
    var g = cashGiven();
    if (g == null) return '';
    var sh = cashShort();
    if (sh > 0) return '<span class="cb-k">' + esc(T('short')) + '</span><span class="cb-v short">' + money(sh) + '</span>';
    return '<span class="cb-k">' + esc(T('change')) + '</span><span class="cb-v">' + money(Math.round((g - chargeDue()) * 100) / 100) + '</span>';
  }
  function cashBox() {
    var due = chargeDue();
    return '<div class="cashbox">'
      + '<label class="cb-l" for="cash-in">' + esc(T('cashGiven')) + '</label>'
      + '<input class="cb-in" id="cash-in" type="text" inputmode="decimal" autocomplete="off" value="' + esc(S.cashIn || '') + '">'
      + '<div class="cb-q">' + cashQuick(due).map(function (v) {
          return '<button class="cb-b' + (cashGiven() === v ? ' on' : '') + '" type="button" data-cash="' + v + '">' + money(v) + '</button>';
        }).join('') + '</div>'
      + '<div class="cb-ch" id="cash-ch">' + cashLine() + '</div>'
      + '</div>';
  }
  function settleHint() {
    if (canConfirm() || S.busy) return '';
    return cashShort() > 0 ? T('short') + ' ' + money(cashShort()) : T('payMethod');
  }

  function canConfirm() {
    var m = SETTLE_MODES[S.mode];
    // A recalled order has no lines on this till and never will — it is settled,
    // not built — so "there is something to charge for" is the recall OR a
    // basket, never the basket alone.
    return !S.busy && (!!S.recall || S.lines.length > 0) && m && m.ready(S) && !(cashShort() > 0);
  }

  function doneHtml() {
    var d = S.done || {};
    /* THE HEADLINE IS THE SALE, NOT THE CASH (§93). `d.total` is what a wallet
       took, and on a bill settled entirely in points that is ¥0.00 — a figure
       that reads as a giveaway rather than a sale. The gross is the sum of the
       three tenders, which is orderTenders()'s own definition of it server-side,
       so the two surfaces agree on what the sale was worth. With no credit the
       sum is `d.total` and this screen prints exactly what it always printed. */
    var cash  = Number(d.total) || 0;
    var gross = Math.round((cash + (Number(d.pointsAmount) || 0)
                                 + (Number(d.balanceUsed)  || 0)) * 100) / 100;
    /* The wallet is named only if a wallet actually took something. A cashier
       who picked WeChat and then applied enough credit to cover the bill leaves
       `S.wallet` set behind them; printing it here would put a tender on a
       receipt for money that terminal never saw. */
    var w = cash > 0 ? WALLETS.filter(function (x) { return x.v === d.wallet; })[0] : null;
    var printLabel = S.printState === 'sent' ? T('printReceipt') + ' ✓'
                   : S.printState === 'busy' ? T('printReceipt') + '…'
                   : T('printReceipt');
    return '<div class="stop"></div>'
      + '<div class="smain"><div class="done">'
      +   '<span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 7"/></svg></span>'
      +   '<h2>' + esc(T('completed')) + ' ' + money(gross) + '</h2>'
      /* WHAT SETTLED IT, in the order it was applied (§93): points, then wallet,
         then the tender that took the rest, then the order number. A sale paid
         partly in points names both halves; one paid entirely in credit names
         the credit alone, there being no wallet to name. Every label is a
         locked pair already on this screen — T('points'), T('wallet'), the
         WALLETS row's own — and every figure is a numeral, so this line mints
         nothing. (No Chinese is quoted in this comment: see the house rule at
         renderCust.) */
      +   '<div class="meta">'
      +     (d.pointsAmount > 0 ? esc(T('points')) + ' -' + money(d.pointsAmount) + ' · ' : '')
      +     (d.balanceUsed  > 0 ? esc(T('wallet')) + ' -' + money(d.balanceUsed)  + ' · ' : '')
      +     (w ? esc(cuT(w.en, w.cn)) + ' · ' : '')
      +     (d.cardFee > 0 ? esc(T('cardFee')) + ' ' + money(d.cardFee) + ' · ' : '')
      +     esc(d.order_no || '') + '</div>'
      /* §500 — the change, still on screen while the coins are counted out.
         Only for cash, and only when the cashier typed what they were given. */
      +   (w && w.v === 'cash' && d.cashIn != null && d.cashIn >= cash
            ? '<div class="dchange">' + esc(T('cashGiven')) + ' ' + money(d.cashIn) + ' · '
              + esc(T('change')) + ' <b>' + money(Math.round((d.cashIn - cash) * 100) / 100) + '</b></div>'
            : '')
      +   '<div class="drow">'
      +     '<button class="dsec" type="button" data-print="1"' + (S.printState === 'busy' ? ' disabled' : '') + '>' + esc(printLabel) + '</button>'
      +     '<button class="dprim" type="button" data-go="reset">' + esc(T('newOrder')) + '</button>'
      +   '</div>'
      + '</div></div><div class="sfoot"></div>';
  }

  /* ---- actions --------------------------------------------------------- */
  /* §287 — MARK A MADE-HERE ITEM SOLD OUT, OR BACK ON. The same column the
     office's "Available" switch writes, so the QR menu greys it the moment this lands.
     It stays as set until someone taps it back — it does not reset overnight
     (Ash, 2026-09-29: an ingredient can be out for days).

     THE SCREEN MOVES ONLY WHEN THE SERVER SAYS YES. A tile that flipped first
     and flipped back on a failure would tell a cashier, for a second, that a
     customer can order something they cannot. A line already in the basket is
     left alone: the cashier who just marked it sold out is the one person who
     knows, and removing it for them would be a surprise. */
  function toggleSoldOut(id) {
    var p = null;
    S.products.forEach(function (x) { if (x.id === id) p = x; });
    if (!canSoldOut(p) || !S.shopId || S.soBusy[id]) return;
    var want = !p.switched_off;
    S.soBusy[id] = true; S.err = ''; render();
    api('/api/retail-admin/shops/' + S.shopId + '/listings/' + p.listing_id + '/sold-out', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sold_out: want })
    }).then(function (j) {
      delete S.soBusy[id];
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      p.switched_off = want;
      // Sold out is stock 0, which greys the tile; back on is no gate at all,
      // which is what a made-here row always is.
      if (want) S.stock[id] = 0; else delete S.stock[id];
      render();
    }).catch(function (e) {
      delete S.soBusy[id];
      S.err = e && e.auth ? T('noPermission') : T('didNotSave');
      render();
    });
  }

  /* §492 — the answers a made-here item's Sold out row offers: every answer to
     every question it asks, once per name. The switch is stored by name, so
     "Whole wheat crackers" asked in two questions is one chip and one switch. */
  function soChoices(p) {
    if (!canSoldOut(p) || !p.options) return [];
    var seen = {}, out = [];
    p.options.forEach(function (o) {
      (o.choices || []).forEach(function (c) {
        if (!c.en || seen[c.en]) return;
        seen[c.en] = 1; out.push(c);
      });
    });
    return out;
  }

  /* §492 — SWITCH ONE ANSWER OFF, OR BACK ON, at this shop. Same promise as
     toggleSoldOut: the chip moves only when the server says yes. The catalogue
     is then re-read, because whether the item itself can still be made (a
     required question with every answer off) is the server's call. */
  function toggleChoiceOff(pid, cid) {
    var p = null;
    S.products.forEach(function (x) { if (x.id === pid) p = x; });
    if (!canSoldOut(p) || !S.shopId || !p.options) return;
    var c = null;
    soChoices(p).forEach(function (x) { if (x.id === cid) c = x; });
    var key = pid + ':' + cid;
    if (!c || S.soBusy[key]) return;
    var want = !c.off;
    S.soBusy[key] = true; S.err = ''; render();
    api('/api/retail-admin/shops/' + S.shopId + '/listings/' + p.listing_id + '/choices/' + cid + '/off', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ off: want })
    }).then(function (j) {
      delete S.soBusy[key];
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      // Every question's copy of this answer, until the re-read lands.
      p.options.forEach(function (o) {
        (o.choices || []).forEach(function (x) {
          if (x.en !== c.en) return;
          if (want) { x.off = 1; x.out = 1; }
          else { delete x.off; if (!x.stock_product_id) x.out = 0; }
        });
      });
      render();
      loadCatalogue().then(render).catch(function () { /* the next poll catches up */ });
    }).catch(function (e) {
      delete S.soBusy[key];
      S.err = e && e.auth ? T('noPermission') : T('didNotSave');
      render();
    });
  }

  function addLine(id) {
    // Belt to renderLines' braces. The product grid is behind the other pane
    // while a recall is open, but a stray tap must not be able to put a walk-in
    // item into somebody else's order — the settle path would charge the
    // original total and the extra line would vanish on the next render.
    if (S.recall) return;
    var p = S.products.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    /* §183 — A PRODUCT THAT ASKS SOMETHING OPENS ITS SHEET INSTEAD OF ADDING.
       Every tap on such a tile opens it, including the second and third: two
       lattes on one bill may be a hot one and an iced one, and a tile that
       silently incremented the first line could not say so. Answering the
       questions the same way twice still merges, because the line key is the
       product plus its answers — see addAnswered. */
    if (asks(p)) return openOpts(p);
    addAnswered(p, [], []);
  }

  /* The other half of addLine, and the only place a line is born. `choices` is
     what gets POSTed — ids and nothing else, because a delta that arrived from
     a till is not a delta and the server resolves every one of them from its
     own tables. `opts` is the same answer set in the shape renderLines already
     draws and lib/feie.js already prints. */
  function addAnswered(p, choices, opts) {
    var id = p.id;
    var st = stockOf(id);
    // The SHELF, not this line: one latte hot and one latte iced are two lines
    // and one shelf, so the gate counts every line carrying this product.
    if (st != null && inCart(id) >= st) return;    // never sell past the shelf
    var key = lineKey(id, choices);
    var l = findLine(key);
    if (l) l.qty += 1;
    // `menu` rides the line to the submit: a listing's price is the one figure
    // the order endpoint cannot resolve for itself (§42 puts it on the listing,
    // not on the product), so those lines and only those lines post a
    // unit_price. Everything else stays server-priced, which is what keeps a
    // catalogue price corrected in the office from being charged stale here.
    //
    // THE PRICE ON THE LINE IS BASE PLUS DELTAS, and `base` is kept beside it
    // because the two are posted differently: the server is handed the BASE and
    // adds the deltas back from its own price_delta columns. Posting the summed
    // figure would have the till pricing an extra shot, which is exactly what
    // §183 refuses to let either client do.
    else S.lines.push({ key: key, id: id, name: fullName(p), sku: p.sku || '',
                        base: Number(p.price) || 0,
                        price: Math.round((Number(p.price) || 0) * 100 +
                                          optsDelta(opts) * 100) / 100,
                        qty: 1, menu: !!p.on_menu,
                        choices: choices.slice(), opts: opts.slice() });
    render();
  }

  // What the answers add to one unit. Display only: the server recomputes it
  // from the same columns, and the two agree because neither invented a number.
  function optsDelta(opts) {
    var d = 0;
    for (var i = 0; i < (opts || []).length; i++) d += Number(opts[i].delta) || 0;
    return Math.round(d * 100) / 100;
  }
  function bumpQty(d, idx) {
    if (S.recall) return;                 // read-only; see addLine
    var i = (idx == null || idx === '') ? S.sel : Number(idx);
    var l = S.lines[i]; if (!l) return;
    var drop = function () {
      S.lines.splice(i, 1);
      // The selection is an INDEX, so every line after the removed one shifts.
      // Clearing it is the only safe answer: keeping it would leave the tablet
      // strip attached to whichever line slid into that slot.
      S.sel = null; render();
    };
    if (d === 'x') return drop();
    var st = stockOf(l.id);
    var next = l.qty + Number(d);
    if (next <= 0) return drop();
    // Measured across the product's other lines too — see renderLines. This
    // replaces the old `next > st`, which is the same test for a product with
    // one line and too generous for one with two.
    if (st != null && (inCart(l.id) - l.qty + next) > st) return;
    l.qty = next; render();
  }

  // Confirm. ONE request: the order is created already paid, with the chosen
  // wallet, through POST /api/retail-admin/orders. That is the path whose
  // markOrderPaid → isTerminalOnPaid branch flips a counter sale to its
  // terminal state, decrements the shelf and fires the automatic receipt. The
  // order does not exist until this moment, so a customer who walks away
  // leaves nothing behind to reconcile.
  function confirm() {
    if (!canConfirm()) return;
    var mode = SETTLE_MODES[S.mode];
    if (S.recall) return confirmRecall(mode);
    // §461 — a held bill whose stock is on its way to the server is paid the
    // moment that answer is back, never beside it: the sale gives the hold's
    // units back, and a hold landing after it would take them again.
    if (S.heldId && S.heldBusy[S.heldId]) { S.heldBusy[S.heldId].after = confirm; return; }
    S.busy = true; S.err = ''; render();
    var body = Object.assign({
      fulfillment_type: 'counter',
      store_id: S.storeId,
      // §44 (amended 2026-09-07): a till sale and a QR sale are one shop
      // selling the same listings, so they share ONE channel and are never
      // split across two lines of a shop's revenue. Which door the order came
      // through is shop_entry_method, NOT `source` — the server binds `source`
      // itself, and 'manual' stays right for this row because staff did key it
      // in. This used to post channel='manual', which said nothing `source`
      // did not already say and left the sale with no card of its own.
      //
      // fulfillment_type stays 'counter' and is unchanged: it is what the stock
      // decrement, the drawer and the Sales page's POS card all branch on, and
      // it is the only reliable mark of a till sale on rows written before this.
      channel: 'shop',
      shop_entry_method: 'till',
      status: 'paid',
      customer_id: S.customer ? S.customer.id : null,
      // The server requires a recipient name on every manual order. A walk-in
      // has none, so the sale records the word the admin already uses for
      // exactly this state. It is stored data, not a rendered label — and the
      // receipt suppresses the hand-over block on a counter sale anyway.
      recipient_name: S.customer ? (S.customer.nickname || 'Guest') : 'Guest',
      items: S.lines.map(function (l) {
        var it = { product_id: l.id, qty: l.qty };
        // See addAnswered: the menu's price, and never the catalogue's — and
        // the BASE of it, never the figure with the deltas already in. The
        // server adds those back from its own price_delta columns (§183), so a
        // till that posted the summed price would be pricing an extra shot
        // itself and would silently double it.
        if (l.menu) it.unit_price = (l.base != null ? l.base : l.price);
        // §183 — the answers, as ids and nothing else. Every label, question
        // and delta is resolved server-side from this tenant's own tables.
        if (l.choices && l.choices.length) it.choices = l.choices;
        return it;
      })
    }, mode.payload(S), creditBody());
    /* THE TENDER IS THE CREDIT'S when no cash changed hands (§93). mode.payload
       set `payment_method` from the wallet picker, and with the bill fully
       covered there is no picker and no wallet — so the field would arrive
       null, fall through ALLOWED_PAY to 'offline', and be refused by the
       counter-sale rule that insists a walk-in names its tender. Naming the
       credit satisfies that rule with the truth rather than around it. */
    if (cashDue() <= 0 && creditApplied() > 0) body.payment_method = creditTender();
    // §461 — the server gives this bill's held units back, then the sale takes them.
    if (S.heldId) body.held_bill_id = S.heldId;
    // §474 — exactly one of percent / amount; the server works out the figure.
    if (S.disc && discOff(subtotal()) > 0) {
      body.manual_discount = { percent: S.disc.percent, amount: S.disc.amount,
                               reason: S.disc.reason, note: S.disc.note || '' };
      // §475 — the approving manager, when this operator cannot give it alone.
      if (S.disc.approver_id) { body.manual_discount.approver_id = S.disc.approver_id; body.manual_discount.pin = S.disc.pin; }
    }

    api('/api/retail-admin/orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (j) {
      S.busy = false;
      // §475 — the PIN was good at Apply and is not now (locked, or changed in
      // between). The discount is taken off the bill so it can be asked again.
      if (j && (j.error === 'bad_till_pin' || j.error === 'till_pin_locked')) {
        S.disc = null; S.err = T(j.error === 'till_pin_locked' ? 'pinLocked' : 'wrongPin'); render(); return;
      }
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      // The SERVER's figures, not this screen's: what it actually charged and
      // what it actually took off in credit. A done screen quoting the till's
      // own arithmetic would hide exactly the disagreement worth seeing.
      S.done = { id: j.data.id, order_no: j.data.order_no, total: j.data.total,
                 wallet: S.wallet, tender: body.payment_method,
                 pointsAmount: Number(j.data.points_amount) || 0,
                 balanceUsed: Number(j.data.balance_used) || 0,
                 cardFee: Number(j.data.card_surcharge_fee) || 0,
                 cashIn: S.wallet === 'cash' ? cashGiven() : null };
      S.view = 'done'; S.printState = 'idle';
      // §457 — a held bill that has just been paid is over. §461: its held
      // units went back to the shelf and the sale took them again, so they are
      // put back here before the loop below takes the whole bill off.
      if (S.heldId) {
        var own = heldFind(S.heldId);
        var took = (S.heldTaken && S.heldTaken[S.heldId]) || (own && own.taken) || {};
        Object.keys(took).forEach(function (k) {
          if (S.stock[k] != null) S.stock[k] += Number(took[k]) || 0;
        });
        S.heldSent[S.heldId] = HELD_PAID;
        heldDrop(S.heldId); S.heldId = null; S.heldLast = '';
      }
      // The shelf moved server-side; mirror it locally so the next sale's
      // tiles are honest without a full reload.
      S.lines.forEach(function (l) {
        if (S.stock[l.id] != null) S.stock[l.id] = Math.max(0, S.stock[l.id] - l.qty);
        // §183 — a chosen extra is a real thing off a real shelf, one per unit
        // bought, and the server has just taken it. An add-on that is also sold
        // as a product of its own has a tile on this grid, and without this its
        // count would sit stale until the next catalogue read.
        (l.opts || []).forEach(function (o) {
          var sid = o.stock_product_id;
          if (sid && S.stock[sid] != null) S.stock[sid] = Math.max(0, S.stock[sid] - l.qty);
        });
      });
      render();
    }).catch(function (e) {
      S.busy = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  /* Settling an order that ALREADY EXISTS — the QR order the customer placed on
     their phone. PATCH, never POST: the row was created when they submitted,
     the money is the only thing about it that has changed, and creating a
     second order here would charge one customer twice, print two tickets and
     leave a phantom on the shop's day.

     THE KITCHEN TICKET HAS ALREADY PRINTED. routes/shop-menu.js prints a QR
     order the moment the customer submits it (back on since 2026-10-10), and
     markOrderPaid's autoPrintOrder skips a QR order whose slip already went,
     so settling here prints nothing new. A submit print that FAILED is the
     exception: the guard lets this transition print it instead.

     ONE REQUEST, and the wallet rides on it: the same tap that says "paid" says
     which wallet took it, so an order cannot reach 'paid' with no tender and
     become the unreconcilable row the settle screen exists to prevent. */
  function confirmRecall(mode) {
    var r = S.recall;
    S.busy = true; S.err = ''; render();
    api('/api/retail-admin/orders/' + r.id + '/status', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mode.recallPayload(S))
    }).then(function (j) {
      S.busy = false;
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      // The server's row comes back whole; its total carries the card's 4%
      // when that was the tender (§450), so it is read rather than r.total.
      var row = j.data || {};
      S.done = { id: r.id, order_no: r.order_no, wallet: S.wallet,
                 total: row.total != null ? Number(row.total) : r.total,
                 cardFee: Number(row.card_surcharge_fee) || 0,
                 cashIn: S.wallet === 'cash' ? cashGiven() : null };
      S.view = 'done'; S.printState = 'idle';
      // It is not waiting any more. Dropped locally so the count is right the
      // instant the screen changes rather than up to fifteen seconds later —
      // a cashier who settles 12 and still sees 12 in the list will settle it
      // twice.
      S.pend = (S.pend || []).filter(function (o) { return o.id !== r.id; });
      S.recall = null;
      render();
    }).catch(function (e) {
      S.busy = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  /* Cancelling the recalled order. TWO TAPS: the first arms the control and it
     restates itself as a question, the second commits. No browser dialog —
     this screen opens none, and the arming state is the confirmation.

     ONE ENDPOINT, the admin's own status transition, which already releases the
     order's reservation (§45) and is the path staff have always cancelled
     through. Nothing new is written here for a state the rest of the system
     already understands.

     The list drops it locally the moment it lands, on the same reasoning the
     paid path gives: a cashier who cancels 12 and still sees 12 will cancel it
     twice, and the second attempt would meet an order that is no longer
     cancellable. */
  function cancelOrder() {
    if (!S.recall || S.recall.loading || S.busy) return;
    // Arming clears whatever the LAST attempt said. An error left standing over
    // a fresh question reads as an answer to it.
    if (!S.cxArm) { S.cxArm = true; S.err = ''; return render(); }
    var r = S.recall;
    S.busy = true; S.err = ''; render();
    api('/api/retail-admin/orders/' + r.id + '/status', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'cancelled' })
    }).then(function (j) {
      S.busy = false; S.cxArm = false;
      if (!j || !j.success) {
        /* THE ORDER MOVED WHILE THE LIST WAS STALE, which is not a save that
           failed. This till re-reads every fifteen seconds and the customer can
           now cancel from their own page (routes/shop-menu.js), so the row the
           cashier tapped may already be cancelled — or another counter may have
           taken the money for it. The server answers 409 and the transition
           guard names it; `not_cancellable` is the same refusal from the
           admin's own cancel route.

           IT IS DROPPED, NOT LEFT UP. An order that cannot be cancelled cannot
           be paid for either, so leaving it recalled would leave Mark paid
           pointing at a second refusal. Back to the list, re-read from the
           server, and the reason on screen. */
        if (j && (j.error === 'invalid_transition' || j.error === 'not_cancellable')) {
          S.err = T('notCancellable');
          S.pend = (S.pend || []).filter(function (o) { return o.id !== r.id; });
          S.recall = null; S.lines = []; S.sel = null;
          S.view = 'till'; S.pane = 'pend'; S.paneTouched = true;
          render();
          loadPend();
          return;
        }
        // Anything else may well work on a second press, so the order stays
        // recalled and the control stays where the cashier left it.
        S.err = T('didNotSave');
        return render();
      }
      S.pend = (S.pend || []).filter(function (o) { return o.id !== r.id; });
      S.recall = null; S.lines = []; S.sel = null;
      S.view = 'till'; S.pane = 'pend'; S.paneTouched = true;
      render();
      loadPend();
    }).catch(function (e) {
      S.busy = false; S.cxArm = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  function reset() {
    S.lines = []; S.sel = null; S.customer = null; S.heldId = null; S.heldLast = '';
    S.wallet = null; S.useP = false; S.useB = false; S.cashIn = ''; S.err = ''; S.done = null; S.disc = null;
    S.view = 'till'; S.printState = 'idle';
    S.q = ''; $('q').value = '';
    // The sale is over, so the pane goes back to being defaulted rather than
    // chosen — the next customer decides which face the till should show, not
    // the last one. Re-read rather than trusting the local drop: another till
    // at the same counter may have settled something while this one was busy.
    S.recall = null; S.paneTouched = false;
    render();
    loadPend();
  }

  // Reprint. Printing already happened automatically when the sale settled, so
  // this is the second copy and is styled as such. Fire-and-forget: the button
  // reports that it sent, never that the paper came out, because the printer
  // is a network device and the till cannot know.
  function reprint() {
    if (!S.done || S.printState === 'busy') return;
    S.printState = 'busy'; render();
    api('/api/retail-admin/orders/' + S.done.id + '/print', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ store_id: S.storeId })
    }).then(function () { S.printState = 'sent'; render(); })
      .catch(function () { S.printState = 'idle'; render(); });
  }

  // Attaching a customer. Uses the browser prompt deliberately: a full search
  // panel is its own screen and this is an optional, uncommon step at a till.
  // It stays one tap from the rail and never blocks the sale.
  // ATTACHING A CUSTOMER IS A TACET SCREEN, not a browser prompt.
  //
  // It used to be window.prompt(): a chrome-coloured box saying
  // "store.rootskitchenchina.com says", which cannot be styled, cannot show
  // what it found, and took the FIRST match of pageSize=1 — so two customers
  // with the same given name were a coin toss the cashier never saw.
  //
  // Now it searches and shows what it found, with enough on each row to tell
  // two people apart. SEARCH-ONLY by decision: a customer who does not exist
  // yet is created in the backend, not at the till.
  function pickCustomer() {
    S.custOpen = true; S.custQ = ''; S.custRows = null;
    render();
  }

  function closeCustPicker() {
    S.custOpen = false; S.custRows = null;
    var el = $('custpick'); if (el) el.removeAttribute('data-built');
    render();
  }

  // Debounced so a four-letter name is one query rather than four. The token
  // guards against an earlier, slower reply landing after a later one and
  // overwriting it with results for a term the cashier has already changed.
  var _custTimer = null, _custToken = 0;
  function custSearch(term) {
    S.custQ = term;
    if (_custTimer) clearTimeout(_custTimer);
    var mine = ++_custToken;
    if (!term.trim()) { S.custRows = null; renderCustResults(); return; }
    _custTimer = setTimeout(function () {
      api('/api/retail-admin/customers?pageSize=12&q=' + encodeURIComponent(term.trim()))
        .then(function (j) {
          if (mine !== _custToken) return;      // a newer search already answered
          S.custRows = (j.data || []).map(custRow);
          renderCustResults();
        })
        .catch(function () {
          if (mine !== _custToken) return;
          S.custRows = [];
          renderCustResults();
        });
    }, 220);
  }

  /* ── ONE SHAPE FOR A CUSTOMER ROW (§95) ─────────────────────────────────
     `/api/retail-admin/customers` returns the SELECT verbatim, so a row carries
     `points_balance` — the column's name — while the wallet's column is just
     `balance`. This screen read `c.points`, which no row has ever had.

     THAT IS WHY EVERY CUSTOMER SHOWED "Points 0" WHILE THE WALLET WAS RIGHT:
     one of the two happened to be spelled the way this file guessed. The
     display had been wrong since the row was written, and it stopped being
     cosmetic the day §93 gave the till something to SPEND: `creditOffer` reads
     the same field, so the points control could never appear and pay-with-points
     was dead on arrival.

     Normalised HERE, at the one boundary rows come in through, rather than
     patched at each of the four readers — a second reader added later would
     have to know the same trick, and the reason this bug existed is that
     knowing the trick was the requirement. Both spellings are accepted so the
     shape does not depend on which endpoint a future caller uses, and both are
     coerced to numbers so `Number()` at the call sites has nothing left to do. */
  function custRow(c) {
    c.points  = Math.max(0, Math.floor(Number(c.points_balance != null ? c.points_balance : c.points) || 0));
    c.balance = Number(c.balance) || 0;
    return c;
  }

  function attachCustomer(id) {
    var c = (S.custRows || []).filter(function (x) { return String(x.id) === String(id); })[0];
    if (!c) return;
    if (S.recall) return attachToRecall(c);   // §428
    // A NEW customer starts with their credit untouched (§93). Attaching over
    // an existing one is possible from this sheet, and inheriting the previous
    // customer's toggles would spend this one's points without anybody asking.
    S.customer = c; S.useP = false; S.useB = false;
    S.custOpen = false; S.custRows = null;
    var el = $('custpick'); if (el) el.removeAttribute('data-built');
    render();
    // §426 — the vouchers this customer holds HERE. A failed read leaves the
    // sale at full price on screen, and the server still applies the voucher
    // when the sale is posted — so the worst case is a total that comes back
    // lower than the one quoted, never a discount nobody had.
    loadCounterVouchers(c);
  }

  /* §428 — ATTACH TO THE RECALLED QR ORDER. The server writes the customer and
     applies the best voucher they hold here; this screen takes the total from
     the reply. Called again after a give, which is how a voucher given a moment
     ago reaches the order already on screen. */
  function attachToRecall(c) {
    var r = S.recall;
    if (!r || S.busy) return;
    S.custOpen = false; S.custRows = null;
    var pk = $('custpick'); if (pk) pk.removeAttribute('data-built');
    S.busy = true; S.err = ''; render();
    api('/api/retail-admin/orders/' + r.id + '/counter-customer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_id: c.id })
    }).then(function (j) {
      S.busy = false;
      if (!j || !j.success) {
        S.err = (j && j.error === 'order_has_customer') ? T('orderHasCustomer') : T('didNotSave');
        render(); return;
      }
      if (S.recall && S.recall.id === r.id) {
        var d = j.data;
        S.recall.customer = c;
        S.recall.total = Number(d.total) || 0;
        S.recall.voucherOff = Number(d.voucher_amount) || 0;
        if (d.voucher_title_en || d.voucher_title_cn) {
          S.recall.voucherTitle = cuT(d.voucher_title_en || d.voucher_title_cn || '',
                                      d.voucher_title_cn || d.voucher_title_en || '') || T('voucher');
        } else if (!S.recall.voucherTitle) S.recall.voucherTitle = T('voucher');
        S.recall.typedPhone = false;   // a cashier attached them: that is the check
      }
      loadPend();
      render();
      loadCounterVouchers(c);
    }).catch(function (e) {
      S.busy = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  /* §428 — GIVE THIS LOCATION'S VOUCHER to the attached customer. The badge has
     been checked; one tap gives it, recorded under this operator's name, and
     the discount follows at once: on a sale by re-reading what they hold, on a
     recalled QR order by attaching again, which applies it to that order. */
  function giveVoucher(vid) {
    var c = S.recall ? S.recall.customer : S.customer;
    if (!c || S.busy) return;
    S.busy = true; S.err = ''; render();
    api('/api/retail-admin/customers/' + encodeURIComponent(c.id) + '/counter-vouchers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voucher_id: Number(vid), store_id: S.storeId })
    }).then(function (j) {
      S.busy = false;
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      if (S.recall && S.recall.customer === c) return attachToRecall(c);
      loadCounterVouchers(c);
    }).catch(function (e) {
      S.busy = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  /* §428 — NOBODY FOUND: ADD THEM. Name and phone, through the same create the
     office uses, which reuses a customer already holding that phone rather than
     making a second one. Then attached, exactly as if they had been found. */
  function createCustomer() {
    var nm = $('cnew-name'), ph = $('cnew-phone');
    var name = nm ? nm.value.trim() : '', phone = ph ? ph.value.trim() : '';
    if (!phone || S.busy) { if (ph) ph.focus(); return; }
    S.busy = true;
    api('/api/retail-admin/customers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname: name || null, phone: phone })
    }).then(function (j) {
      S.busy = false;
      if (!j || !j.success || !j.data) { S.err = T('didNotSave'); closeCustPicker(); return; }
      var c = custRow(j.data);
      S.custRows = [c];
      attachCustomer(c.id);
    }).catch(function () { S.busy = false; S.err = T('didNotSave'); closeCustPicker(); });
  }

  /* §426 — TAKE THE DISCOUNT OFF A RECALLED QR ORDER. The answer to the check:
     the person at the counter is not who the typed number says. The server
     restates the total and unlinks the account; this screen takes its figure
     from the reply, never from its own arithmetic. */
  function removeVoucher() {
    var r = S.recall;
    if (!r || S.busy || !(r.voucherOff > 0)) return;
    S.busy = true; S.err = ''; render();
    api('/api/retail-admin/orders/' + r.id + '/remove-voucher', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
    }).then(function (j) {
      S.busy = false;
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      if (S.recall && S.recall.id === r.id) {
        S.recall.total = Number(j.data.total) || 0;
        S.recall.voucherOff = 0; S.recall.typedPhone = false;
      }
      loadPend();
      render();
    }).catch(function (e) {
      S.busy = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  // THE SHELL IS BUILT ONCE, on open. Re-rendering it on every keystroke would
  // replace the <input> the cashier is typing into and drop the caret — the
  // classic way a search box becomes unusable. Only the result list redraws.
  /* ==================================================================
     §183 · THE QUESTIONS THE COUNTER CAN NOW ASK.

     Hot or iced, extra shot, how much sugar. The QR menu has asked these since
     §120 and the counter could not — not because nobody had drawn the buttons,
     but because the road behind them stopped: routes/retail.js dropped the
     answer on the floor and the order line had no column to keep it in. Both
     are built now (lib/product-options.js, and options_json on the manual
     order), so a tap here reaches the kitchen ticket, the price and the shelf.

     THE RULES ARE THE SERVER'S, NOT THIS SCREEN'S. Which questions exist, how
     many answers each takes, which extras are still on the shelf and what any
     of it costs all arrive in the catalogue payload already clamped. This file
     renders them and blocks on them; it does not compute them. A limit the
     client computes is a limit the client can compute differently, and the two
     clients would then differ — which is the entire reason the rules moved into
     one module in the first place.

     WHY A SHEET AND NOT MORE TILES. A "Latte (iced, extra shot)" tile per
     combination is a grid nobody can scan, and it multiplies: three questions
     of three answers is twenty-seven tiles for one drink. Sizes stay as tiles
     because a size is a different PRODUCT with its own price and its own shelf;
     an answer is not.                                                        */
  function openOpts(p) {
    // Pre-ticked defaults, which is what is_default is for: the common answer
    // is already chosen and a cashier who agrees taps Add once. A default that
    // has sold out is not pre-ticked — it is not an answer anybody can give.
    var sel = {};
    (p.options || []).forEach(function (o) {
      var pre = [];
      (o.choices || []).forEach(function (c) {
        if (!c.def || c.out) return;
        // A single-answer question takes ONE default even if the data carries
        // two, which it should not but can after an edit.
        if (!o.multi && pre.length) return;
        pre.push(c.id);
      });
      // A ceiling binds a default set exactly as it binds a tapped one.
      if (o.max && pre.length > o.max) pre = pre.slice(0, o.max);
      sel[o.id] = pre;
    });
    S.opts = { p: p, sel: sel, err: '' };
    render();
  }
  function closeOpts() { S.opts = null; render(); }

  // Ticking. A single-answer question REPLACES; a pick-any toggles, and its
  // ceiling refuses the tick that would break it rather than silently dropping
  // somebody else's — the cashier untucks one and picks the other, which is the
  // same thing the QR menu's sheet does with a greyed-out box.
  function tickOpt(oid, cid) {
    if (!S.opts) return;
    var o = (S.opts.p.options || []).filter(function (x) { return x.id === oid; })[0];
    if (!o) return;
    var c = (o.choices || []).filter(function (x) { return x.id === cid; })[0];
    if (!c || c.out) return;                       // sold out is not an answer
    var cur = S.opts.sel[oid] || [];
    if (!o.multi) { S.opts.sel[oid] = (cur.length === 1 && cur[0] === cid) && !o.req ? [] : [cid]; }
    // ONE ANSWER MAY BE PICKED AGAIN (o.rep): a tap is one more, never a toggle,
    // and the ceiling counts every pick. Taking one back is the counter's −.
    else if (o.rep) {
      if (o.max && cur.length >= o.max) return;
      cur.push(cid);
      S.opts.sel[oid] = cur;
    }
    else {
      var at = cur.indexOf(cid);
      if (at >= 0) cur.splice(at, 1);
      else if (o.max && cur.length >= o.max) return;
      else cur.push(cid);
      S.opts.sel[oid] = cur;
    }
    S.opts.err = '';
    render();
  }

  // The counter's −: takes back ONE pick of this answer, the last one made.
  function untickOpt(oid, cid) {
    if (!S.opts) return;
    var cur = S.opts.sel[oid] || [];
    var at = cur.lastIndexOf(cid);
    if (at < 0) return;
    cur.splice(at, 1);
    S.opts.sel[oid] = cur;
    S.opts.err = '';
    render();
  }
  function pickCount(oid, cid) {
    var cur = (S.opts && S.opts.sel[oid]) || [], n = 0;
    for (var i = 0; i < cur.length; i++) if (cur[i] === cid) n++;
    return n;
  }

  // The first question that is not answered yet, or null. Drives both the
  // blocked Add and the line of red under it — naming the question is the
  // difference between "you cannot add this" and a cashier knowing why.
  function optsMissing() {
    if (!S.opts) return null;
    var qs = S.opts.p.options || [];
    for (var i = 0; i < qs.length; i++) {
      var o = qs[i];
      var n = (S.opts.sel[o.id] || []).length;
      if (o.min && n < o.min) return o;
      if (o.req && !n) return o;
    }
    return null;
  }

  // "(Choose 2)" / "（选 2 项）" and its two siblings, built from the pieces
  // §153 locked because the numeral is not known until the sheet is open.
  function optsLimitText(o) {
    if (o.min && o.max && o.min === o.max) return T('optChoose') + o.min + T('optCount');
    if (o.min) return T('optAtLeast') + o.min + T('optCount');
    if (o.max) return T('optUpTo') + o.max + T('optCount');
    return '';
  }

  function renderOpts() {
    var el = $('optpick');
    el.hidden = !S.opts;
    if (!S.opts) { el.innerHTML = ''; return; }
    /* THE SCROLL SURVIVES A REBUILD, and it has to. render() runs on the
       fifteen-second pending-orders poll and on every push from the doorbell,
       so a sheet with three questions in it would jump back to the top under a
       cashier mid-way down it — for a reason that has nothing to do with this
       screen. The ticks themselves live in S.opts.sel and were never at risk;
       only the position was. */
    var prev = el.querySelector('.opt-sheet');
    var top = prev ? prev.scrollTop : 0;
    var p = S.opts.p;
    var miss = optsMissing();
    // The running price, so the extra shot is visible BEFORE the line is made.
    var unit = Math.round(((Number(p.price) || 0) + optsDelta(chosenOpts())) * 100) / 100;
    if (!(unit >= 0)) unit = 0;

    var h = '<div class="ssheet opt-sheet">'
          + '<div class="hd">' + esc(T('chooseOpts')) + '</div>'
          + '<div class="opt-nm">' + esc(fullName(p)) + '</div>';
    (p.options || []).forEach(function (o) {
      var lim = optsLimitText(o);
      h += '<div class="opt-q">' + esc(cuT(o.q_en, o.q_cn))
         + (o.req ? '<i class="req">' + esc(T('optRequired')) + '</i>' : '')
         + (lim ? '<i class="lim">' + esc(lim) + '</i>' : '')
         + '</div>';
      // How many picks this question holds, for the + that would break a ceiling.
      var held = (S.opts.sel[o.id] || []).length;
      (o.choices || []).forEach(function (c) {
        var on = (S.opts.sel[o.id] || []).indexOf(c.id) >= 0;
        var d = Number(c.d) || 0;
        var money1 = c.out ? '<span class="od out">' + esc(T('outOfStock')) + '</span>'
                   : (d ? '<span class="od">' + (d > 0 ? '+' : '\u2212') + money(Math.abs(d)) + '</span>' : '');
        /* A REPEATABLE ANSWER IS A − n + COUNTER, not a tick-box. The row itself
           is the +, so the habit of tapping the answer still works; the − sits
           inside it and only once there is something to take back. Divs, not
           buttons, because a button may not hold a button. */
        if (o.rep) {
          var n = pickCount(o.id, c.id);
          var full = !!(o.max && held >= o.max);
          h += '<div class="srow opt-c opt-rep' + (n ? ' on' : '') + (c.out ? ' out' : '') + '" role="button"'
             + (c.out ? ' aria-disabled="true"' : ' data-opt="tick" data-o="' + o.id + '" data-c="' + c.id + '"')
             + '>'
             + '<span class="ol">' + esc(cuT(c.en, c.cn)) + '</span>'
             + money1
             + (c.out && !n ? '' :
                '<span class="opt-ct">'
                + (n ? '<span class="opt-dec" role="button" data-opt="dec" data-o="' + o.id + '" data-c="' + c.id + '">\u2212</span>'
                     : '<span class="opt-dec off" data-opt="none">\u2212</span>')
                + '<span class="opt-n">' + n + '</span>'
                + '<span class="opt-inc' + (full || c.out ? ' off' : '') + '">+</span>'
                + '</span>')
             + '</div>';
          return;
        }
        h += '<button class="srow opt-c' + (on ? ' on' : '') + (c.out ? ' out' : '') + '" type="button"'
           + (c.out ? ' disabled' : ' data-opt="tick" data-o="' + o.id + '" data-c="' + c.id + '"')
           + '>'
           + '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
           + '<span class="ol">' + esc(cuT(c.en, c.cn)) + '</span>'
           // Sold out replaces the money it would have crowded, exactly as a
           // sold-out tile replaces its price with the reason.
           + money1
           + '</button>';
      });
    });
    // The refusal names the question, in the storefront's own words.
    if (S.opts.err && miss) {
      h += '<div class="opt-err">' + esc(T('pleaseChoose') + cuT(miss.q_en, miss.q_cn)
           + (optsLimitText(miss) ? cuT(' (', '（') + optsLimitText(miss) + cuT(')', '）') : '')) + '</div>';
    }
    h += '<div class="opt-ft">'
       + '<button class="ccancel" type="button" data-opt="close">' + esc(T('cancel')) + '</button>'
       + '<button class="opt-go" type="button" data-opt="add">'
       + esc(T('optAdd')) + ' ' + money(unit) + '</button>'
       + '</div></div>';
    el.innerHTML = h;
    if (top) {
      var next = el.querySelector('.opt-sheet');
      if (next) next.scrollTop = top;
    }
  }

  // The ticked answers, in the order the questions were asked — which is the
  // order they will be posted in and the order the ticket prints them.
  function chosenOpts() {
    if (!S.opts) return [];
    var out = [];
    (S.opts.p.options || []).forEach(function (o) {
      // Repeats are posted in the order the answers are LISTED, not tapped, so
      // two Medjool Boats sit side by side and read as one row with a count.
      var ids = (S.opts.sel[o.id] || []).slice();
      if (o.rep) {
        var rank = {};
        (o.choices || []).forEach(function (x, i) { rank[x.id] = i; });
        ids.sort(function (a, b) { return rank[a] - rank[b]; });
      }
      ids.forEach(function (cid) {
        var c = (o.choices || []).filter(function (x) { return x.id === cid; })[0];
        if (!c) return;
        // The SAME shape routes/shop-menu.js snapshots and renderLines draws.
        // The server writes its own copy from its own tables; this one only has
        // to survive as far as the bill on the glass.
        out.push({ option_id: o.id, choice_id: c.id,
                   label: c.en, label_cn: c.cn,
                   question_en: o.q_en, question_cn: o.q_cn,
                   delta: Number(c.d) || 0,
                   // Which shelf this extra comes off, so the local mirror
                   // after a sale can keep that extra's OWN tile honest.
                   stock_product_id: c.stock_product_id || null });
      });
    });
    return out;
  }

  function commitOpts() {
    if (!S.opts) return;
    if (optsMissing()) { S.opts.err = '1'; return render(); }
    var p = S.opts.p, opts = chosenOpts();
    S.opts = null;
    addAnswered(p, opts.map(function (o) { return o.choice_id; }), opts);
  }

  function renderCustPicker() {
    var el = $('custpick');
    el.hidden = !S.custOpen;
    if (!S.custOpen) { el.innerHTML = ''; return; }
    if (el.getAttribute('data-built') === '1') { renderCustResults(); return; }
    el.innerHTML =
      '<div class="ssheet cust-sheet">'
      + '<div class="hd">' + esc(T('customer')) + '</div>'
      + '<div class="csearch">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>'
      + '<input id="cust-q" type="search" autocomplete="off" autocorrect="off" spellcheck="false">'
      + '</div>'
      + '<div class="crows" id="cust-rows"></div>'
      + '<button class="ccancel" type="button" data-cust="close">' + esc(T('cancel')) + '</button>'
      + '</div>';
    el.setAttribute('data-built', '1');
    var input = $('cust-q');
    input.placeholder = T('custSearch');
    input.addEventListener('input', function () { custSearch(this.value); });
    try { input.focus(); } catch (e) {}
    renderCustResults();
  }

  function renderCustResults() {
    var box = document.getElementById('cust-rows');
    if (!box) return;
    // Nothing typed yet is not the same as nothing found, and must not say so.
    if (S.custRows === null) { box.removeAttribute('data-new-for'); box.innerHTML = ''; return; }
    // §428 — nothing found offers to add them, the phone pre-filled when what
    // was typed is a number (it usually is: the employee says it out loud).
    if (!S.custRows.length) {
      var q = String(S.custQ || '').trim(), digits = /^[+\d\s-]{7,}$/.test(q);
      /* DRAWN ONCE PER SEARCH, and left alone after that. render() runs on the
         order poll every fifteen seconds and on every QR order that lands, and
         each run came through here — so a cashier halfway through a new
         customer's name had both fields rebuilt under them: the keyboard went
         down and the name and phone went back to what the search said. The
         fields only need drawing again when the search itself changes — or the
         language, which their placeholders are written in. */
      var drawnFor = _lang + '|' + q;
      if (box.getAttribute('data-new-for') === drawnFor) return;
      box.setAttribute('data-new-for', drawnFor);
      box.innerHTML = '<div class="cempty">' + esc(T('noMatches')) + '</div>'
        + '<div class="cnew">'
        + '<input id="cnew-name" type="text" autocomplete="off" placeholder="' + esc(T('name')) + '"'
        + ' value="' + esc(digits ? '' : q) + '">'
        + '<input id="cnew-phone" type="tel" autocomplete="off" placeholder="' + esc(T('phone')) + '"'
        + ' value="' + esc(digits ? q : '') + '">'
        + '<button class="cbtn" type="button" data-cust="new">' + esc(T('addCustomer')) + '</button>'
        + '</div>';
      return;
    }
    box.removeAttribute('data-new-for');
    var h = '';
    S.custRows.forEach(function (c) {
      // Name and phone are what tell two people apart; points and wallet are
      // what the cashier is asked for at the counter. Both, on every row.
      var who = c.nickname || ('#' + c.id);
      h += '<button class="crow" type="button" data-cust="use" data-id="' + esc(String(c.id)) + '">'
        + '<span class="cwho">' + esc(who)
        + '<span class="cmeta">' + esc(c.phone || '') + '</span></span>'
        + '<span class="cbal">' + esc(T('points')) + ' ' + (Number(c.points) || 0)
        + '<span class="cmeta">' + esc(T('wallet')) + ' ' + money(c.balance) + '</span></span>'
        + '</button>';
    });
    box.innerHTML = h;
  }

  /* ---- wiring. Delegated: the grid and the rail re-render constantly. ---- */
  function wire() {
    /* §289 — A PHOTO THAT WILL NOT LOAD IS DROPPED, not left as a broken-image
       icon. Load errors do not bubble, so this listens in the capture phase.
       The id is remembered so the next rebuild of the grid leaves it out. */
    $('grid').addEventListener('error', function (ev) {
      var img = ev.target;
      if (!img || img.tagName !== 'IMG' || !img.hasAttribute('data-img')) return;
      S.imgBad[img.getAttribute('data-img')] = 1;
      var tile = img.closest('.tile');
      if (tile) tile.classList.remove('has-ph');
      if (img.parentNode) img.parentNode.remove();
    }, true);
    document.addEventListener('click', function (ev) {
      /* A STRAY TAP ANSWERS THE CANCEL QUESTION THE SAFE WAY — the rule the
         leave question already keeps ("a stray tap on the scrim answers stay"),
         and the armed cancel needs it more: it has no scrim to tap away, and
         once the cashier has moved on there is nothing else on the till saying
         it is still armed. Left standing across a customer, it turns the next
         tap on that control into a cancelled order nobody asked to cancel.

         DISARMING IS NOT SWALLOWING. The tap still does whatever it was for;
         this only takes the question back down. */
      if (S.cxArm && !(ev.target && ev.target.closest && ev.target.closest('[data-cancel-order]'))) {
        S.cxArm = false; render();
      }
      // The scrim closes the picker: tapping away from a short list is the
      // expected way out, and it is the only dismissal this pop-up needs.
      if (S.pickOpen && ev.target.id === 'storepick') { S.pickOpen = false; return render(); }
      if (S.custOpen && ev.target.id === 'custpick') return closeCustPicker();
      // Tapping away from the leave question is staying, the same dismissal the
      // store picker takes — and the safe answer is the one a stray tap gives.
      if (S.leaveOpen && ev.target.id === 'leavepick') { S.leaveOpen = false; return render(); }
      // Tapping away from the questions is cancelling the line — nothing has
      // been added yet, so the safe answer a stray tap gives is "no line".
      if (S.opts && ev.target.id === 'optpick') return closeOpts();
      // §457 — tapping away from the note sheet is not holding.
      if (S.holdOpen && ev.target.id === 'holdpick') return closeHoldAsk();
      // §474 — tapping away from the discount sheet is not giving one.
      if (S.discOpen && ev.target.id === 'discpick') return closeDiscAsk();
      var t = ev.target.closest('[data-add],[data-cat],[data-line],[data-q],[data-cust],[data-wal],[data-cred],[data-cash],[data-confirm],[data-go],[data-print],[data-store],[data-pick],[data-sheet],[data-back],[data-leave],[data-pane],[data-recall],[data-recall-cancel],[data-rm-voucher],[data-give],[data-cancel-order],[data-opt],[data-somode],[data-so],[data-so-c],[data-hold],[data-held],[data-disc],[data-disc-pct],[data-disc-why],[data-disc-mgr]');
      if (!t) return;
      // §183 — the question sheet. Answered before anything else on the screen:
      // while it is up it is the only thing the cashier is being asked.
      if (t.hasAttribute('data-opt')) {
        var oa = t.getAttribute('data-opt');
        if (oa === 'close') return closeOpts();
        if (oa === 'add') return commitOpts();
        if (oa === 'tick') {
          return tickOpt(Number(t.getAttribute('data-o')), Number(t.getAttribute('data-c')));
        }
        if (oa === 'dec') {
          return untickOpt(Number(t.getAttribute('data-o')), Number(t.getAttribute('data-c')));
        }
        return;
      }
      // Choosing a pane. The flag is what stops the next poll from defaulting
      // the cashier back off the face they just asked for.
      if (t.hasAttribute('data-pane')) {
        S.pane = t.getAttribute('data-pane'); S.paneTouched = true; return render();
      }
      if (t.hasAttribute('data-recall')) return recall(Number(t.getAttribute('data-recall')));
      if (t.hasAttribute('data-hold')) {   // §457
        var ha = t.getAttribute('data-hold');
        if (ha === 'go') return commitHold();
        if (ha === 'close') return closeHoldAsk();
        return openHoldAsk();
      }
      if (t.hasAttribute('data-held')) return openHeld(t.getAttribute('data-held'));
      if (t.hasAttribute('data-disc-pct')) return pickDiscPct(Number(t.getAttribute('data-disc-pct')));
      if (t.hasAttribute('data-disc-why')) return pickDiscWhy(t.getAttribute('data-disc-why'));
      if (t.hasAttribute('data-disc-mgr')) return pickDiscMgr(t.getAttribute('data-disc-mgr'));
      if (t.hasAttribute('data-disc')) {   // §474
        var da = t.getAttribute('data-disc');
        if (da === 'go') return commitDisc();
        if (da === 'off') return removeDisc();
        if (da === 'close') return closeDiscAsk();
        return openDiscAsk();
      }
      if (t.hasAttribute('data-recall-cancel')) return cancelRecall();
      if (t.hasAttribute('data-rm-voucher')) return removeVoucher();
      if (t.hasAttribute('data-give')) return giveVoucher(t.getAttribute('data-give'));   // §428
      if (t.hasAttribute('data-cancel-order')) return cancelOrder();
      // THE WAY BACK. An empty till leaves on the tap; a basket with lines in it
      // is a sale in progress that nothing has saved yet, so it asks first — in
      // the page, the way every other decision on this screen is made.
      if (t.hasAttribute('data-back')) {
        if (!S.home) return;
        // §457 — a held bill back on screen is saved; only an unsaved one asks.
        if (S.lines.length && !S.heldId) { S.leaveOpen = true; return render(); }
        window.location.href = S.home; return;
      }
      if (t.hasAttribute('data-leave')) {
        if (t.getAttribute('data-leave') === 'go') { window.location.href = S.home; return; }
        S.leaveOpen = false; return render();
      }
      if (t.hasAttribute('data-store')) { S.pickOpen = !S.pickOpen; return render(); }
      if (t.hasAttribute('data-sheet'))  {
        S.sheetOpen = t.getAttribute('data-sheet') === 'open';
        return render();
      }
      if (t.hasAttribute('data-pick'))  return switchStore(t.getAttribute('data-pick'));
      if (t.hasAttribute('data-somode')) { S.soMode = !S.soMode; S.err = ''; return render(); }
      if (t.hasAttribute('data-so'))    return toggleSoldOut(Number(t.getAttribute('data-so')));
      if (t.hasAttribute('data-so-c'))  return toggleChoiceOff(Number(t.getAttribute('data-so-p')), Number(t.getAttribute('data-so-c')));
      if (t.hasAttribute('data-add'))   return addLine(Number(t.getAttribute('data-add')));
      if (t.hasAttribute('data-cat'))   { S.cat = t.getAttribute('data-cat'); return render(); }
      if (t.hasAttribute('data-line'))  { var i = Number(t.getAttribute('data-line')); S.sel = (S.sel === i ? null : i); return render(); }
      if (t.hasAttribute('data-q'))     return bumpQty(t.getAttribute('data-q'), t.getAttribute('data-i'));
      if (t.hasAttribute('data-cust'))  {
        var act = t.getAttribute('data-cust');
        // Their credit goes with them: leaving the toggles on would apply the
        // NEXT customer's points the moment one is attached, or — with nobody
        // attached — quietly send a redemption the server would refuse.
        if (act === 'clear') { S.customer = null; S.useP = false; S.useB = false; return render(); }
        if (act === 'close') return closeCustPicker();
        // 'use' attaches a searched row; 'pick' OPENS the picker and is the
        // + Customer button's own long-standing value — do not merge the two.
        if (act === 'use')   return attachCustomer(t.getAttribute('data-id'));
        if (act === 'new')   return createCustomer();   // §428
        return pickCustomer();
      }
      if (t.hasAttribute('data-wal'))   { S.wallet = t.getAttribute('data-wal'); S.err = ''; return render(); }
      /* Store credit (§93). Independent toggles, not a group — a customer can
         put points AND wallet against one bill, which is why these are squares
         and the wallets are radios. Turning one ON can leave nothing for a
         wallet to take, and the picker disappears; a wallet already chosen is
         LEFT SET rather than cleared, so switching the credit back off restores
         the tender the cashier had already picked instead of making them pick
         it twice. */
      if (t.hasAttribute('data-cred'))  {
        var which = t.getAttribute('data-cred');
        if (which === 'p') S.useP = !S.useP; else S.useB = !S.useB;
        S.err = '';
        return render();
      }
      // §500 — a quick amount for the cash a customer handed over.
      if (t.hasAttribute('data-cash'))  { S.cashIn = t.getAttribute('data-cash'); return render(); }
      if (t.hasAttribute('data-confirm')) return confirm();
      if (t.hasAttribute('data-print')) return reprint();
      if (t.hasAttribute('data-go'))    {
        var g = t.getAttribute('data-go');
        if (g === 'reset') return reset();
        S.view = 'till'; S.err = ''; return render();
      }
    });
    /* BOTH pay buttons, through one handler.
       #pay is the rail's, #bar-pay is the phone bar's — and #bar-pay had no
       listener at all until 2026-09-08. It rendered, it enabled and disabled
       itself correctly in renderFoot, and tapping it did nothing: on a phone
       with the order sheet closed, the button the thumb goes for was inert and
       the only working one was inside the sheet. Fixed here rather than filed
       because the pending list leans on that layout — the cashier recalls an
       order on a phone and the sheet is exactly what they are looking at.

       The guard reads the same `ready` rule renderFoot uses for `disabled`,
       so a recalled order whose lines are still in flight cannot be settled by
       a tap that beat them. */
    var goSettle = function () {
      if (S.recall ? S.recall.loading : !S.lines.length) return;
      S.view = 'settle'; S.err = ''; S.sel = null; render();
    };
    $('pay').addEventListener('click', goSettle);
    $('bar-pay').addEventListener('click', goSettle);
    $('hd-lang').addEventListener('click', function () { setLang(_lang === 'cn' ? 'en' : 'cn'); });
    $('hd-install').addEventListener('click', installAsk);
    $('inst-go').addEventListener('click', installAsk);
    $('inst-off').addEventListener('click', installDismiss);
    // §457 — Enter in the note field holds, as the sheet's own button does.
    $('holdpick').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target && e.target.id === 'hold-note') { e.preventDefault(); commitHold(); }
    });
    // §474 — typing an amount clears a picked percentage.
    $('discpick').addEventListener('input', function (e) {
      if (e.target && e.target.id === 'disc-amt') discTyped();
    });
    $('q').addEventListener('input', function (e) { S.q = e.target.value || ''; $('q-clr').hidden = !S.q; renderGrid(); });
    /* §500 — typing what the customer handed over. The change line, the quick
       buttons' mark and Mark paid are updated in place rather than re-drawing
       the screen, which would take the field, and the keyboard, away mid-number. */
    $('settle').addEventListener('input', function (e) {
      if (!e.target || e.target.id !== 'cash-in') return;
      S.cashIn = e.target.value || '';
      $('cash-ch').innerHTML = cashLine();
      var g = cashGiven();
      Array.prototype.forEach.call(document.querySelectorAll('.cb-b'), function (b) {
        b.classList.toggle('on', g != null && Number(b.getAttribute('data-cash')) === g);
      });
      var c = document.querySelector('.sconf');
      if (c) c.disabled = !canConfirm();
      $('shint').textContent = settleHint();
    });
    $('q-clr').addEventListener('click', function () { S.q = ''; $('q').value = ''; $('q-clr').hidden = true; renderGrid(); });
  }

  /* ====================================================================
     THE SERVICE WORKER.

     THIS IS WHY THE TILL CAN BE INSTALLED AT ALL. Chrome and Edge require a
     registered service worker with a fetch handler before they will fire
     beforeinstallprompt or show the omnibox install button — the manifest
     alone has never been enough — so /till had every other qualification and
     was still, permanently, a browser tab.

     /sw.js is the one shared worker for this origin; /m registers the same
     file at the same scope. Scope '/' covers this page's '/till' start_url,
     which is what Chrome checks. It is network-first for HTML, so an
     installed till is never pinned to a cached build, and the Cache-Control:
     no-store on the /till route still reaches the network on every load.

     NOTHING LISTENS FOR 'sw-updated' HERE, AND NOTHING SHOULD. The worker
     posts it to every client on activate and /m answers by reloading when it
     is safe to. A till must not: a basket lives in S.lines and nowhere else,
     so a reload behind a cashier with eight lines rung up throws the sale on
     the floor. The till picks up a new build the next time it is opened,
     which for a counter is every morning.

     Registered outside the boot chain deliberately — a till that cannot read
     its stores should still be installable, and the operator who fixes it
     will want it as an app either way.

     isSecureContext rather than a protocol check: it is the browser's own
     answer to the question a service worker asks, and it already knows the
     exceptions a string comparison forgets (localhost and 127.0.0.1 count, an
     http:// LAN address does not). */
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function (reg) {
      // An installed till can go a week without a navigation and browsers
      // throttle the automatic update check to about a day. Check when it
      // comes back to the foreground instead — same as /m and kitchen.html.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { try { reg.update(); } catch (e) {} }
      });
    }).catch(function () {});
  }

  start();
})();
</script>
</body>
