<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">

<!-- ANDROID / CHROME reads the manifest: name, icons, standalone display and
     the landscape lock all come from there. -->
<link rel="manifest" href="/till-manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS / SAFARI ignores nearly all of that and reads these. Safari is also
     the ONLY iOS browser that can install a PWA — Chrome on iOS cannot — so
     Add to Home Screen from Safari is the whole install path on an iPad.
     apple-mobile-web-app-capable is what makes it open standalone rather than
     as a Safari tab. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Counter">
<!-- "default", not "black-translucent": the till runs LIGHT. Translucent puts
     white status text over the page, which on #FBF9F4 paper is an invisible
     clock and battery. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Without an apple-touch-icon iOS puts a SCREENSHOT of the page on the home
     screen. 180x180 is the largest size iOS asks for; iPadOS wants 152 (iPad)
     and 167 (iPad Pro) and downsamples this one for both, which is why a single
     180 is sufficient and why it must not be smaller than 180. Note iOS does
     not accept SVG here — the manifest's raster icons are shared deliberately. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<meta name="theme-color" content="#FBF9F4">
<title>Counter</title>
<!-- Web type (Inter + Fraunces) is served from this application; see the note in /assets/fonts/tacet-fonts.css. -->
<link rel="stylesheet" href="/assets/fonts/tacet-fonts.css">
<style>
/* ==========================================================================
   COUNTER TILL — the cashier-facing screen on a shop tablet.

   Device: a shop tablet in landscape, touch only — no mouse and no keyboard
   beyond the on-screen one. Every target here is >= 44px; the working ones are
   52-76px.

   BOTH PLATFORMS, because Tacet does not get to dictate a customer's hardware.
   The two install paths are separate and neither substitutes for the other:
   Android Chrome installs from /till-manifest.webmanifest, iOS Safari reads the
   apple-* meta tags in the head and ignores most of the manifest. The two
   aspect ratios differ too — iPad is 4:3 (1024x768 CSS landscape), most Android
   tablets are 16:10 (1280x800) — so the layout is tested at both rather than at
   one. See the breakpoint note on .t-body.

   WHAT THIS IS NOT. It is not the removed /pos shell (deleted 2026-08-04,
   388c7e57) and it is not a second order path. It writes counter sales through
   the ordinary manual-order endpoint, POST /api/retail-admin/orders, with
   fulfillment_type 'counter' — the same path whose stock decrement and
   store_id rule landed in d0e21fe0. There is one path and this uses it.

   PAYMENT IS MANUAL, DELIBERATELY. Production has no Alipay credentials, so a
   one-QR settle cannot work — and the two wallets' payment codes are mutually
   unreadable anyway, so one QR could never have served both. The cashier reads
   the total aloud, keys it into a separate terminal, records WHICH wallet took
   it, and confirms. Legibility of that number is the whole job of the settle
   screen. See SETTLE_MODES: a scan mode slots in beside the manual one without
   touching anything else, and manual stays permanently as the fallback.

   COLOUR is the live --td-* block, copied verbatim from retail-admin.css
   (:8205-8254) — dark first, exactly as live, with light as the opt-in
   override. The till runs light: a counter is a bright room.

   TYPE is Inter, 400/500 only. No monospace exists in Tacet; money and
   quantities are Inter with tabular-nums.

   LANGUAGE: one at a time, never glued. cuT(en, cn) picks one, and every CN
   half is COPIED from a locked source — the live admin's own pairs or
   docs/tacet-delivery-vocabulary.md. The one exception is §450's international
   card pair, composed and declared there (v1.320). See STRINGS.
   ========================================================================== */

:root {
  /* verbatim, retail-admin.css :8205-8237 — dark, the cascade default */
  --td-surface:#18233A; --td-raised:#1E2A44; --td-border:#2A3550;
  --td-header:#364058;  --td-unseen:#182329;
  --td-text:#FBF9F4;    --td-text2:#9AA3B2;
  --td-dusk:#6E67AF;    --td-dusk-hi:#7E77BF; --td-dusk-tint:#262A4A;
  --td-sage:#A3B49F;    --td-sage-tint:#1E2C26; --td-sage-ink:#A3B49F;
  --td-amber:#C9954A;   --td-amber-tint:#33290F; --td-amber-ink:#C9954A;
  --td-brick:#B4533E;   --td-brick-tint:#351B14; --td-brick-ink:#D07A66;
  --td-paper:#111A2B;

  --f-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --r-control:8px; --r-card:14px; --r-pill:999px;
  --ease-settle:cubic-bezier(0.16,1,0.3,1);
}
:root[data-theme="light"] {
  /* verbatim, retail-admin.css :8238-8254 */
  --td-surface:#FFFFFF; --td-raised:#F6F3EC; --td-border:#E4E0D5;
  --td-header:#DAD5C6;  --td-unseen:#F4F5F0;
  --td-text:#111A2B;    --td-text2:#58606E;
  --td-dusk-tint:#EEEDF6;
  --td-sage-tint:#EDF1EC; --td-sage-ink:#4A6249;
  --td-amber-tint:#F7EEDE; --td-amber-ink:#8A6425;
  --td-brick-tint:#F6E7E3; --td-brick-ink:#B4533E;
  --td-paper:#FBF9F4;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--f-sans);font-size:15px;line-height:1.5;
  background:var(--td-paper);color:var(--td-text);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--td-dusk);outline-offset:2px}

/* ---- shell ---- */
.till{height:100%;display:flex;flex-direction:column;position:relative}
.t-head{
  height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--td-surface);border-bottom:1px solid var(--td-border);
}
/* THE WAY BACK. This screen is a separate page, not one of the phone's pushed
   ones, so nothing here draws the control every pushed screen has — and in an
   installed app there is no browser chrome to press Back in either. An operator
   who took the Counter till shortcut out of Tacet had no route home at all.
   A chevron at the head of the row, where every pushed screen on the phone puts
   it, and the title reads as that screen's title beside it. Icon only: this row
   already carries the store picker and the language, and the word is on the
   control's label for anyone who cannot see the arrow. Hidden unless the server
   says there is a home to return to — see `home` in /api/backend/me. */
.t-back{
  /* 44 square, the same floor the store button and the language button keep:
     the row's own padding is pulled back so the arrow still sits at the edge
     the title would have started from. */
  width:44px;height:44px;flex:none;margin-left:-12px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:0;background:transparent;color:var(--td-text2);
}
.t-back:active{color:var(--td-text)}
.t-back svg{width:22px;height:22px}
.t-brand{font-size:15px;font-weight:500;letter-spacing:-.01em}
.t-dot{width:4px;height:4px;border-radius:50%;background:var(--td-border);flex:none}
/* The store is a CONTROL, not a caption. It was a <span>, and the saved-store
   key it restored from was never written by anything — so the till always fell
   through to the first store and a second location was unreachable. */
.t-store{
  min-height:44px;padding:0 10px;border:1px solid transparent;background:transparent;
  border-radius:var(--r-control);font-size:13px;color:var(--td-text2);
  display:inline-flex;align-items:center;gap:6px;
}
.t-store.switchable{border-color:var(--td-border)}
.t-store .chev{width:14px;height:14px;flex:none}

/* Store picker — a centred pop-up. Not a drawer: this is a short list and a
   decision, and it sits over the till rather than beside it. */
.sscrim{
  position:absolute;inset:0;z-index:20;background:rgba(17,26,43,.38);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.ssheet{
  width:100%;max-width:360px;max-height:100%;overflow-y:auto;
  background:var(--td-surface);border:1px solid var(--td-border);
  border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:8px;
}
.ssheet .hd{font-size:13px;color:var(--td-text2);margin-bottom:2px}
.srow{
  min-height:56px;padding:0 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font-size:16px;text-align:left;display:flex;align-items:center;gap:10px;
}
.srow.on{border-color:var(--td-text);background:var(--td-raised)}
.srow .tick{width:18px;height:18px;flex:none;opacity:0}
.srow.on .tick{opacity:1}
.t-sp{flex:1}
.hbtn{
  min-width:44px;height:44px;padding:0 12px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text2);
  font-size:13px;font-weight:500;
}
/* THE INSTALL CONTROL, kept after the strip below is dismissed. Icon only, for
   the reason the back chevron is: this row already carries the store picker and
   the language, and a word here would be the fourth. The word IS on the
   control — as its aria-label — for anyone who cannot see the arrow.
   "Add" on its own was the obvious label and is the wrong one: this screen's
   other verb-less Add puts a PRODUCT in the basket. */
.hbtn-ic{display:inline-flex;align-items:center;justify-content:center;padding:0}
.hbtn-ic svg{width:20px;height:20px}

/* THE ASK. A strip under the header, not a banner over the till: the grid and
   the order rail both stay whole, and the row it pushes down costs 44px on a
   screen that has them.
   It is shown ONCE — dismissing it, or installing, writes INSTALL_KEY and it
   does not come back. The header button above is where it lives afterwards, so
   a dismissal is not a decision the cashier can never take back. */
.t-install{
  flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;
  background:var(--td-dusk-tint);border-bottom:1px solid var(--td-border);
}
.t-install .ic{flex:none;display:flex;color:var(--td-dusk)}
.t-install .ic svg{width:20px;height:20px}
.t-install .msg{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--td-text)}
.t-install .go{
  flex:none;min-height:36px;padding:0 14px;border:0;border-radius:var(--r-control);
  background:var(--td-dusk);color:#fff;font-family:inherit;font-size:13px;font-weight:500;
}
.t-install .off{
  flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--td-text2);font-size:20px;line-height:1;
}
/* §440 — THE SOUND STRIP. Same place and look as the install ask, because it
   is the same kind of thing: a one-tap fix the browser needs from a person.
   The whole strip is the button; any tap anywhere on the till clears it too. */
.t-sound{width:100%;border:0;font-family:inherit;text-align:left;cursor:pointer}
.t-sound .msg{font-weight:500}
.t-body{flex:1;display:flex;min-height:0}

/* ---- left: entry ---- */
.t-entry{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px;gap:12px}
/* Search is ABOVE the grid: tapping it raises the on-screen keyboard, which
   covers the lower half of the screen. A field below the grid would be hidden
   by the very keyboard it summons. */
.srch{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--td-surface);border:1px solid var(--td-border);
  border-radius:var(--r-control);
}
.srch svg{width:18px;height:18px;flex:none;color:var(--td-text2)}
.srch input{
  /* Fills the bar's full 52px. Without the height the input is its own ~25px
     content box inside a 52px row, so the actual tap target is half the
     control the cashier can see — and the half that misses just focuses
     nothing. */
  flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:15px;
  color:var(--td-text);-webkit-user-select:text;user-select:text;
}
.srch input:focus{outline:none}
.srch input::placeholder{color:var(--td-text2)}
.srch .clr{
  width:44px;height:44px;flex:none;border:0;background:transparent;
  color:var(--td-text2);border-radius:var(--r-control);font-size:20px;
}
.cats{display:flex;gap:8px;flex:none;overflow-x:auto;padding-bottom:2px}
/* §287 — the Sold out control sits at the end of the category row, pinned, so
   the categories scroll under it and it never scrolls off. */
.catrow{display:flex;gap:8px;align-items:center;flex:none}
.catrow .cats{flex:1;min-width:0}
.cat.so{border-style:dashed}
.cat.so.on{background:var(--td-brick-tint);border-color:var(--td-brick-ink);border-style:solid;color:var(--td-brick-ink)}
.cat.so[hidden]{display:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  height:44px;padding:0 16px;flex:none;display:inline-flex;align-items:center;
  border-radius:var(--r-pill);border:1px solid var(--td-border);
  background:var(--td-surface);color:var(--td-text2);font-size:14px;font-weight:500;
  white-space:nowrap;
}
.cat.on{background:var(--td-text);border-color:var(--td-text);color:var(--td-paper)}
.grid{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:100px;gap:12px;align-content:start;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
/* THE COLUMN COUNT IS THE ONLY THING HERE THAT HAS TO ADAPT.
   The rail is `flex:none` at 380px, so it never gives ground — at every
   viewport the entry side absorbs the whole difference (entry = vw - 380 - 32),
   which makes viewport width a direct proxy for column width and a plain media
   query the right tool.
   Measured, four fixed columns give: 204px cells at 1280 (16:10 Android
   tablet), 140px at 1024 (4:3 iPad landscape), and 76px on a portrait iPad at
   768 — where .tile's overflow:hidden clips the product name with no visible
   sign that it did. Portrait is reachable on iOS no matter what the manifest
   says, because iOS ignores the orientation lock that Android honours, so the
   narrow case is a real device state rather than a hypothetical one.
   Both breakpoints keep cells >= ~110px, which is the width at which a name
   and a price still read. */
@media (max-width:900px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (max-width:700px){ .grid{grid-template-columns:repeat(2,1fr)} }
.tile{
  border-radius:var(--r-card);border:1px solid var(--td-border);
  background:var(--td-surface);padding:10px 12px;display:flex;flex-direction:column;
  justify-content:space-between;text-align:left;overflow:hidden;
}
.tile:active{background:var(--td-raised)}
.tile .nm{
  font-size:14px;font-weight:500;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* §183 — the size, under the name. Its own line rather than appended, because
   .tile .nm clips at two lines and a long product name would otherwise eat the
   one word that tells two tiles apart. Same weight as the name, dimmer, so the
   pair reads as one label and not as two facts.
   §290 — AND OUTSIDE THE CLAMP. It used to sit INSIDE .nm, so the two-line
   clamp counted it as a third line and cut it: on an iPad column "Organic
   Matcha Latte" wrapped to two lines and "Large" vanished — the exact word it
   exists to show. .hd holds the pair; only the name is clamped.
   Two name lines, the size and the price row are then 6px taller than a
   100px row, so the tile's top and bottom padding went 12px -> 10px and the
   size line was tightened, rather than making every row in the grid taller. */
.tile .hd{display:block;min-width:0}
.tile .vl{
  display:block;font-style:normal;font-size:13px;font-weight:400;line-height:1.25;
  color:var(--td-text2);margin-top:1px;
}
.tile.out .vl{color:var(--td-text2)}
/* A product that asks something before it can be made. The dot is the whole
   signal: a cashier learns in one shift that a dotted tile opens a sheet, and
   a word here would be the third thing on a tile that already carries a name,
   a size, a code and a price. */
.tile .ask{
  position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;
  background:var(--td-text2);
}
.tile{position:relative}
.tile .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* On a tile the code sits left of the price and yields first: a long name
   already clamps to two lines, and the price must never be the thing that
   gets squeezed out. */
.tile .sku{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tile .pr{flex:none}
.tile .pr{font-size:15px;font-variant-numeric:tabular-nums}
.tile .lo{
  font-size:12px;font-weight:500;border-radius:var(--r-pill);padding:2px 8px;
  font-variant-numeric:tabular-nums;color:var(--td-amber-ink);background:var(--td-amber-tint);
  /* A pill that wraps is not a pill. "Out of stock" broke across two lines and
     came out as "Ou"/"stc"; it holds its shape and lets the row shrink around
     it instead. */
  white-space:nowrap;flex:none;
}
/* Out of stock keeps its slot. Muscle memory is the point of a tile grid, so a
   sold-out line stays where the thumb expects it — struck through and not
   tappable — rather than vanishing and reshuffling every tile after it. */
.tile.out{background:var(--td-raised);border-style:dashed}
.tile.out .nm{color:var(--td-text2)}
.tile.out .lo{color:var(--td-brick-ink);background:var(--td-brick-tint)}
/* §287 — while marking sold out, a switched-off tile is still tappable (it is
   how it comes back), so it keeps the dashed look without the disabled one. */
.tile.so-busy{opacity:.5}
/* §492 — A MADE-HERE ITEM'S ANSWERS, under the tiles while marking sold out.
   One row per item that asks something, one chip per answer; a chip is the
   same switch as a tile, for "out of crackers" rather than "out of hummus".
   The rows grow with their chips, so only in this mode may a grid row be
   taller than its tile. */
.grid.so{grid-auto-rows:minmax(100px,auto)}
.grid.so.pics{grid-auto-rows:minmax(180px,auto)}
.so-opts{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.so-oh{font-size:14px;font-weight:500}
.so-oh .vl{font-style:normal;font-weight:400;color:var(--td-text2);margin-left:6px}
.so-oc{display:flex;flex-wrap:wrap;gap:8px}
.so-c{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;
  border-radius:var(--r-card);border:1px solid var(--td-border);background:var(--td-surface);
  font-size:14px;text-align:left;
}
.so-c:active{background:var(--td-raised)}
.so-c.out{background:var(--td-raised);border-style:dashed;color:var(--td-text2)}
.so-c .lo{
  font-size:12px;font-weight:500;border-radius:var(--r-pill);padding:2px 8px;white-space:nowrap;
  color:var(--td-brick-ink);background:var(--td-brick-tint);
}
.so-c.so-busy{opacity:.5}
/* §289 — THE PHOTO. Across the top of the tile, because a picture is read
   before a word is: two products with the same name are told apart by what
   they look like. Across the top rather than beside the name, because the
   name has to keep the tile's full width — at 140px an iPad column has no
   room for a thumbnail AND a name that still ends with "Toast".
   THE WHOLE PHOTO, NEVER CROPPED. Product photos are square (the shop and the
   editor show them 1:1), and a full-width strip cut them to a band across the
   middle. So the photo keeps its own shape, centred in the strip, and the
   strip's tint fills the sides.
   The rows grow to fit it only when this till has any photos at all (.pics),
   so a tenant with none keeps today's grid exactly. A product with no photo in
   a grid that has them is the ordinary tile, just taller. */
.grid.pics{grid-auto-rows:180px}
/* §499 — THE BEST-SELLERS ROW. One cell across the grid's first row, sized by
   its content rather than by grid-auto-rows, holding its own small grid of
   photo-less tiles and the heading over the tiles that follow.
   Six across only where six still read: at 1280 a cell is ~135px, at 1024
   (iPad landscape) it would be ~92px and clip every name, so below 1180 it is
   two rows of three. On a phone, two columns and four tiles, so the row does
   not push the whole catalogue below the fold. */
.grid.has-best{grid-template-rows:auto}
.best{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.best-hd{display:flex;align-items:baseline;gap:10px}
.best-t{font-size:15px;font-weight:500}
.best-w{font-size:13px;color:var(--td-text2)}
.best-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:8px}
.tile.bs{height:88px}
@media (min-width:1180px){ .best-row{grid-template-columns:repeat(6,minmax(0,1fr))} }
@media (max-width:700px){
  .best-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .best-row .tile:nth-child(n+5){display:none}
}
.tile.has-ph{justify-content:flex-start}
.tile.has-ph .ft{margin-top:auto}
.tile .ph{
  display:flex;justify-content:center;flex:none;height:84px;margin:-10px -12px 8px;
  padding:6px 0;background:var(--td-raised);overflow:hidden;
}
.tile .ph img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain;border-radius:6px}
.tile.out .ph img{opacity:.45;filter:grayscale(1)}
/* The question dot sits on the photo strip now; a ring keeps it visible. */
.tile.has-ph .ask{box-shadow:0 0 0 2px var(--td-surface)}
.gempty{
  grid-column:1/-1;padding:32px;text-align:center;color:var(--td-text2);font-size:14px;
}

/* ---- the two faces of the entry side --------------------------------------
   A shop taking QR orders has two jobs at one counter: ring up the walk-in in
   front of you, and settle the order somebody placed on their phone two minutes
   ago. They need the same space — the grid and the list are both the full pane
   — so they take turns rather than splitting it.

   THE SWITCH IS ABSENT, NOT DISABLED, WHEN NOTHING IS WAITING. A shop with no
   QR orders (or no shop record at all) sees the till exactly as it shipped: no
   control, no empty list, no word for "nothing here" to translate. That also
   makes the count the ONLY thing the switch ever says, so a badge on screen
   always means there is something behind it.

   The rail was considered and rejected: under 700px it is a bottom sheet behind
   a tap, and a list the counter works from cannot live one gesture away. */
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
/* An author `display` beats the UA's [hidden], so without this the pane that is
   supposed to be down renders on top of the one that is up. */
.pane[hidden]{display:none}
.seg{display:flex;gap:8px;flex:none}
.seg[hidden]{display:none}
.sbtn{
  height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;
  border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);color:var(--td-text2);font-size:14px;font-weight:500;
  white-space:nowrap;
}
.sbtn.on{background:var(--td-dusk);border-color:var(--td-dusk);color:#fff}
.sbtn .b{
  min-width:22px;height:22px;padding:0 7px;border-radius:999px;
  background:var(--td-dusk);color:#fff;font-size:12px;font-weight:500;
  font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;justify-content:center;
}
.sbtn.on .b{background:rgba(255,255,255,.26)}

/* ---- one waiting order ----
   The number is the whole of the retrieval: the customer says it or holds it
   up, and the cashier's eye has to find it in a list without reading. So it
   gets the same treatment the customer's own screen gives it — the biggest
   thing on the row, in its own block, ahead of everything else. */
.plist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:8px;align-content:start}
.wrow{
  flex:none;display:flex;align-items:center;gap:14px;padding:10px 14px;min-height:64px;
  border-radius:var(--r-card);border:1px solid var(--td-border);
  background:var(--td-surface);text-align:left;width:100%;
}
.wrow:active{background:var(--td-raised)}
.wrow .n{
  min-width:52px;height:44px;padding:0 10px;flex:none;border-radius:var(--r-control);
  background:var(--td-dusk-tint);color:var(--td-dusk);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;
}
.wrow .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wrow .who b{
  font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* The meta line carries the time, and the DATE too on any row not from the same
   trading day as the newest — §49 requires the short code be read with its shop
   and its date, and two days' unpaid orders in one list is exactly where two
   14s could otherwise sit together. */
.wrow .who i{font-style:normal;font-size:12px;color:var(--td-text2);font-variant-numeric:tabular-nums}
.wrow .amt{flex:none;font-size:16px;font-variant-numeric:tabular-nums}
/* §457 — a held bill from an earlier day. Its date is the warning: nothing
   deletes a held bill by itself, so a forgotten one has to stand out. */
.wrow .who i.old{color:var(--td-amber-ink)}

/* ---- right: the order ---- */
.t-order{
  width:380px;flex:none;background:var(--td-surface);
  border-left:1px solid var(--td-border);display:flex;flex-direction:column;min-height:0;
}
.cust{
  flex:none;min-height:56px;display:flex;align-items:center;gap:10px;
  padding:6px 16px;border-bottom:1px solid var(--td-border);
}
.cust .who{flex:1;min-width:0;font-size:14px;color:var(--td-text2)}
.cust.on .who{color:var(--td-text)}
.cust .sub{font-size:12px;color:var(--td-text2);font-variant-numeric:tabular-nums}
/* A voucher the attached customer holds at this counter — ink, not grey, so
   it reads as a fact about them rather than more small print. */
.cust .sub .held{color:var(--td-text);font-weight:600}
.cbtn{
  min-height:44px;padding:0 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none;
}
.lines{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ln{
  width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--td-border);padding:12px 16px;min-height:64px;
  display:flex;gap:12px;align-items:baseline;
}
.ln .nm{flex:1;min-width:0;font-size:15px}
.ln .sb{
  font-size:13px;color:var(--td-text2);font-variant-numeric:tabular-nums;margin-top:2px;
  display:flex;align-items:baseline;gap:8px;
}
/* WHAT THE CUSTOMER CHOSE on a recalled QR line. Quieter than the product name
   and sitting under it, because it qualifies that line rather than being one:
   the cashier reads the drink first and checks the answers against the cup. It
   wraps rather than truncating — a sugar level the counter cannot finish
   reading is worse than one that takes two lines. */
.ln .lno{
  font-size:12px;color:var(--td-text2);margin-top:2px;
  overflow-wrap:anywhere;
}

/* The product code, quieter than the name and steadier than it: tabular figures
   so a column of codes lines up under each other. NOT monospace — Tacet has
   none, and Inter's tabular figures already give the alignment that would have
   been the reason to reach for one. */
.sku{
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
  color:var(--td-text2);white-space:nowrap;
}
.ln .sb .sku{
  background:var(--td-raised);border-radius:var(--r-pill);padding:1px 7px;
}
.ln .tt{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .q{
  font-size:13px;font-weight:500;color:var(--td-text2);background:var(--td-raised);
  border-radius:var(--r-pill);padding:1px 8px;margin-right:6px;font-variant-numeric:tabular-nums;
}
.ln.sel{background:var(--td-raised);border-left:3px solid var(--td-text);padding-left:13px}
/* Controls open INSIDE the line. A modal would cover the order the cashier is
   reading aloud from and charge a dismiss tap for every quantity fix. */
.lctl{
  display:flex;align-items:center;gap:10px;padding:12px 16px 12px 13px;
  background:var(--td-raised);border-bottom:1px solid var(--td-border);
  /* The ink edge marks the SELECTED line, so it belongs to the selected state
     and not to the strip. On a phone every line carries a strip and nothing is
     selected — a bar on all of them would claim a selection that is not there.
     Transparent rather than absent so the rows stay aligned either way. */
  border-left:3px solid transparent;
}
.lctl.sel{border-left-color:var(--td-text)}

/* ONE CONTROL, NOT THREE. Each of -, the count and + used to carry its own
   border with 10px of air between them, so a single quantity read as three
   floating chips and the number it changes appeared to belong to neither
   button. They share a border now, divided by hairlines: the group is the
   control, the hairlines are the seams, and the 52px targets are unchanged. */
.qgrp{
  display:inline-flex;align-items:stretch;flex:none;overflow:hidden;
  border:1px solid var(--td-border);border-radius:var(--r-control);
  background:var(--td-surface);
}
.step{
  width:52px;height:52px;flex:none;border:0;border-radius:0;
  background:transparent;color:var(--td-text);
  font-size:22px;display:grid;place-items:center;
}
.step[disabled]{color:var(--td-text2);background:var(--td-raised)}
.stepn{
  min-width:56px;height:52px;display:grid;place-items:center;
  font-size:18px;font-variant-numeric:tabular-nums;
  border-left:1px solid var(--td-border);border-right:1px solid var(--td-border);
}
.lsp{flex:1}
/* QUIET, NOT ABSENT. A brick-outlined box made the destructive control the
   loudest thing in the row — louder than the price — and it read as a form
   button dropped into a list. It keeps its ink, its 52px target and its
   distance from the +/- pair (that gap is mis-tap protection, not spacing),
   and gives up the border it never needed: stepping the quantity to zero
   already removes a line, so this is a shortcut rather than the only way out. */
.rm{
  height:52px;padding:0 12px;border-radius:var(--r-control);
  border:0;background:transparent;color:var(--td-brick-ink);
  font-size:14px;font-weight:500;
}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:32px;text-align:center;
}
.empty p{margin:0;font-size:14px;color:var(--td-text2);max-width:28ch}
.foot{flex:none;border-top:1px solid var(--td-border);padding:16px;background:var(--td-surface)}
.sums{font-size:13px;color:var(--td-text2)}
.sums div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
/* §426 — the typed-phone check on a recalled QR order: the note and the one
   control that answers it, on one row. */
.sums .vck{align-items:center;gap:10px;margin-top:6px;color:var(--td-text)}
.sums .vck span{flex:1;min-width:0}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 14px}
.tot .lb{font-size:15px}
/* The number the cashier reads aloud. Nothing else on the screen is this size. */
.tot .amt{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
/* INK, not Dusk. Dusk means "tacet did this for you"; taking money at a counter
   is the cashier acting (patterns S1.8 rule 5, corrected axis). The till spends
   no Dusk budget at all — Dusk appears here only as a focus ring. */
.pay{
  width:100%;height:76px;border-radius:var(--r-control);
  border:1px solid var(--td-text);background:var(--td-text);color:var(--td-paper);
  font-size:19px;font-weight:500;display:flex;align-items:center;justify-content:center;
  gap:12px;font-variant-numeric:tabular-nums;
}
.pay[disabled]{background:var(--td-raised);border-color:var(--td-border);color:var(--td-text2)}
/* Cancelling the customer's order. NOT a second .pay: the two outcomes are not
   equals, and a destructive control the size and weight of the one beside it is
   a mis-tap waiting to happen at a busy counter. Quiet until armed, and then
   Brick — the token this admin already uses for the destructive end of things. */
.cxo{
  width:100%;height:44px;margin-top:8px;border:1px solid transparent;
  background:transparent;color:var(--td-text2);border-radius:var(--r-control);
  font-size:14px;font-weight:500;
}
.cxo[hidden]{display:none}
.cxo:active{background:var(--td-raised)}
.cxo[disabled]{color:var(--td-text2)}
.cxo.arm{
  background:var(--td-brick-tint);border-color:var(--td-brick);color:var(--td-brick-ink);
}
/* The question the armed control answers. It sits ABOVE the control for the
   same reason the control sits under Mark paid: the cashier reads down to the
   thing that acts, and a question printed under its own answer is read second. */
.cxq{
  margin-top:10px;font-size:14px;font-weight:500;text-align:center;
  color:var(--td-brick-ink);
}
.cxq[hidden]{display:none}
/* §457 — Hold. Quiet like .cxo and for the same reason: it is not the act the
   rail is for, and a second full-weight button under Mark paid would compete
   with it. Neutral ink, not Brick: nothing is lost by holding. */
.hold{
  width:100%;height:44px;margin-top:8px;border:1px solid var(--td-border);
  background:transparent;color:var(--td-text);border-radius:var(--r-control);
  font-size:14px;font-weight:500;
}
.hold[hidden]{display:none}
/* §474 — the hand discount. The same quiet shape as Hold, for the same
   reason: it is not the act the rail is for. Only drawn for an operator who
   holds till:discount. */
.disc{
  width:100%;height:44px;margin-top:8px;border:1px solid var(--td-border);
  background:transparent;color:var(--td-text);border-radius:var(--r-control);
  font-size:14px;font-weight:500;
}
.disc[hidden]{display:none}
.disc:active{background:var(--td-raised)}
.disc[disabled]{color:var(--td-text2)}
/* The sheet: four quick percentages in one row, then the amount, then why. */
.dpcts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dpcts .srow{justify-content:center;padding:0;font-variant-numeric:tabular-nums}
.derr{font-size:14px;font-weight:500;color:var(--td-brick-ink)}
.derr:empty{display:none}
.hold:active{background:var(--td-raised)}
.hold[disabled]{color:var(--td-text2)}
/* WHAT WENT WRONG, ON THE SCREEN IT WENT WRONG ON. Same ink as the settle
   screen's .serr — a failure should not look like a different kind of thing
   depending on which half of the till raised it. */
.terr{
  margin-bottom:12px;font-size:14px;text-align:center;
  color:var(--td-brick-ink);background:var(--td-brick-tint);
  border-radius:var(--r-control);padding:10px 14px;
}
.terr[hidden]{display:none}

/* ---- §183 option sheet: the store picker's sheet, with questions in it ----
   Same .ssheet body as every other decision on this till, so the sheet a
   cashier meets for "hot or iced" is the sheet they already know from the
   store and customer pickers. Wider, because a question plus its answers plus
   a price is three columns where a store name was one. */
.opt-sheet{max-width:460px;gap:6px}
.opt-nm{font-size:17px;font-weight:500;margin-bottom:6px}
.opt-q{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-size:13px;color:var(--td-text2);margin:10px 0 2px;
}
.opt-q .req,.opt-q .lim{font-style:normal;font-size:12px}
.opt-q .req{color:var(--td-amber-ink);background:var(--td-amber-tint);border-radius:var(--r-pill);padding:1px 8px}
.opt-c{min-height:52px}
.opt-c .ol{flex:1;min-width:0}
.opt-c .od{flex:none;font-size:14px;color:var(--td-text2);font-variant-numeric:tabular-nums}
/* A sold-out extra greys and stays in place — §120 rule 1A, and the same
   reasoning the grid uses for a sold-out tile: a row that vanishes reshuffles
   every row under it and takes the cashier's place on the screen with it. */
.opt-c.out{border-style:dashed;opacity:.65}
.opt-c.out .ol{color:var(--td-text2)}
.opt-c .od.out{color:var(--td-brick-ink);background:var(--td-brick-tint);border-radius:var(--r-pill);padding:1px 8px;font-size:12px}
/* A repeatable answer's − n + counter. The row is the +; the − is its own
   target, wide enough for a thumb. */
.opt-rep{cursor:pointer}
.opt-ct{flex:none;display:flex;align-items:center;gap:2px;margin-left:10px}
.opt-dec,.opt-inc{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--td-border);border-radius:var(--r-pill);
  font-size:18px;line-height:1;color:var(--td-text);
}
.opt-dec.off,.opt-inc.off{opacity:.3}
.opt-n{min-width:24px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.opt-err{
  margin-top:10px;font-size:13px;text-align:center;
  color:var(--td-brick-ink);background:var(--td-brick-tint);
  border-radius:var(--r-control);padding:8px 12px;
}
.opt-ft{display:flex;gap:8px;margin-top:14px}
.opt-ft .ccancel{flex:none}
.opt-go{
  flex:1;min-height:52px;border-radius:var(--r-control);
  border:1px solid var(--td-text);background:var(--td-text);color:var(--td-paper);
  font:inherit;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;
}

/* ---- customer picker: the store picker's sheet, with a search in it ---- */
.cust-sheet{max-width:460px;gap:10px}
.csearch{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-radius:var(--r-control);background:var(--td-paper);border:1px solid var(--td-border);
}
.csearch svg{width:18px;height:18px;flex:none;color:var(--td-text2)}
.csearch input{
  flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:15px;
  color:var(--td-text);-webkit-user-select:text;user-select:text;
}
.csearch input:focus{outline:none}
.crows{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px}
.crow{
  min-height:60px;padding:8px 14px;border-radius:var(--r-control);
  border:1px solid var(--td-border);background:transparent;color:var(--td-text);
  font:inherit;display:flex;align-items:center;gap:12px;text-align:left;
}
.cwho{flex:1;min-width:0;font-size:15px;display:flex;flex-direction:column;gap:2px}
.cbal{
  flex:none;font-size:13px;text-align:right;
  display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;
}
.cmeta{font-size:13px;color:var(--td-text2);font-variant-numeric:tabular-nums}
.cempty{padding:18px 4px;text-align:center;color:var(--td-text2);font-size:14px}
/* §428 — nobody found: the picker offers to add them. Two fields and one
   control, in the search field's own shape so it reads as the same sheet. */
.cnew{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.cnew input{
  height:48px;padding:0 14px;border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-paper);font:inherit;font-size:15px;color:var(--td-text);
  -webkit-user-select:text;user-select:text;
}
.cnew input:focus{outline:none;border-color:var(--td-text2)}
.cnew .cbtn{justify-content:center}
.ccancel{
  min-height:52px;border-radius:var(--r-control);border:1px solid var(--td-border);
  background:transparent;color:var(--td-text2);font:inherit;font-size:15px;font-weight:500;
}

/* ---- settle: a takeover, not a sheet ----
   The cashier turns the tablet round or leans over it; nothing of the till
   should stay readable behind. A page is a takeover, not an overlay. */
.settle{position:absolute;inset:0;background:var(--td-paper);display:flex;flex-direction:column;padding:20px 28px 24px}
.stop{display:flex;align-items:center;gap:12px;flex:none}
.back{
  height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;
  border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);font-size:14px;font-weight:500;
}
/* THE ESCAPE MUST SURVIVE A SHORT SCREEN.
   .stop (which holds Back) and .sfoot (which holds Confirm) are both
   flex:none, so they always get their space — but without overflow here the
   middle simply grew past its box and drew ON TOP of them. Measured at
   1024x480 with all five wallets open: the picker ran y=26 to y=394, covering
   the Back button at y=20-64 and the Confirm at y=356. Back was still "on
   screen" and still untappable, which is the worst version of the bug.
   That matters more on iOS than the height alone suggests: a standalone PWA
   has no swipe-back gesture, so this button is the ONLY way out of the
   takeover. It cannot be allowed to sit underneath something.
   "safe" centring keeps the centred look but degrades to flex-start once the
   content is taller than the box, rather than centring it and pushing the top
   out of reach of the scroll. */
.smain{
  flex:1;display:flex;align-items:safe center;justify-content:center;
  gap:56px;min-height:0;overflow-y:auto;
}
.samt{text-align:right;flex:none}
.samt .lb{font-size:15px;color:var(--td-text2);margin-bottom:6px}
/* Legibility is the whole job here: the cashier reads this and keys it into a
   separate terminal by hand. */
.samt .amt{font-size:64px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.samt .sb{font-size:14px;color:var(--td-text2);margin-top:10px;font-variant-numeric:tabular-nums}
.spick{flex:none;width:340px}
.spick .lb{font-size:13px;color:var(--td-text2);margin-bottom:8px}
.wal{
  width:100%;min-height:60px;padding:0 16px;margin-bottom:8px;
  border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);display:flex;align-items:center;gap:12px;
  font-size:16px;text-align:left;
}
.wal .rad{
  width:22px;height:22px;flex:none;border-radius:50%;
  border:1.5px solid var(--td-border);display:grid;place-items:center;
}
.wal.on{border-color:var(--td-text);background:var(--td-raised)}
.wal.on .rad{border-color:var(--td-text)}
.wal.on .rad::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--td-text)}
/* §500 — the international card, last and set apart: a mis-tap adds 4%. */
.wal.sep{margin-top:16px}
/* §500 — the cash box, under Cash once picked. */
.cashbox{
  margin:-2px 0 10px;padding:12px 14px;border-radius:var(--r-control);
  background:var(--td-raised);display:flex;flex-direction:column;gap:8px;
}
.cb-l{font-size:13px;color:var(--td-text2)}
.cb-in{
  height:48px;padding:0 12px;border-radius:var(--r-control);border:1px solid var(--td-border);
  background:var(--td-surface);color:var(--td-text);font:inherit;font-size:20px;
  font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text;
}
.cb-q{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cb-b{
  min-height:44px;padding:0 4px;border-radius:var(--r-pill);border:1px solid var(--td-border);
  background:var(--td-surface);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.cb-b.on{border-color:var(--td-text);background:var(--td-text);color:var(--td-paper)}
.cb-ch{display:flex;align-items:baseline;justify-content:space-between;min-height:30px}
.cb-k{font-size:15px;color:var(--td-text2)}
.cb-v{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.cb-v.short{color:var(--td-brick-ink)}
/* ---- store credit (§93) ----
   The same row as a wallet, because it is the same act — choosing what pays for
   this sale — and a cashier should not have to learn two controls for it. Two
   differences, both carrying meaning rather than decoration:

   THE INDICATOR IS A SQUARE, NOT A CIRCLE. The wallet rows are a radio group,
   exactly one of which can be true; points and balance are independent and can
   both be on at once. A round indicator on a multi-select is the one place this
   screen would be lying about how it behaves.

   AND THE ROW CARRIES ITS FIGURE. A wallet row is a name — the amount is the
   one big number above it — while a credit row has to answer "how much does
   this take off?" before it is tapped, which is the whole question the cashier
   is being asked. `.cv` holds it, right-aligned and tabular so two rows'
   figures line up on the decimal, and it goes quiet until the row is on so the
   applied deduction is visibly different from the offer. */
.cred{margin-bottom:8px}
.cred .box{
  width:22px;height:22px;flex:none;border-radius:5px;
  border:1.5px solid var(--td-border);display:grid;place-items:center;
}
.cred.on .box{border-color:var(--td-text)}
.cred.on .box::after{
  content:"";width:11px;height:6px;margin-top:-3px;
  border-left:2px solid var(--td-text);border-bottom:2px solid var(--td-text);
  transform:rotate(-45deg);
}
.cred .cl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
/* The balance behind the row: how many points, or how much wallet. A numeral
   needs no label, which is why this row mints no string. */
.cred .cl em{font-style:normal;font-size:13px;color:var(--td-text2);font-variant-numeric:tabular-nums}
.cred .cv{flex:none;font-variant-numeric:tabular-nums;color:var(--td-text2)}

}

/* ---- done ---- */
.done{display:flex;flex-direction:column;align-items:center;gap:16px}
.mark{
  width:104px;height:104px;border-radius:50%;background:var(--td-sage-tint);
  display:grid;place-items:center;color:var(--td-sage-ink);
}

.done .meta{font-size:14px;color:var(--td-text2);font-variant-numeric:tabular-nums;text-align:center}
/* §500 — the change due, large enough to read while counting coins. */
.done .dchange{font-size:16px;color:var(--td-text2);font-variant-numeric:tabular-nums;text-align:center}
.done .dchange b{font-size:28px;font-weight:500;color:var(--td-text);margin-left:4px}

}

   and fire-and-forget, the moment the sale settled. This is the second copy. */
.dsec{
  min-height:60px;padding:0 20px;border-radius:var(--r-control);

/* ---- boot / signed out ---- */
.boot{

/* The phone-only furniture, inert on a tablet. Declared HERE, above the
   override block, because equal-specificity rules are decided by source order
   — written below it, these would win and the phone layout would silently do
   nothing. That is exactly what happened on the first pass: .t-bar{display:none}
   sat after the media query and the bar never appeared.
   The stepper strip keeps its old tablet behaviour exactly: hidden unless its
   line is the selected one. */
.sheet-grab{display:none}
.sheet-scrim{display:none}
.t-bar{display:none}
.cust .sheet-ttl{display:none}
.tile .incart{display:none}
.lctl{display:none}
.ln.sel + .lctl{display:flex}

/* ══ OVERRIDES LAST ══════════════════════════════════════════════════════
   This block must stay at the END of the sheet. It targets .t-order, .lines,
   .smain, .samt, .spick and .sconf, all of which are declared further up at
   the SAME specificity — written any earlier, their base rules win and the
   media query silently does nothing. It was written earlier the first time,
   and the rail kept computing to width:380px inside a 375px phone. */
/* ── PHONE ────────────────────────────────────────────────────────────────
   THE ORDER STOPS BEING A COLUMN AND BECOMES A BAR.

   A phone has one column of room and two things competing for it. The
   products are touched dozens of times a sale; the order is checked two or
   three. The first attempt split the screen between them, which served the
   rare job at the cost of the constant one and left the order list a
   two-line strip the eye reads as a footer — present, but not readable.

   So: the grid gets the screen. The bar keeps the only part of the order
   that must always be true, the total, and opens the rest at full height —
   ~465px of list rather than ~150. The rail element itself becomes that
   sheet, so there is one order list in the DOM, not two.

   Specified in reference/counter-till-mobile-mockup.html. */
@media (max-width:700px){
  .t-body{flex-direction:column}
  .t-entry{flex:1 1 auto;min-height:0}

  /* The rail, restyled into a bottom sheet. */
  .t-order{
    position:absolute;left:0;right:0;bottom:0;top:auto;
    width:100%;height:86%;max-height:none;flex:0 0 auto;z-index:12;
    border-left:0;border-top:1px solid var(--td-border);
    border-radius:18px 18px 0 0;
    box-shadow:0 -2px 6px rgba(17,26,43,.06), 0 -12px 32px rgba(17,26,43,.10);
    transform:translateY(101%);
    transition:transform .28s var(--ease-settle);
  }
  .till.sheet-open .t-order{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){ .t-order{transition:none} }
  .lines{flex:1 1 auto}
  .sheet-grab{
    display:block;flex:none;width:36px;height:4px;margin:8px auto 0;
    border-radius:2px;background:var(--td-border);
  }
  .sheet-scrim{
    display:block;position:absolute;inset:0;z-index:11;
    background:rgba(17,26,43,.34);
  }

  /* .cust IS the sheet header here: count on the left, customer on the right.
     It was a full-width row of its own on the products screen, which is the
     single most expensive place it could have been for a control a walk-in
     never touches. */
  .cust{min-height:56px;padding:10px 14px 12px;gap:10px}
  .cust .sheet-ttl{display:inline-flex;align-items:center;gap:8px;order:-1}
  .cust .sheet-ttl .ct{
    min-width:26px;height:26px;padding:0 8px;border-radius:999px;
    background:var(--td-raised);color:var(--td-text2);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .cust .who{flex:1;min-width:0;text-align:right}

  /* Every line carries its stepper: the sheet was opened on purpose and has
     the room, so a correction is one tap instead of select-then-tap. */
  .lctl{display:flex}
  /* …and because every strip is already open, SELECTION marks nothing here.
     Tapping a row still sets it (the row is the same control it is on a
     tablet), so the ink edge is suppressed rather than left to appear on one
     arbitrary line and imply a state the screen does not otherwise have. */
  .lctl.sel{border-left-color:transparent}

  /* The bar. Two rows: the order folded, and the thing the thumb is going for. */
  .t-bar{
    display:block;flex:none;z-index:10;
    background:var(--td-surface);border-top:1px solid var(--td-border);
    padding:8px 14px 14px;
  }
  .bar-sum{
    height:44px;width:100%;display:flex;align-items:center;gap:8px;
    background:transparent;border:0;padding:0;color:var(--td-text);font:inherit;
  }
  .bar-sum[hidden]{display:none}
  .bar-sum .chev{width:18px;height:18px;flex:none;color:var(--td-text2)}
  .bar-sum .ct{
    min-width:26px;height:26px;padding:0 8px;border-radius:999px;
    background:var(--td-raised);color:var(--td-text2);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .bar-sum .sp{flex:1}
  .bar-sum .amt{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
  #bar-pay{width:100%;height:60px}

  /* The basket count, on the tile. Solid ink, not the amber tint the low-stock
     pill uses — one is what is in the basket, the other is what is on the
     shelf, and reading one as the other would be a miscount at the counter. */
  .tile{position:relative}
  .tile .incart{
    display:inline-flex;align-items:center;justify-content:center;
    position:absolute;top:8px;right:8px;
    min-width:24px;height:24px;padding:0 7px;border-radius:999px;
    background:var(--td-text);color:var(--td-paper);
    font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
  }

  /* The head must not wrap: the store control is the only way to change shop. */
  .t-brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Above the sheet, always — the takeover's whole point is that nothing of
     the till stays readable behind it. */
  .settle{z-index:30}
  #storepick,#custpick,#leavepick{z-index:40}

  /* The settle takeover is amount-beside-wallets at 56px apart, which does not
     fit a phone either. Stack it, and let the two fixed 340px blocks be as wide
     as the screen allows. */
  .smain{flex-direction:column;gap:20px}
  .samt{text-align:center}
  .samt .amt{font-size:52px}
  .spick,.sconf{width:100%;max-width:340px}
}

[hidden]{display:none !important}
</style>
<style>
/* NO BROWSER TEXT SELECTION — this is a tool, not a page. A long-press on any
   text an allowlist did not name pops Android Chrome's "touch to search" Google
   bar over the app. The default is none, inputs opt back in (or typing breaks),
   and .sel is the escape hatch. Copying lives on Copy buttons, not on dragging
   blue handles. Full reasoning, and why the customer-facing pages are
   deliberately excluded, sits beside the same two rules in public/m.html. */
html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],[contenteditable] *,.sel,.sel *{
  -webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>
<div class="till" id="app" hidden>

<script>
(function () {
  'use strict';

  /* ====================================================================
     LANGUAGE — one on screen, never glued.

     cuT(en, cn) picks one, exactly as the admin does. LANG_KEY is the same
     'roots-admin-lang' the rest of the suite uses, so the language an
     operator picks anywhere follows them onto the till.

     EVERY CN HALF BELOW IS COPIED FROM A LOCKED SOURCE. Nothing is composed.
     The sources are the live admin's own cuT pairs and the locked tables in
     docs/tacet-delivery-vocabulary.md; each is named in STRINGS so the next
     person can check one rather than trust all of them.
     ==================================================================== */
  var LANG_KEY = 'roots-admin-lang';
  var _lang = 'en';
  try { var s = localStorage.getItem(LANG_KEY); if (s === 'en' || s === 'cn') _lang = s; } catch (e) {}
  function cuT(en, cn) { return _lang === 'cn' ? cn : en; }
  function setLang(l) {
    _lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    document.documentElement.lang = l === 'cn' ? 'zh-CN' : 'en';
    render();
  }

  /* Locked source for every string on this screen.
     admin  = an existing cuT()/glued pair in the live admin (file named)
     vocab  = docs/tacet-delivery-vocabulary.md, the locked table
     Adding a row means finding a locked source first — never writing Chinese. */
  var STRINGS = {
    // header + chrome
    counterSale:  ['Counter sale', '前台销售'],        // admin: retail-admin.html:2785
    // Quoted whole from the record screens' own leave guard, which asks the
    // same question about the same kind of loss — a draft that exists only on
    // screen, and answers it with the same word. The body half is not taken
    // with it: theirs names a material.
    leaveSale:    ['Leave without saving?', '未保存就离开?'], // admin: 18-materials.js:417
    leave:        ['Leave', '离开'],                   // admin: 18-materials.js:419
    // entry
    // The two faces of the entry side. `counterSale` above already names the
    // walk-in half — it is this screen's own title and the word the sale is
    // recorded under — so the switch reuses it rather than minting a second
    // word for the same thing.
    //
    // `pending` is the status label the admin already prints for exactly this
    // state, quoted whole from the pending_payment row of the dashboard's own
    // status map. These ARE pending_payment orders, so the word is not an
    // approximation of one — it is the same label the same rows carry
    // everywhere else in the product.
    pending:      ['Pending', '待付款'],               // admin: 03-dashboard.js:3419
    searchAdd:    ['Search a product to add…', '搜索商品以添加…'], // admin: 04-orders/products picker
    all:          ['All', '全部'],                     // admin: i18n EN_ONLY_MAP
    // §499 — the best-sellers row over the grid. All three LIFTED, nothing
    // composed; declared in docs/tacet-delivery-vocabulary.md v1.356 because
    // `热销商品` was retired once from a panel ranked by REVENUE (§165). This
    // row is ranked by units, which is exactly the claim 热销 makes.
    bestSellers:  ['Best sellers', '热销商品'],        // admin: 08-customers.js Top items
    last30:       ['Last 30 days', '近 30 天'],         // m.html: customer ranking Period choice
    allItems:     ['All items', '全部商品'],           // m.html: channel sync filter
    outOfStock:   ['Out of stock', '缺货'],            // admin: products grid
    // §287 — marking a made-here item sold out from the counter. Both LIFTED,
    // nothing composed: `Sold out · 售罄` is the QR menu's own pill for this
    // exact state (routes/shop-menu.js, the .sold label), which is what a
    // customer sees the moment the cashier taps; `Done · 完成` is the admin's
    // (05-marketing.js:2471, the same Manage/Done toggle shape).
    soldOut:      ['Sold out', '售罄'],                // shop-menu.js: .sold pill
    done:         ['Done', '完成'],                    // admin: 05-marketing.js:2471
    noItems:      ['No items', '无商品'],              // admin
    // order rail
    guest:        ['Guest', '访客'],                   // admin: 04-orders.js customer state
    customer:     ['Customer', '顾客'],                // admin
    points:       ['Points', '积分'],                  // admin
    wallet:       ['Wallet', '钱包'],                  // admin
    remove:       ['Remove', '删除'],                  // admin: 04-orders.js line controls
    noLines:      ['No lines yet. Search above to add the first product.',
                   '还没有商品行。在上方搜索,添加第一个商品。'], // admin: 04-orders.js
    subtotal:     ['subtotal', '小计'],                // admin
    total:        ['Total', '合计'],                   // admin: 04-orders.js summary
    // The default name for the tax line, used when the shop has not typed its
    // own (audit I-03). A shop in Dublin writes VAT and one in Toronto writes
    // GST/HST, so the merchant's own text wins — this is only the fallback, and
    // it is declared here because every Chinese string on this page is.
    taxLabel:     ['Tax', '税费'],                     // admin: 04-orders.js order subline
    /* §426 — a voucher held by the customer, at this counter. The line is named
       by the voucher's OWN title wherever the merchant wrote one ("Ramada staff
       10%"); this pair is only the fallback, quoted whole from the admin. The
       other two are COMPOSED and declared in docs/tacet-delivery-vocabulary.md
       (§426): nothing in the product had to tell a cashier that a discount was
       claimed with a number nobody verified, or let them take one off. */
    voucher:      ['Voucher', '优惠券'],               // m.html: phone order sheet's voucher line
    typedPhone:   ['Phone typed by the customer — check before taking payment',
                   '顾客自己输入的电话,收款前请核对'],  // composed, §426
    removeDiscount: ['Remove discount', '取消优惠'],   // composed, §426
    /* §474 — a manager's hand discount. `discount` is the admin's own word for
       a percentage off (05-marketing.js, Percent off · 折扣); `reason`, `apply`,
       `note`, `damaged` and `giveReason` are copied whole; `discMax` is the
       admin's "Percent can be at most 100" with the limit changed. Two reasons
       are COMPOSED and declared in docs/tacet-delivery-vocabulary.md (§474). */
    discount:     ['Discount', '折扣'],                // admin: 05-marketing.js Percent off
    reason:       ['Reason', '原因'],                  // admin: 04-orders.js
    apply:        ['Apply', '应用'],                   // m.html
    note:         ['Note', '备注'],                    // m.html
    damaged:      ['Damaged', '破损'],                 // admin: 16-purchasing.js
    friendsFamily: ['Friends & family', '亲友'],       // composed, §474
    complaint:    ['Complaint', '投诉'],               // composed, §474
    discMax:      ['Discount can be at most 20%', '折扣最多 20%'], // admin: 05-marketing.js, limit changed
    giveReason:   ['Give a reason first.', '请先填写原因。'], // admin: 01-core.js
    /* §475 — a manager approves with their PIN on a till signed in as staff.
       `manager` is the Manager role's own name (lib/roles.js); `pinLocked` is
       the admin's own lockout sentence, copied whole. Three COMPOSED, declared
       in docs/tacet-delivery-vocabulary.md (§475). */
    manager:      ['Manager', '经理'],                 // lib/roles.js: the Manager role
    pin:          ['PIN', 'PIN 码'],                   // composed, §475
    wrongPin:     ['Wrong PIN', 'PIN 码错误'],         // composed, §475
    pickManager:  ['Pick a manager and type their PIN.', '请选择经理并输入其 PIN 码。'], // composed, §475
    pinLocked:    ['Too many tries. Wait a moment and try again.', '尝试次数过多,请稍后重试。'], // admin: 01-core.js
    /* §428 — adding a customer at the counter, and giving them this location's
       voucher. The first three are the phone app's own "Add a customer" form
       (m.html), quoted whole: the same three fields, the same act. `give` takes
       its Chinese from the admin's Give it out · 发放 and Grant · 发放; the
       voucher's own title follows it. One composed, declared in
       docs/tacet-delivery-vocabulary.md (§428). */
    addCustomer:  ['Add a customer', '添加顾客'],      // m.html: Add a customer form
    name:         ['Name', '姓名'],                    // m.html: same form
    phone:        ['Phone', '电话'],                   // m.html: same form
    give:         ['Give', '发放'],                    // admin: Give it out · 发放
    orderHasCustomer: ['This order already belongs to another customer. Remove the discount first.',
                       '此订单已属于其他顾客,请先取消优惠。'], // composed, §428

     render() does not run until they do. Guarded on the nodes existing so the
     early call is a no-op rather than a throw. */
  function renderInstall() {
    var btn = $('hd-install'), bar = $('inst-bar');
    if (!btn || !bar) return;

    btn.hidden = !can;
    btn.setAttribute('aria-label', T('installHere'));
    bar.hidden = !can || installAsked;
    if (!bar.hidden) {

      $('inst-go').textContent = T('installAdd');
      $('inst-off').setAttribute('aria-label', T('installOff'));
    }
  }

  /* Stop asking from the top of the screen. NOT "never": the header control
     stays for as long as the browser will still honour it, so a cashier who
     waved the strip away on a busy morning has somewhere to go later. */

    installAsked = true;
    try { localStorage.setItem(INSTALL_KEY, '1'); } catch (e) {}
    renderInstall();
  }

  function installAsk() {
    if (!installEvent) return;
    var e = installEvent;
    // Spent the moment it is raised, and the strip goes with it — the native
    // dialog is the question now, and two askings on one screen is one too
    // many.
    installEvent = null;
    renderInstall();
    try {
      e.prompt();
      if (e.userChoice && e.userChoice.then) {
        e.userChoice.then(function (r) {

    // lands across the bottom of the order rail, over Mark paid.
    e.preventDefault();

    renderInstall();
  });
  window.addEventListener('appinstalled', function () {
    installEvent = null;
    installAsked = true;
    try { localStorage.setItem(INSTALL_KEY, '1'); } catch (e) {}
    renderInstall();
    // No confirmation is drawn: on a desktop the app window opens over this
    // one and on Android the system says so itself. A toast here would be the
    // third thing telling a cashier the same news.
  });

  /* ====================================================================
     §440 — THE KNOCK: A QR ORDER HAS COME IN AND NOBODY HAS PAID YET.

     WHY A DIFFERENT SOUND. The back office and the phone already ding for a
     PAID order (G5 up to C6, a soft sine pair — retail-admin/04-orders.js,
     m.html). A QR order at the counter is the other kind of news: somebody is
     walking to the till to pay. Two notes going DOWN, shorter and a little
     louder, in a brighter wave — so "ding-dong" means make it and "knock-knock"
     means someone is coming to pay, without anyone having to look.

     NO MUTE ON THE TILL, deliberately. The back office's mute lives in
     localStorage, and a till honouring a switch drawn on another page would be
     silent with nothing on its own screen saying why. The tablet's volume is
     the control.

     THE BROWSER WILL NOT PLAY SOUND UNTIL SOMEBODY TAPS THE PAGE, once per page
     load, and iOS asks again after the app has been in the background. The
     context is built at boot (allowed; it starts suspended) and woken by every
     tap. While it is still suspended the strip under the header says so, so a
     till never looks ready while it is in fact silent.
     ==================================================================== */
  var _knockCtx = null;
  function knockCtx() {
    if (_knockCtx) return _knockCtx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      _knockCtx = new AC();
      _knockCtx.onstatechange = function () { renderSound(); };
    } catch (e) { _knockCtx = null; }
    return _knockCtx;
  }
  function wakeKnock() {
    var c = knockCtx();
    if (!c || c.state === 'running') return;
    try {
      var p = c.resume();
      if (p && p.then) p.then(renderSound, function () {});
    } catch (e) {}
  }
  // A suspended context would hold the notes and play them late, on the next
  // tap — a knock for an order already on screen. Better silent than late; the
  // strip is up in exactly this state.
  function playKnock() {
    var c = knockCtx();
    if (!c || c.state !== 'running') return;
    try {
      var now = c.currentTime;
      // E5 down to B4.
      [[659.25, 0], [493.88, 0.15]].forEach(function (n) {
        var osc = c.createOscillator(), gain = c.createGain();
        osc.type = 'triangle';
        osc.frequency.value = n[0];
        var t = now + n[1];
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

        gain.connect(c.destination);
        osc.start(t);
        osc.stop(t + 0.25);

  // listing has no QR menu, so nothing would ever knock there.
  function renderSound() {
    var bar = $('snd-bar');
    if (!bar) return;
    var c = _knockCtx;
    var show = !!S.shopId && !!c && c.state !== 'running';
    bar.hidden = !show;
    if (show) $('snd-msg').textContent = T('soundTap');
  }

  /* §440 — KEEP THE SCREEN ON. A sleeping tablet freezes the page: no reads,
     no knock. The device's own "never sleep while charging" setting is the
     real answer and this is the backup — the Screen Wake Lock API, current
     Chrome and Safari, secure pages only. The browser drops the lock whenever
     the page is hidden, so it is asked for again on the way back and on every
     tap (Safari can want a tap first). Only for a counter that takes QR
     orders: one that cannot be knocked has no reason to keep a screen lit.
     Released by closing the till, which is what lets the screen sleep at
     night. */
  var _wake = null, _wakeAsking = false;
  function syncAwake() {
    var want = !!S.shopId && !document.hidden;
    if (!want) {
      if (_wake) { try { _wake.release(); } catch (e) {} _wake = null; }
      return;
    }
    if (_wake || _wakeAsking) return;
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    _wakeAsking = true;
    try {
      navigator.wakeLock.request('screen').then(function (w) {
        _wakeAsking = false;
        _wake = w;
        w.addEventListener('release', function () { if (_wake === w) _wake = null; });
        // The shop may have changed while the browser was answering.
        if (!S.shopId) syncAwake();
      }, function () { _wakeAsking = false; });
    } catch (e) { _wakeAsking = false; }
  }

  ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (ev) {
    window.addEventListener(ev, function () { wakeKnock(); syncAwake(); },
      { capture: true, passive: true });
  });

    if (document.hidden) return;
    wakeKnock(); syncAwake(); renderSound();
    // Asleep, the poll and possibly the socket were down; the shelf may have
    // moved in the meantime.
    refreshCatalogue();
  });

  function start() {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.lang = _lang === 'cn' ? 'zh-CN' : 'en';
    $('boot-msg').textContent = '·';
    // THE SECOND READ, because a till may only open where the counter is OPEN.
    // POS is a sales channel on the Sales page exactly like Meituan, and the
    // location master closes every channel at a store at once — so a shop that
    // has been marked shut must not have a till that still rings up sales and
    // still takes stock off that shelf. The server refuses those sales anyway
    // (retail.js posClosedForStore), so without this the cashier would meet a
    // rejection at Mark paid, with a basket already built. Filtering the picker
    // is the same rule stated a step earlier, where it costs nothing.
    //
    // FAILS OPEN, matching the server helper: if channel-status cannot be read
    // the till behaves exactly as it did before this existed. A status endpoint
    // having a bad minute must not shut a shop's counter.
    //
    // THE THIRD READ is this operator's capabilities, because the
    // till became a rail row and a More row in the same commit as this check —
    // and a nav entry that is merely hidden is not a permission. Anyone who
    // knows the URL (an installed tablet whose operator was moved to another
    // role, a bookmark, a shared device) still arrives here.
    //
    // THE PAIR, not one cap: `till:use` opens this screen, and `orders:edit` is
    // what lib/cap-routes.js requires of the POST this screen's Confirm makes.
    // Holding only the first is a till that builds a basket and then refuses to
    // take the money once the tenant turns rbac_enforce on, which is the worst
    // moment to find out.
    //
    // FAILS OPEN, matching channel-status beside it and the whole cap layer:
    // caps is null on a resolution hiccup or a stale session, and null means
    // allowed. This is a view gate over an already-authenticated operator, not
    // the security boundary — that is cap-routes.js on the write itself.
    // NOT A REDIRECT. Nothing in this file redirects on 401/403 and this must
    // not be the exception: a till that redirects itself mid-shift is the loop
    // this product has already been bitten by (see the route comment in
    // server.js). It stops at the boot screen and says why.
    Promise.all([
      api('/api/retail-admin/stores'),
      api('/api/retail-admin/channel-status').catch(function () { return null; }),
      api('/api/backend/me').catch(function () { return null; }),
      // The shop's tax settings (audit I-03). The server prices every sale this
      // till makes, so it computes the tax whatever the till believes — but a
      // till that showed ¥100 while the customer was charged ¥108.88 would be
      // taking money the cashier never quoted. Read here so the number on the
      // glass is the number on the card machine. A failed read means no tax
      // line, which is what a shop that charges none looks like anyway.
      api('/api/retail/config').catch(function () { return null; })

      .then(function (r) {

        S.tax = taxFrom(cfg && cfg.data);
        // The shop's points rules, from the same read (§93). Guarded the same
        // way the currency below is: a malformed or absent value leaves the
        // live default standing rather than zeroing what a point is worth.

        if (ptsCfg && typeof ptsCfg === 'object') {

          S.pts = {
            rate: (Number.isFinite(rate) && rate > 0) ? rate : 1,
            coverShipping: ptsCfg.coverShipping === true,

        }
        var curCfg = cfg && cfg.data && cfg.data.currency;
        if (curCfg && typeof curCfg === 'object' && curCfg.symbol) S.cur = curCfg;
        else if (typeof curCfg === 'string' && curCfg) S.cur = { symbol: curCfg, decimals: 2, position: 'before' };
        var caps = me && me.user && Array.isArray(me.user.caps) ? me.user.caps : null;
        // §457 — whose held bills these are. Read before setStore, which loads them.
        var tn = me && me.user && me.user.tenant;
        S.tid = (tn && tn.id != null) ? tn.id : null;
        // The way back, from the same read as the permission above. Null on any
        // hiccup, which simply means no control is drawn — the till itself is
        // unaffected either way.
        if (me && me.user && typeof me.user.home === 'string') {
          S.home = me.user.home;
          var hl = me.user.homeLabel;
          S.homeLabel = (hl && (hl.en || hl.cn)) ? hl : null;
        }

        // §474 — the Discount button. CLOSED when the caps cannot be read, unlike
        // the gate below: the server refuses a discount it cannot check, so a
        // button drawn on a guess would only produce a refused sale.
        S.canDisc = !!((me && me.user && me.user.role === 'owner')
                       || (caps && caps.indexOf('till:discount') !== -1));
        // §475 — otherwise, who could approve one here. A failed read leaves the
        // list empty, which is the till as it was: no button.
        if (!S.canDisc) {
          api('/api/retail-admin/till-approvers').then(function (j) {
            S.approvers = (j && j.success && Array.isArray(j.data)) ? j.data : [];

        }

          if (row && row.cells) {

          }
        }

        // EVERY active store is kept, closed counters included. Filtering them
        // out was the first shape of this and it read as a broken control: a
        // store that vanishes and a button that does nothing look identical
        // from behind a counter. They are listed and labelled instead, and
        // only the OPENING pick is restricted to a counter that is open.
        var openList = posOpen
          ? list.filter(function (st) { return posOpen[st.code] !== false; })
          : list;

        // grid's own words rather than a sentence composed for this screen.

  /* ONE READ, AND IT ASKS THE SHOP RATHER THAN THE WEBSITE — §150.

     This used to be two reads: the catalogue filtered to `published=1`, joined
     to the store's shelf. That filter is the ONLINE STORE's flag, and §42 puts
     a counter on the other side of the line: is_published governs the website,
     a shop listing governs the shop. Nothing made at a location is sold on a
     website, so nothing made at a location was ever published, so nothing made
     at a location could be rung up — reported from Tianhe as a menu product the
     till's search could not find at all.

     The server-side route answers with the three sources §150 names — this
     location's menu at its own price, anything counted on its shelf, and
     everything the till already showed — and carries the shelf figure per row,
     so the join that used to happen here happens there.

     `stock: null` means there is nothing to count: a made-here item is built
     when it is ordered and can never be short. stockOf() already reads null as
     "no gate", so it needs no change. */
  function loadCatalogue() {
    var sid = S.storeId;
    return api('/api/retail-admin/stores/' + sid + '/counter-catalogue')
      .then(function (r) {
      // A reply for a shelf this till has since left must not land on the new
      // one. Possible now that the catalogue is re-read in the background.
      if (String(sid) !== String(S.storeId)) return false;
      S.catAt = Date.now();
      var rows = (r && r.data && r.data.rows) || [];
      S.shopId = (r && r.data && r.data.shop_id) || null;
      S.stock = {};
      S.products = rows.map(function (row) {
        if (row.stock != null) S.stock[row.product_id] = Number(row.stock) || 0;
        return {
          id: row.product_id,
          name_en: row.name_en, name_cn: row.name_cn, sku: row.sku,
          // §183 — THE SIZE. Two sizes of one drink are two product rows
          // carrying the same name; without this the grid drew "Latte" twice
          // and the cashier picked by price. Null on a product with no
          // siblings, which is most of them.
          variant_label: row.variant_label || null,
          variant_label_cn: row.variant_label_cn || null,
          top_category: row.top_category,
          // §289 — a thumbnail URL, or null when the product has no photo.
          image: row.image || null,
          // The price this till QUOTES and, on a menu row, the price it POSTS.
          price: Number(row.price) || 0,
          on_menu: !!row.on_menu,
          fulfilment_mode: row.fulfilment_mode || null,
          // §287 — the made-here switch: which listing it is, and whether it
          // is off. Off is also stock 0, which is what greys the tile.
          listing_id: row.listing_id || null,
          switched_off: !!row.switched_off,
          // §183 — THE QUESTIONS. Hot or iced, extra shot, how much sugar, in
          // the shape routes/shop-menu.js hands its own picker, clamped by the
          // server against what is still on this shelf. Absent on the great
          // majority of products, and an absent list is a tile that adds on
          // one tap exactly as it always has.
          options: Array.isArray(row.options) ? row.options : null
        };
      });
      var seen = {}; var cats = [];
      S.products.forEach(function (p) {
        var c = p.top_category || '';
        if (c && !seen[c]) { seen[c] = 1; cats.push(c); }
      });
      S.cats = cats;
      // English name → the operator's Chinese name, for the pills. Absent
      // means none was set; the pill keeps the English name.
      S.catCn = (r && r.data && r.data.category_cn) || {};
      // §499 — this location's best sellers, already cut to what is on the
      // glass. The server's window ends last night, so this reads the same
      // all day and the row never moves under a cashier's thumb.
      S.best = (r && r.data && Array.isArray(r.data.best_sellers)) ? r.data.best_sellers : [];
    });
  }

  // One place that sets the current store, so the header, the catalogue read
  // and the saved preference cannot drift apart. The write to localStorage is
  // the half that was missing: boot READ 'tacet-till-store' to restore a choice
  // that nothing had ever saved, so `pick` always fell through to list[0] and a
  // second location could not be reached at all.
  function setStore(st) {
    S.storeId = st.id;
    S.storeName = cuT(st.name_en || st.code || ('#' + st.id),
                      st.name_cn || st.name_en || st.code || ('#' + st.id));
    try { localStorage.setItem('tacet-till-store', String(st.id)); } catch (e) {}
    heldLoad();   // §457 — each shop has its own held bills
  }

  // Switching shelf means switching stock, so the catalogue is re-read rather
  // than reused. Guarded by the caller: a basket built against one store's shelf
  // is not carried to another.
  // Unknown (no channel-status read) counts as open, matching the server's
  // own fail-open rule in retail.js posClosedForStore.
  function storeOpen(st) { return !S.posOpen || S.posOpen[st.code] !== false; }

  /* The list has to arrive by itself. A customer orders on their phone while
     the cashier is looking at the screen, and nothing about that reaches this
     tablet unless it asks — there is no push channel here and a counter is not
     a place anyone thinks to pull-to-refresh.

     FIFTEEN SECONDS, which is the walk from a table to the till. Slower and the
     customer beats their own order to the counter; faster buys nothing, because
     the order was placed before they stood up.

     QUIET WHILE THE TILL IS NOT THE VIEW. Repainting a list underneath the
