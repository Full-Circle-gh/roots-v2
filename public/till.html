    // up, rather than silently revaluing lines against different stock.
    var sb = $('hd-store');
    var canSwitch = S.stores.length > 1 && !S.lines.length;
    sb.textContent = S.storeName;
    sb.disabled = !canSwitch;
    sb.classList.toggle('switchable', canSwitch);
    if (canSwitch) {
      sb.insertAdjacentHTML('beforeend',
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');
    }
    renderPicker();
    renderCustPicker();
    renderLeave();
    $('hd-lang').textContent = _lang === 'cn' ? 'EN' : '中文';
    var qi = $('q');
    qi.placeholder = T('searchAdd');
    $('q-clr').hidden = !S.q;
    normalisePane();
    renderSeg(); renderPend();
    // One pane at a time, both full height. `hidden` rather than a class so the
    // pane that is down is out of the tab order too — a cashier tabbing through
    // the till must not land in a product grid nobody can see.
    $('pane-menu').hidden = S.pane !== 'menu';
    $('pane-pend').hidden = S.pane !== 'pend';
    renderCats(); renderGrid(); renderCust(); renderLines(); renderFoot();
    // The sheet belongs to the till view only. Leaving it open behind the
    // settle takeover would put a scrim and a second pay button under a screen
    // whose whole point is that nothing of the till stays readable.
    if (S.view !== 'till') S.sheetOpen = false;
    document.getElementById('app').classList.toggle('sheet-open', S.sheetOpen);
    $('sheet-scrim').hidden = !S.sheetOpen;
    $('settle').hidden = (S.view === 'till');
    if (S.view !== 'till') renderSettle();
  }

  function renderCats() {
    var h = '<button class="cat' + (S.cat ? '' : ' on') + '" type="button" data-cat="">' + esc(T('all')) + '</button>';
    S.cats.forEach(function (c) {
      h += '<button class="cat' + (S.cat === c ? ' on' : '') + '" type="button" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    });
    $('cats').innerHTML = h;
  }

  function visibleProducts() {
    var q = S.q.trim().toLowerCase();
    return S.products.filter(function (p) {
      if (S.cat && (p.top_category || '') !== S.cat) return false;
      if (!q) return true;
      return (p.name_en || '').toLowerCase().indexOf(q) >= 0
          || (p.name_cn || '').indexOf(S.q.trim()) >= 0
          || (p.sku || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderGrid() {
    var list = visibleProducts();
    if (!list.length) { $('grid').innerHTML = '<div class="gempty">' + esc(T('noItems')) + '</div>'; return; }
    var h = '';
    list.forEach(function (p) {
      var st = stockOf(p.id);
      var left = st == null ? null : st - inCart(p.id);
      var out = left != null && left <= 0;
      var inc = inCart(p.id);
      h += '<button class="tile' + (out ? ' out' : '') + '" type="button" data-add="' + p.id + '"' + (out ? ' disabled' : '') + '>'
         + (inc > 0 ? '<span class="incart">' + inc + '</span>' : '')
         + '<span class="nm">' + esc(pname(p)) + '</span>'
         + '<span class="ft">'
         + (out
              // Sold out: the reason replaces the price it would have crowded.
              ? '<span class="lo">' + esc(T('outOfStock')) + '</span>'
              // In stock: code, price, and a single digit when the shelf is low.
              : (p.sku ? '<span class="sku">' + esc(p.sku) + '</span>' : '')
                + '<span class="pr">' + money(p.sell_price) + '</span>'
                + (left != null && left <= 5 ? '<span class="lo">' + left + '</span>' : ''))
         + '</span></button>';
    });
    $('grid').innerHTML = h;
  }

  /* ---- QR orders waiting to be paid ------------------------------------
     THE NUMBER IS THE WHOLE RETRIEVAL MECHANISM. lib/shop-order-code.js hands
     each QR order a plain number that restarts every trading day, for exactly
     this: the customer holds up "12" and the cashier finds 12. No scan, no
     typing, no second device on the counter. */

  // Three narrowings, each load-bearing. `status` keeps the list to what is
  // actually owed; `store_id` keeps one shop's numbers out of another's, since
  // two shops both call 14 on the same afternoon; `shop_entry_method` keeps a
  // till sale that was abandoned mid-settle out of a list the cashier is meant
  // to be able to trust — without it the counter is shown its own half-finished
  // basket as though a customer were standing behind it.
  function pendUrl() {
    return '/api/retail-admin/orders?status=pending_payment&channel=shop'
         + '&shop_entry_method=qr&store_id=' + encodeURIComponent(S.storeId) + '&limit=50';
  }

  // A FAILED READ CHANGES NOTHING ON SCREEN, deliberately. This runs on a
  // fifteen-second timer, so a read that blanked the counter's list on a blip
  // would be a worse failure than the blip — the last good answer stays up and
  // the next tick tries again.
  //
  // AND IT REPORTS NOTHING, which is the part worth defending. The failure that
  // matters here is an expired session, and it does not stay quiet: the cashier
  // taps an order, confirms, and confirmRecall says "sign in on the backend" on
  // the screen where they were about to take money. Saying it here as well would
  // put an error in a pane behind a switch that may not even be drawn, and would
  // need a sentence for "the list could not be read" that no locked pair covers.
  function loadPend() {
    if (!S.storeId) return;
    api(pendUrl()).then(function (j) {
      if (!j || !j.success) return;
      // shop_order_code is null on anything that did not arrive by QR. The
      // server filter already excludes those; this is the belt to its braces,
      // because a row with no number cannot be found by the one thing the
      // customer knows.
      S.pend = (j.data || []).filter(function (o) { return o.shop_order_code != null; });
      autoPane();
      render();
    }).catch(function () { /* keep the last good list; the next tick retries */ });
  }

  // "Default to Pending when something is waiting, Menu when nothing is."
  // A DEFAULT, which is why it stops at the first sign of work in progress:
  // once the cashier has chosen a pane it is theirs until the sale ends, and a
  // basket with lines in it is never taken off the screen. Orders arriving
  // announce themselves with the badge instead — a count they can ignore beats
  // a pane that moves under their hands.
  function autoPane() {
    if (S.paneTouched || S.view !== 'till' || S.lines.length) return;
    S.pane = (S.pend && S.pend.length) ? 'pend' : 'menu';
  }

  // An empty list has no pane to be on. Runs before the panes are drawn so the
  // switch and the body can never disagree about which face is up.
  function normalisePane() {
    if (S.pane === 'pend' && !(S.pend && S.pend.length)) S.pane = 'menu';
  }

  function renderSeg() {
    var n = (S.pend && S.pend.length) || 0;
    var el = $('seg');
    el.hidden = n === 0;
    if (!n) { el.innerHTML = ''; return; }
    el.innerHTML =
      '<button class="sbtn' + (S.pane === 'menu' ? ' on' : '') + '" type="button" data-pane="menu">'
    +   esc(T('counterSale')) + '</button>'
    + '<button class="sbtn' + (S.pane === 'pend' ? ' on' : '') + '" type="button" data-pane="pend">'
    +   esc(T('pending')) + '<span class="b">' + n + '</span></button>';
  }

  function renderPend() {
    var el = $('pane-pend');
    if (!S.pend || !S.pend.length) { el.innerHTML = ''; return; }
    // Newest first, as the list arrives. The newest row's trading day is this
    // list's "today"; any row from another day carries its date, because §49
    // requires the short code be read with its shop and its date and this is
    // the one place two 14s could otherwise sit next to each other. The shop
    // half of that pair is the store this till is locked to.
    //
    // NO CLOCK TIME. placed_at is stored UTC and the shop is not, so a time
    // rendered from it here would be wrong by the offset — and a wrong time at
    // a counter is worse than none. shop_order_date is the LOCATION's own
    // trading day (lib/business-date.js) and is the only date safe to print.
    var top = S.pend[0].shop_order_date || '';
    var h = '<div class="plist">';
    S.pend.forEach(function (o) {
      var d = o.shop_order_date || '';
      var meta = (d && d !== top) ? d : '';
      h += '<button class="wrow" type="button" data-recall="' + o.id + '">'
         + '<span class="n">' + esc(String(o.shop_order_code)) + '</span>'
         + '<span class="who"><b>' + esc(o.recipient_name || '') + '</b>'
         + (meta ? '<i>' + esc(meta) + '</i>' : '') + '</span>'
         + '<span class="amt">' + money(o.total) + '</span>'
         + '</button>';
    });
    el.innerHTML = h + '</div>';
  }

  // Opening one. IT LANDS IN THE RAIL, NOT ON THE SETTLE SCREEN, and that is
  // the point: the cashier is about to take money for a basket somebody else
  // filled in, on a phone, out of sight. Going straight to a total would ask
  // them to confirm a number with nothing behind it — and when the customer
  // says "that's not what I ordered" there would be nothing on screen to check
  // it against. So a recalled order arrives exactly where a basket they built
  // themselves would, and Mark paid is the same button in the same place.
  //
  // IT REPLACES THE BASKET rather than joining it: this screen settles one
  // thing, and a till that could ring up a walk-in and a QR order under a
  // single tender would record one payment against two orders and reconcile
  // against neither.
  //
  // The list row carries no items — the orders LIST is order-level — so the
  // lines come from the detail endpoint. Read-only once here (see renderLines):
  // the customer's order is not the counter's to edit, and the settle path only
  // marks it paid, so a line changed here would be a change nothing saves.
  function recall(id) {
    var o = null, i;
    for (i = 0; i < (S.pend || []).length; i++) if (S.pend[i].id === id) o = S.pend[i];
    if (!o) return;
    S.lines = []; S.sel = null; S.customer = null;
    S.recall = {
      id: o.id, order_no: o.order_no, code: o.shop_order_code,
      name: o.recipient_name || '', total: Number(o.total) || 0, loading: true
    };
    S.cxArm = false;
    S.wallet = null; S.moreOpen = false; S.err = '';
    // The sheet is where the rail lives on a phone, and it is closed by
    // default. Opening it is what makes "check the order" a thing that has
    // happened rather than a thing the cashier could have done.
    S.sheetOpen = true;
    render();
    api('/api/retail-admin/orders/' + o.id).then(function (j) {
      if (!S.recall || S.recall.id !== o.id) return;   // they moved on
      if (!j || !j.success || !j.data) { S.recall.loading = false; return render(); }
      S.lines = (j.data.items || []).map(function (it) {
        return {
          id: it.product_id,
          name: cuT(it.name_en || it.name_cn || '', it.name_cn || it.name_en || ''),
          sku: it.sku || '',
          price: Number(it.unit_price) || 0,
          qty: Number(it.qty) || 0
        };
      });
      S.recall.loading = false;
      render();
    }).catch(function () {
      if (S.recall && S.recall.id === o.id) { S.recall.loading = false; render(); }
    });
  }

  // Backing out. The cashier opened the wrong number, or the customer changed
  // their mind — either way nothing has been charged, so this leaves no trace
  // and lands them back on the list they came from.
  function cancelRecall() {
    S.cxArm = false;
    S.recall = null; S.lines = []; S.sel = null;
    S.wallet = null; S.moreOpen = false; S.err = '';
    S.view = 'till'; S.pane = 'pend'; S.paneTouched = true;
    render();
  }

  // What the settle screen owes. A recalled order states the SERVER's total —
  // it was priced and taxed when the customer placed it — and a basket derives
  // its own. Re-deriving a QR order's total here from lines this till never saw
  // is how the counter ends up asking for a different number than the one on
  // the customer's screen.
  function settleDue() { return S.recall ? S.recall.total : dueNow(subtotal()); }

  // Walk-ins are anonymous. Attaching a customer is optional and never blocks
  // the sale; when one is attached the row shows the two things that change
  // what the cashier can offer — points and wallet.
  function renderCust() {
    var el = $('cust');
    // On a phone .cust IS the order sheet's header, so it carries the sheet's
    // title and count. On a tablet the rail has no header and CSS hides both.
    // NO TITLE WORD. The only locked pair for this noun is the PLURAL one the
    // admin uses for its order lists; the singular has no locked Chinese half,
    // so it is not written. The grab handle and a sheet full of line items
    // already say what this is.
    //
    // The pair is not quoted here on purpose: the gate forbids Chinese anywhere
    // in this file outside STRINGS, comments included, and it is right to — a
    // character that never renders is still one nobody checked against a
    // source. This comment tripped that rule on its first push.
    var head = '<span class="sheet-ttl">'
      + (S.lines.length ? '<span class="ct">' + itemCount() + '</span>' : '') + '</span>';
    // A RECALLED ORDER OWNS THIS ROW. It names the number the customer is
    // holding up and the name they gave, so the check the cashier is making —
    // "is this the right order?" — has both halves on screen above the lines
    // they are checking. The customer control is not offered: this order
    // already belongs to somebody, the settle path does not write customer_id,
    // and a + Customer button here would be a control that silently does
    // nothing. Cancel is the way out, and costs nothing because nothing has
    // been charged yet.
    if (S.recall) {
      el.className = 'cust on';
      el.innerHTML = head
        + '<span class="who">' + esc(String(S.recall.code))
        + (S.recall.name ? ' · ' + esc(S.recall.name) : '')
        + '<div class="sub">' + esc(S.recall.order_no || '') + '</div></span>'
        // BACK, NOT CANCEL. This control closes the order without touching it,
        // and it said "Cancel" until 2026-09-08 — beside a real Cancel-the-order
        // action that is the same word for opposite outcomes, and the dangerous
        // one is the one a cashier would reach for by habit.
        + '<button class="cbtn" type="button" data-recall-cancel="1">' + esc(T('back')) + '</button>';
      return;
    }
    if (S.customer) {
      el.className = 'cust on';
      el.innerHTML = head + '<span class="who">' + esc(S.customer.nickname || ('#' + S.customer.id))
        + '<div class="sub">' + esc(T('points')) + ' ' + (Number(S.customer.points) || 0)
        + ' · ' + esc(T('wallet')) + ' ' + money(S.customer.balance) + '</div></span>'
        + '<button class="cbtn" type="button" data-cust="clear">' + esc(T('remove')) + '</button>';
    } else {
      el.className = 'cust';
      el.innerHTML = head + '<span class="who">' + esc(T('guest')) + '</span>'
        + '<button class="cbtn" type="button" data-cust="pick">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
        + esc(T('customer')) + '</button>';
    }
  }

  function renderLines() {
    if (!S.lines.length) {
      $('lines').innerHTML = '<div class="empty"><p>' + esc(T('noLines')) + '</p></div>';
      return;
    }
    var h = '';
    S.lines.forEach(function (l, i) {
      // A RECALLED ORDER IS READ-ONLY. The customer filled this basket on their
      // own phone; the counter's job here is to check it and take the money, not
      // to rewrite it. And it could not rewrite it if it tried — the settle path
      // for a recall PATCHes the status and nothing else, so an edit made here
      // would change the screen, charge the original total, and print the
      // original ticket. Better that the controls are not there at all.
      var ro = !!S.recall;
      var sel = !ro && S.sel === i;
      h += '<button class="ln' + (sel ? ' sel' : '') + '" type="button"'
         + (ro ? ' disabled' : ' data-line="' + i + '"') + '>'
         + '<span class="nm">' + (l.qty > 1 ? '<span class="q">×' + l.qty + '</span>' : '') + esc(l.name)
         + '<div class="sb">' + (l.sku ? '<span class="sku">' + esc(l.sku) + '</span>' : '')
         + '<span>' + money(l.price) + '</span></div></span>'
         + '<span class="tt">' + money(l.qty * l.price) + '</span></button>';
      if (ro) return;
      // ALWAYS EMITTED, never conditional. On a tablet CSS shows this only for
      // the selected line, which is exactly the old behaviour; on a phone the
      // sheet is opened on purpose and has the room, so every line carries its
      // own stepper and a correction is one tap instead of three.
      //
      // It is a SIBLING of .ln rather than a child because .ln is a <button>,
      // and a button cannot contain buttons. That is why the phone layout puts
      // the stepper under its line instead of inline as the mockup drew it.
      {
        var st = stockOf(l.id);
        var capped = st != null && l.qty >= st;
        h += '<div class="lctl' + (sel ? ' sel' : '') + '" data-for="' + i + '">'
           + '<span class="qgrp">'
           + '<button class="step" type="button" data-q="-1" data-i="' + i + '">&minus;</button>'
           + '<span class="stepn">' + l.qty + '</span>'
           + '<button class="step" type="button" data-q="1" data-i="' + i + '"' + (capped ? ' disabled' : '') + '>+</button>'
           + '</span>'
           + '<span class="lsp"></span>'
           + '<button class="rm" type="button" data-q="x" data-i="' + i + '">' + esc(T('remove')) + '</button>'
           + '</div>';
      }
    });
    $('lines').innerHTML = h;
  }

  function renderFoot() {
    var sub = subtotal();
    // A recalled order states the SERVER's total, not one re-derived from the
    // lines just fetched. They should agree, and if they ever do not, the
    // number the customer was shown on their own phone is the one the counter
    // must ask for — settleDue() is that number, and it is the one the settle
    // screen and this button both read so they cannot disagree.
    var due = settleDue();
    // NO summary row. On a counter sale the subtotal IS the total — nothing
    // ships, nothing is boxed, nothing is discounted — so a subtotal line would
    // print the same figure twice, one line apart. That is noise, not a
    // reconciliation. The row returns the moment something can make the two
    // differ — and TAX is that moment (audit I-03): a shop that adds tax at the
    // till has a subtotal and a total that are two numbers, and the cashier has
    // to be able to read both to the customer. An inclusive shop shows the tax
    // as what it is, a share of the one figure, and still prints no subtotal.
    // Suppressed for a recalled order: its tax was computed and stored when the
    // customer placed it, and re-deriving a split here from the lines would put
    // a second arithmetic on screen that nothing guarantees matches the first.
    $('sums').innerHTML = !S.tax || !S.lines.length || S.recall ? ''
      : (S.tax.mode === 'exclusive'
          ? '<div><span>' + esc(T('subtotal')) + '</span><span>' + money(sub) + '</span></div>'
            + '<div><span>' + esc(S.tax.label) + '</span><span>' + money(taxOn(sub)) + '</span></div>'
          : '<div><span>' + esc(S.tax.label) + '</span><span>' + money(taxOn(sub)) + '</span></div>');
    $('tot-lb').textContent = T('total');
    $('tot-amt').textContent = money(due);
    // A recall is payable as soon as its lines are on screen — never while they
    // are still in flight, which is the one moment the cashier could confirm a
    // total without having seen what is behind it.
    var ready = S.recall ? !S.recall.loading : S.lines.length > 0;
    var b = $('pay');
    b.disabled = !ready;
    b.textContent = ready ? T('markPaid') + '  ' + money(due) : T('markPaid');

    /* CANCELLING A RECALLED ORDER — Ash, 2026-09-08: "if a customer eventually
       doesn't want the order there should be an option to cancel it from his
       side or from the till."

       It sits UNDER Mark paid rather than beside it, and it is a quiet control
       rather than a matching button: the two outcomes are not equals, and a
       destructive action the width of the one next to it is a mis-tap waiting
       to happen at a busy counter. Two taps, and the second one says what it
       will do.

       Only for a recalled order. A basket the till is still building is
       cleared, not cancelled — there is nothing on the server yet to cancel. */
    var cx = $('cancel-order');
    if (cx) {
      cx.hidden = !S.recall || S.recall.loading;
      cx.textContent = S.cxArm ? T('cancelOrder') + '?' : T('cancelOrder');
      cx.className = 'cxo' + (S.cxArm ? ' arm' : '');
    }

    // THE BAR IS THE ORDER, FOLDED. On a phone the sheet is closed by default,
    // so this is the only always-true statement of what the customer owes.
    // A BARE NUMBER for the count, deliberately: "4 items" would be an English
    // string with no locked Chinese half, and a pill beside a total needs no
    // unit to be read. The product tiles already count the same way.
    var any = ready;
    $('bar-ct').textContent = S.lines.length ? String(itemCount()) : '';
    // WHAT THE CUSTOMER OWES, tax included — the same figure as the button in
    // the sheet above. The bar is the only always-true statement of the amount
    // on a phone, so it must not be the pre-tax one.
    $('bar-amt').textContent = money(due);
    var bb = $('bar-pay');
    bb.disabled = !any;
    bb.textContent = any ? T('markPaid') + '  ' + money(due) : T('markPaid');
    // With nothing rung up there is no order to open, so the summary row goes
    // rather than sitting there inert.
    document.querySelector('.bar-sum').hidden = !any;
  }

  // Units, not lines: three lines at quantity two are six items, and six is
  // what a cashier counts against the goods on the counter.
  function itemCount() {
    return S.lines.reduce(function (n, l) { return n + (Number(l.qty) || 0); }, 0);
  }

  /* ---- settle ---------------------------------------------------------- */
  function renderSettle() {
    var el = $('settle');
    if (S.view === 'done') { el.innerHTML = doneHtml(); return; }
    var sub = subtotal();
    // The settle screen states ONE number and it must be the one the card
    // machine will take (audit I-03) — the tax-inclusive amount, with the tax
    // named under it so the cashier can answer "what's the extra?" without
    // going back.
    var due = settleDue();
    // The subline is the cashier's check that they opened the right row. For a
    // recalled QR order it repeats the number the customer is holding up and the
    // name they gave — the only two things the customer can themselves verify.
    // A basket names the sale instead and shows the tax split; a recalled
    // order's tax was settled when it was placed and is not re-derived here.
    var subline = S.recall
      ? esc(String(S.recall.code) + (S.recall.name ? ' · ' + S.recall.name : ''))
      : esc(T('counterSale')) + (S.tax ? ' · ' + esc(S.tax.label) + ' ' + money(taxOn(sub)) : '');
    var lead = WALLETS.filter(function (w) { return w.lead; });
    var rest = WALLETS.filter(function (w) { return !w.lead; });
    var walletBtn = function (w) {
      return '<button class="wal' + (S.wallet === w.v ? ' on' : '') + '" type="button" data-wal="' + w.v + '">'
           + '<span class="rad"></span><span>' + esc(cuT(w.en, w.cn)) + '</span></button>';
    };
    el.innerHTML =
      '<div class="stop"><button class="back" type="button" data-go="till">'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'
      + esc(T('back')) + '</button></div>'
      + '<div class="smain">'
      +   '<div class="samt"><div class="lb">' + esc(T('amount')) + '</div>'
      +     '<div class="amt">' + money(due) + '</div>'
      // The subline is the cashier's check that they opened the right row: for
      // a recalled QR order it repeats the number the customer is holding up
      // and the name they gave, which are the only two things the customer can
      // themselves verify. A basket names the sale instead, and shows the tax
      // split — a recalled order's tax was settled when it was placed and is
      // not re-derived here.
      +     '<div class="sb">' + subline + '</div></div>'
      +   '<div class="spick"><div class="lb">' + esc(T('payMethod')) + '</div>'
      +     lead.map(walletBtn).join('')
      +     (S.moreOpen ? rest.map(walletBtn).join('')
                        : '<button class="more" type="button" data-more="1">' + esc(T('other')) + ' ›</button>')
      +   '</div>'
      + '</div>'
      + '<div class="sfoot">'
      +   (S.err ? '<div class="serr">' + esc(S.err) + '</div>' : '')
      +   '<button class="sconf" type="button" data-confirm="1"' + (canConfirm() ? '' : ' disabled') + '>'
      +     esc(S.busy ? T('markPaid') + '…' : T('markPaid')) + '</button>'
      +   '<div class="shint">' + esc(canConfirm() || S.busy ? '' : T('payMethod')) + '</div>'
      + '</div>';
  }

  function canConfirm() {
    var m = SETTLE_MODES[S.mode];
    // A recalled order has no lines on this till and never will — it is settled,
    // not built — so "there is something to charge for" is the recall OR a
    // basket, never the basket alone.
    return !S.busy && (!!S.recall || S.lines.length > 0) && m && m.ready(S);
  }

  function doneHtml() {
    var d = S.done || {};
    var w = WALLETS.filter(function (x) { return x.v === d.wallet; })[0];
    var printLabel = S.printState === 'sent' ? T('printReceipt') + ' ✓'
                   : S.printState === 'busy' ? T('printReceipt') + '…'
                   : T('printReceipt');
    return '<div class="stop"></div>'
      + '<div class="smain"><div class="done">'
      +   '<span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 7"/></svg></span>'
      +   '<h2>' + esc(T('completed')) + ' ' + money(d.total) + '</h2>'
      +   '<div class="meta">' + esc(w ? cuT(w.en, w.cn) : '') + ' · ' + esc(d.order_no || '') + '</div>'
      +   '<div class="drow">'
      +     '<button class="dsec" type="button" data-print="1"' + (S.printState === 'busy' ? ' disabled' : '') + '>' + esc(printLabel) + '</button>'
      +     '<button class="dprim" type="button" data-go="reset">' + esc(T('newOrder')) + '</button>'
      +   '</div>'
      + '</div></div><div class="sfoot"></div>';
  }

  /* ---- actions --------------------------------------------------------- */
  function addLine(id) {
    // Belt to renderLines' braces. The product grid is behind the other pane
    // while a recall is open, but a stray tap must not be able to put a walk-in
    // item into somebody else's order — the settle path would charge the
    // original total and the extra line would vanish on the next render.
    if (S.recall) return;
    var p = S.products.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var st = stockOf(id);
    var l = findLine(id);
    var have = l ? l.qty : 0;
    if (st != null && have >= st) return;          // never sell past the shelf
    if (l) l.qty += 1;
    else S.lines.push({ id: id, name: pname(p), sku: p.sku || '', price: Number(p.sell_price) || 0, qty: 1 });
    render();
  }
  function bumpQty(d, idx) {
    if (S.recall) return;                 // read-only; see addLine
    var i = (idx == null || idx === '') ? S.sel : Number(idx);
    var l = S.lines[i]; if (!l) return;
    var drop = function () {
      S.lines.splice(i, 1);
      // The selection is an INDEX, so every line after the removed one shifts.
      // Clearing it is the only safe answer: keeping it would leave the tablet
      // strip attached to whichever line slid into that slot.
      S.sel = null; render();
    };
    if (d === 'x') return drop();
    var st = stockOf(l.id);
    var next = l.qty + Number(d);
    if (next <= 0) return drop();
    if (st != null && next > st) return;
    l.qty = next; render();
  }

  // Confirm. ONE request: the order is created already paid, with the chosen
  // wallet, through POST /api/retail-admin/orders. That is the path whose
  // markOrderPaid → isTerminalOnPaid branch flips a counter sale to its
  // terminal state, decrements the shelf and fires the automatic receipt. The
  // order does not exist until this moment, so a customer who walks away
  // leaves nothing behind to reconcile.
  function confirm() {
    if (!canConfirm()) return;
    var mode = SETTLE_MODES[S.mode];
    if (S.recall) return confirmRecall(mode);
    S.busy = true; S.err = ''; render();
    var body = Object.assign({
      fulfillment_type: 'counter',
      store_id: S.storeId,
      // §44 (amended 2026-09-07): a till sale and a QR sale are one shop
      // selling the same listings, so they share ONE channel and are never
      // split across two lines of a shop's revenue. Which door the order came
      // through is shop_entry_method, NOT `source` — the server binds `source`
      // itself, and 'manual' stays right for this row because staff did key it
      // in. This used to post channel='manual', which said nothing `source`
      // did not already say and left the sale with no card of its own.
      //
      // fulfillment_type stays 'counter' and is unchanged: it is what the stock
      // decrement, the drawer and the Sales page's POS card all branch on, and
      // it is the only reliable mark of a till sale on rows written before this.
      channel: 'shop',
      shop_entry_method: 'till',
      status: 'paid',
      customer_id: S.customer ? S.customer.id : null,
      // The server requires a recipient name on every manual order. A walk-in
      // has none, so the sale records the word the admin already uses for
      // exactly this state. It is stored data, not a rendered label — and the
      // receipt suppresses the hand-over block on a counter sale anyway.
      recipient_name: S.customer ? (S.customer.nickname || 'Guest') : 'Guest',
      items: S.lines.map(function (l) { return { product_id: l.id, qty: l.qty }; })
    }, mode.payload(S));

    api('/api/retail-admin/orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (j) {
      S.busy = false;
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      S.done = { id: j.data.id, order_no: j.data.order_no, total: j.data.total, wallet: S.wallet };
      S.view = 'done'; S.printState = 'idle';
      // The shelf moved server-side; mirror it locally so the next sale's
      // tiles are honest without a full reload.
      S.lines.forEach(function (l) {
        if (S.stock[l.id] != null) S.stock[l.id] = Math.max(0, S.stock[l.id] - l.qty);
      });
      render();
    }).catch(function (e) {
      S.busy = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  /* Settling an order that ALREADY EXISTS — the QR order the customer placed on
     their phone. PATCH, never POST: the row was created when they submitted,
     the money is the only thing about it that has changed, and creating a
     second order here would charge one customer twice, print two tickets and
     leave a phantom on the shop's day.

     THE KITCHEN TICKET COMES FROM THIS TRANSITION. markOrderPaid fires
     autoPrintOrder on the paid transition, and a QR order now reaches it having
     never printed — routes/shop-menu.js stopped printing on submit on
     2026-09-08 — so the slip appears when the money lands, which is the whole
     point of settling here rather than in the admin.

     ONE REQUEST, and the wallet rides on it: the same tap that says "paid" says
     which wallet took it, so an order cannot reach 'paid' with no tender and
     become the unreconcilable row the settle screen exists to prevent. */
  function confirmRecall(mode) {
    var r = S.recall;
    S.busy = true; S.err = ''; render();
    api('/api/retail-admin/orders/' + r.id + '/status', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mode.recallPayload(S))
    }).then(function (j) {
      S.busy = false;
      if (!j || !j.success) { S.err = T('didNotSave'); render(); return; }
      S.done = { id: r.id, order_no: r.order_no, total: r.total, wallet: S.wallet };
      S.view = 'done'; S.printState = 'idle';
      // It is not waiting any more. Dropped locally so the count is right the
      // instant the screen changes rather than up to fifteen seconds later —
      // a cashier who settles 12 and still sees 12 in the list will settle it
      // twice.
      S.pend = (S.pend || []).filter(function (o) { return o.id !== r.id; });
      S.recall = null;
      render();
    }).catch(function (e) {
      S.busy = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  /* Cancelling the recalled order. TWO TAPS: the first arms the control and it
     restates itself as a question, the second commits. No browser dialog —
     this screen opens none, and the arming state is the confirmation.

     ONE ENDPOINT, the admin's own status transition, which already releases the
     order's reservation (§45) and is the path staff have always cancelled
     through. Nothing new is written here for a state the rest of the system
     already understands.

     The list drops it locally the moment it lands, on the same reasoning the
     paid path gives: a cashier who cancels 12 and still sees 12 will cancel it
     twice, and the second attempt would meet an order that is no longer
     cancellable. */
  function cancelOrder() {
    if (!S.recall || S.recall.loading || S.busy) return;
    if (!S.cxArm) { S.cxArm = true; return render(); }
    var r = S.recall;
    S.busy = true; S.err = ''; render();
    api('/api/retail-admin/orders/' + r.id + '/status', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'cancelled' })
    }).then(function (j) {
      S.busy = false; S.cxArm = false;
      if (!j || !j.success) { S.err = T('didNotSave'); return render(); }
      S.pend = (S.pend || []).filter(function (o) { return o.id !== r.id; });
      S.recall = null; S.lines = []; S.sel = null;
      S.view = 'till'; S.pane = 'pend'; S.paneTouched = true;
      render();
      loadPend();
    }).catch(function (e) {
      S.busy = false; S.cxArm = false;
      S.err = e && e.auth ? cuT('Sign in on the backend, then reload this page.', '请先在后台登录,然后刷新此页面。')
                          : T('didNotSave');
      render();
    });
  }

  function reset() {
    S.lines = []; S.sel = null; S.customer = null;
    S.wallet = null; S.moreOpen = false; S.err = ''; S.done = null;
    S.view = 'till'; S.printState = 'idle';
    S.q = ''; $('q').value = '';
    // The sale is over, so the pane goes back to being defaulted rather than
    // chosen — the next customer decides which face the till should show, not
    // the last one. Re-read rather than trusting the local drop: another till
    // at the same counter may have settled something while this one was busy.
    S.recall = null; S.paneTouched = false;
    render();
    loadPend();
  }

  // Reprint. Printing already happened automatically when the sale settled, so
  // this is the second copy and is styled as such. Fire-and-forget: the button
  // reports that it sent, never that the paper came out, because the printer
  // is a network device and the till cannot know.
  function reprint() {
    if (!S.done || S.printState === 'busy') return;
    S.printState = 'busy'; render();
    api('/api/retail-admin/orders/' + S.done.id + '/print', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ store_id: S.storeId })
    }).then(function () { S.printState = 'sent'; render(); })
      .catch(function () { S.printState = 'idle'; render(); });
  }

  // Attaching a customer. Uses the browser prompt deliberately: a full search
  // panel is its own screen and this is an optional, uncommon step at a till.
  // It stays one tap from the rail and never blocks the sale.
  // ATTACHING A CUSTOMER IS A TACET SCREEN, not a browser prompt.
  //
  // It used to be window.prompt(): a chrome-coloured box saying
  // "store.rootskitchenchina.com says", which cannot be styled, cannot show
  // what it found, and took the FIRST match of pageSize=1 — so two customers
  // with the same given name were a coin toss the cashier never saw.
  //
  // Now it searches and shows what it found, with enough on each row to tell
  // two people apart. SEARCH-ONLY by decision: a customer who does not exist
  // yet is created in the backend, not at the till.
  function pickCustomer() {
    S.custOpen = true; S.custQ = ''; S.custRows = null;
    render();
  }

  function closeCustPicker() {
    S.custOpen = false; S.custRows = null;
    var el = $('custpick'); if (el) el.removeAttribute('data-built');
    render();
  }

  // Debounced so a four-letter name is one query rather than four. The token
  // guards against an earlier, slower reply landing after a later one and
  // overwriting it with results for a term the cashier has already changed.
  var _custTimer = null, _custToken = 0;
  function custSearch(term) {
    S.custQ = term;
    if (_custTimer) clearTimeout(_custTimer);
    var mine = ++_custToken;
    if (!term.trim()) { S.custRows = null; renderCustResults(); return; }
    _custTimer = setTimeout(function () {
      api('/api/retail-admin/customers?pageSize=12&q=' + encodeURIComponent(term.trim()))
        .then(function (j) {
          if (mine !== _custToken) return;      // a newer search already answered
          S.custRows = j.data || [];
          renderCustResults();
        })
        .catch(function () {
          if (mine !== _custToken) return;
          S.custRows = [];
          renderCustResults();
        });
    }, 220);
  }

  function attachCustomer(id) {
    var c = (S.custRows || []).filter(function (x) { return String(x.id) === String(id); })[0];
    if (!c) return;
    S.customer = c; S.custOpen = false; S.custRows = null;
    var el = $('custpick'); if (el) el.removeAttribute('data-built');
    render();
  }

  // THE SHELL IS BUILT ONCE, on open. Re-rendering it on every keystroke would
  // replace the <input> the cashier is typing into and drop the caret — the
  // classic way a search box becomes unusable. Only the result list redraws.
  function renderCustPicker() {
    var el = $('custpick');
    el.hidden = !S.custOpen;
    if (!S.custOpen) { el.innerHTML = ''; return; }
    if (el.getAttribute('data-built') === '1') { renderCustResults(); return; }
    el.innerHTML =
      '<div class="ssheet cust-sheet">'
      + '<div class="hd">' + esc(T('customer')) + '</div>'
      + '<div class="csearch">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>'
      + '<input id="cust-q" type="search" autocomplete="off" autocorrect="off" spellcheck="false">'
      + '</div>'
      + '<div class="crows" id="cust-rows"></div>'
      + '<button class="ccancel" type="button" data-cust="close">' + esc(T('cancel')) + '</button>'
      + '</div>';
    el.setAttribute('data-built', '1');
    var input = $('cust-q');
    input.placeholder = T('custSearch');
    input.addEventListener('input', function () { custSearch(this.value); });
    try { input.focus(); } catch (e) {}
    renderCustResults();
  }

  function renderCustResults() {
    var box = document.getElementById('cust-rows');
    if (!box) return;
    // Nothing typed yet is not the same as nothing found, and must not say so.
    if (S.custRows === null) { box.innerHTML = ''; return; }
    if (!S.custRows.length) { box.innerHTML = '<div class="cempty">' + esc(T('noMatches')) + '</div>'; return; }
    var h = '';
    S.custRows.forEach(function (c) {
      // Name and phone are what tell two people apart; points and wallet are
      // what the cashier is asked for at the counter. Both, on every row.
      var who = c.nickname || ('#' + c.id);
      h += '<button class="crow" type="button" data-cust="use" data-id="' + esc(String(c.id)) + '">'
        + '<span class="cwho">' + esc(who)
        + '<span class="cmeta">' + esc(c.phone || '') + '</span></span>'
        + '<span class="cbal">' + esc(T('points')) + ' ' + (Number(c.points) || 0)
        + '<span class="cmeta">' + esc(T('wallet')) + ' ' + money(c.balance) + '</span></span>'
        + '</button>';
    });
    box.innerHTML = h;
  }

  /* ---- wiring. Delegated: the grid and the rail re-render constantly. ---- */
  function wire() {
    document.addEventListener('click', function (ev) {
      // The scrim closes the picker: tapping away from a short list is the
      // expected way out, and it is the only dismissal this pop-up needs.
      if (S.pickOpen && ev.target.id === 'storepick') { S.pickOpen = false; return render(); }
      if (S.custOpen && ev.target.id === 'custpick') return closeCustPicker();
      // Tapping away from the leave question is staying, the same dismissal the
      // store picker takes — and the safe answer is the one a stray tap gives.
      if (S.leaveOpen && ev.target.id === 'leavepick') { S.leaveOpen = false; return render(); }
      var t = ev.target.closest('[data-add],[data-cat],[data-line],[data-q],[data-cust],[data-wal],[data-more],[data-confirm],[data-go],[data-print],[data-store],[data-pick],[data-sheet],[data-back],[data-leave],[data-pane],[data-recall],[data-recall-cancel],[data-cancel-order]');
      if (!t) return;
      // Choosing a pane. The flag is what stops the next poll from defaulting
      // the cashier back off the face they just asked for.
      if (t.hasAttribute('data-pane')) {
        S.pane = t.getAttribute('data-pane'); S.paneTouched = true; return render();
      }
      if (t.hasAttribute('data-recall')) return recall(Number(t.getAttribute('data-recall')));
      if (t.hasAttribute('data-recall-cancel')) return cancelRecall();
      if (t.hasAttribute('data-cancel-order')) return cancelOrder();
      // THE WAY BACK. An empty till leaves on the tap; a basket with lines in it
      // is a sale in progress that nothing has saved yet, so it asks first — in
      // the page, the way every other decision on this screen is made.
      if (t.hasAttribute('data-back')) {
        if (!S.home) return;
        if (S.lines.length) { S.leaveOpen = true; return render(); }
        window.location.href = S.home; return;
      }
      if (t.hasAttribute('data-leave')) {
        if (t.getAttribute('data-leave') === 'go') { window.location.href = S.home; return; }
        S.leaveOpen = false; return render();
      }
      if (t.hasAttribute('data-store')) { S.pickOpen = !S.pickOpen; return render(); }
      if (t.hasAttribute('data-sheet'))  {
        S.sheetOpen = t.getAttribute('data-sheet') === 'open';
        return render();
      }
      if (t.hasAttribute('data-pick'))  return switchStore(t.getAttribute('data-pick'));
      if (t.hasAttribute('data-add'))   return addLine(Number(t.getAttribute('data-add')));
      if (t.hasAttribute('data-cat'))   { S.cat = t.getAttribute('data-cat'); return render(); }
      if (t.hasAttribute('data-line'))  { var i = Number(t.getAttribute('data-line')); S.sel = (S.sel === i ? null : i); return render(); }
      if (t.hasAttribute('data-q'))     return bumpQty(t.getAttribute('data-q'), t.getAttribute('data-i'));
      if (t.hasAttribute('data-cust'))  {
        var act = t.getAttribute('data-cust');
        if (act === 'clear') { S.customer = null; return render(); }
        if (act === 'close') return closeCustPicker();
        // 'use' attaches a searched row; 'pick' OPENS the picker and is the
        // + Customer button's own long-standing value — do not merge the two.
        if (act === 'use')   return attachCustomer(t.getAttribute('data-id'));
        return pickCustomer();
      }
      if (t.hasAttribute('data-wal'))   { S.wallet = t.getAttribute('data-wal'); S.err = ''; return render(); }
      if (t.hasAttribute('data-more'))  { S.moreOpen = true; return render(); }
      if (t.hasAttribute('data-confirm')) return confirm();
      if (t.hasAttribute('data-print')) return reprint();
      if (t.hasAttribute('data-go'))    {
        var g = t.getAttribute('data-go');
        if (g === 'reset') return reset();
        S.view = 'till'; S.err = ''; return render();
      }
    });
    /* BOTH pay buttons, through one handler.
       #pay is the rail's, #bar-pay is the phone bar's — and #bar-pay had no
       listener at all until 2026-09-08. It rendered, it enabled and disabled
       itself correctly in renderFoot, and tapping it did nothing: on a phone
       with the order sheet closed, the button the thumb goes for was inert and
       the only working one was inside the sheet. Fixed here rather than filed
       because the pending list leans on that layout — the cashier recalls an
       order on a phone and the sheet is exactly what they are looking at.

       The guard reads the same `ready` rule renderFoot uses for `disabled`,
       so a recalled order whose lines are still in flight cannot be settled by
       a tap that beat them. */
    var goSettle = function () {
      if (S.recall ? S.recall.loading : !S.lines.length) return;
      S.view = 'settle'; S.err = ''; S.sel = null; render();
    };
    $('pay').addEventListener('click', goSettle);
    $('bar-pay').addEventListener('click', goSettle);
    $('hd-lang').addEventListener('click', function () { setLang(_lang === 'cn' ? 'en' : 'cn'); });
    $('q').addEventListener('input', function (e) { S.q = e.target.value || ''; $('q-clr').hidden = !S.q; renderGrid(); });
    $('q-clr').addEventListener('click', function () { S.q = ''; $('q').value = ''; $('q-clr').hidden = true; renderGrid(); });
  }

  start();
})();
</script>
</body>
</html>
