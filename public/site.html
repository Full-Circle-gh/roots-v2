<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2E7DF">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Replaced by the server with the title, description and share tags
     (lib/site-head.js, §503 rule 16). Keep it exactly as written. -->
<title>Website</title>
<!--
  The brand website (decisions §503). Served on a domain the tenant marks
  `serves = 'site'` (tenant_domains), and inside the editor at
  /site-preview?draft=1&stage=1. It draws the `website` page layout with the
  web shop's own block engine (public/shop/blocks.js) and nothing else: no
  basket, sign-in, search or shop routes. A block button that leads into the
  shop is inert here; a full https:// link opens.
-->
<style>
  /* Brand fonts: the same files and family names public/shop.html declares,
     because blocks.css reads the --f-* names below. */
  @font-face { font-family:'Bear Serif'; src:url('/assets/fonts/LilitaOne.ttf') format('truetype'); unicode-range:U+0024,U+0025,U+0030-0039,U+00A5; font-display:swap; }
  @font-face { font-family:'Bear Serif'; src:url('/assets/fonts/BearSerif.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'Lilita One'; src:url('/assets/fonts/LilitaOne.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'Toni Grotesk'; src:url('/assets/fonts/ToniGroteskPro.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'League Gothic'; src:url('/assets/fonts/LeagueGothic.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW5.ttf') format('truetype'); font-weight:500; font-display:swap; }
  @font-face { font-family:'DF Yuan'; src:url('/assets/fonts/DFYuanW7.ttf') format('truetype'); font-weight:700; font-display:swap; }
  @font-face { font-family:'Aleo'; src:url('/assets/fonts/Aleo-Regular.otf') format('opentype'); font-display:swap; }

  :root{
    --oat:#F2E7DF; --ink:#1a1a17; --forest:#365329; --olive:#6A6E2D; --lime:#CCD900;
    --accent:#365329;            /* overridden from tenant config at runtime */
    --paper:#fff; --line:rgba(0,0,0,.08); --muted:#7c7c72;
    --f-bear:'Bear Serif','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-num:'Lilita One','Bear Serif','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-toni:'Toni Grotesk','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,sans-serif;
    --f-gothic:'League Gothic','DF Yuan','PingFang SC','Hiragino Sans GB','Bebas Neue',sans-serif;
    --f-aleo:'Aleo','DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,serif;
    --f-yuan:'DF Yuan','PingFang SC','Hiragino Sans GB',sans-serif;
    --wrap:1180px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--f-aleo);background:var(--oat);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  header.site-bar{position:sticky;top:0;z-index:20;background:var(--oat);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
  .bar-in{max-width:var(--wrap);margin:0 auto;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .wordmark{font-family:var(--f-bear);font-size:26px;line-height:1;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;}
  /* The brand's own wordmark picture (brand.me_footer.wordmark_image), the
     same one the mini app's footer shows; the name is the fallback. */
  .wordmark img{height:40px;width:auto;display:block;}
  .foot-in .fm img{height:28px;width:auto;display:block;}
  .bar-actions{display:flex;align-items:center;gap:16px;margin-left:auto;flex:none;}
  /* Option A — forest pill (reference/site-bar-menu-button-mockup.html). */
  .bar-menu-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;
    font-family:var(--f-toni);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;
    background:var(--forest);color:#fff;border:0;border-radius:999px;-webkit-tap-highlight-color:transparent;}
  .bar-menu-btn:focus-visible{outline:3px solid var(--lime);outline-offset:2px;}
  .bar-menu-btn[hidden]{display:none!important;}
  .bar-nav{display:flex;align-items:center;gap:22px;font-size:15px;}
  .bar-nav a{text-decoration:none;}
  .bar-nav a:hover{text-decoration:underline;text-underline-offset:4px;}

  main{flex:1;}
  .empty{max-width:560px;margin:80px auto;padding:0 20px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5;}

  footer{border-top:1px solid var(--line);background:#fff;}
  .foot-in{max-width:var(--wrap);margin:0 auto;padding:26px max(20px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;}
  .foot-in .fm{font-family:var(--f-bear);color:var(--accent);font-size:18px;}
  .foot-links{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 22px;}
  .foot-links a{text-decoration:none;}
  .foot-links a:hover{text-decoration:underline;}

  /* Phone (§503 rules 41–46). The block engine's unit is 100vw/750, which on
     a phone makes body copy about 12px. These sizes are the phone mock-up's
     (reference/roots-mobile-site-mockup.html). They apply only on this page. */
  @media (max-width:767px){
    .bar-in{flex-wrap:wrap;align-items:center;padding:12px 16px;}
    .wordmark img{height:40px;}
    .bar-actions{gap:12px;}
    .bar-menu-btn{font-size:13px;padding:10px 18px;}
    .bar-nav{flex-wrap:wrap;gap:4px 16px;font-size:13px;}
    .bar-nav a{
      display:inline-flex;align-items:center;min-height:44px;
      font-family:var(--f-toni);font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
    }
    .foot-in{font-size:15px;line-height:1.45;}
    .foot-links a{display:inline-flex;align-items:center;min-height:44px;}

    body .shop-blocks .sb-hero-split{grid-template-columns:1fr;min-height:0;}
    /* Story ? poster: no margin strip after the bottom rule; poster height
       follows the art (inline aspect-ratio on the block left a white/oat band). */
    body .shop-blocks .sb-recipe-blk{margin-bottom:0;}
    body .shop-blocks .sb-hero.sb-hero-full.sb-hero-fit-contain{
      aspect-ratio:auto !important;height:auto !important;min-height:0 !important;
      line-height:0;background:var(--oat);
    }
    body .shop-blocks .sb-hero.sb-hero-full.sb-hero-fit-contain .sb-hero-img,
    body .shop-blocks .sb-hero.sb-hero-full.sb-hero-fit-contain .sb-hero-video{
      width:100%;height:auto !important;max-height:none;object-fit:contain;display:block;
    }
    /* The picture keeps its own shape and fills the width (§503 rule 44).
       A fixed short box was leaving the café photo and the Canton Fair
       logo sitting in part of a gray bar. */
    body .shop-blocks .sb-split-img{height:auto;background:var(--oat);}
    body .shop-blocks .sb-split-img .sb-hero-img,body .shop-blocks .sb-split-img .sb-hero-video{width:100%;height:auto;object-fit:contain;display:block;}
    body .shop-blocks .sb-split-panel{padding:18px 22px 28px;}
    body .shop-blocks .sb-split-panel .sb-headline{font-size:38px;line-height:1.04;}
    body .shop-blocks .sb-split-panel .sb-subtitle{font-size:17px;line-height:1.5;opacity:1;}
    body .shop-blocks .sb-split-panel .sb-cta-btn{width:auto;min-height:48px;padding:12px 20px;font-size:14px;letter-spacing:0.12em;}
    body .shop-blocks .sb-cta-btn{min-height:48px;font-size:14px;letter-spacing:0.1em;}

    body .shop-blocks .sb-announce{font-size:20px;padding:14px 16px;}

    body .shop-blocks .sb-fact{padding:36px 22px 32px;}
    body .shop-blocks .sb-fact-row{grid-template-columns:1fr;gap:26px;}
    body .shop-blocks .sb-fact-t{font-size:40px;}
    body .shop-blocks .sb-fact-b{font-size:16px;line-height:1.4;margin-top:8px;}

    body .shop-blocks .sb-steps{padding:32px 22px 36px;}
    body .shop-blocks .sb-steps-kicker,body .shop-blocks .sb-cl-kicker,body .shop-blocks .sb-menu-kicker,
    body .shop-blocks .sb-st-kicker,body .shop-blocks .sb-rcp-kicker,body .shop-blocks .sb-grid-block .sb-kicker{
      font-size:16px;letter-spacing:0.08em;
    }
    body .shop-blocks .sb-steps-title,body .shop-blocks .sb-cl-title,body .shop-blocks .sb-menu-title,
    body .shop-blocks .sb-st-title,body .shop-blocks .sb-rcp-headline,body .shop-blocks .sb-grid-block .sb-ttl{
      font-size:32px;line-height:1.05;
    }
    /* SEE ALL stayed on the block engine's phone unit (~9px) and wrapped to
       two lines beside a long title. Same size as the dish names, one line. */
    body .shop-blocks .sb-grid-head,body .shop-blocks .sb-cat-head{align-items:flex-end;}
    body .shop-blocks .sb-grid-head > :first-child,body .shop-blocks .sb-cat-head > :first-child{
      flex:1 1 auto;min-width:0;
    }
    body .shop-blocks .sb-grid-block .sb-more,body .shop-blocks .sb-cattabs .sb-more{
      font-size:18px;letter-spacing:0.06em;line-height:1.2;
      white-space:nowrap;flex-shrink:0;margin-left:12px;
    }
    body .shop-blocks .sb-steps-body,body .shop-blocks .sb-rcp-para,body .shop-blocks .sb-st-val{font-size:17px;line-height:1.5;}
    body .shop-blocks .sb-step{padding:18px 18px 20px;}
    body .shop-blocks .sb-step-n{font-size:52px;}
    body .shop-blocks .sb-step-t{font-size:24px;}
    body .shop-blocks .sb-step-b{font-size:16px;line-height:1.45;}

    body .shop-blocks .sb-recipe-side{flex-direction:column;}
    body .shop-blocks .sb-recipe-side .sb-rcp-img{width:100%;min-height:0;aspect-ratio:4/3;}
    body .shop-blocks .sb-recipe-side .sb-rcp-body,body .shop-blocks .sb-rcp-body{padding:28px 22px 32px;}
    body .shop-blocks .sb-rcp-meta{font-size:13px;letter-spacing:0.08em;}
    body .shop-blocks .sb-rcp-cta{min-height:48px;font-size:14px;padding:12px 20px;}

    body .shop-blocks .sb-menu{padding:32px 0 36px 22px;}
    body .shop-blocks .sb-menu-grid{gap:14px;padding-right:22px;scroll-behavior:smooth;}
    body .shop-blocks .sb-menu-card{flex:0 0 calc(100% - 28px);max-width:360px;}
    body .shop-blocks .sb-menu-img{background:#F2E7DF;}
    body .shop-blocks .sb-menu-img img{object-fit:contain;}
    body .shop-blocks .sb-menu-name{font-size:18px;}
    body .shop-blocks .sb-menu-price{font-size:20px;}
    body .shop-blocks .sb-menu-text{font-size:15px;line-height:1.45;}

    body .shop-blocks .sb-cols-2,body .shop-blocks .sb-cols-3{
      display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;
      -webkit-overflow-scrolling:touch;padding-bottom:8px;
    }
    body .shop-blocks .sb-cols-2 .sb-card,body .shop-blocks .sb-cols-3 .sb-card{flex:0 0 214px;scroll-snap-align:start;}
    body .shop-blocks .sb-card .sb-name{font-size:18px;}
    body .shop-blocks .sb-price{font-size:20px;}
    body .shop-blocks .sb-price-was{font-size:14px;}

    body .shop-blocks .sb-store-blk{margin:0;padding:32px 22px 36px;}
    body .shop-blocks .sb-st-val{font-size:17px;}
    body .shop-blocks .sb-st-status,body .shop-blocks .sb-st-hours{font-size:16px;}
    body .shop-blocks .sb-st-cnaddr{font-size:18px;}
    body .shop-blocks .sb-st-visit .sb-st-map.is-live{height:260px;}
    body .shop-blocks .sb-st-visit--hero .sb-st-map-hero{position:relative;}
    body .shop-blocks .sb-st-visit--hero .sb-st-map-scrim{
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(to top,rgba(26,26,23,.72) 0%,transparent 55%);
    }
    body .shop-blocks .sb-st-visit--hero .sb-st-map-cap{
      position:absolute;left:16px;right:16px;bottom:14px;color:#fff;
      font-size:14px;line-height:1.35;pointer-events:none;
    }
    body .shop-blocks .sb-st-visit--hero .sb-st-map-cap-title{
      display:block;font-family:var(--f-bear);font-size:17px;margin-bottom:2px;
    }
    body .shop-blocks .sb-st-visit--hero .sb-st-map-cap-hint{display:block;opacity:.95;}
    body .shop-blocks .sb-st-visit--hero .sb-st-map-cap-addr{
      display:block;opacity:.9;margin-top:2px;font-size:13px;line-height:1.35;
      overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    }
    body .shop-blocks .sb-st-visit--hero .sb-st-title--in-cap{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0,0,0,0);white-space:nowrap;border:0;
    }
    body .shop-blocks .sb-st-visit--hero .sb-st-card{padding:12px 22px 18px;}
    body .shop-blocks .sb-st-get-dir{width:100%;}
    body .shop-blocks .sb-st-visit .sb-st-dir{justify-content:center;width:100%;}
    body .shop-blocks .sb-st-cta{min-height:44px;font-size:13px;letter-spacing:0.08em;display:inline-flex;align-items:center;padding:10px 14px;}

    body .shop-blocks .sb-cl{padding:28px 22px 36px;}
    body .shop-blocks .sb-cl-item{padding:14px 16px;gap:14px;min-height:44px;}
    body .shop-blocks .sb-cl-ico{width:28px;height:28px;}
    body .shop-blocks .sb-cl-name{font-size:20px;}
    body .shop-blocks .sb-cl-sub{font-size:16px;line-height:1.35;}
    body .shop-blocks .sb-cl-sub.sb-cl-copy{white-space:normal;overflow:visible;text-overflow:unset;overflow-wrap:anywhere;}
    body .shop-blocks .sb-cl-rate{font-size:16px;}
    body .shop-blocks .sb-cl-qr{width:88px;height:88px;}

    body .shop-blocks .sb-blk-outer,body .shop-blocks .sb-blk-outer.framed{overflow:visible;}
    /* Every character in the top right, in the label's row. The title follows
       that row at full width, so a drawing never sits on the words (§503 rule 43). */
    body .shop-blocks .sb-char{
      height:72px;width:auto;max-width:96px;top:16px;right:12px;left:auto;z-index:4;
      object-fit:contain;object-position:right center;
      transform:none;
      animation:site-char-bob 4.6s ease-in-out infinite;
    }
    body .shop-blocks .sb-char-left,body .shop-blocks .sb-char-right{right:12px;left:auto;}
    body .shop-blocks .sb-blk-outer:has(.sb-char) :is(.sb-steps,.sb-cl,.sb-menu,.sb-store-blk,.sb-grid-block,.sb-rcp-body){padding-top:16px;}
    body .shop-blocks .sb-blk-outer:has(.sb-char) :is(
      .sb-steps-kicker,.sb-cl-kicker,.sb-menu-kicker,.sb-st-kicker,.sb-rcp-kicker,.sb-grid-block .sb-kicker
    ){
      display:flex;align-items:center;box-sizing:border-box;
      min-height:80px;padding-right:112px;
    }
    body .shop-blocks .sb-blk-outer[data-block-type="recipe_story"]{container-type:inline-size;}
    body .shop-blocks .sb-blk-outer[data-block-type="recipe_story"] .sb-char{top:calc(100cqw * 3 / 4 + 16px);}
    body .shop-blocks .sb-blk-outer:has(.sb-char) .sb-grid-head{align-items:flex-end;}
    body .shop-blocks .sb-blk-outer:has(.sb-char) .sb-fact-item:first-child{padding-right:112px;}
  }
  @keyframes site-char-bob{
    0%,100%{transform:rotate(-2deg);}
    50%{transform:translateY(-6px) rotate(2deg);}
  }
  @media (prefers-reduced-motion:reduce){
    body .shop-blocks .sb-char{animation:none;}
  }



  /* One visit card: map + details together (§503 rule 50). */
  body .shop-blocks .sb-st-visit{background:#fff;border-radius:22px;overflow:hidden;}
  /* The scroll shield sits beside the map node, not inside it (§503 rule 39).
     Amap sets touch-action:none on the map node; a child cannot undo that. */
  body .shop-blocks .sb-st-map-frame{position:relative;}
  body .shop-blocks .sb-st-map-hit{
    position:absolute;inset:0;z-index:8;touch-action:pan-y;background:transparent;
  }
  body .shop-blocks .sb-st-visit .sb-st-map.is-live{margin-bottom:0;border-radius:0;}
  body .shop-blocks .sb-st-visit .sb-st-card{background:transparent;}
  @media (min-width:768px){
    body .shop-blocks .sb-st-visit-addr{display:block;font-size:17px;line-height:1.45;margin:8px 0 18px;text-decoration:none;border-bottom:1px solid rgba(26,26,23,.22);padding-bottom:2px;}
  }
  body .shop-blocks .sb-st-get-dir{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;margin-bottom:14px;background:var(--forest);color:#fff;border-radius:999px;text-decoration:none;font-family:var(--f-toni);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;}
  body .shop-blocks .sb-st-visit .sb-st-dir{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:0;}
  body .shop-blocks .sb-st-visit .sb-st-dir-btn{border:0;padding:0;min-height:auto;font-size:13px;letter-spacing:.06em;text-decoration:underline;text-transform:uppercase;}
  @media (min-width:768px){
    body .shop-blocks .sb-st-visit{display:grid;grid-template-columns:1.15fr .85fr;align-items:stretch;}
    body .shop-blocks .sb-st-visit .sb-st-map.is-live{height:100%;min-height:420px;}
    body .shop-blocks .sb-st-visit .sb-st-map-frame{height:100%;}
    body .shop-blocks .sb-st-visit .sb-st-map-frame .sb-st-map.is-live{height:100%;min-height:420px;}
    body .shop-blocks .sb-st-visit .sb-st-card{padding:36px 40px;display:flex;flex-direction:column;justify-content:center;}
  }
  /* Desktop site chrome (option B + split-hero separation). White header; split
     heroes get top/bottom rules only (full-bleed, square ends, no card frame). */
  @media (min-width:768px){
    header.site-bar{background:var(--paper);}
    body .shop-blocks .sb-blk-outer[data-block-type="hero_banner"] .sb-hero-split{
      border:0;
      border-top:2px solid var(--ink);
      border-bottom:2px solid var(--ink);
      border-radius:0;
    }
    body .shop-blocks .sb-blk-outer[data-block-type="hero_banner"]:not(:first-child){
      margin-top:32px;
    }
    body .shop-blocks .sb-blk-outer[data-block-type="hero_banner"] .sb-split-img{
      background:var(--paper);
    }
    body .shop-blocks .sb-blk-outer[data-block-type="hero_banner"] .sb-split-img .sb-hero-img,
    body .shop-blocks .sb-blk-outer[data-block-type="hero_banner"] .sb-split-img .sb-hero-video{
      object-fit:cover;
      object-position:center top;
    }
  }
  /* Slogan line edge to edge and large on a computer (§503 rule 48). */
  @media (min-width:768px){
    body .shop-blocks .sb-blk-outer[data-block-type="announcement_bar"]{
      width:100vw;max-width:none;position:relative;left:50%;transform:translateX(-50%);
    }
    body .shop-blocks .sb-announce{font-size:24px;padding:18px 40px;letter-spacing:0.04em;}
    /* No IP characters on a computer (§503 rule 49). They stay on a phone. */
    body .shop-blocks .sb-char{display:none;}
  }
  /* The floating WhatsApp button (§503 rule 20): bottom corner, clear of the
     phone's safe area, an icon with an accessible name and no words. */
  .wa-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.18);text-decoration:none;}
  .wa-fab:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
  .wa-fab svg{width:28px;height:28px;}
  .cms-stage .wa-fab{display:none;}

  /* Editor desktop stage (?stage=1): the same click targets and Dusk ring as
     public/shop.html's stage, so the two pages edit alike. */
  .cms-stage .sb-blk-outer{cursor:pointer;}
  .cms-stage .sb-blk-outer:hover{outline:2px dashed rgba(110,103,175,.55);outline-offset:2px;}
  .cms-stage .sb-blk-outer.cms-selected{outline:2px solid #6E67AF;outline-offset:2px;box-shadow:0 0 0 5px rgba(110,103,175,.18);}

  /* QR menu in a phone frame on a computer (�503 rule 51). */
  .site-menu-scrim{position:fixed;inset:0;z-index:40;background:rgba(26,26,23,.62);display:flex;align-items:center;justify-content:center;padding:24px;}
  .site-menu-scrim[hidden]{display:none!important;}
  .site-menu-wrap{position:relative;max-height:calc(100vh - 48px);}
  .site-menu-close{position:absolute;top:-12px;right:-12px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:26px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .site-menu-close:focus-visible{outline:3px solid var(--forest);outline-offset:2px;}
  .site-menu-phone{width:390px;max-width:calc(100vw - 48px);height:min(844px,calc(100vh - 80px));background:#fff;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .site-menu-phone::before{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#1a1a17;border-radius:0 0 18px 18px;z-index:2;pointer-events:none;}
  .site-menu-open-tab{align-self:center;margin-top:10px;font-size:13px;color:#fff;text-decoration:underline;text-underline-offset:3px;}
  .site-menu-open-tab:focus-visible{outline:2px solid #fff;outline-offset:3px;}
  .site-menu-frame{flex:1;border:0;width:100%;background:#F2E7DF;margin-top:0;}
</style>

<script>
'use strict';
const state={config:{},lang:'en',products:null,brand:''};
// §503 rule 50 · mobile map hero caption (vocabulary v1.372). English on the live site.
const SITE_VISIT_MAP_HINT='Tap map for directions';
let STAGE_MODE=false, stageSel=null, stageKey=null, stageIdKey=null;
const $=s=>document.querySelector(s);

async function api(path){
  const r=await fetch(path,{headers:{'Accept':'application/json','x-lang':state.lang==='cn'?'cn':'en'}});
  if(!r.ok) throw new Error(path+' → '+r.status);
  const j=await r.json();
  return j&&('data'in j)?j.data:j;
}

// Theme: the subset of public/shop.html applyTheme() this page uses — the
// published palette and the display/body families, uploaded families included.
function loadBrandFonts(fonts){
  const fmt=u=>{ const m=String(u).toLowerCase().match(/\.(woff2|woff|otf|ttf)(?:[?#]|$)/);
    return m?({woff2:'woff2',woff:'woff',otf:'opentype',ttf:'truetype'}[m[1]]):''; };
  const seen=new Set(), rules=[];
  [fonts.display,fonts.body].forEach(f=>{
    if(!f||!f.url||!f.family||!/^https:\/\//i.test(f.url)) return;
    const fam=String(f.family).replace(/'/g,''); if(seen.has(fam)) return; seen.add(fam);
    const f2=fmt(f.url); rules.push(`@font-face{font-family:'${fam}';src:url('${f.url}')${f2?` format('${f2}')`:''};font-display:swap;}`);
  });
  if(!rules.length) return;
  const el=document.createElement('style'); el.id='brandFonts'; el.textContent=rules.join('\n'); document.head.appendChild(el);
}
function applyTheme(cfg){
  const t=(cfg&&cfg.theme)||{}, p=t.palette||{}, root=document.documentElement;
  const setVar=(k,v)=>{ if(v) root.style.setProperty(k,v); };
  setVar('--oat',p.surface); setVar('--ink',p.ink); setVar('--forest',p.primary);
  setVar('--lime',p.accent); setVar('--olive',p.muted);
  const CJK="'DF Yuan','PingFang SC','Hiragino Sans GB',-apple-system,sans-serif";
  loadBrandFonts(t.fonts||{});
  const fam=f=>(f&&f.family)?`'${String(f.family).replace(/'/g,'')}', ${CJK}`:'';
  setVar('--f-bear',fam(t.fonts&&t.fonts.display));
  setVar('--f-aleo',fam(t.fonts&&t.fonts.body));
  const hex=p.primary||'#365329';
  root.style.setProperty('--accent',hex);
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content',p.surface||'#F2E7DF');
}
// The wordmark picture, when the brand has one: a path on this site or https.
function brandMark(cfg){
  const u=cfg&&cfg.brand&&cfg.brand.me_footer&&cfg.brand.me_footer.wordmark_image;
  return (u&&/^(\/(?!\/)|https:\/\/)[^\s"'<>]+$/.test(String(u)))?String(u):'';
}
function brandName(cfg){
  const w=cfg&&cfg.brand&&cfg.brand.me_footer&&cfg.brand.me_footer.wordmark_text;
  return (w&&String(w).trim())||'';
}
// The website's words come from the same settings as the web shop's
// (cfg.web.site, back office → Web store configuration): title, description,
// footer line and footer links. Header menu items that point outside (https)
// show; the web shop's own home/shop items do not belong here.
function siteCfg(){ const w=state.config&&state.config.web; return (w&&w.site&&typeof w.site==='object')?w.site:{}; }
function pick(en,cn){ return (state.lang==='cn'?(cn||en):(en||cn))||''; }
function renderChrome(){
  const site=siteCfg();
  const mark=brandMark(state.config);
  for(const [id,el] of [['wordmark',$('#wordmark')],['footBrand',$('#footBrand')]]){
    el.textContent='';
    if(mark){ const img=document.createElement('img'); img.src=mark; img.alt=state.brand||''; el.appendChild(img); }
    else el.textContent=state.brand;
  }
  $('#wordmark').setAttribute('aria-label',state.brand||'');
  $('#footMeta').textContent=pick(site.footer_en,site.footer_cn);
  const nav=$('#navLinks'); nav.innerHTML='';
  for(const it of (Array.isArray(site.nav)?site.nav:[])){
    if(!/^https:\/\//i.test(it&&it.target||'')) continue;
    const a=document.createElement('a'); a.href=it.target; a.target='_blank'; a.rel='noopener';
    a.textContent=pick(it.label_en,it.label_cn); nav.appendChild(a);
  }
  const row=$('#footLinks'); row.innerHTML='';
  const links=Array.isArray(site.links)?site.links:[];
  for(const l of links){ const a=document.createElement('a'); a.href=l.url; a.target='_blank'; a.rel='noopener'; a.textContent=pick(l.label_en,l.label_cn); row.appendChild(a); }
  row.hidden=!links.length;
  bindSiteBarMenu();
  // The website's own words first (website.meta, §503 rule 15), then the web
  // shop's — the same order serveSite used to write the page's head.
  const meta=(state.config&&state.config.website&&state.config.website.meta)||{};
  document.title=pick(meta.title_en,meta.title_cn)||pick(site.title_en,site.title_cn)||state.brand||'Website';
  let desc=document.querySelector('meta[name="description"]');
  const d=pick(meta.description_en,meta.description_cn)||pick(site.description_en,site.description_cn);
  if(d){ if(!desc){ desc=document.createElement('meta'); desc.name='description'; document.head.appendChild(desc); } desc.content=d; }
  else if(desc){ desc.remove(); }
  document.documentElement.lang=state.lang==='cn'?'zh-CN':'en';
}

function stageHighlight(scroll){
  if(!STAGE_MODE) return;
  document.querySelectorAll('.sb-blk-outer.cms-selected').forEach(el=>el.classList.remove('cms-selected'));
  if(!stageSel) return;
  const el=document.querySelector('.sb-blk-outer[data-block-id="'+CSS.escape(stageSel)+'"]');
  if(!el) return;
  el.classList.add('cms-selected');
  if(scroll){ const r=el.getBoundingClientRect(); if(r.bottom<0||r.top>window.innerHeight) el.scrollIntoView({block:'center',behavior:'smooth'}); }
}

// Products the layout names by id (manual grids, a featured product, a
// bundle), plus a base pull for the grids that choose their own — the same
// pre-fetch as public/shop.html renderHome().
function layoutProductIds(layout){
  const ids=new Set();
  for(const b of layout){ (b.product_ids||[]).forEach(id=>id&&ids.add(id)); if(b.product_id) ids.add(b.product_id); if(b.bundle_product_id) ids.add(b.bundle_product_id); }
  return [...ids];
}
async function loadProducts(layout){
  let base=[]; try{ base=(await api('/api/retail/products?limit=100'))||[]; }catch(e){}
  const refIds=layoutProductIds(layout);
  if(refIds.length){
    try{
      const ref=(await api('/api/retail/products?ids='+refIds.join(',')+'&bundle_components=1&limit=200'))||[];
      const map=new Map(base.map(p=>[p.id,p])); for(const p of ref) map.set(p.id,p); base=[...map.values()];
    }catch(e){}
  }
  return base;
}

// §503 rule 42. A section with no character stored still shows the next of
// the white-line cast, so the page is not bare. The editor's stage does not
// do this: there, None stays None. A character the block already stores wins.
const PHONE_CAST=['skater','onion','radishes','broccoli','flex','peas','mushroom'];
const CAST_TYPES={fact_band:1,steps:1,store_info:1,contact_links:1,recipe_story:1,product_grid:1};
function withCast(layout){
  if(STAGE_MODE) return layout;
  let n=0;
  return layout.map(b=>{
    if(!b||!CAST_TYPES[b.type]) return b;
    if(b.character&&/^[a-z0-9-]{1,30}$/.test(String(b.character))) return b;
    const next=Object.assign({},b);
    next.character=PHONE_CAST[n%PHONE_CAST.length];
    if(next.character_side!=='left'&&next.character_side!=='right') next.character_side=n%2?'left':'right';
    n++;
    return next;
  });
}

// §503 rule 46. A store card with an address and no pin still takes the
// position of the shop it names, from the shops the checkout already
// publishes. A card that already has a pin keeps it. Tianhe is not added:
// nothing on the page names it.
let shopPins=null;
function hasPin(s){
  const la=Number(s&&s.lat), ln=Number(s&&s.lng);
  return isFinite(la)&&isFinite(ln)&&la!==0&&ln!==0;
}
function shopMatches(card, shop){
  if(card.store_id&&Number(card.store_id)===Number(shop.id)) return true;
  const name=String(card.name_en||'').toLowerCase();
  const en=String(shop.name_en||'').toLowerCase();
  return en.length>=4&&name.includes(en);
}

// �503 rule 51. The QR menu is built for a phone; on a computer it opens in a
// phone mock-up (public site, /site-preview, and the editor stage).
const SHOP_MENU_PATH=/^\/s\/[A-HJ-NP-Z2-9]{8}(?:\/|$)/i;
function isShopMenuUrl(url){
  try{ const u=new URL(String(url||''),'https://example.invalid'); return u.protocol==='https:'&&SHOP_MENU_PATH.test(u.pathname); }
  catch(e){ return false; }
}
function siteMenuDesktop(){ return window.matchMedia('(min-width:768px)').matches; }
function openSiteMenuPhone(url){
  const scrim=$('#siteMenuScrim'), frame=$('#siteMenuFrame'), tab=$('#siteMenuOpenTab');
  if(!scrim||!frame) return;
  frame.src=url;
  if(tab) tab.href=url;
  scrim.hidden=false;
  document.body.style.overflow='hidden';
  const close=$('#siteMenuClose'); if(close) close.focus();
}
function closeSiteMenuPhone(){
  const scrim=$('#siteMenuScrim'), frame=$('#siteMenuFrame');
  if(!scrim) return;
  scrim.hidden=true;
  document.body.style.overflow='';
  if(frame) frame.src='about:blank';
}
function wireSiteMenuPhone(){
  const scrim=$('#siteMenuScrim');
  if(!scrim||scrim.dataset.wired==='1') return;
  scrim.dataset.wired='1';
  $('#siteMenuClose').addEventListener('click',closeSiteMenuPhone);
  scrim.addEventListener('click',ev=>{ if(ev.target===scrim) closeSiteMenuPhone(); });
  document.addEventListener('keydown',ev=>{
    if(ev.key==='Escape'&&!scrim.hidden) closeSiteMenuPhone();
  });
}
function trySiteMenuCtaClick(ev){
  if(!siteMenuDesktop()) return false;
  const el=ev.target.closest('[data-cta-target]'); if(!el) return false;
  const t=String(el.getAttribute('data-cta-target')||'');
  if(!isShopMenuUrl(t)) return false;
  ev.preventDefault();
  ev.stopPropagation();
  openSiteMenuPhone(t);
  return true;
}
function shopMenuUrlInBlocks(layout){
  if(!Array.isArray(layout)) return '';
  for(const b of layout){
    if(!b||typeof b!=='object') continue;
    const targets=[];
    if(b.cta_target) targets.push(b.cta_target);
    for(const c of (Array.isArray(b.ctas)?b.ctas:[])) if(c&&c.target) targets.push(c.target);
    for(const t of targets) if(isShopMenuUrl(t)) return t;
  }
  return '';
}
function siteBarMenuUrl(){
  const site=siteCfg();
  if(isShopMenuUrl(site.menu)) return site.menu;
  for(const it of (Array.isArray(site.nav)?site.nav:[])) if(isShopMenuUrl(it.target)) return it.target;
  for(const l of (Array.isArray(site.links)?site.links:[])) if(isShopMenuUrl(l.url)) return l.url;
  const pub=state.config&&state.config.website&&state.config.website.layout;
  return shopMenuUrlInBlocks(pub)||'';
}
function openSiteBarMenu(url,ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  if(siteMenuDesktop()) openSiteMenuPhone(url);
  else location.href=url;
}
// On a computer, Menu lists this page's sections. A click scrolls to that
// block, just under the bar. A phone still follows the QR menu link.
const SECTION_SKIP={spacer:1,announcement_bar:1,fact_band:1};
function sectionLabel(b){
  const tidy=s=>String(s||'').replace(/\s+/g,' ').trim();
  const title=tidy(pick(b.title_en,b.title_cn));
  const headline=tidy(pick(b.headline_en,b.headline_cn));
  const kicker=tidy(String(pick(b.kicker_en,b.kicker_cn)||'').split('·')[0]);
  return title||headline||kicker;
}
function pageSections(layout){
  const out=[]; let skippedHero=false;
  for(const b of (Array.isArray(layout)?layout:[])){
    if(!b||typeof b!=='object') continue;
    if(b.type==='hero_banner'&&!skippedHero){ skippedHero=true; continue; }
    if(SECTION_SKIP[b.type]) continue;
    const id=String(b.id||'');
    if(!/^[A-Za-z][A-Za-z0-9_-]{0,40}$/.test(id)) continue;
    const label=sectionLabel(b);
    if(!label) continue;
    out.push({id,label});
  }
  return out;
}
function pageMenuHasItems(){
  const panel=$('#barMenuPanel');
  return !!(panel&&Number(panel.dataset.count)>0);
}
function closePageMenu(){
  const panel=$('#barMenuPanel'), btn=$('#barMenuBtn');
  if(panel) panel.hidden=true;
  if(btn) btn.setAttribute('aria-expanded','false');
}
function openPageMenu(){
  const panel=$('#barMenuPanel'), btn=$('#barMenuBtn');
  if(!panel||!pageMenuHasItems()) return;
  panel.hidden=false;
  if(btn) btn.setAttribute('aria-expanded','true');
}
function togglePageMenu(ev){
  if(!siteMenuDesktop()||!pageMenuHasItems()) return false;
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const panel=$('#barMenuPanel');
  if(panel.hidden) openPageMenu(); else closePageMenu();
  return true;
}
function goToSection(id,ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  closePageMenu();
  const el=document.getElementById(id); if(!el) return;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  el.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});
  if(!STAGE_MODE){ try{ history.replaceState(null,'','#'+id); }catch(e){} }
}
function mountPageMenu(layout){
  const panel=$('#barMenuPanel'); if(!panel) return;
  panel.innerHTML='';
  const items=pageSections(layout);
  for(const it of items){
    const a=document.createElement('a');
    a.href='#'+it.id;
    a.textContent=it.label;
    a.addEventListener('click',ev=>goToSection(it.id,ev));
    panel.appendChild(a);
  }
  panel.dataset.count=String(items.length);
  document.querySelectorAll('.sb-blk-outer[data-block-id]').forEach(el=>{
    const id=el.getAttribute('data-block-id')||'';
    if(/^[A-Za-z][A-Za-z0-9_-]{0,40}$/.test(id)) el.id=id;
  });
  if(!siteMenuDesktop()) closePageMenu();
  syncBarMenuBtn();
  syncBarStick();
  scrollToHash();
}
function scrollToHash(){
  if(STAGE_MODE||scrollToHash.done) return;
  const id=(location.hash||'').slice(1);
  if(!/^[A-Za-z][A-Za-z0-9_-]{0,40}$/.test(id)) return;
  const el=document.getElementById(id); if(!el) return;
  scrollToHash.done=true;
  el.scrollIntoView({block:'start'});
}
function syncBarStick(){
  const bar=document.querySelector('header.site-bar');
  if(bar) document.documentElement.style.setProperty('--site-bar-h', bar.offsetHeight+'px');
}
function syncBarMenuBtn(){
  const btn=$('#barMenuBtn'); if(!btn) return;
  const url=siteBarMenuUrl();
  const sections=siteMenuDesktop()&&pageMenuHasItems();
  btn.hidden=!(url||sections);
  if(url) btn.href=url;
}
function onBarMenuClick(ev){
  if(togglePageMenu(ev)) return;
  const url=siteBarMenuUrl();
  if(url) openSiteBarMenu(url,ev);
  else if(ev){ ev.preventDefault(); }
}
function bindSiteBarMenu(){
  const btn=$('#barMenuBtn'); if(!btn) return;
  syncBarMenuBtn();
  syncBarStick();
  if(btn.dataset.wired==='1') return;
  btn.dataset.wired='1';
  btn.addEventListener('click',onBarMenuClick);
  document.addEventListener('click',ev=>{ if(!ev.target.closest('#barMenu')) closePageMenu(); });
  document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') closePageMenu(); });
  window.addEventListener('resize',()=>{ syncBarStick(); if(!siteMenuDesktop()) closePageMenu(); syncBarMenuBtn(); });
}

async function placeShopPins(layout){
  const needs=layout.some(b=>b&&b.type==='store_info'&&(b.stores||[]).some(s=>!hasPin(s)&&(s.name_en||s.name_cn)));
  if(!needs) return layout;
  if(!shopPins){
    try{
      const rows=await api('/api/retail/pickup-stores');
      shopPins=Array.isArray(rows)?rows:(rows&&Array.isArray(rows.stores)?rows.stores:[]);
    }
    catch(e){ return layout; }
  }
  return layout.map(b=>{
    if(!b||b.type!=='store_info'||!Array.isArray(b.stores)) return b;
    const stores=b.stores.map(s=>{
      if(hasPin(s)) return s;
      const hit=shopPins.find(st=>shopMatches(s,st)&&hasPin(st));
      return hit?Object.assign({},s,{lat:hit.lat,lng:hit.lng}):s;
    });
    return Object.assign({},b,{stores});
  });
}

// Legacy note: rule 46 address-on-map replaced by rule 50 visit card. A tap opens the phone's map app, the same
// way a tap on the map does. The row of named buttons is hidden on a phone.

// §503 rule 50. One card: map beside the words on a computer, stacked on a phone.
function mountStoreVisit(root){
  const mobile=matchMedia('(max-width:767px)').matches;
  root.querySelectorAll('.sb-store-blk').forEach(blk=>{
    const map=blk.querySelector('.sb-st-map');
    const cards=blk.querySelector('.sb-st-cards');
    if(!map||!cards||blk.querySelector('.sb-st-visit')) return;
    const visit=document.createElement('div');
    visit.className='sb-st-visit';
    map.parentNode.insertBefore(visit,map);
    visit.appendChild(map);
    visit.appendChild(cards);
    const card=cards.querySelector('.sb-st-card');
    if(!card) return;
    let pins=[]; try{ pins=JSON.parse(map.getAttribute('data-pins')||'[]'); }catch(e){}
    const p=pins.find(hasPin);
    const row=[...card.querySelectorAll('.sb-st-row')].find(r=>r.querySelector('.sb-st-val')&&!r.getAttribute('href'));
    const val=row&&row.querySelector('.sb-st-val');
    const text=val?val.textContent.trim():'';
    const title=card.querySelector('.sb-st-title');
    if(text&&p){
      if(mobile){
        visit.classList.add('sb-st-visit--hero');
        const hero=document.createElement('div');
        hero.className='sb-st-map-hero';
        visit.insertBefore(hero,map);
        hero.appendChild(map);
        const scrim=document.createElement('div');
        scrim.className='sb-st-map-scrim';
        scrim.setAttribute('aria-hidden','true');
        hero.appendChild(scrim);
        const cap=document.createElement('div');
        cap.className='sb-st-map-cap';
        if(title){
          const capTitle=document.createElement('strong');
          capTitle.className='sb-st-map-cap-title';
          capTitle.textContent=title.textContent.trim();
          cap.appendChild(capTitle);
          title.classList.add('sb-st-title--in-cap');
          title.setAttribute('aria-hidden','true');
        }
        const hint=document.createElement('span');
        hint.className='sb-st-map-cap-hint';
        hint.textContent=SITE_VISIT_MAP_HINT;
        cap.appendChild(hint);
        const capAddr=document.createElement('span');
        capAddr.className='sb-st-map-cap-addr';
        capAddr.textContent=text;
        cap.appendChild(capAddr);
        hero.appendChild(cap);
        if(row) row.remove();
      }else{
        const addr=document.createElement('a');
        addr.className='sb-st-visit-addr';
        addr.href='#';
        addr.textContent=text;
        addr.addEventListener('click',ev=>{ ev.preventDefault(); openInMapApp(p); });
        if(title) title.after(addr); else card.prepend(addr);
        if(row) row.remove();
      }
      if(!card.querySelector('.sb-st-get-dir')){
        const go=document.createElement('a');
        go.className='sb-st-get-dir';
        go.href='#';
        go.textContent='Get directions';
        go.addEventListener('click',ev=>{ ev.preventDefault(); openInMapApp(p); });
        const dir=card.querySelector('.sb-st-dir');
        if(dir) dir.before(go); else card.appendChild(go);
      }
    }
  });
}
function mountMapAddress(root){
  root.querySelectorAll('.sb-st-map').forEach(box=>{
    if(box.parentElement&&box.parentElement.classList.contains('sb-st-map-wrap')) return;
    let pins=[]; try{ pins=JSON.parse(box.getAttribute('data-pins')||'[]'); }catch(e){}
    const p=pins.find(hasPin); if(!p) return;
    const card=box.parentElement&&box.parentElement.querySelector('.sb-st-card');
    const val=card&&card.querySelector('.sb-st-val');
    const text=val?val.textContent.trim():'';
    if(!text) return;
    const wrap=document.createElement('div');
    wrap.className='sb-st-map-wrap';
    box.parentNode.insertBefore(wrap, box);
    wrap.appendChild(box);
    const a=document.createElement('a');
    a.className='sb-st-map-addr';
    a.href='https://uri.amap.com/marker?position='+p.lng+','+p.lat+'&name='+encodeURIComponent(p.name||'')+'&coordinate=gaode&callnative=1';
    a.textContent=text;
    a.addEventListener('click',ev=>{ ev.preventDefault(); openInMapApp(p); });
    wrap.appendChild(a);
    const row=val.closest('.sb-st-row'); if(row) row.remove();
  });
}

async function render(){
  const view=$('#view');
  const published=state.config&&state.config.website&&state.config.website.layout;
  let layout=(window.ShopBlocks&&Array.isArray(published))?withCast(ShopBlocks.forSurface(published)):[];
  if(layout.length) layout=await placeShopPins(layout);
  if(!layout.length){
    // On the stage, the editor's own live pair (public/cms.html) says what to
    // do; a visitor sees the brand's header and footer around an empty body.
    view.innerHTML=STAGE_MODE?'<p class="empty">'+(state.lang==='cn'?'添加模块':'Add a block')+'</p>':'';
    mountPageMenu([]);
    return;
  }
  if(!state.products) state.products=await loadProducts(layout);
  ShopBlocks.stopTimers();
  ShopBlocks.setContext({ lang:state.lang, products:state.products, categories:[], flashSales:[], config:state.config });
  view.innerHTML='<div class="shop-blocks">'+ShopBlocks.render(layout)+'</div>';
  ShopBlocks.startTimers(view);
  mountPageMenu(layout);
  stageHighlight(true);
  renderChatButton(layout);
  mountStoreVisit(view);
  drawStoreMaps(view);
}

// The Stores block's live map (§503 r.37–39): Amap, with the public,
// referer-restricted JS key the web shop's address picker uses. With no key or
// a failed SDK the box stays collapsed and the block reads as before. On a
// phone the map takes no drags (the page scrolls past it) and a tap opens the
// phone's map app; on a computer it can be dragged and zoomed.
// Turning drag off is not enough. Amap still sets touch-action:none on the
// map node and cancels touchmove, so a finger that starts on the map cannot
// scroll the page. shieldStoreMap lays a clear layer next to that node.
let mapsCfg; let amapP=null;
function loadAmap(cfg){
  if(amapP) return amapP;
  amapP=new Promise((resolve,reject)=>{
    window.__siteMapReady=()=>resolve();
    if(cfg.security) window._AMapSecurityConfig={securityJsCode:cfg.security};
    const s=document.createElement('script');
    s.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(cfg.key)+'&callback=__siteMapReady';
    s.async=true; s.onerror=()=>reject(new Error('amap_load_failed'));
    document.head.appendChild(s);
    setTimeout(()=>reject(new Error('amap_timeout')),15000);
  });
  return amapP;
}
// §503 rule 39. The layer is a sibling of the map node. A finger scrolls the
// page; a tap that did not move opens the phone's map app.
function shieldStoreMap(box,pin){
  if(!box.parentNode||(box.parentElement&&box.parentElement.classList.contains('sb-st-map-frame'))) return;
  const frame=document.createElement('div');
  frame.className='sb-st-map-frame';
  box.parentNode.insertBefore(frame,box);
  frame.appendChild(box);
  const hit=document.createElement('div');
  hit.className='sb-st-map-hit';
  hit.setAttribute('aria-hidden','true');
  let sx=0,sy=0,moved=false;
  hit.addEventListener('touchstart',ev=>{
    const t=ev.changedTouches&&ev.changedTouches[0];
    if(!t) return;
    sx=t.clientX; sy=t.clientY; moved=false;
  },{passive:true});
  hit.addEventListener('touchmove',ev=>{
    const t=ev.changedTouches&&ev.changedTouches[0];
    if(!t) return;
    if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10) moved=true;
  },{passive:true});
  hit.addEventListener('click',()=>{ if(moved){ moved=false; return; } openInMapApp(pin); });
  frame.appendChild(hit);
}
function openInMapApp(p){
  const ua=navigator.userAgent||'';
  const nm=encodeURIComponent(p.name||'');
  if(/iPhone|iPad|iPod/i.test(ua)) location.href='https://maps.apple.com/?ll='+p.lat+','+p.lng+'&q='+nm;
  else if(/Android/i.test(ua)) location.href='geo:'+p.lat+','+p.lng+'?q='+p.lat+','+p.lng+'('+nm+')';
  else window.open('https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng,'_blank','noopener');
}
async function drawStoreMaps(root){
  const boxes=[...root.querySelectorAll('.sb-st-map:not([data-drawn])')];
  if(!boxes.length) return;
  boxes.forEach(b=>b.setAttribute('data-drawn','1'));
  if(mapsCfg===undefined){ try{ mapsCfg=await api('/api/retail/maps-config'); }catch(e){ mapsCfg=null; } }
  if(!mapsCfg||mapsCfg.provider!=='amap') return;
  try{ await loadAmap(mapsCfg); }catch(e){ return; }
  const touch=matchMedia('(pointer: coarse)').matches;
  for(const box of boxes){
    let pins=[]; try{ pins=JSON.parse(box.getAttribute('data-pins')||'[]'); }catch(e){}
    pins=pins.filter(p=>p&&isFinite(p.lat)&&isFinite(p.lng));
    if(!pins.length||!box.isConnected) continue;
    box.classList.add('is-live');
    try{
      if(touch&&!STAGE_MODE) shieldStoreMap(box,pins[0]);
      const map=new AMap.Map(box,{zoom:16,center:[pins[0].lng,pins[0].lat],lang:'en',resizeEnable:true,
        dragEnable:!touch,zoomEnable:!touch,scrollWheel:false,doubleClickZoom:!touch,touchZoom:!touch});
      const markers=pins.map(p=>new AMap.Marker({position:[p.lng,p.lat],title:p.name||''}));
      map.add(markers);
      if(pins.length>1) map.setFitView(markers);
    }catch(e){ box.classList.remove('is-live'); }
  }
}

// The floating WhatsApp button (§503 rule 20): from the first contact block
// that has a number and its chat switch on. Never on the editor's stage.
function renderChatButton(layout){
  let fab=document.getElementById('waFab');
  const b=(layout||[]).find(x=>x&&x.type==='contact_links'&&x.chat_button!==false);
  const href=(!STAGE_MODE&&b&&ShopBlocks.contactWhatsapp)?ShopBlocks.contactWhatsapp(b):'';
  if(!href){ if(fab) fab.remove(); return; }
  if(!fab){
    fab=document.createElement('a'); fab.id='waFab'; fab.className='wa-fab';
    fab.target='_blank'; fab.rel='noopener'; fab.setAttribute('aria-label','WhatsApp');
    fab.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.2-4.2A8.5 8.5 0 1 1 20.5 12z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/></svg>';
    document.body.appendChild(fab);
  }
  fab.href=href;
}

(async function boot(){
  const qs=new URLSearchParams(location.search);
  const DRAFT_MODE=qs.get('draft')==='1';
  STAGE_MODE=DRAFT_MODE&&qs.get('stage')==='1';
  if(STAGE_MODE) document.documentElement.classList.add('cms-stage');
  // English only for visitors (§503 rule 32): the site is for visitors from
  // abroad, so it has no language switch. The editor's stage still follows
  // the editor's EN/中 (cms:draft below), for whoever writes the Chinese.
  state.lang='en';
  if(DRAFT_MODE){ try{ state.config=await api('/api/retail-admin/storefront/preview-config')||{}; }catch(e){} }
  if(!state.config||!Object.keys(state.config).length){ try{ state.config=await api('/api/retail/config')||{}; }catch(e){ state.config={}; } }
  applyTheme(state.config);
  state.brand=brandName(state.config);
  renderChrome();

  if(window.ShopBlocks) ShopBlocks.onRerender(()=>render());
  // A block's button: a full https:// link opens; anything that leads into
  // the shop (product, category, basket, account) has nowhere to go here.
  wireSiteMenuPhone();
  document.addEventListener('click',ev=>{
    if(trySiteMenuCtaClick(ev)) return;
    if(STAGE_MODE) return;
    const el=ev.target.closest('[data-cta-target]'); if(!el) return;
    ev.preventDefault();
    const t=String(el.getAttribute('data-cta-target')||'');
    if(/^https:\/\//i.test(t)) window.open(t,'_blank','noopener');
  });

  if(DRAFT_MODE){
    window.addEventListener('message',async ev=>{
      if(ev.origin!==location.origin||!ev.data) return;
      if(ev.data.type==='cms:draft'&&STAGE_MODE){
        const layout=Array.isArray(ev.data.layout)?ev.data.layout:[];
        const key=JSON.stringify(layout);
        const langChanged=!!(ev.data.lang&&ev.data.lang!==state.lang);
        stageSel=ev.data.selectedId||null;
        if(key===stageKey&&!langChanged){ stageHighlight(true); return; }
        stageKey=key;
        state.config.website=state.config.website||{};
        state.config.website.layout=layout;
        if(langChanged){ state.lang=ev.data.lang; renderChrome(); }
        const idKey=layoutProductIds(layout).sort().join(',');
        if(idKey!==stageIdKey){ stageIdKey=idKey; state.products=null; }
        render();
        return;
      }
      if(ev.data.type!=='cms:reload') return;
      try{ state.config=await api('/api/retail-admin/storefront/preview-config')||state.config; }catch(e){}
      state.products=null; render();
    });
  }
  if(STAGE_MODE){
    // Esc closes the editor's settings panel; once a block is clicked here the
    // keys come to this frame, not the editor, so it is passed up.
    document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ try{ parent.postMessage({type:'cms:deselect'},location.origin); }catch(e){} } });
    // Clicks: a block selects itself in the editor; everything else is inert.
    document.addEventListener('click',ev=>{
      if(trySiteMenuCtaClick(ev)) return;
      if(ev.target.closest('#barMenu')){
        if(ev.target.closest('#barMenuBtn')) onBarMenuClick(ev);
        return;
      }
      const blk=ev.target.closest('.sb-blk-outer');
      if(blk){
        ev.preventDefault(); ev.stopPropagation();
        const id=blk.getAttribute('data-block-id');
        if(id){ stageSel=id; stageHighlight(false); try{ parent.postMessage({type:'cms:select',id},location.origin); }catch(e){} }
        return;
      }
      if(ev.target.closest('a,button,form')){ ev.preventDefault(); ev.stopPropagation(); }
    },true);
  }
  await render();
  if(STAGE_MODE){ try{ parent.postMessage({type:'cms:stage-ready'},location.origin); }catch(e){} }
})();
</script>
