/* ==========================================================================
   Categories — the shop's shelves (desktop: catLoad in 01-core.js)
   --------------------------------------------------------------------------
   The phone read /categories: a FLAT list out of the legacy `categories` table,
   counted over store_products.category. That is not the scheme the shop runs
   on. The storefront renders a two-level TREE held in storefront_config, and
   products are tagged with top_category + subcategory from it. So this screen
   showed a different set of shelves, with different counts, from the ones a
   shopper actually sees — and six invented ones when the flat list was empty.

   It reads /category-tree + /category-counts now, the same pair the desktop
   editor reads, and it carries the one fact on that screen that costs money: a
   shelf with nothing PUBLISHED on it is invisible in the shop. Renaming,
   reordering, adding and deleting stay on the desktop — that is a drag-to-sort
   tree with autosave, and it says so rather than offering a dead row.
   ========================================================================== */
function loadCategories(){
  if(state.catsTried) return;
  state.catsTried=true;
  Promise.all([api('/category-tree'),apiRaw('/category-counts').catch(()=>({counts:{}}))])
    .then(([tree,cn])=>{
      state.cats=Array.isArray(tree)?tree:[];
      state.catCounts=(cn&&cn.counts)||{};
      state.catsErr=null; render();
    }).catch(e=>{
      if(String(e.message)==='auth') return;
      state.catsErr=E('Could not load the categories.','加载分类失败。'); render();
    });
}
const catCount=n=>(n&&n.id&&state.catCounts&&state.catCounts[n.id])||null;
function catName(n){ return LANG==='en' ? (n.name||n.name_cn||'—') : (n.name_cn||n.name||'—'); }
/* A node with products but none published is a shelf the shop is hiding. A
   node with no products at all is empty, which is not the same thing and does
   not get the amber. */
function catMark(n){
  const c=catCount(n);
  if(!c||!c.n) return {text:T('empty','暂无商品'),warn:false};
  if(!c.published) return {text:T('hidden · nothing published','已隐藏 · 无上架商品'),warn:true};
  if(c.published<c.n) return {text:c.published+' '+T('of','/')+' '+c.n+' '+T('published','已上架'),warn:false};
  return {text:c.n+' '+T(c.n===1?'product':'products','件商品'),warn:false};
}
function catRow(n,onclick,subs){
  const m=catMark(n);
  const el=onclick?'button':'div';
  return `<${el} ${onclick?`class="row" onclick="${onclick}"`:'style="display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%"'}>
    <span style="width:32px;height:32px;border-radius:8px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex:none">${ic(catIcon(n.name))}</span>
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;text-align:left">
      <span style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(catName(n))}</span>
      <span style="font-size:12px;margin-top:2px;color:${m.warn?'var(--amber-ink)':'var(--text-secondary)'}">${m.text}${subs!=null&&subs?' · '+subs+' '+T(subs===1?'subcategory':'subcategories','个子分类'):''}</span></span>
    ${onclick?`<span style="color:var(--text-secondary);display:flex">${ic('chevron-right')}</span>`:''}</${el}>`;
}
function statusCategories(){
  const tree=state.cats; if(!tree||!tree.length) return '';
  // Drilled into one shelf, the page's subject is that shelf — so the band
  // counts what is on it rather than repeating the whole tree's totals.
  const top=state.catTop!=null?tree.find(t=>t.id===state.catTop):null;
  if(top){ const c=catCount(top), n=(top.subs||[]).length;
    return [c&&c.n!=null?c.n+' '+T(c.n===1?'product':'products','件商品'):'',
      n?n+' '+T(n===1?'subcategory':'subcategories','个子分类'):''].filter(Boolean).join(' · '); }
  let nSubs=0; for(const t of tree) nSubs+=(t.subs||[]).length;
  return tree.length+' '+T('top categories','主分类')+' · '+nSubs+' '+T('subcategories','子分类');
}
function screenCategories(){
  loadCategories();
  if(state.catsErr) return `<div style="padding:14px 16px 24px">
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${state.catsErr}</span></div></div>`;
  if(!state.cats) return `<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const tree=state.cats;
  // One top open at a time — the shop's own left rail, drilled into.
  const top=state.catTop!=null?tree.find(t=>t.id===state.catTop):null;
  if(top){
    const subs=top.subs||[];
    return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px">
      <button class="row" onclick="APP.cmd('catTop','')" style="background:none;border:none;padding:0;display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-family:inherit;font-size:13.5px;cursor:pointer">
        <span style="display:flex;transform:rotate(180deg)">${ic('chevron-right',16)}</span>${T('All categories','全部分类')}</button>
      <div class="list">${catRow(top,null,subs.length)}</div>
      ${subs.length?`<div class="list">${subs.map((sb,i)=>`${i?'<div class="sep" style="margin-left:60px"></div>':''}${catRow(sb,null)}`).join('')}</div>`
        :`<div style="padding:24px 16px;text-align:center;font-size:14px;color:var(--text-secondary)">${T('No subcategories on this shelf.','该分类下没有子分类。')}</div>`}
      ${noteBar(T('Rename, reorder, add and remove on desktop — every product on a shelf follows a rename.','重命名、排序、新增与删除请在电脑端进行 — 重命名后商品会自动迁移。'))}</div>`;
  }
  if(!tree.length) return nothingYet(T('No categories yet','暂无分类'),
    T('Shelves are arranged on desktop. Once there are some, they show here with what is on them.','分类在电脑端设置。设置后会连同商品数量显示在这里。'));
  // The status line the desktop leads with: how many shelves, and the one that
  // costs money — the ones the shop is hiding.
  let nSubs=0; const hidden=[];
  for(const t of tree){ nSubs+=(t.subs||[]).length;
    const tc=catCount(t); if(tc&&tc.n&&!tc.published) hidden.push(catName(t));
    for(const sb of (t.subs||[])){ const sc=catCount(sb); if(sc&&sc.n&&!sc.published) hidden.push(catName(sb)); } }
  const shelf = !hidden.length
    ? `<span style="color:var(--text-secondary)">${T('every shelf is visible in the shop','所有分类都显示在店面')}</span>`
    : hidden.length===1
      ? `<span style="color:var(--amber-ink)">${T('“'+hidden[0]+'” is hidden — nothing published on it','“'+hidden[0]+'” 已隐藏 — 无上架商品')}</span>`
      : `<span style="color:var(--amber-ink)">${T(hidden.length+' shelves hidden — nothing published on them',hidden.length+' 个分类已隐藏 — 无上架商品')}</span>`;
  return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="font-size:13px;line-height:1.6">${shelf}</div>
    <div class="list">${tree.map((t,i)=>`${i?'<div class="sep" style="margin-left:60px"></div>':''}${catRow(t,`APP.cmd('catTop','${escAttr(t.id)}')`,(t.subs||[]).length)}`).join('')}</div>
    ${noteBar(T('Rename, reorder, add and remove on desktop — every product on a shelf follows a rename.','重命名、排序、新增与删除请在电脑端进行 — 重命名后商品会自动迁移。'))}</div>`;
}

/* ==========================================================================
   Stock activity — the ledger of every movement (desktop: 13-activity.js)
   --------------------------------------------------------------------------
   This screen was five invented rows in DB.activity ("Organic carrots · sold ·
   −4"), overwritten by a live fetch only `if (rows.length)` — so a quiet day,
   which is the day this screen most often gets opened on, showed five stock
   movements that never happened. It also threw away everything a ledger is
   for: the time, the store, the balance after the move, and who made it.

   The date window is the same one the endpoint defaults to — today — with the
   desktop's two other quick ranges. CSV export stays on the desktop: it is a
   download, and a phone has nowhere to put it.
   ========================================================================== */
const ACT_SRC={miniapp:['Mini-app','小程序'],gzgrocery:['Gzgrocery','Gzgrocery'],
  meituan_tianhe:['Meituan Tianhe','美团天河'],meituan_yuexiu:['Meituan Yuexiu','美团越秀'],
  meituan:['Meituan','美团'],guanyi:['Guanyi','管易'],manual:['Manual','手动']};
const actSrcName=k=>ACT_SRC[k]?T(...ACT_SRC[k]):(k||'—');
/* The desktop's three quick ranges, ending on today, on the STORE's clock —
   the same boundary the server counts its days on. */
function actWindow(){
  const to=shopToday();
  const back=d=>new Date(Date.parse(to+'T00:00:00Z')-d*86400000).toISOString().slice(0,10);
  const from = state.actRange==='week'?back(6) : state.actRange==='month'?back(29) : to;
  return {from,to};
}
function loadActivity(more){
  const {from,to}=actWindow();
  const offset = more ? ((state.act&&state.act.rows)||[]).length : 0;
  if(!more){ if(state.actTried) return; state.actTried=true; }
  const q=new URLSearchParams({from,to,limit:'60',offset:String(offset)});
  if(state.actSource) q.set('source',state.actSource);
  apiRaw('/activity?'+q).then(j=>{
    const rows=(j&&j.rows)||[];
    state.act = more && state.act
      ? Object.assign({},j,{rows:state.act.rows.concat(rows)})
      : Object.assign({},j,{rows});
    state.actErr=null; state.actMore=false; render();
  }).catch(e=>{
    if(String(e.message)==='auth') return;
    state.actMore=false;
    state.actErr=E('Could not load stock activity.','无法加载库存流水。'); render();
  });
}
/* Same-day windows show the clock alone; a multi-day range keeps month-day,
   exactly as the desktop's actFmtClock does. */
function actClock(ts){
  const s=String(ts||'');
  return state.actRange==='today' ? s.slice(11,16) : s.slice(5,16);
}
function actDelta(n){
  const v=Number(n||0);
  return v>0 ? `<span class="num" style="color:var(--sage-ink);font-weight:500">+${v}</span>`
             : `<span class="num" style="font-weight:500">−${Math.abs(v)}</span>`;
}
function actRow(r){
  // A sale is normal, so its delta stays ink. Stock-in is sage. A zero balance
  // is the only amber on this ledger — a channel is a filter, not a light.
  const ctx = r.source==='manual' ? [r.actor_label,r.note].filter(Boolean).join(' · ') : (r.note||'');
  const bal = Number(r.balance_after)===0
    ? `<span class="num" style="color:var(--amber-ink);font-weight:500">0</span>`
    : `<span class="num" style="color:var(--text-secondary)">${r.balance_after!=null?r.balance_after:'—'}</span>`;
  return `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px">
    <span style="display:flex;flex-direction:column;min-width:0">
      <span style="font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(r.product||r.sku||'—')}</span>
      <span class="num" style="font-size:12px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${actClock(r.ts_local)} · ${escAttr(actSrcName(r.source))}${r.store?' · '+escAttr(r.store):''}</span>
      ${ctx?`<span style="font-size:12px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(ctx)}</span>`:''}
    </span>
    <span style="display:flex;align-items:baseline;gap:10px;flex:none">
      <span style="font-size:15px">${actDelta(r.delta)}</span>
      <span style="font-size:12.5px;min-width:26px;text-align:right">${bal}</span></span></div>`;
}
function actDigestCard(title,rows,empty){
  return `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:8px">
    <div class="eyebrow">${title}</div>
    ${rows.length?rows.join(''):`<div style="font-size:13.5px;color:var(--text-secondary)">${empty}</div>`}</div>`;
}
function screenActivity(){
  loadActivity();
  const rangeBtn=(k,label)=>`<button onclick="APP.cmd('actRange','${k}')" style="flex:1;padding:8px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;
    background:${state.actRange===k?'var(--surface-card)':'transparent'};color:${state.actRange===k?'var(--text-primary)':'var(--text-secondary)'};box-shadow:${state.actRange===k?'0 1px 3px rgba(17,26,43,.08)':'none'}">${label}</button>`;
  const ranges=`<div style="display:flex;gap:3px;background:var(--surface-raised);border-radius:11px;padding:3px">
    ${rangeBtn('today',T('Today','今天'))}${rangeBtn('week',T('7 days','7 天'))}${rangeBtn('month',T('30 days','30 天'))}</div>`;
  if(state.actErr) return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px">${ranges}
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${state.actErr}</span></div></div>`;
  if(!state.act) return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px">${ranges}
    <div style="padding:44px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div></div>`;
  const j=state.act, rows=j.rows||[], summary=j.summary||[], dg=j.digest||{};
  // Channel counts come from the server's UNFILTERED summary, so they stay put
  // as you switch channels — same as the desktop's tab counts.
  const grand=summary.reduce((a,x)=>a+(x.events||0),0);
  const known=['miniapp','gzgrocery','meituan_tianhe','meituan_yuexiu','manual'];
  const extras=summary.map(x=>x.source).filter(x=>x&&known.indexOf(x)<0);
  const chips=[{key:'',en:'All channels',zh:'全部渠道',count:grand}].concat(
    known.concat(extras).map(k=>{ const sx=summary.find(x=>x.source===k);
      return {key:k,en:(ACT_SRC[k]||[k])[0],zh:(ACT_SRC[k]||[k,k])[1],count:(sx&&sx.events)||0}; }));
  // The caption says what this view holds, because the numbers below are
  // scoped to it and nothing else on the screen says so.
  const act=state.actSource;
  const sx=summary.find(x=>x.source===act);
  let out=0,inn=0;
  if(act){ out=(sx&&sx.units_out)||0; inn=(sx&&sx.units_in)||0; }
  else summary.forEach(x=>{ out+=x.units_out||0; inn+=x.units_in||0; });
  const events=act?((sx&&sx.events)||0):grand;
  const zeroed=(dg.zeroed||[]).map(z=>`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
    <span style="font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(z.product||z.sku||'—')}</span>
    <span class="num" style="font-size:12.5px;color:var(--text-secondary);flex:none">${actClock(z.ts_local)}</span></div>`);
  const big=(dg.big||[]).map(b=>{ const who=b.source==='manual'?(b.actor_label||actSrcName('manual')):actSrcName(b.source);
    return `<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span style="font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(b.product||b.sku||'—')} <span style="color:var(--text-secondary);font-size:12.5px">· ${escAttr(who)}</span></span>
      <span style="flex:none;font-size:14px">${actDelta(b.delta)}</span></div>`; });
  return `<div style="padding:14px 0 24px;display:flex;flex-direction:column;gap:12px">
    <div style="padding:0 16px">${ranges}</div>
    ${chipRow(chips,act,'actSource')}
    <div style="padding:0 16px;font-size:13px;color:var(--text-secondary)">
      <b style="color:var(--text-primary);font-weight:500">${act?escAttr(actSrcName(act)):T('All channels','全部渠道')}</b> ·
      <span class="num">${events}</span> ${T('events','条')} · <span class="num">${out}</span> ${T('out','出')} · <span class="num">${inn}</span> ${T('in','入')}</div>
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
      ${actDigestCard(T('Hit zero','已售罄'),zeroed,T('Nothing hit zero.','没有商品售罄。'))}
      ${actDigestCard(T('Big moves','大变动'),big,T('No unusual moves.','没有异常变动。'))}
    </div>
    <div style="padding:0 16px">${rows.length
      ? `<div class="list">${rows.map((r,i)=>`${i?'<div class="sep" style="margin-left:14px"></div>':''}${actRow(r)}`).join('')}</div>`
      : `<div style="padding:34px 16px;text-align:center;font-size:14px;color:var(--text-secondary)">${T('Nothing moved in this range.','此时间段内没有变动。')}</div>`}</div>
    ${rows.length<Number(j.total||0)?`<div style="padding:0 16px"><button class="btn2" style="width:100%" ${state.actMore?'disabled':''} onclick="APP.cmd('actMore')">${state.actMore?T('Loading…','加载中…'):T('Show more','加载更多')} <span class="num" style="color:var(--text-secondary)">${rows.length}/${j.total}</span></button></div>`:''}
  </div>`;
}

/* ==========================================================================
   Waste — a stock movement with a reason (desktop: retail-admin/20-waste.js)
   --------------------------------------------------------------------------
   OPTION A of docs/tacet-waste-mobile-options.md, chosen 2026-09-02: Waste's
   own row in More, its own Worklist, and the record flow as a sheet.

   WHY THIS SCREEN EXISTS AT ALL. `waste` appeared zero times in this file
   while `lib/capabilities.js` handed waste:view and waste:record to the
   warehouse and store_manager presets BY DEFAULT — so the permission an owner
   granted a warehouse operator changed nothing they could see on a phone,
   because there was no screen here to gate. The loss happens on the shelf and
   was only recordable at a desk.

   THIS SCREEN HOLDS NO RULES OF ITS OWN. routes/retail-waste.js settled all of
   them and re-deciding any here is how two surfaces start disagreeing:
     • Whole units only — the stepper, not a number field (qty_whole_units).
     • Refuse, don't clamp — so on-hand is shown WHILE CHOOSING, and the
       button is dead with a reason before the API ever says 409.
     • The cost is a snapshot the server takes once. `is_uncosted` prints
       "No cost", never ¥0.00 and never a dash: zero and unknown must not look
       alike (§32 rule 10).
     • Money arrives in WHOLE CENTS. wstMoney is the only place that divides,
       for the reason the desktop file gives — a second /100 elsewhere is how
       one screen ends up a hundred times wrong and another right.
     • Reason codes are the SERVER's list, fetched from /waste/reasons. A
       second copy in the browser is exactly how the kitchen screen ended up
       with a vocabulary that existed only in a browser constant.

   THREE THINGS THE DESKTOP HAS THAT THIS DELIBERATELY DOES NOT:
     • NO VOID. It is waste:void — an owner capability that neither warehouse
       nor store_manager holds, so it would be a control almost nobody
       standing in the aisle can press. Voided rows still LIST, greyed, with
       their reversal beside them: a ledger that hides its own corrections is
       how one goes unnoticed, and that is true on a phone too.
     • NO FREE DATE RANGE. Two native date pickers to ask "this week" is four
       taps and a keyboard for a question with three usual answers. Three
       range chips instead — the same three Stock activity already offers, on
       the same Guangzhou day boundary. The range a preset cannot express
       stays on the desktop.
     • NO STATUS LINE. Nothing in a waste ledger is WAITING on an operator —
       every row is finished business (§1.7's work rule, and the desktop
       screen says the same about itself). The money figure that would be
       tempting there is the pulse line's job, one region down.
   ========================================================================== */
/* Cents in, the tenant's currency out. The ONLY division in this file. */
const wstMoney=c=>money(CUR,Number(c||0)/100);
/* WHO MAY SEE WHAT A LOSS COST — `waste:costs`, decided per person by whoever
   manages the team (Ash, 2026-09-02). It began as a role list here; it is a
   capability now, because "who may see the money" is the admin's decision and
   not a constant in a phone build. `waste:view` opens the ledger, `waste:costs`
   reads the money in it, and the warehouse and store_manager presets ship with
   the first and not the second.

   ONE PLACE DECIDES, and every figure asks it: the pulse total, the uncosted
   count that travels with it, each row's cost, the sheet's preview and the
   toast after a save. A gate applied to four of those five is not a gate — the
   fifth is where the number leaks, and the toast is the one everybody forgets.

   FAILS CLOSED, which is the opposite of mCan() one screen over, and the
   difference is deliberate. A null cap set means "we could not resolve this
   operator", and everywhere else that resolves to ALLOW, because being locked
   out of your own app by a hiccup is worse than being shown a row you cannot
   use. Money inverts it: a missing figure for one render is recoverable, a
   figure shown to somebody who may not read one is not.

   AND IT IS NOT THE ENFORCEMENT. routes/retail-waste.js does not SEND a cost
   to a caller without the capability, so this decides layout — whether a
   column exists — rather than whether a number is secret. If the two ever
   disagree the server wins, because there is nothing in the payload to draw. */
const wstShowMoney=()=>Array.isArray(state.caps)&&state.caps.indexOf('waste:costs')!==-1;
/* The same three windows Stock activity offers, ending on the STORE's today —
   the boundary the server counts its business days on, so "today" here and
   `business_date` there mean the same day. */
function wstWindow(){
  const to=shopToday();
  const back=d=>new Date(Date.parse(to+'T00:00:00Z')-d*86400000).toISOString().slice(0,10);
  const r=state.wst.range;
  return {from:r==='today'?to:r==='month'?back(29):back(6), to};
}
/* The reason list is the SERVER's (routes/retail-waste.js REASONS), fetched
   once. A failure here must not stop the ledger painting: the codes fall back
   to themselves, which is ugly and true, rather than to a second hardcoded
   vocabulary that would drift out of step the first time one is added. */
function loadWasteReasons(){
  if(state.wst.reasons) return;
  state.wst.reasons=[];
  api('/waste/reasons').then(r=>{ state.wst.reasons=Array.isArray(r)?r:[]; render(); }).catch(()=>{});
}
function wstReasonName(code){
  const r=(state.wst.reasons||[]).find(x=>x.code===code);
  return r?T(r.en,r.cn):(code||'—');
}
function loadWaste(force){
  const w=state.wst;
  if(w.tried&&!force) return;
  w.tried=true; w.loading=true; w.err=null;
  /* Three chips are three taps a second apart at most, and the fetches do not
     have to come back in the order they went out — so the LAST one asked for
     wins, not the last one to arrive. Without this, tapping Today then 30 days
     can leave 30 days lit above today's rows. */
  const seq=++w.listSeq;
  const {from,to}=wstWindow();
  const q=new URLSearchParams({from,to,include_voided:'1'});
  if(w.reason) q.set('reason',w.reason);
  if(w.store) q.set('location_id',String(w.store));
  /* apiRaw, not api: the totals ride BESIDE the rows on the envelope, and
     api() unwraps to `data` and throws the totals away. The uncosted count is
     in there, and §32 rule 10 says it travels with the total always. */
  apiRaw('/waste?'+q).then(j=>{
    if(seq!==w.listSeq) return;            // a later filter already won
    w.rows=Array.isArray(j&&j.data)?j.data:[];
    w.totals=(j&&j.totals)||null;
    w.loading=false; w.err=null; render();
  }).catch(e=>{
    if(seq!==w.listSeq||String(e.message)==='auth') return;
    w.loading=false; w.rows=null; w.totals=null;
    /* §1.12 — a section with bad data SHOWS that it failed. It must not fall
       through to the empty state, which would read as "nothing was wasted". */
    w.err=E('Could not load waste records.','无法加载损耗记录。'); render();
  });
}
function wstStoreName(row){
  const en=row.location_name_en||row.location_code||'', cn=row.location_name_cn||row.location_code||'';
  return (en||cn) ? T(en||cn, cn||en) : T('Unknown','未知');
}
/* A product deleted outright leaves a null name on the server's join. Say so
   rather than rendering a blank — a blank reads as "nothing here", and
   something was definitely here. */
function wstProductName(row){
  const en=row.product_name_en||'', cn=row.product_name_cn||'';
  if(!en&&!cn) return T('Unknown','未知');
  return T(en||cn, cn||en);
}
/* The pulse, as one line rather than tiles — four figures cannot share a
   390px row, and showing two of them would be an arbitrary subset. The
   uncosted count is here and not optional (§32 rule 10): a total presented
   alone reads as complete, and the entire point of the flag is that sometimes
   it is not. Voided is stated for the same reason — a reader can see that
   corrections exist AND that they are not in the number. */
function wstPulse(){
  const t=state.wst.totals; if(!t) return '';
  const bits=[];
  // Same disagreement guard as the rows: a stripped total is absent, not zero.
  if(wstShowMoney() && t.cost_total_cents!=null){
    bits.push(`<span class="num" style="color:var(--text-primary);font-weight:500">${wstMoney(t.cost_total_cents)}</span> ${T('written off','已核销')}`);
    // The uncosted count is a fact ABOUT the money, so it goes with it.
    if(Number(t.uncosted_entries||0)) bits.push(`<span class="num" style="color:var(--amber-ink)">${t.uncosted_entries} ${T('with no cost','暂无成本')}</span>`);
  } else {
    // Without money there is still something worth saying, and it is the one
    // number this operator put there: how many losses are in the range. An
    // empty pulse would read as a screen that failed to load its own summary.
    bits.push(`<span class="num" style="color:var(--text-primary);font-weight:500">${Number(t.entries||0)}</span> ${T(Number(t.entries)===1?'entry':'entries','条记录')}`);
  }
  // A void is a correction, not an amount — it is stated to both audiences.
  if(Number(t.voided_entries||0)) bits.push(`<span class="num">${t.voided_entries} ${T('voided','已作废')}</span>`);
  return `<div style="padding:0 16px;font-size:13px;color:var(--text-secondary)">${bits.join(' · ')}</div>`;
}
/* Three row kinds, and each says which it is. A REVERSAL is not a loss and
   must never read as one — it is in the list only because hiding a correction
   is how a correction goes unnoticed. Both it and the row it cancelled go
   grey: they are still evidence, they are no longer money. */
function wstRow(r){
  const voided=r.voided_by_waste_id!=null, reversal=r.reverses_waste_id!=null, mute=voided||reversal;
  const mark = voided ? T('Voided','已作废') : reversal ? T('Reversal','冲销') : '';
  /* No cost column at all for a money-blind role — not a blank, not a dash.
     "No cost" is withheld with the figures: it is a statement about this
     product's costing, which is the same ledger they may not read. */
  /* The second clause is the disagreement guard. If this operator's caps say
     yes and the server stripped the field anyway, wstMoney(undefined) is ¥0 —
     which does not read as "withheld", it reads as "the jar was free". Absent
     beats a zero that means something else. */
  const cost = (!wstShowMoney() || (r.cost_total_cents==null && !r.is_uncosted)) ? ''
    : r.is_uncosted
      ? `<span style="color:var(--text-secondary)">${T('No cost','暂无成本')}</span>`
      : `<span class="num"${mute?' style="color:var(--text-secondary)"':''}>${wstMoney(r.cost_total_cents)}</span>`;
  return `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px">
    <span style="display:flex;flex-direction:column;min-width:0;gap:2px">
      <span style="display:flex;align-items:center;gap:8px;min-width:0">
        <span style="font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${mute?'color:var(--text-secondary)':''}">${escAttr(wstProductName(r))}</span>
        ${mark?`<span class="pill" style="background:${PILL.muted[0]};color:${PILL.muted[1]}">${mark}</span>`:''}</span>
      <span class="num" style="font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.qty} × · ${escAttr(wstReasonName(r.reason_code))} · ${escAttr(wstStoreName(r))}</span>
      ${r.note?`<span style="font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(r.note)}</span>`:''}
    </span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none">
      ${cost?`<span style="font-size:15px;font-weight:500">${cost}</span>`:''}
      ${/* business_date is the STORE's day (the server's Guangzhou boundary,
           businessDateForLocation); fmtDateOnly says Today/Yesterday against
           the PHONE's. They agree for a phone in the shop's timezone, which is
           every phone this ships to, and a traveller sees a date rather than a
           wrong word. Same helper and same trade as the PO arrival dates. */''}
      <span class="num" style="font-size:12px;color:var(--text-secondary)">${fmtDateOnly(r.business_date)}</span></span></div>`;
}
function screenWaste(){
  loadWasteReasons(); loadWaste();
  const w=state.wst;
  const rangeBtn=(k,label)=>`<button onclick="APP.cmd('wstRange','${k}')" style="flex:1;padding:8px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;
    background:${w.range===k?'var(--surface-card)':'transparent'};color:${w.range===k?'var(--text-primary)':'var(--text-secondary)'};box-shadow:${w.range===k?'0 1px 3px rgba(17,26,43,.08)':'none'}">${label}</button>`;
  const ranges=`<div style="display:flex;gap:3px;background:var(--surface-raised);border-radius:11px;padding:3px">
    ${rangeBtn('today',T('Today','今天'))}${rangeBtn('week',T('7 days','7 天'))}${rangeBtn('month',T('30 days','30 天'))}</div>`;
  /* §1.9 data precondition — a picker that can only pick one thing is not a
     choice. One store, no store filter, and no placeholder explaining its
     absence. */
  const stores=state.stores||[];
  const storeChips = stores.length>1
    ? chipRow([{key:'',en:'All stores',zh:'全部门店'}].concat(stores.map(s=>
        ({key:String(s.id),en:s.name_en||s.name_cn||('#'+s.id),zh:s.name_cn||s.name_en||('#'+s.id)}))), String(w.store),'wstStore')
    : '';
  const reasonChips = (w.reasons&&w.reasons.length)
    ? chipRow([{key:'',en:'All reasons',zh:'全部原因'}].concat(w.reasons.map(r=>({key:r.code,en:r.en,zh:r.cn}))), w.reason,'wstReason')
    : '';
  const head=`<div style="padding:14px 0 0;display:flex;flex-direction:column;gap:12px">
    <div style="padding:0 16px">${ranges}</div>
    ${storeChips}${reasonChips}`;
  if(w.err) return head+`<div style="padding:12px 16px 24px">
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${w.err}</span></div>
    <button class="btn2" style="width:auto;padding:11px 26px;margin:12px auto 0;display:flex" onclick="APP.cmd('wstRetry')">${T('Try again','重试')}</button></div></div>`;
  if(!w.rows) return head+`<div style="padding:44px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div></div>`;
  /* §1.12 — empty and no-results are two states and two sentences. The first
     is a compliment; the second names the filter and offers to clear it.
     Conflating them is the most common failure in this product. */
  const filtering=!!(w.reason||w.store||w.range!=='week');
  if(!w.rows.length) return head+(filtering
    ? `<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 24px;text-align:center">
         <div style="font-size:18px;font-weight:500">${T('Nothing matches those filters','没有匹配的内容')}</div>
         <button class="btn2" onclick="APP.cmd('wstClear')">${T('Clear the filters','清除筛选')}</button></div></div>`
    : nothingYet(T('Nothing wasted yet','还没有登记损耗'),
        T('Long may it last. Anything written off here comes straight off the shelf count.','希望一直如此。在此登记的损耗会直接从库存中扣减。'))+'</div>');
  return head+`
    ${wstPulse()}
    <div style="padding:0 16px 24px"><div class="list">${w.rows.map((r,i)=>
      `${i?'<div class="sep" style="margin-left:14px"></div>':''}${wstRow(r)}`).join('')}</div></div>
  </div>`;
}

/* ── The record sheet ──────────────────────────────────────────────────────
   §1.13: every field visible on open, fixed height, one commit. Nothing here
   is abandonable-and-resumable and nothing grows the height by the operator's
   own actions, so it is a sheet and not a screen.

   FIELD ORDER IS THE ORDER OF THE QUESTIONS somebody holding a dropped jar
   actually asks — what, how many, why. Store leads only because the picker
   cannot run without one, and it collapses to nothing at all for a
   single-store account.

   THE PICKER CALLS /waste/products AND NEVER /products. That endpoint is gated
   on the waste capability alone — it exists because the kitchen screen's
   picker sat behind the `products` permission while its own screen sat behind
   `waste`, so the default grant handed a waste-only operator an empty list and
   no explanation (hazard H13). Calling /products here would rebuild the bug on
   a new surface. */
/* This is where the debounced fetch behind wstSearch lands — 180ms plus
   round-trip after the operator's last keystroke, so #mWstQ is almost always
   still focused when it does. Repaint through wstRepaintPicks(), not a bare
   render(): render() replaces the WHOLE app in one innerHTML, which the
   browser can only do by tearing every node down first, #mWstQ included, and
   a focused element removed from the document is blurred by spec. Recreating
   it and calling .focus() afterward does not reliably reopen a soft keyboard
   on every Android build even done synchronously — Ash still saw it drop
   typing two letters after wstSearch itself stopped re-rendering per key.
   wstRepaintPicks() patches just the results box when the operator is still
   in the field, so #mWstQ is never removed from the document at all. */
function loadWastePicks(){
  const w=state.wst;
  if(!w.storeId){ w.picks=null; return; }
  const q=new URLSearchParams({location_id:String(w.storeId)});
  if(w.q.trim()) q.set('search',w.q.trim());
  const seq=++w.pickSeq;
  api('/waste/products?'+q).then(rows=>{
    if(seq!==w.pickSeq) return;            // a later keystroke already won
    w.picks=(Array.isArray(rows)?rows:[]).slice(0,12); w.pickErr=null; wstRepaintPicks();
  }).catch(e=>{
    if(seq!==w.pickSeq||String(e.message)==='auth') return;
    w.picks=[]; w.pickErr=E('Could not search products.','无法搜索商品。'); wstRepaintPicks();
  });
}
function wstRepaintPicks(){
  const box=document.getElementById('mWstPicksBox');
  if(box && document.activeElement && document.activeElement.id==='mWstQ' && !state.wst.pick){
    box.innerHTML = wstPicksHtml();
  } else {
    render();
  }
}
/* The preview endpoint, not arithmetic done here — the same accessor and the
   same rounding the write uses, so the figure shown and the figure stored
   cannot disagree. */
function loadWastePreview(){
  const w=state.wst;
  if(!w.pick||!(w.qty>0)){ w.preview=null; return; }
  const seq=++w.previewSeq;
  api('/waste/preview?store_product_id='+w.pick.id+'&qty='+w.qty).then(d=>{
    if(seq!==w.previewSeq) return;
    w.preview=d||null; render();
  }).catch(e=>{ if(seq===w.previewSeq&&String(e.message)!=='auth'){ w.preview=null; render(); } });
}
/* ONE place decides whether the button is live, and it always says WHY it is
   not. A dead control with no explanation is the failure the desktop's recipe
   screen records against itself; this is the same guard, and it runs before
   the API's own refusal rather than instead of it. */
function wstBlocked(){
  const w=state.wst;
  if(!w.storeId) return T('Choose a store.','请选择门店。');
  if(!w.pick) return T('Choose a product.','请选择产品。');
  if(!Number.isInteger(w.qty)||w.qty<=0) return T('How many?','数量是多少？');
  /* No measure word, in either language — the desktop screen's rule. A count
     of something sold by weight rendered as “3 件” reads as three pieces,
     which is a different fact. */
  if(w.qty>Number(w.pick.on_hand)) return T('Only '+w.pick.on_hand+' on hand.','库存只有 '+w.pick.on_hand+'。');
  if(!w.code) return T('Pick a reason.','请选择原因。');
  if(w.code==='other'&&!w.note.trim()) return T('Tell us what happened.','请填写备注说明。');
  return '';
}
/* The results fragment ALONE — never the input above it. loadWastePicks()
   patches this element's innerHTML directly instead of going through
   render() while the operator is still typing, so #mWstQ itself is never
   torn down and rebuilt (see loadWastePicks). Kept in its own function so
   the full sheetWaste() render and that targeted patch build the exact same
   markup from the exact same state, rather than two copies drifting apart. */
function wstPicksHtml(){
  const w=state.wst;
  return `${w.pickErr?`<div style="font-size:13px;color:var(--brick-ink)">${w.pickErr}</div>`:''}
      ${!w.storeId?`<div style="font-size:13px;color:var(--text-secondary)">${T('Choose a store first.','请先选择门店。')}</div>`
        :w.picks===null?`<div style="font-size:13px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`
        :!w.picks.length?`<div style="font-size:13px;color:var(--text-secondary)">${T('No products match','没有匹配的商品')}</div>`
        :`<div class="list">${w.picks.map((p,i)=>`${i?'<div class="sep"></div>':''}
          <button class="row" onclick="APP.cmd('wstPick',${p.id})" style="min-height:52px">
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(T(p.name_en||p.name_cn||'', p.name_cn||p.name_en||''))}</span>
              <span class="num" style="font-size:12px;color:var(--text-secondary)">${T(p.on_hand+' on hand','库存 '+p.on_hand)}${p.sku?' · '+escAttr(p.sku):''}</span></span>
          </button>`).join('')}</div>`}`;
}
function sheetWaste(){
  const w=state.wst, stores=state.stores||[];
  const blocked=wstBlocked();
  const storeRow = stores.length>1 ? `
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="eyebrow">${T('Store','门店')}</span>
      <div class="hscroll" style="display:flex;gap:8px">${stores.map(s=>
        `<button class="chip ${String(w.storeId)===String(s.id)?'on':''}" onclick="APP.cmd('wstPickStore',${s.id})"><span>${escAttr(LANG==='en'?(s.name_en||s.name_cn):(s.name_cn||s.name_en))}</span></button>`).join('')}</div>
    </div>` : '';
  /* Chosen product: the search field is replaced by the thing it found, with
     ON-HAND under the NAME rather than under the stepper. The API refuses a
     quantity above it, and finding that out after pressing the button is the
     worse half of the same information. The × puts the search back. */
  const product = w.pick ? `
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="eyebrow">${T('Product','产品')}</span>
      <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(T(w.pick.name_en||w.pick.name_cn||'', w.pick.name_cn||w.pick.name_en||''))}</span>
          <span class="num" style="font-size:12.5px;color:var(--text-secondary)">${T(w.pick.on_hand+' on hand','库存 '+w.pick.on_hand)}${w.pick.sku?' · '+escAttr(w.pick.sku):''}</span></span>
        <button class="iconbtn" style="width:36px;height:36px;margin-right:-4px" onclick="APP.cmd('wstUnpick')">${ic('x',20,2)}</button></div>
    </div>` : `
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="eyebrow">${T('Product','产品')}</span>
      <input id="mWstQ" inputmode="search" enterkeyhint="search" value="${escAttr(w.q)}"
        placeholder="${T('Search products','搜索商品')}" style="width:100%" oninput="APP.cmd('wstSearch',this.value)">
      <div id="mWstPicksBox">${wstPicksHtml()}</div>
    </div>`;
  /* Whole units, so a stepper and never a number field: the API refuses a
     fraction (qty_whole_units_required) because the stock column is an
     integer and a waste row disagreeing with its own movement is a defect by
     design. 56px to match Add stock — same thumb, same aisle. */
  const qty = `
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="eyebrow">${T('Quantity','数量')}</span>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="stepbtn" style="width:56px;height:56px" onclick="APP.cmd('wstQty',-1)" ${w.qty<=1?'disabled':''} aria-label="${T('Less','减少')}">${ic('minus',24)}</button>
        <span class="num" style="flex:1;height:56px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:500;letter-spacing:-.01em">${w.qty}</span>
        <button class="stepbtn" style="width:56px;height:56px" onclick="APP.cmd('wstQty',1)" ${w.pick&&w.qty>=Number(w.pick.on_hand)?'disabled':''} aria-label="${T('More','增加')}">${ic('plus',24)}</button></div>
    </div>`;
  const reasons = `
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="eyebrow">${T('Reason','原因')}</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${(w.reasons||[]).map(r=>
        `<button class="chip ${w.code===r.code?'on':''}" onclick="APP.cmd('wstCode','${escAttr(r.code)}')"><span>${T(r.en,r.cn)}</span></button>`).join('')}</div>
    </div>`;
  /* Optional everywhere except on `other`, where the API requires it and says
     so — enforced here so the operator is told before they press, and again
     by the server so it cannot be bypassed. */
  const note = `
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="eyebrow">${T('Note','备注')}${w.code==='other'?'':` <span style="font-weight:400">· ${T('optional','选填')}</span>`}</span>
      <input id="mWstNote" value="${escAttr(w.note)}" placeholder="${T('What happened?','发生了什么？')}" style="width:100%" oninput="APP.cmd('wstNote',this.value)">
    </div>`;
  /* The foot says the cost BEFORE the commit, and says "no cost on file" in
     the same slot rather than a zero — so a loss that saves without one is
     heard now and not next week when a total looks wrong. */
  /* The consequence line. A money-blind operator still gets the half that is
     theirs — what the shelf will read afterwards — and never the cost. The
     shelf figure is not money and is the more useful of the two to somebody
     standing in front of it. */
  const shelfAfter = w.pick ? `${T('Stock drops to','库存降至')} <span class="num">${Number(w.pick.on_hand)-w.qty}</span>` : '';
  const costLine = blocked
    ? `<span style="color:var(--amber-ink)">${blocked}</span>`
    : !wstShowMoney()
      ? (shelfAfter || '&nbsp;')
      : w.preview
        ? (w.preview.is_uncosted
            ? T('No cost on file — it records without one','该产品暂无成本，将不计成本登记')
            : `${T('Cost','成本')} <span class="num">${wstMoney(w.preview.cost_total_cents)}</span> · ${T('stock drops to','库存降至')} <span class="num">${Number(w.pick.on_hand)-w.qty}</span>`)
        : '&nbsp;';
  /* Animate on the way IN and never again. Every tap in this sheet — a store
     chip, a stepper, a reason, a keystroke in the note — goes through
     render(), which rebuilds the app with innerHTML and so hands .sheet and
     .scrim brand-new nodes that replay their entrance. The form slid up from
     the bottom of the screen on every press. Same guard the other four sheets
     use. */
  const noAnim=state.wst.mounted?'animation:none;':'';
  return `<div class="scrim" style="z-index:45;${noAnim}" onclick="APP.scrimClose('wstClose')"></div>
   <div class="sheet" style="top:64px;z-index:46;overflow:hidden;${noAnim}">
     <div style="flex:none;padding:8px 12px 12px;border-bottom:1px solid var(--border-default)"><div class="grabber"></div>
       <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
         <button class="iconbtn" style="width:36px;height:36px;margin-left:-4px" onclick="APP.cmd('wstClose')">${ic('x',22,2)}</button>
         <span style="flex:1;font-size:17px;font-weight:500">${T('Record waste','记录损耗')}</span>
         <span style="width:36px;flex:none"></span></div></div>
     ${/* Named so render() can put its scroll position back. This form is
          taller than the sheet once a product is picked, so the reason chips
          and the note are BELOW the fold — and without this, reaching them
          and tapping one threw the sheet back to the top, which is the same
          "it jumps" the entrance animation was causing one layer up. */''}
     <div id="mWstBody" style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px">
       ${storeRow}${product}${w.pick?qty:''}${w.pick?reasons:''}${w.pick?note:''}
       ${/* §1.12 error — a failed write renders where the operator is looking
            and STAYS. Never a toast that flies away: a loss the operator
            believes was recorded and was not is worse than one they know
            failed. */''}
       ${w.formErr?`<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
         <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
         <span style="font-size:14px;color:var(--brick-ink)">${w.formErr}</span></div>`:''}
     </div>
     <div style="flex:none;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--border-default);background:var(--surface-card);display:flex;flex-direction:column;gap:10px">
       <div style="font-size:13px;color:var(--text-secondary);min-height:18px">${costLine}</div>
       <button class="cta" ${blocked||w.busy?'disabled':''} style="${blocked||w.busy?'opacity:.55':''}" onclick="APP.cmd('wstSave')">${w.busy?T('Recording…','登记中…'):T('Record waste','记录损耗')}</button></div></div>`;
}

/* ==========================================================================
   New order — one taken on the phone (audit N-02)
   --------------------------------------------------------------------------
   Taking an order over the telephone is a daily job in a shop, and the phone
   is where the shopkeeper is standing. This app had no create surface at all:
   an earlier fake one was deleted because its submit handler said "Created"
   and sent nothing, and the note left behind said authoring stays on the
   desktop. That was right about authoring — a product, a coupon, a broadcast,
   things written once and read a thousand times — and wrong about the one
   thing a shop authors while standing up with a customer on the line.

   It posts to POST /api/retail-admin/orders: the SAME endpoint the desktop
   form and the counter till use, with the same field names, and its refusals
   read back through the same sentences the desktop answers them with. There is
   no second contract here and no second set of rules to keep in step — this is
   a third caller of one endpoint, not a second product.

   WHAT IT DELIBERATELY DOES NOT CARRY:
     · Counter sales. public/till.html is a purpose-built till with a keypad
       and a wallet picker, one row away in More, and the server has three extra
       rules for a walk-in (a store, a named tender, a POS that is open). Two
       surfaces for one job is how the two drift apart.
     · Drafts. The desktop writes half-typed orders to a table. This keeps what
       was typed in memory instead — Back, another call, a look at the ledger
       and back again all return to it — and Clear is the way out. Nothing is
       written anywhere until Create.
     · A grand-total override and per-line prices. Both are desk work, and both
       are the kind of edit that wants a second pair of eyes on a big screen.

   NOTHING HERE RE-RENDERS THE APP WHILE SOMEBODY IS TYPING. render() rebuilds
   the whole page with innerHTML, which removes the focused input from the
   document, and a removed input drops the on-screen keyboard on some Android
   builds however fast it is put back — the bug the waste sheet's search field
   documents at length. So every text field writes to state and patches the one
   region that reads it, and every fetch that lands mid-typing patches too.
   ========================================================================== */
/* The four origins the server accepts from a form (MANUAL_ORDER_ORIGINS).
   'manual' is NOT offered: it is the till's own value, and the route refuses it
   for anything that is not a counter sale. */
const ONW_ORIGINS=[{k:'pickup',en:'Pick up',zh:'到店自取'},{k:'wechat_chat',en:'WeChat message',zh:'微信消息'},
  {k:'wholesale',en:'Wholesale',zh:'批发'},{k:'other',en:'Other',zh:'其他'}];
const ONW_FULS=[{k:'delivery',en:'Delivery',zh:'配送'},{k:'pickup',en:'Pickup',zh:'自提'}];
/* Server error code → the section that owns the control that produced it, so a
   refusal renders beside the field that caused it and stays there. An unmapped
   code lands on 'who', the top of the form, rather than nowhere — §1.12: an
   error the operator cannot see is worse than no error at all. The address and
   the two fees live in the fulfilment section, so their codes land there. */
const ONW_WHERE={
  recipient_name_required:'who', bad_phone:'who', bad_customer_id:'who', customer_not_found:'who',
  name_or_phone_required:'who', bad_email:'who', forbidden_capability:'who',
  no_items:'what', invalid_item:'what', product_unavailable:'what', bad_unit_price:'what',
  bad_shipping_fee:'how', bad_packing_fee:'how', bad_total:'how',
  shipping_fee_not_allowed_for_pickup:'how', shipping_fee_not_allowed_for_counter:'how',
  bad_store_id:'how', store_not_found:'how', bad_fulfillment_type:'how',
  fulfillment_type_required:'how', store_required_for_counter:'how',
  payment_method_required_for_counter:'how', pos_closed_for_store:'how',
  address_required_for_delivery:'how', address_not_allowed_for_pickup:'how',
  address_not_allowed_for_counter:'how',
  bad_channel:'from', channel_required:'from', channel_note_required:'from',
};
/* One sentence per code, the desktop's own (04-orders.js ordNewErrText) — two
   surfaces answering the same refusal with the same words. E(), not T(): this

   Chinese operator does not read an English failure. */
function onwErrText(code,msg){

    forbidden_capability:E('Your account cannot create customers. Turn off "Also save as a customer" to place the order.','您的账户无权新建顾客。取消"同时存为顾客"即可下单。'),

/* The form, empty. A FUNCTION rather than a literal because two callers need
   the same shape — the state literal at the top of this file and Clear — and a
   second copy of twenty keys is a second copy to forget to update. `stores` is
   passed in rather than read off state: this runs while the state literal is
   still being evaluated, where `state` does not exist yet. */
function onwBlank(stores){
  const st=stores||[];
  return {lines:[],cust:null,name:'',phone:'',saveCust:false,
    q:'',picks:null,pickErr:null,pickSeq:0,pickTimer:null,
    custQ:'',custPicks:null,custErr:null,custSeq:0,custTimer:null,
    /* One store, no question — §1.9, a picker that can only pick one thing is
       not a choice. The chips do not render at all in that shop, and the order
       still carries the store. */
    ful:'delivery',storeId:st.length===1?st[0].id:null,channel:'',channelNote:'',
    cityQ:'',city:'',province:'',cities:null,citiesTried:false,districts:null,district:'',street:'',
    ship:0,pack:0,feeTouched:{ship:false,pack:false},feeNote:null,feeSeq:0,tax:null,
    paid:false,pay:'cash',note:'',staffNote:'',busy:false,err:null};
}
/* The city catalogue is 300-odd rows and does not go stale, so it survives a
   Clear — everything the operator typed does not. */
function onwReset(){
  const had=state.onw;
  state.onw=onwBlank(state.stores||[]);
  state.onw.cities=had.cities; state.onw.citiesTried=had.citiesTried;
}
/* The stores arrive after boot, so the single-store default cannot be settled
   when the blank form is built. Settled on the way into the screen instead. */
function onwSyncStore(){
  const st=state.stores||[];
  if(st.length===1&&!state.onw.storeId) state.onw.storeId=st[0].id;
}
/* Guangzhou is the one city whose district changes how a parcel SHIPS rather
   than only what it costs — planShipments reads it to tell a same-city rider
   drop from an outer district that goes out by courier — so a blank district
   there is refused, exactly as the desktop refuses it. Everywhere else
   city-wide is an honest answer. */
function onwDistrictRequired(){ return String(state.onw.city||'').trim()==='广州市'; }
function onwAddress(){
  const o=state.onw;
  return {province:o.province||'',city:o.city||'',district:o.district||'',
          address:o.street.trim(),detail:'',postal_code:''};
}
function onwSubtotal(){ return state.onw.lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0); }
function onwTotal(){ const o=state.onw;
  return onwSubtotal()+(o.ful==='delivery'?(Number(o.ship)||0):0)+(Number(o.pack)||0)
    + (o.tax?(Number(o.tax.added)||0):0); }
/* Anything typed. Read by the Clear control — there is nothing to clear on an
   untouched form — and by nothing else: leaving this screen never asks, because
   leaving it KEEPS what is in it. */
function onwHasWork(){
  const o=state.onw;
  return !!(o.lines.length||o.name.trim()||o.phone.trim()||o.cust||o.street.trim()||o.city
            ||o.channel||o.note.trim()||o.staffNote.trim());
}
/* What is still missing, in the order the questions are asked. Said in the foot
   BEFORE the button is pressed — the rule the waste sheet follows — and every
   sentence is the one the server would answer with, so a local block and a
   remote refusal read identically. */
function onwBlocked(){
  const o=state.onw, stores=state.stores||[];
  if(!o.name.trim()) return T('Enter a name for the order.','请填写订单姓名。');
  if(!o.lines.length) return T('Add at least one product.','请至少添加一个商品。');
  if(o.lines.some(l=>!(Number(l.qty)>0))) return T('Every line needs a quantity of 1 or more.','每行数量需为 1 或以上。');
  if(!o.channel) return T('Say where this order came from.','请选择订单来源。');
  if(o.channel==='other'&&!o.channelNote.trim()) return T('Write where this order came from.','请填写具体来源。');
  /* A collection has to name the counter it will be collected from. The server
     does not demand it — a phone order taken before routing is decided
     legitimately has no store yet — but a pickup with no store is an order
     nobody can hand over, so this asks while the customer is still on the
     line, and only where there is a choice to make. */
  if(o.ful==='pickup'&&stores.length>1&&!o.storeId) return T('Pick a store.','请选择门店。');
  if(o.ful==='delivery'){
    if(!o.city||!o.street.trim()) return T('A delivery order needs a full address.','配送订单需要完整地址。');
    if(onwDistrictRequired()&&!o.district) return T('Pick the Guangzhou district — it decides whether this goes by rider or by courier.','请选择广州的区 — 该选择决定走同城骑手还是快递。');
  }
  return '';
}
/* The body, built in ONE place. shipping_fee is forced to zero off a delivery
   rather than sent as typed: the server refuses a shipping fee on a collection
   — nothing is being shipped — and a number left standing after a switch of
   fulfilment is a stale quote, not a negotiated rate. */
function onwBody(){
  const o=state.onw;
  const body={
    customer_id:o.cust?o.cust.id:null,
    recipient_name:o.name.trim(),
    recipient_phone:o.phone.trim(),
    items:o.lines.map(l=>({product_id:l.id,qty:Number(l.qty),unit_price:Number(l.price)})),
    shipping_fee:o.ful==='delivery'?(Number(o.ship)||0):0,
    packing_fee:Number(o.pack)||0,
    status:o.paid?'paid':'pending_payment',
    payment_method:o.paid?o.pay:'offline',
    channel:o.channel,
    channel_note:o.channel==='other'?(o.channelNote.trim()||null):null,
    fulfillment_type:o.ful,
    customer_note:o.note.trim()||null,
    staff_note:o.staffNote.trim()||null,
  };
  if(o.storeId) body.store_id=Number(o.storeId);
  /* The customer is created by the ORDER endpoint, inside the order's own
     transaction — never as a POST of its own first. A failure between the two
     used to leave a customer nobody asked for, already carrying signup
     vouchers. */
  if(!o.cust&&o.saveCust) body.save_customer=true;
  if(o.ful==='delivery') body.address=onwAddress();
  return body;
}

/* ---- the reads this screen makes --------------------------------------- */
/* The city catalogue, once. Same source as the desktop's picker
   (/china-regions), and the province is READ OFF the picked city rather than
   asked for — the two cannot drift, and nobody types a province they would
   then have to be right about. */
function loadOnwCities(){
  const o=state.onw;
  if(o.citiesTried) return;
  o.citiesTried=true;
  api('/china-regions').then(d=>{
    state.onw.cities=(d&&d.cities)||[]; onwRepaint('mOnwCityBox',onwCityPicksHtml);
  }).catch(e=>{
    if(String(e.message)==='auth') return;
    state.onw.cities=[]; onwRepaint('mOnwCityBox',onwCityPicksHtml);
  });
}
/* Districts per city. GET /api/retail/districts is public and cached an hour by
   the server; it reads a static reference file, touches no tenant data, and the
   desktop's picker calls it directly for the same reason. Absolute path — api()
   only prefixes /api/retail-admin onto paths that do not already start /api/. */
function loadOnwDistricts(){
  const city=state.onw.city;
  if(!city){ state.onw.districts=[]; return; }
  state.onw.districts=null;
  api('/api/retail/districts?city='+encodeURIComponent(city)).then(rows=>{
    if(state.onw.city!==city) return;              // the city changed under it
    state.onw.districts=Array.isArray(rows)?rows:[]; onwRepaintDistricts();
  }).catch(e=>{
    if(String(e.message)==='auth'||state.onw.city!==city) return;
    /* Offline or a 500 → city-wide, the same answer a city with no districts
       gives. Guangzhou is the one place that then blocks, and says so. */
    state.onw.districts=[]; onwRepaintDistricts();
  });
}
/* The product picker. Debounced server search rather than the whole catalogue:
   this can be the first screen opened, and 500 products is not a download to
   make somebody wait through to type two letters. */
function loadOnwProducts(){
  const o=state.onw, q=o.q.trim();
  if(!q){ o.picks=null; onwRepaint('mOnwProdBox',onwProdPicksHtml); return; }
  const seq=++o.pickSeq;
  api('/products?limit=10&q='+encodeURIComponent(q)).then(rows=>{
    if(seq!==state.onw.pickSeq) return;            // a later keystroke already won
    state.onw.picks=(Array.isArray(rows)?rows:[]).slice(0,10); state.onw.pickErr=null;
    onwRepaint('mOnwProdBox',onwProdPicksHtml);
  }).catch(e=>{
    if(seq!==state.onw.pickSeq||String(e.message)==='auth') return;
    state.onw.picks=[]; state.onw.pickErr=E('Could not search products.','无法搜索商品。');
    onwRepaint('mOnwProdBox',onwProdPicksHtml);
  });
}
function loadOnwCustomers(){
  const o=state.onw, q=o.custQ.trim();
  if(!q){ o.custPicks=null; onwRepaint('mOnwCustBox',onwCustPicksHtml); return; }
  const seq=++o.custSeq;
  apiRaw('/customers?pageSize=8&page=1&q='+encodeURIComponent(q)).then(j=>{
    if(seq!==state.onw.custSeq) return;
    state.onw.custPicks=((j&&j.data)||[]).slice(0,8); state.onw.custErr=null;
    onwRepaint('mOnwCustBox',onwCustPicksHtml);
  }).catch(e=>{
    if(seq!==state.onw.custSeq||String(e.message)==='auth') return;
    state.onw.custPicks=[]; state.onw.custErr=E('Could not search customers.','无法搜索顾客。');
    onwRepaint('mOnwCustBox',onwCustPicksHtml);
  });
}
/* What this cart, to this address, would be charged — the SAME engine the
   customer checkout prices with, so the two surfaces cannot quote different
   money for one basket. Read-only, so it is safe on every change. A failed
   quote leaves whatever is in the fields rather than zeroing them: a zero looks
   like an answer. */
function loadOnwFees(){
  const o=state.onw;
  const items=o.lines.filter(l=>Number(l.qty)>0).map(l=>({product_id:l.id,qty:Number(l.qty),unit_price:Number(l.price)}));
  if(!items.length) return;
  const body={fulfillment_type:o.ful,items};
  if(o.ful==='delivery'){
    body.address=onwAddress();
    if(!body.address.city&&!body.address.address) return;   // no destination to match a zone on
  }
  const seq=++o.feeSeq;
  apiWrite('/order-fees',body).then(j=>{
    if(seq!==state.onw.feeSeq) return;             // a newer quote owns the fields
    const d=(j&&j.data)||{};
    if(!d.error){
      if(!o.feeTouched.ship) onwSetFee('ship','mOnwShip',Number(d.shipping_fee||0));
      if(!o.feeTouched.pack) onwSetFee('pack','mOnwPack',Number(d.packing_fee||0));
    }
    /* The tax this cart attracts, as the create route will compute it (audit
       I-03) — same base, same module. Without it the foot said ¥100 while the
       server charged ¥120, and the operator found out after the customer did.
       Null on a shop that charges none, which is every shop until one sets a
       rate, and the line stays absent. */
    o.tax = d.tax ? d.tax : null;
    o.feeNote=onwFeeNote(o.ful,d);
    const n=document.getElementById('mOnwFeeNote');
    if(n) n.textContent=String(o.feeNote);
    onwRepaintFoot();
  }).catch(()=>{ /* the typed numbers stand */ });
}
/* A quote lands in the field the operator may be standing in. Never overwrite a
   focused input: they are mid-number, and having it change under the caret is
   worse than a stale quote they can see and correct. */
function onwSetFee(key,id,v){
  state.onw[key]=v;
  const el=document.getElementById(id);
  if(el&&document.activeElement!==el) el.value=String(v);
}
function onwFeeNote(ft,d){
  if(d&&d.error==='no_zone_match') return E('No delivery zone matches this address — type both fees yourself, then set the zone up under Delivery.','没有匹配这个地址的配送区 — 请手动填写两项费用,并在“配送”中配置该区域。');
  if(d&&d.error) return E('Fees could not be worked out for this order — type them yourself.','无法自动计算本单费用 — 请手动填写。');
  if(ft==='pickup') return E('Packing fills in from the store-pickup fee; there is no delivery to charge. Edit it to override.','包装费按自提包装费填入,自提无运费。可直接修改。');
  return E("Shipping and packing fill in from this order's delivery zone; edit either to override.",'运费与包装费按本单配送区自动填入,可直接修改。');
}

/* ---- the three patches, and why they are patches ----------------------- */
/* One results box, rewritten in place while the operator is still in the field
   above it — the same two branches wstRepaintPicks uses, and the same reason:
   render() would take the input they are typing into out of the document. */
function onwRepaint(id,build){
  const box=document.getElementById(id);
  const on=document.activeElement;
  if(box&&on&&box.previousElementSibling===on) box.innerHTML=build();
  else render();
}
function onwRepaintDistricts(){
  const box=document.getElementById('mOnwDistBox');
  if(box) box.innerHTML=onwDistrictsHtml(); else render();
}
/* The foot — the blocking sentence, the money, the button. Every text field
   writes to state and calls this, so typing a name or a street repaints what
   those numbers say without rebuilding the input being typed into. Nothing in
   the foot can hold focus, so patching it can never steal any. */
function onwRepaintFoot(){
  const f=document.getElementById('mOnwFoot');
  if(f) f.innerHTML=onwFootHtml(); else render();
}

/* ---- the pieces ------------------------------------------------------- */
function onwChips(items,current,cmd){
  return `<div style="display:flex;flex-wrap:wrap;gap:8px">${items.map(c=>
    `<button class="chip ${String(c.k)===String(current)?'on':''}" onclick="APP.cmd('${cmd}','${c.k}')"><span>${T(c.en,c.zh)}</span></button>`).join('')}</div>`;
}
function onwField(label,inner,hint){
  return `<div style="display:flex;flex-direction:column;gap:6px">
    ${label?`<span class="eyebrow">${label}</span>`:''}${inner}
    ${hint?`<span style="font-size:12.5px;color:var(--text-secondary);line-height:1.5">${hint}</span>`:''}</div>`;
}
function onwSection(title,inner,where){
  const e=state.onw.err;
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="eyebrow" style="padding:2px 4px 0">${title}</div>
    ${e&&e.where===where?`<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${e.msg}</span></div>`:''}
    ${inner}</div>`;
}
function onwProdPicksHtml(){
  const o=state.onw;
  if(o.pickErr) return `<div style="font-size:13px;color:var(--brick-ink)">${o.pickErr}</div>`;
  if(o.picks===null) return o.q.trim()?`<div style="font-size:13px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`:'';
  if(!o.picks.length) return `<div style="font-size:13px;color:var(--text-secondary)">${T('No products match','没有匹配的商品')}</div>`;
  return `<div class="list">${o.picks.map((p,i)=>`${i?'<div class="sep"></div>':''}
    <button class="row" onclick="APP.cmd('onwAddLine',${p.id})" style="min-height:52px">
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(T(p.name_en||p.name_cn||'',p.name_cn||p.name_en||''))}</span>
        <span class="num" style="font-size:12px;color:var(--text-secondary)">${money(CUR,p.sell_price)}${p.sku?' · '+escAttr(p.sku):''}</span></span>
    </button>`).join('')}</div>`;
}
function onwCustPicksHtml(){
  const o=state.onw;
  if(o.custErr) return `<div style="font-size:13px;color:var(--brick-ink)">${o.custErr}</div>`;
  if(o.custPicks===null) return o.custQ.trim()?`<div style="font-size:13px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`:'';
  if(!o.custPicks.length) return `<div style="font-size:13px;color:var(--text-secondary)">${T('No customers match','没有匹配的顾客')}</div>`;
  return `<div class="list">${o.custPicks.map((c,i)=>`${i?'<div class="sep"></div>':''}
    <button class="row" onclick="APP.cmd('onwPickCust',${c.id})" style="min-height:52px">
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(c.nickname||'—')}</span>
        <span class="num" style="font-size:12px;color:var(--text-secondary)">${escAttr(c.phone||'')}</span></span>
    </button>`).join('')}</div>`;

/* The city matches, computed in one place because two callers read them — the
   list, and the tap that picks row N out of it. The tap carries the INDEX and
   never the name: a name goes into a JS string inside an HTML attribute, and a
   catalogue of place names is not this file's to make safe. Same rule the
   category chips already follow. */
function onwCityMatches(){
  const o=state.onw, q=o.cityQ.trim().toLowerCase();
  if(!q||!o.cities) return [];
  return o.cities.filter(c=>String(c.name_cn||'').toLowerCase().indexOf(q)>=0
                          ||String(c.name_en||'').toLowerCase().indexOf(q)>=0).slice(0,8);
}
function onwCityPicksHtml(){
  const o=state.onw;
  if(!o.cityQ.trim()) return '';
  if(o.cities===null) return `<div style="font-size:13px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const rows=onwCityMatches();
  if(!rows.length) return `<div style="font-size:13px;color:var(--text-secondary)">${T('No cities match','没有匹配的城市')}</div>`;
  return `<div class="list">${rows.map((c,i)=>`${i?'<div class="sep"></div>':''}
    <button class="row" onclick="APP.cmd('onwPickCity',${i})" style="min-height:48px">
      <span style="flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(c.name_cn||'')}${c.name_en?' · '+escAttr(c.name_en):''}</span>
    </button>`).join('')}</div>`;
}
function onwDistrictsHtml(){
  const o=state.onw;
  if(o.districts===null) return `<div style="font-size:13px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  if(!o.districts.length) return `<div style="font-size:13px;color:var(--text-secondary)">${T('City-wide · no district','全城 · 不分区')}</div>`;
  const head=onwDistrictRequired()?[]:[{k:'',en:'City-wide · no district',zh:'全城 · 不分区'}];
  const cur=o.district?String(o.districts.findIndex(d=>(d.name_cn||d.name_en)===o.district)):'';
  return onwChips(head.concat(o.districts.map((d,i)=>({k:i,en:d.name_cn||d.name_en||'',zh:d.name_cn||d.name_en||''}))),cur,'onwDistrict');
}
/* A line is two rows, not one: a product name, a price and a stepper do not fit
   across 360px without the name being cut to nothing, and the name is the part
   being read back down the telephone. */
function onwLinesHtml(){
  const o=state.onw;
  if(!o.lines.length) return `<div style="font-size:13px;color:var(--text-secondary)">${T('No lines yet. Search above to add the first product.','还没有商品行。在上方搜索,添加第一个商品。')}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:10px">${o.lines.map((l,i)=>`
    <div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <span style="flex:1;min-width:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(T(l.en||l.cn||'',l.cn||l.en||''))}</span>
        <button class="iconbtn" style="width:32px;height:32px;margin:-4px -6px 0 0" onclick="APP.cmd('onwDropLine',${i})" aria-label="${T('Remove line','移除此行')}">${ic('x',18,2)}</button></div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="num" style="flex:1;min-width:0;font-size:12.5px;color:var(--text-secondary)">${money(CUR,l.price)} · ${money(CUR,(Number(l.qty)||0)*(Number(l.price)||0))}</span>
        <button class="stepbtn" onclick="APP.cmd('onwQty',${i},-1)" ${Number(l.qty)<=1?'disabled':''} aria-label="${T('Less','减少')}">${ic('minus',20)}</button>
