const hhmm=v=>fmtTime(v);
// Money is either whole or to the fen — never the one-decimal ¥3,271.4 this
// used to print. maximumFractionDigits alone caps the tail without padding it,
// so a .40 lost its zero and a .7 rendered as a single digit, which reads as a
// rounding bug rather than a price. minimum and maximum move together.
const money=(cur,n)=>{ const s=cur||'¥'; const num=Number(n||0); const f=num%1?2:0;
  return s+num.toLocaleString(undefined,{minimumFractionDigits:f,maximumFractionDigits:f}); };
// Whole yuan, for the glance cards — a day's takings on a phone tile is read,
// not reconciled, and the fen is noise at that size. Matches what the desktop
// dashboard shows in the same place (dashMoney with no dp).
const money0=(cur,n)=>(cur||'¥')+Math.round(Number(n||0)).toLocaleString();

// ── The delta line under a Today tile ─────────────────────────────────────
// Mirrors the desktop's dashSetDelta (public/retail-admin/03-dashboard.js) —
// same baseline, same rules, deliberately the same answers:
//
//   • nothing yet today  → a calm dash, never an alarming ▼100% every morning;
//   • no same-weekday history → "new", not a percentage of nothing;
//   • otherwise a WHOLE percent. The raw delta arrives with decimals and this
//     used to print them ("−23.8%"), which claims a precision a handful of
//     orders cannot support.
//
// It also names the baseline. The desktop hides that in a hover tooltip; a
// phone has no hover, so the honest phrase goes inline — "vs last 3 Sat" rather
// than the "vs a typical day" this used to say, which never told you what the
// typical day was measured over. `by now` when the server clipped the baseline
// days to the current time, or a slow morning reads as a collapse.
//
// Returns '' for a metric with no baseline at all (average order value). The
// caller renders no line rather than a comparison label with nothing to compare
// — the dangling "vs a typical day" under Avg. order was exactly that.
const DOW_ABBR_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_CN=['周日','周一','周二','周三','周四','周五','周六'];
function deltaText(cur, base, bl){
  if(base===undefined || base===null) return '';
  if(!cur) return T('none yet today','今日暂无');
  if(!bl || !bl.days || base.delta==null) return T('new','新');
  const n=bl.days, ab=DOW_ABBR_EN[bl.weekday]||'day', cn=DOW_CN[bl.weekday]||'天';
  const by=bl.clipped?T(' by now','同一时段'):'';
  const vs=T(`vs last ${n} ${ab}${by}`, `较前 ${n} 个${cn}${by}`);
  const r=Math.round(base.delta);
  return (r>0?'▲ '+r+'%':r<0?'▼ '+Math.abs(r)+'%':'±0%')+' '+vs;
}
const ORDER_STATUS={
  paid:['paid','Paid','已付款'],preparing:['preparing','Preparing','备货中'],dispatched:['dispatched','Dispatched','已发货'],
  delivered:['delivered','Delivered','已送达'],pending:['pending','Pending','待处理'],pending_payment:['pending','Unpaid','待付款'],
  cancelled:['cancelled','Cancelled','已取消'],refunded:['refund','Refunded','已退款'],
};
const CH_BACK={wechat:'miniapp',web:'web',meituan:'meituan',gzgrocery:'gzgrocery',manual:'manual'};
let CUR='¥';

/* The desktop's paymentCheckLine, on a phone. Only while unpaid — once a person
   has judged it, the verdict is history. Three states, not one: rejected is
   brick, because the money may be wrong; verified-but-still-unpaid and
   never-read are brass, because nothing is wrong, someone just has to look.
   Without a proof at all this is an ordinary unpaid order and the Pending pill
   already says so, which is the whole point of has_alipay_proof. */
function payNoteOf(r){
  if(r.status!=='pending_payment') return null;
  const v=r.alipay_ocr_verdict;
  if(v==='mismatch') return {sev:'brick',icon:'triangle-alert',
    label:["Payment doesn't match",'付款不一致'],
    why:["The screenshot was read and doesn't match this order. Check it on the desktop before marking it paid.",
         '系统识别的付款截图与本单不符，请在电脑端核实后再标记已付款。']};
  if(!r.has_alipay_proof) return null;
  if(v==='match') return {sev:'amber',icon:'circle-check',
    label:['Payment verified · confirm','付款已核对 · 待确认'],
    why:['The screenshot was read and matches. Marking it paid is a desktop action — it records which tender it was.',
         '付款截图已核对一致。标记已付款需在电脑端完成 — 需要记录收款方式。']};
  return {sev:'amber',icon:'triangle-alert',
    label:['Payment not checked yet','付款待核对'],
    why: v==='error'
      ? ['The screenshot could not be read. Open it on the desktop and check it by hand.',
         '付款截图无法识别。请在电脑端打开人工核对。']
      : ['A screenshot is on file and nobody has checked it. Open it on the desktop and verify.',
         '已上传付款截图但尚未核对。请在电脑端打开核对。']};
}
/* ---- The Delivery cell ---------------------------------------------------
   The desktop merges tracking and ship-by into ONE column, because on any given
   row exactly one of them is the live fact: a shipped order has a waybill and a
   deadline already in the past; an unshipped one has a deadline and no waybill.
   The phone was showing only the second half of that, and only its raw label —
   no tracking state, no courier, no missing-waybill warning, and no urgency, so
   `byAmber` was a field that existed and was never once true. */
const GZ_TODAY=()=>{ const p=new Date(Date.now()+8*3600*1000).toISOString().slice(0,10).split('-');
  return new Date(+p[0],+p[1]-1,+p[2]); };
const _sched=v=>{ const d=_date(v); return d&&!isNaN(d)?d:null; };
/* shipByPlan, reduced: the same five kinds and the same urgency anchors. The
   desktop's label prettifiers (humanizeSlotLabel / slotWindowText) are not
   ported — the stored label is used as-is — so a row can read slightly more
   raw here than on the desktop, but it never reads WRONG. */
function shipByPlan(r){
  const done=['dispatched','delivered','cancelled','refunded'].includes(r.status);
  if(r.fulfillment_type==='counter') return null;
  if(r.fulfillment_type==='pickup') return {kind:'pickup',
    label:r.delivery_slot_label||T('During pickup hours','营业时间内自取'),
    sub:T('pickup','自提'), when:r.scheduled_for||null, basis:'arrival', done};
  if(r.promised_ship_date){
    const ship=fmtDay(r.promised_ship_date), arr=r.promised_delivery_date?fmtDay(r.promised_delivery_date):'';
    return {kind:'batch', label:arr||ship,
      sub:arr?T('made fresh · ship '+ship,'现做 · '+ship+'发货'):T('made fresh','现做'),
      when:r.promised_ship_date, basis:'arrival', done};
  }
  if(r.ship_by_mode==='asap'||!r.scheduled_for){
    if(r.delivery_slot_kind==='right_away') return {kind:'asap',label:T('Right away','立即配送'),sub:'',when:r.placed_at||null,basis:'age',done};
    return {kind:'asap',label:T('Courier — ship when ready','快递 · 备好即发'),sub:'',when:r.placed_at||null,basis:'age',done};
  }
  return {kind:'scheduled', label:r.delivery_slot_label||fmtDay(r.scheduled_for),
    sub:'', when:r.scheduled_for, basis:'arrival', done};
}
/* shipByUrgency, ported thresholds and all — including the rule that "today" is
   the STORE's today (Guangzhou), not the browser's, so an operator abroad does
   not read yesterday's bucket. */
function shipByUrgency(p,actionable){
  const out={level:'none',days:null};
  if(!p||!p.when||!actionable) return out;
  if(p.basis==='age'){
    const d=_sched(p.when); if(!d) return out;
    const age=Math.floor((Date.now()-d.getTime())/86400000);
    out.days=age;
    out.level = age>=4?'overdue' : age>=2?'soon' : 'fresh';
    return out;
  }
  const dm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(p.when));
  if(dm){
    const target=new Date(+dm[1],+dm[2]-1,+dm[3]);
    const days=Math.round((target.getTime()-GZ_TODAY().getTime())/86400000);
    out.days=days;
    out.level = days<0?'overdue' : days===0?'today' : days===1?'tomorrow' : 'later';
    return out;
  }
  const d=_sched(p.when); if(!d) return out;
  const hrs=(d.getTime()-Date.now())/3600000;
  out.level = hrs<0?'overdue' : hrs<24?'today' : hrs<48?'tomorrow' : 'later';
  return out;
}
/* Live courier stage — the same three the desktop names, and the same rule that
   a terminal order status wins over a frozen in-transit snapshot. */
function courierLine(r){
  const c=r.courier;
  if(!c||!c.stage||c.stage==='scheduled'||c.stage==='delivered') return null;
  if(['delivered','cancelled','refunded'].includes(r.status)) return null;
  const label = c.stage==='in_transit'?T('On the way','配送中')
    : c.stage==='heading_to_pickup'?T('Rider coming','骑手前往取货')
    : c.stage==='awaiting_dispatch'?T('Finding a rider','正在找骑手') : '';
  if(!label) return null;
  const mins=(c.stage==='in_transit'&&c.eta_seconds!=null)?('~'+Math.max(1,Math.round(c.eta_seconds/60))+T('m','分')):'';
  return {text:mins?label+' · '+mins:label, tone:'brick'};
}
/* deliveryStateInfo, ported: problems first, because those are what the
   operator must act on. */
const DELIV_STATE={
  no_contact:{en:"Can't reach the customer",cn:'联系不上顾客',tone:'brick'},
  exception:{en:'Delivery issue',cn:'配送异常',tone:'brick'},
  returning:{en:'Returning to sender',cn:'退回中',tone:'brick'},
  returned:{en:'Returned',cn:'已退回',tone:'brick'},
  pickup_point:{en:'At a pickup point',cn:'已到驿站',tone:'amber'},
  locker:{en:'In a locker',cn:'已入快递柜',tone:'amber'},
  delivered:{en:'Delivered',cn:'已签收',tone:'plain'},
  out_for_delivery:{en:'Out for delivery',cn:'派送中',tone:'plain'},
  in_transit:{en:'In transit',cn:'运输中',tone:'plain'},
  picked_up:{en:'Picked up',cn:'已揽收',tone:'plain'},
};
function deliveryState(r){
  if(r.status==='delivered') return {text:T('Delivered','已签收'),tone:'plain'};
  const sc=r.tracking_scenario||'', st=r.tracking_status||'';
  const k=DELIV_STATE[sc]||DELIV_STATE[st];
  return k?{text:T(k.en,k.cn),tone:k.tone}:null;
}
/* One line, the way the desktop picks one cell: the live fact for THIS row. */
function deliveryLine(r){
  const readonly=['meituan','gzgrocery'].includes(String(r.channel||'').toLowerCase());
  if(r.fulfillment_type==='counter') return null;
  if(readonly){
    if(['cancelled','refunded'].includes(r.status)) return null;
    const when=r.status==='delivered'?(r.delivered_at||null):null;
    if(when) return {text:T('arrived '+fmtTime(when),'已送达 '+fmtTime(when)),tone:'plain'};
    if(r.channel_preorder_at&&r.status!=='delivered') return {text:T('booked '+fmtTime(r.channel_preorder_at),'预约 '+fmtTime(r.channel_preorder_at)),tone:'amber'};
    if(r.channel_eta) return {text:T('arrival '+fmtTime(r.channel_eta),'预计 '+fmtTime(r.channel_eta)),tone:'plain'};
    return null;
  }
  const moving = r.status==='dispatched'||r.status==='delivered'||r.tracking_number||r.local_eta;
  if(moving&&r.fulfillment_type!=='pickup'){
    if(r.air_delivery_delayed) return {text:T('Air delayed · call the customer','空运延误 · 请联系顾客'),tone:'brick'};
    const live=courierLine(r); if(live) return live;
    if(r.is_local){
      if(r.local_eta) return {text:T('arrival '+r.local_eta,'预计 '+r.local_eta),tone:'plain'};
      if(r.status==='dispatched') return {text:T('no arrival time set','未设送达时间'),tone:'amber'};
      return null;
    }
    if(!r.tracking_number){
      // Shipped with no waybill = the office still has to enter it, and the
      // customer has nothing to track. The desktop shouts about this in red.
      if(r.status==='dispatched') return {text:T('No waybill yet','缺运单号'),tone:'brick'};
      return null;
    }
    const dl=deliveryState(r);
    const wb=(r.tracking_carrier||'').toUpperCase()+' '+r.tracking_number;
    return {text:dl?wb+' · '+dl.text:wb, tone:dl?dl.tone:'plain', num:true};
  }
  const plan=shipByPlan(r); if(!plan) return null;
  const actionable=r.status==='paid'||r.status==='preparing';
  const u=shipByUrgency(plan,actionable);
  let tag='';
  if(actionable){
    if(u.level==='overdue') tag=' · '+T('overdue','已逾期');
    else if(plan.kind!=='batch'&&u.level==='today') tag=' · '+T('today','今天');
    else if(plan.kind!=='batch'&&u.level==='tomorrow') tag=' · '+T('tomorrow','明天');
  }
  const tone = !actionable?'plain' : u.level==='overdue'?'brick' : (u.level==='today'||u.level==='tomorrow'||u.level==='soon')?'amber':'plain';
  return {text:plan.label+tag, sub:plan.sub||'', tone};
}
/* Why an order is being fulfilled somewhere other than the obvious store.
   Silent for nearest/only-store, which is the normal case and says nothing. */
function routingNote(reason){
  const r=String(reason||'').toLowerCase().trim();
  if(r==='fallback_no_stock') return T('rerouted · out of stock','改派 · 缺货');
  if(r==='manual') return T('manually routed','手动改派');
  if(r==='out_of_city') return T('out-of-city warehouse','外地仓发货');
  return '';
}
/* The desktop stacks these under the status pill, and every one of them changes
   what the operator does next: items were added after the slip printed; the
   shipping store is short; the stock has not actually come off yet; a fapiao is
   owed. The phone showed the pill alone. */
function orderNotes(r){
  const out=[];
  if(Number(r.addon_count)) out.push({sev:'amber',icon:'plus',label:T('Items added after paying','下单后加购')});
  let shortPids=[];
  try{ shortPids=JSON.parse(r.fulfillment_short_pids||'[]')||[]; }catch(e){}
  if(shortPids.length) out.push({sev:'amber',icon:'triangle-alert',
    label:T(shortPids.length===1?'Shipping store is short 1 item':'Shipping store is short '+shortPids.length+' items',
            '出货门店缺 '+shortPids.length+' 件')});
  if(r.stock_pending) out.push({sev:'amber',icon:'box',label:T('Stock not deducted yet','库存待扣')});
  if(Number(r.needs_invoice)){
    const issued=r.invoice_status==='issued';
    out.push({sev:issued?'muted':'amber',icon:'receipt',label:issued?T('Invoice issued','已开票'):T('Invoice to issue','待开票')});
  }
  if(r.air_delivery_delayed) out.push({sev:'brick',icon:'plane',label:T('Air delayed · call the customer','空运延误 · 请联系顾客')});
  return out.length?out:null;
}
/* The desktop's renderSplitRollupLine, on a phone. Under two parcels there is
   nothing to roll up and the row says nothing. */
function parcelRollup(r){
  const total=Number(r.shipment_count)||0;
  if(total<2) return null;
  const delivered=Math.min(Number(r.shipment_delivered)||0,total);
  const moving=Math.min(Number(r.shipment_moving)||0,total-delivered);
  return {total, delivered, moving, toShip:Math.max(0,total-delivered-moving)};
}
function mapOrderRow(r){
  let sk=ORDER_STATUS[r.status]||['pending',r.status||'—',r.status||'—'];
  let kind=sk[0];
  if(['pending','reviewing','approved'].includes(r.refund_status)){ kind='refund'; sk=['refund','Refund requested','申请退款']; }
  const ch=CH_BACK[(r.channel||'wechat').toLowerCase()]||'miniapp';
  // A walk-in is not a pickup. The desktop keeps them apart on purpose — "a
  // list that calls a walk-in a pickup is a small lie that ends up in a report".
  const shipCity=r.ship_counter?['Counter','前台']
    :r.ship_pickup?['Pickup in-store','到店自提']
    :(()=>{ const en=[r.ship_city_en||r.ship_city,r.ship_district_en||r.ship_district].filter(Boolean).join(' · ')||'—';
            const cn=[r.ship_city,r.ship_district].filter(Boolean).join(' · ')||'—';
            return [en,cn]; })();
  const deliv = deliveryLine(r);
  return {
    id:r.order_no||('#'+r.id), _id:r.id,
    ch, cust:[r.recipient_name||r.nickname||'—', r.recipient_name||r.nickname||'—'],
    // fmtDay, not hhmm: an order from three days ago showed a bare "9:07 AM".
    total:money(CUR,r.total), placed:fmtDay(r.placed_at),
    status:[sk[1],sk[2]], kind, raw:r.status||null, refundStatus:r.refund_status||null, isNew:!r.seen_at,
    ship:Array.isArray(shipCity)?shipCity:[shipCity,shipCity],
    deliv,
    viewOnly: ch==='meituan'||ch==='gzgrocery',
    // A proof is not a status — the order never moved, it is still
    // pending_payment. It rides its own row as a mark, exactly as the desktop
    // does, so the Pending list can be scanned for the one that needs a person.
    payNote: payNoteOf(r),
    // What the desktop's Store, Items and Placed columns carry. A shop with two
    // stores could not tell from this list which one owes the work, and an order
    // from three days ago showed a bare "9:07 AM" with no date on it.
    items_n: r.item_count!=null?Number(r.item_count):null,
    store: r.store_code?[r.store_name_en||r.store_code, r.store_name_cn||r.store_name_en||r.store_code]:null,
    routeNote: routingNote(r.routing_reason),
    // The Status cell's stack of note lines. Each is a fact about the order that
    // changes what an operator does with it, and none of them were here.
    notes: orderNotes(r),
    pickup: r.fulfillment_type==='pickup',
    counter: r.fulfillment_type==='counter',
    // Multi-parcel rollup, from the list query's own counts. Without it a
    // dispatched order sitting in the Paid tab looks like a bug: the tab is
    // right — one parcel has gone and another has not — and the row was the
    // only place that could say so.
    parcels: parcelRollup(r),
    phone:r.recipient_phone||r.customer_phone||'—',
    addr:[r.address_full||'—', r.address_full||'—'],
    pay:[r.payment_method||'—', r.payment_method||'—'], txn:r.order_no||'—',
    fulfil:[r.store_name_en||r.store_code||'—', r.store_name_cn||r.store_name_en||'—'],
    route:[r.routing_reason||'—', r.routing_reason||'—'],
    trk: r.tracking_number?{carrier:[r.tracking_carrier||'Courier','快递'],no:r.tracking_number,event:[r.tracking_status||'In transit','运输中'],live:!!r.jd_live}:null,
    items:[], breakdown:[['Subtotal',money(CUR,r.subtotal!=null?r.subtotal:r.total)]].concat(r.shipping_fee?[['Delivery',money(CUR,r.shipping_fee)]]:[]),
  };
}
/* The choices the CUSTOMER made on this line — "Heat up?: Yes", a size, a
   flavour. The phone dropped them entirely, so two lines of the same product in
   different variants read as the same thing twice and a packer boxes the wrong
   one. Kept as an EN/CN pair rather than resolved here, because the operator can
   flip language after the order was mapped. */
function itemOpts(it){
  const arr=Array.isArray(it.options)?it.options:[];
  const side=cn=>arr.map(o=>{
    if(!o) return '';
    const val=cn?(o.label_cn||o.label||''):(o.label||o.label_cn||'');
    if(!val) return '';
    const q=cn?(o.question_cn||o.question_en||''):(o.question_en||o.question_cn||'');
    return q?(q+': '+val):val;
  }).filter(Boolean).join(' · ');
  const en=side(false), zh=side(true);
  return en||zh?[en||zh, zh||en]:null;
}
const ITEM_TUPLE=it=>[it.qty||it.quantity||1, it.name_en||it.name||it.name_cn||'Item', money(CUR,it.price||it.unit_price||0), it.sku||'', it.image_url||it.image||'', itemOpts(it)];
function mapDetail(o){
  const base=mapOrderRow(o);
  base.items=(o.items||[]).map(ITEM_TUPLE);
  // The parcels the order is actually split into. An out-of-Guangzhou order
  // becomes an Air parcel and a Land parcel, each shipping and arriving on its
  // own clock — the phone showed one flat item list and one tracking block, so
  // "which box is this in, and has it gone?" had no answer here at all.
  base.shipments=(o.shipments||[]).map(sp=>({
    id:sp.id, mode:sp.mode||'local', state:sp.state||'pending',
    items:(sp.items||[]).map(ITEM_TUPLE),
    units:(sp.items||[]).reduce((n,it)=>n+(Number(it.qty||it.quantity)||0),0),
    // The whole tracking view, not two raw column values. The drawer used to
    // print `tracking_carrier` and `tracking_status` straight out of the row,
    // so a shipped parcel read "jd JDVC37829030835 / in_transit" — a carrier
    // code and a status key, neither of them words.
    trk:sp.tracking||null,
    jdLive:!!sp.jd_live, kd100:!!sp.tracking_kd100_subscribed,
    lastError:sp.tracking_last_error||null,
    localEta:sp.local_eta||null, etaSource:sp.eta_source||null,
    airCleared:sp.air_delay_cleared_at||null, airClearedBy:sp.air_delay_cleared_by||null,
    dispatchedAt:sp.dispatched_at||null, deliveredAt:sp.delivered_at||null,
  }));
  base.airDelayed=!!o.air_delivery_delayed;
  // Anything not assigned to a parcel yet still has to show, or a line silently
  // vanishes from the order it was bought on.
  const inParcel=new Set();
  (o.shipments||[]).forEach(sp=>(sp.items||[]).forEach(it=>inParcel.add(it.id)));
  base.loose=(o.items||[]).filter(it=>!inParcel.has(it.id)).map(ITEM_TUPLE);
  base.rawStatus=o.status||null;
  // The facts the desktop drawer carries and this one did not. Every one of
  // them is already in the payload — the drawer was simply not reading them.
  base.custNote=(o.customer_note||'').trim()||null;         // what the CUSTOMER asked for
  base.custId=o.customer_id!=null?o.customer_id:null;       // so the name can be tapped
  base.custName=o.nickname||o.recipient_name||'';
  base.voucher=(Number(o.voucher_amount)>0)?{code:o.voucher_code||'',amount:Number(o.voucher_amount)}:null;
  base.printFailed=(o.print_status==='failed'&&!['pending_payment','cancelled','refunded'].includes(o.status))?(o.print_error||''):null;
  base.fulfil_rollup=(o.fulfillment&&o.fulfillment.rollup)||null;
  base.fulfil_counts=o.fulfillment?{done:o.fulfillment.dispatched,total:o.fulfillment.total}:null;
  base.addons=(o.addons||[]).filter(a=>(a.items||[]).length||Number(a.amount)).map(a=>({
    when:a.paid_at||null, amount:Number(a.amount)||0,
    items:(a.items||[]).map(it=>({name:it.name_en||it.name_cn||'', qty:it.qty||1})),
  }));
  base.addonTotal=Number(o.addon_total)||0;
  base.proof=o.alipay_proof_image||null;                    // the screenshot itself
  base.invoice=Number(o.needs_invoice)?{
    status:o.invoice_status||'requested', type:o.invoice_type||'',
    title:o.invoice_title||'', taxId:o.invoice_tax_id||'', email:o.invoice_email||'',
    number:o.invoice_number||'', file:o.invoice_file_url||'', issuedAt:o.invoice_issued_at||'',
  }:null;
  base.pickupStore=(o.fulfillment_type==='pickup')
    ?((o.address&&(o.address.store_name_en||o.address.store_name_cn))||o.store_name_en||o.store_code||'')
    :null;
  base.stockPending=!!o.stock_pending;
  if(o.subtotal!=null||o.shipping_fee!=null){
    base.breakdown=[['Subtotal',money(CUR,o.subtotal!=null?o.subtotal:o.total)]].concat(o.shipping_fee?[['Delivery',money(CUR,o.shipping_fee)]]:[]);
  }
  base.id=o.order_no||base.id;
  return base;
}
/* The low-stock line is the tenant's, not a number this file picked: a
   per-product override first, then `inventory.lowStockThreshold`, which is what
   the desktop reads. The phone used to hardcode 10, so a shop that called 3 low
   saw seven products wearing a warning they had not asked for. */
function prodLowThreshold(r){
  const t=r&&r.low_stock_threshold;
  if(t!=null&&t!==''&&Number(t)>=0) return Number(t);
  const d=Number(cfgGet('inventory.lowStockThreshold',5));
  return isNaN(d)?5:d;
}
function mapProduct(r){
  // Backend returns effective_stock (summed across active stores) / stock_qty,
  // and sell_price — NOT `stock`/`price`. Reading the wrong keys made every live
  // product show ¥0 and "Out of stock". Keep the old keys as last-resort fallback.
  const stock=Number(r.effective_stock!=null?r.effective_stock:(r.stock_qty!=null?r.stock_qty:(r.stock!=null?r.stock:0)));
  const price=r.sell_price!=null?r.sell_price:(r.price!=null?r.price:0);
  // The desktop's buckets (_paStatusMatch), not a stock ladder of this file's
  // own: published comes FIRST — an unpublished product is a draft whatever its
  // shelf looks like, and the phone used to show it as "Live". A supplier-direct
  // item holds no stock of ours, so it is never Low and never Out.
  const pub = r.is_published==null ? true : !!Number(r.is_published);
  const supplier = !!r.ship_from_supplier;
  const low = prodLowThreshold(r);
  let kind,st;
  if(!pub){ kind='draft'; st=['Draft','草稿']; }
  else if(!supplier&&stock<=0){ kind='off'; st=['Out','缺货']; }
  else if(!supplier&&stock<=low){ kind='restock'; st=['Low','库存低']; }
  else { kind='on'; st=['Live','在售']; }
  return {_id:r.id, name:[r.name_en||r.name_cn||'—',r.name_cn||r.name_en||'—'],sku:r.sku?('SKU '+r.sku):('#'+r.id),
    price:money(CUR,price), priceNum:Number(price)||0, stock, stockLabel:[stock+' in stock',('库存 '+stock)], status:st, kind,
    pub, supplier, cat:String(r.top_category||r.category||'').trim(),
    // One lowercased haystack per product, built once: name in both languages
    // and the SKU, which is what the desktop's search box matches on.
    hay:[r.name_en||'',r.name_cn||'',r.sku||''].join(' ').toLowerCase()};
}
function mapReview(r){
  const replied=r.reply&&String(r.reply).trim();
  const src=r.source||'real';
  const pe=r.product_name_en||r.product_name_cn||'', pc=r.product_name_cn||r.product_name_en||'';
  return {key:src+':'+r.id, id:r.id, source:src, stream:'review', reply:r.reply||'',
    cust:[r.customer_name||'Customer',r.customer_name||'顾客'], rating:r.rating?Number(r.rating).toFixed(1):'',
    status:replied?['Replied','已回复']:['New','新'], kind:replied?'clear':'success',
    // A review is about a product; the phone showed only who wrote it, so an
    // operator could not tell which shelf a one-star was aimed at.
    product:pe?[pe,pc]:null,
    visible: r.is_visible==null?true:!!Number(r.is_visible),
    text:[r.comment||'',r.comment||''], time:[hhmm(r.created_at)||'',hhmm(r.created_at)||'']};
}

/* ---- mappers for the secondary screens (each falls back to sample data) ---- */
const CAT_ICON={produce:'sprout',fresh:'sprout',bakery:'croissant',bread:'croissant','plant-based':'leaf',plant:'leaf',
  beverage:'cup-soda',drink:'cup-soda',snack:'cookie',household:'house-plug',home:'house-plug',pantry:'package',frozen:'snowflake'};
function catIcon(name){ const n=String(name||'').toLowerCase(); for(const k in CAT_ICON){ if(n.includes(k)) return CAT_ICON[k]; } return 'tag'; }
function mapCategory(r){ const nm=r.name||r.name_en||'—'; return {name:[nm,r.name_cn||nm],icon:catIcon(nm),count:r.usage_count!=null?r.usage_count:(r.count!=null?r.count:0)}; }

const PO_KIND={received:'delivered',partial:'preparing',in_transit:'dispatched',ordered:'dispatched',sent:'dispatched',draft:'draft',cancelled:'off'};
function mapPurchase(r){
  const st=String(r.status||'draft').toLowerCase();
  return {id:r.po_number||('PO-'+r.id), _id:r.id, supplier:[r.supplier||r.store_name_en||'—',r.supplier||r.store_name_cn||'—'],
    total:money(CUR,r.total_cost), items:[(r.line_count||0)+' items',(r.line_count||0)+' 项'],
    status:[st.charAt(0).toUpperCase()+st.slice(1),st], kind:PO_KIND[st]||'pending'};
}
function mapActivity(r){
  const src=r.source||r.reason||'';
  return {name:[r.product||r.sku||'—',r.product||r.sku||'—'],
    meta:[[r.sku,src].filter(Boolean).join(' · ')||'—',[r.sku,src].filter(Boolean).join(' · ')||'—'],
    delta:(r.delta>0?'+':'')+ (r.delta!=null?r.delta:0)};
}
const INV_KIND={issued:'on',requested:'pending',pending:'pending'};
function mapInvoice(r){
  const st=String(r.invoice_status||'requested').toLowerCase();
  const issued=st==='issued';
  const label=issued?['Issued','已开票']:['Pending','待开票'];
  return {id:r.invoice_number||r.order_no||('#'+r.id), order:r.order_no||'—', amount:money(CUR,r.total),
    status:label, kind:INV_KIND[st]||'pending', issued,
    // Only an issued fapiao has a file. The button used to be offered on every
    // row and did nothing on any of them.
    file:r.invoice_file_url||null,
    date:[fmtDay(r.invoice_issued_at||r.placed_at)||'—',fmtDay(r.invoice_issued_at||r.placed_at)||'—']};
}
function mapVoucher(r){
  const val=r.type==='percent'?(r.value+'% off'):money(CUR,r.value)+' off';
  const min=r.min_subtotal?(' · min '+money(CUR,r.min_subtotal)):'';
  return {id:r.id, title:[r.description||val,r.description||val], code:r.code,
    meta:['Used '+(r.grant_used_count||r.used_count||0)+min,'已用 '+(r.grant_used_count||r.used_count||0)+min],
    on:!!r.is_active};
}
const FLASH_KIND={live:'live',running:'live',scheduled:'draft',upcoming:'draft',ended:'off',none:'off'};
function mapFlash(r){
  const win=[hhmm(r.flash_starts_at),hhmm(r.flash_ends_at)].filter(Boolean).join('–')||'—';
  const state=String(r.flash_state||'none');
  const label=state==='live'?['Live','进行中']:state==='ended'?['Ended','已结束']:['Scheduled','已排期'];
  return {title:[r.name_en||r.name_cn||'—',r.name_cn||r.name_en||'—'], win:[win,win], status:label, kind:FLASH_KIND[state]||'draft'};
}
const BC_KIND={sent:'delivered',scheduled:'draft',draft:'draft'};
function mapBroadcast(r){
  const st=String(r.status||'draft').toLowerCase();
  const label=st==='sent'?['Sent','已发送']:st==='scheduled'?['Scheduled','已排期']:['Draft','草稿'];
  const meta=st==='sent'?('Sent to '+(r.recipient_count||0)):(r.scheduled_for?('Scheduled '+r.scheduled_for):'Draft');
  const metaCn=st==='sent'?('发送 '+(r.recipient_count||0)):(r.scheduled_for?('排期 '+r.scheduled_for):'草稿');
  return {id:r.id, st, title:[r.title_en||r.title_cn||'—',r.title_cn||r.title_en||'—'], meta:[meta,metaCn], status:label, kind:BC_KIND[st]||'draft'};
}
function mapFeedback(r){
  const open=r.needs_reply||!r.replied;
  return {key:'fb:'+r.id, id:r.id, stream:'feedback', cust:[r.customer_name||r.nickname||'Customer',r.customer_name||r.nickname||'顾客'],
    status:open?['Open','待处理']:['Replied','已回复'], kind:open?'success':'clear',
    text:[r.message||r.last_body||'',r.message||r.last_body||''], time:[hhmm(r.created_at)||'',hhmm(r.created_at)||'']};
}
function mapPoll(r){
  const opts=r.options||[]; const total=r.total_votes||opts.reduce((a,o)=>a+(o.votes||0),0);
  let top=opts[0]; opts.forEach(o=>{ if((o.votes||0)>((top&&top.votes)||0)) top=o; });
  const pct=total?Math.round(((top&&top.votes||0)/total)*100)+'%':'0%';
  const st=String(r.status||'draft').toLowerCase();
  const label=st==='open'?['Live','进行中']:st==='closed'?['Closed','已结束']:['Draft','草稿'];
  return {title:[r.question_en||r.question_cn||'—',r.question_cn||r.question_en||'—'],
    status:label, kind:st==='open'?'live':'off', votes:[total+' votes',total+' 票'], pct,
    top:top?['Leading: '+(top.label_en||top.label_cn||''),'领先：'+(top.label_cn||top.label_en||'')]:['—','—']};
}
const TIER_NAMES={seed:['Seed','种子'],sprout:['Sprout','幼苗'],root:['Root','根'],tree:['Tree','大树']};
const TIER_PTS={seed:['≥ 0 pts','≥ 0 分'],sprout:['≥ 500 pts','≥ 500 分'],root:['≥ 2,000 pts','≥ 2,000 分'],tree:['≥ 5,000 pts','≥ 5,000 分']};
function mapMember(r){
  const tk=String(r.tier_key||'seed');
  return {name:[r.nickname||'—',r.nickname||'—'], tier:TIER_NAMES[tk]||[tk,tk], pts:Number(r.points_balance||0).toLocaleString(),
    gold:tk==='tree'||tk==='root'};
}
function mapWallet(r){
  const amt=Number(r.amount||0);
  return {label:['Top-up','充值'], who:[r.nickname||'—',r.nickname||'—'], time:hhmm(r.paid_at||r.created_at)||'',
    amt:'+'+money(CUR,amt), color:'#5F7357'};
}
reg('openOrder', id=>{
  const row=(state.liveOrders||[]).find(o=>o.id===id);
  state.detailId=id; state.drag=0; state.liveDetail=null; state.detailMounted=false;
  state.orderErr=null; state.orderBusy=null;
  if(row&&row._id!=null){
    render();
    // Sheet has animated once now — suppress the slide-up on the fetch re-render
    // so the detail doesn't flick up a second time when live items arrive.
    state.detailMounted=true;
    api('/orders/'+row._id).then(o=>{ if(state.detailId===id){ state.liveDetail=mapDetail(o); render(); } }).catch(()=>{});
  } else { render(); state.detailMounted=true; }
});

/* The operator's role, the same read the desktop bootstraps RA_POS from. It
   decides whether the Recap says the money out loud: a warehouse, dispatch or
   customer-service account sees its own queue without the revenue. Defaults to
   the full owner view when the read fails, which is what the desktop does too. */
async function loadMe(){
  try{
    const r=await fetch('/api/backend/me',{credentials:'same-origin',headers:{accept:'application/json'}});
    if(!r.ok) return;
    const j=await r.json();
    const u=(j&&(j.user||j.data||j))||{};
    const POS=['store_manager','warehouse','customer_service','dispatch'];
    if(POS.includes(u.role)) state.pos=u.role;
  }catch(e){}
}
async function loadLive(){
  // Role first, and awaited: the Recap renders money rows or does not depending
  // on it, and a card that shows revenue for half a second before hiding it has
  // already shown it.
  await loadMe();
  // config → store name + currency (best-effort; keeps mock on any miss)
  try{ const cfg=await api('/config') || {};
    state.cfg=cfg;
    // Store name lives at brand.me_footer.wordmark_text; currency at currency.symbol.
    // (The old code read store_name/currency_symbol, which don't exist — so the app
    //  kept showing the fake "Maru Studio" and could render currency as [object Object].)
    const wm = cfg.brand && cfg.brand.me_footer && cfg.brand.me_footer.wordmark_text;
    if(wm) state.storeName = wm;
    const cur = cfg.currency;
    if(cur && typeof cur==='object' && cur.symbol) CUR = cur.symbol;
    else if(typeof cur==='string') CUR = cur;
  }catch(e){ if(String(e.message)==='auth') return; }
  // dashboard → KPIs + deltas. MUST scope to today (GZ date) — the endpoint
  // defaults to a trailing 30 days, so an unscoped call made the "Today" tiles
  // show 30-day totals (and killed the vs-typical-day baseline).
  const gzToday=new Date(Date.now()+8*3600*1000).toISOString().slice(0,10);
  try{ const d=await api('/dashboard?from='+gzToday+'&to='+gzToday); const k=d.kpi||d.kpis||d||{}; const b=d.baseline||{};
    const bl=d.baseline||null;
    const rev=Number(k.revenue||0), ord=Number(k.orders!=null?k.orders:0);
    const nc=Number(k.new_customers!=null?k.new_customers:(k.newCustomers||0));
    state.liveKpis=[
      // Whole yuan on the money tile the eye lands on first; the fen stays on
      // the average, where the number is small enough for it to mean something.
      [T('Revenue (all channels)','营收（全渠道）'), money0(CUR,rev), deltaText(rev, b.revenue, bl)],
      [T('Orders (storefront)','订单（自营）'), String(ord), deltaText(ord, b.orders, bl)],
      // The server sends no baseline for average order value, so this tile has
      // nothing to compare against and says nothing — rather than printing a
      // comparison label with no comparison under it.
      [T('Avg. order','客单价'), money(CUR, ord? rev/ord : 0), ''],
      [T('New customers','新客'), String(nc), deltaText(nc, b.new_customers, bl)],
    ];
    // "Orders awaiting shipment" = paid-but-not-shipped. The dashboard exposes the
    // per-status counts under `funnel` (the old code read `byStatus`, which doesn't
    // exist, so this number was always the fake fallback). Prefer the dedicated
    // order-status-counts endpoint below; fall back to the dashboard funnel.
    const bs=d.funnel||d.byStatus||{};
    state.liveAttn={ ship:(bs.paid?bs.paid.n:null), reviews:null, low:null };
  }catch(e){ if(String(e.message)==='auth') return; }
  // orders list (the heart of the app). The Recap no longer derives anything
  // from it — it reads the activity feed since you last left, like the desktop.
  try{ const rows=await api('/orders?limit=50');
    if(Array.isArray(rows)){ state.liveOrders=rows.map(mapOrderRow); DB.orders=state.liveOrders; }
  }catch(e){}
  // products
  try{ const rows=await api('/products?limit=50');
    if(Array.isArray(rows)&&rows.length){ DB.products=rows.map(mapProduct); state.liveProductsLoaded=true; }
  }catch(e){}
  // reviews (inbox)
  try{ const rv=await api('/reviews?limit=30'); const list=Array.isArray(rv)?rv:(rv.reviews||[]);
    if(list.length){ DB.reviews=list.map(mapReview); state.liveAttn=Object.assign({},state.liveAttn,{reviews:list.filter(r=>!(r.reply&&String(r.reply).trim())).length}); }
  }catch(e){}
  // low-stock count for the Home attention row
  // Low = a shelf that needs buying back. A draft is neither low nor out, so
  // counting everything that is not 'on' would put unpublished work in it.
  try{ state.liveAttn=Object.assign({},state.liveAttn||{},{low:DB.products.filter(p=>p.kind==='restock'||p.kind==='off').length}); }catch(e){}
  render();

  // ---- secondary screens: fetch in parallel, each falls back to its sample data ----
  const set=(fn)=>{ try{ fn(); }catch(e){} render(); };

  // order status + channel counts → real filter-chip numbers + Home "awaiting shipment"
  api('/order-status-counts').then(d=>set(()=>{ if(d){ state.liveStatusCounts=d;
    const ship=(d.paid||0)+(d.preparing||0);
    state.liveAttn=Object.assign({},state.liveAttn||{},{ship});
  }})).catch(()=>{});
  api('/order-channel-counts').then(d=>set(()=>{ if(d) state.liveChannelCounts=d; })).catch(()=>{});

  loadOps();
  api('/setup').then(d=>set(()=>{ if(d&&d.percent!=null) state.setup=d; })).catch(()=>{});
  api('/delivery-zones').then(r=>set(()=>{ if(Array.isArray(r)) state.zones=r; })).catch(()=>{});
  api('/stores').then(r=>set(()=>{ if(Array.isArray(r)) state.stores=r.filter(s=>s.is_active==null||s.is_active); })).catch(()=>{});
  api('/categories').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.categories=r.map(mapCategory); })).catch(()=>{});
  api('/purchases').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.purchasing=r.map(mapPurchase); })).catch(()=>{});
  api('/activity').then(r=>set(()=>{ const rows=(r&&r.rows)||(Array.isArray(r)?r:null); if(rows&&rows.length) DB.activity=rows.slice(0,20).map(mapActivity); })).catch(()=>{});
  // apiRaw, not api: the chip counts ride the envelope beside `data`, and
  // api() returns `data` alone — so liveInvoiceCounts was never once set and
  // the chips kept showing the mock's 214 / 198 / 16.
  apiRaw('/invoices').then(r=>set(()=>{ const rows=(r&&r.data)||[]; state.invLoaded=true;
    if(rows.length) DB.invoices=rows.map(mapInvoice); else DB.invoices=[];
    if(r&&r.counts) state.liveInvoiceCounts=r.counts; })).catch(()=>{});
  api('/vouchers').then(r=>set(()=>{ if(Array.isArray(r)&&r.length){ DB.coupons=r.map(mapVoucher);
    DB.coupons.forEach(c=>{ if(state.sw['c_'+c.code]===undefined) state.sw['c_'+c.code]=c.on; }); } })).catch(()=>{});
  api('/flash-sales').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.flash=r.map(mapFlash); })).catch(()=>{});
  api('/broadcasts').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.broadcasts=r.map(mapBroadcast); })).catch(()=>{});
  api('/feedback').then(r=>set(()=>{ const rows=Array.isArray(r)?r:(r&&r.data); if(rows) DB.feedback=rows.map(mapFeedback); })).catch(()=>{});
  api('/polls').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.votes=r.map(mapPoll); })).catch(()=>{});

  // membership: tier counts (+ static ladder names) and recent members
  api('/tier-counts').then(d=>set(()=>{ if(d&&typeof d==='object'){
    DB.tiers=['tree','root','sprout','seed'].filter(k=>d[k]!=null).map(k=>({tier:TIER_NAMES[k],pts:TIER_PTS[k],members:String(d[k]),kind:(k==='tree'||k==='root')?'gold':'off'}));
  }})).catch(()=>{});
  api('/customers?sort=recent_signup&pageSize=6').then(r=>set(()=>{ const rows=Array.isArray(r)?r:(r&&r.data); if(rows&&rows.length) DB.members=rows.map(mapMember); })).catch(()=>{});

  // wallet activity + leaderboard + sales channels
  api('/topup-transactions?limit=20').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.wallet=r.map(mapWallet); })).catch(()=>{});
  api('/leaderboard/preview').then(d=>set(()=>{ const rows=d&&(d.revealed_entries||d.raw_entries); if(rows&&rows.length)
    DB.leaderboard=rows.map(e=>({rank:String(e.rank),name:[e.name||e.nickname||'—',e.name||e.nickname||'—'],pts:Number(e.value||0).toLocaleString()})); })).catch(()=>{});
}

document.documentElement.setAttribute('data-theme',state.theme);
render();
/* Lucide loads async — re-render once its icon set is ready so glyphs fill in. */
if(!(window.lucide && window.lucide.icons)){
  let n=0; const iv=setInterval(()=>{ if((window.lucide&&window.lucide.icons)||++n>60){ clearInterval(iv); render(); } },80);
}
/* Hydrate with live data when served from the store backend. On file:// / static
   preview the fetches fail and the app stays on its sample data — by design. */
loadLive();
</script>
</body>
</html>
