<style>
/* ===========================================================================
   Tacet Mobile — monitoring-first phone companion.
   1:1 with Mobile Shell.dc.html: single live language (toggle), Lucide icons,
   The Recap in Inter (NEVER Fraunces — Fraunces is marketing-only in Tacet).
   Tokens inlined from the Tacet design system so this file is self-contained.
   =========================================================================== */
:root{
  --paper:#FBF9F4; --ink:#111A2B; --graphite:#58606E; --dusk:#6E67AF; --sage:#A3B49F;
  --amber:#C9954A; --brick:#B4533E;
  --dusk-tint:#EEEDF6; --sage-tint:#EDF1EC; --amber-tint:#F7EEDE; --brick-tint:#F6E7E3;
  --raised:#F6F3EC; --border:#E4E0D5; --dusk-hover:#605AA0; --dusk-press:#524C8C;
  /* The row surface for a record nobody on the team has opened yet. Deliberately
     LIGHTER than a header band: an unseen row is transient content and must never
     read as heavy as the page's own chrome. Pairs with a Sage left edge drawn as an
     inset shadow, never a border — a marker that resizes its row makes the list
     jump as records get opened. */
  --unseen:#F4F5F0;

  --bg:var(--paper); --surface-card:#FFFFFF; --surface-raised:var(--raised); --surface-dark:var(--ink);
  --text-primary:var(--ink); --text-secondary:var(--graphite); --text-caption:var(--graphite);
  --border-default:var(--border); --border-strong:var(--graphite); --border-focus:var(--dusk);
  --accent:var(--dusk); --accent-hover:var(--dusk-hover); --accent-press:var(--dusk-press); --accent-tint:var(--dusk-tint);
  --success:var(--sage); --warning:var(--amber); --danger:var(--brick);
  --radius-card:14px;

  --ease-settle:cubic-bezier(0.16,1,0.3,1);
  --font-ui:'Inter','Noto Sans SC','Source Han Sans SC',-apple-system,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:var(--ink); --surface-card:#182236; --surface-raised:#1E2A40; --surface-dark:#0B121F;
  --text-primary:var(--paper); --text-secondary:#9AA2B0; --text-caption:#9AA2B0;
  --border-default:#263149; --border-strong:#3A455D;
  --unseen:#182329;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E9E5DC;font-family:var(--font-ui);color:var(--text-primary)}
button,input,textarea{font-family:inherit}

#app{position:relative;display:flex;flex-direction:column;overflow:hidden;
  width:100vw;height:100vh;height:100dvh;background:var(--bg);color:var(--text-primary)}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  #app{width:402px;height:min(874px,calc(100vh - 48px));border-radius:44px;
       box-shadow:0 24px 70px rgba(17,26,43,.28),0 0 0 11px #1c1c1e,0 0 0 12px #2c2c2e}
}

@keyframes tBreathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes tSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes tFade{from{opacity:0}to{opacity:1}}
@keyframes tRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.breathe{animation:tBreathe 2.4s ease-in-out infinite}
.rise{animation:tRise .5s var(--ease-settle) both}
.hscroll{scrollbar-width:none;-ms-overflow-style:none;overflow-x:auto}
.hscroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}

.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 6px 12px 16px;border-bottom:1px solid var(--border-default);background:var(--bg)}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.tabbar{flex:none;display:flex;background:var(--surface-card);border-top:1px solid var(--border-default);
  padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 12px)}
.iconbtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:8px}
.card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px}
.card.unseen{background:var(--unseen);box-shadow:inset 4px 0 0 var(--sage);
  transition:background .6s var(--ease-settle), box-shadow .6s var(--ease-settle)}
.list{background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px;overflow:hidden}
.sep{height:1px;background:var(--border-default)}
.eyebrow{font-size:13px;font-weight:500;color:var(--text-secondary)}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;padding:12px 16px;background:transparent;
  border:none;cursor:pointer;text-align:left;color:var(--text-primary);font-family:inherit}
.rowico{width:36px;height:36px;border-radius:8px;background:var(--surface-raised);display:flex;align-items:center;
  justify-content:center;color:var(--text-secondary);flex:none}
.num{font-variant-numeric:tabular-nums}
.btn2{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border-default);background:transparent;
  color:var(--text-primary);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn2:disabled{opacity:.55;cursor:default}
.cta{width:100%;min-height:44px;padding:12px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;
  font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s var(--ease-settle)}
.cta:hover{background:var(--accent-hover)}.cta:active{background:var(--accent-press)}
.scrim{position:absolute;inset:0;background:rgba(17,26,43,.38);animation:tFade .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-card);
  border-top-left-radius:14px;border-top-right-radius:14px;
  box-shadow:0 1px 2px rgba(17,26,43,.05), 0 4px 16px rgba(17,26,43,.04);
  animation:tSheetUp .4s var(--ease-settle) both;display:flex;flex-direction:column}
.grabber{width:38px;height:5px;border-radius:999px;background:var(--border-default);margin:6px auto 8px}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:400;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.stepbtn{width:44px;height:44px;border-radius:8px;background:var(--surface-raised);border:1px solid var(--border-default);
  display:flex;align-items:center;justify-content:center;color:var(--text-primary);cursor:pointer;flex:none}
.chip{display:flex;align-items:center;gap:8px;flex:none;height:44px;padding:0 16px;border-radius:999px;font-size:13px;
  cursor:pointer;font-family:inherit;white-space:nowrap;border:1px solid var(--border-default);
  background:var(--surface-card);color:var(--text-secondary)}
.chip.on{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}
.chip .c{font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
.i svg,svg.i{display:block;flex:none}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;z-index:60;background:var(--text-primary);
  color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;white-space:nowrap;
  box-shadow:0 6px 20px rgba(17,26,43,.22);animation:tFade .2s ease both}
input,textarea{padding:12px 14px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-card);
  color:var(--text-primary);font-size:15px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--border-focus)}
</style>

"use strict";
/* ---- Lucide icon → inline SVG string (same builder as the mockup) ---- */
function ic(name, size, stroke){
  size = size||20; stroke = stroke||1.75;
  const L = window.lucide;
  const P = String(name).replace(/(^|-)([a-z])/g,(_,__,c)=>c.toUpperCase());
  const node = L && L.icons && L.icons[P];
  const kids = node && Array.isArray(node[2]) ? node[2] : [];
  const inner = kids.map(([t,a])=>`<${t} ${Object.keys(a).map(k=>`${k}="${a[k]}"`).join(' ')}/>`).join('');
  return `<svg class="i" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
/* The Tacet WaveMark (signature) — matches the design-system mark path exactly. */
const WAVE = (w,color)=>`<svg width="${w}" height="${(w*0.324).toFixed(0)}" viewBox="0 0 340 110" fill="none" aria-label="tacet" style="display:block">
  <path d="M20 55 C30 15, 40 95, 50 55 C59 22, 68 88, 77 55 C85 30, 93 80, 101 55 C109 38, 117 72, 125 55 C133 44, 141 66, 149 55 C160 50, 171 60, 182 55 C215 55, 260 55, 305 55"
   stroke="${color||'var(--text-primary)'}" stroke-width="3.5" stroke-linecap="round"/>${color?'':'<circle cx="305" cy="55" r="6" fill="#6E67AF"/>'}</svg>`;

/* ---- single live language (EN default), toggled from the overflow menu ---- */

  danger:['rgba(180,83,62,0.15)','#B4533E'],
  muted:['rgba(88,96,110,0.06)','var(--text-secondary)'],
};
const KIND2PILL = {paid:'clear',pending:'clear',preparing:'clear',cancelled:'clear',draft:'clear',
  delivered:'success',dispatched:'success',live:'success',on:'success',
  restock:'warning',gold:'warning',refund:'danger',view:'muted',off:'muted'};
function pill(kind, label){ const [bg,fg]=PILL[KIND2PILL[kind]||'clear']; return `<span class="pill" style="background:${bg};color:${fg}">${label}</span>`; }
function toggle(on, onClick){
  return `<button onclick="${onClick}" aria-label="Toggle" style="width:44px;height:26px;border-radius:999px;
    background:${on?'var(--accent)':'var(--border-strong)'};position:relative;border:none;cursor:pointer;flex:none;transition:background .2s var(--ease-settle)">
    <span style="position:absolute;top:3px;left:${on?'21px':'3px'};width:20px;height:20px;border-radius:50%;background:#fff;
    transition:left .2s var(--ease-settle);box-shadow:0 1px 3px rgba(0,0,0,.25)"></span></button>`;
}

function copyText(t){
  if(!t) return;
  const done=()=>showToast(T('Copied','已复制'));
  const fallback=()=>{ try{
      const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
    }catch(e){ showToast(T('Could not copy','复制失败')); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(fallback);
  else fallback();
}

/* The chips used to filter the fifty rows that happened to be loaded, which is

   list says how much of the set it is showing. */
const STATUS_PARAM={all:'',paid:'paid',preparing:'preparing',dispatched:'dispatched',
  delivered:'delivered',restock:'awaiting_restock',refund:'refunds_open',pending:'pending_payment'};
const CHANNEL_PARAM={all:'',miniapp:'wechat',web:'web',meituan:'meituan',gzgrocery:'gzgrocery',manual:'manual'};
const ORDERS_PAGE=25;
function ordersQuery(offset){
  const qs=new URLSearchParams();
  const st=STATUS_PARAM[state.statusF]||''; if(st) qs.set('status',st);
  const ch=CHANNEL_PARAM[state.channelF]||''; if(ch) qs.set('channel',ch);
  if(state.orderQ) qs.set('q',state.orderQ);
  if(state.storeF&&state.storeF!=='all') qs.set('store_id',state.storeF);
  qs.set('limit',ORDERS_PAGE); qs.set('offset',offset||0);
  return qs.toString();
}
async function loadOrdersPage(more){
  const offset=more?((state.ordersView||[]).length):0;
  state.ordersLoading=true; if(!more){ state.ordersView=null; } render();
  try{
    const j=await apiRaw('/orders?'+ordersQuery(offset));
    const rows=(j&&j.data)||[];
    const mapped=rows.map(mapOrderRow);
    state.ordersView=more?(state.ordersView||[]).concat(mapped):mapped;
    state.liveOrders=state.ordersView;
    const total=j&&j.meta&&j.meta.total;
    state.ordersTotal=(total!=null)?total:null;
    state.ordersMore=(total!=null)?state.ordersView.length<total:rows.length===ORDERS_PAGE;
  }catch(e){
    if(String(e.message)==='auth') return;
    // Offline / static preview: the sample set stands in, unfiltered and honest
    // about it — no counts, no "load more".
    if(!more){ state.ordersView=DB.orders.slice(); state.ordersTotal=null; state.ordersMore=false; }
  }
  state.ordersLoading=false; render();
}
function ordersFiltered(){ return state.ordersView||DB.orders; }

/* One source for setup progress, and it is the server's. The card used to
   compute a percentage from a hardcoded list of steps, so every store on earth
   read "50% set up · 3 steps left" whatever it had actually done. */
function setupState(){
  const d=state.setup;
  if(d) return {pct:d.percent, done:d.requiredDone, total:d.requiredTotal, left:Math.max(0,d.requiredTotal-d.requiredDone), real:true};
  return {pct:null, real:false};
}

function settingsGroupCard(rows){
  const ctl=r=> r.printer
      ? (state.printer
          ? toggle(!!state.printer.auto_print,"APP.cmd('togglePrint')")
          : `<span style="font-size:13px;color:var(--text-secondary)">${T('Loading…','加载中…')}</span>`)
      : r.fapiao
      ? (state.fapiao
          ? toggle(!!state.fapiao.autoIssue,"APP.cmd('toggleFapiao')")
          : `<span style="font-size:13px;color:var(--text-secondary)">${T('Loading…','加载中…')}</span>`)
      : r.feat ? (state.featBusy===r.feat
          ? `<span style="font-size:13px;color:var(--text-secondary)">${T('Saving…','保存中…')}</span>`
          : toggle(featOn(r.feat),`APP.cmd('toggleFeature','${r.feat}')`))
      : `<span style="font-size:15px;color:var(--text-secondary);white-space:nowrap">${r.value}</span>`;
  return `<div class="list">${rows.map((r,i)=>`${i?'<div class="sep" style="margin-left:14px"></div>':''}
    <div style="display:flex;align-items:center;gap:16px;padding:12px 16px;min-height:56px"><span style="flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.label}</span>
    ${ctl(r)}</div>`).join('')}
    ${state.printerErr&&rows.some(r=>r.printer||r.fapiao)?`<div style="padding:12px 16px;font-size:13px;color:var(--brick);background:var(--brick-tint)">${state.printerErr}</div>`:''}</div>`;
}

/* Pausing a coupon is the one marketing action a phone should have: it is a
   single field on a single record, and it is what an operator reaches for when
   a code is being abused. Creating one is authoring, and stays on the desktop. */
function toggleCoupon(code){
  const c=(DB.coupons||[]).find(x=>x.code===code);
  if(!c||c.id==null||state.couponBusy) return;
  const next=!c.on;
  state.couponBusy=code; state.couponErr=null; render();
  apiWrite('/vouchers/'+c.id,{is_active:next},'PATCH').then(()=>{
    c.on=next; state.sw['c_'+code]=next; state.couponBusy=null; render();
    showToast(next?T('Coupon on','已启用'):T('Coupon paused','已暂停'));
  }).catch(e=>{
    state.couponBusy=null;
    if(String(e.message)==='auth') return;
    state.couponErr=T('That did not save. The coupon is unchanged.','没有保存成功。优惠券没有变化。'); render();
  });
}
/* A scheduled broadcast can still be stopped; a sent one cannot. The server is
   the judge — it refuses anything already on its way out. */
function recallBroadcast(id){
  const b=(DB.broadcasts||[]).find(x=>x.id===id);
  if(!b||state.bcBusy) return;
  state.bcBusy=id; state.bcErr=null; render();
  apiWrite('/broadcasts/'+id+'/recall',{}).then(r=>{
    const st=(r&&r.data&&r.data.status)||'cancelled';
    b.st=st; b.status=st==='cancelled'?['Cancelled','已取消']:['Sent','已发送']; b.kind=st==='cancelled'?'off':'delivered';
    state.bcBusy=null; render();
    showToast(st==='cancelled'?T('Send cancelled','已取消发送'):T('It had already gone out','已经发送完成'));
  }).catch(e=>{
    state.bcBusy=null;
    if(String(e.message)==='auth') return;
    state.bcErr=T('That did not go through. Nothing has changed.','没有成功。数据没有变化。'); render();
  });
}
async function loadMirror(which){
  if(state.mirrorLoading===which) return;
  state.mirrorLoading=which; state.mirror=state.mirror||{}; render();
  try{
    if(which==='meituan'){
      const rows=await api('/meituan/orders?limit=30');
      state.mirror.meituan=(Array.isArray(rows)?rows:[]).map(r=>({
        id:r.order_no||('#'+r.id), cust:r.recipient_name||'—', total:money(CUR,r.total),
        when:fmtDay(r.placed_at), store:T(r.store_name_en||r.store_code||'',r.store_name_cn||r.store_name_en||''),
        items:(r.items||[]).length}));
    } else {
      const d=await api('/guanyi/pickups');
      const recent=(d&&d.recent)||[];
      state.mirror.gzgrocery=recent.slice(0,30).map(r=>({
        id:T(r.name_en||r.name_cn||'—', r.name_cn||r.name_en||'—'),
        cust:r.product_sku?('SKU '+r.product_sku):'', total:(r.inferred_pickup!=null?('×'+r.inferred_pickup):''),
        when:fmtDay(r.created_at), store:'', items:0}));
      state.mirrorMode=(d&&d.mode)||null;
    }
  }catch(e){ if(String(e.message)==='auth') return; state.mirror[which]=null; }
  state.mirrorLoading=null; render();
}

const ORDER_NEXT={
  paid:            {to:'preparing',  en:'Start preparing',  zh:'开始备货',  busyEn:'Starting…',  busyZh:'处理中…'},
  awaiting_restock:{to:'preparing',  en:'Restocked · start preparing', zh:'已补货 · 开始备货', busyEn:'Starting…', busyZh:'处理中…'},
  preparing:       {to:'dispatched', en:'Mark dispatched',  zh:'标记已发货', busyEn:'Marking…',  busyZh:'处理中…'},
  dispatched:      {to:'delivered',  en:'Mark delivered',   zh:'标记送达',  busyEn:'Marking…',  busyZh:'处理中…'},
};
/* A pickup order walks the same machine with a different journey: dispatched is
   "ready at the counter" and delivered is "the customer came and took it". The
   desktop relabels both; so does this, or the phone tells a counter to dispatch
   something nobody is shipping. */
const ORDER_NEXT_PICKUP={dispatched:{en:'Mark ready for pickup',zh:'标记可取货'},delivered:{en:'Mark picked up',zh:'标记已取货'}};
/* pending_payment is deliberately absent: marking an off-app payment records
   WHICH tender it was, and guessing that from a phone would put "unknown" on
   the books. It stays a desktop action until the phone can ask. */
function orderNext(o){
  // A marketplace mirror is read at 100% legibility and acted on at 0%: the
  // platform drives it, and a button here would write into a queue we do not own.
  if(!o||o.viewOnly||!o.raw) return null;
  const n=ORDER_NEXT[o.raw]; if(!n) return null;
  const alt=o.pickup&&ORDER_NEXT_PICKUP[n.to];
  return alt?Object.assign({},n,alt):n;
}

/* A write helper that keeps the server's own words. api() throws away the body,
   and the body is where the reason lives. */
async function apiWrite(path, body, method){
  const r=await fetch(API+path,{method:method||'POST',credentials:'same-origin',
    headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify(body||{})});
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const e=new Error((j&&(j.message||j.error))||('HTTP '+r.status)); e.code=j&&j.error; throw e; }
  return j;
}
function orderErrorText(e){
  if(e.code==='__plain') return e.message;
  if(e.code==='invalid_transition') return T('This order has already moved on. Close and open it again to see where it is now.',

  if(e.code==='refund_already_processing'||e.code==='use_refund_payout') return e.message;
  if(e.code==='already_shipped') return T('A parcel already has a waybill, so this cannot be undone here. Cancel the waybill first.',
                                          '已有包裹生成运单，无法在此撤销。请先取消运单。');
  return T('That did not go through. Nothing has changed — try again.','没有成功。数据没有变化 — 请重试。');
}

function ageShort(v){
  const d=_date(v); if(!d) return '';
  const mins=Math.max(0,Math.round((Date.now()-d.getTime())/60000));
  if(mins<60) return T(mins+'m',mins+' 分');
  const h=Math.round(mins/60);
  if(h<48) return T(h+'h',h+' 小时');
  return T(Math.round(h/24)+'d',Math.round(h/24)+' 天');
}
function oldestMins(items){
  let oldest=null;
  for(const it of (items||[])){ const d=_date(it&&it.waiting_since); if(!d) continue; if(!oldest||d<oldest) oldest=d; }
  return oldest?Math.max(0,Math.round((Date.now()-oldest.getTime())/60000)):null;
}
function oldestOf(items){
  const m=oldestMins(items);
  if(m==null) return '';
  if(m<60) return T(m+'m',m+' 分');
  const h=Math.round(m/60);
  return h<48?T(h+'h',h+' 小时'):T(Math.round(h/24)+'d',Math.round(h/24)+' 天');
}
/* Severity, then oldest first, and a fire with no clock sorts last — a state
   cannot be ranked by how long it has waited. */
function opsFires(){
  const o=state.ops; if(!o) return null;
  const f=[];
  // Ranked by how long the oldest thing in each queue has waited, so a
  // two-day restock outranks a refund from an hour ago. A fire with no clock
  // (a stock state) sorts last: it cannot be ranked by waiting.
  const add=(cond,sev,icon,label,n,items,meta,go)=>{ if(cond) f.push({sev,icon,label,n,meta:meta||oldestOf(items),go,mins:oldestMins(items)}); };
  const c=k=>(o[k]&&o[k].count)||0;
  add(c('delivery_alerts'),'brick','truck',T('Delivery needs a call','配送需要跟进'),c('delivery_alerts'),o.delivery_alerts.items,'',"APP.cmd('ordersGo','dispatched')");
  add(c('payment_mismatch'),'brick','banknote',T("Payment doesn't match",'付款金额不符'),c('payment_mismatch'),o.payment_mismatch.items,'',"APP.cmd('ordersGo','pending')");
  add(c('refunds'),'amber','refund',T('Refunds waiting','退款待处理'),c('refunds'),o.refunds.items,'',"APP.cmd('ordersGo','refund')");
  add(c('unhandled'),'amber','package',T('Orders to start','待开始备货'),c('unhandled'),o.unhandled.items,'',"APP.cmd('ordersGo','paid')");
  add(c('awaiting_restock'),'amber','clock',T('Orders awaiting restock','订单待补货'),c('awaiting_restock'),o.awaiting_restock.items,'',"APP.cmd('ordersGo','restock')");
  add(c('invoices'),'amber','receipt',T('Invoices to issue','待开发票'),c('invoices'),o.invoices.items,'',"APP.cmd('push','invoices')");
  const oos=c('out_of_stock'), low=c('low_stock');
  if(oos+low){
    // The pill counts what is actually OUT; the line names the rest. One number
    // summing both would say 23 and mean neither.
    const state_=(oos&&low)?T(oos?'out of stock, '+low+' running low':'', '已售罄，另有 '+low+' 项库存不足')
      :oos?T('out of stock','已售罄'):T('running low','库存不足');
    f.push({sev:'amber',icon:'box',label:T('Restock needed','需要补货'),n:oos||low,meta:state_,go:"APP.cmd('tab','products')",mins:null});
  }
  const rank={brick:0,amber:1};
  f.sort((a,b)=>{
    const s=(rank[a.sev]??9)-(rank[b.sev]??9); if(s) return s;
    if(a.mins==null&&b.mins==null) return 0;
    if(a.mins==null) return 1;
    if(b.mins==null) return -1;
    return b.mins-a.mins;
  });
  return f;
}

function orderActionRow(o,isPO){
  if(isPO) return `<div style="display:flex;align-items:center;gap:8px;margin-top:12px">
    <button class="btn2" style="flex:1" onclick="APP.cmd('saveStock')">${T('Receive stock','入库')}</button></div>`;
  if(o._id==null) return '';   // sample data in the static preview: no live order to act on
  const next=orderNext(o);
  const busy=state.orderBusy;
  const undoable=['dispatched','delivered'].includes(o.raw);
  const refundOpen=['pending','reviewing'].includes(o.refundStatus);
  const refundApproved=o.refundStatus==='approved';
  const canPay=o.raw==='pending_payment'&&!o.viewOnly;
  const btns=[];
  if(canPay) btns.push(`<button class="btn2" style="flex:1;min-width:0" ${busy?'disabled':''} onclick="APP.cmd('markPaid')">${busy==='advance'?T('Marking…','处理中…'):T('Mark paid','标记已付款')}</button>`);
  else if(next) btns.push(`<button class="btn2" style="flex:1;min-width:0" ${busy?'disabled':''} onclick="APP.cmd('advance','${next.to}')">${busy==='advance'?T(next.busyEn,next.busyZh):T(next.en,next.zh)}</button>`);
  btns.push(`<button class="btn2" style="${next?'width:44px;padding:0;flex:none':'flex:1;gap:8px'}" ${busy?'disabled':''} onclick="APP.cmd('printOrder')" aria-label="${T('Reprint receipt','重打小票')}">${ic('printer',20)}${next?'':`<span>${busy==='print'?T('Printing…','打印中…'):T('Reprint receipt','重打小票')}</span>`}</button>`);
  if(undoable||refundOpen||refundApproved) btns.push(`<button class="btn2" style="width:44px;padding:0;flex:none" ${busy?'disabled':''} onclick="APP.cmd('detailActions')" aria-label="${T('More actions','更多操作')}">${ic('ellipsis',20)}</button>`);
  return `<div style="display:flex;align-items:center;gap:8px;margin-top:12px">${btns.join('')}</div>`;
}

function sheetActions(){
  const o=(state.liveDetail&&state.liveDetail.id===state.detailId)?state.liveDetail:findOrder(state.detailId);
  const wasDelivered=o&&o.raw==='delivered';
  const acts=[['printer',T('Reprint receipt','重打小票'),"APP.cmd('printOrder')"]];
  if(o&&['pending','reviewing'].includes(o.refundStatus)){
    acts.push(['check',T('Approve refund','通过退款'),"APP.cmd('approveRefund')"]);
    acts.push(['x',T('Reject refund','拒绝退款'),"APP.cmd('rejectRefund')"]);
  }
  if(o&&o.refundStatus==='approved') acts.push(['banknote',T('Pay the refund','打出退款'),"APP.cmd('payRefund')"]);
  if(o&&['dispatched','delivered'].includes(o.raw)){
    // Forward-only machine: without this, a mis-tap sits on the queue with only
    // a refund as the way out. The server refuses once a parcel has a waybill,
    // and that refusal is shown rather than swallowed.
    acts.push(['undo-2',wasDelivered?T('Undo delivery · back to preparing','撤销送达 · 退回备货'):T('Undo dispatch · back to preparing','撤销发货 · 退回备货'),"APP.cmd('undoDispatch')"]);
  }
  return `<div class="scrim" style="z-index:47;background:rgba(17,26,43,.30)" onclick="APP.cmd('closeActions')"></div>
   <div class="sheet" style="z-index:48;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 30px)"><div class="grabber" style="margin-bottom:10px"></div>
   ${acts.map(([i,l,c])=>`<button class="row" style="min-height:52px;padding:12px 20px" onclick="${c}"><span style="display:flex;flex:none;color:var(--text-secondary)">${ic(i)}</span><span style="flex:1;font-size:15px">${l}</span></button>`).join('')}</div>`;
}

/* ==========================================================================
   Customers — a Worklist that is not a queue. Records arrive, so a record
   nobody has opened wears the unseen surface; but nothing here is WAITING on
   an operator, so the header is the title alone. The strip under it carries
   the segments an operator actually reaches for, with real counts from the
   server; tier chips carry no counts because no endpoint gives them one.

const TIER_LABEL={tree:['Tree','大树'],root:['Root','根系'],sprout:['Sprout','嫩芽'],seed:['Seed','种子']};
function mapCustomer(r){
  return {
    id:r.id, name:r.nickname||'', phone:r.phone||'',
    tier:String(r.tier_key||'seed'),
    orders:Number(r.orders_count||0),
    spend:Number(r.lifetime_spend||0),
    seen:r.last_login_at||r.created_at,
    unseen:!r.seen_at, blocked:!!r.is_blocked,
  };
}
function custFiltered(){
  const t=state.custTier||'all';
  return (state.customers||[]).filter(c=>t==='all'||c.tier===t);
}
/* The pulse renders as one line, not tiles: four tiles cannot share a phone's
   width, and showing two of them would be an arbitrary subset. It renders only
   the figures the server actually returned. */
function custPulse(){
  const m=state.custMeta||{}; const bits=[];
  if(m.buyers!=null) bits.push(T(m.buyers+' buyers', m.buyers+' 位买家'));
  if(m.returnRate!=null) bits.push(T(m.returnRate+'% returning', m.returnRate+'% 复购'));
  if(m.never!=null) bits.push(T(m.never+' never ordered', m.never+' 位未下单'));
  return bits.join(' · ');
}
function custCard(c){
  const tier=TIER_LABEL[c.tier]||[c.tier,c.tier];

const TAB_META={home:{en:'Home',zh:'概览',icon:'house'},orders:{en:'Orders',zh:'订单',icon:'package'},

/* Unseen is one 6px Sage dot — never a count, never red. A count in the chrome
   turns arriving work into an alarm, and a record arriving is the CUSTOMER
   acting, not the system: it does not earn Dusk either. */
function unseenOrders(){ return DB.orders.some(o=>o.isNew); }
function unseenReviews(){ return DB.reviews.filter(r=>!state.reviewsSeen.has(r.cust[0])).length; }

  const unseen=unseenReviews();
  return `<div class="topbar">

      ${unseen?`<span style="position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 2px var(--surface-card)"></span>`:''}

function wireDrag(){
  const h=document.getElementById('dragHandle'); if(!h) return;
  let y0=0;
  const down=e=>{ state.dragging=true; y0=(e.touches?e.touches[0].clientY:e.clientY); };
  const move=e=>{ if(!state.dragging) return; const dy=Math.max(0,(e.touches?e.touches[0].clientY:e.clientY)-y0); const s=document.getElementById('detailSheet'); if(s) s.style.transform=`translateY(${dy}px)`; state.drag=dy; };
  const up=()=>{ if(!state.dragging) return; state.dragging=false; if(state.drag>110){ state.drag=0; state.detailId=null; render(); } else { state.drag=0; const s=document.getElementById('detailSheet'); if(s){ s.style.transition='transform .3s var(--ease-settle)'; s.style.transform='translateY(0)'; } } };
  h.addEventListener('pointerdown',down); window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  h.addEventListener('touchstart',down,{passive:true}); window.addEventListener('touchmove',move,{passive:true}); window.addEventListener('touchend',up);
}

/* ==========================================================================
   Live data — binds the core monitoring screens to the store backend's
   /api/retail-admin/* endpoints (same API the desktop admin uses). The page
   self-auths: a 401/403 bounces to the store root. Every map is defensive and
   falls back to the mock content above, so a shape change can never white-screen
   the app — the long-tail marketing/loyalty screens stay on sample data for now.
   ========================================================================== */
const API='/api/retail-admin';
async function api(path){
  const r=await fetch(API+path,{credentials:'same-origin',headers:{accept:'application/json'}});
  // Match the desktop backend's auth-fail target. Redirecting to '/' would loop
  // once the store root serves this app to phones (root → 401 → root → …).
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  return (j && j.data!==undefined) ? j.data : j;
}
/* The surface's language picks the date convention and then follows it
   completely: English renders US times (2:22 PM), Chinese renders 24-hour
   (14:22). There is no house style and no third format. The year appears only
   when the date is not in the current year. */
const _date=v=>{ if(!v) return null; const d=new Date(String(v).replace(' ','T')); return isNaN(d)?null:d; };
function fmtTime(v){ const d=_date(v); if(!d) return '';
  return LANG==='en' ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
                     : d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}); }
function fmtDay(v){ const d=_date(v); if(!d) return '';
  const now=new Date(), same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,now)) return fmtTime(v);
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(same(d,y)) return T('Yesterday','昨天');
  const thisYear=d.getFullYear()===now.getFullYear();
  return LANG==='en'
    ? d.toLocaleDateString('en-US', thisYear?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'})
    : (thisYear ? (d.getMonth()+1)+'月'+d.getDate()+'日'
                : d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'); }
async function apiRaw(path){
  const r=await fetch(API+path,{credentials:'same-origin',headers:{accept:'application/json'}});
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function loadCustomers(){

  const q='/customers?pageSize=50&withSegments=1'+(seg!=='all'?'&segment='+seg:'');
  try{
    const j=await apiRaw(q);
    const rows=(j&&j.data)||[];
    state.customers=rows.map(mapCustomer);
    if(j&&j.segments) state.custMeta=Object.assign({},state.custMeta||{},j.segments);
    state.custLoaded=true;
  }catch(e){
    if(String(e.message)==='auth') return;
    // Static preview / offline: the sample roster stands in, same as every other screen.
    state.customers=DB.customers.slice(); state.custLoaded=true;
  }

}

async function loadCustomerMeta(){

      if(j.customers_on_file!=null) m.never=Math.max(0,j.customers_on_file-j.returning.buyers);

async function loadLive(){

  try{ const cfg=await api('/config') || {};
    state.cfg=cfg;

    // (The old code read store_name/currency_symbol, which don't exist — so the app
    //  kept showing the fake "Maru Studio" and could render currency as [object Object].)
    const wm = cfg.brand && cfg.brand.me_footer && cfg.brand.me_footer.wordmark_text;
    if(wm) state.storeName = wm;

    else if(typeof cur==='string') CUR = cur;

  // dashboard → KPIs + deltas. MUST scope to today (GZ date) — the endpoint
  // defaults to a trailing 30 days, so an unscoped call made the "Today" tiles
  // show 30-day totals (and killed the vs-typical-day baseline).
  const gzToday=new Date(Date.now()+8*3600*1000).toISOString().slice(0,10);
  try{ const d=await api('/dashboard?from='+gzToday+'&to='+gzToday); const k=d.kpi||d.kpis||d||{}; const b=d.baseline||{};
    const vy=T('vs a typical day','较日常');
    const dl=x=>x&&x.delta!=null?((x.delta>=0?'+':'−')+Math.abs(x.delta)+'% '+vy):vy;
    state.liveKpis=[
      [T('Revenue (all channels)','营收（全渠道）'), money(CUR,k.revenue), dl(b.revenue)],
      [T('Orders (storefront)','订单（自营）'), String(k.orders!=null?k.orders:0), dl(b.orders)],
      [T('Avg. order','客单价'), money(CUR, k.orders? (Number(k.revenue||0)/k.orders):0), vy],
      [T('New customers','新客'), String(k.new_customers!=null?k.new_customers:(k.newCustomers||0)), dl(b.new_customers)],
    ];
    // "Orders awaiting shipment" = paid-but-not-shipped. The dashboard exposes the
    // per-status counts under `funnel` (the old code read `byStatus`, which doesn't
    // exist, so this number was always the fake fallback). Prefer the dedicated
    // order-status-counts endpoint below; fall back to the dashboard funnel.
    const bs=d.funnel||d.byStatus||{};
    state.liveAttn={ ship:(bs.paid?bs.paid.n:null), reviews:null, low:null };
  }catch(e){ if(String(e.message)==='auth') return; }
  // orders list (the heart of the app)
  try{ const rows=await api('/orders?limit=50');
    if(Array.isArray(rows)&&rows.length){
      // Overnight recap from raw timestamps: last night 22:00 → 08:00 today (or now, if earlier).
      // gzgrocery rows are display-only wholesale-pickup mirrors (see routes/retail.js
      // dashboard route) — they're excluded from every other order/revenue count in the
      // app, so they must be excluded here too, or a quiet storefront night reads as sales.
      // Cancelled/refunded orders don't belong in a "while you slept" recap either.
      const RECAP_STATUSES=new Set(['paid','preparing','dispatched','delivered','awaiting_restock']);
      try{ const now=new Date();
        const end=new Date(now); end.setHours(8,0,0,0);
        const start=new Date(end); start.setDate(start.getDate()-1); start.setHours(22,0,0,0);
        const cutoff=now<end?now:end; let n=0, rev=0;
        rows.forEach(r=>{ if(r.channel==='gzgrocery'||!RECAP_STATUSES.has(r.status)) return;
          const t=new Date(String(r.placed_at||'').replace(' ','T'));
          if(!isNaN(t)&&t>=start&&t<=cutoff){ n++; rev+=Number(r.total||0); } });
        state.liveRecap={orders:n, revenue:rev};
      }catch(e){}
      state.liveOrders=rows.map(mapOrderRow); DB.orders=state.liveOrders;
    }
  }catch(e){}
  // products
  try{ const rows=await api('/products?limit=50');
    if(Array.isArray(rows)&&rows.length){ DB.products=rows.map(mapProduct); state.liveProductsLoaded=true; }
  }catch(e){}
  // reviews (inbox)
  try{ const rv=await api('/reviews?limit=30'); const list=Array.isArray(rv)?rv:(rv.reviews||[]);
    if(list.length){ DB.reviews=list.map(mapReview); state.liveAttn=Object.assign({},state.liveAttn,{reviews:list.filter(r=>!(r.reply&&String(r.reply).trim())).length}); }
  }catch(e){}
  // low-stock count for the Home attention row
  try{ state.liveAttn=Object.assign({},state.liveAttn||{},{low:DB.products.filter(p=>p.kind!=='on').length}); }catch(e){}
  render();

  // ---- secondary screens: fetch in parallel, each falls back to its sample data ----
  const set=(fn)=>{ try{ fn(); }catch(e){} render(); };

  // order status + channel counts → real filter-chip numbers + Home "awaiting shipment"
  api('/order-status-counts').then(d=>set(()=>{ if(d){ state.liveStatusCounts=d;
    const ship=(d.paid||0)+(d.preparing||0);
    state.liveAttn=Object.assign({},state.liveAttn||{},{ship});
  }})).catch(()=>{});
  api('/order-channel-counts').then(d=>set(()=>{ if(d) state.liveChannelCounts=d; })).catch(()=>{});

  loadOps();
  api('/setup').then(d=>set(()=>{ if(d&&d.percent!=null) state.setup=d; })).catch(()=>{});
  api('/delivery-zones').then(r=>set(()=>{ if(Array.isArray(r)) state.zones=r; })).catch(()=>{});
  api('/stores').then(r=>set(()=>{ if(Array.isArray(r)) state.stores=r.filter(s=>s.is_active==null||s.is_active); })).catch(()=>{});
  api('/categories').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.categories=r.map(mapCategory); })).catch(()=>{});
  api('/purchases').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.purchasing=r.map(mapPurchase); })).catch(()=>{});
  api('/activity').then(r=>set(()=>{ const rows=(r&&r.rows)||(Array.isArray(r)?r:null); if(rows&&rows.length) DB.activity=rows.slice(0,20).map(mapActivity); })).catch(()=>{});
  api('/invoices').then(r=>set(()=>{ const rows=Array.isArray(r)?r:(r&&r.data); if(rows&&rows.length) DB.invoices=rows.map(mapInvoice); if(r&&r.counts) state.liveInvoiceCounts=r.counts; })).catch(()=>{});
  api('/vouchers').then(r=>set(()=>{ if(Array.isArray(r)&&r.length){ DB.coupons=r.map(mapVoucher);
    DB.coupons.forEach(c=>{ if(state.sw['c_'+c.code]===undefined) state.sw['c_'+c.code]=c.on; }); } })).catch(()=>{});
  api('/flash-sales').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.flash=r.map(mapFlash); })).catch(()=>{});
  api('/broadcasts').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.broadcasts=r.map(mapBroadcast); })).catch(()=>{});
  api('/feedback').then(r=>set(()=>{ const rows=Array.isArray(r)?r:(r&&r.data); if(rows) DB.feedback=rows.map(mapFeedback); })).catch(()=>{});
  api('/polls').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.votes=r.map(mapPoll); })).catch(()=>{});

  // membership: tier counts (+ static ladder names) and recent members
  api('/tier-counts').then(d=>set(()=>{ if(d&&typeof d==='object'){
    DB.tiers=['tree','root','sprout','seed'].filter(k=>d[k]!=null).map(k=>({tier:TIER_NAMES[k],pts:TIER_PTS[k],members:String(d[k]),kind:(k==='tree'||k==='root')?'gold':'off'}));
  }})).catch(()=>{});
  api('/customers?sort=recent_signup&pageSize=6').then(r=>set(()=>{ const rows=Array.isArray(r)?r:(r&&r.data); if(rows&&rows.length) DB.members=rows.map(mapMember); })).catch(()=>{});

  // wallet activity + leaderboard + sales channels
  api('/topup-transactions?limit=20').then(r=>set(()=>{ if(Array.isArray(r)&&r.length) DB.wallet=r.map(mapWallet); })).catch(()=>{});
  api('/leaderboard/preview').then(d=>set(()=>{ const rows=d&&(d.revealed_entries||d.raw_entries); if(rows&&rows.length)
    DB.leaderboard=rows.map(e=>({rank:String(e.rank),name:[e.name||e.nickname||'—',e.name||e.nickname||'—'],pts:Number(e.value||0).toLocaleString()})); })).catch(()=>{});
  api('/sales/summary').then(d=>set(()=>{ const ch=d&&d.channels; if(ch){
    DB.salesChannels=['wechat','web','meituan','gzgrocery','eleme'].filter(k=>ch[k]).map(k=>mapSalesChannel(k,ch[k])); } })).catch(()=>{});
}

document.documentElement.setAttribute('data-theme',state.theme);
render();
/* Lucide loads async — re-render once its icon set is ready so glyphs fill in. */
if(!(window.lucide && window.lucide.icons)){
  let n=0; const iv=setInterval(()=>{ if((window.lucide&&window.lucide.icons)||++n>60){ clearInterval(iv); render(); } },80);
}
/* Hydrate with live data when served from the store backend. On file:// / static
   preview the fetches fail and the app stays on its sample data — by design. */
loadLive();
</script>
</body>
</html>
