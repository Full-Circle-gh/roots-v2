    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${tile(T('Friends joined','好友加入'),total,vs)}
      ${tile(T('First orders','首单转化'),conv,T(pct+'% converted',pct+'% 转化'))}
      ${tile(T('Rewards paid','已发奖励'),money0(CUR,paid),paidSub)}
      ${tile(T('Still earning','持续分成'),Number(a.still_earning||0),T('within lifetime window','在分成周期内'))}</div>`;
  };
  const ledger = state.affErr
    ? `<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
        <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
        <span style="font-size:14px;color:var(--brick-ink)">${state.affErr}</span></div>`
    : !rows ? `<div style="padding:30px 16px;text-align:center;font-size:14px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`
    : !rows.length ? `<div style="padding:30px 16px;text-align:center;font-size:14px;color:var(--text-secondary);line-height:1.55">${
        seg ? T('None match.','没有匹配项。')
            : T('No referrals yet. When a customer shares their code and a friend joins, they show up here.','暂无推荐记录。顾客分享邀请码、好友加入后会显示在这里。')}</div>`
    : `<div class="list">${rows.map((r,i)=>`${i?'<div class="sep" style="margin-left:14px"></div>':''}${affRow(r)}`).join('')}</div>`;
  return `<div style="padding:14px 0 24px;display:flex;flex-direction:column;gap:14px">
    <div style="padding:0 16px">${tiles()}</div>
    ${chipRow(chips,seg,'affSeg')}
    <div style="padding:0 16px">${ledger}</div>
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:12px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px;padding:14px">
        <span style="flex:1;font-size:15px">${busy?T('Saving…','保存中…'):T('Referrals on','推荐已开启')}</span>${toggle(featOn('affiliate'),"APP.cmd('toggleFeature','affiliate')")}</div>
      ${state.featErr?`<div style="font-size:14px;color:var(--brick-ink)">${state.featErr}</div>`:''}
      ${noteBar(T('Reward amounts, the lifetime share, and voiding a referral are on desktop.','奖励金额、长期分成与作废推荐在电脑端处理。'))}</div></div>`;
}

/* ==========================================================================
   Editor — what the shop's pages are actually made of (desktop: cms.html)
   --------------------------------------------------------------------------
   This screen was a drawing. A grey wireframe of a page, a hard-coded
   "Published" pill, and four section names typed into the source — Hero
   banner, Featured products, Categories, Flash sale strip — which a shop may
   or may not have, in that or any other order. It told an operator their home
   page was published without asking anything, and described a layout it had
   never seen.

   It reads /cms/layout now: the live blocks in their real order, and the one
   fact the desktop composer leads with — whether the draft differs from what
   is live, i.e. whether somebody's edits are sitting unpublished. Composing is
   a drag-and-drop canvas and stays there.
   ========================================================================== */
const CMS_PAGES=[['home','Home','首页'],['promotions','Promotions','促销'],
  ['membership','Membership','会员'],['categories','Categories','分类'],['onboarding','Onboarding','引导']];
/* The composer's own names for its blocks (cms.html BLOCK_META), so the phone
   never invents a label for something an operator placed by a different one. */
const CMS_BLOCK={
  announcement_bar:['Announcement bar','公告栏'], hero_banner:['Hero banner','主图横幅'],
  category_tabs:['Category tabs','分类标签'], featured_item:['Featured item','精选单品'],
  product_grid:['Product grid','商品网格'], spacer:['Spacer','间距'],
  countdown_timer:['Countdown timer','倒计时'], flash_sale_strip:['Flash sale','限时秒杀'],
  coupon_block:['Coupon','优惠券'], points_widget:['Points','积分'], top_up:['Top up','充值'],
  review_card:['Review','评价'], store_info:['Stores','门店'], voting_block:['Voting','投票'],
  affiliate_block:['Refer a friend','邀请好友'], greeting:['Greeting','问候语'],
  kitchen_status:['Kitchen status','厨房状态'], recipe_story:['Recipe story','食谱故事'],
  bundle:['Bundle','套装'], wecom_contact:['Add us on WeCom','添加企业微信'],
  favorites_block:['Favorites','收藏'], leaderboard:['Leaderboard','排行榜'],
  video_banner:['Video banner','视频横幅'], order_tracker:['Order tracker','订单追踪'],
  notification_bar:['Notification bar','通知条'],
};
const cmsName=t=>CMS_BLOCK[t]?T(...CMS_BLOCK[t]):(t||'—');
function loadCms(page){
  if(state.cmsTried[page]) return;
  state.cmsTried=Object.assign({},state.cmsTried,{[page]:true});
  api('/cms/layout?page='+encodeURIComponent(page)).then(d=>{
    state.cms=Object.assign({},state.cms,{[page]:d||{}}); state.cmsErr=null; render();
  }).catch(e=>{
    if(String(e.message)==='auth') return;
    state.cmsErr=E('Could not load the layout.','加载版面失败。'); render();
  });
}
/* A block is worth naming by more than its type when it carries a title an
   operator wrote — that is how they will recognise which one it is. */
function cmsBlockLabel(b){
  const p=b.props||b||{};
  const t=LANG==='en'
    ? (p.title_en||p.title||p.heading_en||p.heading||p.text_en||p.text||'')
    : (p.title_cn||p.title||p.heading_cn||p.heading||p.text_cn||p.text||'');
  return typeof t==='string' ? t.trim().slice(0,48) : '';
}
function statusEditor(){
  const d=state.cms&&state.cms[state.cmsPage]; if(!d) return '';
  const live=Array.isArray(d.live)?d.live:[];
  return live.length+' '+T(live.length===1?'block live':'blocks live','个模块已上线')
    + ' · ' + (d.dirty?`<span style="color:var(--amber-ink)">${T('unpublished changes','有未发布的修改')}</span>`:T('published','已发布'));
}
function screenEditor(){
  const page=state.cmsPage;
  loadCms(page);
  const chips=CMS_PAGES.map(([k,en,zh])=>({key:k,en,zh}));
  const head=`<div style="padding:12px 0 4px">${chipRow(chips,page,'cmsPage')}</div>`;
  if(state.cmsErr) return `${head}<div style="padding:8px 16px 24px">
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${state.cmsErr}</span></div></div>`;
  const d=state.cms[page];
  if(!d) return `${head}<div style="padding:44px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const live=Array.isArray(d.live)?d.live:[];
  const draft=Array.isArray(d.draft)?d.draft:[];
  const dirty=!!d.dirty;
  const [bg,fg]=dirty?PILL.warning:PILL.success;
  // Only a page with a saved-but-unpublished draft gets a card here. When
  // everything is published the card held two facts and nothing else — "3
  // blocks live" and a Published pill — which is a status line wearing a
  // card's clothes, and it pushed the block list a card's height down the
  // screen. Both facts are in the header band now.
  return `${head}<div style="padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px">
    ${dirty?`<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span style="font-size:15px;font-weight:500">${T('Not what shoppers see','与顾客所见不同')}</span>
        <span class="pill" style="background:${bg};color:${fg}">${T('Unpublished changes','有未发布的修改')}</span></div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.5">${T(
        'A draft is saved that does not match what shoppers see'+(draft.length!==live.length?' — '+draft.length+' blocks in the draft, '+live.length+' live':'')+'. Publishing is on desktop.',
        '已保存的草稿与顾客当前看到的不一致'+(draft.length!==live.length?' — 草稿 '+draft.length+' 个模块，线上 '+live.length+' 个':'')+'。发布请在电脑端进行。')}</div>
    </div>`:''}
    ${live.length?`<div><div class="eyebrow" style="padding:2px 4px 8px">${T('In order','按顺序')}</div>
      <div class="list">${live.map((b,i)=>{ const lbl=cmsBlockLabel(b);
        return `${i?'<div class="sep" style="margin-left:52px"></div>':''}
        <div style="display:flex;align-items:center;gap:12px;padding:13px 14px">
          <span class="num" style="width:24px;text-align:center;font-size:13px;color:var(--text-secondary);flex:none">${i+1}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column">
            <span style="font-size:15px">${escAttr(cmsName(b.type))}</span>
            ${lbl?`<span style="font-size:12.5px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(lbl)}</span>`:''}</span></div>`;
      }).join('')}</div></div>`
      :`<div style="padding:30px 16px;text-align:center;font-size:14px;color:var(--text-secondary)">${
        T('Nothing is published on this page yet.','这个页面还没有发布任何内容。')}</div>`}
    ${noteBar(T('Blocks are placed, edited and published on desktop.','模块的添加、编辑与发布在电脑端进行。'))}</div>`;
}

/* ==========================================================================
   Delivery (desktop: 06-delivery.js)
   --------------------------------------------------------------------------
   The phone said "Delivery zones · 7" and stopped there. A bare count is the
   one number on that screen that cannot go wrong, and it hides the one that
   can: a zone that is switched OFF will not match an address, so a customer in
   it is told you do not deliver there. The desktop's KPI strip alerts on
   exactly that. And holiday mode — the switch that stops delivery altogether
   and puts a message in front of every shopper — did not appear on the phone
   at all, which is a strange thing not to be able to check from a phone.
   ========================================================================== */
function dlvZoneFacts(){
  const rows=Array.isArray(state.zones)?state.zones:null;
  if(!rows) return null;
  const live=rows.filter(z=>z.is_active);
  const provs=new Set(live.map(z=>z.province_cn||z.province_en||'').filter(Boolean));
  const sameday=live.filter(z=>z.zone_type==='gz_district'&&(z.same_day_allowed||Number(z.same_day_surcharge)>0)).length;
  return {total:rows.length, live:live.length, off:rows.length-live.length, provs:provs.size, sameday};
}
function screenDelivery(){
  if(!state.printer&&!state.printerTried) loadPrinter();
  loadGeo();
  const g=state.geo, st=(g&&g.stores)||null;
  const located = !g ? T('Loading…','加载中…')
    : !st||!st.total ? T('No stores','没有门店')
    : T(st.geocoded+' of '+st.total,st.total+' 家中的 '+st.geocoded);
  const missing = st&&st.missing ? st.missing : 0;
  const noKey = g && g.tencent_maps_configured===false;
  const z=dlvZoneFacts();
  const dlv=(state.cfg&&state.cfg.delivery)||{};
  const holiday=!!dlv.holidayMode;
  const hMsg=dlv.holidayMessage||{};
  const hText=LANG==='en'?(hMsg.en||hMsg.cn||''):(hMsg.cn||hMsg.en||'');
  const cutoff=dlv.sameDayCutoffMinutes!=null?Number(dlv.sameDayCutoffMinutes):null;
  return `<div style="padding:16px;display:flex;flex-direction:column;gap:14px">
    ${holiday?`<div style="display:flex;flex-direction:column;gap:6px;background:var(--brick-tint);border-radius:14px;padding:14px 16px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="flex:none;color:var(--brick-ink);display:flex">${ic('triangle-alert',18)}</span>
        <span style="font-size:14.5px;font-weight:500;color:var(--brick-ink)">${T('Holiday mode is on — delivery is paused','假日模式已开启 — 配送已暂停')}</span></div>
      ${hText?`<div style="font-size:13px;color:var(--brick-ink);line-height:1.5;opacity:.9">${T('Shoppers are told','顾客看到')}: “${escAttr(hText)}”</div>`:''}
      ${/* OFF only, never on. Turning holiday mode ON needs the shopper-facing
            message, in both languages, and writing that is authoring — a phone
            that could switch it on without writing one would put a stale
            message, or none, in front of every customer. Coming BACK is the
            asymmetric half: you are home, delivery should run, and there is
            nothing to write. That is the one that belongs on a phone. */''}
      <button class="btn2" style="align-self:flex-start;margin-top:6px;min-height:40px;padding:0 14px;font-size:13.5px"
        ${state.dlvBusy?'disabled':''} onclick="APP.cmd('resumeDelivery')">${
        state.dlvBusy?T('Resuming…','恢复中…'):T('Resume delivery','恢复配送')}</button>
      ${state.dlvErr?`<div style="font-size:13px;color:var(--brick-ink)">${state.dlvErr}</div>`:''}</div>`:''}
    ${settingsGroupCard([
      {label:T('Delivery zones','配送范围'), value: z ? T(z.live+' live','启用 '+z.live) : T('Loading…','加载中…')},
      {label:T('Provinces covered','覆盖省份'), value: z ? String(z.provs) : T('Loading…','加载中…')},
      {label:T('Same-day districts','当日达区域'), value: z ? String(z.sameday) : T('Loading…','加载中…')},
      {label:T('Stores located','门店已定位'), value:located},
    ].concat(cutoff!=null?[{label:T('Same-day cut-off','当日达截单'),value:T(cutoff+' min before close',cutoff+' 分钟(打烊前)')}]:[])
     .concat(holiday?[]:[{label:T('Holiday mode','假日模式'),value:T('Off','已关闭')}]))}
    ${z&&z.off?`<div style="display:flex;align-items:flex-start;gap:11px;background:rgba(201,149,74,0.12);border-radius:12px;padding:12px 14px">
      <span style="flex:none;color:var(--amber-ink);display:flex;margin-top:1px">${ic('triangle-alert',17)}</span>
      <span style="font-size:13.5px;color:var(--amber-ink);line-height:1.5">${T(z.off===1?'One zone is switched off, so addresses in it will not match — those customers are told you do not deliver there.':z.off+' zones are switched off, so addresses in them will not match — those customers are told you do not deliver there.', z.off+' 个配送范围已停用，其中的地址无法匹配 — 顾客会被告知不支持配送。')}</span></div>`:''}
    ${missing?`<div style="display:flex;align-items:flex-start;gap:11px;background:var(--brick-tint);border-radius:12px;padding:12px 14px">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:1px">${ic('triangle-alert',17)}</span>
      <span style="font-size:13.5px;color:var(--brick-ink);line-height:1.5">${T(missing===1?'One store has no coordinates, so it can never be the nearest one. Fix it on desktop.':missing+' stores have no coordinates, so they can never be the nearest one. Fix them on desktop.', missing+' 家门店没有坐标，无法参与就近派单。请在电脑端处理。')}</span></div>`:''}
    ${noKey?noteBar(T('No maps key is configured, so nothing can be located','未配置地图密钥，无法进行定位')):''}
    ${desktopNote()}</div>`;
}

/* ==========================================================================
   Setup guide — read-only (desktop: 17-setup-guide.js)
   --------------------------------------------------------------------------
   The phone's version had three controls that did nothing: every step row was
   a button with a chevron wired to noop, and so was "Continue setup". It also
   flattened /setup's two lists into one, so the two OPTIONAL steps (WeChat
   sign-in, brand) counted against progress that the server computes from the
   five required ones — and it threw away every per-step detail the endpoint
   returns: how many stores, how many products, which payment method, whether
   handover is delivery or pickup.

   Nothing here is actionable on purpose. Each step on the desktop opens a
   wizard — a store with a map and a timezone, an Alipay QR upload, a
   delivery-or-pickup chooser, "open the doors". None of that is phone work.
   So this screen reports, and says where the work happens.
   ========================================================================== */
const SETUP_LABEL={store:['Your store','门店信息'],products:['Add your first product','添加第一件商品'],
  payment:['Add a payment method','添加收款方式'],fulfillment:['Set up delivery or pickup','设置配送或自提'],
  open:['Open your store','开始营业'],wechat:['Connect WeChat sign-in','连接微信登录'],brand:['Add your brand','完善品牌']};
/* What the server already knows about each step, said rather than discarded. */
function setupDetail(x){
  if(x.key==='store'&&x.count!=null) return x.count+' '+T(x.count===1?'store':'stores','家门店');
  if(x.key==='products'&&x.count!=null) return x.count+' '+T(x.count===1?'product':'products','件商品');
  if(x.key==='payment') return x.method==='both'?T('WeChat Pay and Alipay','微信支付与支付宝')
    :x.method==='wechat'?T('WeChat Pay','微信支付'):x.method==='alipay'?T('Alipay','支付宝'):'';
  if(x.key==='fulfillment'){
    if(x.delivery&&x.pickup) return T('Delivery and pickup','配送与自提');
    if(x.delivery) return T('Delivery','配送');
    if(x.pickup) return T('Pickup only','仅自提');
    return '';
  }
  return '';
}
function setupRow(x,i,n){
  const det=setupDetail(x);
  return `${i?'<div class="sep" style="margin-left:52px"></div>':''}
    <div style="display:flex;align-items:center;gap:12px;padding:13px 14px">
      ${x.done?`<span style="width:24px;height:24px;border-radius:50%;background:rgba(163,180,159,.28);display:flex;align-items:center;justify-content:center;color:var(--sage-ink);flex:none">${ic('check',15,2.25)}</span>`
             :`<span style="width:24px;height:24px;border-radius:50%;border:2px solid var(--border-default);flex:none"></span>`}
      <span style="flex:1;min-width:0;display:flex;flex-direction:column">
        <span style="font-size:15px">${T(...(SETUP_LABEL[x.key]||[x.key,x.key]))}</span>
        ${det?`<span class="num" style="font-size:12.5px;color:var(--text-secondary);margin-top:2px">${det}</span>`:''}</span>
      ${x.done?'':`<span style="font-size:12.5px;color:var(--text-secondary);flex:none">${n?T('next','下一步'):T('to do','待办')}</span>`}</div>`;
}
function screenSetup(){
  const d=state.setup;
  if(!d) return `<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const req=Array.isArray(d.steps)?d.steps:[];
  const opt=Array.isArray(d.optional)?d.optional:[];
  const pct=Number(d.percent||0), done=Number(d.requiredDone||0), total=Number(d.requiredTotal||req.length);
  const nextIdx=req.findIndex(x=>!x.done);
  return `<div style="padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px">
    <div style="background:var(--surface-raised);border-radius:14px;padding:18px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span style="font-size:15px;font-weight:500">${d.allDone?T('Your store is open','店铺已开业'):T('Setup progress','开店进度')}</span>
        <span class="num" style="font-size:13px;color:var(--text-secondary)">${pct}%${d.allDone?'':' · '+Math.max(0,total-done)+' '+T('left','待完成')}</span></div>
      <div style="margin-top:12px;height:6px;border-radius:999px;background:var(--surface-card);overflow:hidden">
        <div style="height:6px;width:${pct}%;border-radius:999px;background:${d.allDone?'var(--sage)':'var(--graphite)'}"></div></div>
      ${nextIdx>=0?`<div style="font-size:13px;color:var(--text-secondary);margin-top:12px">${T('Next','下一步')}: ${T(...(SETUP_LABEL[req[nextIdx].key]||['—','—']))}</div>`:''}</div>
    <div class="list">${req.map((x,i)=>setupRow(x,i,i===nextIdx)).join('')}</div>
    ${opt.length?`<div><div class="eyebrow" style="padding:2px 4px 8px">${T('Optional','可选')}</div>
      <div class="list">${opt.map((x,i)=>setupRow(x,i,false)).join('')}</div>
      <div style="font-size:12.5px;color:var(--text-secondary);padding:8px 4px 0">${T('These do not gate opening.','这些不影响开业。')}</div></div>`:''}
    ${noteBar(T('Each step is a wizard on desktop — a store with its address and hours, a payment method, delivery or pickup.','每一步在电脑端以引导方式完成 — 门店地址与营业时间、收款方式、配送或自提。'))}</div>`;
}
function screenMore(){
  const su=setupState();
  // "Open your store" is the owner's onboarding checklist, not a tool. It is
  // gated on the same keys as Settings, so a stocker is not handed a progress
  // bar for work they cannot do.
  const setupCard = canRoute('setup');
  const groups = moreGroups();
  /* A role can be narrowed until this app holds nothing for it — a stocker whose
     only tool is the separate Quick Stock PWA. Say so, and say who can change
     it, rather than painting an empty page under a heading. */
  if(!setupCard && !groups.length){
    return nothingYet(T('Nothing here for you yet','这里暂时没有可用功能'),
      T('Your role does not open any of this app\u2019s screens. Whoever manages your team can widen it.',
        '您的角色尚未开通本应用中的任何页面,可请团队管理员调整权限。'));

/* ==========================================================================
   Voting — the polls customers answer (desktop: 10-extras.js)
   --------------------------------------------------------------------------
   The phone drew ONE bar per poll: the leader's share, and the leader's name.
   A poll is a split — "62% Matcha oat" says nothing about whether second place
   was 38% or 4%, and the other options existed nowhere on this device. It also
   dropped the reward points, the closing time, whether a poll is featured, and
   the fact that a draft is invisible to customers. And it carried two invented
   polls in its source for whenever /polls came back empty.
   ========================================================================== */
function loadPolls(force){
  if(state.pollsTried&&!force) return;
  state.pollsTried=true;
  api('/polls').then(rows=>{ state.polls=Array.isArray(rows)?rows:[]; state.pollsErr=null; render(); })
    .catch(e=>{ if(String(e.message)==='auth') return;
      state.pollsErr=E('Could not load the polls.','加载投票失败。'); render(); });
}
const POLL_WORD={open:['Live','进行中'],draft:['Draft','草稿'],closed:['Closed','已结束']};
function pollPill(st){
  const tone = st==='open'?'success' : st==='draft'?'clear' : 'muted';
  const [bg,fg]=PILL[tone];
  return `<span class="pill" style="background:${bg};color:${fg}">${T(...(POLL_WORD[st]||[st,st]))}</span>`;
}
function pollQ(p){ return LANG==='en' ? (p.question_en||p.question_cn||T('(untitled)','(未命名)'))
                                      : (p.question_cn||p.question_en||T('(untitled)','(未命名)')); }
function pollOptLabel(o){ return LANG==='en' ? (o.label_en||o.label_cn||'—') : (o.label_cn||o.label_en||'—'); }
/* Every option, with its share of the real total — not just the leader. The
   winner is marked only once one has been chosen on the desktop. */
function pollBars(p){
  const opts=(p.options||[]).slice().sort((a,b)=>(b.votes||0)-(a.votes||0));
  const total=opts.reduce((a,o)=>a+(Number(o.votes)||0),0);
  if(!opts.length) return `<div style="font-size:13px;color:var(--text-secondary)">${T('No options yet.','还没有选项。')}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:9px">${opts.map(o=>{
    const v=Number(o.votes)||0;
    const pct=total?Math.round(v/total*100):0;
    const win=p.winner_option_id&&String(p.winner_option_id)===String(o.id);
    return `<div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span style="font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(pollOptLabel(o))}${win?` <span style="font-size:12px;color:var(--text-secondary)">· ${T('winner','胜出')}</span>`:''}</span>
        <span class="num" style="font-size:12.5px;color:var(--text-secondary);flex:none">${v} ${T(v===1?'vote':'votes','票')} · ${pct}%</span></div>
      <div style="height:6px;border-radius:999px;background:var(--surface-raised);overflow:hidden">
        <div style="height:6px;width:${pct}%;border-radius:999px;background:${win?'var(--sage)':'var(--graphite)'}"></div></div></div>`;
  }).join('')}</div>`;
}
function pollCard(p){
  const opts=p.options||[];
  const total=Number(p.total_votes||0)||opts.reduce((a,o)=>a+(Number(o.votes)||0),0);
  const open=state.pollOpen===p.id;
  const floor=Number(p.display_min_total||0);
  const meta=[opts.length+' '+T(opts.length===1?'option':'options','个选项'),
    total+' '+T(total===1?'vote':'votes','票'),
    Number(p.reward_points||0)?'+'+p.reward_points+' '+T('pts','积分'):null,
    p.closes_at?T('closes ','截止 ')+fmtDay(p.closes_at):null].filter(Boolean).join(' · ');
  // The one action a phone is the right place for: a poll you have decided
  // about, closed on the spot. Writing the question is desktop work.
  const next = p.status==='open'?'closed':'open';
  const verb = p.status==='draft'?T('Open','开启') : p.status==='open'?T('Close','关闭') : T('Reopen','重新开启');
  const busy=state.pollBusy===p.id;
  const btn=(label,cmd,dis)=>`<button ${dis?'disabled':''} onclick="${cmd}" style="font-size:13px;font-weight:500;color:var(--text-primary);background:var(--surface-raised);border:1px solid var(--border-default);border-radius:9px;padding:7px 14px;cursor:pointer;font-family:inherit;${dis?'opacity:.5':''}">${label}</button>`;
  return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
      <span style="font-size:15px;font-weight:500;min-width:0">${escAttr(pollQ(p))}</span>
      <span style="display:flex;align-items:center;gap:6px;flex:none">${p.is_featured?`<span class="pill" style="background:${PILL.warning[0]};color:${PILL.warning[1]}">${T('Featured','精选')}</span>`:''}${pollPill(p.status)}</span></div>
    <div class="num" style="font-size:12.5px;color:var(--text-secondary)">${meta}</div>
    ${p.status==='draft'?`<div style="font-size:12.5px;color:var(--text-secondary)">${T('Customers cannot see a draft.','草稿对顾客不可见。')}</div>`:''}
    ${floor?`<div style="font-size:12.5px;color:var(--amber-ink)">${T('Customers are shown at least '+floor+' votes, whatever the real count is.','顾客看到的票数下限为 '+floor+' 票，与真实票数无关。')}</div>`:''}
    ${open?pollBars(p):''}
    <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
      ${btn(open?T('Hide results','收起结果'):T('See results','查看结果'),`APP.cmd('pollOpen',${p.id})`,false)}
      ${btn(busy?T('Saving…','保存中…'):verb,`APP.cmd('pollStatus',${p.id},'${next}')`,busy)}</div></div>`;
}
function screenVoting(){
  loadPolls();
  if(state.pollsErr) return `<div style="padding:14px 16px 24px">
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${state.pollsErr}</span></div></div>`;
  if(!state.polls) return `<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  if(!state.polls.length) return nothingYet(T('No polls yet','还没有投票'),
    T('Polls are written on desktop. Once one exists you can read the split and open or close it from here.',
      '投票在电脑端创建。创建后可在此查看结果并开启或关闭。'));
  return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px">
    ${state.polls.map(pollCard).join('')}
    ${noteBar(T('Questions, options and rewards are written on desktop.','问题、选项与奖励在电脑端编写。'))}</div>`;
}

/* ==========================================================================
   Membership, Top-up and Leaderboard — three screens that were making it up
   --------------------------------------------------------------------------
   Membership showed a fixed four-rung ladder ("Tree ≥ 2,000 pts") whose
   thresholds were both invented AND in the wrong unit: a tier threshold is
   LIFETIME SPEND in ¥, not points. The ladder is editable — tiers are stored
   in storefront_config under roots_club.tiers, with a points multiplier and a
   perks list per rung — so a shop that had renamed a tier, moved a threshold
   or added a rung saw none of it. And "Recent members" was recent SIGNUPS
   relabelled, which is a different thing and is already on Customers.

   Top-up led with "¥184,220 · 788 members" in 30px type. No fetch ever
   replaced it, because there is no endpoint that returns it. It was a number
   somebody typed into a mockup, sitting on a phone, above a real transaction
   list. Worse, every transaction rendered as a green +¥ regardless of status,
   so a pending or failed top-up read as money in the till.

   Leaderboard showed a board even when the board is switched off, labelled
   every value "pts" when the metric is configurable (lifetime spend, points or
   order count), and ignored reveal mode — the setting that decides whether
   customers see full names.
   ========================================================================== */
function loadTiers(){
  if(state.tiersTried) return;
  state.tiersTried=true;
  Promise.all([api('/config'),api('/tier-counts').catch(()=>null)]).then(([cfg,counts])=>{
    const list=cfg&&cfg.roots_club&&cfg.roots_club.tiers;
    state.tiers=Array.isArray(list)?list:[];
    state.tierCounts=(counts&&typeof counts==='object')?counts:null;
    state.tiersErr=null; render();
  }).catch(e=>{
    if(String(e.message)==='auth') return;
    state.tiersErr=E('Could not load the tiers.','加载会员等级失败。'); render();
  });
}
const tierKey=t=>String((t&&t.key)||'').trim()||String((t&&t.name_en)||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
function tierName(t){ return LANG==='en' ? (t.name_en||t.name_cn||T('Untitled tier','未命名等级'))
                                         : (t.name_cn||t.name_en||T('Untitled tier','未命名等级')); }
/* One decimal only when there is one — "2× points", not "2.0× points". */
const multText=n=>{ const v=Number(n)||1; return (v%1?v.toFixed(1):String(v)); };
function screenMembership(){
  loadTiers();
  if(state.tiersErr) return `<div style="padding:14px 16px 24px">
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${state.tiersErr}</span></div></div>`;
  if(!state.tiers) return `<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const tiers=state.tiers.slice().sort((a,b)=>(Number(a.threshold)||0)-(Number(b.threshold)||0));
  if(!tiers.length) return nothingYet(T('No tiers yet','暂无会员等级'),
    T('The membership ladder is built on desktop. Once there are rungs, they show here with how many members stand on each.',
      '会员等级在电脑端设置。设置后会连同各等级人数显示在这里。'));
  const card=t=>{
    const th=Number(t.threshold)||0;
    const from = th===0 ? T('from ¥0 — everyone starts here','从 ¥0 起 — 人人有份')
      : T('from '+money0(CUR,th)+' lifetime spend','累计消费 '+money0(CUR,th)+' 起');
    const n = state.tierCounts ? Number(state.tierCounts[tierKey(t)]||0) : null;
    const perks = LANG==='en'
      ? ((t.perks_en&&t.perks_en.length?t.perks_en:t.perks_cn)||[])
      : ((t.perks_cn&&t.perks_cn.length?t.perks_cn:t.perks_en)||[]);
    return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span style="font-size:16px;font-weight:500;min-width:0">${escAttr(tierName(t))}</span>
        <span class="num" style="font-size:13px;color:var(--text-secondary);flex:none">${multText(t.points_mult)}× ${T('points','积分')}</span></div>
      <div class="num" style="font-size:13px;color:var(--text-secondary)">${from}</div>
      ${n!=null?`<div style="font-size:13px;color:var(--text-secondary)"><b class="num" style="color:var(--text-primary);font-weight:500">${n.toLocaleString()}</b> ${T(n===1?'member':'members','名会员')}</div>`:''}
      ${perks.length?`<ul style="margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px">${perks.map(pk=>
        `<li style="font-size:13.5px;line-height:1.5;color:var(--text-secondary)">${escAttr(pk)}</li>`).join('')}</ul>`
        :`<div style="font-size:13px;color:var(--text-secondary);opacity:.8">${T('No perks yet','暂无权益')}</div>`}</div>`;
  };
  return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px">
    ${tiers.map(card).join('')}
    ${noteBar(T('Thresholds, multipliers and perks are edited on desktop.','门槛、倍数与权益在电脑端编辑。'))}</div>`;
}

/* ── Top-up ──────────────────────────────────────────────────────────────── */
function loadTopups(force){
  if(state.tupTried&&!force) return;
  state.tupTried=true;
  Promise.all([api('/topup-transactions?limit=50'),api('/topup-packages').catch(()=>[])]).then(([tx,pk])=>{
    state.tup=Array.isArray(tx)?tx:[];
    state.tupPkgs=Array.isArray(pk)?pk:[];

  }).catch(e=>{
    if(String(e.message)==='auth') return;
    state.tupErr=E('Could not load top-ups.','加载充值记录失败。'); render();
  });
}
/* Only a SUCCEEDED top-up is money. Everything else is a row that says what
   happened to it — the phone used to paint all three green. */
const TUP_WORD={success:['Paid','已支付'],pending:['Pending','待支付'],failed:['Failed','失败'],
  cancelled:['Cancelled','已取消'],refunded:['Refunded','已退款']};
function tupRow(t){
  const st=String(t.status||'pending').toLowerCase();
  const paid=st==='success';
  const word=TUP_WORD[st]||[st,st];
  const tone=paid?'success':(st==='pending'?'clear':'muted');
  const [bg,fg]=PILL[tone];
  const bonus=Number(t.bonus_points||0);
  return `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px">
    <span style="display:flex;flex-direction:column;min-width:0">
      <span style="font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(t.nickname||T('(no name)','无名'))}</span>
      <span class="num" style="font-size:12px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fmtDay(t.paid_at||t.created_at)||''}${t.phone?' · '+escAttr(t.phone):''}${t.payment_method?' · '+escAttr(T(...payLabel(t.payment_method))):''}</span>
      ${bonus?`<span class="num" style="font-size:12px;color:var(--text-secondary);margin-top:2px">+${bonus} ${T('bonus points','赠送积分')}</span>`:''}
      ${st==='pending'?`<button ${state.tupBusy===t.id?'disabled':''} onclick="APP.cmd('finalizeTopup',${t.id})" style="align-self:flex-start;margin-top:9px;font-size:13px;font-weight:500;color:var(--text-primary);background:var(--surface-raised);border:1px solid var(--border-default);border-radius:9px;padding:7px 14px;cursor:pointer;font-family:inherit;${state.tupBusy===t.id?'opacity:.5':''}">${state.tupBusy===t.id?T('Marking…','处理中…'):T('Mark successful','标记成功')}</button>`:''}
    </span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none">
      <span class="num" style="font-size:15px;font-weight:500;color:${paid?'var(--sage-ink)':'var(--text-secondary)'}">${paid?'+':''}${money(CUR,t.amount)}</span>
      <span class="pill" style="background:${bg};color:${fg}">${T(...word)}</span></span></div>`;
}

/* ── Leaderboard ─────────────────────────────────────────────────────────── */

const LB_PERIOD={all:['all time','全部时间'],year:['past year','近一年'],month:['past month','近一月'],week:['past 7 days','近 7 天']};

function screenLeaderboard(){
