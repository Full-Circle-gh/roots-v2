const MEDIA_ERR={
  too_large:['That photo is too large. Try a smaller one.','图片太大，请换一张较小的。'],
  not_an_image:['That file is not an image the shop can use.','该文件不是可用的图片格式。'],
  no_file:['Nothing was picked.','没有选择文件。'],
};
async function uploadMedia(files){
  files=(files||[]).filter(f=>/^image\//.test(f.type||''));
  if(!files.length) return;
  state.mediaBusy={done:0,total:files.length}; state.mediaErr=null; render();
  let ok=0, fail=0, why=null;
  for(const f of files){
    const fd=new FormData(); fd.append('file',f);
    try{
      const r=await fetch(API+'/media/upload',{method:'POST',credentials:'same-origin',body:fd});
      if(r.status===401||r.status===403){ location.href='/backend/login'; return; }
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j&&j.success) ok++; else { fail++; why=why||(j&&j.error); }
    }catch(e){ fail++; }
    state.mediaBusy={done:ok+fail,total:files.length}; render();
  }
  state.mediaBusy=null;
  // A refusal names the reason the server gave when it gave one, and says how
  // many DID land — "3 of 4" is the difference between a retry and a re-do.
  if(fail){
    const reason=MEDIA_ERR[why];
    const head=ok?T(ok+' of '+(ok+fail)+' uploaded.', '已上传 '+ok+'/'+(ok+fail)+' 张。')
                 :T('That did not upload.','上传失败。');
    state.mediaErr=head+' '+(reason?T(...reason):T('Try again.','请重试。'));
  }
  if(ok){ state.mediaTried=false; state.media=null; loadMedia(); showToast(ok===1?T('Photo added','已添加图片'):T(ok+' photos added',ok+' 张图片已添加')); }
  else render();
}

function refundPanel(o){
  const r=o.refund; if(!r) return '';
  const st=REFUND_STATE[r.state]||{en:r.state,zh:r.state,sev:'muted'};
  const [bg,fg]=REF_TONE[st.sev]||REF_TONE.muted;
  const open=r.state==='pending'||r.state==='reviewing';
  const fig=(l,v)=>v==null?'':`<span style="min-width:0">
    <span style="display:block;font-size:12px;color:var(--text-secondary)">${l}</span>
    <span class="num" style="display:block;font-size:16px;font-weight:500;margin-top:1px">${money(CUR,v)}</span></span>`;
  // Cash vs store credit: when an order paid partly with the wallet is refunded,
  // only some of the value moves as cash. One figure would hide the rest.
  const credit=(r.cash!=null&&r.approved!=null)?Math.max(0,+(r.approved-r.cash).toFixed(2)):null;
  const figs=[
    fig(T('Order total','订单总额'),Number(String(o.total).replace(/[^0-9.]/g,''))||null),
    fig(T('Asked for','申请'),r.requested),
    fig(T('Approved','已批准'),r.approved),
    fig(T('Paid back','已退'),r.paid),
    (credit!=null&&credit>0.005)?fig(T('As cash','现金'),r.cash):'',
    (credit!=null&&credit>0.005)?fig(T('To wallet','退回余额'),credit):'',
  ].filter(Boolean).join('');
  return `<div style="border-radius:14px;background:${bg};padding:14px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span style="font-size:15px;font-weight:500;color:${fg}">${T(st.en,st.zh)}</span>
      ${r.at?`<span class="num" style="font-size:12.5px;color:var(--text-secondary)">${T('asked '+fmtDay(r.at),'申请于 '+fmtDay(r.at))}</span>`:''}</div>
    ${(open&&r.requested!=null)?`<div style="font-size:14px">${T('The customer asked for '+money(CUR,r.requested)+' of '+o.total,'顾客申请退 '+money(CUR,r.requested)+' / 共 '+o.total)}</div>`:''}
    ${r.reason?`<div style="font-size:14px;line-height:1.55;background:var(--surface-card);border-radius:10px;padding:10px 12px">
      <span class="eyebrow" style="display:block;margin-bottom:4px">${T('In their words','顾客说明')}</span>${escAttr(r.reason)}</div>`:''}
    ${r.lines?`<div style="background:var(--surface-card);border-radius:10px;padding:10px 12px">
      <span class="eyebrow" style="display:block;margin-bottom:6px">${T('The lines they picked','顾客选择的商品')}</span>
      ${r.lines.map(l=>`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 0">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(T(l.name[0],l.name[1]))} ×${l.qty}</span>
        <span class="num" style="flex:none">${money(CUR,l.amount)}</span></div>`).join('')}</div>`:''}
    ${figs?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${figs}</div>`:''}
    ${r.method?`<div class="num" style="font-size:12.5px;color:var(--text-secondary)">${T('Paid by '+r.method,'退款方式 '+r.method)}${r.ref?' · '+escAttr(r.ref):''}</div>`:''}
    ${r.staffNote?`<div style="font-size:13px;color:var(--text-secondary)"><span class="eyebrow">${T('Staff note','客服备注')}</span> ${escAttr(r.staffNote)}</div>`:''}
    ${r.state==='paying'?`<div style="display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--text-secondary)">
      <span class="breathe" style="width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px"></span>
      <span>${T('The money is moving through the payment gateway. This finishes on its own — nothing to do.','正在通过支付网关打款，会自动完成，无需操作。')}</span></div>`:''}
  </div>`;
}
/* The promise this order was sold on — the desktop's Ship-by tile. The list row
   carries it; the drawer did not, so opening an order lost the one fact that
   says whether it is late. */
function shipByTile(o){
  const p=o.plan; if(!p) return '';
  const u=o.planUrgency||{level:'none'};
  const tone=u.level==='overdue'?'brick':(u.level==='today'||u.level==='tomorrow'||u.level==='soon')?'amber':null;
  const KICK={pickup:['Pickup time','取货时间'],batch:['Deliver by','送达时间'],
    scheduled:['Booked','顾客预约'],asap:['Ship by','最迟发货']};
  const k=p.done?['Requested timing','原定时间']:(KICK[p.kind]||KICK.asap);
  // The pill and the label can be the same word: since dates render as Today /
  // Tomorrow rather than as a column, a batch due today read "Today · today".
  // When they agree the pill goes and the label takes the colour, which is the
  // only thing the pill was adding.
  const word = u.level==='overdue'?T('overdue','已逾期'):u.level==='today'?T('today','今天')
             : u.level==='tomorrow'?T('tomorrow','明天'):T('soon','即将');
  const echo = tone && String(p.label||'').trim().toLowerCase()===word.toLowerCase();
  return `<div class="card" style="padding:14px">
    <span class="eyebrow">${T(...k)}</span>
    <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:7px">
      <span class="num" style="font-size:16px;font-weight:500${echo?';color:var(--'+tone+'-ink)':''}">${escAttr(p.label)}</span>
      ${(tone&&!echo)?`<span class="pill" style="background:var(--${tone}-tint);color:var(--${tone}-ink)">${word}</span>`:''}</div>
    ${p.sub?`<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${escAttr(p.sub)}</div>`:''}</div>`;
}
/* The desktop's od-marks strip: when the order was placed, and every mark that
   changes what happens next. "Partially shipped" is the one that explains why a
   Dispatched order is still in the Paid tab; "Print failed" is a failure an
   operator can otherwise only discover at the counter. */
function orderHeadMarks(o){
  const marks=[];
  if(o.fulfil_rollup==='partial'&&o.fulfil_counts)
    marks.push({sev:'amber',icon:'package',label:T('Partially shipped '+o.fulfil_counts.done+'/'+o.fulfil_counts.total,'部分发货 '+o.fulfil_counts.done+'/'+o.fulfil_counts.total)});
  if(o.addons&&o.addons.length)
    marks.push({sev:'amber',icon:'plus',label:T('Items added · +'+money(CUR,o.addonTotal),'加单 · +'+money(CUR,o.addonTotal))});
  if(o.stockPending) marks.push({sev:'amber',icon:'box',label:T('Stock not deducted yet','库存待扣')});
  if(o.printFailed!=null) marks.push({sev:'brick',icon:'printer',label:T('Receipt did not print','小票打印失败')});
  if(!marks.length&&!o.placedFull) return '';
  return `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
    ${marks.map(m=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 9px;border-radius:999px;background:var(--${m.sev}-tint);color:var(--${m.sev}-ink)">${ic(m.icon,13)}${m.label}</span>`).join('')}
    ${o.printFailed?`<span style="width:100%;font-size:12.5px;color:var(--brick-ink)">${escAttr(o.printFailed)}</span>`:''}
  </div>`;
}
/* WHAT was added and WHEN — the slip was very likely printed before any of it
   existed, which is the whole reason the desktop time-stamps each one. */
function addonTimeline(o){
  if(!o.addons||!o.addons.length) return '';
  return `<div class="card" style="padding:14px">
    <span class="eyebrow">${T('Added after paying','下单后加购')}</span>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:9px">
      ${o.addons.map(a=>`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <span style="min-width:0">
          <span style="display:block;font-size:14px;font-weight:500">${a.items.length?a.items.map(it=>escAttr(T(it.name[0],it.name[1]))+' ×'+it.qty).join('、'):T('Items added','已加单')}</span>
          <span class="num" style="display:block;font-size:12.5px;color:var(--text-secondary);margin-top:2px">${fmtDay(a.when)}</span></span>
        <span class="num" style="flex:none;font-size:14px">+${money(CUR,a.amount)}</span></div>`).join('')}
    </div></div>`;
}
/* The fapiao the customer asked for. Issuing it is a desktop job, but WHAT was
   requested — the title, the tax id, where it goes — is exactly what someone
   away from their desk gets asked to read out. */
function invoiceBlock(o){
  const v=o.invoice; if(!v) return '';
  const issued=v.status==='issued';
  const row=(l,val)=>val?`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13.5px;margin-top:6px">
    <span style="color:var(--text-secondary);flex:none">${l}</span><span class="num" style="min-width:0;text-align:right;word-break:break-all">${escAttr(val)}</span></div>`:'';
  return `<div class="card" style="padding:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <span class="eyebrow">${T('Fapiao','发票')}</span>
      ${pill(issued?'delivered':'restock',issued?T('Issued','已开票'):T('To issue','待开票'))}</div>
    ${row(T('Type','类型'),v.type==='company'?T('Company','企业'):v.type==='personal'?T('Personal','个人'):v.type)}
    ${row(T('Title','抬头'),v.title)}
    ${row(T('Tax ID','税号'),v.taxId)}
    ${row(T('Send to','发送至'),v.email)}
    ${row(T('Number','发票号'),v.number)}
    ${v.file?`<a href="${escAttr(v.file)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:500;color:var(--text-primary);background:var(--surface-raised);border:1px solid var(--border-default);border-radius:9px;padding:7px 12px;text-decoration:none">${ic('download',15)} ${T('Open the fapiao','打开发票')}</a>`:''}
    ${!issued?`<div style="font-size:12.5px;color:var(--text-secondary);margin-top:10px">${T('Issuing it is a desktop job.','开具发票请在电脑端。')}</div>`:''}
  </div>`;
}
/* The sheet's chrome around a read that has not landed yet.
   Every other way into an order goes through a row the app already holds, so
   there has always been something to paint on the first frame. An order opened
   from the customer record is different: the tenth-oldest order of a customer
   is not on the page of the list this app loaded, and often is not in it at
   all — findOrder returns nothing and the sheet used to return nothing with
   it, so the tap painted a blank screen until the fetch came back, and painted
   nothing ever if it failed. This is the number that was tapped, a Close that
   works, and one line saying which of the two it is doing. */
function sheetOrderShell(){
  const noAnim=state.detailMounted?'animation:none;':'';
  return `<div class="scrim" style="z-index:45;${noAnim}" onclick="APP.scrimClose('closeOrder')"></div>
   <div class="sheet" id="detailSheet" style="top:46px;overflow:hidden;z-index:46;${noAnim}">
     <div style="flex:none;padding:8px 12px 12px;border-bottom:1px solid var(--border-default)">
       <div class="grabber"></div>
       <div style="display:flex;align-items:center;gap:12px;min-width:0">
         <span class="num" style="font-size:18px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escAttr(state.detailId)}</span>
         <span style="flex:1"></span>
         <button class="iconbtn" style="width:40px;height:40px" onclick="APP.cmd('closeOrder')" aria-label="${T('Close','关闭')}">${ic('x',22,2)}</button>
       </div></div>
     <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px)">
       ${state.orderErr?`<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
         <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
         <span style="font-size:14px;color:var(--brick-ink)">${state.orderErr}</span></div>`
       :`<div style="font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`}</div>
   </div>`;
}
/* The hoisted tracking block is the ORDER-level waybill, which is the primary
   shipment's and only that one. On a split order it would show the Air parcel's
   number at the top, repeat it inside the Air card, and never mention the Land
   one — so once an order has parcels, each card carries its own and the hoisted
   block stands down. */
function sheetOrderDetail(){
  const o=(state.liveDetail&&state.liveDetail.id===state.detailId)?state.liveDetail:findOrder(state.detailId);
  if(!o) return state.detailFetch?sheetOrderShell():'';
  const isPO=!!o.supplier;
  const trans=state.dragging?'none':'transform .3s var(--ease-settle)';
  // On the fetch re-render the sheet is already up — skip the slide-up/fade so it
  // doesn't flick a second time when live detail arrives.
  const noAnim=state.detailMounted?'animation:none;':'';
  return `<div class="scrim" style="z-index:45;${noAnim}" onclick="APP.scrimClose('closeOrder')"></div>
   <div class="sheet" id="detailSheet" style="top:46px;overflow:hidden;z-index:46;${noAnim}transform:translateY(${state.drag}px);transition:${trans}">
     <div id="dragHandle" style="flex:none;padding:8px 12px 12px;border-bottom:1px solid var(--border-default);touch-action:none;cursor:grab">
       <div class="grabber"></div>

         <span class="num" style="font-size:18px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.id}</span>
         ${pill(o.kind,T(...o.status))}
         <span style="flex:1"></span>
         ${/* No negative margin. Same reason the account button lost one: it
              put the tap target flush against the screen edge, on top of the
              browser's scroll indicator and the edge-swipe gesture. */''}
         <button class="iconbtn" style="width:40px;height:40px" onclick="APP.cmd('closeOrder')" aria-label="${T('Close','关闭')}">${ic('x',22,2)}</button>
       </div>
       ${orderActionRow(o,isPO)}
       </div>
     <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px;background:var(--bg)">
       ${state.orderErr?`<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
         <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
         <span style="font-size:14px;color:var(--brick-ink)">${state.orderErr}</span></div>`:''}

         <div style="font-size:14.5px;line-height:1.55;margin-top:8px;white-space:pre-wrap">${escAttr(o.custNote)}</div></div>`:''}
       ${riderCard(o)}
       ${hoistedTracking(o)}
       ${o.trk&&!(o.shipments&&o.shipments.length)?`<div class="card" style="padding:14px">
         <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">

           ${o.trk.live?`<span class="pill" style="background:${PILL.muted[0]};color:${PILL.muted[1]};gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:var(--sage-ink)"></span>${T('Live sync','实时同步')}</span>`:''}</div>
         <div class="num" style="font-size:12.5px;color:var(--text-secondary);margin-top:7px">${o.trk.no}</div>

         ${o.breakdown?`<div style="margin-top:12px;display:flex;flex-direction:column;gap:7px">${o.breakdown.map(([l,v])=>`<div style="display:flex;align-items:baseline;justify-content:space-between;font-size:13px"><span style="color:var(--text-secondary)">${T(l,l)}</span><span class="num">${v}</span></div>`).join('')}

           :o.addr?T(...o.addr):T('No address on file','没有收货地址')}</div>
         ${o.custId!=null?`<button onclick="APP.cmd('openCustomerFromOrder',${o.custId})" style="display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:13px;font-weight:500;color:var(--text-primary);background:var(--surface-raised);border:1px solid var(--border-default);border-radius:9px;padding:7px 12px;cursor:pointer;font-family:inherit">${ic('user',14)} ${T('View customer','查看顾客')}</button>`:''}</div>
       <!-- Payment reads as the tender and nothing else: the WeChat mark plus the

    </div></div>`;

/* Its own fetch, for the reason the order poll has one: this ticks on a timer,
   and a session that lapsed while the phone was in a pocket must not throw the
   operator at a login screen. On any failure it goes quiet and tries again. */
function trackFetch(id){
  return fetch(apiURL('/orders/'+id+'/delivery-track'),{credentials:'same-origin',headers:{accept:'application/json'}})
    .then(r=>r.ok?r.json():null).then(j=>(j&&j.data!==undefined)?j.data:null).catch(()=>null);
}
function riderNote(st,text){
  st.node.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;font-size:12.5px;color:var(--text-secondary)">${text}</div>`;
}
async function riderMapMount(o,host){
  const st={orderId:o._id,node:document.createElement('div'),map:null,timer:null,
            rider:null,shop:null,cust:null,line:null,hint:null,fitted:false};
  st.node.style.cssText='position:absolute;inset:0';
  host.appendChild(st.node);
  _mMap=st;
  let ok=true;
  try{ await mAmapLoad(); }catch(e){ ok=false; }
  if(_mMap!==st) return;                       // sheet closed / another order opened while loading
  if(!ok||!window.AMap){
    // A shop with no map key still gets the rider, the number and the distance
    // — the card below is the useful part and it is already on screen.
    riderNote(st,T('Map unavailable — the rider details are below.','地图暂不可用 — 骑手信息见下方'));
    return;
  }
  /* Built on the first payload that carries a coordinate, never up front: an
     AMap with no centre picks a view of its own, and the desktop's copy of this
     once showed a Guangzhou order sitting in Hunan. A map with nothing to
     anchor on stays a placeholder, which is at least true. */
  const ensureMap=anchor=>{
    if(st.map||!anchor) return st.map;
    st.node.innerHTML='';
    st.map=new AMap.Map(st.node,{zoom:15,resizeEnable:true,jogEnable:false,center:[anchor.lng,anchor.lat]});
    return st.map;
  };
  const setMarker=(cur,pos,opts,label,z)=>{
    if(!pos||!st.map) return cur;
    const ll=[pos.lng,pos.lat];
    if(cur){ cur.setPosition(ll); return cur; }
    const mk=new AMap.Marker({position:ll,content:riderMarkerHtml(label,opts),anchor:'center',zIndex:z});
    mk.setMap(st.map);
    return mk;
  };
  const apply=d=>{
    const anchor=d.rider_position||d.recipient_position||d.shop_position
      ||((Array.isArray(d.route)&&d.route.length)?d.route[0]:null);
    const map=ensureMap(anchor);
    if(!map) return;
    st.shop =setMarker(st.shop, d.shop_position,     {color:'var(--text-secondary)',size:11},              T('Store','门店'),100);
    st.cust =setMarker(st.cust, d.recipient_position,{color:'var(--text-primary)',size:11,ring:true},      T('Customer','收货'),100);
    st.rider=setMarker(st.rider,d.rider_position,    {color:'var(--brick-ink)',size:22,halo:true,pill:true,glyph:ic('bike',13,2)},T('Rider','骑手'),120);
    if(Array.isArray(d.route)&&d.route.length>1){
      const path=d.route.map(p=>[p.lng,p.lat]);
      if(st.line) st.line.setPath(path);
      else { st.line=new AMap.Polyline({path,strokeColor:'#6E67AF',strokeWeight:4,strokeOpacity:.85,lineJoin:'round',showDir:true}); st.line.setMap(map); }
    }
    /* Rider GPS blinks out on some couriers between pings. Say so, rather than
       leaving a door pin with no scooter and letting it read as "no rider". */
    if(!d.rider_position&&d.stage!=='delivered'){
      if(!st.hint){
        st.hint=document.createElement('div');
        st.hint.style.cssText='position:absolute;left:10px;top:10px;z-index:5;background:var(--surface-card);border:1px solid var(--border-default);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--amber-ink);display:flex;align-items:center;gap:6px';
        st.hint.innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:var(--amber-ink)"></span>'+T('Locating rider…','正在定位骑手…');
        st.node.appendChild(st.hint);
      }
    } else if(st.hint){ st.hint.remove(); st.hint=null; }
    if(!st.fitted){
      const pts=[st.shop,st.cust,st.rider].filter(Boolean);
      if(pts.length>1){ try{ map.setFitView(pts,false,[24,24,24,24]); }catch(e){} st.fitted=true; }
      else if(anchor){ map.setZoomAndCenter(15,[anchor.lng,anchor.lat]); st.fitted=true; }
    } else if(d.rider_position){
      map.setCenter([d.rider_position.lng,d.rider_position.lat]);
    }
  };
  /* The card's own words, refreshed from the same payload — in place, not by
     render(). Distance is the answer to the question this whole block exists
     for, and a card that still says "1.2 km" twenty minutes later is the same
     silence with extra confidence. */
  const applyText=d=>{
    const stage=document.getElementById('riderStage');
    const meta=M_COURIER_STAGE[d.stage];
    if(stage&&meta) stage.textContent=T(meta.en,meta.zh);
    const eta=document.getElementById('riderEta');
    if(eta){
      const bits=(d.stage==='delivered')?[]:riderEtaBits(d);
      eta.textContent=bits.join(' · ');
      eta.style.display=bits.length?'':'none';
    }
    const ago=document.getElementById('riderAgo');
    const when=courierAgo(d.updated_at);
    if(ago&&when) ago.textContent=T('Updated','更新于')+' '+when;
    // Keep the cached order in step, so closing and reopening the sheet — or the
    // next repaint — draws what the map is already showing rather than the
    // figures the detail read came back with.
    const cur=(state.liveDetail&&state.liveDetail.id===state.detailId)?state.liveDetail:null;
    if(cur&&cur.courier&&cur._id===st.orderId){
      cur.courier.stage=d.stage;
      cur.courier.eta_seconds=d.eta_seconds!=null?d.eta_seconds:null;
      cur.courier.rider_to_cust_m=d.rider_to_cust_m!=null?d.rider_to_cust_m:null;
      cur.courier.updated_at=d.updated_at||cur.courier.updated_at;
      if(d.rider) cur.courier.rider=d.rider;
    }
  };
  const poll=async()=>{
    if(_mMap!==st) return;
    const d=await trackFetch(st.orderId);
    if(_mMap!==st||!d) return;                 // superseded, or a blip — try again next tick
    if(!d.tracking){ st.done=true; clearInterval(st.timer); st.timer=null; return; }
    applyText(d);
    /* A momentarily missing rider_position is NOT a stop signal (see the hint
       above) — only a finished delivery ends the loop. */
    if(d.stage==='delivered'){
      st.done=true; clearInterval(st.timer); st.timer=null;
      // Destroy the map BEFORE the note overwrites the container it lives in —
      // an AMap torn out from under itself leaves its listeners behind.
      try{ st.map&&st.map.destroy(); }catch(e){}
      st.map=null; st.rider=st.shop=st.cust=st.line=st.hint=null;
      riderNote(st,T('Delivered — the rider has dropped off.','已送达 — 骑手已完成配送。'));
      return;
    }
    apply(d);
  };
  await poll();
  // `done` is the first poll saying this delivery is over (dropped off, or no
  // longer tracked). Without it the loop it just stopped would be re-armed here
  // and go on asking about a finished job every 25 seconds.
  if(_mMap===st&&!st.timer&&!st.done) st.timer=setInterval(poll,25000);
}
/* Called after every repaint. The map node survives the innerHTML rewrite
   because this module holds it; all that is needed is to put it back. */
function riderMapSync(){
  const host=document.getElementById('riderMapHost');
  const o=state.detailId?currentOrder():null;
  if(!host||!o||o._id==null||!riderLive(o)){ riderMapTeardown(); return; }
  if(_mMap&&_mMap.orderId===o._id){
    if(_mMap.node.parentNode!==host) host.appendChild(_mMap.node);
    if(_mMap.map){ try{ _mMap.map.resize(); }catch(e){} }
    return;
  }
  riderMapTeardown();
  riderMapMount(o,host);
}
/* The desktop's shipment cards. The mode is the fact the phone was missing

   two different days, and nothing here said which box a line was in — or that
   there were two boxes. Same four labels, same three states. */
const PARCEL_MODE={
  air:{en:'Air',zh:'空运',icon:'plane'},
  land:{en:'Land',zh:'陆运',icon:'truck'},
  local:{en:'Local delivery',zh:'同城配送',icon:'bike'},
  supplier:{en:'Supplier-direct',zh:'供应商直发',icon:'warehouse'},
};
const PARCEL_STATE={
  pending:{en:'Not shipped',zh:'未发货',kind:'clear'},
  dispatched:{en:'Dispatched',zh:'已发货',kind:'success'},
  delivered:{en:'Delivered',zh:'已送达',kind:'success'},

function parcelCard(o,sp,i,n){
  const m=PARCEL_MODE[sp.mode]||PARCEL_MODE.local;
  const st=PARCEL_STATE[sp.state]||PARCEL_STATE.pending;
  const busy=state.parcelBusy===sp.id;
  // Per-parcel dispatch, on the desktop's own conditions: this parcel has not
  // gone, it is not supplier-direct (which ships when its waybill is entered),

  const canDispatch = sp.state==='pending' && sp.mode!=='supplier' && n>1

/* PRODUCTS is how many lines to pick; UNITS is how many things go in the box.

/* ==========================================================================
   Trend (desktop: 03-dashboard.js, the Reports tab's Trend chapter)
   --------------------------------------------------------------------------
   Everything else on this phone is TODAY. Home fetches
   /dashboard?from=today&to=today, and the only date range anywhere in the file
   was Stock activity's. "Is this week better than last?" is a question you ask
   standing in the shop, and the phone could not answer it at any length.

   Not the desktop's Reports. That has four chapters, ~28 aggregate queries and
   an AI read; a chart with hover columns and a shared y-scale is a desktop
   affordance and stays there. What travels is the shape of the line and three
   numbers under it — which is all the endpoint's own `trend` array has ever
   been, one bucket per day of {bucket, orders, revenue, visits}. The phone was
   already calling this endpoint. It just never asked for more than one day.

   The money gate is the Recap's: a warehouse, dispatch or customer-service
   account sees orders and visits and no revenue at all — including as the
   default metric, because a tile that shows money for half a second before
   hiding it has already shown it.
   ========================================================================== */
const TREND_RANGES=[['7','7 days','7 天'],['30','30 days','30 天'],['90','90 days','90 天']];
const TREND_METRICS=[['revenue','Revenue','营收'],['orders','Orders','订单'],['visits','Visits','访问']];
function trendMetric(){
  const m=state.trendMetric;
  return (m==='revenue'&&recapNoMoney()) ? 'orders' : m;
}
function loadTrend(force){
  const key=state.trendRange;
  if(state.trendKey===key&&!force) return;
  state.trendKey=key; state.trend=null; state.trendErr=null;
  const to=shopToday().slice(0,10);
  /* THE WINDOW WAS ONE DAY TOO LONG IN GUANGZHOU, which is to say everywhere it
     actually runs. `new Date(to+'T00:00:00')` is LOCAL midnight and setDate
     steps back in LOCAL days — but the result was serialised with
     toISOString(), which is UTC. At UTC+8 local midnight is 16:00 the PREVIOUS
     day in UTC, so the from-date came back a day early: "last 7 days" asked for
     eight and "30 days" asked for thirty-one. Every figure on the screen was
     computed over that window — the total, the busiest day, and the mean, which
     divides by a day-count that did not match what was fetched.

     It read correctly at UTC offset 0, where local midnight and UTC midnight
     are the same instant, so it survived every run on a UTC box. The suite that
     catches it only does so because the runner pins TZ=Asia/Shanghai to match
     production.

     Formatted from the local fields now, so the string that goes out is the
     same day the arithmetic was done in. */
  const from=(()=>{ const d=new Date(to+'T00:00:00'); d.setDate(d.getDate()-(Number(key)-1));
    const p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); })();
  api('/dashboard?from='+from+'&to='+to).then(d=>{
    if(state.trendKey!==key) return;   // a later range won the race
    state.trend=Array.isArray(d&&d.trend)?d.trend:[];
    render();
  }).catch(e=>{ if(String(e.message)==='auth') return;
    if(state.trendKey!==key) return;
    state.trendErr=E('Could not load the trend.','加载趋势失败。'); render(); });
}
/* A line, and nothing else — no axes, no grid, no hover. At 390px an axis label
   is unreadable and a hover column has nothing to hover with. The shape is the
   point; the numbers under it carry the values. */
function sparkline(vals,tone){
  const n=vals.length; if(!n) return '';
  const W=1000,H=200,pad=6;
  const max=Math.max(1,...vals);
  const x=i=>pad+(n===1?(W-2*pad)/2:(i/(n-1))*(W-2*pad));
  const y=v=>pad+(H-2*pad)-(v/max)*(H-2*pad);
  const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
  const area='M'+x(0).toFixed(1)+','+(H-pad)+' L'+pts.join(' L')+' L'+x(n-1).toFixed(1)+','+(H-pad)+' Z';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:96px" aria-hidden="true">
    <path d="${area}" fill="var(--${tone}-tint)"></path>
    <path d="M${pts.join(' L')}" fill="none" stroke="var(--${tone}-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(vals[n-1]).toFixed(1)}" r="7" fill="var(--${tone}-ink)"></circle></svg>`;
}
function statusTrend(){
  const t=state.trend; if(!t||!t.length) return '';
  const m=trendMetric();
  const total=t.reduce((a,p)=>a+(Number(p[m])||0),0);
  const lbl=TREND_METRICS.find(x=>x[0]===m);
  return (m==='revenue'?money0(CUR,total):Math.round(total).toLocaleString())
    + ' ' + T(lbl[1],lbl[2]).toLowerCase()
    + ' · ' + T('last '+state.trendRange+' days','近 '+state.trendRange+' 天');
}
function screenTrend(){
  loadTrend();
  const m=trendMetric();
  const metrics=TREND_METRICS.filter(x=>!(x[0]==='revenue'&&recapNoMoney()));
  const chips=(list,cur,cmd)=>`<div style="display:flex;gap:3px;background:var(--surface-raised);border-radius:11px;padding:3px">
    ${list.map(([k,en,zh])=>`<button onclick="APP.cmd('${cmd}','${k}')" style="flex:1;padding:8px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;
      background:${cur===k?'var(--surface-card)':'transparent'};color:${cur===k?'var(--text-primary)':'var(--text-secondary)'};box-shadow:${cur===k?'0 1px 3px rgba(17,26,43,.08)':'none'}">${T(en,zh)}</button>`).join('')}</div>`;
  const head=`<div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:8px">
    ${chips(TREND_RANGES,state.trendRange,'trendRange')}
    ${metrics.length>1?chips(metrics,m,'trendMetric'):''}</div>`;
  if(state.trendErr) return `${head}<div style="padding:16px">
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${state.trendErr}</span></div></div>`;
  if(!state.trend) return `${head}<div style="padding:44px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const t=state.trend;
  if(!t.length) return head+nothingYet(T('Nothing in this window','该时段没有数据'),
    T('No day in this range has anything on it yet. A shorter window may.','所选时段内还没有任何数据，可以试试更短的区间。'));
  const vals=t.map(p=>Number(p[m])||0);
  const total=vals.reduce((a,v)=>a+v,0);
  const days=vals.length;
  const fmt=v=>m==='revenue'?money0(CUR,v):Math.round(v).toLocaleString();
  // The best day is worth naming — it is the one a shop remembers, and it is
  // the only point on the line the eye asks about.
  let bi=0; for(let i=1;i<days;i++) if(vals[i]>vals[bi]) bi=i;
  const tone=m==='revenue'?'sage':m==='orders'?'dusk':'amber';
  const fact=(label,value,sub)=>`<div style="min-width:0">
    <div style="font-size:13px;color:var(--text-secondary)">${label}</div>
    <div class="num" style="font-size:18px;font-weight:500;line-height:1.4;margin-top:2px">${value}</div>
    ${sub?`<div class="num" style="font-size:12.5px;color:var(--text-secondary)">${sub}</div>`:''}</div>`;
  return `${head}<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px">
    <div class="card" style="padding:16px 14px 12px">${sparkline(vals,tone)}
      <div class="num" style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);padding:8px 2px 0">
        <span>${escAttr(fmtDateOnly(t[0].bucket))}</span><span>${escAttr(fmtDateOnly(t[days-1].bucket))}</span></div></div>
    <div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px">
      ${fact(T('Total','合计'),fmt(total))}
      ${fact(T('Busiest day','最高的一天'),fmt(vals[bi]),escAttr(fmtDateOnly(t[bi].bucket)))}
      ${fact(T('A typical day','日均'),fmt(total/days))}
      ${fact(T('Days counted','统计天数'),String(days))}
    </div>
    ${recapNoMoney()?noteBar(T('Revenue is not shown on this account.','此账号不显示营收。')):''}
    ${noteBar(T('Charts, chapters and the per-store breakdown are on desktop.','图表、分章与分门店明细在电脑端。'))}</div>`;
}

/* ==========================================================================
   Team (desktop: 02-settings-ops.js, the Team tab)
   --------------------------------------------------------------------------
   The one desktop tab no parity pass had ever looked at — it appears nowhere
   in docs/tacet-mobile-parity.md, not even as a decided-against row.

   Inviting somebody, assigning a role and setting a per-capability permission
   matrix is authoring, and stays on the desktop. What belongs on a phone is the
   other half: WHO HAS ACCESS, and switching one of them off in a hurry. A
   staffer walks out mid-shift, a phone goes missing, and the answer should not
   be "find a laptop".

   The two rules that make this safe are the server's, not this screen's — it
   refuses to deactivate you, and it refuses to leave the shop with no active
   owner (backend-team.js). The screen states both rather than letting a thumb
   discover them as a 400: the row says why it cannot be switched, before it is
   tapped.
   ========================================================================== */
function loadTeam(force){
  if(state.teamTried&&!force) return;
  state.teamTried=true;
  api('/api/backend/team').then(d=>{
    state.team=Array.isArray(d&&d.team)?d.team:[];
    /* The tenant's own roles ride along with the roster, so this screen names a
       role the way its shop does. It used to carry a seven-entry map of the
       nine shipped names and fall through to the raw key for the other two. */
    state.roles=Array.isArray(d&&d.roles)?d.roles:[];
    state.teamEnforce=!!(d&&d.rbacEnforce); state.teamErr=null; render();
  }).catch(e=>{ if(String(e.message)==='auth') return;
    state.teamErr=E('Could not load the team.','加载团队失败。'); render(); });
}
// Only these two can change a roster; requireCap('team:manage') is what the
// server checks, and drawing an action a staff account cannot use is the kind
// of promise this app has spent a long time removing.
/* The capability the server actually checks, rather than two role names that a
   tenant can now rename or delete. Null caps (an older session) means unknown,
   and this layer has always failed OPEN on unknown — the server still refuses. */
const TEAM_CAN_MANAGE=()=>!state.caps||state.caps.indexOf('team:manage')!==-1;

   these rules; this is the same two, said early. */
function teamLockReason(u){
  if(!u.isActive) return '';
  // Lower case: these are clauses in the row's own list of facts now, not
  // labels of their own — "Owner · seen 8:10 AM · this is you".
  if(u.isSelf) return T('this is you','这是你自己');
  if(u.role==='owner'&&teamActiveOwners()<=1) return T('the only owner','唯一的负责人');
  return '';
}
function statusTeam(){
  const t=state.team; if(!t) return '';
  const on=t.filter(u=>u.isActive).length, off=t.length-on;
  return on+' '+T(on===1?'person with access':'people with access','人可登录')
    + (off?' · '+T(off+(off===1?' switched off':' switched off'),off+' 人已停用'):'');
}
function screenTeam(){

    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${state.teamErr}</span></div></div>`;
  if(!state.team) return `<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const rows=state.team;
  if(!rows.length) return nothingYet(T('Nobody else yet','暂无其他成员'),
    T('People are invited on desktop, with a role and the stores they can see. Once they exist you can check who has access from here, and switch someone off.',
      '成员在电脑端邀请，并设置角色与可见门店。添加后可在此查看谁能登录，并可停用某人。'));
  /* Still read-only, still true — and now it names where roles are shaped. */
  const store=id=>{ const st=(state.stores||[]).find(x=>String(x.id)===String(id));
    return st?(LANG==='en'?(st.name_en||st.name_cn):(st.name_cn||st.name_en)):null; };
  const can=TEAM_CAN_MANAGE();
  return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px">
    ${state.teamActErr?`<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>

      // signed in", which is the one that says an invite never landed.
      const sub=[rl?T(...rl):u.role, u.retailStoreId?store(u.retailStoreId):null,
                 u.lastLogin?T('seen '+fmtDay(u.lastLogin),'最近 '+fmtDay(u.lastLogin)):T('never signed in','从未登录'),
                 lock||null]
                .filter(Boolean).join(' · ');
      const Tag=tap?'button':'div';

/* Who is signed in, in their shop's own words. This was a hardcoded map of

   operator's own roleName, and the roster ships the rest for the list below. */
function ROLE_NAMES(role){
  if(!role) return null;
  if(state.me&&state.me.role===role&&state.me.roleName) return [state.me.roleName.en,state.me.roleName.cn];

  if(!me) return T('Signed in','已登录');

/* ==========================================================================
   Customers — a Worklist that is not a queue. Records arrive, so a record
   nobody has opened wears the unseen surface; but nothing here is WAITING on
   an operator, so the header is the title alone. The strip under it carries
   the segments an operator actually reaches for, with real counts from the
   server; tier chips carry no counts because no endpoint gives them one.

const TIER_LABEL={tree:['Tree','大树'],root:['Root','根系'],sprout:['Sprout','嫩芽'],seed:['Seed','种子']};
function mapCustomer(r){
  return {
    id:r.id, name:r.nickname||'', phone:r.phone||'',
    tier:String(r.tier_key||'seed'),
    orders:Number(r.orders_count||0),
    spend:Number(r.lifetime_spend||0),
    // Points and wallet are the shop's own liabilities, and the desktop gives
    // each a column. The phone showed neither on the row — you had to open the
    // record to find out you were holding someone's money.
    points:Number(r.points_balance||0),
    wallet:Number(r.balance||0),
    chan:String(r.channel||'').toLowerCase()||null,
    seen:r.last_login_at||null, joined:r.created_at||null,
    everSeen:!!r.last_login_at,
    unseen:!r.seen_at, blocked:!!r.is_blocked,
  };
}
function custFiltered(){ return state.customers||[]; }
function custFiltered0(){ return (state.custSeg||'all')==='all'&&(state.custTier||'all')==='all'&&(state.custChan||'all')==='all'&&!state.custQ; }
/* The pulse renders as one line, not tiles: four tiles cannot share a phone's
   width, and showing two of them would be an arbitrary subset. It renders only
   the figures the server actually returned. */
/* Three figures on one line, in a row it shares with the sort control, at
   390px. It was nowrap with an ellipsis, so it clipped at "17 buyers · 53%
   returning · 225 never o…" — losing the one figure the line exists to
   surface. It wraps now: two short lines beat one clipped one. */
function custPulse(){
  const m=state.custMeta||{}; const bits=[];
  if(m.buyers!=null) bits.push(T(m.buyers+(m.buyers===1?' buyer':' buyers'), m.buyers+' 位买家'));
  // 0% is printed, not omitted — see loadCustomerMeta.
  if(m.returnRate!=null) bits.push(T(m.returnRate+'% returning', m.returnRate+'% 复购'));
  if(m.never!=null) bits.push(T(m.never+' never ordered', m.never+' 位未下单'));
  return bits.join(' · ');
}

/* The desktop gives the signup channel a column of its own. Nearly every row in

/* The customer record. Read-only for now — every figure on it is one the
   server already computes, and none of the write flows (points, wallet, block)
   exist on the phone yet. Opening it stamps seen_at server-side, which is what
   settles the row's unseen surface on the way back. */
/* ---- the customer record's remaining sections -------------------------
   The desktop's drawer carries eleven blocks. The phone rendered four of them
   and fetched all eleven — every one of these reads a field the same call
   already returned. */
function custSection(title,body,right){
  if(!body) return '';
  return `<div style="margin-top:16px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px">
      <span style="font-size:13px;font-weight:500;color:var(--text-secondary)">${title}</span>
      ${right||''}</div>${body}</div>`;
}
const custRow=(l,r,sub)=>`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 16px">
  <span style="min-width:0"><span style="display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span>
  ${sub?`<span class="num" style="display:block;font-size:12.5px;color:var(--text-secondary);margin-top:2px">${sub}</span>`:''}</span>
  <span class="num" style="flex:none;font-size:14.5px;text-align:right">${r}</span></div>`;
const custList=rows=>rows.length?`<div class="list">${rows.map((r,i)=>(i?'<div class="sep"></div>':'')+r).join('')}</div>`:'';

/* The orders themselves, and every one of them opens.
   This block was five inert lines. An operator reading a customer's history
   could see that one of their orders came to ¥117.50 and had no way from here
   to find out what was in it, whether it shipped, or where it went: the number
   had to be memorised, the record closed, the Orders tab opened and searched —
   and a customer's tenth-oldest order is not on the page the list has loaded,
   so often that search found nothing either. The row carries the order's
   numeric id, which is the whole of what the detail read needs, so the order
   opens over the record and closing it puts the record straight back.

   Two smaller things were wrong with the line as it stood. The date under the
   number was blank on every row — the query is `placed_at AS created_at` and
   this read `r.placed_at`, a field no row has — and the status was missing
   entirely, so a refunded order and a delivered one read identically.

   The onclick carries the INDEX into recent_orders, never the order number:
   the number is written into a JS string literal inside an HTML attribute, and
   the same rule that keeps category names out of chip keys applies here. */
function custRecentOrders(d){
  const rows=(d.recent_orders||[]).slice(0,5);
  if(!rows.length) return '';
  return custSection(T('Recent orders','最近订单'), `<div class="list">${rows.map((r,i)=>{
    const sk=ORDER_STATUS[r.status]||null;
    const sub=[fmtDay(r.created_at||r.placed_at), sk?T(sk[1],sk[2]):''].filter(Boolean).join(' · ');
    // The id is what the detail read is addressed by. Without one there is
    // nothing to open, so the row stays a line of text and keeps the chevron
    // to itself — a chevron on a row that cannot go anywhere is a promise.
    const go=r.id!=null;
    const inner=`<span style="flex:1;min-width:0">
          <span class="num" style="display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(r.order_no||('#'+r.id))}</span>
          ${sub?`<span class="num" style="display:block;font-size:13px;color:var(--text-secondary)">${sub}</span>`:''}</span>
        <span class="num" style="flex:none;font-size:15px">${money(CUR,r.total)}</span>
        ${go?`<span style="flex:none;color:var(--text-secondary);display:flex">${ic('chevron-right')}</span>`:''}`;
    return `${i?'<div class="sep"></div>':''}
      ${go?`<button class="row" style="gap:12px" onclick="APP.cmd('openCustOrder',${i})">${inner}</button>`
          :`<div class="row" style="gap:12px;cursor:default">${inner}</div>`}`;
  }).join('')}</div>`);
}

/* The catalogue view used to describe the fifty rows boot happened to fetch:
   the chips under it were wired to 'noop' and filtered nothing, and every count
   beside them was either the mock's or a fraction of the shelf. The desktop
   holds the whole catalogue and narrows it in the browser; so does this — read
   the first time Products is opened, not at boot, because a phone should not
   pay for a screen nobody has looked at. */
function loadCatalogue(){
  if(state.catalogueTried) return;
  state.catalogueTried=true; state.catalogueLoading=true;
  api('/products?limit=500').then(rows=>{
    state.catalogueLoading=false;
    // `Array.isArray`, not `rows.length` — a shop with no products yet must
    // see no products, not the mock's six.
    if(Array.isArray(rows)){ DB.products=rows.map(mapProduct); state.liveProductsLoaded=true; }
    render();
  }).catch(()=>{ state.catalogueLoading=false; render(); });
}
/* Chip keys are the INDEX, never the category name: chipRow writes the key into
   an onclick, and a shelf called "Chef's picks" would end the JS string there. */
function prodCategories(){
  const seen=[];
  (DB.products||[]).forEach(p=>{ const c=String(p.cat||'').trim(); if(c&&seen.indexOf(c)<0) seen.push(c); });
  seen.sort((a,b)=>a.localeCompare(b));
  return [{key:'all',en:'All categories',zh:'全部分类'}].concat(seen.map((c,i)=>({key:String(i),en:c,zh:c})));
}
function prodCatName(){
  const k=state.prodCat;
  if(!k||k==='all') return null;
  const c=prodCategories().find(x=>x.key===k);
  return c?c.en:null;
}
/* One catalogue card. The desktop's is a photograph with its marks on it, a
   name, its sizes, and the switch that takes it off the shop; the phone's was a
   line of text. A picture is what a person recognises a product by and what a
   small screen is best at, so it leads here too. */
function productCard(u){
  const p=u.p;
  const members=u.group?u.members:[p];
  const anyOut=members.filter(m=>m.pub&&m.stock<=0).length;
  // A family shows the group OWNER's photo, and the owner is whichever size was
  // created first — not necessarily the one anybody photographed. Fall back to
  // any sibling that has one, so a family is never a blank square because of
  // which row happens to own the group.
  const img=p.img||((members.find(m=>m.img)||{}).img)||'';
  const busy=state.prodBusy==='shop'+members[0]._id;
  const on=members.some(m=>m.pub);
  const ids=members.map(m=>m._id).join(',');
  // A family's price is a range when its sizes differ, and one figure when they
  // do not — quoting the cheapest size as THE price is how a shop undercharges.
  const lo=Math.min.apply(null,members.map(m=>m.priceNum||0));
  const hi=Math.max.apply(null,members.map(m=>m.priceNum||0));
  const priceTxt = (u.group&&hi>lo) ? money(CUR,lo)+'–'+money(CUR,hi) : p.price;
  /* The row used to carry BOTH a "Live" pill and an "On shop" switch, which
     are the same fact twice — is_published — with a stock figure beside them
     saying the rest of what "Live" means. And "Draft" is the switch in its off
     position, spelled out. So the pill is drawn only when it says something
     the switch cannot: Low, Out, or a supplier item the operator has Paused.
     The label under the switch names what the switch controls and stays put;
     it was an on/off echo, set at 10.5px, below the type scale's floor. */
  const statusPill = p.kind==='restock'||p.kind==='off';
  const marks=[];
  if(u.group) marks.push({t:T(members.length+(members.length===1?' size':' sizes'),members.length+' 规格'),sev:'muted'});
  if(p.bundle) marks.push({t:T('Bundle','套装'),sev:'muted'});
  if(anyOut&&u.group) marks.push({t:T(anyOut+' out of stock',anyOut+' 项缺货'),sev:'amber'});
  return `<div class="card" style="display:flex;gap:12px;padding:12px;align-items:flex-start">
    <button onclick="APP.cmd('openProduct','${escAttr(p.sku)}')" style="display:flex;gap:12px;flex:1;min-width:0;text-align:left;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;color:var(--text-primary)">
      <span style="width:56px;height:56px;flex:none;border-radius:10px;overflow:hidden;background:var(--surface-raised);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;color:var(--text-secondary)${img?`;background-image:url('${String(img).replace(/'/g,'%27')}');background-size:cover;background-position:center;border-color:transparent`:''}">${img?'':ic('shopping-bag',22)}</span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <span style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">

/* _paUnits, on a phone: siblings of one variant group collapse into a single
   card carrying its members. A family of one is just a product. */
function prodUnits(rows){
  const byGid=new Map();
  rows.forEach(p=>{ if(!p.gid) return; if(!byGid.has(p.gid)) byGid.set(p.gid,[]); byGid.get(p.gid).push(p); });
  const units=[], seen=new Set();
  rows.forEach(p=>{
    if(!p.gid){ units.push({group:false,p}); return; }
    if(seen.has(p.gid)) return;
    seen.add(p.gid);
    const members=byGid.get(p.gid).slice().sort((a,b)=>
      (a.vSort-b.vSort) || String(a.vLabel).localeCompare(String(b.vLabel)) || (a._id-b._id));
    if(members.length<2){ units.push({group:false,p:members[0]}); return; }
    const rep=members.find(m=>m._id===p.gid)||members[0];
    units.push({group:true,p:rep,members});
  });
  return units;
}
const PROD_STATUS_KIND={live:'on',draft:'draft',low:'restock',out:'off'};
function prodFiltered(){
  const q=String(state.prodQ||'').trim().toLowerCase();
  const cat=prodCatName();
  const want=PROD_STATUS_KIND[state.prodStatus||'all'];
  return (DB.products||[]).filter(p=>{
    if(q){
      // Live rows carry a prebuilt haystack; the sample rows do not, so fall
      // back to both names and the SKU — the desktop's own three fields.
      const hay=p.hay!=null?p.hay:((p.name||[]).join(' ')+' '+(p.sku||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    if(cat&&String(p.cat||'')!==cat) return false;
    if(want&&p.kind!==want) return false;
    return true;
  });
}

/* Five destinations, matching the desktop shell's bottom nav. Inbox and Sales
   moved into More (the inbox also rides every top-level page header, so it is
   never more than one tap away). There is no drill-down here: a five-item bar
   and a fourteen-row rail are different problems, and More stays one flat,
   grouped list. */
/* ══════════════════════════════════════════════════════════════════════════
   WHAT THIS OPERATOR CAN REACH
   ──────────────────────────────────────────────────────────────────────────
   The desktop has hidden nav by capability since caps went live (01-core.js
   applyCapGates + TAB_CAP). This app never did: TAB_META and MORE_GROUPS were
   static lists, so every operator got the owner's app. A kitchen account let
   out of the Add Stock app landed on a Home board of revenue it may not see,
   over five tabs and thirty More rows it cannot use — its two actual tools,
   Add stock and Receiving, buried among them.

   Same map, same keys and the same fail-open rule as the desktop, because two
   maps drift and the one that drifts is the one nobody looks at. What differs
   is only HOW it is applied: this screen re-renders template strings into
   #content rather than walking a live DOM, so the filter runs BEFORE the render
   instead of hiding nodes after it.

   A route with no entry here is ungated, deliberately — the same "untracked
   tabs stay visible" rule the desktop states. Adding a screen never hides it by
   accident; it just does not gate until somebody maps it. */
const ROUTE_CAP={
  // The five destinations.
  home:'dashboard:view', orders:'orders:view', customers:'customers:view', products:'products:view',
  /* NEW ORDER IS GATED ON EDIT, NOT ON VIEW — the same call Receiving's line
     below makes, for the same reason. It is a screen whose entire purpose is
     the Create at the bottom of it, and that create is gated on `orders:edit`
     server-side (lib/cap-routes.js). Offering it to somebody holding
     orders:view alone is a form that 403s after the order has been typed. */
  neworder:'orders:edit',
  // More → Operations. sales and trend both read /dashboard, so they are gated
  // on the capability that endpoint belongs to and not on a reports key they
  // never touch.
  inbox:['reviews:view','feedback:view'], sales:'dashboard:view', trend:'dashboard:view',
  delivery:'delivery:view', invoices:'invoices:view', purchasing:'purchasing:view',
  /* RECEIVING IS GATED ON RECEIVE, NOT ON VIEW. It is a screen whose entire
     purpose is the save at the bottom of it, and that save is gated on
     purchasing:receive server-side (lib/cap-routes.js). Showing it to a holder
     of purchasing:view alone would be a screen whose only action 403s. */
  receiving:'purchasing:receive', receive:'purchasing:receive',
  /* WASTE IS GATED ON VIEW, NOT ON RECORD — the opposite call to Receiving's
     one line above, and for the opposite reason. Receiving is a screen whose
     entire purpose is the save at the bottom of it, so a viewer gets a page
     that 403s. This one is a LEDGER: waste:view is a real grant on its own
     (an owner reading what the shop lost holds it without waste:record), and
     the page reads correctly with the CTA gone. The record button carries the
     second capability itself — see SUBS.waste's cta. */
  waste:'waste:view',
  /* `till` is deliberately ABSENT from this table — it is the one route that
     needs ALL of a pair rather than any of it, and an array here means any-of.
     Its gate is the named branch in canRoute() below. */
  stockadd:'quickstock:add',
  stockapp:['quickstock:add','quickstock:recount'],
  /* THE KITCHEN'S QUEUE, WHICH IS WHY IT IS HERE AND NOT ONLY IN /stock. The
     queue shipped as a tile on the Stock home, and a kitchen operator whose
     role puts them in THIS app never sees that home — they see this list, and
     "Add stock" is not a name anybody reads as "the orders waiting for you".
     Gated on fulfil, the capability the queue's own writes are gated on, so the
     row cannot appear for somebody whose first tap 403s. */
  kitchenq:'restock:fulfil',
  /* THE TRANSFER LAUNCHER, gated on the three transfer capabilities and NOT on
     fulfil. A kitchen account holds fulfil alone: /stock would refuse it every
     tile behind this row and hand it a launcher carrying nothing but the queue
     — which is the row directly above. Any-of the three, because the launcher
     itself shows a tile per job and each of those is refused on its own. */
  transfers:['restock:pick','restock:receive','restock:request'],
  // More → Marketing.
  coupons:'coupons:view', flash:'flash:view', popups:'popups:view', affiliate:'affiliate:view',
  sharecards:'sharing:edit', broadcasts:'broadcasts:view', social:'social:edit',
  // More → Loyalty & Wallet.
  membership:'loyalty:view', wallet:'topup:edit', leaderboard:'leaderboard:edit', voting:'voting:edit',
  // More → Content.
  editor:'editor:view', about:'content:view', media:'media:view', legal:'content:view', faq:'content:view',
  // Settings, and the screens reached from inside it or from the Products strip.
  settings:['settings:shop','settings:push','settings:payments','stores:view','shipping:config'],
  setup:['settings:shop','stores:view'],
  team:'team:view', categories:'categories:view', activity:'activity:view',
};
/* Fail-OPEN on null, exactly as the desktop's can()/canAny(): caps are null only
   on a resolution hiccup or a stale session, and an operator locked out of their
   own app by a hiccup is worse than one shown a row they cannot use. */
function mCan(v){
  if(!state.caps) return true;
  if(v===undefined) return true;
  return Array.isArray(v) ? v.some(k=>state.caps.indexOf(k)!==-1) : state.caps.indexOf(v)!==-1;
}
function canRoute(k){
  /* THE TILL NEEDS BOTH CAPS, and it is the only route that does. Receiving's
     note in ROUTE_CAP makes the argument: a screen whose entire purpose is the
     save at the bottom of it must not be offered to somebody whose save will
     403. The till's Confirm posts the ordinary manual order, which
     lib/cap-routes.js gates on `orders:edit` — so `till:use` on its own is a
     tablet that rings up a basket and then refuses to take the money.
     Written here as an explicit && rather than as a third array syntax in the
     table: one route needs this, and a table where an array sometimes means
     any-of and sometimes all-of is a table nobody can read. */
  if(k==='till') return mCan('till:use') && mCan('orders:edit');
  return mCan(ROUTE_CAP[k]);
}
/* The Quick Stock app is a separate PWA, so its row LEAVES rather than pushing a
   screen. Its label is the mode the operator will actually land in: /stock picks
   add-vs-recount by role, and recount is what anyone holding both resolves to
   (routes/retail-inventory.js quick-stock/context), so recount wins here too. */
function stockAppInApp(){ return !mCan('quickstock:recount') && mCan('quickstock:add'); }
function stockAppLabel(){
  return stockAppInApp() ? ['Add stock','加库存'] : ['Quick stock','快速库存'];
}

const TAB_META={home:{en:'Home',zh:'概览',icon:'house'},orders:{en:'Orders',zh:'订单',icon:'package'},
  customers:{en:'Customers',zh:'顾客',icon:'users'},products:{en:'Products',zh:'产品',icon:'shopping-bag'},
  more:{en:'More',zh:'更多',icon:'menu'}};
/* Unseen is one 6px Sage dot — never a count, never red. A count in the chrome
   turns arriving work into an alarm, and a record arriving is the CUSTOMER
   acting, not the system: it does not earn Dusk either.
   --------------------------------------------------------------------------
   Both dots used to be unclearable, in two different ways.

   ORDERS read DB.orders — the boot prefetch's snapshot, taken once and never
   written again, while the list the operator actually reads and taps lives in
   state.ordersView. So opening every order on the screen changed nothing the
   dot could see: it stayed lit until a reload, and after the reload it lit
   again from the same stale array.

   THE INBOX counted reviews missing from an in-memory Set. A reload empties a
   Set, so "mark all read" lasted exactly as long as the page did. The desktop
   solved this years ago and the phone simply did not follow it: a last-seen
   TIMESTAMP in localStorage per category, and a server endpoint that counts
   what arrived after it (reviews/unseen-count, feedback/unseen-count). That
   survives a reload because it is not in memory, and it counts feedback too —
   which the phone's Set never did, though the dot sits on the inbox button. */
const INBOX_SEEN_KEY='tacet.m.inboxSeen';
function inboxSeenAt(){
  try{ return localStorage.getItem(INBOX_SEEN_KEY)||''; }catch(e){ return ''; }
}
function markInboxSeen(){
  try{ localStorage.setItem(INBOX_SEEN_KEY,new Date().toISOString()); }catch(e){}
  state.inboxUnseen=0; render();
}
/* Polled once per app start and again whenever the inbox is opened or left —
   the same events the desktop repaints on. */
function loadInboxUnseen(force){
  if(state.inboxPolled&&!force) return;
  state.inboxPolled=true;
  const since=encodeURIComponent(inboxSeenAt());
  Promise.all([
    api('/reviews/unseen-count?since='+since).catch(()=>null),
    api('/feedback/unseen-count?since='+since).catch(()=>null),
  ]).then(([rv,fb])=>{
    const n=Number((rv&&rv.count)||0)+Number((fb&&fb.count)||0);
    state.inboxUnseen=n; render();
  }).catch(()=>{});
}

/* ── The new-order chime ───────────────────────────────────────────────────
   Settings has said "Sound" since this app shipped and the phone has never
   made one. The switch flipped a boolean nothing read, and nothing on the
   phone was watching for an order to arrive in the first place: orders are
   fetched when you OPEN the Orders tab and never again, so a phone sitting on
   Home at the counter learned about an order when somebody thought to pull
   down. The desktop has had the ding since it had orders
   (retail-admin/04-orders.js) — the phone simply never got it.

   Same two notes as the desktop, deliberately: G5 → C6, a sine pair 160ms
   apart. One store, one sound, whichever screen it comes out of. Synthesised
   rather than an .mp3 so there is no asset to ship, cache-bust, or lose to the
   service worker.

   The volume is the desktop's (0.18 peak). A phone speaker is not a laptop's,
   but louder here reads as an alarm, and an order arriving is not an alarm. */
let _chimeCtx=null;
/* Autoplay policy, and iOS's is the strict one: a page may only build or
   resume an AudioContext inside a user gesture, and iOS re-suspends it every
   time the app goes to the background. So it is armed on the first touch of
   the session and re-woken whenever the app comes back to the front — by then
   the operator has tapped SOMETHING, and the context is already warm when a
   poll 20 seconds later wants to ring it. */
function unlockChime(){
  try{
    if(!_chimeCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; _chimeCtx=new AC(); }
    if(_chimeCtx.state==='suspended') _chimeCtx.resume().catch(()=>{});
  }catch(e){ return null; }
  return _chimeCtx;
}
['pointerdown','touchstart','click','keydown'].forEach(ev=>
  window.addEventListener(ev,unlockChime,{once:true,capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&_chimeCtx) unlockChime(); });
/* `force` is the Settings preview — it rings even from the row that is about
   to be switched on, which is the only way to hear what you are turning on. */
function playOrderChime(force){
  if(!state.sound&&!force) return;
  /* A phone lives in a pocket, on silent, in a shop with a fan running. The
     buzz is the half of the notification that survives all three — same
     signal, different sense. Guarded: desktops and iOS Safari have no
     vibrator and answer undefined. */
  try{ if(navigator.vibrate) navigator.vibrate([60,90,60]); }catch(e){}
  const ctx=unlockChime(); if(!ctx) return;
  try{
    const now=ctx.currentTime;
    [[784,0],[1047,0.16]].forEach(([freq,at])=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      const t=now+at;
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.exponentialRampToValueAtTime(0.18,t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t+0.45);
    });
  }catch(e){}
}

/* ── What the chime listens to ─────────────────────────────────────────────
   /orders/unseen-count — the same endpoint and the same 15s cadence as the
   desktop, so the two agree about what "new" means instead of each deciding.
   The server counts orders still in their just-placed state (paid /
   awaiting_restock) placed after this phone's last-seen stamp, which is what
   makes the dot go out everywhere the moment ANYONE handles the order, on any
   device. Marketplace mirrors (Meituan, gzgrocery) are excluded server-side —
   they are a ledger we copy, not work this store picks up.

   The ding fires on a genuine INCREASE only, and never on the first poll of a
   session: a backlog of eleven unhandled orders from yesterday lights the dot,
   it does not play eleven dings at a phone being unlocked. */
const M_ORDERS_SEEN_KEY='tacet.m.ordersSeen';
const ORDERS_POLL_MS=15000;
let _ordersUnseenPrev=null, _ordersPollBusy=false;
function ordersSeenAt(){ try{ return localStorage.getItem(M_ORDERS_SEEN_KEY)||''; }catch(e){ return ''; } }
function markOrdersSeen(){
  try{ localStorage.setItem(M_ORDERS_SEEN_KEY,new Date().toISOString()); }catch(e){}
  state.ordersUnseen=0; _ordersUnseenPrev=0;
}
/* Its own fetch, deliberately NOT api(). api() sends a 401 straight to
   /backend/login, which is right for a tap the operator just made and wrong for
   a heartbeat: a session that lapses overnight, or one restart of the box, and
   every phone in the shop navigates itself to a login screen from inside a
   pocket — the app the operator left open is simply gone when they pick it up.
   A background check that cannot be heard should not be able to move the app
   either. On any failure it goes quiet and tries again in fifteen seconds; the
   operator's next real tap gets the honest bounce. */
function fetchUnseenOrders(){
  return fetch(apiURL('/orders/unseen-count?since='+encodeURIComponent(ordersSeenAt())),
               {credentials:'same-origin',headers:{accept:'application/json'}})
    .then(r=>r.ok?r.json():null)
    .then(j=>(j&&j.data!==undefined)?j.data:j);
}
function pollUnseenOrders(){
  /* ORDERS ARE NOT EVERYONE'S WORK. This polled, dinged and toasted "New order"
     for every operator, because it predates roles reaching this app at all. A
     kitchen account was woken by a sale it cannot see, cannot open and cannot
     act on — arriving work as an alarm, and not even its own. Gated on the same
     capability that reveals the Orders screen, and gated HERE so the request is
     never made rather than made and its answer discarded. */
  if(!canRoute('orders')) return;
  if(!state.live||_ordersPollBusy) return;
  /* One request in flight at a time. Coming back to the app fires focus AND
     visibilitychange together, and two answers racing to compare themselves
     against the same previous count is two dings for one order. */
  _ordersPollBusy=true;
  return fetchUnseenOrders().then(d=>{
    _ordersPollBusy=false;
    if(!d) return;
    const n=Number(d.count||0);
    const arrived=_ordersUnseenPrev!==null&&n>_ordersUnseenPrev;
    const litBefore=state.ordersUnseen>0;
    _ordersUnseenPrev=n; state.ordersUnseen=n;
    /* Seen BEFORE the repaint, not after: the operator standing on the Orders
       list is looking at the thing the dot points at, and stamping first means
       the toast below draws over a tab bar that is already clean. */
    if(state.tab==='orders'&&!state.stack.length) markOrdersSeen();
    /* Rings even while the operator is standing on the Orders list. The desktop
       treats that tab as "already seen" and stays quiet, which is fair on a
       monitor you are facing; a phone is face-down on the counter with the
       Orders list still open behind the lock screen, and silence there is the
       exact complaint. */
    if(arrived){
      playOrderChime();
      showToast(n>1?T(n+' new orders',n+' 个新订单'):T('New order','新订单'));
      return;   // showToast has already repainted
    }
    /* Everything below is why this does NOT render on every tick. render()
       rewrites the whole app in one innerHTML, so a repaint every fifteen
       seconds would throw away the scroll position of whatever list the
       operator is reading and the caret of whatever field they are typing in —
       four times a minute, forever, for a dot that did not move. It repaints
       when the dot actually changes state and at no other time. */
    if((state.ordersUnseen>0)!==litBefore) render();
  }).catch(()=>{ _ordersPollBusy=false; });
}
(function startOrdersPoll(){
  /* Not gated on document.hidden the way the desktop's poller is. A hidden tab
     on a monitor has nobody in front of it; a phone with the screen off is in
     the apron pocket of the person the ding is FOR. The browser throttles a
     background timer to about a minute on its own, which is the right cost. */
  setTimeout(pollUnseenOrders,1200);
  setInterval(pollUnseenOrders,ORDERS_POLL_MS);
  /* Coming back to the app re-checks immediately rather than waiting out the
     rest of a throttled interval — a phone picked up should already know. */
  window.addEventListener('focus',pollUnseenOrders);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pollUnseenOrders(); });
})();

/* ── The kitchen finished what we asked for ────────────────────────────────
   THE COMPLAINT THIS ANSWERS. A warehouse account asks the kitchen to make
   something ("Ask the kitchen", on the /stock launcher) and then hears nothing
   in this app at all. warehouse→kitchen closes at 'prepared' — nothing travels,
   so there is no delivery to watch and no receipt to count in — and the only
   announcement was a push (routes/restock.js, PUSH_AUDIENCE): one moment, on
   one phone, regularly in a pocket, on silent, or swiped away. The work was
   done and the app carried no trace of it.

   So it gets the same chrome every other piece of arriving work gets: one Sage
   dot, on More and on the row that opens it. Never a count and never red — the
   kitchen finishing a job is good news, not an alarm.

   IT IS NEWS, NOT A JOB, and the first cut of this got that wrong. The dot went
   out on a "Collected" button in /stock, which invented a step Roots does not
   have: the kitchen puts what it makes straight on the shelf and records the
   stock itself, so nothing is waiting for the warehouse to go and fetch. All
   the warehouse needs is to KNOW.

   SO IT CLEARS ON BEING READ, and the read is written down server-side
   (`seen_at`, stamped when somebody opens the list). One person looking clears
   it for the whole warehouse — a localStorage "last seen" would have gone out
   only here and lit again on the next handset, sending the next person to check
   on something the team already knew. It is the property the Orders dot has and
   the Inbox dot does not. */
const KITCHEN_READY_POLL_MS=60000;
let _kitchenReadyPrev=null, _kitchenReadyBusy=false;
/* WHO IS ASKED. The same pair routes/restock.js addresses the 'prepared' push
   to — the people who raise these requests. A fulfil-only kitchen operator is
   the one who MADE it, and telling them their own work is waiting is telling
   them about themselves. */
function canSeeKitchenReady(){ return mCan(['restock:request','restock:pick']); }
/* Its own fetch rather than api(), for the reason fetchUnseenOrders states: a
   401 out of a heartbeat would navigate a phone sitting in a pocket to the
   login screen. On any failure it goes quiet and tries again in a minute. */
function pollKitchenReady(){
  if(!canSeeKitchenReady()||!state.live||_kitchenReadyBusy) return;
  _kitchenReadyBusy=true;
  return fetch('/api/restock/kitchen-ready',{credentials:'same-origin',headers:{accept:'application/json'}})
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      _kitchenReadyBusy=false;
      const d=j&&j.data!==undefined?j.data:j;
      if(!d) return;
      const n=Number(d.count||0);
      const arrived=_kitchenReadyPrev!==null&&n>_kitchenReadyPrev;
      const litBefore=state.kitchenReady>0;
      _kitchenReadyPrev=n; state.kitchenReady=n;
      /* Announced on a genuine increase only, and never on the first poll of a
         session: a backlog of four unread finishes lights the dot, it does not
         toast four times at a phone being unlocked. No chime — the ding belongs
         to a customer arriving, and this is a colleague finishing. */
      if(arrived){
        showToast(n>1?T(n+' kitchen requests are ready',n+' 项厨房申请已完成')
                     :T('The kitchen finished a request','厨房已完成一项申请'));
        return;   // showToast has already repainted
      }
      /* Repaint only when the dot actually changes state. render() rewrites the
         whole app in one innerHTML, and a repaint on every tick throws away the
         scroll position of whatever list is being read. */
      if((state.kitchenReady>0)!==litBefore) render();
    }).catch(()=>{ _kitchenReadyBusy=false; });
}
(function startKitchenReadyPoll(){
  setTimeout(pollKitchenReady,2000);
  setInterval(pollKitchenReady,KITCHEN_READY_POLL_MS);
  window.addEventListener('focus',pollKitchenReady);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pollKitchenReady(); });

/* Frame 4 of the canvas, "One header" — built as drawn. The old top bar carried
   a wordmark and then a SECOND header underneath it repeating the page's name;
   this is that bar, with the page's name in it instead. It is a bar and not a
   heading with icons parked beside it, which is what the hairline underneath is
   for: it closes the band, so everything below it is content.

   The title is 20px here, one step off the 24/18 type scale. That is deliberate
   and it is the one place in the app that does it: 24px next to a 38px control
   makes the control look small, and 18px makes the page's own name quieter than
   a card heading. Recorded so the next person knows it was chosen, not missed.

function pageHead({title, status, cta, back, controls}){
  const right = (cta||'') + (controls?headControls():'');

     TARGET was landing flush against the screen edge, where the browser's own
     scroll indicator and the edge-swipe gesture live, so reaching for it
     caught the scrollbar instead. The icons still read as flush; it is the
     44px target underneath them that needed the room. */

    ${back?`<button onclick="APP.cmd('back')" style="display:flex;align-items:center;gap:6px;margin:0 0 6px -4px;padding:8px 4px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--text-secondary)">${ic('chevron-left',16,2)}${back}</button>`:''}

         10px either way that makes one look right and the other look jammed.
         The note above is about ICON controls: their glyph is centred in a
         44px target, so it reads ~11px inside its own box and the band's 10px
         lands it optically flush. A Dusk slab has no such inset — its painted
         edge IS the box edge — so at 10px it sits closer to the screen edge
         than the title does to the other one (16px), which is what "too stuck

      <h1 style="flex:1;min-width:0;margin:0;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</h1>
      ${right}
    </div>
    ${/* Inside the band, under the title, ABOVE the rule. It used to sit below
         the hairline, which put the page's own status on the content side of
         the line — so it read as the first item of the list rather than as
         part of the head, and on Orders it floated between the rule and the
         filter chips belonging to neither. §1.7 is one head: title, status,
         then the line that closes it. */''}

         what it currently amounts to — and they were reading as two stacked
         items. Tight to the title, with the band's own bottom padding giving
         them room above the rule instead. */''}

}
/* THE BAR IS FOR OPERATORS WITH SOMEWHERE ELSE TO BE, and for most of them it
   is unchanged: four destinations plus More, each dropping out if its
   capability is missing.

   AN OPERATOR WHOSE WHOLE JOB IS "More" GETS NO BAR AT ALL. Their tools become
   the HOME SCREEN — the list itself, under their role's name — and every tool
   pushes a screen that comes back to it.

   The bar was tried first and rejected, for the reason a bar always fails here:
   it is a fixed number of slots, and a role is not. Two tools fit; eight do not,
   and a bar that quietly becomes "four plus More" has put the lid back on. A
   list has no such ceiling — it is the same control at two tools and at thirty,
   it can carry headings, and it is what More already was. The cost is one tap
   to the most-used tool, paid once, instead of a design that breaks at seven.

   bar and More stays a folder. */
const TAB_KEYS=['home','orders','customers','products'];
/* Does this operator navigate by bar, or is the tool list their home? */
function flatNav(){ return !TAB_KEYS.some(canRoute); }

function homeTitle(){

function navTabs(){

                                               cmd:`APP.cmd('tab','${k}')`,tab:k}));

function tabOn(t){ return state.tab===t.tab && !state.stack.length; }

      <span style="position:relative;display:flex;align-items:center;justify-content:center;height:24px;width:24px">${ic(m.icon,22,on?2:1.75)}
      ${tabDot(m.key)?`<span style="position:absolute;top:-2px;left:16px;width:6px;height:6px;border-radius:50%;background:var(--sage)"></span>`:''}</span>

function bodyHtml(){
  const sub=state.stack[state.stack.length-1];

    // Every one of these screens used to open with its summary as the first row
    // of the BODY — a grey sentence sitting under the rule, indistinguishable
    // from content, and pushing the real content down a line. §1.7 says the
    // header is title · status, and "same for every page" is the point: the
    // number you came for should be in the same place on every screen.
    /* titleOf / backLabel are optional and exist for one screen: Receive, which
       is the first page here pushed from something other than More. Its title
       is the order it is receiving (a number, not a fixed word) and its Back
       goes to Receiving, not More. Every other screen passes neither and reads
       exactly as it always did. */
    return pageHead({title:def.titleOf?def.titleOf():T(...sub.title),
      back:def.backLabel?def.backLabel():(flatNav()?escAttr(homeTitle()):T('More','更多')),
      cta:def.cta?def.cta():'', status:def.status?def.status():''}) + def.render();
  }
  switch(state.tab){
    case 'home': return screenHome();
    case 'orders': return screenOrders();
    case 'customers': return screenCustomers();
    case 'products': return screenProducts();
    // Titled for what it IS. With no bar under it this list is not a drawer of
    // extras, it is the operator's home, and calling it "More" would name it
    // after a bar that is not there.
    case 'more': return pageHead({title:flatNav()?escAttr(homeTitle()):T('More','更多'), controls:true}) + screenMore();
