/* Held while the app does not yet know who is looking at it. The mark and
   nothing else — no nav to correct a moment later, no numbers, nothing that
   could be wrong. It is the same answer stock.html gives on its own boot, and
   it lasts exactly as long as one /api/backend/me. */
function bootHold(){
  return `<div class="content" style="display:flex;align-items:center;justify-content:center">
    <span style="opacity:.5">${WAVE(150)}</span></div>`;
}
/* WHICH SCREEN THIS IS, for the scroll below. The tab plus the pushed stack:
   answering a line, opening a sheet or a toast landing is the SAME screen and
   holds its place; a push or a change of tab is a DIFFERENT one, which starts
   at the top the first time it is opened and comes back to where it was left
   every time after. */
function screenKey(){ return state.tab+'|'+state.stack.map(f=>f.route).join('>'); }

   whichever screen was painted last, which is all this used to hold. Home is
   where that showed: the Quick actions sit at the BOTTOM of a long board, so
   reaching one is a scroll to the end of Home, and the tap that opens
   Receiving or Waste replaced the single remembered position with the pushed
   screen's own. Back therefore had nothing to return to and Home opened at the
   top — the operator scrolled the whole board again for every shortcut they
   took, which is the exact cost the note below was written to remove.

   tab left and returned to. */
const _scrollMem=Object.create(null);

   did the first time; only the screen being returned to keeps its place.
   NOTED, not deleted, because the render that follows reads the closing
   screen's position off the DOM one last time and would write it straight back
   in. The note is spent inside that render, after the read. */
let _forget=[];
function forgetScroll(){ _forget.push(screenKey()); }
/* And everything pushed under this tab, dropped in one go: switching tabs
   throws the stack away, so the positions inside it go with it. The tab's own
   root is NOT one of them — that is the screen being returned to. */
function forgetPushed(){ const p=state.tab+'|', here=screenKey();
  for(const k in _scrollMem){ if(k.length>p.length&&k.indexOf(p)===0) _forget.push(k); }
  if(here!==p) _forget.push(here); }

   a fresh LOAD of this app — the map above went with the old document, and the
   operator arrived back at the top of Home for the same reason as before. The
   one position that matters rides across in sessionStorage: this tab only,
   gone when the tab is, and read exactly once, here, on the way in.
   It is spent the moment it lands (or the moment the operator touches the
   screen, or after the few seconds a boot takes), so it can never yank a list
   somebody is already reading. */
const M_SCROLL_KEY='tacet-m-scroll';
function bootScrollRead(){
  try{
    const raw=sessionStorage.getItem(M_SCROLL_KEY);
    // Taken as it is read: a position is good for ONE return, and a line left
    // in storage would move a screen the operator opened fresh an hour later.
    sessionStorage.removeItem(M_SCROLL_KEY);
    const v=raw?JSON.parse(raw):null;
    return (v&&typeof v.key==='string'&&v.top>0) ? {key:v.key, top:v.top, until:Date.now()+8000} : null;
  }catch(e){ return null; }
}
let _bootScroll=bootScrollRead();
document.addEventListener('pointerdown',()=>{ _bootScroll=null; },true);
/* Written on the way OUT, whatever takes the app out — a shortcut to /till, a
   mirror link, a reload. pagehide rather than unload: it is the one the phone
   browsers actually fire. */
function saveScrollForReturn(){
  try{
    const c=document.getElementById('content');
    if(c&&c.scrollTop>0) sessionStorage.setItem(M_SCROLL_KEY,JSON.stringify({key:screenKey(),top:c.scrollTop}));

}
window.addEventListener('pagehide',saveScrollForReturn);
function render(){

     Every screen paid for that, but Receiving is where it became unusable:
     twelve lines, one tap each, and after every tap the operator scrolled back
     down to where they were. The file already knew the cost — the orders poll
     deliberately does not repaint for exactly this reason — but nothing put the
     position back.
     Read BEFORE the paint under the key of the screen that is on it, restored
     after it under the key of the screen about to be: a pushed screen that
     inherited the last screen's scroll would open halfway down itself, and a
     screen returned to that inherited nothing would open at the top. */
  const _sc=document.getElementById('content');
  if(_sc&&_scrollKey) _scrollMem[_scrollKey]=_sc.scrollTop;
  if(_forget.length){ _forget.forEach(k=>{ delete _scrollMem[k]; }); _forget=[]; }
  const _skey=screenKey();
  _scrollKey=_skey;
  let _keep=_scrollMem[_skey]||0;
  if(_bootScroll){
    if(_bootScroll.key===_skey&&Date.now()<_bootScroll.until) _keep=Math.max(_keep,_bootScroll.top);
    else _bootScroll=null;   // a different screen, or too late to be a return
  }

     it. The waste form is the first sheet here tall enough to scroll and busy
     enough to repaint on every tap, so it is the first to need this. Both
     halves are unconditional and still correct: a sheet that just opened reads
     0 and restores nothing, and one that just closed has no element to restore
     into. Only this sheet is named — the others repaint far less and are left
     exactly as they are. */
  const _wb=document.getElementById('mWstBody');
  const _wkeep=_wb?_wb.scrollTop:0;

  const _qb=document.getElementById('mQuickBody');

    + installStrip() + tabbar();

  if(state.overflow) html += sheetOverflow();
  if(state.ask) html += sheetAsk();
  if(state.custId) html += sheetCustomer();
  if(state.detailId) html += sheetOrderDetail();
  if(state.detailActions) html += sheetActions();
  if(state.productSku) html += sheetProduct();
  if(state.reply!=null) html += sheetReply();
  if(state.poId!=null) html += sheetPO();
  if(state.chanSheet) html += sheetChannel();
  if(state.quickSheet) html += sheetQuick();

  wirePull();

     the freshly written DOM rather than rebuilt, and torn down when the sheet
     it belongs to is no longer on screen. */

    if(el){ el.focus();
      if(state.focus.pos!=null&&el.setSelectionRange){ try{ el.setSelectionRange(state.focus.pos,state.focus.pos); }catch(e){} } }

}
function wireDrag(){
  const h=document.getElementById('dragHandle'); if(!h) return;

  const up=()=>{ if(!state.dragging) return; state.dragging=false; if(state.drag>110){ state.drag=0; CMD.closeOrder(); } else { state.drag=0; const s=document.getElementById('detailSheet'); if(s){ s.style.transition='transform .3s var(--ease-settle)'; s.style.transform='translateY(0)'; } } };

/* ==========================================================================
   THE APP SHELL
   ------------------------------------------------------------------------
   Everything in this block exists for one reason: this page is meant to be
   INSTALLED — a home-screen icon, its own card in the app switcher, no URL bar
   and no tab strip. A browser gives a page a great deal for free (a reload
   button, a Back button, a way to leave), and an installed app has none of it.
   So each piece below either replaces something the browser chrome was doing,
   or removes something the browser does that an app must not.

     1. pullRing / wirePull  — refresh. There is no reload button in a
                               standalone window, and nothing here polls.
     2. syncHistory / Back   — the phone's Back gesture closes the top layer
                               instead of quitting the app.
     3. installStrip / sheet — how the operator gets it onto the home screen
                               in the first place, on both platforms.
     4. the service worker   — the thing Chrome requires before it will offer
                               Install at all, and the offline shell.
   ========================================================================== */

/* ── 1. Pull to refresh ─────────────────────────────────────────────────────
   The gesture the browser's own pull-to-reload used to occupy (switched off in
   the CSS above, because a reload throws away every screen and sheet the app
   had open). This one refetches instead: same data, same place, nothing lost.

   Numbers: the drag is halved (a 140px pull moves the content 70px) so it
   resists like a real scroll view, capped at 96px, and fires at 64px. */
const PULL_MAX=96, PULL_FIRE=64;
function pullRing(){

  // sentence would be half-covered. The ring says what it means by turning.
  return `<div class="pullring" aria-hidden="true"><svg id="pullSpin"${state.refreshing?' class="spin"':''}
    width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
    style="opacity:${state.refreshing?'1':'0'}">
    <path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg></div>`;
}
function wirePull(){
  const el=document.getElementById('content'); if(!el||state.refreshing) return;
  const ring=document.getElementById('pullSpin');
  let y0=null, pulled=0;
  const reset=(animate)=>{
    if(animate) el.style.transition='transform .3s var(--ease-settle)';
    el.style.transform='';

    setTimeout(()=>{ el.style.transition=''; },animate?320:0);

    // a pinch or a two-finger scroll is not a pull.

    y0=e.touches[0].clientY; pulled=0; el.style.transition='';

    if(ring){ ring.style.opacity=String(Math.min(1,pulled/PULL_FIRE));
      ring.style.transform=`rotate(${pulled*4}deg)`; }
  },{passive:true});
  const end=()=>{
    if(y0==null) return;
    const fire=pulled>=PULL_FIRE;
    y0=null;
    if(!fire){ reset(true); return; }
    // Hand off to the renderer: it draws the content held open at 56px with the
    // ring spinning in the gap, so the state survives the re-render that the
    // refresh itself will cause.
    el.style.transform=''; el.style.transition='';
    refreshNow();
  };
  el.addEventListener('touchend',end,{passive:true});
  el.addEventListener('touchcancel',end,{passive:true});
}
/* What "refresh" means depends on where you are standing: the shared snapshot
   every screen reads from, plus the one paged list the current tab is showing.
   Both are best-effort — a refresh that fails leaves what was already on the
   glass, because the alternative is emptying a working screen over a dropped
   connection. */
function refreshNow(){
  if(state.refreshing) return;
  state.refreshing=true; render();
  const jobs=[Promise.resolve(loadLive()).catch(()=>{})];
  if(state.tab==='orders') jobs.push(Promise.resolve(loadOrdersPage()).catch(()=>{}));
  if(state.tab==='customers') jobs.push(Promise.resolve(loadCustomers()).catch(()=>{}));
  // A spinner that vanishes in 80ms reads as a glitch, not as work — hold the
  // floor at half a second so the gesture visibly did something.
  const floor=new Promise(r=>setTimeout(r,500));
  Promise.all([Promise.all(jobs),floor]).then(()=>{
    state.refreshing=false; state.refreshedAt=Date.now(); render();
  });
}
reg('refresh', refreshNow);

/* ── 2. The Back gesture ────────────────────────────────────────────────────
   On Android, Back in an installed app with nothing on the history stack QUITS
   it. This app opens sheets and pushes screens without navigating, so every one
   of those was invisible to the system: a swipe from the edge to dismiss a
   sheet closed the whole app instead.

   The fix is to keep the history stack as deep as the app's own layers. One
   pushState per open layer, and Back pops the top layer rather than the app.
   Layers are counted from state, not tracked by hand, so a sheet added later
   is covered the day it is added and cannot forget to register itself. */
const HIST_OK = location.protocol==='http:'||location.protocol==='https:';
let histDepth=0, histIgnore=0;
/* Every dismissible layer, outermost first — the order Back closes them in is
   the REVERSE of this list, i.e. whatever is on top goes first. */
function layers(){
  const L=[];
  // state.stack.pop(), not pop(): the helper renders, and the caller here is
  // about to render anyway. One repaint per Back press.
  // forgetScroll() for the same reason pop() calls it: Back CLOSES this screen,
  // and the one underneath is the one with a place to go back to.
  for(let i=0;i<state.stack.length;i++) L.push(()=>{ forgetScroll(); state.stack.pop(); });
  // Order first, record second: the record opens ON TOP of the order it was
  // opened from, and Back closes this list in reverse — topmost first. When the
  // record is what opened the ORDER — a Recent orders row — the pair is stacked
  // the other way up and this list has to follow it, or Back takes away the
  // record underneath and leaves the order it was reached from sitting alone.
  const dropOrder=()=>{ state.detailId=null; state.orderOverCust=false; state.detailFetch=false; };
  const dropCust=()=>{ state.custId=null; };
  if(state.orderOverCust){
    if(state.custId) L.push(dropCust);
    if(state.detailId) L.push(dropOrder);
  } else {
    if(state.detailId) L.push(dropOrder);
    if(state.custId) L.push(dropCust);
  }
  if(state.productSku) L.push(()=>{ state.productSku=null; });
  if(state.poId!=null) L.push(()=>{ state.poId=null; });
  if(state.chanSheet) L.push(()=>{ state.chanSheet=null; });
  if(state.quickSheet) L.push(()=>{ state.quickSheet=false; });
  if(state.reply!=null) L.push(()=>{ state.reply=null; });
  if(state.detailActions) L.push(()=>{ state.detailActions=false; });
  if(state.search) L.push(()=>{ state.search=false; });
  if(state.overflow) L.push(()=>{ state.overflow=false; });
  if(state.installSheet) L.push(()=>{ state.installSheet=false; });
  return L;
}
function syncHistory(){
  if(!HIST_OK) return;
  const n=layers().length;
  try{
    while(histDepth<n){ histDepth++; history.pushState({tacet:histDepth},''); }
    if(histDepth>n){
      // The app closed a layer on its own (a Cancel, a scrim tap). Walk the
      // history back to match, and swallow the popstate that walk will fire —
      // otherwise Back would have to be pressed twice to get anywhere.
      const back=histDepth-n; histDepth=n; histIgnore+=back; history.go(-back);
    }
  }catch(e){ /* a sandbox with no history to push — the app still works */ }
}
if(HIST_OK){
  try{ history.replaceState({tacet:0},''); }catch(e){}
  window.addEventListener('popstate',()=>{
    if(histIgnore>0){ histIgnore--; return; }
    const L=layers();
    if(!L.length) return;   // nothing open: Back leaves, which is correct
    // The browser has already dropped the entry, so the count comes down with it.
    histDepth=Math.max(0,histDepth-1);
    L[L.length-1]();
    render();
  });
}

/* ── 3. Getting onto the home screen ────────────────────────────────────────
   Two platforms, two mechanisms, one strip.

   Chrome/Edge/Samsung fire beforeinstallprompt when the app qualifies (served
   over HTTPS, manifest reachable, service worker registered). Holding onto that
   event is the ONLY way to show the install dialog later — it cannot be
   conjured, so it is caught and kept.

   Safari fires nothing and offers no API. On iOS the same strip opens a sheet
   that tells the operator where the button is, because "Add to Home Screen" is
   three taps into a menu most people have never opened. */
const INSTALL_KEY='tacet-install-off';
let installEvent=null;
const IS_IOS=(()=>{ try{

}catch(e){ return false; } })();

function installOffered(){ return !STANDALONE && (state.canInstall||IS_IOS); }

    <button onclick="APP.cmd('install')" style="flex:none;min-height:36px;padding:0 14px;border:none;border-radius:8px;

function sheetInstall(){

reg('install', async ()=>{
  if(installEvent){
    const e=installEvent; installEvent=null; state.canInstall=false; state.installBar=false; render();
    try{ e.prompt(); const r=await e.userChoice;

      // it stops asking from the bottom of the screen.
      if(r&&r.outcome!=='accepted') try{ localStorage.setItem(INSTALL_KEY,'1'); }catch(err){}
    }catch(err){}

reg('installOff', ()=>{ state.installBar=false; try{ localStorage.setItem(INSTALL_KEY,'1'); }catch(e){} render(); });
reg('closeInstall', ()=>{ state.installSheet=false; render(); });
window.addEventListener('beforeinstallprompt',(e)=>{
  // Chrome's own mini-infobar is not ours to place and covers the tab bar.
  e.preventDefault();
  installEvent=e; state.canInstall=true;
  let off=false; try{ off=localStorage.getItem(INSTALL_KEY)==='1'; }catch(err){}
  state.installBar=!off;

window.addEventListener('appinstalled',()=>{
  installEvent=null; state.canInstall=false; state.installBar=false;
  try{ localStorage.setItem(INSTALL_KEY,'1'); }catch(e){}

/* iOS has no event to wait for, so the strip is offered on a timer instead —
   late enough that it is not the first thing a new operator meets. */
if(IS_IOS&&!STANDALONE){
  setTimeout(()=>{
    let off=false; try{ off=localStorage.getItem(INSTALL_KEY)==='1'; }catch(e){}
    if(!off){ state.installBar=true; render(); }

/* ── 4. The service worker ──────────────────────────────────────────────────
   Required: Chrome will not offer to install an app that has no service worker,
   whatever its manifest says. It also gives the shell an offline copy, so an
   operator in a basement stockroom opens the app rather than a browser error.

   /sw.js is the one shared worker for this origin (kitchen, stock and this all
   register it at scope '/'); it is network-first for HTML, so a deploy is never
   masked by a cached shell. */
/* IS THERE ANYTHING THIS RELOAD WOULD THROW AWAY? Nothing on the receive screen
   is persisted — state.recvVals lives in memory alone — so this is the whole
   guard between a new build and eight ticked lines with a delivery on the
   floor. Add stock is the same: a pending count is a number somebody is
   holding in their head until it lands. */
function mUnsavedWork(){
  try{
    if(state.recvPo&&rcvToSend().length) return true;
    const a=state.qs&&state.qs.add;      for(const k in a) if(a[k]>0) return true;
    const f=state.qs&&state.qs.inflight; for(const k in f) if(f[k]) return true;
  }catch(e){}
  return false;
}
let swPending=false, swReloaded=false;
/* Split from the reload itself so the DECISION can be asserted — a test cannot
   let location.reload() run. */
function mReloadNow(){
  return swPending&&!swReloaded&&!mUnsavedWork()&&document.visibilityState==='hidden';
}
function mMaybeReload(){ if(mReloadNow()){ swReloaded=true; location.reload(); } }
/* The one hook a test needs: it cannot post a service-worker message, and it
   must never let the reload itself run. */
function __swPending(){ swPending=true; }
/* isSecureContext, not a hand-rolled protocol check: it is the browser's own
   answer to the question a service worker actually asks, and it already knows
   the exceptions a string comparison forgets — 127.0.0.1 and localhost count,
   an http:// LAN address does not. */
if('serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(reg=>{
    // An installed app can go weeks without a navigation, and browsers throttle
    // the automatic update check to about a day. Check whenever it comes back
    // to the foreground instead — same as public/kitchen.html.
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible') reg.update().catch(()=>{});
    });
  }).catch(()=>{});
  /* A NEW BUILD MUST NOT TAKE THE SCREEN OUT FROM UNDER SOMEBODY.
     ------------------------------------------------------------------------
     Every deploy re-stamps sw.js, so the first open after one installs the new
     worker, which claims this page and posts sw-updated — and this used to
     answer with an immediate location.reload(). Reported as: open the app, tap
     Receiving, tap something, and the app drops to the loading screen and back
     to the home. Once only, because the worker is current afterwards.

     The bounce is the visible half. The half that matters is that NOTHING ON
     THE RECEIVE SCREEN IS PERSISTED — state.recvVals lives in memory alone — so
     a reload landing on an operator who has ticked eight of twelve lines throws
     all eight away, silently, with a delivery still on the floor.

     So the reload waits for a moment when it costs nothing: no work in
     progress, and the app not on screen. An operator who never backgrounds the
     app simply gets the new build next time they open it, which is what would
     have happened anyway. */
  navigator.serviceWorker.addEventListener('message',(e)=>{
    if(e.data&&e.data.type==='sw-updated'){ swPending=true; mMaybeReload(); }
  });
  document.addEventListener('visibilitychange',mMaybeReload);
}

/* ── 5. Alerts when the app is closed (Web Push) ───────────────────
   The chime above only exists while the app is running. Once the phone is
   locked and the app is swapped out, no timer of ours fires — on iOS the page
   is frozen outright — so an order that lands at 9pm waits until somebody
   picks the phone up. Web Push is the only mechanism that survives that: the
   server tells the phone's push service, the OS wakes the service worker, and
   /sw.js draws a real notification whether or not this page still exists.

   Every piece of that already shipped for the DESKTOP — routes/push.js, the
   /api/backend/push/* endpoints, the push + notificationclick handlers in
   sw.js, and the fan-out inside markOrderPaid() that alerts every operator of
   the tenant on a new paid order. The phone was the one client that never
   enrolled, so it was the one device that never rang.

   Enrolment is EXPLICIT. A page may not ask for notification permission
   unprompted — browsers punish that, and an operator who never asked for
   alerts should not meet a permission sheet on their first launch. Settings
   → Notifications carries the switch; nothing happens until it is tapped. */
const PUSH_SUPPORTED = ('serviceWorker' in navigator) && ('PushManager' in window)
                    && ('Notification' in window) && window.isSecureContext;
/* iOS gives Web Push to INSTALLED apps only — Safari on iOS exposes no
   PushManager at all until the app is on the home screen (16.4+). Worth saying
   in its own words rather than as "your browser cannot do this", because the
   operator is three taps away from being able to. */
const PUSH_NEEDS_INSTALL = IS_IOS && !STANDALONE;
function pushReg(){
  if(!PUSH_SUPPORTED) return Promise.resolve(null);
  return navigator.serviceWorker.getRegistration()
    .then(r=>r?navigator.serviceWorker.ready
              :navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(()=>navigator.serviceWorker.ready))
    .catch(()=>null);
}
function pushSub(){
  return pushReg().then(r=>(r&&r.pushManager)?r.pushManager.getSubscription():null).catch(()=>null);
}
/* The VAPID public key arrives base64url; applicationServerKey wants bytes. */
function b64ToU8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
/* Its own fetch, for the reason the order poll has one: these run at boot, and
   a background call must never be able to throw a signed-out phone at a login
   page before the operator has touched anything. */
function pushFetch(path,body){
  const opt={credentials:'same-origin'};
  if(body!==undefined){ opt.method='POST'; opt.headers={'content-type':'application/json'};
                        opt.body=JSON.stringify(body); }
  return fetch(path,opt).then(r=>r.ok?r.json().catch(()=>({})):null).catch(()=>null);
}
/* Three sources that can disagree, reduced to one word. They disagree often:
   the browser can hold a live subscription for a preference the operator
   switched off on their laptop, and permission can read 'granted' for a device
   that has since been unsubscribed. */
function refreshPushState(){
  if(!PUSH_SUPPORTED){ state.push=PUSH_NEEDS_INSTALL?'needs-install':'unsupported'; render(); return Promise.resolve(); }
  if(Notification.permission==='denied'){ state.push='blocked'; render(); return Promise.resolve(); }
  return Promise.all([pushSub(),pushFetch('/api/backend/push/pref')]).then(res=>{
    const sub=res[0], pref=res[1];
    /* The STORED intent wins over the live subscription. The desktop learned
       this the hard way: an "off" the operator chose read back as "on" the
       moment any other page re-enrolled this device's shared endpoint. */
    const wanted = !pref || pref.enabled!==false;
    state.push = (wanted && sub && Notification.permission==='granted') ? 'on' : 'off';
    /* Permission granted, alerts wanted, and yet no live subscription: push
       endpoints rotate and browsers drop them on their own schedule. Re-enrol
       silently — no sheet, because permission was granted once already and
       asking again is asking twice for the same answer. */
    if(state.push==='off' && wanted && Notification.permission==='granted' && !sub){
      return pushEnrol(true).then(()=>{ state.push='on'; render(); }).catch(()=>{ render(); });
    }
    render();
  }).catch(()=>{});
}
/* `silent` is the re-enrolment above: it must never raise a permission sheet,
   so it gives up rather than ask. */
function pushEnrol(silent){
  return pushFetch('/api/backend/push/vapid').then(v=>{
    if(!v||!v.enabled||!v.publicKey) return Promise.reject('disabled');
    return (Notification.permission==='granted'
              ? Promise.resolve('granted')
              : (silent?Promise.reject('denied'):Notification.requestPermission()))
      .then(perm=>{
        if(perm!=='granted') return Promise.reject('denied');
        return pushReg().then(reg=>{
          if(!reg||!reg.pushManager) return Promise.reject('nosw');
          return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(v.publicKey)});
        });
      })
      .then(sub=>{
        const j=sub.toJSON();
        return pushFetch('/api/backend/push/subscribe',{endpoint:j.endpoint,keys:j.keys})
          .then(r=>{ if(!r) return Promise.reject('save');
            /* An explicit yes lifts the stored mute — including the kitchen-side
               one taken out alongside it on this same device. */
            return pushFetch('/api/backend/push/pref',{enabled:true,endpoint:j.endpoint}); });
      });
  });
}
function pushDrop(){
  /* The intent is recorded FIRST, and independently of the browser. If the
     service worker or the subscription has gone missing the switch must still
     mean off — the desktop shipped a silent false-off exactly this way, where
     the toggle flipped and the next page load quietly undid it. */
  return pushSub().then(sub=>{
    const ep=sub?sub.endpoint:null;
    return pushFetch('/api/backend/push/pref',{enabled:false,endpoint:ep}).then(()=>{
      if(!sub) return;
      return sub.unsubscribe().catch(()=>{})
        .then(()=>pushFetch('/api/backend/push/unsubscribe',{endpoint:ep}));
    });
  });
}
reg('togglePush', ()=>{
  if(state.pushBusy) return;
  if(state.push==='blocked'){
    showToast(T('Allow notifications for this site in your phone settings, then come back.',
                '请先在手机设置中允许本站发送通知，再回来开启。')); return; }
  /* On iOS the answer is not a toggle, it is the install sheet — so open that
     instead of failing at a switch that cannot work yet. */
  if(state.push==='needs-install'){ state.installSheet=true; render(); return; }
  if(state.push!=='on'&&state.push!=='off') return;
  const turningOn=state.push!=='on';
  state.pushBusy=true; render();
  (turningOn?pushEnrol(false):pushDrop())
    .then(()=>{ state.pushBusy=false; state.push=turningOn?'on':'off'; render();
      if(turningOn) showToast(T('This phone will ring for a new order.','新订单将在此手机提醒。')); })
    .catch(err=>{ state.pushBusy=false; render();
      showToast(err==='denied'
        ? T('Allow notifications for this site in your phone settings, then come back.',
            '请先在手机设置中允许本站发送通知，再回来开启。')
        : err==='disabled'
        ? T('Alerts are not set up on this workspace.','此工作区尚未启用推送。')
        : T('That did not go through. Nothing has changed — try again.','没有成功。数据没有变化 — 请重试。'));
      refreshPushState(); });
});
/* Sends one real push through the whole chain — server, push service, OS,
   service worker. It is the only way to answer "will this actually wake my
   phone?" without waiting for a customer to buy something, and it is what
   separates a broken setup from a phone whose Do Not Disturb is eating it. */
reg('pushTest', ()=>{
  if(state.pushBusy) return;
  state.pushBusy=true; render();
  pushFetch('/api/backend/push/test',{}).then(j=>{
    state.pushBusy=false; render();
    showToast(j&&j.sent
      ? T('Sent — look at your notifications.','已发送 — 请查看通知。')
      : T('No device received it. Switch alerts off and on again.','没有设备收到。请将提醒关闭后重新开启。'));
  });
});

/* ==========================================================================
   Live data — binds the core monitoring screens to the store backend's
   /api/retail-admin/* endpoints (same API the desktop admin uses). The page
   self-auths: a 401/403 bounces to the store root. Every map is defensive and
   falls back to the mock content above, so a shape change can never white-screen
   the app — the long-tail marketing/loyalty screens stay on sample data for now.
   ========================================================================== */
const API='/api/retail-admin';
/* Almost everything the phone reads lives under /api/retail-admin, so api()
   prefixes it. Team does not — the roster is /api/backend/team, shared with the
   backend's own login and session routes — so a path that already starts at
   /api/ is taken as given rather than prefixed into /api/retail-admin/api/... */
const apiURL = p => String(p).indexOf('/api/')===0 ? p : API+p;
async function api(path){
  const r=await fetch(apiURL(path),{credentials:'same-origin',headers:{accept:'application/json'}});
  // Match the desktop backend's auth-fail target. Redirecting to '/' would loop
  // once the store root serves this app to phones (root → 401 → root → …).
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  return (j && j.data!==undefined) ? j.data : j;
}
/* The surface's language picks the date convention and then follows it
   completely: English renders US times (2:22 PM), Chinese renders 24-hour
   (14:22). There is no house style and no third format. The year appears only
   when the date is not in the current year. */
// A bare YYYY-MM-DD is parsed as UTC midnight by the language, while a
// timestamp with a time in it is parsed as local — so the same helper put a
// promised ship date on the wrong calendar day for anyone west of Greenwich
// while the order's placed_at beside it was right. Pin the date-only form to
// local midnight so both forms mean the same thing.
//
// 🔴 And a timestamp WITH a time in it carries no zone marker either. SQLite
// writes 'YYYY-MM-DD HH:MM:SS' in UTC — CURRENT_TIMESTAMP is UTC, always — and
// every engine reads a zoneless string as LOCAL, so in Guangzhou (UTC+8) this
// helper moved every stamp in the app back eight hours. A customer who opened
// the mini app forty minutes ago read "seen 2:04 PM" on a 22:53 phone; an order
// placed a minute ago aged to "8h" in ageShort; anything that happened between
// midnight and 08:00 GZ was filed under "Yesterday". The list was never wrong
// about WHO was most recent — the server orders it — only about WHEN, which is
// the whole reason the operator reads the column.
//
// The desktop already names this bug class twice and fixes it the same way
// (courierAgeMs in retail-admin/04-orders.js, parse() in td-datetime.js: "the
// 'Z' is not optional"). The phone had its own parser and never got the rule.
// Only zoneless values are stamped — a value that already carries Z or ±HH:MM
// is left exactly as it came, and the date-only form stays literal, because a
// calendar day is not an instant and converting one can move it a day.
const _date=v=>{ if(!v) return null;
  if(Object.prototype.toString.call(v)==='[object Date]') return isNaN(v.getTime())?null:v;
  if(typeof v==='number'){ const n=new Date(v); return isNaN(n.getTime())?null:n; }
  let t=String(v).trim().replace(' ','T');
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)) t+='T00:00:00';
  else if(!/[zZ]$|[+-]\d\d:?\d\d$/.test(t)) t+='Z';
  const d=new Date(t); return isNaN(d)?null:d; };
/* ---- The store's clock ---------------------------------------------------
   RENDERING goes through tdWhen (/assets/td-datetime.js, loaded in the head),
   which draws every stamp in the STORE's timezone — window.TD_TZ, set from
   /config in loadLive(). _date above stays, because arithmetic still needs a
   Date: how old a row is, which of two is older, whether a coupon has expired.
   Those are INSTANTS and a zone cannot change them. What a zone changes is
   which calendar day an instant falls on, and that is what everything below
   is for.

   The language is passed EXPLICITLY. td-datetime reads cuLang() when it is not
   told, which is the desktop's live switch and does not exist here — the phone
   has LANG. Passing it makes the toggle work on the first render rather than
   silently rendering English to a Chinese operator. */
const _tdL=()=>({lang:LANG==='en'?'en':'cn'});
/* Today on the SHOP's calendar, as YYYY-MM-DD. 'machine' is the one name in
   §1.18 that is never localised, in any language, which is exactly what a
   value used for comparison and for a query string needs to be. */
const shopToday=()=>tdWhen(new Date(),'machine');
/* n days either side of a shop date, done on the calendar rather than by
   adding 86400000ms to an instant — a day is 23 or 25 hours twice a year in
   any zone that keeps summer time, and "yesterday" must not drift on those
   two days. China keeps none; a tenant elsewhere does. */
const shopDayAdd=(iso,n)=>{ const p=String(iso||'').split('-');
  if(p.length!==3) return '';
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10); };
/* The shop date of a value — '' when it has none. Two of these compared is how
   this file asks "same day", replacing toDateString(), which answers on the
   device's calendar. */
const shopDayOf=v=>v?tdWhen(v,'machine'):'';
/* A Date at LOCAL midnight of the shop's today, for the one caller that
   subtracts it from another local-midnight Date to count days. */
const shopTodayDate=()=>{ const p=shopToday().split('-');
  return new Date(+p[0],+p[1]-1,+p[2]); };
/* The falsy guard the old `_date(v); if(!d) return ''` gave for free, kept
   deliberately: tdWhen reads 0 as the Unix epoch and would print "Jan 1, 1970"
   on a row whose value simply has not arrived. A blank is the truth there. */
function fmtTime(v){ return v?tdWhen(v,'time',_tdL()):''; }
function fmtDay(v){
  const iso=shopDayOf(v); if(!iso) return '';
  const today=shopToday();
  if(iso===today) return fmtTime(v);
  if(iso===shopDayAdd(today,-1)) return T('Yesterday','昨天');
  return tdWhen(v,'date',_tdL());
}
/* fmtDay is for a TIMESTAMP: today's entry is most usefully a clock time. A
   promised ship date is a DATE — there is no clock in it — and putting one
   through fmtDay printed "12:00 AM" for anything due today, a midnight nobody
   set, on the row where a shop reads what it owes today. Same ladder,
   different word for today. */
function fmtDateOnly(v){
  const iso=shopDayOf(v); if(!iso) return '';
  const today=shopToday();
  if(iso===today) return T('Today','今天');
  if(iso===shopDayAdd(today,1)) return T('Tomorrow','明天');
  if(iso===shopDayAdd(today,-1)) return T('Yesterday','昨天');
  return tdWhen(v,'date',_tdL());
}
async function apiRaw(path){
  const r=await fetch(apiURL(path),{credentials:'same-origin',headers:{accept:'application/json'}});
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
/* The roster is ordered by LAST ACTIVITY, which is the desktop's default too —
   and which buries the customer who signed up ten minutes ago and has not come
   back, because "never logged in" sorts to the tail whatever the direction. So

   supported these seven orderings all along; nothing was driving them. */
const CUST_SORTS=[
  {key:'last_seen',en:'Last seen',zh:'最近活动'},
  {key:'recent_signup',en:'Newest first',zh:'最新加入'},
  {key:'spend',en:'Most spent',zh:'消费最多'},
  {key:'orders',en:'Most orders',zh:'下单最多'},
  {key:'points',en:'Most points',zh:'积分最多'},
  {key:'wallet',en:'Biggest wallet',zh:'钱包最多'},
  {key:'name',en:'Name',zh:'按姓名'},

const custSortLabel=()=>{ const c=CUST_SORTS.find(x=>x.key===(state.custSort||'last_seen'))||CUST_SORTS[0]; return T(c.en,c.zh); };
/* The tier chips used to filter the fifty rows the phone happened to hold, so
   on a roster of 1,200 "Tree" showed whichever Tree customers were in the first
   page and the rest were invisible. Every filter is the server's now — tier,
   channel, segment and the search — with a real total and a Load more, the same
   correction the Orders list already had. */
const CUST_PAGE=50;
function custQuery(offset){
  const qs=new URLSearchParams();
  qs.set('pageSize',String(CUST_PAGE));
  qs.set('page',String(Math.floor(offset/CUST_PAGE)+1));
  qs.set('withSegments','1');
  const seg=state.custSeg||'all'; if(seg!=='all') qs.set('segment',seg);
  const t=state.custTier||'all'; if(t!=='all') qs.set('tier',t);
  const ch=state.custChan||'all'; if(ch!=='all') qs.set('channel',ch);
  if(state.custQ) qs.set('q',state.custQ);
  qs.set('sort',state.custSort||'last_seen');

}
async function loadCustomers(more){
  const offset=more?((state.customers||[]).length):0;
  state.custLoading=true; state.custLoadErr=null; if(!more){ state.customers=null; state.custLoaded=false; }
  render();
  try{
    const j=await apiRaw('/customers?'+custQuery(offset));
    const rows=(j&&j.data)||[];
    const mapped=rows.map(mapCustomer);
    state.customers=more?((state.customers||[]).concat(mapped)):mapped;
    const total=(j&&j.total!=null)?j.total:null;
    state.custTotal=total;
    state.custMore=(total!=null)?state.customers.length<total:rows.length===CUST_PAGE;
    if(j&&j.segments) state.custMeta=Object.assign({},state.custMeta||{},j.segments);
    state.custLoaded=true;
  }catch(e){
    if(String(e.message)==='auth') return;
    // Same rule as the orders list: a failed load says so rather than handing
    // back five sample customers with real-looking names and spend.
    if(!more){ state.customers=[]; state.custTotal=null; state.custMore=false; state.custLoaded=true; }
    state.custLoadErr=E('Could not load customers.','无法加载客户。');
  }
  state.custLoading=false;
  loadCustomerMeta();
  render();
}
/* The pulse's three figures come from the stat call the desktop roster makes.
   Anything it doesn't return simply doesn't render — the line is never padded. */
async function loadCustomerMeta(){
  if(state.custMetaLoaded) return; state.custMetaLoaded=true;
  try{
    const j=await apiRaw('/customers?pageSize=1&includeBlocked=1&withReturning=1&withSegments=1');
    const m=Object.assign({},state.custMeta||{});
    if(j&&j.segments) Object.assign(m,j.segments);
    if(j&&j.returning&&j.returning.buyers!=null){
      m.buyers=j.returning.buyers;
      /* Zero is a real answer. The desktop prints "0%" here on purpose and
         says why: an absent figure makes the reader guess between "none",
         "not loaded" and "broken", and only one of those is true. This used
         to go null on a shop with no buyers, which dropped the whole clause
         out of the line. */
      m.returnRate=Math.round(((j.returning.returners||0)/(j.returning.buyers||1))*100);
      if(!j.returning.buyers) m.returnRate=0;
      if(j.customers_on_file!=null) m.never=Math.max(0,j.customers_on_file-j.returning.buyers);
    }
    state.custMeta=m; render();
  }catch(e){}
}

// so a .40 lost its zero and a .7 rendered as a single digit, which reads as a

const money=(cur,n)=>{ const s=cur||'¥'; const num=Number(n||0); const f=num%1?2:0;
  return s+num.toLocaleString(undefined,{minimumFractionDigits:f,maximumFractionDigits:f}); };
// Whole yuan, for the glance cards — a day's takings on a phone tile is read,
// not reconciled, and the fen is noise at that size. Matches what the desktop

const money0=(cur,n)=>(cur||'¥')+Math.round(Number(n||0)).toLocaleString();

// ── The delta line under a Today tile ─────────────────────────────────────
// Mirrors the desktop's dashSetDelta (public/retail-admin/03-dashboard.js) —
// same baseline, same rules, deliberately the same answers:
//
//   • nothing yet today  → a calm dash, never an alarming ▼100% every morning;
//   • no same-weekday history → "new", not a percentage of nothing;
//   • otherwise a WHOLE percent. The raw delta arrives with decimals and this
//     used to print them ("−23.8%"), which claims a precision a handful of
//     orders cannot support.
//
// It also names the baseline. The desktop hides that in a hover tooltip; a
// phone has no hover, so the honest phrase goes inline — "vs last 3 Sat" rather
// than the "vs a typical day" this used to say, which never told you what the
// typical day was measured over. `by now` when the server clipped the baseline
// days to the current time, or a slow morning reads as a collapse.
//
// Returns '' for a metric with no baseline at all (average order value). The
// caller renders no line rather than a comparison label with nothing to compare
// — the dangling "vs a typical day" under Avg. order was exactly that.
const DOW_ABBR_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_CN=['周日','周一','周二','周三','周四','周五','周六'];
/* Returns a PAIR, resolved at render. It used to return one resolved string,
   and the KPI tiles that hold it are built once at boot — so the labels and the
   comparisons under them were frozen in whatever language the app booted in,
   and switching to Chinese left the Today card reading "Revenue (all
   channels)". Every other bilingual value in this file is stored as a pair for
   exactly this reason; these two were built in a loader rather than a renderer
   and slipped the rule. */
function deltaText(cur, base, bl){
  if(base===undefined || base===null) return null;
  if(!cur) return ['none yet today','今日暂无'];
  if(!bl || !bl.days || base.delta==null) return ['new','新'];
  const n=bl.days, ab=DOW_ABBR_EN[bl.weekday]||'day', cn=DOW_CN[bl.weekday]||'天';
  const r=Math.round(base.delta);
  const arrow=(r>0?'▲ '+r+'%':r<0?'▼ '+Math.abs(r)+'%':'±0%')+' ';
  return [arrow+`vs last ${n} ${ab}`+(bl.clipped?' by now':''),
          arrow+`较前 ${n} 个${cn}`+(bl.clipped?'同一时段':'')];
}

/* ---- The Delivery cell ---------------------------------------------------
   The desktop merges tracking and ship-by into ONE column, because on any given
   row exactly one of them is the live fact: a shipped order has a waybill and a
   deadline already in the past; an unshipped one has a deadline and no waybill.
   The phone was showing only the second half of that, and only its raw label —
   no tracking state, no courier, no missing-waybill warning, and no urgency, so
   `byAmber` was a field that existed and was never once true. */
const _sched=v=>{ const d=_date(v); return d&&!isNaN(d)?d:null; };
/* shipByPlan, reduced: the same five kinds and the same urgency anchors. The
   desktop's label prettifiers (humanizeSlotLabel / slotWindowText) are not
   ported — the stored label is used as-is — so a row can read slightly more
   raw here than on the desktop, but it never reads WRONG. */
function shipByPlan(r){
  const done=['dispatched','delivered','cancelled','refunded'].includes(r.status);
  if(r.fulfillment_type==='counter') return null;
  if(r.fulfillment_type==='pickup') return {kind:'pickup',
    label:r.delivery_slot_label||T('During pickup hours','营业时间内自取'),
    sub:T('pickup','自提'), when:r.scheduled_for||null, basis:'arrival', done};
  if(r.promised_ship_date){
    const ship=fmtDateOnly(r.promised_ship_date), arr=r.promised_delivery_date?fmtDateOnly(r.promised_delivery_date):'';
    return {kind:'batch', label:arr||ship,
      sub:arr?T('made fresh · ship '+ship,'现做 · '+ship+'发货'):T('made fresh','现做'),
      when:r.promised_ship_date, basis:'arrival', done};
  }
  if(r.ship_by_mode==='asap'||!r.scheduled_for){
    if(r.delivery_slot_kind==='right_away') return {kind:'asap',label:T('Right away','立即配送'),sub:'',when:r.placed_at||null,basis:'age',done};
    /* The desktop's headline is "Courier — ship when ready" on a wide row. On
       a phone this cell is capped at 52% of the card and does not wrap, so the
       one-string version clipped to "Courier — ship when re…" — a label an
       operator cannot read. Split across the two lines this cell already has,
       the same way the pickup plan does ("During pickup hours" / "pickup"). */
    return {kind:'asap',label:T('Ship when ready','备好即发'),sub:T('courier','快递'),when:r.placed_at||null,basis:'age',done};
  }
  return {kind:'scheduled', label:r.delivery_slot_label||fmtDay(r.scheduled_for),
    sub:'', when:r.scheduled_for, basis:'arrival', done};

/* shipByUrgency, ported thresholds and all — including the rule that "today" is
   the STORE's today, not the browser's, so an operator abroad does not read
   yesterday's bucket. The store's zone was hardcoded to +8 here; it is now
   whatever the account's own location says (shopTodayDate → TD_TZ). */
function shipByUrgency(p,actionable){
  const out={level:'none',days:null};
  if(!p||!p.when||!actionable) return out;
  if(p.basis==='age'){
    const d=_sched(p.when); if(!d) return out;
    const age=Math.floor((Date.now()-d.getTime())/86400000);
    out.days=age;
    out.level = age>=4?'overdue' : age>=2?'soon' : 'fresh';
    return out;
  }
  const dm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(p.when));
  if(dm){
    const target=new Date(+dm[1],+dm[2]-1,+dm[3]);
    const days=Math.round((target.getTime()-shopTodayDate().getTime())/86400000);
    out.days=days;
    out.level = days<0?'overdue' : days===0?'today' : days===1?'tomorrow' : 'later';
    return out;
  }
  const d=_sched(p.when); if(!d) return out;
  const hrs=(d.getTime()-Date.now())/3600000;
  out.level = hrs<0?'overdue' : hrs<24?'today' : hrs<48?'tomorrow' : 'later';
  return out;
}

/* One line, the way the desktop picks one cell: the live fact for THIS row. */
function deliveryLine(r){
  const readonly=['meituan','gzgrocery'].includes(String(r.channel||'').toLowerCase());
  if(r.fulfillment_type==='counter') return null;
  if(readonly){
    if(['cancelled','refunded'].includes(r.status)) return null;
    const when=r.status==='delivered'?(r.delivered_at||null):null;
    if(when) return {text:T('arrived '+fmtTime(when),'已送达 '+fmtTime(when)),tone:'plain'};
    if(r.channel_preorder_at&&r.status!=='delivered') return {text:T('booked '+fmtTime(r.channel_preorder_at),'预约 '+fmtTime(r.channel_preorder_at)),tone:'amber'};
    if(r.channel_eta) return {text:T('arrival '+fmtTime(r.channel_eta),'预计 '+fmtTime(r.channel_eta)),tone:'plain'};
    return null;
  }
  const moving = r.status==='dispatched'||r.status==='delivered'||r.tracking_number||r.local_eta;
  if(moving&&r.fulfillment_type!=='pickup'){
    if(r.air_delivery_delayed) return {text:T('Air delayed · call the customer','空运延误 · 请联系顾客'),tone:'brick'};
    const live=courierLine(r); if(live) return live;
    if(r.is_local){
      if(r.local_eta) return {text:T('arrival '+r.local_eta,'预计 '+r.local_eta),tone:'plain'};
      if(r.status==='dispatched') return {text:T('no arrival time set','未设送达时间'),tone:'amber'};
      return null;
    }
    if(!r.tracking_number){
      // Shipped with no waybill = the office still has to enter it, and the
      // customer has nothing to track. The desktop shouts about this in red.
      if(r.status==='dispatched') return {text:T('No waybill yet','缺运单号'),tone:'brick'};
      return null;
    }
    const dl=deliveryState(r);
    const wb=(r.tracking_carrier||'').toUpperCase()+' '+r.tracking_number;
    return {text:dl?wb+' · '+dl.text:wb, tone:dl?dl.tone:'plain', num:true};
  }
  const plan=shipByPlan(r); if(!plan) return null;
  const actionable=r.status==='paid'||r.status==='preparing';
  const u=shipByUrgency(plan,actionable);
  let tag='';

const FLASH_KIND={live:'live',running:'live',scheduled:'draft',upcoming:'draft',ended:'off',none:'off'};
/* A flash sale is a PRICE for a WINDOW, and the phone's card showed neither —
   just a name, a pair of clock times and a status pill. The two questions an
   operator has about one are "how cheap is it" and "how many are left", and
   both were on the desktop and neither was here.

   The window also has to carry its dates. Two bare times read as "today
   10:00–18:00" on a sale that in fact runs for a week. */
function flashWindow(a,b){
  const A=_date(a), B=_date(b);
  if(!A&&!B) return null;
  // fmtDay collapses to a bare TIME when the date is today, which is exactly
  // when a flash sale is most likely to be read — so a lunchtime flash printed
  // "12:00 PM · 12:00 PM–2:00 PM", the same clock twice with a dot between.
  // fmtDateOnly says Today, and the window says the hours.
  const sameDay = !!A&&!!B&&shopDayOf(A)===shopDayOf(B);
  if(sameDay) return fmtDateOnly(a)+' · '+fmtTime(a)+'–'+fmtTime(b);
  return [A?fmtDateOnly(a):'', B?fmtDateOnly(b):''].filter(Boolean).join(' – ');
}
function mapFlash(r){

    :state==='ended'?['Ended','已结束']

  const was=Number(r.sell_price)||0, now=Number(r.flash_price)||0;
  const off=(was>0&&now>0&&now<was)?Math.round((1-now/was)*100):null;
  const limit=r.flash_stock_limit!=null?Number(r.flash_stock_limit):null;

const TIER_NAMES={seed:['Seed','种子'],sprout:['Sprout','幼苗'],root:['Root','根'],tree:['Tree','大树']};
reg('openOrder', id=>{
  const row=(state.liveOrders||[]).find(o=>o.id===id);
  /* The server stamps seen_at on this open (routes/retail.js). Clear the row
     here too, so the dot goes out on the tap instead of on the next reload —
     and clear it in BOTH lists, because the drawer reads one and the dot the
     other. */
  [state.ordersView,state.liveOrders].forEach(list=>{
    if(Array.isArray(list)){ const r=list.find(o=>o.id===id); if(r) r.isNew=false; }
  });
  state.detailId=id; state.drag=0; state.liveDetail=null; state.detailMounted=false;
  state.orderErr=null; state.orderBusy=null;
  // A tap on the LIST always has its row, so there is nothing to hold the
  // screen for, and a record open behind this one stays where it belongs.
  state.detailFetch=false; state.orderOverCust=false;
  if(row&&row._id!=null){
    render();
    // Sheet has animated once now — suppress the slide-up on the fetch re-render
    // so the detail doesn't flick up a second time when live items arrive.
    state.detailMounted=true;
    api('/orders/'+row._id).then(o=>{ if(state.detailId===id){ state.liveDetail=mapDetail(o); render(); } }).catch(()=>{});
  } else { render(); state.detailMounted=true; }
});
/* An order opened from the customer record's Recent orders.
   Two things make this different from a tap on the Orders list. The row is an
   INDEX into the record's own array rather than an order number, because the
   number would have to survive being written into a JS string literal inside
   an HTML attribute, and an apostrophe in one would end that literal early.
   And the order is very often not in the list this app has loaded — a
   customer's older orders are pages down it, or behind whichever filter is on
   — so there is no row to fall back on and the sheet is built from the read
   alone; sheetOrderShell holds the screen while that read is in flight.

   The read is authoritative about the order's own number: detailId is set
   again from what came back, because sheetOrderDetail matches the two and a
   record row whose order_no is stale, or absent, would otherwise leave the
   sheet waiting on a match that can never happen.

   There is one detailId, so opening an order here REPLACES an order the record
   was itself opened from, and closing this one lands on the record rather than
   on that one. That is deliberate: the order it replaced was placed by this
   same customer, so it is a row in the list the operator is looking at — one
   tap away, in the place they would look for it. */
reg('openCustOrder', i=>{
  const r=((state.custDetail&&state.custDetail.recent_orders)||[])[i];
  if(!r||r.id==null) return;
  const no=r.order_no||('#'+r.id);
  /* The read below stamps seen_at server-side, exactly as a tap on the list
     does, so the row's dot goes out here too — in BOTH lists, because the
     drawer reads one and the dot the other. Without this an order first opened
     from a record kept its dot until the next reload, having already been seen. */
  [state.ordersView,state.liveOrders].forEach(list=>{
    if(Array.isArray(list)){ const row=list.find(o=>o._id===r.id); if(row) row.isNew=false; }
  });
  state.detailId=no; state.drag=0; state.liveDetail=null; state.detailMounted=false;
  state.detailActions=false; state.orderErr=null; state.orderBusy=null;
  state.orderOverCust=true; state.detailFetch=true;
  render();
  state.detailMounted=true;
  api('/orders/'+r.id).then(o=>{
    if(state.detailId!==no) return;
    const d=mapDetail(o);

  }).catch(e=>{

/* The operator's role, the same read the desktop bootstraps RA_POS from. It
   decides whether the Recap says the money out loud: a warehouse, dispatch or
   customer-service account sees its own queue without the revenue. Defaults to
   the full owner view when the read fails, which is what the desktop does too. */
async function loadMe(){
  try{
    const r=await fetch('/api/backend/me',{credentials:'same-origin',headers:{accept:'application/json'}});
    if(!r.ok) return;                    // finally still runs — see below
    const j=await r.json();
    const u=(j&&(j.user||j.data||j))||{};
    /* HOME BOARD. This used to test the role STRING against a hardcoded list of
       four, so renaming a role took its board away and quietly handed the
       operator the owner's view instead. The board is a field on the role
       record now (u.roleLayout); the values are unchanged, so recapNoMoney()
       and the two reads at the top of this file did not have to move. */
    const BOARDS=['store_manager','warehouse','customer_service','dispatch'];
    if(BOARDS.includes(u.roleLayout)) state.pos=u.roleLayout;
    // The platform ceiling. A feature the tenant is not entitled to must not
    // carry a switch here — the desktop hides it, and a switch that writes a
    // preference nobody will ever honour is worse than an absent one. A
    // missing key means entitled, so the default is an empty object.
    state.ent=(u.tenant&&u.tenant.entitlements)||{};
    /* caps are kept, not gated on: this screen has no data-cap machinery and
       re-renders template strings into #content, so what it does with them is
       FILTER BEFORE RENDER — never a port of applyCapGates or railSyncGroups. */
    state.caps=Array.isArray(u.caps)?u.caps:null;
    state.me={name:u.displayName||u.username||null, role:u.role||null, roleName:u.roleName||null};
    /* The operator's own language, from their account (audit M-01 / M-02). It
       wins over whatever this handset had — that is the point. null means they
       have never chosen, and then the handset's value stands: nobody who has
       never expressed a preference gets switched to English on the day this
       ships. No write-back here, or adopting would echo straight home. */
    const acct=mLangFromAccount(u.language);
    if(acct && acct!==state.lang){
      state.lang=acct; LANG=acct; document.documentElement.lang=acct;
      try{ localStorage.setItem(M_LANG_KEY,acct); }catch(e){}
    }
    landOnSomethingReachable();
  }catch(e){}
  finally{
    /* HOWEVER the read ended. A 401, a network error, or file:// with no server
       at all — each leaves caps null and each must still let the app paint,
       which is what keeps the static preview working. The flag says the
       question has been asked, not that it was answered. */
    state.capsLoaded=true;
    render();
  }
}
/* THE APP OPENS ON HOME, and Home is a board of revenue. An operator without
   dashboard:view was therefore shown, for the length of one render, the one
   screen their role exists to exclude — and then had no way to leave it, since
   every tab was equally ungated. Runs once, as soon as the caps arrive, and
   only moves an operator who has not already navigated somewhere themselves. */
function landOnSomethingReachable(){
  // The ?to= / ?tab= deep link is read at boot, BEFORE this operator's caps
  // arrive, so it can name a screen they may not open — a shortcut kept from a
  // wider role, or a notification aimed at the whole team. Drop it now that the
  // answer is known; push() refuses the same route on any later tap.
  state.stack=state.stack.filter(f=>canRoute(f.route));
  if(state.stack.length) return;                 // the deep link stands
  if(canRoute(state.tab)) return;                // Home is theirs; leave it alone
  const primary=TAB_KEYS.filter(canRoute);
  // The tool list is the home screen for everyone else, so landing is simply
  // arriving at it — never being pushed inside one of the tools, which would
  // hide the others behind a Back nobody has a reason to press.
  state.tab = primary.length ? primary[0] : 'more';
  /* Landing here is not a tap — reg('tab',...) is what primes Orders/Customers
     with their first page when a person taps that button, and this function
     sets state.tab directly, bypassing that dispatcher entirely. So a role
     whose primary reachable tab is Orders or Customers (no dashboard:view —
     warehouse, dispatch, customer-service on a tenant that narrowed the role)
     booted onto an empty "No orders yet" / "No customers yet" list until a
     manual tap on a tab already selected (a no-op, same guard) or a
     pull-to-refresh happened to run the same loader. Mirror reg('tab',...)'s
     two guarded calls here so the landing tab arrives with its own data,
     exactly as if the operator had tapped their way to it. */
  if(state.tab==='orders') markOrdersSeen();
  if(state.tab==='customers' && !state.custLoaded && !state.custLoading) loadCustomers();
  if(state.tab==='orders' && !state.ordersView && !state.ordersLoading) loadOrdersPage();
}
async function loadLive(){
  // Role first, and awaited: the Recap renders money rows or does not depending
  // on it, and a card that shows revenue for half a second before hiding it has
  // already shown it.
  await loadMe();
  // config → store name + currency (best-effort; keeps mock on any miss)
  try{ const cfg=await api('/config') || {};
    state.cfg=cfg;
    // Store name lives at brand.me_footer.wordmark_text; currency at currency.symbol.
    // (The old code read store_name/currency_symbol, which don't exist — so the app
    //  kept showing the fake "Maru Studio" and could render currency as [object Object].)
    const wm = cfg.brand && cfg.brand.me_footer && cfg.brand.me_footer.wordmark_text;
    if(wm) state.storeName = wm;

    if(cur && typeof cur==='object' && cur.symbol) CUR = cur.symbol;
    else if(typeof cur==='string') CUR = cur;

  const today=shopToday();
  try{ const d=await api('/dashboard?from='+today+'&to='+today); const k=d.kpi||d.kpis||d||{}; const b=d.baseline||{};
    const bl=d.baseline||null;
    const rev=Number(k.revenue||0), ord=Number(k.orders!=null?k.orders:0);
    const nc=Number(k.new_customers!=null?k.new_customers:(k.newCustomers||0));
    state.liveKpis=[
      // Whole yuan on the money tile the eye lands on first; the fen stays on
      // the average, where the number is small enough for it to mean something.
      [['Revenue (all channels)','营收（全渠道）'], money0(CUR,rev), deltaText(rev, b.revenue, bl)],
      [['Orders (storefront)','订单（自营）'], String(ord), deltaText(ord, b.orders, bl)],
      // AVERAGE ORDER IS THE SERVER'S `aov`, NEVER rev/ord. The two tiles above
      // are deliberately different measures: revenue is all-channels and carries
      // money that produced no storefront order — wallet top-up cash, cash-basis
      // booked the day it lands, and gzgrocery wholesale takings read off the
      // stock ledger — while the order count is the storefront alone. Dividing
      // one by the other charges every yuan of that money to a handful of
      // orders. Reported from a real day: ONE ¥3,000 TOP-UP AGAINST 17 ORDERS
      // PUSHED THIS TILE TO ¥417.59, roughly ¥176 of it the top-up alone, on
      // money nobody spent on goods — and the better the top-up day, the further
      // the tile drifted, while the desktop's own tile disagreed with it.
      //
      // `kpis.aov` is AVG over storefront order totals with gzgrocery excluded
      // in the query itself (routes/retail.js), which is the figure the desktop
      // has always read. This is the same fault §36's FINDING 2026-09-01 wrote
      // down for Finance, arrived at from the other side: not by reusing the
      // blended revenue AS revenue, but as the numerator of a ratio whose
      // denominator was never blended. Revenue and its denominator must stand on
      // the same population.
      //
      // NO LOCAL FALLBACK. rev/ord is precisely the wrong answer, so a server
      // that sends no `aov` gets a dash rather than a confident lie.
      //
      // The server sends no baseline for average order value, so this tile has
      // nothing to compare against and says nothing — rather than printing a
      // comparison label with no comparison under it.
      [['Avg. order','客单价'], k.aov!=null ? money(CUR, Number(k.aov)) : (CUR||'¥')+'—', null],
      [['New customers','新客'], String(nc), deltaText(nc, b.new_customers, bl)],
    ];
    // The desktop's Today strip carries a fifth figure and its Customers card
    // four more; the phone kept none of them. Each comes with the honesty rule
    // the desktop wrote for it — see vitalsBlock.
    state.liveVitals={
      refunded:Number(k.refunded_orders||0),
      refundRate:k.refund_rate!=null?Number(k.refund_rate):null,
      sessions:Number(k.sessions||0),
      orders:ord,
      conv:k.conversion_rate!=null?Number(k.conversion_rate):null,
      buyers:Number((d.new_vs_returning||{}).buyers||0),
      returning:Number((d.new_vs_returning||{}).returning_buyers||0),
    };
    // "Orders awaiting shipment" = paid-but-not-shipped. The dashboard exposes the
    // per-status counts under `funnel` (the old code read `byStatus`, which doesn't
    // exist, so this number was always the fake fallback). Prefer the dedicated
    // order-status-counts endpoint below; fall back to the dashboard funnel.
    const bs=d.funnel||d.byStatus||{};
    // No `reviews` key any more: Home reads that fire off /dashboard/ops, which
    // knows the count without this phone having opened the Inbox first.
    state.liveAttn={ ship:(bs.paid?bs.paid.n:null), low:null };
  }catch(e){ if(String(e.message)==='auth') return; }
  // orders list (the heart of the app). The Recap no longer derives anything
  // from it — it reads the activity feed since you last left, like the desktop.
  try{ const rows=await api('/orders?limit=50');
    if(Array.isArray(rows)){ state.liveOrders=rows.map(mapOrderRow); DB.orders=state.liveOrders; }
  }catch(e){}
  // products
  try{ const rows=await api('/products?limit=50');
    if(Array.isArray(rows)&&rows.length){ DB.products=rows.map(mapProduct); state.liveProductsLoaded=true; }
  }catch(e){}
  // reviews (inbox)
  try{ const rv=await api('/reviews?limit=30'); const list=Array.isArray(rv)?rv:(rv.reviews||[]);
    DB.reviews=list.map(mapReview); state.revLoaded=true;
  }catch(e){}
  // low-stock count for the Home attention row
  // Low = a shelf that needs buying back. A draft is neither low nor out, so
  // counting everything that is not 'on' would put unpublished work in it.
  try{ state.liveAttn=Object.assign({},state.liveAttn||{},{low:DB.products.filter(p=>p.kind==='restock'||p.kind==='off').length}); }catch(e){}
  render();
  // The above-the-fold data (role, KPIs, vitals) just painted with its entrance
  // animation; every render from here on — the secondary fetches below, plus
  // whatever loadRecap()/loadOps() resolve to later — should land in place
  // without replaying it. See the `.rise` rule in <style>.
  document.documentElement.classList.add('settled');

  // ---- secondary screens: fetch in parallel, each falls back to its sample data ----
  const set=(fn)=>{ try{ fn(); }catch(e){} render(); };

  // order status + channel counts → real filter-chip numbers + Home "awaiting shipment"
  api('/order-status-counts').then(d=>set(()=>{ if(d){ state.liveStatusCounts=d;
    const ship=(d.paid||0)+(d.preparing||0);
    state.liveAttn=Object.assign({},state.liveAttn||{},{ship});
  }})).catch(()=>{});
  api('/order-channel-counts').then(d=>set(()=>{ if(d) state.liveChannelCounts=d; })).catch(()=>{});

  loadInboxUnseen();
  /* Asks nothing of the operator — it only reads what the browser and the
     server already know, so Settings tells the truth the first time it is
     opened rather than after a tap. */
  refreshPushState();
  loadOps();
  api('/setup').then(d=>set(()=>{ if(d&&d.percent!=null) state.setup=d; })).catch(()=>{});
  api('/delivery-zones').then(r=>set(()=>{ if(Array.isArray(r)) state.zones=r; })).catch(()=>{});
  api('/stores').then(r=>set(()=>{ if(Array.isArray(r)) state.stores=r.filter(s=>s.is_active==null||s.is_active); })).catch(()=>{});
  // apiRaw, not api: the chip counts ride the envelope beside `data`, and
  // api() returns `data` alone — so liveInvoiceCounts was never once set and
  // the chips kept showing the mock's 214 / 198 / 16.
  apiRaw('/invoices').then(r=>set(()=>{ const rows=(r&&r.data)||[]; state.invLoaded=true;
    if(rows.length) DB.invoices=rows.map(mapInvoice); else DB.invoices=[];
    if(r&&r.counts) state.liveInvoiceCounts=r.counts; })).catch(()=>{});
  // `Array.isArray(r)`, not `r.length`: a shop with no coupons must SEE no
  // coupons. The `&& r.length` these three used to carry meant an empty server
  // answer left the sample rows on screen — the mock outliving the data it was
  // standing in for, on exactly the shop least able to tell the difference.
  api('/vouchers').then(r=>set(()=>{ state.vchLoaded=true; if(Array.isArray(r)){ DB.coupons=r.map(mapVoucher);
    DB.coupons.forEach(c=>{ if(state.sw['c_'+c.code]===undefined) state.sw['c_'+c.code]=c.on; }); } })).catch(()=>{});
  api('/flash-sales').then(r=>set(()=>{ state.flashLoaded=true; if(Array.isArray(r)) DB.flash=r.map(mapFlash); })).catch(()=>{});
  api('/broadcasts').then(r=>set(()=>{ state.bcLoaded=true; if(Array.isArray(r)) DB.broadcasts=r.map(mapBroadcast); })).catch(()=>{});
  api('/feedback').then(r=>set(()=>{ const rows=Array.isArray(r)?r:(r&&r.data); if(rows) DB.feedback=rows.map(mapFeedback); })).catch(()=>{});


  // wallet activity + leaderboard + sales channels
}

/* Language, restored before the first paint — the pair to the theme the head
   script already applied. Both are read back here rather than defaulted so a
   relaunch opens the app the way it was left. */
try{ const l=localStorage.getItem(M_LANG_KEY); if(l==='en'||l==='zh'){ state.lang=l; LANG=l; } }catch(e){}
document.documentElement.lang=state.lang;
document.documentElement.setAttribute('data-theme',state.theme);

/* Where to open. A launcher tap opens Home; a long-press on the icon offers the
   shortcuts declared in m-manifest.webmanifest, and those arrive as ?to=orders
   / ?to=products / ?to=inbox. Anything unrecognised is ignored rather than
   guessed at — the app opening somewhere the operator did not ask for is worse
   than it opening Home. */
(function(){
  let to='';
  try{ const q=new URLSearchParams(location.search);
       /* `to` is this app's own shortcut parameter, from the launcher's
          long-press menu. `tab` belongs to the desktop admin — and a new-order
          push carries /retail-admin?tab=orders, which the store host hands
          straight back to this app on a phone. Without reading it the
          notification an operator just tapped opened Home. */
       to=q.get('to')||q.get('tab')||''; }catch(e){}
  if(!to) return;
  // Caps have not arrived yet at this point, so this only records the request;
  // landOnSomethingReachable() re-decides once they have, and push() refuses a
  // route the operator cannot reach.
  if(TAB_META[to]) state.tab=to;
  else if(SUBS[to]){ state.stack=[{route:to,title:SUBS[to].title}]; if(to==='inbox') markInboxSeen(); }
})();
render();
/* Lucide loads async — re-render once its icon set is ready so glyphs fill in. */
if(!(window.lucide && window.lucide.icons)){
  let n=0; const iv=setInterval(()=>{ if((window.lucide&&window.lucide.icons)||++n>60){ clearInterval(iv); render(); } },80);
}
/* Hydrate with live data when served from the store backend. On file:// / static
   preview the fetches fail and the app stays on its sample data — by design. */
loadLive();
/* Last resort. loadMe's finally covers every way that read can END, but not a
   request that never ends at all — a captive portal, a proxy holding the socket
   open. Six seconds of the mark is a slow app; a permanent hold is a broken
   one, so this releases into the fail-open path rather than waiting forever. */
setTimeout(function(){ if(!state.capsLoaded){ state.capsLoaded=true; render(); } }, 6000);
</script>
</body>
</html>
