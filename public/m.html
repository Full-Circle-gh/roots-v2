}
/* The foot: what is missing, what it comes to, and the one commit. The money
   line names the parts rather than one number — the operator is reading it back
   to somebody on the telephone. */
function onwFootHtml(){
  const o=state.onw, blocked=onwBlocked();
  const ship=o.ful==='delivery'?(Number(o.ship)||0):0, pack=Number(o.pack)||0;
  const parts=[T('Items','商品')+' '+money(CUR,onwSubtotal())];
  if(ship) parts.push(T('Shipping','运费')+' '+money(CUR,ship));
  if(pack) parts.push(T('Packing','包装费')+' '+money(CUR,pack));
  /* The shop's own word for the tax, and — where the price already contains it
     — the word that stops this reading as one more thing added to the list. */
  if(o.tax) parts.push((T(o.tax.label&&o.tax.label.en||'Tax', o.tax.label&&o.tax.label.cn||'税费')
    + (o.tax.mode==='inclusive'?T(' incl.','（已含）'):'')) + ' ' + money(CUR,Number(o.tax.amount)||0));
  return `<div style="font-size:13px;min-height:18px">${blocked
      ?`<span style="color:var(--amber-ink)">${blocked}</span>`
      :`<span class="num" style="color:var(--text-secondary)">${parts.join(' · ')}</span>`}</div>
   <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
     <span style="font-size:13px;color:var(--text-secondary)">${T('Total','合计')}</span>
     <span class="num" style="font-size:22px;font-weight:500">${money(CUR,onwTotal())}</span></div>
   <button class="cta" ${blocked||o.busy?'disabled':''} style="${blocked||o.busy?'opacity:.55':''}" onclick="APP.cmd('onwCreate')">${
     o.busy?T('Creating…','创建中…'):T('Create order','创建订单')}</button>`;
}

function screenNewOrder(){
  const o=state.onw, stores=state.stores||[];
  loadOnwCities(); onwSyncStore();
  /* WHO. A customer record if there is one — the order then hangs off their
     history, their points and their tier — and a typed name if there is not.
     The name is required either way: it is what the picking list, the label and
     the receipt are addressed to, and it is not always the account holder. */
  const who=(o.cust
    ? `<div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(o.cust.nickname||'—')}</span>
          <span class="num" style="font-size:12.5px;color:var(--text-secondary)">${escAttr(o.cust.phone||'')}</span></span>
        <button class="iconbtn" style="width:36px;height:36px;margin-right:-4px" onclick="APP.cmd('onwUnpickCust')" aria-label="${T('Remove','移除')}">${ic('x',20,2)}</button></div>`
    : onwField('',`<input id="mOnwCustQ" inputmode="search" enterkeyhint="search" value="${escAttr(o.custQ)}"
         placeholder="${T('Search name or phone, or leave as guest','搜索姓名或电话,或留空作为访客')}" oninput="APP.cmd('onwCustQ',this.value)">
       <div id="mOnwCustBox">${onwCustPicksHtml()}</div>`))
    + onwField(T('Name','姓名'),`<input id="mOnwName" value="${escAttr(o.name)}" maxlength="80" oninput="APP.cmd('onwName',this.value)">`)
    + onwField(T('Phone','电话'),`<input id="mOnwPhone" inputmode="tel" value="${escAttr(o.phone)}" maxlength="20" oninput="APP.cmd('onwPhone',this.value)">`)
    + (o.cust?'':`<button class="chip ${o.saveCust?'on':''}" style="align-self:flex-start" onclick="APP.cmd('onwSaveCust')"><span>${T('Also save as a customer','同时存为顾客')}</span></button>`);
  const what=onwField('',
      `<input id="mOnwProdQ" inputmode="search" enterkeyhint="search" value="${escAttr(o.q)}"
         placeholder="${T('Search products','搜索商品')}" oninput="APP.cmd('onwProdQ',this.value)">
       <div id="mOnwProdBox">${onwProdPicksHtml()}</div>`)
    + onwLinesHtml();
  /* HOW. Two answers, not three: a walk-in rings up at the till, which is a
     purpose-built screen and three server rules this form would have to grow to
     satisfy. */
  const storeRow=stores.length>1
    ? onwField(T('Store','门店'),onwChips(stores.map(s=>({k:s.id,en:s.name_en||s.name_cn||('#'+s.id),zh:s.name_cn||s.name_en||('#'+s.id)})),o.storeId,'onwStore'),
        o.ful==='pickup'?T('Where the customer collects it.','顾客到这家门店取货。'):T('Which counter owns this order.','由哪家门店处理这张订单。'))
    : '';
  const addr=o.ful!=='delivery' ? '' :
    onwField(T('City','城市'), o.city
      ? `<div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px">
           <span style="flex:1;min-width:0;font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(o.city)}</span>
           <button class="iconbtn" style="width:36px;height:36px;margin-right:-4px" onclick="APP.cmd('onwUnpickCity')" aria-label="${T('Remove','移除')}">${ic('x',20,2)}</button></div>`
      : `<input id="mOnwCityQ" inputmode="search" enterkeyhint="search" value="${escAttr(o.cityQ)}"
           placeholder="${T('Select a city…','请选择城市…')}" oninput="APP.cmd('onwCityQ',this.value)">
         <div id="mOnwCityBox">${onwCityPicksHtml()}</div>`,
      o.province?T('Province','省')+' · '+escAttr(o.province):'')
    + (o.city?onwField(T('District','区'),`<div id="mOnwDistBox">${onwDistrictsHtml()}</div>`):'')
    + onwField(T('Street address','详细地址'),`<input id="mOnwStreet" value="${escAttr(o.street)}" maxlength="200" oninput="APP.cmd('onwStreet',this.value)">`);
  const fees=`<div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;gap:10px">
        ${o.ful==='delivery'?`<div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <span class="eyebrow">${T('Shipping','运费')}</span>
          <input id="mOnwShip" inputmode="decimal" value="${escAttr(o.ship)}" oninput="APP.cmd('onwFee','ship',this.value)"></div>`:''}
        <div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <span class="eyebrow">${T('Packing','包装费')}</span>
          <input id="mOnwPack" inputmode="decimal" value="${escAttr(o.pack)}" oninput="APP.cmd('onwFee','pack',this.value)"></div></div>
      <span id="mOnwFeeNote" style="font-size:12.5px;color:var(--text-secondary);line-height:1.5">${o.feeNote?String(o.feeNote):''}</span></div>`;
  const how=onwField('',onwChips(ONW_FULS,o.ful,'onwFul'),
      canRoute('till')?T('A walk-in rings up at the counter till.','顾客到店购买请用前台收银。'):'')
    + storeRow + addr + fees;
  /* WHERE IT CAME FROM. Required by the server for everything but a counter
     sale, and it is the answer that gives this revenue a card on the Sales
     page — an unanswered origin is what used to leave hand-keyed money filed
     under nothing at all. */
  const from=onwField('',onwChips(ONW_ORIGINS,o.channel,'onwOrigin'))
    + (o.channel==='other'?onwField(T('Where did it come from?','具体来源'),
        `<input id="mOnwOriginNote" value="${escAttr(o.channelNote)}" maxlength="200" oninput="APP.cmd('onwOriginNote',this.value)">`):'');
  /* PAYMENT. Unpaid is the default and the common case — a phone order is paid
     when the money lands, from the order itself. Marking it paid here records
     WHICH tender took it, the same five the order sheet's Mark paid offers, so
     the day's takings still split correctly. */
  const pay=onwField('',onwChips([{k:'no',en:'Unpaid',zh:'待付款'},{k:'yes',en:'Paid',zh:'已付款'}],o.paid?'yes':'no','onwPaid'))
    + (o.paid?onwField(T('Pay method','付款方式'),onwChips(PAY_METHODS.map(m=>({k:m[0],en:m[1],zh:m[2]})),o.pay,'onwPay')):'');
  const notes=onwField(T('Customer note','顾客备注')+' <span style="font-weight:400">· '+T('optional','选填')+'</span>',
      `<input id="mOnwNote" value="${escAttr(o.note)}" maxlength="2000" placeholder="${T('What the customer should read','顾客会读到的内容')}" oninput="APP.cmd('onwNote',this.value)">`)
    + onwField(T('Staff note','员工备注')+' <span style="font-weight:400">· '+T('optional','选填')+'</span>',
      `<input id="mOnwStaffNote" value="${escAttr(o.staffNote)}" maxlength="2000" placeholder="${T('Only the shop reads this','仅店内可见')}" oninput="APP.cmd('onwStaffNote',this.value)">`);
  return `<div style="padding:16px 16px 24px;display:flex;flex-direction:column;gap:22px">
    ${onwSection(T('Customer','顾客'),who,'who')}
    ${onwSection(T('Products','商品'),what,'what')}
    ${onwSection(T('Fulfilment','履约方式'),how,'how')}
    ${onwSection(T('Order came from','订单来源'),from,'from')}
    ${onwSection(T('Payment','付款'),pay,'pay')}
    ${onwSection(T('Notes','备注'),notes,'notes')}
    <div id="mOnwFoot" style="display:flex;flex-direction:column;gap:10px;padding-top:4px">${onwFootHtml()}</div>
  </div>`;
}

/* ---- the commands ------------------------------------------------------ */
/* Text fields NEVER call render(), and never arm state.focus either. They are
   not rebuilt by their own typing, so there is no caret to put back — and an
   armed focus would be spent by the NEXT render whatever caused it, which is
   how a tap on a chip ends up reopening the keyboard on a field nobody is in. */
function onwTyped(key,v){ state.onw[key]=String(v==null?'':v); }
reg('onwName', v=>{ onwTyped('name',v); onwRepaintFoot(); });
reg('onwPhone', v=>{ onwTyped('phone',v); });
reg('onwStreet', v=>{ onwTyped('street',v); onwRepaintFoot(); onwFeesSoon(); });
reg('onwNote', v=>{ onwTyped('note',v); });
reg('onwStaffNote', v=>{ onwTyped('staffNote',v); });
reg('onwOriginNote', v=>{ onwTyped('channelNote',v); onwRepaintFoot(); });
/* A typed fee is the operator's, and no later quote may overwrite it — the
   whole point of typing one is a waived charge or a rate agreed on the call. */
reg('onwFee', (which,v)=>{
  const o=state.onw, n=Number(String(v).trim());
  o[which]=Number.isFinite(n)&&n>=0?n:0;
  o.feeTouched[which]=true;
  onwRepaintFoot();
});
/* The two searches: no render per keystroke, a debounced read, and the results
   box patched when it lands. state.focus IS armed here, exactly as the waste
   picker arms it, because these are the fields whose box can miss its patch and
   fall back to a full render. */
reg('onwProdQ', v=>{ const o=state.onw, el=document.getElementById('mOnwProdQ');
  o.q=String(v||''); state.focus={id:'mOnwProdQ',pos:el?el.selectionStart:null};
  clearTimeout(o.pickTimer); o.pickTimer=setTimeout(loadOnwProducts,180); });
reg('onwCustQ', v=>{ const o=state.onw, el=document.getElementById('mOnwCustQ');
  o.custQ=String(v||''); state.focus={id:'mOnwCustQ',pos:el?el.selectionStart:null};
  clearTimeout(o.custTimer); o.custTimer=setTimeout(loadOnwCustomers,180); });
/* The city list is already in memory, so this one filters rather than fetches
   — and patches the same way, for the same keyboard. */
reg('onwCityQ', v=>{ const o=state.onw, el=document.getElementById('mOnwCityQ');
  o.cityQ=String(v||''); state.focus={id:'mOnwCityQ',pos:el?el.selectionStart:null};
  onwRepaint('mOnwCityBox',onwCityPicksHtml); });
reg('onwPickCity', i=>{
  const o=state.onw, c=onwCityMatches()[Number(i)];
  if(!c) return;
  o.city=c.name_cn||c.name_en||''; o.province=c.province_cn||''; o.cityQ='';
  /* A new city is a new set of districts and a new zone, so neither the old
     district nor the old quote means anything. Dropped, not carried across. */
  o.district=''; o.districts=null;
  render(); loadOnwDistricts(); onwFeesSoon();
});
reg('onwUnpickCity', ()=>{ const o=state.onw;
  o.city=''; o.province=''; o.district=''; o.districts=null; o.cityQ=''; render(); });
reg('onwDistrict', i=>{ const o=state.onw;
  const d=i===''?null:(o.districts||[])[Number(i)];
  o.district=d?(d.name_cn||d.name_en||''):'';
  render(); onwFeesSoon(); });
reg('onwPickCust', id=>{
  const o=state.onw, c=(o.custPicks||[]).find(x=>String(x.id)===String(id));
  if(!c) return;
  o.cust=c; o.custQ=''; o.custPicks=null; o.saveCust=false;
  /* The name and the phone belong to the ORDER, not to the record — a customer
     can have an order sent to somebody else — so they are seeded from the
     record and stay editable. Only when empty: a name already typed is the one
     that was given on the telephone. */
  if(!o.name.trim()) o.name=String(c.nickname||'');
  if(!o.phone.trim()) o.phone=String(c.phone||'');
  render();
});
reg('onwUnpickCust', ()=>{ const o=state.onw; o.cust=null; o.custPicks=null; o.custQ=''; render(); });
reg('onwSaveCust', ()=>{ const o=state.onw; o.saveCust=!o.saveCust; render(); });
reg('onwAddLine', id=>{
  const o=state.onw, p=(o.picks||[]).find(x=>String(x.id)===String(id));
  if(!p) return;
  const have=o.lines.find(l=>String(l.id)===String(p.id));
  if(have) have.qty=Number(have.qty)+1;
  else o.lines.push({id:p.id,en:p.name_en||p.name_cn||'',cn:p.name_cn||p.name_en||'',
                     price:Number(p.sell_price)||0,qty:1});
  o.q=''; o.picks=null; render(); onwFeesSoon();
});
reg('onwQty', (i,d)=>{ const l=state.onw.lines[Number(i)]; if(!l) return;
  l.qty=Math.max(1,(Number(l.qty)||0)+Number(d)); render(); onwFeesSoon(); });
reg('onwDropLine', i=>{ state.onw.lines.splice(Number(i),1); render(); onwFeesSoon(); });
reg('onwFul', k=>{ const o=state.onw;
  if(o.ful===k) return;
  o.ful=k;
  /* Switching to a collection drops the shipping quote rather than leaving it
     standing: the server refuses a shipping fee on one, and a stale number is
     how that refusal arrives after the operator has stopped looking. */
  if(k!=='delivery'){ o.ship=0; o.feeTouched.ship=false; }
  render(); onwFeesSoon(); });

/* ==========================================================================
   Receiving — what turned up, and booking it in
   --------------------------------------------------------------------------
   Two screens, and they are deliberately NOT inside Purchasing. Purchasing
   counts ORDERS; this counts DELIVERIES; and a segmented control whose
   segments count different nouns can never make its numbers agree — Open would
   count orders while Received counted arrivals, and a three-supplier order
   arriving over three days would add three to one number and one to the other.
   So Receiving is its own screen off More, and Purchasing is untouched.

   A DELIVERY IS NOT A SAVE. The server writes one receipt per save; a person
   thinks in van-loads. The list therefore shows deliveries — a receipt that
   brought at least one line for the first time — and a later save that only
   revises lines already received hangs UNDER the line it corrects, in the
   detail. That derivation lives on the server (routes/retail-purchasing.js
   DELIVERY_SQL) so the list and the PO screen cannot disagree about it.

   Costs are absent on purpose. The person at the door counts boxes; what the
   boxes cost is the buyer's screen, and putting a number here invites an
   argument about money at the one moment nobody can check it.
   ========================================================================== */
const RCV_FLAGS=[{key:'all',en:'All',zh:'全部'},{key:'issues',en:'Issues',zh:'有异常'},
  {key:'short',en:'Short',zh:'短少'},{key:'damaged',en:'Damaged',zh:'破损'},{key:'over',en:'Over',zh:'多收'},
  {key:'returned',en:'Returned',zh:'退货'}];
/* The three shipped reason codes, verbatim. These strings go on the wire
   (po_line_items.receipt_reason) — a prettier local set would be a second
   vocabulary to translate at the one boundary where a typo is silent and the
   reason simply never saves. Damage is NOT here: it is a quantity of its own,
   and it happens on lines that are not short at all. */
const RCV_REASONS=[{key:'short_delivery',en:'Short delivery',zh:'少送'},
  {key:'wrong_item',en:'Wrong item',zh:'错货'},{key:'not_sent',en:'Not sent',zh:'未发货'}];
const rcvReason=k=>{ const r=RCV_REASONS.find(x=>x.key===k); return r?T(r.en,r.zh):''; };
/* Why goods went BACK, which is a different question to why fewer arrived —
   and a different list, sharing only `wrong_item`. Verbatim on the wire for the
   same reason RCV_REASONS is (lib/po-returns.js RETURN_REASONS), and read off
   po_receipt_lines.receipt_reason, which on a return row carries the line's
   return reason (recordReceipt, routes/purchases.js). */
const RCV_RETURN_REASONS=[{key:'wrong_item',en:'Wrong item',zh:'错货'},
  {key:'quality',en:'Quality',zh:'质量问题'},{key:'expired',en:'Expired',zh:'过期'},
  {key:'over_delivery',en:'Over-delivered',zh:'多送'},{key:'not_needed',en:'Not needed',zh:'无需要'}];
const rcvReturnReason=k=>{ const r=RCV_RETURN_REASONS.find(x=>x.key===k); return r?T(r.en,r.zh):''; };
/* QUANTITIES ARE FRACTIONAL. Herbs are bought by the tenth of a kilo — 0.1 kg
   of coriander is an ordinary line, not a rounding error — and this screen used
   to force every figure through Math.round/parseInt. That did not merely look
   wrong: 0.1 kg rendered as "ordered 0 kg" beside a stepper pinned at 0, so the
   line could not be received at all, and 0.5 kg of dill silently became 1. The
   server has always stored these as REAL and read them with parseFloat
   (routes/purchases.js), so the loss was ours alone, on the way in and out.
   Three decimals is the resolution: finer than any kitchen scale reads, coarse
   enough that 0.1+0.1+0.1 is 0.3 rather than binary floating point's answer. */
const rcvRound=n=>Math.round((+n||0)*1000)/1000;
/* Trailing zeros are noise on a count: 1 reads as "1", not "1.000". */
const rcvFmt=n=>String(rcvRound(n));
/* Typed entry. Digits and ONE decimal point survive — the second dot in
   "1.2.3" is a slip of the thumb, not a second number, so it closes up to 1.23
   rather than throwing the whole entry away. Anything that is not a number at
   all reads as zero, never NaN. */
const rcvNum=v=>{ const p=String(v==null?'':v).replace(/[^0-9.]/g,'').split('.');
  const n=parseFloat(p.length>1?p[0]+'.'+p.slice(1).join(''):p[0]);
  return Number.isFinite(n)?rcvRound(Math.max(0,n)):0; };
/* What one press of [−]/[+] is worth. A line ordered in whole units steps by
   one, as it always has; a line ordered in fractions steps by a tenth, which is
   the granularity such a line was written in. Odd fractions (0.25) are reached
   by typing — the keypad is a decimal one now. */
const rcvStep=it=>Number.isInteger(rcvOrdered(it))?1:0.1;
const rcvName=o=>(LANG==='en'?(o.name_en||o.name_cn):(o.name_cn||o.name_en))||'—';
const rcvStoreName=o=>(LANG==='en'?(o.store_name_en||o.store_name_cn):(o.store_name_cn||o.store_name_en))||'';

/* ── Loaders ─────────────────────────────────────────────────────────────── */
function loadDeliveries(force){
  if(state.rcvTried&&!force) return;
  state.rcvTried=true; state.rcvLoading=true;
  const qs='?q='+encodeURIComponent(state.rcvQ||'')+'&flag='+encodeURIComponent(state.rcvFlag||'all');
  api('/receiving/deliveries'+qs).then(rows=>{
    state.rcvDeliv=Array.isArray(rows)?rows:[]; state.rcvErr=null; state.rcvLoading=false; render();
  }).catch(e=>{ if(String(e.message)==='auth') return;
    state.rcvLoading=false; state.rcvErr=E('Could not load deliveries.','无法加载收货记录。'); render(); });
}
/* Orders still waiting on their goods. The search goes to the server because
   the thing worth searching — the product names on the lines — is not in the
   list payload, and could not be: /purchases already looks inside
   po_line_items for name_en / name_cn / sku, which is exactly the question
   "which order is bringing the mint?" needs asked. */
function loadToReceive(force){
  if(state.rcvToTried&&!force) return;
  state.rcvToTried=true;
  const q=(state.rcvToQ||'').trim();
  api('/purchases'+(q?'?search='+encodeURIComponent(q):'')).then(rows=>{
    state.rcvTo=Array.isArray(rows)?rows:[]; state.rcvToErr=null; render();
  }).catch(e=>{ if(String(e.message)==='auth') return;
    state.rcvToErr=E('Could not load orders.','无法加载采购单。'); render(); });
}
function loadDelivery(id){
  state.rcvDetail=null; state.rcvDetailErr=null;
  api('/receiving/deliveries/'+Number(id)).then(d=>{
    if(state.rcvOpen!==Number(id)) return; state.rcvDetail=d; render();
  }).catch(e=>{ if(String(e.message)==='auth') return;
    state.rcvDetailErr=E('Could not open this delivery.','无法打开这条收货记录。'); render(); });
}
/* The receive screen's whole world in one call: the order, its lines, and
   WHERE it may still be received into. The store answer travels with the
   order rather than being discovered by trying — see the location control. */
function loadReceive(poId){
  state.recvId=Number(poId); state.recvPo=null; state.recvErr=null; state.recvSaveErr=null;
  state.recvVals=null; state.recvDmg=null; state.recvStore=null; state.recvStoreOpen=false; state.recvDone=null;
  /* AND THE REOPEN FLAG. It is an id, so leaving it set carries a correction
     that was open on one order onto whatever line happens to share that id on
     the next — a line that then refuses to fold, for no reason on screen. */
  state.recvOpenLine=null;
  api('/purchases/'+Number(poId)).then(d=>{
    if(state.recvId!==Number(poId)) return;
    state.recvPo=d;
    state.recvStore=d.receiving_store_id||d.store_id||null;
    /* EVERY LINE IS CONFIRMED ONE AT A TIME. `on` is the confirmation: false
       means nobody has said anything about this product yet, and a line nobody
       has spoken for is NOT SENT — the server leaves qty_received null and the
       product stays outstanding for the van that brings it (recvSave).
       A whole order arriving at once is still one tap: "All arrived" on the
       supplier header. What the old screen could not say at all is the case
       this exists for — one product of twelve turned up.

       The counter is still preloaded at the FULL ORDERED QUANTITY, so
       confirming a line that came in whole needs no number typed; the preload
       is what the count STARTS at, not a claim that it arrived.

       `was` is what the SERVER holds, kept so a second visit can tell an
       untouched line from a corrected one — re-sending a line unchanged writes
       a receipt row that reads "recorded 2, changed to 2" in the delivery
       journal (routes/retail-purchasing.js, corrections). A line already
       received opens confirmed, holding its own counts, so re-opening a
       part-received order shows the work somebody already did. */
    const v={};
    (d.items||[]).forEach(it=>{ const had=it.qty_received==null?null:rcvRound(+it.qty_received||0);
      v[it.id]={
      on: had!=null,
      recv: had==null ? rcvRound(+it.qty||0) : had,
      dmg: rcvRound(+it.damaged_qty||0),
      reason: it.receipt_reason||null,
      was: {recv:had, dmg:rcvRound(+it.damaged_qty||0), reason:it.receipt_reason||null} }; });
    state.recvVals=v; render();
  }).catch(e=>{ if(String(e.message)==='auth') return;
    state.recvErr=E('Could not open this order.','无法打开这张采购单。'); render(); });
}
function loadPoReceipts(poId){
  if(state.poReceiptsFor===Number(poId)) return;
  state.poReceiptsFor=Number(poId); state.poReceipts=null;
  api('/purchases/'+Number(poId)+'/receipts').then(d=>{
    if(state.poReceiptsFor!==Number(poId)) return; state.poReceipts=d; render();
  }).catch(e=>{ /* the PO sheet still stands without its deliveries */ });
}

/* ── Derived ─────────────────────────────────────────────────────────────── */
const rcvOrdered=it=>rcvRound(+it.qty||0);
const rcvVal=id=>(state.recvVals&&state.recvVals[id])||{recv:0,dmg:0,reason:null,on:false,was:null};
/* Rounded after the subtraction as well as before it: 0.3 − 0.1 is not 0.2 in
   binary, and an unrounded difference puts "0.19999999999999998 kg short" on
   the glass. */
const rcvShort=it=>rcvRound(Math.max(0,rcvOrdered(it)-rcvVal(it.id).recv));
const rcvOver=it=>rcvRound(Math.max(0,rcvVal(it.id).recv-rcvOrdered(it)));
/* Confirmed, and which way. `on` is the statement; the count says what it
   states. Nothing else in this screen may ask "did it arrive?" of a number
   alone — a zero on an unconfirmed line means "not spoken for", and a zero on
   a confirmed one means "it did not come", which are opposite facts. */
const rcvOn=it=>!!rcvVal(it.id).on;
const rcvCame=it=>rcvOn(it)&&rcvVal(it.id).recv>0;
const rcvNo=it=>rcvOn(it)&&rcvVal(it.id).recv===0;
const rcvWaiting=it=>!rcvOn(it);
/* A confirmed line worth sending: one the server has no count for yet, or one
   whose count/damage/reason has actually moved. Re-asserting an unchanged line
   appends a receipt row that reads as a correction of itself in the delivery
   journal (routes/retail-purchasing.js), so an untouched line is left alone. */
function rcvDirty(it){
  const v=rcvVal(it.id); if(!v.on) return false;
  const w=v.was; if(!w||w.recv==null) return true;
  return v.recv!==w.recv||v.dmg!==w.dmg||(v.reason||null)!==(w.reason||null);
}
const rcvToSend=()=>((state.recvPo&&state.recvPo.items)||[]).filter(rcvDirty);
function rcvSupplier(it,po){ return (it.supplier_name||'').trim()||(po.supplier||'').trim()||T('Unspecified','未指定'); }
/* THE ORDER THE SHELF IS IN. A SKU is <area>-<slot>, so both halves compare
   NUMERICALLY or 1-10 sorts before 1-2 and the list stops matching the walk.
   Lines with no SKU sink rather than sorting as the smallest — an absent code
   is not a low one. */
function rcvSkuKey(s){ const m=/^(\d+)-(\d+)/.exec(s||''); return m?[+m[1],+m[2]]:null; }
function rcvSkuCmp(a,b){
  const sa=(a.sku||''), sb=(b.sku||'');
  if(!sa&&!sb) return 0;
  if(!sa) return 1;
  if(!sb) return -1;
  const ka=rcvSkuKey(sa), kb=rcvSkuKey(sb);
  if(ka&&kb) return (ka[0]-kb[0])||(ka[1]-kb[1])||sa.localeCompare(sb,undefined,{numeric:true});
  if(ka) return -1;
  if(kb) return 1;
  return sa.localeCompare(sb,undefined,{numeric:true,sensitivity:'base'});
}
/* Flat, and deliberately NOT grouped by supplier. The person at the door is
   matching a box in their hands to a line on a screen, and the supplier does
   not help them do that — it is who to chase afterwards, which is Purchasing's
   question and is still in the record. Grouping also asked the same question
   twice: on an order whose suppliers mostly carry one line each, the group row
   and the line row were the same decision, in two different shapes. */
function rcvItems(){ const po=state.recvPo; return po?(po.items||[]).slice().sort(rcvSkuCmp):[]; }
function rcvAnswered(){ return rcvItems().filter(rcvOn).length; }
function rcvGroups(){
  const po=state.recvPo; if(!po) return [];
  const g=new Map();
  (po.items||[]).forEach(it=>{ const k=rcvSupplier(it,po); if(!g.has(k)) g.set(k,[]); g.get(k).push(it); });
  return [...g].map(([name,items])=>({name,items}));
}
/* Five states, because "nothing has been said yet" is not "nothing arrived".
   The old three could not tell them apart: every line opened at its ordered
   quantity, so a group nobody had touched read `ok · Complete` — the screen
   asserting a delivery on the operator's behalf, which is the whole complaint
   this rewrite answers. */
function rcvGroupState(items){
  if(items.every(rcvWaiting)) return 'wait';
  if(items.some(rcvWaiting))  return 'part';
  if(items.every(rcvNo))      return 'none';
  if(items.some(it=>rcvShort(it)>0||rcvVal(it.id).dmg>0||rcvOver(it)>0)) return 'issue';
  return 'ok';
}
function rcvGroupPill(items){
  const s=rcvGroupState(items);
  if(s==='wait')  return pill('draft',T('Not confirmed','待确认'));
  if(s==='part')  return pill('restock',T('Part confirmed','部分确认'));
  if(s==='none')  return pill('view',T('Not arrived','未到货'));
  if(s==='issue') return pill('restock',T('Issues','有异常'));
  return pill('delivered',T('Complete','已齐'));
}
/* Every short line owes a reason — the server refuses the save without one
   (routes/purchases.js planReceiptReason), so the button says so BEFORE the
   tap rather than letting a 400 explain it afterwards. Only CONFIRMED lines
   owe one: an unconfirmed line is not short, it is unanswered, and it is not
   going in the payload at all. */
function rcvMissingReasons(){
  const po=state.recvPo; if(!po) return [];
  return (po.items||[]).filter(it=>rcvOn(it)&&rcvShort(it)>0&&!rcvVal(it.id).reason);
}
function rcvTally(){
  const po=state.recvPo, t={complete:[],short:[],dmg:[],over:[],none:[],waiting:[]};
  (po.items||[]).forEach(it=>{ const v=rcvVal(it.id);
    if(!v.on) { t.waiting.push(it); return; }
    if(v.recv===0) t.none.push(it);
    else if(rcvShort(it)>0) t.short.push(it);
    else if(rcvOver(it)>0) t.over.push(it);
    else t.complete.push(it);
    if(v.dmg>0) t.dmg.push(it); });
  return t;
}

/* ── The receive screen (mockup layout A) ────────────────────────────────── */
/* The destination. Changeable only while nothing has been booked; once the
   first receipt moves stock the server refuses a different store
   (store_locked), because stock_applied_qty is one number per line with no
   store in it and could not describe goods split across two shelves. So the
   lock is SHOWN, with the reason, rather than presented as a live choice that
   fails on save. Never offer what will be refused. */
function rcvLocation(){
  const po=state.recvPo;
  const name=rcvStoreName({store_name_en:po.receiving_store_name_en||po.store_name_en,
                           store_name_cn:po.receiving_store_name_cn||po.store_name_cn});
  const cur=(state.recvStore&&(po.stores||[]).find(s=>s.id===state.recvStore))||null;
  const shown=cur?(LANG==='en'?(cur.name_en||cur.name_cn):(cur.name_cn||cur.name_en)):name;
  if(po.store_locked){
    return `<div class="list"><div class="row" style="min-height:60px;cursor:default">
      <span class="rowico">${ic('map-pin',18)}</span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:12.5px;color:var(--text-secondary)">${T('Receiving into','收货至')}</span>
        <span style="font-size:15.5px;font-weight:500">${escAttr(shown||T('No store','未设门店'))}</span></span>
      <span style="flex:none;color:var(--text-secondary);display:flex">${ic('lock',17)}</span></div>
      <div class="sep"></div>
      <div style="padding:10px 16px 12px;font-size:12.5px;line-height:1.5;color:var(--text-secondary)">
        ${T('Stock from this order is already on this shelf, so it cannot be received somewhere else. Move it with a transfer instead.',
            '本单已有库存入到该门店，因此不能改到其他门店。如需调整请使用调拨。')}</div></div>`;
  }
  const head=`<button class="row" onclick="APP.cmd('recvStoreToggle')" style="min-height:60px">
    <span class="rowico">${ic('map-pin',18)}</span>
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <span style="font-size:12.5px;color:var(--text-secondary)">${T('Receiving into','收货至')}</span>
      <span style="font-size:15.5px;font-weight:500">${escAttr(shown||T('Choose a store','选择门店'))}</span></span>
    <span style="color:var(--text-secondary);display:flex">${ic(state.recvStoreOpen?'chevron-up':'chevron-down',18)}</span></button>`;
  if(!state.recvStoreOpen) return `<div class="list">${head}</div>`;
  return `<div class="list">${head}${(po.stores||[]).map(s=>{
    const on=s.id===state.recvStore;
    return `<div class="sep"></div><button class="row" onclick="APP.cmd('recvStore',${s.id})" style="min-height:52px;padding-left:64px">
      <span style="flex:1;font-size:15px;${on?'font-weight:500':'color:var(--text-secondary)'}">${escAttr(LANG==='en'?(s.name_en||s.name_cn):(s.name_cn||s.name_en))}</span>
      ${on?`<span style="color:var(--sage-ink);display:flex">${ic('check',18,2)}</span>`:''}</button>`;}).join('')}</div>`;
}
/* One line, and the thing it must be able to say: THIS PRODUCT ARRIVED —
   about itself, not about the order it happens to sit in.
   [Arrived] / [Not arrived] is the confirmation; the counter appears once one
   of them is pressed, because a number with nothing behind it was exactly the
   old screen's problem: twelve lines showing their ordered quantity and one
   button that recorded all twelve.
   Below that, unchanged: [−][n][+] as one control, the unit beside it, and the
   damage mark at the right end of the SAME row — one row, one hand, nothing
   hidden. */
function rcvLine(it){
  const v=rcvVal(it.id), ord=rcvOrdered(it), sh=rcvShort(it), ov=rcvOver(it);
  const on=rcvOn(it), came=rcvCame(it), no=rcvNo(it);
  /* Declared HERE, not beside the counter it also feeds: the fold below returns
     before that point, and a const read above its declaration is a TDZ throw
     rather than an undefined — the whole screen, not one row. */
  const edited=v.recv!==ord;
  /* Pressing the state a line is already in takes it back to unanswered. That
     is the undo, and it is where it is looked for — on the thing that was
     pressed — rather than in a separate control that would have to explain
     itself. */
  /* THE ORDERED QUANTITY IS THE BUTTON. An unanswered line offers the number it
     is expecting — "10 kg arrived" — so confirming the ordinary case is one tap
     and the figure being confirmed is on the control that confirms it. The
     other half says "Not 10", which is the honest opposite and opens the
     counter at zero to be counted up.
     What it replaces: a bare [Arrived] / [Not arrived] pair that named no
     number, above a counter that then had to be read separately. And what it
     must never become: an untouched line that reads as delivered. Nothing here
     is answered by silence — `on` is set by a press, and only a pressed line
     goes on the wire. */
  const unit=escAttr(it.unit||'');
  const ordTxt=rcvFmt(ord)+(unit?' '+unit:'');
  const answer=on?'':`<div style="display:flex;gap:8px">
    <button class="chip" style="flex:1;justify-content:center;padding:0 10px"
      onclick="APP.cmd('recvArrived','${it.id}')">${ic('check',16,2)}${LANG==='en'?(ordTxt+' arrived'):(ordTxt+' 已到货')}</button>
    <button class="chip" style="flex:none;justify-content:center;padding:0 14px;color:var(--text-secondary)"
      onclick="APP.cmd('recvNotArrived','${it.id}')">${LANG==='en'?('Not '+rcvFmt(ord)):('并非 '+rcvFmt(ord))}</button></div>`;
  /* Answered AS ORDERED folds to one quiet row — the screen shortens as the
     operator works instead of staying a wall of twelve. The number it was
     answered with stays on the row, because "checked" must never be something
     the reader has to infer. Pressing it is the undo. */
  const folded=came&&!edited&&!v.dmg&&String(state.recvOpenLine)!==String(it.id);
  if(folded) return `<button class="row" style="min-height:52px;padding:11px 14px;gap:10px;border-radius:12px;background:var(--surface-raised)"
    onclick="APP.cmd('recvOpenLine','${it.id}')">
    <span style="flex:none;color:var(--sage-ink);display:flex">${ic('check',17,2)}</span>
    <span class="num" style="flex:none;font-size:13px;font-weight:500;color:var(--text-secondary)">${escAttr(it.sku||'')}</span>
    <span style="flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(rcvName(it))}</span>
    <span class="num" style="flex:none;font-size:13.5px;color:var(--text-secondary)">${ordTxt}</span></button>`;
  /* Compared as strings: the command carries the id back through an onclick
     attribute, so it arrives as text while it.id is a number, and === between
     the two is quietly always false — the counter opened in state and never on
     the glass. */
  const open=on&&String(state.recvDmg)===String(it.id);
  const st=rcvStep(it);
  /* THE WAY BACK from an answered line. With the ordered quantity acting as the
     confirm button there is no chip left to press a second time, so the undo
     that the pair used to carry has to be said out loud. It un-answers — it
     does not set the count to zero, which is the opposite fact. */
  const undo=!on?'':`<button class="btn2" style="min-height:34px;padding:0 12px;font-size:12.5px;color:var(--text-secondary);align-self:flex-start;border:none"
    onclick="APP.cmd('recvArrived','${it.id}')">${T('Not checked yet','尚未核对')}</button>`;
  const qty=!on?'':`<div style="display:flex;align-items:center;gap:8px">
    <button class="stepbtn" ${v.recv<=0?'disabled':''} aria-label="${T('Less','减少')}" onclick="APP.cmd('recvQty','${it.id}|${-st}')">${ic('minus',22,2)}</button>
    <input class="qty${edited?' edit':''}" inputmode="decimal" value="${rcvFmt(v.recv)}"
      aria-label="${T('Arrived','已收')}" onfocus="this.select()" onchange="APP.cmd('recvQtySet','${it.id}|'+this.value)">
    <button class="stepbtn" aria-label="${T('More','增加')}" onclick="APP.cmd('recvQty','${it.id}|${st}')">${ic('plus',22,2)}</button>
    <span style="font-size:14px;color:var(--text-secondary)">${escAttr(it.unit||'')}</span>
    <button class="dmgbtn${v.dmg>0?' on':''}" style="margin-left:auto${open&&!v.dmg?';border-color:var(--text-primary);color:var(--text-primary)':''}"
      aria-label="${T('Damaged','破损')}" onclick="APP.cmd('recvDmgOpen','${it.id}')">${ic('package-x',20)}${v.dmg>0?`<span class="n">${rcvFmt(v.dmg)}</span>`:''}</button></div>`;
  /* Damage: one tap to the counter, every press writes, nothing to confirm —
     the count is already on the mark, so closing loses nothing. */
  const dmg=open?`<div class="rise" style="margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--surface-raised)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="color:var(--text-secondary);display:flex">${ic('package-x',16)}</span>
      <span style="flex:1;font-size:13.5px;font-weight:500">${T('How many damaged?','破损几件？')}</span>
      <button class="btn2" style="min-height:32px;padding:0 10px;font-size:12.5px;color:var(--text-secondary)" onclick="APP.cmd('recvDmgOpen','${it.id}')">${T('Done','完成')}</button></div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="stepbtn sm" ${v.dmg<=0?'disabled':''} onclick="APP.cmd('recvDmg','${it.id}|${-st}')">${ic('minus',18,2)}</button>
      <input class="qty sm" inputmode="decimal" value="${rcvFmt(v.dmg)}"
        style="${v.dmg>0?'border-color:var(--brick);background:var(--brick-tint);color:var(--brick-ink)':''}"
        onfocus="this.select()" onchange="APP.cmd('recvDmgSet','${it.id}|'+this.value)">
      <button class="stepbtn sm" ${v.dmg>=v.recv?'disabled':''} onclick="APP.cmd('recvDmg','${it.id}|${st}')">${ic('plus',18,2)}</button>
      <span class="num" style="margin-left:auto;font-size:12.5px;color:var(--text-secondary);text-align:right">${
        LANG==='en'?('of '+rcvFmt(v.recv)+' '+(it.unit||'')+'<br>arrived'):('共收 '+rcvFmt(v.recv)+' '+(it.unit||''))}</span></div></div>`:'';
  /* The shortfall is STATED. Nobody is asked to work out the difference.
     Only once the line has been confirmed: an unanswered line is not short of
     anything, and saying so would be the screen filling in the answer again. */
  let note='';
  if(!on){ note=''; }
  else if(sh>0){ const txt=v.recv===0?T('Nothing arrived — what happened?','未到货 — 原因？')
      :(LANG==='en'?(rcvFmt(sh)+' '+(it.unit||'')+' short of '+rcvFmt(ord)+' — what happened?'):('短少 '+rcvFmt(sh)+' '+(it.unit||'')+'（订购 '+rcvFmt(ord)+'）— 原因？'));
    note=`<div style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--amber-ink)">${ic('triangle-alert',16)}<span class="num" style="font-size:13.5px">${txt}</span></div>`;
  } else if(ov>0){
    note=`<div style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--text-secondary)">${ic('triangle-alert',16)}<span class="num" style="font-size:13.5px">${
      LANG==='en'?(rcvFmt(ov)+' '+(it.unit||'')+' over ordered'):('多收 '+rcvFmt(ov)+' '+(it.unit||''))}</span></div>`;
  }
  /* Three reasons, 2-up. A horizontal scroller fits about two and a half at
     380px, which put the last one behind a sideways swipe nested inside a
     vertical list — invisible unless you knew to look. */
  const reasons=(on&&sh>0)?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">${
    RCV_REASONS.map(r=>`<button class="chip${v.reason===r.key?' on':''}" style="justify-content:center;padding:0 10px"
      onclick="APP.cmd('recvReason','${it.id}|${r.key}')">${T(r.en,r.zh)}</button>`).join('')}</div>`:'';
  /* An unanswered line is DIMMED, not hidden and not disabled: it has to stay
     readable while the eye runs down the order looking for the one product
     that came, and it is one tap from being answered. */
  return `<div class="card" style="padding:14px${on?'':';border-style:dashed'}">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px${on?'':';opacity:.72'}">
      <span style="display:flex;flex-direction:column;min-width:0">
        <span style="font-size:15.5px;font-weight:500">${escAttr(rcvName(it))}</span>
        ${it.sku?`<span class="num" style="font-size:12px;color:var(--text-secondary);margin-top:2px">${escAttr(it.sku)}</span>`:''}</span>

/* The two whole-supplier answers, because those are the two things that happen

function rcvSummary(){
  const t=rcvTally();
  const row=(tone,txt)=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0">
    <span style="width:6px;height:6px;border-radius:999px;flex:none;background:${tone}"></span>

  t.dmg.forEach(it=>rows+=row('var(--brick)',LANG==='en'?(escAttr(rcvName(it))+' — '+rcvFmt(rcvVal(it.id).dmg)+' '+(it.unit||'')+' damaged'):(escAttr(rcvName(it))+' — 破损 '+rcvFmt(rcvVal(it.id).dmg)+' '+(it.unit||''))));
  t.over.forEach(it=>rows+=row('var(--graphite)',LANG==='en'?(escAttr(rcvName(it))+' — '+rcvFmt(rcvOver(it))+' '+(it.unit||'')+' over ordered'):(escAttr(rcvName(it))+' — 多收 '+rcvFmt(rcvOver(it))+' '+(it.unit||''))));
  t.none.forEach(it=>rows+=row('var(--graphite)',LANG==='en'?(escAttr(rcvName(it))+' — nothing arrived'):(escAttr(rcvName(it))+' — 未到货')));
  /* What this save does NOT say, stated as plainly as what it does. A line
     nobody answered is left exactly as the order has it: it stays outstanding,
     the order stays in To receive, and the next van can bring it. Without this
     sentence a part-confirmed save looks like it silently dropped the rest. */
  const rest=t.waiting.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-default);
      font-size:12.5px;line-height:1.5;color:var(--text-secondary)">${LANG==='en'
      ?(t.waiting.length+' product'+(t.waiting.length>1?'s':'')+' not answered yet — '+(t.waiting.length>1?'they stay':'it stays')+' on this order for a later delivery.')
      :('还有 '+t.waiting.length+' 项未确认 —— 将保留在本单，可在下次到货时收货。')}</div>`:'';
  if(!rows) rows=`<div style="padding:7px 0;font-size:13.5px;color:var(--text-secondary)">${
    T('Nothing confirmed yet. Mark what arrived, product by product.','尚未确认。请逐项标记到货情况。')}</div>`;
  return `<div class="card" style="padding:14px 16px">
    <span class="eyebrow" style="display:block;margin-bottom:4px">${T('About to record','即将登记')}</span>${rows}${rest}</div>`;
}

  const err=state.recvSaveErr?`<div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;background:var(--brick-tint);margin-bottom:10px">

      :('还有 '+missing.length+' 项短少未选原因。')}</span></div>`:'';
  /* Nothing to send is not a failure and gets no alarm colour — it is the

  return `<div style="padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px">

}

/* ── The Receiving screen: To receive / Received ─────────────────────────── */
/* One pill per flag. A lookup rather than the ternary chain this used to be:
   `returned` made it a fourth branch, and the chain's final `else` had quietly
   become "anything I don't recognise is 多收", which a return would have
   inherited. Unknown flags now render nothing instead of a wrong word. */
function rcvFlagPill(f){
  if(f==='short')    return pill('restock',T('Short','短少'));
  if(f==='damaged')  return pill('refund',T('Damaged','破损'));
  if(f==='over')     return pill('draft',T('Over','多收'));
  if(f==='returned') return pill('refund',T('Returned','退货'));
  return '';
}
function rcvFlagPills(flags){
  if(!flags||!flags.length) return pill('delivered',T('Clean','无异常'));
  return flags.map(rcvFlagPill).join('');
}
function rcvSupText(d){
  const s=d.suppliers||[];

function rcvCorrection(c,prev){

          ? (LANG==='en'?(escAttr(c.actor_label||T('Someone','某人'))+' changed this to '+rcvFmt(c.qty_received))

function rcvDetailBody(d){
  const fact=(icon,txt)=>`<span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary)">${ic(icon,14)}${txt}</span>`;

    /* Corrections hang under the line they correct, oldest first. Each reads

      ${+l.returned_qty>0?`<div class="num" style="font-size:12.5px;color:var(--brick-ink);margin-top:3px">${LANG==='en'?(rcvFmt(l.returned_qty)+' '+(l.unit||'')+' sent back'):('退回 '+rcvFmt(l.returned_qty)+' '+(l.unit||''))}${l.receipt_reason?' · '+rcvReturnReason(l.receipt_reason):''}</div>`:''}
      ${corr}</div>`;}).join('');

    <div style="display:flex;flex-wrap:wrap;gap:14px;padding:2px 0 10px">
      ${fact('shopping-cart',`<button onclick="APP.cmd('rcvOpenPO',${d.po_id})" style="background:none;border:none;padding:0;margin:0;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--text-primary);text-decoration:underline;text-underline-offset:2px"><span class="num">${escAttr(d.po_number||'')}</span></button>`)}
      ${rcvStoreName(d)?fact('map-pin',escAttr(rcvStoreName(d))):''}
      ${d.actor_label?fact('user',escAttr(d.actor_label)):''}

    ${d.note?`<div style="font-size:13px;color:var(--text-secondary);line-height:1.5;padding-bottom:6px">${escAttr(d.note)}</div>`:''}
    ${lines}</div>`;
}
/* Deliveries and returns share this list, because they are the same journal:
   what came in and what went back out, in the order it happened. They must not
   share a face, though — a row that says "3 lines" over a returned-goods event
   reads as another delivery, and telling those two apart at a glance is the
   whole reason `kind` is stamped on the record (database.js). So a return says
   which direction the goods went, in its icon and in its own line of text. */
function rcvDeliveryRow(d,i){
  const open=state.rcvOpen===d.id;

  const issues=(d.flags||[]).length;

  const units=rcvRound(+d.returned_units||0);

           ret?(LANG==='en'?('sent back'+(units?' · '+units:'')):('已退回'+(units?' · '+units:'')))
              :((d.line_count||0)+' '+T(d.line_count===1?'line':'lines','项'))].filter(Boolean).join(' · ')}</span>

        <span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px">${rcvFlagPills(d.flags)}</span></span>
      <span style="color:var(--text-secondary);display:flex;padding-top:4px">${ic(open?'chevron-up':'chevron-down',18)}</span></button>

/* AN ORDER WITH GOODS STILL TO COME BELONGS HERE, whatever its status says.
   The receive route moves a PO to Delivered on the first arrived count it is
   given (routes/retail-purchasing.js), which was harmless while a save always
   covered every line and is not now: confirming the one product that turned up
   would otherwise drop the other eleven out of this list, with no way back to
   them. `received_lines < line_count` is the honest test — a line is counted
   the moment somebody answers it either way, including "nothing arrived", so
   what is left is only what nobody has spoken for. */
const rcvPartial=p=>p.status==='Delivered'
  && Number(p.line_count||0)>0 && Number(p.received_lines||0)<Number(p.line_count||0);
function rcvToReceive(){
  const all=state.rcvTo||[];
  return all.filter(p=>p.status==='Requested'||p.status==='Ordered'||rcvPartial(p));
}
/* The products a search matched, named on the row. Without this a hit reads as
   "this order matched, open it to find out why", which is the one-by-one hunt
   the search exists to replace. */
function rcvMatched(r){
  const m=r.matched_lines||[];
  if(!m.length) return '';
  const names=m.map(l=>(LANG==='en'?(l.name_en||l.name_cn):(l.name_cn||l.name_en))||l.sku).filter(Boolean);
  if(!names.length) return '';
  return `<span style="display:flex;align-items:center;gap:5px;margin-top:1px;font-size:12.5px;color:var(--sage-ink);min-width:0">
    ${ic('package',13)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(names.join(' · '))}</span></span>`;
}
function statusReceiving(){
  const n=rcvToReceive().length, d=state.rcvDeliv;
  const bits=[LANG==='en'?(n+' waiting on a delivery'):(n+' 张待收货')];
  if(d) bits.push(LANG==='en'?(d.length+' taken in'):(d.length+' 次收货'));
  return bits.join(' · ');
}

/* ══════════════════════════════════════════════════════════════════════════
   ADD STOCK — the kitchen's other tool, in this app rather than beside it
   --------------------------------------------------------------------------
   The rules this screen keeps are the ones /stock learned, and each of them is
   a decision, not a detail:

     • The shelf total is NEVER shown. A kitchen logs what it MADE; the running
       count is somebody else's number and putting it on this screen invites the
       operator to reconcile against it.
     • The stepper builds a "+N" and commits it as ONE delta after a pause, then
       resets to +0. Every tap writing on its own would put six rows of the
       ledger where one belongs.
     • A failed write HANDS THE AMOUNT BACK and says so IN THE ROW. Losing a
       count at the door is the one failure nobody forgives, and a toast that
       fades has told the operator nothing they can act on.
   ────────────────────────────────────────────────────────────────────────── */
function qsStore(){ const c=state.qs.ctx; if(!c) return null;
  return (c.stores||[]).find(s=>s.id===state.qs.storeId) || (c.stores||[])[0] || null; }
function qsStoreName(){ const s=qsStore(); return s ? (LANG==='en'?(s.name_en||s.name_cn||''):(s.name_cn||s.name_en||'')) : ''; }
function qsName(p){ return LANG==='en'?(p.name_en||p.name_cn||''):(p.name_cn||p.name_en||''); }

function loadQsCtx(){
  if(state.qs.ctxTried) return; state.qs.ctxTried=true;
  api('/quick-stock/context').then(d=>{
    state.qs.ctx=d||{}; state.qs.ctxErr=null;
    const st=(d&&d.stores)||[];
    state.qs.storeId=st.length?st[0].id:null;
    render();
    if(state.qs.storeId!=null) loadQsItems();
  }).catch(e=>{ if(String(e.message)==='auth') return;
    state.qs.ctxErr=E('Could not open Add stock.','无法打开“加库存”。'); render(); });
}
function loadQsItems(force){
  if(state.qs.storeId==null) return;
  if(state.qs.itemsTried&&!force) return;
  state.qs.itemsTried=true;
  api('/stores/'+state.qs.storeId+'/stock').then(rows=>{
    state.qs.items=Array.isArray(rows)?rows:((rows&&rows.rows)||[]);
    state.qs.itemsErr=null; render();
  }).catch(e=>{ if(String(e.message)==='auth') return;
    state.qs.itemsErr=E('The shelf didn’t load.','货架加载失败。'); render(); });
}
function qsRows(){
  const all=state.qs.items||[];
  const q=state.qs.q.trim().toLowerCase();
  if(!q) return all;
  return all.filter(p=>(String(p.name_en||'')+' '+String(p.name_cn||'')+' '+String(p.sku||''))
    .toLowerCase().indexOf(q)!==-1);
}
/* A tap moves the pending amount and restarts the pause. The write is the
   FLUSH, not the tap. */
function qsBump(id,d){
  const cur=state.qs.add[id]||0;
  state.qs.add[id]=Math.max(0,cur+d);
  delete state.qs.rowErr[id];
  clearTimeout(state.qs.timers[id]);
  state.qs.timers[id]=setTimeout(()=>qsFlush(id),700);
  render();
}
function qsFlush(id){
  clearTimeout(state.qs.timers[id]); delete state.qs.timers[id];
  const n=state.qs.add[id]||0;
  if(n<=0) return;
  const p=(state.qs.items||[]).find(x=>x.product_id===id||x.id===id);
  state.qs.add[id]=0;
  state.qs.inflight[id]=n;
  render();
  apiWrite('/stores/'+state.qs.storeId+'/stock/'+id,{delta:n,reason:'kitchen_add',note:'add-stock'},'PATCH')
    .then(()=>qsWriteLanded(id,n,p))
    .catch(e=>{ if(String(e.message)==='auth') return; qsWriteFailed(id,n,e.message); });
}
/* The two ways a write ends, named. They are the whole point of the screen —
   what the operator is left holding — so they are functions rather than two
   anonymous tails of a promise chain, and can be exercised on their own. */
function qsWriteLanded(id,n,p){
  delete state.qs.inflight[id];
  render();
  showToast(T('Added '+n,'已加 '+n+' 件')+(p?' · '+qsName(p):''));
}
function qsWriteFailed(id,n,msg){
  // The amount comes BACK, so the next tap continues the count rather than
  // starting it again from a number the operator has to remember. And it is
  // said IN THE ROW: a toast that fades has told them nothing they can act on.
  state.qs.add[id]=(state.qs.add[id]||0)+n;
  delete state.qs.inflight[id];
  state.qs.rowErr[id]=msg||E('Didn’t save','未保存');
  render();
}
function screenStockAdd(){
  loadQsCtx();
  const qs=state.qs;
  if(qs.ctxErr) return `<div style="padding:14px 16px 24px"><div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
    <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
    <span style="font-size:14px;color:var(--brick-ink)">${qs.ctxErr}</span></div></div>`;
  if(!qs.ctx) return `<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  if(qs.ctx.enabled===false) return nothingYet(T('Add stock is off','“加库存”已关闭'),
    T('This tool is switched off for the shop. Whoever manages your team can turn it back on.','该功能已为本店关闭，可请团队管理员重新开启。'));
  if(!(qs.ctx.stores||[]).length) return nothingYet(T('No store assigned','未分配门店'),
    T('You need a store before you can add stock to one. Whoever manages your team can set it.','需要先分配门店才能加库存，可请团队管理员设置。'));

  const search=`<div style="padding:12px 16px;position:relative">
    <span style="position:absolute;left:30px;top:50%;transform:translateY(-50%);color:var(--text-secondary);display:flex;pointer-events:none">${ic('search',18)}</span>
    <input id="mQsQ" inputmode="search" enterkeyhint="search" value="${escAttr(qs.q)}" style="padding-left:42px"
      placeholder="${T('Search products','搜索商品')}" oninput="APP.cmd('qsSearch',this.value)"></div>`;

  if(qs.itemsErr) return search+`<div style="padding:0 16px 24px"><div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
    <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
    <span style="font-size:14px;color:var(--brick-ink)">${qs.itemsErr}</span></div>
    <button class="btn2" style="width:auto;padding:11px 26px;margin:12px auto 0;display:flex" onclick="APP.cmd('qsRetry')">${T('Try again','重试')}</button></div>`;
  if(!qs.items) return search+`<div style="padding:44px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;

  const rows=qsRows();
  if(!rows.length) return search+(qs.q.trim()
    ? `<div style="padding:34px 16px;text-align:center;font-size:14px;color:var(--text-secondary)">${T('No products match','没有匹配的商品')}</div>`
    : nothingYet(T('Nothing to count here yet','这里还没有商品'),

  const card=p=>{

      <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
        <button class="stepbtn" style="width:56px;height:56px" onclick="APP.cmd('qsBump',${id},-1)"${pend<=0?' disabled':''}
          aria-label="${T('Less','减少')}">${ic('minus',24)}</button>
        <span class="num" style="flex:1;height:56px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:500;letter-spacing:-.01em;color:${flying?'var(--text-secondary)':'var(--text-primary)'}">+${pend}</span>
        <button class="stepbtn" style="width:56px;height:56px" onclick="APP.cmd('qsBump',${id},1)"
          aria-label="${T('More','增加')}">${ic('plus',24)}</button>
      </div>
      ${flying?`<div style="font-size:13px;color:var(--text-secondary)">${T('Adding '+flying+'…','正在加 '+flying+' 件…')}</div>`:''}
      ${err?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

        <button class="btn2" style="min-height:36px;padding:0 14px;font-size:13px" onclick="APP.cmd('qsFlush',${id})">${T('Retry','重试')}</button></div>`:''}
    </div>`;
  };
  return search+`<div style="padding:0 16px 32px;display:flex;flex-direction:column;gap:8px">${rows.map(card).join('')}</div>`;
}

/* Pausing a coupon is the one marketing action a phone should have: it is a
   single field on a single record, and it is what an operator reaches for when
   a code is being abused. Creating one is authoring, and stays on the desktop. */
function toggleCoupon(code){
  const c=(DB.coupons||[]).find(x=>x.code===code);
  if(!c||c.id==null||state.couponBusy) return;
  // The switch controls is_active. LIVE is is_active AND unexpired, so turning
  // an expired coupon back on makes it active and still not live — and the card
  // has to keep saying "Ended" rather than flipping to running.
  const next=!c.active;
  state.couponBusy=code; state.couponErr=null; render();
  apiWrite('/vouchers/'+c.id,{is_active:next},'PATCH').then(()=>{
    c.active=next; c.on=next&&!c.ended; state.sw['c_'+code]=next; state.couponBusy=null; render();
    showToast(next?T('Coupon on','已启用'):T('Coupon paused','已暂停'));
  }).catch(e=>{
    state.couponBusy=null;
    if(String(e.message)==='auth') return;
    state.couponErr=E('That did not save. The coupon is unchanged.','没有保存成功。优惠券没有变化。'); render();
  });
}
/* A scheduled broadcast can still be stopped; a sent one cannot. The server is
   the judge — it refuses anything already on its way out. */
function recallBroadcast(id){
  const b=(DB.broadcasts||[]).find(x=>x.id===id);
  if(!b||state.bcBusy) return;
  state.bcBusy=id; state.bcErr=null; render();
  apiWrite('/broadcasts/'+id+'/recall',{}).then(r=>{
    const st=(r&&r.data&&r.data.status)||'cancelled';
    b.st=st; b.status=st==='cancelled'?['Cancelled','已取消']:['Sent','已发送']; b.kind=st==='cancelled'?'off':'delivered';
    state.bcBusy=null; render();
    showToast(st==='cancelled'?T('Send cancelled','已取消发送'):T('It had already gone out','已经发送完成'));
  }).catch(e=>{
    state.bcBusy=null;
    if(String(e.message)==='auth') return;
    state.bcErr=E('That did not go through. Nothing has changed.','没有成功。数据没有变化。'); render();
  });
}
async function loadMirror(which){
  if(state.mirrorLoading===which) return;
  state.mirrorLoading=which; state.mirror=state.mirror||{}; render();
  try{
    if(which==='meituan'){
      // Health first, and separately: the daemon being unreachable is the
      // answer to "why has nothing come in", and it must not be swallowed by
      // the orders fetch succeeding from cache.
      try{ state.mtStatus=await apiRaw('/meituan/status'); state.mtOffline=false; }
      catch(e){ if(String(e.message)!=='auth'){ state.mtStatus=null; state.mtOffline=true; } }
      state.mtStatusTried=true;
      const rows=await api('/meituan/orders?limit=30');
      state.mirror.meituan=(Array.isArray(rows)?rows:[]).map(r=>({
        id:r.order_no||('#'+r.id), cust:r.recipient_name||'—', total:money(CUR,r.total),
        when:fmtDay(r.placed_at), store:T(r.store_name_en||r.store_code||'',r.store_name_cn||r.store_name_en||''),
        items:(r.items||[]).length}));
    } else {
      // apiRaw, not api: mode, flagged and summary ride the envelope BESIDE
      // `data`, and api() returns `data` alone. The phone was reading `recent`
      // — the drops that were applied automatically — and dropping the queue
      // of drops that are waiting for a human, which is the only thing on this
      // screen anybody can act on.
      const d=await apiRaw('/guanyi/pickups');
      const recent=(d&&d.recent)||[];
      state.mirror.gzgrocery=recent.slice(0,30).map(r=>({
        id:T(r.name_en||r.name_cn||'—', r.name_cn||r.name_en||'—'),
        cust:r.product_sku?('SKU '+r.product_sku):'', total:(r.inferred_pickup!=null?('×'+r.inferred_pickup):''),
        when:fmtDay(r.created_at), store:'', items:0}));
      state.gzFlagged=(d&&d.flagged)||[];
      state.gzSummary=(d&&d.summary)||null;
      state.mirrorMode=(d&&d.mode)||null;
    }
  }catch(e){ if(String(e.message)==='auth') return; state.mirror[which]=null; }
  state.mirrorLoading=null; render();
}

/* Meituan's health, which the phone did not show at all.
   --------------------------------------------------------------------------
   The state worth naming is a STUCK stock queue. A queue mid-drain clears in
   seconds, so "107 sending…" and "107 stuck for 19 hours" are the same number
   on screen unless somebody looks at how long the oldest one has been waiting.
   The desktop learned that the hard way — its own comment says a 19-hour stock
   freeze presented as a normal-looking tile — and uses 30 minutes as the line.
   This uses the same line, because a phone is where you would notice. */
const MT_STUCK_MIN=30;
function mtHealthCard(){
  if(state.mtOffline) return `<div style="display:flex;flex-direction:column;gap:5px;background:var(--brick-tint);border-radius:14px;padding:14px 16px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="flex:none;color:var(--brick-ink);display:flex">${ic('triangle-alert',18)}</span>
      <span style="font-size:14.5px;font-weight:500;color:var(--brick-ink)">${T('The Meituan sync service is offline','美团同步服务离线')}</span></div>
    <div style="font-size:13px;color:var(--brick-ink);opacity:.9;line-height:1.5">${T('Orders are not being imported and stock is not being pushed.','订单未导入，库存也未推送。')}</div></div>`;
  const st=state.mtStatus;
  if(!st) return '';
  const pending=Number(st.queuePending||0), failed=Number(st.queueFailed||0);
  const oldest=Number(st.queueOldestMin||0);
  const stuck=pending>0&&oldest>=MT_STUCK_MIN;
  // Spelled out, because this reads inside a sentence: "stuck for 19 h" put a
  // space in the middle of an abbreviation the rest of the app writes as 19h.
  const stuckFor = (()=>{ if(oldest<120) return T(oldest+(oldest===1?' minute':' minutes'),oldest+' 分钟');
    const h=Math.round(oldest/60); return T(h+(h===1?' hour':' hours'),h+' 小时'); })();
  const lo=(st.lastOrder&&st.lastOrder[0])||null;
  let line, tone;
  if(stuck){ tone='brick'; line=T('Stock pushes have been stuck for '+stuckFor+' — what Meituan shows is out of date.',
                                  '库存推送已卡住 '+stuckFor+' — 美团上显示的库存已过期。'); }
  else if(failed>0){ tone='amber'; line=T(failed+' stock push'+(failed===1?'':'es')+' failed in the last day'+(pending?' · '+pending+' sending…':''),
                                          '最近一天有 '+failed+' 次库存推送失败'+(pending?' · '+pending+' 发送中…':'')); }
  else if(pending>0){ tone='plain'; line=T(pending+' sending…',pending+' 发送中…'); }
  else { tone='plain'; line=T('All stock pushes sent','库存推送已全部发送'); }
  const bgs={brick:'var(--brick-tint)',amber:'rgba(201,149,74,0.12)',plain:'var(--surface-card)'};
  const fgs={brick:'var(--brick-ink)',amber:'var(--amber-ink)',plain:'var(--text-primary)'};
  return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:7px;background:${bgs[tone]}${tone==='plain'?'':';border:none'}">
    <div style="display:flex;align-items:center;gap:10px">
      ${tone==='plain'?'':`<span style="flex:none;color:${fgs[tone]};display:flex">${ic('triangle-alert',18)}</span>`}
      <span style="font-size:14.5px;font-weight:500;color:${fgs[tone]}">${line}</span></div>
    <div class="num" style="font-size:12.5px;color:${tone==='plain'?'var(--text-secondary)':fgs[tone]};opacity:${tone==='plain'?1:.9}">${
      lo ? T('Last order '+fmtDay(lo.imported_at),'最近订单 '+fmtDay(lo.imported_at)) : T('No orders yet','暂无订单')
    }${st.mappedCount!=null?' · '+T(st.mappedCount+' products synced',st.mappedCount+' 件商品已同步'):''}</div></div>`;
}
/* The three modes the daemon can be in, and what each one means for stock.

          ${btn(T('Glitch · leave it','数据错误 · 不扣减'),`APP.cmd('gzPickup',${f.id},'ignore')`,busy,false)}</div></div>`;
    }).join('')}</div>`;
}

const ORDER_NEXT={
  paid:            {to:'preparing',  en:'Start preparing',  zh:'开始备货',  busyEn:'Starting…',  busyZh:'处理中…'},
  awaiting_restock:{to:'preparing',  en:'Restocked · start preparing', zh:'已补货 · 开始备货', busyEn:'Starting…', busyZh:'处理中…'},
  preparing:       {to:'dispatched', en:'Mark dispatched',  zh:'标记已发货', busyEn:'Marking…',  busyZh:'处理中…'},
  dispatched:      {to:'delivered',  en:'Mark delivered',   zh:'标记送达',  busyEn:'Marking…',  busyZh:'处理中…'},
};
/* A pickup order walks the same machine with a different journey: dispatched is
   "ready at the counter" and delivered is "the customer came and took it". The
   desktop relabels both; so does this, or the phone tells a counter to dispatch
   something nobody is shipping. */
const ORDER_NEXT_PICKUP={dispatched:{en:'Mark ready for pickup',zh:'标记可取货'},delivered:{en:'Mark picked up',zh:'标记已取货'}};
/* pending_payment is deliberately absent: marking an off-app payment records
   WHICH tender it was, and guessing that from a phone would put "unknown" on
   the books. It stays a desktop action until the phone can ask. */
function orderNext(o){
  // A marketplace mirror is read at 100% legibility and acted on at 0%: the
  // platform drives it, and a button here would write into a queue we do not own.
  if(!o||o.viewOnly||!o.raw) return null;
  const n=ORDER_NEXT[o.raw]; if(!n) return null;
  const alt=o.pickup&&ORDER_NEXT_PICKUP[n.to];
  return alt?Object.assign({},n,alt):n;
}

/* A write helper that keeps the server's own words. api() throws away the body,
   and the body is where the reason lives. */
async function apiWrite(path, body, method){
  const r=await fetch(apiURL(path),{method:method||'POST',credentials:'same-origin',
    headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify(body||{})});
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const e=new Error((j&&(j.message||j.error))||('HTTP '+r.status)); e.code=j&&j.error; throw e; }
  return j;
}
function orderErrorText(e){
  if(e.code==='__plain') return e.message;
  if(e.code==='invalid_transition') return T('This order has already moved on. Close and open it again to see where it is now.',
                                             '这个订单已经进入下一步。请关闭后重新打开查看当前状态。');
  if(e.code==='refund_already_processing'||e.code==='use_refund_payout') return e.message;
  if(e.code==='already_shipped') return T('A parcel already has a waybill, so this cannot be undone here. Cancel the waybill first.',
                                          '已有包裹生成运单，无法在此撤销。请先取消运单。');
  return T('That did not go through. Nothing has changed — try again.','没有成功。数据没有变化 — 请重试。');
}
/* Every write disables the control it belongs to and says what it is doing, and
   a failure renders where the operator is looking and stays until they act on
   it. A toast confirms; it never reports a failure. */
async function orderWrite(kind, run){
  if(state.orderBusy) return;
  state.orderBusy=kind; state.orderErr=null; render();
  try{
    const msg=await run();
    state.orderBusy=null; render();
    if(msg) showToast(msg);
    refreshOrders();
  }catch(e){
    state.orderBusy=null;
    if(String(e.message)==='auth') return;
    state.orderErr=orderErrorText(e); render();
  }
}
/* printer.* is private config, so it has its own read and write. The phone shows
   the switch only once it knows the real value — a switch that guesses its own
   position is worse than no switch. */
/* One product, every store, one call — /products/:id/store-stocks answers with
   exactly the rows this sheet edits. (The first version read each store's whole
   catalogue and picked one row out of it.) */
async function loadProductStock(pid){
  if(pid==null){ state.prodStockReady=true; render(); return; }
  state.prodStockReady=false; state.prodStores=null; render();
  try{
    const rows=await api('/products/'+pid+'/store-stocks');
    state.prodStores=(Array.isArray(rows)?rows:[]).map(r=>({
      id:r.store_id, name_en:r.name_en||r.code||('#'+r.store_id), name_cn:r.name_cn||r.name_en||r.code||('#'+r.store_id),
      qty:Number(r.physical_qty||0)}));
    state.prodStores.forEach(st=>{ sheetStep['st_'+st.id]=st.qty; });
  }catch(e){ state.prodStores=null; }
  state.prodStockReady=true; render();
}
async function saveProductEdits(){
  const p=DB.products.find(x=>x.sku===state.productSku);
  if(!p||p._id==null||state.prodBusy) return;
  const priceRaw=(document.getElementById('mPrice')||{}).value;
  /* AN UNREADABLE PRICE IS NOT ZERO. This was
     `parseFloat(stripped)||0`, so clearing the box — or leaving anything the
     strip could not parse — saved the product at nothing and put it on sale at
     nothing. A price typed as 0 is still honoured; a price that cannot be read
     stops the save and says so, because the alternative is selling stock for
     free and finding out from the orders. */
  const priceTxt=String(priceRaw==null?'':priceRaw).replace(/[^0-9.]/g,'').trim();
  const price=priceTxt===''?NaN:Number(priceTxt);
  if(!Number.isFinite(price)||price<0){
    /* A toast, not state.prodErr: prodErr paints on the products LIST and this
       runs with the product sheet open over it, where the save's own "Saved"
       toast is what the operator is already watching for. */
    showToast(T('Enter a price — a number, 0 or more.','请输入价格 — 0 或以上的数字。'));
    return;
  }
  const stores=state.prodStores||[];
  state.prodBusy=true; state.prodErr=null; render();
  try{
    if(price!==Number(p.priceNum)) await apiWrite('/products/'+p._id,{sell_price:price},'PATCH');
    // Belt to the read-only card: neither a supplier-direct item nor a bundle
    // has stock of its own, so no stepper is drawn for them — and no write is
    // sent for them either, whatever is left in sheetStep from a previous
    // product's sheet.
    for(const st of (p.supplier||p.bundle?[]:stores)){
      const now=Number(sheetStep['st_'+st.id]);
      if(!isNaN(now)&&now!==st.qty){
        await apiWrite('/stores/'+st.id+'/stock/'+p._id,{physical_qty:now},'PATCH');
        st.qty=now;
      }
    }
    state.prodBusy=false; state.productSku=null; render();
    showToast(T('Saved','已保存'));
    try{ const rows=await api('/products?limit=50'); if(Array.isArray(rows)){ DB.products=rows.map(mapProduct); render(); } }catch(e){}
  }catch(e){
    state.prodBusy=false;
    if(String(e.message)==='auth') return;
    state.prodErr=E('That did not save. Nothing has changed — try again.','没有保存成功。数据没有变化 — 请重试。');
    render();
  }
}
/* Needs you, from the same snapshot the desktop reads. The phone used to show
   three rows it made up locally — orders awaiting shipment, reviews to reply,
   low stock — while the product's actual list of fires (a delivery gone wrong,
   a refund waiting on a decision, a payment that does not match) lived in
   /dashboard/ops and never reached the phone at all. */
function custWrite(kind, run, okMsg){
  if(state.custBusy) return;
  state.custBusy=kind; state.custErr=null; render();
  run().then(()=>{
    state.custBusy=null; render();
    if(okMsg) showToast(okMsg);
    if(state.custId!=null) loadCustomerDetail(state.custId);
    loadCustomers();
  }).catch(e=>{
    state.custBusy=null;
    if(String(e.message)==='auth') return;
    state.custErr=e.code==='bad_email'?T('That email address will not work.','邮箱地址无效。')
      :e.code==='phone_taken'?T('Another customer already has that phone number.','该手机号已被其他顾客使用。')
      :e.code==='message_required'?T('Write something first.','请先输入内容。')
      :e.code==='reason_required'?T('A reason is required.','需要填写原因。')
      :e.code==='bad_delta'?T('That amount will not work. Use a number, and not zero.','金额无效。请填写非零数字。')
      :T('That did not save. Nothing has changed — try again.','没有保存成功。数据没有变化 — 请重试。');
    render();
  });
}

function ageShort(v){
  const d=_date(v); if(!d) return '';
  const mins=Math.max(0,Math.round((Date.now()-d.getTime())/60000));
  if(mins<60) return T(mins+'m',mins+' 分');
  const h=Math.round(mins/60);
  if(h<48) return T(h+'h',h+' 小时');
  return T(Math.round(h/24)+'d',Math.round(h/24)+' 天');
}
function oldestMins(items){
  let oldest=null;
  for(const it of (items||[])){ const d=_date(it&&it.waiting_since); if(!d) continue; if(!oldest||d<oldest) oldest=d; }
  return oldest?Math.max(0,Math.round((Date.now()-oldest.getTime())/60000)):null;
}
function oldestOf(items){
  const m=oldestMins(items);
  if(m==null) return '';
  if(m<60) return T(m+'m',m+' 分');
  const h=Math.round(m/60);
  return h<48?T(h+'h',h+' 小时'):T(Math.round(h/24)+'d',Math.round(h/24)+' 天');
}
/* Severity, then oldest first, and a fire with no clock sorts last — a state
   cannot be ranked by how long it has waited. */
function opsFires(){
  const o=state.ops; if(!o) return null;
  const f=[];
  // Ranked by how long the oldest thing in each queue has waited, so a
  // two-day restock outranks a refund from an hour ago. A fire with no clock
  // (a stock state) sorts last: it cannot be ranked by waiting.
  // `age` records whether the sub-line IS the waiting time, because the row
  // prefixes it with "oldest" and two of these fires pass a sentence instead —
  // so "Payments to confirm" read "oldest 1 couldn't be read", the prefix
  // glued onto a phrase that is not a duration.
  const add=(cond,sev,icon,label,n,items,meta,go)=>{ if(cond) f.push({sev,icon,label,n,meta:meta||oldestOf(items),age:!meta,go,mins:oldestMins(items)}); };
  const c=k=>(o[k]&&o[k].count)||0;
  /* Arguments are evaluated before add() looks at its condition, so reading
     o.<key>.items inline threw on any payload missing a key — and a render
     that throws leaves the PREVIOUS screen on the glass, so Home would simply
     look stale. The server sends every key today; this does not depend on it
     continuing to. */
  const items=k=>(o[k]&&o[k].items)||[];
  add(c('delivery_alerts'),'brick','truck',T('Delivery needs a call','配送需要跟进'),c('delivery_alerts'),items('delivery_alerts'),'',"APP.cmd('ordersGo','dispatched')");
  add(c('payment_mismatch'),'brick','banknote',T("Payment doesn't match",'付款金额不符'),c('payment_mismatch'),items('payment_mismatch'),'',"APP.cmd('ordersGo','pending')");
  // The brick fire's sibling: a proof IS on file, it was not rejected, and the
  // order is still unpaid — verified with auto-flip off, unreadable, or never
  // read at all (no vision key, which makes it every proof that tenant gets).
  // Amber, because nothing here says the money is wrong, only that we have not
  // said it is right. Where there are unreadable ones it names them instead of
  // an age: that is the half of the queue that is a judgement rather than a
  // click. Same door as its sibling — both are sitting in Pending.
  if(c('payment_unconfirmed')){
    const pu=o.payment_unconfirmed, k=Number(pu.unread||0);
    add(true,'amber','banknote',T('Payments to confirm','待确认付款'),pu.count,items('payment_unconfirmed'),
      k>0?T(k+" couldn't be read",k+' 张无法识别'):'',"APP.cmd('ordersGo','pending')");
  }
  add(c('refunds'),'amber','refund',T('Refunds waiting','退款待处理'),c('refunds'),items('refunds'),'',"APP.cmd('ordersGo','refund')");
  add(c('unhandled'),'amber','package',T('Orders to start','待开始备货'),c('unhandled'),items('unhandled'),'',"APP.cmd('ordersGo','paid')");
  add(c('awaiting_restock'),'amber','clock',T('Orders awaiting restock','订单待补货'),c('awaiting_restock'),items('awaiting_restock'),'',"APP.cmd('ordersGo','restock')");
  add(c('invoices'),'amber','receipt',T('Invoices to issue','待开发票'),c('invoices'),items('invoices'),'',"APP.cmd('push','invoices')");
  /* The inbox, from the snapshot rather than from whatever this phone happened
     to have loaded. Home used to build the reviews row out of DB.reviews — the
     list the Inbox screen fetches — so the fire only existed AFTER the operator
     had already gone and looked, which is the one moment they no longer need
     telling. It carried no age either, and feedback had no row at all. Both are
     keys on /dashboard/ops now, counted the same way the pages they open count
     them. Feature-gated: a shop that switched Reviews off is not filling that
     queue, so its backlog is not a fire. */
  if(c('reviews_unanswered')&&featOn('reviews')){
    const rv=o.reviews_unanswered, k=Number(rv.low||0), a=oldestOf(items('reviews_unanswered'));
    // Nine polite five-stars and nine one-stars are the same number and not the
    // same afternoon, so the low-rated count leads and the age follows it.
    const meta=[k>0?T(k+' low-rated',k+' 条低评分'):'', a?T('oldest '+a,'最久 '+a):''].filter(Boolean).join(T(', ','，'));
    f.push({sev:'amber',icon:'star',label:T('Reviews to answer','评价待回复'),n:rv.count,
      meta,age:false,go:"APP.cmd('inboxGo','reviews')",mins:oldestMins(items('reviews_unanswered'))});
  }
  if(c('feedback_waiting')&&featOn('feedback')){
    add(true,'amber','message-square-text',T('Feedback to answer','反馈待回复'),
      c('feedback_waiting'),items('feedback_waiting'),'',"APP.cmd('inboxGo','feedback')");
  }
  const oos=c('out_of_stock'), low=c('low_stock');
  if(oos+low){
    // The pill counts what is actually OUT; the line names the rest. One number
    // summing both would say 23 and mean neither.
    const state_=(oos&&low)?T(oos?'out of stock, '+low+' running low':'', '已售罄，另有 '+low+' 项库存不足')
      :oos?T('out of stock','已售罄'):T('running low','库存不足');
    f.push({sev:'amber',icon:'box',label:T('Restock needed','需要补货'),n:oos||low,meta:state_,go:"APP.cmd('tab','products')",mins:null});
  }
  // Channel stock-sync stall — mirrors the desktop card's new row (see
  // lib/channel-sync-stale.js). The phone has no per-channel screen to open
  // (m.html never rebuilt the desktop's channel-admin tabs), so tapping names
  // the gap instead of faking a destination. No featOn/permission gate: every
  // role that sees Home should see when a channel stops syncing.
  //
  // Mock: the clock the customer's stock might be wrong at, not a duration —
  // "waiting since 2:15 PM", not "oldest 4h" — same age:false pattern the
  // Reviews row above uses for its own custom meta line. `mins` stays real so
  // this still always outranks Restock below (whose mins is deliberately
  // null, and a fire with no age always sorts last) — a stale channel may be
  // SELLING stock we don't have; an empty shelf is only an empty shelf.
  for(const c of (o.channel_sync_stale||[])){
    const t=_date(c.oldest_at);
    /* Carry the date when it isn't today — a bare clock time makes a row stuck
       since another DAY read as newer than one stuck this morning, so the text
       argues with the oldest-first order the list is actually in. */
    const sameDay=!!t&&shopDayOf(t)===shopToday();
    const when=!t?'':tdWhen(t,sameDay?'time':'dateTime',_tdL());
    f.push({sev:'amber',icon:'unplug',label:T(c.label+' not syncing',c.label+' 未同步'),
      n:c.waiting_count,
      meta:when?T('stock updates waiting since '+when,'库存更新自 '+when+' 起等待中'):'',
      age:false,mins:oldestMins([{waiting_since:c.oldest_at}]),
      go:`showToast(T('Review this on desktop','请在电脑端查看'))`});
  }
  const rank={brick:0,amber:1};
  f.sort((a,b)=>{
    const s=(rank[a.sev]??9)-(rank[b.sev]??9); if(s) return s;
    if(a.mins==null&&b.mins==null) return 0;
    if(a.mins==null) return 1;
    if(b.mins==null) return -1;
    return b.mins-a.mins;
  });
  return f;
}
