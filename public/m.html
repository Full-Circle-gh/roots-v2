<style>
/* ===========================================================================
   Tacet Mobile — monitoring-first phone companion.
   1:1 with Mobile Shell.dc.html: single live language (toggle), Lucide icons,
   The Recap in Inter (NEVER Fraunces — Fraunces is marketing-only in Tacet).
   Tokens inlined from the Tacet design system so this file is self-contained.
   =========================================================================== */
:root{
  --paper:#FBF9F4; --ink:#111A2B; --graphite:#58606E; --dusk:#6E67AF; --sage:#A3B49F;
  --amber:#C9954A; --brick:#B4533E;
  --dusk-tint:#EEEDF6; --sage-tint:#EDF1EC; --amber-tint:#F7EEDE; --brick-tint:#F6E7E3;
  --raised:#F6F3EC; --border:#E4E0D5; --dusk-hover:#605AA0; --dusk-press:#524C8C;
  /* The row surface for a record nobody on the team has opened yet. Deliberately
     LIGHTER than a header band: an unseen row is transient content and must never
     read as heavy as the page's own chrome. Pairs with a Sage left edge drawn as an
     inset shadow, never a border — a marker that resizes its row makes the list
     jump as records get opened. */
  --unseen:#F4F5F0;

  --bg:var(--paper); --surface-card:#FFFFFF; --surface-raised:var(--raised); --surface-dark:var(--ink);
  --text-primary:var(--ink); --text-secondary:var(--graphite); --text-caption:var(--graphite);
  --border-default:var(--border); --border-strong:var(--graphite); --border-focus:var(--dusk);
  --accent:var(--dusk); --accent-hover:var(--dusk-hover); --accent-press:var(--dusk-press); --accent-tint:var(--dusk-tint);
  --success:var(--sage); --warning:var(--amber); --danger:var(--brick);
  --radius-card:14px;

  --ease-settle:cubic-bezier(0.16,1,0.3,1);
  --font-ui:'Inter','Noto Sans SC','Source Han Sans SC',-apple-system,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:var(--ink); --surface-card:#182236; --surface-raised:#1E2A40; --surface-dark:#0B121F;
  --text-primary:var(--paper); --text-secondary:#9AA2B0; --text-caption:#9AA2B0;
  --border-default:#263149; --border-strong:#3A455D;
  --unseen:#182329;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E9E5DC;font-family:var(--font-ui);color:var(--text-primary)}
button,input,textarea{font-family:inherit}

#app{position:relative;display:flex;flex-direction:column;overflow:hidden;
  width:100vw;height:100vh;height:100dvh;background:var(--bg);color:var(--text-primary)}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  #app{width:402px;height:min(874px,calc(100vh - 48px));border-radius:44px;
       box-shadow:0 24px 70px rgba(17,26,43,.28),0 0 0 11px #1c1c1e,0 0 0 12px #2c2c2e}
}

@keyframes tBreathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes tSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes tFade{from{opacity:0}to{opacity:1}}
@keyframes tRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.breathe{animation:tBreathe 2.4s ease-in-out infinite}
.rise{animation:tRise .5s var(--ease-settle) both}
.hscroll{scrollbar-width:none;-ms-overflow-style:none;overflow-x:auto}
.hscroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}

.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.tabbar{flex:none;display:flex;background:var(--surface-card);border-top:1px solid var(--border-default);
  padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 12px)}
.iconbtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:8px}
.card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px}
.card.unseen{background:var(--unseen);box-shadow:inset 4px 0 0 var(--sage);
  transition:background .6s var(--ease-settle), box-shadow .6s var(--ease-settle)}
.list{background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px;overflow:hidden}
.sep{height:1px;background:var(--border-default)}
.eyebrow{font-size:13px;font-weight:500;color:var(--text-secondary)}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;padding:12px 16px;background:transparent;
  border:none;cursor:pointer;text-align:left;color:var(--text-primary);font-family:inherit}
.rowico{width:36px;height:36px;border-radius:8px;background:var(--surface-raised);display:flex;align-items:center;
  justify-content:center;color:var(--text-secondary);flex:none}
.num{font-variant-numeric:tabular-nums}
.btn2{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border-default);background:transparent;
  color:var(--text-primary);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn2:disabled{opacity:.55;cursor:default}
.cta{width:100%;min-height:44px;padding:12px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;
  font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s var(--ease-settle)}
.cta:hover{background:var(--accent-hover)}.cta:active{background:var(--accent-press)}
.scrim{position:absolute;inset:0;background:rgba(17,26,43,.38);animation:tFade .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-card);
  border-top-left-radius:14px;border-top-right-radius:14px;
  box-shadow:0 1px 2px rgba(17,26,43,.05), 0 4px 16px rgba(17,26,43,.04);
  animation:tSheetUp .4s var(--ease-settle) both;display:flex;flex-direction:column}
.grabber{width:38px;height:5px;border-radius:999px;background:var(--border-default);margin:6px auto 8px}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:400;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.stepbtn{width:44px;height:44px;border-radius:8px;background:var(--surface-raised);border:1px solid var(--border-default);
  display:flex;align-items:center;justify-content:center;color:var(--text-primary);cursor:pointer;flex:none}
.chip{display:flex;align-items:center;gap:8px;flex:none;height:44px;padding:0 16px;border-radius:999px;font-size:13px;
  cursor:pointer;font-family:inherit;white-space:nowrap;border:1px solid var(--border-default);
  background:var(--surface-card);color:var(--text-secondary)}
.chip.on{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}
.chip .c{font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
.i svg,svg.i{display:block;flex:none}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;z-index:60;background:var(--text-primary);
  color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;white-space:nowrap;
  box-shadow:0 6px 20px rgba(17,26,43,.22);animation:tFade .2s ease both}
input,textarea{padding:12px 14px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-card);
  color:var(--text-primary);font-size:15px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--border-focus)}
</style>

"use strict";
/* ---- Lucide icon → inline SVG string (same builder as the mockup) ---- */
function ic(name, size, stroke){
  size = size||20; stroke = stroke||1.75;
  const L = window.lucide;
  const P = String(name).replace(/(^|-)([a-z])/g,(_,__,c)=>c.toUpperCase());
  const node = L && L.icons && L.icons[P];
  const kids = node && Array.isArray(node[2]) ? node[2] : [];
  const inner = kids.map(([t,a])=>`<${t} ${Object.keys(a).map(k=>`${k}="${a[k]}"`).join(' ')}/>`).join('');
  return `<svg class="i" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
/* The Tacet WaveMark (signature) — matches the design-system mark path exactly. */
const WAVE = (w,color)=>`<svg width="${w}" height="${(w*0.324).toFixed(0)}" viewBox="0 0 340 110" fill="none" aria-label="tacet" style="display:block">
  <path d="M20 55 C30 15, 40 95, 50 55 C59 22, 68 88, 77 55 C85 30, 93 80, 101 55 C109 38, 117 72, 125 55 C133 44, 141 66, 149 55 C160 50, 171 60, 182 55 C215 55, 260 55, 305 55"
   stroke="${color||'var(--text-primary)'}" stroke-width="3.5" stroke-linecap="round"/>${color?'':'<circle cx="305" cy="55" r="6" fill="#6E67AF"/>'}</svg>`;

/* ---- single live language (EN default), toggled from the overflow menu ---- */

  danger:['rgba(180,83,62,0.15)','#B4533E'],
  muted:['rgba(88,96,110,0.06)','var(--text-secondary)'],

const KIND2PILL = {paid:'clear',pending:'clear',preparing:'clear',cancelled:'clear',draft:'clear',
  delivered:'success',dispatched:'success',live:'success',on:'success',
  restock:'warning',gold:'warning',refund:'danger',view:'muted',off:'muted'};
function pill(kind, label){ const [bg,fg]=PILL[KIND2PILL[kind]||'clear']; return `<span class="pill" style="background:${bg};color:${fg}">${label}</span>`; }
function toggle(on, onClick){
  return `<button onclick="${onClick}" aria-label="Toggle" style="width:44px;height:26px;border-radius:999px;
    background:${on?'var(--accent)':'var(--border-strong)'};position:relative;border:none;cursor:pointer;flex:none;transition:background .2s var(--ease-settle)">
    <span style="position:absolute;top:3px;left:${on?'21px':'3px'};width:20px;height:20px;border-radius:50%;background:#fff;
    transition:left .2s var(--ease-settle);box-shadow:0 1px 3px rgba(0,0,0,.25)"></span></button>`;
}

function copyText(t){
  if(!t) return;
  const done=()=>showToast(T('Copied','已复制'));
  const fallback=()=>{ try{
      const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
    }catch(e){ showToast(T('Could not copy','复制失败')); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(fallback);
  else fallback();
}

/* Prose per row, ported from the desktop's tdFeedMeta — same sentences, same

const WORK_MAX_ROWS=40;
/* This feed stamps `ts` as epoch MILLISECONDS, not the "YYYY-MM-DD HH:MM:SS"
   string every other endpoint returns — so the app's own date helpers, which

function workDate(e){
  const t=e&&e.ts; if(t==null) return null;
  const d=(typeof t==='number')?new Date(t):_date(t);

const workMs=e=>{ const d=workDate(e); return d?d.getTime():0; };

  return LANG==='en' ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})

function workMeta(e){

    case 'refund_paid': return {text:T('Refund settled — '+ono,'退款完成 — '+ono), amount:p.amount?yuan(p.amount):''};
    case 'refund_rejected': return {text:T('Refund declined — '+ono,'退款驳回 — '+ono)};
    case 'topup': return {text:buyer?T(buyer+' topped up',buyer+' 已充值'):T('Wallet top-up','钱包充值'), amount:yuan(p.amount)};
    case 'new_customer': { const nm=esc(p.name||''); return {text:nm?T(nm+' joined',nm+' 加入'):T('New customer joined','新顾客加入')}; }
    case 'feedback': return {text:T('Feedback · “'+esc(p.excerpt||'')+'”','反馈 · “'+esc(p.excerpt||'')+'”')};
    case 'gzgrocery_pickup': {

function workFold(){

      </button>`; }).join('')}
    ${evs.length>shown.length?`<div style="padding:12px 0 0;font-size:13px;color:var(--text-secondary)">${T('Showing the latest '+shown.length+' of '+evs.length+' — the rest is on the desktop.', '显示最近 '+shown.length+' 条，共 '+evs.length+' 条 — 其余请在电脑端查看。')}</div>`:''}

/* ---- The Recap ----------------------------------------------------------
   This is the desktop's Recap, not a phone-shaped reinvention of it. It used to
   compute its own "orders overnight / revenue overnight" client-side from the
   fifty orders boot happened to hold, over a 22:00–08:00 window nothing else in
   the product uses — a metric that does not exist on the desktop and a number
   that could not be reconciled with any other number in the app.

   The real Recap reads the ACTIVITY FEED since the moment you last left, and
   states what happened in the same sentences tdRecapRender writes: orders paid
   (with the money), dispatched, delivered, unpaid ones auto-cancelled, refunds
   settled, top-ups, new customers, gzgrocery pickups. When the window is empty
   it is not a card at all — one quiet line, because a card that says nothing
   happened is furniture.

   Framing rules are the desktop's too: a gap under 25 minutes is a reload, not a
   departure, so it reads "Recently" rather than "While you were away"; the
   window is floored at 30 minutes and capped at 7 days. And the money rows are
   owner-only — a warehouse or dispatch account sees its own queue without the
   revenue, exactly as tdRecapNoMoney decides on the desktop. */
const RECAP_SEEN_KEY='tacet.m.lastSeen';
const RECAP_NO_MONEY=['warehouse','dispatch','customer_service'];
function recapNoMoney(){ return RECAP_NO_MONEY.includes(state.pos); }
async function loadRecap(){
  if(state.recapTried) return; state.recapTried=true;
  let since=0;
  try{ since=parseInt(localStorage.getItem(RECAP_SEEN_KEY)||'0',10)||0; }catch(e){}
  const now=Date.now();
  const MAX_BACK=7*86400000, MIN_BACK=30*60000, REAL_ABSENCE=25*60000;
  state.reallyAway=!!since&&(now-since>=REAL_ABSENCE)&&(now-since<=MAX_BACK);
  if(!since||now-since>MAX_BACK) since=now-MAX_BACK;
  if(now-since<MIN_BACK) since=now-MIN_BACK;
  state.recapSince=since;
  try{ localStorage.setItem(RECAP_SEEN_KEY,String(now)); }catch(e){}
  try{ const j=await api('/dashboard/activity?since='+since+'&limit=500');
    state.recap=(j&&j.events)||(Array.isArray(j)?j:[]);
  }catch(e){ state.recap=null; }
  render();
}
/* The same eight sentences the desktop writes, in the same order. Kept as data
   so the empty case can be told from the failed one without re-deriving it. */
function recapRows(){
  const ev=state.recap; if(!ev) return null;
  const of=t=>ev.filter(e=>e.type===t);
  const sum=(rows,k)=>rows.reduce((n,e)=>n+(Number(e.payload&&e.payload[k])||0),0);
  const m=n=>money0(CUR,n);
  const paid=of('paid_order'), disp=of('order_dispatched'), deliv=of('order_delivered');
  const autoCanc=of('order_cancelled').filter(e=>e.payload&&e.payload.reason==='auto_cancelled_unpaid');
  const refunded=of('refund_paid'), newCust=of('new_customer'), topups=of('topup');
  const pickups=of('gzgrocery_pickup').filter(e=>!(e.payload&&e.payload.is_return));
  const noMoney=recapNoMoney();
  const wh=state.pos==='warehouse';
  const delivery=state.pos==='dispatch'||state.pos==='customer_service';
  const rows=[];
  const n1=(a,one,many)=>a.length===1?one:many;
  if(paid.length&&!delivery){
    rows.push(wh
      ? T(paid.length+' '+n1(paid,'order','orders')+' entered your queue', paid.length+' 笔订单进入待处理队列')
      : T(paid.length+' '+n1(paid,'order','orders')+' paid — '+m(sum(paid,'total')), paid.length+' 笔订单已支付，共 '+m(sum(paid,'total'))));
  }
  if(disp.length) rows.push(T(disp.length+' '+n1(disp,'order','orders')+' dispatched', disp.length+' 个订单已发货'));
  if(deliv.length&&!wh) rows.push(T(deliv.length+' '+n1(deliv,'order','orders')+' delivered', deliv.length+' 个订单已送达'));
  if(!noMoney&&autoCanc.length) rows.push(T(autoCanc.length+' unpaid '+n1(autoCanc,'order','orders')+' cancelled automatically', autoCanc.length+' 个未付款订单已自动取消'));
  if(!noMoney&&refunded.length) rows.push(T(refunded.length+' '+n1(refunded,'refund','refunds')+' settled — '+m(sum(refunded,'amount')), refunded.length+' 笔退款已完成，共 '+m(sum(refunded,'amount'))));
  if(!noMoney&&topups.length) rows.push(T(topups.length+' wallet '+n1(topups,'top-up','top-ups')+' — '+m(sum(topups,'amount')), topups.length+' 笔钱包充值，共 '+m(sum(topups,'amount'))));
  if(!noMoney&&newCust.length) rows.push(T(newCust.length+' new '+n1(newCust,'customer','customers')+' joined', '新增 '+newCust.length+' 位客户'));
  if(pickups.length&&!delivery) rows.push(T(pickups.length+' gzgrocery '+n1(pickups,'pickup','pickups')+' recorded', '记录 '+pickups.length+' 笔 gzgrocery 提货'));
  return rows;
}
function recapTitle(){
  if(!state.reallyAway) return T('Recently','最近动态');
  const g=greetKey();
  return (g==='morning'||g==='night')?T('While you slept','在你休息时'):T('While you were away','在你离开时');
}
function recapSinceLabel(){
  const d=_date(state.recapSince?new Date(state.recapSince):null)||new Date(state.recapSince||Date.now());
  const hm=LANG==='en' ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
                       : d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const now=new Date();
  const days=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())
    - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(!state.reallyAway) return T('since '+hm,hm+' 起');
  if(days<=0) return T('you left here — '+hm, '您离开时 — '+hm);
  if(days===1) return T('you left yesterday — '+hm, '您昨天 '+hm+' 离开');
  return T('you left '+(d.getMonth()+1)+'/'+d.getDate()+' — '+hm, '您于'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm+' 离开');
}

    ${body}
    <div style="margin-top:18px;display:flex;align-items:baseline;justify-content:flex-end">${workBtn}</div>
    ${workFold()}</div>`;

/* The chips used to filter the fifty rows that happened to be loaded, which is
   why "Delivered 15" could show three. Every filter is the server's now, and the
   list says how much of the set it is showing. */
const STATUS_PARAM={all:'',paid:'paid',preparing:'preparing',dispatched:'dispatched',
  delivered:'delivered',restock:'awaiting_restock',refund:'refunds_open',pending:'pending_payment'};
const CHANNEL_PARAM={all:'',miniapp:'wechat',web:'web',meituan:'meituan',gzgrocery:'gzgrocery',manual:'manual'};
const ORDERS_PAGE=25;
function ordersQuery(offset){
  const qs=new URLSearchParams();
  const st=STATUS_PARAM[state.statusF]||''; if(st) qs.set('status',st);
  const ch=CHANNEL_PARAM[state.channelF]||''; if(ch) qs.set('channel',ch);
  if(state.orderQ) qs.set('q',state.orderQ);
  if(state.storeF&&state.storeF!=='all') qs.set('store_id',state.storeF);
  qs.set('limit',ORDERS_PAGE); qs.set('offset',offset||0);
  return qs.toString();
}
async function loadOrdersPage(more){
  const offset=more?((state.ordersView||[]).length):0;
  state.ordersLoading=true; if(!more){ state.ordersView=null; } render();
  try{
    const j=await apiRaw('/orders?'+ordersQuery(offset));
    const rows=(j&&j.data)||[];
    const mapped=rows.map(mapOrderRow);
    state.ordersView=more?(state.ordersView||[]).concat(mapped):mapped;
    state.liveOrders=state.ordersView;
    const total=j&&j.meta&&j.meta.total;
    state.ordersTotal=(total!=null)?total:null;
    state.ordersMore=(total!=null)?state.ordersView.length<total:rows.length===ORDERS_PAGE;
  }catch(e){
    if(String(e.message)==='auth') return;
    // Offline / static preview: the sample set stands in, unfiltered and honest
    // about it — no counts, no "load more".
    if(!more){ state.ordersView=DB.orders.slice(); state.ordersTotal=null; state.ordersMore=false; }
  }
  state.ordersLoading=false; render();
}
/* Store, item count and the routing note — the desktop's Store and Items
   columns, folded into one muted line because a phone card cannot spend a row
   on each. The store half is suppressed on a single-store shop, where naming it
   on every row says nothing. */
function orderMetaLine(o){
  const bits=[];
  const many=(state.stores||[]).length>1;
  if(o.store&&many) bits.push(T(...o.store));
  // "products", not "items" — the list only knows how many LINES an order has
  // (the endpoint counts rows, not units), and the drawer now says products and
  // units apart. One word for one number, across both surfaces.
  if(o.items_n!=null) bits.push(T(o.items_n+(o.items_n===1?' product':' products'), o.items_n+' 款'));
  if(o.routeNote) bits.push(o.routeNote);
  if(!bits.length) return '';
  return `<div style="font-size:12.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${bits.join(' · ')}</div>`;
}
function ordersFiltered(){ return state.ordersView||DB.orders; }
function ordersHeader(){

  const S=state.liveStatusCounts, C=state.liveChannelCounts;

  const allOrders = C?C.all:(S?undefined:47);

    {key:'restock',en:'Awaiting restock',zh:'待补货',count:sCount('awaiting_restock',2)},{key:'refund',en:'Refund queue',zh:'退款',count:sCount('refunds_open',2)}];
  const cc=[{key:'all',en:'All channels',zh:'全部渠道',count:allOrders},{key:'miniapp',en:'Mini app',zh:'小程序',count:cCount('wechat',28)},{key:'web',en:'Web',zh:'网页',count:cCount('web',9)},

  const stores=state.stores||[];

    ${stores.length>1?`<div style="height:8px"></div>${chipRow(st,state.storeF,'storeF')}`:''}</div>`;
}

/* One source for setup progress, and it is the server's. The card used to
   compute a percentage from a hardcoded list of steps, so every store on earth
   read "50% set up · 3 steps left" whatever it had actually done. */
function setupState(){
  const d=state.setup;
  if(d) return {pct:d.percent, done:d.requiredDone, total:d.requiredTotal, left:Math.max(0,d.requiredTotal-d.requiredDone), real:true};
  return {pct:null, real:false};
}

          : `<span style="font-size:13px;color:var(--text-secondary)">${T('Loading…','加载中…')}</span>`)

          ? `<span style="font-size:13px;color:var(--text-secondary)">${T('Saving…','保存中…')}</span>`

}

/* A scheduled broadcast can still be stopped; a sent one cannot. The server is
   the judge — it refuses anything already on its way out. */

const ORDER_NEXT={
  paid:            {to:'preparing',  en:'Start preparing',  zh:'开始备货',  busyEn:'Starting…',  busyZh:'处理中…'},
  awaiting_restock:{to:'preparing',  en:'Restocked · start preparing', zh:'已补货 · 开始备货', busyEn:'Starting…', busyZh:'处理中…'},
  preparing:       {to:'dispatched', en:'Mark dispatched',  zh:'标记已发货', busyEn:'Marking…',  busyZh:'处理中…'},
  dispatched:      {to:'delivered',  en:'Mark delivered',   zh:'标记送达',  busyEn:'Marking…',  busyZh:'处理中…'},
};
/* A pickup order walks the same machine with a different journey: dispatched is
   "ready at the counter" and delivered is "the customer came and took it". The
   desktop relabels both; so does this, or the phone tells a counter to dispatch
   something nobody is shipping. */
const ORDER_NEXT_PICKUP={dispatched:{en:'Mark ready for pickup',zh:'标记可取货'},delivered:{en:'Mark picked up',zh:'标记已取货'}};
/* pending_payment is deliberately absent: marking an off-app payment records
   WHICH tender it was, and guessing that from a phone would put "unknown" on
   the books. It stays a desktop action until the phone can ask. */
function orderNext(o){
  // A marketplace mirror is read at 100% legibility and acted on at 0%: the
  // platform drives it, and a button here would write into a queue we do not own.
  if(!o||o.viewOnly||!o.raw) return null;
  const n=ORDER_NEXT[o.raw]; if(!n) return null;
  const alt=o.pickup&&ORDER_NEXT_PICKUP[n.to];
  return alt?Object.assign({},n,alt):n;
}

/* A write helper that keeps the server's own words. api() throws away the body,
   and the body is where the reason lives. */
async function apiWrite(path, body, method){
  const r=await fetch(API+path,{method:method||'POST',credentials:'same-origin',
    headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify(body||{})});
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const e=new Error((j&&(j.message||j.error))||('HTTP '+r.status)); e.code=j&&j.error; throw e; }
  return j;
}
function orderErrorText(e){
  if(e.code==='__plain') return e.message;
  if(e.code==='invalid_transition') return T('This order has already moved on. Close and open it again to see where it is now.',
                                             '这个订单已经进入下一步。请关闭后重新打开查看当前状态。');
  if(e.code==='refund_already_processing'||e.code==='use_refund_payout') return e.message;
  if(e.code==='already_shipped') return T('A parcel already has a waybill, so this cannot be undone here. Cancel the waybill first.',
                                          '已有包裹生成运单，无法在此撤销。请先取消运单。');
  return T('That did not go through. Nothing has changed — try again.','没有成功。数据没有变化 — 请重试。');
}
/* Every write disables the control it belongs to and says what it is doing, and
   a failure renders where the operator is looking and stays until they act on
   it. A toast confirms; it never reports a failure. */
async function orderWrite(kind, run){
  if(state.orderBusy) return;
  state.orderBusy=kind; state.orderErr=null; render();
  try{
    const msg=await run();
    state.orderBusy=null; render();
    if(msg) showToast(msg);
    refreshOrders();
  }catch(e){
    state.orderBusy=null;
    if(String(e.message)==='auth') return;
    state.orderErr=orderErrorText(e); render();
  }
}
/* printer.* is private config, so it has its own read and write. The phone shows
   the switch only once it knows the real value — a switch that guesses its own
   position is worse than no switch. */
/* One product, every store, one call — /products/:id/store-stocks answers with
   exactly the rows this sheet edits. (The first version read each store's whole
   catalogue and picked one row out of it.) */
async function loadProductStock(pid){
  if(pid==null){ state.prodStockReady=true; render(); return; }
  state.prodStockReady=false; state.prodStores=null; render();
  try{
    const rows=await api('/products/'+pid+'/store-stocks');
    state.prodStores=(Array.isArray(rows)?rows:[]).map(r=>({
      id:r.store_id, name_en:r.name_en||r.code||('#'+r.store_id), name_cn:r.name_cn||r.name_en||r.code||('#'+r.store_id),
      qty:Number(r.physical_qty||0)}));
    state.prodStores.forEach(st=>{ sheetStep['st_'+st.id]=st.qty; });
  }catch(e){ state.prodStores=null; }
  state.prodStockReady=true; render();
}
async function saveProductEdits(){
  const p=DB.products.find(x=>x.sku===state.productSku);
  if(!p||p._id==null||state.prodBusy) return;
  const priceRaw=(document.getElementById('mPrice')||{}).value;
  const price=Math.max(0,parseFloat(String(priceRaw).replace(/[^0-9.]/g,''))||0);
  const stores=state.prodStores||[];
  state.prodBusy=true; state.prodErr=null; render();
  try{
    if(price!==Number(p.priceNum)) await apiWrite('/products/'+p._id,{sell_price:price},'PATCH');
    for(const st of stores){
      const now=Number(sheetStep['st_'+st.id]);
      if(!isNaN(now)&&now!==st.qty){
        await apiWrite('/stores/'+st.id+'/stock/'+p._id,{physical_qty:now},'PATCH');
        st.qty=now;
      }
    }
    state.prodBusy=false; state.productSku=null; render();
    showToast(T('Saved','已保存'));
    try{ const rows=await api('/products?limit=50'); if(Array.isArray(rows)&&rows.length){ DB.products=rows.map(mapProduct); render(); } }catch(e){}
  }catch(e){
    state.prodBusy=false;
    if(String(e.message)==='auth') return;
    state.prodErr=T('That did not save. Nothing has changed — try again.','没有保存成功。数据没有变化 — 请重试。');
    render();
  }
}
/* Needs you, from the same snapshot the desktop reads. The phone used to show
   three rows it made up locally — orders awaiting shipment, reviews to reply,
   low stock — while the product's actual list of fires (a delivery gone wrong,
   a refund waiting on a decision, a payment that does not match) lived in
   /dashboard/ops and never reached the phone at all. */
function custWrite(kind, run, okMsg){
  if(state.custBusy) return;
  state.custBusy=kind; state.custErr=null; render();
  run().then(()=>{
    state.custBusy=null; render();
    if(okMsg) showToast(okMsg);
    if(state.custId!=null) loadCustomerDetail(state.custId);
    loadCustomers();
  }).catch(e=>{
    state.custBusy=null;
    if(String(e.message)==='auth') return;
    state.custErr=e.code==='bad_email'?T('That email address will not work.','邮箱地址无效。')
      :e.code==='phone_taken'?T('Another customer already has that phone number.','该手机号已被其他顾客使用。')
      :e.code==='message_required'?T('Write something first.','请先输入内容。')
      :e.code==='reason_required'?T('A reason is required.','需要填写原因。')
      :e.code==='bad_delta'?T('That amount will not work. Use a number, and not zero.','金额无效。请填写非零数字。')
      :T('That did not save. Nothing has changed — try again.','没有保存成功。数据没有变化 — 请重试。');
    render();
  });
}

/* The desktop's Edit profile, minus the phone number. That field is the key

   rather than leaving the operator wondering where it went. */

function ageShort(v){
  const d=_date(v); if(!d) return '';
  const mins=Math.max(0,Math.round((Date.now()-d.getTime())/60000));
  if(mins<60) return T(mins+'m',mins+' 分');
  const h=Math.round(mins/60);
  if(h<48) return T(h+'h',h+' 小时');
  return T(Math.round(h/24)+'d',Math.round(h/24)+' 天');
}
function oldestMins(items){
  let oldest=null;
  for(const it of (items||[])){ const d=_date(it&&it.waiting_since); if(!d) continue; if(!oldest||d<oldest) oldest=d; }
  return oldest?Math.max(0,Math.round((Date.now()-oldest.getTime())/60000)):null;
}
function oldestOf(items){
  const m=oldestMins(items);
  if(m==null) return '';
  if(m<60) return T(m+'m',m+' 分');
  const h=Math.round(m/60);
  return h<48?T(h+'h',h+' 小时'):T(Math.round(h/24)+'d',Math.round(h/24)+' 天');
}
/* Severity, then oldest first, and a fire with no clock sorts last — a state
   cannot be ranked by how long it has waited. */
function opsFires(){
  const o=state.ops; if(!o) return null;
  const f=[];
  // Ranked by how long the oldest thing in each queue has waited, so a
  // two-day restock outranks a refund from an hour ago. A fire with no clock
  // (a stock state) sorts last: it cannot be ranked by waiting.
  const add=(cond,sev,icon,label,n,items,meta,go)=>{ if(cond) f.push({sev,icon,label,n,meta:meta||oldestOf(items),go,mins:oldestMins(items)}); };
  const c=k=>(o[k]&&o[k].count)||0;
  add(c('delivery_alerts'),'brick','truck',T('Delivery needs a call','配送需要跟进'),c('delivery_alerts'),o.delivery_alerts.items,'',"APP.cmd('ordersGo','dispatched')");
  add(c('payment_mismatch'),'brick','banknote',T("Payment doesn't match",'付款金额不符'),c('payment_mismatch'),o.payment_mismatch.items,'',"APP.cmd('ordersGo','pending')");
  // The brick fire's sibling: a proof IS on file, it was not rejected, and the
  // order is still unpaid — verified with auto-flip off, unreadable, or never
  // read at all (no vision key, which makes it every proof that tenant gets).
  // Amber, because nothing here says the money is wrong, only that we have not
  // said it is right. Where there are unreadable ones it names them instead of
  // an age: that is the half of the queue that is a judgement rather than a
  // click. Same door as its sibling — both are sitting in Pending.
  if(c('payment_unconfirmed')){
    const pu=o.payment_unconfirmed, k=Number(pu.unread||0);
    add(true,'amber','banknote',T('Payments to confirm','待确认付款'),pu.count,pu.items,
      k>0?T(k+" couldn't be read",k+' 张无法识别'):'',"APP.cmd('ordersGo','pending')");
  }
  add(c('refunds'),'amber','refund',T('Refunds waiting','退款待处理'),c('refunds'),o.refunds.items,'',"APP.cmd('ordersGo','refund')");
  add(c('unhandled'),'amber','package',T('Orders to start','待开始备货'),c('unhandled'),o.unhandled.items,'',"APP.cmd('ordersGo','paid')");
  add(c('awaiting_restock'),'amber','clock',T('Orders awaiting restock','订单待补货'),c('awaiting_restock'),o.awaiting_restock.items,'',"APP.cmd('ordersGo','restock')");
  add(c('invoices'),'amber','receipt',T('Invoices to issue','待开发票'),c('invoices'),o.invoices.items,'',"APP.cmd('push','invoices')");
  const oos=c('out_of_stock'), low=c('low_stock');
  if(oos+low){
    // The pill counts what is actually OUT; the line names the rest. One number
    // summing both would say 23 and mean neither.
    const state_=(oos&&low)?T(oos?'out of stock, '+low+' running low':'', '已售罄，另有 '+low+' 项库存不足')
      :oos?T('out of stock','已售罄'):T('running low','库存不足');
    f.push({sev:'amber',icon:'box',label:T('Restock needed','需要补货'),n:oos||low,meta:state_,go:"APP.cmd('tab','products')",mins:null});
  }
  const rank={brick:0,amber:1};
  f.sort((a,b)=>{
    const s=(rank[a.sev]??9)-(rank[b.sev]??9); if(s) return s;
    if(a.mins==null&&b.mins==null) return 0;
    if(a.mins==null) return 1;
    if(b.mins==null) return -1;
    return b.mins-a.mins;
  });
  return f;
}

   capture hands the operator their own picker — camera or roll, their choice —

const MEDIA_ERR={
  too_large:['That photo is too large. Try a smaller one.','图片太大，请换一张较小的。'],
  not_an_image:['That file is not an image the shop can use.','该文件不是可用的图片格式。'],
  no_file:['Nothing was picked.','没有选择文件。'],
};
async function uploadMedia(files){
  files=(files||[]).filter(f=>/^image\//.test(f.type||''));
  if(!files.length) return;
  state.mediaBusy={done:0,total:files.length}; state.mediaErr=null; render();
  let ok=0, fail=0, why=null;
  for(const f of files){
    const fd=new FormData(); fd.append('file',f);
    try{
      const r=await fetch(API+'/media/upload',{method:'POST',credentials:'same-origin',body:fd});
      if(r.status===401||r.status===403){ location.href='/backend/login'; return; }
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j&&j.success) ok++; else { fail++; why=why||(j&&j.error); }
    }catch(e){ fail++; }
    state.mediaBusy={done:ok+fail,total:files.length}; render();
  }
  state.mediaBusy=null;
  // A refusal names the reason the server gave when it gave one, and says how
  // many DID land — "3 of 4" is the difference between a retry and a re-do.
  if(fail){
    const reason=MEDIA_ERR[why];
    const head=ok?T(ok+' of '+(ok+fail)+' uploaded.', '已上传 '+ok+'/'+(ok+fail)+' 张。')
                 :T('That did not upload.','上传失败。');
    state.mediaErr=head+' '+(reason?T(...reason):T('Try again.','请重试。'));
  }
  if(ok){ state.mediaTried=false; state.media=null; loadMedia(); showToast(ok===1?T('Photo added','已添加图片'):T(ok+' photos added',ok+' 张图片已添加')); }
  else render();
}

function hoistedTracking(o){
  const all=o.shipments||[];
  const multi=all.length>1;
  const cards=all.map((sp,i)=>{
    if(sp.mode==='supplier') return '';

/* ==========================================================================
   Customers — a Worklist that is not a queue. Records arrive, so a record
   nobody has opened wears the unseen surface; but nothing here is WAITING on
   an operator, so the header is the title alone. The strip under it carries
   the segments an operator actually reaches for, with real counts from the
   server; tier chips carry no counts because no endpoint gives them one.
   ========================================================================== */
const TIER_LABEL={tree:['Tree','大树'],root:['Root','根系'],sprout:['Sprout','嫩芽'],seed:['Seed','种子']};
function mapCustomer(r){
  return {
    id:r.id, name:r.nickname||'', phone:r.phone||'',
    tier:String(r.tier_key||'seed'),
    orders:Number(r.orders_count||0),
    spend:Number(r.lifetime_spend||0),
    // Points and wallet are the shop's own liabilities, and the desktop gives
    // each a column. The phone showed neither on the row — you had to open the
    // record to find out you were holding someone's money.
    points:Number(r.points_balance||0),
    wallet:Number(r.balance||0),

/* The pulse renders as one line, not tiles: four tiles cannot share a phone's

/* The desktop gives the signup channel a column of its own. Nearly every row in

   a phone the column would be a word repeated 1,300 times. Name the exception

const CUST_CHAN={web:['web','网页'],manual:['added by staff','员工添加']};
function custChanNote(c){

}
/* The row used to print a bare time under the spend — "3:14 PM" — with nothing
   saying whether that was a visit or a signup. It is whichever one the list is

   last-seen at all; that is a fact, not a blank. */
function custWhen(c){
  const bySignup=(state.custSort||'last_seen')==='recent_signup';
  const when = bySignup ? c.joined : (c.everSeen?c.seen:null);

  if(!when) return `<span class="num" style="display:block;font-size:13px;color:var(--text-secondary)">${T('never signed in','未登录过')}</span>`;
  return `<span class="num" style="display:block;font-size:13px;color:var(--text-secondary)">${word} ${fmtDay(when)}</span>`;
}
/* Points and a wallet balance are money the shop is holding. Rendered only when
   there is some — a column of zeroes is what the desktop greys out, and a phone
   has no room to grey anything out. */
function custHolds(c){
  const bits=[];
  if(c.points) bits.push(Number(c.points).toLocaleString()+T(' pts',' 分'));
  if(c.wallet) bits.push(money(CUR,c.wallet));
  if(!bits.length) return '';
  return `<span class="num" style="display:block;font-size:12px;color:var(--text-secondary);margin-top:2px">${bits.join(' · ')}</span>`;
}

/* The customer record. Read-only for now — every figure on it is one the
   server already computes, and none of the write flows (points, wallet, block)

/* ---- the customer record's remaining sections -------------------------

function custSection(title,body,right){

      ${right||''}</div>${body}</div>`;
}
const custRow=(l,r,sub)=>`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 16px">
  <span style="min-width:0"><span style="display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span>

  <span class="num" style="flex:none;font-size:14.5px;text-align:right">${r}</span></div>`;
const custList=rows=>rows.length?`<div class="list">${rows.map((r,i)=>(i?'<div class="sep"></div>':'')+r).join('')}</div>`:'';

const PT_SOURCE={order:['from an order','订单获得'],admin_adjust:['adjusted by staff','员工调整'],
  topup:['top-up bonus','充值赠送'],signup:['joining','注册赠送'],referral:['a referral','推荐奖励'],

   the chips under it were wired to 'noop' and filtered nothing, and every count
   beside them was either the mock's or a fraction of the shelf. The desktop
   holds the whole catalogue and narrows it in the browser; so does this — read
   the first time Products is opened, not at boot, because a phone should not
   pay for a screen nobody has looked at. */
function loadCatalogue(){
  if(state.catalogueTried) return;
  state.catalogueTried=true; state.catalogueLoading=true;
  api('/products?limit=500').then(rows=>{
    state.catalogueLoading=false;
    if(Array.isArray(rows)&&rows.length){ DB.products=rows.map(mapProduct); state.liveProductsLoaded=true; }
    render();

/* Chip keys are the INDEX, never the category name: chipRow writes the key into
   an onclick, and a shelf called "Chef's picks" would end the JS string there. */
function prodCategories(){
  const seen=[];
  (DB.products||[]).forEach(p=>{ const c=String(p.cat||'').trim(); if(c&&seen.indexOf(c)<0) seen.push(c); });
  seen.sort((a,b)=>a.localeCompare(b));
  return [{key:'all',en:'All categories',zh:'全部分类'}].concat(seen.map((c,i)=>({key:String(i),en:c,zh:c})));
}
function prodCatName(){
  const k=state.prodCat;
  if(!k||k==='all') return null;
  const c=prodCategories().find(x=>x.key===k);
  return c?c.en:null;
}
const PROD_STATUS_KIND={live:'on',draft:'draft',low:'restock',out:'off'};
function prodFiltered(){
  const q=String(state.prodQ||'').trim().toLowerCase();
  const cat=prodCatName();
  const want=PROD_STATUS_KIND[state.prodStatus||'all'];
  return (DB.products||[]).filter(p=>{
    if(q){
      // Live rows carry a prebuilt haystack; the sample rows do not, so fall
      // back to both names and the SKU — the desktop's own three fields.
      const hay=p.hay!=null?p.hay:((p.name||[]).join(' ')+' '+(p.sku||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    if(cat&&String(p.cat||'')!==cat) return false;
    if(want&&p.kind!==want) return false;
    return true;
  });
}

   a wordmark and then a SECOND header underneath it repeating the page's name;
   this is that bar, with the page's name in it instead. It is a bar and not a

   and it is the one place in the app that does it: 24px next to a 38px control
   makes the control look small, and 18px makes the page's own name quieter than
   a card heading. Recorded so the next person knows it was chosen, not missed.

function tabbar(){

function wireDrag(){
  const h=document.getElementById('dragHandle'); if(!h) return;
  let y0=0;
  const down=e=>{ state.dragging=true; y0=(e.touches?e.touches[0].clientY:e.clientY); };
  const move=e=>{ if(!state.dragging) return; const dy=Math.max(0,(e.touches?e.touches[0].clientY:e.clientY)-y0); const s=document.getElementById('detailSheet'); if(s) s.style.transform=`translateY(${dy}px)`; state.drag=dy; };
  const up=()=>{ if(!state.dragging) return; state.dragging=false; if(state.drag>110){ state.drag=0; state.detailId=null; render(); } else { state.drag=0; const s=document.getElementById('detailSheet'); if(s){ s.style.transition='transform .3s var(--ease-settle)'; s.style.transform='translateY(0)'; } } };
  h.addEventListener('pointerdown',down); window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  h.addEventListener('touchstart',down,{passive:true}); window.addEventListener('touchmove',move,{passive:true}); window.addEventListener('touchend',up);
}

/* ==========================================================================
   Live data — binds the core monitoring screens to the store backend's
   /api/retail-admin/* endpoints (same API the desktop admin uses). The page
   self-auths: a 401/403 bounces to the store root. Every map is defensive and
   falls back to the mock content above, so a shape change can never white-screen
   the app — the long-tail marketing/loyalty screens stay on sample data for now.
   ========================================================================== */
const API='/api/retail-admin';
async function api(path){
  const r=await fetch(API+path,{credentials:'same-origin',headers:{accept:'application/json'}});
  // Match the desktop backend's auth-fail target. Redirecting to '/' would loop
  // once the store root serves this app to phones (root → 401 → root → …).
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  return (j && j.data!==undefined) ? j.data : j;
}
/* The surface's language picks the date convention and then follows it
   completely: English renders US times (2:22 PM), Chinese renders 24-hour
   (14:22). There is no house style and no third format. The year appears only
   when the date is not in the current year. */
const _date=v=>{ if(!v) return null; const d=new Date(String(v).replace(' ','T')); return isNaN(d)?null:d; };
function fmtTime(v){ const d=_date(v); if(!d) return '';
  return LANG==='en' ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
                     : d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}); }
function fmtDay(v){ const d=_date(v); if(!d) return '';
  const now=new Date(), same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,now)) return fmtTime(v);
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(same(d,y)) return T('Yesterday','昨天');
  const thisYear=d.getFullYear()===now.getFullYear();
  return LANG==='en'
    ? d.toLocaleDateString('en-US', thisYear?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'})
    : (thisYear ? (d.getMonth()+1)+'月'+d.getDate()+'日'
                : d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'); }
async function apiRaw(path){
  const r=await fetch(API+path,{credentials:'same-origin',headers:{accept:'application/json'}});
  if(r.status===401||r.status===403){ location.href='/backend/login'; throw new Error('auth'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
/* The roster is ordered by LAST ACTIVITY, which is the desktop's default too —
   and which buries the customer who signed up ten minutes ago and has not come
   back, because "never logged in" sorts to the tail whatever the direction. So
   "show me the newest" had no answer on either surface. The endpoint has
   supported these seven orderings all along; nothing was driving them. */
const CUST_SORTS=[
  {key:'last_seen',en:'Last seen',zh:'最近活动'},
  {key:'recent_signup',en:'Newest first',zh:'最新加入'},
  {key:'spend',en:'Most spent',zh:'消费最多'},
  {key:'orders',en:'Most orders',zh:'下单最多'},
  {key:'points',en:'Most points',zh:'积分最多'},
  {key:'wallet',en:'Biggest wallet',zh:'钱包最多'},
  {key:'name',en:'Name',zh:'按姓名'},
];
const custSortLabel=()=>{ const c=CUST_SORTS.find(x=>x.key===(state.custSort||'last_seen'))||CUST_SORTS[0]; return T(c.en,c.zh); };
/* The tier chips used to filter the fifty rows the phone happened to hold, so
   on a roster of 1,200 "Tree" showed whichever Tree customers were in the first
   page and the rest were invisible. Every filter is the server's now — tier,
   channel, segment and the search — with a real total and a Load more, the same
   correction the Orders list already had. */
const CUST_PAGE=50;
function custQuery(offset){
  const qs=new URLSearchParams();
  qs.set('pageSize',String(CUST_PAGE));
  qs.set('page',String(Math.floor(offset/CUST_PAGE)+1));
  qs.set('withSegments','1');
  const seg=state.custSeg||'all'; if(seg!=='all') qs.set('segment',seg);
  const t=state.custTier||'all'; if(t!=='all') qs.set('tier',t);
  const ch=state.custChan||'all'; if(ch!=='all') qs.set('channel',ch);
  if(state.custQ) qs.set('q',state.custQ);
  qs.set('sort',state.custSort||'last_seen');
  return qs.toString();
}
async function loadCustomers(more){
  const offset=more?((state.customers||[]).length):0;
  state.custLoading=true; if(!more){ state.customers=null; state.custLoaded=false; }
  render();
  try{
    const j=await apiRaw('/customers?'+custQuery(offset));
    const rows=(j&&j.data)||[];
    const mapped=rows.map(mapCustomer);
    state.customers=more?((state.customers||[]).concat(mapped)):mapped;
    const total=(j&&j.total!=null)?j.total:null;
    state.custTotal=total;
    state.custMore=(total!=null)?state.customers.length<total:rows.length===CUST_PAGE;
    if(j&&j.segments) state.custMeta=Object.assign({},state.custMeta||{},j.segments);
    state.custLoaded=true;
  }catch(e){
    if(String(e.message)==='auth') return;

    // honest about it — no total, no "load more".
    if(!more){ state.customers=DB.customers.slice(); state.custTotal=null; state.custMore=false; state.custLoaded=true; }

/* The pulse's three figures come from the stat call the desktop roster makes.

async function loadCustomerMeta(){
