<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no on top of maximum-scale=1: an installed app is not a page.
     Pinch-zoom on a fixed 402px shell only ever moves the whole app off-screen
     with no way to see the edge you have lost, and double-tap-to-zoom costs
     every button a 300ms wait for the second tap that isn't coming. -->
<!-- No maximum-scale / user-scalable=no. Switching zoom off is the standard
     way to make an app unusable for anyone who needs to enlarge text, and it
     bought nothing here: the layout is already sized for a phone and the
     double-tap-zoom it was guarding against is not a hazard on any screen in
     this app. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="mThemeColor" content="#FBF9F4">
<meta name="color-scheme" content="light dark">
<!-- Order numbers and SKUs are not phone numbers. iOS Safari turns anything
     that looks like one into a blue call link, which puts a dialler behind
     half the digits in the app. -->
<meta name="format-detection" content="telephone=no">
<title>Tacet · store</title>

<!-- ── Installed-app wiring ────────────────────────────────────────────────
     This page is the store backend on a phone, and it is meant to be INSTALLED
     — home-screen icon, own task in the app switcher, no URL bar, no browser
     tabs. That takes three things and they only work together: a manifest
     served from the host root (/m-manifest.webmanifest), a service worker with
     the same scope (registered at the bottom of this file), and HTTPS. Miss any
     one and Chrome quietly declines to offer Install and the operator keeps
     looking at the address bar. Same shape as /kitchen and /stock.

     The apple-* tags are the iOS half of the same job: Safari has no manifest
     support worth relying on, so name, icon and status-bar treatment come from
     these. black-translucent draws the app UNDER the status bar, which is why
     every top band in this file pads by env(safe-area-inset-top). -->
<link rel="manifest" href="/m-manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/tacet-favicon.svg">
<link rel="apple-touch-icon" href="/tacet-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Tacet">
<meta name="apple-mobile-web-app-title" content="Tacet">
<script data-boot="viewport">
  /* How tall the app is, measured rather than declared — and re-measured every
     time that answer can change.

     The app is one box that fills the screen, with the tab bar as its last row.
     Sizing that box in CSS looks obvious and is not: 100vh on a phone is the
     height with the browser's toolbar HIDDEN, so the bar it ends with sits a
     toolbar's worth below the glass. 100dvh is meant to be the honest number
     and mostly is — but not at launch. The value a phone reports for the frame
     or two after the app opens is whatever the viewport was before it settled,
     the tab bar is laid out against that, and nothing tells the page to think
     again: the bar is simply missing until something resizes the window. Which
     is exactly what dragging the app small and back does, and why doing that
     brought it back.

     window.innerHeight is the number that means what we want — the part of the
     screen there is actually room to draw in — so it becomes --app-h and the
     app is that tall. Re-measured on everything that can move it: the toolbar
     collapsing as a list scrolls (visualViewport, which fires when a plain
     resize does not), rotation, coming back from the app switcher, and a few
     frames after launch for the settling this exists to catch.

     Keeping the app exactly the size of the visible area is also what keeps
     html and body from having anything to scroll — see "The app, not the page"
     in the stylesheet. The two halves are one fix. */
  (function () {
    var d = document.documentElement, last = 0;
    function fit() {
      var h = window.innerHeight;
      // A zero is a browser mid-launch with nothing to say yet; writing it
      // would collapse the app to nothing and the next tick would have to
      // undo it. Keeping the last good answer is always better than that.
      if (!h || h === last) return;
      last = h;
      d.style.setProperty('--app-h', h + 'px');
    }
    fit();
    ['resize', 'orientationchange', 'pageshow', 'load'].forEach(function (e) {
      window.addEventListener(e, fit);
    });
    // iOS collapses its toolbar without firing a window resize; the visual
    // viewport is the only thing that notices.
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
    if (window.requestAnimationFrame) requestAnimationFrame(fit);
    [60, 250, 800].forEach(function (ms) { setTimeout(fit, ms); });
  })();
</script>

<!-- The attribute on the tag below is load-bearing, not decoration:
     scripts/test_mobile_screens.js and friends find the app's own code by
     matching the first script tag with no attributes on it, and a second bare
     one up here would hand them forty lines of theme boot to analyse instead
     of the app. Anything at all on the tag keeps that anchor unique. -->
<script data-boot="theme">
  /* Theme, before the first paint. Two reasons this is not left to the app's
     own state: an app that opens white and then turns dark has flashed, which a
     browser tab gets forgiven for and an installed app does not; and the theme
     has to survive being closed — state.theme was a fresh 'light' on every
     launch, so a shop owner on dark chose dark again every single time.

     'roots_theme' is the same key public/stock.html writes, deliberately: the
     two phone surfaces share a device and a person, and disagreeing about
     whether it is night on the same handset is worse than either choice. */
  (function () {
    try {
      var saved = localStorage.getItem('roots_theme');
      var theme = (saved === 'light' || saved === 'dark') ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var m = document.getElementById('mThemeColor');
      if (m) m.setAttribute('content', theme === 'light' ? '#FBF9F4' : '#111A2B');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    /* Standalone means launched from the home screen: no address bar, no browser
       back button, and the OS status bar sitting on top of the page. The app
       needs to KNOW that — a few rules below hang off [data-standalone], and the
       install prompt must never offer to install an app that is already open. */
    try {
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        || (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches)
        || window.navigator.standalone === true;
      if (standalone) document.documentElement.setAttribute('data-standalone', '1');
    } catch (e) {}
  })();
</script>
<!-- ── Web fonts, loaded so a blocked host costs nothing (audit D-09) ───────
     This service's only live merchant trades in mainland China, where this font
     host is unreachable. As blocking <link rel="stylesheet"> tags these cost
     every page load a connection timeout before first paint, on the one network
     that matters most.
     media="print" + onload makes the request non-blocking: the page paints
     immediately in the fallback stack (which every --f-* variable already
     names), and the web faces swap in if and when they arrive. `display=swap`
     was already set, so text was never going to be invisible — only late.
     The <noscript> copy keeps the fonts for a scripting-disabled browser, where
     the onload trick cannot run.
     The preconnect hints are gone with them: a warmed connection to a host that
     does not answer is a wasted one.
     THE REAL FIX is to serve these faces from the application, as the brand
     display fonts in /assets/fonts already are. That needs the files, which is
     a deliberate step and not this change. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap"></noscript>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<!-- Tacet date + time (§1.18) — THE SAME MODULE THE DESKTOP RENDERS WITH.
     The phone used to carry its own date family: its own parser, its own
     English and Chinese branches, and its own idea of what "today" is. It
     agreed with the desktop on shape and disagreed with it on ZONE — every
     stamp here was drawn on the DEVICE's clock while every stamp on the
     desktop is drawn on the STORE's, so a Guangzhou shop whose owner is
     abroad read two different times for the same order on two screens. That
     is the same defect A-04 fixed on the server, pointing the other way.

     Loaded rather than copied. A second implementation of §1.18 is a second
     thing to keep in step, and this one had already fallen out of step in the
     way that matters most. Its window.TD_TZ is set from GET /config in
     loadLive(), exactly as the desktop's loadConfig() sets it.

     A hard dependency, so it is precached with the shell in sw.js — an
     installed app whose date module is missing does not degrade, it stops. -->
<script src="/assets/td-datetime.js"></script>
<style>
/* ===========================================================================
   Tacet Mobile — monitoring-first phone companion.
   1:1 with Mobile Shell.dc.html: single live language (toggle), Lucide icons,
   The Recap in Inter (NEVER Fraunces — Fraunces is marketing-only in Tacet).
   Tokens inlined from the Tacet design system so this file is self-contained.
   =========================================================================== */
:root{
  --paper:#FBF9F4; --ink:#111A2B; --graphite:#58606E; --dusk:#6E67AF; --sage:#A3B49F;
  --amber:#C9954A; --brick:#B4533E;
  --dusk-tint:#EEEDF6; --sage-tint:#EDF1EC; --amber-tint:#F7EEDE; --brick-tint:#F6E7E3;
  /* Ink that sits ON a tint or on paper — darker than the hue itself, because
     Sage and Amber at full strength are too pale to read as text. These were
     twenty-odd hardcoded hexes until the dark theme showed why that does not
     work: #5F7357 on a #182236 card is 2.6:1, so every "3 delivered", every
     amber warning and every success pill went nearly invisible the moment the
     phone switched to dark. */
  --sage-ink:#5F7357; --amber-ink:#8A6425; --brick-ink:#B4533E; --dusk-ink:#524C8F;
  --raised:#F6F3EC; --border:#E4E0D5; --dusk-hover:#605AA0; --dusk-press:#524C8C;
  /* The row surface for a record nobody on the team has opened yet. Deliberately
     LIGHTER than a header band: an unseen row is transient content and must never
     read as heavy as the page's own chrome. Pairs with a Sage left edge drawn as an
     inset shadow, never a border — a marker that resizes its row makes the list
     jump as records get opened. */
  --unseen:#F4F5F0;

  --bg:var(--paper); --surface-card:#FFFFFF; --surface-raised:var(--raised); --surface-dark:var(--ink);
  --text-primary:var(--ink); --text-secondary:var(--graphite); --text-caption:var(--graphite);
  --border-default:var(--border); --border-strong:var(--graphite); --border-focus:var(--dusk);
  /* THE EDGE OF SOMETHING YOU PRESS, and it is not --border-default. Separating
     a card from the page and drawing the boundary of a control are different
     jobs: the first may whisper, the second must clear 3:1 or the button is not
     there. Measured on the receive screen, where it was reported: the old edge
     is 1.34:1 in dark and 1.25:1 in light — the label reads and the BUTTON does
     not. These are 3.71:1 and 3.21:1 on their grounds. */
  --edge:#948B76;
  --accent:var(--dusk); --accent-hover:var(--dusk-hover); --accent-press:var(--dusk-press); --accent-tint:var(--dusk-tint);
  --success:var(--sage); --warning:var(--amber); --danger:var(--brick);
  --radius-card:14px;

  --ease-settle:cubic-bezier(0.16,1,0.3,1);
  --font-ui:'Inter','Noto Sans SC','Source Han Sans SC',-apple-system,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:var(--ink); --surface-card:#182236; --surface-raised:#1E2A40; --surface-dark:#0B121F;
  --text-primary:var(--paper); --text-secondary:#9AA2B0; --text-caption:#9AA2B0;
  --border-default:#263149; --border-strong:#3A455D; --edge:#667491;
  --unseen:#182329;
  /* The tints were defined once, in the light block, and never again — so a
     Sage icon tile, an Amber count badge and a Brick warning banner all kept
     their paper-coloured fill on a near-black page. Home drew seven cream
     slabs down the left of the "Needs you" list. Same hues, sunk into the
     dark ground, with the inks lifted to match. */
  --amber-tint:rgba(201,149,74,.16); --brick-tint:rgba(180,83,62,.20);
  --sage-tint:rgba(163,180,159,.16); --dusk-tint:rgba(110,103,175,.24);
  --amber-ink:#D9A55E; --brick-ink:#DE8B77; --sage-ink:#A3B49F; --dusk-ink:#A9A2E0;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E9E5DC;font-family:var(--font-ui);color:var(--text-primary)}
button,input,textarea{font-family:inherit}

/* --app-h is measured, not declared — see the data-boot="viewport" script in
   the head for why 100dvh is not trustworthy at launch. The two heights before
   it are the fallbacks, in order of how much they can be relied on. */
#app{position:relative;display:flex;flex-direction:column;overflow:hidden;
  width:100vw;height:100vh;height:100dvh;height:var(--app-h,100dvh);
  background:var(--bg);color:var(--text-primary)}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  #app{width:402px;height:min(874px,calc(100vh - 48px));border-radius:44px;
       box-shadow:0 24px 70px rgba(17,26,43,.28),0 0 0 11px #1c1c1e,0 0 0 12px #2c2c2e}
  /* …unless the app IS the window. The drawn phone is a preview device for
     looking at a phone app on a desk; an installed app opened on a laptop is
     the real thing, and a real thing does not draw a picture of a handset
     around itself inside its own window. */
  :root[data-standalone] body{display:block;padding:0}
  :root[data-standalone] #app{width:100vw;height:100vh;height:100dvh;height:var(--app-h,100dvh);
       border-radius:0;box-shadow:none}
}

/* ── The app, not the page ────────────────────────────────────────────────
   Launched from the home screen there is no address bar, no reload button and
   no browser Back — so a handful of browser behaviours stop being helpful and
   start being bugs, and this is where they are switched off.

   Pull-to-reload is the sharpest of them: dragging a list past its top RELOADS
   an installed app, which throws away every screen it was on and every sheet
   it had open, for a gesture people make by accident all day. It is replaced,
   not just removed — see wirePull() for the refresh that takes its place.

   The document itself never scrolls either. It had nothing to scroll TO — the
   app is one 100dvh box — but a phone browser makes the page taller than the
   part of it you can see, by exactly the height of its own toolbar, and that
   difference is draggable. Dragging it took the tab bar off the bottom of the
   screen and would not give it back until the toolbar came out of hiding, which
   is not a gesture anybody knows to make. overflow:hidden goes on BOTH html and body:
   on body alone iOS ignores it. The one scroller left is .content, which is
   where scrolling was always meant to happen. */
html,body{overscroll-behavior:none;overflow:hidden}
.content{overscroll-behavior-y:contain}
/* Tapping a control should not paint its label blue and offer to copy it.
   Selection stays ON everywhere else on purpose: an address, a phone number
   and an order number are things people lift out of this app by hand. */
button,.tabbar,.row,.chip,.pill,.eyebrow,h1,.grabber{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* No 300ms wait on every tap for a double-tap-to-zoom that can't happen. */
button,a,.row,.chip,.stepbtn{touch-action:manipulation}
/* The refresh that replaces pull-to-reload: a ring in the gap the content
   leaves behind as it is dragged down. Sits UNDER the content — which paints
   its own background — so it is only ever visible while the gap is open. */
:root{--pull-gap:calc(56px + env(safe-area-inset-top,0px))}
.pullring{position:absolute;top:0;left:0;right:0;height:var(--pull-gap);z-index:0;display:flex;
  align-items:center;justify-content:center;pointer-events:none;color:var(--text-secondary);
  /* The inset, so the ring is not spinning behind the phone's own clock: on iOS
     the app is drawn UNDER the status bar (apple-mobile-web-app-status-bar-style
     is black-translucent), and the gap a pull opens starts at the very top of
     the glass. The gap grows by the same inset to keep the ring centred in the
     part of it anyone can see. */
  padding-top:env(safe-area-inset-top,0px)}
.pullring svg{transition:opacity .15s linear}
.spin{animation:tSpin .9s linear infinite}
@keyframes tSpin{to{transform:rotate(360deg)}}
.content{position:relative;z-index:1}

@keyframes tBreathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes tSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes tFade{from{opacity:0}to{opacity:1}}
@keyframes tRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.breathe{animation:tBreathe 2.4s ease-in-out infinite}

/* ── Boot splash ───────────────────────────────────────────────────────────
   #app starts with this markup already inside it (see body below), not
   empty — this file is a single ~600KB document and the OS-generated PWA
   splash (icon + name, nothing else) is all a phone has to show until every
   byte of it has arrived AND the trailing script block has run. On a slow
   connection that gap is seconds of blank screen. HTML paints as it streams
   in, ahead of a blocking script tag, so this markup shows the moment it has
   downloaded — well before the script that builds the real app. render()
   always does app.innerHTML = ... (see render()), so the very first render
   overwrites this wholesale; nothing here is ever cleaned up by hand. */
.boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.boot-mark{display:flex;flex-direction:column;align-items:center;gap:20px}
.boot-path{stroke-dasharray:820;stroke-dashoffset:820;animation:tDraw .9s var(--ease-settle) forwards}
.boot-dot{opacity:0;animation:tFade .3s var(--ease-settle) forwards .7s,tBreathe 2.4s ease-in-out infinite 1s}
.boot-word{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:tRise .45s var(--ease-settle) forwards .8s}
@keyframes tDraw{to{stroke-dashoffset:0}}
/* The staged entrance leans on animation-delay, which the reduced-motion rule
   above (line ~260) does not zero — only duration. Without this, "reduced
   motion" would still mean staring at an empty splash for the better part of
   a second. Here it means what it should: the mark and its label are simply
   there, first frame. */
@media (prefers-reduced-motion:reduce){.boot-path{stroke-dashoffset:0}.boot-dot,.boot-word{opacity:1}}
/* Every render() replaces the whole tree, so a `.rise` card is a brand-new DOM
   node each time and its fade/slide-up entrance replays — fine for the first
   paint, but loadLive()'s data trickles in across a dozen independent fetches
   that each call render() on their own timer, so the entrance kept replaying
   across the whole screen for a couple of seconds after open and read as
   flicker rather than a settle. html.settled (added right after the critical
   above-the-fold render in loadLive — see there) turns it off once that first
   paint has landed, so later renders paint their final state directly. */
html:not(.settled) .rise{animation:tRise .5s var(--ease-settle) both}
.hscroll{scrollbar-width:none;-ms-overflow-style:none;overflow-x:auto}
.hscroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}

.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.tabbar{flex:none;display:flex;background:var(--surface-card);border-top:1px solid var(--border-default);
  padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 12px)}
.iconbtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:8px}
.card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px}
.card.unseen{background:var(--unseen);box-shadow:inset 4px 0 0 var(--sage);
  transition:background .6s var(--ease-settle), box-shadow .6s var(--ease-settle)}
.list{background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px;overflow:hidden}
.sep{height:1px;background:var(--border-default)}
.eyebrow{font-size:13px;font-weight:500;color:var(--text-secondary)}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;padding:12px 16px;background:transparent;
  border:none;cursor:pointer;text-align:left;color:var(--text-primary);font-family:inherit}
.rowico{width:36px;height:36px;border-radius:8px;background:var(--surface-raised);display:flex;align-items:center;
  justify-content:center;color:var(--text-secondary);flex:none}
.num{font-variant-numeric:tabular-nums}
.btn2{min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--edge);background:transparent;
  color:var(--text-primary);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn2:disabled{opacity:.55;cursor:default}
.cta{width:100%;min-height:44px;padding:12px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;
  font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s var(--ease-settle)}
.cta:hover{background:var(--accent-hover)}.cta:active{background:var(--accent-press)}
.scrim{position:absolute;inset:0;background:rgba(17,26,43,.38);animation:tFade .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-card);
  border-top-left-radius:14px;border-top-right-radius:14px;
  box-shadow:0 1px 2px rgba(17,26,43,.05), 0 4px 16px rgba(17,26,43,.04);
  animation:tSheetUp .4s var(--ease-settle) both;display:flex;flex-direction:column}
.grabber{width:38px;height:5px;border-radius:999px;background:var(--border-default);margin:6px auto 8px}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:400;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.stepbtn{width:44px;height:44px;border-radius:8px;background:var(--surface-raised);border:1.5px solid var(--edge);
  display:flex;align-items:center;justify-content:center;color:var(--text-primary);cursor:pointer;flex:none}
.chip{display:flex;align-items:center;gap:8px;flex:none;height:44px;padding:0 16px;border-radius:999px;font-size:13px;
  cursor:pointer;font-family:inherit;white-space:nowrap;border:1.5px solid var(--edge);
  background:var(--surface-card);color:var(--text-secondary)}
.chip.on{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}
.chip .c{font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
.i svg,svg.i{display:block;flex:none}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;z-index:60;background:var(--text-primary);
  color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;white-space:nowrap;
  box-shadow:0 6px 20px rgba(17,26,43,.22);animation:tFade .2s ease both}
input,textarea{padding:12px 14px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-card);
  color:var(--text-primary);font-size:15px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--border-focus)}

/* ── Receiving ────────────────────────────────────────────────────────────
   The quantity control on the receive screen. 52px because it is used one-
   handed with a box in the other, standing at a door — the 44px floor is a
   minimum for a thumb that is paying attention, not for one that is busy. */
.qty{width:72px;height:52px;padding:0;text-align:center;font-size:22px;font-weight:500;
  font-variant-numeric:tabular-nums;border-radius:10px;background:var(--surface-card);
  border:1px solid var(--border-default);color:var(--text-primary)}
.qty.sm{width:60px;height:44px;font-size:17px}
/* Amber only when the ARRIVED count differs from what was ordered. Damage is a
   separate fact with its own control and its own colour; tinting this for it
   said the count had been changed when it had not. */

  size = size||20; stroke = stroke||1.75;

  /* kebab → Pascal, and it only strips a hyphen that is followed by a LETTER.
     A lucide name ending in a digit therefore does NOT resolve: 'trash-2'
     becomes 'Trash-2', not 'Trash2', and lucide has no such key — so the tile
     renders EMPTY, with no error anywhere. That cost the Waste row its icon.
     Every name in this file is digit-free for that reason; if you need one
     that is not, fix the regex here rather than passing the Pascal name in. */
  const P = String(name).replace(/(^|-)([a-z])/g,(_,__,c)=>c.toUpperCase());
  const node = L && L.icons && L.icons[P];
  const kids = node && Array.isArray(node[2]) ? node[2] : [];

  // screen full of Dusk is wrong. Settings showed eight switched-on toggles at

function copyText(t){

  const fallback=()=>{ try{
      const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';

   nothing, answered 200, and the phone showed "Poll closed". A write that
   reports success and does nothing is the worst shape a bug can take, so
   scripts/test_mobile_screens.js now fails on a handler whose arity the
   dispatcher cannot feed. */

/* A scrim closes its sheet on a tap OUTSIDE it — `onclick` alone is not that.
   `click`'s target is resolved at TOUCH-UP, not touch-down, and every sheet
   here can repaint (or lose the keyboard, which reflows the page under a
   finger already in motion) between the two: start a tap on a product row,
   have that row's own re-render — or simply the keyboard closing as the
   input blurs — land the lift under a different element, and if that
   element is the scrim, `onclick` fires wstClose/closePO/closeCustomer/etc.
   having never actually been asked to. The operator loses the whole form
   over a tap that was aimed at a row inside it.
   The fix is the one the desktop dialogs (tacet-dialogs.js) already use for
   the same reason, adapted for touch: judge the gesture by where it STARTED,
   not where it happened to end up. A capture-phase listener remembers
   whether touch-down landed on a scrim; scrimClose() only acts when that was

document.addEventListener('touchstart', _scrimDownTrack, true);

reg('qsSearch', v=>{ const el=document.getElementById('mQsQ');
  // The caret rides the re-render, as it does on every other search field here.
  state.qs.q=String(v||''); state.focus={id:'mQsQ',pos:el?el.selectionStart:null}; render(); });

reg('qsFlush', id=>qsFlush(Number(id)));

/* Paints the choice, remembers it, and repaints the OS chrome to match. That
   last part is what an installed app needs and a tab does not: in standalone
   the status bar and the gesture area are coloured by theme-color, so a dark
   app under a cream status bar looks like the app has been cropped. */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',state.theme);
  try{ localStorage.setItem('roots_theme',state.theme); }catch(e){}
  const m=document.getElementById('mThemeColor');
  if(m) m.setAttribute('content', state.theme==='light'?'#FBF9F4':'#111A2B');
}
/* Remembered, for the same reason the theme is: an operator who reads Chinese
   reads Chinese every morning, and re-picking it at every launch is the app
   forgetting who it belongs to. Its own key — public/stock.html's
   'roots-admin-lang' speaks en/cn and this speaks en/zh, and a shared key
   would have one of them reading the other's word for Chinese as English. */
const M_LANG_KEY='tacet-m-lang';
/* ── The account speaks en/cn; this app speaks en/zh ──────────────────────
   The comment above says why the KEY is its own, and that reasoning still
   holds. What changed (audit M-01 / M-02) is that the choice now also belongs
   to the PERSON, not just to this handset, so it follows them to the desk. One
   vocabulary is stored — 'en' | 'cn', the one every other surface uses — and
   this pair maps at the boundary, which is exactly the collision the original
   comment was guarding against, handled once instead of avoided. */
const mLangToAccount = (l) => (l === 'zh' ? 'cn' : 'en');
const mLangFromAccount = (l) => (l === 'cn' ? 'zh' : (l === 'en' ? 'en' : null));
/* Fire-and-forget, after the language is already applied and remembered here.
   A failure means it does not follow them to the next device; it must never
   interrupt somebody who just pressed a toggle. */
function mSaveLang(l){
  try{
    fetch('/api/backend/language',{method:'PUT',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({language:mLangToAccount(l)})}).catch(()=>{});
  }catch(e){}
}
reg('toggleLang', ()=>{ state.lang=state.lang==='en'?'zh':'en'; LANG=state.lang; document.documentElement.lang=state.lang;

/* On the shop, or not. The desktop puts this switch on every card because it is
   the one product decision that is urgent — something is wrong with a line and
   it has to stop selling NOW — and that is a phone job if anything is. It flips
   every size of a family at once, the way the desktop's does, and puts the
   switch back if the server refuses. */
reg('toggleShop', ids=>{
  const list=String(ids).split(',').map(Number).filter(Boolean);
  if(!list.length||state.prodBusy) return;
  const rows=list.map(id=>(DB.products||[]).find(p=>p._id===id)).filter(Boolean);
  if(!rows.length) return;
  const next=!rows.some(p=>p.pub);
  state.prodBusy='shop'+list[0]; state.prodErr=null;
  rows.forEach(p=>{ p.pub=next; reKindProduct(p); });   // optimistic
  render();
  Promise.all(list.map(id=>apiWrite('/products/'+id,{is_published:next?1:0},'PATCH')))
    .then(()=>{ state.prodBusy=null; render(); showToast(next?T('On the shop','已上架'):T('Off the shop','已下架')); })
    .catch(e=>{
      rows.forEach(p=>{ p.pub=!next; reKindProduct(p); });   // the switch must never lie
      state.prodBusy=null;
      if(String(e.message)==='auth') return;
      state.prodErr=E('That did not save. The product is unchanged.','没有保存成功。产品状态未变。');
      render();
    });
});
/* The status buckets are derived, so a published flag that changes has to
   re-derive them or the pill and the switch disagree on the same card. */
function reKindProduct(p){
  const low=Number(cfgGet('inventory.lowStockThreshold',5))||5;
  if(!p.pub){ p.kind='draft'; p.status=['Draft','草稿']; }
  else if(!p.supplier&&p.stock<=0){ p.kind='off'; p.status=['Out','缺货']; }
  else if(!p.supplier&&p.stock<=low){ p.kind='restock'; p.status=['Low','库存低']; }
  else { p.kind='on'; p.status=['Live','在售']; }
}

     not short. That is what makes this a reason-aware caller: the server
     enforces the rule in both directions for anyone who sends the key, and
     does nothing for anyone who omits it (routes/purchases.js
     planReceiptReason). Sending it only on short lines would leave a stale
     reason standing on a line that had just been corrected upwards. */
  const receipts=rcvToSend().map(it=>{ const v=rcvVal(it.id);
    return { line_id:it.id, qty_received:v.recv, damaged_qty:v.dmg,
             receipt_reason: v.recv<rcvOrdered(it) ? v.reason : null }; });
  if(!receipts.length){ state.recvBusy=false; render(); return; }
  const body={receipts};
  /* Only when the operator actually moved it, and never when locked — the
     screen does not offer the choice then, and sending it anyway would be
     asking for a refusal we already know the answer to. */
  if(!po.store_locked&&state.recvStore&&state.recvStore!==po.receiving_store_id) body.store_id=state.recvStore;
  apiWrite('/purchases/'+po.id+'/receive',body,'PUT').then(r=>{
    state.recvBusy=false;
    const t=rcvTally(), bits=[];
    if(t.complete.length) bits.push(LANG==='en'?(t.complete.length+' complete'):(t.complete.length+' 项完好'));
    if(t.short.length)    bits.push(LANG==='en'?(t.short.length+' short'):(t.short.length+' 项短少'));
    if(t.dmg.length)      bits.push(LANG==='en'?(t.dmg.length+' damaged'):(t.dmg.length+' 项破损'));
    if(t.over.length)     bits.push(LANG==='en'?(t.over.length+' over'):(t.over.length+' 项多收'));
    if(t.none.length)     bits.push(LANG==='en'?(t.none.length+' not sent'):(t.none.length+' 项未发货'));
    /* What is still coming, said on the confirmation screen — the operator has
       just deliberately left products unanswered and needs to see that the app
       understood it as "later", not as "no". */
    if(t.waiting.length)  bits.push(LANG==='en'?(t.waiting.length+' still to come'):(t.waiting.length+' 项待收'));
    state.recvDone=bits.join(' · ');
    /* Both lists the save just changed are now stale. */
    state.posTried=false; state.rcvTried=false; state.rcvToTried=false; state.poReceiptsFor=null;
    render(); showToast(T('Delivery recorded','收货已登记'));
  }).catch(e=>{ state.recvBusy=false;
    if(String(e.message)==='auth') return;
    state.recvSaveErr=recvErrText(e); render(); });
});

function workDate(e){
  const t=e&&e.ts; if(t==null) return null;
  const d=(typeof t==='number')?new Date(t):_date(t);
  return (d&&!isNaN(d))?d:null;

const workMs=e=>{ const d=workDate(e); return d?d.getTime():0; };

  const d=workDate(e); if(!d) return '';

function workMeta(e){
  const p=e.payload||{}, esc=escAttr;

  const badge=p.first_order?T('first order','首单'):'';
  switch(e.type){
    case 'paid_order': return {text:buyer?T(buyer+' paid',buyer+' 已支付'):(chan?T(chan+' order',chan+' 订单'):T('Order paid','订单已支付')),
      amount:yuan(p.total), badge};

/* ---- The Recap ----------------------------------------------------------
   This is the desktop's Recap, not a phone-shaped reinvention of it. It used to
   compute its own "orders overnight / revenue overnight" client-side from the
   fifty orders boot happened to hold, over a 22:00–08:00 window nothing else in
   the product uses — a metric that does not exist on the desktop and a number
   that could not be reconciled with any other number in the app.

   The real Recap reads the ACTIVITY FEED since the moment you last left, and
   states what happened in the same sentences tdRecapRender writes: orders paid
   (with the money), dispatched, delivered, unpaid ones auto-cancelled, refunds
   settled, top-ups, new customers, gzgrocery pickups. When the window is empty
   it is not a card at all — one quiet line, because a card that says nothing
   happened is furniture.

   Framing rules are the desktop's too: a gap under 25 minutes is a reload, not a
   departure, so it reads "Recently" rather than "While you were away"; the
   window is floored at 30 minutes and capped at 7 days. And the money rows are
   owner-only — a warehouse or dispatch account sees its own queue without the
   revenue, exactly as tdRecapNoMoney decides on the desktop. */
const RECAP_SEEN_KEY='tacet.m.lastSeen';
const RECAP_NO_MONEY=['warehouse','dispatch','customer_service'];
function recapNoMoney(){ return RECAP_NO_MONEY.includes(state.pos); }
async function loadRecap(){
  if(state.recapTried) return; state.recapTried=true;
  let since=0;
  try{ since=parseInt(localStorage.getItem(RECAP_SEEN_KEY)||'0',10)||0; }catch(e){}
  const now=Date.now();
  const MAX_BACK=7*86400000, MIN_BACK=30*60000, REAL_ABSENCE=25*60000;
  state.reallyAway=!!since&&(now-since>=REAL_ABSENCE)&&(now-since<=MAX_BACK);
  if(!since||now-since>MAX_BACK) since=now-MAX_BACK;
  if(now-since<MIN_BACK) since=now-MIN_BACK;
  state.recapSince=since;
  try{ localStorage.setItem(RECAP_SEEN_KEY,String(now)); }catch(e){}
  try{ const j=await api('/dashboard/activity?since='+since+'&limit=500');
    state.recap=(j&&j.events)||(Array.isArray(j)?j:[]);
  }catch(e){ state.recap=null; }
  render();
}
/* The same eight sentences the desktop writes, in the same order. Kept as data
   so the empty case can be told from the failed one without re-deriving it. */
function recapRows(){
  const ev=state.recap; if(!ev) return null;
  const of=t=>ev.filter(e=>e.type===t);
  const sum=(rows,k)=>rows.reduce((n,e)=>n+(Number(e.payload&&e.payload[k])||0),0);
  const m=n=>money0(CUR,n);
  const paid=of('paid_order'), disp=of('order_dispatched'), deliv=of('order_delivered');
  const autoCanc=of('order_cancelled').filter(e=>e.payload&&e.payload.reason==='auto_cancelled_unpaid');
  const refunded=of('refund_paid'), newCust=of('new_customer'), topups=of('topup');
  const comm=of('affiliate_commission');
  const pickups=of('gzgrocery_pickup').filter(e=>!(e.payload&&e.payload.is_return));
  const noMoney=recapNoMoney();
  const wh=state.pos==='warehouse';
  const delivery=state.pos==='dispatch'||state.pos==='customer_service';
  const rows=[];
  const n1=(a,one,many)=>a.length===1?one:many;
  /* How many of the orders ALREADY COUNTED on the paid line came through a
     referral. Deliberately a parenthetical on that line and not a line of its
     own: these orders are a subset of `paid`, so a second row would read as
     more orders than were placed. The flag is absent (not false) on shops with
     the referral program switched off, so this is 0 there and nothing shows. */
  const affPaid=paid.filter(e=>e.payload&&e.payload.affiliate).length;
  if(paid.length&&!delivery){
    rows.push(wh
      ? T(paid.length+' '+n1(paid,'order','orders')+' entered your queue', paid.length+' 笔订单进入待处理队列')
      /* The affiliate count rides the money branch only. It is commercial
         context — what the referral program is driving — and the warehouse
         branch is the money-free version of this sentence by design.
         CN: 推荐订单 is the term already used for these orders (app.html's
         Referrers table), 笔 the measure word this very line already uses,
         and （） the full-width form every other parenthetical in this file
         takes — so no leading space before it, unlike the English half. */
      : T(paid.length+' '+n1(paid,'order','orders')+' paid — '+m(sum(paid,'total'))+(affPaid?' ('+affPaid+' via affiliate)':''), paid.length+' 笔订单已支付，共 '+m(sum(paid,'total'))+(affPaid?'（推荐订单 '+affPaid+' 笔）':'')));
  }
  if(disp.length) rows.push(T(disp.length+' '+n1(disp,'order','orders')+' dispatched', disp.length+' 个订单已发货'));
  if(deliv.length&&!wh) rows.push(T(deliv.length+' '+n1(deliv,'order','orders')+' delivered', deliv.length+' 个订单已送达'));
  /* Commission the shop PAID OUT. Money, so it sits behind the same owner-only
     gate as the revenue figures beside it — a warehouse or dispatch account
     sees its queue without the cost of sale, exactly as the paid total, refunds
     and top-ups already decide. Omitted at zero rather than shown as ¥0: a
     shop not running referrals should not carry a permanent empty line, and
     nor should one whose only movement today netted out.

     CN: 已发出奖励 — the Affiliate tab's own headline for this exact money
     (retail-admin/10-extras.js, "You have paid out"). NOT 佣金, which every
     other use in this codebase spends on the PLATFORM's cut — the channel
     fee Meituan and Eleme take, and the commission the platform bills a
     tenant. Reusing it here would name the shop's own referral spend after
     somebody else's. The one number covers both halves of the programme,
     the one-shot bounty and the repeat-order share alike, which is why the
     server unions the two tables into a single event type. */
  if(!noMoney&&comm.length&&sum(comm,'amount')>0) rows.push(T(m(sum(comm,'amount'))+' affiliate commission', '已发出奖励 '+m(sum(comm,'amount'))));
  if(!noMoney&&autoCanc.length) rows.push(T(autoCanc.length+' unpaid '+n1(autoCanc,'order','orders')+' cancelled automatically', autoCanc.length+' 个未付款订单已自动取消'));
  if(!noMoney&&refunded.length) rows.push(T(refunded.length+' '+n1(refunded,'refund','refunds')+' settled — '+m(sum(refunded,'amount')), refunded.length+' 笔退款已完成，共 '+m(sum(refunded,'amount'))));
  if(!noMoney&&topups.length) rows.push(T(topups.length+' wallet '+n1(topups,'top-up','top-ups')+' — '+m(sum(topups,'amount')), topups.length+' 笔钱包充值，共 '+m(sum(topups,'amount'))));
  if(!noMoney&&newCust.length) rows.push(T(newCust.length+' new '+n1(newCust,'customer','customers')+' joined', '新增 '+newCust.length+' 位客户'));
  if(pickups.length&&!delivery) rows.push(T(pickups.length+' gzgrocery '+n1(pickups,'pickup','pickups')+' recorded', '记录 '+pickups.length+' 笔 gzgrocery 提货'));
  return rows;
}
function recapTitle(){
  if(!state.reallyAway) return T('Recently','最近动态');
  const g=greetKey();
  return (g==='morning'||g==='night')?T('While you slept','在你休息时'):T('While you were away','在你离开时');
}
function recapSinceLabel(){
  const d=_date(state.recapSince?new Date(state.recapSince):null)||new Date(state.recapSince||Date.now());
  const hm=fmtTime(d);
  /* Which DAY the operator left, counted on the shop's calendar rather than
     the handset's. An owner who reads the Recap from another country was told
     "you left yesterday" about this morning, or "you left here" about a
     two-day trip, purely because their phone had crossed a border. */
  const iso=shopDayOf(d), dayNo=s=>{ const p=String(s||'').split('-');
    return p.length===3?Date.UTC(+p[0],+p[1]-1,+p[2])/86400000:NaN; };
  const days=dayNo(shopToday())-dayNo(iso);
  if(!state.reallyAway) return T('since '+hm,hm+' 起');
  if(!(days>0)) return T('you left here — '+hm, '您离开时 — '+hm);
  if(days===1) return T('you left yesterday — '+hm, '您昨天 '+hm+' 离开');
  const mo=+iso.slice(5,7), da=+iso.slice(8,10);
  return T('you left '+mo+'/'+da+' — '+hm, '您于'+mo+'月'+da+'日 '+hm+' 离开');
}

/* The four figures the desktop keeps beside Today, with the rules it wrote for

/* ==========================================================================
   Quick actions — the operator's own rows, not ours
   --------------------------------------------------------------------------
   Home used to offer "Add product", "Create coupon", "Send broadcast" — three
   verbs the phone cannot perform, each opening a read-only list. They were
   replaced by three it genuinely can do in one tap (answer the inbox, tick a
   delivery in, fix a price or a count), which fixed the lie and left the
   smaller problem behind it: WE were still choosing. A stocker who never opens
   the inbox and lives in Receiving got the owner's three rows; a shop with no
   purchase orders got a row it never taps, sitting where its Waste row should
   be. The row an operator reaches for every morning is a fact about their
   shop, and no default knows it.

   So the list is theirs. Everything this app can reach and their role allows
   is offered; up to six ride Home, in the order they put them in, remembered
   on this phone the way the theme and the language are — an operator who set
   their shortcuts has set them, not set them until the next launch.

   The three we picked are still the DEFAULT. Somebody who never opens the
   picker keeps exactly the Home they had.
   ========================================================================== */
const M_QUICK_KEY='tacet-m-quick', QUICK_MAX=6;
/* THE DELIVERY DEFAULT POINTS AT RECEIVING, NOT AT PURCHASING. "Tick a delivery
   in" was written when Purchasing was the only place a phone could book goods
   in, and it stayed on `purchasing` after Receiving was split out onto its own
   screen (see the Receiving header). That left an operator who put both on Home
   reading "Tick a delivery in" above "Receiving" — two rows, one job, no way to
   tell from the words which one counts what turned up. Purchasing counts
   ORDERS and their money; Receiving counts DELIVERIES and is the screen whose
   whole purpose is booking one in. The verb belongs to the second.

   RECEIVING IS GATED ON purchasing:receive AND PURCHASING ON purchasing:view,
   so this moves the default row off a buyer's Home and onto a receiver's. That
   is the right way round: the row promises a save, and a holder of view alone
   gets 403 on it (ROUTE_CAP's note says the same about the screen). A buyer who
   wants their orders one tap away adds Purchasing in the picker, which is what
   the picker is for. */
const QUICK_DEFAULT=['inbox','receiving','tab:products'];
/* A shortcut is named for the VERB only where there is one worth saying, and
   the three defaults keep the wording Home has always used for them. Every
   other row is offered under the name it already wears in More: a verb
   invented for a screen is exactly how "Add product" happened. Purchasing has
   no entry here for that reason — it is offered as "Purchasing", the noun it
   wears in More, so the two rows can never read as one again. */
const QUICK_VERB={
  inbox:['Answer the inbox','回复消息'],
  receiving:['Tick a delivery in','确认收货'],
  'tab:products':['Fix a price or a count','改价或改库存'],

/* Everything reachable, flat: the four destinations that are not Home, then
   every More row this role can open. The same two sources searchIndex() reads,
   so a screen can never be findable in search and unpickable here — and both
   are already capability-filtered, so the picker cannot offer a row whose
   screen would 403. */
function quickCatalogue(){
  const out=Object.keys(TAB_META).filter(k=>k!=='home'&&k!=='more'&&canRoute(k))
    .map(k=>({key:'tab:'+k, icon:TAB_META[k].icon, en:TAB_META[k].en, zh:TAB_META[k].zh,
              group:['Destinations','主页面'], cmd:`APP.cmd('tab','${k}')`}));
  moreGroups().forEach(g=>g.rows.forEach(r=>out.push({
    key:r.key, icon:r.icon, en:r.en, zh:r.zh, group:g.h||['More','更多'], cmd:r.cmd})));
  return out;
}
function quickLabel(it){ const v=QUICK_VERB[it.key]; return v?T(...v):T(it.en,it.zh); }
/* Read once, then held in state. An empty ARRAY is a real answer — an operator
   who cleared the list wanted it cleared, and must not have the defaults handed
   back at the next launch — so only a missing or unreadable key falls back. */
function quickKeys(){
  if(state.quick) return state.quick;
  let saved=null;
  try{ const raw=localStorage.getItem(M_QUICK_KEY); if(raw) saved=JSON.parse(raw); }catch(e){}
  state.quick = Array.isArray(saved)
    ? saved.filter(k=>typeof k==='string').slice(0,QUICK_MAX)

function quickSave(){ try{ localStorage.setItem(M_QUICK_KEY,JSON.stringify(state.quick)); }catch(e){} }

function quickRows(){
  const by={}; quickCatalogue().forEach(c=>{ by[c.key]=c; });
  return quickKeys().map(k=>by[k]).filter(Boolean);

/* The picker. Chosen rows sit at the top in the order Home draws them, each

function sheetQuick(){

/* The chips used to filter the fifty rows that happened to be loaded, which is
   why "Delivered 15" could show three. Every filter is the server's now, and the
   list says how much of the set it is showing. */
const STATUS_PARAM={all:'',paid:'paid',preparing:'preparing',dispatched:'dispatched',
  delivered:'delivered',restock:'awaiting_restock',refund:'refunds_open',pending:'pending_payment'};
const CHANNEL_PARAM={all:'',miniapp:'wechat',web:'web',meituan:'meituan',gzgrocery:'gzgrocery',manual:'manual',shop:'shop'};
const ORDERS_PAGE=25;
function ordersQuery(offset){
  const qs=new URLSearchParams();
  const st=STATUS_PARAM[state.statusF]||''; if(st) qs.set('status',st);
  const ch=CHANNEL_PARAM[state.channelF]||''; if(ch) qs.set('channel',ch);
  if(state.orderQ) qs.set('q',state.orderQ);
  if(state.storeF&&state.storeF!=='all') qs.set('store_id',state.storeF);
  qs.set('limit',ORDERS_PAGE); qs.set('offset',offset||0);
  return qs.toString();
}
async function loadOrdersPage(more){
  const offset=more?((state.ordersView||[]).length):0;
  state.ordersLoading=true; state.ordersLoadErr=null; if(!more){ state.ordersView=null; } render();
  try{
    const j=await apiRaw('/orders?'+ordersQuery(offset));
    const rows=(j&&j.data)||[];
    const mapped=rows.map(mapOrderRow);
    state.ordersView=more?(state.ordersView||[]).concat(mapped):mapped;
    state.liveOrders=state.ordersView;
    const total=j&&j.meta&&j.meta.total;
    state.ordersTotal=(total!=null)?total:null;
    state.ordersMore=(total!=null)?state.ordersView.length<total:rows.length===ORDERS_PAGE;
  }catch(e){
    if(String(e.message)==='auth') return;
    /* This used to substitute DB.orders — five sample orders, unfiltered — and
       call that honest because it suppressed the counts. Nothing on the screen
       said they were samples, so a failed fetch on a bad connection put five
       orders in front of an operator that they could read, tap and act on. A
       failed load says it failed. */
    if(!more){ state.ordersView=null; state.ordersTotal=null; state.ordersMore=false; }
    state.ordersLoadErr=E('Could not load orders.','无法加载订单。');
  }
  state.ordersLoading=false; render();
}
/* Store, item count and the routing note — the desktop's Store and Items
   columns, folded into one muted line because a phone card cannot spend a row
   on each. The store half is suppressed on a single-store shop, where naming it
   on every row says nothing. */
function orderMetaLine(o){
  const bits=[];
  const many=(state.stores||[]).length>1;
  if(o.store&&many) bits.push(T(...o.store));
  // "products", not "items" — the list only knows how many LINES an order has
  // (the endpoint counts rows, not units), and the drawer now says products and
  // units apart. One word for one number, across both surfaces.
  if(o.items_n!=null) bits.push(T(o.items_n+(o.items_n===1?' product':' products'), o.items_n+' 款'));
  if(o.routeNote) bits.push(o.routeNote);
  if(!bits.length) return '';
  return `<div style="font-size:12.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${bits.join(' · ')}</div>`;
}
/* `|| DB.orders` was the substitution. Not the catch block — this line, at
   render time, on every paint where the live list was null: while loading,
   and forever after a failed fetch. Five sample orders with real-looking
   numbers, tappable, in front of an operator who had no way to know. The
   list is the server's or it is empty, and the screen says which. */

    ${stores.length>1?`<div style="height:8px"></div>${chipRow(st,state.storeF,'storeF')}`:''}</div>`;
}

    ${os.length&&state.ordersTotal!=null?`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 0">

      ${r.product?`<div style="font-size:12.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${T(...r.product)}</div>`:''}
      ${/* The report that opened the thread, then the newest message in it.

            then the message. "Customer" read as a stray label attached to

      ${r.lastWho

      ${r.photos?`<div style="display:flex;gap:6px;flex-wrap:wrap">${r.photos.slice(0,4).map(u=>

        ${r.replies?`<span style="font-size:12px;color:var(--text-secondary)">${T(r.replies+(r.replies===1?' reply':' replies'),r.replies+' 条往来')}</span>`:''}
      </div>`:''}
      ${r.reply?`<div style="border-left:2px solid var(--border-default);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:3px">
        <span class="eyebrow">${T('Your reply','商家回复')}</span>

          ${smallBtn(r.reply?T('Edit reply','编辑回复'):T('Reply','回复'),`APP.cmd('openReply','${k}')`,false)}

    :(state.revLoaded?emptyState(T('Inbox zero','已清空'),T('No open feedback.','没有待处理反馈。')):`<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`);
  else body=`<div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:44px 24px;text-align:center">
      <span style="width:52px;height:52px;border-radius:14px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">${ic('sparkles',22)}</span>
      <div style="font-size:16px;font-weight:500">${T('Feedback is off','反馈已关闭')}</div>
      <div style="font-size:13.5px;color:var(--text-secondary);max-width:250px;line-height:1.55">${T('Turn on the feedback inbox to collect customer notes.','开启反馈以收集客户留言。')}</div>
      <button class="cta" style="width:auto;padding:12px 30px;font-size:15px" ${state.featBusy?'disabled':''} onclick="APP.cmd('toggleFeature','feedback')">${state.featBusy==='feedback'?T('Turning on…','开启中…'):T('Enable','开启')}</button>
      ${state.featErr?`<div style="font-size:14px;color:var(--brick-ink)">${state.featErr}</div>`:''}</div>`;
  return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="display:flex;gap:3px;background:var(--surface-raised);border-radius:11px;padding:3px;flex:1">
      ${segBtn('reviews',T('Reviews','评价'))}${segBtn('feedback',T('Feedback','反馈'))}</div>
      ${seg==='reviews'&&unseenCount>0?`<button onclick="APP.cmd('markAllReviewsRead')" style="font-size:13px;font-weight:500;color:var(--text-primary);background:none;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;padding:6px 2px">${T('Mark all read','全部已读')}</button>`:''}
    </div>
    ${state.revErr?`<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
      <span style="font-size:14px;color:var(--brick-ink)">${state.revErr}</span></div>`:''}
    ${body}</div>`;

/* ==========================================================================
   Sales — archetype A-lite
   ========================================================================== */
/* `key` is this channel's name in /sales/summary, which is not the name the
   status grid uses for the same channel (mini_app vs wechat). */
const CHAN_META={
  mini_app:{icon:'smartphone',en:'Mini app',zh:'小程序',key:'wechat'},
  web:{icon:'globe',en:'Web store',zh:'网店',key:'web'},
  meituan:{icon:'bike',en:'Meituan',zh:'美团',key:'meituan',mirror:'meituan'},
  eleme:{icon:'utensils-crossed',en:'Eleme',zh:'饿了么',key:'eleme'},
  gzgrocery:{icon:'warehouse',en:'gzgrocery ERP',zh:'gzgrocery',key:'gzgrocery',mirror:'gzgrocery'},
  pos:{icon:'store',en:'In store',zh:'门店',key:'pos'},
};
/* One channel, its stores, and the switch. The Sales board could say a channel
   was shut at one store and do nothing about it — reading the state shipped,
   the switch did not. It is the most phone-shaped write in the app: you are
   standing in a slammed kitchen and you want Meituan off at Tianhe.

   PER STORE, never the whole channel. The endpoint has both — /channel-status/cell
   and /channel-status/channel — and only the first is here, because the second
   stops orders arriving everywhere on one tap and a thumb on a phone is not
   the place for that. Closing a channel outright stays on the desktop.

   The confirm names what stops and what does not, because "closed" is easy to
   read as "cancelled": orders already placed are untouched either way. */
function chanStoreName(cell){ return LANG==='en'?(cell.nameEn||cell.name||cell.storeCode)
                                                :(cell.nameCn||cell.name||cell.storeCode); }
function sheetChannel(){
  const key=state.chanSheet; if(!key) return '';
  const d=state.chan; const c=((d&&d.channels)||[]).find(x=>x.channel===key);
  const m=CHAN_META[key]; if(!c||!m) return '';
  const cells=c.cells||[];
  const open=cells.filter(x=>x.open).length;
  return `<div class="scrim" style="z-index:45" onclick="APP.scrimClose('closeChannel')"></div>
   <div class="sheet" style="top:140px;z-index:46;overflow:hidden">
     <div style="flex:none;padding:8px 12px 12px;border-bottom:1px solid var(--border-default)"><div class="grabber"></div>
       <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
         <button class="iconbtn" style="width:36px;height:36px;margin-left:-4px" onclick="APP.cmd('closeChannel')">${ic('x',22,2)}</button>
         <span style="flex:1;font-size:17px;font-weight:500;min-width:0">${T(m.en,m.zh)}</span><span style="width:36px;flex:none"></span></div>
       <div style="font-size:13px;color:var(--text-secondary);padding:2px 8px 0">${
         T(open+' of '+cells.length+(cells.length===1?' store open':' stores open'), cells.length+' 家门店中 '+open+' 家营业')}</div></div>
     <div style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--bg)">
       ${state.chanErr?`<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:var(--brick-tint)">
         <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>
         <span style="font-size:14px;color:var(--brick-ink)">${state.chanErr}</span></div>`:''}
       <div class="list">${cells.map((cell,i)=>{
         const busy=state.chanBusy===key+'|'+cell.storeCode;
         return `${i?'<div class="sep" style="margin-left:14px"></div>':''}
         <button ${busy||state.chanBusy?'disabled':''} onclick="APP.cmd('chanCell','${escAttr(key)}','${escAttr(cell.storeCode)}',${cell.open?'0':'1'})"
           style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;${state.chanBusy&&!busy?'opacity:.5':''}">
           <span style="font-size:15px;color:var(--text-primary);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escAttr(chanStoreName(cell))}</span>
           ${/* The state, and a chevron — not the state AND the verb. The row
                 read "Open   Close" side by side, which is a tinted pill next
                 to a plain word and still one glance away from being read as
                 two states. The row IS the control; what tapping it does is
                 named in the confirm, where there is room to say it properly. */''}
           <span style="display:flex;align-items:center;gap:9px;flex:none">
             <span class="pill" style="background:${cell.open?PILL.success[0]:PILL.danger[0]};color:${cell.open?PILL.success[1]:PILL.danger[1]}">${
               busy?T('Saving…','保存中…'):(cell.open?T('Open','营业中'):T('Closed','已关闭'))}</span>
             <span style="color:var(--text-secondary);display:flex">${ic('chevron-right')}</span></span></button>`;
       }).join('')}</div>
       ${m.mirror?`<button class="btn2" style="width:100%" onclick="APP.cmd('mirror','${m.mirror}')">${
         m.mirror==='meituan'?T('View orders from Meituan','查看美团订单'):T('View pickups','查看提货记录')}</button>`:''}
       ${noteBar(T('Closing a channel everywhere at once is on desktop.','一次性关闭整个渠道请在电脑端操作。'))}
     </div></div>`;
}
function statusSales(){
  const su=state.salesSummary; if(!su) return '';
  const n=Number(su.orders||0);
  return money0(CUR,su.revenue||0)+' '+T('today','今日')+' · '+n+' '+T(n===1?'order':'orders','单');
}
function screenSales(){
  loadChannels();
  const d=state.chan;
  if(!d) return `<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const chans=(d.channels||[]).filter(c=>CHAN_META[c.channel]);
  if(!chans.length) return nothingYet(T('No channels yet','还没有渠道'),
    T('Sales channels are connected on desktop. Once one is live it shows here.','销售渠道在电脑端连接。上线后会显示在这里。'));
  // The line above the cards states what the grid actually says: every channel
  // open everywhere, or exactly which ones are not.
  const closed=chans.filter(c=>c.integrated!==false&&!c.cardOpen);
  const head = closed.length
    ? {sev:'amber', text:T(closed.length===1
        ? CHAN_META[closed[0].channel].en+' is closed everywhere'
        : closed.length+' channels are closed everywhere',
        closed.length===1 ? CHAN_META[closed[0].channel].zh+' 已全部关闭' : closed.length+' 个渠道已全部关闭')}
    : {sev:'sage', text:T('Every channel is open','所有渠道均已开启')};
  return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:10px;background:var(--surface-raised);border-radius:14px;padding:13px 16px">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--${head.sev==='sage'?'sage':'amber'});flex:none"></span>
      <span style="font-size:14px;font-weight:500;min-width:0">${head.text}</span></div>
    ${chans.map(c=>{
      const m=CHAN_META[c.channel];
      const cells=c.cells||[];
      const open=cells.filter(x=>x.open).length;
      const notIntegrated=c.integrated===false;
      const sale=(state.sales&&m.key)?state.sales[m.key]:null;
      // Open/closed is the state that matters; a channel with no integration
      // has no state at all and says so instead of wearing a green pill.
      const st = notIntegrated ? ['muted',T('Not connected','未接入')]
        : !cells.length ? ['muted',T('No stores','没有门店')]
        : open===cells.length ? ['success',T('Open','营业中')]
        : open ? ['warning',T('Open at '+open+' of '+cells.length, cells.length+' 家中 '+open+' 家营业')]
        : ['danger',T('Closed','已关闭')];
      const line=[];
      // Today's figures, said as today's — the old line gave a bare number with
      // no window on it, which reads as all-time.
      if(sale&&sale.connected) line.push(T(sale.orders+' today · '+money0(CUR,sale.revenue), '今日 '+sale.orders+' 单 · '+money0(CUR,sale.revenue)));
      // Which stores are shut gets its OWN line, below, and is allowed to wrap.
      // It used to be a third clause on the money line — nowrap, sharing a
      // 196px box with the row's action — so "6 today · ¥143 · closed at
      // Tianhe, Panyu" clipped 66px short and the half it lost was the half it
      // exists for. Shortening the wording only moved the threshold; three
      // facts do not fit on that line at any length. This is the exception on
      // the card, not a third statistic, and it reads like one now.
      // Only when SOME are open. A channel shut everywhere already says
      // "Closed" in its pill, and listing every store underneath repeats it.
      const shut=(!notIntegrated&&cells.length&&open&&open<cells.length)?cells.filter(x=>!x.open):[];
      const shutLine=(()=>{ if(!shut.length) return '';
        const nm=c2=>LANG==='en'?(c2.nameEn||c2.name):(c2.nameCn||c2.name);
        return shut.length===1 ? T('Closed at '+nm(shut[0]), nm(shut[0])+' 已关闭')
                               : T('Closed at '+shut.map(nm).join(', '), shut.map(nm).join('、')+' 已关闭'); })();
      // One tap target per card, one destination. It used to be the mirror for
      // the two channels that have one and nothing for the other four; now
      // every channel with stores opens its own sheet, and the mirror is a row
      // inside that sheet. A channel with no integration has nothing to show
      // and stays flat.
      const go=(!notIntegrated&&cells.length)?`APP.cmd('openChannel','${c.channel}')`
              : m.mirror?`APP.cmd('mirror','${m.mirror}')`:'';
      const Tag=go?'button':'div';
      return `<${Tag} class="card" ${go?`onclick="${go}"`:''} style="display:flex;flex-direction:column;gap:12px;text-align:left;${go?'cursor:pointer;':''}padding:16px;color:var(--text-primary);width:100%">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span style="display:flex;align-items:center;gap:10px;min-width:0">
            <span style="width:36px;height:36px;border-radius:9px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex:none">${ic(m.icon)}</span>
            <span style="display:flex;align-items:center;gap:8px;min-width:0"><span style="font-size:16px;font-weight:500">${T(m.en,m.zh)}</span>
            ${m.mirror?`<span class="pill" style="background:${PILL.muted[0]};color:${PILL.muted[1]}">${T('View only','只读')}</span>`:''}</span></span>
          <span class="pill" style="background:${PILL[st[0]][0]};color:${PILL[st[0]][1]};flex:none">${st[1]}</span></div>
        ${shutLine?`<div style="font-size:13px;color:var(--amber-ink);line-height:1.45">${escAttr(shutLine)}</div>`:''}
        ${(line.length||go)?`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span class="num" style="font-size:13px;color:var(--text-secondary);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${line.join(' · ')}</span>
          ${go?`<span style="display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:500;flex:none">${
            (!notIntegrated&&cells.length)?T('Open or close','开关门店'):T('View','查看')
            }<span style="color:var(--text-secondary);display:flex">${ic('chevron-right')}</span></span>`:''}</div>`:''}
      </${Tag}>`;}).join('')}
    <div style="text-align:center;font-size:12.5px;color:var(--text-secondary)">${T('Opening and closing a channel is on desktop','渠道的开启与关闭在电脑端')}</div>
  </div>`;
}

/* ==========================================================================
   More grouped list — icons + labels 1:1 with the mockup
   ========================================================================== */
/* Everything that is not one of the five destinations, one flat level deep.
   Catalogue, Categories and Stock activity are gone from this list: they are
   sub-views of Products now, and a page reachable two ways drifts in one. */
const MORE_GROUPS=[
  /* A row is [key, icon, en, zh] and, for a destination that LEAVES this app,
     a fifth element: its href. Quick Stock is its own PWA on its own manifest,
     so it can only be linked to — and until it was, an operator who held both
     tools had no route between them in either direction.

     THE NAMED /stock ROWS CARRY ?go=, and that is what keeps them doors rather
     than signposts. /stock used to open on a launcher whose tiles were "Add
     stock" and "Kitchen queue" — the two rows right here — so landing on it
     answered a tap on either row with a menu offering both again. Each names
     the screen it is for and goes straight there now.

     TRANSFERS IS THE ONE THAT STILL WANTS THE LAUNCHER, and it is the reason
     the launcher still exists. Pick, Receive, Ask the kitchen and Ask for stock
     have no rows of their own here and no home anywhere else; the launcher is
     the screen that holds them, and it is the screen that TEACHES them — its
     tiles stay put on a quiet day, so "Nothing to pick" is what tells somebody
     the tool is there before the morning they need it. Four rows here would say
     the same thing louder and worse. */

/* MORE_GROUPS filtered to what this operator can reach, with each row resolved
   to its label and its action. Three callers — the More list, the tab bar and
   the search index — and they must agree, so none of them reads MORE_GROUPS
   directly any more. */
function moreGroups(){
  return MORE_GROUPS.map(g=>({h:g.h, rows:g.rows.filter(r=>canRoute(r[0])).map(moreRow)}))
                    .filter(g=>g.rows.length);
}
/* ONE CHEVRON FOR EVERY ROW. Quick Stock briefly wore the leaves-the-app mark,
   because it does leave — but the only thing that mark was warning about was a
   door with no way back, and it has a back link now. What is left is a
   distinction with no consequence for the person reading it: both rows open a
   tool, both come back. The mark said "this one is different" about a
   difference that had stopped existing. */
function moreRow(r){
  const label = r[0]==='stockapp' ? stockAppLabel() : [r[2],r[3]];
  /* The stock row is the one that can go either way, by the same rule the
     server picks the mode with (retail-inventory quick-stock/context): an
     operator who only ADDS gets the screen this app now carries; anyone holding
     the absolute recount still leaves for /stock, where that flow lives. */
  const inApp = r[0]==='stockapp' && stockAppInApp();
  const href = inApp ? null : (r[4]||null);
  const route = inApp ? 'stockadd' : r[0];
  return {key:r[0], icon:r[1], en:label[0], zh:label[1], href,
          cmd: href ? `APP.cmd('leave','${href}')` : `APP.cmd('push','${route}')`};
}
function moreRowsFlat(){ return moreGroups().reduce((a,g)=>a.concat(g.rows),[]); }

/* One source for setup progress, and it is the server's. The card used to
   compute a percentage from a hardcoded list of steps, so every store on earth
   read "50% set up · 3 steps left" whatever it had actually done. */
function setupState(){
  const d=state.setup;
  if(d) return {pct:d.percent, done:d.requiredDone, total:d.requiredTotal, left:Math.max(0,d.requiredTotal-d.requiredDone), real:true};
  return {pct:null, real:false};
}
/* ==========================================================================
   FAQ & help (desktop: 07-content-billing.js)
   --------------------------------------------------------------------------
   The questions were live already; what the phone dropped was the shape. Help
   is stored as TWO arrays — faq.categories and faq.questions, each question
   carrying a `cat` — and the mini app's Help screen groups by them. A flat
   list of thirty questions on a phone is a scroll; the same thirty under six
   headings is a page. A question whose category has been deleted is not hidden
   here either: it still shows, under a heading that says so, because the
   customer can still see it.
   ========================================================================== */
function screenFaq(){
  if(!state.cfg) return `<div style="padding:48px 24px;text-align:center;font-size:15px;color:var(--text-secondary)">${T('Loading…','加载中…')}</div>`;
  const qs=cfgGet('faq.questions',null);
  const cats=cfgGet('faq.categories',null);
  const list=Array.isArray(qs)?qs:[];
  if(!list.length) return nothingYet(T('No questions yet','还没有常见问题'),
    T('Questions you publish appear here, and in the mini app under Help.','发布后会出现在这里，也会出现在小程序帮助页。'));
  const catList=Array.isArray(cats)?cats:[];
  const catName=id=>{ const c=catList.find(x=>String(x.id)===String(id));
    return c ? (LANG==='en'?(c.en||c.cn||id):(c.cn||c.en||id)) : null; };
  // Group in the order the store put its categories in, then anything left.
  const groups=[];
  const used=new Set();
  for(const c of catList){
    const rows=list.filter(q=>String(q.cat||'')===String(c.id));
    rows.forEach(q=>used.add(q));
    if(rows.length) groups.push({name:catName(c.id),rows});
  }
  const rest=list.filter(q=>!used.has(q));
  if(rest.length) groups.push({name: groups.length?T('Everything else','其他'):null, rows:rest});
  let n=0;
  const row=(q)=>{ const i=n++;
    const qt=LANG==='en'?(q.q_en||q.q_cn||''):(q.q_cn||q.q_en||'');
    const at=LANG==='en'?(q.a_en||q.a_cn||''):(q.a_cn||q.a_en||'');
    return `<button onclick="APP.cmd('faqToggle',${i})" style="display:flex;flex-direction:column;gap:8px;width:100%;padding:16px;background:transparent;border:none;cursor:pointer;text-align:left;font-family:inherit">
      <span style="display:flex;align-items:center;gap:10px;width:100%">
        <span style="flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--text-primary)">${escAttr(qt)}</span>
        <span style="color:var(--text-secondary);display:flex">${ic('chevron-right')}</span></span>
      ${state.faqOpen===i?`<span style="font-size:15px;line-height:1.6;color:var(--text-secondary);white-space:pre-wrap">${escAttr(at)}</span>`:''}</button>`;
  };
  return `<div style="padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px">
    ${groups.map(g=>`<div>${g.name?`<div class="eyebrow" style="padding:2px 4px 8px">${escAttr(g.name)}</div>`:''}
      <div class="list">${g.rows.map((q,i)=>`${i?'<div class="sep" style="margin-left:14px"></div>':''}${row(q)}`).join('')}</div></div>`).join('')}
    ${desktopNote()}</div>`;
}

/* ==========================================================================
   Pop-ups (desktop: 05-marketing.js)
   --------------------------------------------------------------------------
   The phone read `enabled` and printed Live or Off from it alone — the same
   mistake the coupon list used to make, and with the same result: a pop-up
   scheduled to start next week read Live, and one whose end date passed in
   July read Live too. The desktop resolves four states from the dates, not
   one from the flag.

   It also dropped everything that says what a pop-up DOES: which pages it
   appears on, how often, and what its button opens. A pop-up is the one thing
   in this app that interrupts a customer, so those are not details.
   ========================================================================== */
const PU_PAGE={all:['All pages','全部页面'],home:['Home','首页'],shop:['Shop','商店'],
  cart:['Cart','购物车'],me:['Me','我的'],product:['Product detail','商品详情'],
  checkout:['Checkout','结账'],'order-success':['Order success','下单成功'],
  orders:['My orders','我的订单'],membership:['Membership','会员'],addresses:['Addresses','地址']};
const PU_FREQ={once:['shows once','仅一次'],daily:['daily','每天一次'],
  session:['once a session','每次会话'],every_visit:['every visit','每次访问']};
/* The desktop's four states, resolved from the dates. `enabled` alone answers
   none of the three questions that actually matter: has it started, has it
   ended, is it running right now. */
function puState(p){
  const today=shopToday();
  if(!p.enabled) return {tone:'muted', label:T('Off','已停用'), live:false, covers:null};
  // `covers` names which end of the window the pill has already spoken for, so
  // the line underneath can say the other one instead of repeating it. The card
  // used to print "Ended 2026-07-01" in the pill and "2026-07-01" again three
  // lines down — the same date twice, both in the raw column format.
  if(p.start_at&&today<p.start_at) return {tone:'clear', label:T('Starts ','待开始 ')+fmtDateOnly(p.start_at), live:false, covers:'start'};
  if(p.end_at&&today>p.end_at) return {tone:'muted', label:T('Ended ','已结束 ')+fmtDateOnly(p.end_at), live:false, covers:'end'};
  return {tone:'success', label:T('Live','进行中'), live:true, covers:null};
}
function puWindow(p,st){
  const a=p.start_at?fmtDateOnly(p.start_at):'', b=p.end_at?fmtDateOnly(p.end_at):'';
  if(st.covers==='start') return b?T('until ','至 ')+b:'';
  if(st.covers==='end')   return a?T('from ','自 ')+a:'';
  if(a&&b) return a+' – '+b;
  if(a) return T('from ','自 ')+a;
  if(b) return T('until ','至 ')+b;
  return '';
}
function puWhere(p){
  if(!p.pages||!p.pages.length) return T('No page picked','未选择页面');
  if(p.pages.indexOf('all')>=0) return T(...PU_PAGE.all);
  return p.pages.map(k=>PU_PAGE[k]?T(...PU_PAGE[k]):k).join(' · ');
}
function statusPopups(){
  const list=cfgGet('popups.list',null);
  if(!Array.isArray(list)||!list.length) return '';
  const live=list.filter(p=>puState(p).live).length;
  return T(live+' showing now',live+' 个正在展示') + ' · ' + T(list.length+' in total',list.length+' 个共计');
}

      <span style="flex:none;color:var(--brick-ink);display:flex;margin-top:2px">${ic('triangle-alert',18)}</span>

    ${list.map(p=>{
      const st=puState(p);
      const [bg,fg]=PILL[st.tone];
      const title=LANG==='en'?(p.title_en||p.title_cn||''):(p.title_cn||p.title_en||'');

        ${title?`<div style="font-size:14px">${escAttr(title)}</div>`:''}

        <div style="font-size:12.5px;color:var(--text-secondary)">

    ${noteBar(T('Pop-ups are written, scheduled and previewed on desktop.','弹窗的撰写、排期与预览在电脑端进行。'))}</div>`;
}

    const vs = d>0?T('+'+d+' vs last month','较上月 +'+d)
      : d<0?T(d+' vs last month','较上月 '+d) : T('level with last month','与上月持平');
    const paid=(Number(a.paid_out)||0)+(Number(a.lifetime_paid)||0);
    const paidSub=Number(a.lifetime_paid)>0
      ? T('incl. '+money0(CUR,a.lifetime_paid)+' lifetime','含长期分成 '+money0(CUR,a.lifetime_paid))
      : T('to referrer wallets','入推荐人钱包');
    const tile=(k,v,sub)=>`<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:3px">
