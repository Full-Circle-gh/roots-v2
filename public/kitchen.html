<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a2314">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Kitchen · 厨房</title>
<link rel="manifest" href="/kitchen-manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/kitchen-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/kitchen-icon-512.png">
<link rel="apple-touch-icon" href="/kitchen-icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/kitchen-icon-512.png">
<meta name="application-name" content="Kitchen">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<style>
:root {
  --dk: #1a2314;
  --lime: #ccd900;
  --lime-text: #6d7a2a;
  --green: #3d7a1e;
  --bg: #f6f4ee;
  --card: #ffffff;
  --border: #e6e2d6;
  --muted: #8a8678;
  --danger: #dc2626;
  --success: #16a34a;
  --warn: #b85c00;
  --sa-top: env(safe-area-inset-top, 0px);
  --sa-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--dk);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
input, textarea { font-family: inherit; -webkit-user-select: text; user-select: text; }
input:focus { outline: 3px solid var(--lime); outline-offset: -1px; }

/* Shell */
.shell {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  height: 100dvh;
  height: 100vh;
  padding-top: var(--sa-top);
}
@supports (height: 100dvh) { .shell { height: 100dvh; } }

/* Header */
.head {
  background: linear-gradient(180deg, #1a2314 0%, #1f2a18 100%);
  color: #fff;
  padding: 10px 14px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  box-shadow: 0 1px 0 rgba(0,0,0,.2);
}
.head .title {
  font-weight: 800;
  font-size: 16px;
  letter-spacing: .02em;
  display: flex; align-items: center; gap: 10px;
}
.head .title .user-pill {
  font-size: 11px;
  color: rgba(255,255,255,.55);
  font-weight: 600;
  background: rgba(255,255,255,.06);
  padding: 3px 9px;
  border-radius: 99px;
}
.head .icons { display: flex; gap: 4px; }
.head .icons button {
  width: 44px; height: 44px;
  border-radius: 10px;
  font-size: 20px;
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s ease;
}
.head .icons button:active { background: rgba(255,255,255,.18); transform: scale(.95); }
/* Header-button badge — lime pill (brand-consistent, informational
   not critical). Used for the 👥 team activity unread count. Sits in
   the top-right of the icon button without pushing the layout. */
.head-badge {
  position: absolute;
  top: 4px; right: 4px;
  min-width: 18px; height: 18px;
  padding: 0 6px;
  border-radius: 99px;
  background: var(--lime);
  color: var(--dk);
  font-size: 10px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 1.5px var(--dk), 0 1px 4px rgba(204,217,0,.4);
  pointer-events: none;
  animation: tabBadgePop .4s ease-out;
}

/* Tabs — segmented strip with a smooth lime underline that slides
   when switched. Each tab is a flex column so the bilingual labels
   stack tidily when the screen is narrow. The Requests notification
   indicator is a tight lime pill in the top-right corner instead of
   a chunky red number that fights with the dark header. */
.tabs {
  background: var(--dk);
  display: flex;
  padding: 0 6px;
  gap: 2px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.tab {
  flex: 1;
  padding: 11px 6px 9px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,.55);
  border-bottom: 3px solid transparent;
  text-align: center;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
  position: relative;
  border-radius: 8px 8px 0 0;
  letter-spacing: .01em;
}
.tab.active { color: var(--lime); border-bottom-color: var(--lime); }
.tab:active { background: rgba(255,255,255,.05); }
.tab:hover:not(.active) { color: rgba(255,255,255,.78); }
/* Notification indicator — small lime pill nested in the tab's top-right
   corner. Tight (16px high), tabular-nums for tidy 1- and 2-digit
   counts. Pulses once when the count changes via JS (see beep `msg`
   path). Sits ABSOLUTE so it doesn't push the tab label around. */
.tab-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  top: 6px; right: 6px;
  min-width: 18px;
  height: 18px;
  padding: 0 6px;
  border-radius: 99px;
  background: var(--lime);
  color: var(--dk);
  font-size: 10px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  box-shadow: 0 1px 4px rgba(204,217,0,.45);
  animation: tabBadgePop .4s ease-out;
}
@keyframes tabBadgePop {
  0%   { transform: scale(0.4); opacity: 0; }
  60%  { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* Body */
.body {
  background: var(--bg);
  overflow-y: auto;
  padding: 10px 12px 100px;
  min-height: 0;
}

/* Empty hint */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 24px 0 8px;
  pointer-events: none;
}
.empty .icon { font-size: 56px; opacity: .12; line-height: 1; }
.empty .hint {
  font-size: 13px; color: var(--muted); font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px;
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 999px;
}
.body.tappable { cursor: pointer; }
.body.tappable > .line { cursor: default; }

/* Cart line */
.line {
  background: var(--card);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 8px;
  box-shadow: 0 1px 3px rgba(26,35,20,.04);
  animation: lineIn .22s cubic-bezier(.2,.7,.4,1);
}
@keyframes lineIn { from { transform: translateY(-8px) scale(.97); opacity: 0 } to { transform: none; opacity: 1 } }
.line.popped { animation: pop .18s ease-out; }
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.025); background: rgba(204,217,0,.18); }
  100% { transform: scale(1); }
}
.line .top {
  display: flex; align-items: flex-start; gap: 10px;
  position: relative;
}
.line .top .info { flex: 1; min-width: 0; padding-right: 32px; }
.line .name { font-weight: 700; font-size: 15px; line-height: 1.25; word-break: break-word; }
.line .name .cn { color: var(--muted); font-weight: 500; font-size: 13px; }
.line .meta { font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.line .meta .last { color: var(--green); font-weight: 700; }
.line .meta .last.warn { color: var(--warn); }
.line .meta .last.cold { color: var(--danger); }
.line .remove {
  position: absolute;
  top: -2px; right: -4px;
  width: 32px; height: 32px;
  font-size: 16px;
  color: var(--danger);
  border-radius: 8px;
}
.line .remove:active { background: rgba(220,38,38,.08); }
.line .ctrl {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px;
}
.qty-btn {
  width: 42px; height: 42px;
  border-radius: 10px;
  background: var(--bg);
  font-size: 22px;
  font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.qty-btn:active { background: var(--border); transform: scale(.96); }
.qty-input {
  width: 90px; height: 42px;
  border: 2px solid var(--border);
  border-radius: 10px;
  text-align: center;
  font-size: 17px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  padding: 0 8px;
}
.qty-input:focus { border-color: var(--lime); outline: none; }
.unit-pill {
  background: var(--bg);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 8px;
  white-space: nowrap;
}
.note-input {
  width: 100%;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 14px;
  background: var(--bg);
  font-family: inherit;
}
.note-input:focus { outline: none; border-color: var(--lime); background: #fff; }

/* Footer */
.foot {
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 14px calc(12px + var(--sa-bot));
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 14px;
  box-shadow: 0 -8px 24px rgba(0,0,0,.04);
}
.foot .info { display: flex; flex-direction: column; line-height: 1.2; }
.foot .info .lbl { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.foot .info .val { font-size: 22px; font-weight: 900; color: var(--dk); margin-top: 2px; font-variant-numeric: tabular-nums; }
.submit-btn {
  background: var(--dk);
  color: var(--lime);
  border-radius: 14px;
  padding: 18px 14px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .03em;
  text-transform: uppercase;
  transition: transform .12s, opacity .12s;
}
.submit-btn:disabled { opacity: .3; }
.submit-btn:active:not(:disabled) { transform: scale(.97); }

/* Requests tab — sub-tab pill row + empty/loading card. Matches the
   feel of the Order/Production tabs while making the workflow context
   crystal clear at the top of the screen. */
.k-req-subtabs {
  display: flex;
  gap: 4px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(26,35,20,.04);
}
.k-req-subtabs button {
  flex: 1;
  padding: 10px 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  border-radius: 9px;
  transition: background .15s ease, color .15s ease;
}
.k-req-subtabs button.active {
  background: rgba(204,217,0,.18);
  color: var(--dk);
}
.k-req-subtabs button:active:not(.active) { background: rgba(0,0,0,.04); }
.empty-card {
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 16px;
  padding: 44px 24px 38px;
  text-align: center;
  color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  margin-top: 8px;
}
.empty-card .empty-icon-wrap {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 6px;
}
.empty-card .empty-icon { font-size: 38px; line-height: 1; opacity: .55; }
.empty-card .empty-lead { font-size: 15px; font-weight: 800; color: var(--dk); letter-spacing: .01em; }
.empty-card .empty-sub  { font-size: 12.5px; line-height: 1.5; max-width: 280px; }

/* Production tab specifics */
.prod-form {
  background: var(--card);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex; flex-direction: column; gap: 8px;
}
.prod-form input, .prod-form select {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: inherit;
  background: #fff;
}
.prod-form input:focus, .prod-form select:focus { outline: none; border-color: var(--lime); }
.prod-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.prod-form .full { grid-column: 1 / -1; }
.prod-batch {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  background: var(--card);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 6px;
  align-items: center;
}
.prod-batch .b-name { font-weight: 700; font-size: 14px; }
.prod-batch .b-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.prod-batch .b-amt {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  font-size: 14px;
}

/* Overlays — mirror POS pattern */
.ov-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 100; display: none;
  animation: fade .15s ease;
}
.ov-backdrop.visible { display: block; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

/* z-index 101 to sit firmly above the sticky footer + any other in-page
   layer. Without this, on some Android Chrome builds the .foot's box-
   shadow stacked above the overlay and clipped the last search results. */
.ov {
  position: fixed; inset: 0;
  background: var(--card);
  z-index: 101;
  display: none;
  flex-direction: column;
  padding-bottom: var(--sa-bot);
  animation: slideUp .22s cubic-bezier(.2,.7,.4,1);
}
.ov.visible { display: flex; }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: none } }
@media (min-width: 600px) {
  .ov {
    inset: auto;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, 92vw);
    max-height: 80vh;
    border-radius: 18px;
  }
  .ov.visible { animation: fadeUp .22s cubic-bezier(.2,.7,.4,1); }
  @keyframes fadeUp {
    from { transform: translate(-50%, calc(-50% + 12px)); opacity: 0 }
    to   { transform: translate(-50%, -50%); opacity: 1 }
  }
}
.ov-head {
  padding: 14px 16px 8px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.ov-title { font-weight: 800; font-size: 15px; }
.ov-close {
  width: 36px; height: 36px;
  border-radius: 10px;
  font-size: 18px;
  color: var(--muted);
}
.ov-close:active { background: var(--bg); }
/* Extra bottom padding so the last search-result row is never partially
   covered by the on-screen keyboard, the iOS home indicator, or the
   page's sticky footer when the overlay is mid-animation. */
.ov-body { padding: 14px 16px 60px; overflow-y: auto; flex: 1; min-height: 0; }
.ov-input {
  width: 100%;
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 18px;
  font-weight: 600;
  font-family: inherit;
  background: #fff;
  position: sticky;
  top: 0; z-index: 2;
}
.ov-input:focus { outline: none; border-color: var(--lime); }

.search-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 4px;
  background: var(--bg);
  cursor: pointer;
}
.search-row:active { background: var(--border); }
.search-row.in-cart { opacity: .55; }
.search-row .info { flex: 1; min-width: 0; }
.search-row .nm { font-weight: 700; font-size: 15px; }
.search-row .mt { font-size: 11px; color: var(--muted); margin-top: 2px; }
.search-row .last { font-size: 11px; color: var(--green); font-weight: 700; white-space: nowrap; }
.search-empty { padding: 30px; text-align: center; color: var(--muted); font-size: 14px; }

/* Toast */
.toast-wrap {
  position: fixed; bottom: calc(120px + var(--sa-bot));
  left: 50%; transform: translateX(-50%);
  z-index: 60; pointer-events: none;
  display: flex; flex-direction: column; gap: 8px;
  width: calc(100% - 32px); max-width: 420px;
}
.toast {
  background: var(--dk); color: #fff;
  padding: 14px 16px; border-radius: 14px;
  font-size: 14px; font-weight: 700;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  pointer-events: auto;
  animation: toastIn .25s ease;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
@keyframes toastIn { from { transform: translateY(20px); opacity: 0 } to { transform: none; opacity: 1 } }

/* Scan pulse — silent ambient feedback when a barcode lands */
/* ── Floating "+" Add button — always visible regardless of how many
   items are in the cart, so users don't have to scroll past their list
   to find an empty spot to tap. ── */
.add-fab {
  position: fixed;
  right: 16px;
  bottom: calc(96px + var(--sa-bot));
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--lime), #a8b800);
  color: var(--dk);
  font-size: 30px;
  font-weight: 900;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 22px rgba(204,217,0,.45), 0 2px 8px rgba(26,35,20,.18);
  border: 2px solid rgba(255,255,255,.5);
  cursor: pointer;
  z-index: 60;
  transition: transform .15s, box-shadow .2s;
}
.add-fab.visible { display: inline-flex; }
.add-fab:active { transform: scale(.9); }
.add-fab:not(.has-items) { animation: fabPulse 2.4s ease-in-out infinite; }
@keyframes fabPulse {
  0%, 100% { box-shadow: 0 8px 22px rgba(204,217,0,.45), 0 2px 8px rgba(26,35,20,.18), 0 0 0 0 rgba(204,217,0,.6); }
  60%      { box-shadow: 0 8px 22px rgba(204,217,0,.45), 0 2px 8px rgba(26,35,20,.18), 0 0 0 14px rgba(204,217,0,0); }
}
@media (min-width: 600px) {
  .add-fab.visible { bottom: calc(108px + var(--sa-bot)); right: 24px; }
}

.scan-pulse {
  position: fixed; top: var(--sa-top); left: 0; right: 0; height: 3px;
  background: var(--lime); transform: scaleX(0);
  transform-origin: left; z-index: 70; pointer-events: none;
}
.scan-pulse.fire { animation: pulse .45s ease-out; }
@keyframes pulse {
  0%   { transform: scaleX(0); opacity: 1 }
  40%  { transform: scaleX(1); opacity: 1 }
  100% { transform: scaleX(1); opacity: 0 }
}
</style>
</head>
<body>
<div class="shell">

  <header class="head">
    <div class="title">
      🍳 Kitchen · 厨房<span class="user-pill" id="userPill"></span>
    </div>
    <div class="icons">
      <button id="searchBtn" title="Search · 搜索">🔍</button>
      <button id="teamBtn" title="Team activity · 团队动态" style="position:relative">👥<span id="teamBadge" class="head-badge" style="display:none">0</span></button>
      <button id="moreBtn"   title="More · 更多">⋯</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" id="tabOrder" data-tab="order">🛒 订货 Order</button>
    <button class="tab"        id="tabProd"  data-tab="prod">📋 生产 Production</button>
    <button class="tab" id="tabReq" data-tab="req" style="display:none">
      📥 请求 Requests
      <span id="reqBadge" class="tab-badge" style="display:none">0</span>
    </button>
  </nav>

  <main class="body" id="body">
    <!-- rendered per tab -->
  </main>

  <footer class="foot" id="foot">
    <!-- rendered per tab -->
  </footer>
</div>

<!-- Floating "+ Add" — visible only on the Order tab so users can
     always add another ingredient regardless of how full the cart is. -->
<!-- Floating "+" FAB removed — replaced by the inline "+ Add Item" button
     rendered below the cart. Inline button is more discoverable and avoids
     covering the search hint when the cart is empty. -->

<div class="scan-pulse" id="scanPulse"></div>

<!-- Search overlay (for Order tab) -->
<div class="ov-backdrop" id="ovBackdrop"></div>
<div class="ov" id="searchOv">
  <div class="ov-head">
    <div class="ov-title">🔍 Add Ingredient · 添加食材</div>
    <button class="ov-close" data-close>✕</button>
  </div>
  <div class="ov-body">
    <input id="searchInput" class="ov-input" placeholder="Name 名称 / SKU / Barcode 条码"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           inputmode="search">
    <div id="searchList" style="margin-top:10px"></div>
  </div>
</div>

<!-- Recipe picker overlay (for Production tab) -->
<div class="ov" id="recipeOv">
  <div class="ov-head">
    <div class="ov-title">📖 Pick Recipe · 选择食谱</div>
    <button class="ov-close" data-close>✕</button>
  </div>
  <div class="ov-body">
    <input id="recipeSearchInput" class="ov-input" placeholder="Name 名称 / SKU"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           inputmode="search">
    <div id="recipeSearchList" style="margin-top:10px"></div>
  </div>
</div>

<!-- More overlay -->
<div class="ov" id="moreOv">
  <div class="ov-head">
    <div class="ov-title">Settings · 设置</div>
    <button class="ov-close" data-close>✕</button>
  </div>
  <div class="ov-body" id="moreBody"></div>
</div>

<!-- Team activity overlay — opens from the 👥 button in the header.
     Lists every kitchen order placed in the last 7 days by the team
     (PO number · who · when · items). Same data as the search-overlay
     surfacing; this view is "browse" rather than "pick", so staff can
     check who's ordering what without committing to add anything. -->
<div class="ov" id="teamOv">
  <div class="ov-head">
    <div class="ov-title">👥 Team activity · 团队动态 (7d)</div>
    <button class="ov-close" data-close>✕</button>
  </div>
  <div class="ov-body" id="teamBody"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
'use strict';
// ─── State ───────────────────────────────────────────────────────────
let _user        = null;
let _ingredients = [];          // cached active ingredients
let _recipes     = [];          // cached active recipes
let _lastQty     = {};          // ingredient_id → { qty, unit, last_date, source }
let _orderCart   = [];          // { ing, qty, note }
let _todaysProduction = [];     // production_batches for today
let _pickedRecipe = null;       // selected recipe for the production form
let _tab         = 'order';
let _scanBuf     = '';
let _scanBufTimer = null;
// Team-order feed — last 7 days of kitchen orders from ALL staff. Used to
// (a) render a "team activity" strip at the top of the Order tab and
// (b) warn the user before they re-order something already in flight.
// Refreshed on app open and after each successful submit.
let _teamFeed = { orders: [], by_ingredient: {} };
// Per-user "last seen" timestamp — when the user last opened the team
// overlay. The badge counts orders by other staff with created_at > this
// timestamp, so the dot only flags genuinely new activity instead of
// permanently shouting about every in-flight order.
const _teamSeenKey = () => 'kitchen_team_seen_' + (_user?.id || 'anon');
function _teamLastSeen() {
  try { return parseInt(localStorage.getItem(_teamSeenKey()) || '0', 10) || 0; } catch { return 0; }
}
function _teamMarkSeen() {
  try { localStorage.setItem(_teamSeenKey(), String(Date.now())); } catch {}
  paintTeamBadge();
}
async function refreshTeamFeed() {
  try {
    const r = await fetch('/api/kitchen/recent-team-orders?days=7');
    const d = await r.json();
    if (d?.success) _teamFeed = { orders: d.orders || [], by_ingredient: d.by_ingredient || {} };
  } catch { /* best-effort */ }
  paintTeamBadge();
}
function paintTeamBadge() {
  const badge = document.getElementById('teamBadge');
  if (!badge) return;
  // Count orders by OTHER staff that arrived since the user last opened
  // the overlay. First-time users (no stored timestamp) see a soft dot
  // only when there's any activity — they haven't seen it yet by
  // definition. Self-orders never count toward unread.
  const lastSeen = _teamLastSeen();
  const newOnes = (_teamFeed.orders || []).filter(o => {
    if (o.is_self) return false;
    const ts = o.created_at ? new Date(o.created_at.replace(' ', 'T') + (o.created_at.includes('Z')?'':'Z')).getTime() : 0;
    return ts > lastSeen;
  }).length;
  if (newOnes > 0) {
    badge.textContent = newOnes > 99 ? '99+' : String(newOnes);
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
}
function openTeamOverlay() {
  document.getElementById('ovBackdrop').classList.add('visible');
  document.getElementById('teamOv').classList.add('visible');
  // Mark everything currently in the feed as seen — opening the
  // overlay IS the user acknowledging the activity.
  _teamMarkSeen();
  const body = document.getElementById('teamBody');
  if (!body) return;
  const orders = _teamFeed.orders || [];
  if (!orders.length) {
    body.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">
      No kitchen orders in the last 7 days.<br>过去 7 天内无厨房订货。
    </div>`;
    return;
  }
  // Card per order. Click toggles the item list (collapsed by default).
  body.innerHTML = orders.map((o, idx) => {
    const ago = _teamAgoBilingual(o.created_at);
    const youTag = o.is_self
      ? '<span style="background:rgba(204,217,0,.18);color:var(--lime-text);font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;margin-left:6px">you · 我</span>'
      : '';
    const statusBilingual = _teamStatusBilingual(o.status);
    const statusBg =
      (o.status || '').toLowerCase() === 'received' ? 'rgba(61,122,30,.12)' :
      (o.status || '').toLowerCase() === 'cancelled' ? 'rgba(220,38,38,.12)' :
      'rgba(204,217,0,.15)';
    return `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px">
        <div onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'" style="display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:800">${esc(o.po_number)} · ${esc(o.display_name || o.username || '?')}${youTag}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${ago}</div>
          </div>
          <span style="font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:${statusBg}">${statusBilingual}</span>
          <span style="color:var(--muted);font-size:12px">▾</span>
        </div>
        <div style="display:none;padding:0 14px 12px;border-top:1px solid var(--border);font-size:12px">
          ${(o.items || []).map(it => `<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed rgba(0,0,0,.06)">
            <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--muted);background:rgba(0,0,0,.04);padding:2px 7px;border-radius:5px;font-weight:700;flex-shrink:0;line-height:1.45">${esc(it.sku || '—')}</span>
            <span style="flex:1;min-width:0;line-height:1.35">
              <div style="font-weight:700">${esc(it.name_en || '—')}</div>
              ${it.name_cn ? `<div style="font-size:11px;color:var(--muted);margin-top:1px">${esc(it.name_cn)}</div>` : ''}
            </span>
            <span style="color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;font-weight:600">${it.qty} ${esc(it.unit||'')}</span>
          </div>`).join('') || '<div style="color:var(--muted);padding:6px 0">No items · 无项目</div>'}
        </div>
      </div>`;
  }).join('');
}

// ─── Init ────────────────────────────────────────────────────────────
(async function init() {
  const r = await fetch('/api/auth/me').then(r => r.json()).catch(() => ({}));
  _user = r?.user;
  if (!_user) { location.href = '/login?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
  // Remember this is where the user was last working — login.html
  // reads `last_app` to send them back here next time.
  try { localStorage.setItem('last_app', '/kitchen'); } catch {}
  const perms = _user.permissions || {};
  if (_user.role !== 'admin' && !perms.kitchen) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center"><h1>403</h1><p>No kitchen access · 无厨房权限</p><p><a href="/">← Back · 返回</a></p></div>';
    return;
  }
  document.getElementById('userPill').textContent = _user.displayName || _user.username || '';

  // Tab buttons
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });
  document.getElementById('searchBtn').addEventListener('click', openSearch);
  document.getElementById('teamBtn').addEventListener('click', openTeamOverlay);
  document.getElementById('moreBtn').addEventListener('click', openMore);
  const fabEl = document.getElementById('addFab');
  if (fabEl) fabEl.addEventListener('click', openSearch);
  document.getElementById('ovBackdrop').addEventListener('click', closeAllOv);
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeAllOv));
  document.getElementById('searchInput').addEventListener('input', onSearchInput);
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const top = document.querySelector('#searchList .search-row');
      if (top) top.click();
    }
  });
  document.getElementById('recipeSearchInput').addEventListener('input', onRecipeSearchInput);
  document.getElementById('recipeSearchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const top = document.querySelector('#recipeSearchList .search-row');
      if (top) top.click();
    }
  });

  // Document-level keystroke capture for the barcode gun (Order tab only).
  // Same pattern as the POS — buffer printable chars, commit on Enter,
  // drop on idle so accidental keystrokes don't accumulate.
  document.addEventListener('keydown', (e) => {
    if (_tab !== 'order') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter') {
      if (_scanBuf) { lookupAndAddByBarcode(_scanBuf); _scanBuf = ''; }
      return;
    }
    if (e.key.length === 1) {
      _scanBuf += e.key;
      if (_scanBufTimer) clearTimeout(_scanBufTimer);
      _scanBufTimer = setTimeout(() => { _scanBuf = ''; }, 300);
    }
  });

  // Pre-fetch ingredients + last-qty + recipes + team feed in parallel
  await Promise.all([
    fetch('/api/ingredients').then(r => r.json()).then(d => { _ingredients = (d.data || []).filter(i => (i.is_active==null) || i.is_active); }).catch(() => {}),
    fetch('/api/kitchen/last-qty').then(r => r.json()).then(d => { _lastQty = d.data || {}; }).catch(() => {}),
    fetch('/api/kitchen/recipes').then(r => r.json()).then(d => { _recipes = d.data || []; }).catch(() => {}),
    refreshTodaysProduction(),
    refreshTeamFeed(),
  ]);

  switchTab('order');

  // Show the Requests tab and start polling only for users who can act
  // on warehouse→kitchen requests. The tab is hidden by default (the
  // bulk of kitchen staff don't need it).
  const _kPerms = _user.permissions || {};
  if (_user.role === 'admin' || _kPerms.kitchen_inbox) {
    const reqTab = document.getElementById('tabReq');
    if (reqTab) reqTab.style.display = '';
    refreshKitchenRequests();
    _startKitchenReqPolling();
    _connectKitchenEventStream();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshKitchenRequests({ silent: true });
    });
  }

  // Register SW + auto-reload on update. SW is required for the PWA
  // install banner; without it Chrome treats us as a regular page.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data?.type === 'sw-updated') location.reload();
    });
  }

  // so kitchen staff can be paged about PO state changes (delivered,
  // ordered) and any future kitchen-specific server pushes without the
  // app having to be open.
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    _enableWebPush().catch(() => {});
  } else if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    // Prompt once a few seconds after launch so the kitchen actually
    // ends up with a push subscription. Without this they only get the
    // silent in-app banner and miss everything when the app is closed.
    setTimeout(() => {
      Notification.requestPermission().then((p) => {
        if (p === 'granted') _enableWebPush().catch(() => {});
      }).catch(() => {});
