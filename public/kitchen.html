})();
function _urlBase64ToUint8Array(base64) {
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const b64 = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(b64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function _enableWebPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const r = await fetch('/api/push/vapid-key');
  const d = await r.json();
  if (!d?.enabled || !d.publicKey) return;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: _urlBase64ToUint8Array(d.publicKey),
    });
  }
  await fetch('/api/push/subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sub.toJSON()),
  });
}

// ─── Tab switching ──────────────────────────────────────────────────
function switchTab(tab) {
  _tab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  // FAB only relevant on the Order tab (where there's a cart to add to).
  // On Production it would be misleading.
  const fab = document.getElementById('addFab');
  if (fab) fab.classList.toggle('visible', tab === 'order');
  if (tab === 'order')      renderOrderTab();
  else if (tab === 'prod')  renderProductionTab();
  else if (tab === 'req')   renderRequestsTab();
}

// ─── Warehouse → Kitchen incoming requests ─────────────────────────
// Mirrors the warehouse-side fulfilment flow: kitchen sees orders the
// warehouse pushed (because items are missing for an outbound order or
// just for shelf restock), per-item check-off, then "Mark Prepared".
let _kReqOrders = [];
let _kReqTab = 'active';   // active | history
let _kReqPollTimer = null;

async function refreshKitchenRequests({ silent } = {}) {
  try {
    const [aRes, hRes] = await Promise.all([
      fetch('/api/restock?to_role=kitchen&tab=active').then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/restock?to_role=kitchen&tab=history').then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    if (!aRes || !hRes) return;
    const active = (aRes.data || []).filter(o => o.status !== 'draft');
    const history = (hRes.data || []);
    const prevIds = new Set(_kReqOrders.map(o => o.id));
    _kReqOrders = _kReqTab === 'active' ? active : history;
    // Badge on the tab header — count of pending (status != prepared)
    const pending = active.length;
    const badge = document.getElementById('reqBadge');
    if (badge) {
      if (pending > 0) {
        badge.style.display = 'inline-flex';
        badge.textContent = pending > 99 ? '99+' : String(pending);
      } else {
        badge.style.display = 'none';
      }
    }
    if (_tab === 'req') renderRequestsTab();
    if (silent) {
      const newOnes = active.filter(o => !prevIds.has(o.id) && o.created_by !== _user?.id);
      if (newOnes.length > 0) {
        try { /* msg-style chime */
          if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (_audioCtx.state === 'suspended') _audioCtx.resume().catch(() => {});
          const ctx = _audioCtx;
          const t0 = ctx.currentTime;
          [1319, 1568, 2093].forEach((f, i) => {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'triangle'; o.frequency.value = f;
            const t = t0 + i * 0.09;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.32, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0008, t + 0.22);
            o.start(t); o.stop(t + 0.24);
          });
        } catch {}
      }
    }
  } catch {}
}
// Server-Sent Events — sub-second push from the server when a
// warehouse user fires a request to the kitchen. Browser auto-
// reconnects on disconnect; the 30s polling fallback above catches
// anything that arrives during the brief reconnect window.
let _kEventStream = null;
function _connectKitchenEventStream() {
  if (!_user) return;
  try {
    if (_kEventStream) { try { _kEventStream.close(); } catch {} }
    _kEventStream = new EventSource('/api/events');
    _kEventStream.addEventListener('restock', (e) => {
      try {
        const evt = JSON.parse(e.data);
        if (!evt) return;
        // Server already filters to kitchen_inbox holders, but double-
        // check the direction here so an unrelated store→warehouse
        // event (in case of admin overlap) doesn't trigger a refresh.
        if (evt.to_role !== 'kitchen') return;
        // Pull fresh data right away — banner / chime fires inside
        // refreshKitchenRequests when it detects the new id.
        refreshKitchenRequests({ silent: true });
      } catch {}
    });
    _kEventStream.onerror = () => { /* EventSource auto-reconnects */ };
  } catch {}
}
function _startKitchenReqPolling() {
  if (_kReqPollTimer) clearInterval(_kReqPollTimer);
  _kReqPollTimer = setInterval(() => {
    if (document.hidden) return;
    refreshKitchenRequests({ silent: true });
  }, 30000);
}

function renderRequestsTab() {
  const body = document.getElementById('body');
  if (!body) return;
  const rows = _kReqOrders;
  const tabBar = `
    <div class="k-req-subtabs">
      <button class="${_kReqTab==='active' ?'active':''}" onclick="_kReqSetTab('active')">📥 Active · 进行中</button>
      <button class="${_kReqTab==='history'?'active':''}" onclick="_kReqSetTab('history')">✅ History · 已完成</button>
    </div>`;
  if (rows.length === 0) {
    body.innerHTML = tabBar + `
      <div class="empty-card">
        <div class="empty-icon-wrap"><span class="empty-icon">${_kReqTab==='active' ? '✨' : '📦'}</span></div>
        <div class="empty-lead">${_kReqTab==='active' ? 'All caught up · 暂无待处理' : 'No history yet · 暂无历史'}</div>
        <div class="empty-sub">${_kReqTab==='active' ? 'Warehouse hasn’t requested anything from the kitchen yet · 仓库暂无新的厨房请求' : 'Completed requests will appear here · 已处理的请求会显示在这里'}</div>
      </div>`;
    return;
  }
  body.innerHTML = tabBar + rows.map(o => {
    const purpose = o.purpose === 'order' ? '📦 For order · 用于发货' : o.purpose === 'shelf' ? '🛒 For shelf · 货架补货' : '';
    const purposeChip = purpose ? `<span style="display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:${o.purpose==='order'?'rgba(204,217,0,.15)':'rgba(37,99,235,.10)'};color:var(--text);margin-top:4px">${purpose}</span>` : '';
    const statusPill = o.status === 'sent' ? '<span style="font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(37,99,235,.18);color:#1d4ed8">Sent · 已发</span>'
                    : o.status === 'received' ? '<span style="font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(224,184,80,.20);color:#92660d">Received · 处理中</span>'
                    : o.status === 'prepared' ? '<span style="font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(109,179,63,.18);color:#3d7a1e">Prepared · 已备货</span>'
                    : `<span style="font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.06);color:var(--muted)">${o.status}</span>`;
    const total = o.item_count || 0;
    const done  = o.checked_count || 0;
    const pct   = total > 0 ? Math.round((done/total)*100) : 0;
    return `<div onclick="openKitchenReq(${o.id})" style="cursor:pointer;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:14px">${esc(o.rs_number || ('#'+o.id))} <span style="font-weight:600;color:var(--muted);font-size:12px">· ${total} item${total===1?'':'s'} 件</span></div>
          <div style="font-size:11px;color:var(--muted);margin-top:3px">From warehouse · 来自仓库 · ${esc((o.sent_at||'').slice(0,16).replace('T',' '))}</div>
          <div>${purposeChip}</div>
        </div>
        ${statusPill}
      </div>
      ${total>0?`<div style="margin-top:10px;height:6px;background:rgba(0,0,0,.06);border-radius:99px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--lime),var(--lime-2));transition:width .3s"></div>
      </div><div style="font-size:11px;color:var(--muted);margin-top:4px;font-weight:600">${done}/${total} packed · 已配 ${done}/${total}</div>`:''}
    </div>`;
  }).join('');
}
function _kReqSetTab(t) {
  if (t !== 'active' && t !== 'history') return;
  if (_kReqTab === t) return;
  _kReqTab = t;
  refreshKitchenRequests();
}
// Currently-open kitchen request. Held in memory so item toggles update
// the UI without a refetch, and so the action button can morph in place
// as status advances (sent → received → prepared) without closing the
// modal between steps.
let _kReqOpenOrder = null;

async function openKitchenReq(id) {
  const r = await fetch('/api/restock/' + id);
  const d = await r.json();
  if (!d?.success) return;
  _kReqOpenOrder = d.data;
  // Default every item to checked on first open — kitchen usually has
  // everything; they only uncheck what's missing. Fires once per order
  // (skipped if any item already touched, or if status is terminal).
  const o = _kReqOpenOrder;
  if (o.status !== 'prepared' && o.items?.length && o.items.every(it => !it.is_checked)) {
    o.items.forEach(it => {
      it.is_checked = 1;
      fetch(`/api/restock/${o.id}/item/${it.id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_checked: true }),
      }).catch(() => {});
    });
  }
  document.getElementById('ovBackdrop').classList.add('visible');
  document.getElementById('moreOv').classList.add('visible');
  _renderKitchenReqBody();
}

function _renderKitchenReqBody() {
  const o = _kReqOpenOrder;
  if (!o) return;
  const items = o.items || [];
  const total = items.length;
  const checked = items.filter(it => it.is_checked).length;
  const allDone = total > 0 && checked === total;
  // Items are pickable from the moment the order opens — kitchen often
  // wants to scan the list and tick off what's already on hand before
  // formally tapping "In Preparation". Locked only once status hits
  // 'prepared' (terminal).
  const canCheck = o.status === 'sent' || o.status === 'received';
  const purpose = o.purpose === 'order' ? '📦 For an outgoing order · 用于发货'
                 : o.purpose === 'shelf' ? '🛒 For shelf restock · 货架补货' : '';
  const ov = document.getElementById('moreOv');
  const titleEl = ov.querySelector('.ov-title');
  const body = ov.querySelector('.ov-body') || document.getElementById('moreBody');
  if (titleEl) titleEl.textContent = `📥 ${o.rs_number || ('#'+o.id)}`;

  let actionHtml;
  if (o.status === 'sent') {
    actionHtml = `<button class="submit-btn" style="width:100%" onclick="_kReqMarkReceived()">▶ In Preparation · 开始备货</button>`;
  } else if (o.status === 'received') {
    actionHtml = `<button class="submit-btn" style="width:100%;${allDone?'':'opacity:.45;cursor:not-allowed'}" ${allDone?'':'disabled'} onclick="_kReqMarkPrepared()">✓ Mark Prepared · 标记已备好${total>0?' ('+checked+'/'+total+')':''}</button>`;
  } else {
    actionHtml = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:8px">✓ Complete · 已完成</div>';
  }

  const checkAllBtn = (canCheck && total > 0)
    ? `<button onclick="_kReqCheckAll(${!allDone})" style="background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit">${allDone ? '☐ Uncheck all · 取消全选' : '✓ Check all · 全选'}</button>`
    : '';

  body.innerHTML = `
    ${purpose ? `<div style="padding:10px 12px;background:${o.purpose==='order'?'rgba(204,217,0,.10)':'rgba(37,99,235,.08)'};border-radius:10px;font-size:13px;font-weight:700;margin-bottom:12px">${purpose}</div>` : ''}
    ${o.notes ? `<div style="padding:8px 12px;background:rgba(204,217,0,.08);border-radius:10px;font-size:12px;margin-bottom:10px"><strong>📝 Note · 备注:</strong> ${esc(o.notes)}</div>` : ''}
    <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 6px;gap:8px">
      <div style="font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Items · 物料 (${total})</div>
      ${checkAllBtn}
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
      ${items.map((it, idx) => `
        <div ${canCheck ? `onclick="_kReqToggleItem(${idx})"` : ''} style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:${it.is_checked?'rgba(109,179,63,.10)':'var(--card)'};border:1.5px solid ${it.is_checked?'rgba(109,179,63,.4)':'var(--border)'};border-radius:10px;cursor:${canCheck?'pointer':'default'};transition:background .15s,border-color .15s;user-select:none">
          <input type="checkbox" ${it.is_checked?'checked':''} ${canCheck?'':'disabled'} style="width:20px;height:20px;flex-shrink:0;accent-color:var(--lime);margin-top:2px;pointer-events:none">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:14px;line-height:1.35">${esc(it.product_cn || it.product_name || '?')}${it.product_cn && it.product_name ? ' <span style="color:var(--muted);font-weight:500;font-size:12px">· ' + esc(it.product_name) + '</span>' : ''}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${it.sku ? esc(it.sku) + ' · ' : ''}${it.notes ? esc(it.notes) : ''}</div>
          </div>
          <div style="font-weight:800;font-variant-numeric:tabular-nums;font-size:14px">${+it.qty_requested}${it.unit?' '+esc(it.unit):''}</div>
        </div>
      `).join('')}
    </div>
    ${actionHtml}`;
}

function _kReqToggleItem(idx) {
  const o = _kReqOpenOrder;
  if (!o || (o.status !== 'sent' && o.status !== 'received')) return;
  const it = o.items?.[idx];
  if (!it) return;
  it.is_checked = it.is_checked ? 0 : 1;
  _renderKitchenReqBody();
  fetch(`/api/restock/${o.id}/item/${it.id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ is_checked: !!it.is_checked }),
  }).catch(() => {});
}

function _kReqCheckAll(checkOn) {
  const o = _kReqOpenOrder;
  if (!o || (o.status !== 'sent' && o.status !== 'received')) return;
  const newVal = checkOn ? 1 : 0;
  (o.items || []).forEach(it => {
    if (!!it.is_checked === !!newVal) return;
    it.is_checked = newVal;
    fetch(`/api/restock/${o.id}/item/${it.id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ is_checked: !!newVal }),
    }).catch(() => {});
  });
  _renderKitchenReqBody();
}

async function _kReqMarkReceived() {
  const o = _kReqOpenOrder;
  if (!o) return;
  const r = await fetch(`/api/restock/${o.id}/status`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'received' }),
  });
  const d = await r.json();
  if (!d?.success) return alert(d?.error || 'Failed · 失败');
  o.status = 'received';
  _renderKitchenReqBody();
  refreshKitchenRequests();
}

async function _kReqMarkPrepared() {
  const o = _kReqOpenOrder;
  if (!o) return;
  const r = await fetch(`/api/restock/${o.id}/status`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'prepared' }),
  });
  const d = await r.json();
  if (!d?.success) return alert(d?.error || 'Failed · 失败');
  o.status = 'prepared';
  _renderKitchenReqBody();
  // Brief pause so the "✓ Complete" state is visible before auto-closing.
  setTimeout(() => {
    document.getElementById('moreOv').classList.remove('visible');
    document.getElementById('ovBackdrop').classList.remove('visible');
    _kReqOpenOrder = null;
    refreshKitchenRequests();
  }, 700);
}

// ─────────────────────────────────────────────────────────────────────
// ORDER TAB — request stock from buying. Cart of ingredients with qty
// and note per line; submit creates a kitchenOrder PO via the existing
// /api/kitchen/submit endpoint.
// ─────────────────────────────────────────────────────────────────────
// Team activity moved into the search overlay — see doSearch() in this
// file. The Order tab now stays clean (cart only); duplicate-order risk
// surfaces at the moment of picking + via the inline ⚠ chip on cart lines.

function renderOrderTab() {
  const body = document.getElementById('body');
  body.classList.add('tappable');
  if (!_orderCart.length) {
    body.innerHTML = `
      <div class="empty">
        <div class="icon">🛒</div>
        <div class="hint">Empty · 暂无</div>
      </div>
      <button id="kOrderAddMore" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--bg);border:2px dashed var(--lime);color:var(--lime);font-weight:800;font-size:15px;padding:18px;margin-top:12px;cursor:pointer;border-radius:14px">
        <span style="font-size:22px;line-height:1">＋</span>
        <span>Add Item · 添加商品</span>
      </button>`;
    const emptyAdd = document.getElementById('kOrderAddMore');
    if (emptyAdd) emptyAdd.addEventListener('click', (e) => { e.stopPropagation(); openSearch(); });
  } else {
    body.innerHTML = _orderCart.map((entry, i) => renderOrderLine(entry, i)).join('') + `
      <button id="kOrderAddMore" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--bg);border:2px dashed var(--lime);color:var(--lime);font-weight:800;font-size:15px;padding:18px;margin-top:12px;cursor:pointer;border-radius:14px">
        <span style="font-size:22px;line-height:1">＋</span>
        <span>Add Item · 添加商品</span>
      </button>`;
    const addMoreBtn = document.getElementById('kOrderAddMore');
    if (addMoreBtn) addMoreBtn.addEventListener('click', (e) => { e.stopPropagation(); openSearch(); });
    // Wire qty buttons + remove + note inputs
    body.querySelectorAll('[data-act]').forEach(el => {
      el.addEventListener('click', () => {
        const i = +el.dataset.i;
        const a = el.dataset.act;
        if      (a === 'inc') changeOrderQty(i, 1);
        else if (a === 'dec') changeOrderQty(i, -1);
        else if (a === 'rm')  removeOrderLine(i);
      });
    });
    body.querySelectorAll('[data-qty]').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const i = +inp.dataset.qty;
        _orderCart[i].qty = parseFloat(inp.value) || 0;
        updateOrderFooter();
      });
    });
    body.querySelectorAll('[data-note]').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const i = +inp.dataset.note;
        _orderCart[i].note = inp.value;
      });
    });
  }
  // Footer: count + submit
  const foot = document.getElementById('foot');
  foot.innerHTML = `
    <div class="info">
      <span class="lbl">Cart · 购物车</span>
      <span class="val" id="orderCartCount">${_orderCart.length}</span>
    </div>
    <button class="submit-btn" id="orderSubmitBtn" ${_orderCart.length === 0 ? 'disabled' : ''}>
      ✓ Submit Order · 提交订单
    </button>`;
  document.getElementById('orderSubmitBtn').addEventListener('click', submitOrder);
  // Tap anywhere on the body's empty space → search overlay
  body.addEventListener('click', onBodyTap, { once: true });
}

// Replays after each render — body.addEventListener with once:true is reset
function onBodyTap(e) {
  if (_tab !== 'order') return;
  if (e.target.closest('.line') || e.target.closest('button') || e.target.closest('input')) {
    // re-attach for next tap
    document.getElementById('body').addEventListener('click', onBodyTap, { once: true });
    return;
  }
  openSearch();
}

function renderOrderLine(entry, i) {
  const ing = entry.ing;
  const unit = ing.buy_unit || ing.unit || '';
  const last = _lastQty[ing.id];
  let lastHTML = '';
  if (last?.last_date) {
    const days = Math.max(0, Math.round((Date.now() - new Date(last.last_date).getTime()) / 86400000));
    const cls = days <= 7 ? '' : days <= 30 ? 'warn' : 'cold';
    lastHTML = `<span class="last ${cls}">Last · 上次: ${last.qty}${esc(last.unit||unit||'')} · ${days===0?'today · 今天':days+'d ago · 天前'}</span>`;
  } else {
    lastHTML = `<span style="color:var(--muted);font-style:italic">No prior orders · 暂无历史</span>`;
  }
  // Already-in-flight warning. If this ingredient is in the team feed
  // (last 7 days, not yet "received"), show an amber chip with who and
  // when. Filter out the user's own past orders so the chip surfaces
  // *team* duplicates, which is what the user actually cares about.
  const teamHits = (_teamFeed.by_ingredient[ing.id] || [])
    .filter(h => !h.is_self)
    .filter(h => (h.status || '').toLowerCase() !== 'received');
  let warnHTML = '';
  if (teamHits.length) {
    const h = teamHits[0]; // most-recent
    const ago = _teamAgoBilingual(h.when);
    const more = teamHits.length > 1 ? ` (+${teamHits.length-1})` : '';
    warnHTML = `<div style="display:flex;align-items:center;gap:6px;background:rgba(224,123,80,.12);border:1px solid rgba(224,123,80,.35);color:#a04a25;font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;margin-top:4px">
      <span>⚠</span><span style="flex:1">Already ordered by · 已被 <strong>${esc(h.who)}</strong> 订购 · ${ago}${more}</span>
    </div>`;
  }
  return `<div class="line" data-line="${i}">
    <div class="top">
      <div class="info">
        <div class="name">${esc(ing.name_en || ing.name_cn || '—')}${ing.name_cn && ing.name_en ? ` <span class="cn">· ${esc(ing.name_cn)}</span>` : ''}</div>
        <div class="meta">
          ${ing.sku ? esc(ing.sku) + ' · ' : ''}${lastHTML}
        </div>
        ${warnHTML}
      </div>
      <button class="remove" data-act="rm" data-i="${i}">✕</button>
    </div>
    <div class="ctrl">
      <button class="qty-btn" data-act="dec" data-i="${i}">−</button>
      <input class="qty-input" type="number" min="0" step="0.01" value="${entry.qty}" data-qty="${i}" inputmode="decimal">
      <button class="qty-btn" data-act="inc" data-i="${i}">+</button>
      <span class="unit-pill">${esc(unit||'unit')}</span>
    </div>
    <input class="note-input" type="text" placeholder="Note for buying · 备注 (optional)" value="${esc(entry.note||'')}" data-note="${i}">
  </div>`;
}

function changeOrderQty(i, delta) {
  if (!_orderCart[i]) return;
  _orderCart[i].qty = Math.max(0, +(((_orderCart[i].qty || 0) + delta).toFixed(2)));
  if (_orderCart[i].qty === 0) {
    removeOrderLine(i);
  } else {
    renderOrderTab();
  }
}
function removeOrderLine(i) { _orderCart.splice(i, 1); renderOrderTab(); }
function updateOrderFooter() {
  const n = document.getElementById('orderCartCount');
  if (n) n.textContent = _orderCart.length;
  // Calm the FAB once items are present.
  const fab = document.getElementById('addFab');
  if (fab) fab.classList.toggle('has-items', _orderCart.length > 0);
}

function addToOrderCart(ing) {
  // If the ingredient is already in the cart, bump its qty by the
  // last-ordered amount (defaulting to 1) — mirrors the kitchen team's
  // "I want one more batch's worth" muscle memory.
  const existing = _orderCart.find(c => c.ing.id === ing.id);
  if (existing) {
    existing.qty += (_lastQty[ing.id]?.qty) || 1;
  } else {
    _orderCart.push({
      ing,
      qty: _lastQty[ing.id]?.qty || 1,
      note: '',
    });
  }
  renderOrderTab();
  pulseScan();
  beep('ok');
  // Scroll the Add Item button into view so it's always reachable, and
  // pop-animate the new line as we pass it.
  const idx = existing ? _orderCart.findIndex(c => c.ing.id === ing.id) : _orderCart.length - 1;
  setTimeout(() => {
    const el = document.querySelector(`[data-line="${idx}"]`);
    if (el) {
      el.classList.add('popped');
      setTimeout(() => el.classList.remove('popped'), 200);
    }
    const addBtn = document.getElementById('kOrderAddMore');
    if (addBtn) addBtn.scrollIntoView({ behavior: 'smooth', block: 'end' });
    else if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 30);
}

async function lookupAndAddByBarcode(code) {
  try {
    const r = await fetch('/api/products/by-barcode/' + encodeURIComponent(code));
    if (r.status === 404) {
      // The product lookup is barcode-on-product — for the kitchen we
      // also tolerate a SKU as the gun's input (most kitchen items have
      // SKU-style identifiers, not commercial barcodes).
      const ing = _ingredients.find(i => (i.sku || '').toLowerCase() === code.toLowerCase());
      if (ing) { addToOrderCart(ing); return; }
      toast('Not found · 未识别: ' + code, 'error');
      beep('error');
      return;
    }
    if (!r.ok) { toast('Lookup failed · 查询失败', 'error'); return; }
    const d = await r.json();
    // /api/products/by-barcode returns a product, not an ingredient. Try
    // to find the matching ingredient (same SKU). If not found, we can't
    // add it to a kitchen order (kitchen orders are ingredient-level).
    const sku = d?.data?.sku;
    if (sku) {
      const ing = _ingredients.find(i => (i.sku || '').toLowerCase() === sku.toLowerCase());
      if (ing) { addToOrderCart(ing); return; }
    }
    toast('Product found, no matching item · 找到产品但无对应物料', 'error');
  } catch { toast('Network error · 网络错误', 'error'); }
}

async function submitOrder() {
  if (!_orderCart.length) return;
  const btn = document.getElementById('orderSubmitBtn');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Saving… · 保存中…';
  try {
    const items = _orderCart.map(c => ({
      ingredient_id: c.ing.id,
      name_en:  c.ing.name_en || '',
      name_cn:  c.ing.name_cn || null,
      sku:      c.ing.sku || null,
      qty:      c.qty || 0,
      unit:     c.ing.buy_unit || c.ing.unit || null,
      cost_per_unit:    c.ing.buy_price || 0,
      expense_category: c.ing.expense_category || null,
      note:     c.note || null,
    }));
    const r = await fetch('/api/kitchen/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items }),
    });
    const d = await r.json();
    if (!d?.success) throw new Error(d.error || 'failed');
    toast('✓ ' + d.po_number + ' submitted · 已提交', 'success');
    beep('done');
    _orderCart = [];
    // refresh last-qty + team feed so the next session sees the new order
    // and other staff get the inflight warning chip immediately.
    fetch('/api/kitchen/last-qty').then(r => r.json()).then(d => { _lastQty = d.data || {}; });
    refreshTeamFeed().then(() => renderOrderTab());
    renderOrderTab();
  } catch (e) {
    toast('Save failed · 保存失败: ' + (e.message || ''), 'error');
    beep('error');
  } finally {
    btn.disabled = _orderCart.length === 0;
    btn.textContent = original;
  }
}

// ─────────────────────────────────────────────────────────────────────
// SEARCH overlay — ingredients (Order tab). Empty query shows recently-
// ordered items so the kitchen can re-add common stock with one tap.
// ─────────────────────────────────────────────────────────────────────
function openSearch() {
  document.getElementById('ovBackdrop').classList.add('visible');
  document.getElementById('searchOv').classList.add('visible');
  _ovKeyboardWatch(true);
  setTimeout(() => {
    const inp = document.getElementById('searchInput');
    inp.value = '';
    inp.focus();
    onSearchInput();
  }, 50);
}

let _searchTimer = null;
function onSearchInput() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (_searchTimer) clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => doSearch(q), 100);
}

// Bilingual time-ago — same format used by the cart chip below so the
// team-activity surfacing reads consistently in EN+CN.
function _teamAgoBilingual(iso) {
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60)   return mins + 'm ago · ' + mins + '分钟前';
  if (mins < 1440) { const h = Math.floor(mins/60); return h + 'h ago · ' + h + '小时前'; }
  const d = Math.floor(mins/1440); return d + 'd ago · ' + d + '天前';
}
function _teamStatusBilingual(s) {
  const k = (s || 'pending').toLowerCase();
  return ({
    pending:   'pending · 待处理',
    requested: 'requested · 已请求',
    ordered:   'ordered · 已下单',
    received:  'received · 已到货',
    cancelled: 'cancelled · 已取消',
  })[k] || (k + ' · ' + (s || ''));
}

function _teamPickRow(ing, hits) {
  // hits: [{po_number, who, when, status, qty, unit, is_self}, …]
  const top = hits[0];
  const ago = _teamAgoBilingual(top.when);
  const more = hits.length > 1 ? ` <span style="opacity:.7">+${hits.length-1}</span>` : '';
  const who  = top.is_self ? `<strong>you · 我</strong>` : `<strong>${esc(top.who)}</strong>`;
  const skuChip = ing.sku
    ? `<span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted);background:rgba(0,0,0,.05);padding:1px 6px;border-radius:5px;font-weight:700;margin-right:6px;display:inline-block;vertical-align:1px">${esc(ing.sku)}</span>`
    : '';
  return `<div class="search-row" data-id="${ing.id}" style="background:rgba(224,123,80,.06)">
    <div class="info">
      <div class="nm">${skuChip}${esc(ing.name_en || '—')}${ing.name_cn ? ` <span style="color:var(--muted);font-weight:500">· ${esc(ing.name_cn)}</span>` : ''}</div>
      <div class="mt" style="color:#a04a25">⚠ Already by · 已被 ${who} 订购 · ${ago}${more} · ${_teamStatusBilingual(top.status)}</div>
    </div>
    <div class="last" style="color:#a04a25">${top.qty} ${esc(top.unit||ing.buy_unit||'')}</div>
  </div>`;
}

function doSearch(q) {
  const list = document.getElementById('searchList');
  // Team activity — items already in flight (last 7 days, not yet received)
  // ordered by SOMEONE on the team. Render at the top so the user sees
  // duplicate risk exactly when picking. Filtered to the search query
  // when one is typed.
  const teamHitsBlock = (() => {
    const map = _teamFeed.by_ingredient || {};
    const ids = Object.keys(map).map(Number);
    if (!ids.length) return '';
    const teamRows = [];
    for (const id of ids) {
      const ing = _ingredients.find(i => i.id === id);
      if (!ing) continue;
      const hits = (map[id] || []).filter(h => (h.status || '').toLowerCase() !== 'received');
      if (!hits.length) continue;
      // Filter by query if user is typing.
      if (q) {
        const hay = ((ing.name_en||'') + ' ' + (ing.name_cn||'') + ' ' + (ing.sku||'')).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      teamRows.push({ ing, hits });
    }
    if (!teamRows.length) return '';
    // Most-recently ordered first
    teamRows.sort((a, b) => new Date(b.hits[0].when) - new Date(a.hits[0].when));
    const head = `<div style="font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a04a25;padding:4px 6px 8px">👥 Team activity · 团队最近订货 · 7d</div>`;
    return head + teamRows.slice(0, 8).map(x => _teamPickRow(x.ing, x.hits)).join('') +
      `<div style="height:1px;background:var(--border);margin:8px 0 6px"></div>`;
  })();

  let rows;
  let header = '';
  if (!q) {
    // Empty query → show "recently ordered" list, sorted by recency.
    // Falls back to alphabetical if no last-qty data is available.
    const withLast = _ingredients
      .map(ing => ({ ing, last: _lastQty[ing.id] }))
      .filter(x => x.last && x.last.last_date)
      .sort((a, b) => (b.last.last_date || '').localeCompare(a.last.last_date || ''));
    if (withLast.length > 0) {
      rows = withLast.slice(0, 30).map(x => x.ing);
      header = `<div style="font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 6px 8px">⏱ Recently Ordered · 近期订货</div>`;
    } else {
      rows = _ingredients.slice().sort((a, b) => (a.name_en || '').localeCompare(b.name_en || '')).slice(0, 30);
    }
  } else {
    rows = _ingredients.filter(i =>
      (i.name_en || '').toLowerCase().includes(q) ||
      (i.name_cn || '').includes(q) ||
      (i.sku || '').toLowerCase().includes(q)
    ).slice(0, 50);
  }
  if (!rows.length && !teamHitsBlock) {
    list.innerHTML = '<div class="search-empty">No matches · 无匹配</div>';
    return;
  }
  const inCartIds = new Set(_orderCart.map(c => c.ing.id));
  const mainBlock = rows.map(ing => {
    const last = _lastQty[ing.id];
    const lastTxt = last?.last_date
      ? `Last · 上次: ${last.qty} ${esc(last.unit || ing.buy_unit || '')}`
      : '';
    const skuChip = ing.sku
      ? `<span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted);background:rgba(0,0,0,.05);padding:1px 6px;border-radius:5px;font-weight:700;margin-right:6px;display:inline-block;vertical-align:1px">${esc(ing.sku)}</span>`
      : '';
    return `<div class="search-row${inCartIds.has(ing.id) ? ' in-cart' : ''}" data-id="${ing.id}">
      <div class="info">
        <div class="nm">${skuChip}${esc(ing.name_en || '—')}${ing.name_cn ? ` <span style="color:var(--muted);font-weight:500">· ${esc(ing.name_cn)}</span>` : ''}</div>
        ${ing.category ? `<div class="mt">${esc(ing.category)}</div>` : ''}
      </div>
      ${lastTxt ? `<div class="last">${lastTxt}</div>` : ''}
    </div>`;
  }).join('');
  list.innerHTML = teamHitsBlock + header + mainBlock;
  list.querySelectorAll('.search-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = +row.dataset.id;
      const ing = _ingredients.find(i => i.id === id);
      if (!ing) return;
      addToOrderCart(ing);
      closeAllOv();
    });
  });
}

// ─────────────────────────────────────────────────────────────────────
// PRODUCTION TAB — log batches made today
// ─────────────────────────────────────────────────────────────────────
function renderProductionTab() {
  const body = document.getElementById('body');
  body.classList.remove('tappable');
  const today = new Date().toISOString().slice(0, 10);
  // Recipe picker is a tappable button instead of a <select> — opens a
  // search overlay (name / SKU / 中文) so the kitchen team doesn't have
  // to scroll through 50+ options. Shows the picked recipe inline once
  // chosen, with a small ✕ to clear.
  const recipeBtnHTML = _pickedRecipe
    ? `<button id="prodRecipeBtn" type="button" style="width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;background:#fff;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer">
         <span style="font-size:18px">📖</span>
         <span style="flex:1;min-width:0">
           <div style="font-weight:700;color:var(--dk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(_pickedRecipe.name_en || '')}</div>
           ${_pickedRecipe.name_cn ? `<div style="font-size:12px;color:var(--muted);margin-top:1px">${esc(_pickedRecipe.name_cn)}</div>` : ''}
         </span>
         <span data-recipe-clear style="color:var(--muted);font-size:14px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg)">✕</span>
       </button>`
    : `<button id="prodRecipeBtn" type="button" style="width:100%;border:1.5px dashed var(--border);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;background:rgba(204,217,0,.06);color:var(--lime-text);font-weight:700;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer">
         <span style="font-size:18px">📖</span>
         <span style="flex:1">Pick recipe · 选择食谱…</span>
         <span style="color:var(--muted);font-size:14px">›</span>
       </button>`;
  body.innerHTML = `
    <div class="prod-form">
      ${recipeBtnHTML}
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px">Batches · 批数</div>
        <select id="prodBatchesSelect" onchange="_kBatchSelChange(this)" style="width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:16px;font-family:inherit;background:#fff">
          <option value="1" selected>1 batch · 1 批</option>
          <option value="2">2 batches · 2 批</option>
          <option value="3">3 batches · 3 批</option>
          <option value="4">4 batches · 4 批</option>
          <option value="5">5 batches · 5 批</option>
          <option value="custom">Other · 其它…</option>
        </select>
        <input id="prodBatches" type="number" min="0.01" step="0.5" value="1" placeholder="Enter batch count · 输入批次数" inputmode="decimal" style="display:none;width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:16px;font-family:inherit;background:#fff;margin-top:6px">
      </div>
      <input id="prodNotes" type="text" placeholder="Notes · 备注 (optional)" autocomplete="off">
    </div>
    <div style="font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 4px 8px">📅 Today · 今日 · ${today}</div>
    <div id="prodList">
      ${_todaysProduction.length === 0
        ? '<div style="text-align:center;color:var(--muted);font-size:13px;padding:20px">No batches logged yet · 暂无生产记录</div>'
        : _todaysProduction.map(b => `<div class="prod-batch">
            <div>
              <div class="b-name">${esc(b.recipe_name || '—')}</div>
              <div class="b-meta">${(b.created_at||'').slice(11,16)}${b.notes ? ' · ' + esc((b.notes||'').slice(0, 50)) : ''}</div>
            </div>
            <div class="b-amt">${b.batches_made}× <span style="font-weight:500;color:var(--muted);font-size:11px">${b.servings_made ? '· '+b.servings_made+' svg' : ''}</span></div>
          </div>`).join('')}
    </div>`;
  // Footer: log button
  const foot = document.getElementById('foot');
  foot.innerHTML = `
    <div class="info">
      <span class="lbl">Today · 今日批次</span>
      <span class="val">${_todaysProduction.reduce((s, b) => s + (+b.batches_made || 0), 0)}</span>
    </div>
    <button class="submit-btn" id="prodLogBtn">
      ✓ Log Batch · 记录批次
    </button>`;
  document.getElementById('prodLogBtn').addEventListener('click', logProductionBatch);
  // Recipe picker — open the overlay; if user taps the inner ✕ on a
  // chosen-recipe button, clear it instead of opening the picker.
  document.getElementById('prodRecipeBtn').addEventListener('click', (e) => {
    if (e.target.closest('[data-recipe-clear]')) {
      _pickedRecipe = null;
      renderProductionTab();
      return;
    }
    openRecipePicker();
  });
}

// Batches dropdown handler — picks 1–5 give an immediate value; "Other"
// reveals the custom number input below. The hidden #prodBatches input
// is always the source of truth (logProductionBatch reads it).
function _kBatchSelChange(sel) {
  const inp = document.getElementById('prodBatches');
  if (!inp) return;
  if (sel.value === 'custom') {
    inp.style.display = '';
    inp.value = '';
    setTimeout(() => inp.focus(), 30);
  } else {
    inp.style.display = 'none';
    inp.value = sel.value;
  }
}

// ─────────────────────────────────────────────────────────────────────
// RECIPE PICKER overlay — search recipes by name / SKU / 中文.
// Empty query shows alphabetical list. Same UX as the POS Top Sellers.
// ─────────────────────────────────────────────────────────────────────
function openRecipePicker() {
  document.getElementById('ovBackdrop').classList.add('visible');
  document.getElementById('recipeOv').classList.add('visible');
  _ovKeyboardWatch(true);
  setTimeout(() => {
    const inp = document.getElementById('recipeSearchInput');
    inp.value = '';
    inp.focus();
    doRecipeSearch('');
  }, 50);
}

let _recipeSearchTimer = null;
function onRecipeSearchInput() {
  const q = document.getElementById('recipeSearchInput').value.trim().toLowerCase();
  if (_recipeSearchTimer) clearTimeout(_recipeSearchTimer);
  _recipeSearchTimer = setTimeout(() => doRecipeSearch(q), 100);
}

function doRecipeSearch(q) {
  const list = document.getElementById('recipeSearchList');
  let rows;
  if (!q) {
    // Empty query → alphabetical list (capped) so the kitchen sees
    // their full catalog at a glance.
    rows = _recipes.slice().sort((a, b) =>
      (a.name_en || '').localeCompare(b.name_en || '')).slice(0, 50);
  } else {
    rows = _recipes.filter(r =>
      (r.name_en || '').toLowerCase().includes(q) ||
      (r.name_cn || '').includes(q) ||
      (r.sku || '').toLowerCase().includes(q)
    ).slice(0, 50);
  }
  if (!rows.length) {
    list.innerHTML = '<div class="search-empty">No matches · 无匹配</div>';
    return;
  }
  list.innerHTML = rows.map(r => `
    <div class="search-row" data-rid="${r.id}">
      <div class="info">
        <div class="nm">${esc(r.name_en || '—')}${r.name_cn ? ` <span style="color:var(--muted);font-weight:500">· ${esc(r.name_cn)}</span>` : ''}</div>
        <div class="mt">${r.sku ? esc(r.sku) + ' · ' : ''}${r.servings ? r.servings + ' servings' : ''}</div>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.search-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = +row.dataset.rid;
      const rec = _recipes.find(r => r.id === id);
      if (!rec) return;
      _pickedRecipe = rec;
      closeAllOv();
      renderProductionTab();
      // Focus the batches input next so the kitchen flow is single-handed.
      setTimeout(() => document.getElementById('prodBatches')?.focus(), 100);
    });
  });
}

async function refreshTodaysProduction() {
  // /api/production accepts ?period=today|7d|30d|all (no from/to range).
  // We filter to today client-side anyway since the page shows "Today"
  // and the endpoint may include other dates if `today` is loose.
  const today = new Date().toISOString().slice(0, 10);
  try {
    const r = await fetch('/api/production?period=today');
    const d = await r.json();
    _todaysProduction = (d.data || []).filter(b => (b.date || '').slice(0, 10) === today);
  } catch { _todaysProduction = []; }
}

async function logProductionBatch() {
  const batches = document.getElementById('prodBatches').value;
  const notes   = document.getElementById('prodNotes').value.trim();
  if (!_pickedRecipe) { toast('请选择食谱 · Pick a recipe', 'error'); return; }
  if (!batches || +batches <= 0) { toast('批数必填 · Batches required', 'error'); return; }
  const btn = document.getElementById('prodLogBtn');
  btn.disabled = true;
  try {
    const today = new Date().toISOString().slice(0, 10);
    const r = await fetch('/api/production', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: today,
        recipe_id: _pickedRecipe.id,
        batches_made: parseFloat(batches),
        staff_name: _user.displayName || _user.username || null,
        notes: notes || null,
      }),
    });
    const d = await r.json();
    if (!d?.success) throw new Error(d.error || 'failed');
    toast('✓ Logged · 已记录', 'success');
    beep('done');
    document.getElementById('prodBatches').value = '1';
    document.getElementById('prodNotes').value   = '';
    await refreshTodaysProduction();
    renderProductionTab();
  } catch (e) {
    toast('Failed · 失败: ' + (e.message || ''), 'error');
    beep('error');
  } finally {
    btn.disabled = false;
  }
}

// ─────────────────────────────────────────────────────────────────────
// More menu
// ─────────────────────────────────────────────────────────────────────
function openMore() {
  const initial = (_user.displayName || _user.username || '?').trim().charAt(0).toUpperCase();
  document.getElementById('moreBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;padding:4px 4px 18px">
      <div style="width:44px;height:44px;border-radius:50%;background:var(--dk);color:var(--lime);font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;text-transform:uppercase">${esc(initial)}</div>
      <div>
        <div style="font-weight:800">${esc(_user.displayName || _user.username || '')}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">@${esc(_user.username || '')} · ${esc(_user.role || '')}</div>
      </div>
    </div>
    <button class="submit-btn" id="logoutBtn" style="background:var(--danger);color:#fff;width:100%">⏻ Logout · 退出</button>`;
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/login';
  });
  document.getElementById('ovBackdrop').classList.add('visible');
  document.getElementById('moreOv').classList.add('visible');
}

// ─────────────────────────────────────────────────────────────────────
// Overlay plumbing (mirrors POS)
// ─────────────────────────────────────────────────────────────────────
function closeAllOv() {
  document.getElementById('ovBackdrop').classList.remove('visible');
  document.querySelectorAll('.ov').forEach(el => {
    el.classList.remove('visible');
    el.style.height = '';
  });
  _ovKeyboardWatch(false);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

function _ovKeyboardSync() {
  const vv = window.visualViewport;
  const ov = document.querySelector('.ov.visible');
  if (!ov || !vv) return;
  if (window.innerWidth >= 600) { ov.style.height = ''; return; }
  ov.style.height = Math.round(vv.height + vv.offsetTop) + 'px';
}
function _ovKeyboardWatch(on) {
  const vv = window.visualViewport;
  if (!vv) return;
  if (on) {
    vv.addEventListener('resize', _ovKeyboardSync);
    vv.addEventListener('scroll', _ovKeyboardSync);
    _ovKeyboardSync();
  } else {
    vv.removeEventListener('resize', _ovKeyboardSync);
    vv.removeEventListener('scroll', _ovKeyboardSync);
  }
}

// ─────────────────────────────────────────────────────────────────────
// Beep + toast + scan-pulse
// ─────────────────────────────────────────────────────────────────────
let _audioCtx = null;
function beep(kind) {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (kind === 'error') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 220;
      g.gain.setValueAtTime(0.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    } else if (kind === 'done') {
      [880, 1320].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        const t = ctx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        o.start(t); o.stop(t + 0.16);
      });
    } else {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 1100;
      g.gain.setValueAtTime(0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      o.start(); o.stop(ctx.currentTime + 0.1);
    }
  } catch {}
}
function pulseScan() {
  const el = document.getElementById('scanPulse');
  el.classList.remove('fire');
  void el.offsetWidth;
  el.classList.add('fire');
}
function toast(msg, type) {
  const w = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  w.appendChild(el);
  setTimeout(() => el.remove(), type === 'error' ? 3500 : 2200);
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
