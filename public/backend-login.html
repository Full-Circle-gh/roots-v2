<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>tacet · Sign in · 登录</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#FBF9F4" />
<link rel="icon" href="/tacet-favicon.svg" />

<!-- Theme + language boot — mirror the admin's stored choices before paint. -->
<script>
  (function(){ try {
    var t = localStorage.getItem('retail-admin-theme');
    document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'light');
    var l = localStorage.getItem('roots-admin-lang');
    document.documentElement.setAttribute('data-lang', (l === 'cn') ? 'cn' : 'en');
  } catch (e) { document.documentElement.setAttribute('data-theme','light'); } })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#111A2B; --paper:#FBF9F4; --graphite:#58606E;
    --dusk:#6E67AF; --dusk-hi:#5F58A0; --sage:#A3B49F; --amber:#C9954A; --brick:#B4533E;
    --cream:#F6F3EC; --border:#E4E0D5;
    --surface:#FFFFFF; --raised:var(--cream);
    --text:var(--ink); --text-2:var(--graphite); --text-4:#B0AEA6; --line:var(--border);
    --dusk-tint:#EEEDF6; --sage-tint:#EDF1EC; --brick-tint:#F6E7E3;
    --font:"Inter","Noto Sans SC",-apple-system,Arial,sans-serif;
    --display:"Fraunces",Georgia,serif;
    --ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 1px 2px rgba(17,26,43,.04),0 4px 16px rgba(17,26,43,.04);
  }
  [data-theme="dark"]{
    --surface:#18233A; --raised:#1E2A44; --border:#2A3550;
    --text:#FBF9F4; --text-2:#9AA3B2; --text-4:#5B6478; --line:#2A3550;
    --paper:#111A2B; --cream:#1E2A44;
    --dusk-tint:#262A4A; --sage-tint:#1E2C26; --brick-tint:#351B14;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--text);
    font-family:var(--font); font-size:15px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:40px 20px;
    transition:background .25s var(--ease), color .25s var(--ease);
  }
  html[data-lang=en] .cn{display:none;}
  html[data-lang=cn] .en{display:none;}

  /* ── the one quiet card ── */
  .card{
    position:relative; width:100%; max-width:400px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow);
    padding:40px 36px 34px;
    animation:settle .6s var(--ease) both;
  }
  @keyframes settle{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* corner tools: theme + language */
  .minitools{position:absolute; top:14px; right:14px; display:flex; gap:4px;}
  .minitools button{font:500 12px var(--font); background:transparent; color:var(--text-2); border:0;
    padding:6px 9px; border-radius:7px; cursor:pointer; line-height:0; transition:color .15s, background .15s;}
  .minitools button:hover{background:var(--raised); color:var(--text);}
  .minitools .langbtn{line-height:1;}
  .minitools svg{stroke:currentColor; fill:none; display:block;}

  /* brand — waveform settles, dusk dot breathes. Server-side co-brand swaps
     the .wave span for the tenant's logo and renames the wordmark. */
  .brand{display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:8px; text-align:center;}
  .wave{display:inline-flex; align-items:center; color:var(--text);}
  .wave svg path{stroke:currentColor;}
  .settleline{stroke-dasharray:120; stroke-dashoffset:120; animation:draw 1.1s var(--ease) .15s forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .dot-breathe{animation:breathe 2.4s var(--ease) infinite;}
  @keyframes breathe{0%,100%{opacity:1;} 50%{opacity:.45;}}
  .brandlogo{height:44px; width:auto; max-width:200px; border-radius:10px; display:block;}
  .wordmark{font-family:var(--display); font-weight:300; font-size:30px; letter-spacing:.16em; color:var(--text); line-height:1;}
  .wordmark.tenant{letter-spacing:.01em; font-size:26px;}
  .logincredit{text-align:center; font-size:10.5px; letter-spacing:.06em; color:var(--text-4); margin:4px 0 0;}
  .logincredit .w{font-family:var(--display); font-weight:300; letter-spacing:.16em; font-size:11px; color:var(--text-2);}
  .logincredit[hidden]{display:none;}
  .brandgap{height:18px;}

  h1{font-family:var(--display); font-weight:300; font-size:24px; text-align:center; margin:0 0 6px; color:var(--text);}
  .greet{font-size:13.5px; color:var(--text-2); text-align:center; margin:0 0 26px; line-height:1.5;}

  /* ── form ── */
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; font-weight:500; color:var(--text); margin-bottom:8px;}
  .inwrap{position:relative; display:flex; align-items:center;}
  input[type=text], input[type=password]{
    width:100%; font:400 15px var(--font); color:var(--text); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:12px 14px;
    transition:border-color .2s var(--ease); letter-spacing:.01em;
  }
  .inwrap input{padding-right:44px;}
  input::placeholder{color:var(--text-4);}
  input:hover{border-color:var(--text-2);}
  input:focus{outline:none; border-color:var(--dusk);}
  .reveal{position:absolute; right:6px; background:none; border:0; cursor:pointer; color:var(--text-4);
    padding:8px; border-radius:6px; display:flex; transition:color .15s;}
  .reveal:hover{color:var(--text-2);}
  .reveal:focus-visible{outline:2px solid var(--dusk); outline-offset:1px;}
  .reveal svg{stroke:currentColor; fill:none;}
  .capshint{display:none; font-size:12px; color:var(--text-2); margin-top:7px; align-items:center; gap:6px;}
  .capshint.show{display:flex;}
  .capshint svg{stroke:var(--amber); fill:none; flex:none;}

  .remember{display:flex; align-items:center; gap:9px; margin:2px 0 18px; cursor:pointer; user-select:none;
    font-size:13px; color:var(--text-2);}
  .remember input{width:16px; height:16px; accent-color:var(--dusk); cursor:pointer; margin:0;}

  .err{display:none; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--brick); line-height:1.5;
    background:var(--brick-tint); border:1px solid var(--brick); border-radius:8px; padding:11px 13px; margin-bottom:18px;}
  .err.show{display:flex;}
  .err::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; margin-top:5px; opacity:.7;}

  .submit{
    width:100%; border:none; cursor:pointer; background:var(--dusk); color:#fff;
    font:500 15px var(--font); padding:13px; border-radius:8px; position:relative;
    transition:background .2s var(--ease);
  }
  .submit:hover{background:var(--dusk-hi);}
  .submit:focus-visible{outline:2px solid var(--dusk); outline-offset:2px;}
  .submit:disabled{cursor:default; opacity:.75;}
  .submit.loading{color:transparent;}
  .submit.loading::after{
    content:""; position:absolute; top:50%; left:50%; width:16px; height:16px; margin:-8px 0 0 -8px;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── WeChat (coming soon) ── */
  .divider{display:flex; align-items:center; gap:12px; margin:22px 0 16px; color:var(--text-4);}
  .divider::before, .divider::after{content:""; height:1px; flex:1; background:var(--line);}
  .divider span{font-size:11.5px; letter-spacing:.06em;}
  .wechat{width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
    background:transparent; color:var(--text-2); border:1px solid var(--line); border-radius:8px;
    padding:11px; font:500 13.5px var(--font); cursor:not-allowed; opacity:.65;}
  .wechat svg{stroke:currentColor; fill:none; flex:none;}
  .wechat .soon{font-size:10px; letter-spacing:.06em; text-transform:uppercase; font-weight:500;
    color:var(--text-4); border:1px solid var(--line); border-radius:999px; padding:2px 8px; margin-left:2px;}

  .signfoot{margin-top:22px; text-align:center; font-size:12.5px; color:var(--text-2); line-height:1.5;}
  .signfoot a{color:var(--dusk); text-decoration:none; font-weight:500;}
  .signfoot a:hover{text-decoration:underline;}
  .signfoot a:focus-visible{outline:2px solid var(--dusk); outline-offset:2px; border-radius:3px;}

  .quiet{display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; color:var(--text-4); margin-top:24px;}
  .quiet .sdot{width:7px; height:7px; border-radius:50%; background:var(--sage); flex:none;}

  @media (max-width:420px){ .card{padding:34px 24px 28px;} }
</style>
</head>
<body>

  <main class="card">
    <div class="minitools">
      <button type="button" id="themeToggle" aria-label="Theme">
        <svg width="15" height="15" viewBox="0 0 20 20" id="themeIcon"><circle cx="10" cy="10" r="4" stroke-width="1.3"/><path d="M10 2v2M10 16v2M18 10h-2M4 10H2M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4M15.5 15.5l-1.4-1.4M5.9 5.9 4.5 4.5" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button type="button" id="langToggle" class="langbtn">中文</button>
    </div>

    <div class="brand">
      <span class="wave" aria-hidden="true">
        <svg width="64" height="36" viewBox="0 0 64 36" fill="none">
          <path class="settleline" d="M2 18c5 0 5-12 10-12s5 22 10 22 5-16 9-16 4 6 8 6h21" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="dot-breathe" cx="58" cy="10" r="2.6" fill="#6E67AF"/>
        </svg>
      </span>
      <span class="wordmark" data-no-i18n>tacet</span>
    </div>
    <!-- shown by the server only for a co-branded tenant whose credit is on -->
    <div class="logincredit" hidden>runs on <span class="w">tacet</span></div>
    <div class="brandgap"></div>

    <h1><span class="en">Welcome back</span><span class="cn">欢迎回来</span></h1>
    <p class="greet"><span class="en">Your channels kept running. Sign in to catch up.</span><span class="cn">渠道一直在运行。登录即可查看。</span></p>

    <form id="loginForm" novalidate>
      <div class="err" id="err" role="alert"><span></span></div>

      <div class="field">
        <label for="username"><span class="en">Username</span><span class="cn">用户名</span></label>
        <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" autocapitalize="none" autofocus />
      </div>

      <div class="field">
        <label for="password"><span class="en">Password</span><span class="cn">密码</span></label>
        <div class="inwrap">
          <input id="password" name="password" type="password" autocomplete="current-password" />
          <button type="button" class="reveal" id="revealBtn" aria-label="Show password" title="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="eye-open" d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/><circle class="eye-open" cx="12" cy="12" r="2.6"/><path class="eye-slash" d="M4 4l16 16" style="display:none"/></svg>
          </button>
        </div>
        <div class="capshint" id="capsHint" aria-live="polite">
          <svg width="13" height="13" viewBox="0 0 14 14"><path d="M7 1.8 12 8H9.5v4h-5V8H2L7 1.8Z" stroke-width="1.1" stroke-linejoin="round"/></svg>
          <span class="en">Caps Lock is on</span><span class="cn">大写锁定已开启</span>
        </div>
      </div>

      <label class="remember" for="remember">
        <input type="checkbox" id="remember" name="remember" />
        <span class="en">Keep me signed in for 30 days</span><span class="cn">30 天内保持登录</span>
      </label>

      <button type="submit" class="submit" id="submitBtn"><span class="en">Sign in</span><span class="cn">登录</span></button>
    </form>

    <div class="divider"><span><span class="en">or</span><span class="cn">或</span></span></div>
    <button type="button" class="wechat" id="wechatBtn" disabled aria-disabled="true">
      <svg width="17" height="17" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4C5.9 4 3 6.5 3 9.6c0 1.8 1 3.4 2.5 4.4L4.8 16l2.3-1.2c.5.2 1.1.3 1.7.3"/><path d="M21 14.5c0-2.6-2.4-4.7-5.3-4.7s-5.2 2.1-5.2 4.7 2.3 4.7 5.2 4.7c.7 0 1.4-.1 2-.3l2.1 1.1-.6-2c1.1-.9 1.8-2.1 1.8-3.5Z"/></svg>
      <span class="en">Sign in with WeChat</span><span class="cn">微信登录</span>
      <span class="soon"><span class="en">Soon</span><span class="cn">即将上线</span></span>
    </button>

    <p class="signfoot">
      <span class="en">Want your own store? <a href="/backend/signup">Request access →</a></span>
      <span class="cn">想开通自己的门店?<a href="/backend/signup">申请开通 →</a></span>
    </p>

    <div class="quiet"><span class="sdot"></span><span class="en">All systems quiet</span><span class="cn">一切安静如常</span></div>
  </main>

<script>
  /* Language + theme — both mirror the console's stored choices, so the pick
     made here carries through after sign-in. */
  (function () {
    var LANG_KEY = 'roots-admin-lang';
    var THEME_KEY = 'retail-admin-theme';
    var lang = document.documentElement.getAttribute('data-lang') === 'cn' ? 'cn' : 'en';

    function applyLang(l) {
      lang = l;
      window.__loginLang = l;
      document.documentElement.setAttribute('data-lang', l);
      document.documentElement.setAttribute('lang', l === 'cn' ? 'zh-CN' : 'en');
      var tgl = document.getElementById('langToggle');
      if (tgl) tgl.textContent = l === 'cn' ? 'EN' : '中文';
      var reveal = document.getElementById('revealBtn');
      var pw = document.getElementById('password');
      if (reveal) {
        var shown = pw && pw.type === 'text';
        var label = l === 'cn' ? (shown ? '隐藏密码' : '显示密码') : (shown ? 'Hide password' : 'Show password');
        reveal.setAttribute('aria-label', label);
        reveal.setAttribute('title', label);
      }
      try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    }
    window.__applyLoginLang = applyLang;
    applyLang(lang);
    document.getElementById('langToggle').addEventListener('click', function () { applyLang(lang === 'cn' ? 'en' : 'cn'); });

    function applyTheme() {
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#111A2B' : '#FBF9F4');
      var ico = document.getElementById('themeIcon');
      if (ico) ico.innerHTML = t === 'dark'
        ? '<path d="M16 11.5A6.5 6.5 0 1 1 8.5 4a5 5 0 0 0 7.5 7.5Z" stroke-width="1.3" stroke-linejoin="round"/>'
        : '<circle cx="10" cy="10" r="4" stroke-width="1.3"/><path d="M10 2v2M10 16v2M18 10h-2M4 10H2M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4M15.5 15.5l-1.4-1.4M5.9 5.9 4.5 4.5" stroke-width="1.3" stroke-linecap="round"/>';
    }
    document.getElementById('themeToggle').addEventListener('click', function () {
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
      applyTheme();
    });
    applyTheme();
  })();

  /* Auth handler — wired to the real Mini App Backend operator endpoints. */
  (function () {
    function L(en, cn) { return window.__loginLang === 'cn' ? cn : en; }
    // Already signed in as an operator? Skip straight to the console.
    fetch('/api/backend/me', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.user) location.replace('/retail-admin'); })
      .catch(function () {});

    var form = document.getElementById('loginForm');
    var err = document.getElementById('err');
    var errText = err.querySelector('span');
    var btn = document.getElementById('submitBtn');

    function showErr(msg) { errText.textContent = msg; err.classList.add('show'); }
    function clearErr() { err.classList.remove('show'); errText.textContent = ''; }
    function reset() { btn.disabled = false; btn.classList.remove('loading'); }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearErr();

      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value;
      var remember = document.getElementById('remember').checked;

      if (!u || !p) {
        showErr(L('Enter your username and password.', '请输入用户名和密码。'));
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');

      fetch('/api/backend/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ username: u, password: p, remember: remember })
      })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (j) {
          if (j && j.success) { window.location.href = '/retail-admin'; return; }
          showErr((j && j.error) || L('That username and password don’t match. Check them and try again.', '用户名与密码不匹配,请检查后重试。'));
          reset();
        })
        .catch(function () {
          showErr(L('Network error — please try again.', '网络错误，请重试。'));
          reset();
        });
    });

    // Password visibility toggle — eye gains a slash while the password is shown.
    var reveal = document.getElementById('revealBtn');
    var pw = document.getElementById('password');
    if (reveal && pw) {
      reveal.addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        Array.prototype.forEach.call(reveal.querySelectorAll('.eye-open'), function (el) { el.style.opacity = show ? '.35' : '1'; });
        var slash = reveal.querySelector('.eye-slash');
        if (slash) slash.style.display = show ? '' : 'none';
        var label = show ? L('Hide password', '隐藏密码') : L('Show password', '显示密码');
        reveal.setAttribute('aria-label', label);
        reveal.setAttribute('title', label);
        pw.focus();
      });
    }

    // Caps Lock hint — the quiet fix for most "wrong password" moments.
    var caps = document.getElementById('capsHint');
    if (caps && pw) {
      pw.addEventListener('keyup', function (e) {
        if (e.getModifierState) caps.classList.toggle('show', e.getModifierState('CapsLock'));
      });
      pw.addEventListener('blur', function () { caps.classList.remove('show'); });
    }
  })();
</script>
</body>
</html>
