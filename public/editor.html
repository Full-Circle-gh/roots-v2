<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" id="meta-theme-color" content="#12161A">
<title>Editor · tacet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
  // Apply theme before first paint (mirror of retail-admin.html / product-editor.html).
  (function () {
    try {
      var saved = localStorage.getItem('retail-admin-theme');
      var theme = saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#E8E5DC' : '#12161A');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    // UI scale (text size) — shared suite-wide preference. Applied to the shell
    // chrome only; each iframe applies its own zoom internally.
    try {
      var s = parseFloat(localStorage.getItem('roots-admin-ui-scale'));
      if (!(s === 1 || s === 1.1 || s === 1.25)) s = 1.1;
      document.documentElement.style.setProperty('--ui-zoom', String(s));
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg-app:#12161A; --bg-pane:#1A1F24; --bg-elev-1:#1F252B; --bg-elev-2:#262E35;
    --line-soft:rgba(232,229,220,.06); --line:rgba(232,229,220,.10); --line-strong:rgba(232,229,220,.16);
    --ring:rgba(107,142,111,.40);
    --text-1:#E8E5DC; --text-2:#AEABA2; --text-3:#7d7a72;
    --accent:#6B8E6F; --accent-hi:#7BA07F; --accent-ink:#12161A;
    --brass:#B08D4A; --brass-hi:#C29B54;
    --r-md:6px; --r-lg:10px;
    --f-sans:'IBM Plex Sans','IBM Plex Sans SC','PingFang SC','Hiragino Sans GB',system-ui,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Monaco,Consolas,monospace;
    --t-fast:120ms;
    --ui-zoom:1.1;
  }
  :root[data-theme="light"] {
    --bg-app:#E8E5DC; --bg-pane:#FFFFFF; --bg-elev-1:#F1EEE7; --bg-elev-2:#E3DFD5;
    --line-soft:rgba(18,22,26,.07); --line:rgba(18,22,26,.12); --line-strong:rgba(18,22,26,.20);
    --text-1:#12161A; --text-2:#43413a; --text-3:#6a675c;
    --accent:#6B8E6F; --accent-hi:#5E7E62;
    --brass:#B08D4A; --brass-hi:#9D7C3F;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font:13px var(--f-sans);
    background:var(--bg-app); color:var(--text-1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ── Top bar — slim chrome above both editors ── */
  #bar {
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    height:48px; padding:0 12px;
    background:var(--bg-pane);
    border-bottom:1px solid var(--line);
    zoom:var(--ui-zoom);
  }
  #bar .back {
    display:inline-flex; align-items:center; gap:6px;
    color:var(--text-2); text-decoration:none;
    font-size:13px; font-weight:500;
    padding:6px 10px; border-radius:var(--r-md);
    border:1px solid transparent;
    transition:background var(--t-fast) ease, color var(--t-fast) ease;
    white-space:nowrap;
  }
  #bar .back:hover { background:var(--bg-elev-1); color:var(--text-1); }
  #bar .back svg { width:15px; height:15px; }

  #bar .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }

  .tabs { display:flex; gap:4px; padding:3px; background:var(--bg-app); border:1px solid var(--line); border-radius:var(--r-lg); }
  .tab {
    display:inline-flex; align-items:center; gap:8px;
    font:500 13px var(--f-sans);
    color:var(--text-2);
    padding:7px 14px; border-radius:7px;
    border:1px solid transparent; background:transparent;
    cursor:pointer; user-select:none; white-space:nowrap;
    transition:background var(--t-fast) ease, color var(--t-fast) ease, border-color var(--t-fast) ease;
  }
  .tab:hover { color:var(--text-1); }
  .tab[aria-selected="true"] {
    background:var(--bg-pane); color:var(--text-1);
    border-color:var(--line-strong);
    box-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .tab svg { width:16px; height:16px; flex-shrink:0; opacity:.85; }
  .tab .cn { color:var(--text-3); font-weight:400; }
  .tab[aria-selected="true"] .cn { color:var(--text-2); }

  .spacer { flex:1 1 auto; }
  #bar .hint { color:var(--text-3); font-size:12px; font-family:var(--f-mono); white-space:nowrap; }

  /* ── Frames — fill the rest ── */
  #frames { flex:1 1 auto; position:relative; min-height:0; }
  #frames iframe {
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; background:var(--bg-app);
    display:none;
  }
  #frames iframe.active { display:block; }
</style>
</head>
<body>
  <div id="bar">
    <a class="back" href="/retail-admin" title="Back to Mini App Backend">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Backend
    </a>
    <div class="sep"></div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-pages" role="tab" aria-selected="true" onclick="showTab('pages')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="13" y2="10"/></svg>
        Mini App Editor <span class="cn">· 小程序编辑器</span>
      </button>
      <button class="tab" id="tab-products" role="tab" aria-selected="false" onclick="showTab('products')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        Product Page Editor <span class="cn">· 产品页编辑器</span>
      </button>
    </div>
    <div class="spacer"></div>
  </div>

  <div id="frames">
    <iframe id="frame-pages" title="Mini App Editor"></iframe>
    <iframe id="frame-products" title="Product Page Editor"></iframe>
  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var productId = params.get('id');
  // ?id= forces the Products tab; otherwise ?tab= picks; default Pages.
  var initial = productId ? 'products' : (params.get('tab') === 'products' ? 'products' : 'pages');

  var SRC = {
    pages: '/cms',
    products: '/product-editor' + (productId ? ('?id=' + encodeURIComponent(productId)) : ''),
  };
  var loaded = { pages: false, products: false };
  var current = null;

  var els = {
    pages:    { tab: document.getElementById('tab-pages'),    frame: document.getElementById('frame-pages') },
    products: { tab: document.getElementById('tab-products'), frame: document.getElementById('frame-products') },
  };

  function showTab(name) {
    if (!els[name]) return;
    current = name;
    Object.keys(els).forEach(function (k) {
      var sel = k === name;
      els[k].tab.setAttribute('aria-selected', sel ? 'true' : 'false');
      els[k].frame.classList.toggle('active', sel);
    });
    // Lazy-load the iframe the first time its tab is shown.
    if (!loaded[name]) { els[name].frame.src = SRC[name]; loaded[name] = true; }
    // Keep the URL shareable/refresh-stable without reloading the iframes.
    try {
      var q = name === 'products' ? '?tab=products' : '';
      history.replaceState(null, '', location.pathname + q);
    } catch (e) {}
    document.title = (name === 'products' ? 'Product Editor' : 'Mini App Editor') + ' · tacet';
  }
  window.showTab = showTab;

  showTab(initial);
})();
</script>
</body>
</html>
