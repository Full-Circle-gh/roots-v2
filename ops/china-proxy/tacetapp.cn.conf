# tacetapp.cn — the bare filed domain, on the CHINA server (Hangzhou,
# 121.199.6.217) as /etc/nginx/conf.d/tacetapp.cn.conf. Installed 2026-10-26.
# NOT DEPLOYED FROM THIS REPO; kept here so it is reviewed with its sibling,
# shop.tacetapp.cn.conf.
#
# WHAT IT DOES, FOR NOW: sends every visitor to the web storefront on
# shop.tacetapp.cn (Ash, 2026-10-26: "tacetapp.cn forwards to it"). WeChat's H5
# payment application requires the first-level domain, not only the shop
# subdomain, to open real business content; a forward to the shop does that.
#
# NOT YET ITS FINAL ROLE. §496 rule 1 gives the bare domain the old bare
# domain's job — the API, the payment callbacks, the mini-app — and that comes
# with the full move to this server (rule 5). When it does, this file is
# replaced, not edited around.
#
# 302, NOT 301: a browser caches a permanent redirect indefinitely, and this one
# is meant to be taken back.
#
# DNS: A record "@" -> 121.199.6.217 in the Alibaba Cloud DNS console.
# Certificate: Let's Encrypt by webroot through the port-80 block, renewed by
# the same /etc/cron.d/certbot-renew as shop.tacetapp.cn.

server {
    listen 80;
    server_name tacetapp.cn;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 302 https://shop.tacetapp.cn/; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tacetapp.cn;

    ssl_certificate     /etc/letsencrypt/live/tacetapp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tacetapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { return 302 https://shop.tacetapp.cn/; }
}
