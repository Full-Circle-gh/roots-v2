# shop.tacetapp.cn — the ICP-filed front door for the QR menu (§496 rule 4).
#
# NOT DEPLOYED FROM THIS REPO. Copy to the CHINA server as
# /etc/nginx/conf.d/shop.tacetapp.cn.conf. It is kept here so it is reviewed and
# versioned with the code it depends on.
#
# WHAT IT DOES. Customers reach shop.tacetapp.cn (filed, so WeChat accepts it as
# a payment directory). This server forwards ONLY what the menu needs to the
# existing app on the Hong Kong server. No data moves; orders, stock and
# payments are written exactly where they are today. A stepping stone, not the
# final setup — §496 rule 5 still moves the whole system later.
#
# WHAT IT EXPOSES, AND WHY ONLY THIS. The menu page loads only /s/ (page, images,
# order, pay) and /assets/ (fonts, brand art). Everything else answers 404 here,
# so putting the filed domain in front does not also put the back office, the
# API or the till on it.
#
# THREE THINGS THE APP READS, which is why they are set below and not omitted:
#   Host              the pay link is built from it (routes/shop-menu.js) and the
#                     tenant is looked up from it. Must stay shop.tacetapp.cn.
#   X-Forwarded-Proto the pay link takes its scheme from it. Must be https.
#   X-Forwarded-For   the app has `trust proxy` 1 and rate-limits by client
#                     address; without this every customer looks like one.
#                     Half the fix: the Hong Kong end must also trust this
#                     server's header (set_real_ip_from in
#                     ops/hk-origin/shop.tacetapp.cn.conf), or the app sees
#                     this server as the customer.
#
# BEFORE USING, replace the CHANGE_ME values and do the copies:
#   ssl_certificate*  the PUBLIC certificate issued for shop.tacetapp.cn on THIS
#                     server — the one customers' phones check.
#   the HK cert       copy ops/hk-origin/hk-origin-shop.tacetapp.cn.crt to
#                     /etc/nginx/ssl/ here. It is how this server knows it is
#                     talking to the real Hong Kong app (see the TLS note at the
#                     end). Public, safe to copy; the key never leaves Hong Kong.
#   the HK side       put THIS server's address into the two commented lines of
#                     /etc/nginx/sites-available/shop-tacetapp on Hong Kong,
#                     then `nginx -t && systemctl reload nginx` there.
#   the WeChat file   WeChat gives you a MP_verify_xxxx.txt when you set the
#                     Official Account's web-authorization domain; drop it in
#                     /var/www/wechat-verify/ (nothing to edit here).

upstream roots_hk {
    server 47.239.89.63:443;            # the Hong Kong server
    keepalive 16;
}

server {
    listen 80;
    server_name shop.tacetapp.cn;

    # Certificate issuance/renewal answers here.
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name shop.tacetapp.cn;

    ssl_certificate     /etc/nginx/ssl/shop.tacetapp.cn.pem;   # CHANGE_ME
    ssl_certificate_key /etc/nginx/ssl/shop.tacetapp.cn.key;   # CHANGE_ME
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;           # the menu posts small JSON; the app caps it lower

    # WeChat's domain-ownership file, served from here, never forwarded.
    location ~ "^/MP_verify_[A-Za-z0-9]+\.txt$" {
        root /var/www/wechat-verify;
        default_type text/plain;
    }

    location ^~ /s/      { include /etc/nginx/snippets/roots-hk-proxy.conf; }
    location ^~ /assets/ { include /etc/nginx/snippets/roots-hk-proxy.conf; }

    location / { return 404; }
}

# ── /etc/nginx/snippets/roots-hk-proxy.conf ─────────────────────────────────
# Put these lines in that file (shared by the two locations above):
#
#   proxy_pass https://roots_hk;
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto https;
#   proxy_ssl_server_name on;
#   proxy_ssl_name        shop.tacetapp.cn;
#   proxy_ssl_verify      on;
#   proxy_ssl_trusted_certificate /etc/nginx/ssl/hk-origin-shop.tacetapp.cn.crt;
#   proxy_connect_timeout 5s;
#   proxy_read_timeout    30s;
#
# TLS between the two servers. nginx does NOT check the far end's certificate
# unless told to (proxy_ssl_verify is off by default), so without the two
# verify lines above anything answering on the Hong Kong address would be
# trusted with customers' orders. With them, this server accepts exactly one
# certificate: the private one made on the Hong Kong server for this purpose
# (ops/hk-origin/shop.tacetapp.cn.conf has how and when; it expires 2036-10-21).
# No public authority can issue a certificate this server would accept instead.
#
# The Hong Kong end has been answering for shop.tacetapp.cn since 2026-10-24,
# serving /s/ and /assets/ only. Before pointing DNS here, check from THIS
# server (expect 200; a certificate error means the copy above is missing):
#   curl -sS --resolve shop.tacetapp.cn:443:47.239.89.63 \
#     --cacert /etc/nginx/ssl/hk-origin-shop.tacetapp.cn.crt \
#     https://shop.tacetapp.cn/s/<code> -o /dev/null -w '%{http_code}\n'
