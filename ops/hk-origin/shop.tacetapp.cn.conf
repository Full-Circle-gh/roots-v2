# shop.tacetapp.cn on the HONG KONG server — the far end of the China pass-through
# (§496 rule 7). Pairs with ops/china-proxy/shop.tacetapp.cn.conf.
#
# NOT DEPLOYED FROM THIS REPO. Lives on the Hong Kong server as
# /etc/nginx/sites-available/shop-tacetapp, linked from sites-enabled/. Installed
# 2026-10-24. Kept here so it is reviewed and versioned with the China half.
#
# WHO TALKS TO THIS. Only the China server. Customers never reach Hong Kong under
# this name: public DNS for shop.tacetapp.cn points at China, and China forwards
# /s/ and /assets/ here. So the certificate below is PRIVATE — made on this box,
# trusted by nobody but the China server, which is told to accept exactly this
# certificate and nothing else (proxy_ssl_verify in the China file). No DNS check,
# no 90-day renewal to forget. Expires 2036-10-21.
#
#   key   /etc/nginx/ssl/hk-origin-shop.tacetapp.cn.key   (root only, never copied)
#   cert  /etc/nginx/ssl/hk-origin-shop.tacetapp.cn.crt   (public; copy to China)
#   sha256 63:0F:DB:B7:97:64:56:00:A2:9E:45:22:D8:89:F9:43:A6:02:47:69:D4:C1:F7:45:2A:D8:6D:CD:58:BB:9B:7A
#
# Made with:
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
#     -days 3650 -subj "/CN=shop.tacetapp.cn" \
#     -addext "subjectAltName=DNS:shop.tacetapp.cn" \
#     -addext "basicConstraints=critical,CA:FALSE" -addext "extendedKeyUsage=serverAuth" \
#     -keyout hk-origin-shop.tacetapp.cn.key -out hk-origin-shop.tacetapp.cn.crt
# Replacing it means copying the new .crt to the China server in the same sitting,
# or the menu stops loading.
#
# ONLY THE MENU. Same two paths China forwards; everything else is 404, so anyone
# who points this name at the Hong Kong address by hand gets no more than China
# would give them.
#
# THE CHINA SERVER'S ADDRESS, 121.199.6.217 (Hangzhou), appears twice below.
# A new China server means changing both, here on Hong Kong.
#
#   1. set_real_ip_from — the app has `trust proxy` 1 (server.js) and takes the
#      customer's address from the LAST hop. With China in front, the last hop is
#      China, so every customer would look like one address to the rate limiter.
#      Trusting China's X-Forwarded-For here makes $remote_addr the customer
#      again, and X-Forwarded-For below then carries the customer, not China.
#      Trusted from China ONLY: from anywhere else the header is ignored, so it
#      cannot be forged by connecting here directly.
#   2. the `if` on $realip_remote_addr — closes this name to everyone but China.
#      NOT allow/deny: realip runs first, so allow/deny would test the CUSTOMER's
#      address and refuse every customer. Measured 2026-10-24: allow/deny gave
#      403 through the chain; the `if` gives 200 through it and 403 direct,
#      forged X-Forwarded-For or not.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.tacetapp.cn;

    ssl_certificate     /etc/nginx/ssl/hk-origin-shop.tacetapp.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/hk-origin-shop.tacetapp.cn.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from 121.199.6.217;
    real_ip_header   X-Forwarded-For;
    # Only the China server may connect. Checked on the CONNECTION address:
    # realip above has already swapped $remote_addr for the customer, so an
    # allow/deny list here would test the customer and refuse every one.
    if ($realip_remote_addr != "121.199.6.217") { return 403; }

    client_max_body_size 1m;

    # Same upstream-down page as the main vhost (sites-available/roots-v2, which
    # carries the reasoning for `=503`).
    error_page 502 503 504 =503 @unavailable;

    location @unavailable {
        default_type application/json;
        if ($request_uri ~ ^/api/) {
            return 503 '{"error":"service_unavailable","retry":true}';
        }
        root /var/www/html;
        try_files /maintenance.html =503;
    }

    location ^~ /s/      { include /etc/nginx/snippets/roots-app-proxy.conf; }
    location ^~ /assets/ { include /etc/nginx/snippets/roots-app-proxy.conf; }

    location / { return 404; }
}

# ── /etc/nginx/snippets/roots-app-proxy.conf ────────────────────────────────
# Installed alongside this file. The main vhost's `location /` settings, minus
# the WebSocket upgrade (the menu opens none):
#
#   proxy_pass http://127.0.0.1:4000;
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_buffering off;
#   proxy_read_timeout 300s;
