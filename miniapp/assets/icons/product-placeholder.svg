<?xml version="1.0" encoding="UTF-8"?>
<!-- Minimalist jar placeholder for products without an uploaded image.
     Matches the line-art weight + olive-grey colour of the tab-bar icons
     (home.png, shop.png, cart.png, me.png) so empty product cards read as
     "intentionally minimal" rather than "broken image". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none"
     stroke="#A8A39A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Lid -->
  <rect x="16" y="8" width="32" height="9" rx="2"/>
  <!-- Jar body -->
  <path d="M18 17 L18 68 a4 4 0 0 0 4 4 h20 a4 4 0 0 0 4 -4 L46 17"/>
  <!-- Label band (two faint dashed lines) -->
  <line x1="20" y1="32" x2="44" y2="32" stroke-dasharray="2 3" opacity="0.55"/>
  <line x1="20" y1="56" x2="44" y2="56" stroke-dasharray="2 3" opacity="0.55"/>
</svg>
